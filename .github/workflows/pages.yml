# Test, build and publish the course to GitHub Pages.
#
# Pull requests run the full test job but do not deploy. Pushes to master test, build and deploy:
# a red test job means nothing is published.
#
# The site is a project Pages site (https://<user>.github.io/<repo>/), so the deploy build is told
# its path prefix: actions/configure-pages reports it and astro.config.mjs reads it from BASE_PATH.
# The test job builds at "/" instead, because the end-to-end suite addresses pages from the root.

name: Publish site

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than publishing a half-uploaded site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - name: Physics and unit tests
        run: npx vitest run
      - name: Content lint
        run: npm run lint:content
      - name: Type check
        run: npx astro check
      # fails on any KaTeX error and any content-schema violation
      - name: Build (root base, for the end-to-end suite)
        run: npx astro build

      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npx astro build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
