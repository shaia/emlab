lesson: '6.2'
practice:
  - id: W-6.2-01
    level: basic
    qualitative: false
    objectives: [OBJ-6.2-1]
    prompt: >-
      לפונקציה $f(x) = 8 - x^2$ בקטע $[0, 2]$:

      א. חשבו את סכום רימן השמאלי ואת הימני, עם $N = 4$ חתיכות.

      ב. מה סכום הטרפזים, עם אותן 4 חתיכות?

      ג. השטח המדויק הוא $40/3$. איזה מהשלושה הכי קרוב, ולמה השמאלי גדול מהשטח?
    answer: >-
      א. השמאלי $14.25$, הימני $12.25$.

      ב. $13.25$.

      ג. הטרפז (שגיאה $0.08$). הפונקציה יורדת, ולכן בכלל השמאלי כל מלבן בולט מעל הגרף.
    solution:
      - kind: given
        text: >-
          $a = 0$, $b = 2$, $N = 4$, ולכן $\Delta x = 0.5$. הגבהים בקצוות: $f(0) = 8$, $f(0.5) = 7.75$, $f(1) = 7$, $f(1.5) = 5.75$, $f(2) = 4$.
      - kind: law
        text: >-
          סכום רימן: $\sum f(x_i)\,\Delta x$. השמאלי לוקח את ארבעת הקצוות הראשונים, הימני את ארבעת האחרונים, והטרפז הוא הממוצע של שניהם.
      - kind: substitution
        text: >-
          א. שמאלי: $0.5\,(8 + 7.75 + 7 + 5.75) = 14.25$. ימני: $0.5\,(7.75 + 7 + 5.75 + 4) = 12.25$.

          ב. טרפז: $(14.25 + 12.25)/2 = 13.25$.
      - kind: reasoning
        text: >-
          ג. $40/3 \approx 13.33$. הפונקציה יורדת בקטע, ולכן הגובה בקצה השמאלי של כל חתיכה הוא הגבוה בה, וכל מלבן שמאלי בולט מעל הגרף; הימני להפך.
      - kind: limit
        text: >-
          השטח המדויק חייב להיות בין השמאלי לימני, והוא אכן שם: $12.25 < 13.33 < 14.25$. כש-N גדל, שני הסכומים מתקרבים זה לזה ואל $40/3$.
      - kind: result
        text: >-
          א. $14.25$ ו-$12.25$. ב. $13.25$. ג. הטרפז הכי קרוב; השמאלי גדול כי הפונקציה יורדת.

  - id: W-6.2-02
    level: basic
    qualitative: true
    objectives: [OBJ-6.2-2]
    prompt: >-
      זורקים כדור ישר למעלה במהירות $20$ מטר לשנייה. מהירותו (חיובית כלפי מעלה) היא $v(t) = 20 - 10t$, עד שהוא חוזר ליד אחרי $4$ שניות. קבעו ונמקו בעזרת הגרף של $v(t)$, בלי פונקציה קדומה:

      א. מה הגובה המקסימלי של הכדור מעל היד?

      ב. מה ההעתק של הכדור ב-$4$ השניות? מה הדרך שעבר?
    answer: >-
      א. $20\,\text{m}$.

      ב. ההעתק אפס; הדרך $40\,\text{m}$.
    solution:
      - kind: given
        text: >-
          $v(t) = 20 - 10t$ מ-$t = 0$ עד $t = 4\,\text{s}$. הגרף ישר, ומתאפס ב-$t = 2\,\text{s}$, בשיא.
      - kind: law
        text: >-
          ההעתק הוא השטח המסומן מתחת לגרף המהירות, $\Delta y = \int v\,dt$; הדרך היא השטח בלי סימנים.
      - kind: reasoning
        text: >-
          א. עד $t = 2\,\text{s}$ הכדור עולה, והגרף מעל הציר: משולש שבסיסו $2\,\text{s}$ וגובהו $20$ מטר לשנייה. שטחו $\tfrac12\cdot2\cdot20 = 20\,\text{m}$, וזה הגובה בשיא.
      - kind: reasoning
        text: >-
          ב. מ-$2$ עד $4\,\text{s}$ הגרף מתחת לציר: משולש שווה, שנספר במינוס (הכדור יורד $20\,\text{m}$). ההעתק $20 - 20 = 0$, והדרך $20 + 20 = 40\,\text{m}$.
      - kind: limit
        text: >-
          הכדור חוזר ליד, ולכן ההעתק חייב להיות אפס, וזה מה שהשטח המסומן נותן. ובמכניקה: הגובה המקסימלי הוא $v_0^2/(2g) = 400/20 = 20\,\text{m}$, אותה תשובה.
      - kind: units
        text: >-
          $\tfrac{\text{m}}{\text{s}}\cdot\text{s} = \text{m}$.
      - kind: result
        text: >-
          א. $20\,\text{m}$. ב. ההעתק $0$, הדרך $40\,\text{m}$.

  - id: W-6.2-03
    level: basic
    qualitative: false
    objectives: [OBJ-6.2-3]
    prompt: >-
      א. מצאו פונקציה קדומה לכל אחת מהפונקציות: $5x^4$; $\;2 - 3x^2$; $\;\sin x + \cos x$. בדקו כל אחת בגזירה.

      ב. חשבו את $\int_0^1 5x^4\,dx$.
    answer: >-
      א. $x^5 + C$; $\;2x - x^3 + C$; $\;-\cos x + \sin x + C$.

      ב. $1$.
    solution:
      - kind: law
        text: >-
          $\int x^n\,dx = \dfrac{x^{n+1}}{n+1} + C$ ($n \ne -1$), $\int \cos x\,dx = \sin x + C$, $\int \sin x\,dx = -\cos x + C$; איבר-איבר, וקבוע שכופל נשאר בחוץ.
      - kind: manipulation
        text: >-
          א. $5\cdot\dfrac{x^5}{5} = x^5$. אחר כך $2 \to 2x$ ו-$3x^2 \to 3\cdot\dfrac{x^3}{3} = x^3$, ולכן $2x - x^3$. ולבסוף $\sin x \to -\cos x$ ו-$\cos x \to \sin x$.
      - kind: reasoning
        text: >-
          בדיקה: $(x^5)' = 5x^4$, $\;(2x - x^3)' = 2 - 3x^2$, $\;(-\cos x + \sin x)' = \sin x + \cos x$.
      - kind: substitution
        text: >-
          ב. $\big[x^5\big]_0^1 = 1 - 0 = 1$.
      - kind: limit
        text: >-
          בקטע ברוחב אפס, $\int_0^0$, מתקבל $0 - 0 = 0$. והתשובה סבירה: $5x^4$ מתחת ל-$5$ בכל הקטע, ולכן השטח קטן מהמלבן $5\cdot1$.
      - kind: result
        text: >-
          א. $x^5 + C$, $\;2x - x^3 + C$, $\;\sin x - \cos x + C$. ב. $1$.

  - id: W-6.2-04
    level: mid
    qualitative: false
    objectives: [OBJ-6.2-1]
    prompt: >-
      את השטח מתחת ל-$f(x) = x^2$ בקטע $[0, 3]$ (המדויק: $9$) מעריכים בסכום רימן. השגיאה של הכלל השמאלי עם $N$ חתיכות היא $\dfrac{13.5}{N} - \dfrac{4.5}{N^2}$, ושל נקודת האמצע $\dfrac{2.25}{N^2}$.

      א. מה ה-N הקטן ביותר שבו השגיאה של הכלל השמאלי קטנה מ-$0.1$?

      ב. ומה ה-N הקטן ביותר בנקודת האמצע?

      ג. פי כמה קטנה כל שגיאה כשמכפילים את N, כש-N גדול?
    answer: >-
      א. $N = 135$.

      ב. $N = 5$.

      ג. השמאלית פי 2 בערך, של נקודת האמצע פי 4.
    solution:
      - kind: given
        text: >-
          שגיאה שמאלית $13.5/N - 4.5/N^2$, שגיאת אמצע $2.25/N^2$, והסף $0.1$.
      - kind: manipulation
        text: >-
          א. כש-N גדול האיבר $4.5/N^2$ קטן מאוד, ולכן בערך $13.5/N < 0.1$, כלומר $N > 135$. בדיקה מדויקת: ב-$N = 134$ השגיאה $0.1005$, וב-$N = 135$ היא $0.0998$.
      - kind: manipulation
        text: >-
          ב. $2.25/N^2 < 0.1$ פירושו $N^2 > 22.5$. מכפילים את שני האגפים ב-$N^2$ ומחלקים ב-$0.1$, ואז מוציאים שורש: $N > 4.74$. בדיקה: ב-$N = 4$ השגיאה $0.14$, וב-$N = 5$ היא $0.09$.
      - kind: reasoning
        text: >-
          ג. כש-N גדול, השגיאה השמאלית היא בערך $13.5/N$: הכפלת N מחלקת אותה ב-2. שגיאת האמצע היא $2.25/N^2$: הכפלת N מחלקת את $N^2$ ב-4.
      - kind: limit
        text: >-
          כש-$N \to \infty$ שתי השגיאות שואפות לאפס, כמו שצריך: הגבול של הסכום הוא האינטגרל. וב-$N = 1$ השגיאה השמאלית $13.5 - 4.5 = 9$, כל השטח: המלבן השמאלי היחיד בגובה $f(0) = 0$.
      - kind: result
        text: >-
          א. $135$. ב. $5$. ג. פי 2 ופי 4.

  - id: W-6.2-05
    level: mid
    qualitative: true
    objectives: [OBJ-6.2-2]
    prompt: >-
      לכל אחד מהגרפים, קבעו מה מודד השטח מתחת לגרף, ובאילו יחידות:

      א. ההספק $P$ של מנוע (בוואט) כתלות בזמן (בשניות).

      ב. הכוח $F$ שמחבט מפעיל על כדור (בניוטון) כתלות בזמן (בשניות).

      ג. השדה החשמלי $E$ (בניוטון לקולון, כלומר וולט למטר) לאורך קו שדה, כתלות במקום (במטרים).
    answer: >-
      א. האנרגיה (העבודה) שהמנוע נתן, בג׳ול.

      ב. המתקף, שינוי התנע של הכדור, ב-$\text{N}\cdot\text{s}$.

      ג. הפרש הפוטנציאלים בין שתי הנקודות (המתח), בוולט.
    solution:
      - kind: law
        text: >-
          כל רצועה היא גובה כפול רוחב, ולכן השטח הוא מכפלת הגודל שבציר האנכי בגודל שבציר האופקי, ויחידותיו מכפלת היחידות.
      - kind: reasoning
        text: >-
          א. הספק הוא אנרגיה ליחידת זמן; בפרק זמן קצר $\Delta t$ המנוע נותן $P\,\Delta t$. השטח הוא האנרגיה, $\text{W}\cdot\text{s} = \text{J}$.
      - kind: reasoning
        text: >-
          ב. $F\,\Delta t$ הוא המתקף בפרק זמן קצר, והוא שווה לשינוי התנע (מכניקה). השטח הוא שינוי התנע הכולל, ב-$\text{N}\cdot\text{s} = \text{kg}\cdot\text{m}/\text{s}$.
      - kind: reasoning
        text: >-
          ג. בשיעור 2.3 ראיתם שבשדה אחיד $\Delta V = E\,d$ (בירידה לאורך השדה). לשדה משתנה מחברים רצועות $E\,\Delta x$, והשטח הוא הפרש הפוטנציאלים $V_A - V_B$. היחידות: $\tfrac{\text{V}}{\text{m}}\cdot\text{m} = \text{V}$.
      - kind: limit
        text: >-
          כשהגודל קבוע, השטח הוא מלבן ונותן את הנוסחאות המוכרות: $E = Pt$, $\Delta p = Ft$, $\Delta V = Ed$.
      - kind: result
        text: >-
          א. אנרגיה, בג׳ול. ב. מתקף (שינוי תנע), ב-$\text{N}\cdot\text{s}$. ג. מתח, בוולט.

  - id: W-6.2-06
    level: mid
    qualitative: false
    objectives: [OBJ-6.2-3, OBJ-6.2-2]
    prompt: >-
      חשבו בעזרת המשפט היסודי, והסבירו כל תוצאה בעזרת הגרף:

      א. $\int_0^{\pi} \sin x\,dx$

      ב. $\int_0^{2\pi} \sin x\,dx$

      ג. $\int_{\pi/2}^{\pi} \cos x\,dx$
    answer: >-
      א. $2$.

      ב. $0$.

      ג. $-1$.
    solution:
      - kind: law
        text: >-
          $\int_a^b f\,dx = F(b) - F(a)$, עם $F = -\cos x$ ל-$\sin x$ ו-$F = \sin x$ ל-$\cos x$.
      - kind: substitution
        text: >-
          א. $-\cos\pi + \cos 0 = 1 + 1 = 2$: חצי גל מעל הציר.

          ב. $-\cos 2\pi + \cos 0 = -1 + 1 = 0$: חצי הגל השני מתחת לציר, ושטחו (המסומן) מבטל את הראשון.

          ג. $\sin\pi - \sin\frac{\pi}{2} = 0 - 1 = -1$: בקטע הזה $\cos x$ שלילי, כל הגרף מתחת לציר.
      - kind: limit
        text: >-
          בדיקה בסימטריה: גל שלם של $\sin$ חייב לתת אפס, כי החלק שמעל הציר והחלק שמתחתיו זהים. ובסעיף (א) השטח $2$ סביר: הוא בין המשולש $\tfrac12\cdot\pi\cdot1 \approx 1.57$ למלבן $\pi\cdot1 \approx 3.14$.
      - kind: result
        text: >-
          א. $2$. ב. $0$. ג. $-1$.

  - id: W-6.2-07
    level: mid
    qualitative: false
    objectives: [OBJ-6.2-2, OBJ-6.2-3]
    prompt: >-
      כשסוגרים מעגל מסוים, הזרם בו גדל באחידות: $i(t) = 0.5\,t$ (באמפר, $t$ בשניות).

      א. כמה מטען עבר בתיל ב-$4$ השניות הראשונות?

      ב. כמה אלקטרונים זה?
    answer: >-
      א. $4\,\text{C}$.

      ב. $2.5\cdot10^{19}$ אלקטרונים.
    solution:
      - kind: given
        text: >-
          $i(t) = 0.5\,t$, מ-$0$ עד $4\,\text{s}$; $e = 1.6\cdot10^{-19}\,\text{C}$.
      - kind: law
        text: >-
          המטען שעבר הוא השטח מתחת לגרף הזרם, $q = \int_0^T i\,dt$.
      - kind: manipulation
        text: >-
          הפונקציה הקדומה של $0.5\,t$ היא $0.25\,t^2$, ולכן $q = 0.25\,T^2$.
      - kind: limit
        text: >-
          ב-$T = 0$ לא עבר מטען. ובדיקה בגאומטריה: השטח הוא משולש, $\tfrac12\cdot T\cdot(0.5\,T) = 0.25\,T^2$, אותה תשובה.
      - kind: units
        text: >-
          המקדם $0.5$ הוא באמפר לשנייה, ולכן $0.25\,T^2$ הוא $\tfrac{\text{A}}{\text{s}}\cdot\text{s}^2 = \text{A}\cdot\text{s} = \text{C}$.
      - kind: substitution
        text: >-
          א. $q = 0.25\cdot4^2 = 4\,\text{C}$. ב. $N = q/e = 4/(1.6\cdot10^{-19}) = 2.5\cdot10^{19}$.
      - kind: result
        text: >-
          א. $4\,\text{C}$. ב. $2.5\cdot10^{19}$ אלקטרונים.

  - id: W-6.2-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-6.2-2, OBJ-6.2-3]
    prompt: >-
      מטען של $3\,\mu\text{C}$ מקובע במקומו. דוחפים לאט מטען של $1\,\mu\text{C}$ לכיוונו, מ-$0.6\,\text{m}$ עד $0.2\,\text{m}$.

      א. מצאו ביטוי לעבודה שהיד עושה, וחשבו אותה.

      ב. אילו התחילו מרחוק מאוד, כמה עבודה הייתה דרושה?

      ג. הכוח החשמלי ב-$0.2\,\text{m}$ הוא $0.675\,\text{N}$. למה "הכוח הגדול ביותר כפול הדרך", $0.675\cdot0.4 = 0.27\,\text{J}$, לא נכון כאן?
    answer: >-
      א. $W = kq_1q_2\left(\dfrac{1}{0.2} - \dfrac{1}{0.6}\right) = 0.09\,\text{J}$.

      ב. $0.135\,\text{J}$.

      ג. הכוח קטן מ-$0.675\,\text{N}$ בכל הדרך פרט לסוף (ב-$0.6\,\text{m}$ הוא רק $0.075\,\text{N}$). המלבן הזה מעריך פי 3 בערך.
    solution:
      - kind: given
        text: >-
          $q_1 = 3\cdot10^{-6}\,\text{C}$, $q_2 = 1\cdot10^{-6}\,\text{C}$, מ-$r_A = 0.6\,\text{m}$ עד $r_B = 0.2\,\text{m}$, ו-$kq_1q_2 = 9\cdot10^9\cdot3\cdot10^{-12} = 0.027\,\text{N}\cdot\text{m}^2$.
      - kind: law
        text: >-
          דוחפים לאט, ולכן היד מפעילה כוח שווה לכוח החשמלי ומנוגד לו, $kq_1q_2/r^2$, כלפי המטען הקבוע. העבודה שלה היא השטח מתחת לגרף הכוח הזה כתלות במרחק, $W = \int_{r_B}^{r_A} \dfrac{kq_1q_2}{r^2}\,dr$ (המרחק קטן, והכוח בכיוון התנועה).
      - kind: manipulation
        text: >-
          פונקציה קדומה של $r^{-2}$ היא $-1/r$: $W = kq_1q_2\left[-\dfrac1r\right]_{r_B}^{r_A} = kq_1q_2\left(\dfrac{1}{r_B} - \dfrac{1}{r_A}\right)$.
      - kind: limit
        text: >-
          אם $r_B = r_A$ העבודה אפס. כש-$r_A \to \infty$ מתקבל $kq_1q_2/r_B$, האנרגיה הפוטנציאלית של הזוג (שיעור 2.1).
      - kind: units
        text: >-
          $\text{N}\cdot\text{m}^2\cdot\tfrac{1}{\text{m}} = \text{N}\cdot\text{m} = \text{J}$.
      - kind: substitution
        text: >-
          א. $W = 0.027\,(5 - 1.667) = 0.09\,\text{J}$. ב. $W = 0.027\cdot5 = 0.135\,\text{J}$.
      - kind: reasoning
        text: >-
          ג. ב-$0.6\,\text{m}$ הכוח $0.027/0.36 = 0.075\,\text{N}$, קטן פי 9 מאשר ב-$0.2\,\text{m}$. רוב הדרך הכוח קטן, ולכן השטח האמיתי קטן הרבה מהמלבן בגובה המקסימלי.
      - kind: result
        text: >-
          א. $0.09\,\text{J}$. ב. $0.135\,\text{J}$. ג. הכוח משתנה, ומלבן אחד בגובה המקסימלי מעריך פי 3.

  - id: W-6.2-09
    level: bagrut
    qualitative: true
    objectives: [OBJ-6.2-3, OBJ-6.2-1]
    prompt: >-
      נתונה $f(x) = 3 - x$ בקטע $[0, 6]$, ו-$A(b) = \int_0^b f(x)\,dx$.

      א. בלי לחשב, קבעו ונמקו: באיזה $b$ הפונקציה $A$ הגדולה ביותר? באיזה $b > 0$ היא חוזרת לאפס?

      ב. מצאו ביטוי ל-$A(b)$, ובדקו את תשובותיכם לסעיף א.

      ג. שרטטו בקווים כלליים את $A(b)$.
    answer: >-
      א. ב-$b = 3$ (שם $f$ עוברת מחיובית לשלילית); היא חוזרת לאפס ב-$b = 6$.

      ב. $A(b) = 3b - b^2/2$; $A(3) = 4.5$, $A(6) = 0$.

      ג. קשת הפוכה (פרבולה) מ-$0$, עולה עד $4.5$ ב-$b = 3$, ויורדת חזרה ל-$0$ ב-$b = 6$.
    solution:
      - kind: law
        text: >-
          המשפט היסודי: $A'(b) = f(b)$. כש-$f > 0$ השטח גדל, וכש-$f < 0$ הוא קטן.
      - kind: reasoning
        text: >-
          א. $f$ חיובית עד $x = 3$ ושלילית אחריו. לכן $A$ עולה עד $b = 3$ ויורדת אחריו: המקסימום ב-$b = 3$. הגרף של $f$ ישר, והמשולש שמתחת לציר מ-$3$ עד $6$ שווה למשולש שמעליו מ-$0$ עד $3$, ולכן ב-$b = 6$ השטח המסומן חוזר לאפס.
      - kind: manipulation
        text: >-
          ב. פונקציה קדומה של $3 - x$ היא $3x - x^2/2$, ו-$A(b) = 3b - \dfrac{b^2}{2} - 0$. אז $A(3) = 9 - 4.5 = 4.5$ ו-$A(6) = 18 - 18 = 0$.
      - kind: limit
        text: >-
          $A(0) = 0$, כמו שצריך. והנגזרת של הביטוי, $3 - b$, היא $f(b)$ בדיוק. ובגאומטריה: $A(3)$ הוא משולש, $\tfrac12\cdot3\cdot3 = 4.5$.
      - kind: result
        text: >-
          א. מקסימום ב-$b = 3$, ואפס שוב ב-$b = 6$. ב. $A(b) = 3b - b^2/2$, $A(3) = 4.5$. ג. קשת שעולה עד $4.5$ ב-$b = 3$ וחוזרת ל-$0$ ב-$b = 6$.

  - id: W-6.2-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-6.2-2, OBJ-6.2-3]
    prompt: >-
      רכבת צעצוע נוסעת על מסילה ישרה, ומהירותה $v(t) = 3t^2 - 12t + 9$ (מטר לשנייה, $t$ בשניות), מ-$t = 0$ עד $t = 4\,\text{s}$.

      א. באילו רגעים הרכבת עוצרת? מתי היא נוסעת אחורה?

      ב. מה ההעתק שלה ב-$4$ השניות?

      ג. מה הדרך שעברה?
    answer: >-
      א. ב-$t = 1\,\text{s}$ וב-$t = 3\,\text{s}$; אחורה בין $1$ ל-$3\,\text{s}$.

      ב. $4\,\text{m}$ קדימה.

      ג. $12\,\text{m}$.
    solution:
      - kind: given
        text: >-
          $v(t) = 3t^2 - 12t + 9 = 3(t - 1)(t - 3)$. היא מתאפסת ב-$t = 1$ וב-$t = 3$, ושלילית ביניהם.
      - kind: law
        text: >-
          ההעתק הוא השטח המסומן, $\int v\,dt$; הדרך היא סכום השטחים בלי סימנים, קטע-קטע בין נקודות העצירה.
      - kind: manipulation
        text: >-
          פונקציה קדומה: $X(t) = t^3 - 6t^2 + 9t$. ערכים: $X(0) = 0$, $X(1) = 4$, $X(3) = 27 - 54 + 27 = 0$, $X(4) = 64 - 96 + 36 = 4$.
      - kind: reasoning
        text: >-
          ב. ההעתק $X(4) - X(0) = 4\,\text{m}$. ג. מ-$0$ עד $1$: $4\,\text{m}$ קדימה; מ-$1$ עד $3$: $X(3) - X(1) = -4$, כלומר $4\,\text{m}$ אחורה; מ-$3$ עד $4$: $4\,\text{m}$ קדימה. הדרך $4 + 4 + 4 = 12\,\text{m}$.
      - kind: limit
        text: >-
          ההעתק ($4\,\text{m}$) קטן מהדרך ($12\,\text{m}$), כמו שחייב להיות כשיש נסיעה אחורה. ואם הרכבת לא הייתה נוסעת אחורה אף פעם, שני המספרים היו שווים.
      - kind: units
        text: >-
          $\tfrac{\text{m}}{\text{s}}\cdot\text{s} = \text{m}$.
      - kind: result
        text: >-
          א. עוצרת ב-$1\,\text{s}$ וב-$3\,\text{s}$, אחורה ביניהם. ב. $4\,\text{m}$ קדימה. ג. $12\,\text{m}$.

challenge:
  - id: W-6.2-c1
    stars: 1
    objectives: [OBJ-6.2-2, OBJ-6.2-3]
    prompt: >-
      א. מצאו את השטח הכלוא בין הגרפים $y = x^2$ ו-$y = |x|$.

      ב. מה ערכו של $\int_{-1}^{1} \left(x^2 - |x|\right)dx$? למה הוא שונה מהתשובה לסעיף א?
    answer: >-
      א. $1/3$.

      ב. $-1/3$: בין נקודות החיתוך $x^2$ נמוך מ-$|x|$, והאינטגרל הוא שטח מסומן.
    solution:
      - kind: given
        text: >-
          הגרפים נחתכים כש-$x^2 = |x|$: ב-$x = 0$ וב-$x = \pm1$. בין $-1$ ל-$1$ הגרף של $|x|$ מעל הגרף של $x^2$ (למשל ב-$x = 0.5$: $0.5 > 0.25$).
      - kind: law
        text: >-
          השטח בין שני גרפים הוא האינטגרל של הגבוה פחות הנמוך: כל רצועה היא $(|x| - x^2)\,dx$.
      - kind: manipulation
        text: >-
          שני הגרפים סימטריים סביב ציר y, ולכן השטח הוא פעמיים השטח מ-$0$ עד $1$, שם $|x| = x$: $2\int_0^1 (x - x^2)\,dx = 2\left[\dfrac{x^2}{2} - \dfrac{x^3}{3}\right]_0^1 = 2\left(\dfrac12 - \dfrac13\right) = \dfrac13$.
      - kind: reasoning
        text: >-
          ב. $x^2 - |x|$ הוא מינוס הפונקציה שבסעיף א, ושלילי בכל הקטע. לכן האינטגרל הוא $-1/3$: שטח מסומן, ולא שטח גאומטרי.
      - kind: limit
        text: >-
          השטח חייב להיות קטן מהמשולשים שמתחת ל-$|x|$, שטחם $2\cdot\tfrac12\cdot1\cdot1 = 1$, ולהיות חיובי. $1/3$ מתאים. וגם: השטח מתחת ל-$x^2$ מ-$-1$ עד $1$ הוא $2/3$, ו-$1 - 2/3 = 1/3$.
      - kind: result
        text: >-
          א. $1/3$. ב. $-1/3$.
    source:
      name: Oxford Physics Aptitude Test (PAT)
      year: 2012
      problem: 'Part A, Q1'
      url: https://www.physics.ox.ac.uk/system/files/file_attachments/pat-2012.pdf
      verified: '2026-11-02'
      adapted: true

  - id: W-6.2-c2
    stars: 2
    objectives: [OBJ-6.2-3, OBJ-6.2-2]
    prompt: >-
      כדור ברדיוס $a = 0.1\,\text{m}$ טעון במטען כולל $Q = 1\,\mu\text{C}$, מפוזר בצורה סימטרית כך שהמטען בתוך כדור ברדיוס $r$ (מאותו מרכז) הוא $q(r) = Q\,(r/a)^4$. בונים את הכדור שכבה אחר שכבה: כל קליפה דקה, עם מטען $dq$, מובאת מרחוק מאוד ומונחת ברדיוס $r$, מעל הכדור הקטן שכבר נבנה.

      א. הסבירו למה העבודה להביא את הקליפה היא $dW = \dfrac{k\,q(r)}{r}\,dq$, והראו ש-$dq = \dfrac{4Q\,r^3}{a^4}\,dr$.

      ב. מצאו את האנרגיה הכוללת הדרושה לבניית הכדור, כביטוי ובמספרים.

      ג. השוו לשני מקרים מוכרים: כל המטען על פני הכדור ($\tfrac12\,kQ^2/a$), ומטען שמפוזר באחידות בנפח ($\tfrac35\,kQ^2/a$). האם התוצאה סבירה?
    answer: >-
      א. מחוץ לכדור שכבר נבנה, הפוטנציאל הוא $kq(r)/r$ (כמו של מטען נקודתי, שיעור 2.5), ו-$dq$ הוא הגידול של $q(r)$ כש-$r$ גדל ב-$dr$.

      ב. $U = \dfrac{4kQ^2}{7a} \approx 5.14\cdot10^{-2}\,\text{J}$.

      ג. $\tfrac12 < \tfrac47 < \tfrac35$: המטען כאן מרוכז יותר כלפי חוץ מאשר בפיזור אחיד, ופחות מאשר כשכולו על פני הכדור.
    solution:
      - kind: law
        text: >-
          העבודה להביא מטען קטן $dq$ מרחוק מאוד לנקודה שבה הפוטנציאל $V$ היא $V\,dq$ (שיעור 2.2). מחוץ לכדור טעון סימטרי, הפוטנציאל הוא $kq/r$, כאילו כל המטען במרכז (שיעור 2.5). לכן $dW = \dfrac{k\,q(r)}{r}\,dq$.
      - kind: manipulation
        text: >-
          כש-$r$ גדל ב-$dr$, המטען בפנים גדל ב-$dq = q'(r)\,dr$, והנגזרת של $Q\,r^4/a^4$ היא $4Q\,r^3/a^4$. מציבים: $dW = \dfrac{kQ r^4}{a^4 r}\cdot\dfrac{4Q r^3}{a^4}\,dr = \dfrac{4kQ^2}{a^8}\,r^6\,dr$.
      - kind: manipulation
        text: >-
          מחברים את כל הקליפות מ-$0$ עד $a$: $U = \dfrac{4kQ^2}{a^8}\int_0^a r^6\,dr = \dfrac{4kQ^2}{a^8}\cdot\dfrac{a^7}{7} = \dfrac{4kQ^2}{7a}$.
      - kind: limit
        text: >-
          ג. $\tfrac47 \approx 0.571$, בין $\tfrac12$ (כל המטען בחוץ, הכי מרוחק זה מזה) ל-$\tfrac35$ (פיזור אחיד). כאן הצפיפות גדלה כלפי חוץ, ולכן המצב קרוב יותר לקליפה, כמו שציפינו. ואם $Q \to 0$, האנרגיה אפס.
      - kind: units
        text: >-
          $\dfrac{\text{N}\cdot\text{m}^2}{\text{C}^2}\cdot\dfrac{\text{C}^2}{\text{m}} = \text{N}\cdot\text{m} = \text{J}$.
      - kind: substitution
        text: >-
          $U = \dfrac{4\cdot9\cdot10^9\cdot(10^{-6})^2}{7\cdot0.1} \approx 5.14\cdot10^{-2}\,\text{J}$ (לעומת $4.5\cdot10^{-2}\,\text{J}$ לקליפה ו-$5.4\cdot10^{-2}\,\text{J}$ לפיזור אחיד).
      - kind: result
        text: >-
          ב. $U = 4kQ^2/(7a) \approx 5.14\cdot10^{-2}\,\text{J}$. ג. בין המקרה של הקליפה למקרה של הפיזור האחיד, כצפוי.
    source:
      name: MIT OpenCourseWare, 8.022 Physics II (Electricity and Magnetism), Fall 2004
      year: 2004
      problem: 'Assignment 2, Problem 5(c)'
      url: https://ocw.mit.edu/courses/8-022-physics-ii-electricity-and-magnetism-fall-2004/86c67a2a80e1881fcbf5e110d75c48c8_pset2.pdf
      verified: '2026-11-02'
      adapted: true
