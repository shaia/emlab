# and the chapter-6 solution shape (law → manipulation → result → limit → units → substitution).
# Every number was recomputed with src/physics/calculus.ts (riemann), integrals.ts (exactIntegral,
# unsignedArea, areaParts), potential.ts (pairEnergy) and constants.ts (K, G, E_CHARGE); script
