# Workbook, lesson 6.8 (curl and Stokes' theorem). Format and rules: see .claude/CLAUDE.md, "Worked
# examples, workbook", and the chapter 6 solution shape (law … limit, units, result).
# Every number was recomputed with src/physics/constants.ts (MU0, EPS0_DISPLAY) and vectorcalc.ts
# (squareCirculation); script w68.ts in the session scratchpad. In a >- block, consecutive lines fold into
# one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '6.8'
practice:
  - id: W-6.8-01
    level: basic
    qualitative: false
    objectives: [OBJ-6.8-1, OBJ-6.8-3]
    prompt: >-
      באזור מסוים השדה המגנטי הוא $\vec B = (0,\ \beta x,\ 0)$, עם $\beta = 3\cdot10^{-3}\,\text{T/m}$: כל הקווים אנכיים, למעלה מימין לציר $y$ ולמטה משמאלו.

      א. חשבו את $\nabla\times\vec B$, וקבעו את כיוונו.

      ב. מה צפיפות הזרם באזור, ולאיזה כיוון הוא זורם?
    answer: >-
      א. $(\nabla\times\vec B)_z = \beta = 3\cdot10^{-3}\,\text{T/m}$, החוצה מהדף.

      ב. $J = \beta/\mu_0 \approx 2.39\cdot10^{3}\,\text{A/m}^2$, החוצה מהדף.
    solution:
      - kind: law
        text: >-
          $(\nabla\times\vec B)_z = \dfrac{\partial B_y}{\partial x} - \dfrac{\partial B_x}{\partial y}$, ו-$\nabla\times\vec B = \mu_0\vec J$.
      - kind: manipulation
        text: >-
          $\partial(\beta x)/\partial x = \beta$, ו-$B_x = 0$. שני הרכיבים האחרים של הרוטור כוללים רק $B_z$ ונגזרות לפי $z$, והם אפס. הרוטור חיובי לאורך $z$: לפי כלל יד ימין, סיבוב נגד כיוון השעון בדף, החוצה מהדף.
      - kind: substitution
        text: >-
          $J = \dfrac{3\cdot10^{-3}}{4\pi\cdot10^{-7}} \approx 2.39\cdot10^{3}\,\text{A/m}^2$.
      - kind: limit
        text: >-
          אם $\beta \to 0$, השדה נעלם ואיתו הזרם. וגלגל משוטים על ציר $y$: הלהב הימני נדחף למעלה והשמאלי למטה, סיבוב נגד כיוון השעון, כמו הסימן החיובי.
      - kind: units
        text: >-
          $\dfrac{\text{T/m}}{\text{T}\cdot\text{m}/\text{A}} = \dfrac{\text{A}}{\text{m}^2}$.
      - kind: result
        text: >-
          א. $3\cdot10^{-3}\,\text{T/m}$, החוצה מהדף. ב. $2.39\cdot10^{3}\,\text{A/m}^2$, החוצה מהדף.

  - id: W-6.8-02
    level: basic
    qualitative: true
    objectives: [OBJ-6.8-2, OBJ-6.8-3]
    prompt: >-
      לכל אחד מהשדות הבאים קבעו ונמקו, בלי מספרים: האם הרוטור שלו שונה מאפס בנקודה שמתוארת?

      א. השדה החשמלי במרחק $3\,\text{cm}$ מקו טעון: הקווים רדיאליים, והשדה חזק.

      ב. שדה מגנטי אחיד של $0.5\,\text{T}$.

      ג. שדה מגנטי שכל קוויו אופקיים ימינה, וגודלו גדל ככל שעולים למעלה.

      ד. השדה המגנטי במרחק $3\,\text{cm}$ מתיל דק: קווים מעגליים סביב התיל.
    answer: >-
      רק בשדה ג. בשדות א, ב ו-ד הרוטור אפס.
    solution:
      - kind: law
        text: >-
          $(\nabla\times\vec F)_z = \partial F_y/\partial x - \partial F_x/\partial y$; לשדה אלקטרוסטטי $\nabla\times\vec E = 0$, ולשדה מגנטי $\nabla\times\vec B = \mu_0\vec J$.
      - kind: reasoning
        text: >-
          א. שדה אלקטרוסטטי: הסירקולציה שלו אפס סביב כל לולאה, והרוטור אפס, כמה שהשדה חזק.

          ב. בשדה אחיד כל הנגזרות אפס.

          ג. $B_x$ גדל עם $y$, ולכן $\partial B_x/\partial y > 0$ ו-$(\nabla\times\vec B)_z < 0$: שדה גזירה. גלגל משוטים מסתובב עם כיוון השעון, והזרם שם זורם לתוך הדף.

          ד. בנקודה אין זרם, ולכן $\nabla\times\vec B = 0$, אף שהקווים מעגלים.
      - kind: limit
        text: >-
          בשדה ג, אם קצב הגידול שואף לאפס השדה נעשה אחיד, כמו ב, והרוטור נעלם. בשדה ד, לולאה שגדולה מספיק כדי להקיף את התיל מקבלת סירקולציה $\mu_0 I$: הרוטור מרוכז בתיל עצמו.
      - kind: units
        text: >-
          אין מספרים. רוטור של שדה מגנטי נמדד ב-$\text{T/m}$, ושל שדה חשמלי ב-$\text{V/m}^2$.
      - kind: result
        text: >-
          רוטור שונה מאפס רק בשדה ג, שקוויו ישרים. בשדה ד, עם הקווים המעגליים, הרוטור אפס.

  - id: W-6.8-03
    level: basic
    qualitative: false
    objectives: [OBJ-6.8-1, OBJ-6.8-3]
    prompt: >-
      חיישן מודד את רכיב השדה המגנטי לאורך כל צלע של לולאה ריבועית קטנה, בצלע $1\,\text{cm}$, ומכפיל באורך הצלע. כשהולכים נגד כיוון השעון, התרומות הן (ב-$10^{-7}\,\text{T}\cdot\text{m}$): $+2.0$ בצלע התחתונה, $+1.5$ בימנית, $-0.5$ בעליונה ו-$+1.0$ בשמאלית.

      א. מה הסירקולציה סביב הלולאה?

      ב. הערכו את $(\nabla\times\vec B)_z$ ואת צפיפות הזרם בתוך הלולאה.
    answer: >-
      א. $4\cdot10^{-7}\,\text{T}\cdot\text{m}$.

      ב. $(\nabla\times\vec B)_z \approx 4\cdot10^{-3}\,\text{T/m}$, ו-$J \approx 3.18\cdot10^{3}\,\text{A/m}^2$, החוצה מהדף.
    solution:
      - kind: law
        text: >-
          $(\nabla\times\vec B)_z \approx \dfrac{1}{A}\oint \vec B\cdot d\vec l$ ללולאה קטנה, ו-$J_z = (\nabla\times\vec B)_z/\mu_0$.
      - kind: manipulation
        text: >-
          הסירקולציה היא סכום התרומות, עם הסימנים: $(2.0 + 1.5 - 0.5 + 1.0)\cdot10^{-7} = 4\cdot10^{-7}\,\text{T}\cdot\text{m}$. השטח $A = (0.01)^2 = 10^{-4}\,\text{m}^2$.
      - kind: substitution
        text: >-
          $\dfrac{4\cdot10^{-7}}{10^{-4}} = 4\cdot10^{-3}\,\text{T/m}$, ו-$J = \dfrac{4\cdot10^{-3}}{4\pi\cdot10^{-7}} \approx 3.18\cdot10^{3}\,\text{A/m}^2$.
      - kind: limit
        text: >-
          זו הערכה: לולאה בגודל סופי נותנת ממוצע של הרוטור על השטח שלה, ולולאה קטנה יותר מתקרבת לערך בנקודה. אילו התרומות היו מתקזזות לאפס, לא היה זרם בתוך הלולאה (בממוצע).
      - kind: units
        text: >-
          $\dfrac{\text{T}\cdot\text{m}}{\text{m}^2} = \dfrac{\text{T}}{\text{m}}$, ו-$\dfrac{\text{T/m}}{\text{T}\cdot\text{m}/\text{A}} = \dfrac{\text{A}}{\text{m}^2}$.
      - kind: result
        text: >-
          א. $4\cdot10^{-7}\,\text{T}\cdot\text{m}$. ב. כ-$4\cdot10^{-3}\,\text{T/m}$, וזרם של כ-$3.2\cdot10^{3}\,\text{A/m}^2$ החוצה מהדף (הסירקולציה חיובית נגד כיוון השעון).

  - id: W-6.8-04
    level: mid
    qualitative: false
    objectives: [OBJ-6.8-1, OBJ-6.8-3]
    prompt: >-
      בשדה $\vec B = \kappa\,(-y,\ x,\ 0)$, עם $\kappa = 0.2\,\text{T/m}$, משרטטים ריבוע בצלע $L = 1\,\text{cm}$ שמרכזו בראשית.

      א. חשבו את הסירקולציה נגד כיוון השעון סביב הריבוע ישירות, צלע אחרי צלע.

      ב. חשבו אותה שוב במשפט סטוקס.
    answer: >-
      בשתי הדרכים $2\kappa L^2 = 4\cdot10^{-5}\,\text{T}\cdot\text{m}$.
    solution:
      - kind: law
        text: >-
          $\oint \vec B\cdot d\vec l = \int (\nabla\times\vec B)\cdot d\vec A$.
      - kind: manipulation
        text: >-
          א. בצלע התחתונה, $y = -L/2$, הולכים ימינה, ו-$B_x = \kappa L/2$: תרומה $\kappa L/2\cdot L$. בצלע הימנית, $x = L/2$, הולכים למעלה, ו-$B_y = \kappa L/2$: אותה תרומה. מהסימטריה גם שתי האחרות תורמות כל אחת $\kappa L^2/2$. הסכום $2\kappa L^2$.
      - kind: manipulation
        text: >-
          ב. $(\nabla\times\vec B)_z = \kappa - (-\kappa) = 2\kappa$, אחיד, ולכן השטף שלו דרך הריבוע הוא $2\kappa L^2$.
      - kind: substitution
        text: >-
          $2\cdot0.2\cdot(0.01)^2 = 4\cdot10^{-5}\,\text{T}\cdot\text{m}$.
      - kind: limit
        text: >-
          הסירקולציה גדלה כמו $L^2$, כמו השטח, ולכן הסירקולציה ליחידת שטח, $2\kappa$, לא תלויה בגודל הריבוע. ועם $L \to 0$ היא נשארת $2\kappa$: זה הרוטור בראשית, אף שהשדה שם אפס.
      - kind: units
        text: >-
          $\kappa L^2$: $\dfrac{\text{T}}{\text{m}}\cdot\text{m}^2 = \text{T}\cdot\text{m}$.
      - kind: result
        text: >-
          $4\cdot10^{-5}\,\text{T}\cdot\text{m}$ בשתי הדרכים.

  - id: W-6.8-05
    level: mid
    qualitative: true
    objectives: [OBJ-6.8-2, OBJ-6.8-3]
    prompt: >-
      תלמידה אומרת: "קווי השדה החשמלי של קו טעון לא נסגרים, ולכן $\nabla\times\vec E = 0$. קווי השדה המגנטי של תיל דק נסגרים סביבו, ולכן $\nabla\times\vec B \neq 0$ בכל המרחב סביב התיל."

      א. מה נכון בדבריה, ומה לא?

      ב. איפה בדיוק $\nabla\times\vec B \neq 0$ בשדה של התיל?
    answer: >-
      א. $\nabla\times\vec E = 0$ נכון, אבל לא בגלל צורת הקווים; $\nabla\times\vec B \neq 0$ סביב התיל לא נכון: מחוץ לתיל הוא אפס.

      ב. רק בתוך התיל, במקום שבו זורם הזרם.
    solution:
      - kind: law
        text: >-
          $\nabla\times\vec E = 0$ לשדה אלקטרוסטטי, ו-$\nabla\times\vec B = \mu_0\vec J$.
      - kind: reasoning
        text: >-
          א. לשדה של קו טעון יש רוטור אפס כי הוא אלקטרוסטטי: הסירקולציה שלו אפס סביב כל לולאה (שיעור 2.1). מחוץ לתיל אין זרם, ולכן שם $\nabla\times\vec B = 0$, אף שהקווים נסגרים. לולאה זעירה ליד התיל נותנת סירקולציה אפס, וגלגל משוטים לא מסתובב שם במקום.
      - kind: reasoning
        text: >-
          ב. הסירקולציה $\mu_0 I$ סביב מסלול שמקיף את התיל באה כולה מהרוטור שבתוך החתך של התיל, $\mu_0 J$. בתיל דק מאוד הוא מרוכז בקו אחד.
      - kind: limit
        text: >-
          בתיל עבה ברדיוס $R$ עם זרם אחיד, הרוטור בפנים $\mu_0 I/(\pi R^2)$. כש-$R \to 0$ הוא גדל, והשטח שלו קטן, והמכפלה נשארת $\mu_0 I$.
      - kind: units
        text: >-
          אין מספרים; $\mu_0 J$ ב-$\text{T/m}$, ו-$\mu_0 I$ ב-$\text{T}\cdot\text{m}$.
      - kind: result
        text: >-
          א. רוטור אפס ל-$\vec E$ נכון, מהסיבה הלא נכונה; רוטור שונה מאפס סביב התיל לא נכון. ב. רק בתוך התיל.

  - id: W-6.8-06
    level: mid
    qualitative: false
    objectives: [OBJ-6.8-1, OBJ-6.8-3]
    prompt: >-
      באזור מסוים השדה החשמלי הוא $\vec E = \alpha\,(2x + 3y,\ k\,x - y,\ 0)$, עם $\alpha = 10^{4}\,\text{N}/(\text{C}\cdot\text{m})$ ו-$k$ מספר.

      א. לאיזה ערך של $k$ השדה יכול להיות שדה של מטענים במנוחה?

      ב. עם הערך הזה, מצאו פוטנציאל $V$ כך ש-$\vec E = -\nabla V$.

      ג. מה צפיפות המטען באזור?
    answer: >-
      א. $k = 3$.

      ב. $V = -\alpha\,(x^2 + 3xy - y^2/2)$, ועוד קבוע.

      ג. $\rho = \varepsilon_0\alpha \approx 8.85\cdot10^{-8}\,\text{C/m}^3$.
    solution:
      - kind: law
        text: >-
          שדה אלקטרוסטטי: $\nabla\times\vec E = 0$ ו-$\vec E = -\nabla V$; ו-$\nabla\cdot\vec E = \rho/\varepsilon_0$.
      - kind: manipulation
        text: >-
          א. $(\nabla\times\vec E)_z = \partial E_y/\partial x - \partial E_x/\partial y = \alpha k - 3\alpha$. הוא אפס רק כש-$k = 3$.
      - kind: manipulation
        text: >-
          ב. צריך $-\partial V/\partial x = \alpha(2x + 3y)$ ו-$-\partial V/\partial y = \alpha(3x - y)$. נסו $V = -\alpha(x^2 + 3xy - y^2/2)$: הנגזרת לפי $x$ היא $-\alpha(2x + 3y)$, ולפי $y$ היא $-\alpha(3x - y)$. שני התנאים מתקיימים. (עם $k \neq 3$ אין פונקציה כזו: הנגזרות החלקיות המעורבות של $V$ היו צריכות להיות שונות.)
      - kind: manipulation
        text: >-
          ג. $\nabla\cdot\vec E = \partial(2\alpha x)/\partial x + \partial(-\alpha y)/\partial y = 2\alpha - \alpha = \alpha$, ולכן $\rho = \varepsilon_0\alpha$.
      - kind: substitution
        text: >-
          $\rho = 8.85\cdot10^{-12}\cdot10^{4} = 8.85\cdot10^{-8}\,\text{C/m}^3$.
      - kind: limit
        text: >-
          אם מוחקים את האיברים $3y$ ו-$kx$, נשאר $\alpha(2x,\ -y)$, שהרוטור שלו אפס בכל $k$: האיברים ה"מעורבים" הם שקובעים את הרוטור, והאיברים ה"אלכסוניים" את הדיברגנץ.
      - kind: units
        text: >-
          $V$: $\dfrac{\text{N}}{\text{C}\cdot\text{m}}\cdot\text{m}^2 = \text{V}$; $\varepsilon_0\alpha$: $\text{C/m}^3$.
      - kind: result
        text: >-
          א. $k = 3$. ב. $V = -\alpha(x^2 + 3xy - y^2/2)$. ג. $8.85\cdot10^{-8}\,\text{C/m}^3$.

  - id: W-6.8-07
    level: mid
    qualitative: false
    objectives: [OBJ-6.8-2, OBJ-6.8-3]
    prompt: >-
      בשכבת זרם רחבה, בין $y = -1\,\text{cm}$ ל-$y = +1\,\text{cm}$, זורם זרם אחיד החוצה מהדף, $J = 2\cdot10^{4}\,\text{A/m}^2$. בתוך השכבה $B_x = -\mu_0 J\,y$, ומחוצה לה השדה אחיד.

      א. מה השדה ב-$y = 0.5\,\text{cm}$, ומה מעל השכבה?

      ב. לולאה מלבנית ברוחב $3\,\text{cm}$: הצלע התחתונה על קו האמצע, $y = 0$, והעליונה ב-$y = 2\,\text{cm}$, מחוץ לשכבה. חשבו את הסירקולציה נגד כיוון השעון במשפט סטוקס.

      ג. בדקו את התשובה ישירות, צלע אחרי צלע.
    answer: >-
      א. $1.26\cdot10^{-4}\,\text{T}$ שמאלה; מעל השכבה $2.51\cdot10^{-4}\,\text{T}$ שמאלה.

      ב, ג. $7.54\cdot10^{-6}\,\text{T}\cdot\text{m}$.
    solution:
      - kind: law
        text: >-
          $\nabla\times\vec B = \mu_0\vec J$, ו-$\oint \vec B\cdot d\vec l = \int (\nabla\times\vec B)\cdot d\vec A$.
      - kind: manipulation
        text: >-
          א. ב-$y = 0.005\,\text{m}$: $B_x = -\mu_0 J\cdot0.005$. בדופן העליונה, $y = d = 0.01\,\text{m}$, $B_x = -\mu_0 J d$, ומעליה השדה נשאר כזה, כי שם אין זרם ($\partial B_x/\partial y = 0$).
      - kind: manipulation
        text: >-
          ב. הרוטור $\mu_0 J$ רק בחלק של המלבן שבתוך השכבה, $3\,\text{cm}\times1\,\text{cm}$, ואפס בחלק שמעליה. האינטגרל: $\mu_0 J\cdot(0.03\cdot0.01)$.
      - kind: manipulation
        text: >-
          ג. בצלע התחתונה השדה אפס. בצלעות האנכיות השדה אופקי, ניצב להן. בצלע העליונה הולכים שמאלה, והשדה $\mu_0 J d$ שמאלה: תרומה $\mu_0 J d\cdot0.03$, אותו ביטוי.
      - kind: substitution
        text: >-
          $\mu_0 J\cdot0.005 = 4\pi\cdot10^{-7}\cdot2\cdot10^{4}\cdot0.005 \approx 1.26\cdot10^{-4}\,\text{T}$; $\mu_0 J d \approx 2.51\cdot10^{-4}\,\text{T}$; הסירקולציה $2.51\cdot10^{-4}\cdot0.03 \approx 7.54\cdot10^{-6}\,\text{T}\cdot\text{m}$.
      - kind: limit
        text: >-
          הסירקולציה לא משתנה אם מרימים את הצלע העליונה עוד: השדה שם אחיד, והרוטור אפס. ואם מורידים אותה לתוך השכבה, הסירקולציה קטנה, כי פחות זרם עובר דרך המלבן.
      - kind: units
        text: >-
          $\mu_0 J\cdot\text{m}^2$: $\dfrac{\text{T}\cdot\text{m}}{\text{A}}\cdot\dfrac{\text{A}}{\text{m}^2}\cdot\text{m}^2 = \text{T}\cdot\text{m}$.
      - kind: result
        text: >-
          א. $1.26\cdot10^{-4}\,\text{T}$ ו-$2.51\cdot10^{-4}\,\text{T}$, שמאלה. ב, ג. $7.54\cdot10^{-6}\,\text{T}\cdot\text{m}$.

  - id: W-6.8-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-6.8-1, OBJ-6.8-2, OBJ-6.8-3]
    prompt: >-
      צינור מוליך ארוך, עם רדיוס פנימי $a = 2\,\text{mm}$ ורדיוס חיצוני $b = 4\,\text{mm}$, נושא זרם של $30\,\text{A}$ לאורכו, מפוזר באחידות על חתך הדופן.

      א. מצאו בעזרת משפט סטוקס (חוק אמפר) את השדה בחלל ($s < a$), בתוך הדופן ($a < s < b$) ומחוץ לצינור.

      ב. מה השדה ב-$s = 3\,\text{mm}$ וב-$s = 6\,\text{mm}$?

      ג. בתוך הדופן, כתבו את השדה כסכום של שני שדות: "סיבוב קשיח", $\propto(-y,\ x)$, ו"מערבולת", $\propto(-y,\ x)/s^2$. מה הרוטור של כל אחד, ומה הרוטור של הסכום?
    answer: >-
      א. בחלל $0$; בדופן $B = \dfrac{\mu_0 J(s^2 - a^2)}{2s}$ עם $J = \dfrac{I}{\pi(b^2 - a^2)}$; בחוץ $\dfrac{\mu_0 I}{2\pi s}$.

      ב. $8.33\cdot10^{-4}\,\text{T}$ ו-$1\cdot10^{-3}\,\text{T}$.

      ג. $\mu_0 J$ ו-$0$; יחד $\mu_0 J = 1\,\text{T/m}$.
    solution:
      - kind: law
        text: >-
          $\oint \vec B\cdot d\vec l = \mu_0\int \vec J\cdot d\vec A$, ו-$(\nabla\times\vec B)_z = \partial B_y/\partial x - \partial B_x/\partial y$.
      - kind: manipulation
        text: >-
          א. מהסימטריה השדה משיק למעגל שמרכזו על הציר ושווה עליו, והסירקולציה $B\cdot2\pi s$. בחלל אין זרם כלוא: $B = 0$. בדופן הזרם הכלוא $J\pi(s^2 - a^2)$, ולכן $B = \dfrac{\mu_0 J(s^2 - a^2)}{2s}$. בחוץ כל הזרם כלוא: $B = \dfrac{\mu_0 I}{2\pi s}$.
      - kind: substitution
        text: >-
          ב. $J = \dfrac{30}{\pi(16 - 4)\cdot10^{-6}} \approx 7.96\cdot10^{5}\,\text{A/m}^2$. ב-$3\,\text{mm}$: $B = \dfrac{4\pi\cdot10^{-7}\cdot7.96\cdot10^{5}\cdot(9 - 4)\cdot10^{-6}}{2\cdot0.003} \approx 8.33\cdot10^{-4}\,\text{T}$. ב-$6\,\text{mm}$: $B = \dfrac{4\pi\cdot10^{-7}\cdot30}{2\pi\cdot0.006} = 1\cdot10^{-3}\,\text{T}$.
      - kind: manipulation
        text: >-
          ג. $\vec B = \dfrac{\mu_0 J}{2}\,(-y,\ x) - \dfrac{\mu_0 J a^2}{2}\,\dfrac{(-y,\ x)}{s^2}$. לסיבוב הקשיח $\kappa(-y,\ x)$ הרוטור $2\kappa = \mu_0 J$. למערבולת הרוטור אפס מחוץ לציר (חישבנו בשיעור). הרוטור הוא סכום הרוטורים, ולכן $\mu_0 J$, כמו שחוק אמפר המקומי דורש.
      - kind: limit
        text: >-
          ב-$s = a$ השדה בדופן אפס, כמו בחלל; ב-$s = b$ הוא $\dfrac{\mu_0 J(b^2 - a^2)}{2b} = \dfrac{\mu_0 I}{2\pi b}$, כמו בחוץ: השדה רציף. וכש-$a \to 0$, הצינור נעשה תיל מלא, ומקבלים $\mu_0 J s/2$, השדה בתוך תיל עבה (שיעור 4.4).
      - kind: units
        text: >-
          $\mu_0 J s$: $\dfrac{\text{T}\cdot\text{m}}{\text{A}}\cdot\dfrac{\text{A}}{\text{m}^2}\cdot\text{m} = \text{T}$; $\mu_0 J$: $\text{T/m}$.
      - kind: result
        text: >-
          א. $0$, $\mu_0 J(s^2 - a^2)/(2s)$, $\mu_0 I/(2\pi s)$. ב. $8.33\cdot10^{-4}\,\text{T}$ ו-$1\cdot10^{-3}\,\text{T}$. ג. $\mu_0 J \approx 1\,\text{T/m}$ בדופן, מהסיבוב הקשיח בלבד.

  - id: W-6.8-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-6.8-1, OBJ-6.8-3]
    prompt: >-
      בשכבת זרם רחבה, בין $y = -d$ ל-$y = +d$ עם $d = 1\,\text{cm}$, צפיפות הזרם (החוצה מהדף) לא אחידה: $J(y) = J_0\,(1 - y^2/d^2)$, עם $J_0 = 3\cdot10^{4}\,\text{A/m}^2$. השדה אופקי, $\vec B = (B_x(y),\ 0,\ 0)$, ו-$B_x(0) = 0$.

      א. השתמשו ב-$\nabla\times\vec B = \mu_0\vec J$ כדי למצוא את $B_x(y)$ בתוך השכבה.

      ב. מה השדה בדופן העליונה, $y = d$?

      ג. לולאה מלבנית ברוחב $2\,\text{cm}$, מ-$y = 0$ עד $y = d$. חשבו את הסירקולציה נגד כיוון השעון במשפט סטוקס, ובדקו ישירות.
    answer: >-
      א. $B_x = -\mu_0 J_0\big(y - \dfrac{y^3}{3d^2}\big)$.

      ב. $\dfrac{2}{3}\mu_0 J_0 d \approx 2.51\cdot10^{-4}\,\text{T}$, שמאלה.

      ג. $\approx 5.03\cdot10^{-6}\,\text{T}\cdot\text{m}$.
    solution:
      - kind: law
        text: >-
          $(\nabla\times\vec B)_z = \partial B_y/\partial x - \partial B_x/\partial y = \mu_0 J$, ומשפט סטוקס.
      - kind: manipulation
        text: >-
          א. $B_y = 0$, ולכן $\dfrac{dB_x}{dy} = -\mu_0 J_0\Big(1 - \dfrac{y^2}{d^2}\Big)$. פונקציה קדומה (שיעור 6.2), עם $B_x(0) = 0$: $B_x = -\mu_0 J_0\Big(y - \dfrac{y^3}{3d^2}\Big)$.
      - kind: manipulation
        text: >-
          ב. ב-$y = d$: $B_x = -\mu_0 J_0\Big(d - \dfrac{d}{3}\Big) = -\dfrac{2}{3}\mu_0 J_0 d$.
      - kind: manipulation
        text: >-
          ג. סטוקס: $\int (\nabla\times\vec B)_z\,dA = \mu_0 w\int_0^d J\,dy = \mu_0 w J_0\Big(d - \dfrac{d}{3}\Big) = \dfrac{2}{3}\mu_0 J_0 d\,w$. ישירות: בצלע התחתונה השדה אפס; בצלעות האנכיות הוא ניצב להן; בעליונה הולכים שמאלה והשדה שמאלה, $\dfrac23\mu_0 J_0 d$, לאורך $w$. אותו ביטוי.
      - kind: substitution
        text: >-
          $\dfrac23\cdot4\pi\cdot10^{-7}\cdot3\cdot10^{4}\cdot0.01 \approx 2.51\cdot10^{-4}\,\text{T}$, והסירקולציה $2.51\cdot10^{-4}\cdot0.02 \approx 5.03\cdot10^{-6}\,\text{T}\cdot\text{m}$.
      - kind: limit
        text: >-
          ליד קו האמצע, $y \ll d$, האיבר $y^3$ זניח, ו-$B_x \approx -\mu_0 J_0 y$: שכבה עם זרם אחיד $J_0$, כמו באיור 6.8א. בדופן, $J = 0$, והשיפוע של $B_x$ מתאפס: השדה מתחבר בלי שבירה לשדה האחיד שבחוץ.
      - kind: units
        text: >-
          $\mu_0 J_0 d$: $\dfrac{\text{T}\cdot\text{m}}{\text{A}}\cdot\dfrac{\text{A}}{\text{m}^2}\cdot\text{m} = \text{T}$.
      - kind: result
        text: >-
          א. $B_x = -\mu_0 J_0(y - y^3/(3d^2))$. ב. $2.51\cdot10^{-4}\,\text{T}$ שמאלה. ג. $5.03\cdot10^{-6}\,\text{T}\cdot\text{m}$.

  - id: W-6.8-10
    level: bagrut
    qualitative: true
    objectives: [OBJ-6.8-2, OBJ-6.8-3]
    prompt: >-
      שני תילים דקים ארוכים מקבילים, ניצבים לדף, במרחק $4\,\text{cm}$ זה מזה. בשמאלי זורם $4\,\text{A}$ החוצה מהדף, ובימני $4\,\text{A}$ לתוך הדף.

      א. קבעו ונמקו: איפה $\nabla\times\vec B \neq 0$?

      ב. מה הסירקולציה נגד כיוון השעון סביב מסלול שמקיף רק את השמאלי? רק את הימני? את שניהם?

      ג. מחליפים את שני התילים בשני קווים טעונים, $+\lambda$ ו-$-\lambda$, באותם מקומות. מה משתנה בתשובות לסעיפים א ו-ב, כשמדובר ב-$\vec E$?
    answer: >-
      א. רק בתוך התילים עצמם. ב. $+5.03\cdot10^{-6}$, $-5.03\cdot10^{-6}$, ו-$0\,\text{T}\cdot\text{m}$. ג. ל-$\vec E$ הרוטור אפס בכל מקום, והסירקולציה אפס סביב כל מסלול.
    solution:
      - kind: law
        text: >-
          $\nabla\times\vec B = \mu_0\vec J$, $\nabla\times\vec E = 0$, ומשפט סטוקס.
      - kind: reasoning
        text: >-
          א. הרוטור של $\vec B$ שונה מאפס רק במקום שבו זורם זרם: בחתך של כל אחד מהתילים. בכל נקודה אחרת הוא אפס, אף שהקווים שם מתעקלים בין התילים.
      - kind: reasoning
        text: >-
          ב. לפי משפט סטוקס, הסירקולציה היא השטף של הרוטור, כלומר $\mu_0$ כפול הזרם הכלוא. נגד כיוון השעון, זרם שיוצא מהדף חיובי: $+\mu_0\cdot4$, $-\mu_0\cdot4$, ו-$\mu_0(4 - 4) = 0$.
      - kind: reasoning
        text: >-
          ג. השדה של קווים טעונים במנוחה הוא אלקטרוסטטי: הרוטור שלו אפס בכל מקום, גם על הקווים, והסירקולציה אפס סביב כל מסלול. המטענים קובעים את השטף של $\vec E$ (הדיברגנץ), לא את הסירקולציה.
      - kind: limit
        text: >-
          אם מקרבים את שני התילים זה לזה עד שהם מתלכדים, הזרמים מבטלים זה את זה, ואין רוטור בשום מקום: גם הסירקולציה סביב כל אחד מהם בנפרד הופכת לסירקולציה סביב שניהם, אפס.
      - kind: units
        text: >-
          $\mu_0 I$: $\dfrac{\text{T}\cdot\text{m}}{\text{A}}\cdot\text{A} = \text{T}\cdot\text{m}$; $4\pi\cdot10^{-7}\cdot4 \approx 5.03\cdot10^{-6}\,\text{T}\cdot\text{m}$.
      - kind: result
        text: >-
          א. רק בתוך התילים. ב. $+5.03\cdot10^{-6}$, $-5.03\cdot10^{-6}$, $0\,\text{T}\cdot\text{m}$. ג. ל-$\vec E$ הכל אפס.

challenge:
  - id: W-6.8-c1
    stars: 1
    objectives: [OBJ-6.8-1, OBJ-6.8-3]
    prompt: >-
      על חלקיק פועל הכוח $\vec F = A\,(2y^2,\ x^2)$, עם $A = 3\,\text{N/m}^2$ ($x$ ו-$y$ במטרים). מעבירים את החלקיק לאורך משולש: מהראשית אל $(0,\ \ell)$, משם אל $(\ell,\ 0)$, ובחזרה לראשית, עם $\ell = 2\,\text{m}$.

      א. חשבו את העבודה של הכוח לאורך כל אחת משלוש הצלעות, ואת העבודה הכוללת.

      ב. חשבו אותה שוב בעזרת משפט סטוקס. שימו לב לכיוון ההליכה.

      ג. האם הכוח משמר?
    answer: >-
      א. $0$, $A\ell^3/3$ ו-$0$: יחד $A\ell^3/3 = 8\,\text{J}$.

      ב. $(\nabla\times\vec F)_z = A(2x - 4y)$, והמסלול עם כיוון השעון; התוצאה $8\,\text{J}$.

      ג. לא: העבודה סביב מסלול סגור שונה מאפס.
    solution:
      - kind: law
        text: >-
          $W = \oint \vec F\cdot d\vec l = \int (\nabla\times\vec F)\cdot d\vec A$, עם $d\vec A$ בכיוון שכלל יד ימין קובע לפי כיוון ההליכה.
      - kind: manipulation
        text: >-
          א. על הצלע הראשונה $x = 0$ ו-$d\vec l$ לאורך $y$: $F_y = Ax^2 = 0$. על השלישית $y = 0$ ו-$d\vec l$ לאורך $x$: $F_x = 2Ay^2 = 0$. על השנייה $x = t$, $y = \ell - t$, עם $t$ מ-$0$ עד $\ell$, $dx = dt$ ו-$dy = -dt$:

          $W_2 = \int_0^\ell A\big(2(\ell - t)^2 - t^2\big)\,dt = A\Big(\dfrac{2\ell^3}{3} - \dfrac{\ell^3}{3}\Big) = \dfrac{A\ell^3}{3}$.
      - kind: manipulation
        text: >-
          ב. $(\nabla\times\vec F)_z = \partial(Ax^2)/\partial x - \partial(2Ay^2)/\partial y = A(2x - 4y)$. המסלול עולה לאורך ציר $y$, יורד באלכסון ימינה, וחוזר שמאלה: זו הליכה **עם** כיוון השעון, ולכן $d\vec A$ לתוך הדף, והעבודה היא **מינוס** השטף של הרכיב $z$. על המשולש $\int x\,dA = \int y\,dA = \ell^3/6$, ולכן $\int (2x - 4y)\,dA = -\ell^3/3$, והעבודה $-A\cdot(-\ell^3/3) = A\ell^3/3$.
      - kind: substitution
        text: >-
          $W = \dfrac{3\cdot2^3}{3} = 8\,\text{J}$.
      - kind: limit
        text: >-
          כש-$\ell \to 0$ העבודה קטנה כמו $\ell^3$, מהר יותר מהשטח ($\ell^2$): היחס שואף לאפס, כמו הרוטור בראשית, $A(2\cdot0 - 4\cdot0) = 0$. בכוח משמר, למשל $\vec F = A(2xy,\ x^2)$, הרוטור היה $2Ax - 2Ax = 0$, והעבודה אפס.
      - kind: units
        text: >-
          $A\ell^3$: $\dfrac{\text{N}}{\text{m}^2}\cdot\text{m}^3 = \text{N}\cdot\text{m} = \text{J}$.
      - kind: result
        text: >-
          א, ב. $W = A\ell^3/3 = 8\,\text{J}$. ג. הכוח אינו משמר: הרוטור שלו לא אפס, והעבודה סביב המשולש $8\,\text{J}$.
    source:
      name: MIT OpenCourseWare, 8.022 Physics II (Fall 2004), Assignment 0
      year: 2004
      problem: 'Problem 3: line integrals and work around a triangle; is the force conservative?'
      url: https://ocw.mit.edu/courses/8-022-physics-ii-electricity-and-magnetism-fall-2004/6b4aa5630356e0e67fa1050a3e22463a_pset0.pdf
      verified: '2026-11-02'
      adapted: true

  - id: W-6.8-c2
    stars: 2
    objectives: [OBJ-6.8-2, OBJ-6.8-3]
    prompt: >-
      בפיזיקה מתקדמת משתמשים בשדה עזר, $\vec A$ (נקרא "הפוטנציאל הווקטורי"), שהרוטור שלו הוא השדה המגנטי: $\nabla\times\vec A = \vec B$. סליל ארוך מאוד, ברדיוס $R = 2\,\text{cm}$, עם $2000$ כריכות למטר וזרם של $1.5\,\text{A}$, יוצר בתוכו שדה אחיד $B = \mu_0 nI$ לאורך הציר, ובחוץ אין שדה. מהסימטריה, הקווים של $\vec A$ הם מעגלים סביב הציר, והגודל שלו תלוי רק ב-$s$.

      א. השתמשו במשפט סטוקס, $\oint \vec A\cdot d\vec l = \int \vec B\cdot d\vec A$, עם מעגל ברדיוס $s$, כדי למצוא את $A(s)$ בתוך הסליל ומחוצה לו.

      ב. מה $A$ ב-$s = 1\,\text{cm}$ וב-$s = 5\,\text{cm}$?

      ג. מחוץ לסליל $\vec A$ שונה מאפס, והקווים שלו מעגלים, אבל $\vec B = 0$. הסבירו בעזרת הרוטור למה אין כאן סתירה.
    answer: >-
      א. בפנים $A = \dfrac{Bs}{2}$; בחוץ $A = \dfrac{BR^2}{2s}$, עם $B = \mu_0 nI \approx 3.77\cdot10^{-3}\,\text{T}$.

      ב. $1.88\cdot10^{-5}\,\text{T}\cdot\text{m}$ ו-$1.51\cdot10^{-5}\,\text{T}\cdot\text{m}$.

      ג. בחוץ $\vec A$ הוא שדה מערבולת, $\propto(-y,\ x)/s^2$, שהרוטור שלו אפס.
    solution:
      - kind: law
        text: >-
          משפט סטוקס: $\oint \vec A\cdot d\vec l = \int (\nabla\times\vec A)\cdot d\vec A = \int \vec B\cdot d\vec A$, השטף המגנטי דרך המעגל.
      - kind: manipulation
        text: >-
          א. על המעגל $\vec A$ משיק ובגודל קבוע, ולכן הסירקולציה $A\cdot2\pi s$. בפנים השטף $B\pi s^2$, ולכן $A = Bs/2$. בחוץ השטף כולו בתוך הסליל, $B\pi R^2$, ולכן $A = \dfrac{BR^2}{2s}$.
      - kind: substitution
        text: >-
          ב. $B = 4\pi\cdot10^{-7}\cdot2000\cdot1.5 \approx 3.77\cdot10^{-3}\,\text{T}$. ב-$1\,\text{cm}$: $A = \dfrac{3.77\cdot10^{-3}\cdot0.01}{2} \approx 1.88\cdot10^{-5}\,\text{T}\cdot\text{m}$. ב-$5\,\text{cm}$: $A = \dfrac{3.77\cdot10^{-3}\cdot(0.02)^2}{2\cdot0.05} \approx 1.51\cdot10^{-5}\,\text{T}\cdot\text{m}$.
      - kind: manipulation
        text: >-
          ג. בפנים $\vec A = \dfrac{B}{2}(-y,\ x,\ 0)$, סיבוב קשיח: $(\nabla\times\vec A)_z = 2\cdot\dfrac{B}{2} = B$, כמו שצריך. בחוץ $\vec A = \dfrac{BR^2}{2}\,\dfrac{(-y,\ x,\ 0)}{x^2 + y^2}$, בדיוק הצורה של השדה מחוץ לתיל דק, שהרוטור שלו אפס. קווים מעגליים בלי רוטור: $\vec B = \nabla\times\vec A = 0$ בחוץ.
      - kind: limit
        text: >-
          ב-$s = R$ שני הביטויים נותנים $BR/2$: $\vec A$ רציף. רחוק מאוד, $s \to \infty$, $A \to 0$ כמו $1/s$. והסירקולציה של $\vec A$ סביב כל מעגל בחוץ היא $B\pi R^2$, השטף בסליל, לא משנה כמה רחוק המעגל.
      - kind: units
        text: >-
          $\vec A$ נמדד ב-$\text{T}\cdot\text{m}$, כי הרוטור שלו, נגזרת לפי מרחק, הוא $\text{T}$; $Bs$ אכן ב-$\text{T}\cdot\text{m}$.
      - kind: result
        text: >-
          א. $Bs/2$ בפנים, $BR^2/(2s)$ בחוץ. ב. $1.88\cdot10^{-5}$ ו-$1.51\cdot10^{-5}\,\text{T}\cdot\text{m}$. ג. בחוץ $\vec A$ הוא שדה מערבולת, עם רוטור אפס.
    source:
      name: MIT OpenCourseWare, 8.022 Physics II (Fall 2004), Assignment 6
      year: 2004
      problem: 'Problem 6: vector potential of an infinite solenoid, from the line integral of A round a loop'
      url: https://ocw.mit.edu/courses/8-022-physics-ii-electricity-and-magnetism-fall-2004/5db3a1c1688d82a8e18c360ae4fabe99_pset6.pdf
      verified: '2026-11-02'
      adapted: true
