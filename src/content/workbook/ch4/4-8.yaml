# Workbook, lesson 4.8 (force on a current-carrying wire). Format and rules: see .claude/CLAUDE.md, "Worked examples, workbook".
# Every number was recomputed with src/physics/magnetism.ts (wireForce, wireForceVec), src/physics/wireforce.ts
# (balanceField, bentWireForce, carrierCount) and src/physics/circuits.ts (driftSpeed); script nums.ts in the session scratchpad.
# Directions: F = I L×B, x right, y up the page, z out of the page.
# In a >- block, consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '4.8'
practice:
  - id: W-4.8-01
    level: basic
    qualitative: false
    objectives: [OBJ-4.8-2, OBJ-4.8-3]
    prompt: >-
      קו חשמל אופקי נמתח ממזרח למערב בין שני עמודים שהמרחק ביניהם $50\,\text{m}$, ובו זורם זרם של $100\,\text{A}$ מזרחה. הניחו שהשדה המגנטי של כדור הארץ במקום אופקי, $3.2\cdot10^{-5}\,\text{T}$, וכיוונו צפונה.

      א. מה גודל הכוח המגנטי על הקטע שבין שני העמודים?

      ב. מה כיוון הכוח?
    answer: >-
      א. $0.16\,\text{N}$.

      ב. אנכית למעלה.
    solution:
      - kind: given
        text: >-
          $L = 50\,\text{m}$, $I = 100\,\text{A}$ מזרחה, $B = 3.2\cdot10^{-5}\,\text{T}$ צפונה. מזרח ניצב לצפון, ולכן $\alpha = 90^\circ$.
      - kind: formula
        text: >-
          $F = BIL\sin\alpha$, והכיוון בכלל כף יד ימין: האצבעות בכיוון השדה, האגודל בכיוון הזרם.
      - kind: substitution
        text: >-
          א. $F = 3.2\cdot10^{-5}\cdot100\cdot50\cdot1 = 0.16\,\text{N}$.

          ב. דמיינו שאתם מסתכלים על מפה שמונחת על הרצפה: האצבעות צפונה, האגודל מזרחה. כף היד פונה אל התקרה.
      - kind: result
        text: >-
          א. $0.16\,\text{N}$, כוח זניח לעומת המשקל של כבל באורך $50\,\text{m}$.

          ב. אנכית למעלה.

  - id: W-4.8-02
    level: basic
    qualitative: true
    objectives: [OBJ-4.8-2]
    prompt: >-
      באזור ריבועי יש שדה מגנטי אחיד לתוך הדף (⊗). שלושה תילים עוברים דרכו, ובכל אחד זורם זרם. קבעו ונמקו מה כיוון הכוח על כל תיל, או שאין כוח:

      א. תיל אופקי בדף, הזרם ימינה.

      ב. תיל אנכי בדף, הזרם למטה.

      ג. תיל שניצב לדף ועובר דרכו, והזרם בו לתוך הדף.
    answer: >-
      א. למעלה, בדף.

      ב. ימינה, בדף.

      ג. אין כוח: התיל מקביל לשדה.
    solution:
      - kind: reasoning
        text: >-
          בכל סעיף: כלל כף יד ימין, האצבעות בכיוון השדה (לתוך הדף), האגודל בכיוון הזרם, והכוח יוצא מכף היד, ניצב גם לתיל וגם לשדה.
      - kind: reasoning
        text: >-
          א. האגודל ימינה: כף היד פונה למעלה. הכוח בדף, ניצב לתיל.

          ב. האגודל למטה: כף היד פונה ימינה.

          ג. הזרם לתוך הדף, באותו כיוון כמו השדה: $\alpha = 0$, $\sin0 = 0$. אין כוח, אף שהתיל בתוך השדה ושזורם בו זרם.
      - kind: result
        text: >-
          א. למעלה. ב. ימינה. ג. אין כוח.

  - id: W-4.8-03
    level: basic
    qualitative: false
    objectives: [OBJ-4.8-3, OBJ-4.8-2]
    prompt: >-
      קטע של $5\,\text{cm}$ מתיל אופקי נמצא בשדה מגנטי אחיד של $0.2\,\text{T}$, החוצה מהדף (⊙). על התיל פועל כוח של $0.03\,\text{N}$, למטה בתוך הדף.

      א. מה הזרם בתיל?

      ב. מה כיוון הזרם?
    answer: >-
      א. $3\,\text{A}$.

      ב. ימינה.
    solution:
      - kind: given
        text: >-
          $L = 0.05\,\text{m}$, $B = 0.2\,\text{T}$, $F = 0.03\,\text{N}$, $\alpha = 90^\circ$ (התיל בדף, השדה ניצב לדף).
      - kind: formula
        text: >-
          $F = BIL\sin\alpha$.
      - kind: manipulation
        text: >-
          מחלקים את שני האגפים ב-$BL$ כדי לבודד את הזרם: $I = \dfrac{F}{BL}$.
      - kind: substitution
        text: >-
          א. $I = \dfrac{0.03}{0.2\cdot0.05} = 3\,\text{A}$.

          ב. האצבעות מצביעות אליכם (החוצה מהדף), וכף היד צריכה לפנות למטה. זה קורה כשהאגודל מצביע ימינה. (עם האגודל שמאלה, כף היד פונה למעלה.)
      - kind: result
        text: >-
          א. $3\,\text{A}$. ב. ימינה.

  - id: W-4.8-04
    level: mid
    qualitative: false
    objectives: [OBJ-4.8-3]
    prompt: >-
      קטע תיל באורך $30\,\text{cm}$, שכולו בתוך שדה מגנטי אחיד של $0.5\,\text{T}$, נושא זרם של $4\,\text{A}$. אפשר לסובב את הקטע במישור שבו נמצא השדה.

      א. מה הכוח הגדול ביותר שיכול לפעול על הקטע, ובאיזו זווית?

      ב. באילו זוויות בין הקטע לשדה הכוח הוא $0.3\,\text{N}$?

      ג. באילו זוויות אין כוח?
    answer: >-
      א. $0.6\,\text{N}$, כשהקטע ניצב לשדה.

      ב. $30^\circ$ או $150^\circ$.

      ג. $0$ ו-$180^\circ$: כשהקטע מקביל לשדה.
    solution:
      - kind: given
        text: >-
          $L = 0.3\,\text{m}$, $B = 0.5\,\text{T}$, $I = 4\,\text{A}$.
      - kind: formula
        text: >-
          $F = BIL\sin\alpha$. הערך הגדול ביותר של $\sin\alpha$ הוא 1, ב-$\alpha = 90^\circ$.
      - kind: substitution
        text: >-
          א. $F_{\max} = BIL = 0.5\cdot4\cdot0.3 = 0.6\,\text{N}$.
      - kind: manipulation
        text: >-
          ב. מחלקים את $F = BIL\sin\alpha$ ב-$BIL$: $\sin\alpha = \dfrac{F}{BIL} = \dfrac{0.3}{0.6} = 0.5$. בין $0$ ל-$180^\circ$ יש שתי זוויות שהסינוס שלהן $0.5$: $30^\circ$ ו-$180^\circ - 30^\circ = 150^\circ$.

          ג. $\sin\alpha = 0$ ב-$\alpha = 0$ וב-$\alpha = 180^\circ$.
      - kind: result
        text: >-
          א. $0.6\,\text{N}$, ב-$90^\circ$. ב. $30^\circ$ או $150^\circ$. ג. $0$ ו-$180^\circ$, כשהקטע מקביל לשדה.

  - id: W-4.8-05
    level: mid
    qualitative: false
    objectives: [OBJ-4.8-2, OBJ-4.8-3]
    prompt: >-
      תיל כפוף בצורת האות L נמצא כולו בשדה מגנטי אחיד של $0.4\,\text{T}$, לתוך הדף (⊗), ובו זורם זרם של $2\,\text{A}$. הזרם עובר תחילה בצלע אופקית באורך $10\,\text{cm}$, ימינה, ואחר כך בצלע אנכית באורך $10\,\text{cm}$, למעלה. שתי הצלעות בדף.

      א. מה גודל הכוח וכיוונו על כל צלע?

      ב. מה הכוח השקול על התיל כולו, גודלו וכיוונו?

      ג. השוו לכוח על תיל ישר, עם אותו זרם, שמחבר ישירות את נקודת ההתחלה של התיל לנקודת הסוף שלו.
    answer: >-
      א. על הצלע האופקית $0.08\,\text{N}$ למעלה; על האנכית $0.08\,\text{N}$ שמאלה.

      ב. כ-$0.113\,\text{N}$, באלכסון שמאלה-למעלה, בזווית $45^\circ$.

      ג. זהה: התיל הישר באורך כ-$14.1\,\text{cm}$ מקבל אותו כוח, באותו כיוון.
    solution:
      - kind: given
        text: >-
          $B = 0.4\,\text{T}$ (⊗), $I = 2\,\text{A}$, שתי צלעות של $0.1\,\text{m}$, שתיהן ניצבות לשדה.
      - kind: formula
        text: >-
          על כל צלע $F = BIL$, וכיוונו בכלל כף יד ימין. הכוח השקול הוא הסכום הווקטורי.
      - kind: substitution
        text: >-
          א. על כל צלע $F = 0.4\cdot2\cdot0.1 = 0.08\,\text{N}$. צלע אופקית, זרם ימינה: האצבעות לתוך הדף, האגודל ימינה, הכוח למעלה. צלע אנכית, זרם למעלה: האגודל למעלה, הכוח שמאלה.
      - kind: manipulation
        text: >-
          ב. שני הכוחות ניצבים זה לזה ושווים, ולכן לפי פיתגורס $F = \sqrt{0.08^2 + 0.08^2} = 0.08\sqrt{2} \approx 0.113\,\text{N}$, באמצע ביניהם: שמאלה-למעלה, $45^\circ$ מהאנך.

          ג. הקו הישר מנקודת ההתחלה לנקודת הסוף אורכו $\sqrt{0.1^2 + 0.1^2} \approx 0.141\,\text{m}$, באלכסון ימינה-למעלה, וגם הוא ניצב לשדה. הכוח עליו $0.4\cdot2\cdot0.141 \approx 0.113\,\text{N}$, ניצב לו: שמאלה-למעלה.
      - kind: result
        text: >-
          א. $0.08\,\text{N}$ למעלה, ו-$0.08\,\text{N}$ שמאלה. ב. כ-$0.113\,\text{N}$, שמאלה-למעלה. ג. אותו כוח: בשדה אחיד, הכוח על תיל כפוף שווה לכוח על תיל ישר בין הקצוות שלו.

  - id: W-4.8-06
    level: mid
    qualitative: true
    objectives: [OBJ-4.8-1]
    prompt: >-
      שני תילי נחושת, אחד עבה ואחד ששטח החתך שלו חצי משל העבה, עוברים באותו אזור של שדה מגנטי, בניצב לשדה, ובאותו אורך בתוך השדה. בשניהם זורם אותו זרם. קבעו ונמקו, בלי לחשב מספרים:

      א. באיזה תיל מהירות הסחיפה של האלקטרונים גדולה יותר, ופי כמה?

      ב. באיזה תיל יש יותר אלקטרונים חופשיים בקטע שבתוך השדה, ופי כמה?

      ג. על איזה תיל הכוח המגנטי גדול יותר?
    answer: >-
      א. בתיל הדק, פי 2.

      ב. בתיל העבה, פי 2.

      ג. הכוחות שווים.
    solution:
      - kind: formula
        text: >-
          $I = nevA$ (שיעור 3.2), מספר האלקטרונים בקטע $N = nAL$, והכוח על אלקטרון אחד $f = evB$ (שיעור 4.5).
      - kind: reasoning
        text: >-
          א. $v = \dfrac{I}{neA}$: אותו זרם, אותו $n$, ושטח חתך קטן פי 2, ולכן בתיל הדק האלקטרונים נסחפים מהר פי 2.

          ב. $N = nAL$: אותו $n$ ואותו $L$, ולכן בתיל העבה פי 2 אלקטרונים.

          ג. על כל אלקטרון בתיל הדק פועל כוח גדול פי 2 ($f \propto v$), אבל יש בו חצי מהאלקטרונים. המכפלה $Nf = nAL\cdot evB = (nevA)BL = BIL$ זהה.
      - kind: result
        text: >-
          א. בדק, פי 2. ב. בעבה, פי 2. ג. שווים: $F = BIL$ תלוי רק בזרם, לא בעובי התיל.

  - id: W-4.8-07
    level: mid
    qualitative: true
    objectives: [OBJ-4.8-4, OBJ-4.8-2]
    prompt: >-
      ברמקול, סליל קטן שמחובר לחרוט קל נמצא בשדה של מגנט קבוע. השדה במקום של הסליל פונה מהציר החוצה, לכל הכיוונים, כך שכל קטע של הכריכות ניצב לשדה. קבעו ונמקו:

      א. למה הכוחות על כל הקטעים של הכריכות מצטרפים לכוח אחד לאורך ציר הסליל, ולא מבטלים זה את זה?

      ב. מה קורה לחרוט אם מעבירים בסליל זרם קבוע? ואם הופכים את כיוונו?

      ג. מעבירים בסליל זרם שמחליף כיוון 200 פעמים בשנייה. מה עושה החרוט?

      ד. מגדילים את עוצמת הזרם המשתנה, בלי לשנות את הקצב. מה משתנה בקול?
    answer: >-
      א. בכל קטע גם הזרם וגם השדה מסתובבים יחד סביב הציר, ולכן הכוח, שניצב לשניהם, פונה בכל קטע לאותו כיוון לאורך הציר.

      ב. זרם קבוע דוחף את החרוט לצד אחד, והוא נשאר שם; זרם הפוך דוחף אותו לצד השני.

      ג. רוטט קדימה ואחורה, 200 פעמים בשנייה.

      ד. הכוח גדל, החרוט רוטט בתנודות גדולות יותר, והקול חזק יותר.
    solution:
      - kind: reasoning
        text: >-
          א. בכל קטע של הכריכה, הזרם משיק למעגל הכריכה, והשדה פונה מהציר החוצה, אל אותו קטע: שניהם במישור הכריכה, וניצבים זה לזה. הכוח ניצב לשניהם, כלומר לאורך הציר. כשעוברים לקטע אחר על הכריכה, גם הזרם וגם השדה מסתובבים באותה זווית, ולכן כלל כף יד ימין נותן בכל קטע את אותו כיוון לאורך הציר. בתיל ישר בשדה אחיד שני קטעים עם זרם הפוך היו מבטלים זה את זה, אבל כאן גם השדה מתהפך מצד לצד.
      - kind: reasoning
        text: >-
          ב. זרם קבוע נותן כוח קבוע: הסליל והחרוט זזים לצד אחד, עד שהקפיץ שמחזיק אותם מאזן את הכוח. בזרם הפוך הכוח הפוך, והחרוט זז לצד השני.

          ג. בכל פעם שהזרם מתהפך, הכוח מתהפך, ולכן החרוט נע הלוך ושוב בקצב של הזרם, ודוחף את האוויר באותו קצב.

          ד. $F = BIL$: זרם גדול יותר נותן כוח גדול יותר, והחרוט מתנודד בתנודות גדולות יותר.
      - kind: result
        text: >-
          א. הכוח על כל קטע לאורך הציר, באותו כיוון. ב. החרוט נדחף לצד אחד; בזרם הפוך, לצד השני. ג. רוטט 200 פעמים בשנייה. ד. הקול חזק יותר, באותו גובה צליל.

  - id: W-4.8-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-4.8-4, OBJ-4.8-3, OBJ-4.8-2]
    prompt: >-
      שתי מסילות מתכת אופקיות ומקבילות מונחות על שולחן, במרחק $20\,\text{cm}$ זו מזו, ומחוברות לספק זרם. מוט מתכת שמסתו $50\,\text{g}$ מונח בניצב לשתיהן. בכל האזור יש שדה מגנטי אנכי של $0.5\,\text{T}$, כלפי מעלה. במבט מלמעלה המסילות אופקיות בדף, המוט אנכי בדף, והזרם עובר במוט למעלה (בדף). מקדם החיכוך הסטטי בין המוט למסילות $0.3$, ומקדם החיכוך הקינטי $0.2$.

      א. במבט מלמעלה, לאיזה כיוון פועל הכוח המגנטי על המוט?

      ב. מה הזרם הקטן ביותר שמזיז את המוט?

      ג. הזרם $6\,\text{A}$. מה התאוצה של המוט ברגע הראשון שבו הוא מתחיל לנוע?
    answer: >-
      א. ימינה, לאורך המסילות.

      ב. $1.5\,\text{A}$.

      ג. $10\,\text{m/s}^2$.
    solution:
      - kind: given
        text: >-
          $L = 0.2\,\text{m}$ (האורך של המוט שהזרם עובר בו, בין המסילות), $m = 0.05\,\text{kg}$, $B = 0.5\,\text{T}$, $\mu_s = 0.3$, $\mu_k = 0.2$, $g = 10\,\text{m/s}^2$. במבט מלמעלה השדה, שכלפי מעלה, יוצא מהדף (⊙).
      - kind: reasoning
        text: >-
          א. כלל כף יד ימין: האצבעות אליכם (⊙), האגודל למעלה בדף, וכף היד פונה ימינה. הכוח אופקי, לאורך המסילות.
      - kind: formula
        text: >-
          $F = BIL$. המוט מתחיל לזוז כשהכוח המגנטי עולה על החיכוך הסטטי המרבי, $\mu_s mg$. כשהוא נע, החיכוך הוא $\mu_k mg$, והחוק השני של ניוטון נותן $ma = F - \mu_k mg$.
      - kind: manipulation
        text: >-
          ב. $BIL = \mu_s mg$, ומחלקים ב-$BL$: $I_{\min} = \dfrac{\mu_s mg}{BL}$.

          ג. מחלקים ב-$m$: $a = \dfrac{BIL - \mu_k mg}{m}$.
      - kind: substitution
        text: >-
          ב. $I_{\min} = \dfrac{0.3\cdot0.05\cdot10}{0.5\cdot0.2} = \dfrac{0.15}{0.1} = 1.5\,\text{A}$.

          ג. $F = 0.5\cdot6\cdot0.2 = 0.6\,\text{N}$, החיכוך $0.2\cdot0.05\cdot10 = 0.1\,\text{N}$, ולכן $a = \dfrac{0.6 - 0.1}{0.05} = 10\,\text{m/s}^2$.
      - kind: result
        text: >-
          א. ימינה. ב. $1.5\,\text{A}$. ג. $10\,\text{m/s}^2$, ימינה. (כשהמוט כבר נע, קורה עוד משהו שמשנה את הזרם, ונלמד עליו בפרק 5.)

  - id: W-4.8-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-4.8-4, OBJ-4.8-3, OBJ-4.8-2]
    prompt: >-
      מוט מתכת אופקי, שמסתו $40\,\text{g}$ ואורכו $20\,\text{cm}$, תלוי משני קצותיו בשני חוטים קלים ומוליכים. בשרטוט רואים את המוט מהצד: הוא ניצב לדף, והחוטים בדף. בכל האזור יש שדה מגנטי אנכי של $0.5\,\text{T}$, כלפי מעלה. מעבירים במוט זרם של $2\,\text{A}$, לתוך הדף (⊗). הזניחו את הכוחות על החוטים.

      א. לאיזה כיוון נדחף המוט?

      ב. המוט נע הצידה ונעצר במצב שיווי משקל חדש, שבו החוטים נטויים מהאנך. מה זווית הנטייה של החוטים, ומה המתיחות בכל חוט?

      ג. מה הזרם שבו החוטים נטויים ב-$45^\circ$?
    answer: >-
      א. ימינה, אופקית.

      ב. כ-$26.6^\circ$ מהאנך; כ-$0.224\,\text{N}$ בכל חוט.

      ג. $4\,\text{A}$.
    solution:
      - kind: given
        text: >-
          $m = 0.04\,\text{kg}$, ולכן $mg = 0.4\,\text{N}$; $L = 0.2\,\text{m}$, $B = 0.5\,\text{T}$ למעלה, $I = 2\,\text{A}$ (⊗). המוט ניצב לשדה.
      - kind: reasoning
        text: >-
          א. כלל כף יד ימין: האצבעות למעלה, האגודל לתוך הדף. כף היד פונה ימינה. הכוח אופקי, ניצב גם למוט וגם לשדה.
      - kind: formula
        text: >-
          $F = BIL$. בשיווי משקל, שלושה כוחות: המשקל (למטה), הכוח המגנטי (ימינה) והמתיחות הכוללת של שני החוטים, $2T$, לאורך החוטים. הרכיב האנכי של המתיחות מאזן את המשקל, והאופקי את הכוח המגנטי: $2T\cos\theta = mg$, $2T\sin\theta = F$.
      - kind: manipulation
        text: >-
          מחלקים את המשוואה השנייה בראשונה: $\tan\theta = \dfrac{F}{mg}$. מעלים בריבוע ומחברים: $2T = \sqrt{F^2 + (mg)^2}$.
      - kind: substitution
        text: >-
          ב. $F = 0.5\cdot2\cdot0.2 = 0.2\,\text{N}$. $\tan\theta = \dfrac{0.2}{0.4} = 0.5$, ולכן $\theta \approx 26.6^\circ$. $2T = \sqrt{0.2^2 + 0.4^2} \approx 0.447\,\text{N}$, ובכל חוט $T \approx 0.224\,\text{N}$.

          ג. ב-$45^\circ$, $\tan\theta = 1$, כלומר $F = mg = 0.4\,\text{N}$. מבודדים את הזרם: $I = \dfrac{mg}{BL} = \dfrac{0.4}{0.5\cdot0.2} = 4\,\text{A}$.
      - kind: result
        text: >-
          א. ימינה. ב. $\theta \approx 26.6^\circ$, $T \approx 0.224\,\text{N}$ בכל חוט. ג. $4\,\text{A}$.

  - id: W-4.8-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-4.8-4]
    prompt: >-
      במאזני זרם, הצלע של המסגרת שבתוך השדה, בניצב לו, באורך $4\,\text{cm}$. תלמידה מאזנת את המאזניים בלי זרם, ואחר כך מודדת, בכמה זרמים, את המסה שצריך להוסיף לכף השנייה כדי לחזור לאיזון:

      $$\begin{array}{c|ccccc} I\ (\text{A}) & 1 & 2 & 3 & 4 & 5 \\ \hline m\ (\text{g}) & 0.33 & 0.62 & 0.98 & 1.27 & 1.63 \end{array}$$

      א. הראו שלפי התאוריה הגרף של $m$ כפונקציה של $I$ הוא קו ישר שעובר בראשית, וכתבו את השיפוע שלו בעזרת $B$, $L$ ו-$g$.

      ב. מצאו את שיפוע קו ההתאמה הטוב ביותר, ומה עוצמת השדה.

      ג. תלמיד אחר שכח לאזן את המאזניים לפני שהפעיל זרם. איך זה ישפיע על הגרף שלו, ועל השדה שימצא מהשיפוע?
    answer: >-
      א. $m = \dfrac{BL}{g}\,I$, שיפוע $\dfrac{BL}{g}$.

      ב. שיפוע כ-$0.325\,\text{g/A}$, ו-$B \approx 0.081\,\text{T}$.

      ג. כל הנקודות יוזזו באותה מסה, והקו לא יעבור בראשית; השיפוע, ולכן גם השדה, לא ישתנה.
    solution:
      - kind: formula
        text: >-
          במצב מאוזן משקל המסה שהוספה שווה לכוח המגנטי על הצלע שבשדה: $mg = BIL$.
      - kind: manipulation
        text: >-
          א. מחלקים ב-$g$: $m = \dfrac{BL}{g}\cdot I$. זו משוואה של קו ישר, $m = kI$, בלי איבר חופשי, ולכן הוא עובר בראשית, והשיפוע $k = \dfrac{BL}{g}$. מבודדים את השדה: $B = \dfrac{gk}{L}$.
      - kind: substitution
        text: >-
          ב. בקו ההתאמה הטוב ביותר (שיעור 0.4) לחמש הנקודות השיפוע $k \approx 0.325\,\text{g/A} = 3.25\cdot10^{-4}\,\text{kg/A}$, והוא חותך את ציר המסה כמעט בראשית (בכ-$-0.01\,\text{g}$, בתוך פיזור המדידות). אפשר לבדוק בערך בעזרת שתי הנקודות הקיצוניות: $\dfrac{1.63 - 0.33}{5 - 1} = 0.325\,\text{g/A}$. ואז $B = \dfrac{10\cdot3.25\cdot10^{-4}}{0.04} \approx 0.081\,\text{T}$.
      - kind: reasoning
        text: >-
          ג. אם המאזניים לא היו מאוזנים בהתחלה, לכל מדידה מתווספת אותה מסה קבועה (חיובית או שלילית), שצריך רק כדי לבטל את חוסר האיזון ההתחלתי. הנקודות עולות או יורדות כולן באותה מידה: הקו מוזז, ולא עובר בראשית, אבל השיפוע לא משתנה. זה היתרון של חישוב מהשיפוע על פני חישוב ממדידה אחת.
      - kind: result
        text: >-
          א. קו ישר דרך הראשית, שיפוע $BL/g$. ב. $k \approx 0.325\,\text{g/A}$, $B \approx 0.081\,\text{T}$. ג. הקו מוזז ולא עובר בראשית, והשדה שמתקבל מהשיפוע לא משתנה.

challenge:
  - id: W-4.8-c1
    stars: 1
    objectives: [OBJ-4.8-4, OBJ-4.8-2, OBJ-4.8-3]
    prompt: >-
      מישור משופע חלק נוטה בזווית $30^\circ$ לאופק, והוא עולה ימינה. על המישור מונח מוט מתכת אופקי, ניצב לדף, שמסת כל מטר ממנו $0.3\,\text{kg}$. בכל האזור יש שדה מגנטי אנכי של $0.2\,\text{T}$, כלפי מעלה, ובמוט זורם זרם.

      א. מה צריכים להיות גודל הזרם וכיוונו, כדי שהמוט יישאר במנוחה?

      ב. מסובבים את השדה, כך שיהיה ניצב למישור המשופע, ושוב מתאימים את הזרם כך שהמוט במנוחה. מה הזרם עכשיו? הסבירו למה הוא קטן יותר.
    answer: >-
      א. כ-$8.7\,\text{A}$, לתוך הדף (⊗).

      ב. $7.5\,\text{A}$: כל הכוח המגנטי פועל עכשיו לאורך המישור, במעלה המדרון.
    solution:
      - kind: given
        text: >-
          $\dfrac{m}{L} = 0.3\,\text{kg/m}$, $\theta = 30^\circ$, $B = 0.2\,\text{T}$ (למעלה), $g = 10\,\text{m/s}^2$. המוט ניצב לשדה האנכי, ולכן $F = BIL$.
      - kind: reasoning
        text: >-
          כיוון: הכוח המגנטי ניצב לשדה האנכי, כלומר אופקי. כדי לאזן את רכיב המשקל במורד המדרון (שמאלה-למטה), הוא צריך לפנות ימינה, אל צד המדרון העולה. בכלל כף יד ימין, עם האצבעות למעלה, כף היד פונה ימינה כשהאגודל מצביע לתוך הדף.
      - kind: formula
        text: >-
          לאורך המישור (אין חיכוך): הרכיב של הכוח המגנטי האופקי במעלה המדרון, $F\cos\theta$, מאזן את רכיב המשקל במורד, $mg\sin\theta$. הכוח הנורמלי ניצב למישור ולא נכנס לחשבון הזה.
      - kind: manipulation
        text: >-
          א. $BIL\cos\theta = mg\sin\theta$. מחלקים ב-$BL\cos\theta$: $I = \dfrac{(m/L)\,g\tan\theta}{B}$.

          ב. כשהשדה ניצב למישור, הכוח המגנטי (ניצב לשדה ולמוט) פועל לאורך המישור, ואם הזרם בכיוון המתאים, במעלה המדרון: $BIL = mg\sin\theta$, ולכן $I = \dfrac{(m/L)\,g\sin\theta}{B}$.
      - kind: substitution
        text: >-
          א. $I = \dfrac{0.3\cdot10\cdot\tan30^\circ}{0.2} \approx \dfrac{3\cdot0.577}{0.2} \approx 8.66\,\text{A}$.

          ב. $I = \dfrac{0.3\cdot10\cdot0.5}{0.2} = 7.5\,\text{A}$. בסעיף א רק הרכיב $F\cos\theta$ של הכוח עזר לאזן, ושאר הכוח, $F\sin\theta$, רק לחץ את המוט אל המישור. עכשיו כל הכוח עובד במעלה המדרון, ולכן מספיק כוח קטן יותר.
      - kind: result
        text: >-
          א. כ-$8.7\,\text{A}$, לתוך הדף. ב. $7.5\,\text{A}$.
    source:
      name: JEE Main
      year: 2022
      problem: 'July session, Shift 1: a metallic rod of linear density 0.45 kg/m on a smooth 45° incline in a vertical field of 0.15 T (minimum current); adapted to 30°, 0.3 kg/m, 0.2 T, with an added part'
      url: https://www.canvasclasses.in/the-crucible/q/b35d0df6-e17a-427d-a651-e5273789de72
      verified: '2026-11-02'
      adapted: true

  - id: W-4.8-c2
    stars: 2
    objectives: [OBJ-4.8-2, OBJ-4.8-3]
    prompt: >-
      תיל דק וגמיש מאוד, באורך $50\,\text{cm}$, מחובר בשני קצותיו לשתי נקודות קבועות שצמודות כמעט זו לזו, כך שהוא יוצר לולאה רפויה במישור הדף. דרך הנקודות מעבירים בו זרם של $3\,\text{A}$, ובלולאה הזרם זורם בכיוון השעון. מפעילים שדה מגנטי אחיד של $0.25\,\text{T}$, לתוך הדף (⊗). הזניחו את כוח הכובד.

      א. הראו שעל כל קטע קטן של התיל פועל כוח שמכוון החוצה מהלולאה, ניצב לתיל, ושגודלו לכל סנטימטר של תיל זהה בכל מקום. לאיזו צורה מגיע התיל, ומה הרדיוס שלה?

      ב. מה המתיחות בתיל? רמז: חשבו על חצי מהלולאה. החליפו אותו בהרבה קטעים ישרים קצרים, והשתמשו בתוצאה של בעיה 5: הכוח על כל קטע הוא $BI$ כפול האורך שלו, ניצב לו.
    answer: >-
      א. מעגל, ברדיוס של כ-$8\,\text{cm}$.

      ב. $T = \dfrac{BIL}{2\pi} \approx 0.06\,\text{N}$.
    solution:
      - kind: reasoning
        text: >-
          א. בכל קטע של התיל, הזרם משיק ללולאה והשדה ניצב לדף, ולכן הכוח בדף וניצב לתיל. בראש הלולאה הזרם זורם בכיוון השעון, כלומר ימינה; עם האצבעות לתוך הדף והאגודל ימינה, כף היד פונה למעלה, החוצה מהלולאה. אותו דבר בכל נקודה: הכוח מכוון החוצה. גודלו לכל אורך הוא $BI$, אותו ערך בכל מקום, כי התיל תמיד ניצב לשדה. כוח שווה שדוחף החוצה בכל נקודה מותח את הלולאה לצורה הסימטרית שבה המתיחות שווה לאורכה: מעגל, שהיקפו אורך התיל.
      - kind: formula
        text: >-
          היקף המעגל $2\pi R = L$. ההחלפה ברמז: חצי מעגל מתחלף בשרשרת של קטעים ישרים קצרים. הכוח על כל קטע הוא $BI$ כפול האורך שלו, מסובב ב-$90^\circ$. כשמחברים את הקטעים ראש לזנב מקבלים את הקוטר; כשמסובבים כל אחד ב-$90^\circ$ ומחברים, מקבלים את הקוטר מסובב ב-$90^\circ$. לכן הכוח השקול על חצי המעגל הוא $BI\cdot2R$, ניצב לקוטר, כמו בבעיה 5.
      - kind: manipulation
        text: >-
          על חצי המעגל פועלים הכוח המגנטי השקול $2BIR$ (החוצה) ושני כוחות מתיחות בקצות החתך, כל אחד $T$, שמושכים לכיוון ההפוך. חצי המעגל בשיווי משקל: $2T = 2BIR$, כלומר $T = BIR = \dfrac{BIL}{2\pi}$.
      - kind: substitution
        text: >-
          א. $R = \dfrac{L}{2\pi} = \dfrac{0.5}{2\pi} \approx 0.0796\,\text{m}$.

          ב. $T = \dfrac{0.25\cdot3\cdot0.5}{2\pi} \approx 0.0597\,\text{N}$.
      - kind: result
        text: >-
          א. מעגל ברדיוס של כ-$8\,\text{cm}$. ב. $T \approx 0.06\,\text{N}$. בדיקת יחידות: $\text{T}\cdot\text{A}\cdot\text{m} = \text{N}$, כמו שצריך למתיחות.
    source:
      name: JEE Advanced (IIT-JEE)
      year: 2010
      problem: 'Paper 1, Question 62: a thin flexible wire of length L between two adjacent fixed points, current I clockwise, uniform field into the page; the tension (answer IBL/2π)'
      url: https://cracku.in/jee-advanced-2010-paper-1-question-paper-solved?page=7
      verified: '2026-11-02'
      adapted: true
