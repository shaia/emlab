lesson: '4.8'
practice:
  - id: W-4.8-01
    level: basic
    qualitative: true
    objectives: [OBJ-4.8-1]
    prompt: >-
      שתי רצועות ארוכות של נייר אלומיניום תלויות אנכית זו ליד זו, במישור הדף: רצועה A משמאל ורצועה C מימין.

      א. בשתי הרצועות הזרם זורם כלפי מטה. קבעו בעזרת כלל יד ימין את כיוון השדה של A במקום שבו נמצאת C (⊙ או ⊗), ובעזרת כלל כף יד ימין את כיוון הכוח על C. מה קורה לרצועות?

      ב. הופכים את הזרם ברצועה C, כך שהוא זורם כלפי מעלה. מה משתנה, ומה לא?
    answer: >-
      א. השדה של A במקום C יוצא מהדף (⊙); הכוח על C שמאלה, אל A. הרצועות מתקרבות.

      ב. השדה של A במקום C לא משתנה (⊙), אבל הכוח על C מתהפך, ימינה. הרצועות מתרחקות.
    solution:
      - kind: given
        text: >-
          שתי רצועות מקבילות במישור הדף, A משמאל ו-C מימין. ב-A הזרם כלפי מטה.
      - kind: reasoning
        text: >-
          א. כלל יד ימין על A: האגודל למטה, בכיוון הזרם. האצבעות המכופפות מקיפות את הרצועה; מימין לה הן יוצאות מהדף, אליכם. לכן במקום C השדה של A הוא ⊙.
      - kind: reasoning
        text: >-
          כלל כף יד ימין על C: האצבעות אליכם, בכיוון השדה (⊙); האגודל למטה, בכיוון הזרם ב-C. כף היד פונה שמאלה, אל A. באותו אופן גם על A פועל כוח ימינה, אל C. זרמים באותו כיוון נמשכים.
      - kind: reasoning
        text: >-
          ב. השדה של A תלוי רק בזרם ב-A, ולכן במקום C הוא עדיין ⊙. עכשיו האגודל על C מצביע למעלה, וכף היד פונה ימינה, הרחק מ-A. זרמים בכיוונים מנוגדים נדחים.
      - kind: result
        text: >-
          א. השדה ⊙, הכוח על C אל A: הרצועות מתקרבות.

          ב. השדה במקום C לא משתנה; הכוח מתהפך, והרצועות מתרחקות.

  - id: W-4.8-02
    level: basic
    qualitative: false
    objectives: [OBJ-4.8-2]
    prompt: >-
      בשני תילים ארוכים ומקבילים, במרחק $4\,\text{cm}$ זה מזה, זורם $12\,\text{A}$ בכל אחד, באותו כיוון.

      א. מה השדה של תיל אחד במקום שבו נמצא התיל השני?

      ב. מה הכוח על כל מטר של כל תיל, ומה כיוונו?

      ג. מה הכוח על קטע של $30\,\text{cm}$ מאחד התילים?
    answer: >-
      א. $6\cdot10^{-5}\,\text{T}$.

      ב. $7.2\cdot10^{-4}\,\text{N/m}$, משיכה: כל תיל נמשך אל השני.

      ג. $2.16\cdot10^{-4}\,\text{N}$.
    solution:
      - kind: given
        text: >-
          $I_1 = I_2 = 12\,\text{A}$, $d = 0.04\,\text{m}$, $L = 0.30\,\text{m}$, הזרמים באותו כיוון.
      - kind: formula
        text: >-
          $B = \dfrac{\mu_0 I}{2\pi r}$, $\dfrac{F}{L} = \dfrac{\mu_0 I_1 I_2}{2\pi d}$, ו-$F = \dfrac{F}{L}\cdot L$.
      - kind: substitution
        text: >-
          א. $B = \dfrac{4\pi\cdot10^{-7}\cdot12}{2\pi\cdot0.04} = 6\cdot10^{-5}\,\text{T}$.

          ב. $\dfrac{F}{L} = B\cdot I_2 = 6\cdot10^{-5}\cdot12 = 7.2\cdot10^{-4}\,\text{N/m}$. הזרמים באותו כיוון, ולכן התילים נמשכים.

          ג. $F = 7.2\cdot10^{-4}\cdot0.30 = 2.16\cdot10^{-4}\,\text{N}$.
      - kind: result
        text: >-
          א. $6\cdot10^{-5}\,\text{T}$. ב. $7.2\cdot10^{-4}\,\text{N/m}$, משיכה. ג. $2.16\cdot10^{-4}\,\text{N}$.

  - id: W-4.8-03
    level: basic
    qualitative: false
    objectives: [OBJ-4.8-4]
    prompt: >-
      א. לפי ההגדרה ההיסטורית של האמפר, מה הכוח על קטע של $5\,\text{m}$ מתיל, כשבשני תילים ארוכים מאוד, במרחק מטר זה מזה, זורם אמפר אחד?

      ב. מה יהיה הכוח על אותו קטע אם בכל תיל יזרום $2\,\text{A}$ והמרחק יהיה $0.5\,\text{m}$?

      ג. לפי ההגדרה שבתוקף מאז 2019, כמה מטענים יסודיים עוברים בכל שנייה בתיל שזורם בו אמפר אחד? השתמשו ב-$e = 1.6\cdot10^{-19}\,\text{C}$.
    answer: >-
      א. $1\cdot10^{-6}\,\text{N}$.

      ב. $8\cdot10^{-6}\,\text{N}$.

      ג. $6.25\cdot10^{18}$.
    solution:
      - kind: given
        text: >-
          לפי ההגדרה: $I = 1\,\text{A}$, $d = 1\,\text{m}$ נותנים $\dfrac{F}{L} = 2\cdot10^{-7}\,\text{N/m}$. אורך הקטע $L = 5\,\text{m}$.
      - kind: formula
        text: >-
          $\dfrac{F}{L} = \dfrac{\mu_0 I_1 I_2}{2\pi d}$, $F = \dfrac{F}{L}\cdot L$, ומספר המטענים היסודיים בשנייה $N = \dfrac{I\cdot1\,\text{s}}{e}$.
      - kind: substitution
        text: >-
          א. $F = 2\cdot10^{-7}\cdot5 = 1\cdot10^{-6}\,\text{N}$.

          ב. המכפלה $I_1I_2$ גדלה פי $4$ והמרחק קטן פי $2$, ולכן הכוח גדל פי $8$: $\dfrac{F}{L} = 2\cdot10^{-7}\cdot\dfrac{2\cdot2}{0.5} = 1.6\cdot10^{-6}\,\text{N/m}$, ו-$F = 1.6\cdot10^{-6}\cdot5 = 8\cdot10^{-6}\,\text{N}$.

          ג. $N = \dfrac{1}{1.6\cdot10^{-19}} = 6.25\cdot10^{18}$.
      - kind: result
        text: >-
          א. $1\cdot10^{-6}\,\text{N}$. ב. $8\cdot10^{-6}\,\text{N}$. ג. $6.25\cdot10^{18}$ מטענים יסודיים בשנייה. (עם הערך המדויק של $e$ מתקבל כ-$6.24\cdot10^{18}$.)

  - id: W-4.8-04
    level: mid
    qualitative: true
    objectives: [OBJ-4.8-3]
    prompt: >-
      בתיל 1 זורם $40\,\text{A}$ ובתיל 2 זורם $10\,\text{A}$, באותו כיוון. התילים ארוכים, מקבילים, ובמרחק $8\,\text{cm}$ זה מזה. תלמיד אומר: "תיל 1 מושך את תיל 2 בכוח גדול פי 4."

      א. חשבו את השדה של כל תיל במקום התיל השני, ואת הכוח על כל מטר של כל תיל. האם התלמיד צודק?

      ב. שני התילים חופשיים לזוז. המסה של כל מטר של תיל 2 היא רבע מהמסה של כל מטר של תיל 1. קבעו ונמקו: לאיזה תיל תאוצה גדולה יותר, ופי כמה? האם זה סותר את תשובתכם בסעיף א?
    answer: >-
      א. $B_1 = 1\cdot10^{-4}\,\text{T}$ במקום תיל 2, $B_2 = 2.5\cdot10^{-5}\,\text{T}$ במקום תיל 1; על כל תיל $1\cdot10^{-3}\,\text{N/m}$. התלמיד טועה.

      ב. לתיל 2, פי 4. זה לא סותר: הכוחות שווים, והמסות שונות.
    solution:
      - kind: given
        text: >-
          $I_1 = 40\,\text{A}$, $I_2 = 10\,\text{A}$, $d = 0.08\,\text{m}$.
      - kind: formula
        text: >-
          $B = \dfrac{\mu_0 I}{2\pi r}$. על כל מטר של תיל פועל $BI$, עם השדה של התיל **האחר** והזרם של התיל עצמו. החוק השני של ניוטון: $a = \dfrac{F}{m}$.
      - kind: substitution
        text: >-
          א. $B_1 = \dfrac{4\pi\cdot10^{-7}\cdot40}{2\pi\cdot0.08} = 1\cdot10^{-4}\,\text{T}$, $B_2 = \dfrac{4\pi\cdot10^{-7}\cdot10}{2\pi\cdot0.08} = 2.5\cdot10^{-5}\,\text{T}$. על תיל 2: $B_1I_2 = 1\cdot10^{-4}\cdot10 = 1\cdot10^{-3}\,\text{N/m}$. על תיל 1: $B_2I_1 = 2.5\cdot10^{-5}\cdot40 = 1\cdot10^{-3}\,\text{N/m}$.
      - kind: reasoning
        text: >-
          תיל 1 יוצר שדה חזק פי 4, אבל השדה הזה פועל על זרם קטן פי 4. הכוחות שווים בגודלם והפוכים בכיוונם (החוק השלישי של ניוטון), ולכן התלמיד טועה.
      - kind: reasoning
        text: >-
          ב. על כל מטר של שני התילים פועל אותו כוח. לתיל 2 מסה קטנה פי 4 לכל מטר, ולכן לפי $a = F/m$ התאוצה שלו גדולה פי 4. החוק השלישי מדבר על כוחות, לא על תאוצות.
      - kind: result
        text: >-
          א. $1\cdot10^{-3}\,\text{N/m}$ על כל תיל; התלמיד טועה.

          ב. לתיל 2 תאוצה גדולה פי 4, בגלל המסה הקטנה, לא בגלל כוח גדול יותר.

  - id: W-4.8-05
    level: mid
    qualitative: false
    objectives: [OBJ-4.8-2]
    prompt: >-
      בשני תילים ארוכים ומקבילים זורמים $15\,\text{A}$ ו-$6\,\text{A}$.

      א. באיזה מרחק זה מזה צריך להציב אותם, כדי שהכוח על כל מטר יהיה $3\cdot10^{-4}\,\text{N/m}$?

      ב. באותו מרחק, מה צריך להיות הזרם בתיל השני כדי שהכוח יוכפל?
    answer: >-
      א. $6\,\text{cm}$.

      ב. $12\,\text{A}$.
    solution:
      - kind: given
        text: >-
          $I_1 = 15\,\text{A}$, $I_2 = 6\,\text{A}$, $\dfrac{F}{L} = 3\cdot10^{-4}\,\text{N/m}$.
      - kind: formula
        text: >-
          $\dfrac{F}{L} = \dfrac{\mu_0 I_1 I_2}{2\pi d}$.
      - kind: manipulation
        text: >-
          $d$ נמצא במכנה. כופלים את שני האגפים ב-$d$ ומחלקים ב-$\dfrac{F}{L}$, כדי לבודד אותו: $d = \dfrac{\mu_0 I_1 I_2}{2\pi\,(F/L)}$.
      - kind: substitution
        text: >-
          א. $d = \dfrac{4\pi\cdot10^{-7}\cdot15\cdot6}{2\pi\cdot3\cdot10^{-4}} = \dfrac{1.8\cdot10^{-5}}{3\cdot10^{-4}} = 0.06\,\text{m}$.

          ב. הכוח פרופורציוני ל-$I_2$, ולכן כדי להכפיל אותו מכפילים את $I_2$: $2\cdot6 = 12\,\text{A}$.
      - kind: result
        text: >-
          א. $d = 6\,\text{cm}$. ב. $I_2 = 12\,\text{A}$.

  - id: W-4.8-06
    level: mid
    qualitative: true
    objectives: [OBJ-4.8-3]
    prompt: >-
      שני תילים ארוכים ומקבילים קבועים במקומם, במרחק $12\,\text{cm}$ זה מזה: בתיל A זורם $10\,\text{A}$ ובתיל B זורם $20\,\text{A}$, שניהם החוצה מהדף (⊙). מציבים ביניהם, על הקו שמחבר אותם, תיל שלישי C שזורם בו $5\,\text{A}$ לתוך הדף (⊗).

      א. באיזה מרחק מתיל A צריך להציב את C, כדי שהכוח השקול עליו יהיה אפס?

      ב. קבעו ונמקו: האם התשובה משתנה אם הזרם ב-C יהיה $8\,\text{A}$ החוצה מהדף?
    answer: >-
      א. $4\,\text{cm}$ מתיל A.

      ב. לא. הגודל והכיוון של הזרם ב-C כופלים את שני הכוחות עליו באותה מידה.
    solution:
      - kind: given
        text: >-
          $I_A = 10\,\text{A}$ ⊙, $I_B = 20\,\text{A}$ ⊙, $AB = 0.12\,\text{m}$, $I_C = 5\,\text{A}$ ⊗. נסמן ב-$x$ את המרחק בין C ל-A; המרחק בין C ל-B הוא $0.12 - x$.
      - kind: reasoning
        text: >-
          הכיוונים: הזרם ב-C מנוגד לזרמים ב-A וב-B, ולכן A דוחה את C לעבר B, ו-B דוחה את C לעבר A. שני הכוחות בכיוונים מנוגדים, ולכן הם יכולים לבטל זה את זה.
      - kind: formula
        text: >-
          $\dfrac{F}{L} = \dfrac{\mu_0 I_1 I_2}{2\pi d}$ לכל זוג. בנקודת האיזון: $\dfrac{\mu_0 I_A I_C}{2\pi x} = \dfrac{\mu_0 I_B I_C}{2\pi(0.12 - x)}$.
      - kind: manipulation
        text: >-
          מחלקים את שני האגפים ב-$\dfrac{\mu_0 I_C}{2\pi}$, שמופיע בשניהם: $\dfrac{I_A}{x} = \dfrac{I_B}{0.12 - x}$. כופלים בשני המכנים: $I_A(0.12 - x) = I_B\,x$.
      - kind: substitution
        text: >-
          $10(0.12 - x) = 20x$, כלומר $1.2 = 30x$, ו-$x = 0.04\,\text{m}$. בדיקה: הכוח של A על C הוא $2\cdot10^{-7}\cdot\dfrac{10\cdot5}{0.04} = 2.5\cdot10^{-4}\,\text{N/m}$, והכוח של B הוא $2\cdot10^{-7}\cdot\dfrac{20\cdot5}{0.08} = 2.5\cdot10^{-4}\,\text{N/m}$.
      - kind: reasoning
        text: >-
          ב. $I_C$ התבטל בשלב הבידוד: הוא כופל את שני הכוחות באותה מידה. אם הזרם ב-C יהיה $8\,\text{A}$ החוצה מהדף, שני הכוחות יתהפכו (משיכה במקום דחייה) ויגדלו באותו יחס, וימשיכו לבטל זה את זה באותה נקודה.
      - kind: result
        text: >-
          א. $4\,\text{cm}$ מתיל A (ו-$8\,\text{cm}$ מתיל B).

          ב. לא, הנקודה לא תלויה בזרם ב-C.

  - id: W-4.8-07
    level: mid
    qualitative: true
    objectives: [OBJ-4.8-1]
    prompt: >-
      תיל ארוך A קבוע במקומו, ניצב לדף, והזרם בו יוצא מהדף (⊙). תיל שני, D, מקביל לו, ואפשר להציב אותו בארבעה מקומות במרחק $5\,\text{cm}$ מ-A: מעליו, מתחתיו, משמאלו ומימינו.

      א. ב-D הזרם יוצא מהדף (⊙). קבעו לכל אחד מארבעת המקומות את כיוון השדה של A במקום D ואת כיוון הכוח על D.

      ב. מה משתנה בתשובות אם הזרם ב-D נכנס לדף (⊗)?

      ג. נסחו במשפט אחד כלל לכיוון הכוח בין שני תילים מקבילים.
    answer: >-
      א. מעל: שדה שמאלה, כוח למטה. מתחת: שדה ימינה, כוח למעלה. משמאל: שדה למטה, כוח ימינה. מימין: שדה למעלה, כוח שמאלה. בכל המקומות הכוח מצביע אל A.

      ב. השדות לא משתנים; כל הכוחות מתהפכים ומצביעים הרחק מ-A.

      ג. הכוח פועל לאורך הקו שמחבר את התילים: אליו כשהזרמים באותו כיוון, וממנו כשהם מנוגדים.
    solution:
      - kind: reasoning
        text: >-
          השדה של A (⊙) מסתובב נגד כיוון השעון לפי כלל יד ימין. מעל A תנועה נגד כיוון השעון היא שמאלה, משמאלו למטה, מתחתיו ימינה, ומימינו למעלה. בכל מקום השדה ניצב לקו שמחבר את התילים.
      - kind: reasoning
        text: >-
          א. כלל כף יד ימין על D, עם האגודל אליכם (⊙): כשהאצבעות שמאלה (D מעל A), כף היד פונה למטה, אל A. כשהאצבעות ימינה (D מתחת), כף היד פונה למעלה. כשהאצבעות למטה (D משמאל), כף היד פונה ימינה. כשהאצבעות למעלה (D מימין), כף היד פונה שמאלה. בכל ארבעת המקרים הכוח מצביע אל A.
      - kind: reasoning
        text: >-
          ב. השדה של A תלוי רק ב-A, ולכן הוא לא משתנה. כשהאגודל מצביע לתוך הדף, כל כוח מתהפך, ועכשיו כל הכוחות מצביעים הרחק מ-A.
      - kind: result
        text: >-
          א. בכל ארבעת המקומות הכוח על D מצביע אל A. ב. השדות לא משתנים, והכוחות מצביעים הרחק מ-A. ג. זרמים באותו כיוון נמשכים, ובכיוונים מנוגדים נדחים, לאורך הקו שמחבר את התילים.

  - id: W-4.8-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-4.8-2, OBJ-4.8-1]
    prompt: >-
      תיל ארוך ואופקי קבוע על שולחן. מעליו, במקביל אליו, תיל דק שהמסה של כל מטר שלו היא $1.0\,\text{g}$. התיל העליון יכול לנוע רק למעלה ולמטה, לאורך מסילות אנכיות חלקות. בשני התילים זורם $20\,\text{A}$.

      א. באיזה כיוון צריכים לזרום הזרמים, כדי שהתיל העליון יוכל לרחף מעל התחתון? נמקו.

      ב. באיזה גובה מעל התיל התחתון ירחף התיל העליון? ($g = 10\,\text{m/s}^2$)

      ג. דוחפים את התיל העליון מעט כלפי מטה ומשחררים. קבעו ונמקו: האם הוא יחזור לגובה הריחוף, או ימשיך ליפול?

      ד. מה יהיה גובה הריחוף אם הזרם בשני התילים יוכפל?
    answer: >-
      א. בכיוונים מנוגדים, כדי שהתילים יידחו.

      ב. $8\,\text{mm}$.

      ג. יחזור: במרחק קטן יותר הדחייה חזקה יותר מהמשקל.

      ד. $3.2\,\text{cm}$, פי 4.
    solution:
      - kind: given
        text: >-
          המסה של כל מטר של התיל העליון $\lambda = 1.0\,\text{g/m} = 1.0\cdot10^{-3}\,\text{kg/m}$, $I_1 = I_2 = 20\,\text{A}$, $g = 10\,\text{m/s}^2$.
      - kind: reasoning
        text: >-
          א. המשקל מושך את התיל העליון למטה, ולכן הכוח המגנטי צריך לדחוף אותו למעלה, הרחק מהתיל התחתון: דחייה. תילים נדחים כשהזרמים בהם בכיוונים מנוגדים.
      - kind: formula
        text: >-
          ב. בריחוף הכוח המגנטי על כל מטר שווה למשקל של כל מטר: $\dfrac{\mu_0 I_1 I_2}{2\pi d} = \lambda g$.
      - kind: manipulation
        text: >-
          כופלים את שני האגפים ב-$d$ ומחלקים ב-$\lambda g$: $d = \dfrac{\mu_0 I_1 I_2}{2\pi\lambda g}$.
      - kind: substitution
        text: >-
          $d = \dfrac{4\pi\cdot10^{-7}\cdot20\cdot20}{2\pi\cdot1.0\cdot10^{-3}\cdot10} = \dfrac{8\cdot10^{-5}}{1\cdot10^{-2}} = 8\cdot10^{-3}\,\text{m}$.
      - kind: reasoning
        text: >-
          ג. כשהתיל העליון יורד, $d$ קטן, והכוח המגנטי, שפרופורציוני ל-$1/d$, גדל. המשקל לא משתנה. לכן הכוח השקול פונה למעלה ומחזיר את התיל: שיווי המשקל יציב (לתנועה למעלה ולמטה). אם התיל עולה מעט, הדחייה נחלשת, והמשקל מחזיר אותו למטה.
      - kind: reasoning
        text: >-
          ד. $d$ פרופורציוני ל-$I_1I_2$. כששני הזרמים מוכפלים, המכפלה גדלה פי 4, וגם $d$: $4\cdot8\,\text{mm} = 32\,\text{mm}$.
      - kind: result
        text: >-
          א. בכיוונים מנוגדים. ב. $d = 8\,\text{mm}$. ג. יחזור לגובה הריחוף. ד. $3.2\,\text{cm}$.

  - id: W-4.8-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-4.8-3]
    prompt: >-
      שלושה תילים ארוכים ומקבילים ניצבים לדף, בשלוש פינות של ריבוע שצלעו $5\,\text{cm}$: תיל A בפינה השמאלית התחתונה, תיל B בפינה הימנית התחתונה, ותיל C בפינה השמאלית העליונה. בשלושתם זורם $10\,\text{A}$ החוצה מהדף (⊙).

      א. מצאו את הכוח השקול (גודל וכיוון) על כל מטר של תיל A.

      ב. מוסיפים תיל רביעי, D, בפינה הימנית העליונה. מה צריכים להיות גודל הזרם ב-D וכיוונו, כדי שהכוח השקול על A יתאפס?
    answer: >-
      א. $5.66\cdot10^{-4}\,\text{N/m}$, ימינה-למעלה, בזווית $45^\circ$, לעבר מרכז הריבוע.

      ב. $20\,\text{A}$ לתוך הדף (⊗).
    solution:
      - kind: given
        text: >-
          צלע הריבוע $a = 0.05\,\text{m}$, האלכסון $a\sqrt{2} \approx 0.0707\,\text{m}$. $I_A = I_B = I_C = 10\,\text{A}$ ⊙.
      - kind: formula
        text: >-
          לכל זוג $\dfrac{F}{L} = \dfrac{\mu_0 I_1 I_2}{2\pi d}$, ו-$\dfrac{\mu_0}{2\pi} = 2\cdot10^{-7}\,\text{T}\cdot\text{m/A}$. הכוח השקול הוא הסכום הווקטורי.
      - kind: substitution
        text: >-
          א. B מושך את A ימינה: $2\cdot10^{-7}\cdot\dfrac{10\cdot10}{0.05} = 4\cdot10^{-4}\,\text{N/m}$. C מושך את A למעלה באותו גודל. הכוחות ניצבים: $\sqrt{2}\cdot4\cdot10^{-4} \approx 5.66\cdot10^{-4}\,\text{N/m}$, בזווית $45^\circ$, לאורך האלכסון אל D.
      - kind: reasoning
        text: >-
          ב. הכוח של D על A פועל לאורך האלכסון. כדי לבטל כוח שמצביע אל D, הכוח של D צריך להצביע הרחק מ-D: דחייה, ולכן הזרם ב-D מנוגד לזרם ב-A, כלומר לתוך הדף.
      - kind: manipulation
        text: >-
          הגודל: $\dfrac{\mu_0 I_A I_D}{2\pi a\sqrt{2}} = 5.66\cdot10^{-4}$. מבודדים את $I_D$: $I_D = \dfrac{5.66\cdot10^{-4}\cdot a\sqrt{2}}{2\cdot10^{-7}\cdot I_A}$.
      - kind: substitution
        text: >-
          $I_D = \dfrac{5.66\cdot10^{-4}\cdot0.0707}{2\cdot10^{-7}\cdot10} = 20\,\text{A}$. (בלי לעגל: $\sqrt{2}\cdot4\cdot10^{-4}\cdot\sqrt{2}\cdot0.05/(2\cdot10^{-6}) = 20$ בדיוק.)
      - kind: result
        text: >-
          א. $5.66\cdot10^{-4}\,\text{N/m}$, בזווית $45^\circ$ ימינה-למעלה. ב. $I_D = 20\,\text{A}$, לתוך הדף.

  - id: W-4.8-10
    level: bagrut
    qualitative: true
    objectives: [OBJ-4.8-2, OBJ-4.8-1]
    prompt: >-
      בלוח חשמל של מפעל, זרם עובר אל המכונות בפס מתכת ישר וחוזר בפס מקביל לו. אורך כל פס $2\,\text{m}$, והמרחק ביניהם $10\,\text{cm}$.

      א. קבעו ונמקו: האם הפסים מושכים או דוחים זה את זה?

      ב. מה הכוח על כל פס כשזורם בו זרם רגיל של $1000\,\text{A}$?

      ג. בקצר, הזרם קופץ ל-$20\,000\,\text{A}$. פי כמה גדל הכוח, ומה גודלו? למה מהנדסים מחברים את הפסים לתושבות חזקות?
    answer: >-
      א. דוחים: זרם הלוך וזרם חזור זורמים בכיוונים מנוגדים.

      ב. $4\,\text{N}$.

      ג. פי 400, $1600\,\text{N}$: כוח כזה יכול לעקם את הפסים ולקרוע אותם ממקומם.
    solution:
      - kind: given
        text: >-
          $L = 2\,\text{m}$, $d = 0.10\,\text{m}$; אותו זרם $I$ בשני הפסים, בכיוונים מנוגדים.
      - kind: reasoning
        text: >-
          א. הזרם שהולך אל המכונות בפס אחד חוזר בפס השני, ולכן הזרמים בכיוונים מנוגדים, והפסים נדחים.
      - kind: formula
        text: >-
          כשאותו זרם בשני הפסים: $F = \dfrac{\mu_0 I^2 L}{2\pi d}$.
      - kind: substitution
        text: >-
          ב. $F = \dfrac{4\pi\cdot10^{-7}\cdot1000^2\cdot2}{2\pi\cdot0.10} = 4\,\text{N}$.
      - kind: reasoning
        text: >-
          ג. הכוח פרופורציוני ל-$I^2$, כי אותו זרם עובר בשני הפסים. הזרם גדל פי 20, ולכן הכוח גדל פי $20^2 = 400$: $4\cdot400 = 1600\,\text{N}$, כמו משקל של $160\,\text{kg}$. כוח כזה, שפועל בבת אחת, יכול לעקם את הפסים, ולכן מחברים אותם לתושבות.
      - kind: result
        text: >-
          א. דוחים. ב. $4\,\text{N}$. ג. פי 400, $1600\,\text{N}$; בלי תושבות הפסים עלולים להתעקם.

challenge:
  - id: W-4.8-c1
    stars: 2
    objectives: [OBJ-4.8-1, OBJ-4.8-3]
    prompt: >-
      שני תילים ארוכים ומקבילים נמצאים במישור הדף, במרחק $X_0$ זה מזה. חלקיק טעון נע במישור הדף, בין התילים, במהירות $u$, ובמרחק $X_1$ מאחד התילים. כשבשני התילים זורם זרם $I$ באותו כיוון, רדיוס העקמומיות של מסלול החלקיק הוא $R_1$. כשהזרמים $I$ בשני התילים בכיוונים מנוגדים, הרדיוס הוא $R_2$.

      א. נתון $X_0/X_1 = 3$. מצאו את היחס $R_1/R_2$.

      ב. באיזה מקום בין התילים החלקיק לא מסתובב כלל כשהזרמים באותו כיוון? ומה קורה שם כשהזרמים מנוגדים?
    answer: >-
      א. $R_1/R_2 = 3$.

      ב. באמצע, $X_1 = X_0/2$: שם השדה מתאפס והחלקיק נע בקו ישר. כשהזרמים מנוגדים השדה באמצע כפול מהשדה של תיל אחד, ושונה מאפס.
    solution:
      - kind: given
        text: >-
          החלקיק במרחק $X_1 = X_0/3$ מתיל 1, ולכן במרחק $X_0 - X_1 = 2X_0/3$ מתיל 2. המהירות שלו במישור הדף, והשדה של התילים ניצב לדף.
      - kind: formula
        text: >-
          $B = \dfrac{\mu_0 I}{2\pi r}$ לכל תיל, ו-$r = \dfrac{mv}{qB}$ (שיעור 4.5), כלומר הרדיוס פרופורציוני הפוך לשדה.
      - kind: reasoning
        text: >-
          כיוונים: בין שני התילים, השדות של זרמים **באותו כיוון** מנוגדים זה לזה (כלל יד ימין: אחד ⊙ ואחד ⊗), ולכן מחסירים. כשהזרמים מנוגדים, השדות בין התילים באותו כיוון, ולכן מחברים.
      - kind: substitution
        text: >-
          נסמן $k = \dfrac{\mu_0 I}{2\pi}$. באותו כיוון: $B_1 = k\left(\dfrac{3}{X_0} - \dfrac{3}{2X_0}\right) = \dfrac{3k}{2X_0}$. בכיוונים מנוגדים: $B_2 = k\left(\dfrac{3}{X_0} + \dfrac{3}{2X_0}\right) = \dfrac{9k}{2X_0}$.
      - kind: manipulation
        text: >-
          $\dfrac{R_1}{R_2} = \dfrac{B_2}{B_1} = \dfrac{9k/(2X_0)}{3k/(2X_0)} = 3$.
      - kind: reasoning
        text: >-
          ב. באותו כיוון, השדות מבטלים זה את זה כש-$\dfrac{1}{X_1} = \dfrac{1}{X_0 - X_1}$, כלומר באמצע. שם $B = 0$, אין כוח, והחלקיק נע בקו ישר ($R \to \infty$). כשהזרמים מנוגדים, באמצע השדות מצטרפים: $B = 2\cdot\dfrac{\mu_0 I}{2\pi(X_0/2)} = \dfrac{2\mu_0 I}{\pi X_0}$, והחלקיק מסתובב.
      - kind: result
        text: >-
          א. $R_1/R_2 = 3$. ב. באמצע בין התילים; כשהזרמים מנוגדים השדה שם $\dfrac{2\mu_0 I}{\pi X_0}$, והחלקיק מסתובב.
    source:
      name: JEE Advanced
      year: 2014
      problem: 'Paper 1, Physics, Question 14 (integer answer)'
      url: https://jeeadv.ac.in/past_qps/2014_1.pdf
      verified: '2026-11-02'
      adapted: true


  - id: W-4.8-c2
    stars: 1
    objectives: [OBJ-4.8-3, OBJ-4.8-2]
    prompt: >-
      תיל X באורך $50\,\text{cm}$ נושא זרם של $2\,\text{A}$. הוא מונח במקביל לתיל ארוך Y באורך $5\,\text{m}$, שנושא זרם של $3\,\text{A}$ באותו כיוון, במרחק $5\,\text{cm}$ ממנו, מול האמצע של Y.

      א. תלמיד מחשב: "הכוח ליחידת אורך הוא $\dfrac{\mu_0 I_X I_Y}{2\pi d}$, ולכן הכוח על Y הוא הכוח הזה כפול $5\,\text{m}$." הסבירו מה שגוי בחישוב.

      ב. מצאו את גודל הכוח על התיל Y ואת כיוונו.
    answer: >-
      א. הנוסחה מניחה ששני התילים ארוכים מאוד. התיל X קצר, והשדה שלו חזק רק ליד הקטע של Y שמולו; רוב האורך של Y רחוק מ-X ומרגיש שדה חלש בהרבה.

      ב. $1.2\cdot10^{-5}\,\text{N}$, לעבר X.
    solution:
      - kind: given
        text: >-
          $L_X = 0.5\,\text{m}$, $I_X = 2\,\text{A}$; $L_Y = 5\,\text{m}$, $I_Y = 3\,\text{A}$; $d = 0.05\,\text{m}$; הזרמים באותו כיוון.
      - kind: reasoning
        text: >-
          א. הנוסחה $\dfrac{\mu_0 I_1 I_2}{2\pi d}$ באה מהשדה של תיל **ארוך**, $\dfrac{\mu_0 I}{2\pi r}$. השדה של X, שאורכו $50\,\text{cm}$, איננו השדה של תיל ארוך לאורך כל $5\,\text{m}$ של Y: מטר או שניים מ-X הוא כמעט אפס. לכן אי אפשר לכפול ב-$5\,\text{m}$.
      - kind: reasoning
        text: >-
          ב. את הכוח על X דווקא אפשר לחשב: Y ארוך פי 100 מהמרחק, ו-X נמצא מול האמצע שלו, ולכן לאורך כל X השדה של Y הוא השדה של תיל ארוך. לפי החוק השלישי של ניוטון, הכוח על Y שווה בגודלו לכוח על X והפוך בכיוונו.
      - kind: formula
        text: >-
          $B_Y = \dfrac{\mu_0 I_Y}{2\pi d}$, והכוח על X: $F = B_Y I_X L_X$ (השדה ניצב ל-X).
      - kind: substitution
        text: >-
          $B_Y = \dfrac{4\pi\cdot10^{-7}\cdot3}{2\pi\cdot0.05} = 1.2\cdot10^{-5}\,\text{T}$, ו-$F = 1.2\cdot10^{-5}\cdot2\cdot0.5 = 1.2\cdot10^{-5}\,\text{N}$. הזרמים באותו כיוון, ולכן X נמשך אל Y, ו-Y נמשך אל X. (החישוב השגוי של התלמיד נותן $2.4\cdot10^{-5}\cdot5 = 1.2\cdot10^{-4}\,\text{N}$, פי 10.)
      - kind: result
        text: >-
          א. הנוסחה לתילים ארוכים לא מתאימה לשדה של X לאורך כל Y.

          ב. $1.2\cdot10^{-5}\,\text{N}$, לעבר X.
    source:
      name: JEE Main (NTA)
      year: 2022
      problem: 'July session, Shift 2: a 50 cm wire with 2 A beside a 5 m wire with 3 A, 5 cm apart (force on the long wire)'
      url: https://www.canvasclasses.in/the-crucible/q/96d3af94-7a1e-40f4-9bd2-b9c3fca37ef1
      verified: '2026-11-02'
      adapted: true
