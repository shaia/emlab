# Workbook, lesson 4.4 (Ampère's law). Format and rules: see .claude/CLAUDE.md, "Worked examples, workbook".
# Every number was recomputed with src/physics/coils.ts (thickWireField) and magnetism.ts
# (straightWireField, solenoidField) and src/physics/constants.ts (MU0); script recompute-4-4.ts in the
# session scratchpad. In a >- block, consecutive lines fold into one paragraph: every part (א, ב, …)
# starts after a blank line.

lesson: '4.4'
practice:
  - id: W-4.4-01
    level: basic
    qualitative: false
    objectives: [OBJ-4.4-1]
    prompt: >-
      שלושה תילים ארוכים ניצבים לדף: בתיל A זורם $4\,\text{A}$ החוצה מהדף (⊙), בתיל B זורם $6\,\text{A}$ לתוך הדף (⊗), ובתיל C זורם $2\,\text{A}$ החוצה מהדף. בכל המסלולים שלמטה הולכים **עם כיוון השעון**. מה הסכום של $B_\parallel\,\Delta\ell$ סביב:

      א. מסלול שמקיף את שלושת התילים?

      ב. מסלול שמקיף את A ואת B?

      ג. מסלול שמקיף רק את B?
    answer: >-
      א. אפס.

      ב. $+2.51\cdot10^{-6}\,\text{T}\cdot\text{m}$.

      ג. $+7.54\cdot10^{-6}\,\text{T}\cdot\text{m}$.
    solution:
      - kind: given
        text: >-
          $I_A = 4\,\text{A}$ ⊙, $I_B = 6\,\text{A}$ ⊗, $I_C = 2\,\text{A}$ ⊙; הולכים עם כיוון השעון.
      - kind: reasoning
        text: >-
          סימן הזרם הכלוא בכלל יד ימין: מכופפים את האצבעות עם כיוון השעון, והאגודל פונה לתוך הדף. לכן הפעם זרם ⊗ נספר חיובי וזרם ⊙ שלילי.
      - kind: formula
        text: >-
          $\Sigma B_\parallel\,\Delta\ell = \mu_0 I$, עם $I$ הזרם הכלוא.
      - kind: substitution
        text: >-
          א. $I = -4 + 6 - 2 = 0$, והסכום אפס.

          ב. $I = -4 + 6 = 2\,\text{A}$, והסכום $4\pi\cdot10^{-7}\cdot2 \approx 2.51\cdot10^{-6}\,\text{T}\cdot\text{m}$.

          ג. $I = +6\,\text{A}$, והסכום $4\pi\cdot10^{-7}\cdot6 \approx 7.54\cdot10^{-6}\,\text{T}\cdot\text{m}$.
      - kind: result
        text: >-
          א. $0$. ב. $2.51\cdot10^{-6}\,\text{T}\cdot\text{m}$. ג. $7.54\cdot10^{-6}\,\text{T}\cdot\text{m}$.

  - id: W-4.4-02
    level: basic
    qualitative: true
    objectives: [OBJ-4.4-1]
    prompt: >-
      סביב תיל ישר ארוך שזורם בו זרם $I$ משרטטים ארבעה מסלולים סגורים, ובכולם הולכים נגד כיוון השעון:

      1. מעגל ברדיוס $2\,\text{cm}$, שמרכזו על התיל. 2. מעגל ברדיוס $10\,\text{cm}$, שהתיל בתוכו אבל לא במרכזו. 3. ריבוע גדול שהתיל בתוכו. 4. מעגל קטן לצד התיל, שלא מקיף אותו.

      א. דרגו את הסכומים של $B_\parallel\,\Delta\ell$ סביב ארבעת המסלולים.

      ב. על איזה מסלול השדה החזק ביותר? האם זה סותר את סעיף א?
    answer: >-
      א. במסלולים 1, 2 ו-3 הסכום שווה, $\mu_0 I$; במסלול 4 הוא אפס.

      ב. על מסלול 1 (הוא הקרוב ביותר לתיל). אין סתירה: השדה חזק, אבל המסלול קצר.
    solution:
      - kind: reasoning
        text: >-
          א. הסכום תלוי רק בזרם הכלוא ובכיוון ההליכה, לא בגודל המסלול, בצורתו או במקום של התיל בתוכו. מסלולים 1, 2 ו-3 מקיפים את התיל, ולכן בכולם הסכום $\mu_0 I$. מסלול 4 לא מקיף זרם, ולכן הסכום אפס, אף שיש עליו שדה.
      - kind: reasoning
        text: >-
          ב. השדה של תיל חלש כמו $1/r$, ולכן הוא חזק ביותר על מסלול 1. אבל מסלול 1 גם הקצר ביותר: $2\pi\cdot0.02$ לעומת $2\pi\cdot0.1$ במסלול 2. המכפלה, שדה כפול אורך, יוצאת אותו דבר.
      - kind: result
        text: >-
          א. $\Sigma_1 = \Sigma_2 = \Sigma_3 = \mu_0 I$, ו-$\Sigma_4 = 0$. ב. על מסלול 1, בלי סתירה.

  - id: W-4.4-03
    level: basic
    qualitative: false
    objectives: [OBJ-4.4-2]
    prompt: >-
      חיישן מראה שהשדה המגנטי במרחק $5\,\text{cm}$ מתיל ישר ארוך הוא $4\cdot10^{-5}\,\text{T}$.

      א. השתמשו בחוק אמפר כדי למצוא את הזרם בתיל.

      ב. מה הסכום של $B_\parallel\,\Delta\ell$ סביב מעגל ברדיוס $5\,\text{cm}$ שמרכזו על התיל?
    answer: >-
      א. $I = 10\,\text{A}$.

      ב. $1.26\cdot10^{-5}\,\text{T}\cdot\text{m}$.
    solution:
      - kind: reasoning
        text: >-
          סביב תיל ישר ארוך יש סימטריה: על מעגל שמרכזו על התיל השדה משיק ושווה בגודלו בכל נקודה, ולכן הסכום הוא $B\cdot2\pi r$.
      - kind: formula
        text: >-
          $B\cdot2\pi r = \mu_0 I$.
      - kind: manipulation
        text: >-
          מחלקים ב-$\mu_0$ כדי לבודד את הזרם: $I = \dfrac{2\pi r B}{\mu_0}$.
      - kind: substitution
        text: >-
          א. $I = \dfrac{2\pi\cdot0.05\cdot4\cdot10^{-5}}{4\pi\cdot10^{-7}} = 10\,\text{A}$.

          ב. $B\cdot2\pi r = 4\cdot10^{-5}\cdot2\pi\cdot0.05 \approx 1.26\cdot10^{-5}\,\text{T}\cdot\text{m}$, וזה גם $\mu_0\cdot10$.
      - kind: result
        text: >-
          א. $10\,\text{A}$. ב. $1.26\cdot10^{-5}\,\text{T}\cdot\text{m}$.

  - id: W-4.4-04
    level: mid
    qualitative: true
    objectives: [OBJ-4.4-3]
    prompt: >-
      כבל קואקסיאלי (כמו כבל האנטנה של טלוויזיה) בנוי מתיל מרכזי, ומסביבו, על אותו ציר, צינור מוליך דק. בתיל המרכזי זורם זרם של $3\,\text{A}$ לכיוון אחד, ובצינור חוזר אותו זרם בכיוון ההפוך. מסתכלים על חתך של הכבל, ניצב לציר שלו.

      א. נמקו בעזרת הסימטריה: איך נראה השדה על מעגל שמרכזו על הציר?

      ב. השתמשו בחוק אמפר כדי למצוא את השדה בין התיל לצינור, במרחק $2\,\text{mm}$ מהציר.

      ג. מה השדה מחוץ לכבל? למה זה יתרון?
    answer: >-
      א. משיק למעגל ובגודל שווה בכל נקודה עליו.

      ב. $B = 3\cdot10^{-4}\,\text{T}$.

      ג. אפס: הזרם הכלוא אפס והסימטריה מלאה. הכבל לא יוצר שדה מגנטי סביבו.
    solution:
      - kind: reasoning
        text: >-
          א. כל הכיוונים סביב הציר שווים: אם נסובב את הכבל סביב הציר, שום דבר לא משתנה. לכן על מעגל שמרכזו על הציר השדה חייב להיות שווה בגודלו בכל נקודה. וכמו סביב תיל ישר (שיעור 4.2), הוא משיק למעגל.
      - kind: formula
        text: >-
          חוק אמפר: $\Sigma B_\parallel\,\Delta\ell = \mu_0 I$. על מעגל כזה הסכום הוא $B\cdot2\pi r$.
      - kind: substitution
        text: >-
          ב. מעגל ברדיוס $2\,\text{mm}$ מקיף רק את התיל המרכזי: הזרם הכלוא $3\,\text{A}$. לכן $B\cdot2\pi r = \mu_0 I$, ו-$B = \dfrac{\mu_0 I}{2\pi r} = \dfrac{4\pi\cdot10^{-7}\cdot3}{2\pi\cdot0.002} = 3\cdot10^{-4}\,\text{T}$.
      - kind: reasoning
        text: >-
          ג. מעגל מחוץ לכבל מקיף גם את התיל וגם את הצינור: הזרם הכלוא $3 - 3 = 0$. לכן $B\cdot2\pi r = 0$, ובגלל הסימטריה (השדה שווה בכל נקודה על המעגל) $B = 0$. כאן, ורק בגלל הסימטריה, סכום אפס כן אומר שדה אפס. הכבל לא משפיע על מכשירים אחרים בשדה שלו.
      - kind: result
        text: >-
          א. משיק ובגודל קבוע על המעגל. ב. $3\cdot10^{-4}\,\text{T}$. ג. אפס.

  - id: W-4.4-05
    level: mid
    qualitative: false
    objectives: [OBJ-4.4-2]
    prompt: >-
      טורואיד עשוי מ-1000 כריכות שלופפות סביב טבעת. הרדיוס הפנימי של הטבעת $10\,\text{cm}$, והחיצוני $14\,\text{cm}$. בכריכות זורם $0.5\,\text{A}$.

      א. מה השדה בתוך הטבעת, במרחק $12\,\text{cm}$ מהמרכז?

      ב. פי כמה השדה ליד הדופן הפנימית ($10\,\text{cm}$) גדול מהשדה ליד הדופן החיצונית ($14\,\text{cm}$)?

      ג. מה השדה במרחק $20\,\text{cm}$ מהמרכז, מחוץ לטבעת?
    answer: >-
      א. $B \approx 8.33\cdot10^{-4}\,\text{T}$.

      ב. פי $1.4$.

      ג. אפס.
    solution:
      - kind: reasoning
        text: >-
          מהסימטריה של הטבעת, על מעגל שמרכזו במרכז הטבעת השדה משיק ושווה בכל נקודה. מעגל ברדיוס $r$ בתוך הטבעת עובר דרך כל הכריכות: כל כריכה חוצה את המישור שלו פעם אחת, בצד הפנימי. לכן הזרם הכלוא $NI$.
      - kind: formula
        text: >-
          $B\cdot2\pi r = \mu_0 N I$, ולכן $B = \dfrac{\mu_0 N I}{2\pi r}$.
      - kind: substitution
        text: >-
          א. $B = \dfrac{4\pi\cdot10^{-7}\cdot1000\cdot0.5}{2\pi\cdot0.12} \approx 8.33\cdot10^{-4}\,\text{T}$.

          ב. $B \propto 1/r$, ולכן $\dfrac{B(0.10)}{B(0.14)} = \dfrac{0.14}{0.10} = 1.4$ (במספרים: $1.0\cdot10^{-3}$ לעומת $7.14\cdot10^{-4}\,\text{T}$).
      - kind: reasoning
        text: >-
          ג. מעגל ברדיוס $20\,\text{cm}$ מקיף את כל הטבעת: כל כריכה עוברת דרכו פעמיים, פעם בצד הפנימי ופעם, בכיוון ההפוך, בצד החיצוני. הזרם הכלוא $NI - NI = 0$, ומהסימטריה $B = 0$.
      - kind: result
        text: >-
          א. $8.33\cdot10^{-4}\,\text{T}$. ב. פי $1.4$. ג. אפס.

  - id: W-4.4-06
    level: mid
    qualitative: true
    objectives: [OBJ-4.4-1, OBJ-4.4-2]
    prompt: >-
      קבעו ונמקו, לכל אחד משלושת המקרים, אם אפשר למצוא את השדה בנקודה P רק בעזרת חוק אמפר (בלי חיבור של שדות):

      א. P במרחק $3\,\text{cm}$ מתיל ישר ארוך יחיד.

      ב. P במרחק $1\,\text{cm}$ מאחד משני תילים מקבילים, שנמצאים $4\,\text{cm}$ זה מזה.

      ג. P על הציר, בקצה של סליל ארוך.
    answer: >-
      א. כן. ב. לא. ג. לא.
    solution:
      - kind: reasoning
        text: >-
          חוק אמפר תמיד נכון, אבל הוא נותן סכום סביב מסלול. את השדה עצמו אפשר "להוציא" מהסכום רק אם יש מסלול שעובר דרך P ושעליו השדה ידוע מראש בכיוונו ושווה בגודלו, או אפס בחלקים ידועים.
      - kind: reasoning
        text: >-
          א. סביב תיל יחיד יש סימטריה מלאה: על מעגל שמרכזו על התיל השדה משיק ושווה, ו-$B\cdot2\pi r = \mu_0 I$ נותן את השדה.
      - kind: reasoning
        text: >-
          ב. התיל השני שובר את הסימטריה: על מעגל סביב התיל הקרוב השדה חזק יותר בצד שפונה לתיל השני (או חלש יותר, לפי כיווני הזרמים). הסכום עדיין $\mu_0 I$, אבל השדה לא שווה על המעגל, וחלוקה בהיקף נותנת רק ממוצע. כאן מחברים את השדות של שני התילים (שיעור 4.2).
      - kind: reasoning
        text: >-
          ג. בקצה הסליל השדה לא אחיד: הוא חצי מהשדה שבאמצע, והקווים מתפזרים. אין מלבן שעליו השדה ידוע מראש, ולכן חוק אמפר לבד לא נותן את השדה שם.
      - kind: result
        text: >-
          רק במקרה א.

  - id: W-4.4-07
    level: mid
    qualitative: false
    objectives: [OBJ-4.4-3]
    prompt: >-
      בתיל נחושת עבה ברדיוס $5\,\text{mm}$ זורם $20\,\text{A}$, מפוזר באחידות על החתך.

      א. מה השדה במרחק $2\,\text{mm}$ מהציר, על פני התיל, ובמרחק $10\,\text{mm}$ מהציר?

      ב. באיזה מרחק מהציר, **בתוך** התיל, השדה שווה לשדה שבמרחק $10\,\text{mm}$?
    answer: >-
      א. $3.2\cdot10^{-4}$, $8\cdot10^{-4}$ ו-$4\cdot10^{-4}\,\text{T}$.

      ב. $2.5\,\text{mm}$.
    solution:
      - kind: formula
        text: >-
          בתוך התיל, מעגל ברדיוס $r$ מקיף את החלק $r^2/R^2$ של הזרם, ולכן $B\cdot2\pi r = \mu_0 I\,\dfrac{r^2}{R^2}$, כלומר $B = \dfrac{\mu_0 I r}{2\pi R^2}$. מחוץ לתיל $B = \dfrac{\mu_0 I}{2\pi r}$.
      - kind: substitution
        text: >-
          א. ב-$2\,\text{mm}$: $B = \dfrac{4\pi\cdot10^{-7}\cdot20\cdot0.002}{2\pi\cdot0.005^2} = 3.2\cdot10^{-4}\,\text{T}$. על פני התיל: $B = \dfrac{4\pi\cdot10^{-7}\cdot20}{2\pi\cdot0.005} = 8\cdot10^{-4}\,\text{T}$. ב-$10\,\text{mm}$: $B = \dfrac{4\pi\cdot10^{-7}\cdot20}{2\pi\cdot0.01} = 4\cdot10^{-4}\,\text{T}$.
      - kind: manipulation
        text: >-
          ב. משווים את השדה בפנים לשדה בחוץ, במרחק $d = 10\,\text{mm}$: $\dfrac{\mu_0 I r}{2\pi R^2} = \dfrac{\mu_0 I}{2\pi d}$. מצמצמים את $\dfrac{\mu_0 I}{2\pi}$ וכופלים ב-$R^2$: $r = \dfrac{R^2}{d}$.
      - kind: substitution
        text: >-
          $r = \dfrac{5^2}{10} = 2.5\,\text{mm}$. בדיקה: $B = 8\cdot10^{-4}\cdot\dfrac{2.5}{5} = 4\cdot10^{-4}\,\text{T}$.
      - kind: result
        text: >-
          א. $3.2\cdot10^{-4}\,\text{T}$, $8\cdot10^{-4}\,\text{T}$, $4\cdot10^{-4}\,\text{T}$. ב. $2.5\,\text{mm}$.

  - id: W-4.4-08
    level: bagrut
    qualitative: true
    objectives: [OBJ-4.4-1, OBJ-4.4-2]
    prompt: >-
      בסליל ארוך עם 800 כריכות למטר זורם זרם של $1.5\,\text{A}$. משרטטים במישור שעובר דרך הציר שלושה מלבנים, ולכל אחד שתי צלעות באורך $10\,\text{cm}$ מקבילות לציר:

      מלבן 1 כולו בתוך הסליל, בלי לגעת בכריכות. מלבן 2 כולו מחוץ לסליל. מלבן 3: צלע אחת בפנים, הצלע שמולה בחוץ.

      א. מה הסכום של $B_\parallel\,\Delta\ell$ סביב כל מלבן?

      ב. במלבן 1 צלע אחת קרובה לציר, והצלע שמולה קרובה לכריכות. הראו בעזרת התוצאה של סעיף א שהשדה זהה בשתיהן.

      ג. מצאו בעזרת מלבן 3 את השדה בתוך הסליל.
    answer: >-
      א. מלבנים 1 ו-2: אפס. מלבן 3: כ-$1.51\cdot10^{-4}\,\text{T}\cdot\text{m}$.

      ב. $B_1\ell - B_2\ell = 0$, ולכן $B_1 = B_2$.

      ג. $B \approx 1.51\cdot10^{-3}\,\text{T}$.
    solution:
      - kind: reasoning
        text: >-
          א. מלבנים 1 ו-2 לא מקיפים אף כריכה: הזרם הכלוא אפס, ולכן הסכום אפס. מלבן 3 מקיף את הכריכות שבקטע של $10\,\text{cm}$: $n\ell = 800\cdot0.1 = 80$ כריכות, ובכל אחת $1.5\,\text{A}$, כלומר זרם כלוא של $120\,\text{A}$.
      - kind: substitution
        text: >-
          $\Sigma_3 = \mu_0\cdot120 = 4\pi\cdot10^{-7}\cdot120 \approx 1.51\cdot10^{-4}\,\text{T}\cdot\text{m}$.
      - kind: reasoning
        text: >-
          ב. בתוך הסליל השדה מקביל לציר, ולכן בצלעות הניצבות של מלבן 1 $B_\parallel = 0$. בצלע אחת הולכים עם השדה (תרומה $B_1\ell$) ובצלע שמולה נגדו (תרומה $-B_2\ell$). הסכום אפס: $B_1\ell - B_2\ell = 0$, ולכן $B_1 = B_2$, בכל מרחק מהציר. זו הסיבה שהשדה בתוך סליל ארוך אחיד.
      - kind: reasoning
        text: >-
          ג. במלבן 3 רק הצלע הפנימית תורמת: בחוץ השדה כמעט אפס, ובצלעות הניצבות השדה שבפנים ניצב לצלע. לכן $B\ell = \mu_0 n\ell I$.
      - kind: substitution
        text: >-
          $B = \dfrac{1.51\cdot10^{-4}}{0.1} \approx 1.51\cdot10^{-3}\,\text{T}$, כמו $\mu_0 n I = 4\pi\cdot10^{-7}\cdot800\cdot1.5$.
      - kind: result
        text: >-
          א. אפס, אפס, $1.51\cdot10^{-4}\,\text{T}\cdot\text{m}$. ב. $B_1 = B_2$. ג. $1.51\cdot10^{-3}\,\text{T}$.

  - id: W-4.4-09
    level: bagrut
    qualitative: true
    objectives: [OBJ-4.4-3]
    prompt: >-
      בצינור מתכת ארוך זורם $10\,\text{A}$ לאורכו, מפוזר באחידות על שטח החתך של הדופן. הרדיוס הפנימי של הצינור $4\,\text{mm}$, והחיצוני $6\,\text{mm}$.

      א. מה השדה בתוך החלל של הצינור? נמקו.

      ב. מה השדה בתוך הדופן, במרחק $5\,\text{mm}$ מהציר?

      ג. מה השדה על פני הצינור ($6\,\text{mm}$) ובמרחק $1\,\text{cm}$ מהציר?

      ד. תארו במילים את הגרף של $B$ כתלות במרחק מהציר, מ-$0$ עד $1\,\text{cm}$.
    answer: >-
      א. אפס.

      ב. $1.8\cdot10^{-4}\,\text{T}$.

      ג. $3.33\cdot10^{-4}\,\text{T}$ ו-$2\cdot10^{-4}\,\text{T}$.

      ד. אפס עד $4\,\text{mm}$, עולה בתוך הדופן עד שיא על פני הצינור, ויורד כמו $1/r$ בחוץ.
    solution:
      - kind: reasoning
        text: >-
          מהסימטריה, על מעגל שמרכזו על הציר השדה משיק ושווה בכל נקודה, ולכן $B\cdot2\pi r = \mu_0 I$ בכל מרחק, כש-$I$ הוא הזרם הכלוא במעגל.
      - kind: reasoning
        text: >-
          א. מעגל בתוך החלל ($r < 4\,\text{mm}$) לא מקיף זרם, ולכן $B\cdot2\pi r = 0$ ו-$B = 0$.
      - kind: formula
        text: >-
          ב. בתוך הדופן המעגל מקיף רק חלק מהזרם. שטח הדופן כולו הוא $\pi b^2 - \pi a^2$, והחלק שלו שבתוך המעגל ברדיוס $r$ הוא $\pi r^2 - \pi a^2$. הזרם מפוזר באחידות, ולכן $I_r = I\,\dfrac{r^2 - a^2}{b^2 - a^2}$, עם $a = 4\,\text{mm}$ ו-$b = 6\,\text{mm}$.
      - kind: substitution
        text: >-
          $I_r = 10\cdot\dfrac{25 - 16}{36 - 16} = 4.5\,\text{A}$, ו-$B = \dfrac{\mu_0 I_r}{2\pi r} = \dfrac{4\pi\cdot10^{-7}\cdot4.5}{2\pi\cdot0.005} = 1.8\cdot10^{-4}\,\text{T}$.

          ג. בחוץ כל הזרם כלוא: על הפנים, $B = \dfrac{4\pi\cdot10^{-7}\cdot10}{2\pi\cdot0.006} \approx 3.33\cdot10^{-4}\,\text{T}$; ב-$1\,\text{cm}$, $B = 2\cdot10^{-4}\,\text{T}$.
      - kind: reasoning
        text: >-
          ד. אפס בכל החלל; מ-$4\,\text{mm}$ השדה עולה, כי המעגל מקיף יותר ויותר זרם; השיא על פני הצינור; ומשם הוא יורד כמו $1/r$, כמו של תיל דק.
      - kind: result
        text: >-
          א. $0$. ב. $1.8\cdot10^{-4}\,\text{T}$. ג. $3.33\cdot10^{-4}\,\text{T}$ ו-$2\cdot10^{-4}\,\text{T}$. ד. אפס, עלייה עד פני הצינור, וירידה כמו $1/r$.

  - id: W-4.4-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-4.4-1, OBJ-4.4-2]
    prompt: >-
      בכבל חשמל של מכשיר ביתי יש שני תילים מקבילים, $4\,\text{mm}$ בין המרכזים שלהם. בזמן נתון זורם בהם $5\,\text{A}$, בכיוונים מנוגדים.

      א. מה הסכום של $B_\parallel\,\Delta\ell$ סביב מסלול שמקיף את שני התילים? סביב מסלול שמקיף רק אחד מהם (הולכים נגד כיוון השעון, והזרם בו יוצא מהדף)?

      ב. מה השדה בנקודה שבאמצע בין התילים?

      ג. מה השדה במרחק $10\,\text{cm}$ מאמצע הכבל, על הקו שעובר דרך שני התילים? השוו לשדה של תיל אחד עם $5\,\text{A}$ באותו מרחק.

      ד. למה אי אפשר למצוא את התשובות לסעיפים ב ו-ג מחוק אמפר לבד?
    answer: >-
      א. אפס; $6.28\cdot10^{-6}\,\text{T}\cdot\text{m}$.

      ב. $1\cdot10^{-3}\,\text{T}$.

      ג. $4\cdot10^{-7}\,\text{T}$, חלש פי 25 בערך מ-$1\cdot10^{-5}\,\text{T}$ של תיל אחד.

      ד. אין סימטריה: השדה לא שווה על אף מסלול סביב הכבל.
    solution:
      - kind: substitution
        text: >-
          א. סביב שני התילים הזרם הכלוא $5 - 5 = 0$, והסכום אפס. סביב תיל אחד: $\mu_0\cdot5 = 4\pi\cdot10^{-7}\cdot5 \approx 6.28\cdot10^{-6}\,\text{T}\cdot\text{m}$.
      - kind: reasoning
        text: >-
          ב. באמצע, $2\,\text{mm}$ מכל תיל. לפי כלל יד ימין, לזרמים מנוגדים השדות בין התילים באותו כיוון (שיעור 4.2), ולכן מחברים: $B = 2\cdot\dfrac{\mu_0 I}{2\pi r} = 2\cdot\dfrac{4\pi\cdot10^{-7}\cdot5}{2\pi\cdot0.002} = 1\cdot10^{-3}\,\text{T}$.
      - kind: reasoning
        text: >-
          ג. בנקודה שעל הקו, $10\,\text{cm}$ מהאמצע, התיל הקרוב במרחק $9.8\,\text{cm}$ והרחוק ב-$10.2\,\text{cm}$, והשדות שלהם מנוגדים: $B = \dfrac{\mu_0 I}{2\pi}\left(\dfrac{1}{0.098} - \dfrac{1}{0.102}\right) \approx 4.0\cdot10^{-7}\,\text{T}$. תיל אחד באותו מרחק: $\dfrac{4\pi\cdot10^{-7}\cdot5}{2\pi\cdot0.1} = 1\cdot10^{-5}\,\text{T}$, פי 25 בערך.
      - kind: reasoning
        text: >-
          ד. כדי להוציא את $B$ מהסכום צריך מסלול שעליו השדה שווה בכל נקודה. סביב שני תילים אין מסלול כזה, וסכום אפס סביב הכבל לא אומר שהשדה אפס, רק שהתרומות החיוביות והשליליות מתקזזות.
      - kind: result
        text: >-
          א. $0$ ו-$6.28\cdot10^{-6}\,\text{T}\cdot\text{m}$. ב. $1\cdot10^{-3}\,\text{T}$. ג. $4\cdot10^{-7}\,\text{T}$, חלש פי 25. ד. אין סימטריה.

challenge:
  - id: W-4.4-c1
    stars: 1
    objectives: [OBJ-4.4-3]
    prompt: >-
      בתיל ישר ארוך ברדיוס $a = 3\,\text{mm}$ זורם זרם קבוע של $12\,\text{A}$, מפוזר באחידות על החתך.

      א. איפה השדה המגנטי הגדול ביותר, ומה ערכו?

      ב. באילו מרחקים מהציר השדה שווה לחצי מהערך הגדול ביותר? מצאו נקודה בתוך התיל ונקודה מחוצה לו.

      ג. הראו שבאופן כללי השדה שווה ל-$1/k$ מהשיא (עבור $k > 1$) במרחק $a/k$ בתוך התיל ובמרחק $ka$ מחוצה לו.
    answer: >-
      א. על פני התיל, $8\cdot10^{-4}\,\text{T}$.

      ב. $1.5\,\text{mm}$ ו-$6\,\text{mm}$.

      ג. בפנים $B = B_{\max} r/a$, בחוץ $B = B_{\max} a/r$.
    solution:
      - kind: formula
        text: >-
          מחוק אמפר עם מעגל שמרכזו על הציר: בפנים $B = \dfrac{\mu_0 I r}{2\pi a^2}$, בחוץ $B = \dfrac{\mu_0 I}{2\pi r}$.
      - kind: reasoning
        text: >-
          א. בפנים השדה גדל עם $r$, ובחוץ יורד, ולכן השיא על פני התיל, $r = a$: $B_{\max} = \dfrac{\mu_0 I}{2\pi a} = \dfrac{4\pi\cdot10^{-7}\cdot12}{2\pi\cdot0.003} = 8\cdot10^{-4}\,\text{T}$.
      - kind: manipulation
        text: >-
          נכתוב את שני הביטויים בעזרת $B_{\max}$: בפנים $B = B_{\max}\,\dfrac{r}{a}$, ובחוץ $B = B_{\max}\,\dfrac{a}{r}$.
      - kind: substitution
        text: >-
          ב. בפנים: $\dfrac{r}{a} = \dfrac12$, כלומר $r = 1.5\,\text{mm}$. בחוץ: $\dfrac{a}{r} = \dfrac12$, כלומר $r = 6\,\text{mm}$. בשתי הנקודות $B = 4\cdot10^{-4}\,\text{T}$.
      - kind: reasoning
        text: >-
          ג. בפנים $B_{\max} r/a = B_{\max}/k$ נותן $r = a/k$; בחוץ $B_{\max} a/r = B_{\max}/k$ נותן $r = ka$. עבור $k > 1$ הנקודה הראשונה אכן בפנים והשנייה בחוץ.
      - kind: result
        text: >-
          א. על פני התיל, $8\cdot10^{-4}\,\text{T}$. ב. $1.5\,\text{mm}$ ו-$6\,\text{mm}$. ג. $a/k$ ו-$ka$.
    source:
      name: JEE Main
      year: 2025
      problem: '29 January 2025, Shift 1: field at half its maximum, inside and outside a long wire of radius a'
      url: https://competishun.com/consider-a-long-straight-wire-of-a-circular-cross-section-radius-a
      verified: '2026-11-02'
      adapted: true

  - id: W-4.4-c2
    stars: 2
    objectives: [OBJ-4.4-2, OBJ-4.4-3]
    prompt: >-
      גליל מוליך ארוך ברדיוס $a = 1\,\text{cm}$. לאורך כל הגליל קדחו חלל גלילי ברדיוס $a/2$, שמרכזו במרחק $a/2$ מהציר של הגליל, כך שהחלל נוגע בציר ובדופן. בחלק המלא של הגליל זורם זרם לאורכו, מפוזר באחידות: צפיפות זרם של $J = 1\cdot10^{6}\,\text{A/m}^2$ (אמפר אחד בכל ממ״ר). הנקודה P נמצאת על פני הגליל, על הקו שעובר דרך שני המרכזים, בצד הרחוק מהחלל.

      א. מה הזרם הכולל בגליל?

      ב. רמז: גליל עם חלל הוא כמו גליל מלא עם צפיפות זרם $J$, ועוד גליל ברדיוס $a/2$ במקום החלל עם צפיפות זרם $-J$ (בכיוון ההפוך). מצאו בעזרת חוק אמפר את השדה של כל אחד משני הגלילים בנקודה P, וחברו אותם.

      ג. מה השדה במרכז החלל?
    answer: >-
      א. כ-$236\,\text{A}$.

      ב. $B_P = \dfrac{5}{12}\mu_0 J a \approx 5.24\cdot10^{-3}\,\text{T}$.

      ג. $\dfrac{1}{4}\mu_0 J a \approx 3.14\cdot10^{-3}\,\text{T}$.
    solution:
      - kind: substitution
        text: >-
          א. השטח המלא הוא שטח הגליל פחות שטח החלל: $\pi a^2 - \pi(a/2)^2 = \tfrac34\pi a^2$. הזרם $I = J\cdot\tfrac34\pi a^2 = 10^6\cdot0.75\cdot\pi\cdot10^{-4} \approx 236\,\text{A}$.
      - kind: formula
        text: >-
          לגליל מלא ברדיוס $R$ עם צפיפות זרם $J$ (זרם כולל $J\pi R^2$), מחוק אמפר: מחוץ לו $B = \dfrac{\mu_0 J\pi R^2}{2\pi r} = \dfrac{\mu_0 J R^2}{2r}$, ובתוכו $B = \dfrac{\mu_0 J r}{2}$.
      - kind: substitution
        text: >-
          ב. הגליל המלא ($R = a$): P על פניו, $r = a$, ולכן $B_1 = \dfrac{\mu_0 J a}{2}$. הגליל השלילי ($R = a/2$): P במרחק $\tfrac32 a$ ממרכזו, מחוצה לו, ולכן $B_2 = \dfrac{\mu_0 J (a/2)^2}{2\cdot\tfrac32 a} = \dfrac{\mu_0 J a}{12}$.
      - kind: reasoning
        text: >-
          כיוונים: P, מרכז הגליל ומרכז החלל על קו אחד, ו-P באותו צד של שני המרכזים. לכן השדות של שני הגלילים בנקודה P ניצבים לאותו קו, וזרמים הפוכים נותנים שדות הפוכים: מחסרים. $B_P = \dfrac{\mu_0 J a}{2} - \dfrac{\mu_0 J a}{12} = \dfrac{5}{12}\mu_0 J a = \dfrac{5\cdot4\pi\cdot10^{-7}\cdot10^6\cdot0.01}{12} \approx 5.24\cdot10^{-3}\,\text{T}$.
      - kind: reasoning
        text: >-
          ג. במרכז החלל השדה של הגליל השלילי אפס (זה הציר שלו). הגליל המלא: המרכז בתוכו, במרחק $a/2$ מהציר, ולכן $B = \dfrac{\mu_0 J (a/2)}{2} = \dfrac{\mu_0 J a}{4} \approx 3.14\cdot10^{-3}\,\text{T}$.
      - kind: result
        text: >-
          א. כ-$236\,\text{A}$. ב. $\tfrac{5}{12}\mu_0 J a \approx 5.24\cdot10^{-3}\,\text{T}$. ג. $\tfrac14\mu_0 J a \approx 3.14\cdot10^{-3}\,\text{T}$.
    source:
      name: JEE Advanced
      year: 2012
      problem: 'Paper 1, Physics, Section III, Q.17'
      url: https://jeeadv.ac.in/past_qps/2012_1.pdf
      verified: '2026-11-02'
      adapted: true
