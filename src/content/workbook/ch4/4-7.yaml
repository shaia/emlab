      adapted: true

  - id: W-4.7-c2
    stars: 2
    objectives: [OBJ-4.7-1, OBJ-4.7-3]
    prompt: >-
      ציר $x$ ימינה, ציר $y$ למעלה וציר $z$ החוצה מהדף. חלקיק טעון, אלקטרון או פרוטון, מוכנס בראשית הצירים במהירות התחלתית נתונה. בכל המרחב יש שדה חשמלי אחיד ושדה מגנטי אחיד. $E_0$ ו-$B_0$ חיוביים.

      החלקיק והמהירות: (1) אלקטרון במהירות $2E_0/B_0$ בכיוון $+x$; (2) אלקטרון במהירות $E_0/B_0$ בכיוון $+y$; (3) פרוטון במנוחה; (4) פרוטון במהירות $2E_0/B_0$ בכיוון $+x$.

      השדה החשמלי: (E1) $E_0$ בכיוון $+z$; (E2) $E_0$ בכיוון $-y$; (E3) $E_0$ בכיוון $-x$; (E4) $E_0$ בכיוון $+x$.

      השדה המגנטי: (B1) $B_0$ בכיוון $-x$; (B2) $B_0$ בכיוון $+x$; (B3) $B_0$ בכיוון $+y$; (B4) $B_0$ בכיוון $+z$.

      א. איזה מבין הצירופים הבאים נותן תנועה בקו ישר **במהירות קבועה**: (2, E3, B4), (3, E3, B1), (4, E1, B4), (3, E2, B3)?

      ב. איזה מבין הצירופים האלה נותן תנועה בקו ישר בכיוון $-y$, עם מהירות שגדלה?

      ג. בצירוף שמצאתם בסעיף א, מחליפים את מהירות האלקטרון ל-$2E_0/B_0$, עדיין בכיוון $+y$. לאיזה כיוון הוא מתחיל לסטות? נמקו בלי חישוב ארוך.
    answer: >-
      א. (2, E3, B4).

      ב. (3, E2, B3).

      ג. בכיוון $-x$: לצד הכוח המגנטי, שגדל פי 2, בעוד הכוח החשמלי נשאר.
    solution:
      - kind: given
        text: >-
          הכוח על החלקיק הוא סכום של הכוח החשמלי, $qE$ (על מטען חיובי בכיוון השדה, על שלילי נגדו), ושל הכוח המגנטי, שגודלו $|q|vB$ כשהמהירות ניצבת לשדה המגנטי, ואפס כשהיא לאורכו. כיוון הכוח המגנטי על מטען חיובי לפי כלל כף יד ימין, ועל שלילי הפוך. על פרוטון $q = +e$, על אלקטרון $q = -e$.
      - kind: reasoning
        text: >-
          א. מהירות קבועה פירושה כוח שקול אפס. בצירוף (2, E3, B4): הכוח החשמלי על האלקטרון נגד השדה, כלומר בכיוון $+x$, בגודל $eE_0$. הכוח המגנטי: למטען חיובי שנע ב-$+y$ בשדה $+z$, כלל כף יד ימין (האצבעות החוצה מהדף, האגודל למעלה) נותן $+x$; לאלקטרון הכוח הפוך, $-x$, בגודל $e\cdot\dfrac{E_0}{B_0}\cdot B_0 = eE_0$. הכוחות מתקזזים: זה בורר מהירויות. בשאר הצירופים: (3, E3, B1) פרוטון במנוחה מקבל כוח חשמלי ומאיץ; (4, E1, B4) יש כוח חשמלי ב-$+z$ שלא מתקזז; (3, E2, B3) פרוטון במנוחה מאיץ.
      - kind: reasoning
        text: >-
          ב. בצירוף (3, E2, B3) הפרוטון מתחיל במנוחה, והכוח החשמלי עליו בכיוון השדה, $-y$. הוא מאיץ לאורך $-y$, כלומר לאורך השדה המגנטי ($+y$ או $-y$, אותו קו). מטען שנע לאורך השדה המגנטי לא מקבל כוח מגנטי (שיעור 4.5), ולכן הוא ממשיך בקו ישר בכיוון $-y$, במהירות שגדלה. בצירוף (3, E3, B1) הפרוטון מאיץ דווקא לאורך $-x$.
      - kind: reasoning
        text: >-
          ג. הכוח החשמלי, $eE_0$ בכיוון $+x$, לא תלוי במהירות. הכוח המגנטי גדל פי 2, ל-$2eE_0$ בכיוון $-x$. השקול $eE_0$ בכיוון $-x$: כמו בבורר, חלקיק מהיר מדי סוטה לצד הכוח המגנטי.
      - kind: result
        text: >-
          א. (2, E3, B4).

          ב. (3, E2, B3).

          ג. בכיוון $-x$, לצד הכוח המגנטי.
