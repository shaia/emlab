# Workbook, lesson 4.7 (crossed fields). Format and rules: see .claude/CLAUDE.md, "Worked examples, workbook".
# Every number was recomputed with src/physics (selectorSpeed, orbitRadius, speedFromVoltage in magnetism.ts;
# bainbridgeRadius, crossedForceY in crossed-fields.ts); scripts wb.ts and wb2.ts in the session scratchpad.
# In a >- block, consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '4.7'
practice:
  - id: W-4.7-01
    level: basic
    qualitative: false
    objectives: [OBJ-4.7-2]
    prompt: >-
      שני בוררי מהירויות. בבורר א המתח בין הלוחות $300\,\text{V}$, המרחק ביניהם $1\,\text{cm}$ והשדה המגנטי $0.05\,\text{T}$. בבורר ב המתח $600\,\text{V}$, המרחק $3\,\text{cm}$ והשדה המגנטי $0.04\,\text{T}$.

      א. מה השדה החשמלי בכל בורר?

      ב. איזה בורר מעביר יונים מהירים יותר? חשבו את המהירות שכל בורר מעביר.
    answer: >-
      א. $3\cdot10^{4}\,\text{V/m}$ בבורר א, $2\cdot10^{4}\,\text{V/m}$ בבורר ב.

      ב. בורר א: $6\cdot10^{5}\,\text{m/s}$, לעומת $5\cdot10^{5}\,\text{m/s}$ בבורר ב.
    solution:
      - kind: given
        text: >-
          בורר א: $V = 300\,\text{V}$, $d = 0.01\,\text{m}$, $B = 0.05\,\text{T}$. בורר ב: $V = 600\,\text{V}$, $d = 0.03\,\text{m}$, $B = 0.04\,\text{T}$.
      - kind: formula
        text: >-
          בין לוחות מקבילים $E = \dfrac{V}{d}$ (שיעור 2.3), ותנאי הבחירה $v = \dfrac{E}{B}$.
      - kind: substitution
        text: >-
          א. בבורר א $E = \dfrac{300}{0.01} = 3\cdot10^{4}\,\text{V/m}$, ובבורר ב $E = \dfrac{600}{0.03} = 2\cdot10^{4}\,\text{V/m}$.

          ב. בבורר א $v = \dfrac{3\cdot10^{4}}{0.05} = 6\cdot10^{5}\,\text{m/s}$, ובבורר ב $v = \dfrac{2\cdot10^{4}}{0.04} = 5\cdot10^{5}\,\text{m/s}$.
      - kind: reasoning
        text: >-
          בבורר ב המתח גדול יותר, אבל הלוחות רחוקים פי 3, ולכן השדה החשמלי דווקא קטן יותר. מה שקובע את המהירות הוא היחס $E/B$, לא המתח לבדו.
      - kind: result
        text: >-
          א. $3\cdot10^{4}\,\text{V/m}$ ו-$2\cdot10^{4}\,\text{V/m}$.

          ב. בורר א מעביר יונים מהירים יותר: $6\cdot10^{5}\,\text{m/s}$, לעומת $5\cdot10^{5}\,\text{m/s}$.

  - id: W-4.7-02
    level: basic
    qualitative: true
    objectives: [OBJ-4.7-1]
    prompt: >-
      בבורר מהירויות היונים נעים **כלפי מעלה** במישור הדף, והשדה המגנטי ⊙, החוצה מהדף. קבעו ונמקו בעזרת כלל כף יד ימין:

      א. לאיזה כיוון צריך להצביע השדה החשמלי כדי שיון חיובי יעבור ישר?

      ב. בורר כזה צריך להעביר גם יונים שליליים באותה מהירות. האם צריך לשנות את כיוון השדה החשמלי בשבילם?
    answer: >-
      א. שמאלה: הכוח המגנטי על יון חיובי ימינה, והכוח החשמלי צריך להיות שמאלה.

      ב. לא. על יון שלילי שני הכוחות מתהפכים, והם נשארים מנוגדים ושווים.
    solution:
      - kind: given
        text: >-
          המהירות כלפי מעלה, השדה המגנטי ⊙. השדה החשמלי צריך להיות ניצב לשניהם, כלומר ימינה או שמאלה במישור הדף.
      - kind: reasoning
        text: >-
          א. כלל כף יד ימין: האצבעות החוצה מהדף, בכיוון השדה, האגודל כלפי מעלה, בכיוון המהירות של מטען חיובי. כף היד פונה ימינה, ולכן הכוח המגנטי על יון חיובי ימינה. כדי שהיון ימשיך ישר, הכוח החשמלי צריך להיות שמאלה, ועל מטען חיובי הכוח החשמלי בכיוון השדה. לכן השדה החשמלי מצביע שמאלה.
      - kind: reasoning
        text: >-
          ב. על יון שלילי הכוח המגנטי הפוך, שמאלה, והכוח החשמלי הפוך לשדה, כלומר ימינה. שני הכוחות התהפכו יחד, ולכן הם עדיין מנוגדים. הגדלים $|q|E$ ו-$|q|vB$ שווים באותה מהירות, $v = E/B$.
      - kind: result
        text: >-
          א. השדה החשמלי שמאלה.

          ב. לא צריך לשנות דבר: אותו בורר מעביר יונים חיוביים ושליליים באותה מהירות.

  - id: W-4.7-03
    level: basic
    qualitative: false
    objectives: [OBJ-4.7-1, OBJ-4.7-2]
    prompt: >-
      קרן אלקטרונים נעה ימינה ונכנסת לאזור שבו יש שדה מגנטי של $10^{-3}\,\text{T}$, ⊗, ושדה חשמלי של $2\cdot10^{3}\,\text{V/m}$ בין שני לוחות אופקיים.

      א. מה המהירות של האלקטרונים שעוברים ישר?

      ב. מה הגודל של כל אחד משני הכוחות על אלקטרון כזה?

      ג. איזה לוח צריך להיות חיובי? המרחק בין הלוחות $0.5\,\text{cm}$: מה המתח ביניהם?
    answer: >-
      א. $2\cdot10^{6}\,\text{m/s}$.

      ב. $3.2\cdot10^{-16}\,\text{N}$ כל אחד.

      ג. הלוח העליון, והמתח $10\,\text{V}$.
    solution:
      - kind: given
        text: >-
          $B = 10^{-3}\,\text{T}$ (⊗), $E = 2\cdot10^{3}\,\text{V/m}$, $q = -e$, המהירות ימינה, $d = 0.005\,\text{m}$.
      - kind: formula
        text: >-
          $v = \dfrac{E}{B}$, $F_E = |q|E$, $F_B = |q|vB$, $V = Ed$.
      - kind: substitution
        text: >-
          א. $v = \dfrac{2\cdot10^{3}}{10^{-3}} = 2\cdot10^{6}\,\text{m/s}$.

          ב. $F_E = 1.6\cdot10^{-19}\cdot2\cdot10^{3} = 3.2\cdot10^{-16}\,\text{N}$, $F_B = 1.6\cdot10^{-19}\cdot2\cdot10^{6}\cdot10^{-3} = 3.2\cdot10^{-16}\,\text{N}$.
      - kind: reasoning
        text: >-
          ג. כלל כף יד ימין נותן כוח כלפי מעלה על מטען חיובי שנע ימינה בשדה ⊗. האלקטרון שלילי, ולכן הכוח המגנטי עליו כלפי מטה. הכוח החשמלי צריך להיות כלפי מעלה, ועל אלקטרון הוא נגד השדה, ולכן השדה מצביע כלפי מטה: הלוח העליון חיובי. המתח: $V = 2\cdot10^{3}\cdot0.005 = 10\,\text{V}$.
      - kind: result
        text: >-
          א. $2\cdot10^{6}\,\text{m/s}$.

          ב. $3.2\cdot10^{-16}\,\text{N}$ כל אחד, החשמלי כלפי מעלה והמגנטי כלפי מטה.

          ג. הלוח העליון חיובי, והמתח $10\,\text{V}$.

  - id: W-4.7-04
    level: mid
    qualitative: true
    objectives: [OBJ-4.7-2, OBJ-4.7-3]
    prompt: >-
      בבורר מהירויות עוברים ישר יונים במהירות $v_0$. קבעו ונמקו, בכל סעיף בנפרד, איזו מהירות עוברת עכשיו ישר:

      א. מכפילים את השדה המגנטי.

      ב. מכפילים גם את המתח בין הלוחות וגם את השדה המגנטי.

      ג. מחליפים את היונים ביונים עם מטען כפול ומסה פי 3.

      ד. מקרבים את הלוחות לחצי מהמרחק, ומקטינים את המתח ביניהם לחצי.
    answer: >-
      א. $v_0/2$.

      ב. $v_0$.

      ג. $v_0$: המטען והמסה לא מופיעים בתנאי.

      ד. $v_0$: השדה החשמלי לא השתנה.
    solution:
      - kind: formula
        text: >-
          $v = \dfrac{E}{B}$ ו-$E = \dfrac{V}{d}$, ולכן $v = \dfrac{V}{Bd}$.
      - kind: reasoning
        text: >-
          א. $B$ כפול ו-$E$ לא השתנה, ולכן $v = E/B$ קטנה פי 2. יונים במהירות $v_0$ מתכופפים עכשיו לצד של הכוח המגנטי.
      - kind: reasoning
        text: >-
          ב. גם $E$ (דרך המתח) וגם $B$ כפולים, והיחס ביניהם לא השתנה.
      - kind: reasoning
        text: >-
          ג. שני הכוחות, $qE$ ו-$qvB$, כפולים, והם עדיין שווים באותה מהירות. המסה לא מופיעה, כי כשהכוח השקול אפס אין תאוצה. (המסה והמטען משנים רק כמה מהר מתכופף יון שמהירותו שונה מ-$E/B$.)
      - kind: reasoning
        text: >-
          ד. $E = \dfrac{V/2}{d/2} = \dfrac{V}{d}$: השדה בין הלוחות לא השתנה, ולכן גם $E/B$.
      - kind: result
        text: >-
          א. $v_0/2$.

          ב. $v_0$.

          ג. $v_0$.

          ד. $v_0$.

  - id: W-4.7-05
    level: mid
    qualitative: false
    objectives: [OBJ-4.7-3]
    prompt: >-
      בבורר מהירויות השדה החשמלי $6\cdot10^{4}\,\text{V/m}$, כלפי מטה, והשדה המגנטי $0.1\,\text{T}$, ⊗. פרוטון נכנס ימינה במהירות $8\cdot10^{5}\,\text{m/s}$.

      א. איזו מהירות הבורר מעביר ישר? האם הפרוטון מהיר או איטי ממנה?

      ב. חשבו את שני הכוחות על הפרוטון ברגע הכניסה, את הכוח השקול ואת התאוצה. לאיזה צד הוא מתכופף?

      ג. יון מימן שלילי, $\text{H}^-$, נכנס באותה מהירות. לאיזה צד הוא מתכופף, ומה גודל התאוצה שלו? (המסה שלו כמעט שווה למסת הפרוטון.)
    answer: >-
      א. $6\cdot10^{5}\,\text{m/s}$; הפרוטון מהיר ממנה.

      ב. $F_E = 9.6\cdot10^{-15}\,\text{N}$ כלפי מטה, $F_B = 1.28\cdot10^{-14}\,\text{N}$ כלפי מעלה, שקול $3.2\cdot10^{-15}\,\text{N}$ ותאוצה כ-$1.9\cdot10^{12}\,\text{m/s}^2$ כלפי מעלה, לצד הכוח המגנטי.

      ג. כלפי מטה (גם אצלו לצד הכוח המגנטי), באותה תאוצה בקירוב, כ-$1.9\cdot10^{12}\,\text{m/s}^2$.
    solution:
      - kind: given
        text: >-
          $E = 6\cdot10^{4}\,\text{V/m}$ (כלפי מטה), $B = 0.1\,\text{T}$ (⊗), $v = 8\cdot10^{5}\,\text{m/s}$, $e = 1.6\cdot10^{-19}\,\text{C}$, $m_p = 1.67\cdot10^{-27}\,\text{kg}$.
      - kind: formula
        text: >-
          $v_0 = \dfrac{E}{B}$, $F_E = eE$, $F_B = evB$, והשקול $F = F_B - F_E$ (הכוחות מנוגדים). $a = \dfrac{F}{m}$.
      - kind: substitution
        text: >-
          א. $v_0 = \dfrac{6\cdot10^{4}}{0.1} = 6\cdot10^{5}\,\text{m/s}$, והפרוטון מהיר יותר.

          ב. $F_E = 1.6\cdot10^{-19}\cdot6\cdot10^{4} = 9.6\cdot10^{-15}\,\text{N}$, $F_B = 1.6\cdot10^{-19}\cdot8\cdot10^{5}\cdot0.1 = 1.28\cdot10^{-14}\,\text{N}$, $F = 1.28\cdot10^{-14} - 9.6\cdot10^{-15} = 3.2\cdot10^{-15}\,\text{N}$, ו-$a = \dfrac{3.2\cdot10^{-15}}{1.67\cdot10^{-27}} \approx 1.9\cdot10^{12}\,\text{m/s}^2$.
      - kind: reasoning
        text: >-
          ב. הכוח החשמלי על הפרוטון בכיוון השדה, כלפי מטה. כלל כף יד ימין (האצבעות לתוך הדף, האגודל ימינה) נותן כוח מגנטי כלפי מעלה. המגנטי גדול יותר, כי הפרוטון מהיר מ-$v_0$, ולכן הפרוטון מתכופף כלפי מעלה.
      - kind: reasoning
        text: >-
          ג. על $\text{H}^-$ שני הכוחות הפוכים: החשמלי כלפי מעלה והמגנטי כלפי מטה, באותם גדלים. גם אצלו המגנטי גובר, ולכן הוא מתכופף כלפי מטה, לצד הכוח המגנטי שלו. המסה כמעט כמו של פרוטון, ולכן התאוצה כמעט זהה.
      - kind: result
        text: >-
          א. $6\cdot10^{5}\,\text{m/s}$; הפרוטון מהיר יותר.

          ב. שקול $3.2\cdot10^{-15}\,\text{N}$ ותאוצה כ-$1.9\cdot10^{12}\,\text{m/s}^2$, כלפי מעלה.

          ג. כלפי מטה, בתאוצה כ-$1.9\cdot10^{12}\,\text{m/s}^2$.

  - id: W-4.7-06
    level: mid
    qualitative: true
    objectives: [OBJ-4.7-3]
    prompt: >-
      שלושה פרוטונים נכנסים לבורר מהירויות שבו הלוח העליון חיובי והשדה המגנטי ⊗: אחד במהירות $E/B$, אחד מהיר ממנה ואחד איטי ממנה. קבעו ונמקו:

      א. לאיזה צד מתכופף כל אחד?

      ב. האם המהירות של כל אחד גדלה, קטנה או נשארת קבועה בזמן שהוא בין הלוחות? (רמז: איזה כוח יכול לעשות עבודה?)
    answer: >-
      א. המדויק ישר, המהיר כלפי מעלה (לצד הכוח המגנטי), האיטי כלפי מטה (לצד הכוח החשמלי).

      ב. המדויק: קבועה. האיטי: גדלה, כי הוא זז לאורך הכוח החשמלי. המהיר: קטנה, כי הוא זז נגד הכוח החשמלי.
    solution:
      - kind: given
        text: >-
          השדה החשמלי כלפי מטה (הלוח העליון חיובי), ולכן הכוח החשמלי על פרוטון כלפי מטה. כלל כף יד ימין (האצבעות לתוך הדף, האגודל ימינה) נותן כוח מגנטי כלפי מעלה.
      - kind: reasoning
        text: >-
          א. רק הכוח המגנטי, $evB$, תלוי במהירות. במהירות $E/B$ הכוחות שווים, והפרוטון ממשיך ישר. במהירות גדולה יותר המגנטי גובר, והפרוטון מתכופף כלפי מעלה; במהירות קטנה יותר החשמלי גובר, והפרוטון מתכופף כלפי מטה.
      - kind: reasoning
        text: >-
          ב. הכוח המגנטי ניצב תמיד למהירות, ולכן אף פעם לא עושה עבודה (שיעור 4.5). הכוח החשמלי עושה עבודה רק כשהפרוטון זז לאורך השדה, כלומר למעלה או למטה. המדויק לא זז אנכית: אין עבודה, והמהירות קבועה. האיטי זז כלפי מטה, בכיוון הכוח החשמלי: עבודה חיובית, והמהירות גדלה. המהיר זז כלפי מעלה, נגד הכוח החשמלי: עבודה שלילית, והמהירות קטנה.
      - kind: result
        text: >-
          א. המדויק ישר, המהיר כלפי מעלה, האיטי כלפי מטה.

          ב. המדויק: קבועה; האיטי: גדלה; המהיר: קטנה. רק הכוח החשמלי משנה את גודל המהירות, וגם הוא רק כשהפרוטון סוטה מהקו הישר.

  - id: W-4.7-07
    level: mid
    qualitative: false
    objectives: [OBJ-4.7-4]
    prompt: >-
      בספקטרומטר של ביינברידג׳ המתח בין לוחות הבורר $500\,\text{V}$, המרחק ביניהם $1\,\text{cm}$, והשדה המגנטי בבורר $0.1\,\text{T}$. השדה השני $B' = 0.4\,\text{T}$, ⊗. נכנסת תערובת של פרוטונים ודאוטרונים, במהירויות שונות.

      א. באיזו מהירות יוצאים היונים מהבורר?

      ב. באיזה מרחק מהסדק פוגע כל סוג, ומאיזה צד של הסדק?
    answer: >-
      א. $5\cdot10^{5}\,\text{m/s}$, לשני הסוגים.

      ב. פרוטונים כ-$2.6\,\text{cm}$ ודאוטרונים כ-$5.2\,\text{cm}$, שניהם מעל הסדק (כשהיונים יוצאים ימינה).
    solution:
      - kind: given
        text: >-
          $V = 500\,\text{V}$, $d = 0.01\,\text{m}$, $B = 0.1\,\text{T}$, $B' = 0.4\,\text{T}$ (⊗). פרוטון: $e$, $m_p$; דויטרון: $e$, $2m_p$.
      - kind: formula
        text: >-
          $E = \dfrac{V}{d}$, $v = \dfrac{E}{B}$, $r = \dfrac{mv}{qB'}$, והמרחק מהסדק $D = 2r$.
      - kind: substitution
        text: >-
          א. $E = \dfrac{500}{0.01} = 5\cdot10^{4}\,\text{V/m}$, $v = \dfrac{5\cdot10^{4}}{0.1} = 5\cdot10^{5}\,\text{m/s}$.

          ב. $r_p = \dfrac{1.67\cdot10^{-27}\cdot5\cdot10^{5}}{1.6\cdot10^{-19}\cdot0.4} \approx 1.30\,\text{cm}$, ולכן $D_p \approx 2.61\,\text{cm}$. לדויטרון המסה כפולה והמטען זהה, ולכן $D_d = 2D_p \approx 5.22\,\text{cm}$.
      - kind: reasoning
        text: >-
          ב. היונים חיוביים ויוצאים מהסדק ימינה לתוך שדה ⊗. כלל כף יד ימין נותן כוח כלפי מעלה, ולכן הם פונים למעלה וחוזרים לדופן מעל הסדק.
      - kind: result
        text: >-
          א. $5\cdot10^{5}\,\text{m/s}$.

          ב. פרוטונים כ-$2.6\,\text{cm}$ ודאוטרונים כ-$5.2\,\text{cm}$ מעל הסדק.

  - id: W-4.7-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-4.7-2, OBJ-4.7-4]
    prompt: >-
      מתכננים ספקטרומטר של ביינברידג׳ שיפריד בין יוני ליתיום-6 ליוני ליתיום-7 (מסות של כ-$6m_p$ וכ-$7m_p$, מטען $e$ לכל יון). הבורר צריך להעביר יונים במהירות $3\cdot10^{5}\,\text{m/s}$, והשדה המגנטי בו $0.12\,\text{T}$. הלוחות במרחק $1.5\,\text{cm}$ זה מזה.

      א. איזה מתח צריך לחבר ללוחות?

      ב. רוצים שהכתמים של שני האיזוטופים יהיו לפחות $2\,\text{cm}$ זה מזה. מה השדה השני $B'$ הגדול ביותר שאפשר?

      ג. בוחרים $B' = 0.25\,\text{T}$. איפה פוגע כל איזוטופ, ומה המרחק בין הכתמים?
    answer: >-
      א. $540\,\text{V}$.

      ב. כ-$0.31\,\text{T}$.

      ג. כ-$15.0\,\text{cm}$ וכ-$17.5\,\text{cm}$ מהסדק, כ-$2.5\,\text{cm}$ זה מזה.
    solution:
      - kind: given
        text: >-
          $v = 3\cdot10^{5}\,\text{m/s}$, $B = 0.12\,\text{T}$, $d = 0.015\,\text{m}$, $q = e$, $m_6 = 6m_p$, $m_7 = 7m_p$, ההפרש הדרוש בין הכתמים $\Delta D \ge 0.02\,\text{m}$.
      - kind: formula
        text: >-
          $v = \dfrac{E}{B}$ ו-$E = \dfrac{V}{d}$; $D = 2r = \dfrac{2mv}{qB'}$.
      - kind: manipulation
        text: >-
          א. מתנאי הבחירה $E = vB$, ומכאן $V = Ed = vBd$.

          ב. לשני האיזוטופים אותה מהירות ואותו מטען, ולכן ההפרש בין הכתמים $\Delta D = \dfrac{2(m_7 - m_6)v}{eB'} = \dfrac{2m_pv}{eB'}$. ההפרש הפוך ל-$B'$, ולכן הדרישה $\Delta D \ge 0.02\,\text{m}$ נותנת חסם עליון: כופלים ב-$B'$ ומחלקים ב-$0.02$, ומקבלים $B' \le \dfrac{2m_pv}{e\cdot0.02}$.
      - kind: substitution
        text: >-
          א. $V = 3\cdot10^{5}\cdot0.12\cdot0.015 = 540\,\text{V}$.

          ב. $B' \le \dfrac{2\cdot1.67\cdot10^{-27}\cdot3\cdot10^{5}}{1.6\cdot10^{-19}\cdot0.02} \approx 0.313\,\text{T}$.

          ג. $D_6 = \dfrac{2\cdot6\cdot1.67\cdot10^{-27}\cdot3\cdot10^{5}}{1.6\cdot10^{-19}\cdot0.25} \approx 15.0\,\text{cm}$, $D_7 = \dfrac{7}{6}D_6 \approx 17.5\,\text{cm}$, וההפרש $\approx 2.5\,\text{cm}$.
      - kind: result
        text: >-
          א. $540\,\text{V}$.

          ב. $B' \le 0.31\,\text{T}$ בערך: שדה חזק יותר מקרב את הכתמים.

          ג. $15.0\,\text{cm}$ ו-$17.5\,\text{cm}$ מהסדק, כ-$2.5\,\text{cm}$ זה מזה.

  - id: W-4.7-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-4.7-4]
    prompt: >-
      בספקטרומטר של ביינברידג׳ $E = 5\cdot10^{4}\,\text{V/m}$ ו-$B = 0.1\,\text{T}$ בבורר, ו-$B' = 0.2\,\text{T}$. יונים מסוג אחד פוגעים בגלאי במרחק $10.4\,\text{cm}$ מהסדק.

      א. מה היחס בין המסה למטען של היונים?

      ב. אילו יונים אלה יכולים להיות, אם המטען שלהם $e$? ואם הוא $2e$?

      ג. האם אפשר להבחין בין שתי האפשרויות בעזרת הספקטרומטר הזה, בכל בחירה של $E$, $B$ ו-$B'$? נמקו.
    answer: >-
      א. כ-$2.08\cdot10^{-8}\,\text{kg/C}$.

      ב. עם מטען $e$: מסה כ-$2m_p$, דאוטרונים. עם $2e$: מסה כ-$4m_p$, חלקיקי אלפא.

      ג. לא. מקום הפגיעה תלוי רק ב-$m/q$, ולשתי האפשרויות אותו יחס.
    solution:
      - kind: given
        text: >-
          $E = 5\cdot10^{4}\,\text{V/m}$, $B = 0.1\,\text{T}$, $B' = 0.2\,\text{T}$, $D = 0.104\,\text{m}$, ולכן $r = 0.052\,\text{m}$.
      - kind: formula
        text: >-
          $r = \dfrac{mE}{qBB'}$ (ספקטרומטר של ביינברידג׳).
      - kind: manipulation
        text: >-
          כופלים את שני האגפים ב-$\dfrac{BB'}{E}$, כדי לבודד את היחס: $\dfrac{m}{q} = \dfrac{rBB'}{E}$.
      - kind: substitution
        text: >-
          א. $\dfrac{m}{q} = \dfrac{0.052\cdot0.1\cdot0.2}{5\cdot10^{4}} = 2.08\cdot10^{-8}\,\text{kg/C}$.

          ב. עם $q = e$: $m = 1.6\cdot10^{-19}\cdot2.08\cdot10^{-8} \approx 3.33\cdot10^{-27}\,\text{kg} \approx 2m_p$. עם $q = 2e$: $m \approx 6.66\cdot10^{-27}\,\text{kg} \approx 4m_p$.
      - kind: reasoning
        text: >-
          ג. בבורר המהירות הנבחרת לא תלויה בחלקיק, ובשדה השני הרדיוס תלוי רק ב-$m/q$. לדויטרון ולחלקיק אלפא אותו $m/q$, ולכן בכל בחירה של השדות הם פוגעים באותו מקום. כדי להבחין ביניהם צריך מדידה נוספת שתלויה במטען לבדו או במסה לבדה.
      - kind: result
        text: >-
          א. $2.08\cdot10^{-8}\,\text{kg/C}$.

          ב. דאוטרונים (מטען $e$) או חלקיקי אלפא (מטען $2e$).

          ג. לא: הספקטרומטר מודד רק את $m/q$.

  - id: W-4.7-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-4.7-2, OBJ-4.7-3]
    prompt: >-
      פרוטונים יוצאים ממנוחה ומואצים במתח $U = 1300\,\text{V}$ (שיעור 2.4). אחר כך הם נכנסים לבורר מהירויות שבו השדה המגנטי $0.1\,\text{T}$, והלוחות במרחק $1\,\text{cm}$ זה מזה.

      א. מה המהירות של הפרוטונים בכניסה לבורר?

      ב. איזה מתח צריך לחבר ללוחות כדי שהפרוטונים יעברו ישר?

      ג. מחליפים את הפרוטונים בדאוטרונים, שמואצים באותו מתח $U$, ולא משנים את הבורר. האם הם עוברים? אם לא, לאיזה צד הם מתכופפים, ואיזה מתח בין הלוחות יעביר אותם?
    answer: >-
      א. כ-$4.99\cdot10^{5}\,\text{m/s}$.

      ב. כ-$499\,\text{V}$, כלומר כ-$500\,\text{V}$.

      ג. לא. מהירותם כ-$3.53\cdot10^{5}\,\text{m/s}$, איטית מ-$E/B$, ולכן הם מתכופפים לצד הכוח החשמלי. יעביר אותם מתח של כ-$353\,\text{V}$.
    solution:
      - kind: given
        text: >-
          $U = 1300\,\text{V}$, $B = 0.1\,\text{T}$, $d = 0.01\,\text{m}$. פרוטון: $e$, $m_p = 1.67\cdot10^{-27}\,\text{kg}$; דויטרון: $e$, $2m_p$.
      - kind: formula
        text: >-
          שימור אנרגיה בהאצה: $\tfrac{1}{2}mv^2 = qU$. בבורר: $v = \dfrac{E}{B}$ ו-$E = \dfrac{V}{d}$.
      - kind: manipulation
        text: >-
          מבודדים את המהירות: $v = \sqrt{\dfrac{2qU}{m}}$. מתנאי הבחירה $V = Ed = vBd$.
      - kind: substitution
        text: >-
          א. $v_p = \sqrt{\dfrac{2\cdot1.6\cdot10^{-19}\cdot1300}{1.67\cdot10^{-27}}} \approx 4.99\cdot10^{5}\,\text{m/s}$.

          ב. $V = 4.99\cdot10^{5}\cdot0.1\cdot0.01 \approx 499\,\text{V}$.

          ג. לדויטרון מסה כפולה, ולכן $v_d = \dfrac{v_p}{\sqrt{2}} \approx 3.53\cdot10^{5}\,\text{m/s}$, והמתח שיעביר אותו $V_d = 3.53\cdot10^{5}\cdot0.1\cdot0.01 \approx 353\,\text{V}$.
      - kind: reasoning
        text: >-
          ג. הבורר מכוון ל-$4.99\cdot10^{5}\,\text{m/s}$, והדאוטרונים איטיים יותר. הכוח המגנטי עליהם, $evB$, קטן מהכוח החשמלי, $eE$, ולכן הם מתכופפים לצד הכוח החשמלי, אל הלוח השלילי. שימו לב: הבורר עצמו לא "מבחין" בין פרוטון לדויטרון; מה שהשתנה הוא המהירות שהם קיבלו בהאצה.
      - kind: result
        text: >-
          א. $4.99\cdot10^{5}\,\text{m/s}$.

          ב. כ-$500\,\text{V}$.

          ג. לא עוברים; מתכופפים לצד הכוח החשמלי. מתח של כ-$353\,\text{V}$ יעביר אותם.

challenge:
  - id: W-4.7-c1
    stars: 1
    objectives: [OBJ-4.7-2, OBJ-4.7-4]
    prompt: >-
      פרוטון נע בקו ישר, במהירות קבועה של $2\cdot10^{5}\,\text{m/s}$, באזור שבו יש שדה חשמלי ושדה מגנטי ניצבים זה לזה ולמהירות. מכבים את השדה החשמלי, והפרוטון נע עכשיו במעגל שרדיוסו $2\,\text{cm}$.

      א. מה גודל השדה המגנטי?

      ב. מה היה גודל השדה החשמלי לפני שכיבו אותו?

      ג. מה יקרה אם במקום לכבות את השדה החשמלי מכבים את השדה המגנטי? תארו את המסלול במילים.
    answer: >-
      א. כ-$0.104\,\text{T}$.

      ב. כ-$2.09\cdot10^{4}\,\text{V/m}$.

      ג. נשאר רק כוח חשמלי קבוע, ניצב למהירות ההתחלתית: מסלול של קליע (פרבולה), כמו בשיעור 1.10.
    solution:
      - kind: given
        text: >-
          $v = 2\cdot10^{5}\,\text{m/s}$, $r = 0.02\,\text{m}$, $e = 1.6\cdot10^{-19}\,\text{C}$, $m_p = 1.67\cdot10^{-27}\,\text{kg}$. בהתחלה הפרוטון נע ישר במהירות קבועה, ולכן הכוח השקול אפס: $eE = evB$.
      - kind: formula
        text: >-
          אחרי הכיבוי פועל רק הכוח המגנטי, והוא הכוח המרכזי: $r = \dfrac{mv}{qB}$ (שיעור 4.6). לפני הכיבוי: $v = \dfrac{E}{B}$.
      - kind: manipulation
        text: >-
          מבודדים את השדה המגנטי מנוסחת הרדיוס: $B = \dfrac{mv}{qr}$. מתנאי הבחירה $E = vB$.
      - kind: substitution
        text: >-
          א. $B = \dfrac{1.67\cdot10^{-27}\cdot2\cdot10^{5}}{1.6\cdot10^{-19}\cdot0.02} \approx 0.104\,\text{T}$.

          ב. $E = 2\cdot10^{5}\cdot0.104 \approx 2.09\cdot10^{4}\,\text{V/m}$.
      - kind: reasoning
        text: >-
          ג. בלי השדה המגנטי נשאר כוח חשמלי קבוע, $eE$, בכיוון קבוע וניצב למהירות ההתחלתית. זה בדיוק המצב של שיעור 1.10: מהירות קבועה לאורך הכיוון ההתחלתי, ותאוצה קבועה בניצב לו. המסלול פרבולה, והמהירות גדלה, כי הכוח החשמלי עושה עבודה.
      - kind: result
        text: >-
          א. $B \approx 0.104\,\text{T}$.

          ב. $E \approx 2.09\cdot10^{4}\,\text{V/m}$.

          ג. פרבולה, כמו קליע, והפרוטון מאיץ.
    source:
      name: JEE Main (India), January session
      year: 2025
      problem: '22 January 2025, Shift 2, Physics: the proton moving undeflected in crossed fields at 2·10⁵ m/s (question number not shown in the source)'
      url: https://competishun.com/a-proton-is-moving-undeflected-in-a-region-of-crossed-electric-and-magnetic-fields-at-a-constant-speed-of-2-times-105-mathrmms-1-when-the-electric-field-is-switched-off-the-proton-moves-along-a-circul/
