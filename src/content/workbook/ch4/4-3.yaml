# Workbook, lesson 4.3 (loop and solenoid). Format and rules: see .claude/CLAUDE.md, "Worked examples, workbook".
# Every number was recomputed with src/physics/magnetism.ts (loopCenterField, loopField, loopAxisField,
# solenoidField, straightWireField) and src/physics/constants.ts (MU0); script recompute-4-3-wb.ts in the
# session scratchpad. In a >- block, consecutive lines fold into one paragraph: every part (א, ב, …)
# starts after a blank line.

lesson: '4.3'
practice:
  - id: W-4.3-01
    level: basic
    qualitative: false
    objectives: [OBJ-4.3-2]
    prompt: >-
      בכריכה אחת ברדיוס $10\,\text{cm}$ זורם זרם של $4\,\text{A}$.

      א. מה עוצמת השדה המגנטי במרכז הכריכה?

      ב. רוצים שבמרכז יהיה שדה גדול פי 10 מהרכיב האופקי של השדה של כדור הארץ, $3\cdot10^{-5}\,\text{T}$, עם אותו רדיוס ואותו זרם. כמה כריכות צמודות צריך לפחות?
    answer: >-
      א. $B \approx 2.51\cdot10^{-5}\,\text{T}$.

      ב. 12 כריכות.
    solution:
      - kind: given
        text: >-
          $R = 0.1\,\text{m}$, $I = 4\,\text{A}$; בסעיף ב השדה הדרוש $B = 10\cdot3\cdot10^{-5} = 3\cdot10^{-4}\,\text{T}$.
      - kind: formula
        text: >-
          $B = \dfrac{\mu_0 N I}{2R}$.
      - kind: substitution
        text: >-
          א. עם $N = 1$: $B = \dfrac{4\pi\cdot10^{-7}\cdot4}{2\cdot0.1} \approx 2.51\cdot10^{-5}\,\text{T}$, קצת פחות מהשדה של כדור הארץ.
      - kind: manipulation
        text: >-
          ב. כופלים את שני האגפים ב-$2R$ ומחלקים ב-$\mu_0 I$, כדי לבודד את $N$: $N = \dfrac{2RB}{\mu_0 I} = \dfrac{2\cdot0.1\cdot3\cdot10^{-4}}{4\pi\cdot10^{-7}\cdot4} \approx 11.9$. מספר הכריכות שלם, ו-11 כריכות נותנות קצת פחות מהדרוש, ולכן מעגלים למעלה.
      - kind: result
        text: >-
          א. $2.51\cdot10^{-5}\,\text{T}$.

          ב. לפחות 12 כריכות.

  - id: W-4.3-02
    level: basic
    qualitative: true
    objectives: [OBJ-4.3-1]
    prompt: >-
      כריכה מונחת על שולחן אופקי. כשמסתכלים עליה מלמעלה, הזרם בה זורם **נגד כיוון השעון**.

      א. מה כיוון השדה המגנטי במרכז הכריכה?

      ב. איזה צד של הכריכה, העליון או התחתון, מתנהג כקוטב צפוני?

      ג. מקרבים אל מרכז הכריכה, מלמעלה, את הקוטב הצפוני של מגנט מוט. האם הכריכה והמגנט ימשכו זה את זה או ידחו זה את זה? נמקו.
    answer: >-
      א. כלפי מעלה.

      ב. הצד העליון.

      ג. ידחו: קוטב צפוני מול קוטב צפוני.
    solution:
      - kind: reasoning
        text: >-
          א. כלל יד ימין לכריכה: מכופפים את אצבעות יד ימין נגד כיוון השעון, כפי שרואים מלמעלה, והאגודל מצביע כלפי מעלה, אל הצופה. זה כיוון השדה במרכז.
      - kind: reasoning
        text: >-
          ב. קווי השדה עוברים דרך הכריכה מלמטה למעלה, ויוצאים ממנה בצד העליון. הצד שממנו הקווים יוצאים מתנהג כקוטב צפוני, כמו קצה של מגנט מוט (שיעור 4.1).
      - kind: reasoning
        text: >-
          ג. מעל הכריכה יש עכשיו "קוטב צפוני", ומלמעלה מתקרב אליו הקוטב הצפוני של המגנט. קטבים שווים דוחים זה את זה.
      - kind: result
        text: >-
          א. כלפי מעלה. ב. הצד העליון. ג. הם ידחו זה את זה.

  - id: W-4.3-03
    level: basic
    qualitative: false
    objectives: [OBJ-4.3-3]
    prompt: >-
      סליל באורך $60\,\text{cm}$ עשוי מ-1200 כריכות, וזורם בו זרם של $0.5\,\text{A}$.

      א. מה צפיפות הכריכות, ומה השדה בתוך הסליל?

      ב. רוצים סליל עם אותו שדה ואותו זרם, אבל עם 600 כריכות בלבד. מה צריך להיות האורך שלו?
    answer: >-
      א. $n = 2000$ כריכות למטר, $B \approx 1.26\cdot10^{-3}\,\text{T}$.

      ב. $30\,\text{cm}$.
    solution:
      - kind: given
        text: >-
          $N = 1200$, $L = 0.6\,\text{m}$, $I = 0.5\,\text{A}$.
      - kind: formula
        text: >-
          $n = \dfrac{N}{L}$, $B = \mu_0 n I$.
      - kind: substitution
        text: >-
          א. $n = \dfrac{1200}{0.6} = 2000$ למטר, ו-$B = 4\pi\cdot10^{-7}\cdot2000\cdot0.5 \approx 1.26\cdot10^{-3}\,\text{T}$.
      - kind: reasoning
        text: >-
          ב. אותו זרם ואותו שדה פירושם אותה צפיפות כריכות, $n = 2000$ למטר. מ-$n = N/L$: $L = \dfrac{N}{n} = \dfrac{600}{2000} = 0.3\,\text{m}$.
      - kind: result
        text: >-
          א. $2000$ כריכות למטר, $1.26\cdot10^{-3}\,\text{T}$.

          ב. $30\,\text{cm}$.

  - id: W-4.3-04
    level: mid
    qualitative: false
    objectives: [OBJ-4.3-1, OBJ-4.3-2]
    prompt: >-
      רוצים לבטל את הרכיב האופקי של השדה של כדור הארץ, $3\cdot10^{-5}\,\text{T}$ צפונה, במרכז של סליל שטוח עם 30 כריכות ברדיוס $6\,\text{cm}$. מישור הסליל אנכי.

      א. לאיזה כיוון צריך לפנות הציר של הסליל, ולאיזה כיוון צריך להצביע השדה שלו במרכז?

      ב. מה הזרם הדרוש?

      ג. מסתכלים על הסליל מהצד הדרומי שלו. האם הזרם צריך לזרום עם כיוון השעון או נגדו?
    answer: >-
      א. הציר צפון–דרום; השדה של הסליל במרכז דרומה.

      ב. $I \approx 0.095\,\text{A}$, כ-$95\,\text{mA}$.

      ג. נגד כיוון השעון.
    solution:
      - kind: reasoning
        text: >-
          א. השדה במרכז כריכה ניצב למישור שלה, כלומר לאורך הציר. כדי לבטל שדה שמצביע צפונה, השדה של הסליל צריך להיות שווה לו בגודלו והפוך בכיוונו: דרומה. לכן הציר צריך לפנות צפון–דרום.
      - kind: formula
        text: >-
          $B = \dfrac{\mu_0 N I}{2R}$, עם $B = 3\cdot10^{-5}\,\text{T}$.
      - kind: manipulation
        text: >-
          כופלים ב-$2R$ ומחלקים ב-$\mu_0 N$: $I = \dfrac{2RB}{\mu_0 N}$.
      - kind: substitution
        text: >-
          ב. $I = \dfrac{2\cdot0.06\cdot3\cdot10^{-5}}{4\pi\cdot10^{-7}\cdot30} \approx 0.0955\,\text{A}$.
      - kind: reasoning
        text: >-
          ג. השדה צריך להצביע דרומה, כלומר אל מי שמסתכל מהצד הדרומי. כלל יד ימין: כשהאגודל מצביע אל הצופה, האצבעות המכופפות נגד כיוון השעון, כפי שהצופה רואה.
      - kind: result
        text: >-
          א. ציר צפון–דרום, שדה דרומה. ב. כ-$95\,\text{mA}$. ג. נגד כיוון השעון, כשמסתכלים מדרום.

  - id: W-4.3-05
    level: mid
    qualitative: false
    objectives: [OBJ-4.3-3]
    prompt: >-
      בניסוי מודדים את השדה באמצע סליל ארוך באורך $40\,\text{cm}$ בעזרת חיישן, בזרמים שונים. הנקודות על גרף של $B$ כפונקציה של $I$ נמצאות על קו ישר שעובר בראשית, והשיפוע של הקו המתאים ביותר הוא $2.5\cdot10^{-3}\,\text{T/A}$.

      א. מה המשמעות הפיזיקלית של השיפוע?

      ב. מצאו את צפיפות הכריכות ואת מספר הכריכות של הסליל.
    answer: >-
      א. השיפוע הוא $\mu_0 n$.

      ב. $n \approx 1990$ כריכות למטר, ובערך 800 כריכות.
    solution:
      - kind: formula
        text: >-
          $B = \mu_0 n I$: זה קשר של יחס ישר בין $B$ ל-$I$, ולכן הגרף קו ישר דרך הראשית (שיעור 0.4).
      - kind: reasoning
        text: >-
          א. בקו $B = (\mu_0 n)\cdot I$ השיפוע הוא המקדם של $I$: $\mu_0 n$.
      - kind: manipulation
        text: >-
          ב. נסמן את השיפוע ב-$k$. מ-$k = \mu_0 n$, מחלקים ב-$\mu_0$: $n = \dfrac{k}{\mu_0}$, ואחר כך $N = nL$.
      - kind: substitution
        text: >-
          $n = \dfrac{2.5\cdot10^{-3}}{4\pi\cdot10^{-7}} \approx 1989$ למטר, ו-$N = 1989\cdot0.4 \approx 796$.
      - kind: result
        text: >-
          א. השיפוע הוא $\mu_0 n$. ב. $n \approx 1990$ למטר, $N \approx 800$ כריכות.

  - id: W-4.3-06
    level: mid
    qualitative: true
    objectives: [OBJ-4.3-1, OBJ-4.3-3]
    prompt: >-
      בסליל ארוך זורם זרם, והקצה הימני שלו הוא הקוטב הצפוני. מסתכלים על ארבע נקודות: P באמצע הסליל, על הציר; Q באמצע הסליל, בפנים, קרוב לכריכות (אבל לא צמוד לתיל); S בקצה הימני של הסליל, על הציר; T מחוץ לסליל, צמוד לאמצעו.

      א. דרגו את עוצמת השדה בארבע הנקודות, מהגדול לקטן, ונמקו.

      ב. מה כיוון השדה בכל נקודה (ימינה או שמאלה)?
    answer: >-
      א. P ו-Q (כמעט שווים), אחר כך S (בערך חצי), ואחרון T (חלש מאוד).

      ב. ב-P, ב-Q וב-S ימינה; ב-T שמאלה.
    solution:
      - kind: reasoning
        text: >-
          א. בתוך סליל ארוך, רחוק מהקצוות, השדה כמעט אחיד, $B = \mu_0 n I$, גם קרוב לכריכות (כפי שהגשש מראה באיור 4.3א). לכן השדה ב-P וב-Q כמעט שווה.
      - kind: reasoning
        text: >-
          בקצה הסליל, על הציר, יש כריכות רק בצד אחד של הנקודה, ולכן השדה שם בערך חצי מהשדה שבאמצע (באיור 4.3א: גררו את הגשש לקצה). מחוץ לסליל קווי השדה מתפזרים על שטח גדול, והשדה ליד האמצע חלש פי עשרות מהשדה שבפנים.
      - kind: reasoning
        text: >-
          ב. בתוך הסליל השדה הולך אל הקוטב הצפוני, כלומר ימינה, גם ב-S, שם הקווים יוצאים מהסליל. בחוץ הקווים חוזרים מהקצה הצפוני אל הדרומי, ולכן ב-T השדה שמאלה.
      - kind: result
        text: >-
          א. $B_P \approx B_Q > B_S \approx B_P/2 > B_T$. ב. ימינה ב-P, ב-Q וב-S; שמאלה ב-T.

  - id: W-4.3-07
    level: mid
    qualitative: false
    objectives: [OBJ-4.3-3]
    prompt: >-
      יש לכם תיל מבודד באורך $31.4\,\text{m}$. מלפפים את כולו בכריכות צמודות על צינור ברדיוס $1\,\text{cm}$, לאורך $50\,\text{cm}$, ומעבירים בו זרם של $2\,\text{A}$.

      א. כמה כריכות יש בסליל, ומה השדה בתוכו?

      ב. מלפפים את אותו תיל על צינור ברדיוס $2\,\text{cm}$, שוב לאורך $50\,\text{cm}$, עם אותו זרם. מה השדה עכשיו? הרי בסליל ארוך השדה לא תלוי ברדיוס: מה השתנה?
    answer: >-
      א. כ-500 כריכות, $B \approx 2.51\cdot10^{-3}\,\text{T}$.

      ב. $B \approx 1.26\cdot10^{-3}\,\text{T}$: מאותו תיל יוצאות רק 250 כריכות, ו-$n$ קטן לחצי.
    solution:
      - kind: given
        text: >-
          אורך התיל $\ell = 31.4\,\text{m}$, $r = 0.01\,\text{m}$, $L = 0.5\,\text{m}$, $I = 2\,\text{A}$.
      - kind: formula
        text: >-
          כל כריכה צורכת תיל באורך ההיקף, $2\pi r$. נסמן את אורך התיל ב-$\ell$, ואז $N = \dfrac{\ell}{2\pi r}$. השדה $B = \dfrac{\mu_0 N I}{L}$.
      - kind: substitution
        text: >-
          א. $N = \dfrac{31.4}{2\pi\cdot0.01} \approx 500$, ו-$B = \dfrac{4\pi\cdot10^{-7}\cdot500\cdot2}{0.5} \approx 2.51\cdot10^{-3}\,\text{T}$.
      - kind: reasoning
        text: >-
          ב. היקף כפול פירושו חצי מהכריכות: $N \approx 250$, על אותו אורך. $B = \mu_0 n I$ באמת לא תלוי ברדיוס כש-$n$ קבוע, אבל כאן $n$ לא קבוע: אורך התיל קבוע, ולכן הרדיוס קובע כמה כריכות יוצאות ממנו.
      - kind: substitution
        text: >-
          $B = \dfrac{4\pi\cdot10^{-7}\cdot250\cdot2}{0.5} \approx 1.26\cdot10^{-3}\,\text{T}$.
      - kind: result
        text: >-
          א. כ-500 כריכות, $2.51\cdot10^{-3}\,\text{T}$.

          ב. $1.26\cdot10^{-3}\,\text{T}$, חצי, כי מספר הכריכות ירד לחצי.

  - id: W-4.3-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-4.3-3]
    prompt: >-
      בונים סליל מתיל נחושת דק שההתנגדות שלו $0.2\,\Omega$ לכל מטר, ומחברים אותו לסוללה אידאלית של $6\,\text{V}$. מלפפים את התיל בכריכות צמודות על צינור ברדיוס $1.5\,\text{cm}$, לאורך $30\,\text{cm}$.

      א. עם $30\,\text{m}$ של תיל: מה הזרם, כמה כריכות יש, ומה השדה בתוך הסליל?

      ב. מלפפים $60\,\text{m}$ של אותו תיל באותו אורך של $30\,\text{cm}$, בשתי שכבות (הניחו שלשתי השכבות כמעט אותו רדיוס). מה השדה עכשיו?

      ג. חוזרים ל-$30\,\text{m}$ של תיל, אבל מחליפים את הסוללה בסוללה של $6\,\text{V}$ שההתנגדות הפנימית שלה $2\,\Omega$. מה השדה עכשיו?
    answer: >-
      א. $I = 1\,\text{A}$, כ-318 כריכות, $B \approx 1.33\cdot10^{-3}\,\text{T}$.

      ב. אותו שדה, $1.33\cdot10^{-3}\,\text{T}$.

      ג. $1.0\cdot10^{-3}\,\text{T}$.
    solution:
      - kind: given
        text: >-
          $\varepsilon = 6\,\text{V}$ (סוללה אידאלית), $0.2\,\Omega$ למטר, $r = 0.015\,\text{m}$, $L = 0.3\,\text{m}$.
      - kind: formula
        text: >-
          התנגדות התיל $R = 0.2\cdot\ell$, עם $\ell$ אורך התיל; הזרם $I = \dfrac{\varepsilon}{R}$ (שיעור 3.3). כל כריכה צורכת תיל באורך ההיקף, ולכן $N = \dfrac{\ell}{2\pi r}$. השדה $B = \dfrac{\mu_0 N I}{L}$.
      - kind: substitution
        text: >-
          א. $R = 0.2\cdot30 = 6\,\Omega$, $I = 6/6 = 1\,\text{A}$, $N = \dfrac{30}{2\pi\cdot0.015} \approx 318$, ו-$B = \dfrac{4\pi\cdot10^{-7}\cdot318\cdot1}{0.3} \approx 1.33\cdot10^{-3}\,\text{T}$.
      - kind: reasoning
        text: >-
          ב. תיל כפול: ההתנגדות כפולה, $12\,\Omega$, ולכן הזרם חצי, $0.5\,\text{A}$. אבל גם מספר הכריכות כפול, כ-637, על אותו אורך. $B \propto NI$, ושני השינויים מתקזזים: $B = \dfrac{4\pi\cdot10^{-7}\cdot637\cdot0.5}{0.3} \approx 1.33\cdot10^{-3}\,\text{T}$.
      - kind: reasoning
        text: >-
          ג. מספר הכריכות לא משתנה, 318, אבל הזרם קטן: עם התנגדות פנימית, $I = \dfrac{\varepsilon}{R + r} = \dfrac{6}{6 + 2} = 0.75\,\text{A}$ (שיעור 3.6). השדה פרופורציוני לזרם: $B = \dfrac{4\pi\cdot10^{-7}\cdot318\cdot0.75}{0.3} \approx 1.0\cdot10^{-3}\,\text{T}$.
      - kind: result
        text: >-
          א. $1\,\text{A}$, כ-318 כריכות, $1.33\cdot10^{-3}\,\text{T}$. ב. $1.33\cdot10^{-3}\,\text{T}$. ג. $1.0\cdot10^{-3}\,\text{T}$.

  - id: W-4.3-09
    level: bagrut
    qualitative: true
    objectives: [OBJ-4.3-1, OBJ-4.3-3]
    prompt: >-
      שני סלילים מונחים על שולחן על אותו ציר, אחד אחרי השני, וביניהם רווח קטן. סליל א' (משמאל): 300 כריכות על $15\,\text{cm}$. סליל ב' (מימין): 600 כריכות על $30\,\text{cm}$. בשניהם זורם $1\,\text{A}$.

      כשמסתכלים על סליל א' מהקצה הימני שלו, הזרם נראה נגד כיוון השעון. כשמסתכלים על סליל ב' מהקצה השמאלי שלו, הזרם נראה גם הוא נגד כיוון השעון.

      א. מה הקטבים של שני הקצוות שפונים זה אל זה? האם הסלילים ימשכו זה את זה או ידחו זה את זה?

      ב. השוו את השדה בתוך שני הסלילים.

      ג. הופכים את הזרם רק בסליל ב'. מה משתנה בסעיפים א ו-ב?
    answer: >-
      א. שני הקצוות צפוניים, והסלילים ידחו זה את זה.

      ב. שווה: $2.51\cdot10^{-3}\,\text{T}$ בשניהם.

      ג. הקצה השמאלי של ב' נעשה דרומי, והסלילים ימשכו זה את זה. עוצמת השדה לא משתנה.
    solution:
      - kind: reasoning
        text: >-
          א. בקצה שבו הזרם נראה נגד כיוון השעון, האגודל של יד ימין מצביע אל הצופה, כלומר השדה יוצא מהסליל דרך הקצה הזה: זה קוטב צפוני. לכן הקצה הימני של א' צפוני, וגם הקצה השמאלי של ב' צפוני. קטבים שווים דוחים זה את זה (שיעור 4.1).
      - kind: formula
        text: >-
          $B = \mu_0 n I$, $n = N/L$.
      - kind: substitution
        text: >-
          ב. א': $n = 300/0.15 = 2000$ למטר. ב': $n = 600/0.3 = 2000$ למטר. לשניהם $B = 4\pi\cdot10^{-7}\cdot2000\cdot1 \approx 2.51\cdot10^{-3}\,\text{T}$. סליל ב' ארוך פי 2 ויש בו פי 2 כריכות, אבל צפיפות הכריכות זהה.
      - kind: reasoning
        text: >-
          ג. היפוך הזרם בסליל ב' הופך את השדה שלו: הקצה השמאלי שלו נעשה קוטב דרומי, מול הצפוני של א', והם ימשכו זה את זה. גודל השדה תלוי ב-$n$ וב-$I$ בלבד, ולכן לא משתנה.
      - kind: result
        text: >-
          א. צפוני מול צפוני: דחייה. ב. שווה, $2.51\cdot10^{-3}\,\text{T}$. ג. משיכה; העוצמה לא משתנה.

  - id: W-4.3-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-4.3-1, OBJ-4.3-2]
    prompt: >-
      תיל ישר ארוך וכריכה עגולה ברדיוס $5\,\text{cm}$ מונחים במישור הדף. בתיל זורם $10\,\text{A}$ ימינה, ומרכז הכריכה נמצא $10\,\text{cm}$ מתחת לתיל.

      א. מה עוצמת השדה של התיל במרכז הכריכה, ומה כיוונו?

      ב. איזה זרם צריך לזרום בכריכה, ובאיזה כיוון (עם כיוון השעון או נגדו), כדי שהשדה במרכז הכריכה יהיה אפס?

      ג. מה יהיה השדה במרכז אם יהפכו רק את הזרם בכריכה?
    answer: >-
      א. $2\cdot10^{-5}\,\text{T}$, לתוך הדף.

      ב. $I \approx 1.59\,\text{A}$, נגד כיוון השעון.

      ג. $4\cdot10^{-5}\,\text{T}$, לתוך הדף.
    solution:
      - kind: given
        text: >-
          $I_1 = 10\,\text{A}$ בתיל, $d = 0.1\,\text{m}$, $R = 0.05\,\text{m}$, $N = 1$.
      - kind: formula
        text: >-
          תיל: $B_1 = \dfrac{\mu_0 I_1}{2\pi d}$. כריכה: $B_2 = \dfrac{\mu_0 I_2}{2R}$.
      - kind: substitution
        text: >-
          א. $B_1 = \dfrac{4\pi\cdot10^{-7}\cdot10}{2\pi\cdot0.1} = 2\cdot10^{-5}\,\text{T}$. כלל יד ימין לתיל: האגודל ימינה, ומתחת לתיל האצבעות המכופפות פונות לתוך הדף (⊗).
      - kind: manipulation
        text: >-
          ב. השדה של הכריכה במרכז צריך להיות שווה לזה של התיל והפוך לו: $\dfrac{\mu_0 I_2}{2R} = \dfrac{\mu_0 I_1}{2\pi d}$. מצמצמים את $\mu_0$ וכופלים ב-$2R$: $I_2 = \dfrac{R I_1}{\pi d}$.
      - kind: substitution
        text: >-
          $I_2 = \dfrac{0.05\cdot10}{\pi\cdot0.1} \approx 1.59\,\text{A}$. השדה של הכריכה צריך להצביע החוצה מהדף (⊙): בכלל יד ימין לכריכה, אגודל אל הצופה פירושו זרם נגד כיוון השעון.
      - kind: reasoning
        text: >-
          ג. היפוך הזרם בכריכה הופך את השדה שלה ללתוך הדף, ועכשיו שני השדות באותו כיוון ומתחברים: $2\cdot10^{-5} + 2\cdot10^{-5} = 4\cdot10^{-5}\,\text{T}$.
      - kind: result
        text: >-
          א. $2\cdot10^{-5}\,\text{T}$, ⊗. ב. כ-$1.59\,\text{A}$, נגד כיוון השעון. ג. $4\cdot10^{-5}\,\text{T}$, ⊗.

challenge:
  - id: W-4.3-c1
    stars: 2
    objectives: [OBJ-4.3-1, OBJ-4.3-2]
    prompt: >-
      שני תילים ישרים ארוכים מאוד מונחים במישור אופקי, שנקרא לו מישור $xy$, לאורך הקווים $x = R$ ו-$x = -R$. בתיל שב-$x = R$ זורם זרם $I_1$, ובתיל שב-$x = -R$ זורם זרם $I_2$; זרם חיובי זורם בכיוון $+y$. כריכה ברדיוס $R$ תלויה מעל המישור, במקביל לו, ומרכזה בנקודה $(0, 0, \sqrt{3}R)$, כלומר בגובה $\sqrt{3}R$ מעל הראשית. בכריכה זורם זרם $I$ **עם כיוון השעון** כשמסתכלים עליה מלמעלה. הציר $z$ פונה כלפי מעלה.

      נתון: השדה על ציר של כריכה, במרחק $z$ ממרכזה, הוא $B = \dfrac{\mu_0 I R^2}{2(R^2 + z^2)^{3/2}}$, לאורך הציר.

      א. מה השדה של שני התילים בראשית, $(0,0,0)$? בטאו בעזרת $I_1$ ו-$I_2$, וציינו את הכיוון.

      ב. מה השדה של הכריכה בראשית, בגודל ובכיוון?

      ג. קבעו לכל אחד משלושת המקרים אם השדה הכולל בראשית **יכול** להיות אפס: (1) $I_1 = I_2$; (2) $I_1 > 0$ ו-$I_2 < 0$; (3) $I_1 < 0$ ו-$I_2 > 0$. עבור $R = 10\,\text{cm}$, $I = 8\,\text{A}$ ו-$I_2 = -1\,\text{A}$, מה צריך להיות $I_1$ כדי שהשדה בראשית יתאפס?

      ד. כש-$I_1 = I_2$, מה הרכיב $z$ של השדה במרכז הכריכה?
    answer: >-
      א. $\dfrac{\mu_0 (I_1 - I_2)}{2\pi R}$ בכיוון $+z$.

      ב. $\dfrac{\mu_0 I}{16R}$, בכיוון $-z$.

      ג. (1) לא; (2) כן; (3) לא. $I_1 = \pi - 1 \approx 2.14\,\text{A}$.

      ד. $-\dfrac{\mu_0 I}{2R}$.
    solution:
      - kind: reasoning
        text: >-
          א. הראשית נמצאת במישור של התילים, במרחק $R$ מכל אחד. כלל יד ימין לתיל שב-$x = R$: האגודל בכיוון $+y$, ומשמאל לתיל (לכיוון הראשית) האצבעות המכופפות פונות כלפי מעלה, $+z$. בתיל שב-$x = -R$ הראשית מימין לתיל, ושם השדה של זרם חיובי פונה כלפי מטה, $-z$.
      - kind: substitution
        text: >-
          $B_z = \dfrac{\mu_0 I_1}{2\pi R} - \dfrac{\mu_0 I_2}{2\pi R} = \dfrac{\mu_0 (I_1 - I_2)}{2\pi R}$.
      - kind: reasoning
        text: >-
          ב. הראשית נמצאת על ציר הכריכה, במרחק $z = \sqrt{3}R$ מתחת למרכזה. הזרם עם כיוון השעון כשמסתכלים מלמעלה, ולפי כלל יד ימין לכריכה האגודל מצביע כלפי מטה: לאורך כל הציר השדה פונה $-z$.
      - kind: substitution
        text: >-
          $R^2 + z^2 = R^2 + 3R^2 = 4R^2$, ו-$(4R^2)^{3/2} = 8R^3$. לכן $B = \dfrac{\mu_0 I R^2}{2\cdot8R^3} = \dfrac{\mu_0 I}{16R}$, כלפי מטה.
      - kind: reasoning
        text: >-
          ג. השדה הכולל בראשית לאורך $z$ הוא $\dfrac{\mu_0 (I_1 - I_2)}{2\pi R} - \dfrac{\mu_0 I}{16R}$. הוא יכול להתאפס רק אם $I_1 - I_2 > 0$. (1) $I_1 - I_2 = 0$: נשאר השדה של הכריכה, לא אפס. (2) $I_1 - I_2 > 0$: אפשרי. (3) $I_1 - I_2 < 0$: שני השדות כלפי מטה, לא אפס.
      - kind: manipulation
        text: >-
          תנאי האיפוס: $\dfrac{\mu_0 (I_1 - I_2)}{2\pi R} = \dfrac{\mu_0 I}{16R}$. מצמצמים את $\mu_0$ ואת $R$ וכופלים ב-$2\pi$: $I_1 - I_2 = \dfrac{\pi I}{8}$, ולכן $I_1 = I_2 + \dfrac{\pi I}{8} = -1 + \pi \approx 2.14\,\text{A}$.
      - kind: reasoning
        text: >-
          ד. מרכז הכריכה נמצא במרחק $\sqrt{R^2 + 3R^2} = 2R$ מכל תיל. השדה של כל תיל ניצב לקו הניצב שמחבר את התיל לנקודה. הקו הזה עולה $\sqrt{3}R$ בהתקדמות אופקית של $R$, ולכן הוא נוטה ב-$60^\circ$ לאופק ($\tan60^\circ = \sqrt{3}$), והשדה, שניצב לו, נוטה ב-$60^\circ$ לאנך. הרכיב $z$ של השדה הוא לכן $B\cos60^\circ$, חצי מהשדה, $\dfrac{1}{2}\cdot\dfrac{\mu_0 I_1}{2\pi\cdot2R}$. הכיוונים: לתיל שב-$x = R$ הרכיב כלפי מעלה, ולתיל שב-$x = -R$ כלפי מטה (כמו בסעיף א). כש-$I_1 = I_2$ שני הרכיבים מתבטלים, ונשאר השדה של הכריכה במרכזה, $\dfrac{\mu_0 I}{2R}$ כלפי מטה.
      - kind: result
        text: >-
          א. $\mu_0 (I_1 - I_2)/(2\pi R)$, $+z$. ב. $\mu_0 I/(16R)$, $-z$. ג. רק במקרה (2); $I_1 \approx 2.14\,\text{A}$. ד. $-\mu_0 I/(2R)$.
    source:
      name: JEE Advanced
      year: 2018
      problem: 'Paper 1, Physics, Q.5'
      url: https://jeeadv.ac.in/past_qps/2018_1.pdf
      verified: '2026-11-02'
      adapted: true

  - id: W-4.3-c2
    stars: 2
    objectives: [OBJ-4.3-1, OBJ-4.3-2]
    prompt: >-
      שתי כריכות עגולות מונחות במישור הדף, עם מרכז משותף: כריכה פנימית ברדיוס $R = 5\,\text{cm}$, וכריכה חיצונית ברדיוס $2R$. בכריכה הפנימית זורם $I_1 = 2\,\text{A}$ נגד כיוון השעון, ובחיצונית $I_2 = 6\,\text{A}$ עם כיוון השעון, כפי שאתם רואים אותן.

      א. מה עוצמת השדה במרכז המשותף, ומה כיוונו?

      ב. נמקו: למה בכל נקודה במישור הדף השדה ניצב לדף, ולמה עוצמתו תלויה רק במרחק $r$ מהמרכז?

      ג. קבעו ונמקו: האם יש נקודה במישור, בתוך הכריכה הפנימית ($r < R$), שבה השדה אפס?

      ד. מה כיוון השדה בנקודות שבין שתי הכריכות ($R < r < 2R$)? האם הוא יכול להתאפס שם?
    answer: >-
      א. $1.26\cdot10^{-5}\,\text{T}$, לתוך הדף.

      ב. כל קטע של התיל והנקודה נמצאים במישור הדף, ולכן השדה של כל קטע ניצב לדף; וכל הכיוונים סביב המרכז שווים.

      ג. כן: במרכז השדה לתוך הדף, וקרוב לתיל הפנימי הוא החוצה מהדף וחזק מאוד, ולכן בדרך הוא עובר דרך אפס.

      ד. לתוך הדף, ולא מתאפס.
    solution:
      - kind: formula
        text: >-
          השדה במרכז כריכה: $B = \dfrac{\mu_0 I}{2R}$, וכיוונו בכלל יד ימין לכריכה.
      - kind: substitution
        text: >-
          א. הפנימית: $\dfrac{4\pi\cdot10^{-7}\cdot2}{2\cdot0.05} \approx 2.51\cdot10^{-5}\,\text{T}$, החוצה מהדף (נגד כיוון השעון). החיצונית: $\dfrac{4\pi\cdot10^{-7}\cdot6}{2\cdot0.1} \approx 3.77\cdot10^{-5}\,\text{T}$, לתוך הדף (עם כיוון השעון). השדה השקול: $3.77\cdot10^{-5} - 2.51\cdot10^{-5} \approx 1.26\cdot10^{-5}\,\text{T}$, לתוך הדף.
      - kind: reasoning
        text: >-
          ב. כלל יד ימין לקטע קצר של התיל: האגודל לאורך הקטע, והאצבעות המכופפות מקיפות אותו. נקודה שנמצאת במישור הדף, לצד הקטע, נמצאת בדיוק במקום שבו האצבעות עוברות דרך הדף, ושם הן פונות החוצה מהדף או לתוכו. לכן השדה של כל קטע ניצב לדף, וגם הסכום. ואם מסובבים את שתי הכריכות סביב המרכז, שום דבר לא משתנה, ולכן העוצמה זהה בכל הנקודות שבאותו מרחק מהמרכז.
      - kind: reasoning
        text: >-
          ג. במרכז השדה לתוך הדף (סעיף א). כשמתקרבים לתיל של הכריכה הפנימית, התיל הקרוב נראה כמו תיל ישר, והשדה שלו גדל בלי גבול, כמו $1/r$ ליד תיל; בצד הפנימי של כריכה נגד כיוון השעון הוא פונה החוצה מהדף. השדה של הכריכה החיצונית נשאר סופי באזור הזה. לכן קרוב לתיל הפנימי השדה השקול פונה החוצה מהדף. הוא משנה כיוון בין המרכז לתיל, ולכן עובר דרך אפס: על מעגל שלם, בגלל הסימטריה. (חישוב מלא, מעבר לתוכנית, נותן מרחק של כ-$3.5\,\text{cm}$ מהמרכז.)
      - kind: reasoning
        text: >-
          ד. מחוץ לכריכה הפנימית השדה שלה במישור הפוך לשדה שבתוכה: קווי השדה מקיפים את התיל, ולכן מבחוץ הם חוזרים בכיוון ההפוך. לכן השדה של הפנימית שם לתוך הדף. בתוך הכריכה החיצונית, השדה שלה לתוך הדף (עם כיוון השעון). שני השדות באותו כיוון, ולכן השדה לא מתאפס שם.
      - kind: result
        text: >-
          א. $1.26\cdot10^{-5}\,\text{T}$, לתוך הדף. ב. ניצב לדף; תלוי רק ב-$r$. ג. כן, על מעגל שבתוך הכריכה הפנימית. ד. לתוך הדף, ואינו מתאפס.
    source:
      name: JEE Advanced
      year: 2021
      problem: 'Paper 2, Physics, Q.6'
      url: https://jeeadv.ac.in/past_qps/2021_2_English.pdf
      verified: '2026-11-02'
      adapted: true
