# Workbook, lesson 4.10 (torque on a coil, the motor). Format and rules: see .claude/CLAUDE.md, "Worked examples, workbook".
# Every number was recomputed with src/physics/magnetism.ts (wireForce, loopTorque), src/physics/coil.ts
# (meterDeflection) and constants.ts (G); script rc49c.ts in the session scratchpad.
# In a >- block, consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '4.10'
practice:
  - id: W-4.10-01
    level: basic
    qualitative: false
    objectives: [OBJ-4.10-1, OBJ-4.10-2]
    prompt: >-
      כריכה ריבועית אחת, בצלע של $10\,\text{cm}$, יכולה להסתובב על ציר שעובר באמצעה, במקביל לשתיים מהצלעות שלה. היא נמצאת בשדה מגנטי אחיד של $0.08\,\text{T}$ שניצב לציר, ומישורה מקביל לקווי השדה. בכריכה זורם $5\,\text{A}$.

      א. מה הכוח המגנטי על כל אחת מארבע הצלעות?

      ב. מה המומנט על הכריכה? חשבו פעם אחת מהכוחות והזרועות, ופעם אחת מהנוסחה $\tau = NBIA\sin\theta$.
    answer: >-
      א. על שתי הצלעות שמקבילות לציר $0.04\,\text{N}$ על כל אחת, בכיוונים הפוכים; על שתי האחרות, שמקבילות לשדה, אפס.

      ב. $\tau = 4\cdot10^{-3}\,\text{N·m}$.
    solution:
      - kind: given
        text: >-
          $N = 1$, $a = b = 0.1\,\text{m}$, $A = 0.01\,\text{m}^2$, $B = 0.08\,\text{T}$, $I = 5\,\text{A}$. מישור הכריכה מקביל לשדה, ולכן האנך ניצב לשדה: $\theta = 90^\circ$.
      - kind: formula
        text: >-
          $F = BIL\sin\alpha$ על כל צלע (שיעור 4.8), $\tau = F\cdot d$, ו-$\tau = NBIA\sin\theta$.
      - kind: reasoning
        text: >-
          א. הציר ניצב לשדה, ולכן שתי הצלעות שמקבילות לציר ניצבות לשדה, $\alpha = 90^\circ$. שתי הצלעות האחרות נמצאות במישור הכריכה, בניצב לציר, כלומר כאן הן מקבילות לשדה: $\alpha = 0$, ואין עליהן כוח.
      - kind: substitution
        text: >-
          א. $F = 0.08\cdot5\cdot0.1 = 0.04\,\text{N}$.

          ב. כל כוח פועל במרחק $b/2 = 0.05\,\text{m}$ מהציר, בניצב לקו מהציר אל הצלע, ולכן הזרוע $0.05\,\text{m}$, ושני הכוחות מסובבים לאותו כיוון: $\tau = 2\cdot0.04\cdot0.05 = 4\cdot10^{-3}\,\text{N·m}$. מהנוסחה: $\tau = 1\cdot0.08\cdot5\cdot0.01\cdot\sin90^\circ = 4\cdot10^{-3}\,\text{N·m}$.
      - kind: result
        text: >-
          א. $0.04\,\text{N}$ על כל צלע שמקבילה לציר, ואפס על שתי האחרות.

          ב. $4\cdot10^{-3}\,\text{N·m}$, בשתי הדרכים.

  - id: W-4.10-02
    level: basic
    qualitative: true
    objectives: [OBJ-4.10-1, OBJ-4.10-3]
    prompt: >-
      כריכה מלבנית נמצאת במישור הדף, בשדה מגנטי אחיד שמצביע החוצה מהדף, ⊙. בכריכה זורם זרם נגד כיוון השעון. הכריכה יכולה להסתובב סביב ציר אנכי שעובר באמצעה.

      א. קבעו את הכיוון של הכוח המגנטי על כל אחת מארבע הצלעות.

      ב. האם הכריכה תסתובב? האם היא תזוז ממקומה?

      ג. האם זה שיווי משקל יציב או רופף? מה ישתנה אם יהפכו את כיוון הזרם?
    answer: >-
      א. כל הכוחות במישור הדף, כלפי חוץ: על הצלע העליונה למעלה, על התחתונה למטה, על השמאלית שמאלה ועל הימנית ימינה.

      ב. לא זו ולא זו: הכוח השקול אפס והמומנט אפס. הכוחות רק מותחים את הכריכה.

      ג. יציב: האנך בכיוון השדה. עם זרם הפוך הכוחות לוחצים פנימה, האנך הפוך לשדה, וזה שיווי משקל רופף.
    solution:
      - kind: given
        text: >-
          השדה ⊙, ניצב למישור הכריכה. הזרם נגד כיוון השעון: בצלע העליונה שמאלה, בשמאלית למטה, בתחתונה ימינה ובימנית למעלה.
      - kind: reasoning
        text: >-
          א. כלל כף יד ימין, האצבעות אליכם (⊙): בצלע העליונה האגודל שמאלה, וכף היד פונה למעלה. באותה דרך, בשמאלית (האגודל למטה) הכוח שמאלה, בתחתונה (האגודל ימינה) למטה, ובימנית (האגודל למעלה) ימינה. כל הכוחות מצביעים החוצה מהכריכה.
      - kind: reasoning
        text: >-
          ב. כל זוג צלעות נגדיות: כוחות שווים והפוכים, ולכן הכוח השקול אפס. הכוחות על הצלעות השמאלית והימנית פועלים לאורך קו אופקי אחד שעובר דרך הציר, והכוחות על העליונה והתחתונה פועלים לאורך הציר עצמו. לאף כוח אין זרוע, ולכן אין מומנט. מישור הכריכה ניצב לשדה, $\theta = 0$ או $180^\circ$, כמו שהנוסחה אומרת.
      - kind: reasoning
        text: >-
          ג. האנך, לפי כלל יד ימין (האצבעות נגד כיוון השעון), מצביע החוצה מהדף: בכיוון השדה, $\theta = 0$. זה שיווי משקל יציב. כשהזרם מתהפך, כל הכוחות מתהפכים ולוחצים פנימה, והאנך מצביע לתוך הדף, הפוך לשדה: $\theta = 180^\circ$, שיווי משקל רופף. הזזה קטנה תסובב את הכריכה חצי סיבוב.
      - kind: result
        text: >-
          א. כל ארבעת הכוחות במישור הדף, כלפי חוץ.

          ב. הכריכה לא תסתובב ולא תזוז.

          ג. יציב. עם זרם הפוך: הכוחות פנימה, ושיווי משקל רופף.

  - id: W-4.10-03
    level: basic
    qualitative: false
    objectives: [OBJ-4.10-2]
    prompt: >-
      סליל שטוח של $40$ כריכות, ששטחו $30\,\text{cm}^2$, נמצא על ציר בשדה מגנטי אחיד של $0.5\,\text{T}$.

      א. איזה זרם צריך להעביר בו כדי שהמומנט הגדול ביותר עליו יהיה $0.03\,\text{N·m}$?

      ב. עם הזרם הזה, מה המומנט כשמישור הסליל יוצר זווית של $45^\circ$ עם קווי השדה?
    answer: >-
      א. $I = 0.5\,\text{A}$.

      ב. $\tau \approx 0.021\,\text{N·m}$.
    solution:
      - kind: given
        text: >-
          $N = 40$, $A = 30\,\text{cm}^2 = 3\cdot10^{-3}\,\text{m}^2$, $B = 0.5\,\text{T}$, $\tau_{\max} = 0.03\,\text{N·m}$.
      - kind: formula
        text: >-
          $\tau = NBIA\sin\theta$; הגדול ביותר כש-$\theta = 90^\circ$: $\tau_{\max} = NBIA$.
      - kind: manipulation
        text: >-
          א. מחלקים את $\tau_{\max} = NBIA$ ב-$NBA$, כדי לבודד את הזרם: $I = \dfrac{\tau_{\max}}{NBA}$.
      - kind: substitution
        text: >-
          א. $I = \dfrac{0.03}{40\cdot0.5\cdot3\cdot10^{-3}} = \dfrac{0.03}{0.06} = 0.5\,\text{A}$.

          ב. בזווית של $45^\circ$ בין המישור לשדה, גם האנך יוצר $90^\circ - 45^\circ = 45^\circ$ עם השדה, ולכן $\tau = 0.03\cdot\sin45^\circ \approx 0.021\,\text{N·m}$.
      - kind: result
        text: >-
          א. $0.5\,\text{A}$.

          ב. כ-$0.021\,\text{N·m}$.

  - id: W-4.10-04
    level: mid
    qualitative: false
    objectives: [OBJ-4.10-2, OBJ-4.10-1]
    prompt: >-
      סליל מלבני של $60$ כריכות, $8\,\text{cm}$ (לאורך הציר) על $5\,\text{cm}$, נמצא על ציר בשדה מגנטי אחיד של $0.4\,\text{T}$, וזורם בו $0.5\,\text{A}$. מודדים את המומנט, ומקבלים $0.024\,\text{N·m}$.

      א. מה המומנט הגדול ביותר האפשרי על הסליל?

      ב. מה יכולה להיות הזווית בין האנך לסליל לבין השדה? ומה הזווית בין מישור הסליל לשדה?

      ג. מה הכוח על כל צלע שמקבילה לציר, ומה הזרוע שלו? בדקו שמכפלתם נותנת את המומנט שנמדד.
    answer: >-
      א. $0.048\,\text{N·m}$.

      ב. $\theta = 30^\circ$ או $150^\circ$; מישור הסליל בזווית של $60^\circ$ לשדה.

      ג. $F = 0.96\,\text{N}$, זרוע $1.25\,\text{cm}$, ו-$2\cdot0.96\cdot0.0125 = 0.024\,\text{N·m}$.
    solution:
      - kind: given
        text: >-
          $N = 60$, $a = 0.08\,\text{m}$, $b = 0.05\,\text{m}$, $A = 4\cdot10^{-3}\,\text{m}^2$, $B = 0.4\,\text{T}$, $I = 0.5\,\text{A}$, $\tau = 0.024\,\text{N·m}$.
      - kind: formula
        text: >-
          $\tau = NBIA\sin\theta$, $F = NBIa$, והזרוע $d = \dfrac{b}{2}\sin\theta$.
      - kind: substitution
        text: >-
          א. $\tau_{\max} = 60\cdot0.4\cdot0.5\cdot4\cdot10^{-3} = 0.048\,\text{N·m}$.
      - kind: manipulation
        text: >-
          ב. מחלקים את $\tau = \tau_{\max}\sin\theta$ ב-$\tau_{\max}$: $\sin\theta = \dfrac{0.024}{0.048} = 0.5$. יש שתי זוויות בין $0$ ל-$180^\circ$ שהסינוס שלהן חצי: $30^\circ$ ו-$150^\circ$. בשתיהן האנך יוצר $30^\circ$ עם קו השדה, ולכן המישור, שניצב לאנך, יוצר $90^\circ - 30^\circ = 60^\circ$ עם קו השדה.
      - kind: substitution
        text: >-
          ג. $F = 60\cdot0.4\cdot0.5\cdot0.08 = 0.96\,\text{N}$. הזרוע $d = 0.025\cdot\sin30^\circ = 0.0125\,\text{m}$. שני הכוחות מסובבים לאותו כיוון: $\tau = 2\cdot0.96\cdot0.0125 = 0.024\,\text{N·m}$, כמו שנמדד.
      - kind: result
        text: >-
          א. $0.048\,\text{N·m}$.

          ב. $\theta = 30^\circ$ או $150^\circ$; המישור בזווית של $60^\circ$ לשדה.

          ג. $0.96\,\text{N}$ וזרוע של $1.25\,\text{cm}$.

  - id: W-4.10-05
    level: mid
    qualitative: true
    objectives: [OBJ-4.10-3]
    prompt: >-
      כריכה קטנה וקלה תלויה על חוט דק, כך שהיא יכולה להסתובב סביב ציר אנכי. היא נמצאת רחוק מכל מגנט, ורק השדה המגנטי של כדור הארץ פועל עליה. מעבירים בה זרם.

      א. קבעו ונמקו: באיזה כיוון יפנה מישור הכריכה כשהיא תיעצר: צפון–דרום או מזרח–מערב? לאן יצביע האנך שלה?

      ב. הופכים את כיוון הזרם. מה יקרה?

      ג. במה הכריכה דומה למחט מצפן? איזה צד שלה מתנהג כמו הקוטב הצפוני של המחט?
    answer: >-
      א. מישור הכריכה יפנה מזרח–מערב, והאנך שלה יצביע צפונה, בכיוון הרכיב האופקי של השדה.

      ב. הכריכה תסתובב חצי סיבוב, עד שהאנך שוב יצביע צפונה.

      ג. כמו מחט, היא מסתובבת עד שהיא מצביעה לאורך השדה. הצד שממנו יוצא האנך (שבו הזרם נראה נגד כיוון השעון) מתנהג כמו הקוטב הצפוני.
    solution:
      - kind: given
        text: >-
          הכריכה מסתובבת סביב ציר אנכי, ולכן רק הרכיב האופקי של השדה של כדור הארץ, שמצביע צפונה (שיעור 4.1), יכול לסובב אותה.
      - kind: reasoning
        text: >-
          א. המומנט מסובב את האנך אל כיוון השדה, והכריכה נעצרת בשיווי משקל יציב, כשהאנך מצביע לאורך השדה: צפונה. האנך ניצב למישור הכריכה, ולכן המישור עצמו פונה מזרח–מערב.
      - kind: reasoning
        text: >-
          ב. כשהזרם מתהפך, האנך מתהפך (כלל יד ימין) ומצביע דרומה, הפוך לשדה. זה שיווי משקל רופף: כל הפרעה קטנה, אפילו תנודה של החוט, תסובב את הכריכה חצי סיבוב, עד שהאנך יצביע צפונה.
      - kind: reasoning
        text: >-
          ג. בשיעור 4.3 ראינו שכריכה יוצרת שדה כמו מגנט קטן, והשדה בתוכה בכיוון האנך: קווי השדה יוצאים מהצד שאליו מצביע האנך, כמו מקוטב צפוני. לכן הכריכה מסתובבת כמו מחט מצפן, והצד הזה פונה צפונה. מסתכלים על הצד הזה: הזרם בו נראה נגד כיוון השעון.
      - kind: result
        text: >-
          א. מזרח–מערב, והאנך צפונה.

          ב. חצי סיבוב, עד שהאנך שוב צפונה.

          ג. היא מתנהגת כמו מחט מצפן; הצד שממנו יוצא האנך הוא "הקוטב הצפוני".

  - id: W-4.10-06
    level: mid
    qualitative: false
    objectives: [OBJ-4.10-2]
    prompt: >-
      יש לכם תיל באורך $24\,\text{cm}$, ואתם רוצים לכופף אותו לכריכה אחת שתקבל מומנט גדול ככל האפשר בשדה של $0.5\,\text{T}$, עם זרם של $2\,\text{A}$.

      א. חשבו את המומנט הגדול ביותר על ריבוע בצלע $6\,\text{cm}$, על מלבן של $8\,\text{cm}$ על $4\,\text{cm}$, ועל מעגל. איזו צורה עדיפה?

      ב. חבר מציע לכופף את אותו תיל לשתי כריכות ריבועיות, כי "שתי כריכות נותנות מומנט כפול". חשבו את המומנט, ונמקו למה ההצעה לא משתלמת.
    answer: >-
      א. ריבוע $3.6\cdot10^{-3}\,\text{N·m}$, מלבן $3.2\cdot10^{-3}\,\text{N·m}$, מעגל כ-$4.6\cdot10^{-3}\,\text{N·m}$. המעגל עדיף: יש לו השטח הגדול ביותר.

      ב. $1.8\cdot10^{-3}\,\text{N·m}$, חצי מהריבוע היחיד: $N$ גדל פי 2, אבל השטח של כל כריכה קטן פי 4.
    solution:
      - kind: given
        text: >-
          אורך התיל $24\,\text{cm}$, $B = 0.5\,\text{T}$, $I = 2\,\text{A}$. המומנט הגדול ביותר $\tau_{\max} = NBIA$, והנוסחה נכונה לכריכה שטוחה בכל צורה.
      - kind: reasoning
        text: >-
          א. $B$ ו-$I$ זהים, ולכן המומנט פרופורציוני לשטח. ריבוע: $A = 6\cdot6 = 36\,\text{cm}^2$. מלבן: $8\cdot4 = 32\,\text{cm}^2$. מעגל: ההיקף $2\pi r = 24\,\text{cm}$, ולכן $r = \dfrac{24}{2\pi} \approx 3.82\,\text{cm}$ ו-$A = \pi r^2 \approx 45.8\,\text{cm}^2$.
      - kind: substitution
        text: >-
          א. ריבוע: $\tau = 0.5\cdot2\cdot36\cdot10^{-4} = 3.6\cdot10^{-3}\,\text{N·m}$. מלבן: $0.5\cdot2\cdot32\cdot10^{-4} = 3.2\cdot10^{-3}\,\text{N·m}$. מעגל: $0.5\cdot2\cdot45.8\cdot10^{-4} \approx 4.6\cdot10^{-3}\,\text{N·m}$.

          ב. שתי כריכות מ-$24\,\text{cm}$ של תיל: לכל כריכה $12\,\text{cm}$, ריבוע בצלע $3\,\text{cm}$ ושטח $9\,\text{cm}^2$. $\tau = 2\cdot0.5\cdot2\cdot9\cdot10^{-4} = 1.8\cdot10^{-3}\,\text{N·m}$.
      - kind: reasoning
        text: >-
          ב. כשמחלקים את אותו תיל ל-$N$ כריכות, הצלע של כל אחת קטנה פי $N$ והשטח פי $N^2$, ולכן $NA$ קטן פי $N$. בסליל אמיתי מוסיפים כריכות בלי להקטין אותן, כלומר משתמשים בתיל ארוך יותר.
      - kind: result
        text: >-
          א. המעגל, כ-$4.6\cdot10^{-3}\,\text{N·m}$ (ריבוע $3.6\cdot10^{-3}$, מלבן $3.2\cdot10^{-3}$).

          ב. $1.8\cdot10^{-3}\,\text{N·m}$: חצי, ולכן לא משתלם.

  - id: W-4.10-07
    level: mid
    qualitative: true
    objectives: [OBJ-4.10-4, OBJ-4.10-3]
    prompt: >-
      במנוע של כריכה אחת הרכיבו את הקומוטטור בטעות, מסובב ברבע סיבוב: הוא הופך את הזרם כשמישור הכריכה **מקביל** לשדה, ולא כשהוא ניצב לשדה.

      א. קבעו ונמקו: האם המנוע יסתובב ברציפות?

      ב. באילו מצבים הכריכה יכולה להיעצר?
    answer: >-
      א. לא. בכל חצי סיבוב, בין שני היפוכים, המומנט מסובב את הכריכה אל אמצע הקטע, ושם היא נעצרת.

      ב. באחד משני המצבים שבהם מישורה ניצב לשדה. בכל אחד מהם, עם הזרם שזורם באותו קטע, האנך בכיוון השדה: שיווי משקל יציב.
    solution:
      - kind: given
        text: >-
          הזרם מתהפך כשמישור הכריכה מקביל לשדה, כלומר במצבים שבהם המומנט הגדול ביותר.
      - kind: reasoning
        text: >-
          א. נעקוב אחרי הכריכה מהמצב שבו מישורה מקביל לשדה. בחצי הסיבוב הבא, עד הפעם הבאה שהמישור מקביל לשדה, הזרם קבוע, ובאמצע הקטע הזה מישור הכריכה ניצב לשדה. עם זרם קבוע, המומנט מסובב את האנך אל כיוון השדה, כלומר אל אמצע הקטע, משני צדדיו. בנקודה הזאת הוא מגיע לשיווי משקל יציב. כשהכריכה מגיעה לקצה הקטע, הזרם מתהפך, ושוב היא בקטע שבאמצעו מצב יציב. אין קטע שבו המומנט דוחף אותה הלאה בעקביות.
      - kind: reasoning
        text: >-
          ב. בכל אחד משני הקטעים הזרם קבוע, ובאמצע הקטע מישור הכריכה ניצב לשדה. עם הזרם של אותו קטע, האנך שם בכיוון השדה, ולכן זה שיווי משקל יציב. הכריכה תתנדנד ותיעצר באחד משני המצבים האלה, לפי המקום שבו התחילה. כדי שהמנוע יעבוד, הקומוטטור צריך להפוך את הזרם בדיוק במצבים האלה, וכך להפוך אותם לרופפים.
      - kind: result
        text: >-
          א. המנוע לא יסתובב ברציפות.

          ב. הכריכה תיעצר באחד משני המצבים שבהם מישורה ניצב לשדה.

  - id: W-4.10-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-4.10-2, OBJ-4.10-3, OBJ-4.10-4]
    prompt: >-
      מנוע חשמלי קטן משמש כמנוף. בסליל שלו $100$ כריכות, מלבן של $5\,\text{cm}$ על $4\,\text{cm}$, בשדה מגנטי אחיד של $0.5\,\text{T}$, ודרך קומוטטור זורם בו $2\,\text{A}$. על הציר של המנוע קבוע תוף ברדיוס $1\,\text{cm}$, ועליו מלופף חוט שבקצהו תלויה משקולת. ($g = 10\,\text{m/s}^2$; הזניחו חיכוך.)

      א. מה המומנט הגדול ביותר שהשדה מפעיל על הסליל?

      ב. מה המסה הגדולה ביותר שהמנוע יכול להחזיק במנוחה, ובאיזה מצב של הסליל?

      ג. תולים משקולת של $1\,\text{kg}$. באילו מצבים של הסליל המנוע יכול להחזיק אותה? תנו את התשובה כזווית בין מישור הסליל לשדה.

      ד. קבעו ונמקו: למה מנוף כזה עם סליל אחד לא אמין, ומה עושים במנועים אמיתיים?
    answer: >-
      א. $0.2\,\text{N·m}$.

      ב. $2\,\text{kg}$, כשמישור הסליל מקביל לשדה.

      ג. כשמישור הסליל בזווית של $60^\circ$ או פחות לשדה, משני צדי המצב שבו הוא מקביל לשדה.

      ד. ליד המצבים שבהם מישור הסליל ניצב לשדה, המומנט קטן מדי (ובנקודה המתה אפס), והמשקולת תסובב את התוף לאחור. במנועים אמיתיים יש כמה סלילים בזוויות שונות.
    solution:
      - kind: given
        text: >-
          $N = 100$, $A = 0.05\cdot0.04 = 2\cdot10^{-3}\,\text{m}^2$, $B = 0.5\,\text{T}$, $I = 2\,\text{A}$, רדיוס התוף $r = 0.01\,\text{m}$.
      - kind: formula
        text: >-
          $\tau = NBIA\sin\theta$. המשקולת מושכת את החוט בכוח $mg$, שמשיק לתוף, ולכן הזרוע שלו היא רדיוס התוף, והמומנט שלה $mgr$. במנוחה המומנטים שווים.
      - kind: substitution
        text: >-
          א. $\tau_{\max} = 100\cdot0.5\cdot2\cdot2\cdot10^{-3} = 0.2\,\text{N·m}$.
      - kind: manipulation
        text: >-
          ב. $mgr = \tau_{\max}$, מחלקים ב-$gr$: $m = \dfrac{\tau_{\max}}{gr} = \dfrac{0.2}{10\cdot0.01} = 2\,\text{kg}$, כשמישור הסליל מקביל לשדה ($\theta = 90^\circ$).
      - kind: manipulation
        text: >-
          ג. המומנט של המשקולת $1\cdot10\cdot0.01 = 0.1\,\text{N·m}$. המנוע מחזיק אותה כשהמומנט המגנטי לפחות כזה: $0.2\sin\theta \ge 0.1$, כלומר $\sin\theta \ge 0.5$, ו-$30^\circ \le \theta \le 150^\circ$. הזווית בין המישור לשדה היא $90^\circ - \theta$ בגודלה, ולכן היא לכל היותר $60^\circ$.
      - kind: reasoning
        text: >-
          ד. בשני קטעים של $60^\circ$ בכל סיבוב (סביב המצבים שבהם המישור ניצב לשדה) המומנט קטן מ-$0.1\,\text{N·m}$, ובנקודה המתה הוא אפס, גם עם קומוטטור. אם המנוע נעצר שם, המשקולת תמשוך את התוף לאחור. במנועים אמיתיים יש כמה סלילים בזוויות שונות וקומוטטור עם הרבה חלקים, כך שבכל רגע יש סליל שמישורו קרוב להיות מקביל לשדה.
      - kind: result
        text: >-
          א. $0.2\,\text{N·m}$.

          ב. $2\,\text{kg}$, כשמישור הסליל מקביל לשדה.

          ג. כשמישור הסליל בזווית של עד $60^\circ$ לשדה.

          ד. ליד הנקודות המתות המומנט קטן מדי; משתמשים בכמה סלילים בזוויות שונות.

  - id: W-4.10-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-4.10-4]
    prompt: >-
      בגלוונומטר יש סליל של $80$ כריכות, ששטחו $2.5\,\text{cm}^2$, בשדה רדיאלי של $0.25\,\text{T}$. קבוע הפיתול של הקפיץ $5\cdot10^{-6}\,\text{N·m/rad}$, וההתנגדות של הסליל $50\,\Omega$. הסקאלה נגמרת בהסטה של $1.2\,\text{rad}$.

      א. איזה זרם מסיט את המחוג עד סוף הסקאלה?

      ב. מה המתח על הסליל כשהמחוג בסוף הסקאלה?

      ג. רוצים להשתמש בגלוונומטר כמד זרם עד $0.6\,\text{A}$. מחברים במקביל לסליל נגד, כך שרוב הזרם עובר בו. מה צריכה להיות ההתנגדות שלו?

      ד. במד הזרם של סעיף ג זורם $0.25\,\text{A}$. מה ההסטה של המחוג?
    answer: >-
      א. $1.2\,\text{mA}$.

      ב. $0.06\,\text{V}$.

      ג. כ-$0.1\,\Omega$.

      ד. $0.5\,\text{rad}$ (כ-$29^\circ$).
    solution:
      - kind: given
        text: >-
          $N = 80$, $A = 2.5\cdot10^{-4}\,\text{m}^2$, $B = 0.25\,\text{T}$, $\kappa = 5\cdot10^{-6}\,\text{N·m/rad}$, $R_g = 50\,\Omega$, הסטה מרבית $1.2\,\text{rad}$.
      - kind: formula
        text: >-
          בשדה רדיאלי: $NBIA = \kappa\delta$, ולכן $\delta = \dfrac{NBA}{\kappa}\,I$. במקביל, המתח על שני הענפים שווה, והזרם מתחלק ביניהם (שיעור 3.5).
      - kind: substitution
        text: >-
          א. $\dfrac{\delta}{I} = \dfrac{80\cdot0.25\cdot2.5\cdot10^{-4}}{5\cdot10^{-6}} = 1000\,\text{rad/A}$, ולכן $I = \dfrac{1.2}{1000} = 1.2\cdot10^{-3}\,\text{A}$.

          ב. $V = IR_g = 1.2\cdot10^{-3}\cdot50 = 0.06\,\text{V}$.
      - kind: manipulation
        text: >-
          ג. כשנכנס למד $0.6\,\text{A}$, בסליל צריך לעבור בדיוק $1.2\,\text{mA}$, והשאר בנגד: $0.6 - 0.0012 = 0.5988\,\text{A}$. המתח על הנגד שווה למתח על הסליל, $0.06\,\text{V}$, ולכן $R = \dfrac{0.06}{0.5988} \approx 0.1\,\Omega$.
      - kind: reasoning
        text: >-
          ד. היחס בין הזרם בסליל לזרם הכולל קבוע, כי היחס בין ההתנגדויות קבוע: $\dfrac{1.2\cdot10^{-3}}{0.6} = 2\cdot10^{-3}$. ב-$0.25\,\text{A}$ עובר בסליל $0.25\cdot2\cdot10^{-3} = 0.5\,\text{mA}$, וההסטה $1000\cdot0.5\cdot10^{-3} = 0.5\,\text{rad}$. ההסטה פרופורציונית לזרם הכולל, ולכן הסקאלה אחידה גם במד הזרם.
      - kind: result
        text: >-
          א. $1.2\,\text{mA}$.

          ב. $0.06\,\text{V}$.

          ג. כ-$0.1\,\Omega$.

          ד. $0.5\,\text{rad}$.

  - id: W-4.10-10
    level: bagrut
    qualitative: true
    objectives: [OBJ-4.10-1, OBJ-4.10-2, OBJ-4.10-4]
    prompt: >-
      מנוע זרם ישר של סליל אחד, עם קומוטטור, מחובר לסוללה ומסתובב נגד כיוון השעון (כשמסתכלים לאורך הציר). קבעו ונמקו, לכל שינוי בנפרד, מה קורה למומנט הגדול ביותר על הסליל ולכיוון הסיבוב. הניחו שהזרם לא משתנה, אלא אם כתוב אחרת.

      א. מחליפים את הסליל בסליל באותו גודל עם פי שניים כריכות.

      ב. מחליפים את המגנט במגנט שהשדה שלו חצי.

      ג. הופכים את חיבורי הסוללה.

      ד. מוציאים את הקומוטטור, ומחברים את קצות הסליל לסוללה ישירות.

      ה. המנוע נעצר במצב שבו מישור הסליל ניצב לשדה, ומחברים אותו שוב לסוללה.
    answer: >-
      א. המומנט כפול; הכיוון לא משתנה.

      ב. המומנט חצי; הכיוון לא משתנה.

      ג. אותו מומנט; הסיבוב בכיוון השעון.

      ד. הסליל מתנדנד ונעצר כשהאנך שלו בכיוון השדה.

      ה. המנוע לא מתחיל: נקודה מתה, המומנט אפס.
    solution:
      - kind: formula
        text: >-
          $\tau = NBIA\sin\theta$; כיוון הכוח על כל צלע בכלל כף יד ימין, והוא מתהפך כשמתהפך הזרם או השדה.
      - kind: reasoning
        text: >-
          א. $\tau_{\max} = NBIA$ פרופורציוני ל-$N$: גדל פי 2. כיוון הזרם בכל כריכה והשדה לא השתנו, ולכן גם כיוון הסיבוב.

          ב. $\tau_{\max}$ פרופורציוני ל-$B$: קטן פי 2. כיוון השדה לא השתנה, ולכן גם כיוון הסיבוב.
      - kind: reasoning
        text: >-
          ג. הזרם בסליל מתהפך בכל מצב, ולכן כל כוח מתהפך: אותו גודל, והסיבוב בכיוון השעון.
      - kind: reasoning
        text: >-
          ד. בלי קומוטטור הזרם לא מתהפך כשהסליל עובר את המצב שבו מישורו ניצב לשדה. מעבר למצב הזה המומנט מתהפך ומחזיר את הסליל: הוא מתנדנד סביב המצב שבו האנך בכיוון השדה, ונעצר בו (שיווי משקל יציב).
      - kind: reasoning
        text: >-
          ה. כשמישור הסליל ניצב לשדה, $\sin\theta = 0$, והמומנט אפס, גם עם קומוטטור: הכוחות על הצלעות פועלים לאורך קו אחד שעובר דרך הציר. אין מה שיתחיל את הסיבוב. צריך לסובב את הסליל מעט ביד, ובמנועים אמיתיים יש כמה סלילים בזוויות שונות.
      - kind: result
        text: >-
          א. פי 2, אותו כיוון. ב. חצי, אותו כיוון. ג. אותו גודל, כיוון הפוך.

          ד. מתנדנד ונעצר. ה. לא מתחיל להסתובב (נקודה מתה).

challenge:
  - id: W-4.10-c1
    stars: 1
    objectives: [OBJ-4.10-4]
    prompt: >-
      ההסטה של גלוונומטר לכל אמפר נקראת הרגישות שלו לזרם, וההסטה לכל וולט על הסליל נקראת הרגישות שלו למתח. בגלוונומטר מסוים הרגישות לזרם $500\,\text{rad/A}$, וההתנגדות של הסליל $40\,\Omega$. רוצים להגדיל את הרגישות לזרם ב-$25\%$, ומותר לשנות רק את מספר הכריכות ואת שטח החתך של התיל שממנו מלופף הסליל. המגנט, הקפיץ וגודל הכריכות לא משתנים, וההתנגדות של הסליל צריכה להישאר $40\,\Omega$.

      א. פי כמה צריך לשנות את מספר הכריכות?

      ב. פי כמה צריך לשנות את שטח החתך של התיל?

      ג. מה הרגישות למתח לפני השינוי ואחריו? בכמה אחוזים היא השתנתה?
    answer: >-
      א. פי $1.25$.

      ב. פי $1.25$ (תיל עבה יותר).

      ג. מ-$12.5\,\text{rad/V}$ ל-$15.6\,\text{rad/V}$: גדלה ב-$25\%$.
    solution:
      - kind: given
        text: >-
          הרגישות לזרם $\dfrac{\delta}{I} = 500\,\text{rad/A}$, $R = 40\,\Omega$. $B$, $\kappa$ והשטח $A$ של כל כריכה קבועים.
      - kind: formula
        text: >-
          בשדה רדיאלי $\delta = \dfrac{NBA}{\kappa}\,I$, ולכן הרגישות לזרם $\dfrac{NBA}{\kappa}$. ההתנגדות של התיל $R = \rho\dfrac{L}{S}$ (שיעור 3.3), כש-$L$ אורך התיל ו-$S$ שטח החתך שלו. המתח על הסליל $V = IR$.
      - kind: reasoning
        text: >-
          א. מכל הגדלים ברגישות לזרם רק $N$ משתנה, והיא פרופורציונית ל-$N$. כדי להגדיל אותה ב-$25\%$: $N' = 1.25N$.
      - kind: reasoning
        text: >-
          ב. כל כריכה באותו גודל, ולכן אורך התיל פרופורציוני למספר הכריכות: $L' = 1.25L$. כדי ש-$R = \rho L/S$ יישאר קבוע, גם $S$ צריך לגדול פי $1.25$.
      - kind: substitution
        text: >-
          ג. הרגישות למתח $\dfrac{\delta}{V} = \dfrac{\delta}{IR} = \dfrac{\delta/I}{R}$. לפני: $\dfrac{500}{40} = 12.5\,\text{rad/V}$. אחרי: $\dfrac{1.25\cdot500}{40} = \dfrac{625}{40} \approx 15.6\,\text{rad/V}$. ההתנגדות לא השתנתה, ולכן הרגישות למתח גדלה בדיוק כמו הרגישות לזרם.
      - kind: result
        text: >-
          א. פי $1.25$. ב. פי $1.25$. ג. מ-$12.5$ ל-$15.6\,\text{rad/V}$, עלייה של $25\%$.
    source:
      name: JEE Main
      year: 2023
      problem: 'April 11, 2023, Shift 1: current sensitivity of a moving coil galvanometer increased by 25% at constant coil resistance'
      url: 'https://competishun.com/the-current-sensitivity-of-moving-coil-galvanometer-is-increased-by-25-this-increase-is-achieved-only-by-changing-in-the-number-of-turns-of-coils-and-area-of-cross-section-of-the-wire-while-keeping-th/'
      verified: '2026-11-02'
      adapted: true

  - id: W-4.10-c2
    stars: 2
    objectives: [OBJ-4.10-2, OBJ-4.10-3]
    prompt: >-
      תיל דק, קשיח ומבודד מכופף לכריכה מעגלית אחת ברדיוס $r$. בנקודה העליונה של המעגל שני קצות התיל ממשיכים ישר, אופקית, אחד לכל צד, כמו טבעת שתלויה על מוט. הקצוות מונחים על שתי תמיכות מוליכות, כך שהכריכה תלויה מתחתן במישור אנכי, ויכולה להסתובב סביב הקו האופקי שעובר דרך שתי התמיכות (והוא גם משיק לכריכה בנקודה העליונה שלה). מסת הכריכה $m$, והיא בשדה מגנטי אחיד ואנכי $B_0$. כשמעבירים בכריכה זרם $I$, היא מסתובבת סביב הקו בזווית $\varphi$ ונעצרת. (שימו לב: $\varphi$ היא זווית ההטיה של הכריכה מהאנכי, ולא ה-$\theta$ של הנוסחה למומנט.)

      א. הראו ש-$\tan\varphi = \dfrac{\pi rIB_0}{mg}$.

      ב. מה $\varphi$ עבור $m = 10\,\text{g}$, $r = 4\,\text{cm}$, $B_0 = 0.25\,\text{T}$ ו-$I = 2\,\text{A}$?

      ג. איזה זרם יסובב את הכריכה ב-$45^\circ$?

      ד. האם זרם גדול מספיק יכול להביא את הכריכה למצב אופקי, $\varphi = 90^\circ$? נמקו.
    answer: >-
      א. $I\pi r^2B_0\cos\varphi = mgr\sin\varphi$.

      ב. $\varphi \approx 32^\circ$.

      ג. $I \approx 3.2\,\text{A}$.

      ד. לא: כשהכריכה מתקרבת למצב אופקי, האנך שלה מתקרב לכיוון השדה והמומנט המגנטי שואף לאפס, אבל מומנט הכובד גדל. $\tan\varphi$ שואף לאינסוף רק כשהזרם שואף לאינסוף.
    solution:
      - kind: given
        text: >-
          כריכה אחת, $A = \pi r^2$, ציר אופקי בראש הכריכה, שדה אנכי $B_0$. כשהכריכה תלויה אנכית מישורה מקביל לשדה, והאנך שלה אופקי.
      - kind: reasoning
        text: >-
          א. כשהכריכה מוטה בזווית $\varphi$ מהאנך, גם האנך שלה מוטה ב-$\varphi$ מהאופק, ולכן הזווית בין האנך לשדה האנכי היא $90^\circ - \varphi$. המומנט המגנטי: $\tau_B = I\pi r^2B_0\sin(90^\circ - \varphi) = I\pi r^2B_0\cos\varphi$. קצות התיל מונחים על הציר עצמו, ולכן הכוחות עליהם לא מסובבים סביבו. הכובד פועל במרכז הכריכה, במרחק $r$ מהציר, ואחרי ההטיה הזרוע שלו $r\sin\varphi$: $\tau_g = mgr\sin\varphi$.
      - kind: manipulation
        text: >-
          א. בשיווי משקל $I\pi r^2B_0\cos\varphi = mgr\sin\varphi$. מחלקים ב-$mgr\cos\varphi$: $\tan\varphi = \dfrac{\pi rIB_0}{mg}$.
      - kind: substitution
        text: >-
          ב. $\tan\varphi = \dfrac{\pi\cdot0.04\cdot2\cdot0.25}{0.01\cdot10} = \dfrac{0.0628}{0.1} \approx 0.628$, ולכן $\varphi \approx 32^\circ$.

          ג. $\tan45^\circ = 1$, ולכן $I = \dfrac{mg}{\pi rB_0} = \dfrac{0.1}{\pi\cdot0.04\cdot0.25} \approx 3.2\,\text{A}$.
      - kind: reasoning
        text: >-
          ד. ב-$\varphi = 90^\circ$ האנך בכיוון השדה (או הפוך לו), מישור הכריכה ניצב לשדה, והמומנט המגנטי אפס, בעוד שמומנט הכובד הגדול ביותר, $mgr$. לכל זרם סופי יש זווית שבה המומנטים שווים, והיא קטנה מ-$90^\circ$. מלכודת נפוצה היא לכתוב $\sin\varphi$ במקום $\cos\varphi$ במומנט המגנטי, כאילו $\varphi$ היא הזווית בין האנך לשדה; אז מקבלים $\tan\varphi = \dfrac{mg}{\pi rIB_0}$, ותשובה של כ-$58^\circ$ בסעיף ב.
      - kind: result
        text: >-
          א. $\tan\varphi = \dfrac{\pi rIB_0}{mg}$. ב. כ-$32^\circ$. ג. כ-$3.2\,\text{A}$. ד. לא, רק בגבול של זרם אינסופי.
