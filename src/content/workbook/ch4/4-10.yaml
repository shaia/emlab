# Workbook, lesson 4.10 (lab: the Earth's magnetic field; the chapter's review). Format and rules: see .claude/CLAUDE.md,
# "Worked examples, workbook".
# W-04's table was generated with src/physics/lab.ts (compassReadings, r = 2 cm, B_E = 3.2·10⁻⁵ T, seed 47) and its slope
# recomputed with fitLine; the values "read on the line" are the least-squares line at those x values. W-06 is the lesson's
# dataset with one reading spoiled on purpose. W-08 and W-c2 tables are whole-degree readings of the exact law; their fits
# were recomputed with fitLine. Every other number was recomputed with src/physics/magnetism.ts (straightWireField,
# loopCenterField, parallelWiresForce, wireForce, lorentzMagnitude) and src/physics/compass.ts.
# Map convention: north up, east right, "out of the page" = up, toward the viewer.
# In a >- block, consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '4.10'
practice:
  - id: W-4.10-01
    level: basic
    qualitative: false
    objectives: [OBJ-4.10-1]
    prompt: >-
      תיל ישר ואופקי בכיוון צפון–דרום עובר $2\,\text{cm}$ מעל מחט של מצפן. הרכיב האופקי של השדה של כדור הארץ במקום הוא $3.0\cdot10^{-5}\,\text{T}$.

      (א) איזה זרם צריך להעביר בתיל כדי שהמחט תסטה ב-$30^\circ$?

      (ב) הזרם בתיל זורם דרומה. לאיזה צד סוטה הקוטב הצפוני של המחט?
    answer: >-
      (א) $I \approx 1.7\,\text{A}$.

      (ב) מזרחה.
    solution:
      - kind: given
        text: >-
          $r = 0.02\,\text{m}$, $B_E = 3.0\cdot10^{-5}\,\text{T}$, $\theta = 30^\circ$.
      - kind: formula
        text: >-
          (א) $\tan\theta = \dfrac{B_w}{B_E}$, ולכן $B_w = B_E\tan\theta$. ובשדה של תיל, $B_w = \dfrac{\mu_0 I}{2\pi r}$: כופלים את שני האגפים ב-$2\pi r$ ומחלקים ב-$\mu_0$ כדי לבודד את $I$:
          $$I = \frac{2\pi r B_w}{\mu_0}$$
      - kind: substitution
        text: >-
          $$B_w = 3.0\cdot10^{-5}\cdot\tan30^\circ = 3.0\cdot10^{-5}\cdot0.577 = 1.73\cdot10^{-5}\ \text{T}$$
          $$I = \frac{2\pi\cdot0.02\cdot1.73\cdot10^{-5}}{4\pi\cdot10^{-7}} = 1.73\ \text{A}$$
      - kind: reasoning
        text: >-
          (ב) לפי כלל יד ימין, האגודל דרומה, בכיוון הזרם. מתחת לתיל האצבעות המכופפות פונות מזרחה, ולכן השדה של התיל במחט פונה מזרחה, והמחט סוטה לשם.
      - kind: result
        text: >-
          (א) $I \approx 1.7\,\text{A}$. (ב) מזרחה.

  - id: W-4.10-02
    level: basic
    qualitative: true
    objectives: [OBJ-4.10-1]
    prompt: >-
      בתיל ישר ואופקי בכיוון צפון–דרום זורם זרם צפונה. מצפן אחד נמצא $4\,\text{cm}$ **מתחת** לתיל, ומצפן שני $4\,\text{cm}$ **מעליו**. קבעו ונמקו:

      (א) לאיזה צד סוטה כל אחת מהמחטים?

      (ב) איזו מחט סוטה בזווית גדולה יותר?

      (ג) מה משתנה כשהופכים את כיוון הזרם?
    answer: >-
      (א) המחט שמתחת לתיל סוטה מערבה, והמחט שמעליו מזרחה.

      (ב) הן סוטות באותה זווית.

      (ג) שתי המחטים מחליפות צד, באותה זווית.
    solution:
      - kind: given
        text: >-
          זרם צפונה. שני מצפנים באותו מרחק, $4\,\text{cm}$, אחד מתחת לתיל ואחד מעליו.
      - kind: reasoning
        text: >-
          (א) לפי כלל יד ימין, האגודל צפונה. האצבעות המכופפות מקיפות את התיל: מעליו הן פונות מזרחה, ומתחתיו מערבה. כל מחט מצביעה לאורך הסכום של $B_E$ (צפונה) ושל השדה של התיל במקומה, ולכן העליונה סוטה מזרחה והתחתונה מערבה.
      - kind: reasoning
        text: >-
          (ב) הגודל של השדה של התיל, $\dfrac{\mu_0 I}{2\pi r}$, תלוי רק במרחק, והמרחק שווה. לכן $\tan\theta = B_w/B_E$ שווה בשתיהן.
      - kind: reasoning
        text: >-
          (ג) כשהזרם דרומה, השדה של התיל מתהפך בכל נקודה, באותו גודל: העליונה סוטה מערבה, והתחתונה מזרחה, באותה זווית.
      - kind: result
        text: >-
          (א) מתחת: מערבה; מעל: מזרחה. (ב) באותה זווית. (ג) הן מחליפות צד, והזווית לא משתנה.

  - id: W-4.10-03
    level: basic
    qualitative: true
    objectives: [OBJ-4.10-2]
    prompt: >-
      בגלוונומטר טנגנטי עם תיל, תלמיד רשם: בזרם של $2\,\text{A}$ המחט סטתה ב-$17^\circ$, וב-$4\,\text{A}$ ב-$32^\circ$. הוא כתב: "הזווית כמעט הוכפלה, ולכן זווית הסטייה ביחס ישר לזרם." אחר כך מדד גם ב-$8\,\text{A}$, וקיבל $51^\circ$.

      (א) האם המדידה השלישית מתאימה לטענה שלו? נמקו.

      (ב) חשבו את $\tan\theta$ בשלוש המדידות. איזה גודל באמת ביחס ישר לזרם?

      (ג) למה בזוויות קטנות הטענה שלו "כמעט" נכונה?
    answer: >-
      (א) לא: לפי הטענה, ב-$8\,\text{A}$ הזווית הייתה כ-$64^\circ$, ונמדדו $51^\circ$.

      (ב) $\tan\theta$: $0.306$, $0.625$, $1.23$, כמעט בדיוק פי שניים בכל הכפלה של הזרם.

      (ג) בזוויות קטנות $\tan\theta$ כמעט שווה ל-$\theta$ ברדיאנים, ולכן גם $\theta$ כמעט ביחס ישר לזרם. בזוויות גדולות ההבדל גדל.
    solution:
      - kind: given
        text: >-
          $(2\,\text{A},\ 17^\circ)$, $(4\,\text{A},\ 32^\circ)$, $(8\,\text{A},\ 51^\circ)$.
      - kind: reasoning
        text: >-
          (א) אילו הזווית הייתה ביחס ישר לזרם, הכפלת הזרם מ-$4\,\text{A}$ ל-$8\,\text{A}$ הייתה מכפילה אותה מ-$32^\circ$ ל-$64^\circ$. נמדדו רק $51^\circ$, ולכן הטענה לא נכונה.
      - kind: substitution
        text: >-
          (ב) $\tan17^\circ = 0.306$, $\tan32^\circ = 0.625$, $\tan51^\circ = 1.23$. היחסים: $\dfrac{0.625}{0.306} = 2.04$ ו-$\dfrac{1.23}{0.625} = 1.98$. בכל הכפלה של הזרם $\tan\theta$ מוכפל, כפי שצופה $\tan\theta = \dfrac{\mu_0 I}{2\pi r B_E}$.
      - kind: reasoning
        text: >-
          (ג) בזווית קטנה, הניצב שמול הזווית ($B_w$) קטן מאוד לעומת $B_E$, והיתר כמעט שווה ל-$B_E$. אז $\tan\theta$ כמעט שווה ל-$\theta$ (ברדיאנים), ושני הגרפים כמעט זהים. ככל שהזווית גדלה, $\tan\theta$ גדל מהר יותר מ-$\theta$, והגרף של $\theta$ מתעקם.
      - kind: result
        text: >-
          (א) לא. (ב) $\tan\theta$ ביחס ישר לזרם: $0.306$, $0.625$, $1.23$. (ג) בזוויות קטנות $\tan\theta \approx \theta$, ולכן ההבדל מתגלה רק בזוויות גדולות.

  - id: W-4.10-04
    level: mid
    qualitative: false
    objectives: [OBJ-4.10-2]
    prompt: >-
      תיל בכיוון צפון–דרום עובר $2.0\,\text{cm}$ מעל מחט של מצפן. אלה המדידות:

      | $I\ (\text{A})$ | 0.5 | 1.0 | 1.5 | 2.0 | 2.5 | 3.0 |
      |---|---|---|---|---|---|---|
      | $\theta$ | $9^\circ$ | $17^\circ$ | $25^\circ$ | $32^\circ$ | $38^\circ$ | $43^\circ$ |

      (א) השלימו שורה של $\tan\theta$, ושרטטו את $\tan\theta$ כתלות ב-$I$.

      (ב) העבירו קו ישר קרוב לכל הנקודות, ומצאו את השיפוע שלו, עם יחידות.

      (ג) מצאו את הרכיב האופקי של השדה של כדור הארץ.
    answer: >-
      (א) $0.158$, $0.306$, $0.466$, $0.625$, $0.781$, $0.933$.

      (ב) כ-$0.31\,\text{A}^{-1}$.

      (ג) $B_E \approx 3.2\cdot10^{-5}\,\text{T}$.
    solution:
      - kind: given
        text: >-
          $r = 0.020\,\text{m}$, שש מדידות של $I$ ושל $\theta$.
      - kind: substitution
        text: >-
          (א) $\tan9^\circ = 0.158$, $\tan17^\circ = 0.306$, $\tan25^\circ = 0.466$, $\tan32^\circ = 0.625$, $\tan38^\circ = 0.781$, $\tan43^\circ = 0.933$.
      - kind: substitution
        text: >-
          (ב) הקו המתאים ביותר עובר בנקודות $(0.5\,\text{A},\ 0.155)$ ו-$(3.0\,\text{A},\ 0.935)$. אלה נקודות על הקו, לא מדידות: הנקודה $(3.0,\ 0.935)$ כמעט על המדידה האחרונה, והנקודה $(0.5,\ 0.155)$ מעט מתחת לראשונה.
          $$k = \frac{0.935 - 0.155}{3.0 - 0.5} = 0.312\ \text{A}^{-1}$$
          לטנגנס אין יחידות, ולכן השיפוע ביחידות של אחד חלקי אמפר.
      - kind: formula
        text: >-
          (ג) $\tan\theta = \dfrac{\mu_0}{2\pi r B_E}\cdot I$, ולכן $k = \dfrac{\mu_0}{2\pi r B_E}$. כופלים ב-$B_E$ ומחלקים ב-$k$ כדי לבודד את $B_E$:
          $$B_E = \frac{\mu_0}{2\pi r k}$$
      - kind: substitution
        text: >-
          $$B_E = \frac{4\pi\cdot10^{-7}}{2\pi\cdot0.020\cdot0.312} = 3.2\cdot10^{-5}\ \text{T}$$
      - kind: result
        text: >-
          (א) $0.158$, $0.306$, $0.466$, $0.625$, $0.781$, $0.933$. (ב) $k \approx 0.31\,\text{A}^{-1}$ (כל ערך בין $0.30$ ל-$0.32$ מקו ביד). (ג) $B_E \approx 3.2\cdot10^{-5}\,\text{T}$.

  - id: W-4.10-05
    level: mid
    qualitative: false
    objectives: [OBJ-4.10-3]
    prompt: >-
      תיל בכיוון צפון–דרום עובר $3\,\text{cm}$ מעל מחט, וקוראים את הזווית בדיוק של $\pm1^\circ$. תלמידה עושה שתי מדידות בודדות:

      מדידה א: בזרם של $1.0\,\text{A}$ היא קוראת $12^\circ$.

      מדידה ב: בזרם של $5.0\,\text{A}$ היא קוראת $46^\circ$.

      (א) חשבו את $B_E$ מכל מדידה.

      (ב) בכל מדידה, מה תחום הערכים של $B_E$ אם הזווית האמיתית רחוקה מעלה אחת מהקריאה, לכל כיוון?

      (ג) על איזו מדידה כדאי לה לסמוך יותר? נמקו.
    answer: >-
      (א) א: $3.1\cdot10^{-5}\,\text{T}$; ב: $3.2\cdot10^{-5}\,\text{T}$.

      (ב) א: מ-$2.9$ עד $3.4\cdot10^{-5}\,\text{T}$ (כ-$\pm8\%$); ב: מ-$3.1$ עד $3.3\cdot10^{-5}\,\text{T}$ (כ-$\pm3.5\%$).

      (ג) על מדידה ב, כי זווית קרובה ל-$45^\circ$.
    solution:
      - kind: given
        text: >-
          $r = 0.03\,\text{m}$, $\Delta\theta = 1^\circ$. א: $1.0\,\text{A}$, $12^\circ$. ב: $5.0\,\text{A}$, $46^\circ$.
      - kind: formula
        text: >-
          $B_w = \dfrac{\mu_0 I}{2\pi r}$ ו-$B_E = \dfrac{B_w}{\tan\theta}$.
      - kind: substitution
        text: >-
          (א) א: $B_w = \dfrac{4\pi\cdot10^{-7}\cdot1.0}{2\pi\cdot0.03} = 6.67\cdot10^{-6}\,\text{T}$, $B_E = \dfrac{6.67\cdot10^{-6}}{\tan12^\circ} = 3.14\cdot10^{-5}\,\text{T}$.
          ב: $B_w = 3.33\cdot10^{-5}\,\text{T}$, $B_E = \dfrac{3.33\cdot10^{-5}}{\tan46^\circ} = 3.22\cdot10^{-5}\,\text{T}$.
      - kind: substitution
        text: >-
          (ב) א: עם $11^\circ$, $B_E = 3.43\cdot10^{-5}\,\text{T}$; עם $13^\circ$, $B_E = 2.89\cdot10^{-5}\,\text{T}$. התחום רחב כ-$0.54\cdot10^{-5}\,\text{T}$, כ-$\pm8.6\%$ מהערך.
          ב: עם $45^\circ$, $B_E = 3.33\cdot10^{-5}\,\text{T}$; עם $47^\circ$, $B_E = 3.11\cdot10^{-5}\,\text{T}$. התחום רחב כ-$0.22\cdot10^{-5}\,\text{T}$, כ-$\pm3.5\%$.
      - kind: reasoning
        text: >-
          (ג) באותה שגיאת קריאה, מעלה אחת היא חלק גדול מזווית של $12^\circ$, וחלק קטן מזווית של $46^\circ$. ליד $45^\circ$ השגיאה היחסית ב-$\tan\theta$, ולכן גם ב-$B_E$, הקטנה ביותר.
      - kind: result
        text: >-
          (א) $3.1\cdot10^{-5}\,\text{T}$ ו-$3.2\cdot10^{-5}\,\text{T}$. (ב) א: $2.9$–$3.4\cdot10^{-5}\,\text{T}$; ב: $3.1$–$3.3\cdot10^{-5}\,\text{T}$. (ג) על מדידה ב.

  - id: W-4.10-06
    level: mid
    qualitative: false
    objectives: [OBJ-4.10-2, OBJ-4.10-3]
    prompt: >-
      תיל בכיוון צפון–דרום עובר $3\,\text{cm}$ מעל מחט. בטבלה של תלמיד:

      | $I\ (\text{A})$ | 1 | 2 | 3 | 4 | 5 | 6 |
      |---|---|---|---|---|---|---|
      | $\theta$ | $11^\circ$ | $23^\circ$ | $32^\circ$ | $34^\circ$ | $46^\circ$ | $51^\circ$ |

      (א) הקו צריך לעבור בראשית, ולכן היחס $\tan\theta/I$ צריך להיות כמעט קבוע. חשבו אותו לכל מדידה. איזו מדידה חריגה?

      (ב) חשבו את $B_E$ מהממוצע של היחס בחמש המדידות האחרות, ומהממוצע של כל שש המדידות. בכמה אחוזים המדידה החריגה מזיזה את התוצאה?

      (ג) מה כדאי לתלמיד לעשות?
    answer: >-
      (א) היחסים: $0.194$, $0.212$, $0.208$, $0.169$, $0.207$, $0.206$ ($\text{A}^{-1}$). המדידה ב-$4\,\text{A}$ חריגה.

      (ב) בלעדיה $B_E \approx 3.24\cdot10^{-5}\,\text{T}$; איתה $3.34\cdot10^{-5}\,\text{T}$, כ-$3\%$ יותר.

      (ג) לחזור על המדידה ב-$4\,\text{A}$, ועד אז לחשב בלעדיה.
    solution:
      - kind: given
        text: >-
          $r = 0.03\,\text{m}$, שש מדידות.
      - kind: substitution
        text: >-
          (א) $\dfrac{\tan11^\circ}{1} = 0.194$, $\dfrac{\tan23^\circ}{2} = 0.212$, $\dfrac{\tan32^\circ}{3} = 0.208$, $\dfrac{\tan34^\circ}{4} = 0.169$, $\dfrac{\tan46^\circ}{5} = 0.207$, $\dfrac{\tan51^\circ}{6} = 0.206$. חמישה יחסים בין $0.194$ ל-$0.212$, ואחד, $0.169$, רחוק מהם הרבה יותר מהפיזור שלהם: המדידה ב-$4\,\text{A}$ חריגה. בזווית של $34^\circ$ שגיאת קריאה של מעלה משנה את היחס רק בכ-$4\%$, לא ב-$20\%$.
      - kind: substitution
        text: >-
          (ב) הממוצע בלי החריגה: $\dfrac{0.194 + 0.212 + 0.208 + 0.207 + 0.206}{5} = 0.2056\,\text{A}^{-1}$. הממוצע של כל השש: $0.1994\,\text{A}^{-1}$.
      - kind: formula
        text: >-
          $B_E = \dfrac{\mu_0}{2\pi r k}$, כאשר $k$ הוא היחס $\tan\theta/I$, השיפוע של קו דרך הראשית.
      - kind: substitution
        text: >-
          $$B_E = \frac{4\pi\cdot10^{-7}}{2\pi\cdot0.03\cdot0.2056} = 3.24\cdot10^{-5}\ \text{T}
          \qquad
          B_E = \frac{4\pi\cdot10^{-7}}{2\pi\cdot0.03\cdot0.1994} = 3.34\cdot10^{-5}\ \text{T}$$
          ההפרש: $\dfrac{3.34 - 3.24}{3.24} \approx 3\%$.
      - kind: reasoning
        text: >-
          (ג) הנקודה החריגה מזיזה את התוצאה בכיוון אחד. לא מוחקים אותה בלי לבדוק: בודקים את המערכת (תיל שזז, זרם שלא כוון) וחוזרים על המדידה ב-$4\,\text{A}$.
      - kind: result
        text: >-
          (א) המדידה ב-$4\,\text{A}$. (ב) $3.24\cdot10^{-5}\,\text{T}$ בלעדיה, $3.34\cdot10^{-5}\,\text{T}$ איתה, כ-$3\%$ הבדל. (ג) לחזור על המדידה.

  - id: W-4.10-07
    level: mid
    qualitative: true
    objectives: [OBJ-4.10-1, OBJ-4.10-3]
    prompt: >-
      בניסוי הגלוונומטר הטנגנטי עם תיל, קבעו ונמקו:

      (א) תילי ההזנה, שמביאים את הזרם מספק הכוח לתיל ומחזירים אותו, עוברים קרוב למצפן, במרחק זה מזה. איך זה ישפיע על המדידה, ואיך מתקנים?

      (ב) רגל השולחן עשויה ברזל, והמחט, עוד לפני שהדליקו את הזרם, מצביעה $4^\circ$ ממזרח לצפון האמיתי. תלמיד מכוון את התיל לפי הצפון האמיתי, ומודד את הזווית מהצפון האמיתי. האם השגיאה שלו מקרית או שיטתית? מה היה צריך לעשות?

      (ג) תלמידה מגלה שהתיל שלה נוטה $10^\circ$ מכיוון המחט. האם $\tan\theta = B_w/B_E$ עדיין נכון בדיוק?
    answer: >-
      (א) לתילי ההזנה יש שדות משלהם במחט, והם משנים את הזווית. מצמידים אותם זה לזה (הזרמים הפוכים, והשדות כמעט מבטלים זה את זה) ומרחיקים אותם מהמצפן.

      (ב) שיטתית: כל הזוויות מוזזות. מכוונים את התיל לאורך המחט כשאין זרם, ומודדים את הזווית מהכיוון שלה.

      (ג) לא בדיוק: השדה של התיל כבר לא ניצב לשדה שמכוון את המחט, ומשולש השדות אינו ישר-זווית.
    solution:
      - kind: given
        text: >-
          שלושה מקורות שגיאה: תילי הזנה, ברזל קרוב, ותיל שלא מכוון לאורך המחט.
      - kind: reasoning
        text: >-
          (א) גם בתילי ההזנה זורם זרם, ולכל אחד מהם שדה במחט, $\mu_0 I/(2\pi r)$. השדות האלה מתווספים לשדה של התיל ושל כדור הארץ, והמחט סוטה בזווית אחרת. בשני תילי ההזנה הזרמים הפוכים. כשמצמידים אותם, השדות שלהם בכל נקודה רחוקה כמעט שווים והפוכים, ומבטלים זה את זה (סופרפוזיציה). ומרחיקים אותם, כי השדה של כל אחד קטן עם המרחק.
      - kind: reasoning
        text: >-
          (ב) הברזל משנה את השדה במקום של המחט, וזה השדה שהמחט "מודדת" יחד עם השדה של התיל. השגיאה של התלמיד מזיזה את כל הזוויות לאותו צד, בכל הזרמים, ולכן היא שיטתית, ושום קו לא מתקן אותה. מה שחשוב הוא שהתיל יהיה ניצב לשדה שמכוון את המחט במקומה: מכוונים את התיל לאורך המחט כשאין זרם, ומודדים את זווית הסטייה ממנה. עוד יותר טוב: מרחיקים את המצפן מהברזל.
      - kind: reasoning
        text: >-
          (ג) השדה של התיל ניצב לתיל, ולכן כשהתיל נוטה $10^\circ$ מכיוון המחט, גם השדה שלו נוטה $10^\circ$ מהכיוון הניצב לשדה של כדור הארץ. הזווית בין שני השדות היא $80^\circ$ או $100^\circ$, לא $90^\circ$, והיחס בין הניצבים כבר אינו $\tan\theta$. השגיאה קטנה בזוויות קטנות וגדלה בזרמים גדולים.
      - kind: result
        text: >-
          (א) מצמידים את תילי ההזנה ומרחיקים אותם. (ב) שגיאה שיטתית; מכוונים את התיל ואת אפס השנתות לפי המחט כשאין זרם. (ג) לא: הנוסחה מניחה שני שדות ניצבים, ולכן מכוונים את התיל בדיוק לאורך המחט.

  - id: W-4.10-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-4.10-2, OBJ-4.10-3]
    prompt: >-
      גלוונומטר טנגנטי בנוי מ-$20$ כריכות עגולות צמודות, ברדיוס $8.0\,\text{cm}$. המישור של הכריכות אנכי ובכיוון צפון–דרום, והמצפן במרכז. אלה המדידות:

      | $I\ (\text{A})$ | 0.05 | 0.10 | 0.15 | 0.20 | 0.25 | 0.30 |
      |---|---|---|---|---|---|---|
      | $\theta$ | $14^\circ$ | $26^\circ$ | $36^\circ$ | $45^\circ$ | $51^\circ$ | $56^\circ$ |

      (א) כתבו את $\tan\theta$ כפונקציה של $I$, ומה השיפוע של הגרף של $\tan\theta$ כתלות ב-$I$.

      (ב) מצאו מהמדידות את הרכיב האופקי של השדה של כדור הארץ.

      (ג) באיזה תחום זרמים הזוויות בין $20^\circ$ ל-$70^\circ$? האם התלמידים מדדו בתחום נוח?

      (ד) מחליפים את הגלוונומטר בגלוונומטר של $40$ כריכות, באותו רדיוס. מה יהיה השיפוע, ומה ה-$B_E$ שיימדד?
    answer: >-
      (א) $\tan\theta = \dfrac{\mu_0 N}{2RB_E}\cdot I$; השיפוע $\dfrac{\mu_0 N}{2RB_E}$.

      (ב) $B_E \approx 3.2\cdot10^{-5}\,\text{T}$.

      (ג) בערך מ-$0.07\,\text{A}$ עד $0.56\,\text{A}$; כן, רוב המדידות בתחום.

      (ד) השיפוע כפול, כ-$9.9\,\text{A}^{-1}$; $B_E$ זהה.
    solution:
      - kind: given
        text: >-
          $N = 20$, $R = 0.080\,\text{m}$, שש מדידות.
      - kind: formula
        text: >-
          (א) במרכז הכריכות $B = \dfrac{\mu_0 NI}{2R}$, ניצב למישור שלהן, כלומר מזרחה או מערבה, וניצב ל-$B_E$. לכן
          $$\tan\theta = \frac{B}{B_E} = \frac{\mu_0 N}{2RB_E}\cdot I$$
          קו ישר דרך הראשית, שהשיפוע שלו $k = \dfrac{\mu_0 N}{2RB_E}$.
      - kind: substitution
        text: >-
          (ב) $\tan\theta$: $0.249$, $0.488$, $0.727$, $1.00$, $1.23$, $1.48$. הקו המתאים ביותר עובר בנקודות $(0.05\,\text{A},\ 0.244)$ ו-$(0.30\,\text{A},\ 1.480)$:
          $$k = \frac{1.480 - 0.244}{0.30 - 0.05} = 4.94\ \text{A}^{-1}$$
      - kind: manipulation
        text: >-
          מבודדים את $B_E$ מ-$k = \dfrac{\mu_0 N}{2RB_E}$: כופלים ב-$B_E$ ומחלקים ב-$k$, $B_E = \dfrac{\mu_0 N}{2Rk}$.
          $$B_E = \frac{4\pi\cdot10^{-7}\cdot20}{2\cdot0.080\cdot4.94} = 3.2\cdot10^{-5}\ \text{T}$$
      - kind: substitution
        text: >-
          (ג) $I = \dfrac{\tan\theta}{k}$: $\dfrac{\tan20^\circ}{4.91} = 0.074\,\text{A}$ ו-$\dfrac{\tan70^\circ}{4.91} = 0.56\,\text{A}$ (עם $k = \dfrac{4\pi\cdot10^{-7}\cdot20}{2\cdot0.08\cdot3.2\cdot10^{-5}} = 4.91\,\text{A}^{-1}$). חמש מתוך שש המדידות בתחום, ורק הראשונה, $14^\circ$, מתחתיו.
      - kind: reasoning
        text: >-
          (ד) פי שניים כריכות, פי שניים שדה בכל זרם, ולכן פי שניים $\tan\theta$: השיפוע כ-$9.9\,\text{A}^{-1}$. ב-$B_E = \dfrac{\mu_0 N}{2Rk}$ גם $N$ וגם $k$ כפולים, ו-$B_E$ לא משתנה: הוא תכונה של המקום.
      - kind: result
        text: >-
          (א) שיפוע $\dfrac{\mu_0 N}{2RB_E}$. (ב) $B_E \approx 3.2\cdot10^{-5}\,\text{T}$. (ג) $0.07$–$0.56\,\text{A}$; כן. (ד) כ-$9.9\,\text{A}^{-1}$, ו-$B_E$ זהה.

  - id: W-4.10-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-4.10-4, OBJ-4.10-1]
    prompt: >-
      שני תילים ישרים, אופקיים ומקבילים, בכיוון צפון–דרום, נמצאים ישר מעל מצפן: האחד $3\,\text{cm}$ מעל המחט, והשני $6\,\text{cm}$ מעליה. בכל אחד זורם זרם של $3\,\text{A}$ צפונה. $B_E = 3.2\cdot10^{-5}\,\text{T}$.

      (א) מה השדה של שני התילים יחד במקום של המחט, ולאן?

      (ב) בכמה מעלות סוטה המחט?

      (ג) מה הכוח בין התילים, לכל מטר אורך? האם הם נמשכים או נדחים?

      (ד) הופכים את הזרם בתיל העליון. מה עונים עכשיו על (ב) ועל (ג)?
    answer: >-
      (א) $3.0\cdot10^{-5}\,\text{T}$, מערבה.

      (ב) $43^\circ$ מערבה.

      (ג) $6.0\cdot10^{-5}\,\text{N}$ למטר; נמשכים.

      (ד) $17^\circ$ מערבה; אותו כוח, אבל הם נדחים.
    solution:
      - kind: given
        text: >-
          $I = 3\,\text{A}$ בכל תיל, $r_1 = 0.03\,\text{m}$, $r_2 = 0.06\,\text{m}$, המרחק בין התילים $d = 0.03\,\text{m}$.
      - kind: substitution
        text: >-
          (א) $B_1 = \dfrac{4\pi\cdot10^{-7}\cdot3}{2\pi\cdot0.03} = 2.0\cdot10^{-5}\,\text{T}$, $B_2 = \dfrac{4\pi\cdot10^{-7}\cdot3}{2\pi\cdot0.06} = 1.0\cdot10^{-5}\,\text{T}$. לפי כלל יד ימין, מתחת לשני התילים, שהזרם בהם צפונה, השדה פונה מערבה. השדות באותו כיוון ומתחברים: $3.0\cdot10^{-5}\,\text{T}$ מערבה.
      - kind: substitution
        text: >-
          (ב) $\tan\theta = \dfrac{3.0}{3.2} = 0.94$, ולכן $\theta = 43^\circ$, מערבה.
      - kind: substitution
        text: >-
          (ג) $\dfrac{F}{L} = \dfrac{\mu_0 I_1 I_2}{2\pi d} = \dfrac{4\pi\cdot10^{-7}\cdot3\cdot3}{2\pi\cdot0.03} = 6.0\cdot10^{-5}\,\text{N/m}$. הזרמים באותו כיוון, ולכן התילים נמשכים.
      - kind: reasoning
        text: >-
          (ד) עכשיו השדה של התיל העליון במחט פונה מזרחה, נגד השדה של התחתון: השדה השקול של התילים $2.0 - 1.0 = 1.0\cdot10^{-5}\,\text{T}$, מערבה, ו-$\tan\theta = \dfrac{1.0}{3.2} = 0.31$, $\theta = 17^\circ$. הכוח בין התילים תלוי במכפלת הזרמים, ולכן הגודל שלו לא משתנה, אבל הזרמים הפוכים, והתילים נדחים.
      - kind: result
        text: >-
          (א) $3.0\cdot10^{-5}\,\text{T}$ מערבה. (ב) $43^\circ$ מערבה. (ג) $6.0\cdot10^{-5}\,\text{N/m}$, נמשכים. (ד) $17^\circ$ מערבה; $6.0\cdot10^{-5}\,\text{N/m}$, נדחים.

  - id: W-4.10-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-4.10-4, OBJ-4.10-1]
    prompt: >-
      בשני ניסויים מודדים את השדה של כדור הארץ באותו מקום.

      בניסוי הראשון, תיל בכיוון צפון–דרום עובר $3\,\text{cm}$ מעל מצפן. בזרם של $4\,\text{A}$ המחט סוטה ב-$40^\circ$.

      בניסוי השני, קטע אופקי של תיל, באורך $0.50\,\text{m}$, בכיוון מזרח–מערב, תלוי על מאזניים רגישים, וזורם בו זרם של $8\,\text{A}$ מזרחה.

      (א) מה הרכיב האופקי של השדה של כדור הארץ, לפי הניסוי הראשון?

      (ב) מה הכוח שהרכיב הזה מפעיל על הקטע בניסוי השני, ולאן? האם המאזניים ירגישו בו?

      (ג) לשדה של כדור הארץ יש גם רכיב אנכי, $3.0\cdot10^{-5}\,\text{T}$ כלפי מטה. מה הכוח שהוא מפעיל על הקטע, ולאן? האם המאזניים ירגישו בו?

      (ד) מה גודל השדה של כדור הארץ במקום, ובאיזו זווית מתחת לאופק הוא פונה?
    answer: >-
      (א) $B_E \approx 3.2\cdot10^{-5}\,\text{T}$.

      (ב) $1.3\cdot10^{-4}\,\text{N}$, כלפי מעלה; כן.

      (ג) $1.2\cdot10^{-4}\,\text{N}$, צפונה (אופקי); לא.

      (ד) $4.4\cdot10^{-5}\,\text{T}$, $43^\circ$ מתחת לאופק.
    solution:
      - kind: given
        text: >-
          ניסוי 1: $r = 0.03\,\text{m}$, $I = 4\,\text{A}$, $\theta = 40^\circ$. ניסוי 2: $L = 0.50\,\text{m}$, $I = 8\,\text{A}$ מזרחה. $B_v = 3.0\cdot10^{-5}\,\text{T}$ למטה.
      - kind: substitution
        text: >-
          (א) $B_w = \dfrac{4\pi\cdot10^{-7}\cdot4}{2\pi\cdot0.03} = 2.67\cdot10^{-5}\,\text{T}$, ו-$B_E = \dfrac{B_w}{\tan40^\circ} = \dfrac{2.67\cdot10^{-5}}{0.839} = 3.18\cdot10^{-5}\,\text{T}$.
      - kind: substitution
        text: >-
          (ב) הרכיב האופקי (צפונה) ניצב לקטע (מזרח–מערב): $F = B_E IL = 3.18\cdot10^{-5}\cdot8\cdot0.50 = 1.27\cdot10^{-4}\,\text{N}$. לפי כלל כף יד ימין: האצבעות צפונה, האגודל מזרחה, והכוח יוצא מכף היד כלפי מעלה. כוח אנכי, ולכן המאזניים מרגישים בו: זו דרך שנייה למדוד את $B_E$.
      - kind: substitution
        text: >-
          (ג) גם הרכיב האנכי ניצב לקטע: $F = 3.0\cdot10^{-5}\cdot8\cdot0.50 = 1.2\cdot10^{-4}\,\text{N}$. לפי כלל כף יד ימין: האצבעות כלפי מטה, האגודל מזרחה, והכוח יוצא מכף היד צפונה. הכוח אופקי, ומאזניים מודדים רק כוח אנכי, ולכן לא ירגישו בו.
      - kind: substitution
        text: >-
          (ד) שני הרכיבים ניצבים זה לזה:
          $$B = \sqrt{(3.18\cdot10^{-5})^2 + (3.0\cdot10^{-5})^2} = 4.4\cdot10^{-5}\ \text{T}$$
          והזווית מתחת לאופק: $\tan\beta = \dfrac{3.0}{3.18} = 0.94$, $\beta = 43^\circ$.
      - kind: result
        text: >-
          (א) $3.2\cdot10^{-5}\,\text{T}$. (ב) $1.3\cdot10^{-4}\,\text{N}$ כלפי מעלה; המאזניים מרגישים. (ג) $1.2\cdot10^{-4}\,\text{N}$ צפונה; המאזניים לא מרגישים. (ד) $4.4\cdot10^{-5}\,\text{T}$, $43^\circ$ מתחת לאופק.

challenge:
  - id: W-4.10-c1
    stars: 1
    objectives: [OBJ-4.10-4]
    prompt: >-
      אלקטרון נע צפונה במהירות $4.0\cdot10^{5}\,\text{m/s}$, באזור שבו השדה המגנטי של כדור הארץ הוא $5.0\cdot10^{-5}\,\text{T}$, ופונה צפונה ו-$45^\circ$ מתחת לאופק.

      (א) מה גודל הכוח המגנטי על האלקטרון?

      (ב) לאן פועל הכוח?

      (ג) מה היה גודל הכוח אילו האלקטרון היה נע מזרחה באותה מהירות?
    answer: >-
      (א) $2.3\cdot10^{-18}\,\text{N}$.

      (ב) מזרחה (אופקי).

      (ג) $3.2\cdot10^{-18}\,\text{N}$.
    solution:
      - kind: given
        text: >-
          $q = -1.6\cdot10^{-19}\,\text{C}$, $v = 4.0\cdot10^{5}\,\text{m/s}$ צפונה, $B = 5.0\cdot10^{-5}\,\text{T}$, צפונה ו-$45^\circ$ מתחת לאופק.
      - kind: reasoning
        text: >-
          נפרק את השדה לשני רכיבים ניצבים, כמו בשיעור: רכיב אופקי צפונה, $B\cos45^\circ$, ורכיב אנכי כלפי מטה, $B\sin45^\circ$. הרכיב האופקי מקביל למהירות, ולכן אינו מפעיל כוח. רק הרכיב האנכי, הניצב למהירות, מפעיל כוח. זה שקול ל-$F = qvB\sin\alpha$ עם $\alpha = 45^\circ$, הזווית בין המהירות לשדה.
      - kind: substitution
        text: >-
          (א) $$F = |q|vB\sin45^\circ = 1.6\cdot10^{-19}\cdot4.0\cdot10^{5}\cdot5.0\cdot10^{-5}\cdot0.707 = 2.3\cdot10^{-18}\ \text{N}$$
      - kind: reasoning
        text: >-
          (ב) לפי כלל כף יד ימין, לחלקיק חיובי: האצבעות כלפי מטה (הרכיב האנכי), האגודל צפונה (המהירות), והכוח יוצא מכף היד מערבה. לאלקטרון, מטען שלילי, הכוח הפוך: מזרחה.
      - kind: substitution
        text: >-
          (ג) כשהמהירות מזרחה, היא ניצבת לשדה כולו (גם לרכיב הצפוני וגם לאנכי), ולכן $\alpha = 90^\circ$:
          $$F = 1.6\cdot10^{-19}\cdot4.0\cdot10^{5}\cdot5.0\cdot10^{-5} = 3.2\cdot10^{-18}\ \text{N}$$
      - kind: result
        text: >-
          (א) $2.3\cdot10^{-18}\,\text{N}$. (ב) מזרחה. (ג) $3.2\cdot10^{-18}\,\text{N}$.
    source:
      name: PhysicsBowl
      year: 2018
      problem: 'Question 37'
      url: https://www.aapt.org/Programs/PhysicsBowl/upload/2018-PhysicsBowl-Exam.pdf
      verified: '2026-11-02'
      adapted: true

  - id: W-4.10-c2
    stars: 2
    objectives: [OBJ-4.10-1, OBJ-4.10-2]
    prompt: >-
      תיל ישר וארוך, שזורם בו זרם של $2.0\,\text{A}$ צפונה, מוסתר בעומק $h$ מתחת ללוח אופקי, ועובר בכיוון צפון–דרום. מזיזים מצפן קטן על הלוח לאורך קו מזרח–מערב, ובכל מקום מודדים את המרחק האופקי $d$ מהנקודה שישר מעל התיל, ואת זווית הסטייה $\varphi$ של המחט מהצפון:

      | $d\ (\text{mm})$ | 0 | 5 | 10 | 15 |
      |---|---|---|---|---|
      | $\varphi$ | $68^\circ$ | $51^\circ$ | $27^\circ$ | $14^\circ$ |

      (א) המחט מסתובבת רק במישור האופקי. הראו שהרכיב האופקי של השדה של התיל במקום של המצפן הוא $B_h = \dfrac{\mu_0 I h}{2\pi(d^2 + h^2)}$, ושהוא פונה מזרחה או מערבה.

      (ב) איך אפשר למצוא, בעזרת המצפן בלבד, את המקום שישר מעל התיל?

      (ג) הראו שהגרף של $1/\tan\varphi$ כתלות ב-$d^2$ הוא קו ישר, ומצאו מה השיפוע שלו ומה החיתוך שלו עם הציר האנכי.

      (ד) מצאו מהמדידות את העומק $h$ ואת הרכיב האופקי $B_E$ של השדה של כדור הארץ.
    answer: >-
      (א) ראו את הפתרון.

      (ב) במקום שבו זווית הסטייה הגדולה ביותר.

      (ג) $\dfrac{1}{\tan\varphi} = \dfrac{2\pi B_E}{\mu_0 I h}\,d^2 + \dfrac{2\pi B_E h}{\mu_0 I}$.

      (ד) $h \approx 5.0\,\text{mm}$, $B_E \approx 3.2\cdot10^{-5}\,\text{T}$.
    solution:
      - kind: given
        text: >-
          $I = 2.0\,\text{A}$ צפונה, ארבע מדידות של $d$ ושל $\varphi$. המרחק מהתיל למצפן הוא $r = \sqrt{d^2 + h^2}$.
      - kind: reasoning
        text: >-
          (א) השדה של התיל במצפן, $B_w = \dfrac{\mu_0 I}{2\pi r}$, ניצב לתיל ולקו שמחבר את התיל למצפן. הקו הזה נמצא במישור האנכי מזרח–מערב, ונוטה מהאנך בזווית $\beta$ שבה $\cos\beta = h/r$. לכן $B_w$ נמצא באותו מישור, ונוטה מהאופק באותה זווית $\beta$. הרכיב האופקי שלו פונה מזרחה או מערבה, וגודלו
          $$B_h = B_w\cos\beta = \frac{\mu_0 I}{2\pi r}\cdot\frac{h}{r} = \frac{\mu_0 I h}{2\pi(d^2 + h^2)}$$
          הרכיב הזה ניצב ל-$B_E$, ולכן $\tan\varphi = B_h/B_E$.
      - kind: reasoning
        text: >-
          (ב) $B_h$ הגדול ביותר כש-$d = 0$, כי אז המכנה $d^2 + h^2$ הקטן ביותר. לכן מזיזים את המצפן לאורך קו מזרח–מערב, ומחפשים את המקום שבו הסטייה הגדולה ביותר: הוא ישר מעל התיל. חוזרים על זה בקו אחר, ושתי הנקודות מראות את מסלול התיל.
      - kind: manipulation
        text: >-
          (ג) $\tan\varphi = \dfrac{\mu_0 I h}{2\pi B_E(d^2 + h^2)}$. הופכים את שני האגפים:
          $$\frac{1}{\tan\varphi} = \frac{2\pi B_E}{\mu_0 I h}\,d^2 + \frac{2\pi B_E h}{\mu_0 I}$$
          זה קו ישר, $y = kx + b$, עם $y = 1/\tan\varphi$ ו-$x = d^2$: השיפוע $k = \dfrac{2\pi B_E}{\mu_0 I h}$ והחיתוך $b = \dfrac{2\pi B_E h}{\mu_0 I}$.
      - kind: substitution
        text: >-
          (ד) מחשבים: $d^2 = 0,\ 25,\ 100,\ 225\ \text{mm}^2$, ו-$1/\tan\varphi = 0.404,\ 0.810,\ 1.963,\ 4.011$. הקו המתאים ביותר עובר בנקודות $(0,\ 0.397)$ ו-$(225\,\text{mm}^2,\ 3.997)$:
          $$k = \frac{3.997 - 0.397}{225} = 0.0160\ \text{mm}^{-2} \qquad b = 0.397$$
      - kind: manipulation
        text: >-
          המנה של החיתוך בשיפוע היא $\dfrac{b}{k} = h^2$, ולכן
          $$h = \sqrt{\frac{0.397}{0.0160}} = 5.0\ \text{mm}$$
          המכפלה שלהם היא $kb = \left(\dfrac{2\pi B_E}{\mu_0 I}\right)^2$, ולכן $B_E = \dfrac{\mu_0 I\sqrt{kb}}{2\pi}$. בשיפוע ביחידות SI, $k = 0.0160\,\text{mm}^{-2} = 1.60\cdot10^{4}\,\text{m}^{-2}$:
          $$B_E = \frac{4\pi\cdot10^{-7}\cdot2.0\cdot\sqrt{1.60\cdot10^{4}\cdot0.397}}{2\pi} = 3.2\cdot10^{-5}\ \text{T}$$
      - kind: result
        text: >-
          (ב) במקום שבו הסטייה הגדולה ביותר. (ג) שיפוע $\dfrac{2\pi B_E}{\mu_0 I h}$, חיתוך $\dfrac{2\pi B_E h}{\mu_0 I}$. (ד) $h \approx 5.0\,\text{mm}$, $B_E \approx 3.2\cdot10^{-5}\,\text{T}$.
