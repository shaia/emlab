# Workbook, lesson 4.2 (the field of a straight wire). Format and rules: see .claude/CLAUDE.md, "Worked examples, workbook".
# Every number was recomputed with src/physics/magnetism.ts (straightWireField, wireFieldAt) and
# src/physics/wireflux.ts (wireDistanceForField, nullPointTwoWires, totalFieldAt); script r42/recompute.ts in the session scratchpad.
# In a >- block, consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '4.2'
practice:
  - id: W-4.2-01
    level: basic
    qualitative: false
    objectives: [OBJ-4.2-2]
    prompt: >-
      כבל התנעה של מכונית נושא, ברגע ההתנעה, זרם של $150\,\text{A}$. מצפן מונח $3\,\text{cm}$ מהכבל, שהוא ישר וארוך.

      א. מה גודל השדה המגנטי של הכבל במקום של המצפן?

      ב. פי כמה הוא גדול מהרכיב האופקי של השדה של כדור הארץ, $3.2\cdot10^{-5}\,\text{T}$? מה תעשה המחט?
    answer: >-
      א. $B = 1\cdot10^{-3}\,\text{T} = 1\,\text{mT}$.

      ב. פי 31 בערך. השדה של כדור הארץ כמעט זניח לידו, והמחט תצביע כמעט בכיוון השדה של הכבל.
    solution:
      - kind: given
        text: >-
          $I = 150\,\text{A}$, $r = 3\,\text{cm} = 0.03\,\text{m}$, $B_E = 3.2\cdot10^{-5}\,\text{T}$.
      - kind: formula
        text: >-
          $B = \dfrac{\mu_0 I}{2\pi r}$.
      - kind: substitution
        text: >-
          א. $B = \dfrac{4\pi\cdot10^{-7}\cdot150}{2\pi\cdot0.03} = 1\cdot10^{-3}\,\text{T}$.

          ב. $\dfrac{1\cdot10^{-3}}{3.2\cdot10^{-5}} \approx 31$.
      - kind: reasoning
        text: >-
          המחט מצביעה בכיוון השדה השקול. כשהשדה של הכבל גדול פי 31 מזה של כדור הארץ, השדה השקול כמעט כולו של הכבל: המחט משיקה כמעט לגמרי למעגל שסביב הכבל.
      - kind: result
        text: >-
          א. $1\cdot10^{-3}\,\text{T}$.

          ב. פי 31 בערך; המחט מצביעה כמעט בכיוון השדה של הכבל.

  - id: W-4.2-02
    level: basic
    qualitative: true
    objectives: [OBJ-4.2-1]
    prompt: >-
      תיל ישר וארוך ניצב לדף, וזורם בו זרם לתוך הדף (⊗). ארבע נקודות נמצאות בדף, במרחק שווה מהתיל: A מעליו, B מימינו, C מתחתיו ו-D משמאלו.

      א. קבעו את כיוון השדה המגנטי בכל אחת מהנקודות.

      ב. בכמה מהנקודות השדה שווה בגודלו? האם השדות זהים?
    answer: >-
      א. A ימינה, B למטה, C שמאלה, D למעלה: השדה מקיף את התיל עם כיוון השעון.

      ב. בכל הארבע השדה באותו גודל, אבל לא זהה: כיוונו שונה בכל נקודה.
    solution:
      - kind: given
        text: >-
          זרם לתוך הדף (⊗); ארבע נקודות במרחק שווה מהתיל.
      - kind: reasoning
        text: >-
          א. כלל יד ימין: האגודל לתוך הדף, והאצבעות המכופפות מקיפות את התיל עם כיוון השעון. השדה משיק למעגל שעובר בנקודה. ב-A, בראש המעגל, תנועה עם כיוון השעון היא ימינה; ב-B, בצד ימין, למטה; ב-C, בתחתית, שמאלה; ב-D, בצד שמאל, למעלה.
      - kind: reasoning
        text: >-
          ב. גודל השדה תלוי רק בזרם ובמרחק, $B = \mu_0 I/(2\pi r)$, ולכן הוא שווה בכל הנקודות. אבל שדה הוא וקטור, ושני וקטורים זהים רק כשגם הכיוונים שלהם שווים.
      - kind: result
        text: >-
          א. A ימינה, B למטה, C שמאלה, D למעלה.

          ב. אותו גודל בכל הארבע, בכיוונים שונים.

  - id: W-4.2-03
    level: basic
    qualitative: false
    objectives: [OBJ-4.2-2]
    prompt: >-
      חיישן מגנטי, במרחק $2.5\,\text{cm}$ מתיל ישר וארוך, מודד את השדה של התיל: $0.24\,\text{mT}$. מה הזרם בתיל?
    answer: >-
      $I = 30\,\text{A}$.
    solution:
      - kind: given
        text: >-
          $B = 0.24\,\text{mT} = 2.4\cdot10^{-4}\,\text{T}$, $r = 2.5\,\text{cm} = 0.025\,\text{m}$.
      - kind: formula
        text: >-
          $B = \dfrac{\mu_0 I}{2\pi r}$.
      - kind: manipulation
        text: >-
          כופלים את שני האגפים ב-$2\pi r$ ומחלקים ב-$\mu_0$, כדי לבודד את הזרם: $I = \dfrac{2\pi r B}{\mu_0}$.
      - kind: substitution
        text: >-
          $I = \dfrac{2\pi\cdot0.025\cdot2.4\cdot10^{-4}}{4\pi\cdot10^{-7}} = 30\,\text{A}$.
      - kind: result
        text: >-
          $I = 30\,\text{A}$.

  - id: W-4.2-04
    level: mid
    qualitative: true
    objectives: [OBJ-4.2-1, OBJ-4.2-3]
    prompt: >-
      תלמידה חוזרת על הניסוי של אורסטד, אבל מותחת את התיל בכיוון מזרח-מערב, מעט מעל המצפן. המחט מצביעה צפונה, ניצב לתיל.

      א. בתיל זורם זרם מזרחה. לאן מצביע השדה של התיל במקום של המצפן? האם המחט תסתובב?

      ב. היא הופכת את הזרם, כך שיזרום מערבה. מה יקרה למחט אם השדה של התיל חלש מזה של כדור הארץ? ואם הוא חזק ממנו?

      ג. למה כדאי למתוח את התיל בכיוון צפון-דרום?
    answer: >-
      א. צפונה, כמו השדה של כדור הארץ. המחט לא תסתובב.

      ב. בשדה חלש המחט תמשיך להצביע צפונה; בשדה חזק היא תתהפך ותצביע דרומה.

      ג. אז השדה של התיל ניצב לשדה של כדור הארץ, והמחט מסתובבת בזווית שתלויה בזרם.
    solution:
      - kind: given
        text: >-
          תיל מזרח-מערב מעל המצפן; השדה של כדור הארץ צפונה.
      - kind: reasoning
        text: >-
          א. כלל יד ימין: האגודל מזרחה, ומתחת לתיל האצבעות מצביעות צפונה. השדה של התיל באותו כיוון כמו השדה של כדור הארץ, והשדה השקול צפונה, רק חזק יותר. המחט כבר מצביעה צפונה, ולכן היא לא זזה.
      - kind: reasoning
        text: >-
          ב. עכשיו השדה של התיל מתחת לתיל מצביע דרומה, נגד השדה של כדור הארץ. השדה השקול הוא ההפרש. אם השדה של התיל חלש יותר, ההפרש עדיין צפונה, והמחט לא זזה. אם הוא חזק יותר, השדה השקול דרומה, והמחט מסתובבת $180^\circ$.
      - kind: reasoning
        text: >-
          ג. כשהתיל צפון-דרום, השדה של התיל מתחתיו מצביע מזרחה או מערבה, ניצב לשדה של כדור הארץ. אז כל זרם, גם קטן, מסובב את המחט הצידה, והזווית גדלה עם הזרם. כך עשה אורסטד, וכך נמדוד את השדה של כדור הארץ בשיעור 4.10.
      - kind: result
        text: >-
          א. השדה צפונה; המחט לא זזה.

          ב. בשדה חלש: לא זזה. בשדה חזק: מתהפכת דרומה.

          ג. בתיל צפון-דרום השדה של התיל ניצב לשדה של כדור הארץ.

  - id: W-4.2-05
    level: mid
    qualitative: false
    objectives: [OBJ-4.2-2]
    prompt: >-
      חיישן מודד את השדה של תיל ישר וארוך. מרחיקים את החיישן ב-$3\,\text{cm}$ נוספים מהתיל, והשדה שהוא מודד יורד ל-$\frac{2}{3}$ מערכו הקודם.

      א. מה היה המרחק ההתחלתי של החיישן מהתיל?

      ב. הזרם בתיל $12\,\text{A}$. מה השדה בשני המקומות?
    answer: >-
      א. $6\,\text{cm}$.

      ב. $40\,\mu\text{T}$ ב-$6\,\text{cm}$, וכ-$26.7\,\mu\text{T}$ ב-$9\,\text{cm}$.
    solution:
      - kind: given
        text: >-
          המרחק ההתחלתי $r$, המרחק החדש $r + 3\,\text{cm}$; $B_2 = \frac{2}{3}B_1$; $I = 12\,\text{A}$.
      - kind: formula
        text: >-
          $B = \dfrac{\mu_0 I}{2\pi r}$, ולכן באותו תיל $\dfrac{B_2}{B_1} = \dfrac{r_1}{r_2}$: השדה הפוך למרחק.
      - kind: manipulation
        text: >-
          א. $\dfrac{r}{r + 3} = \dfrac{2}{3}$. כופלים את שני האגפים ב-$3(r + 3)$: $3r = 2r + 6$, ולכן $r = 6\,\text{cm}$.
      - kind: substitution
        text: >-
          ב. $B_1 = \dfrac{4\pi\cdot10^{-7}\cdot12}{2\pi\cdot0.06} = 4\cdot10^{-5}\,\text{T}$, ו-$B_2 = \frac{2}{3}\cdot4\cdot10^{-5} \approx 2.67\cdot10^{-5}\,\text{T}$. (בדיקה ישירה: $\dfrac{4\pi\cdot10^{-7}\cdot12}{2\pi\cdot0.09}$ נותן אותו מספר.)
      - kind: result
        text: >-
          א. $6\,\text{cm}$.

          ב. $40\,\mu\text{T}$ ו-$26.7\,\mu\text{T}$.

  - id: W-4.2-06
    level: mid
    qualitative: false
    objectives: [OBJ-4.2-3]
    prompt: >-
      שני תילים ישרים וארוכים ניצבים לדף, $6\,\text{cm}$ זה מזה, ובשניהם זרם של $6\,\text{A}$ החוצה מהדף. הנקודה P נמצאת $4\,\text{cm}$ מעל האמצע בין התילים, ולכן במרחק $5\,\text{cm}$ מכל תיל.

      א. מה גודל השדה של כל תיל ב-P?

      ב. מה השדה השקול ב-P, גודל וכיוון? רמז: פרקו כל שדה לרכיב אופקי ולרכיב אנכי.
    answer: >-
      א. $2.4\cdot10^{-5}\,\text{T}$ כל אחד.

      ב. $3.84\cdot10^{-5}\,\text{T}$, שמאלה. הרכיבים האנכיים מתבטלים.
    solution:
      - kind: given
        text: >-
          $I_1 = I_2 = 6\,\text{A}$ (⊙). התילים ב-$(-3, 0)$ ו-$(3, 0)$ ס"מ, ו-P ב-$(0, 4)$ ס"מ; המרחק מכל תיל $\sqrt{3^2 + 4^2} = 5\,\text{cm}$.
      - kind: substitution
        text: >-
          א. $B_1 = B_2 = \dfrac{4\pi\cdot10^{-7}\cdot6}{2\pi\cdot0.05} = 2.4\cdot10^{-5}\,\text{T}$.
      - kind: reasoning
        text: >-
          ב. כל שדה ניצב לקו שמחבר את P לתיל שלו, ולפי כלל יד ימין (⊙, נגד כיוון השעון) הוא פונה שמאלה. הקו מהתיל השמאלי ל-P עולה ימינה, בשיפוע $\frac{4}{3}$; השדה שלו ניצב לקו הזה: שמאלה ולמעלה, עם רכיבים $0.8B_1$ שמאלה ו-$0.6B_1$ למעלה. הקו מהתיל הימני עולה שמאלה, והשדה שלו שמאלה ולמטה: $0.8B_2$ שמאלה ו-$0.6B_2$ למטה.
      - kind: substitution
        text: >-
          הרכיבים האנכיים, $0.6B$ למעלה ו-$0.6B$ למטה, מתבטלים. הרכיבים האופקיים מתחברים: $2\cdot0.8\cdot2.4\cdot10^{-5} = 3.84\cdot10^{-5}\,\text{T}$.
      - kind: result
        text: >-
          א. $2.4\cdot10^{-5}\,\text{T}$ כל אחד.

          ב. $3.84\cdot10^{-5}\,\text{T}$, שמאלה.

  - id: W-4.2-07
    level: mid
    qualitative: true
    objectives: [OBJ-4.2-1, OBJ-4.2-3]
    prompt: >-
      שני תילים אנכיים עוברים דרך שולחן, $10\,\text{cm}$ זה מזה, ובשניהם זרם באותו גודל. מצפן מונח בדיוק באמצע ביניהם. השדה של כדור הארץ מצביע צפונה. קבעו ונמקו, בכל מקרה, לאן תצביע המחט:

      א. התילים על קו מזרח-מערב, ובשניהם הזרם כלפי מעלה.

      ב. התילים על קו מזרח-מערב; בתיל המערבי הזרם כלפי מעלה, ובמזרחי כלפי מטה.

      ג. התילים על קו צפון-דרום; בתיל הדרומי הזרם כלפי מעלה, ובצפוני כלפי מטה.
    answer: >-
      א. צפונה: השדות של התילים מתבטלים באמצע.

      ב. צפונה: השדות של התילים מתחברים, צפונה, ומחזקים את השדה של כדור הארץ.

      ג. השדות של התילים מתחברים מערבה, והמחט נוטה מהצפון לכיוון מערב.
    solution:
      - kind: given
        text: >-
          זרמים שווים בגודלם; המצפן באמצע, $5\,\text{cm}$ מכל תיל. במבט מלמעלה זרם כלפי מעלה הוא ⊙ (שדה נגד כיוון השעון), וזרם כלפי מטה ⊗ (עם כיוון השעון).
      - kind: reasoning
        text: >-
          א. המצפן מזרחית לתיל המערבי: השדה של התיל המערבי (⊙) מצביע שם צפונה. הוא מערבית לתיל המזרחי: השדה של התיל המזרחי (⊙) מצביע שם דרומה. שווים ומנוגדים, ולכן נשאר רק השדה של כדור הארץ.
      - kind: reasoning
        text: >-
          ב. השדה של התיל המערבי (⊙) עדיין צפונה. עכשיו התיל המזרחי ⊗: מערבית לו השדה שלו מצביע צפונה. שני השדות צפונה, ועם השדה של כדור הארץ השדה השקול צפונה וחזק יותר. המחט לא זזה מצפון.
      - kind: reasoning
        text: >-
          ג. המצפן צפונית לתיל הדרומי (⊙): השדה שלו מצביע שם מערבה. הוא דרומית לתיל הצפוני (⊗): השדה שלו, עם כיוון השעון, מצביע שם גם מערבה. שני השדות מערבה, ניצב לשדה של כדור הארץ, ולכן המחט נוטה מהצפון לכיוון מערב. לדוגמה, עם $8\,\text{A}$ בכל תיל השדה של שני התילים $6.4\cdot10^{-5}\,\text{T}$, ועם $B_E = 3.2\cdot10^{-5}\,\text{T}$ הזווית כ-$63^\circ$ מהצפון.
      - kind: result
        text: >-
          א. צפונה.

          ב. צפונה.

          ג. המחט נוטה מהצפון לכיוון מערב.

  - id: W-4.2-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-4.2-1, OBJ-4.2-3]
    prompt: >-
      תיל ארוך ואנכי עובר דרך שולחן. מצפן מונח על השולחן $5\,\text{cm}$ צפונית לתיל. כשמעבירים בתיל זרם, המחט נוטה $30^\circ$ מהצפון לכיוון מערב. הרכיב האופקי של השדה של כדור הארץ במקום הוא $3\cdot10^{-5}\,\text{T}$.

      א. האם הזרם בתיל זורם כלפי מעלה או כלפי מטה? נמקו בכלל יד ימין.

      ב. מה גודל השדה של התיל במקום של המצפן, ומה הזרם בתיל?

      ג. היכן על השולחן נמצאת נקודה שבה השדה השקול מתאפס? הראו שהמרחק שלה מהתיל הוא $5\,\text{cm}\cdot\tan30^\circ$.
    answer: >-
      א. כלפי מעלה.

      ב. $B \approx 1.73\cdot10^{-5}\,\text{T}$; $I \approx 4.3\,\text{A}$.

      ג. מערבית לתיל, כ-$2.9\,\text{cm}$ ממנו.
    solution:
      - kind: given
        text: >-
          $r = 5\,\text{cm} = 0.05\,\text{m}$, צפונית לתיל; זווית הסטייה $\theta = 30^\circ$ מהצפון לכיוון מערב; $B_E = 3\cdot10^{-5}\,\text{T}$.
      - kind: reasoning
        text: >-
          א. המחט נוטה מערבה, ולכן השדה של התיל במקום של המצפן מצביע מערבה. צפונית לתיל, שדה מערבה מקיף את התיל נגד כיוון השעון במבט מלמעלה. לפי כלל יד ימין, האגודל מצביע אז אל מי שמסתכל מלמעלה: הזרם כלפי מעלה.
      - kind: formula
        text: >-
          ב. השדה של התיל (מערבה) ניצב ל-$B_E$ (צפונה), והמחט מצביעה בכיוון השקול, ולכן $\tan\theta = \dfrac{B}{B_E}$. ו-$B = \dfrac{\mu_0 I}{2\pi r}$.
      - kind: manipulation
        text: >-
          כופלים ב-$B_E$: $B = B_E\tan\theta$. מבודדים את הזרם: $I = \dfrac{2\pi r B}{\mu_0}$.
      - kind: substitution
        text: >-
          $B = 3\cdot10^{-5}\cdot\tan30^\circ \approx 1.73\cdot10^{-5}\,\text{T}$, ו-$I = \dfrac{2\pi\cdot0.05\cdot1.73\cdot10^{-5}}{4\pi\cdot10^{-7}} \approx 4.33\,\text{A}$.
      - kind: reasoning
        text: >-
          ג. הזרם כלפי מעלה, ולכן מערבית לתיל השדה שלו מצביע דרומה, נגד $B_E$. בנקודת האפס $\dfrac{\mu_0 I}{2\pi r_0} = B_E$. מחלקים את המשוואה הזאת ב-$\dfrac{\mu_0 I}{2\pi r} = B_E\tan\theta$ (המשוואה של המצפן): $\dfrac{r}{r_0} = \dfrac{1}{\tan\theta}$, ולכן $r_0 = r\tan\theta$.
      - kind: substitution
        text: >-
          $r_0 = 5\cdot\tan30^\circ \approx 2.89\,\text{cm}$. (בדיקה: $\dfrac{4\pi\cdot10^{-7}\cdot4.33}{2\pi\cdot3\cdot10^{-5}} \approx 0.0289\,\text{m}$.)
      - kind: result
        text: >-
          א. כלפי מעלה.

          ב. $1.73\cdot10^{-5}\,\text{T}$; $4.3\,\text{A}$.

          ג. כ-$2.9\,\text{cm}$ מערבית לתיל.

  - id: W-4.2-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-4.2-2, OBJ-4.2-3]
    prompt: >-
      שני תילים ישרים וארוכים ניצבים לדף, $8\,\text{cm}$ זה מזה, ובשניהם זרם של $10\,\text{A}$ החוצה מהדף. בוחנים את השדה בנקודות שעל האנך האמצעי, הקו שעובר באמצע בין התילים וניצב לקו שמחבר אותם, בגובה $h$ מעל האמצע.

      א. מה השדה ב-$h = 0$?

      ב. הראו שבכל נקודה על האנך האמצעי השדה השקול אופקי, וחשבו אותו ב-$h = 3\,\text{cm}$ וב-$h = 4\,\text{cm}$.

      ג. רחוק מאוד, ב-$h = 20\,\text{cm}$, השדה השקול כ-$1.92\cdot10^{-5}\,\text{T}$. השוו לשדה של תיל אחד עם $20\,\text{A}$ במרחק $20\,\text{cm}$, והסבירו.
    answer: >-
      א. אפס.

      ב. $4.8\cdot10^{-5}\,\text{T}$ ב-$3\,\text{cm}$, ו-$5\cdot10^{-5}\,\text{T}$ ב-$4\,\text{cm}$, שמאלה.

      ג. $2\cdot10^{-5}\,\text{T}$, קרוב מאוד: רחוק מהתילים הם נראים כמו תיל אחד עם הזרם הכולל.
    solution:
      - kind: given
        text: >-
          $I_1 = I_2 = 10\,\text{A}$ (⊙), התילים ב-$x = \pm4\,\text{cm}$; הנקודה ב-$(0, h)$, במרחק $r = \sqrt{h^2 + 4^2}$ ס"מ מכל תיל.
      - kind: reasoning
        text: >-
          א. באמצע השדות של שני התילים שווים ומנוגדים (ראו איור 4.2ב): $B = 0$.
      - kind: reasoning
        text: >-
          ב. כל שדה גודלו $\dfrac{\mu_0 I}{2\pi r}$ וניצב לקו מהתיל שלו לנקודה. הסידור סימטרי: השדה של התיל השמאלי פונה שמאלה ולמעלה, ושל הימני שמאלה ולמטה, באותה זווית. הרכיבים האנכיים מתבטלים, והאופקיים מתחברים. הרכיב האופקי של כל שדה הוא $B\cdot\dfrac{h}{r}$, ולכן $B_{\text{total}} = 2\cdot\dfrac{\mu_0 I}{2\pi r}\cdot\dfrac{h}{r}$.
      - kind: substitution
        text: >-
          ב-$h = 3\,\text{cm}$: $r = 5\,\text{cm}$, כל שדה $\dfrac{4\pi\cdot10^{-7}\cdot10}{2\pi\cdot0.05} = 4\cdot10^{-5}\,\text{T}$, והשקול $2\cdot4\cdot10^{-5}\cdot\dfrac{3}{5} = 4.8\cdot10^{-5}\,\text{T}$. ב-$h = 4\,\text{cm}$: $r = \sqrt{32} \approx 5.66\,\text{cm}$, כל שדה $\approx 3.54\cdot10^{-5}\,\text{T}$, והשקול $2\cdot3.54\cdot10^{-5}\cdot\dfrac{4}{5.66} = 5\cdot10^{-5}\,\text{T}$.
      - kind: substitution
        text: >-
          ג. תיל אחד עם $20\,\text{A}$: $\dfrac{4\pi\cdot10^{-7}\cdot20}{2\pi\cdot0.2} = 2\cdot10^{-5}\,\text{T}$. ההבדל מ-$1.92\cdot10^{-5}\,\text{T}$ כ-4% בלבד. רחוק מהתילים, המרחק ביניהם קטן לעומת המרחק אליהם, הכיוונים של שני השדות כמעט זהים, והם מתחברים כמו שדה של זרם אחד של $20\,\text{A}$.
      - kind: result
        text: >-
          א. $0$.

          ב. $4.8\cdot10^{-5}\,\text{T}$ ו-$5\cdot10^{-5}\,\text{T}$, שמאלה.

          ג. כמעט כמו תיל אחד עם $20\,\text{A}$: $2\cdot10^{-5}\,\text{T}$.

  - id: W-4.2-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-4.2-2]
    prompt: >-
      תלמיד מדד בחיישן את השדה של תיל ישר וארוך במרחקים שונים ממנו:

      $r$ (cm): 2, 4, 6, 8, 10. $B$ ($\mu\text{T}$): 100, 51, 33, 26, 20.

      א. חברו טוען שהשדה פרופורציוני ל-$1/r^2$. הראו מהמדידות שהוא טועה, ושהן מתאימות ל-$B \propto 1/r$.

      ב. איזה גרף כדאי לשרטט כדי לקבל קו ישר? מה המשמעות של השיפוע שלו?

      ג. מצאו את הזרם בתיל מהשיפוע.
    answer: >-
      א. המכפלה $Br$ כמעט קבועה (כ-$2\cdot10^{-6}\,\text{T}\cdot\text{m}$), והמכפלה $Br^2$ גדלה פי 5.

      ב. $B$ כפונקציה של $1/r$: קו ישר דרך הראשית, ושיפועו $\mu_0 I/(2\pi)$.

      ג. השיפוע כ-$2.0\cdot10^{-6}\,\text{T}\cdot\text{m}$, ולכן $I \approx 10\,\text{A}$.
    solution:
      - kind: given
        text: >-
          חמש מדידות של $B$ במרחקים $2$ עד $10\,\text{cm}$.
      - kind: reasoning
        text: >-
          א. אם $B \propto 1/r$, המכפלה $Br$ קבועה; אם $B \propto 1/r^2$, המכפלה $Br^2$ קבועה. בדקו: $Br$ (ביחידות $\mu\text{T}\cdot\text{cm}$) הוא $200, 204, 198, 208, 200$, כמעט קבוע. $Br^2$ (ביחידות $\mu\text{T}\cdot\text{cm}^2$) הוא $400, 816, 1188, 1664, 2000$, ועולה פי 5. לכן $B \propto 1/r$.
      - kind: formula
        text: >-
          ב. $B = \dfrac{\mu_0 I}{2\pi}\cdot\dfrac{1}{r}$. זו משוואה של קו ישר דרך הראשית, $y = mx$, עם $y = B$ ו-$x = 1/r$ (שיעור 0.4). השיפוע $m = \dfrac{\mu_0 I}{2\pi}$.
      - kind: manipulation
        text: >-
          ג. מבודדים את הזרם מהשיפוע: $I = \dfrac{2\pi m}{\mu_0}$.
      - kind: substitution
        text: >-
          ב-SI: $1/r$ הוא $50, 25, 16.7, 12.5, 10\ \text{m}^{-1}$, ו-$B$ הוא $1.00, 0.51, 0.33, 0.26, 0.20$ כפול $10^{-4}\,\text{T}$. הקו הטוב ביותר דרך הראשית עובר, למשל, דרך $(50\,\text{m}^{-1}, 1.00\cdot10^{-4}\,\text{T})$, שהיא גם המדידה הראשונה, ולכן $m = \dfrac{1.00\cdot10^{-4}}{50} = 2.0\cdot10^{-6}\,\text{T}\cdot\text{m}$. ($2.0\cdot10^{-6}$ מתקבל גם מהשיפוע בין הנקודה הראשונה לאחרונה.) $I = \dfrac{2\pi\cdot2.0\cdot10^{-6}}{4\pi\cdot10^{-7}} = 10\,\text{A}$.
      - kind: result
        text: >-
          א. $Br$ קבוע, $Br^2$ לא.

          ב. $B$ כפונקציה של $1/r$, שיפוע $\mu_0 I/(2\pi)$.

          ג. $I \approx 10\,\text{A}$.

challenge:
  - id: W-4.2-c1
    stars: 1
    objectives: [OBJ-4.2-3, OBJ-4.2-2]
    prompt: >-
      שני תילים ישרים וארוכים ניצבים לדף, על ציר $x$, $10\,\text{cm}$ זה מזה. בתיל השמאלי זורם זרם של $2\,\text{A}$ החוצה מהדף, ובימני $3\,\text{A}$ לתוך הדף. הציר מתחלק לשלושה אזורים: I משמאל לתיל השמאלי, II בין התילים, ו-III מימין לתיל הימני.

      א. באילו אזורים יש על הציר נקודה (לא באינסוף) שבה השדה המגנטי של שני הזרמים מתאפס? נמקו לכל אזור.

      ב. מצאו את הנקודה.

      ג. מה השדה בנקודה $30\,\text{cm}$ מימין לתיל הימני? למה הוא קטן כל כך?
    answer: >-
      א. רק באזור I.

      ב. $20\,\text{cm}$ משמאל לתיל השמאלי.

      ג. $1\cdot10^{-6}\,\text{T}$, למטה: שני השדות מנוגדים, ורחוק מהתילים הם כמעט מבטלים זה את זה.
    solution:
      - kind: given
        text: >-
          $I_1 = 2\,\text{A}$ (⊙) ב-$x = 0$, $I_2 = 3\,\text{A}$ (⊗) ב-$x = 10\,\text{cm}$.
      - kind: reasoning
        text: >-
          א. לפי כלל יד ימין, תיל ⊙ יוצר על הציר שדה למעלה מימינו ולמטה משמאלו; תיל ⊗ להפך, למטה מימינו ולמעלה משמאלו. באזור II שני השדות למעלה ומתחברים: אין אפס. באזורים I ו-III השדות מנוגדים. באזור III הנקודות קרובות יותר לתיל החזק ($3\,\text{A}$), ולכן השדה שלו תמיד גדול יותר: אין אפס. באזור I הנקודות קרובות יותר לתיל החלש, והמרחק הקטן יכול לפצות על הזרם הקטן.
      - kind: formula
        text: >-
          ב. נסמן ב-$y$ את המרחק של הנקודה משמאל לתיל השמאלי. שם $\dfrac{\mu_0 I_1}{2\pi y} = \dfrac{\mu_0 I_2}{2\pi (y + d)}$.
      - kind: manipulation
        text: >-
          מצמצמים את $\dfrac{\mu_0}{2\pi}$ וכופלים במכנים: $I_1(y + d) = I_2 y$, ולכן $y = \dfrac{I_1 d}{I_2 - I_1}$.
      - kind: substitution
        text: >-
          $y = \dfrac{2\cdot10}{3 - 2} = 20\,\text{cm}$. בדיקה: $\dfrac{2}{20} = \dfrac{3}{30}$.
      - kind: substitution
        text: >-
          ג. הנקודה $40\,\text{cm}$ מהתיל השמאלי ו-$30\,\text{cm}$ מהימני: $B_1 = \dfrac{4\pi\cdot10^{-7}\cdot2}{2\pi\cdot0.4} = 1\cdot10^{-6}\,\text{T}$ למעלה, ו-$B_2 = \dfrac{4\pi\cdot10^{-7}\cdot3}{2\pi\cdot0.3} = 2\cdot10^{-6}\,\text{T}$ למטה. השקול $1\cdot10^{-6}\,\text{T}$, למטה. הזרמים מנוגדים, ורחוק מהזוג הם כמעט כמו זרם אחד של $3 - 2 = 1\,\text{A}$.
      - kind: result
        text: >-
          א. רק באזור I.

          ב. $20\,\text{cm}$ משמאל לתיל השמאלי.

          ג. $1\cdot10^{-6}\,\text{T}$, למטה.
    source:
      name: PhysicsBowl (AAPT)
      year: 2017
      problem: '33'
      url: https://www.aapt.org/Programs/PhysicsBowl/upload/PhysicsBowl_2017.pdf
      verified: '2026-11-02'
      adapted: true

  - id: W-4.2-c2
    stars: 1
    objectives: [OBJ-4.2-2, OBJ-4.2-3]
    prompt: >-
      קו חשמל של זרם ישר מעביר הספק של $1000\,\text{MW}$ לעיר, במתח של $500\,\text{kV}$. התיל עשוי אלומיניום (התנגדות סגולית $2.8\cdot10^{-8}\,\Omega\cdot\text{m}$), קוטרו $3\,\text{cm}$ ואורכו $500\,\text{km}$. התיל החוזר רחוק מאוד, ולכן נתייחס לתיל אחד בלבד.

      א. מה הזרם בתיל?

      ב. מה ההתנגדות של התיל, ואיזה חלק מההספק הולך בו לאיבוד כחום?

      ג. התיל מתוח בכיוון צפון-דרום, בגובה $20\,\text{m}$ מעל הקרקע. מה השדה המגנטי שלו על הקרקע, ישר מתחתיו?

      ד. מצפן מונח על הקרקע ישר מתחת לתיל. הרכיב האופקי של השדה של כדור הארץ $3.2\cdot10^{-5}\,\text{T}$. בכמה מעלות תסטה המחט מהצפון?
    answer: >-
      א. $2000\,\text{A}$.

      ב. כ-$19.8\,\Omega$; כ-$79\,\text{MW}$, כ-8% מההספק.

      ג. $2\cdot10^{-5}\,\text{T}$.

      ד. כ-$32^\circ$.
    solution:
      - kind: given
        text: >-
          $P = 1000\,\text{MW} = 10^9\,\text{W}$, $V = 500\,\text{kV} = 5\cdot10^5\,\text{V}$, $\rho = 2.8\cdot10^{-8}\,\Omega\cdot\text{m}$, קוטר $3\,\text{cm}$ (רדיוס $0.015\,\text{m}$), $L = 5\cdot10^5\,\text{m}$, גובה $h = 20\,\text{m}$, $B_E = 3.2\cdot10^{-5}\,\text{T}$.
      - kind: formula
        text: >-
          $P = VI$ (שיעור 3.4), $R = \rho\dfrac{L}{A}$ (שיעור 3.3), $P_{\text{loss}} = I^2R$, $B = \dfrac{\mu_0 I}{2\pi r}$.
      - kind: substitution
        text: >-
          א. $I = \dfrac{P}{V} = \dfrac{10^9}{5\cdot10^5} = 2000\,\text{A}$.

          ב. $A = \pi\cdot0.015^2 \approx 7.07\cdot10^{-4}\,\text{m}^2$, $R = \dfrac{2.8\cdot10^{-8}\cdot5\cdot10^5}{7.07\cdot10^{-4}} \approx 19.8\,\Omega$, $P_{\text{loss}} = 2000^2\cdot19.8 \approx 7.9\cdot10^7\,\text{W}$, כ-8% מ-$10^9\,\text{W}$.

          ג. $B = \dfrac{4\pi\cdot10^{-7}\cdot2000}{2\pi\cdot20} = 2\cdot10^{-5}\,\text{T}$.
      - kind: reasoning
        text: >-
          ד. התיל צפון-דרום, ולכן מתחתיו השדה שלו אופקי ומצביע מזרחה או מערבה (לפי כיוון הזרם), ניצב לשדה של כדור הארץ. המחט מצביעה בכיוון השקול, בזווית $\theta$ מהצפון, עם $\tan\theta = \dfrac{B}{B_E} = \dfrac{2\cdot10^{-5}}{3.2\cdot10^{-5}} = 0.625$.
      - kind: substitution
        text: >-
          $\theta \approx 32^\circ$. השדה של קו חשמל כזה, על הקרקע, דומה בגודלו לשדה של כדור הארץ.
      - kind: result
        text: >-
          א. $2000\,\text{A}$.

          ב. $19.8\,\Omega$; כ-$79\,\text{MW}$ (8%).

          ג. $2\cdot10^{-5}\,\text{T}$.

          ד. כ-$32^\circ$.
