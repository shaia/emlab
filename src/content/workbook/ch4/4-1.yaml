# Workbook, lesson 4.1 (magnets and field lines). Format and rules: see .claude/CLAUDE.md, "Worked examples, workbook".
# Every number was recomputed with src/physics/magnets.ts (deflectionFromNorth, sumOfTwo) and MU0 from
# constants.ts, with one-off npx tsx scripts.
# In a >- block, consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '4.1'
practice:
  - id: W-4.1-01
    level: basic
    qualitative: true
    objectives: [OBJ-4.1-1]
    prompt: >-
      מגנט מוט מונח כך שהקוטב הצפוני שלו בצד ימין. חותכים אותו לשלוש חתיכות שוות, ומשאירים אותן בשורה, באותו סדר, עם רווח קטן ביניהן.

      א. סמנו את הקטבים של כל אחת משלוש החתיכות (משמאל לימין).

      ב. מקרבים את שתי החתיכות הימניות זו לזו, בלי להפוך אותן. האם הן יימשכו או יידחו?

      ג. מסובבים את החתיכה האמצעית בחצי סיבוב ומחזירים אותה למקומה. מה יקרה עכשיו בכל אחד משני הרווחים?
    answer: >-
      א. בכל חתיכה S משמאל ו-N מימין.

      ב. יימשכו: N של האמצעית מול S של הימנית.

      ג. בשני הרווחים קטבים שווים זה מול זה (S מול S משמאל, N מול N מימין), והחתיכות יידחו.
    solution:
      - kind: given
        text: >-
          מגנט מוט, הקוטב הצפוני מימין, חתוך לשלוש חתיכות שוות.
      - kind: reasoning
        text: >-
          א. כל חתיכה של מגנט היא מגנט שלם, עם קוטב צפוני וקוטב דרומי. החתיכות שומרות על הכיוון של המגנט המקורי, ולכן בכל אחת מהן הקוטב הצפוני מימין והדרומי משמאל. במקומות החיתוך נוצרו קטבים חדשים: בכל רווח N של החתיכה השמאלית מול S של החתיכה הימנית.
      - kind: reasoning
        text: >-
          ב. הקוטב הצפוני של האמצעית פונה אל הקוטב הדרומי של הימנית. קטבים שונים מושכים.
      - kind: reasoning
        text: >-
          ג. אחרי חצי סיבוב, באמצעית הקוטב הצפוני משמאל והדרומי מימין. ברווח השמאלי N של השמאלית מול N של האמצעית, וברווח הימני S של האמצעית מול S של הימנית. קטבים שווים דוחים.
      - kind: result
        text: >-
          א. S משמאל ו-N מימין בכל חתיכה.

          ב. נמשכות.

          ג. נדחות בשני הרווחים.

  - id: W-4.1-02
    level: basic
    qualitative: false
    objectives: [OBJ-4.1-2]
    prompt: >-
      ארבעה שדות מגנטיים: מכשיר MRI, $1.5\,\text{T}$; ליד פני מגנט ניאודימיום, $0.4\,\text{T}$; ליד מגנט של מקרר, $5\,\text{mT}$; השדה של כדור הארץ, $45\,\mu\text{T}$.

      א. כתבו את כל הארבעה בטסלה, בכתיב של חזקות של 10.

      ב. פי כמה השדה של מכשיר ה-MRI חזק מהשדה של כדור הארץ?

      ג. פי כמה השדה ליד מגנט המקרר חזק מהשדה של כדור הארץ? פי כמה השדה של מגנט הניאודימיום חזק ממנו?
    answer: >-
      א. $1.5\,\text{T}$, $4\cdot10^{-1}\,\text{T}$, $5\cdot10^{-3}\,\text{T}$, $4.5\cdot10^{-5}\,\text{T}$.

      ב. בערך פי $3.3\cdot10^{4}$.

      ג. בערך פי 110 מהשדה של כדור הארץ; הניאודימיום חזק ממנו פי 80.
    solution:
      - kind: given
        text: >-
          $1\,\text{mT} = 10^{-3}\,\text{T}$, $1\,\mu\text{T} = 10^{-6}\,\text{T}$.
      - kind: substitution
        text: >-
          א. $0.4\,\text{T} = 4\cdot10^{-1}\,\text{T}$; $5\,\text{mT} = 5\cdot10^{-3}\,\text{T}$; $45\,\mu\text{T} = 45\cdot10^{-6}\,\text{T} = 4.5\cdot10^{-5}\,\text{T}$.
      - kind: substitution
        text: >-
          ב. $\dfrac{1.5}{4.5\cdot10^{-5}} \approx 3.3\cdot10^{4}$.
      - kind: substitution
        text: >-
          ג. $\dfrac{5\cdot10^{-3}}{4.5\cdot10^{-5}} \approx 111$, ו-$\dfrac{0.4}{5\cdot10^{-3}} = 80$.
      - kind: result
        text: >-
          א. $1.5\,\text{T}$, $4\cdot10^{-1}\,\text{T}$, $5\cdot10^{-3}\,\text{T}$, $4.5\cdot10^{-5}\,\text{T}$.

          ב. בערך פי $33{,}000$.

          ג. בערך פי 110; פי 80.

  - id: W-4.1-03
    level: basic
    qualitative: true
    objectives: [OBJ-4.1-2]
    prompt: >-
      בציור של קווי שדה מגנטי באזור מסוים, כל הקווים מצביעים בערך למעלה. בצד שמאל של הציור הקווים צפופים, ובצד ימין הם רחוקים זה מזה. הנקודה L נמצאת בצד שמאל, והנקודה R בצד ימין, בין שני קווים.

      א. באיזו נקודה השדה חזק יותר?

      ב. לאן יצביע הקוטב הצפוני של מצפן שמונח ב-R?

      ג. תלמיד טוען: "ב-R אין שדה, כי אף קו לא עובר שם." מה הייתם עונים לו?

      ד. האם שני קווים בציור יכולים להיחתך? נמקו.
    answer: >-
      א. ב-L.

      ב. למעלה, כמו הקווים הסמוכים.

      ג. השדה קיים בכל נקודה; הקווים הם רק מדגם שבחרו לצייר.

      ד. לא: בנקודת חיתוך היו לשדה שני כיוונים.
    solution:
      - kind: reasoning
        text: >-
          א. צפיפות הקווים מראה את עוצמת השדה. הקווים צפופים יותר בצד שמאל, ולכן השדה ב-L חזק יותר.
      - kind: reasoning
        text: >-
          ב. השדה משיק לקווים, וכיוונו משתנה בהדרגה מקו לקו. שני הקווים שמשני הצדדים של R מצביעים למעלה, ולכן גם ב-R השדה מצביע למעלה, והקוטב הצפוני של המחט מצביע לכיוון השדה.
      - kind: reasoning
        text: >-
          ג. אפשר היה לצייר קו גם דרך R; בוחרים לצייר רק חלק מהקווים כדי שהציור יהיה קריא. מצפן שמונח ב-R מתיישר בדיוק כמו מצפן שעל קו.
      - kind: reasoning
        text: >-
          ד. הקו בכל נקודה מראה את כיוון השדה שם. בנקודה שבה שני קווים נחתכים היו לשדה שני כיוונים שונים, והמחט לא הייתה יכולה להצביע לשניהם. לשדה יש כיוון אחד בכל נקודה, ולכן קווים לא נחתכים.
      - kind: result
        text: >-
          א. ב-L. ב. למעלה. ג. השדה קיים גם בין הקווים. ד. לא.

  - id: W-4.1-04
    level: mid
    qualitative: true
    objectives: [OBJ-4.1-1]
    prompt: >-
      מגנט מושך אטב פלדה ומטבע ניקל, אבל לא נייר אלומיניום ולא מטבע נחושת. תלמידה מסבירה: "הקוטב הצפוני של המגנט טעון חיובית. האטב והמטבע טעונים שלילית, ולכן הם נמשכים."

      א. תארו ניסוי עם מחט מצפן שמראה שקוטב של מגנט אינו מטען חשמלי.

      ב. תארו ניסוי עם מוט פלסטיק טעון שמראה את אותו דבר מהכיוון השני.

      ג. אם ההסבר שלה היה נכון, מה היה צריך לקרות כשמקרבים את הקוטב הדרומי של המגנט לאטב? מה קורה באמת?
    answer: >-
      א. קוטב אחד של מגנט מושך קצה אחד של המחט ודוחה את השני.

      ב. מוט טעון מושך את שני הקצוות של המחט, ומושך גם נייר אלומיניום.

      ג. הקוטב הדרומי ("שלילי") היה צריך לדחות את האטב; באמת גם הוא מושך אותו.
    solution:
      - kind: reasoning
        text: >-
          א. מקרבים את הקוטב הצפוני של המגנט לשני הקצוות של מחט מצפן, בזה אחר זה. קצה אחד נמשך והשני נדחה. גוף טעון היה מושך את המחט כולה, בלי להבחין בין קצותיה.
      - kind: reasoning
        text: >-
          ב. מקרבים מוט פלסטיק טעון לכל אחד מהקצוות של המחט: שניהם נמשכים, בגלל קיטוב (שיעור 1.2). מוט טעון מושך גם פיסות נייר ונייר אלומיניום, שהמגנט לא מושך. הכוח החשמלי והכוח המגנטי מתנהגים אחרת.
      - kind: reasoning
        text: >-
          ג. לפי ההסבר, הקוטב הדרומי "שלילי", והאטב "שלילי", ולכן הם היו צריכים לדחות זה את זה. בפועל כל אחד מהקטבים מושך את האטב: האטב אינו מגנט, והוא נמשך לכל קוטב.
      - kind: result
        text: >-
          קטבים אינם מטענים: קוטב מבחין בין קצות המחט, מוט טעון לא; ושני הקטבים מושכים את האטב.

  - id: W-4.1-05
    level: mid
    qualitative: false
    objectives: [OBJ-4.1-3]
    prompt: >-
      במקום מסוים מודדים את שני הרכיבים של השדה של כדור הארץ: הרכיב האופקי $2.0\cdot10^{-5}\,\text{T}$ צפונה, והרכיב האנכי $4.5\cdot10^{-5}\,\text{T}$ למטה.

      א. מה גודל השדה כולו?

      ב. מה זווית הנטייה?

      ג. האם המקום קרוב יותר לקו המשווה המגנטי מישראל, או רחוק ממנו? נמקו.
    answer: >-
      א. כ-$4.9\cdot10^{-5}\,\text{T}$.

      ב. כ-$66^\circ$.

      ג. רחוק יותר: זווית הנטייה גדולה מ-$44^\circ$, כלומר המקום קרוב יותר לקוטב מגנטי.
    solution:
      - kind: given
        text: >-
          $B_h = 2.0\cdot10^{-5}\,\text{T}$, $B_v = 4.5\cdot10^{-5}\,\text{T}$.
      - kind: formula
        text: >-
          $B_h$ ו-$B_v$ ניצבים, ולכן $B = \sqrt{B_h^2 + B_v^2}$. מ-$B_h = B\cos\delta$ ו-$B_v = B\sin\delta$, חילוק השני בראשון נותן $\tan\delta = \dfrac{B_v}{B_h}$.
      - kind: substitution
        text: >-
          א. $B = \sqrt{2.0^2 + 4.5^2}\cdot10^{-5} \approx 4.9\cdot10^{-5}\,\text{T}$.

          ב. $\tan\delta = \dfrac{4.5}{2.0} = 2.25$, ולכן $\delta \approx 66^\circ$.
      - kind: reasoning
        text: >-
          ג. זווית הנטייה אפס בקו המשווה המגנטי ו-$90^\circ$ בקטבים המגנטיים. בישראל היא כ-$44^\circ$, וכאן $66^\circ$: המקום קרוב יותר לקוטב מגנטי, ורחוק יותר מקו המשווה.
      - kind: result
        text: >-
          א. $4.9\cdot10^{-5}\,\text{T}$. ב. $66^\circ$. ג. רחוק יותר מקו המשווה המגנטי.

  - id: W-4.1-06
    level: mid
    qualitative: false
    objectives: [OBJ-4.1-4]
    prompt: >-
      הרכיב האופקי של השדה של כדור הארץ הוא $3.2\cdot10^{-5}\,\text{T}$ צפונה. מגנט שמונח בקרבת מצפן יוצר במקום המצפן שדה של $2.0\cdot10^{-5}\,\text{T}$, שמצביע לצפון-מזרח, $45^\circ$ בין צפון למזרח.

      א. מה הרכיב של השדה השקול צפונה, ומה הרכיב שלו מזרחה?

      ב. מה גודל השדה השקול?

      ג. בכמה מעלות, ולאיזה צד, סוטה המחט מהצפון? למה אי אפשר כאן להשתמש ב-$\tan\theta = B_m/B_E$ עם $B_m = 2.0\cdot10^{-5}\,\text{T}$?
    answer: >-
      א. צפונה כ-$4.6\cdot10^{-5}\,\text{T}$, מזרחה כ-$1.4\cdot10^{-5}\,\text{T}$.

      ב. כ-$4.8\cdot10^{-5}\,\text{T}$.

      ג. כ-$17^\circ$ מזרחה; השדות אינם ניצבים.
    solution:
      - kind: given
        text: >-
          $B_E = 3.2\cdot10^{-5}\,\text{T}$ צפונה; $B_m = 2.0\cdot10^{-5}\,\text{T}$ בזווית $45^\circ$ מהצפון לכיוון מזרח.
      - kind: formula
        text: >-
          מפרקים כל שדה לרכיבים צפונה ומזרחה ומחברים כל רכיב בנפרד (שיעור 0.2). הרכיבים של $B_m$: $B_m\cos45^\circ$ צפונה ו-$B_m\sin45^\circ$ מזרחה.
      - kind: substitution
        text: >-
          א. $B_m\cos45^\circ = B_m\sin45^\circ = 2.0\cdot10^{-5}\cdot0.707 \approx 1.41\cdot10^{-5}\,\text{T}$. צפונה: $3.2 + 1.41 = 4.61\cdot10^{-5}\,\text{T}$; מזרחה: $1.41\cdot10^{-5}\,\text{T}$.
      - kind: substitution
        text: >-
          ב. $B = \sqrt{4.61^2 + 1.41^2}\cdot10^{-5} \approx 4.8\cdot10^{-5}\,\text{T}$.
      - kind: substitution
        text: >-
          ג. הטנגנס של הזווית מהצפון הוא הרכיב מזרחה חלקי הרכיב צפונה: $\tan\theta = \dfrac{1.41}{4.61} \approx 0.31$, ו-$\theta \approx 17^\circ$ מזרחה. הנוסחה $\tan\theta = B_m/B_E$ נכונה רק כש-$B_m$ ניצב ל-$B_E$. כאן ל-$B_m$ יש גם רכיב צפונה, שמתחבר ל-$B_E$; עם הנוסחה היינו מקבלים $32^\circ$, טעות גדולה.
      - kind: result
        text: >-
          א. $4.6\cdot10^{-5}\,\text{T}$ צפונה ו-$1.4\cdot10^{-5}\,\text{T}$ מזרחה. ב. $4.8\cdot10^{-5}\,\text{T}$. ג. כ-$17^\circ$ מזרחה מהצפון.

  - id: W-4.1-07
    level: mid
    qualitative: false
    objectives: [OBJ-4.1-2, OBJ-4.1-4]
    prompt: >-
      שני מגנטים מונחים על שולחן, ומצפן מונח ביניהם. במקום המצפן מגנט A יוצר שדה של $3\,\text{mT}$ מזרחה, ומגנט B שדה של $4\,\text{mT}$ צפונה.

      א. מה גודל השדה השקול במקום המצפן?

      ב. בכמה מעלות מהמזרח, ולאיזה צד, מצביע הקוטב הצפוני של המחט?

      ג. האם צריך להתחשב כאן בשדה של כדור הארץ, $3.2\cdot10^{-5}\,\text{T}$? נמקו בחישוב.

      ד. מרחיקים את מגנט B, עד שהשדה שלו במקום המצפן יורד ל-$3\,\text{mT}$. בכמה מעלות מסתובבת המחט, ולאיזה כיוון?
    answer: >-
      א. $5\,\text{mT}$.

      ב. כ-$53^\circ$ מהמזרח לכיוון צפון.

      ג. לא: הוא קטן פי יותר מ-100, והוא משנה את הזווית בפחות מ-$0.3^\circ$.

      ד. ל-$45^\circ$: המחט מסתובבת כ-$8^\circ$ לכיוון מזרח.
    solution:
      - kind: given
        text: >-
          $B_A = 3\,\text{mT}$ מזרחה, $B_B = 4\,\text{mT}$ צפונה.
      - kind: formula
        text: >-
          השדות ניצבים: $B = \sqrt{B_A^2 + B_B^2}$, והזווית מהמזרח מקיימת $\tan\varphi = \dfrac{B_B}{B_A}$.
      - kind: substitution
        text: >-
          א. $B = \sqrt{3^2 + 4^2} = 5\,\text{mT}$.

          ב. $\tan\varphi = \dfrac{4}{3}$, ולכן $\varphi \approx 53^\circ$ מהמזרח לכיוון צפון.
      - kind: substitution
        text: >-
          ג. $\dfrac{3\cdot10^{-3}}{3.2\cdot10^{-5}} \approx 94$, כלומר כל אחד מהשדות של המגנטים חזק פי כ-100 מהשדה של כדור הארץ. אם מוסיפים אותו לרכיב הצפוני: $\tan\varphi = \dfrac{4 + 0.032}{3}$, ו-$\varphi \approx 53.3^\circ$ במקום $53.1^\circ$. ההבדל זניח.
      - kind: substitution
        text: >-
          ד. עכשיו $\tan\varphi = \dfrac{3}{3} = 1$, ו-$\varphi = 45^\circ$. המחט עברה מ-$53^\circ$ ל-$45^\circ$ מהמזרח, כלומר הסתובבה כ-$8^\circ$ לכיוון מזרח, אל השדה של A שנשאר כמו שהיה.
      - kind: result
        text: >-
          א. $5\,\text{mT}$. ב. $53^\circ$ מהמזרח לכיוון צפון. ג. לא, ההשפעה זניחה. ד. כ-$8^\circ$ לכיוון מזרח, ל-$45^\circ$.

  - id: W-4.1-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-4.1-3, OBJ-4.1-4]
    prompt: >-
      במכונית מותקן מצפן. הרמקול שבדלת מכיל מגנט, ובמקום המצפן הוא יוצר שדה אופקי של $8\cdot10^{-6}\,\text{T}$ מערבה. הרכיב האופקי של השדה של כדור הארץ הוא $3.2\cdot10^{-5}\,\text{T}$.

      א. בכמה מעלות, ולאיזה צד, סוטה המחט מהצפון האמיתי?

      ב. הנהג נוסע כך שהמחט מצביעה בדיוק לחזית המכונית, ובטוח שהוא נוסע צפונה. לאן הוא נוסע באמת?

      ג. כדי שהטעות תהיה קטנה מ-$2^\circ$, כמה לכל היותר יכול להיות השדה של הרמקול במקום המצפן?

      ד. מה משתנה אם המכונית נוסעת בצפון קנדה, שם הרכיב האופקי של השדה של כדור הארץ קטן בהרבה?
    answer: >-
      א. כ-$14^\circ$ מערבה.

      ב. כ-$14^\circ$ מערבה מהצפון.

      ג. כ-$1.1\cdot10^{-6}\,\text{T}$.

      ד. אותו שדה של הרמקול מסיט את המחט הרבה יותר: הטעות גדלה.
    solution:
      - kind: given
        text: >-
          $B_m = 8\cdot10^{-6}\,\text{T}$ מערבה, $B_E = 3.2\cdot10^{-5}\,\text{T}$ צפונה. השדות ניצבים.
      - kind: formula
        text: >-
          $\tan\theta = \dfrac{B_m}{B_E}$.
      - kind: substitution
        text: >-
          א. $\tan\theta = \dfrac{8\cdot10^{-6}}{3.2\cdot10^{-5}} = 0.25$, ולכן $\theta \approx 14^\circ$. השדה של הרמקול מצביע מערבה, ולכן המחט נוטה מערבה מהצפון.
      - kind: reasoning
        text: >-
          ב. המחט מצביעה $14^\circ$ מערבה מהצפון האמיתי. הנהג מכוון את המכונית לכיוון המחט, ולכן הוא נוסע $14^\circ$ מערבה מהצפון.
      - kind: manipulation
        text: >-
          ג. מבודדים את $B_m$: כופלים את שני האגפים של $\tan\theta = B_m/B_E$ ב-$B_E$, ומקבלים $B_m = B_E\tan\theta$. הטעות קטנה מ-$2^\circ$ כש-$B_m < B_E\tan2^\circ = 3.2\cdot10^{-5}\cdot0.0349 \approx 1.1\cdot10^{-6}\,\text{T}$, פחות מפי 7 מהשדה הנוכחי.
      - kind: reasoning
        text: >-
          ד. $\tan\theta = B_m/B_E$: כש-$B_E$ קטן, אותו $B_m$ נותן $\tan\theta$ גדול יותר, וסטייה גדולה יותר. ליד קוטב מגנטי מצפן רגיש מאוד לכל מגנט או ברזל שבקרבתו.
      - kind: result
        text: >-
          א. $14^\circ$ מערבה. ב. $14^\circ$ מערבה מהצפון. ג. פחות מכ-$1.1\cdot10^{-6}\,\text{T}$. ד. הטעות גדלה.

  - id: W-4.1-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-4.1-2, OBJ-4.1-4]
    prompt: >-
      מגנט מוט מונח לאורך הקו צפון-דרום, והקוטב הצפוני שלו פונה צפונה. הקו מזרח-מערב שעובר דרך האמצע של המגנט ניצב לו. על הקו הזה, ממזרח למגנט, מדדו את השדה של המגנט: במרחק $10\,\text{cm}$ מהאמצע הוא $1.6\cdot10^{-4}\,\text{T}$. במרחקים האלה השדה של המגנט קטן פי 8 בכל פעם שהמרחק גדל פי 2, כלומר הוא פרופורציונלי ל-$1/d^3$. הרכיב האופקי של השדה של כדור הארץ $3.2\cdot10^{-5}\,\text{T}$.

      א. לאן מצביע השדה של המגנט על הקו הזה?

      ב. מצאו את המרחק מאמצע המגנט שבו המצפן "מתבלבל": שם השדה השקול אפס.

      ג. לאן יצביע מצפן שמונח על הקו במרחק $12\,\text{cm}$? ובמרחק $25\,\text{cm}$? חשבו את השדה השקול בכל מקרה.
    answer: >-
      א. דרומה.

      ב. כ-$17\,\text{cm}$.

      ג. ב-$12\,\text{cm}$: השקול כ-$6.1\cdot10^{-5}\,\text{T}$ דרומה, והמחט מצביעה דרומה. ב-$25\,\text{cm}$: כ-$2.2\cdot10^{-5}\,\text{T}$ צפונה, והמחט מצביעה צפונה.
    solution:
      - kind: given
        text: >-
          $B(10\,\text{cm}) = 1.6\cdot10^{-4}\,\text{T}$, $B \propto 1/d^3$, $B_E = 3.2\cdot10^{-5}\,\text{T}$ צפונה.
      - kind: reasoning
        text: >-
          א. מול האמצע של המגנט, קווי השדה הולכים לאורך המגנט מהקוטב הצפוני אל הדרומי. הקוטב הצפוני בצפון, ולכן השדה של המגנט על הקו הזה מצביע דרומה, נגד $B_E$.
      - kind: formula
        text: >-
          השדות מנוגדים, ולכן השקול אפס כש-$B_m = B_E$. מ-$B \propto 1/d^3$: $B(d) = B(10\,\text{cm})\cdot\left(\dfrac{10\,\text{cm}}{d}\right)^3$.
      - kind: manipulation
        text: >-
          ב. $1.6\cdot10^{-4}\cdot\left(\dfrac{10}{d}\right)^3 = 3.2\cdot10^{-5}$. מחלקים את שני האגפים ב-$1.6\cdot10^{-4}$: $\left(\dfrac{10}{d}\right)^3 = 0.2$. מוציאים שורש שלישי: $\dfrac{10}{d} = \sqrt[3]{0.2} \approx 0.585$, ולכן $d \approx \dfrac{10}{0.585} \approx 17\,\text{cm}$.
      - kind: substitution
        text: >-
          ג. ב-$12\,\text{cm}$: $B_m = 1.6\cdot10^{-4}\cdot\left(\dfrac{10}{12}\right)^3 \approx 9.3\cdot10^{-5}\,\text{T}$ דרומה, יותר מ-$B_E$; השקול $9.26 - 3.2 \approx 6.1\cdot10^{-5}\,\text{T}$ דרומה. ב-$25\,\text{cm}$: $B_m = 1.6\cdot10^{-4}\cdot0.4^3 \approx 1.0\cdot10^{-5}\,\text{T}$ דרומה, פחות מ-$B_E$; השקול $3.2 - 1.02 \approx 2.2\cdot10^{-5}\,\text{T}$ צפונה.
      - kind: result
        text: >-
          א. דרומה. ב. כ-$17\,\text{cm}$ ממזרח לאמצע (ובאותו מרחק ממערב). ג. ב-$12\,\text{cm}$ המחט מצביעה דרומה ($6.1\cdot10^{-5}\,\text{T}$); ב-$25\,\text{cm}$ צפונה ($2.2\cdot10^{-5}\,\text{T}$).

  - id: W-4.1-10
    level: bagrut
    qualitative: true
    objectives: [OBJ-4.1-1, OBJ-4.1-2, OBJ-4.1-3]
    prompt: >-
      תלמיד כותב בעבודה: "הקוטב הצפוני של המצפן פונה אל הקוטב הצפוני של כדור הארץ, ולכן ליד הקוטב הצפוני יש קוטב צפוני מגנטי. קווי השדה של כדור הארץ מתחילים שם ונגמרים ליד הקוטב הדרומי."

      א. מצאו את שתי הטעויות בדבריו, ותקנו אותן.

      ב. תארו במילים את קווי השדה של כדור הארץ: איפה הם יוצאים מהאדמה, איפה הם נכנסים אליה, ומה הם עושים בתוך כדור הארץ.

      ג. איפה על פני כדור הארץ הקווים אופקיים, ואיפה הם אנכיים? מה יעשה שם מצפן רגיל?

      ד. התלמיד שואל: "אם כדור הארץ הוא מגנט, למה מגנט שמונח על השולחן לא נמשך כולו צפונה, אלא רק מסתובב?" רמז: שני הקטבים של המגנט נמצאים כמעט באותו מקום בשדה של כדור הארץ.
    answer: >-
      א. שם יש קוטב דרומי מגנטי; ולקווים אין התחלה וסוף: הם סגורים.

      ב. יוצאים ליד הדרום הגאוגרפי, נכנסים ליד הצפון הגאוגרפי, וממשיכים בתוך כדור הארץ מצפון לדרום.

      ג. אופקיים בקו המשווה המגנטי (המצפן עובד היטב), כמעט אנכיים ליד הקטבים המגנטיים (המצפן כמעט לא מראה כיוון).

      ד. השדה כמעט אחיד על השולחן, ולכן על שני הקטבים פועלים כוחות שווים ומנוגדים: הם מסובבים אבל לא מזיזים.
    solution:
      - kind: reasoning
        text: >-
          א. טעות ראשונה: קטבים שונים מושכים. הקוטב הצפוני של המחט נמשך לקוטב דרומי, ולכן ליד הקוטב הצפוני הגאוגרפי יש קוטב **דרומי** מגנטי. טעות שנייה: קווי שדה מגנטי אינם מתחילים ואינם נגמרים. הם סגורים, וממשיכים בתוך המקור.
      - kind: reasoning
        text: >-
          ב. מחוץ למגנט הקווים יוצאים מהקוטב הצפוני המגנטי ונכנסים לדרומי. הקוטב הצפוני המגנטי של כדור הארץ נמצא ליד הדרום הגאוגרפי, ולכן הקווים יוצאים מהאדמה בחצי הדרומי, עוברים מעל פני האדמה צפונה, ונכנסים אליה בחצי הצפוני. בתוך כדור הארץ הם חוזרים מצפון לדרום וכך נסגרים.
      - kind: reasoning
        text: >-
          ג. בקו המשווה המגנטי הקווים מקבילים לפני האדמה, זווית הנטייה אפס, וכל השדה אופקי: מצפן רגיל מרגיש את כולו. ליד הקטבים המגנטיים הקווים נכנסים לאדמה או יוצאים ממנה כמעט אנכית; הרכיב האופקי קטן מאוד, ומצפן רגיל כמעט לא מראה כיוון.
      - kind: reasoning
        text: >-
          ד. על השולחן השדה של כדור הארץ כמעט אחיד: אותו גודל ואותו כיוון בשני הקטבים של המגנט. הקוטב הצפוני נמשך צפונה והדרומי דרומה בכוחות שווים, ולכן הכוח השקול כמעט אפס. אבל שני הכוחות לא פועלים על אותו קו, והם מסובבים את המגנט עד שהוא מתיישר לאורך השדה, כמו מחט מצפן.
      - kind: result
        text: >-
          א. קוטב דרומי מגנטי ליד הצפון הגאוגרפי; הקווים סגורים. ב. יוצאים בדרום, נכנסים בצפון, נסגרים בפנים. ג. אופקיים בקו המשווה המגנטי, אנכיים ליד הקטבים המגנטיים. ד. בשדה אחיד הכוחות על שני הקטבים מתבטלים, ונשאר רק סיבוב.

challenge:
  - id: W-4.1-c1
    stars: 1
    objectives: [OBJ-4.1-2, OBJ-4.1-4]
    prompt: >-
      שני מגנטים קטנים וזהים מונחים על שולחן, והמרחק בין המרכזים שלהם $10\,\text{cm}$. הנקודה P נמצאת בדיוק באמצע ביניהם. המגנט השמאלי מונח לאורך הקו שמחבר את המרכזים, והקוטב הצפוני שלו פונה ימינה, אל P. המגנט הימני ניצב לקו הזה, והקוטב הצפוני שלו פונה למעלה בדף.

      נתון: במרחק $r$ ממגנט קטן, על הקו שעובר לאורכו, גודל השדה שלו $B = \dfrac{\mu_0}{4\pi}\cdot\dfrac{2M}{r^3}$; ועל הקו שניצב לו דרך האמצע שלו, $B = \dfrac{\mu_0}{4\pi}\cdot\dfrac{M}{r^3}$. כאן $M$ הוא מספר שמתאר את חוזק המגנט, ולשני המגנטים $M = 3\sqrt5\,\text{A}\cdot\text{m}^2$.

      א. מה הכיוון ומה הגודל של השדה של כל אחד מהמגנטים ב-P?

      ב. מה גודל השדה השקול ב-P?

      ג. לאן יצביע הקוטב הצפוני של מצפן שמונח ב-P? תנו את הזווית ביחס לקו שמחבר את המרכזים.

      ד. האם השדה של כדור הארץ משנה כאן משהו? נמקו.
    answer: >-
      א. של השמאלי: כ-$10.7\,\text{mT}$ ימינה; של הימני: כ-$5.4\,\text{mT}$ למטה בדף.

      ב. $12\,\text{mT}$.

      ג. ימינה ולמטה, כ-$27^\circ$ מתחת לקו שמחבר את המרכזים.

      ד. כמעט לא: הוא קטן פי כ-400.
    solution:
      - kind: given
        text: >-
          $r = 5\,\text{cm} = 0.05\,\text{m}$ מכל מגנט, $M = 3\sqrt5\,\text{A}\cdot\text{m}^2$, $\dfrac{\mu_0}{4\pi} = 10^{-7}\,\text{T}\cdot\text{m/A}$.
      - kind: reasoning
        text: >-
          כיוונים: P נמצאת על הקו שעובר לאורך המגנט השמאלי, מימין לקוטב הצפוני שלו, ושם השדה מצביע הרחק מהקוטב הצפוני: ימינה. P נמצאת על הקו שניצב למגנט הימני דרך האמצע שלו; שם הקווים הולכים לאורך המגנט מהקוטב הצפוני (למעלה) אל הדרומי (למטה), ולכן השדה מצביע למטה בדף.
      - kind: substitution
        text: >-
          א. $B_1 = 10^{-7}\cdot\dfrac{2\cdot3\sqrt5}{0.05^3} = 4.8\sqrt5\cdot10^{-3} \approx 1.07\cdot10^{-2}\,\text{T}$ ימינה. $B_2 = 10^{-7}\cdot\dfrac{3\sqrt5}{0.05^3} = 2.4\sqrt5\cdot10^{-3} \approx 5.4\cdot10^{-3}\,\text{T}$ למטה.
      - kind: substitution
        text: >-
          ב. השדות ניצבים: $B = \sqrt{B_1^2 + B_2^2} = \sqrt{(4.8\sqrt5)^2 + (2.4\sqrt5)^2}\cdot10^{-3} = \sqrt{115.2 + 28.8}\cdot10^{-3} = \sqrt{144}\cdot10^{-3} = 1.2\cdot10^{-2}\,\text{T}$.
      - kind: substitution
        text: >-
          ג. הזווית מתחת לקו המרכזים: $\tan\varphi = \dfrac{B_2}{B_1} = \dfrac{2.4\sqrt5}{4.8\sqrt5} = 0.5$, ולכן $\varphi \approx 27^\circ$.
      - kind: reasoning
        text: >-
          ד. $\dfrac{1.2\cdot10^{-2}}{3.2\cdot10^{-5}} \approx 375$. השדה של כדור הארץ משנה את הכיוון של השקול לכל היותר בכ-$0.15^\circ$, והוא זניח.
      - kind: result
        text: >-
          א. $1.07\cdot10^{-2}\,\text{T}$ ימינה ו-$5.4\cdot10^{-3}\,\text{T}$ למטה. ב. $12\,\text{mT}$. ג. ימינה ולמטה, כ-$27^\circ$ מתחת לקו המרכזים. ד. זניח.
    source:
      name: JEE Main (NTA)
      year: 2026
      problem: '4 April 2026, Shift 2, Physics, Question 23'
      url: https://cracku.in/23-two-identical-small-bar-magnets-each-of-dipole-mom-x-nta-jee-mains-4-april-2026-shift-2-physics
      verified: '2026-11-02'
      adapted: true

  - id: W-4.1-c2
    stars: 1
    objectives: [OBJ-4.1-3]
    prompt: >-
      מחט מגנטית מסתובבת על ציר אופקי, ולכן היא נעה רק במישור אנכי אחד, ויכולה לנטות למטה אל האדמה. כשהמישור הזה הוא המישור צפון-דרום, המחט מראה את זווית הנטייה האמיתית $\delta$. מסובבים את המישור כולו סביב קו אנכי, כך שהוא יוצר זווית $\alpha$ עם הכיוון צפון-דרום. במישור החדש המחט מרגישה את כל הרכיב האנכי $B_v$, אבל מהרכיב האופקי $B_h$ היא מרגישה רק את החלק שנמצא במישור שלה, $B_h\cos\alpha$. לכן היא נוטה בזווית אחרת, $\delta'$, "זווית הנטייה הנראית".

      א. הראו ש-$\tan\delta' = \dfrac{\tan\delta}{\cos\alpha}$.

      ב. במישור שיוצר $30^\circ$ עם הכיוון צפון-דרום, המחט נוטה $45^\circ$. מה זווית הנטייה האמיתית?

      ג. מסובבים את המישור עוד $90^\circ$, כך שהוא יוצר $60^\circ$ עם הכיוון צפון-דרום. באיזו זווית תנטה המחט עכשיו?

      ד. באיזה מישור אנכי המחט עומדת אנכית לגמרי, בכל מקום שבו $B_v \ne 0$? נמקו.
    answer: >-
      א. $\tan\delta' = \dfrac{B_v}{B_h\cos\alpha}$, ו-$\dfrac{B_v}{B_h} = \tan\delta$.

      ב. כ-$41^\circ$.

      ג. $60^\circ$.

      ד. במישור מזרח-מערב ($\alpha = 90^\circ$): שם המחט לא מרגישה רכיב אופקי כלל.
    solution:
      - kind: given
        text: >-
          במישור האמיתי, $\tan\delta = \dfrac{B_v}{B_h}$. במישור שבזווית $\alpha$, הרכיב האנכי שמשפיע על המחט הוא $B_v$, והרכיב האופקי שבמישור הוא $B_h\cos\alpha$.
      - kind: manipulation
        text: >-
          א. המחט מתיישרת לאורך השדה שהיא מרגישה, ולכן $\tan\delta' = \dfrac{B_v}{B_h\cos\alpha} = \dfrac{1}{\cos\alpha}\cdot\dfrac{B_v}{B_h} = \dfrac{\tan\delta}{\cos\alpha}$.
      - kind: manipulation
        text: >-
          ב. כופלים את שני האגפים ב-$\cos\alpha$ כדי לבודד את $\tan\delta$: $\tan\delta = \tan\delta'\cos\alpha = \tan45^\circ\cdot\cos30^\circ = 1\cdot0.866 = 0.866$, ולכן $\delta \approx 40.9^\circ$.
      - kind: substitution
        text: >-
          ג. $\tan\delta'' = \dfrac{\tan\delta}{\cos60^\circ} = \dfrac{0.866}{0.5} = 1.732$, ולכן $\delta'' = 60^\circ$. בדיקה: הנטייה הנראית תמיד גדולה מהאמיתית, כי $\cos\alpha \le 1$.
      - kind: reasoning
        text: >-
          ד. ב-$\alpha = 90^\circ$, $\cos\alpha = 0$: הרכיב האופקי ניצב למישור של המחט, והיא לא מרגישה אותו. נשאר רק $B_v$, והמחט מתיישרת אנכית. כך אפשר למצוא את הכיוון מזרח-מערב בלי מצפן רגיל.
      - kind: result
        text: >-
          א. $\tan\delta' = \tan\delta/\cos\alpha$. ב. $\delta \approx 41^\circ$. ג. $60^\circ$. ד. במישור מזרח-מערב.
