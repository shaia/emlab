# Workbook, lesson 4.5 (the Lorentz force). Format and rules: see .claude/CLAUDE.md, "Worked examples, workbook".
# Every number and direction was recomputed with src/physics/magnetism.ts (lorentzForce, lorentzMagnitude,
# speedFromVoltage) and constants.ts. Directions: x right (east), y up (north), z out of the page (up).
# In a >- block, consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '4.5'
practice:
  - id: W-4.5-01
    level: basic
    qualitative: false
    objectives: [OBJ-4.5-1]
    prompt: >-
      חלקיק אלפא, שמטענו $2e$, נע במהירות $1.5\cdot10^{6}\,\text{m/s}$ בניצב לשדה מגנטי אחיד של $0.8\,\text{T}$.

      א. מה גודל הכוח המגנטי על החלקיק?

      ב. מקטינים את השדה לחצי ומכפילים את המהירות. מה גודל הכוח עכשיו?
    answer: >-
      א. $3.84\cdot10^{-13}\,\text{N}$.

      ב. אותו כוח, $3.84\cdot10^{-13}\,\text{N}$.
    solution:
      - kind: given
        text: >-
          $q = 2e = 3.2\cdot10^{-19}\,\text{C}$, $v = 1.5\cdot10^{6}\,\text{m/s}$, $B = 0.8\,\text{T}$, $\alpha = 90^\circ$.
      - kind: formula
        text: >-
          $F = qvB\sin\alpha$.
      - kind: substitution
        text: >-
          א. $F = 3.2\cdot10^{-19}\cdot1.5\cdot10^{6}\cdot0.8\cdot\sin90^\circ = 3.84\cdot10^{-13}\,\text{N}$.

          ב. $F = 3.2\cdot10^{-19}\cdot3\cdot10^{6}\cdot0.4\cdot1 = 3.84\cdot10^{-13}\,\text{N}$.
      - kind: reasoning
        text: >-
          הכוח פרופורציוני למכפלה $vB$. כפל המהירות ב-2 וחלוקת השדה ב-2 משאירים את המכפלה כמו שהייתה.
      - kind: result
        text: >-
          א. $3.84\cdot10^{-13}\,\text{N}$.

          ב. $3.84\cdot10^{-13}\,\text{N}$, ללא שינוי.

  - id: W-4.5-02
    level: basic
    qualitative: true
    objectives: [OBJ-4.5-2]
    prompt: >-
      בכל מקרה קבעו את כיוון הכוח המגנטי, או קבעו שאין כוח, ונמקו.

      א. פרוטון נע למטה, בשדה שמצביע שמאלה.

      ב. אלקטרון נע לתוך הדף (⊗), בשדה שמצביע ימינה.

      ג. פרוטון נע ימינה, בשדה שיוצא מהדף (⊙).

      ד. אלקטרון נע למעלה, בשדה שמצביע למטה.
    answer: >-
      א. לתוך הדף (⊗).

      ב. למעלה.

      ג. למטה.

      ד. אין כוח.
    solution:
      - kind: formula
        text: >-
          כלל כף יד ימין: האצבעות בכיוון השדה, האגודל בכיוון המהירות, והכוח על מטען חיובי יוצא מכף היד. על מטען שלילי הכוח הפוך. בתנועה לאורך השדה (או בכיוון הפוך לו) $\sin\alpha = 0$ ואין כוח.
      - kind: reasoning
        text: >-
          א. האצבעות שמאלה, האגודל למטה: כף היד פונה לתוך הדף. הפרוטון חיובי, ולכן הכוח ⊗.

          ב. האצבעות ימינה, האגודל לתוך הדף: כף היד פונה למטה. זה הכוח על מטען חיובי. האלקטרון שלילי, ולכן הכוח עליו למעלה.

          ג. האצבעות החוצה מהדף, האגודל ימינה: כף היד פונה למטה. הפרוטון חיובי, ולכן הכוח למטה.

          ד. המהירות (למעלה) הפוכה לשדה (למטה): $\alpha = 180^\circ$, ו-$\sin180^\circ = 0$.
      - kind: result
        text: >-
          א. ⊗. ב. למעלה. ג. למטה. ד. אין כוח. בכל מקרה שיש בו כוח, הוא ניצב גם למהירות וגם לשדה.

  - id: W-4.5-03
    level: basic
    qualitative: false
    objectives: [OBJ-4.5-4]
    prompt: >-
      כדי למדוד שדה מגנטי, יורים אלקטרון במהירות $8\cdot10^{6}\,\text{m/s}$ בכיוון שבו הכוח עליו הגדול ביותר, ומודדים כוח של $2.56\cdot10^{-15}\,\text{N}$.

      א. מה הזווית בין המהירות לשדה? מה עוצמת השדה?

      ב. הראו שהיחידה $\text{N}\cdot\text{s}/(\text{C}\cdot\text{m})$ שווה ל-$\text{N}/(\text{A}\cdot\text{m})$.

      ג. פי כמה השדה הזה גדול מהרכיב האופקי של השדה של כדור הארץ, $3\cdot10^{-5}\,\text{T}$?
    answer: >-
      א. $90^\circ$; $B = 2\cdot10^{-3}\,\text{T} = 2\,\text{mT}$.

      ב. $\text{C/s} = \text{A}$, ולכן $\dfrac{\text{N}\cdot\text{s}}{\text{C}\cdot\text{m}} = \dfrac{\text{N}}{(\text{C/s})\cdot\text{m}} = \dfrac{\text{N}}{\text{A}\cdot\text{m}}$.

      ג. בערך פי 67.
    solution:
      - kind: given
        text: >-
          $q = 1.6\cdot10^{-19}\,\text{C}$ (גודל המטען), $v = 8\cdot10^{6}\,\text{m/s}$, $F = 2.56\cdot10^{-15}\,\text{N}$, והכוח הגדול ביותר.
      - kind: reasoning
        text: >-
          א. $F = qvB\sin\alpha$ גדול ביותר כש-$\sin\alpha = 1$, כלומר $\alpha = 90^\circ$. אז $F = qvB$, וזו בדיוק ההגדרה של $B$.
      - kind: formula
        text: >-
          $B = \dfrac{F}{qv}$.
      - kind: substitution
        text: >-
          א. $B = \dfrac{2.56\cdot10^{-15}}{1.6\cdot10^{-19}\cdot8\cdot10^{6}} = 2\cdot10^{-3}\,\text{T}$.

          ג. $\dfrac{2\cdot10^{-3}}{3\cdot10^{-5}} \approx 67$.
      - kind: manipulation
        text: >-
          ב. מחלקים את המונה ואת המכנה ב-$\text{s}$: $\dfrac{\text{N}\cdot\text{s}}{\text{C}\cdot\text{m}} = \dfrac{\text{N}}{(\text{C}/\text{s})\cdot\text{m}}$. קולון לשנייה הוא אמפר (שיעור 3.2), ולכן זה $\dfrac{\text{N}}{\text{A}\cdot\text{m}}$.
      - kind: result
        text: >-
          א. $\alpha = 90^\circ$, $B = 2\,\text{mT}$.

          ב. $1\,\text{T} = 1\,\text{N}\cdot\text{s}/(\text{C}\cdot\text{m}) = 1\,\text{N}/(\text{A}\cdot\text{m})$.

          ג. בערך פי 67.

  - id: W-4.5-04
    level: mid
    qualitative: false
    objectives: [OBJ-4.5-1]
    prompt: >-
      פרוטון נע בגודל מהירות קבוע בשדה מגנטי אחיד, ומשנים רק את כיוון התנועה שלו. כשהפרוטון נע בניצב לשדה, הכוח עליו $6\cdot10^{-14}\,\text{N}$.

      א. מה הכוח עליו כשהזווית בין המהירות לשדה היא $30^\circ$? $150^\circ$? $180^\circ$?

      ב. באילו זוויות הכוח עליו $5.2\cdot10^{-14}\,\text{N}$?
    answer: >-
      א. $3\cdot10^{-14}\,\text{N}$, $3\cdot10^{-14}\,\text{N}$, אפס.

      ב. בערך $60^\circ$ ו-$120^\circ$.
    solution:
      - kind: given
        text: >-
          הכוח בתנועה ניצבת הוא $F_{\max} = qvB = 6\cdot10^{-14}\,\text{N}$.
      - kind: formula
        text: >-
          $F = qvB\sin\alpha = F_{\max}\sin\alpha$.
      - kind: substitution
        text: >-
          א. $F(30^\circ) = 6\cdot10^{-14}\cdot0.5 = 3\cdot10^{-14}\,\text{N}$. $F(150^\circ) = 6\cdot10^{-14}\cdot\sin150^\circ = 6\cdot10^{-14}\cdot0.5 = 3\cdot10^{-14}\,\text{N}$. $F(180^\circ) = 0$, כי הפרוטון נע הפוך לשדה, לאורך הקו שלו.
      - kind: manipulation
        text: >-
          ב. מחלקים את $F = F_{\max}\sin\alpha$ ב-$F_{\max}$: $\sin\alpha = \dfrac{F}{F_{\max}} = \dfrac{5.2\cdot10^{-14}}{6\cdot10^{-14}} \approx 0.867$. בין $0^\circ$ ל-$180^\circ$ יש שתי זוויות עם הסינוס הזה: $\alpha \approx 60^\circ$, ו-$180^\circ - 60^\circ = 120^\circ$.
      - kind: result
        text: >-
          א. $3\cdot10^{-14}\,\text{N}$ ב-$30^\circ$ וגם ב-$150^\circ$, ואפס ב-$180^\circ$.

          ב. $\alpha \approx 60^\circ$ או $\alpha \approx 120^\circ$.

  - id: W-4.5-05
    level: mid
    qualitative: true
    objectives: [OBJ-4.5-3]
    prompt: >-
      תלמיד מציע לבנות מאיץ חלקיקים פשוט: אזור גדול עם שדה מגנטי חזק ואחיד, שבו פרוטונים "יקבלו תאוצה" ויגיעו למהירויות גבוהות.

      א. קבעו ונמקו: האם השדה המגנטי יכול להגדיל את גודל המהירות של הפרוטונים?

      ב. פרוטון נכנס לאזור עם אנרגיה קינטית של $2000\,\text{eV}$, ויוצא ממנו אחרי זמן מה בכיוון אחר. מה האנרגיה הקינטית שלו ביציאה?

      ג. אם השדה המגנטי לא מאיץ, מה הוא כן יכול לעשות לפרוטונים במאיץ?
    answer: >-
      א. לא: הכוח המגנטי ניצב למהירות ולא עושה עבודה.

      ב. $2000\,\text{eV}$, כמו בכניסה.

      ג. לשנות את כיוון התנועה שלהם: לכוון ולעקם את הקרן.
    solution:
      - kind: reasoning
        text: >-
          א. הכוח המגנטי על מטען נע ניצב למהירות שלו בכל רגע. כוח כזה לא עושה עבודה (שיעור 2.1), ולכן לא משנה את האנרגיה הקינטית ואת גודל המהירות. התאוצה שהוא נותן היא שינוי של **כיוון** המהירות בלבד.
      - kind: reasoning
        text: >-
          ב. העבודה של הכוח המגנטי אפס לאורך כל המסלול, יהיה ארוך ככל שיהיה, ואין כוחות אחרים. לכן האנרגיה הקינטית ביציאה שווה לאנרגיה בכניסה.
      - kind: reasoning
        text: >-
          ג. השדה המגנטי מעקם את מסלול הפרוטונים, ולכן הוא משמש לכוון את הקרן ולהחזיק אותה במסלול הרצוי. את ההאצה עצמה עושה שדה חשמלי, שיכול לעשות עבודה.
      - kind: result
        text: >-
          א. לא. ב. $2000\,\text{eV}$. ג. לכוון את הקרן ולעקם אותה; את ההאצה צריך לעשות שדה חשמלי.

  - id: W-4.5-06
    level: mid
    qualitative: true
    objectives: [OBJ-4.5-2]
    prompt: >-
      חלקיק טעון שסימן המטען שלו לא ידוע נכנס, כשהוא נע ימינה, לאזור של שדה מגנטי אחיד שנכנס לדף (⊗). המסלול שלו מתחיל להתעקם **למטה**.

      א. קבעו ונמקו: מה סימן המטען של החלקיק?

      ב. הופכים את כיוון השדה, כך שיצא מהדף (⊙), ושולחים את אותו חלקיק באותה מהירות. לאיזה צד יתעקם המסלול?

      ג. ומה יקרה לנייטרון, חלקיק בלי מטען, שנשלח באותה מהירות לשדה של סעיף א?
    answer: >-
      א. שלילי.

      ב. למעלה.

      ג. הוא ימשיך ישר: אין עליו כוח מגנטי.
    solution:
      - kind: reasoning
        text: >-
          א. נבדוק מה היה קורה למטען חיובי: בכלל כף יד ימין, האצבעות לתוך הדף (השדה) והאגודל ימינה (המהירות), וכף היד פונה למעלה. מטען חיובי היה מתעקם למעלה. החלקיק מתעקם למטה, כלומר הכוח עליו הפוך, ולכן המטען שלו שלילי.
      - kind: reasoning
        text: >-
          ב. היפוך השדה הופך את הכוח: על מטען חיובי הכוח היה עכשיו למטה, ועל החלקיק השלילי הוא למעלה.
      - kind: reasoning
        text: >-
          ג. $F = qvB\sin\alpha$ עם $q = 0$ נותן אפס. בלי כוח הנייטרון ממשיך בקו ישר ובמהירות קבועה.
      - kind: result
        text: >-
          א. שלילי. ב. למעלה. ג. קו ישר, בלי סטייה.

  - id: W-4.5-07
    level: mid
    qualitative: false
    objectives: [OBJ-4.5-1, OBJ-4.5-3]
    prompt: >-
      פרוטון מהקרינה הקוסמית מגיע לכדור הארץ במהירות $5\cdot10^{6}\,\text{m/s}$, בניצב לשדה המגנטי של כדור הארץ במקום, שעוצמתו שם $3\cdot10^{-5}\,\text{T}$.

      א. מה גודל הכוח המגנטי על הפרוטון?

      ב. פי כמה הכוח הזה גדול ממשקל הפרוטון?

      ג. הפרוטון עובר בשדה הזה $1000\,\text{km}$. כמה עבודה עושה עליו הכוח המגנטי, ומה גודל המהירות שלו בסוף הדרך? (הניחו שאין כוחות אחרים.)
    answer: >-
      א. $2.4\cdot10^{-17}\,\text{N}$.

      ב. בערך פי $1.4\cdot10^{9}$.

      ג. אפס עבודה; המהירות נשארת $5\cdot10^{6}\,\text{m/s}$.
    solution:
      - kind: given
        text: >-
          $q = e = 1.6\cdot10^{-19}\,\text{C}$, $v = 5\cdot10^{6}\,\text{m/s}$, $B = 3\cdot10^{-5}\,\text{T}$, $\alpha = 90^\circ$, $m_p = 1.67\cdot10^{-27}\,\text{kg}$, $g = 10\,\text{m/s}^2$.
      - kind: formula
        text: >-
          $F = qvB\sin\alpha$, והמשקל $m_pg$.
      - kind: substitution
        text: >-
          א. $F = 1.6\cdot10^{-19}\cdot5\cdot10^{6}\cdot3\cdot10^{-5}\cdot1 = 2.4\cdot10^{-17}\,\text{N}$.

          ב. $m_pg = 1.67\cdot10^{-27}\cdot10 = 1.67\cdot10^{-26}\,\text{N}$, והיחס $\dfrac{2.4\cdot10^{-17}}{1.67\cdot10^{-26}} \approx 1.4\cdot10^{9}$.
      - kind: reasoning
        text: >-
          ג. הכוח המגנטי ניצב למהירות בכל נקודה של המסלול, ולכן העבודה שלו אפס, בלי קשר לאורך הדרך. בלי עבודה האנרגיה הקינטית לא משתנה, וגם גודל המהירות לא. האורך $1000\,\text{km}$ לא נכנס לחישוב.
      - kind: result
        text: >-
          א. $2.4\cdot10^{-17}\,\text{N}$. ב. בערך פי $1.4\cdot10^{9}$, ולכן מותר להתעלם מהמשקל. ג. $W = 0$, והמהירות $5\cdot10^{6}\,\text{m/s}$ (רק הכיוון השתנה).

  - id: W-4.5-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-4.5-1, OBJ-4.5-3, OBJ-4.5-4]
    prompt: >-
      אלקטרון מואץ ממנוחה בין שני לוחות מקבילים שהמרחק ביניהם $1\,\text{cm}$ והמתח ביניהם $200\,\text{V}$. הוא יוצא דרך חור בלוח, ונכנס לאזור של שדה מגנטי אחיד של $1\,\text{mT}$, בניצב לשדה.

      א. מה המהירות של האלקטרון כשהוא נכנס לשדה המגנטי?

      ב. מה גודל הכוח החשמלי שפעל עליו בין הלוחות?

      ג. מה גודל הכוח המגנטי עליו בשדה המגנטי? איזה מהשניים גדול יותר, ופי כמה?

      ד. מה האנרגיה הקינטית של האלקטרון כשהוא יוצא מהשדה המגנטי? נמקו.
    answer: >-
      א. $v \approx 8.39\cdot10^{6}\,\text{m/s}$.

      ב. $3.2\cdot10^{-15}\,\text{N}$.

      ג. $1.34\cdot10^{-15}\,\text{N}$; הכוח החשמלי גדול בערך פי $2.4$.

      ד. $3.2\cdot10^{-17}\,\text{J} = 200\,\text{eV}$, כמו בכניסה.
    solution:
      - kind: given
        text: >-
          $e = 1.6\cdot10^{-19}\,\text{C}$, $m_e = 9.1\cdot10^{-31}\,\text{kg}$, $U = 200\,\text{V}$, $d = 0.01\,\text{m}$, $B = 10^{-3}\,\text{T}$.
      - kind: formula
        text: >-
          שימור אנרגיה בין הלוחות (שיעור 2.4): $eU = \tfrac12 m_ev^2$. השדה בין לוחות מקבילים (שיעור 2.6): $E = \dfrac{U}{d}$, והכוח $F_E = eE$. הכוח המגנטי $F_B = evB$.
      - kind: manipulation
        text: >-
          א. כופלים ב-2, מחלקים ב-$m_e$ ומוציאים שורש: $v = \sqrt{\dfrac{2eU}{m_e}}$.
      - kind: substitution
        text: >-
          א. $v = \sqrt{\dfrac{2\cdot1.6\cdot10^{-19}\cdot200}{9.1\cdot10^{-31}}} \approx 8.39\cdot10^{6}\,\text{m/s}$.

          ב. $E = \dfrac{200}{0.01} = 2\cdot10^{4}\,\text{V/m}$, ו-$F_E = 1.6\cdot10^{-19}\cdot2\cdot10^{4} = 3.2\cdot10^{-15}\,\text{N}$.

          ג. $F_B = 1.6\cdot10^{-19}\cdot8.39\cdot10^{6}\cdot10^{-3} \approx 1.34\cdot10^{-15}\,\text{N}$, והיחס $\dfrac{3.2\cdot10^{-15}}{1.34\cdot10^{-15}} \approx 2.4$.
      - kind: reasoning
        text: >-
          ד. בשדה המגנטי הכוח ניצב למהירות, ולכן אינו עושה עבודה, והאנרגיה הקינטית נשארת זו שהאלקטרון קיבל בין הלוחות: $eU = 1.6\cdot10^{-19}\cdot200 = 3.2\cdot10^{-17}\,\text{J}$, כלומר $200\,\text{eV}$. הכוח החשמלי, לעומתו, פעל בכיוון התנועה ועשה את כל העבודה הזאת.
      - kind: result
        text: >-
          א. $8.39\cdot10^{6}\,\text{m/s}$. ב. $3.2\cdot10^{-15}\,\text{N}$. ג. $1.34\cdot10^{-15}\,\text{N}$; הכוח החשמלי גדול בערך פי $2.4$. ד. $3.2\cdot10^{-17}\,\text{J} = 200\,\text{eV}$.

  - id: W-4.5-09
    level: bagrut
    qualitative: true
    objectives: [OBJ-4.5-3, OBJ-4.5-4]
    prompt: >-
      שני פרוטונים זהים נכנסים, כל אחד לאזור אחר, באותה מהירות ימינה. באזור הראשון שדה חשמלי אחיד כלפי מעלה, ובאזור השני שדה מגנטי אחיד שנכנס לדף (⊗). בשני האזורים הכוח על הפרוטון ברגע הכניסה פונה למעלה ושווה בגודלו.

      א. תארו את צורת המסלול של כל פרוטון בתוך האזור.

      ב. איך משתנה גודל המהירות של כל פרוטון בזמן שהוא באזור?

      ג. איך משתנה הזווית בין הכוח למהירות בכל אזור, ככל שהפרוטון מתקדם?

      ד. האם כיוון הכוח על כל פרוטון משתנה בזמן התנועה?

      ה. הציעו ניסוי פשוט אחד, עם פרוטון, שיגלה באיזה אזור יש שדה חשמלי.
    answer: >-
      א. בשדה החשמלי: פרבולה שנוטה למעלה. בשדה המגנטי: מסלול שמתעקם למעלה וממשיך להתעקם כל הזמן.

      ב. בשדה החשמלי גדל; בשדה המגנטי לא משתנה.

      ג. בשדה החשמלי הזווית קטנה מ-$90^\circ$ והולכת וקטנה; בשדה המגנטי היא נשארת $90^\circ$.

      ד. בשדה החשמלי לא (תמיד למעלה); בשדה המגנטי כן (הוא מסתובב עם המהירות).

      ה. להניח פרוטון במנוחה: רק בשדה החשמלי הוא יתחיל לזוז.
    solution:
      - kind: reasoning
        text: >-
          א. בשדה החשמלי הכוח $qE$ קבוע בגודל ובכיוון (למעלה), בניצב למהירות ההתחלתית: זו תנועה של קליע, והמסלול פרבולה (שיעור 1.10). בשדה המגנטי הכוח ניצב למהירות בכל רגע, ולכן הוא מסובב את כיוון התנועה כל זמן שהפרוטון בשדה: המסלול מתעקם למעלה ולא מפסיק להתעקם.
      - kind: reasoning
        text: >-
          ב. ג. בשדה החשמלי, אחרי הכניסה המהירות כבר נוטה למעלה, והכוח (למעלה) יוצר איתה זווית קטנה מ-$90^\circ$, שהולכת וקטנה. לכוח יש רכיב בכיוון התנועה, הוא עושה עבודה חיובית, וגודל המהירות גדל. בשדה המגנטי הזווית בין הכוח למהירות תמיד $90^\circ$, העבודה אפס, וגודל המהירות קבוע.
      - kind: reasoning
        text: >-
          ד. הכוח החשמלי תלוי רק בשדה, ולכן כיוונו קבוע. הכוח המגנטי ניצב למהירות, ולכן כשכיוון המהירות משתנה, גם כיוון הכוח משתנה, אף שגודלו $qvB$ נשאר קבוע.
      - kind: reasoning
        text: >-
          ה. מניחים פרוטון במנוחה בכל אזור. שדה מגנטי לא מפעיל כוח על מטען במנוחה, ושדה חשמלי מפעיל. האזור שבו הפרוטון מתחיל לזוז הוא האזור החשמלי.
      - kind: result
        text: >-
          חשמלי: פרבולה, המהירות גדלה, הזווית בין הכוח למהירות קטנה, כיוון הכוח קבוע. מגנטי: מסלול שמתעקם ללא הפסקה, גודל המהירות קבוע, הזווית $90^\circ$, כיוון הכוח מסתובב. פרוטון במנוחה זז רק בשדה החשמלי.

  - id: W-4.5-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-4.5-1, OBJ-4.5-2]
    prompt: >-
      פרוטון, אלקטרון וחלקיק אלפא (מטען $2e$, מסה בערך פי 4 ממסת הפרוטון) נכנסים, בזה אחר זה, לאותו שדה מגנטי אחיד של $0.5\,\text{T}$ שנכנס לדף (⊗). כל אחד נע ימינה במהירות $2\cdot10^{6}\,\text{m/s}$.

      א. מה גודל הכוח המגנטי על כל אחד מהם?

      ב. מה כיוון הכוח על כל אחד מהם ברגע הכניסה?

      ג. מה גודל התאוצה של כל אחד מהם ברגע הכניסה? דרגו את התאוצות מהגדולה לקטנה.
    answer: >-
      א. פרוטון ואלקטרון $1.6\cdot10^{-13}\,\text{N}$; חלקיק אלפא $3.2\cdot10^{-13}\,\text{N}$.

      ב. פרוטון ואלפא למעלה; אלקטרון למטה.

      ג. אלקטרון $1.76\cdot10^{17}\,\text{m/s}^2$, פרוטון $9.6\cdot10^{13}\,\text{m/s}^2$, אלפא $4.8\cdot10^{13}\,\text{m/s}^2$.
    solution:
      - kind: given
        text: >-
          $v = 2\cdot10^{6}\,\text{m/s}$, $B = 0.5\,\text{T}$, $\alpha = 90^\circ$. מטענים: $e$, $-e$ ו-$2e$, עם $e = 1.6\cdot10^{-19}\,\text{C}$. מסות: $m_p = 1.67\cdot10^{-27}\,\text{kg}$, $m_e = 9.1\cdot10^{-31}\,\text{kg}$, $m_\alpha \approx 4m_p = 6.68\cdot10^{-27}\,\text{kg}$.
      - kind: formula
        text: >-
          $F = qvB\sin\alpha$ (עם גודל המטען), והחוק השני של ניוטון $a = \dfrac{F}{m}$.
      - kind: substitution
        text: >-
          א. $F_p = F_e = 1.6\cdot10^{-19}\cdot2\cdot10^{6}\cdot0.5 = 1.6\cdot10^{-13}\,\text{N}$, ו-$F_\alpha = 2\cdot1.6\cdot10^{-13} = 3.2\cdot10^{-13}\,\text{N}$.

          ג. $a_e = \dfrac{1.6\cdot10^{-13}}{9.1\cdot10^{-31}} \approx 1.76\cdot10^{17}\,\text{m/s}^2$, $a_p = \dfrac{1.6\cdot10^{-13}}{1.67\cdot10^{-27}} \approx 9.6\cdot10^{13}\,\text{m/s}^2$, $a_\alpha = \dfrac{3.2\cdot10^{-13}}{6.68\cdot10^{-27}} \approx 4.8\cdot10^{13}\,\text{m/s}^2$.
      - kind: reasoning
        text: >-
          ב. כלל כף יד ימין: האצבעות לתוך הדף, האגודל ימינה, וכף היד פונה למעלה. זה הכיוון על המטענים החיוביים, הפרוטון וחלקיק האלפא. על האלקטרון השלילי הכוח הפוך: למטה. ג. לחלקיק האלפא כוח כפול, אבל מסה פי 4, ולכן התאוצה שלו חצי משל הפרוטון.
      - kind: result
        text: >-
          א. $1.6\cdot10^{-13}\,\text{N}$ על הפרוטון ועל האלקטרון, $3.2\cdot10^{-13}\,\text{N}$ על חלקיק האלפא. ב. פרוטון ואלפא למעלה, אלקטרון למטה. ג. $a_e > a_p > a_\alpha$: בערך $1.76\cdot10^{17}$, $9.6\cdot10^{13}$ ו-$4.8\cdot10^{13}\,\text{m/s}^2$.

challenge:
  - id: W-4.5-c1
    stars: 1
    objectives: [OBJ-4.5-1, OBJ-4.5-2]
    prompt: >-
      במקום מסוים השדה המגנטי של כדור הארץ הוא $5\cdot10^{-5}\,\text{T}$, והוא מצביע צפונה ומטה, בזווית $45^\circ$ מתחת לאופק. אלקטרון נע שם **צפונה**, באופקי, במהירות $4\cdot10^{5}\,\text{m/s}$.

      א. מה הזווית בין המהירות לשדה? מה גודל הכוח המגנטי על האלקטרון?

      ב. מה כיוון הכוח?

      ג. האלקטרון נע עכשיו **מזרחה** באותה מהירות. מה גודל הכוח, ומה כיוונו?

      ד. באילו כיווני תנועה האלקטרון לא ירגיש כוח מגנטי בכלל?
    answer: >-
      א. $45^\circ$; $F \approx 2.26\cdot10^{-18}\,\text{N}$.

      ב. מזרחה.

      ג. $3.2\cdot10^{-18}\,\text{N}$, דרומה ומטה, בזווית $45^\circ$ מתחת לאופק.

      ד. לאורך השדה: צפונה ומטה בזווית $45^\circ$, או דרומה ומעלה בזווית $45^\circ$.
    solution:
      - kind: given
        text: >-
          $q = 1.6\cdot10^{-19}\,\text{C}$ (גודל המטען, האלקטרון שלילי), $v = 4\cdot10^{5}\,\text{m/s}$, $B = 5\cdot10^{-5}\,\text{T}$. השדה נמצא במישור האנכי צפון-דרום: צפונה ומטה ב-$45^\circ$.
      - kind: reasoning
        text: >-
          א. המהירות (צפונה, באופקי) והשדה נמצאים באותו מישור אנכי, והשדה נוטה $45^\circ$ מתחת לאופק, ולכן הזווית ביניהם $\alpha = 45^\circ$.
      - kind: formula
        text: >-
          $F = qvB\sin\alpha$.
      - kind: substitution
        text: >-
          א. $F = 1.6\cdot10^{-19}\cdot4\cdot10^{5}\cdot5\cdot10^{-5}\cdot\sin45^\circ \approx 2.26\cdot10^{-18}\,\text{N}$.

          ג. מזרחה ניצב למישור צפון-דרום שבו נמצא השדה, ולכן $\alpha = 90^\circ$: $F = 1.6\cdot10^{-19}\cdot4\cdot10^{5}\cdot5\cdot10^{-5} = 3.2\cdot10^{-18}\,\text{N}$.
      - kind: reasoning
        text: >-
          ב. הכוח ניצב גם למהירות וגם לשדה, ושניהם במישור צפון-דרום האנכי, ולכן הכוח אופקי, מזרחה או מערבה. רק רכיב השדה שניצב למהירות קובע את הכיוון: הרכיב האנכי, כלפי מטה. כלל כף יד ימין: האצבעות למטה, האגודל צפונה, וכף היד פונה מערבה. זה הכוח על מטען חיובי; על האלקטרון הכוח מזרחה.

          ג. כשהאלקטרון נע מזרחה, האצבעות לאורך השדה (צפונה ומטה) והאגודל מזרחה. כף היד פונה צפונה ומעלה, בניצב לשדה. על האלקטרון הכוח הפוך: דרומה ומטה, $45^\circ$ מתחת לאופק.

          ד. $\sin\alpha = 0$ רק כש-$\alpha = 0^\circ$ או $180^\circ$, כלומר תנועה לאורך קו השדה, לכל אחד משני כיווניו.
      - kind: result
        text: >-
          א. $45^\circ$, $2.26\cdot10^{-18}\,\text{N}$. ב. מזרחה. ג. $3.2\cdot10^{-18}\,\text{N}$, דרומה ומטה ב-$45^\circ$ מתחת לאופק. ד. צפונה ומטה ב-$45^\circ$, או דרומה ומעלה ב-$45^\circ$.
    source:
      name: PhysicsBowl
      year: 2018
      problem: '37'
      url: https://www.aapt.org/Programs/PhysicsBowl/upload/2018-PhysicsBowl-Exam-2.pdf
      verified: '2026-11-02'
      adapted: true

  - id: W-4.5-c2
    stars: 1
    objectives: [OBJ-4.5-1, OBJ-4.5-3]
    prompt: >-
      פרוטון וחלקיק אלפא (גרעין הליום: מטען $2e$, מסה בערך פי 4 ממסת הפרוטון) נעים באותו שדה מגנטי אחיד, כל אחד בניצב לשדה. ידוע שגודל הכוח המגנטי על שניהם שווה.

      א. מה היחס בין המהירות של חלקיק האלפא למהירות של הפרוטון?

      ב. מה היחס בין האנרגיות הקינטיות שלהם?

      ג. השדה $0.5\,\text{T}$ ומהירות הפרוטון $2\cdot10^{6}\,\text{m/s}$. מה גודל הכוח על כל חלקיק, ומה מהירות חלקיק האלפא?

      ד. שני החלקיקים ממשיכים לנוע בשדה. האם היחס שמצאתם בסעיף א משתנה עם הזמן? נמקו.
    answer: >-
      א. $v_\alpha : v_p = 1 : 2$.

      ב. האנרגיות הקינטיות שוות.

      ג. $1.6\cdot10^{-13}\,\text{N}$ על כל אחד; $v_\alpha = 10^{6}\,\text{m/s}$.

      ד. לא: הכוח המגנטי לא עושה עבודה, ולכן גודל המהירות של כל אחד קבוע.
    solution:
      - kind: given
        text: >-
          $q_p = e$, $q_\alpha = 2e$, $m_\alpha \approx 4m_p$, שניהם בניצב לשדה ($\sin\alpha = 1$), ו-$F_\alpha = F_p$.
      - kind: formula
        text: >-
          $F = qvB$, והאנרגיה הקינטית $E_k = \tfrac12 mv^2$.
      - kind: manipulation
        text: >-
          א. $e\,v_pB = 2e\,v_\alpha B$. מחלקים את שני האגפים ב-$2eB$: $v_\alpha = \dfrac{v_p}{2}$.

          ב. $\dfrac{E_{k,\alpha}}{E_{k,p}} = \dfrac{\tfrac12\cdot4m_p\cdot(v_p/2)^2}{\tfrac12 m_pv_p^2} = \dfrac{4}{4} = 1$.
      - kind: substitution
        text: >-
          ג. $F_p = 1.6\cdot10^{-19}\cdot2\cdot10^{6}\cdot0.5 = 1.6\cdot10^{-13}\,\text{N}$, ולכן גם $F_\alpha = 1.6\cdot10^{-13}\,\text{N}$, ו-$v_\alpha = \dfrac{F_\alpha}{q_\alpha B} = \dfrac{1.6\cdot10^{-13}}{3.2\cdot10^{-19}\cdot0.5} = 10^{6}\,\text{m/s}$.
      - kind: reasoning
        text: >-
          ד. על כל חלקיק פועל רק הכוח המגנטי, שניצב למהירות ולכן לא עושה עבודה. גודל המהירות של כל אחד קבוע, ולכן גם היחס ביניהם, וגם גודל הכוח $qvB$ על כל אחד. משתנים רק כיווני התנועה.
      - kind: result
        text: >-
          א. $1 : 2$. ב. שוות. ג. $1.6\cdot10^{-13}\,\text{N}$ על כל אחד, $v_\alpha = 10^{6}\,\text{m/s}$. ד. לא משתנה.
