      <text x="96" y="104">20 Ω</text>
      <text x="282" y="135">10 Ω</text>
      </g>
      </svg>
    diagramAlt: >-
      מחלק מתח: סוללה של 12 וולט, ההדק החיובי שלה מחובר לקצה העליון A של נגד משתנה של 20 אוהם, וההדק השלילי לקצה התחתון B. מגע מחליק P נוגע בנגד המשתנה, ומ-P יורד תיל לנורה של 10 אוהם, שהצד השני שלה מחובר לקצה B.
    answer: >-
      א. ב-A: $12\,\text{V}$. ב-B: אפס.

      ב. $4\,\text{V}$, כי הנורה במקביל לחצי התחתון, והזוג שקול ל-$5\,\Omega$ בלבד.

      ג. $\sqrt{200} \approx 14.1\,\Omega$.

      ד. מחלק מתח: מ-$0$ עד $12\,\text{V}$. בטור: מ-$4\,\text{V}$ עד $12\,\text{V}$.
    solution:
      - kind: given
        text: >-
          $\varepsilon = 12\,\text{V}$, הנגד המשתנה $20\,\Omega$ בין A ל-B, $R_{\text{L}} = 10\,\Omega$ בין P ל-B. המגע מחלק את הנגד המשתנה לשני חלקים: $x$ בין P ל-B, ו-$20 - x$ בין A ל-P.
      - kind: reasoning
        text: >-
          א. כשהמגע ב-A, הנורה מחוברת בין A ל-B, כלומר ישר בין הדקי הסוללה: $12\,\text{V}$. כשהמגע ב-B, שני הקצוות של הנורה מחוברים לאותה נקודה, B, ולכן המתח עליה אפס.
      - kind: formula
        text: >-
          ב. הנורה והחלק $x$ מחוברים בין P ל-B, כלומר במקביל: $R_{\parallel} = \dfrac{10x}{10 + x}$. הזוג הזה בטור עם החלק העליון, $20 - x$, ולכן $V_{\text{L}} = \varepsilon\cdot\dfrac{R_{\parallel}}{R_{\parallel} + (20 - x)}$.
      - kind: substitution
        text: >-
          באמצע $x = 10\,\Omega$, ולכן $R_{\parallel} = \dfrac{10\cdot10}{20} = 5\,\Omega$:
          $$V_{\text{L}} = 12\cdot\frac{5}{5 + 10} = 4\ \text{V}$$
          זה לא $6\,\text{V}$, כי הנורה מקטינה את ההתנגדות של החצי התחתון מ-$10\,\Omega$ ל-$5\,\Omega$, והמתח מתחלק לפי ההתנגדויות.
      - kind: manipulation
        text: >-
          ג. על הנורה $6\,\text{V}$, ולכן על החלק העליון נשארים $12 - 6 = 6\,\text{V}$. אותו זרם עובר בשניהם בטור, ולכן ההתנגדויות שלהם שוות: $\dfrac{10x}{10 + x} = 20 - x$. מכפילים את שני האגפים ב-$(10 + x)$:
          $$10x = (20 - x)(10 + x) = 200 + 10x - x^2$$
          מחסירים $10x$ משני האגפים: $x^2 = 200$, ולכן $x = \sqrt{200} \approx 14.1\,\Omega$, כ-$71\%$ מהדרך מ-B אל A.
      - kind: substitution
        text: >-
          ד. בחיבור בטור $V_{\text{L}} = \dfrac{12\cdot10}{10 + R_{\text{v}}}$: ב-$R_{\text{v}} = 0$ יוצא $12\,\text{V}$, וב-$R_{\text{v}} = 20\,\Omega$ יוצא $\dfrac{120}{30} = 4\,\text{V}$.
      - kind: result
        text: >-
          א. $12\,\text{V}$ כשהמגע ב-A, ואפס כשהוא ב-B.

          ב. $4\,\text{V}$.

          ג. כ-$14.1\,\Omega$ בין P ל-B.

          ד. במחלק מתח הטווח מ-$0$ עד $12\,\text{V}$; בחיבור בטור רק מ-$4\,\text{V}$ עד $12\,\text{V}$. מחלק מתח מגיע עד אפס, ובטור הנורה תמיד מקבלת חלק מהמתח.

  - id: W-3.7-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-3.7-3, OBJ-3.7-2]
    prompt: >-
      סוללה עם כא״מ של $9\,\text{V}$ והתנגדות פנימית של $1\,\Omega$ מחוברת בטור למד זרם אידאלי, לנגד משתנה ולנורה של $8\,\Omega$. התייחסו לנורה כנגד קבוע. מד מתח אידאלי מחובר על הנורה ומראה $6\,\text{V}$.

      א. מה מראה מד הזרם, ולאיזו התנגדות מכוון הנגד המשתנה?

      ב. מה ההספק שהופך לחום בנגד המשתנה, ומה מתח ההדקים של הסוללה?

      ג. מחליפים את מד המתח במד זול, שההתנגדות שלו $40\,\Omega$, ולא נוגעים בנגד המשתנה. מה מראים עכשיו מד המתח ומד הזרם? הסבירו למה הקריאה של מד הזרם גדלה.
    answer: >-
      א. $0.75\,\text{A}$, והנגד המשתנה ב-$3\,\Omega$.

      ב. כ-$1.7\,\text{W}$, ומתח ההדקים $8.25\,\text{V}$.

      ג. מד המתח מראה כ-$5.6\,\text{V}$, ומד הזרם כ-$0.84\,\text{A}$. המד הזול פותח מסלול נוסף במקביל לנורה, ולכן ההתנגדות השקולה קטנה והזרם הכולל גדל.
    solution:
      - kind: given
        text: >-
          $\varepsilon = 9\,\text{V}$, $r = 1\,\Omega$, $R_{\text{L}} = 8\,\Omega$, והמתח על הנורה $6\,\text{V}$.
      - kind: formula
        text: >-
          על הנורה $I = \dfrac{V_{\text{L}}}{R_{\text{L}}}$. הכול בטור, ולכן $I = \dfrac{\varepsilon}{r + R_{\text{v}} + R_{\text{L}}}$, וההתנגדות השקולה היא $\dfrac{\varepsilon}{I}$.
      - kind: substitution
        text: >-
          א. $I = \dfrac{6}{8} = 0.75\,\text{A}$. ההתנגדות השקולה $\dfrac{9}{0.75} = 12\,\Omega$, ומתוכה $1\,\Omega$ פנימית ו-$8\,\Omega$ של הנורה, ולכן $R_{\text{v}} = 12 - 1 - 8 = 3\,\Omega$.
      - kind: substitution
        text: >-
          ב. $P_{\text{v}} = I^2R_{\text{v}} = 0.75^2\cdot3 \approx 1.69\,\text{W}$, ו-$V = \varepsilon - Ir = 9 - 0.75\cdot1 = 8.25\,\text{V}$.
      - kind: manipulation
        text: >-
          ג. המד של $40\,\Omega$ במקביל לנורה. הזוג שקול ל-$\dfrac{8\cdot40}{8 + 40} \approx 6.67\,\Omega$, ובטור איתו $3\,\Omega$ ו-$1\,\Omega$:
          $$I = \frac{9}{6.67 + 3 + 1} \approx 0.844\ \text{A}
          \qquad
          V = 0.844\cdot6.67 \approx 5.63\ \text{V}$$
          (בשורה הזאת מוצגים ערכים מעוגלים; החישוב עם $\tfrac{20}{3}\,\Omega$ המדויק נותן $0.84375\,\text{A}$ ו-$5.625\,\text{V}$.)
      - kind: reasoning
        text: >-
          מד הזרם נמצא לפני הפיצול, ולכן הוא מראה את הזרם בנורה ובמד המתח יחד. ההתנגדות השקולה ירדה מ-$12\,\Omega$ לכ-$10.7\,\Omega$, ולכן הזרם הכולל גדל. הזרם בנורה עצמה דווקא קטן, ל-$\dfrac{5.625}{8} \approx 0.70\,\text{A}$.
      - kind: result
        text: >-
          א. $0.75\,\text{A}$, ו-$R_{\text{v}} = 3\,\Omega$.

          ב. כ-$1.7\,\text{W}$, ו-$8.25\,\text{V}$.

          ג. מד המתח מראה כ-$5.6\,\text{V}$ (במקום $6\,\text{V}$), ומד הזרם כ-$0.84\,\text{A}$ (במקום $0.75\,\text{A}$).

challenge:
  - id: W-3.7-c1
    stars: 1
    objectives: [OBJ-3.7-2, OBJ-3.7-1]
    prompt: >-
      שני נגדים, $100\,\Omega$ ו-$200\,\Omega$, מחוברים בטור לסוללה של $4\,\text{V}$ שההתנגדות הפנימית שלה זניחה. מד מתח שמחובר על הנגד של $100\,\Omega$ מראה $1\,\text{V}$.

      א. מה ההתנגדות של מד המתח?

      ב. מה היה מראה מד מתח אידאלי באותו מקום?

      ג. מה ההתנגדות הקטנה ביותר שצריכה להיות למד מתח, כדי שהקריאה שלו על הנגד של $100\,\Omega$ תהיה קטנה מהמתח האמיתי ב-$1\%$ לכל היותר?
    answer: >-
      א. $200\,\Omega$.

      ב. $\tfrac{4}{3} \approx 1.33\,\text{V}$.

      ג. $6600\,\Omega$, כלומר $6.6\,\text{k}\Omega$.
    solution:
      - kind: given
        text: >-
          $\varepsilon = 4\,\text{V}$ (סוללה אידאלית), $R_1 = 100\,\Omega$, $R_2 = 200\,\Omega$. המד על $R_1$ מראה $1\,\text{V}$.
      - kind: reasoning
        text: >-
          א. המד ו-$R_1$ במקביל, ועל שניהם $1\,\text{V}$. לכן על $R_2$ נשארים $4 - 1 = 3\,\text{V}$, והזרם בו $\dfrac{3}{200} = 0.015\,\text{A}$. הזרם הזה מתפצל: ב-$R_1$ עובר $\dfrac{1}{100} = 0.01\,\text{A}$, ובמד השאר, $0.015 - 0.01 = 0.005\,\text{A}$.
      - kind: substitution
        text: >-
          $$R_V = \frac{1\ \text{V}}{0.005\ \text{A}} = 200\ \Omega$$
      - kind: substitution
        text: >-
          ב. בלי זרם במד, הנגדים בטור בלבד: $I = \dfrac{4}{300}\,\text{A}$, ו-$V_1 = \dfrac{4}{300}\cdot100 = \dfrac{4}{3} \approx 1.33\,\text{V}$.
      - kind: manipulation
        text: >-
          ג. הקריאה צריכה להיות לפחות $0.99\cdot\dfrac{4}{3} = 1.32\,\text{V}$. נסמן ב-$R_p$ את ההתנגדות השקולה של $R_1$ והמד. הקריאה היא $\dfrac{4R_p}{R_p + 200}$, ולכן צריך $\dfrac{4R_p}{R_p + 200} \ge 1.32$. מכפילים את שני האגפים ב-$R_p + 200$, שהוא חיובי:
          $$4R_p \ge 1.32R_p + 264 \quad\Rightarrow\quad 2.68R_p \ge 264 \quad\Rightarrow\quad R_p \ge 98.507\ \Omega$$
      - kind: manipulation
        text: >-
          עכשיו מבודדים את $R_V$ מתוך $\dfrac{1}{R_p} = \dfrac{1}{100} + \dfrac{1}{R_V}$, כלומר $R_V = \dfrac{100R_p}{100 - R_p}$. במכנה מחסירים שני מספרים קרובים, ולכן משאירים כאן כמה ספרות ולא מעגלים:
          $$R_V = \frac{100\cdot98.507}{100 - 98.507} = \frac{9850.7}{1.493} \approx 6600\ \Omega$$
          בדיקה: עם $R_V = 6600\,\Omega$ הקריאה יוצאת $1.32\,\text{V}$ בדיוק.
      - kind: result
        text: >-
          א. $200\,\Omega$.

          ב. כ-$1.33\,\text{V}$.

          ג. לפחות $6.6\,\text{k}\Omega$, פי 66 מההתנגדות של הנגד שמודדים.
    source:
      name: JEE Main
      year: 2024
      problem: '30 January 2024, Shift 2 (question number not shown on the page)'
      url: https://competishun.com/two-resistance-of-100-omega-and-200-omega-are-connected-in-series-with-a-battery-of-4-v-and-negligible-internal-resistance-a-voltmeter-is-used-to-measure-voltage-across-100-omega-resistance-which-give/
      verified: '2026-11-02'
      adapted: true

  - id: W-3.7-c2
    stars: 2
    objectives: [OBJ-3.7-1, OBJ-3.7-2]
    prompt: >-
      יש שני מכשירים רגישים זהים עם מחוג. ההתנגדות של כל אחד $10\,\Omega$, והמחוג מגיע לסוף הסקלה כשעובר בו זרם של $2\,\mu\text{A}$. מהראשון בונים מד מתח, שהמחוג שלו מגיע לסוף הסקלה במתח של $100\,\text{mV}$, בעזרת נגד שמחברים אליו בטור. מהשני בונים מד זרם, שהמחוג שלו מגיע לסוף הסקלה בזרם של $1\,\text{mA}$, בעזרת נגד שמחברים אליו במקביל. בשני המדים מודדים נגד $R = 1000\,\Omega$ שמחובר לסוללה אידאלית: מד המתח מחובר ישר על $R$, ומד הזרם בטור עם הזוג ($R$ ומד המתח), ומחשבים את ההתנגדות לפי $V/I$.

      א. מה ההתנגדות של מד המתח שנבנה, ומה ההתנגדות של מד הזרם?

      ב. מה הערך של $R$ שמתקבל מהקריאות?

      ג. מחליפים את הסוללה בסוללה עם התנגדות פנימית של $5\,\Omega$. האם הערך שמתקבל משתנה? נמקו.

      ד. מחברים את המדים אחרת: מד המתח על $R$ ועל מד הזרם יחד. מה הערך שמתקבל עכשיו? ומה צריך להיות $R$ כדי ששני החיבורים יטעו באותו אחוז?
    answer: >-
      א. מד המתח $5\cdot10^{4}\,\Omega$, ומד הזרם $0.02\,\Omega$.

      ב. כ-$980\,\Omega$.

      ג. לא: עדיין כ-$980\,\Omega$.

      ד. כ-$1000.02\,\Omega$. שני החיבורים טועים באותו אחוז כש-$R \approx 32\,\Omega$.
    solution:
      - kind: given
        text: >-
          לכל מכשיר רגיש $R_g = 10\,\Omega$ וזרם סוף סקלה $I_g = 2\cdot10^{-6}\,\text{A}$. מד המתח: $100\,\text{mV}$ בסוף הסקלה. מד הזרם: $1\,\text{mA}$ בסוף הסקלה. $R = 1000\,\Omega$.
      - kind: reasoning
        text: >-
          א. במד המתח, בסוף הסקלה עובר $I_g$ במכשיר ובנגד שבטור איתו, והמתח על שניהם יחד הוא $0.1\,\text{V}$. לכן ההתנגדות של מד המתח כולו היא $R_V = \dfrac{0.1}{2\cdot10^{-6}} = 5\cdot10^{4}\,\Omega$ (הנגד שבטור הוא $49\,990\,\Omega$).
      - kind: reasoning
        text: >-
          במד הזרם, בסוף הסקלה עובר במכשיר $I_g$, והמתח עליו $I_gR_g = 2\cdot10^{-6}\cdot10 = 2\cdot10^{-5}\,\text{V}$. זה גם המתח על מד הזרם כולו, שדרכו עובר $1\,\text{mA}$. לכן $R_A = \dfrac{2\cdot10^{-5}}{10^{-3}} = 0.02\,\Omega$. (הנגד שבמקביל נושא את השאר, $998\,\mu\text{A}$, ולכן הוא $\dfrac{2\cdot10^{-5}}{9.98\cdot10^{-4}} \approx 0.020\,\Omega$.)
      - kind: reasoning
        text: >-
          ב. מד המתח מראה את המתח על $R$. מד הזרם מראה את הזרם ב-$R$ ובמד המתח יחד, כי שניהם אחריו. לכן $V/I$ הוא ההתנגדות השקולה של $R$ ו-$R_V$ במקביל:
          $$R_{\text{meas}} = \frac{1000\cdot5\cdot10^{4}}{1000 + 5\cdot10^{4}} \approx 980.4\ \Omega$$
      - kind: reasoning
        text: >-
          ג. ההתנגדות הפנימית משנה את הזרם במעגל ואת המתח על $R$, אבל את שניהם באותו יחס: $V/I$ תלוי רק במה שמחובר בין שני החודים של מד המתח, $R$ ו-$R_V$ במקביל. לכן הערך נשאר כ-$980\,\Omega$.
      - kind: reasoning
        text: >-
          ד. עכשיו מד הזרם מראה את הזרם ב-$R$ בלבד, ומד המתח מראה את המתח על $R$ ועל מד הזרם, שבטור. לכן $V/I = R + R_A = 1000.02\,\Omega$.
      - kind: manipulation
        text: >-
          הטעות היחסית בחיבור הראשון: $\dfrac{R - R_{\text{meas}}}{R} = 1 - \dfrac{R_V}{R + R_V} = \dfrac{R}{R + R_V}$. בחיבור השני: $\dfrac{R_A}{R}$. משווים ביניהן, ומכפילים את שני האגפים ב-$R(R + R_V)$:
          $$R^2 = R_A(R + R_V) \quad\Rightarrow\quad R^2 - 0.02R - 1000 = 0$$
          לפי נוסחת השורשים, הפתרון החיובי הוא $R \approx 31.6\,\Omega$, כמעט בדיוק $\sqrt{R_AR_V} = \sqrt{1000}$.
      - kind: result
        text: >-
          א. $R_V = 5\cdot10^{4}\,\Omega$ ו-$R_A = 0.02\,\Omega$.

          ב. כ-$980\,\Omega$, פחות מ-$1000\,\Omega$, כי מד המתח לוקח חלק מהזרם.

          ג. לא משתנה.

          ד. $1000.02\,\Omega$. כש-$R \approx 32\,\Omega$ שני החיבורים טועים באותו אחוז. לנגד גדול יותר עדיף החיבור השני, ולנגד קטן יותר הראשון.
