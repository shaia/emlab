# Workbook, lesson 3.7 (meters and the rheostat). Format and rules: see .claude/CLAUDE.md, "Worked examples, workbook".
# Every circuit number was recomputed with solveCircuit from src/physics/circuits.ts, each real meter as a resistor,
# each ideal ammeter as a wire and each ideal voltmeter as an open gap; the divider in W-3.7-09 is two resistors
# split at the slider.
# In a >- block, consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '3.7'
practice:
  - id: W-3.7-01
    level: basic
    qualitative: false
    objectives: [OBJ-3.7-1]
    prompt: >-
      נורה דולקת, ועליה מחובר מד מתח שההתנגדות שלו $20\,\text{k}\Omega$. מד המתח מראה $8\,\text{V}$, ובנורה עובר זרם של $0.5\,\text{A}$.

      א. מה הזרם שעובר במד המתח עצמו?

      ב. איזה חלק, באחוזים, הוא הזרם הזה מהזרם בנורה? האם המד משנה את המעגל במידה ניכרת?
    answer: >-
      א. $4\cdot10^{-4}\,\text{A}$, כלומר $0.4\,\text{mA}$.

      ב. $0.08\%$ מהזרם בנורה: השינוי זניח.
    solution:
      - kind: given
        text: >-
          ההתנגדות של מד המתח $R_V = 2\cdot10^{4}\,\Omega$, הוא מראה $V = 8\,\text{V}$, והזרם בנורה $I_{\text{L}} = 0.5\,\text{A}$.
      - kind: formula
        text: >-
          מד המתח הוא נגד במקביל לנורה, והמתח עליו הוא המתח שהוא מראה. לפי $V = IR$, הזרם בו $I_V = \dfrac{V}{R_V}$.
      - kind: substitution
        text: >-
          $$I_V = \frac{8\ \text{V}}{2\cdot10^{4}\ \Omega} = 4\cdot10^{-4}\ \text{A}$$
          כדי למצוא איזה חלק זה מהזרם בנורה, מחלקים: $\dfrac{4\cdot10^{-4}}{0.5} = 8\cdot10^{-4}$, כלומר $0.08\%$.
      - kind: result
        text: >-
          א. $0.4\,\text{mA}$.

          ב. $0.08\%$ מהזרם בנורה. המד כמעט לא משנה את המעגל, כי ההתנגדות שלו גדולה מאוד לעומת זו של הנורה.

  - id: W-3.7-02
    level: basic
    qualitative: true
    objectives: [OBJ-3.7-1]
    prompt: >-
      במעגל יש סוללה אידאלית, נורה ומד זרם אידאלי, כולם בטור. מד מתח אידאלי מחובר על הנורה. קבעו ונמקו:

      א. מעבירים את מד הזרם מצד אחד של הנורה לצד השני שלה, ועדיין בטור. האם הקריאה שלו משתנה?

      ב. מעבירים את מד המתח מהנורה אל שני ההדקים של הסוללה. האם הקריאה שלו משתנה?
    answer: >-
      א. לא: בטור עובר אותו זרם בכל נקודה במעגל.

      ב. לא: המתח על מד זרם אידאלי הוא אפס, ולכן כל המתח של הסוללה נמצא על הנורה.
    solution:
      - kind: reasoning
        text: >-
          א. במעגל בטור יש מסלול אחד בלבד, ואין צומת שבו הזרם מתפצל. המטען לא נאגר בשום מקום, ולכן אותו זרם עובר לפני הנורה ואחריה. מד הזרם מודד את הזרם שעובר דרכו, ובשני המקומות זה אותו זרם.
      - kind: reasoning
        text: >-
          ב. מד זרם אידאלי הוא כמו תיל, $R = 0$, ולכן המתח עליו $V = IR = 0$. הסוללה אידאלית, ולכן כל המתח שלה, $\varepsilon$, נמצא על הנורה: מד המתח מראה $\varepsilon$ גם על הנורה וגם על ההדקים.
      - kind: result
        text: >-
          א. הקריאה לא משתנה.

          ב. הקריאה לא משתנה. (עם מד זרם אמיתי, או עם סוללה עם התנגדות פנימית, היה הבדל קטן.)

  - id: W-3.7-03
    level: basic
    qualitative: false
    objectives: [OBJ-3.7-3]
    prompt: >-
      נגד משתנה עשוי מתיל אחיד ומלופף, וההתנגדות של כל התיל $30\,\Omega$. המגע המחליק מכוון כך שהזרם עובר רק בשליש מאורך התיל. הנגד המשתנה מחובר בטור לנורה של $5\,\Omega$ ולסוללה אידאלית של $6\,\text{V}$.

      א. מה ההתנגדות של הנגד המשתנה במצב הזה?

      ב. מה הזרם במעגל, ומה המתח על הנורה?

      ג. לאיזה כיוון צריך להזיז את המגע כדי שהנורה תאיר חזק יותר: כך שהזרם יעבור בחלק ארוך יותר של התיל, או בחלק קצר יותר?
    answer: >-
      א. $10\,\Omega$.

      ב. $0.4\,\text{A}$, ועל הנורה $2\,\text{V}$.

      ג. בחלק קצר יותר.
    solution:
      - kind: given
        text: >-
          כל התיל $30\,\Omega$, והזרם עובר בשליש ממנו. $R_{\text{L}} = 5\,\Omega$, $\varepsilon = 6\,\text{V}$.
      - kind: reasoning
        text: >-
          א. לפי $R = \rho L/A$ (שיעור 3.3), בתיל אחיד ההתנגדות פרופורציונית לאורך. שליש מהאורך נותן שליש מההתנגדות: $R_{\text{v}} = 30/3 = 10\,\Omega$.
      - kind: formula
        text: >-
          ב. בטור $I = \dfrac{\varepsilon}{R_{\text{v}} + R_{\text{L}}}$, ועל הנורה $V_{\text{L}} = IR_{\text{L}}$.
      - kind: substitution
        text: >-
          $$I = \frac{6\ \text{V}}{10\ \Omega + 5\ \Omega} = 0.4\ \text{A}
          \qquad
          V_{\text{L}} = 0.4\ \text{A}\cdot5\ \Omega = 2\ \text{V}$$
      - kind: reasoning
        text: >-
          ג. חלק קצר יותר של התיל הוא התנגדות קטנה יותר בטור. ההתנגדות השקולה קטנה, הזרם גדל, וההספק של הנורה, $I^2R_{\text{L}}$, גדל.
      - kind: result
        text: >-
          א. $10\,\Omega$.

          ב. $0.4\,\text{A}$ ו-$2\,\text{V}$.

          ג. מזיזים את המגע כך שהזרם יעבור בחלק קצר יותר של התיל.

  - id: W-3.7-04
    level: mid
    qualitative: false
    objectives: [OBJ-3.7-2]
    prompt: >-
      תלמיד מחבר מד זרם, שההתנגדות שלו $0.05\,\Omega$, ישר בין שני ההדקים של סוללה. לסוללה כא״מ של $1.5\,\text{V}$ והתנגדות פנימית של $0.2\,\Omega$. בתוך המד יש נתיך שנשרף כשעובר בו זרם של יותר מ-$2\,\text{A}$.

      א. איזה זרם היה עובר במד, אילו הנתיך לא היה נשרף?

      ב. מה מתח ההדקים של הסוללה באותו זמן?

      ג. האם הנתיך יישרף? איך היה צריך לחבר את מד הזרם?
    answer: >-
      א. $6\,\text{A}$.

      ב. $0.3\,\text{V}$.

      ג. כן, כי $6\,\text{A}$ גדול מ-$2\,\text{A}$. מד זרם מחברים בטור עם רכיב שמגביל את הזרם, למשל נורה, ולא ישר על הסוללה.
    solution:
      - kind: given
        text: >-
          $\varepsilon = 1.5\,\text{V}$, $r = 0.2\,\Omega$, ההתנגדות של המד $R_A = 0.05\,\Omega$.
      - kind: formula
        text: >-
          המד הוא הנגד היחיד מחוץ לסוללה, בטור עם ההתנגדות הפנימית: $I = \dfrac{\varepsilon}{r + R_A}$. מתח ההדקים $V = \varepsilon - Ir$.
      - kind: substitution
        text: >-
          $$I = \frac{1.5\ \text{V}}{0.2\ \Omega + 0.05\ \Omega} = 6\ \text{A}
          \qquad
          V = 1.5 - 6\cdot0.2 = 0.3\ \text{V}$$
          בדיקה: זה גם המתח על המד, $IR_A = 6\cdot0.05 = 0.3\,\text{V}$, כמו שצריך, כי המד מחובר בין ההדקים.
      - kind: reasoning
        text: >-
          ג. מד זרם הוא כמעט תיל, ולכן מד זרם על הדקי הסוללה הוא כמעט קצר. רק ההתנגדות הפנימית וההתנגדות הקטנה של המד מגבילות את הזרם.
      - kind: result
        text: >-
          א. $6\,\text{A}$.

          ב. $0.3\,\text{V}$.

          ג. הנתיך יישרף. מד זרם מחברים בטור עם הרכיב שאת הזרם בו רוצים למדוד.

  - id: W-3.7-05
    level: mid
    qualitative: true
    objectives: [OBJ-3.7-2, OBJ-3.7-1]
    prompt: >-
      נורה של $12\,\Omega$, מפסק פתוח וסוללה אידאלית של $9\,\text{V}$ מחוברים בטור. למד מתח יש התנגדות של $10^{7}\,\Omega$ (עשרה מגה-אוהם). קבעו ונמקו מה מראה מד המתח:

      א. כשמחברים אותו בין שני הקצוות של הנורה.

      ב. כשמחברים אותו בין שני הקצוות של המפסק הפתוח.

      ג. מוציאים את המפסק, ובמקומו מחברים בטור מד זרם אידאלי, כך שהמעגל סגור. מה מראה מד המתח כשמחברים אותו בין שני הקצוות של מד הזרם?
    answer: >-
      א. אפס.

      ב. כמעט $9\,\text{V}$.

      ג. אפס, אף שעובר זרם.
    solution:
      - kind: reasoning
        text: >-
          א. מד המתח במקביל לנורה, אבל המפסק עדיין פתוח, ולכן אין מסלול סגור: לא עובר זרם בנורה. לפי $V = IR$, המתח על הנורה אפס, והמד מראה אפס.
      - kind: reasoning
        text: >-
          ב. עכשיו המד סוגר את המעגל במקום המפסק: סוללה, נורה ומד המתח בטור. ההתנגדות של המד גדולה פי כמיליון מזו של הנורה, ולכן הזרם קטן מאוד, $I \approx 9/10^{7} \approx 9\cdot10^{-7}\,\text{A}$, ועל הנורה נופל רק $IR \approx 10^{-5}\,\text{V}$. כמעט כל $9\,\text{V}$ נופלים על המד.
      - kind: reasoning
        text: >-
          ג. עכשיו עובר זרם, $I = 9/12 = 0.75\,\text{A}$. אבל למד זרם אידאלי אין התנגדות, ולכן המתח עליו $V = IR = 0.75\cdot0 = 0$.
      - kind: result
        text: >-
          א. אפס, כי לא עובר זרם בנורה.

          ב. כמעט $9\,\text{V}$: כל המתח נופל על ההתנגדות הגדולה של המד.

          ג. אפס: עובר זרם, אבל אין התנגדות. מתח על רכיב תלוי גם בזרם וגם בהתנגדות שלו.

  - id: W-3.7-06
    level: mid
    qualitative: false
    objectives: [OBJ-3.7-3]
    prompt: >-
      נורה של $10\,\Omega$ מחוברת בטור לנגד משתנה ולסוללה אידאלית של $12\,\text{V}$. התייחסו לנורה כנגד קבוע. רוצים לכוון את הזרם בנורה לכל ערך בין $0.3\,\text{A}$ ל-$1.2\,\text{A}$.

      א. לאיזו התנגדות מרבית צריך הנגד המשתנה להגיע, לפחות?

      ב. האם אפשר להגיע ל-$1.2\,\text{A}$? באיזה מצב של הנגד המשתנה?

      ג. במעבדה יש רק נגד משתנה של $0$ עד $20\,\Omega$, ולכן מוסיפים בטור גם נגד קבוע. מה ההתנגדות הקטנה ביותר שצריכה להיות לנגד הקבוע כדי שאפשר יהיה לרדת ל-$0.3\,\text{A}$? מה יהיה אז הזרם הגדול ביותר?
    answer: >-
      א. $30\,\Omega$.

      ב. כן, כשהנגד המשתנה באפס.

      ג. $10\,\Omega$, ואז הזרם הגדול ביותר $0.6\,\text{A}$: אי אפשר עוד להגיע ל-$1.2\,\text{A}$.
    solution:
      - kind: given
        text: >-
          $R_{\text{L}} = 10\,\Omega$, $\varepsilon = 12\,\text{V}$, ורוצים זרם בין $0.3\,\text{A}$ ל-$1.2\,\text{A}$.
      - kind: formula
        text: >-
          בטור $I = \dfrac{\varepsilon}{R_{\text{L}} + R_{\text{v}}}$. הזרם הקטן ביותר מתקבל כשהנגד המשתנה בהתנגדות המרבית, והגדול ביותר כשהוא באפס.
      - kind: manipulation
        text: >-
          א. כדי לקבל $0.3\,\text{A}$ צריך התנגדות שקולה $\dfrac{\varepsilon}{I} = \dfrac{12}{0.3} = 40\,\Omega$. מתוכה $10\,\Omega$ של הנורה, ולכן $R_{\text{v}} = 40 - 10 = 30\,\Omega$.
      - kind: substitution
        text: >-
          ב. כשהנגד המשתנה באפס: $I = \dfrac{12\ \text{V}}{10\ \Omega} = 1.2\,\text{A}$, בדיוק הערך המבוקש.
      - kind: manipulation
        text: >-
          ג. גם עכשיו צריך $40\,\Omega$ בסך הכול. הנורה והנגד המשתנה נותנים לכל היותר $10 + 20 = 30\,\Omega$, ולכן הנגד הקבוע צריך להיות לפחות $40 - 30 = 10\,\Omega$. אבל הנגד הקבוע נשאר במעגל גם כשהנגד המשתנה באפס, ואז $I = \dfrac{12}{10 + 10} = 0.6\,\text{A}$.
      - kind: result
        text: >-
          א. לפחות $30\,\Omega$.

          ב. כן: $1.2\,\text{A}$ כשהנגד המשתנה באפס.

          ג. לפחות $10\,\Omega$. אז הטווח הוא $0.3\,\text{A}$ עד $0.6\,\text{A}$, ואי אפשר להגיע ל-$1.2\,\text{A}$. הנגד הקבוע מוריד את שני קצות הטווח.

  - id: W-3.7-07
    level: mid
    qualitative: true
    objectives: [OBJ-3.7-3, OBJ-3.7-1]
    prompt: >-
      נורה מחוברת בטור לנגד משתנה, למד זרם אידאלי ולסוללה אידאלית. מד מתח אידאלי מחובר על **הנגד המשתנה**, לא על הנורה. התייחסו לנורה כנגד קבוע. מגדילים בהדרגה את ההתנגדות של הנגד המשתנה. קבעו ונמקו:

      א. מה קורה לקריאה של מד הזרם?

      ב. מה קורה לקריאה של מד המתח? (רמז: מה קורה למתח על הנורה?)

      ג. מה מראה מד המתח כשהנגד המשתנה באפס? לאיזה ערך הקריאה מתקרבת כשההתנגדות של הנגד המשתנה גדלה מאוד?
    answer: >-
      א. קטנה.

      ב. גדלה, אף שהזרם קטן.

      ג. באפס הוא מראה אפס. כשההתנגדות גדלה מאוד, הקריאה מתקרבת למתח של הסוללה, $\varepsilon$.
    solution:
      - kind: reasoning
        text: >-
          א. ההתנגדות השקולה בטור גדלה, ולכן הזרם $I = \dfrac{\varepsilon}{R_{\text{L}} + R_{\text{v}}}$ קטן, ומד הזרם מראה פחות.
      - kind: reasoning
        text: >-
          ב. אי אפשר להסיק מ-$V = IR_{\text{v}}$ לבד, כי $I$ קטן ו-$R_{\text{v}}$ גדל. לכן מסתכלים על הנורה: המתח עליה $IR_{\text{L}}$, וההתנגדות שלה קבועה, ולכן הוא קטן יחד עם הזרם. הסוללה אידאלית ומד הזרם אידאלי, ולכן המתחים על הנורה ועל הנגד המשתנה מסתכמים תמיד ל-$\varepsilon$: $V_{\text{v}} = \varepsilon - IR_{\text{L}}$. כש-$IR_{\text{L}}$ קטן, $V_{\text{v}}$ גדל.
      - kind: reasoning
        text: >-
          ג. באפס הנגד המשתנה הוא כמו תיל, ו-$V = I\cdot0 = 0$. כשההתנגדות שלו גדלה מאוד, הזרם מתקרב לאפס, המתח על הנורה מתקרב לאפס, וכמעט כל $\varepsilon$ נופל על הנגד המשתנה. למשל, עם $\varepsilon = 12\,\text{V}$ ונורה של $6\,\Omega$: ב-$6\,\Omega$ המד מראה $6\,\text{V}$, ב-$18\,\Omega$ הוא מראה $9\,\text{V}$, וב-$100\,\Omega$ כ-$11.3\,\text{V}$.
      - kind: result
        text: >-
          א. הקריאה של מד הזרם קטנה.

          ב. הקריאה של מד המתח גדלה: המתח עובר מהנורה אל הנגד המשתנה.

          ג. מאפס, ועד קרוב ל-$\varepsilon$.

  - id: W-3.7-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-3.7-2]
    prompt: >-
      נגד ידוע, $R_2 = 20\,\text{k}\Omega$, ונגד לא ידוע, $R_x$, מחוברים בטור לסוללה אידאלית של $12\,\text{V}$. מד מתח שההתנגדות שלו $20\,\text{k}\Omega$ מחובר על $R_2$, ומראה $3\,\text{V}$.

      א. תלמיד חישב כך: הזרם ב-$R_2$ הוא $\dfrac{3}{20000}\,\text{A}$, והמתח על $R_x$ הוא $12 - 3 = 9\,\text{V}$, ולכן $R_x = 9 \div \dfrac{3}{20000}$. מה הוא קיבל, ומה הטעות שלו?

      ב. מצאו את $R_x$.

      ג. מה היה מראה מד מתח אידאלי על $R_2$?
    answer: >-
      א. $60\,\text{k}\Omega$. הוא שכח שגם במד עובר זרם, וגם הזרם הזה עובר דרך $R_x$.

      ב. $R_x = 30\,\text{k}\Omega$.

      ג. $4.8\,\text{V}$.
    solution:
      - kind: given
        text: >-
          $\varepsilon = 12\,\text{V}$, $R_2 = R_V = 2\cdot10^{4}\,\Omega$, והמד מראה $3\,\text{V}$.
      - kind: reasoning
        text: >-
          א. החישוב של התלמיד נותן $R_x = \dfrac{9}{1.5\cdot10^{-4}} = 6\cdot10^{4}\,\Omega$. אבל המד הוא נגד במקביל ל-$R_2$: הזרם שעובר ב-$R_x$ מתפצל אחריו בין $R_2$ לבין המד. התלמיד לקח רק את החלק שב-$R_2$.
      - kind: formula
        text: >-
          ב. על המד ועל $R_2$ אותו מתח, $3\,\text{V}$. בכל אחד מהם $I = V/R$. הזרם שעובר ב-$R_x$ מתפצל בין שני הענפים האלה, ולכן הוא סכום שני הזרמים.
      - kind: substitution
        text: >-
          $$I_2 = I_V = \frac{3\ \text{V}}{2\cdot10^{4}\ \Omega} = 1.5\cdot10^{-4}\ \text{A}
          \qquad
          I = 1.5\cdot10^{-4} + 1.5\cdot10^{-4} = 3\cdot10^{-4}\ \text{A}$$
          $$R_x = \frac{9\ \text{V}}{3\cdot10^{-4}\ \text{A}} = 3\cdot10^{4}\ \Omega$$
      - kind: substitution
        text: >-
          ג. בלי זרם במד, $R_x$ ו-$R_2$ בטור בלבד:
          $$I = \frac{12}{3\cdot10^{4} + 2\cdot10^{4}} = 2.4\cdot10^{-4}\ \text{A}
          \qquad
          V_2 = 2.4\cdot10^{-4}\cdot2\cdot10^{4} = 4.8\ \text{V}$$
      - kind: result
        text: >-
          א. $60\,\text{k}\Omega$, כי התעלם מהזרם שעובר במד.

          ב. $R_x = 30\,\text{k}\Omega$.

          ג. $4.8\,\text{V}$. מד המתח הלא אידאלי הוריד את המתח על $R_2$ מ-$4.8\,\text{V}$ ל-$3\,\text{V}$.

  - id: W-3.7-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-3.7-3]
    prompt: >-
      נגד משתנה שההתנגדות הכוללת שלו $20\,\Omega$ מחובר כמחלק מתח: שני הקצוות שלו, A ו-B, מחוברים להדקים של סוללה אידאלית של $12\,\text{V}$. נורה של $10\,\Omega$ מחוברת בין המגע המחליק P לבין הקצה B (ראו שרטוט). התייחסו לנורה כנגד קבוע.

      א. מה המתח על הנורה כשהמגע בקצה A, ומה כשהוא בקצה B?

      ב. המגע באמצע הנגד המשתנה. מה המתח על הנורה? למה הוא לא $6\,\text{V}$?

      ג. מה צריכה להיות ההתנגדות בין P ל-B כדי שעל הנורה יהיו בדיוק $6\,\text{V}$?

      ד. השוו לחיבור בטור, שבו אותו נגד משתנה, מ-$0$ עד $20\,\Omega$, מחובר בטור לנורה ולסוללה. מה טווח המתחים על הנורה בכל אחד משני החיבורים?
    diagram: >-
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" fill="none" stroke="currentColor" stroke-width="1.5">
      <line x1="40" y1="30" x2="160" y2="30"/>
