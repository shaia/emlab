# Workbook, lesson 3.8 (Kirchhoff's laws). Format and rules: see .claude/CLAUDE.md, "Worked examples, workbook".
# Every circuit number was recomputed with solveCircuit from src/physics/circuits.ts. Sign convention (the same in the
# lesson and the chapter summary): crossing a battery from its negative to its positive terminal the potential rises by ε,
# whatever the current; across a resistor in the marked current direction it drops by IR; a terminal voltage is
# V = ε − Ir with I the current leaving the + terminal, so while a battery is charged I < 0 and V > ε.
# A side-branch current is marked from the battery's + terminal toward the top junction J, so a negative value means the
# current enters that + terminal (the battery is being charged).
# In a >- block, consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '3.8'
practice:
  - id: W-3.8-01
    level: basic
    qualitative: false
    objectives: [OBJ-3.8-1]
    prompt: >-
      במעגל יש שני צמתים, P למעלה ו-Q למטה, ושלושה ענפים מחברים ביניהם. בכל ענף יש מד זרם אידאלי. מד הזרם בענף השמאלי מראה $1.2\,\text{A}$, והזרם בו עולה מ-Q אל P. מד הזרם בענף האמצעי מראה $0.5\,\text{A}$, והזרם בו יורד מ-P אל Q.

      (א) מה מראה מד הזרם בענף הימני, ולאיזה כיוון זורם בו הזרם?

      (ב) כתבו את חוק הצמתים בצומת Q, ובדקו שהוא מתקיים.
    answer: >-
      (א) $0.7\,\text{A}$, יורד מ-P אל Q.

      (ב) נכנסים ל-Q $0.5 + 0.7 = 1.2\,\text{A}$, ויוצאים ממנו $1.2\,\text{A}$ בענף השמאלי.
    solution:
      - kind: given
        text: >-
          אל P נכנס $1.2\,\text{A}$ מהענף השמאלי. מ-P יוצא $0.5\,\text{A}$ בענף האמצעי. את הזרם בענף הימני נסמן $I$, ונבחר אותו יוצא מ-P, כלומר יורד אל Q.
      - kind: formula
        text: >-
          חוק הצמתים: $\sum I_{\text{in}} = \sum I_{\text{out}}$.
      - kind: substitution
        text: >-
          (א) ב-P: $1.2 = 0.5 + I$, ולכן $I = 1.2 - 0.5 = 0.7\,\text{A}$. התוצאה חיובית, ולכן הכיוון שבחרנו נכון: הזרם יורד.
      - kind: reasoning
        text: >-
          (ב) אל Q נכנסים $0.5\,\text{A}$ מהענף האמצעי ו-$0.7\,\text{A}$ מהימני. בענף השמאלי הזרם עולה מ-Q אל P, כלומר יוצא מ-Q: $1.2\,\text{A}$. ואכן $0.5 + 0.7 = 1.2$.
          זו אותה משוואה כמו ב-P: מה שיוצא מ-P בשני ענפים מגיע ל-Q ויוצא ממנו בענף השלישי, כי המטען לא מצטבר באף צומת.
      - kind: result
        text: >-
          (א) $0.7\,\text{A}$, מ-P אל Q.

          (ב) ב-Q: נכנסים $1.2\,\text{A}$ ויוצאים $1.2\,\text{A}$.

  - id: W-3.8-02
    level: basic
    qualitative: true
    objectives: [OBJ-3.8-2]
    prompt: >-
      שתי תלמידות כותבות את חוק הלולאות לאותה לולאה, עם אותו סימון של הזרמים. מאיה הולכת סביב הלולאה עם כיוון השעון, ונועה הולכת נגד כיוון השעון ומתחילה מנקודה אחרת.

      (א) מה הקשר בין המשוואה של מאיה למשוואה של נועה?

      (ב) האם הן יקבלו אותם זרמים? נמקו.
    answer: >-
      (א) כל איבר אצל נועה הוא האיבר של מאיה עם סימן הפוך: המשוואה של נועה היא המשוואה של מאיה כפול $(-1)$. נקודת ההתחלה משנה רק את סדר האיברים.

      (ב) כן. כפל משוואה ב-$(-1)$ לא משנה את הפתרון שלה.
    solution:
      - kind: reasoning
        text: >-
          (א) מי שעוברת בסוללה מההדק השלילי לחיובי רושמת עלייה, $+\varepsilon$, ומי שעוברת בה בכיוון ההפוך, מההדק החיובי לשלילי, רושמת ירידה, $-\varepsilon$. בנגד, מי שהולכת עם הזרם המסומן רושמת $-IR$, ומי שהולכת נגדו רושמת $+IR$. לכן כל שינוי בפוטנציאל אצל נועה הוא השינוי של מאיה עם סימן הפוך.
      - kind: reasoning
        text: >-
          נקודת ההתחלה קובעת רק את הסדר שבו מחברים את האיברים, וסדר החיבור לא משנה את הסכום. מכל נקודה שמתחילים בה, לולאה סגורה חוזרת אליה.
      - kind: manipulation
        text: >-
          דוגמה: לולאה עם סוללה $\varepsilon$ ושני נגדים, והזרם $I$ מסומן עם כיוון השעון. מאיה רושמת $\varepsilon - IR_1 - IR_2 = 0$. נועה עוברת ב-$R_2$ וב-$R_1$ נגד הזרם, ובסוללה מההדק החיובי לשלילי:
          $$IR_2 + IR_1 - \varepsilon = 0$$
          וזו בדיוק המשוואה של מאיה, כפול $(-1)$.
      - kind: result
        text: >-
          (א) המשוואות זהות, רק שכל הסימנים במשוואה של נועה הפוכים.

          (ב) הפתרונות זהים: אותם זרמים, עם אותם סימנים. כיוון ההליכה שייך רק לכתיבת המשוואה, ואילו כיוון הזרמים נקבע בסימון שלהם.

  - id: W-3.8-03
    level: basic
    qualitative: false
    objectives: [OBJ-3.8-2]
    prompt: >-
      במעגל יש מסלול אחד, ועליו ארבע נקודות: A, B, C ו-D. בין A ל-B יש סוללה אידאלית $\varepsilon_1 = 10\,\text{V}$; ההדק השלילי שלה ב-A, וההדק החיובי ב-B. בין B ל-C יש נגד $R_1 = 2\,\Omega$. בין C ל-D יש סוללה אידאלית $\varepsilon_2 = 4\,\text{V}$; ההדק החיובי שלה ב-C, וההדק השלילי ב-D. בין D ל-A יש נגד $R_2 = 1\,\Omega$.

      (א) מה הזרם במעגל, ובאיזה כיוון הוא זורם?

      (ב) בחרו את הפוטנציאל של A להיות אפס, ומצאו את הפוטנציאלים של B, של C ושל D. תארו את גרף הפוטנציאל לאורך הלולאה.
    answer: >-
      (א) $2\,\text{A}$, בכיוון A, B, C, D: הזרם עובר ב-$\varepsilon_1$ מההדק השלילי לחיובי.

      (ב) $V_B = 10\,\text{V}$, $V_C = 6\,\text{V}$, $V_D = 2\,\text{V}$, ובחזרה ל-A: $0$.
    solution:
      - kind: given
        text: >-
          $\varepsilon_1 = 10\,\text{V}$, $\varepsilon_2 = 4\,\text{V}$, $R_1 = 2\,\Omega$, $R_2 = 1\,\Omega$. במעגל עם מסלול אחד זורם זרם אחד, $I$.
      - kind: reasoning
        text: >-
          נסמן את $I$ בכיוון A, B, C, D, כלומר יוצא מההדק החיובי של $\varepsilon_1$. ההדקים החיוביים של שתי הסוללות פונים זה אל זה (דרך $R_1$), ולכן הן דוחפות בכיוונים מנוגדים. בכיוון ההליכה הזה עוברים ב-$\varepsilon_2$ מההדק החיובי לשלילי.
      - kind: formula
        text: >-
          חוק הלולאות, $\sum\Delta V = 0$: בסוללה, מההדק השלילי לחיובי, עלייה $+\varepsilon$, ומההדק החיובי לשלילי ירידה $-\varepsilon$. בנגד, בכיוון הזרם המסומן, ירידה $-IR$.
      - kind: substitution
        text: >-
          (א) $10 - 2I - 4 - 1\cdot I = 0$, כלומר $3I = 6$, ומחלקים ב-3: $I = 2\,\text{A}$. התוצאה חיובית, ולכן הכיוון שסימנו נכון.
      - kind: substitution
        text: >-
          (ב) הולכים מ-A לאורך הלולאה ומוסיפים כל שינוי:
          $$V_B = 0 + 10 = 10\ \text{V} \qquad V_C = 10 - 2\cdot2 = 6\ \text{V} \qquad V_D = 6 - 4 = 2\ \text{V}$$
          ובחזרה ל-A: $2 - 2\cdot1 = 0$, כמו שחוק הלולאות דורש.
      - kind: reasoning
        text: >-
          גרף הפוטנציאל לאורך הלולאה: עלייה של $10\,\text{V}$ ב-$\varepsilon_1$, ירידה של $4\,\text{V}$ ב-$R_1$, ירידה של $4\,\text{V}$ ב-$\varepsilon_2$ וירידה של $2\,\text{V}$ ב-$R_2$, חזרה לאפס. הזרם נכנס להדק החיובי של $\varepsilon_2$, ולכן היא מקבלת אנרגיה.
      - kind: result
        text: >-
          (א) $I = 2\,\text{A}$, יוצא מההדק החיובי של $\varepsilon_1$ אל $R_1$.

          (ב) $V_B = 10\,\text{V}$, $V_C = 6\,\text{V}$, $V_D = 2\,\text{V}$.

