    solution:
      - kind: given
        text: >-
          $\varepsilon_1 = 12\,\text{V}$, $R_1 = 2\,\Omega$, $\varepsilon_2 = 15\,\text{V}$, $R_3 = 3\,\Omega$, $I_3 = 3\,\text{A}$ מ-J אל K. נסמן את $I_1$ ואת $I_2$ יוצאים מההדקים החיוביים אל J.
      - kind: formula
        text: >-
          חוק הלולאות בלולאה השמאלית, מההדק השלילי של $\varepsilon_1$ ודרך $R_3$: $\varepsilon_1 - R_1I_1 - R_3I_3 = 0$. בלולאה הזאת רק $I_1$ לא ידוע, ולכן מתחילים בה.
      - kind: substitution
        text: >-
          (א) $12 - 2I_1 - 3\cdot3 = 0$, כלומר $2I_1 = 3$, ולכן $I_1 = 1.5\,\text{A}$. חיובי: הזרם יוצא מההדק החיובי של $\varepsilon_1$.
      - kind: substitution
        text: >-
          (ב) חוק הצמתים ב-J: $I_1 + I_2 = I_3$, ולכן $I_2 = 3 - 1.5 = 1.5\,\text{A}$. חיובי: גם $\varepsilon_2$ מספקת אנרגיה.
      - kind: substitution
        text: >-
          (ג) חוק הלולאות בלולאה הימנית: $\varepsilon_2 - R_2I_2 - R_3I_3 = 0$, כלומר $15 - 1.5R_2 - 9 = 0$. מעבירים אגפים: $1.5R_2 = 6$, ומחלקים ב-1.5 כדי לבודד את $R_2$: $R_2 = 4\,\Omega$.
      - kind: result
        text: >-
          (א) $I_1 = 1.5\,\text{A}$, אל J.

          (ב) $I_2 = 1.5\,\text{A}$, אל J.

          (ג) $R_2 = 4\,\Omega$.

  - id: W-3.8-05
    level: mid
    qualitative: true
    objectives: [OBJ-3.8-3]
    prompt: >-
      במעגל שני צמתים, J למעלה ו-K למטה, ושלושה ענפים ביניהם, כמו באיור של שאלה 4. בכל ענף צדדי יש למטה סוללה אידאלית, שההדק השלילי שלה מחובר ל-K וההדק החיובי פונה למעלה, ומעליה נגד עד J. בענף האמצעי יש רק נגד, $R_3$. שתי הסוללות זהות, $\varepsilon_1 = \varepsilon_2 = \varepsilon$, ושני הנגדים בענפים הצדדיים זהים, $R_1 = R_2 = R$.

      (א) בלי לפתור משוואות, קבעו ונמקו: מה היחס בין הזרם בענף השמאלי לזרם בענף הימני? האם אחת הסוללות נטענת?

      (ב) מחליפים את $\varepsilon_2$ בסוללה שהכא״מ שלה קטן מעט יותר. תלמיד טוען: ״עכשיו הסוללה החזקה טוענת את החלשה״. קבעו ונמקו אם הוא צודק.
    answer: >-
      (א) הזרמים שווים, ושתי הסוללות מספקות אנרגיה. אף אחת מהן לא נטענת.

      (ב) הוא לא צודק. $\varepsilon_2$ נטענת רק אם הפוטנציאל של J גבוה מהכא״מ שלה, $V_J \gt \varepsilon_2$. כשההפרש בין הסוללות קטן, $V_J$ נשאר מתחת ל-$\varepsilon_2$, והיא עדיין מספקת אנרגיה, רק פחות.
    solution:
      - kind: reasoning
        text: >-
          (א) שני הענפים הצדדיים זהים: אותה סוללה ואותו נגד, בין אותם שני צמתים. שום דבר במעגל לא מבחין ביניהם, ולכן גם הזרמים בהם שווים: $I_1 = I_2 = I$. לפי חוק הצמתים, $I_3 = 2I$.
      - kind: reasoning
        text: >-
          הסימן של $I$: חוק הלולאות בלולאה השמאלית נותן $\varepsilon - RI - R_3\cdot2I = 0$, כלומר $I = \dfrac{\varepsilon}{R + 2R_3}$, מספר חיובי. לכן בשני הענפים הזרם יוצא מההדק החיובי, ושתי הסוללות מספקות אנרגיה.
      - kind: reasoning
        text: >-
          (ב) נקבע את הפוטנציאל של K כאפס, ונקרא לפוטנציאל של J בשם $V_J$. ההדק החיובי של $\varepsilon_2$ נמצא ב-$\varepsilon_2$, ובינו לבין J יש רק $R_2$. הזרם ב-$R_2$ זורם מהפוטנציאל הגבוה לנמוך, ולכן: אם $V_J \lt \varepsilon_2$, הזרם יוצא מההדק החיובי של $\varepsilon_2$, והיא מספקת אנרגיה; אם $V_J = \varepsilon_2$, אין בה זרם; ורק אם $V_J \gt \varepsilon_2$, הזרם נכנס להדק החיובי שלה, והיא נטענת.
      - kind: reasoning
        text: >-
          במעגל הסימטרי הזרם ב-$R_2$ יוצא מ-$\varepsilon_2$ אל J, ולכן $V_J = \varepsilon - RI$, נמוך מ-$\varepsilon$. כשמקטינים מעט את $\varepsilon_2$, גם $V_J$ משתנה רק מעט, ונשאר מתחת לכא״מ של $\varepsilon_2$. הזרם ב-$R_2$ קטן, אבל עדיין יוצא מההדק החיובי.
      - kind: reasoning
        text: >-
          דוגמה מספרית: $\varepsilon = 6\,\text{V}$, $R = 2\,\Omega$, $R_3 = 4\,\Omega$. במעגל הסימטרי $I_1 = I_2 = 0.6\,\text{A}$ ו-$V_J = 4.8\,\text{V}$. עם $\varepsilon_2 = 5.5\,\text{V}$ פתרון המשוואות נותן $I_1 = 0.7\,\text{A}$, $I_2 = 0.45\,\text{A}$ ו-$V_J = 4.6\,\text{V}$, מתחת ל-$5.5\,\text{V}$: $\varepsilon_2$ עדיין מספקת אנרגיה. במעגל הזה $\varepsilon_2$ מפסיקה לספק זרם רק ב-$\varepsilon_2 = 4\,\text{V}$, כש-$V_J = 4\,\text{V}$, ונטענת רק מתחת לזה.
      - kind: result
        text: >-
          (א) $I_1 = I_2$, ושתי הסוללות מספקות אנרגיה.

          (ב) הוא לא צודק: הבדל קטן בכא״מ מקטין את הזרם של $\varepsilon_2$ אבל לא הופך אותו. $\varepsilon_2$ נטענת רק כש-$V_J \gt \varepsilon_2$.

  - id: W-3.8-06
    level: mid
    qualitative: false
    objectives: [OBJ-3.8-2, OBJ-3.8-3]
    prompt: >-
      מכשיר טעינה הוא מקור עם כא״מ $\varepsilon_1 = 14\,\text{V}$ והתנגדות פנימית $r_1 = 0.3\,\Omega$. מחברים אותו למצבר של רכב, שהכא״מ שלו $\varepsilon_2 = 12\,\text{V}$ וההתנגדות הפנימית שלו $r_2 = 0.2\,\Omega$: הדק חיובי לחיובי ושלילי לשלילי, בכבלים שההתנגדות שלהם זניחה.

      (א) מה הזרם, ובאיזה כיוון הוא עובר במצבר?

      (ב) מה מתח ההדקים של המצבר? השוו אותו לכא״מ שלו.

      (ג) מה ההספק שהכא״מ של מכשיר הטעינה מספק? כמה ממנו נאגר במצבר כאנרגיה כימית, וכמה הופך לחום?
    answer: >-
      (א) $4\,\text{A}$. במצבר הזרם נכנס בהדק החיובי ויוצא בשלילי: המצבר נטען.

      (ב) $12.8\,\text{V}$, יותר מהכא״מ של המצבר, כמו בכל מצבר שנטען.

      (ג) $56\,\text{W}$. נאגרים $48\,\text{W}$, ו-$8\,\text{W}$ הופכים לחום.
    solution:
      - kind: given
        text: >-
          $\varepsilon_1 = 14\,\text{V}$, $r_1 = 0.3\,\Omega$, $\varepsilon_2 = 12\,\text{V}$, $r_2 = 0.2\,\Omega$. זה מעגל עם מסלול אחד, וההדקים החיוביים מחוברים זה לזה, ולכן שני המקורות דוחפים בכיוונים מנוגדים.
      - kind: reasoning
        text: >-
          נסמן את הזרם בלולאה $I$, יוצא מההדק החיובי של מכשיר הטעינה ונכנס להדק החיובי של המצבר. הולכים בכיוון הזה: במכשיר מההדק השלילי לחיובי, ובמצבר מההדק החיובי לשלילי. ההתנגדות הפנימית היא נגד בתוך המקור, בטור עם הכא״מ שלו.
      - kind: formula
        text: >-
          חוק הלולאות: $\varepsilon_1 - r_1I - \varepsilon_2 - r_2I = 0$.
      - kind: substitution
        text: >-
          (א) $14 - 0.3I - 12 - 0.2I = 0$, כלומר $0.5I = 2$, ומחלקים ב-0.5: $I = 4\,\text{A}$. חיובי: הכיוון שסימנו נכון, והזרם נכנס למצבר בהדק החיובי.
      - kind: substitution
        text: >-
          (ב) עוברים במצבר מההדק השלילי לחיובי. בכא״מ הפוטנציאל עולה ב-$\varepsilon_2$, בלי קשר לכיוון הזרם. בהתנגדות הפנימית הולכים נגד הזרם, ולכן הפוטנציאל עולה עוד $4\cdot0.2$:
          $$V = 12 + 4\cdot0.2 = 12.8\ \text{V}$$
          אותה תוצאה בנוסחה של שיעור 3.6, $V = \varepsilon - Ir$. בנוסחה הזאת $I$ הוא הזרם שיוצא מההדק החיובי. כאן $4\,\text{A}$ נכנסים אליו, ולכן מציבים $-4\,\text{A}$: $V = 12 - (-4)\cdot0.2 = 12.8\,\text{V}$, גדול מ-$\varepsilon_2$. בדיקה מהצד של מכשיר הטעינה, שמחובר לאותם הדקים ושממנו $4\,\text{A}$ יוצאים: $14 - 4\cdot0.3 = 12.8\,\text{V}$.
      - kind: substitution
        text: >-
          (ג) הכא״מ של מכשיר הטעינה מספק $\varepsilon_1I = 14\cdot4 = 56\,\text{W}$. במצבר נאגרים $\varepsilon_2I = 12\cdot4 = 48\,\text{W}$. בשתי ההתנגדויות הפנימיות הופכים לחום $I^2(r_1 + r_2) = 16\cdot0.5 = 8\,\text{W}$. ואכן $48 + 8 = 56$.
      - kind: result
        text: >-
          (א) $4\,\text{A}$, נכנס להדק החיובי של המצבר.

          (ב) $V = 12.8\,\text{V}$, גבוה מהכא״מ: במצבר שנטען, מתח ההדקים גדול מהכא״מ.

          (ג) $56\,\text{W}$: $48\,\text{W}$ נאגרים ו-$8\,\text{W}$ חום.

  - id: W-3.8-07
    level: mid
    qualitative: false
    objectives: [OBJ-3.8-3]
    prompt: >-
      במעגל שני צמתים, J למעלה ו-K למטה, ושלושה ענפים ביניהם, כמו באיור של שאלה 4. בכל ענף צדדי יש למטה סוללה אידאלית, שההדק השלילי שלה מחובר ל-K וההדק החיובי פונה למעלה, ומעליה נגד עד J. בענף השמאלי $\varepsilon_1 = 12\,\text{V}$ ו-$R_1 = 3\,\Omega$. בענף הימני $\varepsilon_2 = 9\,\text{V}$ ו-$R_2 = 6\,\Omega$. בענף האמצעי יש רק נגד משתנה, $R_3$.

      (א) לאיזה ערך של $R_3$ לא עובר זרם בענף של $\varepsilon_2$?

      (ב) מגדילים את $R_3$ מעבר לערך הזה. האם $\varepsilon_2$ נטענת או מספקת אנרגיה? נמקו.
    answer: >-
      (א) $R_3 = 9\,\Omega$.

      (ב) נטענת: הפוטנציאל של J עולה מעל $9\,\text{V}$, והזרם ב-$R_2$ זורם מ-J אל ההדק החיובי של $\varepsilon_2$.
    solution:
      - kind: given
        text: >-
          $\varepsilon_1 = 12\,\text{V}$, $R_1 = 3\,\Omega$, $\varepsilon_2 = 9\,\text{V}$, $R_2 = 6\,\Omega$. נקבע את הפוטנציאל של K כאפס, ונקרא לפוטנציאל של J בשם $V_J$. ההדק החיובי של $\varepsilon_1$ ב-$12\,\text{V}$, וההדק החיובי של $\varepsilon_2$ ב-$9\,\text{V}$.
      - kind: reasoning
        text: >-
          (א) אם ב-$R_2$ לא עובר זרם, אין עליו מתח, $IR = 0$. לכן J באותו פוטנציאל כמו ההדק החיובי של $\varepsilon_2$: $V_J = 9\,\text{V}$.
      - kind: formula
        text: >-
          בכל נגד $I = \dfrac{\Delta V}{R}$. לפי חוק הצמתים, כש-$I_2 = 0$, כל הזרם של $R_1$ ממשיך אל $R_3$: $I_3 = I_1$.
      - kind: substitution
        text: >-
          $I_1 = \dfrac{12 - 9}{3} = 1\,\text{A}$, ולכן $R_3 = \dfrac{9\,\text{V}}{1\,\text{A}} = 9\,\Omega$.
      - kind: reasoning
        text: >-
          (ב) הרעיון: נגד אמצעי גדול יותר מושך פחות זרם. פחות זרם עובר ב-$R_1$, הירידה עליו קטנה, ולכן $V_J$, שהוא $12\,\text{V}$ פחות הירידה על $R_1$, עולה. כש-$V_J$ עולה מעל $9\,\text{V}$, הזרם ב-$R_2$ מתהפך.
      - kind: reasoning
        text: >-
          הוכחה: נניח שעם $R_3$ גדול מ-$9\,\Omega$ דווקא $V_J \le 9\,\text{V}$. אז ב-$R_1$ זורם אל J זרם $I_1 = \dfrac{12 - V_J}{3} \ge 1\,\text{A}$, וגם מ-$\varepsilon_2$ זורם אל J זרם שאינו שלילי, $I_2 = \dfrac{9 - V_J}{6} \ge 0$. לפי חוק הצמתים $I_3 = I_1 + I_2 \ge 1\,\text{A}$, ולכן $V_J = R_3I_3$ גדול מ-$9\,\Omega \cdot 1\,\text{A} = 9\,\text{V}$. זו סתירה. לכן $V_J$ גדול מ-$9\,\text{V}$, הזרם ב-$R_2$ זורם מ-J אל ההדק החיובי של $\varepsilon_2$, והיא נטענת.
      - kind: reasoning
        text: >-
          בדיקה מספרית: עם $R_3 = 12\,\Omega$ פתרון המשוואות נותן $I_2 \approx -0.07\,\text{A}$, כלומר זרם קטן נכנס להדק החיובי של $\varepsilon_2$. ועם $R_3 = 6\,\Omega$ יוצא $I_2 = 0.125\,\text{A}$, ו-$\varepsilon_2$ מספקת אנרגיה.
      - kind: result
        text: >-
          (א) $R_3 = 9\,\Omega$.

          (ב) ל-$R_3$ גדול מ-$9\,\Omega$ הסוללה $\varepsilon_2$ נטענת, ול-$R_3$ קטן ממנו היא מספקת אנרגיה.

  - id: W-3.8-08
    level: bagrut
    qualitative: true
    objectives: [OBJ-3.8-2, OBJ-3.8-3]
    prompt: >-
      במעגל שני צמתים, J למעלה ו-K למטה, ושלושה ענפים ביניהם, כמו באיור של שאלה 4. בענף השמאלי סוללה אידאלית $\varepsilon_1$, שההדק השלילי שלה מחובר ל-K וההדק החיובי פונה למעלה, ומעליה נגד $R_1$ עד J. בענף הימני סוללה אידאלית $\varepsilon_2$ ומעליה נגד $R_2$ עד J. בענף האמצעי יש רק נגד, $R_3$. תלמידה רוצה שלא יעבור זרם ב-$R_3$.

      (א) ההדק החיובי של $\varepsilon_2$ פונה למעלה, כמו של $\varepsilon_1$. הראו שבחיבור הזה הזרם ב-$R_3$ לא יכול להיות אפס, לכל ערכי הכא״מ וההתנגדויות.

      (ב) הופכים את $\varepsilon_2$, כך שההדק החיובי שלה מחובר ל-K. מצאו את התנאי על $\varepsilon_1$, $\varepsilon_2$, $R_1$ ו-$R_2$ שבו הזרם ב-$R_3$ הוא אפס. האם התנאי תלוי ב-$R_3$?
    answer: >-
      (א) אם $I_3 = 0$, כל אחת משתי הלולאות נותנת זרם חיובי שיוצא מההדק החיובי של הסוללה שלה אל J. שני הזרמים נכנסים ל-J, ואף זרם לא יוצא ממנו, וזה סותר את חוק הצמתים.

      (ב) $\dfrac{\varepsilon_1}{R_1} = \dfrac{\varepsilon_2}{R_2}$, בלי תלות ב-$R_3$.
    solution:
      - kind: given
        text: >-
          מסמנים $I_1$ ו-$I_2$ עולים בענפים הצדדיים אל J, ו-$I_3$ יורד דרך $R_3$. מבקשים $I_3 = 0$.
      - kind: reasoning
        text: >-
          (א) נניח ש-$I_3 = 0$. בלולאה השמאלית: $\varepsilon_1 - R_1I_1 - R_3\cdot0 = 0$, ולכן $I_1 = \dfrac{\varepsilon_1}{R_1}$, מספר חיובי. בלולאה הימנית באותו אופן: $\varepsilon_2 - R_2I_2 = 0$, ולכן $I_2 = \dfrac{\varepsilon_2}{R_2}$, גם הוא חיובי.
      - kind: reasoning
        text: >-
          שני הזרמים נכנסים ל-J, ולפי ההנחה דרך $R_3$ לא יוצא ממנו כלום. חוק הצמתים דורש $I_1 + I_2 = I_3 = 0$, אבל סכום של שני מספרים חיוביים אינו אפס. זו סתירה, ולכן בחיבור הזה $I_3 \ne 0$ תמיד.
      - kind: manipulation
        text: >-
          (ב) עכשיו, כשעולים בענף הימני מ-K, עוברים ב-$\varepsilon_2$ מההדק החיובי לשלילי, והפוטנציאל יורד ב-$\varepsilon_2$. בלולאה הימנית, עם $I_3 = 0$:
          $$-\varepsilon_2 - R_2I_2 = 0 \quad\Rightarrow\quad I_2 = -\frac{\varepsilon_2}{R_2}$$
          מהלולאה השמאלית, כמו ב-(א), $I_1 = \dfrac{\varepsilon_1}{R_1}$, ומחוק הצמתים $I_1 + I_2 = 0$, כלומר $I_2 = -I_1$. משווים:
          $$\frac{\varepsilon_1}{R_1} = \frac{\varepsilon_2}{R_2}$$
      - kind: reasoning
        text: >-
          בתנאי הזה אותו זרם מקיף את הלולאה החיצונית, ושתי הסוללות מספקות אנרגיה: בענף הימני הזרם יורד, נכנס ל-$\varepsilon_2$ בהדק השלילי ויוצא בחיובי. שני הצמתים באותו פוטנציאל, ולכן אין זרם ב-$R_3$, יהיה ערכו אשר יהיה. דוגמה: $\varepsilon_1 = 12\,\text{V}$, $R_1 = 3\,\Omega$, $\varepsilon_2 = 8\,\text{V}$, $R_2 = 2\,\Omega$: בשני הענפים $4\,\text{A}$, וב-$R_3$ אפס.
      - kind: result
        text: >-
          (א) כששני ההדקים החיוביים פונים אל J, ההנחה $I_3 = 0$ מובילה לסתירה, ולכן הזרם ב-$R_3$ אף פעם אינו אפס.

          (ב) $\dfrac{\varepsilon_1}{R_1} = \dfrac{\varepsilon_2}{R_2}$. התנאי לא תלוי ב-$R_3$.

  - id: W-3.8-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-3.8-2, OBJ-3.8-3]
    prompt: >-
      במעגל שבאיור שתי סוללות אידאליות: $\varepsilon_1 = 15\,\text{V}$ בענף השמאלי ו-$\varepsilon_2 = 6\,\text{V}$ בענף הימני, וההדקים החיוביים של שתיהן פונים למעלה. בענף השמאלי, מעל $\varepsilon_1$, נגד $R_1 = 2\,\Omega$. בענף הימני נגד $R_2 = 8\,\Omega$, **מתחת** ל-$\varepsilon_2$. בענף האמצעי נגד $R_3 = 5\,\Omega$. הנקודה X נמצאת בין ההדק החיובי של $\varepsilon_1$ ל-$R_1$, והנקודה Y בין $R_2$ להדק השלילי של $\varepsilon_2$.

