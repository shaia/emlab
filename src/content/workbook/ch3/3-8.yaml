    diagramAlt: >-
      מעגל מלבני. בצלע השמאלית סוללה של 12 וולט, ובצלע הימנית סוללה עם כא״מ אפסילון; בשתיהן הקו הארוך, הצד החיובי, למעלה. בחוט העליון הצומת J, נגד של 4 אוהם משמאלו ונגד של 5 אוהם מימינו. מ-J יורד אל החוט התחתון ענף עם נגד של 3 אוהם ומד זרם, עיגול עם האות A.
    answer: >-
      (א) $\varepsilon = 8.5\,\text{V}$.

      (ב) אילו הזרם עלה, ההדק העליון של הסוללה הימנית היה צריך להיות נמוך ב-$38.5\,\text{V}$ מההדק התחתון שלה, כלומר הקטבים שלה הפוכים לאלה שבאיור.

      (ג) מספקת: $0.5\,\text{A}$ יוצאים מההדק החיובי שלה, $8.5\cdot0.5 = 4.25\,\text{W}$.
    solution:
      - kind: given
        text: >-
          החוט התחתון מחבר את ההדקים השליליים של שתי הסוללות ואת התחתית של הענף האמצעי. נקבע את הפוטנציאל שלו כאפס, ונקרא לפוטנציאל של J בשם $V_J$. מד הזרם אידאלי, ולכן בענף האמצעי יש רק את הנגד של $3\,\Omega$. ההדק החיובי של הסוללה השמאלית ב-$12\,\text{V}$, וההדק החיובי של הימנית ב-$\varepsilon$.
      - kind: formula
        text: >-
          בכל נגד $\Delta V = IR$, והזרם זורם מהפוטנציאל הגבוה לנמוך. בצומת: $\sum I_{\text{in}} = \sum I_{\text{out}}$.
      - kind: substitution
        text: >-
          (א) $2\,\text{A}$ יורדים דרך $3\,\Omega$, ולכן J גבוה מהחוט התחתון ב-$2\cdot3 = 6\,\text{V}$: $V_J = 6\,\text{V}$. בנגד של $4\,\Omega$ זורם מההדק החיובי של הסוללה השמאלית אל J זרם של $\dfrac{12 - 6}{4} = 1.5\,\text{A}$.
      - kind: substitution
        text: >-
          חוק הצמתים ב-J: נכנסים $1.5\,\text{A}$ משמאל, ויוצאים $2\,\text{A}$ למטה, ולכן מימין נכנסים $2 - 1.5 = 0.5\,\text{A}$: הזרם בנגד של $5\,\Omega$ זורם מההדק החיובי של $\varepsilon$ אל J. בנגד הזה הפוטנציאל יורד ב-$0.5\cdot5 = 2.5\,\text{V}$, ולכן $\varepsilon - 2.5 = 6$, ו-$\varepsilon = 8.5\,\text{V}$.
      - kind: reasoning
        text: >-
          (ב) נניח שהזרם במד הזרם עולה. אז J נמוך מהחוט התחתון ב-$6\,\text{V}$: $V_J = -6\,\text{V}$. משמאל זורמים אל J $\dfrac{12 - (-6)}{4} = 4.5\,\text{A}$, ומלמטה נכנסים עוד $2\,\text{A}$, ולכן ימינה, דרך $5\,\Omega$, יוצאים $6.5\,\text{A}$. הפוטנציאל של ההדק העליון של הסוללה הימנית: $-6 - 6.5\cdot5 = -38.5\,\text{V}$, נמוך מההדק התחתון שלה, שנמצא באפס. אבל לפי האיור ההדק העליון הוא החיובי, ובסוללה הוא גבוה מהשלילי. זו סתירה, ולכן הזרם יורד.
      - kind: reasoning
        text: >-
          (ג) לפי (א), $0.5\,\text{A}$ יוצאים מההדק החיובי של $\varepsilon$: היא מספקת אנרגיה, $\varepsilon I = 8.5\cdot0.5 = 4.25\,\text{W}$. בדיקה במאזן: הסוללות מספקות $12\cdot1.5 + 4.25 = 22.25\,\text{W}$, והנגדים מקבלים $1.5^2\cdot4 + 0.5^2\cdot5 + 2^2\cdot3 = 9 + 1.25 + 12 = 22.25\,\text{W}$.
      - kind: result
        text: >-
          (א) $\varepsilon = 8.5\,\text{V}$.

          (ב) זרם כלפי מעלה מחייב סוללה ימנית הפוכה, של $38.5\,\text{V}$.

          (ג) מספקת $4.25\,\text{W}$.
