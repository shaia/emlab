    objectives: [OBJ-3.8-1, OBJ-3.8-3]
    prompt: >-
      במעגל באותו מבנה כמו באיור 3.8א: בענף השמאלי סוללה אידאלית $\varepsilon_1 = 18\,\text{V}$ ונגד $R_1 = 6\,\Omega$, בענף הימני סוללה אידאלית $\varepsilon_2 = 9\,\text{V}$ ונגד $R_2 = 3\,\Omega$, ובענף האמצעי נגד $R_3 = 2\,\Omega$ ומפסק בטור אליו. ההדקים החיוביים של שתי הסוללות פונים אל הצומת העליון, וההדקים השליליים מחוברים לצומת התחתון.

      (א) המפסק פתוח. מה הזרם במעגל? האם $\varepsilon_2$ נטענת או מספקת אנרגיה?

      (ב) סוגרים את המפסק. מצאו את הזרם בכל ענף.

      (ג) מה השתנה ב-$\varepsilon_2$ כשסגרו את המפסק? הסבירו בעזרת הפוטנציאל של הצומת העליון, וערכו מאזן הספקים בשני המצבים.
    answer: >-
      (א) $1\,\text{A}$. הזרם נכנס להדק החיובי של $\varepsilon_2$: היא נטענת, ומקבלת $9\,\text{W}$.

      (ב) $I_1 = 2\,\text{A}$ אל הצומת העליון, $I_2 = 1\,\text{A}$ יוצא מההדק החיובי של $\varepsilon_2$, ו-$I_3 = 3\,\text{A}$ יורד.

      (ג) $\varepsilon_2$ עוברת מקבלת אנרגיה למספקת: הצומת העליון יורד מ-$12\,\text{V}$ ל-$6\,\text{V}$, מתחת ל-$9\,\text{V}$. מפסק פתוח: $18\,\text{W} = 9 + 9\ \text{W}$. מפסק סגור: $36 + 9 = 24 + 3 + 18\ \text{W}$.
    solution:
      - kind: given
        text: >-
          $\varepsilon_1 = 18\,\text{V}$, $R_1 = 6\,\Omega$, $\varepsilon_2 = 9\,\text{V}$, $R_2 = 3\,\Omega$, $R_3 = 2\,\Omega$. נקבע את הפוטנציאל של הצומת התחתון כאפס. מסמנים $I_1$ ו-$I_2$ יוצאים מההדקים החיוביים אל הצומת העליון, ו-$I_3$ יורד ב-$R_3$.
      - kind: reasoning
        text: >-
          (א) כשהמפסק פתוח אין זרם בענף האמצעי, ונשאר מסלול אחד דרך שתי הסוללות, $R_1$ ו-$R_2$. ההדקים החיוביים פונים זה אל זה, ולכן הסוללות דוחפות בכיוונים מנוגדים. הולכים עם $I_1$: ב-$\varepsilon_1$ מ-− ל-+, ב-$R_1$ וב-$R_2$ עם הזרם, וב-$\varepsilon_2$ מ-+ ל-−.
      - kind: substitution
        text: >-
          $18 - 6I_1 - 3I_1 - 9 = 0$, כלומר $9I_1 = 9$, ולכן $I_1 = 1\,\text{A}$, ו-$I_2 = -1\,\text{A}$: הזרם נכנס להדק החיובי של $\varepsilon_2$, והיא מקבלת $9\cdot1 = 9\,\text{W}$.
      - kind: formula
        text: >-
          (ב) המפסק סגור: $I_1 + I_2 = I_3$, $\ 18 - 6I_1 - 2I_3 = 0$, $\ 9 - 3I_2 - 2I_3 = 0$.
      - kind: manipulation
        text: >-
          מבודדים את $I_1$ מהמשוואה השנייה: $6I_1 = 18 - 2I_3$, ומחלקים ב-6: $I_1 = 3 - \dfrac{I_3}{3}$. מהשלישית: $3I_2 = 9 - 2I_3$, ומחלקים ב-3: $I_2 = 3 - \dfrac{2I_3}{3}$. מציבים בחוק הצמתים: $6 - I_3 = I_3$, ולכן $I_3 = 3\,\text{A}$.
      - kind: substitution
        text: >-
          $I_1 = 3 - 1 = 2\,\text{A}$ ו-$I_2 = 3 - 2 = 1\,\text{A}$. בדיקה בצומת העליון: $2 + 1 = 3$.
      - kind: reasoning
        text: >-
          (ג) כשהמפסק פתוח, הצומת העליון ב-$18 - 1\cdot6 = 12\,\text{V}$, מעל ההדק החיובי של $\varepsilon_2$, שנמצא ב-$9\,\text{V}$. לכן הזרם ב-$R_2$ זורם מהצומת אל $\varepsilon_2$, והיא נטענת. כשהמפסק סגור, הענף האמצעי מושך זרם, והצומת יורד ל-$I_3R_3 = 3\cdot2 = 6\,\text{V}$, מתחת ל-$9\,\text{V}$. עכשיו הזרם ב-$R_2$ זורם מ-$\varepsilon_2$ אל הצומת, והיא מספקת אנרגיה.
      - kind: substitution
        text: >-
          מאזן הספקים. מפסק פתוח: $\varepsilon_1$ מספקת $18\cdot1 = 18\,\text{W}$; $R_1$ ו-$R_2$ מקבלים $1^2\cdot(6 + 3) = 9\,\text{W}$, ו-$\varepsilon_2$ מקבלת $9\,\text{W}$. מפסק סגור: $\varepsilon_1$ מספקת $18\cdot2 = 36\,\text{W}$ ו-$\varepsilon_2$ מספקת $9\cdot1 = 9\,\text{W}$, יחד $45\,\text{W}$; הנגדים מקבלים $2^2\cdot6 = 24\,\text{W}$, $1^2\cdot3 = 3\,\text{W}$ ו-$3^2\cdot2 = 18\,\text{W}$, יחד $45\,\text{W}$.
      - kind: result
        text: >-
          (א) $1\,\text{A}$; $\varepsilon_2$ נטענת.

          (ב) $I_1 = 2\,\text{A}$, $I_2 = 1\,\text{A}$, $I_3 = 3\,\text{A}$.

          (ג) סגירת המפסק מורידה את הצומת העליון מ-$12\,\text{V}$ ל-$6\,\text{V}$, ו-$\varepsilon_2$ עוברת מקבלת $9\,\text{W}$ למספקת $9\,\text{W}$. בשני המצבים ההספק שהסוללות מספקות שווה להספק שהרכיבים מקבלים.

challenge:
  - id: W-3.8-c1
    stars: 1
    objectives: [OBJ-3.8-1, OBJ-3.8-3]
    prompt: >-
      במעגל שבאיור, בצלע השמאלית סוללה אידאלית של $12\,\text{V}$, ובצלע הימנית סוללה אידאלית שהכא״מ שלה $\varepsilon$ לא ידוע. ההדקים החיוביים של שתיהן פונים למעלה. בחוט העליון, בין הסוללה השמאלית לצומת, נגד של $4\,\Omega$, ובין הצומת לסוללה הימנית נגד של $5\,\Omega$. מהצומת יורד אל החוט התחתון ענף עם נגד של $3\,\Omega$ ומד זרם אידאלי, והוא מראה $2.0\,\text{A}$.

      (א) הזרם במד הזרם זורם כלפי מטה. מצאו את $\varepsilon$.

      (ב) הראו שעם הקטבים שבאיור, הזרם במד הזרם לא יכול לזרום כלפי מעלה.

      (ג) האם הסוללה $\varepsilon$ מספקת אנרגיה או מקבלת? כמה?
