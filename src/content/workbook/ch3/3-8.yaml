      (ג) $37.5\,\text{W} = 12.5 + 2 + 20 + 3\ \text{W}$.
    solution:
      - kind: given
        text: >-
          $\varepsilon_1 = 15\,\text{V}$, $R_1 = 2\,\Omega$, $\varepsilon_2 = 6\,\text{V}$, $R_2 = 8\,\Omega$, $R_3 = 5\,\Omega$. נקבע את הפוטנציאל של הצומת התחתון כאפס. מסמנים $I_1$ ו-$I_2$ עולים בענפים הצדדיים אל הצומת העליון, ו-$I_3$ יורד ב-$R_3$. ענף הוא מסלול אחד בטור, ולכן הסדר של הרכיבים בו לא משנה את הזרם שלו.
      - kind: formula
        text: >-
          חוק הצמתים: $I_1 + I_2 = I_3$. חוק הלולאות בלולאה השמאלית: $\varepsilon_1 - R_1I_1 - R_3I_3 = 0$. בלולאה הימנית, מהצומת התחתון למעלה, דרך $R_2$ עם $I_2$, דרך $\varepsilon_2$ מ-− ל-+, ולמטה דרך $R_3$: $-R_2I_2 + \varepsilon_2 - R_3I_3 = 0$.
      - kind: substitution
        text: >-
          (א)
          $$15 - 2I_1 - 5I_3 = 0 \qquad\qquad 6 - 8I_2 - 5I_3 = 0$$
          מחלקים את הראשונה ב-2 ואת השנייה ב-8: $I_1 = 7.5 - 2.5I_3$ ו-$I_2 = 0.75 - 0.625I_3$. מציבים בחוק הצמתים: $8.25 - 3.125I_3 = I_3$, כלומר $4.125I_3 = 8.25$, ולכן $I_3 = 2\,\text{A}$. מכאן $I_1 = 7.5 - 5 = 2.5\,\text{A}$ ו-$I_2 = 0.75 - 1.25 = -0.5\,\text{A}$.
      - kind: reasoning
        text: >-
          $I_2$ שלילי: בענף הימני $0.5\,\text{A}$ יורדים מהצומת העליון, נכנסים להדק החיובי של $\varepsilon_2$, יוצאים מההדק השלילי שלה ב-Y, וממשיכים דרך $R_2$ אל הצומת התחתון.
      - kind: substitution
        text: >-
          (ב) X הוא ההדק החיובי של $\varepsilon_1$, שההדק השלילי שלה בצומת התחתון: $V_X = 15\,\text{V}$. מהצומת התחתון עולים אל Y דרך $R_2$, נגד הזרם האמיתי, ולכן הפוטנציאל עולה ב-$0.5\cdot8 = 4\,\text{V}$: $V_Y = 4\,\text{V}$. בדיקה בדרך אחרת: הצומת העליון ב-$15 - 2.5\cdot2 = 10\,\text{V}$, ומשם יורדים דרך $\varepsilon_2$ מ-+ ל-−: $10 - 6 = 4\,\text{V}$. מד המתח מראה $V_X - V_Y = 15 - 4 = 11\,\text{V}$.
      - kind: substitution
        text: >-
          (ג) $\varepsilon_1$ מספקת $15\cdot2.5 = 37.5\,\text{W}$. הנגדים מקבלים $2.5^2\cdot2 = 12.5\,\text{W}$, $0.5^2\cdot8 = 2\,\text{W}$ ו-$2^2\cdot5 = 20\,\text{W}$, ו-$\varepsilon_2$ מקבלת $6\cdot0.5 = 3\,\text{W}$. הסכום: $12.5 + 2 + 20 + 3 = 37.5\,\text{W}$.
      - kind: result
        text: >-
          (א) $I_1 = 2.5\,\text{A}$ עולה, $I_3 = 2\,\text{A}$ יורד, ובענף הימני $0.5\,\text{A}$ יורד, אל ההדק החיובי של $\varepsilon_2$.

          (ב) $11\,\text{V}$, X גבוהה יותר.

          (ג) $37.5\,\text{W}$ שווה לסכום.

  - id: W-3.8-10
