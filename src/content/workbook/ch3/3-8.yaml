  - id: W-3.8-c2
    stars: 2
    objectives: [OBJ-3.8-1, OBJ-3.8-2, OBJ-3.8-3]
    prompt: >-
      במעגל שבאיור שמונה נגדים של $1\,\Omega$ כל אחד, $R_1$ עד $R_8$, ושתי סוללות אידאליות, $\varepsilon_1 = 12\,\text{V}$ ו-$\varepsilon_2 = 6\,\text{V}$. ארבעה נגדים, $R_6$, $R_7$, $R_8$ ו-$R_5$, יוצרים מעוין שקודקודיו A (שמאל), T (למעלה), D (ימין) ו-B (למטה). הנקודה O במרכז מחוברת ל-T דרך $R_2$ ול-B דרך $R_4$. בין A ל-O: הסוללה $\varepsilon_2$, שההדק החיובי שלה פונה אל A, ואחריה $R_3$. בין O ל-D: הסוללה $\varepsilon_1$, שההדק החיובי שלה פונה אל O, ואחריה $R_1$.

      (א) הסבירו למה ל-T ול-B אותו פוטנציאל.

      (ב) מצאו את גודל הזרם ואת כיוונו בנגדים $R_1$, $R_2$, $R_3$ ו-$R_5$.

      (ג) האם אחת הסוללות נטענת?
