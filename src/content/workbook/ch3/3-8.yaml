# Workbook, lesson 3.8 (Kirchhoff's laws). Format and rules: see .claude/CLAUDE.md, "Worked examples, workbook".
# Every circuit number was recomputed with solveCircuit from src/physics/circuits.ts. Sign convention, as in the lesson:
# a side-branch current is marked from the battery's + terminal toward the top junction, so a negative value means the
# current enters that + terminal (the battery is being charged); a terminal voltage is V = ε − Ir with that same I.
# In a >- block, consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '3.8'
practice:
  - id: W-3.8-01
    level: basic
    qualitative: false
    objectives: [OBJ-3.8-1]
    prompt: >-
      במעגל יש שני צמתים, P למעלה ו-Q למטה, ושלושה ענפים מחברים ביניהם. בכל ענף יש מד זרם אידאלי. מד הזרם בענף השמאלי מראה $1.2\,\text{A}$, והזרם בו עולה מ-Q אל P. מד הזרם בענף האמצעי מראה $0.5\,\text{A}$, והזרם בו יורד מ-P אל Q.

      (א) מה מראה מד הזרם בענף הימני, ולאיזה כיוון זורם בו הזרם?

      (ב) כתבו את חוק הצמתים בצומת Q, ובדקו שהוא מתקיים.
    answer: >-
      (א) $0.7\,\text{A}$, יורד מ-P אל Q.

      (ב) נכנסים ל-Q $0.5 + 0.7 = 1.2\,\text{A}$, ויוצאים ממנו $1.2\,\text{A}$ בענף השמאלי.
    solution:
      - kind: given
        text: >-
          אל P נכנס $1.2\,\text{A}$ מהענף השמאלי. מ-P יוצא $0.5\,\text{A}$ בענף האמצעי. את הזרם בענף הימני נסמן $I$, ונבחר אותו יוצא מ-P, כלומר יורד אל Q.
      - kind: formula
        text: >-
          חוק הצמתים: $\sum I_{\text{in}} = \sum I_{\text{out}}$.
      - kind: substitution
        text: >-
          (א) ב-P: $1.2 = 0.5 + I$, ולכן $I = 1.2 - 0.5 = 0.7\,\text{A}$. התוצאה חיובית, ולכן הכיוון שבחרנו נכון: הזרם יורד.
      - kind: reasoning
        text: >-
          (ב) אל Q נכנסים $0.5\,\text{A}$ מהענף האמצעי ו-$0.7\,\text{A}$ מהימני. בענף השמאלי הזרם עולה מ-Q אל P, כלומר יוצא מ-Q: $1.2\,\text{A}$. ואכן $0.5 + 0.7 = 1.2$.
          זו אותה משוואה כמו ב-P: מה שיוצא מ-P בשני ענפים מגיע ל-Q ויוצא ממנו בענף השלישי, כי המטען לא מצטבר באף צומת.
      - kind: result
        text: >-
          (א) $0.7\,\text{A}$, מ-P אל Q.

          (ב) ב-Q: נכנסים $1.2\,\text{A}$ ויוצאים $1.2\,\text{A}$.

  - id: W-3.8-02
    level: basic
    qualitative: true
    objectives: [OBJ-3.8-2]
    prompt: >-
      שתי תלמידות כותבות את חוק הלולאות לאותה לולאה, עם אותו סימון של הזרמים. מאיה הולכת סביב הלולאה עם כיוון השעון, ונועה הולכת נגד כיוון השעון ומתחילה מנקודה אחרת.

      (א) מה הקשר בין המשוואה של מאיה למשוואה של נועה?

      (ב) האם הן יקבלו אותם זרמים? נמקו.
    answer: >-
      (א) כל איבר אצל נועה הוא האיבר של מאיה עם סימן הפוך: המשוואה של נועה היא המשוואה של מאיה כפול $(-1)$. נקודת ההתחלה משנה רק את סדר האיברים.

      (ב) כן. כפל משוואה ב-$(-1)$ לא משנה את הפתרון שלה.
    solution:
      - kind: reasoning
        text: >-
          (א) בסוללה, מי שהולכת מ-− ל-+ רושמת עלייה $+\varepsilon$, ומי שעוברת באותה סוללה בכיוון ההפוך הולכת מ-+ ל-− ורושמת $-\varepsilon$. בנגד, מי שהולכת עם הזרם המסומן רושמת $-IR$, ומי שהולכת נגדו רושמת $+IR$. לכן כל שינוי בפוטנציאל אצל נועה הוא השינוי של מאיה עם סימן הפוך.
      - kind: reasoning
        text: >-
          נקודת ההתחלה קובעת רק את הסדר שבו מחברים את האיברים, וסדר החיבור לא משנה את הסכום. מכל נקודה שמתחילים בה, לולאה סגורה חוזרת אליה.
      - kind: manipulation
        text: >-
          דוגמה: לולאה עם סוללה $\varepsilon$ ושני נגדים, והזרם $I$ מסומן עם כיוון השעון. מאיה רושמת $\varepsilon - IR_1 - IR_2 = 0$. נועה עוברת ב-$R_2$ וב-$R_1$ נגד הזרם ובסוללה מ-+ ל-−:
          $$IR_2 + IR_1 - \varepsilon = 0$$
          וזו בדיוק המשוואה של מאיה, כפול $(-1)$.
      - kind: result
        text: >-
          (א) המשוואות זהות עד כדי סימן.

          (ב) הפתרונות זהים: אותם זרמים, עם אותם סימנים. כיוון ההליכה שייך רק לכתיבת המשוואה, ואילו כיוון הזרמים נקבע בסימון שלהם.

  - id: W-3.8-03
    level: basic
    qualitative: false
    objectives: [OBJ-3.8-2]
    prompt: >-
      במעגל עם מסלול אחד יוצאים מהנקודה A ועוברים לפי הסדר: סוללה אידאלית $\varepsilon_1 = 10\,\text{V}$, מההדק השלילי שלה, שנמצא ב-A, אל ההדק החיובי שלה, בנקודה B; נגד $R_1 = 2\,\Omega$ עד הנקודה C; סוללה אידאלית $\varepsilon_2 = 4\,\text{V}$, שההדק החיובי שלה פונה אל C, עד הנקודה D; ונגד $R_2 = 1\,\Omega$, בחזרה אל A.

      (א) מה הזרם במעגל, ובאיזה כיוון הוא זורם?

      (ב) בחרו את הפוטנציאל של A להיות אפס, ומצאו את הפוטנציאלים של B, של C ושל D. תארו את גרף הגובה של הלולאה.
    answer: >-
      (א) $2\,\text{A}$, בכיוון A, B, C, D (דרך $\varepsilon_1$ מ-− ל-+).

      (ב) $V_B = 10\,\text{V}$, $V_C = 6\,\text{V}$, $V_D = 2\,\text{V}$, ובחזרה ל-A: $0$.
    solution:
      - kind: given
        text: >-
          $\varepsilon_1 = 10\,\text{V}$, $\varepsilon_2 = 4\,\text{V}$, $R_1 = 2\,\Omega$, $R_2 = 1\,\Omega$. במעגל עם מסלול אחד זורם זרם אחד, $I$.
      - kind: reasoning
        text: >-
          נסמן את $I$ בכיוון A, B, C, D, כלומר יוצא מההדק החיובי של $\varepsilon_1$. ההדקים החיוביים של שתי הסוללות פונים זה אל זה (דרך $R_1$), ולכן הן דוחפות בכיוונים מנוגדים. בכיוון ההליכה הזה עוברים ב-$\varepsilon_2$ מ-+ ל-−.
      - kind: formula
        text: >-
          חוק הלולאות, $\sum\Delta V = 0$: בסוללה מ-− ל-+ עלייה $+\varepsilon$, ומ-+ ל-− ירידה $-\varepsilon$. בנגד בכיוון הזרם ירידה $-IR$.
      - kind: substitution
        text: >-
          (א) $10 - 2I - 4 - 1\cdot I = 0$, כלומר $3I = 6$, ומחלקים ב-3: $I = 2\,\text{A}$. התוצאה חיובית, ולכן הכיוון שסימנו נכון.
      - kind: substitution
        text: >-
          (ב) הולכים מ-A לאורך הלולאה ומוסיפים כל שינוי:
          $$V_B = 0 + 10 = 10\ \text{V} \qquad V_C = 10 - 2\cdot2 = 6\ \text{V} \qquad V_D = 6 - 4 = 2\ \text{V}$$
          ובחזרה ל-A: $2 - 2\cdot1 = 0$, כמו שחוק הלולאות דורש.
      - kind: reasoning
        text: >-
          גרף הגובה: עלייה של $10\,\text{V}$ ב-$\varepsilon_1$, ירידה של $4\,\text{V}$ ב-$R_1$, ירידה של $4\,\text{V}$ ב-$\varepsilon_2$ וירידה של $2\,\text{V}$ ב-$R_2$, חזרה לאפס. הזרם נכנס להדק החיובי של $\varepsilon_2$, ולכן היא מקבלת אנרגיה.
      - kind: result
        text: >-
          (א) $I = 2\,\text{A}$, יוצא מההדק החיובי של $\varepsilon_1$ אל $R_1$.

          (ב) $V_B = 10\,\text{V}$, $V_C = 6\,\text{V}$, $V_D = 2\,\text{V}$.

  - id: W-3.8-04
    level: mid
    qualitative: false
    objectives: [OBJ-3.8-1, OBJ-3.8-2]
    prompt: >-
      במעגל באותו מבנה כמו באיור 3.8א: בענף השמאלי סוללה אידאלית $\varepsilon_1 = 12\,\text{V}$ ונגד $R_1 = 2\,\Omega$, בענף הימני סוללה אידאלית $\varepsilon_2 = 15\,\text{V}$ ונגד $R_2$ שההתנגדות שלו לא ידועה, ובענף האמצעי נגד $R_3 = 3\,\Omega$. ההדקים החיוביים של שתי הסוללות פונים אל הצומת העליון. מד זרם אידאלי בענף האמצעי מראה $3\,\text{A}$, והזרם בו יורד.

      (א) מה הזרם בענף השמאלי, ובאיזה כיוון?

      (ב) מה הזרם בענף הימני, ובאיזה כיוון?

      (ג) מה ההתנגדות $R_2$?
    answer: >-
      (א) $1.5\,\text{A}$, מההדק החיובי של $\varepsilon_1$ אל הצומת העליון.

      (ב) $1.5\,\text{A}$, מההדק החיובי של $\varepsilon_2$ אל הצומת העליון.

      (ג) $R_2 = 4\,\Omega$.
    solution:
      - kind: given
        text: >-
          $\varepsilon_1 = 12\,\text{V}$, $R_1 = 2\,\Omega$, $\varepsilon_2 = 15\,\text{V}$, $R_3 = 3\,\Omega$, $I_3 = 3\,\text{A}$ כלפי מטה. נסמן את $I_1$ ואת $I_2$ יוצאים מההדקים החיוביים אל הצומת העליון.
      - kind: formula
        text: >-
          חוק הלולאות בלולאה השמאלית, מההדק השלילי של $\varepsilon_1$ ודרך $R_3$: $\varepsilon_1 - R_1I_1 - R_3I_3 = 0$. בלולאה הזאת רק $I_1$ לא ידוע, ולכן מתחילים בה.
      - kind: substitution
        text: >-
          (א) $12 - 2I_1 - 3\cdot3 = 0$, כלומר $2I_1 = 3$, ולכן $I_1 = 1.5\,\text{A}$. חיובי: הזרם יוצא מההדק החיובי של $\varepsilon_1$.
      - kind: substitution
        text: >-
          (ב) חוק הצמתים בצומת העליון: $I_1 + I_2 = I_3$, ולכן $I_2 = 3 - 1.5 = 1.5\,\text{A}$. חיובי: גם $\varepsilon_2$ מספקת אנרגיה.
      - kind: substitution
        text: >-
          (ג) חוק הלולאות בלולאה הימנית: $\varepsilon_2 - R_2I_2 - R_3I_3 = 0$, כלומר $15 - 1.5R_2 - 9 = 0$. מעבירים אגפים: $1.5R_2 = 6$, ומחלקים ב-1.5 כדי לבודד את $R_2$: $R_2 = 4\,\Omega$.
      - kind: result
        text: >-
          (א) $I_1 = 1.5\,\text{A}$, אל הצומת העליון.

          (ב) $I_2 = 1.5\,\text{A}$, אל הצומת העליון.

          (ג) $R_2 = 4\,\Omega$.

  - id: W-3.8-05
    level: mid
    qualitative: true
    objectives: [OBJ-3.8-3]
    prompt: >-
      במעגל באותו מבנה כמו באיור 3.8א, שתי הסוללות זהות, $\varepsilon_1 = \varepsilon_2 = \varepsilon$, ושני הנגדים בענפים הצדדיים זהים, $R_1 = R_2 = R$. בענף האמצעי נגד $R_3$. ההדקים החיוביים של הסוללות פונים אל הצומת העליון.

      (א) בלי לפתור משוואות, קבעו ונמקו: מה היחס בין הזרם בענף השמאלי לזרם בענף הימני? האם אחת הסוללות נטענת?

      (ב) מחליפים את $\varepsilon_2$ בסוללה שהכא״מ שלה קטן מעט יותר. תלמיד טוען: ״עכשיו הסוללה החזקה טוענת את החלשה״. קבעו ונמקו אם הוא צודק.
    answer: >-
      (א) הזרמים שווים, ושתי הסוללות מספקות אנרגיה. אף אחת מהן לא נטענת.

      (ב) לא בהכרח. $\varepsilon_2$ נטענת רק אם הפוטנציאל של הצומת העליון גבוה מהכא״מ שלה. כשההפרש בין הסוללות קטן, היא עדיין מספקת אנרגיה, רק פחות.
    solution:
      - kind: reasoning
        text: >-
          (א) שני הענפים הצדדיים זהים: אותה סוללה ואותו נגד, בין אותם שני צמתים. שום דבר במעגל לא מבחין ביניהם, ולכן גם הזרמים בהם שווים: $I_1 = I_2 = I$. לפי חוק הצמתים, $I_3 = 2I$.
      - kind: reasoning
        text: >-
          הסימן של $I$: חוק הלולאות בלולאה השמאלית נותן $\varepsilon - RI - R_3\cdot2I = 0$, כלומר $I = \dfrac{\varepsilon}{R + 2R_3}$, מספר חיובי. לכן בשני הענפים הזרם יוצא מההדק החיובי, ושתי הסוללות מספקות אנרגיה.
      - kind: reasoning
        text: >-
          (ב) מי טוען את מי קובע הפוטנציאל של הצומת העליון (הצעד האחרון באיור 3.8א). במעגל הסימטרי הזרם בענף הימני זורם מההדק החיובי של $\varepsilon_2$ דרך $R_2$ אל הצומת, ולכן הצומת נמוך מ-$\varepsilon$ ב-$RI$. כשמקטינים מעט את $\varepsilon_2$, הפוטנציאל של הצומת משתנה רק מעט, ונשאר מתחת לכא״מ של $\varepsilon_2$. הזרם ב-$R_2$ קטן, אבל עדיין יוצא מההדק החיובי.
      - kind: reasoning
        text: >-
          דוגמה מספרית: $\varepsilon = 6\,\text{V}$, $R = 2\,\Omega$, $R_3 = 4\,\Omega$. במעגל הסימטרי $I_1 = I_2 = 0.6\,\text{A}$. עם $\varepsilon_2 = 5.5\,\text{V}$ פתרון המשוואות נותן $I_1 = 0.7\,\text{A}$ ו-$I_2 = 0.45\,\text{A}$: $\varepsilon_2$ עדיין מספקת אנרגיה, והצומת העליון ב-$4.6\,\text{V}$, מתחת ל-$5.5\,\text{V}$. רק כשהכא״מ של $\varepsilon_2$ יורד מתחת לפוטנציאל של הצומת, הזרם בה מתהפך.
      - kind: result
        text: >-
          (א) $I_1 = I_2$, ושתי הסוללות מספקות אנרגיה.

          (ב) הוא לא צודק: הבדל קטן בכא״מ מקטין את הזרם של $\varepsilon_2$ אבל לא הופך אותו. סוללה נטענת רק כשהפוטנציאל של הצומת שהיא מחוברת אליו גבוה מהכא״מ שלה.

  - id: W-3.8-06
    level: mid
    qualitative: false
    objectives: [OBJ-3.8-2, OBJ-3.8-3]
    prompt: >-
      מכשיר טעינה הוא מקור עם כא״מ $\varepsilon_1 = 14\,\text{V}$ והתנגדות פנימית $r_1 = 0.3\,\Omega$. מחברים אותו למצבר של רכב, שהכא״מ שלו $\varepsilon_2 = 12\,\text{V}$ וההתנגדות הפנימית שלו $r_2 = 0.2\,\Omega$: הדק חיובי לחיובי ושלילי לשלילי, בכבלים שההתנגדות שלהם זניחה.

      (א) מה הזרם, ובאיזה כיוון הוא עובר במצבר?

      (ב) מה מתח ההדקים של המצבר? השוו אותו לכא״מ שלו.

      (ג) מה ההספק שהכא״מ של מכשיר הטעינה מספק? כמה ממנו נאגר במצבר כאנרגיה כימית, וכמה הופך לחום?
    answer: >-
      (א) $4\,\text{A}$. במצבר הזרם נכנס בהדק החיובי ויוצא בשלילי: המצבר נטען.

      (ב) $12.8\,\text{V}$, יותר מהכא״מ של המצבר.

      (ג) $56\,\text{W}$. נאגרים $48\,\text{W}$, ו-$8\,\text{W}$ הופכים לחום.
    solution:
      - kind: given
        text: >-
          $\varepsilon_1 = 14\,\text{V}$, $r_1 = 0.3\,\Omega$, $\varepsilon_2 = 12\,\text{V}$, $r_2 = 0.2\,\Omega$. זה מעגל עם מסלול אחד, וההדקים החיוביים מחוברים זה לזה, ולכן שני המקורות דוחפים בכיוונים מנוגדים.
      - kind: reasoning
        text: >-
          נסמן את הזרם $I$ יוצא מההדק החיובי של מכשיר הטעינה ונכנס להדק החיובי של המצבר. הולכים בכיוון הזה: במכשיר מ-− ל-+, ובמצבר מ-+ ל-−. ההתנגדות הפנימית היא נגד בתוך המקור, בטור עם הכא״מ שלו.
      - kind: formula
        text: >-
          חוק הלולאות: $\varepsilon_1 - r_1I - \varepsilon_2 - r_2I = 0$.
      - kind: substitution
        text: >-
          (א) $14 - 0.3I - 12 - 0.2I = 0$, כלומר $0.5I = 2$, ומחלקים ב-0.5: $I = 4\,\text{A}$. חיובי: הכיוון שסימנו נכון, והזרם נכנס למצבר בהדק החיובי.
      - kind: substitution
        text: >-
          (ב) עוברים במצבר מההדק השלילי לחיובי, נגד הזרם: הפוטנציאל עולה ב-$\varepsilon_2$, ובהתנגדות הפנימית, נגד הזרם, עולה עוד $r_2I$:
          $$V = 12 + 0.2\cdot4 = 12.8\ \text{V}$$
          באותה נוסחה של שיעור 3.6, $V = \varepsilon - Ir$, כש-$I$ הוא הזרם שיוצא מההדק החיובי, כאן $I = -4\,\text{A}$: $V = 12 - (-4)\cdot0.2 = 12.8\,\text{V}$. בדיקה מהצד של מכשיר הטעינה, שמחובר לאותם הדקים: $14 - 4\cdot0.3 = 12.8\,\text{V}$.
      - kind: substitution
        text: >-
          (ג) הכא״מ של מכשיר הטעינה מספק $\varepsilon_1I = 14\cdot4 = 56\,\text{W}$. במצבר נאגרים $\varepsilon_2I = 12\cdot4 = 48\,\text{W}$. בשתי ההתנגדויות הפנימיות הופכים לחום $I^2(r_1 + r_2) = 16\cdot0.5 = 8\,\text{W}$. ואכן $48 + 8 = 56$.
      - kind: result
        text: >-
          (א) $I = 4\,\text{A}$, נכנס להדק החיובי של המצבר.

          (ב) $V = 12.8\,\text{V}$, גבוה מהכא״מ: כך נראה מצבר שנטען.

          (ג) $56\,\text{W}$: $48\,\text{W}$ נאגרים ו-$8\,\text{W}$ חום.

  - id: W-3.8-07
    level: mid
    qualitative: false
    objectives: [OBJ-3.8-3]
    prompt: >-
      במעגל באותו מבנה כמו באיור 3.8א: בענף השמאלי סוללה אידאלית $\varepsilon_1 = 12\,\text{V}$ ונגד $R_1 = 3\,\Omega$, בענף הימני סוללה אידאלית $\varepsilon_2 = 9\,\text{V}$ ונגד $R_2 = 6\,\Omega$, ובענף האמצעי נגד משתנה $R_3$. ההדקים החיוביים של שתי הסוללות פונים אל הצומת העליון, וההדקים השליליים מחוברים לצומת התחתון.

      (א) לאיזה ערך של $R_3$ לא עובר זרם בענף של $\varepsilon_2$?

      (ב) מגדילים את $R_3$ מעבר לערך הזה. האם $\varepsilon_2$ נטענת או מספקת אנרגיה? נמקו.
    answer: >-
      (א) $R_3 = 9\,\Omega$.

      (ב) נטענת: הפוטנציאל של הצומת העליון עולה מעל $9\,\text{V}$, והזרם ב-$R_2$ זורם מהצומת אל ההדק החיובי של $\varepsilon_2$.
    solution:
      - kind: given
        text: >-
          $\varepsilon_1 = 12\,\text{V}$, $R_1 = 3\,\Omega$, $\varepsilon_2 = 9\,\text{V}$, $R_2 = 6\,\Omega$. נקבע את הפוטנציאל של הצומת התחתון כאפס. אז ההדק החיובי של $\varepsilon_1$ ב-$12\,\text{V}$, וההדק החיובי של $\varepsilon_2$ ב-$9\,\text{V}$.
      - kind: reasoning
        text: >-
          (א) אם ב-$R_2$ לא עובר זרם, אין עליו מתח, $IR = 0$. לכן הצומת העליון באותו פוטנציאל כמו ההדק החיובי של $\varepsilon_2$: $9\,\text{V}$.
      - kind: formula
        text: >-
          בכל נגד $I = \dfrac{\Delta V}{R}$. לפי חוק הצמתים, כש-$I_2 = 0$, כל הזרם של $R_1$ ממשיך אל $R_3$: $I_3 = I_1$.
      - kind: substitution
        text: >-
          $I_1 = \dfrac{12 - 9}{3} = 1\,\text{A}$, ולכן $R_3 = \dfrac{9\,\text{V}}{1\,\text{A}} = 9\,\Omega$.
      - kind: reasoning
        text: >-
          (ב) נראה שעם $R_3$ גדול מ-$9\,\Omega$ הצומת העליון חייב להיות מעל $9\,\text{V}$. נניח שהוא לא, כלומר $V \le 9\,\text{V}$. אז ב-$R_1$ זורם אל הצומת $I_1 = \dfrac{12 - V}{3} \ge 1\,\text{A}$, וגם מ-$\varepsilon_2$ זורם אל הצומת זרם שאינו שלילי, $I_2 = \dfrac{9 - V}{6} \ge 0$. לפי חוק הצמתים $I_3 = I_1 + I_2 \ge 1\,\text{A}$, ולכן $V = R_3I_3$ גדול מ-$9\,\Omega \cdot 1\,\text{A} = 9\,\text{V}$. זו סתירה. לכן $V$ גדול מ-$9\,\text{V}$, הזרם ב-$R_2$ זורם מהצומת אל ההדק החיובי של $\varepsilon_2$, והיא נטענת.
      - kind: reasoning
        text: >-
          בדיקה מספרית: עם $R_3 = 12\,\Omega$ פתרון המשוואות נותן $I_2 \approx -0.07\,\text{A}$, כלומר זרם קטן נכנס להדק החיובי של $\varepsilon_2$. ועם $R_3 = 6\,\Omega$ יוצא $I_2 = 0.125\,\text{A}$, ו-$\varepsilon_2$ מספקת אנרגיה.
      - kind: result
        text: >-
          (א) $R_3 = 9\,\Omega$.

          (ב) ל-$R_3$ גדול מ-$9\,\Omega$ הסוללה $\varepsilon_2$ נטענת, ול-$R_3$ קטן ממנו היא מספקת אנרגיה.

  - id: W-3.8-08
    level: bagrut
    qualitative: true
    objectives: [OBJ-3.8-2, OBJ-3.8-3]
    prompt: >-
      במעגל באותו מבנה כמו באיור 3.8א, עם סוללות אידאליות $\varepsilon_1$ ו-$\varepsilon_2$ ונגדים $R_1$, $R_2$ ו-$R_3$, תלמידה רוצה שלא יעבור זרם בנגד האמצעי $R_3$.

      (א) ההדקים החיוביים של שתי הסוללות פונים אל הצומת העליון. הראו שבחיבור הזה הזרם ב-$R_3$ לא יכול להיות אפס, לכל ערכי הכא״מ וההתנגדויות.

      (ב) הופכים את $\varepsilon_2$, כך שההדק החיובי שלה פונה אל הצומת התחתון. מצאו את התנאי על $\varepsilon_1$, $\varepsilon_2$, $R_1$ ו-$R_2$ שבו הזרם ב-$R_3$ הוא אפס. האם התנאי תלוי ב-$R_3$?
    answer: >-
      (א) אם $I_3 = 0$, שני הצמתים באותו פוטנציאל. הזרם של $\varepsilon_1$ חייב אז לרדת בענף הימני דרך $R_2$ ודרך $\varepsilon_2$ מ-+ ל-−, ובשני הרכיבים הפוטנציאל יורד. ירידה כוללת חיובית בין שני צמתים באותו פוטנציאל היא סתירה.

      (ב) $\dfrac{\varepsilon_1}{R_1} = \dfrac{\varepsilon_2}{R_2}$, בלי תלות ב-$R_3$.
    solution:
      - kind: given
        text: >-
          מסמנים $I_1$ ו-$I_2$ עולים בענפים הצדדיים אל הצומת העליון, ו-$I_3$ יורד דרך $R_3$. מבקשים $I_3 = 0$.
      - kind: reasoning
        text: >-
          (א) אם $I_3 = 0$, אין מתח על $R_3$, ולכן שני הצמתים באותו פוטנציאל. בלולאה השמאלית: $\varepsilon_1 - R_1I_1 = 0$, כלומר $I_1 = \dfrac{\varepsilon_1}{R_1}$, זרם חיובי שעולה אל הצומת העליון. לפי חוק הצמתים $I_2 = -I_1$: אותו זרם יורד בענף הימני, דרך $R_2$ ואחר כך דרך $\varepsilon_2$ מההדק החיובי לשלילי.
      - kind: reasoning
        text: >-
          הולכים בענף הימני מהצומת העליון למטה, עם הזרם: ב-$R_2$ הפוטנציאל יורד ב-$R_2|I_2|$, וב-$\varepsilon_2$, מ-+ ל-−, הוא יורד עוד $\varepsilon_2$. הצומת התחתון היה צריך להיות נמוך מהעליון ב-$R_2|I_2| + \varepsilon_2$, מספר חיובי. אבל שני הצמתים באותו פוטנציאל. זו סתירה, ולכן בחיבור הזה $I_3 \ne 0$ תמיד.
      - kind: manipulation
        text: >-
          (ב) עכשיו בענף הימני, כשעולים מהצומת התחתון, עוברים ב-$\varepsilon_2$ מ-+ ל-−. בלולאה הימנית, עם $I_3 = 0$:
          $$-\varepsilon_2 - R_2I_2 = 0 \quad\Rightarrow\quad I_2 = -\frac{\varepsilon_2}{R_2}$$
          מהלולאה השמאלית, כמו ב-(א), $I_1 = \dfrac{\varepsilon_1}{R_1}$, ומחוק הצמתים $I_2 = -I_1$. משווים:
          $$\frac{\varepsilon_1}{R_1} = \frac{\varepsilon_2}{R_2}$$
      - kind: reasoning
        text: >-
          בתנאי הזה אותו זרם מקיף את הלולאה החיצונית, ושתי הסוללות מספקות אנרגיה: בענף הימני הזרם יורד, נכנס ל-$\varepsilon_2$ בהדק השלילי ויוצא בחיובי. שני הצמתים באותו פוטנציאל, ולכן אין זרם ב-$R_3$, יהיה ערכו אשר יהיה. דוגמה: $\varepsilon_1 = 12\,\text{V}$, $R_1 = 3\,\Omega$, $\varepsilon_2 = 8\,\text{V}$, $R_2 = 2\,\Omega$: בשני הענפים $4\,\text{A}$, וב-$R_3$ אפס.
      - kind: result
        text: >-
          (א) כשההדקים החיוביים פונים לאותו צומת, $I_3 = 0$ מוביל לסתירה, ולכן הזרם ב-$R_3$ אף פעם אינו אפס.

          (ב) $\dfrac{\varepsilon_1}{R_1} = \dfrac{\varepsilon_2}{R_2}$. התנאי לא תלוי ב-$R_3$.

