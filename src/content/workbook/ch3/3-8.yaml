      מעוין של ארבעה נגדים: R6 מהקודקוד השמאלי A אל העליון T, R7 מ-T אל הימני D, R8 מ-D אל התחתון B, ו-R5 מ-B אל A. מהנקודה O שבמרכז, R2 עולה אל T ו-R4 יורד אל B. על הקו האופקי מ-A אל O: סוללה ε2, שהקו הארוך שלה, הצד החיובי, פונה אל A, ואחריה הנגד R3. על הקו מ-O אל D: סוללה ε1, שהצד החיובי שלה פונה אל O, ואחריה הנגד R1.
    answer: >-
      (א) המעגל סימטרי לשיקוף סביב הקו האופקי AOD: $R_6$ מול $R_5$, $R_7$ מול $R_8$, $R_2$ מול $R_4$, והסוללות ו-$R_1$, $R_3$ על הקו עצמו. לכן ל-T ול-B אותו פוטנציאל.

      (ב) $R_1$: $7.2\,\text{A}$, מ-D אל $\varepsilon_1$. $R_2$: $1.2\,\text{A}$, מ-O אל T. $R_3$: $4.8\,\text{A}$, מ-O אל $\varepsilon_2$. $R_5$: $2.4\,\text{A}$, מ-A אל B.

      (ג) לא. בשתי הסוללות הזרם יוצא מההדק החיובי: שתיהן מספקות אנרגיה, $86.4\,\text{W}$ ו-$28.8\,\text{W}$.
    solution:
      - kind: reasoning
        text: >-
          (א) נשקף את האיור סביב הקו האופקי שעובר דרך A, O ו-D. T ו-B מתחלפים, וכך גם $R_6$ ו-$R_5$, $R_7$ ו-$R_8$, $R_2$ ו-$R_4$, וכל זוג כזה שווה בהתנגדות. הסוללות, $R_1$ ו-$R_3$ נמצאים על הקו עצמו ולא משתנים. המעגל המשוקף זהה למקורי, ולכן גם הפוטנציאלים שלו זהים. אילו T היה גבוה מ-B, במעגל המשוקף B היה גבוה מ-T. אותו מעגל לא יכול לתת שתי תשובות, ולכן $V_T = V_B$.
      - kind: given
        text: >-
          (ב) נקבע $V_A = 0$. הלא ידועים: $V_T$ (ששווה ל-$V_B$), $V_O$ ו-$V_D$. בכל נגד של $1\,\Omega$ הזרם בגודל הפרש הפוטנציאלים, מהגבוה לנמוך. בענף A–O: מ-A עוברים ב-$\varepsilon_2$ מההדק החיובי לשלילי, יורדים $6\,\text{V}$, ואז $R_3$ עד O. לכן הזרם ב-$R_3$, מ-A אל O, הוא $(0 - 6) - V_O = -6 - V_O$. בענף O–D: מ-O עוברים ב-$\varepsilon_1$ מההדק החיובי לשלילי, יורדים $12\,\text{V}$, ואז $R_1$ עד D, ולכן הזרם ב-$R_1$, מ-O אל D, הוא $V_O - 12 - V_D$.
      - kind: formula
        text: >-
          חוק הצמתים בשלושה צמתים, T, O ו-D, כשכל זרם בנגד כתוב כהפרש פוטנציאלים חלקי $1\,\Omega$. שלוש המשוואות מספיקות לשלושת הפוטנציאלים הלא ידועים.
      - kind: manipulation
        text: >-
          ב-T: הזרמים שנכנסים מ-A, מ-O ומ-D מסתכמים לאפס: $(0 - V_T) + (V_O - V_T) + (V_D - V_T) = 0$, כלומר $V_O + V_D = 3V_T$.

          ב-O: מ-A נכנס $-6 - V_O$, מ-T ומ-B נכנסים $2(V_T - V_O)$, ויוצא אל D $V_O - 12 - V_D$. לכן $-6 - V_O + 2V_T - 2V_O = V_O - 12 - V_D$, כלומר $2V_T - 4V_O + V_D = -6$.

          ב-D: נכנסים $V_O - 12 - V_D$ מ-O ו-$2(V_T - V_D)$ מ-T ומ-B, וסכומם אפס: $2V_T + V_O - 3V_D = 12$.
      - kind: manipulation
        text: >-
          מהמשוואה של T: $V_O = 3V_T - V_D$. מציבים בשתי האחרות:
          $$-10V_T + 5V_D = -6 \qquad\qquad 5V_T - 4V_D = 12$$
          בראשונה מעבירים אגפים, $5V_D = 10V_T - 6$, ומחלקים ב-5: $V_D = 2V_T - 1.2$. מציבים בשנייה: $5V_T - 8V_T + 4.8 = 12$, כלומר $-3V_T = 7.2$, ולכן $V_T = -2.4\,\text{V}$. מכאן $V_D = -6\,\text{V}$ ו-$V_O = -7.2 + 6 = -1.2\,\text{V}$.
      - kind: substitution
        text: >-
          הזרמים:

          $R_1$: $V_O - 12 - V_D = -1.2 - 12 + 6 = -7.2\,\text{A}$, כלומר $7.2\,\text{A}$ מ-D אל O, דרך $R_1$ ואחר כך דרך $\varepsilon_1$ מההדק השלילי לחיובי.

          $R_2$: $V_O - V_T = -1.2 + 2.4 = 1.2\,\text{A}$ מ-O אל T.

          $R_3$: $-6 - V_O = -4.8\,\text{A}$, כלומר $4.8\,\text{A}$ מ-O אל A, דרך $R_3$ ואחר כך דרך $\varepsilon_2$ מההדק השלילי לחיובי.

          $R_5$: $V_A - V_B = 0 + 2.4 = 2.4\,\text{A}$ מ-A אל B.
      - kind: reasoning
        text: >-
          בדיקות. ב-A: נכנסים $4.8\,\text{A}$ מהענף של $\varepsilon_2$, ויוצאים $2.4\,\text{A}$ ב-$R_6$ ו-$2.4\,\text{A}$ ב-$R_5$. בלולאה שיוצאת מ-A אל O, משם אל T וחזרה אל A: ב-$\varepsilon_2$ עוברים מההדק החיובי לשלילי, $-6$; ב-$R_3$ הולכים מ-A אל O, נגד הזרם, שזורם מ-O אל A, ולכן $+4.8$; ב-$R_2$ הולכים מ-O אל T, עם הזרם, $-1.2$; ב-$R_6$ הולכים מ-T אל A, נגד הזרם, שזורם מ-A אל T, ולכן $+2.4$. הסכום: $-6 + 4.8 - 1.2 + 2.4 = 0$.
      - kind: reasoning
        text: >-
          (ג) בשתי הסוללות הזרם נכנס בהדק השלילי ויוצא בחיובי, ולכן שתיהן מספקות אנרגיה: $12\cdot7.2 = 86.4\,\text{W}$ ו-$6\cdot4.8 = 28.8\,\text{W}$, יחד $115.2\,\text{W}$. בדיקה: ב-$R_7$ וב-$R_8$ הזרם $V_T - V_D = 3.6\,\text{A}$, ובכל נגד של $1\,\Omega$ ההספק $I^2$. הנגדים מקבלים: $R_1$, $7.2^2 = 51.84\,\text{W}$; $R_3$, $4.8^2 = 23.04\,\text{W}$; $R_2$ ו-$R_4$, $2\cdot1.2^2 = 2.88\,\text{W}$; $R_5$ ו-$R_6$, $2\cdot2.4^2 = 11.52\,\text{W}$; $R_7$ ו-$R_8$, $2\cdot3.6^2 = 25.92\,\text{W}$. הסכום: $115.2\,\text{W}$.
      - kind: result
        text: >-
          (א) מסימטריית השיקוף, $V_T = V_B$.

          (ב) $R_1$: $7.2\,\text{A}$; $R_2$: $1.2\,\text{A}$; $R_3$: $4.8\,\text{A}$; $R_5$: $2.4\,\text{A}$.

          (ג) אף סוללה לא נטענת: שתיהן מספקות אנרגיה.
