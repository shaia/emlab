    diagramAlt: >-
      מעוין של ארבעה נגדים: R6 מהקודקוד השמאלי A אל העליון T, R7 מ-T אל הימני D, R8 מ-D אל התחתון B, ו-R5 מ-B אל A. מהנקודה O שבמרכז, R2 עולה אל T ו-R4 יורד אל B. על הקו האופקי מ-A אל O: סוללה ε2, שהקו הארוך שלה, הצד החיובי, פונה אל A, ואחריה הנגד R3. על הקו מ-O אל D: סוללה ε1, שהצד החיובי שלה פונה אל O, ואחריה הנגד R1.
    answer: >-
      (א) המעגל סימטרי לשיקוף סביב הקו האופקי AOD: $R_6$ מול $R_5$, $R_7$ מול $R_8$, $R_2$ מול $R_4$, והסוללות ו-$R_1$, $R_3$ על הקו עצמו. לכן ל-T ול-B אותו פוטנציאל.

      (ב) $R_1$: $7.2\,\text{A}$, מ-D אל $\varepsilon_1$. $R_2$: $1.2\,\text{A}$, מ-O אל T. $R_3$: $4.8\,\text{A}$, מ-O אל $\varepsilon_2$. $R_5$: $2.4\,\text{A}$, מ-A אל B.

      (ג) לא. בשתי הסוללות הזרם יוצא מההדק החיובי: שתיהן מספקות אנרגיה, $86.4\,\text{W}$ ו-$28.8\,\text{W}$.
    solution:
      - kind: reasoning
        text: >-
          (א) נשקף את האיור סביב הקו האופקי שעובר דרך A, O ו-D. T ו-B מתחלפים, וכך גם $R_6$ ו-$R_5$, $R_7$ ו-$R_8$, $R_2$ ו-$R_4$, וכל זוג כזה שווה בהתנגדות. הסוללות, $R_1$ ו-$R_3$ נמצאים על הקו עצמו ולא משתנים. המעגל המשוקף זהה למקורי, ולכן גם הפוטנציאלים שלו זהים. אילו T היה גבוה מ-B, במעגל המשוקף B היה גבוה מ-T. אותו מעגל לא יכול לתת שתי תשובות, ולכן $V_T = V_B$.
      - kind: given
        text: >-
          (ב) נקבע $V_A = 0$, ונסמן $V_T = V_B = y$, $V_O = c$ ו-$V_D = z$. בכל נגד של $1\,\Omega$ הזרם בגודל הפרש הפוטנציאלים, מהגבוה לנמוך. בענף A–O: מ-A עוברים ב-$\varepsilon_2$ מ-+ ל-−, יורדים $6\,\text{V}$, ואז $R_3$ עד O. לכן הזרם מ-A אל O הוא $(0 - 6) - c = -6 - c$. בענף O–D: מ-O עוברים ב-$\varepsilon_1$ מ-+ ל-−, יורדים $12\,\text{V}$, ואז $R_1$ עד D, ולכן הזרם מ-O אל D הוא $c - 12 - z$.
      - kind: formula
        text: >-
          חוק הצמתים בשלושה צמתים, T, O ו-D, כשכל זרם בנגד כתוב כהפרש פוטנציאלים חלקי $1\,\Omega$. השלושה מספיקים לשלושה פוטנציאלים לא ידועים.
      - kind: manipulation
        text: >-
          ב-T: הזרמים שנכנסים מ-A, מ-O ומ-D מסתכמים לאפס: $(0 - y) + (c - y) + (z - y) = 0$, כלומר $c + z = 3y$.

          ב-O: מ-A נכנס $-6 - c$, מ-T ומ-B נכנסים $2(y - c)$, ויוצא אל D $c - 12 - z$: $-6 - c + 2y - 2c = c - 12 - z$, כלומר $2y - 4c + z = -6$.

          ב-D: נכנסים $c - 12 - z$ מ-O ו-$2(y - z)$ מ-T ומ-B, וסכומם אפס: $2y + c - 3z = 12$.
      - kind: manipulation
        text: >-
          מהמשוואה של T: $c = 3y - z$. מציבים בשתי האחרות:
          $$-10y + 5z = -6 \qquad\qquad 5y - 4z = 12$$
          מהראשונה, אחרי חלוקה ב-5: $z = 2y - 1.2$. מציבים בשנייה: $5y - 8y + 4.8 = 12$, כלומר $-3y = 7.2$, ולכן $y = -2.4\,\text{V}$. מכאן $z = -6\,\text{V}$ ו-$c = -7.2 + 6 = -1.2\,\text{V}$.
      - kind: substitution
        text: >-
          הזרמים:

          $R_1$: $c - 12 - z = -1.2 - 12 + 6 = -7.2\,\text{A}$, כלומר $7.2\,\text{A}$ מ-D אל O, דרך $R_1$ ואחר כך דרך $\varepsilon_1$ מההדק השלילי לחיובי.

          $R_2$: $c - y = -1.2 + 2.4 = 1.2\,\text{A}$ מ-O אל T.

          $R_3$: $-6 - c = -4.8\,\text{A}$, כלומר $4.8\,\text{A}$ מ-O אל A, דרך $R_3$ ואחר כך דרך $\varepsilon_2$ מההדק השלילי לחיובי.

          $R_5$: $0 - y = 2.4\,\text{A}$ מ-A אל B.
      - kind: reasoning
        text: >-
          בדיקות. ב-A: נכנסים $4.8\,\text{A}$ מהענף של $\varepsilon_2$, ויוצאים $2.4\,\text{A}$ ב-$R_6$ ו-$2.4\,\text{A}$ ב-$R_5$. בלולאה A, O, T, A, בכיוון הזרם בענף הסוללה: מ-A דרך $\varepsilon_2$ מ-+ ל-−, $-6$; דרך $R_3$ נגד הזרם, $+4.8$; דרך $R_2$ עם הזרם, $-1.2$; דרך $R_6$ נגד הזרם, $+2.4$. הסכום: $-6 + 4.8 - 1.2 + 2.4 = 0$.
      - kind: reasoning
        text: >-
          (ג) בשתי הסוללות הזרם נכנס בהדק השלילי ויוצא בחיובי, ולכן שתיהן מספקות אנרגיה: $12\cdot7.2 = 86.4\,\text{W}$ ו-$6\cdot4.8 = 28.8\,\text{W}$, יחד $115.2\,\text{W}$. בדיקה: ב-$R_7$ וב-$R_8$ הזרם $y - z = 3.6\,\text{A}$, ובכל נגד של $1\,\Omega$ ההספק $I^2$. הנגדים מקבלים: $R_1$, $7.2^2 = 51.84\,\text{W}$; $R_3$, $4.8^2 = 23.04\,\text{W}$; $R_2$ ו-$R_4$, $2\cdot1.2^2 = 2.88\,\text{W}$; $R_5$ ו-$R_6$, $2\cdot2.4^2 = 11.52\,\text{W}$; $R_7$ ו-$R_8$, $2\cdot3.6^2 = 25.92\,\text{W}$. הסכום: $115.2\,\text{W}$.
      - kind: result
        text: >-
          (א) מסימטריית השיקוף, $V_T = V_B$.

          (ב) $R_1$: $7.2\,\text{A}$; $R_2$: $1.2\,\text{A}$; $R_3$: $4.8\,\text{A}$; $R_5$: $2.4\,\text{A}$.

          (ג) אף סוללה לא נטענת: שתיהן מספקות אנרגיה.
