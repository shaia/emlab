    answer: >-
      (א) בענף השמאלי $2.5\,\text{A}$, עולה אל הצומת העליון. בענף האמצעי $2\,\text{A}$, יורד. בענף הימני $0.5\,\text{A}$, יורד: נכנס להדק החיובי של $\varepsilon_2$.

