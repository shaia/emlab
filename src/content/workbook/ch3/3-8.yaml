      (ג) $37.5\,\text{W} = 12.5 + 2 + 20 + 3\ \text{W}$.
    solution:
      - kind: given
        text: >-
          $\varepsilon_1 = 15\,\text{V}$, $R_1 = 2\,\Omega$, $\varepsilon_2 = 6\,\text{V}$, $R_2 = 8\,\Omega$, $R_3 = 5\,\Omega$. נקבע את הפוטנציאל של הצומת התחתון כאפס. מסמנים $I_1$ ו-$I_2$ עולים בענפים הצדדיים אל הצומת העליון, ו-$I_3$ יורד ב-$R_3$. ענף הוא מסלול אחד בטור, ולכן הסדר של הרכיבים בו לא משנה את הזרם שלו.
      - kind: formula
        text: >-
          חוק הצמתים: $I_1 + I_2 = I_3$. חוק הלולאות בלולאה השמאלית: $\varepsilon_1 - R_1I_1 - R_3I_3 = 0$. בלולאה הימנית, מהצומת התחתון למעלה, דרך $R_2$ עם $I_2$, דרך $\varepsilon_2$ מההדק השלילי לחיובי, ולמטה דרך $R_3$: $-R_2I_2 + \varepsilon_2 - R_3I_3 = 0$.
      - kind: substitution
        text: >-
          (א)
          $$15 - 2I_1 - 5I_3 = 0 \qquad\qquad 6 - 8I_2 - 5I_3 = 0$$
          מבודדים את $I_1$ בראשונה: $2I_1 = 15 - 5I_3$, ומחלקים ב-2: $I_1 = 7.5 - 2.5I_3$. באותו אופן בשנייה: $8I_2 = 6 - 5I_3$, ומחלקים ב-8: $I_2 = 0.75 - 0.625I_3$.
      - kind: substitution
        text: >-
          מציבים בחוק הצמתים: $7.5 - 2.5I_3 + 0.75 - 0.625I_3 = I_3$, כלומר $8.25 = 4.125I_3$, ומחלקים ב-4.125: $I_3 = 2\,\text{A}$. מכאן $I_1 = 7.5 - 5 = 2.5\,\text{A}$ ו-$I_2 = 0.75 - 1.25 = -0.5\,\text{A}$.
      - kind: reasoning
        text: >-
          $I_2$ שלילי: בענף הימני $0.5\,\text{A}$ יורדים מהצומת העליון, נכנסים להדק החיובי של $\varepsilon_2$, יוצאים מההדק השלילי שלה ב-Y, וממשיכים דרך $R_2$ אל הצומת התחתון.
      - kind: substitution
        text: >-
          (ב) X הוא ההדק החיובי של $\varepsilon_1$, שההדק השלילי שלה בצומת התחתון: $V_X = 15\,\text{V}$. מהצומת התחתון עולים אל Y דרך $R_2$, נגד הזרם האמיתי, ולכן הפוטנציאל עולה ב-$0.5\cdot8 = 4\,\text{V}$: $V_Y = 4\,\text{V}$. בדיקה בדרך אחרת: הצומת העליון ב-$15 - 2.5\cdot2 = 10\,\text{V}$, ומשם יורדים דרך $\varepsilon_2$ מההדק החיובי לשלילי: $10 - 6 = 4\,\text{V}$. מד המתח מראה $V_X - V_Y = 15 - 4 = +11\,\text{V}$.
      - kind: substitution
        text: >-
          (ג) $\varepsilon_1$ מספקת $15\cdot2.5 = 37.5\,\text{W}$. הנגדים מקבלים $2.5^2\cdot2 = 12.5\,\text{W}$, $0.5^2\cdot8 = 2\,\text{W}$ ו-$2^2\cdot5 = 20\,\text{W}$, ו-$\varepsilon_2$ מקבלת $6\cdot0.5 = 3\,\text{W}$. הסכום: $12.5 + 2 + 20 + 3 = 37.5\,\text{W}$.
      - kind: result
        text: >-
          (א) $I_1 = 2.5\,\text{A}$ עולה, $I_3 = 2\,\text{A}$ יורד, ובענף הימני $0.5\,\text{A}$ יורד, אל ההדק החיובי של $\varepsilon_2$.

          (ב) $V_X - V_Y = +11\,\text{V}$.

          (ג) $37.5\,\text{W}$ שווה לסכום.

  - id: W-3.8-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-3.8-1, OBJ-3.8-3]
    prompt: >-
      במעגל שני צמתים, J למעלה ו-K למטה, ושלושה ענפים ביניהם, כמו באיור של שאלה 4. בכל ענף צדדי יש למטה סוללה אידאלית, שההדק השלילי שלה מחובר ל-K וההדק החיובי פונה למעלה, ומעליה נגד עד J. בענף השמאלי $\varepsilon_1 = 18\,\text{V}$ ו-$R_1 = 6\,\Omega$. בענף הימני $\varepsilon_2 = 9\,\text{V}$ ו-$R_2 = 3\,\Omega$. בענף האמצעי נגד $R_3 = 2\,\Omega$ ומפסק בטור אליו.

      (א) המפסק פתוח. מה הזרם במעגל? האם $\varepsilon_2$ נטענת או מספקת אנרגיה?

      (ב) סוגרים את המפסק. מצאו את הזרם בכל ענף.

      (ג) מה השתנה ב-$\varepsilon_2$ כשסגרו את המפסק? הסבירו בעזרת הפוטנציאל של J, וערכו מאזן הספקים בשני המצבים.
    answer: >-
      (א) $1\,\text{A}$. הזרם נכנס להדק החיובי של $\varepsilon_2$: היא נטענת, ומקבלת $9\,\text{W}$.

      (ב) $I_1 = 2\,\text{A}$ אל J, $I_2 = 1\,\text{A}$ יוצא מההדק החיובי של $\varepsilon_2$, ו-$I_3 = 3\,\text{A}$ יורד.

      (ג) $\varepsilon_2$ עוברת מקבלת אנרגיה למספקת: $V_J$ יורד מ-$12\,\text{V}$ ל-$6\,\text{V}$, מתחת ל-$9\,\text{V}$. מפסק פתוח: $18\,\text{W} = 9 + 9\ \text{W}$. מפסק סגור: $36 + 9 = 24 + 3 + 18\ \text{W}$.
    solution:
      - kind: given
        text: >-
          $\varepsilon_1 = 18\,\text{V}$, $R_1 = 6\,\Omega$, $\varepsilon_2 = 9\,\text{V}$, $R_2 = 3\,\Omega$, $R_3 = 2\,\Omega$. נקבע את הפוטנציאל של K כאפס, ונקרא לפוטנציאל של J בשם $V_J$. מסמנים $I_1$ ו-$I_2$ יוצאים מההדקים החיוביים אל J, ו-$I_3$ יורד ב-$R_3$.
      - kind: reasoning
        text: >-
          (א) כשהמפסק פתוח אין זרם בענף האמצעי, ונשאר מסלול אחד דרך שתי הסוללות, $R_1$ ו-$R_2$. ההדקים החיוביים פונים זה אל זה, ולכן הסוללות דוחפות בכיוונים מנוגדים. הולכים עם $I_1$: ב-$\varepsilon_1$ מההדק השלילי לחיובי, ב-$R_1$ וב-$R_2$ עם הזרם, וב-$\varepsilon_2$ מההדק החיובי לשלילי.
      - kind: substitution
        text: >-
          $18 - 6I_1 - 3I_1 - 9 = 0$, כלומר $9I_1 = 9$, ולכן $I_1 = 1\,\text{A}$, ו-$I_2 = -1\,\text{A}$: הזרם נכנס להדק החיובי של $\varepsilon_2$, והיא מקבלת $9\cdot1 = 9\,\text{W}$.
      - kind: formula
        text: >-
          (ב) המפסק סגור: $I_1 + I_2 = I_3$, $\ 18 - 6I_1 - 2I_3 = 0$, $\ 9 - 3I_2 - 2I_3 = 0$.
      - kind: manipulation
        text: >-
          מבודדים את $I_1$ מהמשוואה השנייה: $6I_1 = 18 - 2I_3$, ומחלקים ב-6: $I_1 = 3 - \dfrac{I_3}{3}$. מהשלישית: $3I_2 = 9 - 2I_3$, ומחלקים ב-3: $I_2 = 3 - \dfrac{2I_3}{3}$. מציבים בחוק הצמתים: $6 - I_3 = I_3$, ולכן $I_3 = 3\,\text{A}$.
      - kind: substitution
        text: >-
          $I_1 = 3 - 1 = 2\,\text{A}$ ו-$I_2 = 3 - 2 = 1\,\text{A}$. בדיקה ב-J: $2 + 1 = 3$.
      - kind: reasoning
        text: >-
          (ג) כשהמפסק פתוח, $V_J = 18 - 1\cdot6 = 12\,\text{V}$, מעל ההדק החיובי של $\varepsilon_2$, שנמצא ב-$9\,\text{V}$. לכן הזרם ב-$R_2$ זורם מ-J אל $\varepsilon_2$, והיא נטענת. כשהמפסק סגור, הענף האמצעי מושך זרם, ו-$V_J$ יורד ל-$I_3R_3 = 3\cdot2 = 6\,\text{V}$, מתחת ל-$9\,\text{V}$. עכשיו הזרם ב-$R_2$ זורם מ-$\varepsilon_2$ אל J, והיא מספקת אנרגיה.
      - kind: substitution
        text: >-
          מאזן הספקים. מפסק פתוח: $\varepsilon_1$ מספקת $18\cdot1 = 18\,\text{W}$; $R_1$ ו-$R_2$ מקבלים $1^2\cdot(6 + 3) = 9\,\text{W}$, ו-$\varepsilon_2$ מקבלת $9\,\text{W}$. מפסק סגור: $\varepsilon_1$ מספקת $18\cdot2 = 36\,\text{W}$ ו-$\varepsilon_2$ מספקת $9\cdot1 = 9\,\text{W}$, יחד $45\,\text{W}$; הנגדים מקבלים $2^2\cdot6 = 24\,\text{W}$, $1^2\cdot3 = 3\,\text{W}$ ו-$3^2\cdot2 = 18\,\text{W}$, יחד $45\,\text{W}$.
      - kind: result
        text: >-
          (א) $1\,\text{A}$; $\varepsilon_2$ נטענת.

          (ב) $I_1 = 2\,\text{A}$, $I_2 = 1\,\text{A}$, $I_3 = 3\,\text{A}$.

          (ג) סגירת המפסק מורידה את $V_J$ מ-$12\,\text{V}$ ל-$6\,\text{V}$, ו-$\varepsilon_2$ עוברת מקבלת $9\,\text{W}$ למספקת $9\,\text{W}$. בשני המצבים ההספק שהסוללות מספקות שווה להספק שהרכיבים מקבלים.

challenge:
  - id: W-3.8-c1
    stars: 1
    objectives: [OBJ-3.8-1, OBJ-3.8-3]
    prompt: >-
      במעגל שבאיור, בצלע השמאלית סוללה אידאלית של $12\,\text{V}$, ובצלע הימנית סוללה אידאלית שהכא״מ שלה $\varepsilon$ לא ידוע. ההדקים החיוביים של שתיהן פונים למעלה. בחוט העליון יש צומת, J. בין הסוללה השמאלית ל-J נגד של $4\,\Omega$, ובין J לסוללה הימנית נגד של $5\,\Omega$. מ-J יורד אל החוט התחתון ענף עם נגד של $3\,\Omega$ ומד זרם אידאלי, המסומן באיור בעיגול עם האות A. מד הזרם מראה $2.0\,\text{A}$.

      (א) הזרם במד הזרם זורם כלפי מטה. מצאו את $\varepsilon$.

      (ב) הראו שעם הקטבים שבאיור, הזרם במד הזרם לא יכול לזרום כלפי מעלה.

      (ג) האם הסוללה $\varepsilon$ מספקת אנרגיה או מקבלת? כמה?
