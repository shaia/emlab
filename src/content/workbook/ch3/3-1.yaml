    answer: >-
      (א) הנורה דולקת כששתי הזרועות באותו מצב (שתיהן למעלה או שתיהן למטה), וכבויה כשהן במצבים שונים.

      (ב) תיל 1 ב-$12\,\text{V}$, תיל 2 ב-$0$, ועל הנורה $0$.

      (ג) הנורה דולקת רק כששתי הזרועות על אותו תיל. העברה של זרוע אחת הופכת "אותו תיל" ל"תילים שונים", או להפך.
    solution:
      - kind: reasoning
        text: >-
          (א) מסלול מההדק החיובי מגיע דרך הזרוע של A לתיל שהיא נוגעת בו, ורק לו. מהנורה מגיעים, דרך הזרוע של B, רק אל התיל שהזרוע של B נוגעת בו. לכן יש מסלול סגור דרך הנורה רק כששתי הזרועות נוגעות באותו תיל: שתיהן למעלה (תיל 1) או שתיהן למטה (תיל 2). כשהן במצבים שונים, כל זרוע נוגעת בתיל אחר, ובין שני התילים אין חיבור.
      - kind: reasoning
        text: >-
          (ב) תיל 1 מחובר דרך הזרוע של A להדק החיובי, ולכן הוא ב-$12\,\text{V}$. תיל 2 לא נוגע ב-A, ומחובר רק דרך הזרוע של B והנורה אל ההדק השלילי. אין זרם, ולכן חוט הלהט הוא מוליך בשיווי משקל, ותיל 2, שני הקצוות של הנורה וההדק השלילי כולם ב-$0$. על הנורה $0$, וכל $12\,\text{V}$ נמצאים בין תיל 1 לתיל 2.
      - kind: reasoning
        text: >-
          (ג) מצב הנורה תלוי רק בשאלה אם שתי הזרועות על אותו תיל. העברה של זרוע אחת, כל אחת מהשתיים, מחליפה את התיל שלה בלבד. אם הן היו על אותו תיל, עכשיו הן על תילים שונים, והנורה נכבית. אם הן היו על תילים שונים, עכשיו הן על אותו תיל, והנורה נדלקת. לכן אפשר לשנות את מצב הנורה מכל אחד משני המפסקים.
      - kind: result
        text: >-
          (א) דולקת במצבים "למעלה, למעלה" ו"למטה, למטה", וכבויה בשני האחרים. (ב) תיל 1 ב-$12\,\text{V}$, תיל 2 ב-$0$, ועל הנורה $0$. (ג) כל זרוע שמועברת הופכת "אותו תיל" ל"תילים שונים" או להפך, ולכן כל אחד מהמפסקים משנה את מצב הנורה.

  - id: W-3.1-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-3.1-2, OBJ-3.1-3]
    prompt: >-
      שתי סוללות זהות, $B_1$ ו-$B_2$, של $6\,\text{V}$ כל אחת, ונורה. ההדק השלילי של $B_2$ מחובר להדק החיובי של $B_1$. ההדק החיובי של $B_2$ מחובר בתיל לקצה אחד של הנורה, והקצה השני של הנורה מחובר להדק השלילי של $B_1$. נקודת הייחוס, $0\,\text{V}$, היא ההדק השלילי של $B_1$.

      (א) מה הפוטנציאל של נקודת החיבור שבין שתי הסוללות, ומה הפוטנציאל של ההדק החיובי של $B_2$? מה המתח על הנורה?

      (ב) קולון אחד עובר סיבוב שלם במעגל. כמה אנרגיה הוא מקבל בכל סוללה, וכמה הוא מוסר לנורה?

      (ג) מה משתנה אם הופכים את $B_2$, כך שההדק **החיובי** שלה מחובר להדק החיובי של $B_1$, וההדק השלילי שלה מחובר לנורה? מצאו שוב את הפוטנציאלים ואת המתח על הנורה. האם היא דולקת?
    answer: >-
      (א) $6\,\text{V}$ בנקודת החיבור, $12\,\text{V}$ בהדק החיובי של $B_2$, ועל הנורה $12\,\text{V}$.

      (ב) $6\,\text{J}$ בכל סוללה, ו-$12\,\text{J}$ לנורה.

      (ג) נקודת החיבור עדיין ב-$6\,\text{V}$, אבל ההדק של $B_2$ שמחובר לנורה ב-$0$. על הנורה $0$, והיא כבויה.
    solution:
      - kind: given
        text: >-
          $V_{B_1} = V_{B_2} = 6\,\text{V}$. ההדק השלילי של $B_1$ ב-$0$.
      - kind: reasoning
        text: >-
          (א) עוברים את $B_1$ מההדק השלילי אל החיובי: הפוטנציאל עולה $6\,\text{V}$, ולכן נקודת החיבור ב-$6\,\text{V}$. משם עוברים את $B_2$, גם מהשלילי אל החיובי: עוד $6\,\text{V}$, ולכן ההדק החיובי של $B_2$ ב-$12\,\text{V}$. הוא מחובר בתיל לקצה אחד של הנורה, והקצה השני מחובר ל-$0$: על הנורה $12\,\text{V}$.
      - kind: formula
        text: >-
          (ב) $W = qV$ עם $q = 1\,\text{C}$, ועם המתח שהמטען עובר בכל רכיב.
      - kind: substitution
        text: >-
          בכל סוללה $W = 1\cdot6 = 6\,\text{J}$, ובנורה $W = 1\cdot12 = 12\,\text{J}$. בדיקה: $6 + 6 = 12$, הסוללות מרימות בדיוק כמה שהנורה מורידה.
      - kind: reasoning
        text: >-
          (ג) $B_1$ לא השתנתה, ולכן נקודת החיבור עדיין ב-$6\,\text{V}$. עכשיו ההדק החיובי של $B_2$ הוא שמחובר לנקודה הזו, ולכן ההדק השלילי שלה נמוך ממנה ב-$6\,\text{V}$: $6 - 6 = 0$. ההדק הזה מחובר לנורה, ולכן שני הקצוות של הנורה ב-$0$. על הנורה אין מתח, ואין בה שדה. יש מסלול סגור, ובכל זאת אין זרם: בסיבוב, הפוטנציאל עולה $6\,\text{V}$ ב-$B_1$ ויורד $6\,\text{V}$ ב-$B_2$ ההפוכה, ולנורה לא נשאר כלום.
      - kind: result
        text: >-
          (א) $6\,\text{V}$ ו-$12\,\text{V}$, ועל הנורה $12\,\text{V}$. (ב) $6\,\text{J}$ בכל סוללה ו-$12\,\text{J}$ לנורה. (ג) נקודת החיבור ב-$6\,\text{V}$, ההדק של $B_2$ שמחובר לנורה ב-$0$, ועל הנורה $0$: היא כבויה, למרות שהמסלול סגור.

  - id: W-3.1-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-3.1-1, OBJ-3.1-4, OBJ-3.1-3]
    prompt: >-
      סוללה של $12\,\text{V}$, נורה, קבל ריק של $50\,\mu\text{F}$ ומפסק מחוברים במעגל אחד, בזה אחר זה. סוגרים את המפסק. הנורה מהבהבת לרגע קצר, ונכבית.

      (א) הסבירו בעזרת הפוטנציאלים למה הנורה דלקה, ולמה רק לרגע. מה המתח על הקבל ומה המתח על הנורה אחרי שהיא נכבתה?

      (ב) מה המטען על הקבל בסוף?

      (ג) כמה עבודה עשתה הסוללה, וכמה אנרגיה נאגרה בקבל? הניחו שכל האנרגיה שלא נאגרה בקבל נמסרה לנורה. כמה אנרגיה קיבלה הנורה?

      (ד) הקבל בסוף הוא נתק במעגל. במה הוא דומה למפסק פתוח, ובמה הוא שונה ממנו?
    answer: >-
      (א) ברגע הראשון אין מתח על הקבל הריק, וכל $12\,\text{V}$ על הנורה. ככל שהקבל נטען, המתח עליו גדל, והמתח על הנורה קטן. בסוף על הקבל $12\,\text{V}$, ועל הנורה $0$.

      (ב) $Q = 6\cdot10^{-4}\,\text{C}$.

      (ג) הסוללה עשתה $7.2\cdot10^{-3}\,\text{J}$, בקבל נאגרו $3.6\cdot10^{-3}\,\text{J}$, והנורה קיבלה $3.6\cdot10^{-3}\,\text{J}$.

      (ד) בשניהם, בסוף, אין זרם וכל המתח של הסוללה על פני הנתק. אבל במפסק פתוח אין מטען על המגעים, ובקבל יש מטען על הלוחות, והוא אוגר אנרגיה.
    solution:
      - kind: given
        text: >-
          $V = 12\,\text{V}$, $C = 50\,\mu\text{F} = 5\cdot10^{-5}\,\text{F}$, והקבל ריק כשסוגרים את המפסק. ההדק השלילי ב-$0$.
      - kind: reasoning
        text: >-
          (א) על קבל ריק אין מתח, $V_C = Q/C = 0$, ולכן ברגע הראשון שני הלוחות שלו באותו פוטנציאל, וכל $12\,\text{V}$ של הסוללה נמצאים על הנורה. בחוט הלהט יש שדה, המטען נע, והנורה דולקת. המטען לא עובר בין הלוחות: הוא מצטבר על לוח אחד, ולוח שני מאבד מטען שווה. ככל שהמטען על הלוחות גדל, גדל גם המתח על הקבל, ומה שנשאר לנורה הוא $12 - V_C$. התנועה נעצרת כשהמתח על הקבל מגיע ל-$12\,\text{V}$: אז על הנורה $0$, אין בה שדה, והיא נכבית.
      - kind: formula
        text: >-
          (ב) $Q = CV$. (ג) עבודת הסוללה $W = QV$: כל קולון מתוך $Q$ עבר בה את כל $12\,\text{V}$. האנרגיה בקבל $U = \tfrac12 QV$ (שיעור 2.7).
      - kind: substitution
        text: >-
          (ב) $Q = 5\cdot10^{-5}\cdot12 = 6\cdot10^{-4}\,\text{C}$.
      - kind: substitution
        text: >-
          (ג) $W = 6\cdot10^{-4}\cdot12 = 7.2\cdot10^{-3}\,\text{J}$, ו-$U = \tfrac12\cdot6\cdot10^{-4}\cdot12 = 3.6\cdot10^{-3}\,\text{J}$. לנורה: $7.2\cdot10^{-3} - 3.6\cdot10^{-3} = 3.6\cdot10^{-3}\,\text{J}$.
      - kind: reasoning
        text: >-
          החצי שהגיע לנורה הוא תוצאה של התנאים כאן: הקבל התחיל ריק, ומתח הסוללה קבוע. בתנאים האלה תמיד בדיוק חצי מעבודת הסוללה לא נאגר, לא משנה איזו נורה במעגל.
      - kind: reasoning
        text: >-
          (ד) הדמיון: בסוף לא נע מטען, ובדיוק כמו על פני מפסק פתוח, כל המתח של הסוללה נמצא על פני הנתק שבין הלוחות. ההבדל: עד שהגיע למצב הזה, מטען הצטבר על הלוחות, ולכן בקבל יש עכשיו מטען ואנרגיה אגורה. במפסק פתוח המטען שעל המגעים זעיר, וכשסוגרים מפסק כזה, הזרם מתחיל ולא נעצר.
      - kind: result
        text: >-
          (א) בסוף על הקבל $12\,\text{V}$ ועל הנורה $0$. (ב) $6\cdot10^{-4}\,\text{C}$. (ג) הסוללה $7.2\cdot10^{-3}\,\text{J}$, הקבל $3.6\cdot10^{-3}\,\text{J}$, והנורה $3.6\cdot10^{-3}\,\text{J}$. (ד) בשניהם כל המתח על פני הנתק ואין זרם, אבל רק הקבל טעון ואוגר אנרגיה.

  - id: W-3.1-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-3.1-2, OBJ-3.1-4]
    prompt: >-
      בשרשרת קישוט ארבע נורות זהות, $L_1$ עד $L_4$, מחוברות בזו אחר זו לסוללה של $12\,\text{V}$: מההדק החיובי אל $L_1$, ומשם אל $L_2$, $L_3$, $L_4$ וחזרה אל ההדק השלילי. הנקודה P נמצאת בין $L_1$ ל-$L_2$, והנקודה Q בין $L_3$ ל-$L_4$. המפסק סגור, אבל כל הנורות כבויות. מד מתח שמחברים לשני הקצוות של כל נורה מראה $0$ על $L_1$, על $L_2$ ועל $L_4$, ו-$12\,\text{V}$ על $L_3$.

      (א) מה התקלה? נמקו בעזרת הפוטנציאלים.

      (ב) עדיין לפני התיקון: מה יראה מד המתח כשהחוד האדום ב-P והשחור ב-Q?

      (ג) מחליפים את $L_3$ בנורה תקינה, וכל הנורות נדלקות. מה יראה עכשיו מד המתח בין P ל-Q (האדום ב-P)?

      (ד) אחרי התיקון עוברים במעגל $25\,\text{C}$. כמה אנרגיה מקבלת כל נורה, וכמה עבודה עושה הסוללה?
    answer: >-
      (א) חוט הלהט של $L_3$ קרוע: יש בו נתק.

      (ב) $12\,\text{V}$.

      (ג) $6\,\text{V}$.

      (ד) $75\,\text{J}$ לכל נורה, והסוללה עושה $300\,\text{J}$.
    solution:
      - kind: given
        text: >-
          ההדק השלילי ב-$0$, ההדק החיובי ב-$12\,\text{V}$, ארבע נורות זהות. המדידות: $0$ על $L_1$, $L_2$ ו-$L_4$, ו-$12\,\text{V}$ על $L_3$.
      - kind: reasoning
        text: >-
          (א) כל הנורות כבויות, ולכן לא זורם זרם: יש נתק איפשהו. בלי זרם, כל חלק של המעגל שמחובר רק לצד אחד של הנתק נמצא בפוטנציאל אחד. $L_1$ ו-$L_2$ מחוברות להדק החיובי, ואין עליהן מתח, ולכן הן כולן ב-$12\,\text{V}$. $L_4$ מחוברת להדק השלילי, ואין עליה מתח, ולכן היא ב-$0$. כל $12\,\text{V}$ נמצאים על $L_3$, ולכן הנתק בתוכה: חוט הלהט שלה קרוע. בדיוק כמו מפסק פתוח, הנתק "מקבל" את כל המתח של הסוללה.
      - kind: reasoning
        text: >-
          (ב) P מחוברת דרך $L_1$ להדק החיובי, בלי זרם: $V_P = 12\,\text{V}$. Q מחוברת דרך $L_4$ להדק השלילי: $V_Q = 0$. מד המתח מראה $V_P - V_Q = 12\,\text{V}$.
      - kind: reasoning
        text: >-
          (ג) אחרי התיקון יש זרם, והפוטנציאל יורד $12\,\text{V}$ בארבע מדרגות שוות של $\dfrac{12}{4} = 3\,\text{V}$, כי הנורות זהות. מההדק החיובי: $V_P = 12 - 3 = 9\,\text{V}$, אחרי $L_2$ הפוטנציאל $6\,\text{V}$, ו-$V_Q = 3\,\text{V}$. מד המתח מראה $V_P - V_Q = 9 - 3 = 6\,\text{V}$: המתח על $L_2$ ו-$L_3$ יחד.
      - kind: formula
        text: >-
          (ד) $W = qV$, עם $3\,\text{V}$ לכל נורה ו-$12\,\text{V}$ בסוללה.
      - kind: substitution
        text: >-
          לכל נורה $W = 25\cdot3 = 75\,\text{J}$. הסוללה: $W = 25\cdot12 = 300\,\text{J}$. בדיקה: $4\cdot75 = 300$.
      - kind: result
        text: >-
          (א) חוט הלהט של $L_3$ קרוע. (ב) $12\,\text{V}$. (ג) $6\,\text{V}$. (ד) $75\,\text{J}$ לכל נורה, ו-$300\,\text{J}$ מהסוללה.

challenge:
  - id: W-3.1-c1
    stars: 1
    objectives: [OBJ-3.1-2, OBJ-3.1-3]
    prompt: >-
      שני קבלים ריקים, $C_1 = 3\,\mu\text{F}$ ו-$C_2 = 6\,\mu\text{F}$, מחוברים במעגל אחד עם סוללה של $12\,\text{V}$ ומפסק פתוח: מההדק החיובי אל $C_1$, משם אל $C_2$, ומשם דרך המפסק אל ההדק השלילי. הנקודה P היא החיבור בין שני הקבלים. ההדק השלילי הוא נקודת הייחוס, $0\,\text{V}$.

      (א) מה המתח על פני המפסק הפתוח, לפני שסוגרים אותו?

      (ב) סוגרים את המפסק. מה הקשר בין המטען על $C_1$ למטען על $C_2$, ולמה?

      (ג) מצאו את המטען ואת המתח על כל קבל, ואת הפוטנציאל של P. הראו ששני הקבלים יחד מתנהגים כמו קבל אחד שהקיבול שלו $C = \dfrac{C_1C_2}{C_1 + C_2}$.

      (ד) כמה עבודה עשתה הסוללה, וכמה אנרגיה נאגרה בשני הקבלים יחד? לאן הלך ההפרש?
    answer: >-
      (א) $12\,\text{V}$.

      (ב) המטענים שווים: $Q_1 = Q_2$.

      (ג) $Q = 24\,\mu\text{C}$ על כל קבל, $V_1 = 8\,\text{V}$, $V_2 = 4\,\text{V}$, והפוטנציאל של P הוא $4\,\text{V}$.

      (ד) הסוללה עשתה $2.88\cdot10^{-4}\,\text{J}$, ובקבלים נאגרו $1.44\cdot10^{-4}\,\text{J}$. ההפרש, $1.44\cdot10^{-4}\,\text{J}$, הפך לחום בתילים.
    solution:
      - kind: reasoning
        text: >-
          (א) על קבל ריק אין מתח, $V = Q/C = 0$. לכן הפוטנציאל לא משתנה כשעוברים דרך $C_1$ ו-$C_2$: מההדק החיובי ועד הצד של המפסק שמחובר ל-$C_2$, הכול ב-$12\,\text{V}$. הצד השני של המפסק מחובר להדק השלילי, ב-$0$. על פני המפסק $12\,\text{V}$, כמו במעגל עם נורות.
      - kind: reasoning
        text: >-
          (ב) הלוח של $C_1$ שפונה אל P, הלוח של $C_2$ שפונה אל P והתיל שביניהם הם מוליך מבודד: משני הצדדים יש רק רווח בין לוחות, ומטען לא עובר דרכו. בהתחלה לא היה עליו מטען, ומטען נשמר, ולכן הוא נשאר עם מטען כולל אפס. אם על הלוח של $C_1$ שבצד P יש מטען $Q = -Q_1$, על הלוח של $C_2$ שבצד P יש $+Q_1$. לכן $Q_1 = Q_2 = Q$.
      - kind: formula
        text: >-
          (ג) על כל קבל $V_i = \dfrac{Q}{C_i}$, והמתחים מצטרפים למתח של הסוללה: הולכים מההדק החיובי דרך $C_1$, $C_2$ והמפסק הסגור עד ההדק השלילי, והפוטנציאל יורד בסך הכול $12\,\text{V}$:
          $$V = \frac{Q}{C_1} + \frac{Q}{C_2} = Q\,\frac{C_1 + C_2}{C_1C_2}$$
      - kind: manipulation
        text: >-
          מבודדים את $Q$: כופלים את שני האגפים ב-$\dfrac{C_1C_2}{C_1 + C_2}$, ומקבלים $Q = \dfrac{C_1C_2}{C_1 + C_2}\,V$. זה בדיוק $Q = CV$ של קבל אחד בקיבול $C = \dfrac{C_1C_2}{C_1 + C_2}$.
      - kind: substitution
        text: >-
          $C = \dfrac{3\cdot6}{3 + 6} = 2\,\mu\text{F}$, ולכן $Q = 2\cdot10^{-6}\cdot12 = 2.4\cdot10^{-5}\,\text{C} = 24\,\mu\text{C}$. $V_1 = \dfrac{24\,\mu\text{C}}{3\,\mu\text{F}} = 8\,\text{V}$, ו-$V_2 = \dfrac{24\,\mu\text{C}}{6\,\mu\text{F}} = 4\,\text{V}$. בדיקה: $8 + 4 = 12$.
      - kind: reasoning
        text: >-
          הפוטנציאל של P: מ-P עוברים את $C_2$ והמפסק הסגור עד ההדק השלילי, והפוטנציאל יורד ב-$V_2$. לכן $V_P = 0 + 4 = 4\,\text{V}$. (מהצד השני: $12 - 8 = 4\,\text{V}$.)
      - kind: formula
        text: >-
          (ד) דרך הסוללה עבר מטען $Q$, וכל קולון קיבל בה $12\,\text{J}$: $W = QV$. האנרגיה האגורה $U = \tfrac12 CV^2$, עם הקיבול השקול.
      - kind: substitution
        text: >-
          $W = 2.4\cdot10^{-5}\cdot12 = 2.88\cdot10^{-4}\,\text{J}$, ו-$U = \tfrac12\cdot2\cdot10^{-6}\cdot12^2 = 1.44\cdot10^{-4}\,\text{J}$. בדיקה לפי כל קבל: $\tfrac12\cdot24\,\mu\text{C}\cdot8\,\text{V} + \tfrac12\cdot24\,\mu\text{C}\cdot4\,\text{V} = 96 + 48 = 144\,\mu\text{J}$.
      - kind: reasoning
        text: >-
          ההפרש, $1.44\cdot10^{-4}\,\text{J}$, בדיוק חצי מעבודת הסוללה, הפך לחום בתילים (ולפעמים לניצוץ). החצי הזה נובע מהתנאים: הקבלים התחילו ריקים, ומתח הסוללה קבוע לאורך כל הטעינה.
      - kind: result
        text: >-
          (א) $12\,\text{V}$. (ב) $Q_1 = Q_2$. (ג) $24\,\mu\text{C}$ על כל קבל, $V_1 = 8\,\text{V}$, $V_2 = 4\,\text{V}$, $V_P = 4\,\text{V}$. (ד) הסוללה $2.88\cdot10^{-4}\,\text{J}$, הקבלים $1.44\cdot10^{-4}\,\text{J}$, והשאר חום בתילים.
    source:
      name: British Physics Olympiad (BPhO), Round 1
      year: 2018
      problem: 'Round 1, 16 November 2018, Section 2, Question 6(a)'
      url: https://www.bpho.org.uk/Papers/R1/2018Nov_R1_S2.pdf
      verified: '2026-11-02'
      adapted: true

  - id: W-3.1-c2
    stars: 2
    objectives: [OBJ-3.1-2, OBJ-3.1-3]
    prompt: >-
      קבל $C_1 = 2\,\mu\text{F}$ טעון במטען $Q_0 = 24\,\mu\text{C}$. מחברים אותו במעגל סגור עם קבל ריק $C_2 = 3\,\mu\text{F}$ ועם מפסק פתוח: הלוח החיובי של $C_1$ מחובר ללוח אחד של $C_2$, והלוח השני של $C_2$ מחובר, דרך המפסק, ללוח השלילי של $C_1$.

      (א) מה המתח על פני המפסק הפתוח?

      (ב) סוגרים את המפסק. מה המתח על שני הקבלים בסוף, ומה המטען על כל אחד?

      (ג) השוו את האנרגיה האגורה לפני הסגירה ואחריה. הראו שהחלק של האנרגיה שאבד הוא $\dfrac{C_2}{C_1 + C_2}$, כלומר שהוא לא תלוי ב-$Q_0$, ולא בתילים שדרכם עבר המטען. מה אפשר להסיק?

      (ד) פותחים את המפסק, מוציאים את $C_1$, טוענים אותו שוב למטען $Q_0$, ומחזירים אותו בדיוק כמו קודם. $C_2$ שומר בינתיים על המטען שלו. חוזרים על זה שוב ושוב. מצאו ביטוי למתח על $C_2$ אחרי $n$ חיבורים. לאיזה מתח הוא שואף? אחרי כמה חיבורים הוא עובר את $11\,\text{V}$?
    answer: >-
      (א) $12\,\text{V}$.

      (ב) $4.8\,\text{V}$ על שניהם; $q_1 = 9.6\,\mu\text{C}$ ו-$q_2 = 14.4\,\mu\text{C}$.

      (ג) $144\,\mu\text{J}$ לפני ו-$57.6\,\mu\text{J}$ אחרי: אבדו $86.4\,\mu\text{J}$, כלומר $60\%$, שהם $\dfrac{C_2}{C_1 + C_2}$.

      (ד) $v_n = 12\left(1 - 0.6^{\,n}\right)\,\text{V}$, שואף ל-$12\,\text{V}$, ועובר את $11\,\text{V}$ אחרי $5$ חיבורים.
    solution:
      - kind: given
        text: >-
          $C_1 = 2\cdot10^{-6}\,\text{F}$, $Q_0 = 2.4\cdot10^{-5}\,\text{C}$, $C_2 = 3\cdot10^{-6}\,\text{F}$. המתח ההתחלתי על $C_1$ הוא $V_0 = \dfrac{Q_0}{C_1} = \dfrac{24\,\mu\text{C}}{2\,\mu\text{F}} = 12\,\text{V}$.
      - kind: reasoning
        text: >-
          (א) $C_2$ ריק, ולכן אין עליו מתח, ושני הלוחות שלו באותו פוטנציאל. נבחר את הלוח השלילי של $C_1$ כנקודת ייחוס. הלוח החיובי של $C_1$, שני הלוחות של $C_2$ והצד של המפסק שמחובר ל-$C_2$ כולם ב-$12\,\text{V}$. הצד השני של המפסק מחובר ללוח השלילי, ב-$0$. על פני המפסק $12\,\text{V}$: הקבל הטעון ממלא כאן את התפקיד של סוללה.
      - kind: reasoning
        text: >-
          (ב) אחרי הסגירה שני הקבלים מחוברים בין אותן שתי נקודות, ולכן בסוף יש עליהם אותו מתח $V$. המטען נשמר: הלוח החיובי של $C_1$ והלוח של $C_2$ שמחובר אליו הם מוליך אחד, שהמטען הכולל שלו נשאר $Q_0$.
      - kind: formula
        text: >-
          $q_1 + q_2 = Q_0$, עם $q_1 = C_1V$ ו-$q_2 = C_2V$.
      - kind: manipulation
        text: >-
          מוציאים את $V$ כגורם משותף, $(C_1 + C_2)V = Q_0$, ומחלקים ב-$C_1 + C_2$:
          $$V = \frac{Q_0}{C_1 + C_2} = \frac{24\,\mu\text{C}}{5\,\mu\text{F}} = 4.8\ \text{V}$$
          ולכן $q_1 = 2\cdot4.8 = 9.6\,\mu\text{C}$ ו-$q_2 = 3\cdot4.8 = 14.4\,\mu\text{C}$. בדיקה: $9.6 + 14.4 = 24$.
      - kind: formula
        text: >-
          (ג) $U = \dfrac{Q^2}{2C}$. לפני: $U_0 = \dfrac{Q_0^2}{2C_1}$. אחרי, שני הקבלים יחד, עם אותו מטען כולל $Q_0$ על קיבול כולל $C_1 + C_2$: $U_1 = \dfrac{Q_0^2}{2(C_1 + C_2)}$.
      - kind: manipulation
        text: >-
          החלק שאבד:
          $$\frac{U_0 - U_1}{U_0} = 1 - \frac{U_1}{U_0} = 1 - \frac{C_1}{C_1 + C_2} = \frac{C_2}{C_1 + C_2}$$
          $Q_0$ מצטמצם, ולכן החלק לא תלוי בו.
      - kind: substitution
        text: >-
          $U_0 = \dfrac{(2.4\cdot10^{-5})^2}{2\cdot2\cdot10^{-6}} = 1.44\cdot10^{-4}\,\text{J}$, ו-$U_1 = \dfrac{(2.4\cdot10^{-5})^2}{2\cdot5\cdot10^{-6}} = 5.76\cdot10^{-5}\,\text{J}$. אבדו $8.64\cdot10^{-5}\,\text{J}$, והחלק הוא $\dfrac{3}{2 + 3} = 0.6$.
      - kind: reasoning
        text: >-
          המסקנה: האנרגיה החשמלית לא נשמרת בתהליך, למרות שהמטען נשמר. החלק שאבד הפך לחום בתילים, ולפעמים לניצוץ. הוא לא תלוי בתילים: תילים עבים מקצרים את התהליך, אבל לא משנים כמה אנרגיה הולכת לאיבוד.
      - kind: reasoning
        text: >-
          (ד) נסמן ב-$v_n$ את המתח על $C_2$ אחרי $n$ חיבורים, עם $v_0 = 0$. לפני החיבור ה-$(n+1)$, על $C_1$ שוב $Q_0 = C_1V_0$, ועל $C_2$ המטען $C_2v_n$. אותו נימוק כמו ב-(ב): המטען הכולל על הלוחות המחוברים נשמר, ובסוף המתח על שני הקבלים שווה:
          $$C_1V_0 + C_2v_n = (C_1 + C_2)\,v_{n+1}$$
      - kind: manipulation
        text: >-
          נבדוק כמה חסר ל-$C_2$ עד $V_0$: נסמן $d_n = V_0 - v_n$. מחסרים את המשוואה מ-$(C_1 + C_2)V_0$, ומחלקים ב-$C_1 + C_2$:
          $$d_{n+1} = \frac{C_2}{C_1 + C_2}\,d_n = 0.6\,d_n$$
          בכל חיבור החסר קטן פי $0.6$, ומתחיל ב-$d_0 = V_0$. לכן $d_n = V_0\cdot0.6^{\,n}$, ו-$v_n = V_0\left(1 - 0.6^{\,n}\right) = 12\left(1 - 0.6^{\,n}\right)\,\text{V}$.
      - kind: substitution
        text: >-
          בדיקה: $v_1 = 12\cdot0.4 = 4.8\,\text{V}$, כמו ב-(ב). $0.6^{\,n}$ שואף לאפס, ולכן $v_n$ שואף ל-$V_0 = 12\,\text{V}$. רוצים $v_n > 11$, כלומר $12\cdot0.6^{\,n} < 1$, או $0.6^{\,n} < \dfrac{1}{12}$. מוציאים לוגריתם משני האגפים; $\log 0.6$ שלילי, ולכן כשמחלקים בו סימן אי-השוויון מתהפך:
          $$n > \frac{\log(1/12)}{\log 0.6} \approx 4.86$$
          ולכן $n = 5$: $v_4 \approx 10.4\,\text{V}$ ו-$v_5 \approx 11.07\,\text{V}$.
      - kind: reasoning
        text: >-
          לאורך התהליך האיבוד בכל חיבור קטן, כי המתחים של שני הקבלים לפני החיבור קרובים יותר ויותר. כשהם כמעט שווים, כמעט לא עובר מטען, וכמעט שום דבר לא אובד.
      - kind: result
        text: >-
          (א) $12\,\text{V}$. (ב) $4.8\,\text{V}$, $q_1 = 9.6\,\mu\text{C}$, $q_2 = 14.4\,\mu\text{C}$. (ג) אבדו $86.4\,\mu\text{J}$ מתוך $144\,\mu\text{J}$, החלק $\dfrac{C_2}{C_1 + C_2} = 0.6$; האנרגיה הפכה לחום, גם כשהמטען נשמר. (ד) $v_n = 12\left(1 - 0.6^{\,n}\right)\,\text{V}$, שואף ל-$12\,\text{V}$, ועובר את $11\,\text{V}$ אחרי $5$ חיבורים.
    source:
      name: British Physics Olympiad (BPhO), Round 1
      year: 2013
      problem: 'Round 1, 15 November 2013, Section 1, part (j)'
      url: https://www.bpho.org.uk/Papers/R1/2013Nov_R1_S1.pdf
      verified: '2026-11-02'
      adapted: true
