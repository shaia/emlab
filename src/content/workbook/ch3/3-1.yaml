# Workbook for lesson 3.1: ten practice problems and two sourced challenge problems.
# Every potential below was recomputed with solveCircuit (and the RC energies with advance and
# elementPowers) from src/physics/circuits.ts, the capacitor numbers with seriesString and
# shareCharge from src/physics/capacitors.ts, and the constants in src/physics/constants.ts.

lesson: '3.1'
practice:
  - id: W-3.1-01
    level: basic
    qualitative: false
    objectives: [OBJ-3.1-3]
    prompt: >-
      סוללה של $1.5\,\text{V}$ יכולה "להרים", עד שהחומרים הכימיים שלה נגמרים, מטען כולל של $9000\,\text{C}$.

      (א) כמה אנרגיה יכולה הסוללה למסור למעגל, עד שהיא מתרוקנת?

      (ב) לאיזה גובה הייתה האנרגיה הזו יכולה להרים ספר של $1\,\text{kg}$? הזניחו כל איבוד אנרגיה.

      (ג) לסוללה אחרת, של $9\,\text{V}$, יש אותו מטען כולל. פי כמה יותר אנרגיה היא יכולה למסור?
    answer: >-
      (א) $13500\,\text{J}$, כלומר $1.35\cdot10^{4}\,\text{J}$.

      (ב) $1350\,\text{m}$.

      (ג) פי $6$.
    solution:
      - kind: given
        text: >-
          המתח של הסוללה $V = 1.5\,\text{V}$, המטען הכולל $q = 9000\,\text{C}$. בסעיף (ב) $m = 1\,\text{kg}$ ו-$g = 10\,\text{m/s}^2$.
      - kind: formula
        text: >-
          כל קולון שעובר בסוללה מההדק השלילי אל החיובי מקבל בה אנרגיה של $1.5\,\text{J}$, ולכן $W = qV$. בסעיף (ב) האנרגיה הופכת לאנרגיה פוטנציאלית כובדית, $W = mgh$.
      - kind: substitution
        text: >-
          (א) $W = 9000\cdot1.5 = 13500\,\text{J}$.
      - kind: manipulation
        text: >-
          (ב) מחפשים את $h$, ולכן מחלקים את שני האגפים של $W = mgh$ ב-$mg$:
          $$h = \frac{W}{mg} = \frac{13500}{1\cdot10} = 1350\ \text{m}$$
      - kind: reasoning
        text: >-
          (ג) אותו מטען $q$, ומתח גדול פי $\dfrac{9}{1.5} = 6$. האנרגיה $W = qV$ ביחס ישר למתח, ולכן גדולה פי $6$: $9000\cdot9 = 81000\,\text{J}$.
      - kind: result
        text: >-
          (א) $1.35\cdot10^{4}\,\text{J}$. (ב) כ-$1350\,\text{m}$, יותר מקילומטר. (ג) פי $6$.

  - id: W-3.1-02
    level: basic
    qualitative: false
    objectives: [OBJ-3.1-2]
    prompt: >-
      סוללה של $6\,\text{V}$ ונורה מחוברות במעגל סגור. הפעם בוחרים את ההדק **החיובי** כנקודת הייחוס, $0\,\text{V}$.

      (א) מה הפוטנציאל של ההדק השלילי?

      (ב) מה הפוטנציאל של נקודה על התיל שבין ההדק החיובי לנורה, ומה הפוטנציאל של נקודה על התיל שבין הנורה להדק השלילי?

      (ג) מחברים מד מתח: החוד האדום בקצה של הנורה שמחובר להדק השלילי, והחוד השחור בקצה שמחובר להדק החיובי. מה הוא יראה?
    answer: >-
      (א) $V = -6\,\text{V}$.

      (ב) על התיל שבצד החיובי $V = 0$, ועל התיל שבצד השלילי $V = -6\,\text{V}$.

      (ג) מד המתח מראה $(-6) - 0 = -6\,\text{V}$.
    solution:
      - kind: given
        text: >-
          ההדק החיובי ב-$0\,\text{V}$. הסוללה שומרת על הפרש של $6\,\text{V}$ בין ההדקים, וההדק השלילי הוא הנמוך מביניהם.
      - kind: reasoning
        text: >-
          (א) ההדק השלילי נמוך ב-$6\,\text{V}$ מההדק החיובי: $V_- = 0 - 6 = -6\,\text{V}$.
      - kind: reasoning
        text: >-
          (ב) לאורך תיל הפוטנציאל לא משתנה. התיל שבצד החיובי מחובר להדק החיובי, ולכן כולו ב-$0$. התיל שבצד השלילי מחובר להדק השלילי, ולכן כולו בפוטנציאל $V = -6\,\text{V}$. כל הירידה של $6\,\text{V}$ היא בנורה.
      - kind: substitution
        text: >-
          (ג) מד המתח מראה את הפוטנציאל של החוד האדום פחות הפוטנציאל של החוד השחור: $(-6) - 0 = -6\,\text{V}$.
      - kind: result
        text: >-
          (א) $V = -6\,\text{V}$. (ב) $0$ בצד החיובי ו-$V = -6\,\text{V}$ בצד השלילי. (ג) מד המתח מראה $(-6) - 0 = -6\,\text{V}$: הסימן השלילי אומר שהחוד האדום בפוטנציאל הנמוך. המתח על הנורה, $6\,\text{V}$, לא תלוי בנקודת הייחוס שבחרנו.

  - id: W-3.1-03
    level: basic
    qualitative: true
    objectives: [OBJ-3.1-4]
    prompt: >-
      במכונית, ההדק השלילי של הסוללה ($12\,\text{V}$) מחובר בתיל עבה אל הגוף המתכתי של המכונית. אל כל פנס מגיע מהסוללה רק תיל אחד, מההדק החיובי, דרך מפסק. המגע השני של הפנס מוברג ישירות אל הגוף המתכתי.

      (א) תלמיד טוען שהפנס לא יכול לדלוק, כי מגיע אליו רק תיל אחד. האם הוא צודק? נמקו בעזרת מסלול סגור.

      (ב) המפסק סגור. בוחרים את ההדק השלילי כנקודת הייחוס. מה הפוטנציאל של הגוף המתכתי, ומה הפוטנציאל של כל אחד משני המגעים של הפנס?

      (ג) הבורג שמחבר את הפנס אל הגוף המתכתי מחליד, ולא מוליך יותר. מה המתח על הפנס עכשיו? ובין אילו שתי נקודות נמצא כל המתח של הסוללה?
    answer: >-
      (א) לא. הגוף המתכתי משמש כמוליך השני, ויש מסלול סגור מהדק להדק.

      (ב) הגוף המתכתי ב-$0$. מגע אחד של הפנס ב-$12\,\text{V}$, והמגע שמוברג לגוף ב-$0$.

      (ג) על הפנס $0$. כל $12\,\text{V}$ נמצאים בין המגע של הפנס לבין הגוף המתכתי, על פני הנתק שבבורג.
    solution:
      - kind: reasoning
        text: >-
          (א) זרם זורם כשיש מסלול סגור מהדק אחד של הסוללה, דרך הרכיבים, אל ההדק השני. כאן המסלול הוא: ההדק החיובי, התיל, המפסק, הפנס, הבורג, הגוף המתכתי, התיל העבה וההדק השלילי. הגוף המתכתי הוא מוליך, והוא ממלא את התפקיד של התיל השני. התלמיד טועה: מה שקובע הוא המסלול הסגור, לא מספר התילים.
      - kind: reasoning
        text: >-
          (ב) הגוף המתכתי מחובר בתיל להדק השלילי, ולכן הוא ב-$0$. המגע של הפנס שמוברג אליו גם הוא ב-$0$. המגע השני מחובר, דרך המפסק הסגור, להדק החיובי, ולכן הוא ב-$12\,\text{V}$. על חוט הלהט של הפנס יש $12\,\text{V}$, ולכן יש בו שדה, והפנס דולק.
      - kind: reasoning
        text: >-
          (ג) עכשיו אין מסלול סגור, ולא זורם זרם. חוט הלהט הוא מוליך בשיווי משקל שמחובר רק לצד החיובי, ולכן שני המגעים של הפנס ב-$12\,\text{V}$, והמתח על הפנס $0$. הגוף המתכתי נשאר ב-$0$, ולכן בין המגע המנותק של הפנס לבין הגוף יש $12\,\text{V}$, כמו על פני מפסק פתוח.
      - kind: result
        text: >-
          (א) התלמיד טועה: הגוף המתכתי סוגר את המסלול. (ב) הגוף ב-$0$, ומגעי הפנס ב-$12\,\text{V}$ וב-$0$. (ג) על הפנס $0$, והוא כבוי. כל $12\,\text{V}$ נמצאים על פני הנתק שבבורג.

  - id: W-3.1-04
    level: mid
    qualitative: true
    objectives: [OBJ-3.1-1]
    prompt: >-
      מוט מתכת מונח בין שני לוחות טעונים, בשדה חשמלי שמכוון לאורכו, כמו בשיעור 1.9. בנורה דולקת שמחוברת לסוללה, השדה מכוון לאורך חוט הלהט.

      (א) ברגע הראשון יש שדה גם בתוך המוט, ואלקטרונים חופשיים מתחילים לנוע בו. מה קורה בתוך המוט אחרי שבריר שנייה, ולמה?

      (ב) למה בחוט הלהט של הנורה המטען ממשיך לנוע כל הזמן, ולא מגיע לאותו מצב?

      (ג) נסחו במשפט אחד את ההבדל: מתי מוליך מגיע לשיווי משקל, ומתי לא?
    answer: >-
      (א) האלקטרונים מצטברים בקצה אחד של המוט, ובקצה השני נשאר מטען חיובי. המטענים האלה יוצרים בתוך המוט שדה הפוך, עד שהשדה בתוכו מתאפס, כל המוט באותו פוטנציאל, והתנועה נפסקת.

      (ב) אלקטרונים שמגיעים לקצה של חוט הלהט ממשיכים בתיל, והסוללה מרימה מטען ומחזיקה את שני הקצוות בפוטנציאלים שונים. הפרש הפוטנציאלים נשאר, ולכן גם השדה נשאר.

      (ג) מוליך מגיע לשיווי משקל כשאין מה שיחזיק את קצותיו בפוטנציאלים שונים. כשסוללה מחזיקה אותם כך במעגל סגור, יש בו שדה וזרם כל הזמן.
    solution:
      - kind: reasoning
        text: >-
          (א) השדה החיצוני מפעיל כוח על האלקטרונים החופשיים, הפוך לשדה, והם נעים אל קצה אחד של המוט. שם מצטבר מטען שלילי, ובקצה השני חסרים אלקטרונים, ולכן נשאר מטען חיובי. המטענים שבקצוות יוצרים בתוך המוט שדה בכיוון ההפוך לשדה החיצוני. התנועה נמשכת כל עוד השדה השקול בפנים אינו אפס. היא נעצרת כשהשדה של המטענים מבטל בדיוק את החיצוני: אז השדה בפנים אפס, וכל המוט באותו פוטנציאל (שיעור 1.9).
      - kind: reasoning
        text: >-
          (ב) בחוט הלהט האלקטרונים לא נתקעים בקצה: הקצה מחובר בתיל, ודרכו במסלול סגור אל ההדק של הסוללה. הסוללה מרימה מטען מהפוטנציאל הנמוך אל הגבוה, וכך שומרת על הפרש פוטנציאלים קבוע בין ההדקים, ולכן גם בין שני הקצוות של חוט הלהט. כשבין הקצוות יש הפרש פוטנציאלים, יש בתוך החוט שדה, והוא ממשיך להניע את האלקטרונים.
      - kind: reasoning
        text: >-
          (ג) המוט הוא מוליך מבודד: המטען שבו יכול רק להסתדר מחדש, ובסוף הוא מגיע לשיווי משקל. חוט הלהט הוא חלק ממעגל סגור עם סוללה, שלא נותנת לו להגיע לשיווי משקל.
      - kind: result
        text: >-
          במוט, המטען מסתדר תוך שבריר שנייה עד שהשדה בפנים מתאפס, והתנועה נפסקת. בחוט הלהט, הסוללה מחזיקה את הקצוות בפוטנציאלים שונים, ולכן השדה והתנועה נשארים. מוליך יוצא משיווי משקל רק כשמשהו מחזיק את קצותיו בפוטנציאלים שונים.

  - id: W-3.1-05
    level: mid
    qualitative: false
    objectives: [OBJ-3.1-1, OBJ-3.1-3]
    prompt: >-
      על חוט הלהט של נורה יש מתח של $6\,\text{V}$.

      (א) נניח, רק לצורך החשבון, שאלקטרון היה יוצא ממנוחה בקצה אחד של חוט הלהט ועובר את כולו בלי להתנגש בשום דבר. מה הייתה האנרגיה הקינטית שלו בקצה השני, ומה הייתה המהירות שלו?

      (ב) בפועל, האלקטרונים בחוט נעים לאט מאוד. הסבירו למה הם לא מאיצים למהירות של (א), ולאן הולכת העבודה שהשדה עושה עליהם.

      (ג) האם העבודה שהשדה עושה על אלקטרון שעובר את כל החוט תלויה בכך שהוא מתנגש בדרך? נמקו.
    answer: >-
      (א) $E_k = 6\,\text{eV} = 9.6\cdot10^{-19}\,\text{J}$, ו-$v \approx 1.5\cdot10^{6}\,\text{m/s}$.

      (ב) האלקטרון מתנגש שוב ושוב ביוני המתכת, ובכל התנגשות מעביר להם את האנרגיה שקיבל. היונים רוטטים חזק יותר: החוט מתחמם וזוהר.

      (ג) לא. העבודה היא $W = eV = 6\,\text{eV}$ בכל מקרה; ההתנגשויות קובעות רק לאן היא הולכת.
    solution:
      - kind: given
        text: >-
          $V = 6\,\text{V}$ בין קצות החוט, $e = 1.6\cdot10^{-19}\,\text{C}$, $m_e = 9.1\cdot10^{-31}\,\text{kg}$.
      - kind: formula
        text: >-
          העבודה של השדה על מטען שעובר הפרש פוטנציאלים $V$ היא $W = qV$. בלי התנגשויות כל העבודה הופכת לאנרגיה קינטית: $\tfrac12 m_e v^2 = eV$.
      - kind: substitution
        text: >-
          (א) $E_k = eV = 1.6\cdot10^{-19}\cdot6 = 9.6\cdot10^{-19}\,\text{J}$, כלומר $6\,\text{eV}$.
      - kind: manipulation
        text: >-
          מבודדים את $v$: כופלים את שני האגפים ב-$2$, מחלקים ב-$m_e$, ומוציאים שורש:
          $$v = \sqrt{\frac{2eV}{m_e}} = \sqrt{\frac{2\cdot9.6\cdot10^{-19}}{9.1\cdot10^{-31}}} \approx 1.45\cdot10^{6}\ \text{m/s}$$
      - kind: reasoning
        text: >-
          (ב) בחוט יש יוני מתכת צפופים, והאלקטרון מתנגש בהם פעמים רבות מאוד בכל שנייה. בין התנגשות להתנגשות השדה מאיץ אותו מעט, ובהתנגשות הוא מעביר ליון את האנרגיה שקיבל. לכן המהירות הממוצעת שלו לאורך החוט נשארת קטנה, והאנרגיה הולכת לרטט של היונים: החוט מתחמם עד שהוא זוהר.
      - kind: reasoning
        text: >-
          (ג) העבודה של השדה החשמלי על מטען תלויה רק בהפרש הפוטנציאלים בין נקודת ההתחלה לנקודת הסוף (השדה משמר, שיעור 2.1). לכן על כל אלקטרון שעובר את החוט השדה עושה $6\,\text{eV}$, עם התנגשויות או בלעדיהן. בלי התנגשויות היא הייתה נשארת אצל האלקטרון כאנרגיה קינטית. עם התנגשויות היא נמסרת לחוט.
      - kind: result
        text: >-
          (א) $9.6\cdot10^{-19}\,\text{J}$, ומהירות של כ-$1.5\cdot10^{6}\,\text{m/s}$. (ב) ההתנגשויות ביונים מעבירות את האנרגיה לחוט, שמתחמם. (ג) העבודה היא $6\,\text{eV}$ לכל אלקטרון בכל מקרה.

  - id: W-3.1-06
    level: mid
    qualitative: false
    objectives: [OBJ-3.1-2]
    prompt: >-
      שלוש נורות זהות, $L_1$, $L_2$ ו-$L_3$, מחוברות בזו אחר זו לסוללה של $12\,\text{V}$, במעגל סגור: מההדק החיובי אל $L_1$, משם אל $L_2$, אל $L_3$, וחזרה אל ההדק השלילי. הפעם בוחרים כנקודת ייחוס, $0\,\text{V}$, נקודה על התיל שבין $L_1$ ל-$L_2$.

      (א) מה המתח על כל נורה?

      (ב) מה הפוטנציאל של ההדק החיובי, של נקודה על התיל שבין $L_2$ ל-$L_3$, ושל ההדק השלילי?

      (ג) מחברים מד מתח: החוד האדום בהדק השלילי, והחוד השחור בהדק החיובי. מה הוא יראה?
    answer: >-
      (א) $4\,\text{V}$ על כל נורה.

      (ב) ההדק החיובי ב-$4\,\text{V}$, בנקודה שבין $L_2$ ל-$L_3$ הפוטנציאל $V = -4\,\text{V}$, ובהדק השלילי $V_- = -8\,\text{V}$.

      (ג) $V_- - V_+ = -12\,\text{V}$.
    solution:
      - kind: given
        text: >-
          המתח של הסוללה $12\,\text{V}$, שלוש נורות זהות בזו אחר זו, ונקודת הייחוס בין $L_1$ ל-$L_2$.
      - kind: reasoning
        text: >-
          (א) הולכים עם הכיוון שבו נע מטען חיובי, מההדק החיובי אל השלילי. הפוטנציאל יורד $12\,\text{V}$ בסך הכול, ולאורך התילים הוא לא משתנה, ולכן כל הירידה בנורות. הנורות זהות, ולכן הן מתחלקות בה שווה בשווה: $\dfrac{12}{3} = 4\,\text{V}$ על כל אחת.
      - kind: reasoning
        text: >-
          (ב) מתחילים מנקודת הייחוס, $0$. ההדק החיובי נמצא "לפני" $L_1$, כלומר גבוה ממנה ב-$4\,\text{V}$: $V_+ = 4\,\text{V}$. אחרי $L_2$ הפוטנציאל יורד עוד $4\,\text{V}$: $V = 0 - 4 = -4\,\text{V}$. אחרי $L_3$ יורד עוד $4\,\text{V}$: $V_- = -4 - 4 = -8\,\text{V}$.
      - kind: substitution
        text: >-
          (ג) $V_- - V_+ = (-8) - 4 = -12\,\text{V}$.
      - kind: result
        text: >-
          (א) $4\,\text{V}$ על כל נורה. (ב) $V_+ = 4\,\text{V}$, בין $L_2$ ל-$L_3$ הפוטנציאל $V = -4\,\text{V}$, ו-$V_- = -8\,\text{V}$. (ג) $V_- - V_+ = -12\,\text{V}$. נקודת הייחוס שינתה את כל הפוטנציאלים, אבל המתח בין ההדקים נשאר $12\,\text{V}$.

