  - id: W-3.9-c2
    stars: 2
    objectives: [OBJ-3.9-1]
    prompt: >-
      קבל ריק של $100\,\mu\text{F}$ נטען דרך נגד של $1\,\text{k}\Omega$ ממקור מתח אידאלי שאפשר לכוון את המתח שלו. בכל שלב המתח נשאר קבוע זמן רב לעומת $RC$, כך שהקבל מספיק להיטען עד המתח של המקור.

      א. תהליך 1: מכוונים את המקור ל-$12\,\text{V}$ בבת אחת. מה העבודה של המקור, מה האנרגיה שנאגרת בקבל, וכמה חום מתפתח בנגד?

      ב. תהליך 2: מכוונים את המקור ל-$4\,\text{V}$ ומחכים, אחר כך ל-$8\,\text{V}$ ומחכים, ולבסוף ל-$12\,\text{V}$ ומחכים, בלי לפרוק את הקבל בין השלבים. מה העבודה של המקור בכל שלב, וכמה חום מתפתח בנגד בסך הכול?

      ג. הראו שבשלב שבו המקור מכוון למתח $V$ והקבל מתחיל במתח $V - \Delta V$, מתפתח בנגד חום של $\tfrac12 C\,(\Delta V)^2$. מכאן מצאו את החום הכולל כשמגיעים ל-$12\,\text{V}$ ב-$N$ שלבים שווים. מה קורה לחום כש-$N$ גדל מאוד?
    answer: >-
      א. $W = 14.4\,\text{mJ}$, $U = 7.2\,\text{mJ}$, חום $7.2\,\text{mJ}$.

      ב. $1.6$, $3.2$ ו-$4.8\,\text{mJ}$: בסך הכול $9.6\,\text{mJ}$; חום $2.4\,\text{mJ}$, שליש מהחום של תהליך 1.

      ג. החום הכולל $\dfrac{CV_0^2}{2N}$, כאשר $V_0 = 12\,\text{V}$: $\dfrac{7.2\,\text{mJ}}{N}$. כש-$N$ גדל מאוד החום שואף לאפס.
    solution:
      - kind: given
        text: '$C = 10^{-4}\,\text{F}$, $R = 10^{3}\,\Omega$, מתח סופי $V_0 = 12\,\text{V}$. כל שלב נמשך זמן רב לעומת $RC = 0.1\,\text{s}$.'
      - kind: formula
        text: >-
          המקור מעביר מטען $\Delta Q$ (המטען אחרי פחות המטען לפני) במתח קבוע $V$, ולכן עבודתו $W = V\,\Delta Q$. האנרגיה בקבל $U = \tfrac12 CV^2$. מקור אידאלי, ואין במעגל התנגדות מלבד הנגד, ולכן לפי שימור האנרגיה החום בנגד הוא $W - \Delta U$.
      - kind: substitution
        text: >-
          א. $\Delta Q = CV_0 = 10^{-4}\,\text{F}\cdot12\,\text{V} = 1.2\cdot10^{-3}\,\text{C}$, ולכן $W = 12\,\text{V}\cdot1.2\cdot10^{-3}\,\text{C} = 14.4\,\text{mJ}$.
          $U = \tfrac12\cdot10^{-4}\,\text{F}\cdot(12\,\text{V})^2 = 7.2\,\text{mJ}$, והחום $14.4\,\text{mJ} - 7.2\,\text{mJ} = 7.2\,\text{mJ}$: חצי, כמו בשיעור.
      - kind: substitution
        text: >-
          ב. בכל שלב המתח על הקבל עולה ב-$4\,\text{V}$, ולכן בכל שלב $\Delta Q = 10^{-4}\,\text{F}\cdot4\,\text{V} = 4\cdot10^{-4}\,\text{C}$. העבודה בכל שלב היא המתח של המקור באותו שלב כפול $\Delta Q$:
          $$W_1 = 4\,\text{V}\cdot4\cdot10^{-4}\,\text{C} = 1.6\,\text{mJ} \qquad W_2 = 8\,\text{V}\cdot4\cdot10^{-4}\,\text{C} = 3.2\,\text{mJ} \qquad W_3 = 12\,\text{V}\cdot4\cdot10^{-4}\,\text{C} = 4.8\,\text{mJ}$$
          בסך הכול $9.6\,\text{mJ}$. הקבל מסיים באותם $7.2\,\text{mJ}$, ולכן החום $9.6\,\text{mJ} - 7.2\,\text{mJ} = 2.4\,\text{mJ}$.
      - kind: manipulation
        text: >-
          ג. בשלב אחד: $\Delta Q = C\,\Delta V$, ולכן $W = VC\,\Delta V$. האנרגיה בקבל גדלה ב-
          $$\Delta U = \tfrac12 CV^2 - \tfrac12 C\,(V - \Delta V)^2 = \tfrac12 C\left(2V\,\Delta V - (\Delta V)^2\right) = CV\,\Delta V - \tfrac12 C\,(\Delta V)^2$$
          ולכן החום בשלב הוא $W - \Delta U = \tfrac12 C\,(\Delta V)^2$. הוא לא תלוי ב-$V$ ולא ב-$R$, רק בקפיצה $\Delta V$.
      - kind: reasoning
        text: >-
          ג. ב-$N$ שלבים שווים $\Delta V = V_0/N$, ובכל שלב אותו חום. החום הכולל:
          $$N\cdot\tfrac12 C\left(\frac{V_0}{N}\right)^2 = \frac{CV_0^2}{2N} = \frac{7.2\,\text{mJ}}{N}$$
          בדיקה: $N = 1$ נותן $7.2\,\text{mJ}$, כמו ב-(א), ו-$N = 3$ נותן $2.4\,\text{mJ}$, כמו ב-(ב). כש-$N$ גדל מאוד, החום שואף לאפס: טעינה בצעדים קטנים מאוד, שבה המקור תמיד רק מעט מעל המתח של הקבל, כמעט לא מבזבזת אנרגיה.
      - kind: reasoning
        text: >-
          המסקנה "חצי מהעבודה הופך לחום" נכונה רק בתנאי שלה: קבל ריק שנטען בבת אחת ממקור שהמתח שלו קבוע לאורך כל הטעינה. החום תלוי בקפיצת המתח על הנגד ברגע הראשון של כל שלב.
      - kind: result
        text: >-
          א. $W = 14.4\,\text{mJ}$, $U = 7.2\,\text{mJ}$, חום $7.2\,\text{mJ}$.

          ב. $1.6$, $3.2$ ו-$4.8\,\text{mJ}$, בסך הכול $9.6\,\text{mJ}$; חום $2.4\,\text{mJ}$.

          ג. בכל שלב $\tfrac12 C\,(\Delta V)^2$; ב-$N$ שלבים $\dfrac{7.2\,\text{mJ}}{N}$, ששואף לאפס כש-$N$ גדל מאוד.
