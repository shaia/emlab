    diagramAlt: >-
      מעגל מלבני. בצלע השמאלית סוללה של 12 וולט, והקו הארוך שלה, הצד החיובי, למעלה. בחוט העליון, משמאל לימין, מפסק S ונגד R1 של 2 אוהם. אחריו שני ענפים אנכיים שיורדים אל החוט התחתון: נגד R2 של 4 אוהם, ומימינו נגד R3 של 4 אוהם ומתחתיו קבל C של 10 מיקרופאראד.
    answer: >-
      א. ב-$R_1$ זורם $3\,\text{A}$, וב-$R_2$ וב-$R_3$ זורם $1.5\,\text{A}$ בכל אחד; המד מראה $6\,\text{V}$.

      ב. ב-$R_1$ וב-$R_2$ זורם $2\,\text{A}$, וב-$R_3$ אין זרם; המד מראה $0$; $V_C = 8\,\text{V}$ ו-$Q = 80\,\mu\text{C}$.

      ג. דרך $R_2$ ו-$R_3$ בטור; $\tau = 8\cdot10^{-5}\,\text{s}$; ב-$R_2$ זורם $1\,\text{A}$.
    solution:
      - kind: given
        text: '$\varepsilon = 12\,\text{V}$, $R_1 = 2\,\Omega$, $R_2 = R_3 = 4\,\Omega$, $C = 10\cdot10^{-6}\,\text{F}$. הקבל ריק כשסוגרים את המפסק.'
      - kind: reasoning
        text: >-
          א. ברגע הראשון הקבל ריק, אין עליו מתח, והוא מתנהג כמו תיל. אז $R_2$ ו-$R_3$ שני נגדים שווים במקביל, $\dfrac{4\cdot4}{4+4} = 2\,\Omega$, בטור עם $R_1$: ההתנגדות השקולה $4\,\Omega$.
      - kind: substitution
        text: >-
          א. $I_1 = \dfrac{12\,\text{V}}{4\,\Omega} = 3\,\text{A}$. הענפים שווים, ולכן הזרם מתחלק שווה בשווה: $1.5\,\text{A}$ ב-$R_2$ ו-$1.5\,\text{A}$ ב-$R_3$. על $R_3$: $V = 1.5\,\text{A}\cdot4\,\Omega = 6\,\text{V}$.
      - kind: reasoning
        text: >-
          ב. במצב יציב הקבל כמו נתק, ולכן בענף של $R_3$ והקבל אין זרם. $R_1$ ו-$R_2$ נשארים בטור: $I = \dfrac{12\,\text{V}}{2\,\Omega + 4\,\Omega} = 2\,\text{A}$. ב-$R_3$ אין זרם, ולכן אין עליו מתח: $V = IR = 0$.
      - kind: reasoning
        text: >-
          ב. הענף של $R_3$ והקבל מחובר במקביל ל-$R_2$, ולכן המתח על כל הענף שווה למתח על $R_2$, $2\,\text{A}\cdot4\,\Omega = 8\,\text{V}$. על $R_3$ אין מתח, ולכן כל $8\,\text{V}$ על הקבל:
          $$Q = CV_C = 10\cdot10^{-6}\,\text{F}\cdot8\,\text{V} = 8\cdot10^{-5}\,\text{C}$$
      - kind: reasoning
        text: >-
          ג. פתיחת המפסק מנתקת את הסוללה ואת $R_1$. נשארת לולאה אחת: הקבל, $R_3$ ו-$R_2$, והקבל מתפרק דרך שני הנגדים, שמחוברים עכשיו בטור: אותו זרם עובר בשניהם. לכן ההתנגדות בלולאה $R_2 + R_3 = 8\,\Omega$, ו-$\tau = (R_2 + R_3)\,C$.
      - kind: substitution
        text: >-
          ג. $\tau = 8\,\Omega\cdot10\cdot10^{-6}\,\text{F} = 8\cdot10^{-5}\,\text{s}$. ברגע הראשון המתח על הקבל עדיין $8\,\text{V}$, ולכן $I = \dfrac{8\,\text{V}}{8\,\Omega} = 1\,\text{A}$, ב-$R_3$ וגם ב-$R_2$.
      - kind: result
        text: >-
          א. $I_1 = 3\,\text{A}$, $I_2 = I_3 = 1.5\,\text{A}$; המד מראה $6\,\text{V}$.

          ב. $I_1 = I_2 = 2\,\text{A}$, $I_3 = 0$; המד מראה $0$; $V_C = 8\,\text{V}$, $Q = 80\,\mu\text{C}$.

          ג. דרך $R_2$ ו-$R_3$ בטור; $\tau = 8\cdot10^{-5}\,\text{s}$; ב-$R_2$ זורם $1\,\text{A}$, חצי מהזרם שזרם בו רגע לפני הפתיחה.

  - id: W-3.9-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-3.9-1, OBJ-3.9-2]
    prompt: >-
      במבזק של מצלמה, קבל של $100\,\mu\text{F}$ טעון למתח של $300\,\text{V}$. ברגע הצילום הוא מתפרק דרך נורת המבזק, שההתנגדות שלה $4\,\Omega$ (נתייחס אליה כקבועה).

      א. כמה אנרגיה אגורה בקבל לפני הצילום?

      ב. מה קבוע הזמן, ומה הזרם ברגע הראשון של הפריקה?

      ג. איזה חלק מהאנרגיה ההתחלתית נשאר בקבל אחרי זמן $\tau$?

      ד. מה ההספק הממוצע של הנורה במשך ה-$\tau$ הראשון?
    answer: >-
      א. $4.5\,\text{J}$.

      ב. $\tau = 4\cdot10^{-4}\,\text{s}$, $I_0 = 75\,\text{A}$.

      ג. כ-14% (ליתר דיוק 13.5%), לא 37%.

      ד. כ-$9.7\cdot10^{3}\,\text{W}$.
    solution:
      - kind: given
        text: '$C = 100\cdot10^{-6}\,\text{F} = 10^{-4}\,\text{F}$, $V_0 = 300\,\text{V}$, $R = 4\,\Omega$.'
      - kind: formula
        text: '$U = \tfrac12 CV^2$, $\tau = RC$, $I_0 = \dfrac{V_0}{R}$, ולהספק ממוצע $P = \dfrac{E}{t}$.'
      - kind: substitution
        text: >-
          א. $U_0 = \tfrac12\cdot10^{-4}\,\text{F}\cdot(300\,\text{V})^2 = 4.5\,\text{J}$.

          ב. $\tau = 4\,\Omega\cdot10^{-4}\,\text{F} = 4\cdot10^{-4}\,\text{s}$, ו-$I_0 = \dfrac{300\,\text{V}}{4\,\Omega} = 75\,\text{A}$.
      - kind: reasoning
        text: >-
          ג. אחרי $\tau$ **המתח** יורד ל-37%: $V \approx 0.37\cdot300\,\text{V} \approx 110\,\text{V}$. האנרגיה תלויה בריבוע המתח, ולכן היא יורדת פי $0.37^2$:
          $$\frac{U}{U_0} = \left(\frac{V}{V_0}\right)^2 \approx 0.37^2 \approx 0.14$$
          חישוב מדויק יותר, עם $e^{-1} = 0.368$, נותן $0.368^2 \approx 0.135$, כלומר $U \approx 0.135\cdot4.5\,\text{J} \approx 0.61\,\text{J}$.
      - kind: reasoning
        text: >-
          ד. במשך ה-$\tau$ הראשון יצאו מהקבל $4.5\,\text{J} - 0.61\,\text{J} \approx 3.9\,\text{J}$, וכולם עברו בנורה (ההתנגדות היחידה במעגל), שם הפכו לאור ולחום:
          $$P = \frac{3.9\,\text{J}}{4\cdot10^{-4}\,\text{s}} \approx 9.7\cdot10^{3}\,\text{W}$$
          את המספר $9.7$ קיבלנו מ-$3.89\,\text{J}$, לפני העיגול ל-$3.9$.
      - kind: result
        text: >-
          א. $4.5\,\text{J}$.

          ב. $\tau = 4\cdot10^{-4}\,\text{s}$ ו-$I_0 = 75\,\text{A}$.

          ג. כ-14%: כ-$0.6\,\text{J}$. רוב האנרגיה, כ-86%, יוצאת כבר ב-$\tau$ הראשון.

          ד. כ-$9.7\cdot10^{3}\,\text{W}$, כמעט עשרה קילוואט.

  - id: W-3.9-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-3.9-1, OBJ-3.9-2]
    prompt: >-
      במעגל עם מתג דו-כיווני, במצב A המתג מחבר קבל ריק של $50\,\mu\text{F}$ בטור לנגד $R_1 = 10\,\text{k}\Omega$ ולסוללה אידאלית של $10\,\text{V}$. במצב B הוא מחבר את הקבל לנגד $R_2 = 5\,\text{k}\Omega$ בלבד, בלי הסוללה. המתג במצב A במשך $1.0\,\text{s}$, ואז מעבירים אותו בבת אחת למצב B.

      א. מה קבוע הזמן במצב A, ומה במצב B?

      ב. מה המתח על הקבל ברגע ההעברה? מה הזרם בקבל רגע לפני ההעברה?

      ג. מה הזרם בקבל רגע אחרי ההעברה, ובאיזה כיוון, בהשוואה לזרם רגע לפניה?

      ד. בערך מה המתח על הקבל $0.25\,\text{s}$ אחרי ההעברה?
    answer: >-
      א. $\tau_A = 0.5\,\text{s}$, $\tau_B = 0.25\,\text{s}$.

      ב. כ-$8.6\,\text{V}$; כ-$0.14\,\text{mA}$.

      ג. כ-$1.7\,\text{mA}$, בכיוון ההפוך: הזרם קפץ פי יותר מ-10 והתהפך.

      ד. כ-$3.2\,\text{V}$.
    solution:
      - kind: given
        text: '$C = 50\cdot10^{-6}\,\text{F}$, $R_1 = 10^{4}\,\Omega$, $R_2 = 5\cdot10^{3}\,\Omega$, $\varepsilon = 10\,\text{V}$. המתג במצב A במשך $1.0\,\text{s}$.'
      - kind: formula
        text: '$\tau = RC$, ובכל רגע $I = \dfrac{V_R}{R}$.'
      - kind: substitution
        text: 'א. $\tau_A = 10^{4}\,\Omega\cdot50\cdot10^{-6}\,\text{F} = 0.5\,\text{s}$, ו-$\tau_B = 5\cdot10^{3}\,\Omega\cdot50\cdot10^{-6}\,\text{F} = 0.25\,\text{s}$.'
      - kind: reasoning
        text: >-
          ב. $1.0\,\text{s}$ הן $2\tau_A$, ולכן הקבל ב-86% מהמתח הסופי: $V_C \approx 0.86\cdot10\,\text{V} \approx 8.6\,\text{V}$. על $R_1$ נשאר $10\,\text{V} - 8.6\,\text{V} = 1.4\,\text{V}$, ולכן רגע לפני ההעברה
          $$I = \frac{1.4\,\text{V}}{10^{4}\,\Omega} = 1.4\cdot10^{-4}\,\text{A}$$
      - kind: reasoning
        text: >-
          ג. ברגע ההעברה המטען על הקבל עוד לא השתנה, ולכן גם המתח עליו: $8.6\,\text{V}$. עכשיו כל המתח הזה על $R_2$, והקבל דוחף מטען מהלוח החיובי שלו דרך $R_2$, כלומר בכיוון ההפוך לזרם הטעינה:
          $$I = \frac{8.6\,\text{V}}{5\cdot10^{3}\,\Omega} \approx 1.7\cdot10^{-3}\,\text{A}$$
          המתח על הקבל לא קופץ, כי הוא תלוי במטען, והמטען משתנה רק בהדרגה. הזרם, לעומת זאת, יכול לקפוץ: הוא נקבע בכל רגע לפי המתח על הנגד שמחובר עכשיו.
      - kind: reasoning
        text: 'ד. $0.25\,\text{s}$ הן $\tau_B$ אחד, והמתח יורד ל-37%: $V_C \approx 0.37\cdot8.6\,\text{V} \approx 3.2\,\text{V}$.'
      - kind: result
        text: >-
          א. $\tau_A = 0.5\,\text{s}$ ו-$\tau_B = 0.25\,\text{s}$.

          ב. $V_C \approx 8.6\,\text{V}$, ו-$I \approx 0.14\,\text{mA}$.

          ג. $I \approx 1.7\,\text{mA}$, בכיוון ההפוך לזרם שלפני ההעברה.

          ד. $V_C \approx 3.2\,\text{V}$.

challenge:
  - id: W-3.9-c1
    stars: 1
    objectives: [OBJ-3.9-1, OBJ-3.9-2]
    prompt: >-
      נגד של $2\,\text{k}\Omega$ וקבל ריק של $5\,\mu\text{F}$ מחוברים בטור למתג דו-כיווני. ברגע $t = 0$ המתג מחבר אותם לסוללה אידאלית של $5\,\text{V}$, שההדק החיובי שלה מחובר דרך המתג לנגד, וברגע $t = 0.020\,\text{s}$ הוא עובר למצב שבו הוא מחבר את קצה הנגד ישירות ללוח השני של הקבל, בלי הסוללה. נסמן ב-$V_R$ את הפוטנציאל של קצה הנגד שמחובר למתג פחות הפוטנציאל של קצהו השני, שמחובר לקבל, וב-$V_C$ את המתח על הקבל.

      א. מה קבוע הזמן? כמה קבועי זמן נמשך החיבור לסוללה?

      ב. מצאו את $V_C$ ואת $V_R$ ברגעים $t = 0$, $t = 0.010\,\text{s}$, ורגע לפני $t = 0.020\,\text{s}$.

      ג. מצאו את $V_C$ ואת $V_R$ רגע אחרי $t = 0.020\,\text{s}$, וברגע $t = 0.030\,\text{s}$.

      ד. שרטטו על אותם צירים, מ-$t = 0$ עד $t = 0.06\,\text{s}$, את $V_C$, את $V_R$ ואת הסכום $V_C + V_R$.
    answer: >-
      א. $\tau = 0.010\,\text{s}$; החיבור נמשך $2\tau$.

      ב. ב-$t = 0$: $V_C = 0$, $V_R = 5\,\text{V}$. ב-$t = 0.010\,\text{s}$: $V_C \approx 3.2\,\text{V}$, $V_R \approx 1.8\,\text{V}$. לפני $0.020\,\text{s}$: $V_C \approx 4.3\,\text{V}$, $V_R \approx 0.7\,\text{V}$.

      ג. אחרי $0.020\,\text{s}$: $V_C \approx 4.3\,\text{V}$, $V_R \approx -4.3\,\text{V}$. ב-$t = 0.030\,\text{s}$: $V_C \approx 1.6\,\text{V}$, $V_R \approx -1.6\,\text{V}$.

      ד. $V_C$ עולה ואז דועך לאפס בלי לקפוץ; $V_R$ דועך מ-$5\,\text{V}$, קופץ לערך שלילי, $V_R \approx -4.3\,\text{V}$, ודועך חזרה לאפס; הסכום $5\,\text{V}$ עד $0.020\,\text{s}$, ואפס אחר כך.
    solution:
      - kind: given
        text: '$R = 2\cdot10^{3}\,\Omega$, $C = 5\cdot10^{-6}\,\text{F}$, $\varepsilon = 5\,\text{V}$. החיבור לסוללה מ-$t = 0$ עד $t = 0.020\,\text{s}$.'
      - kind: substitution
        text: 'א. $\tau = RC = 2\cdot10^{3}\,\Omega\cdot5\cdot10^{-6}\,\text{F} = 10^{-2}\,\text{s}$. החיבור נמשך $0.020\,\text{s} = 2\tau$.'
      - kind: reasoning
        text: >-
          ב. בזמן החיבור, לפי חוק הלולאות, $V_C + V_R = \varepsilon = 5\,\text{V}$ בכל רגע. ב-$t = 0$ הקבל ריק: $V_C = 0$ ו-$V_R = 5\,\text{V}$.
          אחרי $\tau$ הקבל ב-63%: $V_C \approx 0.63\cdot5\,\text{V} \approx 3.2\,\text{V}$, ו-$V_R = 5\,\text{V} - 3.2\,\text{V} \approx 1.8\,\text{V}$.
          אחרי $2\tau$ הוא ב-86%: $V_C \approx 0.86\cdot5\,\text{V} \approx 4.3\,\text{V}$, ו-$V_R \approx 0.7\,\text{V}$.
      - kind: reasoning
        text: >-
          ג. ברגע המעבר המטען על הקבל לא משתנה, ולכן $V_C$ נשאר כ-$4.3\,\text{V}$. בלולאה החדשה אין סוללה: הנגד והקבל מחוברים זה לזה, ולכן עכשיו $V_C + V_R = 0$ בכל רגע, ו-$V_R \approx -4.3\,\text{V}$. הסימן התהפך כי הזרם התהפך: הקבל מתפרק, ומטען זורם בנגד בכיוון ההפוך לזרם הטעינה.
          אחרי $\tau$ נוסף, ב-$t = 0.030\,\text{s}$, המתח על הקבל יורד ל-37%: $V_C \approx 0.37\cdot4.3\,\text{V} \approx 1.6\,\text{V}$, ו-$V_R \approx -1.6\,\text{V}$.
      - kind: reasoning
        text: >-
          ד. $V_C$: עולה מאפס, מהר בהתחלה, עד כ-$4.3\,\text{V}$ ב-$0.020\,\text{s}$, ואחר כך דועך לאפס. הגרף שלו רציף, בלי קפיצה, כי המטען משתנה רק בהדרגה.
          $V_R$: מתחיל ב-$5\,\text{V}$ ודועך עד כ-$0.7\,\text{V}$, ב-$0.020\,\text{s}$ קופץ בבת אחת לערך שלילי, $V_R \approx -4.3\,\text{V}$, ואז דועך חזרה לאפס. ב-$0.06\,\text{s}$, כ-$4\tau$ אחרי המעבר, שני הגרפים כמעט באפס.
          הסכום הוא $5\,\text{V}$ עד $0.020\,\text{s}$, ואפס אחר כך: זו צורת המתח שהמתג "נותן" לנגד ולקבל יחד.
      - kind: result
        text: >-
          א. $\tau = 0.010\,\text{s}$; החיבור נמשך $2\tau$.

          ב. $(V_C, V_R)$: $(0, 5\,\text{V})$, $(3.2\,\text{V}, 1.8\,\text{V})$, $(4.3\,\text{V}, 0.7\,\text{V})$.

          ג. $(4.3\,\text{V}, -4.3\,\text{V})$ ואז $(1.6\,\text{V}, -1.6\,\text{V})$.

          ד. $V_C$ רציף; $V_R$ קופץ ב-$0.020\,\text{s}$ מ-$0.7\,\text{V}$ אל $V_R \approx -4.3\,\text{V}$; הסכום $5\,\text{V}$ ואז אפס.
    source:
