# Workbook, lesson 3.9 (the RC circuit). Format and rules: see .claude/CLAUDE.md, "Worked examples, workbook".
# Every number was recomputed with src/physics/circuits.ts: rcCharge / rcDischarge for the curves, solveCircuit for the
# steady states (capacitor open) and for "the first moment" (one tiny backward-Euler step from an empty capacitor), and
# advance() to check the discharge of W-3.9-08 and the heat of W-3.9-c2.
# In a >- block, consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.
# Sign convention, as in chapter 2: ΔQ = after − before, and the battery's work is W = V·ΔQ.

lesson: '3.9'
practice:
  - id: W-3.9-01
    level: basic
    qualitative: false
    objectives: [OBJ-3.9-2]
    prompt: >-
      קבל ריק של $2.2\,\mu\text{F}$ נטען דרך נגד של $1\,\text{M}\Omega$ מסוללה אידאלית של $10\,\text{V}$.

      א. מה קבוע הזמן?

      ב. בערך כמה זמן עובר עד שהקבל כמעט מלא?

      ג. בערך מה המתח על הקבל $4.4\,\text{s}$ אחרי סגירת המפסק?
    answer: >-
      א. $\tau = 2.2\,\text{s}$.

      ב. כ-$5\tau$, כלומר כ-$11\,\text{s}$.

      ג. כ-$8.6\,\text{V}$.
    solution:
      - kind: given
        text: '$C = 2.2\,\mu\text{F} = 2.2\cdot10^{-6}\,\text{F}$, $R = 1\,\text{M}\Omega = 10^{6}\,\Omega$, $\varepsilon = 10\,\text{V}$.'
      - kind: formula
        text: '$\tau = RC$.'
      - kind: substitution
        text: 'א. $\tau = 10^{6}\,\Omega\cdot2.2\cdot10^{-6}\,\text{F} = 2.2\,\text{s}$. הקידומות מגה ומיקרו מבטלות זו את זו: $10^{6}\cdot10^{-6} = 1$.'
      - kind: reasoning
        text: 'ב. אחרי כ-$5\tau$ הטעינה כמעט הסתיימה: $5\cdot2.2\,\text{s} = 11\,\text{s}$.'
      - kind: reasoning
        text: >-
          ג. $4.4\,\text{s}$ הן $2\tau$. אחרי $\tau$ הקבל ב-63% מהמתח הסופי, ובכל $\tau$ נוסף נסגר שוב 63% מהפער שנשאר, ולכן אחרי $2\tau$ הוא ב-$63\% + 0.63\cdot37\% \approx 86\%$:
          $$V_C \approx 0.86\cdot10\,\text{V} \approx 8.6\,\text{V}$$
      - kind: result
        text: >-
          א. $\tau = 2.2\,\text{s}$.

          ב. כ-$11\,\text{s}$.

          ג. כ-$8.6\,\text{V}$.

  - id: W-3.9-02
    level: basic
    qualitative: true
    objectives: [OBJ-3.9-1]
    prompt: >-
      לפניכם שלוש צורות של גרף, כתלות בזמן: (1) עולה מאפס, מהר בהתחלה ולאט בסוף, ומתקרב לערך קבוע; (2) מתחיל בערך הגדול ביותר ודועך לאפס, מהר בהתחלה ולאט בסוף; (3) קו ישר אופקי.

      א. קבל ריק נטען דרך נגד מסוללה אידאלית. איזו צורה מתארת כל אחד מהגדלים: המתח על הקבל, המתח על הנגד, הזרם במעגל, והמטען על הקבל?

      ב. אחרי שהקבל התמלא מעבירים את המתג כך שהקבל מתפרק דרך הנגד, בלי הסוללה. איזו צורה מתארת עכשיו את המתח על הקבל, את גודל הזרם ואת המטען?

      ג. בזמן הטעינה, איזה גודל מתואר בצורה (3)? נמקו.
    answer: >-
      א. המתח על הקבל והמטען: (1). המתח על הנגד והזרם: (2).

      ב. שלושתם: (2).

      ג. המתח של הסוללה, שהוא גם הסכום של המתח על הקבל ושל המתח על הנגד.
    solution:
      - kind: reasoning
        text: >-
          א. הקבל מתחיל ריק, ולכן $V_C = 0$, ונטען עד $\varepsilon$, בהתחלה מהר ובסוף לאט: צורה (1). המטען $q = CV_C$, ולכן גם הוא בצורה (1).
          על הנגד נשאר $V_R = \varepsilon - V_C$: בהתחלה כל $\varepsilon$, ובסוף אפס, צורה (2). הזרם $I = V_R/R$ מתנהג כמו המתח על הנגד: צורה (2).
      - kind: reasoning
        text: >-
          ב. בפריקה אין סוללה. המתח על הקבל יורד מהמתח שהיה לו לאפס, ודועך: צורה (2). הזרם הוא $V_C/R$, ולכן גודלו דועך באותה צורה, אבל כיוונו הפוך לזרם הטעינה. המטען $q = CV_C$ דועך יחד עם המתח.
      - kind: reasoning
        text: >-
          ג. לפי חוק הלולאות, בכל רגע $V_C + V_R = \varepsilon$. כשאחד עולה השני יורד באותה מידה, והסכום שלהם, המתח של הסוללה האידאלית, קבוע.
      - kind: result
        text: >-
          א. $V_C$ ו-$q$: צורה (1). $V_R$ ו-$I$: צורה (2).

          ב. $V_C$, גודל הזרם ו-$q$: צורה (2).

          ג. המתח של הסוללה, $V_C + V_R = \varepsilon$.

  - id: W-3.9-03
    level: basic
    qualitative: false
    objectives: [OBJ-3.9-1]
    prompt: >-
      סוללה אידאלית של $6\,\text{V}$, מפסק, נגד של $1.5\,\text{k}\Omega$ וקבל ריק של $47\,\mu\text{F}$ מחוברים בטור. סוגרים את המפסק.
      מצאו את המתח על הנגד, את המתח על הקבל, את הזרם ואת המטען על הקבל, פעם ברגע הראשון ופעם זמן רב אחר כך.
    answer: >-
      ברגע הראשון: $V_R = 6\,\text{V}$, $V_C = 0$, $I = 4\,\text{mA}$, $Q = 0$.

      זמן רב אחר כך: $V_R = 0$, $V_C = 6\,\text{V}$, $I = 0$, $Q \approx 2.8\cdot10^{-4}\,\text{C}$.
    solution:
      - kind: given
        text: '$\varepsilon = 6\,\text{V}$, $R = 1.5\cdot10^{3}\,\Omega$, $C = 47\cdot10^{-6}\,\text{F}$. הקבל ריק כשסוגרים את המפסק.'
      - kind: reasoning
        text: >-
          ברגע הראשון אין מטען על הקבל, ולכן גם אין עליו מתח ($V = Q/C$). הקבל מתנהג כמו תיל, וכל המתח של הסוללה על הנגד.
      - kind: formula
        text: '$I = \dfrac{V_R}{R}$ ו-$Q = CV_C$.'
      - kind: substitution
        text: 'ברגע הראשון: $I_0 = \dfrac{6\,\text{V}}{1.5\cdot10^{3}\,\Omega} = 4\cdot10^{-3}\,\text{A}$.'
      - kind: reasoning
        text: >-
          זמן רב אחר כך הקבל מלא ומתנהג כמו נתק: אין זרם, ולכן על הנגד $V_R = IR = 0$, וכל $6\,\text{V}$ של הסוללה על הקבל.
      - kind: substitution
        text: 'זמן רב אחר כך: $Q = 47\cdot10^{-6}\,\text{F}\cdot6\,\text{V} = 2.82\cdot10^{-4}\,\text{C}$.'
      - kind: result
        text: >-
          ברגע הראשון: $V_R = 6\,\text{V}$, $V_C = 0$, $I = 4\,\text{mA}$, $Q = 0$.

          זמן רב אחר כך: $V_R = 0$, $V_C = 6\,\text{V}$, $I = 0$, $Q \approx 2.8\cdot10^{-4}\,\text{C}$.

  - id: W-3.9-04
    level: mid
    qualitative: false
    objectives: [OBJ-3.9-1, OBJ-3.9-2]
    prompt: >-
      קבל ריק נטען דרך נגד מסוללה אידאלית של $9\,\text{V}$. מד זרם אידאלי מראה $3\,\text{mA}$ ברגע הסגירה, ו-$1.1\,\text{mA}$ אחרי $0.6\,\text{s}$.

      א. מה ההתנגדות של הנגד?

      ב. מה קבוע הזמן, ומה הקיבול?

      ג. מה המתח על הקבל אחרי $0.6\,\text{s}$? בדקו שהתשובה מתאימה למה שידוע על טעינה אחרי $\tau$ אחד.
    answer: >-
      א. $R = 3\,\text{k}\Omega$.

      ב. $\tau \approx 0.6\,\text{s}$, $C \approx 200\,\mu\text{F}$.

      ג. $V_C \approx 5.7\,\text{V}$, כ-63% מ-$9\,\text{V}$.
    solution:
      - kind: given
        text: '$\varepsilon = 9\,\text{V}$, $I_0 = 3\cdot10^{-3}\,\text{A}$, ואחרי $t = 0.6\,\text{s}$ הזרם $I = 1.1\cdot10^{-3}\,\text{A}$.'
      - kind: reasoning
        text: 'א. ברגע הסגירה הקבל ריק ואין עליו מתח, ולכן כל $9\,\text{V}$ על הנגד: $I_0 = \varepsilon/R$.'
      - kind: manipulation
        text: 'מכפילים את שני האגפים ב-$R$ ומחלקים ב-$I_0$: $R = \dfrac{\varepsilon}{I_0}$.'
      - kind: substitution
        text: 'א. $R = \dfrac{9\,\text{V}}{3\cdot10^{-3}\,\text{A}} = 3\cdot10^{3}\,\Omega$.'
      - kind: reasoning
        text: >-
          ב. $\dfrac{1.1\,\text{mA}}{3\,\text{mA}} \approx 0.37$: בטעינה הזרם יורד ל-37% מהזרם ההתחלתי אחרי $\tau$ אחד, ולכן $\tau \approx 0.6\,\text{s}$.
          מ-$\tau = RC$, מחלקים ב-$R$ הידוע:
          $$C = \frac{\tau}{R} = \frac{0.6\,\text{s}}{3\cdot10^{3}\,\Omega} = 2\cdot10^{-4}\,\text{F}$$
      - kind: reasoning
        text: >-
          ג. לפי חוק הלולאות $V_C = \varepsilon - V_R = \varepsilon - IR$:
          $$V_C = 9\,\text{V} - 1.1\cdot10^{-3}\,\text{A}\cdot3\cdot10^{3}\,\Omega = 9\,\text{V} - 3.3\,\text{V} = 5.7\,\text{V}$$
          ואכן $5.7/9 \approx 0.63$: אחרי $\tau$ אחד הקבל ב-63% מהמתח הסופי.
      - kind: result
        text: >-
          א. $R = 3\,\text{k}\Omega$.

          ב. $\tau \approx 0.6\,\text{s}$ ו-$C \approx 200\,\mu\text{F}$.

          ג. $V_C \approx 5.7\,\text{V}$.

  - id: W-3.9-05
    level: mid
    qualitative: true
    objectives: [OBJ-3.9-2]
    prompt: >-
      במעגל RC קבל ריק נטען מסוללה אידאלית. בכל סעיף משנים רק דבר אחד, לעומת המעגל המקורי. קבעו ונמקו, לכל שינוי, פי כמה משתנים: קבוע הזמן $\tau$, הזרם ברגע הראשון, המטען הסופי על הקבל, והזמן שבו הקבל מגיע לחצי מהמתח הסופי שלו.

      א. ההתנגדות גדלה פי 2.

      ב. הקיבול קטן פי 2.

      ג. הכא״מ גדל פי 2.
    answer: >-
      א. $\tau$ פי 2, הזרם ההתחלתי פי חצי, המטען הסופי לא משתנה, זמן החצי פי 2.

      ב. $\tau$ פי חצי, הזרם ההתחלתי לא משתנה, המטען הסופי פי חצי, זמן החצי פי חצי.

      ג. $\tau$ לא משתנה, הזרם ההתחלתי פי 2, המטען הסופי פי 2, זמן החצי לא משתנה.
    solution:
      - kind: reasoning
        text: >-
          שלוש עובדות מספיקות: $\tau = RC$; ברגע הראשון הקבל ריק, ולכן $I_0 = \varepsilon/R$; ובסוף כל המתח על הקבל, ולכן $Q = C\varepsilon$.
      - kind: reasoning
        text: >-
          הזמן עד חצי מהמתח הסופי: לכל מעגל RC אותה צורת עקומה, אם מודדים את הזמן ביחידות של $\tau$. אחרי $\tau$ אחד כל קבל ב-63% מהמתח הסופי שלו, אחרי $2\tau$ ב-86%, וכך גם לכל שבר אחר. לכן חצי מהמתח הסופי מושג תמיד באותו מספר של קבועי זמן, קצת לפני $\tau$ אחד, וזמן החצי משתנה בדיוק כמו $\tau$.
      - kind: reasoning
        text: >-
          א. $R$ פי 2: $\tau = RC$ פי 2; $I_0 = \varepsilon/R$ פי חצי; $Q = C\varepsilon$ לא תלוי ב-$R$; זמן החצי פי 2.
      - kind: reasoning
        text: >-
          ב. $C$ פי חצי: $\tau$ פי חצי; $I_0 = \varepsilon/R$ לא תלוי ב-$C$; $Q = C\varepsilon$ פי חצי; זמן החצי פי חצי.
      - kind: reasoning
        text: >-
          ג. $\varepsilon$ פי 2: $\tau = RC$ לא משתנה; $I_0$ פי 2; $Q$ פי 2. הקבל נטען למתח כפול בזרם כפול, ולכן מגיע לחצי מהמתח הסופי, הכפול, באותו זמן.
      - kind: result
        text: >-
          א. $\tau$ גדל פי 2, $I_0$ קטן פי 2, $Q$ לא משתנה, זמן החצי גדל פי 2.

          ב. $\tau$ קטן פי 2, $I_0$ לא משתנה, $Q$ קטן פי 2, זמן החצי קטן פי 2.

          ג. $\tau$ לא משתנה, $I_0$ גדל פי 2, $Q$ גדל פי 2, זמן החצי לא משתנה.

  - id: W-3.9-06
    level: mid
    qualitative: false
    objectives: [OBJ-3.9-3]
    prompt: >-
      לסוללה כא״מ של $12\,\text{V}$ והתנגדות פנימית של $1\,\Omega$. בין ההדקים שלה מחוברים, במקביל זה לזה, נגד של $5\,\Omega$ וקבל של $20\,\mu\text{F}$.

      א. מה המתח על הקבל, ומה המטען עליו, זמן רב אחרי החיבור?

      ב. מנתקים את הנגד, והקבל נשאר מחובר לסוללה. מה המתח על הקבל, ומה המטען עליו, זמן רב אחר כך? בכמה השתנה המטען?
    answer: >-
      א. $V_C = 10\,\text{V}$, $Q = 200\,\mu\text{C}$.

      ב. $V_C = 12\,\text{V}$, $Q = 240\,\mu\text{C}$: המטען גדל ב-$40\,\mu\text{C}$.
    solution:
      - kind: given
        text: '$\varepsilon = 12\,\text{V}$, $r = 1\,\Omega$, $R = 5\,\Omega$, $C = 20\cdot10^{-6}\,\text{F}$.'
      - kind: reasoning
        text: >-
          א. במצב יציב בענף של הקבל אין זרם, והקבל כמו נתק. הזרם עובר בסוללה ובנגד בלבד, וההתנגדות הפנימית בטור לנגד. הקבל מחובר בין ההדקים, ולכן המתח עליו הוא מתח ההדקים, שהוא גם המתח על הנגד.
      - kind: formula
        text: '$I = \dfrac{\varepsilon}{R + r}$, $V = IR$, $Q = CV$.'
      - kind: substitution
        text: >-
          א. $$I = \frac{12\,\text{V}}{5\,\Omega + 1\,\Omega} = 2\,\text{A} \qquad V_C = 2\,\text{A}\cdot5\,\Omega = 10\,\text{V} \qquad Q = 20\cdot10^{-6}\,\text{F}\cdot10\,\text{V} = 2\cdot10^{-4}\,\text{C}$$
      - kind: reasoning
        text: >-
          ב. בלי הנגד, במצב יציב אין זרם בכלל: גם לא בסוללה. לכן אין מתח על ההתנגדות הפנימית, $Ir = 0$, ומתח ההדקים שווה לכא״מ. הקבל נטען ל-$12\,\text{V}$.
      - kind: substitution
        text: 'ב. $Q = 20\cdot10^{-6}\,\text{F}\cdot12\,\text{V} = 2.4\cdot10^{-4}\,\text{C}$, כלומר $\Delta Q = 240\,\mu\text{C} - 200\,\mu\text{C} = 40\,\mu\text{C}$.'
      - kind: result
        text: >-
          א. $V_C = 10\,\text{V}$ ו-$Q = 200\,\mu\text{C}$.

          ב. $V_C = 12\,\text{V}$ ו-$Q = 240\,\mu\text{C}$; המטען גדל ב-$40\,\mu\text{C}$.

  - id: W-3.9-07
    level: mid
    qualitative: true
    objectives: [OBJ-3.9-1, OBJ-3.9-3]
    prompt: >-
      שלוש נורות זהות, $L_1$, $L_2$ ו-$L_3$, וקבל ריק מחוברים לסוללה אידאלית ולמפסק כך: $L_1$ בטור עם הסוללה והמפסק, ואחריה שני ענפים שמחוברים במקביל זה לזה. בענף אחד $L_2$ לבדה, ובענף השני $L_3$ בטור עם הקבל. נתייחס לנורות כאל נגדים שההתנגדות שלהם קבועה.

      א. סוגרים את המפסק. דרגו את הנורות לפי עוצמת ההארה ברגע הראשון.

      ב. דרגו אותן זמן רב אחר כך.

      ג. אילו נורות מתחזקות עם הזמן, ואילו נחלשות?
    answer: >-
      א. $L_1$ מאירה הכי חזק, ו-$L_2$ ו-$L_3$ שוות זו לזו.

      ב. $L_1$ ו-$L_2$ שוות זו לזו, ו-$L_3$ כבויה.

      ג. $L_2$ מתחזקת, $L_1$ ו-$L_3$ נחלשות.
    solution:
      - kind: reasoning
        text: >-
          נסמן את ההתנגדות של כל נורה ב-$R$ ואת הכא״מ ב-$\varepsilon$. נורה מאירה חזק יותר כשהזרם בה גדול יותר, כי $P = I^2R$ וההתנגדות של כל הנורות שווה.
      - kind: reasoning
        text: >-
          א. ברגע הראשון הקבל ריק ומתנהג כמו תיל. אז $L_2$ ו-$L_3$ הן שני נגדים שווים במקביל, $R/2$, בטור עם $L_1$. ההתנגדות השקולה $1.5R$, ולכן ב-$L_1$ זורם $\dfrac{\varepsilon}{1.5R}$, והזרם הזה מתחלק שווה בשווה בין $L_2$ ל-$L_3$: בכל אחת $\dfrac{\varepsilon}{3R}$.
      - kind: reasoning
        text: >-
          ב. במצב יציב הקבל כמו נתק: בענף של $L_3$ אין זרם. נשארו $L_1$ ו-$L_2$ בטור, ובשתיהן $\dfrac{\varepsilon}{2R}$.
      - kind: reasoning
        text: >-
          ג. נשווה: ב-$L_1$ הזרם יורד מ-$\dfrac{\varepsilon}{1.5R}$ אל $\dfrac{\varepsilon}{2R}$, וב-$L_2$ הוא עולה מ-$\dfrac{\varepsilon}{3R}$ אל $\dfrac{\varepsilon}{2R}$. ב-$L_3$ הוא יורד מ-$\dfrac{\varepsilon}{3R}$ לאפס, כי ככל שהקבל נטען המתח עליו גדל, והוא דוחק את הזרם בענף שלו.
      - kind: result
        text: >-
          א. $L_1$ הכי חזקה; $L_2 = L_3$.

          ב. $L_1 = L_2$; $L_3$ כבויה.

          ג. $L_2$ מתחזקת; $L_1$ ו-$L_3$ נחלשות.

  - id: W-3.9-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-3.9-1, OBJ-3.9-2, OBJ-3.9-3]
    prompt: >-
      במעגל שבאיור, סוללה אידאלית של $12\,\text{V}$, מפסק S ונגד $R_1 = 2\,\Omega$ מחוברים בטור לשני ענפים שמחוברים במקביל זה לזה. בענף אחד נגד $R_2 = 4\,\Omega$, ובענף השני נגד $R_3 = 4\,\Omega$ בטור עם קבל של $10\,\mu\text{F}$. בהתחלה הקבל ריק.

      א. סוגרים את המפסק. מה הזרם בכל נגד ברגע הראשון? מה מראה מד מתח אידאלי שמחובר ל-$R_3$?

      ב. מה הזרם בכל נגד, ומה מראה המד שעל $R_3$, זמן רב אחר כך? מה המתח על הקבל, ומה המטען עליו?

      ג. זמן רב אחרי הסגירה פותחים את המפסק. דרך אילו נגדים מתפרק הקבל? מה קבוע הזמן של הפריקה, ומה הזרם ב-$R_2$ ברגע הראשון אחריה?
