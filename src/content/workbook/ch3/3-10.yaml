    answer: >-
      (א) $I = 0.50\,\text{A}$, ומד המתח מראה $3.75\,\text{V}$.

      (ב) $\tau = 9.0\,\text{ms}$; המתח על הקבל $2.84\,\text{V}$.

      (ג) $4.5\,\text{V}$; $Q = 4.5\cdot10^{-3}\,\text{C}$.

      (ד) $W = 2.03\cdot10^{-2}\,\text{J}$, $U = 1.01\cdot10^{-2}\,\text{J}$; חום $8.4\cdot10^{-3}\,\text{J}$ בנגד ו-$1.7\cdot10^{-3}\,\text{J}$ בסוללה.
    solution:
      - kind: given
        text: >-
          $\varepsilon = 4.5\,\text{V}$, $r = 1.5\,\Omega$, $R = 7.5\,\Omega$, $C = 1000\,\mu\text{F} = 1.0\cdot10^{-3}\,\text{F}$. הקבל ריק ב-$t = 0$.
      - kind: reasoning
        text: >-
          (א) ברגע הראשון אין מטען על הקבל, ולכן אין עליו מתח: הוא מתנהג כמו תיל (שיעור 3.9). בלולאה נשארות שתי התנגדויות בטור, $R$ ו-$r$.
      - kind: substitution
        text: >-
          $$I_0 = \frac{\varepsilon}{R + r} = \frac{4.5}{7.5 + 1.5} = 0.50\ \text{A}
          \qquad
          V_0 = \varepsilon - I_0 r = 4.5 - 0.50\cdot1.5 = 3.75\ \text{V}$$
      - kind: reasoning
        text: >-
          (ב) המטען שמגיע לקבל עובר גם דרך $R$ וגם דרך ההתנגדות הפנימית, בטור. לכן בקבוע הזמן מופיעה ההתנגדות הכוללת של הלולאה, $R + r$, ולא רק $R$.
      - kind: substitution
        text: >-
          $$\tau = (R + r)\,C = 9.0\cdot1.0\cdot10^{-3} = 9.0\cdot10^{-3}\ \text{s} = 9.0\ \text{ms}$$
          אחרי קבוע זמן אחד הקבל מגיע לכ-$63\%$ מהמתח הסופי, $\varepsilon$: $0.632\cdot4.5 = 2.84\,\text{V}$.
      - kind: reasoning
        text: >-
          (ג) זמן רב אחרי הסגירה הקבל מלא ומתנהג כמו נתק: הזרם אפס. בלי זרם אין ירידת מתח לא בנגד ולא בתוך הסוללה, ולכן מד המתח מראה $\varepsilon = 4.5\,\text{V}$, וגם המתח על הקבל הוא $4.5\,\text{V}$. במהלך הטעינה מד המתח עלה מ-$3.75\,\text{V}$ ל-$4.5\,\text{V}$, כי הזרם קטן.
      - kind: substitution
        text: >-
          $$Q = CV = 1.0\cdot10^{-3}\cdot4.5 = 4.5\cdot10^{-3}\ \text{C}$$
      - kind: substitution
        text: >-
          (ד) המטען על הקבל עלה מאפס ל-$Q$, ולכן דרך הסוללה עבר המטען $\Delta Q$ (המטען בסוף פחות המטען בהתחלה), $\Delta Q = 4.5\cdot10^{-3}\,\text{C}$. הכא״מ עשה עליו עבודה $\varepsilon$ לכל קולון:
          $$W = \varepsilon\,\Delta Q = 4.5\cdot4.5\cdot10^{-3} = 2.03\cdot10^{-2}\ \text{J}
          \qquad
          U = \tfrac12 CV^2 = \tfrac12\cdot1.0\cdot10^{-3}\cdot4.5^2 = 1.01\cdot10^{-2}\ \text{J}$$
      - kind: reasoning
        text: >-
          ההפרש, $W - U = 1.01\cdot10^{-2}\,\text{J}$, הפך לחום. בדיוק חצי מהעבודה הלך לחום, וזה נכון רק בתנאי של הבעיה הזו: קבל שנטען **מריק** דרך התנגדויות, מכא״מ קבוע. בכל רגע עובר אותו זרם ב-$R$ וב-$r$, וההספק בכל אחת מהן הוא $I^2R$, ולכן החום מתחלק ביחס ההתנגדויות, $7.5 : 1.5 = 5 : 1$.
      - kind: substitution
        text: >-
          בנגד: $\tfrac56\cdot1.01\cdot10^{-2} = 8.4\cdot10^{-3}\,\text{J}$. בתוך הסוללה: $\tfrac16\cdot1.01\cdot10^{-2} = 1.7\cdot10^{-3}\,\text{J}$.
      - kind: result
        text: >-
          (א) $I = 0.50\,\text{A}$, ומד המתח מראה $3.75\,\text{V}$.

          (ב) $\tau = (R + r)C = 9.0\,\text{ms}$; אחרי קבוע זמן אחד המתח על הקבל $2.84\,\text{V}$.

          (ג) מד המתח מראה $4.5\,\text{V}$, הכא״מ; $Q = 4.5\cdot10^{-3}\,\text{C}$.

          (ד) $W = 2.03\cdot10^{-2}\,\text{J}$, $U = 1.01\cdot10^{-2}\,\text{J}$, וחום של $8.4\cdot10^{-3}\,\text{J}$ בנגד ו-$1.7\cdot10^{-3}\,\text{J}$ בתוך הסוללה.

  - id: W-3.10-10
