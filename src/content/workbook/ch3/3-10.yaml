        <text x="66" y="128" text-anchor="end" fill="currentColor">r<tspan font-size="10" dy="3">1</tspan></text>
        <text x="246" y="108" text-anchor="end" fill="currentColor">ε<tspan font-size="10" dy="3">2</tspan><tspan dy="-3"> = 4.8 V</tspan></text>
        <text x="246" y="128" text-anchor="end" fill="currentColor">r<tspan font-size="10" dy="3">2</tspan><tspan dy="-3"> = 0.5 Ω</tspan></text>
        <text x="436" y="115" fill="currentColor">R = 4 Ω</text>
        <text x="100" y="152" text-anchor="middle" fill="currentColor" font-size="12">1</text>
        <text x="280" y="152" text-anchor="middle" fill="currentColor" font-size="12">2</text>
      </svg>
    answer: >-
      (א) $\varepsilon_1 = 4.5\,\text{V}$, $r_1 = 1.5\,\Omega$.

      (ב) בסוללה 1: $0.12\,\text{A}$, בסוללה 2: $0.96\,\text{A}$, בנגד: $1.08\,\text{A}$.

      (ג) $0.15\,\text{A}$, והוא נכנס לסוללה הישנה בהדק החיובי שלה. הכא״מ החדש נותן $0.72\,\text{W}$, הישן מקבל $0.675\,\text{W}$, ו-$0.045\,\text{W}$ הופכים לחום.
    solution:
      - kind: substitution
        text: >-
          (א) השיפוע של האופיין:
          $$m = \frac{2.7 - 3.9}{1.2 - 0.4} = \frac{-1.2}{0.8} = -1.5\ \text{V/A}$$
          ולכן $r_1 = 1.5\,\Omega$. מ-$0.4\,\text{A}$ עד אפס המתח עולה ב-$1.5\cdot0.4 = 0.6\,\text{V}$: $\varepsilon_1 = 3.9 + 0.6 = 4.5\,\text{V}$.
      - kind: reasoning
        text: >-
          (ב) לשתי הסוללות ולנגד יש אותם שני צמתים, ולכן על שלושתם אותו מתח $V$: מתח ההדקים של כל סוללה הוא המתח על הנגד. מסמנים את הזרם בכל סוללה מהשלילי לחיובי בתוכה, $I_1$ ו-$I_2$, ואת הזרם בנגד $I_R$.
      - kind: formula
        text: >-
          חוק הלולאות לכל סוללה עם הנגד, וחוק הצמתים בצומת העליון:
          $$V = \varepsilon_1 - I_1 r_1 = \varepsilon_2 - I_2 r_2 = I_R R
          \qquad
          I_1 + I_2 = I_R$$
      - kind: manipulation
        text: >-
          מבודדים כל זרם בעזרת $V$: $I_1 = \dfrac{\varepsilon_1 - V}{r_1}$, $I_2 = \dfrac{\varepsilon_2 - V}{r_2}$, $I_R = \dfrac{V}{R}$, ומציבים בחוק הצמתים:
          $$\frac{4.5 - V}{1.5} + \frac{4.8 - V}{0.5} = \frac{V}{4}$$
      - kind: substitution
        text: >-
          מפרקים כל שבר: $3 - 0.667V + 9.6 - 2V = 0.25V$. מעבירים את כל האיברים עם $V$ לצד אחד: $12.6 = 2.917V$, ומחלקים ב-$2.917$:
          $$V = \frac{12.6}{2.917} = 4.32\ \text{V}$$
          $$I_1 = \frac{4.5 - 4.32}{1.5} = 0.12\ \text{A}
          \qquad
          I_2 = \frac{4.8 - 4.32}{0.5} = 0.96\ \text{A}
          \qquad
          I_R = \frac{4.32}{4} = 1.08\ \text{A}$$
          בדיקה בצומת: $0.12 + 0.96 = 1.08\,\text{A}$.
      - kind: reasoning
        text: >-
          (ג) בלי הנגד נשארת לולאה אחת: שתי הסוללות, חיובי מול חיובי, כך שהכא״מים שלהן פועלים זה נגד זה. הכא״מ הגדול יותר, של הסוללה החדשה, קובע את כיוון הזרם: הזרם יוצא מההדק החיובי של הסוללה החדשה ונכנס לסוללה הישנה **בהדק החיובי שלה**, כלומר עובר בה מהחיובי לשלילי. אם מסמנים, כמו ב-(ב), את $I_1$ מהשלילי לחיובי, הוא יוצא שלילי.
      - kind: substitution
        text: >-
          חוק הלולאות: $\varepsilon_2 - \varepsilon_1 = I\,(r_1 + r_2)$, ולכן
          $$I = \frac{4.8 - 4.5}{1.5 + 0.5} = 0.15\ \text{A}$$
          הכא״מ החדש נותן $\varepsilon_2 I = 4.8\cdot0.15 = 0.72\,\text{W}$. הכא״מ הישן מקבל $\varepsilon_1 I = 4.5\cdot0.15 = 0.675\,\text{W}$, כי הזרם עובר בו נגד הכיוון שהוא דוחף. לחום: $I^2(r_1 + r_2) = 0.15^2\cdot2 = 0.045\,\text{W}$. בדיקה: $0.675 + 0.045 = 0.72\,\text{W}$.
      - kind: result
        text: >-
          (א) $\varepsilon_1 = 4.5\,\text{V}$, $r_1 = 1.5\,\Omega$.

          (ב) $I_1 = 0.12\,\text{A}$, $I_2 = 0.96\,\text{A}$, $I_R = 1.08\,\text{A}$; מתח ההדקים המשותף $4.32\,\text{V}$.

          (ג) $I = 0.15\,\text{A}$, מהסוללה החדשה אל ההדק החיובי של הסוללה הישנה. הכא״מ החדש נותן $0.72\,\text{W}$, הישן מקבל $0.675\,\text{W}$, ו-$0.045\,\text{W}$ הופכים לחום בהתנגדויות הפנימיות. לכן לא משאירים סוללה ישנה מחוברת במקביל לחדשה.

challenge:
  - id: W-3.10-c1
    stars: 1
    objectives: [OBJ-3.10-1, OBJ-3.10-2]
    prompt: >-
      סוללה, נגד ומד זרם מחוברים בטור. כשהנגד הוא $4.0\,\Omega$, מד הזרם מראה $0.60\,\text{A}$. מחברים נגד של $12\,\Omega$ במקביל לנגד של $4.0\,\Omega$, ועכשיו מד הזרם מראה $0.75\,\text{A}$. ההתנגדות של מד הזרם זניחה.

      (א) מצאו את הכא״מ ואת ההתנגדות הפנימית של הסוללה.

      (ב) מסירים את הנגד של $4.0\,\Omega$, ונשאר רק הנגד של $12\,\Omega$. מה יראה מד הזרם?

      (ג) מתברר שההתנגדות של מד הזרם אינה זניחה, אלא $0.20\,\Omega$. איזו מהתוצאות של (א) צריך לתקן, ומה הערך המתוקן?
    answer: >-
      (א) $\varepsilon = 3.0\,\text{V}$, $r = 1.0\,\Omega$.

      (ב) $0.23\,\text{A}$.

      (ג) הכא״מ נשאר $3.0\,\text{V}$; ההתנגדות הפנימית המתוקנת $0.80\,\Omega$.
    solution:
      - kind: given
        text: >-
          מדידה 1: $R_1 = 4.0\,\Omega$, $I_1 = 0.60\,\text{A}$. מדידה 2: $4.0\,\Omega$ במקביל ל-$12\,\Omega$, $I_2 = 0.75\,\text{A}$.
      - kind: substitution
        text: >-
          ההתנגדות השקולה במדידה 2 (שיעור 3.5):
          $$R_2 = \frac{4.0\cdot12}{4.0 + 12} = 3.0\ \Omega$$
      - kind: formula
        text: >-
          בשתי המדידות זו אותה סוללה, ולכן $\varepsilon = I\,(R + r)$ בשתיהן:
          $$\varepsilon = 0.60\,(4.0 + r)
          \qquad
          \varepsilon = 0.75\,(3.0 + r)$$
          שני נעלמים ושתי משוואות: זה הרעיון של כל מדידה של כא״מ והתנגדות פנימית, כאן עם שתי נקודות בלבד.
      - kind: manipulation
        text: >-
          משווים את שני הביטויים ל-$\varepsilon$: $2.4 + 0.60r = 2.25 + 0.75r$. מעבירים את האיברים עם $r$ לצד אחד ואת המספרים לשני: $2.4 - 2.25 = 0.75r - 0.60r$, כלומר $0.15 = 0.15r$.
      - kind: substitution
        text: >-
          $$r = \frac{0.15}{0.15} = 1.0\ \Omega
          \qquad
          \varepsilon = 0.60\cdot(4.0 + 1.0) = 3.0\ \text{V}$$
          בדיקה במדידה 2: $0.75\cdot(3.0 + 1.0) = 3.0\,\text{V}$.
      - kind: substitution
        text: >-
          (ב) $$I = \frac{\varepsilon}{R + r} = \frac{3.0}{12 + 1.0} = 0.23\ \text{A}$$
      - kind: reasoning
        text: >-
          (ג) מד הזרם בטור, ולכן ההתנגדות שלו מתווספת לכל המעגל: בשתי המשוואות מופיע $r + R_A$ במקום $r$. אותו פתרון בדיוק נותן עכשיו $r + R_A = 1.0\,\Omega$ ו-$\varepsilon = 3.0\,\text{V}$. הכא״מ לא משתנה, וההתנגדות הפנימית האמיתית היא $1.0 - 0.20 = 0.80\,\Omega$. התשובה של (ב) לא משתנה, כי גם בה מופיע אותו $r + R_A$.
      - kind: result
        text: >-
          (א) $\varepsilon = 3.0\,\text{V}$ ו-$r = 1.0\,\Omega$.

          (ב) $0.23\,\text{A}$.

          (ג) הכא״מ נכון. ההתנגדות הפנימית המתוקנת היא $0.80\,\Omega$, כי מה שחישבנו ב-(א) הוא $r + R_A$.
    source:
      name: British Physics Olympiad (BPhO), Round 1
      year: 2017
      problem: 'Round 1, 17 November 2017, Section 1, Question 1(h)'
      url: https://www.bpho.org.uk/Papers/R1/2017Nov_R1_S1.pdf
      verified: '2026-11-02'
      adapted: true

  - id: W-3.10-c2
    stars: 2
    objectives: [OBJ-3.10-2, OBJ-3.10-3]
    prompt: >-
      סוללה עם כא״מ $\varepsilon$ והתנגדות פנימית $r$ מחוברת ל-$N$ נורות זהות, כולן במקביל זו לזו. ההתנגדות של כל נורה היא $R$, והיא לא משתנה עם הזרם.

      (א) הביעו את ההספק הכולל בנורות באמצעות $\varepsilon$, $r$, $R$ ו-$N$.

      (ב) מתברר שההספק הכולל בנורות גדול יותר כש-$N = 5$ מאשר בכל מספר אחר של נורות. מה התחום האפשרי של $r$, באמצעות $R$? רמז: השוו את ההספק ב-$N$ נורות להספק ב-$N + 1$ נורות.

      (ג) האופיין של סוללה מסוימת חותך את ציר המתח ב-$6.0\,\text{V}$ ואת ציר הזרם ב-$2.5\,\text{A}$, וההתנגדות של כל נורה $12\,\Omega$. בדקו שהסוללה עומדת בתנאי של (ב), ומצאו את ההספק הכולל בחמש נורות ואת מתח ההדקים.
    answer: >-
      (א) $P = \dfrac{\varepsilon^2 NR}{(rN + R)^2}$.

      (ב) $\dfrac{R}{\sqrt{30}} < r < \dfrac{R}{\sqrt{20}}$, כלומר בערך $0.18R < r < 0.22R$.

      (ג) $r = 2.4\,\Omega$, בתוך התחום $2.19\,\Omega < r < 2.68\,\Omega$; $P = 3.75\,\text{W}$, ומתח ההדקים $3.0\,\text{V}$.
    solution:
      - kind: formula
        text: >-
          (א) $N$ נגדים זהים במקביל שקולים ל-$R/N$ (שיעור 3.5). הזרם מהסוללה $I = \dfrac{\varepsilon}{r + R/N}$, וכולו עובר בנורות. ההספק בהן $P = I^2\cdot\dfrac{R}{N}$.
      - kind: manipulation
        text: >-
          כופלים את המונה ואת המכנה של $I$ ב-$N$: $I = \dfrac{\varepsilon N}{rN + R}$. לכן
          $$P = \frac{\varepsilon^2 N^2}{(rN + R)^2}\cdot\frac{R}{N} = \frac{\varepsilon^2 NR}{(rN + R)^2}$$
      - kind: manipulation
        text: >-
          (ב) כותבים $P = \dfrac{\varepsilon^2 R}{D(N)}$, כאשר
          $$D(N) = \frac{(rN + R)^2}{N} = r^2N + 2rR + \frac{R^2}{N}$$
          $\varepsilon$ ו-$R$ קבועים, ולכן הספק גדול יותר פירושו $D$ קטן יותר.
      - kind: manipulation
        text: >-
          ההפרש בין שני מספרי נורות סמוכים (האיבר $2rR$ מתקזז):
          $$D(N + 1) - D(N) = r^2 + \frac{R^2}{N + 1} - \frac{R^2}{N} = r^2 - \frac{R^2}{N(N + 1)}$$
      - kind: reasoning
        text: >-
          כש-$N$ גדל, $N(N + 1)$ גדל, ולכן ההפרש הזה רק עולה: בהתחלה הוא שלילי ($D$ יורד, ההספק עולה), ומנקודה מסוימת חיובי ($D$ עולה, ההספק יורד). לכן להספק יש שיא אחד, ו"$N = 5$ הוא הטוב ביותר" שקול לשני תנאים בלבד: ההספק ב-5 גדול מזה שב-4, וגדול מזה שב-6.
      - kind: substitution
        text: >-
          ההספק ב-5 גדול מזה שב-4 כש-$D(5) - D(4) < 0$, כלומר $r^2 < \dfrac{R^2}{4\cdot5}$. ההספק ב-5 גדול מזה שב-6 כש-$D(6) - D(5) > 0$, כלומר $r^2 > \dfrac{R^2}{5\cdot6}$. מוציאים שורש (כל הגדלים חיוביים):
          $$\frac{R}{\sqrt{30}} < r < \frac{R}{\sqrt{20}}
          \qquad\Rightarrow\qquad
          0.183R < r < 0.224R$$
      - kind: substitution
        text: >-
          (ג) מהאופיין: $r = \dfrac{\varepsilon}{I_0} = \dfrac{6.0}{2.5} = 2.4\,\Omega$. עם $R = 12\,\Omega$ התחום של (ב) הוא $2.19\,\Omega < r < 2.68\,\Omega$, ו-$2.4\,\Omega$ בתוכו.
          $$P(5) = \frac{6.0^2\cdot5\cdot12}{(2.4\cdot5 + 12)^2} = \frac{2160}{576} = 3.75\ \text{W}$$
          לשם השוואה, $P(4) = 3.70\,\text{W}$ ו-$P(6) = 3.72\,\text{W}$.
      - kind: substitution
        text: >-
          מתח ההדקים: $I = \dfrac{6.0}{2.4 + 12/5} = 1.25\,\text{A}$, ו-$V = \varepsilon - Ir = 6.0 - 1.25\cdot2.4 = 3.0\,\text{V}$.
      - kind: result
        text: >-
          (א) $P = \dfrac{\varepsilon^2 NR}{(rN + R)^2}$.

          (ב) $\dfrac{R}{\sqrt{30}} < r < \dfrac{R}{\sqrt{20}}$, כלומר $0.183R < r < 0.224R$.

          (ג) $r = 2.4\,\Omega$ נמצא בתחום ($2.19\,\Omega$ עד $2.68\,\Omega$). בחמש נורות $P = 3.75\,\text{W}$, ומתח ההדקים $3.0\,\text{V}$.
    source:
      name: USA Physics Olympiad (USAPhO), Quarterfinal Exam
      year: 2009
      problem: 'Question 4'
      url: https://www.aapt.org/physicsteam/2010/upload/2009_QtrFinal.pdf
      verified: '2026-11-02'
      adapted: true
