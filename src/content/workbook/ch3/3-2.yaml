# Workbook for lesson 3.2: ten practice problems and two sourced challenge problems.
# Every number recomputed with currentOf, driftSpeed, driftCurrent, roundArea and COPPER_N from
# src/physics/circuits.ts, and E_CHARGE, M_ELECTRON and K from src/physics/constants.ts.

lesson: '3.2'
practice:
  - id: W-3.2-01
    level: basic
    qualitative: false
    objectives: [OBJ-3.2-1]
    prompt: >-
      על סוללה של טלפון כתוב $3000\,\text{mAh}$, מיליאמפר-שעה. זו לא יחידה של זרם אלא של מטען: המטען שעובר כשזורם זרם של $3000\,\text{mA}$ במשך שעה אחת. זה המטען שהסוללה יכולה להעביר במעגל עד שהיא מתרוקנת.

      (א) כמה קולון זה?

      (ב) בזמן צפייה בסרטון זורם מהסוללה זרם ממוצע של $0.6\,\text{A}$. כמה שעות אפשר לצפות עד שהסוללה מתרוקנת?

      (ג) כמה אלקטרונים עוברים במעגל של הטלפון עד שהסוללה מתרוקנת?
    answer: >-
      (א) $10800\,\text{C}$, כלומר $1.08\cdot10^{4}\,\text{C}$.

      (ב) $5$ שעות.

      (ג) $6.75\cdot10^{22}$ אלקטרונים.
    solution:
      - kind: given
        text: >-
          $I_1 = 3000\,\text{mA} = 3\,\text{A}$ במשך $\Delta t_1 = 1\,\text{h} = 3600\,\text{s}$. זרם הצפייה $I_2 = 0.6\,\text{A}$, והמטען היסודי $e = 1.6\cdot10^{-19}\,\text{C}$.
      - kind: formula
        text: >-
          $I = \dfrac{\Delta q}{\Delta t}$, ולכן $\Delta q = I\,\Delta t$ ו-$\Delta t = \dfrac{\Delta q}{I}$. מספר האלקטרונים $N = \dfrac{\Delta q}{e}$.
      - kind: substitution
        text: >-
          (א) $\Delta q = 3\,\text{A}\cdot3600\,\text{s} = 10800\,\text{C}$.
      - kind: manipulation
        text: >-
          (ב) הפעם המטען ידוע והזמן לא. כופלים את $I = \Delta q/\Delta t$ ב-$\Delta t$ ומחלקים ב-$I$:
          $$\Delta t_2 = \frac{\Delta q}{I_2} = \frac{10800}{0.6} = 18000\ \text{s}$$
          בשעה $3600\,\text{s}$, ולכן $18000/3600 = 5$ שעות.
      - kind: substitution
        text: >-
          (ג) $N = \dfrac{10800}{1.6\cdot10^{-19}} = 6.75\cdot10^{22}$.
      - kind: reasoning
        text: >-
          שימו לב: הסוללה לא אוגרת את המטען הזה. היא דוחפת אותו במעגל, וכל קולון שיוצא מהדק אחד חוזר אליה בהדק השני. מה שנגמר בסוללה הוא החומרים הכימיים שנותנים למטען אנרגיה.
      - kind: result
        text: >-
          (א) $1.08\cdot10^{4}\,\text{C}$. (ב) $5$ שעות. (ג) $6.75\cdot10^{22}$ אלקטרונים.

  - id: W-3.2-02
    level: basic
    qualitative: true
    objectives: [OBJ-3.2-2]
    prompt: >-
      נורה מחוברת בשני תילים לשני ההדקים של סוללה, ונקרא לאחד ההדקים $X$. בתיל שמחבר את הנורה להדק $X$, האלקטרונים החופשיים נעים מההדק $X$ אל הנורה.

      (א) האם $X$ הוא ההדק החיובי או השלילי? נמקו.

      (ב) מה כיוון הזרם המוסכם בתיל הזה?

      (ג) מה כיוון הזרם המוסכם בתוך הסוללה?
    answer: >-
      (א) $X$ הוא ההדק השלילי.

      (ב) מהנורה אל ההדק $X$.

      (ג) מההדק $X$, השלילי, אל ההדק החיובי.
    solution:
      - kind: given
        text: >-
          בתיל שבין $X$ לנורה האלקטרונים נעים מ-$X$ אל הנורה.
      - kind: reasoning
        text: >-
          (א) מחוץ לסוללה השדה בתילים מכוון מההדק החיובי אל השלילי. האלקטרונים שליליים, ולכן הכוח עליהם הפוך לשדה: הם נעים מההדק השלילי, דרך המעגל, אל ההדק החיובי. הם יוצאים מ-$X$, ולכן $X$ הוא ההדק השלילי.
      - kind: reasoning
        text: >-
          (ב) הזרם המוסכם הוא הכיוון שבו היה נע מטען חיובי, הפוך לתנועת האלקטרונים: מהנורה אל $X$.
      - kind: reasoning
        text: >-
          (ג) הזרם זורם בלולאה סגורה, באותו כיוון סיבוב לכל אורכה. הוא נכנס לסוללה בהדק $X$, ולכן בתוכה הוא זורם מ-$X$, השלילי, אל ההדק החיובי, ויוצא ממנו אל המעגל.
      - kind: result
        text: >-
          (א) ההדק השלילי. (ב) מהנורה אל $X$. (ג) בתוך הסוללה, מההדק השלילי אל החיובי.

  - id: W-3.2-03
    level: basic
    qualitative: false
    objectives: [OBJ-3.2-1, OBJ-3.2-2]
    prompt: >-
      כדור מתכת קטן טעון במטען של $+3\,\mu\text{C}$. מחברים אותו בתיל לאדמה, והוא מאבד את כל המטען שלו בתוך $1.5\,\text{ms}$.

      (א) מה עוצמת הזרם הממוצעת בתיל?

      (ב) כמה אלקטרונים עברו בתיל, ולאיזה כיוון: מהכדור אל האדמה, או מהאדמה אל הכדור?

      (ג) מה כיוון הזרם המוסכם בתיל?
    answer: >-
      (א) $2\cdot10^{-3}\,\text{A}$, כלומר $2\,\text{mA}$.

      (ב) $1.875\cdot10^{13}$ אלקטרונים, מהאדמה אל הכדור.

      (ג) מהכדור אל האדמה.
    solution:
      - kind: given
        text: >-
          $\Delta q = 3\cdot10^{-6}\,\text{C}$, $\Delta t = 1.5\,\text{ms} = 1.5\cdot10^{-3}\,\text{s}$, $e = 1.6\cdot10^{-19}\,\text{C}$.
      - kind: formula
        text: >-
          $I = \dfrac{\Delta q}{\Delta t}$ ו-$N = \dfrac{\Delta q}{e}$.
      - kind: substitution
        text: >-
          (א) $I = \dfrac{3\cdot10^{-6}}{1.5\cdot10^{-3}} = 2\cdot10^{-3}\,\text{A}$. זה זרם ממוצע: בהתחלה הזרם גדול יותר, ובסוף קטן יותר.
      - kind: substitution
        text: >-
          (ב) $N = \dfrac{3\cdot10^{-6}}{1.6\cdot10^{-19}} = 1.875\cdot10^{13}$.
      - kind: reasoning
        text: >-
          לכדור חסרים אלקטרונים, ולכן הוא חיובי. בתיל מתכת מה שנע הוא האלקטרונים, ולכן הכדור נעשה ניטרלי כשאלקטרונים מהאדמה עולים אליו וממלאים את החסר. הם נעים מהאדמה אל הכדור.
      - kind: reasoning
        text: >-
          (ג) הזרם המוסכם הפוך לתנועת האלקטרונים: מהכדור אל האדמה. זה גם הכיוון שבו היה זורם מטען חיובי מהכדור, שהפוטנציאל שלו גבוה, אל האדמה, שהפוטנציאל שלה אפס.
      - kind: result
        text: >-
          (א) $2\,\text{mA}$ בממוצע. (ב) $1.875\cdot10^{13}$ אלקטרונים, מהאדמה אל הכדור. (ג) מהכדור אל האדמה.

  - id: W-3.2-04
    level: mid
    qualitative: false
    objectives: [OBJ-3.2-3]
    prompt: >-
      בניסוי מודדים את מהירות הסחיפה בתיל ממתכת לא ידועה $X$. שטח החתך של התיל $1\,\text{mm}^2$, הזרם בו $4\,\text{A}$, ומהירות הסחיפה שנמדדה $2.5\cdot10^{-4}\,\text{m/s}$.

      (א) מה צפיפות האלקטרונים החופשיים $n$ במתכת $X$?

      (ב) במטר מעוקב של המתכת $X$ יש $5\cdot10^{28}$ אטומים. כמה אלקטרונים חופשיים יש לכל אטום?

      (ג) מה הייתה מהירות הסחיפה בתיל נחושת עם אותו שטח חתך ואותו זרם? בנחושת $n = 8.5\cdot10^{28}\,\text{m}^{-3}$. באיזה תיל האלקטרונים נסחפים מהר יותר, ולמה?
    answer: >-
      (א) $n = 1\cdot10^{29}\,\text{m}^{-3}$.

      (ב) $2$ אלקטרונים חופשיים לכל אטום.

      (ג) כ-$2.9\cdot10^{-4}\,\text{m/s}$: בנחושת מהר יותר, כי יש בה פחות אלקטרונים חופשיים במטר מעוקב.
    solution:
      - kind: given
        text: >-
          $A = 1\,\text{mm}^2 = 10^{-6}\,\text{m}^2$, $I = 4\,\text{A}$, $v = 2.5\cdot10^{-4}\,\text{m/s}$, $q = e = 1.6\cdot10^{-19}\,\text{C}$.
      - kind: formula
        text: >-
          $I = nqvA$.
      - kind: manipulation
        text: >-
          (א) הפעם $n$ לא ידוע. מחלקים את שני האגפים במכפלה $qvA$:
          $$n = \frac{I}{qvA}$$
      - kind: substitution
        text: >-
          $$n = \frac{4}{1.6\cdot10^{-19}\cdot2.5\cdot10^{-4}\cdot10^{-6}} = 1\cdot10^{29}\ \text{m}^{-3}$$
      - kind: substitution
        text: >-
          (ב) מחלקים את מספר האלקטרונים החופשיים במטר מעוקב במספר האטומים במטר מעוקב: $\dfrac{1\cdot10^{29}}{5\cdot10^{28}} = 2$.
      - kind: substitution
        text: >-
          (ג) $v_{Cu} = \dfrac{I}{neA} = \dfrac{4}{8.5\cdot10^{28}\cdot1.6\cdot10^{-19}\cdot10^{-6}} \approx 2.9\cdot10^{-4}\,\text{m/s}$.
      - kind: reasoning
        text: >-
          באותו זרם ובאותו שטח חתך, $v$ הפוך ל-$n$. בנחושת יש פחות אלקטרונים חופשיים במטר מעוקב, ולכן כדי להעביר אותו מטען בכל שנייה, כל אחד מהם צריך להיסחף מהר יותר.
      - kind: result
        text: >-
          (א) $1\cdot10^{29}\,\text{m}^{-3}$. (ב) $2$ לכל אטום. (ג) כ-$2.9\cdot10^{-4}\,\text{m/s}$, מהר יותר מאשר ב-$X$.

  - id: W-3.2-05
    level: mid
    qualitative: true
    objectives: [OBJ-3.2-4]
    prompt: >-
      שלוש נורות שונות, $L_1$, $L_2$ ו-$L_3$, מחוברות בזו אחר זו לסוללה, במעגל עם מסלול אחד. מד זרם $A_1$ מחובר לפני $L_1$, מד זרם $A_2$ בין $L_1$ ל-$L_2$, ומד זרם $A_4$ אחרי $L_3$. מד הזרם $A_1$ מראה $0.3\,\text{A}$.

      (א) מה מראים $A_2$ ו-$A_4$? נמקו.

      (ב) תלמיד טוען שכל נורה "לוקחת" חלק מהזרם, ולכן $A_2$ מראה פחות מ-$A_1$. נניח לרגע שהוא צודק. מה היה קורה עם הזמן למטען שבנורה $L_1$? למה זה מראה שהטענה שגויה?

      (ג) מוציאים את $L_2$ מהבית שלה, והמעגל נפתח במקום שבו הייתה. מה מראים עכשיו שלושת מדי הזרם, ומה קורה ל-$L_1$ ול-$L_3$? נמקו.
    answer: >-
      (א) שניהם מראים $0.3\,\text{A}$.

      (ב) מטען היה מצטבר ב-$L_1$ עוד ועוד, והיא הייתה נטענת בלי סוף. זה לא קורה, ולכן הזרם שיוצא ממנה שווה לזרם שנכנס אליה.

      (ג) שלושת המדים מראים אפס, ושתי הנורות כבות.
    solution:
      - kind: given
        text: >-
          מעגל עם מסלול אחד, ו-$A_1$ מראה $0.3\,\text{A}$.
      - kind: reasoning
        text: >-
          (א) במעגל עם מסלול אחד, כל המטען שעובר ב-$A_1$ ממשיך דרך כל הנורות וכל המדים, כי אין לו לאן להתפצל. המטען נשמר, ולכן בכל שנייה עובר דרך כל מד אותו מטען: שניהם מראים $0.3\,\text{A}$.
      - kind: reasoning
        text: >-
          (ב) אילו $A_2$ היה מראה פחות מ-$A_1$, בכל שנייה היה נכנס ל-$L_1$ יותר מטען ממה שיוצא ממנה. ההפרש היה נשאר בנורה, והמטען שלה היה גדל בהתמדה, שנייה אחרי שנייה.
          נורה שנטענת עוד ועוד הייתה דוחה בכוח הולך וגדל את המטען שמגיע אליה, ואף אחד לא מצא נורה כזאת: נורה דולקת נשארת ניטרלית. לכן הזרם שיוצא מ-$L_1$ שווה לזרם שנכנס אליה. הנורה צורכת אנרגיה, לא זרם.
      - kind: reasoning
        text: >-
          (ג) זרם זורם רק כשיש מסלול סגור מהדק אחד של הסוללה, דרך הרכיבים, אל ההדק השני (שיעור 3.1). כש-$L_2$ בחוץ, המסלול היחיד נפתח, והזרם נעצר בכל המעגל, לא רק במקום של $L_2$.
      - kind: result
        text: >-
          (א) $A_2$ ו-$A_4$ מראים $0.3\,\text{A}$. (ב) $L_1$ הייתה נטענת עוד ועוד, וזה לא קורה. (ג) כל המדים מראים אפס, ו-$L_1$ ו-$L_3$ כבות.

  - id: W-3.2-06
    level: mid
    qualitative: true
    objectives: [OBJ-3.2-3, OBJ-3.2-4]
    prompt: >-
      בנורה רגילה, חוט הלהט דק מאוד: שטח החתך שלו קטן בערך פי 1000 משטח החתך של התילים שמחוברים אליו. הניחו שצפיפות האלקטרונים החופשיים בחוט הלהט ובתילים דומה.

      (א) איפה הזרם גדול יותר: בתילים או בחוט הלהט?

      (ב) איפה האלקטרונים נסחפים מהר יותר, ובערך פי כמה?

      (ג) חברה שואלת: "אם האלקטרונים נכנסים לחוט הלהט מתיל עבה, לא נוצר 'פקק' בכניסה?" מה עונים לה?
    answer: >-
      (א) הזרם שווה.

      (ב) בחוט הלהט, מהר יותר פי 1000 בערך.

      (ג) אין פקק: המטען לא מצטבר בכניסה, וכל אלקטרון שנכנס לחוט הלהט נסחף בו מהר יותר.
    solution:
      - kind: given
        text: >-
          שטח החתך של חוט הלהט קטן פי 1000 בערך משטח החתך של התילים, ו-$n$ דומה בשניהם.
      - kind: reasoning
        text: >-
          (א) התילים וחוט הלהט הם חלקים של אותו מסלול יחיד. המטען לא מצטבר בשום מקום לאורך המסלול, ולכן הזרם שווה בתילים ובחוט הלהט.
      - kind: reasoning
        text: >-
          (ב) מ-$I = nqvA$, כש-$I$, $n$ ו-$q$ שווים, המהירות הפוכה לשטח החתך: $v = \dfrac{I}{nqA}$. שטח קטן פי 1000 נותן מהירות גדולה פי 1000 בערך.
      - kind: reasoning
        text: >-
          (ג) בכל סנטימטר של חוט הלהט יש בערך פי 1000 פחות אלקטרונים חופשיים מאשר בסנטימטר של תיל, ולכן כדי להעביר אותו מטען בכל שנייה, כל אחד מהם נע פי 1000 מהר יותר. מה שמאיץ אותם הוא השדה בחוט הלהט, שחזק הרבה יותר מהשדה בתילים, כי רוב המתח של הסוללה נמצא על חוט הלהט (שיעור 3.1).
          אילו היה נוצר פקק, היה מצטבר בכניסה מטען, והוא היה משנה את השדה עד שהזרם היה משתווה. במצב היציב אין הצטברות כזו.
      - kind: result
        text: >-
          (א) שווה. (ב) בחוט הלהט, פי 1000 בערך. (ג) אין פקק: אותו זרם עובר בכל המסלול, ובחוט הלהט האלקטרונים פשוט נסחפים מהר יותר.

  - id: W-3.2-07
    level: mid
    qualitative: false
    objectives: [OBJ-3.2-1, OBJ-3.2-2]
    prompt: >-
      בכלי עם מי מלח טבולים שני לוחות מתכת, שמחוברים להדקים של סוללה. בתמיסה אין אלקטרונים חופשיים. נושאי המטען הם יונים: יונים חיוביים, שהמטען של כל אחד מהם $+e$, נעים אל הלוח השלילי, ויונים שליליים, שהמטען של כל אחד מהם $-e$, נעים אל הלוח החיובי. דרך מישור דמיוני באמצע התמיסה עוברים בכל שנייה $2.5\cdot10^{18}$ יונים חיוביים בכיוון אחד, ו-$2.5\cdot10^{18}$ יונים שליליים בכיוון ההפוך.

      (א) תלמיד אומר: "היונים נעים בכיוונים הפוכים, ולכן הזרמים שלהם מבטלים זה את זה, והזרם בתמיסה אפס." האם הוא צודק? נמקו.

      (ב) מה עוצמת הזרם בתמיסה, ומה כיוונו?
    answer: >-
      (א) לא. שני סוגי היונים מעבירים מטען חיובי נטו באותו כיוון, ולכן הזרמים שלהם מתחברים.

      (ב) $0.8\,\text{A}$, מהלוח החיובי אל הלוח השלילי.
    solution:
      - kind: given
        text: >-
          בכל שנייה $N_+ = 2.5\cdot10^{18}$ יונים חיוביים עוברים את המישור לכיוון הלוח השלילי, ו-$N_- = 2.5\cdot10^{18}$ יונים שליליים לכיוון הלוח החיובי. $e = 1.6\cdot10^{-19}\,\text{C}$.
      - kind: reasoning
        text: >-
          (א) כיוון הזרם המוסכם הוא הכיוון שבו היה נע מטען חיובי. היונים החיוביים נעים אל הלוח השלילי: זרם מהלוח החיובי אל השלילי.
          מטען שלילי שנע לכיוון אחד מעביר מטען כמו מטען חיובי שנע לכיוון ההפוך. היונים השליליים נעים אל הלוח החיובי, ולכן גם הם יוצרים זרם מהלוח החיובי אל השלילי. שני הזרמים באותו כיוון, והם מתחברים.
      - kind: formula
        text: >-
          $I = \dfrac{\Delta q}{\Delta t}$, כאשר $\Delta q$ הוא המטען החיובי נטו שעובר את המישור בכיוון הזרם.
      - kind: substitution
        text: >-
          (ב) בשנייה אחת: $\Delta q = (N_+ + N_-)\,e = 5\cdot10^{18}\cdot1.6\cdot10^{-19} = 0.8\,\text{C}$, ולכן $I = 0.8\,\text{A}$.
      - kind: result
        text: >-
          (א) הוא לא צודק: הזרמים מתחברים. (ב) $0.8\,\text{A}$, מהלוח החיובי אל הלוח השלילי.

  - id: W-3.2-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-3.2-3]
    prompt: >-
      תיל A עשוי נחושת, הקוטר שלו $1\,\text{mm}$, וזורם בו $2\,\text{A}$. תיל B עשוי אלומיניום, הקוטר שלו $2\,\text{mm}$, וזורם בו $6\,\text{A}$. בנחושת $n = 8.5\cdot10^{28}\,\text{m}^{-3}$, ובאלומיניום, שבו יש שלושה אלקטרונים חופשיים לכל אטום, $n = 1.8\cdot10^{29}\,\text{m}^{-3}$.

      (א) בלי לחשב כל מהירות בנפרד, מצאו את היחס $v_A/v_B$ בין מהירויות הסחיפה.

      (ב) חשבו את $v_A$, ובעזרת היחס של (א) את $v_B$.

      (ג) כמה זמן לוקח לאלקטרון לעבור מטר אחד בכל אחד מהתילים?

      (ד) הזרם בתיל B יורד לחצי, ושאר הנתונים לא משתנים. מה היחס $v_A/v_B$ עכשיו?
    answer: >-
      (א) $v_A/v_B \approx 2.8$.

      (ב) $v_A \approx 1.87\cdot10^{-4}\,\text{m/s}$ ו-$v_B \approx 6.6\cdot10^{-5}\,\text{m/s}$.

      (ג) בתיל A כ-$5.3\cdot10^{3}\,\text{s}$, כשעה וחצי, ובתיל B כ-$1.5\cdot10^{4}\,\text{s}$, יותר מארבע שעות.

      (ד) $v_A/v_B \approx 5.6$, פי 2 מקודם.
    solution:
      - kind: given
        text: >-
          $I_A = 2\,\text{A}$, $d_A = 1\cdot10^{-3}\,\text{m}$, $n_A = 8.5\cdot10^{28}\,\text{m}^{-3}$. $I_B = 6\,\text{A}$, $d_B = 2\cdot10^{-3}\,\text{m}$, $n_B = 1.8\cdot10^{29}\,\text{m}^{-3}$. בשני התילים נושאי המטען הם אלקטרונים, $q = e$.
      - kind: formula
        text: >-
          $v = \dfrac{I}{neA}$, ושטח החתך של תיל עגול $A = \dfrac{\pi d^2}{4}$.
      - kind: manipulation
        text: >-
          (א) מחלקים את הביטוי ל-$v_A$ בביטוי ל-$v_B$. המטען $e$ והגורם $\pi/4$ מצטמצמים, ונשארים היחסים של הזרם, של $n$ ושל ריבוע הקוטר:
          $$\frac{v_A}{v_B} = \frac{I_A}{I_B}\cdot\frac{n_B}{n_A}\cdot\left(\frac{d_B}{d_A}\right)^2$$
      - kind: substitution
        text: >-
          $$\frac{v_A}{v_B} = \frac{2}{6}\cdot\frac{1.8\cdot10^{29}}{8.5\cdot10^{28}}\cdot2^2 \approx 2.8$$
      - kind: substitution
        text: >-
          (ב) $A_A = \dfrac{\pi\cdot(10^{-3})^2}{4} = 7.85\cdot10^{-7}\,\text{m}^2$, ולכן
          $$v_A = \frac{2}{8.5\cdot10^{28}\cdot1.6\cdot10^{-19}\cdot7.85\cdot10^{-7}} \approx 1.87\cdot10^{-4}\ \text{m/s}$$
          ו-$v_B = \dfrac{v_A}{2.82} \approx 6.6\cdot10^{-5}\,\text{m/s}$ (חילקנו ביחס לפני העיגול, $2.824$).
      - kind: substitution
        text: >-
          (ג) במהירות קבועה $t = \dfrac{L}{v}$: $t_A = \dfrac{1}{1.87\cdot10^{-4}} \approx 5.3\cdot10^{3}\,\text{s}$, ו-$t_B = \dfrac{1}{6.63\cdot10^{-5}} \approx 1.5\cdot10^{4}\,\text{s}$.
      - kind: reasoning
        text: >-
          (ד) $v_B$ יחסי ל-$I_B$, ולכן כשהזרם בתיל B יורד לחצי, גם $v_B$ יורד לחצי, ו-$v_A$ לא משתנה. היחס $v_A/v_B$ גדל פי 2: $2\cdot2.824 \approx 5.6$.
      - kind: result
        text: >-
          (א) $v_A/v_B \approx 2.8$. (ב) $v_A \approx 1.87\cdot10^{-4}\,\text{m/s}$, $v_B \approx 6.6\cdot10^{-5}\,\text{m/s}$. (ג) $t_A \approx 5.3\cdot10^{3}\,\text{s}$, $t_B \approx 1.5\cdot10^{4}\,\text{s}$. (ד) $v_A/v_B \approx 5.6$.

  - id: W-3.2-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-3.2-1, OBJ-3.2-2, OBJ-3.2-3]
    prompt: >-
      בשפופרת קרן קתודית (שיעור 1.10) האלקטרונים יוצאים כמעט ממנוחה, מואצים בהפרש פוטנציאלים של $2000\,\text{V}$, וממשיכים במהירות קבועה עד שהם פוגעים במסך. הזרם של הקרן $0.4\,\text{mA}$, ושטח החתך שלה $1\,\text{mm}^2$.

      (א) כמה אלקטרונים פוגעים במסך בכל שנייה?

      (ב) מה כיוון הזרם המוסכם של הקרן: מתותח האלקטרונים אל המסך, או מהמסך אל תותח האלקטרונים?

      (ג) מה מהירות האלקטרונים אחרי ההאצה?

      (ד) הנוסחה $I = nqvA$ נכונה גם לקרן בריק. כמה אלקטרונים יש בכל מטר מעוקב של הקרן? פי כמה זה פחות מצפיפות האלקטרונים החופשיים בנחושת, $8.5\cdot10^{28}\,\text{m}^{-3}$?

      (ה) כמה אנרגיה מוסרת הקרן למסך בכל שנייה?
    answer: >-
      (א) $2.5\cdot10^{15}$ אלקטרונים בשנייה.

      (ב) מהמסך אל תותח האלקטרונים.

      (ג) כ-$2.7\cdot10^{7}\,\text{m/s}$.

      (ד) כ-$9.4\cdot10^{13}\,\text{m}^{-3}$, פחות פי $9\cdot10^{14}$ בערך מאשר בנחושת.

      (ה) $0.8\,\text{J}$ בכל שנייה.
    solution:
      - kind: given
        text: >-
          $V = 2000\,\text{V}$, $I = 0.4\,\text{mA} = 4\cdot10^{-4}\,\text{A}$, $A = 1\,\text{mm}^2 = 10^{-6}\,\text{m}^2$, $e = 1.6\cdot10^{-19}\,\text{C}$, $m_e = 9.1\cdot10^{-31}\,\text{kg}$.
      - kind: substitution
        text: >-
          (א) בשנייה עובר מטען של $4\cdot10^{-4}\,\text{C}$, ולכן מספר האלקטרונים בשנייה $\dfrac{I}{e} = \dfrac{4\cdot10^{-4}}{1.6\cdot10^{-19}} = 2.5\cdot10^{15}$.
      - kind: reasoning
        text: >-
          (ב) האלקטרונים שליליים ונעים מתותח האלקטרונים אל המסך, ולכן הזרם המוסכם הפוך: מהמסך אל תותח האלקטרונים. אין כאן תיל, אבל מטען שנע הוא זרם.
      - kind: formula
        text: >-
          (ג) השדה עושה על כל אלקטרון עבודה $W = eV$ (שיעור 2.2), והיא הופכת לאנרגיה קינטית: $\tfrac12 m_e v^2 = eV$. מבודדים את $v$: כופלים ב-2, מחלקים ב-$m_e$, ומוציאים שורש:
          $$v = \sqrt{\frac{2eV}{m_e}}$$
      - kind: substitution
        text: >-
          $$v = \sqrt{\frac{2\cdot1.6\cdot10^{-19}\cdot2000}{9.1\cdot10^{-31}}} \approx 2.65\cdot10^{7}\ \text{m/s}$$
      - kind: manipulation
        text: >-
          (ד) מ-$I = nqvA$, עם $q = e$, מחלקים את שני האגפים ב-$evA$:
          $$n = \frac{I}{evA} = \frac{4\cdot10^{-4}}{1.6\cdot10^{-19}\cdot2.65\cdot10^{7}\cdot10^{-6}} \approx 9.4\cdot10^{13}\ \text{m}^{-3}$$
          היחס לנחושת: $\dfrac{8.5\cdot10^{28}}{9.43\cdot10^{13}} \approx 9\cdot10^{14}$. בקרן יש מעט מאוד אלקטרונים, אבל הם מהירים מאוד, ולכן הזרם לא זניח.
      - kind: substitution
        text: >-
          (ה) כל קולון שעובר את הפרש הפוטנציאלים מקבל $W = qV = 1\cdot2000 = 2000\,\text{J}$, ומוסר אותם למסך כשהוא נעצר בו. בכל שנייה מגיע למסך מטען של $4\cdot10^{-4}\,\text{C}$:
          $$W = qV = 4\cdot10^{-4}\cdot2000 = 0.8\ \text{J}$$
      - kind: result
        text: >-
          (א) $2.5\cdot10^{15}$ אלקטרונים בשנייה. (ב) מהמסך אל תותח האלקטרונים. (ג) כ-$2.7\cdot10^{7}\,\text{m/s}$. (ד) כ-$9.4\cdot10^{13}\,\text{m}^{-3}$, פחות פי $9\cdot10^{14}$ בערך מאשר בנחושת. (ה) $0.8\,\text{J}$ בכל שנייה.

  - id: W-3.2-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-3.2-1, OBJ-3.2-2, OBJ-3.2-4]
    prompt: >-
      קבל של $200\,\mu\text{F}$ טעון למתח של $12\,\text{V}$, והוא מנותק מהסוללה. מחברים את שני הלוחות שלו לנורה קטנה, והקבל מתפרק דרכה: הנורה מהבהבת וכבית, והפריקה נמשכת בערך $0.5\,\text{s}$. משני צדי הנורה מחוברים שני מדי זרם.

      (א) כמה מטען עבר בנורה?

      (ב) מה עוצמת הזרם הממוצעת בנורה?

      (ג) כמה אלקטרונים עברו בנורה, ובאיזה כיוון: מהלוח החיובי אל השלילי, או מהשלילי אל החיובי? ומה כיוון הזרם המוסכם?

      (ד) הזרם בנורה לא קבוע: הוא גדול בהתחלה ויורד לאפס. האם בכל רגע שני מדי הזרם מראים אותו דבר? נמקו.

      (ה) טוענים את הקבל ל-$24\,\text{V}$, ומפרקים אותו דרך אותה נורה. שוב הפריקה נמשכת בערך $0.5\,\text{s}$. פי כמה גדלים המטען שעובר בנורה, הזרם הממוצע, והאנרגיה שהנורה מקבלת?
    answer: >-
      (א) $2.4\cdot10^{-3}\,\text{C}$.

      (ב) $4.8\cdot10^{-3}\,\text{A}$, כלומר $4.8\,\text{mA}$.

      (ג) $1.5\cdot10^{16}$ אלקטרונים, מהלוח השלילי אל החיובי. הזרם המוסכם מהלוח החיובי, דרך הנורה, אל השלילי.

      (ד) כן: בכל רגע הזרם שנכנס לנורה שווה לזרם שיוצא ממנה.

      (ה) המטען והזרם הממוצע גדלים פי 2, והאנרגיה פי 4.
    solution:
      - kind: given
        text: >-
          $C = 200\cdot10^{-6}\,\text{F}$, $V = 12\,\text{V}$, $\Delta t \approx 0.5\,\text{s}$, $e = 1.6\cdot10^{-19}\,\text{C}$.
      - kind: formula
        text: >-
          המטען על הקבל $Q = CV$ (שיעור 2.6), האנרגיה שלו $U = \tfrac12 CV^2$, והזרם הממוצע $I = \dfrac{\Delta q}{\Delta t}$.
      - kind: substitution
        text: >-
          (א) $Q = 200\cdot10^{-6}\cdot12 = 2.4\cdot10^{-3}\,\text{C}$. בסוף הפריקה הקבל ריק, ולכן כל המטען הזה עבר בנורה.
      - kind: substitution
        text: >-
          (ב) $I = \dfrac{2.4\cdot10^{-3}}{0.5} = 4.8\cdot10^{-3}\,\text{A}$.
      - kind: substitution
        text: >-
          (ג) $N = \dfrac{2.4\cdot10^{-3}}{1.6\cdot10^{-19}} = 1.5\cdot10^{16}$.
      - kind: reasoning
        text: >-
          בלוח השלילי עודף אלקטרונים, ובלוח החיובי חסרים אלקטרונים. בפריקה העודף עובר דרך הנורה וממלא את החסר: האלקטרונים נעים מהלוח השלילי אל החיובי. הזרם המוסכם הפוך: מהלוח החיובי, דרך הנורה, אל השלילי.
      - kind: reasoning
        text: >-
          (ד) כן. גם כשהזרם משתנה, מטען לא מצטבר בנורה: אילו נכנס אליה בכל רגע יותר מטען ממה שיוצא, היא הייתה נטענת. לכן בכל רגע שני המדים מראים אותו זרם, ושניהם יורדים יחד לאפס.
          מטען כן מצטבר, או מתרוקן, רק על הלוחות של הקבל, ושם בדיוק מתחיל ונגמר המסלול.
      - kind: reasoning
        text: >-
          (ה) $Q = CV$, ולכן במתח כפול המטען כפול: $4.8\cdot10^{-3}\,\text{C}$. באותו זמן גם הזרם הממוצע כפול: $9.6\cdot10^{-3}\,\text{A}$.
          האנרגיה $U = \tfrac12 CV^2$ יחסית לריבוע המתח, ולכן גדלה פי 4: מ-$\tfrac12\cdot200\cdot10^{-6}\cdot12^2 = 1.44\cdot10^{-2}\,\text{J}$ ל-$5.76\cdot10^{-2}\,\text{J}$. כל האנרגיה הזאת נמסרת לנורה, כי בסוף הקבל ריק.
      - kind: result
        text: >-
          (א) $2.4\cdot10^{-3}\,\text{C}$. (ב) $4.8\,\text{mA}$. (ג) $1.5\cdot10^{16}$ אלקטרונים, מהלוח השלילי אל החיובי; הזרם המוסכם מהחיובי אל השלילי. (ד) כן, בכל רגע. (ה) מטען וזרם ממוצע פי 2, אנרגיה פי 4.

challenge:
  - id: W-3.2-c1
    stars: 1
    objectives: [OBJ-3.2-1]
    prompt: >-
      במאיץ פרוטונים מסוג ואן דה גראף, הכיפה היא כדור אלומיניום שרדיוסו $0.50\,\text{m}$, והיא טעונה לפוטנציאל של $5\cdot10^{5}\,\text{V}$ (אפס רחוק מאוד). רצועת גומי ברוחב $10\,\text{cm}$ נעה במהירות $20\,\text{m/s}$, ומעלה אל הכיפה מטען חיובי שמרוססים עליה למטה. מהכיפה יוצאים שני זרמים: קרן פרוטונים של $25\,\mu\text{A}$, וזרם דליפה של $50\,\mu\text{A}$ דרך העמוד שמחזיק את הכיפה.

      (א) מה המטען על הכיפה, ומה השדה החשמלי ליד פני הכיפה? בדקו שהשדה נמוך מ-$3\cdot10^{6}\,\text{V/m}$, השדה שבו האוויר מתחיל להוליך.

      (ב) כמה פרוטונים יוצאים בקרן בכל שנייה?

      (ג) כמה מטען צריך להיות על כל מטר רבוע של הרצועה, כדי שהפוטנציאל של הכיפה יישאר קבוע?

      (ד) הרצועה נעצרת פתאום, והקרן והדליפה ממשיכות. בזמן קצר הם כמעט לא משתנים. תוך כמה זמן הפוטנציאל של הכיפה יורד ב-1%?
    answer: >-
      (א) $Q \approx 2.8\cdot10^{-5}\,\text{C}$, ו-$E = 1\cdot10^{6}\,\text{V/m}$, נמוך מ-$3\cdot10^{6}\,\text{V/m}$.

      (ב) כ-$1.6\cdot10^{14}$ פרוטונים בשנייה.

      (ג) $3.75\cdot10^{-5}\,\text{C/m}^2$.

      (ד) כ-$3.7\cdot10^{-3}\,\text{s}$.
    solution:
      - kind: given
        text: >-
          רדיוס הכיפה $R = 0.50\,\text{m}$, הפוטנציאל שלה $V = 5\cdot10^{5}\,\text{V}$, רוחב הרצועה $w = 0.10\,\text{m}$ ומהירותה $u = 20\,\text{m/s}$. זרם הקרן $I_b = 25\cdot10^{-6}\,\text{A}$, זרם הדליפה $I_\ell = 50\cdot10^{-6}\,\text{A}$, $k = 9\cdot10^{9}\,\text{N}\cdot\text{m}^2/\text{C}^2$.
      - kind: formula
        text: >-
          (א) מחוץ לכדור מוליך טעון, השדה והפוטנציאל הם כמו של מטען נקודתי במרכזו (שיעור 2.5): $V = \dfrac{kQ}{R}$, ועל פני הכדור $E = \dfrac{kQ}{R^2} = \dfrac{V}{R}$.
      - kind: substitution
        text: >-
          $$Q = \frac{VR}{k} = \frac{5\cdot10^{5}\cdot0.50}{9\cdot10^{9}} \approx 2.78\cdot10^{-5}\ \text{C}
          \qquad
          E = \frac{V}{R} = \frac{5\cdot10^{5}}{0.50} = 1\cdot10^{6}\ \text{V/m}$$
          השדה קטן פי 3 מהשדה שבו האוויר מתחיל להוליך.
      - kind: substitution
        text: >-
          (ב) כל פרוטון נושא $e$, ולכן מספר הפרוטונים בשנייה $\dfrac{I_b}{e} = \dfrac{25\cdot10^{-6}}{1.6\cdot10^{-19}} \approx 1.6\cdot10^{14}$.
      - kind: reasoning
        text: >-
          (ג) הפוטנציאל של הכיפה קבוע רק אם המטען שלה קבוע, כלומר אם בכל שנייה מגיע אליה בדיוק המטען שיוצא ממנה. יוצאים $I_b + I_\ell = 75\cdot10^{-6}\,\text{A}$, ולכן הרצועה צריכה להביא זרם של $75\,\mu\text{A}$.
      - kind: manipulation
        text: >-
          נסמן ב-$\sigma$ את המטען על כל מטר רבוע של הרצועה. בזמן $\Delta t$ מגיע לכיפה קטע רצועה שאורכו $u\,\Delta t$ ושטחו $w\,u\,\Delta t$, עם מטען $\sigma\,w\,u\,\Delta t$. מחלקים ב-$\Delta t$ ומקבלים $I = \sigma w u$, אותו רעיון כמו ב-$I = nqvA$. מבודדים את $\sigma$:
          $$\sigma = \frac{I}{wu} = \frac{75\cdot10^{-6}}{0.10\cdot20} = 3.75\cdot10^{-5}\ \text{C/m}^2$$
      - kind: reasoning
        text: >-
          (ד) $V = kQ/R$ יחסי ל-$Q$, ולכן ירידה של 1% בפוטנציאל היא ירידה של 1% במטען: $\Delta Q = 0.01\cdot2.78\cdot10^{-5} = 2.78\cdot10^{-7}\,\text{C}$. הכיפה מאבדת מטען בקצב של $75\,\mu\text{A}$, ומ-$I = \Delta q/\Delta t$:
          $$\Delta t = \frac{\Delta Q}{I} = \frac{2.78\cdot10^{-7}}{75\cdot10^{-6}} \approx 3.7\cdot10^{-3}\ \text{s}$$
          ההנחה שהזרמים לא משתנים סבירה כאן, כי הפוטנציאל משתנה רק ב-1%.
      - kind: result
        text: >-
          (א) $Q \approx 2.8\cdot10^{-5}\,\text{C}$, $E = 1\cdot10^{6}\,\text{V/m}$. (ב) כ-$1.6\cdot10^{14}$ פרוטונים בשנייה. (ג) $\sigma = 3.75\cdot10^{-5}\,\text{C/m}^2$. (ד) כ-$3.7\cdot10^{-3}\,\text{s}$: בלי הרצועה, הכיפה מתרוקנת מהר מאוד.
    source:
      name: USA Physics Olympiad (USAPhO)
      year: 2017
      problem: 'Part B, Question B2 (parts a and c)'
      url: https://www.aapt.org/physicsteam/2019/upload/USAPhO-2017-Solutions.pdf
      verified: '2026-11-02'
      adapted: true

  - id: W-3.2-c2
    stars: 2
    objectives: [OBJ-3.2-1, OBJ-3.2-3]
    prompt: >-
      ברשת החשמל של הבית זורם זרם חילופין: הזרם משנה את כיוונו הלוך ושוב, $50$ מחזורים שלמים בשנייה, והוא משתנה עם הזמן כמו המהירות בתנועה הרמונית. בתיל נחושת שקוטרו $1.0\,\text{mm}$, הערך המרבי של הזרם הוא $14\,\text{A}$. בנחושת $n = 8.5\cdot10^{28}\,\text{m}^{-3}$, ובכל רגע מתקיים $I = nqvA$.

      (א) מה מהירות הסחיפה המרבית של האלקטרונים החופשיים?

      (ב) האלקטרונים החופשיים נעים הלוך ושוב בתנועה הרמונית, באותה תדירות כמו הזרם. מה המשרעת של התנועה הזאת, כלומר המרחק המרבי של אלקטרון מהנקודה האמצעית של התנועה שלו? רמז: בתנועה הרמונית שהמשרעת שלה $x_0$ והתדירות הזוויתית שלה $\omega = 2\pi f$, המהירות המרבית היא $v_{max} = \omega x_0$.

      (ג) כמה מטען עובר דרך חתך של התיל בחצי מחזור, מרגע שבו הזרם אפס עד הרגע הבא שבו הוא אפס? רמז: בחצי מחזור כל אלקטרון עובר מקצה אחד של התנועה שלו לקצה השני. אילו אלקטרונים חוצים את החתך?

      (ד) מנורה בבית דולקת שעות, והאלקטרונים בתיל לא מתרחקים יותר מכמה מיקרומטרים מהמקום שבו התחילו. איך זה מתיישב עם מה שלמדנו בשיעור?
    answer: >-
      (א) כ-$1.3\cdot10^{-3}\,\text{m/s}$.

      (ב) כ-$4.2\cdot10^{-6}\,\text{m}$, כלומר כ-$4\,\mu\text{m}$.

      (ג) כ-$0.089\,\text{C}$.

      (ד) הנורה לא צריכה אלקטרונים שמגיעים מרחוק: האלקטרונים כבר נמצאים בחוט הלהט, והשדה מניע אותם בכל המעגל בבת אחת. הנורה מקבלת אנרגיה, לא אלקטרונים.
    solution:
      - kind: given
        text: >-
          $d = 1.0\cdot10^{-3}\,\text{m}$, $I_{max} = 14\,\text{A}$, $f = 50\,\text{Hz}$, $n = 8.5\cdot10^{28}\,\text{m}^{-3}$, $q = e = 1.6\cdot10^{-19}\,\text{C}$.
      - kind: formula
        text: >-
          $A = \dfrac{\pi d^2}{4}$ ו-$v = \dfrac{I}{neA}$ בכל רגע. מ-$v_{max} = \omega x_0$, מחלקים ב-$\omega$: $x_0 = \dfrac{v_{max}}{\omega}$.
      - kind: substitution
        text: >-
          (א) $A = \dfrac{\pi\cdot(10^{-3})^2}{4} = 7.85\cdot10^{-7}\,\text{m}^2$. $n$, $e$ ו-$A$ קבועים, ולכן המהירות מרבית כשהזרם מרבי:
          $$v_{max} = \frac{14}{8.5\cdot10^{28}\cdot1.6\cdot10^{-19}\cdot7.85\cdot10^{-7}} \approx 1.31\cdot10^{-3}\ \text{m/s}$$
      - kind: substitution
        text: >-
          (ב) $\omega = 2\pi\cdot50 \approx 314\,\text{rad/s}$, ולכן
          $$x_0 = \frac{1.31\cdot10^{-3}}{314} \approx 4.2\cdot10^{-6}\ \text{m}$$
      - kind: reasoning
        text: >-
          (ג) כשהזרם אפס, כל אלקטרון נמצא בקצה של התנועה שלו. בחצי המחזור שאחר כך הוא עובר לקצה השני, מרחק $2x_0$, בכיוון אחד. כל האלקטרונים נעים יחד, ולכן את החתך חוצים בדיוק האלקטרונים שהתחילו במרחק של עד $2x_0$ לפניו. הם ממלאים גליל שאורכו $2x_0$ ושטח הבסיס שלו $A$.
      - kind: substitution
        text: >-
          $$\Delta q = n\,e\,A\cdot2x_0 = 8.5\cdot10^{28}\cdot1.6\cdot10^{-19}\cdot7.85\cdot10^{-7}\cdot2\cdot4.17\cdot10^{-6} \approx 0.089\ \text{C}$$
          בדיקה: חצי מחזור הוא $0.01\,\text{s}$, ולכן הזרם הממוצע בו $0.089/0.01 \approx 8.9\,\text{A}$, בין אפס ל-$14\,\text{A}$, כמו שמתאים לזרם שעולה מאפס ל-$14\,\text{A}$ וחוזר לאפס.
      - kind: reasoning
        text: >-
          (ד) כמו בשיעור: התילים וחוט הלהט מלאים באלקטרונים חופשיים מההתחלה, והשדה שמניע אותם קיים בכל המעגל כמעט באותו רגע. בחוט הלהט האלקטרונים נדחפים הלוך ושוב, מתנגשים ביונים ומוסרים להם אנרגיה, והחוט מתחמם ומאיר. כדי לקבל אנרגיה הנורה לא צריכה שאלקטרון כלשהו יגיע אליה מתחנת הכוח.
      - kind: result
        text: >-
          (א) $v_{max} \approx 1.3\cdot10^{-3}\,\text{m/s}$. (ב) $x_0 \approx 4.2\cdot10^{-6}\,\text{m}$. (ג) $\Delta q \approx 0.089\,\text{C}$. (ד) הנורה מקבלת אנרגיה מהשדה דרך האלקטרונים שכבר נמצאים בה, ולא צריכה אלקטרונים מרחוק.
