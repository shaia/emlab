    diagramAlt: >-
      מעגל עם סוללה בצלע השמאלית, הקו הארוך, ההדק החיובי, למעלה. מההדק החיובי התיל העליון עובר דרך הנורה L1 אל צומת. מהצומת יורדים שני ענפים אל התיל התחתון: באחד הנורה L2, ובשני, מימין, הנורות L3 ו-L4 זו מתחת לזו, בטור. התיל התחתון חוזר אל ההדק השלילי של הסוללה.
    answer: >-
      א. על $L_1$ שלוש חמישיות מהמתח, על $L_2$ שתי חמישיות, ועל $L_3$ ועל $L_4$ חמישית לכל אחת. הסדר: $L_1$, אחריה $L_2$, ואחריהן $L_3$ ו-$L_4$, שוות.

      ב. $L_1$ מאירה חלש יותר (מ-$\tfrac35$ ל-$\tfrac13$ מהמתח), $L_3$ ו-$L_4$ מאירות חזק יותר (מ-$\tfrac15$ ל-$\tfrac13$), והזרם מהסוללה קטן.
    solution:
      - kind: given
        text: >-
          לכל נורה התנגדות $R$, והמתח $V_{\text{bat}}$ של הסוללה האידאלית קבוע.
      - kind: reasoning
        text: >-
          א. בענף של $L_3$ ו-$L_4$ ההתנגדות $2R$. הוא במקביל ל-$L_2$: $\dfrac{R\cdot2R}{R + 2R} = \dfrac23R$. בטור עם $L_1$: $R_{\text{eq}} = R + \dfrac23R = \dfrac53R$.
          בטור המתח מתחלק ביחס ישר להתנגדויות, $R$ מול $\tfrac23R$, כלומר $3 : 2$: על $L_1$ שלוש חמישיות מהמתח, ועל הזוג שתי חמישיות. $L_2$ מחוברת ישירות בין שני הצמתים, ולכן עליה כל שתי החמישיות. בענף השני שתי נורות זהות בטור מתחלקות שווה בשווה: חמישית לכל אחת.
          לנורות זהות ההספק $V^2/R$ גדל עם המתח, ולכן הסדר לפי הבהירות הוא לפי המתח.
      - kind: reasoning
        text: >-
          ב. בלי $L_2$ נשארות $L_1$, $L_3$ ו-$L_4$ במסלול אחד, בטור. שלוש נורות זהות בטור: שליש מהמתח לכל אחת.
          $L_1$ יורדת מ-$\tfrac35$ ל-$\tfrac13$, ומאירה חלש יותר. $L_3$ ו-$L_4$ עולות מ-$\tfrac15$ ל-$\tfrac13$, ומאירות חזק יותר.
          ההתנגדות השקולה גדלה מ-$\tfrac53R$ ל-$3R$, ולכן הזרם מהסוללה קטן.
      - kind: reasoning
        text: >-
          למה $L_3$ ו-$L_4$ מתחזקות אף שהזרם מהסוללה קטן? לפני השינוי רוב הזרם עבר דרך $L_2$, ועכשיו כל הזרם עובר דרכן. וגם: $L_1$ לוקחת עכשיו פחות מתח, ולכן לחלק שמתחת לצומת נשאר יותר.
      - kind: result
        text: >-
          א. $L_1$: $\tfrac35$ מהמתח. $L_2$: $\tfrac25$. $L_3$ ו-$L_4$: $\tfrac15$ כל אחת. הסדר: $L_1$, אחריה $L_2$, ואחריהן $L_3$ ו-$L_4$, שוות.

          ב. $L_1$ מאירה חלש יותר, $L_3$ ו-$L_4$ מאירות חזק יותר, וכל השלוש באותה בהירות. הזרם מהסוללה קטן.

challenge:
  - id: W-3.5-c1
    stars: 1
    objectives: [OBJ-3.5-2, OBJ-3.5-3]
    prompt: >-
      במעגל שבאיור סוללה אידאלית של $10\,\text{V}$, ארבעה נגדים ומפסק $S$. נגד של $20\,\text{k}\Omega$ מחובר בטור לנגד של $5\,\text{k}\Omega$, וכשסוגרים את $S$ מצטרפים לנגד של $5\,\text{k}\Omega$, במקביל, נגד של $15\,\text{k}\Omega$ ונגד של $10\,\text{k}\Omega$, כל אחד בענף משלו.

      א. לפני שמחשבים: כשסוגרים את $S$, האם הזרם בנגד של $5\,\text{k}\Omega$ גדל או קטן? נמקו.

      ב. חשבו את הזרם $I_o$ בנגד של $5\,\text{k}\Omega$ כש-$S$ פתוח, ואת הזרם $I_c$ בו כש-$S$ סגור.

      ג. מצאו את היחס $I_c/I_o$ כיחס בין שני מספרים שלמים. האם הוא תלוי במתח של הסוללה?
