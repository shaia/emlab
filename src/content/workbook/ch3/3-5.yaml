    diagramAlt: >-
      סוללה בצלע השמאלית, הקו הארוך, ההדק החיובי, למעלה. בתיל העליון נגד של 20 קילואוהם, ואחריו צומת שממנו יורד נגד של 5 קילואוהם אל התיל התחתון. מימין לצומת מפסק S פתוח, ואחריו שני נגדים שיורדים אל התיל התחתון: 15 קילואוהם ו-10 קילואוהם. התיל התחתון חוזר אל ההדק השלילי.
    answer: >-
      א. קטן.

      ב. $I_o = 0.4\,\text{mA}$, $I_c = 0.24\,\text{mA}$.

      ג. $I_c/I_o = 3/5$, ואינו תלוי במתח של הסוללה.
    solution:
      - kind: given
        text: >-
          $V_{\text{bat}} = 10\,\text{V}$, $R_1 = 20\,\text{k}\Omega$ בטור עם הקבוצה שמתחת לצומת, $R_p$; בקבוצה $5\,\text{k}\Omega$, ואחרי סגירת $S$ גם $15\,\text{k}\Omega$ ו-$10\,\text{k}\Omega$ במקביל. נוח לחשב בקילואוהם ובמיליאמפר: $1\,\text{mA}\cdot1\,\text{k}\Omega = 10^{-3}\,\text{A}\cdot10^{3}\,\Omega = 1\,\text{V}$.
      - kind: reasoning
        text: >-
          א. סגירת $S$ מוסיפה ענפים במקביל, ולכן ההתנגדות של הקבוצה, וגם ההתנגדות השקולה, קטנות. הזרם מהסוללה גדל, וכולו עובר בנגד של $20\,\text{k}\Omega$, שלוקח עכשיו יותר מתח. לקבוצה נשאר פחות מתח, והזרם בנגד של $5\,\text{k}\Omega$, שווה למתח הזה חלקי $5\,\text{k}\Omega$, קטן.
      - kind: formula
        text: >-
          במקביל $\dfrac{1}{R} = \dfrac{1}{R_a} + \dfrac{1}{R_b} + \dfrac{1}{R_c}$, בטור $R_{\text{eq}} = R_1 + R_p$, והזרם מהסוללה $I = \dfrac{V_{\text{bat}}}{R_{\text{eq}}}$.
      - kind: substitution
        text: >-
          ב. $S$ פתוח: $R_{\text{eq}} = 20 + 5 = 25\,\text{k}\Omega$, וכל הזרם עובר בנגד של $5\,\text{k}\Omega$: $I_o = \dfrac{10}{25} = 0.4\,\text{mA}$.
      - kind: substitution
        text: >-
          $S$ סגור: $\dfrac{1}{R_p} = \dfrac15 + \dfrac1{15} + \dfrac1{10} = \dfrac{6 + 2 + 3}{30} = \dfrac{11}{30}\,\text{k}\Omega^{-1}$, ולכן $R_p = \dfrac{30}{11} \approx 2.73\,\text{k}\Omega$. אז $R_{\text{eq}} = 20 + \dfrac{30}{11} = \dfrac{250}{11} \approx 22.7\,\text{k}\Omega$, והזרם מהסוללה $I = 10\cdot\dfrac{11}{250} = 0.44\,\text{mA}$.
          המתח על הקבוצה $0.44\cdot\dfrac{30}{11} = 1.2\,\text{V}$, ולכן $I_c = \dfrac{1.2}{5} = 0.24\,\text{mA}$.
      - kind: substitution
        text: >-
          ג. $\dfrac{I_c}{I_o} = \dfrac{0.24}{0.4} = \dfrac{3}{5}$. כל הזרמים במעגל של נגדים וסוללה אידאלית גדלים ביחס ישר למתח של הסוללה, ולכן היחס לא תלוי בו. בלי מספרים: $I_o = \dfrac{V_{\text{bat}}}{25}$ ו-$I_c = \dfrac{3V_{\text{bat}}}{125}$, ביחידות של $\text{k}\Omega$, והיחס $\dfrac{3}{5}$.
      - kind: result
        text: >-
          א. הזרם בנגד של $5\,\text{k}\Omega$ קטן.

          ב. $I_o = 0.4\,\text{mA}$, $I_c = 0.24\,\text{mA}$.

          ג. $I_c/I_o = 3/5$, לכל מתח של הסוללה.
    source:
      name: British Physics Olympiad (BPhO), Round 1
      year: 2022
      problem: 'Round 1, 11 November 2022, Section 1, Question 1(n)'
      url: https://www.bpho.org.uk/Papers/R1/2022Nov_R1_S1.pdf
      verified: '2026-11-02'
      adapted: true

  - id: W-3.5-c2
    stars: 1
    objectives: [OBJ-3.5-1, OBJ-3.5-2]
    prompt: >-
      רשת אינסופית של נגדים זהים, כל אחד בהתנגדות $r$, בנויה כמו באיור: לאורך התיל העליון נגדים בטור, ואחרי כל אחד מהם נגד "שלב" שיורד אל התיל התחתון. הרשת ממשיכה ימינה בלי סוף.

      א. מצאו את ההתנגדות השקולה $R_{AB}$ בין הנקודות A ו-B, בעזרת $r$.

      ב. $r = 10\,\Omega$, ומחברים בין A ל-B סוללה אידאלית של $12\,\text{V}$. מה הזרם מהסוללה? מה המתח על השלב הראשון, ומה המתח על השלב השני?

      ג. רשת אמיתית היא סופית. חשבו את ההתנגדות השקולה של רשת עם שלושה נגדים בתיל העליון ושלושה שלבים בלבד, כמו החלק המצויר, כש-$r = 10\,\Omega$. בכמה אחוזים היא שונה מהתשובה של סעיף א?
