    diagramAlt: >-
      שני תילים אופקיים, עליון ותחתון. הנקודה A בקצה השמאלי של התיל העליון, והנקודה B בקצה השמאלי של התיל התחתון. בתיל העליון נגדים r בטור, ואחרי כל אחד מהם יורד נגד r, שלב, אל התיל התחתון. מצוירים שלושה נגדים עליונים ושלושה שלבים, וקו מקווקו מימין מראה שהרשת ממשיכה בלי סוף.
    answer: >-
      א. $R_{AB} = \dfrac{1 + \sqrt5}{2}\,r \approx 1.62\,r$.

      ב. כ-$0.74\,\text{A}$. על השלב הראשון כ-$4.6\,\text{V}$, ועל השני כ-$1.75\,\text{V}$: כל שלב מקבל כ-$0.38$ מהמתח של השלב שלפניו.

      ג. $16.25\,\Omega$, לעומת כ-$16.18\,\Omega$ ברשת האינסופית: גדולה בכ-$0.4\%$.
    solution:
      - kind: given
        text: >-
          כל הנגדים $r$. הרשת אינסופית ימינה.
      - kind: reasoning
        text: >-
          א. מסתכלים על הרשת מימין לנגד העליון הראשון, בין הצומת שאחריו לבין התיל התחתון: השלב הראשון, ומימינו כל השאר. כל השאר הוא בדיוק אותה רשת אינסופית כמו המקורית, כי להסיר ממנה חוליה אחת לא משנה רשת שאין לה סוף. לכן ההתנגדות שלו היא $R_{AB}$ עצמה.
          ומכאן הרשת כולה היא: $r$ בטור, ואחריו $r$ (השלב הראשון) במקביל ל-$R_{AB}$.
      - kind: formula
        text: >-
          $$R_{AB} = r + \frac{r\,R_{AB}}{r + R_{AB}}$$
      - kind: manipulation
        text: >-
          מסמנים $R = R_{AB}$ ומכפילים את שני האגפים ב-$(r + R)$, כדי להיפטר מהשבר:
          $$R\,(r + R) = r\,(r + R) + rR$$
          $$rR + R^2 = r^2 + rR + rR$$
          מעבירים הכול לאגף אחד: $R^2 - rR - r^2 = 0$. זו משוואה ריבועית ב-$R$, ולפי נוסחת השורשים
          $$R = \frac{r \pm \sqrt{r^2 + 4r^2}}{2} = \frac{1 \pm \sqrt5}{2}\,r$$
          השורש עם המינוס שלילי, והתנגדות לא יכולה להיות שלילית. נשאר $R_{AB} = \dfrac{1 + \sqrt5}{2}\,r \approx 1.618\,r$.
      - kind: reasoning
        text: >-
          בדיקת היגיון: חוליה אחת בלבד, $r$ ואחריו שלב $r$, נותנת $2r$. כל חוליה נוספת מוסיפה מסלול לזרם במקביל לשלב האחרון, ולכן מקטינה את ההתנגדות. התוצאה בין $r$ ל-$2r$, כמו שצריך.
      - kind: substitution
        text: >-
          ב. $R_{AB} = 1.618\cdot10 \approx 16.18\,\Omega$, והזרם מהסוללה $I = \dfrac{12}{16.18} \approx 0.742\,\text{A}$. כולו עובר בנגד העליון הראשון, שלוקח $0.742\cdot10 \approx 7.42\,\text{V}$. על השלב הראשון נשאר $12 - 7.42 \approx 4.58\,\text{V}$.
      - kind: reasoning
        text: >-
          לשלב השני: הרשת שמימין לשלב הראשון היא שוב עותק של כל הרשת, והמתח עליה הוא המתח של השלב הראשון, $4.58\,\text{V}$, כי היא מחוברת במקביל אליו. בעותק המתח מתחלק באותו יחס כמו ברשת המקורית: השלב הראשון שלו מקבל $\dfrac{4.58}{12} \approx 0.382$ מהמתח שעליו. לכן על השלב השני $0.382\cdot4.58 \approx 1.75\,\text{V}$, וכך הלאה: כל שלב מקבל כ-$0.38$ מהמתח של השלב שלפניו.
      - kind: substitution
        text: >-
          ג. מחשבים מהסוף להתחלה. החוליה האחרונה, נגד עליון ושלב בטור: $r + r = 2r = 20\,\Omega$. היא במקביל לשלב השני: $\dfrac{10\cdot20}{10 + 20} = \dfrac{20}{3}\,\Omega$, ועם הנגד העליון שלפניו $10 + \dfrac{20}{3} = \dfrac{50}{3} \approx 16.67\,\Omega$. זה במקביל לשלב הראשון: $\dfrac{10\cdot\frac{50}{3}}{10 + \frac{50}{3}} = \dfrac{500}{80} = 6.25\,\Omega$, ועם הנגד העליון הראשון $R = 10 + 6.25 = 16.25\,\Omega$.
          ההפרש היחסי: $\dfrac{16.25 - 16.18}{16.18} \approx 0.004$, כלומר כ-$0.4\%$.
      - kind: result
        text: >-
          א. $R_{AB} = \dfrac{1 + \sqrt5}{2}\,r \approx 1.62\,r$.

          ב. כ-$0.74\,\text{A}$; על השלב הראשון כ-$4.6\,\text{V}$, ועל השני כ-$1.75\,\text{V}$.

          ג. $16.25\,\Omega$, גדולה בכ-$0.4\%$ מ-$16.18\,\Omega$: כבר שלוש חוליות קרובות מאוד לרשת האינסופית, כי כל חוליה נוספת משנה רק מעט את מה שמגיע לשלבים הרחוקים.
