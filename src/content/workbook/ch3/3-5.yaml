# Workbook, lesson 3.5 (resistors in series and in parallel). Format and rules: see .claude/CLAUDE.md, "Worked examples, workbook".
# Every circuit was recomputed with src/physics/circuits.ts: seriesR and parallelR, and solveCircuit on the
# whole network (an ideal battery, r = 0), including each "what changes if" state and both challenge problems.
# In a >- block, consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '3.5'
practice:
  - id: W-3.5-01
    level: basic
    qualitative: false
    objectives: [OBJ-3.5-1]
    prompt: >-
      יש לכם שלושה נגדים זהים, כל אחד של $6\,\Omega$. מצאו את ההתנגדות השקולה בכל אחד מארבעת החיבורים שמשתמשים בשלושתם:

      א. שלושתם בטור.

      ב. שלושתם במקביל.

      ג. נגד אחד בטור עם זוג שמחובר במקביל.

      ד. שניים בטור, והזוג הזה במקביל לנגד השלישי.
    answer: >-
      א. $18\,\Omega$.

      ב. $2\,\Omega$.

      ג. $9\,\Omega$.

      ד. $4\,\Omega$.
    solution:
      - kind: given
        text: >-
          שלושה נגדים, כל אחד $R = 6\,\Omega$.
      - kind: formula
        text: >-
          בטור $R_{\text{eq}} = R_1 + R_2 + \dots$, ובמקביל $\dfrac{1}{R_{\text{eq}}} = \dfrac{1}{R_1} + \dfrac{1}{R_2} + \dots$; לשני נגדים במקביל $R_{\text{eq}} = \dfrac{R_1R_2}{R_1 + R_2}$.
      - kind: substitution
        text: >-
          א. $6 + 6 + 6 = 18\,\Omega$.

          ב. $\dfrac{1}{R_{\text{eq}}} = \dfrac16 + \dfrac16 + \dfrac16 = \dfrac36 = \dfrac12\,\Omega^{-1}$, ואחרי היפוך $R_{\text{eq}} = 2\,\Omega$.

          ג. הזוג במקביל: $\dfrac{6\cdot6}{6+6} = 3\,\Omega$. בטור עם הנגד השלישי: $6 + 3 = 9\,\Omega$.

          ד. השניים בטור: $6 + 6 = 12\,\Omega$. במקביל לנגד של $6\,\Omega$: $\dfrac{12\cdot6}{12+6} = \dfrac{72}{18} = 4\,\Omega$.
      - kind: reasoning
        text: >-
          בדיקה: כל התוצאות בין $2\,\Omega$ (הכול במקביל, הכי הרבה מסלולים) ל-$18\,\Omega$ (הכול בטור, מסלול אחד ארוך), וכך צריך להיות.
      - kind: result
        text: >-
          א. $18\,\Omega$.

          ב. $2\,\Omega$.

          ג. $9\,\Omega$.

          ד. $4\,\Omega$.

  - id: W-3.5-02
    level: basic
    qualitative: false
    objectives: [OBJ-3.5-2]
    prompt: >-
      שלושה נגדים, $2\,\Omega$, $4\,\Omega$ ו-$6\,\Omega$, מחוברים בטור לסוללה אידאלית של $24\,\text{V}$.

      א. מה הזרם במעגל?

      ב. מה המתח על כל נגד?

      ג. באיזה נגד ההספק הגדול ביותר, ומה הוא?
    answer: >-
      א. $2\,\text{A}$.

      ב. $4\,\text{V}$, $8\,\text{V}$ ו-$12\,\text{V}$.

      ג. בנגד של $6\,\Omega$: $24\,\text{W}$.
    solution:
      - kind: given
        text: >-
          $R_1 = 2\,\Omega$, $R_2 = 4\,\Omega$, $R_3 = 6\,\Omega$ בטור, $V_{\text{bat}} = 24\,\text{V}$.
      - kind: formula
        text: >-
          בטור $R_{\text{eq}} = R_1 + R_2 + R_3$, והזרם $I = \dfrac{V_{\text{bat}}}{R_{\text{eq}}}$ משותף לכל הנגדים. בכל נגד $V = IR$ ו-$P = I^2R$.
      - kind: substitution
        text: >-
          א. $R_{\text{eq}} = 2 + 4 + 6 = 12\,\Omega$, ו-$I = \dfrac{24}{12} = 2\,\text{A}$.

          ב. $V_1 = 2\cdot2 = 4\,\text{V}$, $V_2 = 2\cdot4 = 8\,\text{V}$, $V_3 = 2\cdot6 = 12\,\text{V}$. בדיקה: $4 + 8 + 12 = 24\,\text{V}$.

          ג. $P_1 = 2^2\cdot2 = 8\,\text{W}$, $P_2 = 2^2\cdot4 = 16\,\text{W}$, $P_3 = 2^2\cdot6 = 24\,\text{W}$.
      - kind: reasoning
        text: >-
          בטור הזרם משותף, ולכן גם המתח וגם ההספק גדלים ביחס ישר להתנגדות: הנגד הגדול ביותר מקבל את החלק הגדול ביותר.
      - kind: result
        text: >-
          א. $2\,\text{A}$.

          ב. $4\,\text{V}$, $8\,\text{V}$ ו-$12\,\text{V}$.

          ג. בנגד של $6\,\Omega$: $24\,\text{W}$.

  - id: W-3.5-03
    level: basic
    qualitative: true
    objectives: [OBJ-3.5-1]
    prompt: >-
      יש נגד של $1\,\Omega$ ונגד של $1\,\text{M}\Omega$, כלומר $10^{6}\,\Omega$. קבעו ונמקו, בלי לחשב במדויק:

      א. בערך מה ההתנגדות השקולה כשהם מחוברים בטור? היא קצת יותר או קצת פחות מהערך הזה?

      ב. בערך מה ההתנגדות השקולה כשהם מחוברים במקביל? היא קצת יותר או קצת פחות מהערך הזה?
    answer: >-
      א. כמעט בדיוק $1\,\text{M}\Omega$, וקצת יותר ממנו.

      ב. כמעט בדיוק $1\,\Omega$, וקצת פחות ממנו.
    solution:
      - kind: given
        text: >-
          $R_1 = 1\,\Omega$ ו-$R_2 = 10^{6}\,\Omega$: הגדול גדול פי מיליון.
      - kind: reasoning
        text: >-
          א. בטור ההתנגדויות מתחברות: $10^{6} + 1$. הנגד הקטן מוסיף אחד למיליון, ולכן ההתנגדות השקולה כמעט כולה של הנגד הגדול, וקצת יותר ממנו. בטור הנגד **הגדול** קובע.
      - kind: reasoning
        text: >-
          ב. במקביל על שני הנגדים אותו מתח, ולכן הזרם בנגד הגדול קטן פי מיליון מהזרם בקטן. כמעט כל הזרם עובר בנגד הקטן, וההתנגדות השקולה קרובה ל-$1\,\Omega$. הענף של הנגד הגדול הוא בכל זאת מסלול נוסף לזרם: הוא מוסיף מעט זרם באותו מתח, ולכן ההתנגדות השקולה קצת **פחות** מ-$1\,\Omega$. במקביל הנגד **הקטן** קובע.
      - kind: result
        text: >-
          א. כמעט בדיוק $1\,\text{M}\Omega$, וקצת יותר ממנו.

          ב. כמעט בדיוק $1\,\Omega$, וקצת פחות ממנו (בערך $0.999999\,\Omega$).

  - id: W-3.5-04
    level: mid
    qualitative: false
    objectives: [OBJ-3.5-2]
    prompt: >-
      נגד של $4\,\Omega$ ונגד שההתנגדות שלו $R_x$ לא ידועה מחוברים במקביל לסוללה אידאלית של $12\,\text{V}$. הסוללה מספקת זרם של $5\,\text{A}$.

      א. מצאו את $R_x$.

      ב. מה ההספק בכל אחד מהנגדים?
    answer: >-
      א. $R_x = 6\,\Omega$.

      ב. $36\,\text{W}$ בנגד של $4\,\Omega$, ו-$24\,\text{W}$ ב-$R_x$.
    solution:
      - kind: given
        text: >-
          $R_1 = 4\,\Omega$, $V_{\text{bat}} = 12\,\text{V}$, $I = 5\,\text{A}$. במקביל על כל נגד המתח המלא, $12\,\text{V}$.
      - kind: formula
        text: >-
          בכל ענף $I = \dfrac{V}{R}$, ובצומת $I = I_1 + I_x$. ההספק $P = VI$.
      - kind: manipulation
        text: >-
          מהצומת: $I_x = I - I_1$. אחרי שמוצאים את $I_x$, מבודדים את ההתנגדות מ-$I_x = \dfrac{V}{R_x}$: $R_x = \dfrac{V}{I_x}$.
      - kind: substitution
        text: >-
          $I_1 = \dfrac{12}{4} = 3\,\text{A}$, ולכן $I_x = 5 - 3 = 2\,\text{A}$ ו-$R_x = \dfrac{12}{2} = 6\,\Omega$.

          ההספקים: $P_1 = 12\cdot3 = 36\,\text{W}$ ו-$P_x = 12\cdot2 = 24\,\text{W}$. בדיקה: $36 + 24 = 60\,\text{W} = 12\cdot5$, ההספק שהסוללה מספקת.
      - kind: result
        text: >-
          א. $R_x = 6\,\Omega$.

          ב. $36\,\text{W}$ בנגד של $4\,\Omega$, ו-$24\,\text{W}$ ב-$R_x$.

  - id: W-3.5-05
    level: mid
    qualitative: true
    objectives: [OBJ-3.5-3]
    prompt: >-
      שלוש נורות זהות מחוברות לסוללה אידאלית: $L_1$ ו-$L_2$ בטור בענף אחד, ו-$L_3$ בענף שני, ושני הענפים מחוברים ישירות להדקי הסוללה. שלושתן דולקות. מוציאים את $L_1$ מהבית שלה. קבעו ונמקו:

      א. מה קורה ל-$L_2$ ול-$L_3$?

      ב. איך משתנה הזרם שהסוללה מספקת, ופי כמה?
    answer: >-
      א. $L_2$ נכבית, ו-$L_3$ מאירה בדיוק כמו קודם.

      ב. הזרם מהסוללה קטן לשני שלישים ממה שהיה.
    solution:
      - kind: given
        text: >-
          לכל נורה התנגדות $R$, והמתח $V_{\text{bat}}$ בין ההדקים קבוע. לפני השינוי: בענף של $L_1$ ו-$L_2$ ההתנגדות $2R$ והזרם $\dfrac{V_{\text{bat}}}{2R}$, ובענף של $L_3$ הזרם $\dfrac{V_{\text{bat}}}{R}$.
      - kind: reasoning
        text: >-
          א. $L_2$ בטור עם $L_1$, ולכן הן במסלול אחד של הזרם. כשמוציאים את $L_1$ המסלול הזה נפתח, ואין בו זרם: $L_2$ נכבית, אף שהיא עצמה שלמה.
          $L_3$ מחוברת ישירות להדקי הסוללה, והמתח עליה הוא עדיין $V_{\text{bat}}$. לכן הזרם בה וההספק שלה לא משתנים.
      - kind: reasoning
        text: >-
          ב. לפני השינוי הזרם מהסוללה הוא סכום הזרמים בענפים: $\dfrac{V_{\text{bat}}}{2R} + \dfrac{V_{\text{bat}}}{R} = \dfrac{3V_{\text{bat}}}{2R}$. אחרי השינוי נשאר רק הענף של $L_3$, עם $\dfrac{V_{\text{bat}}}{R}$. היחס $\dfrac{V_{\text{bat}}/R}{3V_{\text{bat}}/2R} = \dfrac23$.
      - kind: result
        text: >-
          א. $L_2$ נכבית, ו-$L_3$ מאירה בדיוק כמו קודם.

          ב. הזרם מהסוללה קטן לשני שלישים ממה שהיה: נשאר רק הזרם של $L_3$.

  - id: W-3.5-06
    level: mid
    qualitative: false
    objectives: [OBJ-3.5-1, OBJ-3.5-2]
    prompt: >-
      נגד $R_1 = 6\,\Omega$ מחובר בטור לזוג ענפים שמחוברים במקביל זה לזה. בענף אחד שני נגדים בטור, $R_2 = 4\,\Omega$ ו-$R_3 = 8\,\Omega$, ובענף השני נגד $R_4 = 12\,\Omega$. הרשת מחוברת לסוללה אידאלית של $24\,\text{V}$.

      א. מה ההתנגדות השקולה של הרשת?

      ב. מה המתח על $R_3$?

      ג. מה ההספק ב-$R_4$?
    answer: >-
      א. $12\,\Omega$.

      ב. $8\,\text{V}$.

      ג. $12\,\text{W}$.
    solution:
      - kind: given
        text: >-
          $R_1 = 6\,\Omega$, $R_2 = 4\,\Omega$, $R_3 = 8\,\Omega$, $R_4 = 12\,\Omega$, $V_{\text{bat}} = 24\,\text{V}$.
      - kind: formula
        text: >-
          מצמצמים מבפנים החוצה: קודם הטור שבתוך הענף, אחר כך הזוג שבמקביל, ובסוף הטור עם $R_1$. אחר כך חוזרים אחורה עם $V = IR$.
      - kind: substitution
        text: >-
          א. בענף הראשון $R_2 + R_3 = 4 + 8 = 12\,\Omega$. הוא במקביל ל-$R_4 = 12\,\Omega$: $\dfrac{12\cdot12}{12+12} = 6\,\Omega$. בטור עם $R_1$: $R_{\text{eq}} = 6 + 6 = 12\,\Omega$.
      - kind: substitution
        text: >-
          ב. הזרם מהסוללה $I = \dfrac{24}{12} = 2\,\text{A}$, וכולו עובר ב-$R_1$: $V_1 = 2\cdot6 = 12\,\text{V}$. על שני הענפים נשארים $24 - 12 = 12\,\text{V}$. בענף הראשון הזרם $\dfrac{12}{12} = 1\,\text{A}$, ולכן $V_3 = 1\cdot8 = 8\,\text{V}$ (ועל $R_2$ עוד $4\,\text{V}$, ביחד $12\,\text{V}$).
      - kind: substitution
        text: >-
          ג. על $R_4$ יש $12\,\text{V}$: $P_4 = \dfrac{V^2}{R_4} = \dfrac{144}{12} = 12\,\text{W}$.
      - kind: result
        text: >-
          א. $12\,\Omega$.

          ב. $8\,\text{V}$.

          ג. $12\,\text{W}$.

  - id: W-3.5-07
    level: mid
    qualitative: false
    objectives: [OBJ-3.5-2]
    prompt: >-
      שלושה נגדים זהים של $10\,\Omega$. כל אחד מהם נשרף אם ההספק בו עולה על $2.5\,\text{W}$. מחברים נגד אחד בטור עם זוג שמחובר במקביל, ומחברים את הרשת לסוללה אידאלית.

      א. איזה נגד יגיע ראשון להספק המרבי שלו? נמקו.

      ב. מה המתח הגדול ביותר של הסוללה שבו אף נגד לא נשרף?

      ג. מה ההספק הכולל של הרשת במתח הזה?
    answer: >-
      א. הנגד שבטור, כי עובר בו כל הזרם.

      ב. $7.5\,\text{V}$.

      ג. $3.75\,\text{W}$.
    solution:
      - kind: given
        text: >-
          $R = 10\,\Omega$ לכל נגד, וההספק המרבי $P_{\max} = 2.5\,\text{W}$.
      - kind: reasoning
        text: >-
          א. כל הזרם של הסוללה עובר בנגד שבטור, ובצומת הוא מתחלק חצי-חצי בין שני הנגדים הזהים שבמקביל. לנגדים שווים ההספק $I^2R$ גדל עם הזרם, ולכן הנגד שבטור מקבל פי $2^2 = 4$ יותר הספק מכל אחד משני האחרים. הוא מגיע ראשון לגבול.
      - kind: formula
        text: >-
          $P = I^2R$, ולכן הזרם המרבי בנגד הוא $I_{\max} = \sqrt{\dfrac{P_{\max}}{R}}$. המתח של הסוללה $V_{\text{bat}} = IR_{\text{eq}}$.
      - kind: substitution
        text: >-
          ב. $I_{\max} = \sqrt{\dfrac{2.5}{10}} = \sqrt{0.25} = 0.5\,\text{A}$. ההתנגדות השקולה $10 + \dfrac{10}{2} = 15\,\Omega$, ולכן $V_{\text{bat}} = 0.5\cdot15 = 7.5\,\text{V}$.
          בדיקה: על הנגד שבטור $0.5\cdot10 = 5\,\text{V}$, ועל הזוג $2.5\,\text{V}$. בכל אחד מהנגדים שבמקביל עוברים $0.25\,\text{A}$, וההספק בו $0.25^2\cdot10 = 0.625\,\text{W}$, הרבה מתחת לגבול.
      - kind: substitution
        text: >-
          ג. $P = V_{\text{bat}}I = 7.5\cdot0.5 = 3.75\,\text{W}$. בדיקה: $2.5 + 0.625 + 0.625 = 3.75\,\text{W}$.
      - kind: result
        text: >-
          א. הנגד שבטור, כי עובר בו כל הזרם.

          ב. $7.5\,\text{V}$.

          ג. $3.75\,\text{W}$, אף שלשלושה נגדים יחד "מותר" $7.5\,\text{W}$: הנגד שבטור מגביל את כולם.

  - id: W-3.5-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-3.5-1, OBJ-3.5-2, OBJ-3.5-3]
    prompt: >-
      בתנור חימום קטן יש שני סלילי חימום זהים, $A$ ו-$B$, לכל אחד התנגדות של $12\,\Omega$, והוא מחובר לסוללה אידאלית של $24\,\text{V}$. בעזרת מפסקים אפשר לבחור אחד משלושה מצבים: רק הסליל $A$, שני הסלילים בטור, או שני הסלילים במקביל. הניחו שההתנגדות של הסלילים קבועה.

      א. מה ההספק של התנור בכל מצב? איזה מצב הוא החימום החזק ביותר, ואיזה החלש ביותר?

      ב. פי כמה ההספק במצב החזק גדול מההספק במצב החלש?

      ג. הסליל $B$ נשרף, והמסלול שלו נפתח. מה ההספק של התנור עכשיו בכל אחד משלושת המצבים?
    answer: >-
      א. סליל אחד: $48\,\text{W}$. בטור: $24\,\text{W}$, החלש ביותר. במקביל: $96\,\text{W}$, החזק ביותר.

      ב. פי 4.

      ג. סליל אחד: $48\,\text{W}$. בטור: אפס. במקביל: $48\,\text{W}$.
    solution:
      - kind: given
        text: >-
          $R = 12\,\Omega$ לכל סליל, $V_{\text{bat}} = 24\,\text{V}$, קבוע בכל המצבים.
      - kind: formula
        text: >-
          המתח קבוע, ולכן נוח להשתמש ב-$P = \dfrac{V_{\text{bat}}^2}{R_{\text{eq}}}$: ככל שההתנגדות השקולה קטנה יותר, ההספק גדול יותר.
      - kind: substitution
        text: >-
          א. סליל אחד: $R_{\text{eq}} = 12\,\Omega$, ו-$P = \dfrac{24^2}{12} = \dfrac{576}{12} = 48\,\text{W}$.
          בטור: $R_{\text{eq}} = 24\,\Omega$, ו-$P = \dfrac{576}{24} = 24\,\text{W}$.
          במקביל: $R_{\text{eq}} = 6\,\Omega$, ו-$P = \dfrac{576}{6} = 96\,\text{W}$.
      - kind: reasoning
        text: >-
          ב. $\dfrac{96}{24} = 4$. היחס בין ההתנגדויות השקולות הוא $24 : 6 = 4$, ובמתח קבוע ההספק ביחס הפוך להתנגדות השקולה.
      - kind: reasoning
        text: >-
          ג. סליל אחד: המצב הזה משתמש רק ב-$A$, השלם, ולכן לא משתנה דבר: $48\,\text{W}$.
          בטור: $A$ ו-$B$ במסלול אחד, והמסלול נפתח ב-$B$. אין זרם, וההספק אפס.
          במקביל: הענף של $B$ נפתח, אבל $A$ עדיין מחובר בענף משלו להדקי הסוללה, עם המתח המלא. נשאר רק הסליל $A$: $48\,\text{W}$, במקום $96\,\text{W}$.
      - kind: result
        text: >-
          א. סליל אחד: $48\,\text{W}$. בטור: $24\,\text{W}$, החלש ביותר. במקביל: $96\,\text{W}$, החזק ביותר.

          ב. פי 4.

          ג. סליל אחד: $48\,\text{W}$. בטור: אפס, התנור לא מחמם. במקביל: $48\,\text{W}$, כמו סליל אחד.

  - id: W-3.5-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-3.5-2, OBJ-3.5-3]
    prompt: >-
      שני נגדים של $10\,\Omega$ מחוברים בטור לסוללה אידאלית של $12\,\text{V}$. מכשיר שצריך מתח של $6\,\text{V}$ מחברים בין שני הקצוות של הנגד התחתון, כלומר במקביל אליו. התייחסו למכשיר כאל נגד.

      א. מה המתח על הנגד התחתון לפני שמחברים את המכשיר?

      ב. ההתנגדות של המכשיר $10\,\Omega$. מה המתח עליו אחרי החיבור, ומה הזרם שהסוללה מספקת?

      ג. מחליפים את המכשיר במכשיר שההתנגדות שלו $1000\,\Omega$. מה המתח עליו עכשיו?

      ד. באיזה תנאי מקבל המכשיר כמעט בדיוק $6\,\text{V}$? נמקו.
    answer: >-
      א. $6\,\text{V}$.

      ב. $4\,\text{V}$; הסוללה מספקת $0.8\,\text{A}$ (במקום $0.6\,\text{A}$).

      ג. כ-$5.97\,\text{V}$, כמעט $6\,\text{V}$.

      ד. כשההתנגדות של המכשיר גדולה מאוד לעומת הנגד שהוא מחובר אליו במקביל.
    solution:
      - kind: given
        text: >-
          $R_1 = R_2 = 10\,\Omega$ בטור, $R_1$ העליון ו-$R_2$ התחתון, ו-$V_{\text{bat}} = 12\,\text{V}$. המכשיר, $R_m$, מחובר במקביל ל-$R_2$.
      - kind: formula
        text: >-
          בטור המתח מתחלק ביחס ישר להתנגדויות. לזוג במקביל $R_{2m} = \dfrac{R_2R_m}{R_2 + R_m}$.
      - kind: substitution
        text: >-
          א. שני נגדים שווים בטור: לכל אחד חצי מהמתח, $6\,\text{V}$. הזרם $\dfrac{12}{20} = 0.6\,\text{A}$.
      - kind: substitution
        text: >-
          ב. הזוג במקביל: $\dfrac{10\cdot10}{10+10} = 5\,\Omega$, וההתנגדות השקולה $10 + 5 = 15\,\Omega$. הזרם מהסוללה $\dfrac{12}{15} = 0.8\,\text{A}$, והמתח על הזוג, כלומר על המכשיר, $0.8\cdot5 = 4\,\text{V}$. על הנגד העליון $8\,\text{V}$.
      - kind: substitution
        text: >-
          ג. $R_{2m} = \dfrac{10\cdot1000}{10 + 1000} = \dfrac{10000}{1010} \approx 9.90\,\Omega$. ההתנגדות השקולה $\approx 19.90\,\Omega$, הזרם $\dfrac{12}{19.90} \approx 0.603\,\text{A}$, והמתח על המכשיר $0.603\cdot9.90 \approx 5.97\,\text{V}$ (בחישוב בלי עיגול בשלבי הביניים).
      - kind: reasoning
        text: >-
          ד. החלוקה חצי-חצי נכונה רק כששני החלקים בטור שווים. המכשיר במקביל מקטין את ההתנגדות של החלק התחתון, ולכן החלק הזה מקבל פחות מחצי. כשההתנגדות של המכשיר גדולה מאוד לעומת $10\,\Omega$, כמעט כל הזרם של החלק התחתון ממשיך לעבור בנגד, ההתנגדות של הזוג כמעט $10\,\Omega$, והמכשיר מקבל כמעט $6\,\text{V}$.
      - kind: result
        text: >-
          א. $6\,\text{V}$.

          ב. $4\,\text{V}$ על המכשיר, ו-$0.8\,\text{A}$ מהסוללה.

          ג. כ-$5.97\,\text{V}$.

          ד. כשההתנגדות של המכשיר גדולה מאוד לעומת $10\,\Omega$, הנגד שהוא מחובר אליו במקביל.

  - id: W-3.5-10
    level: bagrut
    qualitative: true
    objectives: [OBJ-3.5-3]
    prompt: >-
      ארבע נורות זהות מחוברות לסוללה אידאלית כמו באיור: $L_1$ בטור עם שני ענפים שמחוברים במקביל זה לזה. בענף אחד $L_2$, ובענף השני $L_3$ ו-$L_4$ בטור. ענו בלי מספרים, בשברים של המתח של הסוללה.

      א. איזה חלק מהמתח של הסוללה נמצא על כל נורה? סדרו את הנורות לפי הבהירות, מהחזקה לחלשה.

      ב. מוציאים את $L_2$ מהבית שלה. קבעו ונמקו מה קורה לבהירות של $L_1$, של $L_3$ ושל $L_4$, ולזרם מהסוללה.
    diagram: >-
