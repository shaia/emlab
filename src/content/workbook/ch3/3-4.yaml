# Workbook, lesson 3.4 (power and efficiency). Format and rules: see .claude/CLAUDE.md, "Worked examples, workbook".
# Every number was recomputed with src/physics/circuits.ts (powerVI, powerIR, powerVR, ratedResistance, KWH,
# efficiency, wireResistance, filamentBulb, solveCircuit) and G = 10 from src/physics/constants.ts.
# In a >- block, consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '3.4'
practice:
  - id: W-3.4-01
    level: basic
    qualitative: false
    objectives: [OBJ-3.4-1]
    prompt: >-
      במעגל של סוללה ונגד, מד מתח שמחובר בין שני הקצוות של הנגד מראה $6\,\text{V}$, ומד זרם שמחובר בטור מראה $0.25\,\text{A}$.

      א. מה ההספק בנגד?

      ב. מה ההתנגדות של הנגד?

      ג. חשבו את ההספק שוב, פעם בעזרת $P = I^2R$ ופעם בעזרת $P = V^2/R$, ובדקו שמתקבלת אותה תשובה.
    answer: >-
      א. $1.5\,\text{W}$.

      ב. $24\,\Omega$.

      ג. שתי הנוסחאות נותנות $1.5\,\text{W}$.
    solution:
      - kind: given
        text: >-
          המתח על הנגד $V = 6\,\text{V}$, והזרם בו $I = 0.25\,\text{A}$.
      - kind: formula
        text: >-
          $P = VI$, $R = \dfrac{V}{I}$.
      - kind: substitution
        text: >-
          $P = 6\,\text{V}\cdot0.25\,\text{A} = 1.5\,\text{W}$, ו-$R = \dfrac{6\,\text{V}}{0.25\,\text{A}} = 24\,\Omega$.
      - kind: substitution
        text: >-
          בדיקה: $I^2R = 0.25^2\cdot24 = 0.0625\cdot24 = 1.5\,\text{W}$, ו-$\dfrac{V^2}{R} = \dfrac{36}{24} = 1.5\,\text{W}$. שלוש הנוסחאות הן אותו חוק, ולכן הן מסכימות.
      - kind: result
        text: >-
          א. $P = 1.5\,\text{W}$.

          ב. $R = 24\,\Omega$.

          ג. גם $I^2R$ וגם $V^2/R$ נותנות $1.5\,\text{W}$.

  - id: W-3.4-02
    level: basic
    qualitative: false
    objectives: [OBJ-3.4-3]
    prompt: >-
      נורת לד של $9\,\text{W}$ נותנת בערך אותו אור כמו נורת להט של $60\,\text{W}$. מחליפים נורת להט בנורת לד במנורה שדולקת $4$ שעות בכל יום, במשך שנה ($365$ ימים).

      א. כמה אנרגיה צורכת כל אחת מהנורות בשנה? ענו בקילוואט-שעה.

      ב. כמה אנרגיה חוסכים בשנה? ענו בקילוואט-שעה ובג'אול.

      ג. קילוואט-שעה עולה כ-$0.6$ שקל. כמה כסף חוסכים בשנה?
    answer: >-
      א. נורת הלד $13.1\,\text{kWh}$, נורת הלהט $87.6\,\text{kWh}$.

      ב. כ-$74.5\,\text{kWh}$, כלומר כ-$2.7\cdot10^{8}\,\text{J}$.

      ג. כ-$45$ שקלים.
    solution:
      - kind: given
        text: >-
          $P_1 = 9\,\text{W} = 0.009\,\text{kW}$, $P_2 = 60\,\text{W} = 0.06\,\text{kW}$. זמן ההדלקה בשנה: $t = 4\cdot365 = 1460\,\text{h}$.
      - kind: formula
        text: >-
          $E = Pt$, עם ההספק בקילוואט והזמן בשעות. $1\,\text{kWh} = 3.6\cdot10^6\,\text{J}$.
      - kind: substitution
        text: >-
          $E_1 = 0.009\cdot1460 = 13.14\,\text{kWh}$, $E_2 = 0.06\cdot1460 = 87.6\,\text{kWh}$.
      - kind: substitution
        text: >-
          החיסכון: $\Delta E = 87.6 - 13.14 = 74.46\,\text{kWh}$, ובג'אול $74.46\cdot3.6\cdot10^6 \approx 2.68\cdot10^{8}\,\text{J}$. בכסף: $74.46\cdot0.6 \approx 44.7$ שקלים.
      - kind: result
        text: >-
          א. $13.1\,\text{kWh}$ לנורת הלד ו-$87.6\,\text{kWh}$ לנורת הלהט.

          ב. כ-$74.5\,\text{kWh}$, כ-$2.7\cdot10^{8}\,\text{J}$.

          ג. כ-$45$ שקלים בשנה.

  - id: W-3.4-03
    level: basic
    qualitative: true
    objectives: [OBJ-3.4-2]
    prompt: >-
      על נורה $A$ כתוב $6\,\text{V}$, $6\,\text{W}$, ועל נורה $B$ כתוב $12\,\text{V}$, $6\,\text{W}$. הניחו ששתי הנורות ממירות לאור אותו חלק מההספק שהן מקבלות. קבעו ונמקו:

      א. כל נורה מחוברת לסוללה במתח הנקוב שלה. איזו מאירה חזק יותר? באיזו זורם זרם גדול יותר?

      ב. לאיזו נורה התנגדות גדולה יותר, ופי כמה?

      ג. מחברים את נורה $B$ לסוללה של $6\,\text{V}$. איזה חלק מההספק הנקוב שלה היא מקבלת? (הניחו שההתנגדות שלה קבועה.)
    answer: >-
      א. הן מאירות באותה מידה; ב-$A$ זרם כפול.

      ב. ל-$B$ התנגדות גדולה פי 4.

      ג. רבע: $1.5\,\text{W}$.
    solution:
      - kind: given
        text: >-
          לשתי הנורות אותו הספק נקוב, $6\,\text{W}$, אבל המתח הנקוב של $B$ כפול.
      - kind: formula
        text: >-
          $I = \dfrac{P}{V}$, $R = \dfrac{V^2}{P}$, ובמתח אחר $P = \dfrac{V^2}{R}$.
      - kind: reasoning
        text: >-
          א. במתח הנקוב כל נורה מקבלת את ההספק הנקוב שלה, $6\,\text{W}$, ושתיהן ממירות לאור אותו חלק ממנו: הן מאירות באותה מידה. הזרם $P/V$: באותו הספק ובחצי מתח, ב-$A$ זרם כפול ($1\,\text{A}$ מול $0.5\,\text{A}$).
      - kind: reasoning
        text: >-
          ב. באותו הספק, $R = V^2/P$ יחסית לריבוע המתח הנקוב. המתח של $B$ כפול, ולכן ההתנגדות שלה גדולה פי $2^2 = 4$: $R_A = 6\,\Omega$, $R_B = 24\,\Omega$.
      - kind: reasoning
        text: >-
          ג. ההתנגדות של $B$ קבועה, והמתח עליה חצי מהנקוב. לפי $P = V^2/R$, חצי מתח נותן רבע הספק: $\dfrac{6^2}{24} = 1.5\,\text{W}$.
      - kind: result
        text: >-
          א. אותה בהירות; ב-$A$ זרם כפול.

          ב. ל-$B$ התנגדות גדולה פי 4.

          ג. רבע מההספק הנקוב, $1.5\,\text{W}$.

  - id: W-3.4-04
    level: mid
    qualitative: false
    objectives: [OBJ-3.4-1, OBJ-3.4-2]
    prompt: >-
      על נגד כתוב $10\,\Omega$, $2.5\,\text{W}$. המספר השני הוא ההספק הגדול ביותר שהנגד יכול לקבל בלי להתחמם יותר מדי.

      א. מה המתח הגדול ביותר שמותר להפעיל עליו?

      ב. מה הזרם הגדול ביותר שמותר להעביר בו?

      ג. מחברים את הנגד ישירות לשני ההדקים של סוללה של $9\,\text{V}$. מה ההספק בנגד? מה יקרה לו?
    answer: >-
      א. $5\,\text{V}$.

      ב. $0.5\,\text{A}$.

      ג. $8.1\,\text{W}$, יותר מפי 3 מהמותר: הנגד יתחמם יותר מדי ועלול להישרף.
    solution:
      - kind: given
        text: >-
          $R = 10\,\Omega$, $P_{\max} = 2.5\,\text{W}$.
      - kind: formula
        text: >-
          $P = \dfrac{V^2}{R}$ ו-$P = I^2R$.
      - kind: manipulation
        text: >-
          א. מכפילים את שני האגפים של $P = V^2/R$ ב-$R$: $V^2 = PR$, ואז מוציאים שורש: $V = \sqrt{PR}$.

          ב. מחלקים את שני האגפים של $P = I^2R$ ב-$R$: $I^2 = P/R$, ואז $I = \sqrt{P/R}$.
      - kind: substitution
        text: >-
          $V_{\max} = \sqrt{2.5\cdot10} = \sqrt{25} = 5\,\text{V}$, $I_{\max} = \sqrt{2.5/10} = \sqrt{0.25} = 0.5\,\text{A}$. בדיקה: $V_{\max}I_{\max} = 5\cdot0.5 = 2.5\,\text{W}$.
      - kind: substitution
        text: >-
          ג. על $9\,\text{V}$: $P = \dfrac{9^2}{10} = 8.1\,\text{W}$, ו-$\dfrac{8.1}{2.5} \approx 3.2$.
      - kind: result
        text: >-
          א. $5\,\text{V}$.

          ב. $0.5\,\text{A}$.

          ג. $8.1\,\text{W}$, פי $3.2$ מהמותר: הנגד יתחמם יותר מדי ועלול להישרף.

  - id: W-3.4-05
    level: mid
    qualitative: false
    objectives: [OBJ-3.4-1, OBJ-3.4-3]
    prompt: >-
      משאבה חשמלית מחוברת לשקע של $230\,\text{V}$, וזורם בה זרם של $2.5\,\text{A}$. בכל שעה היא מעלה $9000$ ליטר מים מבור אל מכל שנמצא $12\,\text{m}$ מעל פני המים בבור. המסה של ליטר מים היא $1\,\text{kg}$, והמים זורמים לאט, כך שאפשר להזניח את האנרגיה הקינטית שלהם. ($g = 10\,\text{m/s}^2$)

      א. מה ההספק החשמלי של המשאבה?

      ב. מה ההספק המועיל שלה?

      ג. מה הנצילות שלה?

      ד. כמה אנרגיה הופכת לחום בכל שעה של פעולה?
    answer: >-
      א. $575\,\text{W}$.

      ב. $300\,\text{W}$.

      ג. כ-$52\%$.

      ד. כ-$9.9\cdot10^{5}\,\text{J}$.
    solution:
      - kind: given
        text: >-
          $V = 230\,\text{V}$, $I = 2.5\,\text{A}$. בזמן $t = 1\,\text{h} = 3600\,\text{s}$ עולה מסה $m = 9000\,\text{kg}$ לגובה $h = 12\,\text{m}$.
      - kind: formula
        text: >-
          $P_{\text{in}} = VI$. ההספק המועיל הוא קצב הגדלת האנרגיה הפוטנציאלית: $P_{\text{out}} = \dfrac{mgh}{t}$. הנצילות $\eta = \dfrac{P_{\text{out}}}{P_{\text{in}}}$.
      - kind: substitution
        text: >-
          $P_{\text{in}} = 230\cdot2.5 = 575\,\text{W}$, $P_{\text{out}} = \dfrac{9000\cdot10\cdot12}{3600} = \dfrac{1.08\cdot10^6}{3600} = 300\,\text{W}$.
      - kind: substitution
        text: >-
          $\eta = \dfrac{300}{575} \approx 0.52$. ההספק שהופך לחום: $575 - 300 = 275\,\text{W}$, ובשעה $275\cdot3600 = 9.9\cdot10^{5}\,\text{J}$.
      - kind: result
        text: >-
          א. $575\,\text{W}$.

          ב. $300\,\text{W}$.

          ג. $\eta \approx 52\%$.

          ד. כ-$9.9\cdot10^{5}\,\text{J}$ בשעה.

  - id: W-3.4-06
    level: mid
    qualitative: true
    objectives: [OBJ-3.4-2]
    prompt: >-
      תיירת מביאה מארצות הברית, שבה המתח בשקעים $115\,\text{V}$, קומקום שכתוב עליו $115\,\text{V}$, $1000\,\text{W}$, ומחברת אותו לשקע בישראל, $230\,\text{V}$. הניחו שההתנגדות של גוף החימום קבועה. קבעו ונמקו, בלי לחשב את ההתנגדות:

      א. פי כמה יגדל הזרם בקומקום, ופי כמה יגדל ההספק שלו? מה צפוי לקרות?

      ב. ולהפך: קומקום ישראלי של $230\,\text{V}$, $2000\,\text{W}$ מחובר לשקע בארצות הברית. מה ההספק שלו? אם מזניחים את החום שבורח לסביבה, פי כמה יותר זמן יידרש להרתיח באותו קומקום אותה כמות מים?
    answer: >-
      א. הזרם גדל פי 2 וההספק פי 4, ל-$4000\,\text{W}$: גוף החימום יתחמם יותר מדי וייהרס.

      ב. רבע מההספק הנקוב, $500\,\text{W}$; זמן ההרתחה גדל פי 4.
    solution:
      - kind: given
        text: >-
          ההתנגדות של כל קומקום קבועה, והמתח עליו משתנה פי 2: גדל ב-(א), קטן ב-(ב).
      - kind: formula
        text: >-
          $I = \dfrac{V}{R}$, $P = \dfrac{V^2}{R}$, $E = Pt$.
      - kind: reasoning
        text: >-
          א. באותה התנגדות, הזרם יחסי למתח: מתח כפול נותן זרם כפול. ההספק $P = VI$ הוא מכפלה של שניהם, ולכן גדל פי $2\cdot2 = 4$: $4\cdot1000 = 4000\,\text{W}$. גוף החימום מקבל פי 4 מההספק שתכננו לו, מתחמם יותר מדי וייהרס.
      - kind: reasoning
        text: >-
          ב. חצי מתח באותה התנגדות נותן רבע הספק: $\tfrac14\cdot2000 = 500\,\text{W}$. כדי להרתיח את המים צריך אותה אנרגיה $E$, ולפי $t = E/P$, הספק קטן פי 4 נותן זמן ארוך פי 4. (במציאות זה יהיה עוד יותר, כי בזמן ארוך יותר בורח יותר חום לסביבה.)
      - kind: result
        text: >-
          א. הזרם פי 2, ההספק פי 4 ($4000\,\text{W}$): הקומקום ייהרס.

          ב. $500\,\text{W}$, וזמן ההרתחה ארוך פי 4.

  - id: W-3.4-07
    level: mid
    qualitative: false
    objectives: [OBJ-3.4-2, OBJ-3.4-3]
    prompt: >-
      על קומקום כתוב $230\,\text{V}$, $2000\,\text{W}$. במתח הנקוב הוא מרתיח כמות מסוימת של מים ב-$4$ דקות. בשעת עומס המתח בשקע יורד ב-$10\%$, ל-$207\,\text{V}$. הניחו שההתנגדות של גוף החימום קבועה, ושכדי להרתיח את המים צריך אותה אנרגיה בשני המקרים (מזניחים את החום שבורח לסביבה).

      א. מה ההספק של הקומקום ב-$207\,\text{V}$? בכמה אחוזים הוא קטן?

      ב. כמה זמן יימשך עכשיו להרתיח את אותם מים?

      ג. האם בשעת עומס משלמים על ההרתחה פחות? נמקו.
    answer: >-
      א. $1620\,\text{W}$, ירידה של $19\%$.

      ב. כ-$296\,\text{s}$, כלומר כ-$4.9$ דקות.

      ג. לא: האנרגיה, $4.8\cdot10^{5}\,\text{J}$, היא אותה אנרגיה, ולכן גם התשלום.
    solution:
      - kind: given
        text: >-
          $V_0 = 230\,\text{V}$, $P_0 = 2000\,\text{W}$, $t_0 = 4\,\text{min} = 240\,\text{s}$, $V = 207\,\text{V} = 0.9\,V_0$.
      - kind: formula
        text: >-
          $R = \dfrac{V_0^2}{P_0}$, $P = \dfrac{V^2}{R}$, $E = Pt$.
      - kind: manipulation
        text: >-
          ההתנגדות קבועה, ולכן $\dfrac{P}{P_0} = \left(\dfrac{V}{V_0}\right)^2 = 0.9^2 = 0.81$. ירידה של $10\%$ במתח נותנת ירידה של $19\%$ בהספק.
      - kind: substitution
        text: >-
          $P = 0.81\cdot2000 = 1620\,\text{W}$. בדיקה דרך ההתנגדות: $R = \dfrac{230^2}{2000} = 26.45\,\Omega$, ו-$\dfrac{207^2}{26.45} = 1620\,\text{W}$.
      - kind: manipulation
        text: >-
          האנרגיה שווה: $P_0t_0 = Pt$. מחלקים את שני האגפים ב-$P$, כדי לבודד את הזמן: $t = \dfrac{P_0t_0}{P} = \dfrac{t_0}{0.81}$.
      - kind: substitution
        text: >-
          $t = \dfrac{240}{0.81} \approx 296\,\text{s} \approx 4.9\,\text{min}$. האנרגיה בשני המקרים: $E = 2000\cdot240 = 4.8\cdot10^{5}\,\text{J}$.
      - kind: result
        text: >-
          א. $1620\,\text{W}$, קטן ב-$19\%$.

          ב. כ-$296\,\text{s}$ (כ-$4.9$ דקות).

          ג. לא. משלמים על אנרגיה, וזו אותה אנרגיה; רק ההספק קטן, ולכן ההרתחה איטית יותר.

  - id: W-3.4-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-3.4-1, OBJ-3.4-2, OBJ-3.4-3]
    prompt: >-
      בתנור חימום יש שני גופי חימום. כל אחד מהם מחובר ישירות לשני ההדקים של השקע, $230\,\text{V}$, דרך מפסק משלו, כך שאפשר להדליק כל אחד לבד או את שניהם. על גוף חימום 1 כתוב $230\,\text{V}$, $800\,\text{W}$, ועל גוף חימום 2 כתוב $230\,\text{V}$, $1200\,\text{W}$.

      א. מה ההתנגדות של כל גוף חימום, ומה הזרם בו כשהוא דולק?

      ב. אילו שלוש דרגות חימום (הספקים) אפשר לקבל? נמקו את הדרגה שבה שניהם דולקים.

      ג. בחורף מפעילים את התנור בדרגה הגבוהה $3$ שעות בכל ערב, במשך $30$ ערבים. כמה קילוואט-שעה הוא צורך, וכמה זה עולה אם קילוואט-שעה עולה כ-$0.6$ שקל?

      ד. רוצים שהדרגה הגבוהה תהיה $2500\,\text{W}$. לשם כך מחליפים את גוף חימום 1 בגוף חימום אחר, ומשאירים את גוף חימום 2. מה צריכה להיות ההתנגדות של גוף החימום החדש, ומה יהיה הזרם בו?
    answer: >-
      א. גוף 1: כ-$66\,\Omega$ ו-$3.5\,\text{A}$; גוף 2: כ-$44\,\Omega$ ו-$5.2\,\text{A}$.

      ב. $800\,\text{W}$, $1200\,\text{W}$ ו-$2000\,\text{W}$.

      ג. $180\,\text{kWh}$, כ-$108$ שקלים.

      ד. כ-$41\,\Omega$, וזרם של כ-$5.7\,\text{A}$.
    solution:
      - kind: given
        text: >-
          שני גופי החימום מחוברים כל אחד ישירות לשקע, ולכן על כל אחד מהם המתח $230\,\text{V}$, הנקוב שלו, בין שהשני דולק ובין שלא. $P_1 = 800\,\text{W}$, $P_2 = 1200\,\text{W}$.
      - kind: formula
        text: >-
          $R = \dfrac{V^2}{P}$, $I = \dfrac{P}{V}$, $E = Pt$.
      - kind: substitution
        text: >-
          א. $R_1 = \dfrac{230^2}{800} = \dfrac{52900}{800} \approx 66.1\,\Omega$, $I_1 = \dfrac{800}{230} \approx 3.48\,\text{A}$. $R_2 = \dfrac{52900}{1200} \approx 44.1\,\Omega$, $I_2 = \dfrac{1200}{230} \approx 5.22\,\text{A}$.
      - kind: reasoning
        text: >-
          ב. כל גוף חימום מקבל את ההספק הנקוב שלו, כי המתח עליו הוא המתח הנקוב, ולא משנה אם השני דולק. כששניהם דולקים, בכל שנייה התנור מקבל את האנרגיה של שניהם: $800 + 1200 = 2000\,\text{W}$.
      - kind: substitution
        text: >-
          ג. $t = 3\cdot30 = 90\,\text{h}$, $E = 2\,\text{kW}\cdot90\,\text{h} = 180\,\text{kWh}$, והמחיר $180\cdot0.6 = 108$ שקלים.
      - kind: manipulation
        text: >-
          ד. גוף החימום החדש צריך לתת $P_{\text{new}} = 2500 - 1200 = 1300\,\text{W}$ על $230\,\text{V}$. לכן $R_{\text{new}} = \dfrac{230^2}{1300}$ ו-$I_{\text{new}} = \dfrac{1300}{230}$.
      - kind: substitution
        text: >-
          $R_{\text{new}} = \dfrac{52900}{1300} \approx 40.7\,\Omega$, $I_{\text{new}} \approx 5.65\,\text{A}$. ההתנגדות קטנה מזו של גוף 1, כי באותו מתח הספק גדול יותר דורש התנגדות קטנה יותר.
      - kind: result
        text: >-
          א. $R_1 \approx 66\,\Omega$, $I_1 \approx 3.5\,\text{A}$; $R_2 \approx 44\,\Omega$, $I_2 \approx 5.2\,\text{A}$.

          ב. $800\,\text{W}$, $1200\,\text{W}$, $2000\,\text{W}$.

          ג. $180\,\text{kWh}$, כ-$108$ שקלים.

          ד. $R \approx 41\,\Omega$, $I \approx 5.7\,\text{A}$.

  - id: W-3.4-09
    level: bagrut
    qualitative: true
    objectives: [OBJ-3.4-1, OBJ-3.4-2]
    prompt: >-
      על נורת להט כתוב $6\,\text{V}$, $3\,\text{W}$. תלמידים מדדו את ההתנגדות שלה כשהיא קרה, בטמפרטורת החדר, וקיבלו $1.3\,\Omega$.

      א. מה ההתנגדות של הנורה כשהיא דולקת במתח הנקוב? למה היא שונה כל כך מזו שמדדו?

      ב. מחברים את הנורה הקרה לסוללה של $6\,\text{V}$. מה הזרם וההספק ברגע הראשון, לפני שהחוט הספיק להתחמם? פי כמה זה גדול מההספק הנקוב?

      ג. קבעו ונמקו: למה נורות להט נשרפות בדרך כלל בדיוק ברגע ההדלקה, ולא אחרי שדלקו זמן מה? ומה קורה להספק בשבריר השנייה שאחרי ההדלקה?
    answer: >-
      א. $12\,\Omega$; חוט הלהט החם מתנגד הרבה יותר מהחוט הקר.

      ב. כ-$4.6\,\text{A}$ וכ-$28\,\text{W}$, פי 9 בערך מההספק הנקוב.

      ג. ברגע ההדלקה ההספק בחוט הקר גדול פי 9 בערך מהרגיל; ככל שהחוט מתחמם, ההתנגדות גדלה וההספק יורד עד $3\,\text{W}$.
    solution:
      - kind: given
        text: >-
          הנתונים הנקובים $V_0 = 6\,\text{V}$, $P_0 = 3\,\text{W}$. ההתנגדות הקרה $R_{\text{cold}} = 1.3\,\Omega$.
      - kind: formula
        text: >-
          $R = \dfrac{V_0^2}{P_0}$, $I = \dfrac{V}{R}$, $P = \dfrac{V^2}{R}$.
      - kind: substitution
        text: >-
          א. $R_{\text{hot}} = \dfrac{6^2}{3} = 12\,\Omega$, גדולה פי $\dfrac{12}{1.3} \approx 9$ מההתנגדות הקרה.
      - kind: reasoning
        text: >-
          הנתונים הנקובים מתארים את הנורה כשהיא דולקת, כשחוט הלהט חם מאוד. בשיעור 3.3 ראינו שההתנגדות של מתכת גדלה כשהיא מתחממת, כי היונים החמים רועדים חזק יותר והאלקטרונים מתנגשים בהם יותר. לכן ההתנגדות של החוט החם גדולה הרבה יותר.
      - kind: substitution
        text: >-
          ב. ברגע הראשון ההתנגדות עדיין $1.3\,\Omega$: $I = \dfrac{6}{1.3} \approx 4.6\,\text{A}$ (מול $0.5\,\text{A}$ כשהנורה דולקת), ו-$P = \dfrac{6^2}{1.3} = \dfrac{36}{1.3} \approx 28\,\text{W}$, פי $\dfrac{27.7}{3} \approx 9$ מההספק הנקוב.
      - kind: reasoning
        text: >-
          ג. ברגע ההדלקה המתח כבר מלא, אבל ההתנגדות עוד קטנה, ולכן ההספק בחוט גדול פי 9 בערך מזה שהוא בנוי לו. נקודה דקה בחוט, שכבר נשחקה, מתחממת שם הכי מהר ונשרפת. ככל שהחוט מתחמם ההתנגדות שלו גדלה, ולפי $P = V^2/R$ במתח קבוע ההספק יורד, עד שבחום של הדלקה רגילה ההתנגדות $12\,\Omega$ וההספק $3\,\text{W}$.
      - kind: result
        text: >-
          א. $12\,\Omega$, כי החוט הדולק חם מאוד, וההתנגדות גדלה עם הטמפרטורה.

          ב. $I \approx 4.6\,\text{A}$, $P \approx 28\,\text{W}$, פי 9 בערך.

          ג. ההספק הגדול ביותר הוא ברגע ההדלקה, כשהחוט קר; ההתנגדות גדלה עם החום, וההספק יורד עד $3\,\text{W}$.

  - id: W-3.4-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-3.4-1, OBJ-3.4-3]
    prompt: >-
      בסוללה של מכונית חשמלית אפשר לאגור עד $60\,\text{kWh}$. בבית מטעינים אותה ממטען שמחובר לשקע של $230\,\text{V}$ וזורם בו זרם של $16\,\text{A}$. $90\%$ מהאנרגיה שהמטען מקבל מהשקע נאגרים בסוללה, והשאר הופך לחום.

      א. מה ההספק שהמטען מקבל מהשקע, ומה ההספק שנאגר בסוללה?

      ב. כמה זמן נמשכת טעינה מ-$20\%$ עד $80\%$ מהקיבולת של הסוללה?

      ג. כמה אנרגיה נלקחת מהשקע בטעינה הזאת, כמה ממנה הופכת לחום, וכמה היא עולה אם קילוואט-שעה עולה כ-$0.6$ שקל?

      ד. בעמדת טעינה מהירה נכנסים לסוללה $50\,\text{kW}$. כמה זמן נמשכת שם אותה טעינה?

      ה. המכונית צורכת מהסוללה $15\,\text{kWh}$ לכל $100\,\text{km}$. כמה קילומטרים אפשר לנסוע עם האנרגיה שנטענה?
    answer: >-
      א. $3680\,\text{W}$ מהשקע, $3312\,\text{W}$ לסוללה.

      ב. כ-$10.9$ שעות.

      ג. $40\,\text{kWh}$ מהשקע, $4\,\text{kWh}$ מהם לחום, כ-$24$ שקלים.

      ד. כ-$43$ דקות.

      ה. $240\,\text{km}$.
    solution:
      - kind: given
        text: >-
          $V = 230\,\text{V}$, $I = 16\,\text{A}$, $\eta = 0.9$. האנרגיה שצריך להכניס לסוללה: $E_{\text{bat}} = (0.8 - 0.2)\cdot60 = 36\,\text{kWh}$.
      - kind: formula
        text: >-
          $P_{\text{in}} = VI$, $\eta = \dfrac{P_{\text{out}}}{P_{\text{in}}}$, $E = Pt$.
      - kind: substitution
        text: >-
          א. $P_{\text{in}} = 230\cdot16 = 3680\,\text{W}$, $P_{\text{bat}} = 0.9\cdot3680 = 3312\,\text{W} = 3.312\,\text{kW}$.
      - kind: manipulation
        text: >-
          ב. מ-$E_{\text{bat}} = P_{\text{bat}}\,t$ מחלקים את שני האגפים ב-$P_{\text{bat}}$: $t = \dfrac{E_{\text{bat}}}{P_{\text{bat}}}$. זה ההספק **שנכנס לסוללה**, כי השאלה היא כמה זמן לוקח למלא אותה.
      - kind: substitution
        text: >-
          $t = \dfrac{36\,\text{kWh}}{3.312\,\text{kW}} \approx 10.9\,\text{h}$.
      - kind: substitution
        text: >-
          ג. מהשקע: $E_{\text{in}} = \dfrac{E_{\text{bat}}}{\eta} = \dfrac{36}{0.9} = 40\,\text{kWh}$ (בדיקה: $3.68\,\text{kW}\cdot10.87\,\text{h} \approx 40\,\text{kWh}$). לחום: $40 - 36 = 4\,\text{kWh}$. המחיר: $40\cdot0.6 = 24$ שקלים, כי משלמים על מה שנלקח מהשקע.
      - kind: substitution
        text: >-
          ד. $t = \dfrac{36\,\text{kWh}}{50\,\text{kW}} = 0.72\,\text{h} = 0.72\cdot60 \approx 43\,\text{min}$.
      - kind: substitution
        text: >-
          ה. $\dfrac{36}{15}\cdot100 = 2.4\cdot100 = 240\,\text{km}$.
      - kind: result
        text: >-
          א. $3680\,\text{W}$ מהשקע, $3312\,\text{W}$ לסוללה.

          ב. כ-$10.9$ שעות.

          ג. $40\,\text{kWh}$, מהם $4\,\text{kWh}$ לחום; כ-$24$ שקלים.

          ד. כ-$43$ דקות.

          ה. $240\,\text{km}$.

challenge:
  - id: W-3.4-c1
    stars: 1
    objectives: [OBJ-3.4-3]
    prompt: >-
      בתחנת כוח הידרואלקטרית ליד סכר, ההפרש בין גובה המים מעל הסכר לגובה המים מתחתיו הוא $61\,\text{m}$. בשיא, עוברים דרך הטורבינות $3380\,\text{m}^3$ מים בכל שנייה. הצפיפות של מים $1000\,\text{kg/m}^3$, ו-$g = 10\,\text{m/s}^2$. הניחו שהמים מעל הסכר כמעט עומדים.

      א. מה ההספק הגדול ביותר שאפשר לקבל מהמים, אם כל האנרגיה הפוטנציאלית שלהם עוברת לטורבינות?

      ב. במציאות המים יוצאים מתחתית הסכר במהירות $8\,\text{m/s}$, ולכן לא כל האנרגיה הפוטנציאלית עוברת לטורבינות. מה הנצילות של העברת האנרגיה מהמים לטורבינות?

      ג. הגנרטורים ממירים לאנרגיה חשמלית $90\%$ מהאנרגיה שהטורבינות מקבלות. מה ההספק החשמלי של התחנה, מה הנצילות הכוללת שלה, וכמה קילוואט-שעה היא מייצרת ביממה של עבודה בשיא?
    answer: >-
      א. כ-$2.1\cdot10^{9}\,\text{W}$.

      ב. כ-$95\%$.

      ג. כ-$1.76\cdot10^{9}\,\text{W}$, נצילות כוללת של כ-$85\%$, וכ-$4.2\cdot10^{7}\,\text{kWh}$ ביממה.
    solution:
      - kind: given
        text: >-
          $h = 61\,\text{m}$. בכל שנייה עוברת מסה $m = 1000\cdot3380 = 3.38\cdot10^{6}\,\text{kg}$. מהירות היציאה $v = 8\,\text{m/s}$.
      - kind: formula
        text: >-
          ההספק הוא אנרגיה בשנייה: $P = \dfrac{mgh}{t}$. האנרגיה הקינטית שהמים לוקחים איתם בשנייה: $\dfrac{\tfrac12 mv^2}{t}$. נצילות: $\eta = \dfrac{P_{\text{out}}}{P_{\text{in}}}$.
      - kind: substitution
        text: >-
          א. בשנייה אחת: $P_{\max} = 3.38\cdot10^{6}\cdot10\cdot61 \approx 2.06\cdot10^{9}\,\text{W}$.
      - kind: reasoning
        text: >-
          ב. מהאנרגיה הפוטנציאלית של המים, החלק שלא עבר לטורבינות הוא האנרגיה הקינטית שנשארה במים שיוצאים. בכל שנייה: $\tfrac12\cdot3.38\cdot10^{6}\cdot8^2 \approx 1.08\cdot10^{8}\,\text{W}$. אפשר גם לחשב לכל קילוגרם מים: האנרגיה הפוטנציאלית $gh = 610\,\text{J}$, והקינטית שנשארת $\tfrac12v^2 = 32\,\text{J}$.
      - kind: substitution
        text: >-
          $\eta_1 = \dfrac{610 - 32}{610} = \dfrac{578}{610} \approx 0.95$. ההספק שעובר לטורבינות: $2.06\cdot10^{9} - 1.08\cdot10^{8} \approx 1.95\cdot10^{9}\,\text{W}$.
      - kind: substitution
        text: >-
          ג. $P_{\text{el}} = 0.9\cdot1.95\cdot10^{9} \approx 1.76\cdot10^{9}\,\text{W}$. הנצילות הכוללת היא מכפלת שתי הנצילויות: $0.9\cdot0.948 \approx 0.85$. ביממה: $E = 1.76\cdot10^{6}\,\text{kW}\cdot24\,\text{h} \approx 4.2\cdot10^{7}\,\text{kWh}$.
      - kind: result
        text: >-
          א. $P_{\max} \approx 2.1\cdot10^{9}\,\text{W}$.

          ב. $\eta \approx 95\%$.

          ג. $P_{\text{el}} \approx 1.76\cdot10^{9}\,\text{W}$, נצילות כוללת של כ-$85\%$, וכ-$4.2\cdot10^{7}\,\text{kWh}$ ביממה.
    source:
      name: British Physics Olympiad (BPhO), Round 1
      year: 2019
      problem: 'Round 1, 15 November 2019, Section 2, Question 2(a) and (b)'
      url: https://www.bpho.org.uk/Papers/R1/2019Nov_R1_S2.pdf
      verified: '2026-11-02'
      adapted: true

  - id: W-3.4-c2
    stars: 2
    objectives: [OBJ-3.4-1]
    prompt: >-
      נתיך הוא תיל דק שמחברים בטור במעגל: כשהזרם גדול מדי, התיל מתחמם עד שהוא נמס, וכך המעגל נפתח. נתיך הוא תיל באורך $L$ וברדיוס $r$, קטן הרבה מ-$L$, עשוי מחומר שההתנגדות הסגולית שלו $\rho$, ועובר בו זרם $I$.

      גוף חם מקרין אנרגיה. נניח שכל מטר רבוע של פני התיל מקרין הספק $\sigma T^4$, כאשר $T$ היא הטמפרטורה המוחלטת שלו, בקלווין, ו-$\sigma = 5.67\cdot10^{-8}\,\text{W/(m}^2\cdot\text{K}^4)$. הזניחו כל דרך אחרת שבה התיל מאבד חום או מקבל חום מהסביבה, ואת השטח של שני הקצוות שלו.

      א. כתבו ביטוי להספק החשמלי בנתיך, בעזרת $I$, $\rho$, $L$ ו-$r$.

      ב. אחרי זמן קצר הטמפרטורה של התיל מתייצבת. מצאו ביטוי ל-$T^4$ בעזרת $I$, $\rho$, $r$ ו-$\sigma$, והראו שהטמפרטורה לא תלויה באורך הנתיך.

      ג. רוצים נתיך שיימס בזרם של $5\,\text{A}$. החומר נמס ב-$500\,\text{K}$ (כ-$227$ מעלות צלזיוס), וההתנגדות הסגולית שלו $1.2\cdot10^{-7}\,\Omega\cdot\text{m}$. מה צריך להיות הרדיוס של התיל?

      ד. מה משתנה אם לוקחים תיל מאותו חומר שהרדיוס שלו כפול? באיזה זרם הוא יימס? ולנתיך מ-(ג) שאורכו $2\,\text{cm}$: מה המתח עליו וההספק בו ברגע שהוא נמס?
    answer: >-
      א. $P = \dfrac{I^2\rho L}{\pi r^2}$.

      ב. $T^4 = \dfrac{I^2\rho}{2\pi^2\sigma r^3}$, בלי $L$.

      ג. $r \approx 0.35\,\text{mm}$.

      ד. בזרם גדול פי $2\sqrt2$, כ-$14\,\text{A}$. לנתיך של $2\,\text{cm}$: כ-$0.031\,\text{V}$ וכ-$0.16\,\text{W}$.
    solution:
      - kind: given
        text: >-
          תיל באורך $L$, ברדיוס $r$, בהתנגדות סגולית $\rho$, ובו זרם $I$. כל מטר רבוע של פני התיל מקרין $\sigma T^4$.
      - kind: formula
        text: >-
          $R = \rho\dfrac{L}{A}$ עם $A = \pi r^2$ (שיעור 3.3), $P = I^2R$. השטח של פני התיל, בלי הקצוות, הוא ההיקף כפול האורך: $2\pi rL$.
      - kind: substitution
        text: >-
          א. $R = \dfrac{\rho L}{\pi r^2}$, ולכן $P = I^2R = \dfrac{I^2\rho L}{\pi r^2}$. נוח כאן $P = I^2R$, כי הזרם נתון: הנתיך מחובר בטור, והזרם במעגל עובר כולו דרכו.
      - kind: reasoning
        text: >-
          ב. כשהטמפרטורה מתייצבת, האנרגיה שהתיל מקבל בכל שנייה שווה לאנרגיה שהוא מקרין בכל שנייה; אחרת הוא היה ממשיך להתחמם או להתקרר. ההספק המוקרן הוא $\sigma T^4$ כפול השטח: $\sigma T^4\cdot2\pi rL$.
      - kind: manipulation
        text: >-
          $\sigma T^4\cdot2\pi rL = \dfrac{I^2\rho L}{\pi r^2}$. האורך $L$ מופיע בשני האגפים, ומצמצמים אותו: גם ההספק החשמלי וגם השטח המקרין יחסיים לאורך. מחלקים את שני האגפים ב-$2\pi\sigma r$: $T^4 = \dfrac{I^2\rho}{2\pi^2\sigma r^3}$.
      - kind: manipulation
        text: >-
          ג. מבודדים את $r^3$: כופלים את שני האגפים ב-$r^3$ ומחלקים ב-$T^4$, ומקבלים $r^3 = \dfrac{I^2\rho}{2\pi^2\sigma T^4}$, ולכן $r = \sqrt[3]{\dfrac{I^2\rho}{2\pi^2\sigma T^4}}$.
      - kind: substitution
        text: >-
          $\sigma T^4 = 5.67\cdot10^{-8}\cdot500^4 \approx 3.54\cdot10^{3}\,\text{W/m}^2$, ו-$r^3 = \dfrac{25\cdot1.2\cdot10^{-7}}{2\pi^2\cdot3.54\cdot10^{3}} \approx 4.29\cdot10^{-11}\,\text{m}^3$, ולכן $r \approx 3.5\cdot10^{-4}\,\text{m} = 0.35\,\text{mm}$.
      - kind: reasoning
        text: >-
          ד. באותו חומר ובאותה טמפרטורת התכה, מ-(ב): $I^2 = 2\pi^2\sigma T^4 r^3/\rho$, כלומר $I^2$ יחסי ל-$r^3$, ו-$I$ יחסי ל-$r^{3/2}$. רדיוס כפול נותן זרם גדול פי $2^{3/2} = 2\sqrt2 \approx 2.83$: כ-$14\,\text{A}$. ההתנגדות קטנה פי 4, אבל השטח המקרין גדל רק פי 2, ולכן הזרם צריך לגדול יותר מפי 2.
      - kind: substitution
        text: >-
          לנתיך של $L = 0.02\,\text{m}$: $R = \dfrac{1.2\cdot10^{-7}\cdot0.02}{\pi\cdot(3.5\cdot10^{-4})^2} \approx 6.2\cdot10^{-3}\,\Omega$. ב-$5\,\text{A}$: $V = IR \approx 0.031\,\text{V}$ ו-$P = I^2R \approx 0.16\,\text{W}$. הנתיך כמעט לא משפיע על שאר המעגל.
      - kind: result
        text: >-
          א. $P = \dfrac{I^2\rho L}{\pi r^2}$.

          ב. $T^4 = \dfrac{I^2\rho}{2\pi^2\sigma r^3}$, בלי תלות ב-$L$.

          ג. $r \approx 0.35\,\text{mm}$.

          ד. כ-$14\,\text{A}$ (פי $2\sqrt2$). לנתיך של $2\,\text{cm}$ ב-$5\,\text{A}$: $V \approx 0.031\,\text{V}$, $P \approx 0.16\,\text{W}$.
    source:
      name: USA Physics Olympiad (USAPhO), Semifinal Exam
      year: 2010
      problem: 'Part B, Question B2, part c (on the fuse wire of part b)'
      url: https://www.aapt.org/physicsteam/2019/upload/USAPhO-2010-Solutions.pdf
      verified: '2026-11-02'
      adapted: true
