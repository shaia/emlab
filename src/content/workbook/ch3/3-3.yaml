# Workbook, lesson 3.3 (resistance and Ohm's law). Format and rules: see .claude/CLAUDE.md, "Worked examples, workbook".
# Every number was recomputed with src/physics/circuits.ts (RESISTIVITY, wireResistance, roundArea, filamentBulb for the
# 3 W, 6 V bulb of figure 3.3א, driftSpeed and COPPER_N) and constants.ts (G = 10, E_CHARGE).
# In a >- block, consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '3.3'
practice:
  - id: W-3.3-01
    level: basic
    qualitative: false
    objectives: [OBJ-3.3-1]
    prompt: >-
      על נגד של $2.2\,\text{k}\Omega$ יש מתח של $9.0\,\text{V}$. מה הזרם בנגד? ענו במיליאמפר.
    answer: '$4.1\,\text{mA}$'
    solution:
      - kind: given
        text: >-
          $R = 2.2\,\text{k}\Omega = 2.2\cdot10^{3}\,\Omega = 2200\,\Omega$, $V = 9.0\,\text{V}$.
      - kind: formula
        text: >-
          $R = \dfrac{V}{I}$. כופלים את שני האגפים ב-$I$ ומחלקים ב-$R$, ומקבלים $I = \dfrac{V}{R}$.
      - kind: substitution
        text: >-
          $I = \dfrac{9.0\,\text{V}}{2200\,\Omega} = 4.09\cdot10^{-3}\,\text{A}$. כדי לעבור למיליאמפר כופלים ב-$10^{3}$, כי $1\,\text{A} = 10^{3}\,\text{mA}$.
      - kind: result
        text: >-
          $I \approx 4.1\,\text{mA}$.

  - id: W-3.3-02
    level: basic
    qualitative: true
    objectives: [OBJ-3.3-2, OBJ-3.3-1]
    prompt: >-
      על אותה מערכת צירים משורטטים האופיינים של שני נגדים, A ו-B: הזרם (ציר אנכי) כפונקציה של המתח (ציר אופקי). שני האופיינים הם קווים ישרים שעוברים בראשית, והקו של A תלול יותר מהקו של B.

      א. האם שני הנגדים אוהמיים? נמקו.

      ב. לאיזה נגד התנגדות גדולה יותר? נמקו.
    answer: >-
      א. כן: כל אופיין הוא קו ישר דרך הראשית.

      ב. ל-B, שהקו שלו שטוח יותר.
    solution:
      - kind: reasoning
        text: >-
          א. קו ישר שעובר בראשית אומר שהזרם ביחס ישר למתח: מתח כפול נותן זרם כפול. לכן היחס $V/I$ קבוע לאורך כל קו, ושני הנגדים אוהמיים.
      - kind: reasoning
        text: >-
          ב. בגרף של זרם כפונקציה של מתח, השיפוע של קו מהראשית הוא $\dfrac{I}{V}$, כלומר $\dfrac{1}{R}$. קו תלול אומר שבאותו מתח עובר זרם גדול, כלומר התנגדות קטנה. הקו של B שטוח יותר: באותו מתח עובר בו זרם קטן יותר, ולכן ההתנגדות שלו גדולה יותר.
      - kind: result
        text: >-
          א. שני הנגדים אוהמיים.

          ב. ל-B התנגדות גדולה יותר. המלכודת: בגרף כזה קו תלול הוא התנגדות **קטנה**, כי השיפוע הוא $1/R$ ולא $R$.

  - id: W-3.3-03
    level: basic
    qualitative: false
    objectives: [OBJ-3.3-3]
    prompt: >-
      רוצים לבנות נגד של $10\,\Omega$ מתיל קונסטנטן, שההתנגדות הסגולית שלו $\rho = 4.9\cdot10^{-7}\,\Omega\cdot\text{m}$, ושטח החתך שלו $0.20\,\text{mm}^2$. באיזה אורך תיל צריך להשתמש?
    answer: '$4.1\,\text{m}$ בערך'
    solution:
      - kind: given
        text: >-
          $R = 10\,\Omega$, $\rho = 4.9\cdot10^{-7}\,\Omega\cdot\text{m}$, $A = 0.20\,\text{mm}^2 = 0.20\cdot10^{-6}\,\text{m}^2$, כי $1\,\text{mm}^2 = (10^{-3}\,\text{m})^2 = 10^{-6}\,\text{m}^2$.
      - kind: formula
        text: >-
          $R = \rho\,\dfrac{L}{A}$
      - kind: manipulation
        text: >-
          מבודדים את $L$: כופלים את שני האגפים ב-$A$, ומקבלים $RA = \rho L$. עכשיו מחלקים ב-$\rho$: $L = \dfrac{RA}{\rho}$.
      - kind: substitution
        text: >-
          $$L = \frac{10\,\Omega\cdot0.20\cdot10^{-6}\,\text{m}^2}{4.9\cdot10^{-7}\,\Omega\cdot\text{m}} \approx 4.08\,\text{m}$$
      - kind: result
        text: >-
          צריך תיל באורך $4.1\,\text{m}$ בערך. (לכן בנגדים מלפפים את התיל.)

  - id: W-3.3-04
    level: mid
    qualitative: false
    objectives: [OBJ-3.3-1]
    prompt: >-
      במתח של $6.0\,\text{V}$ עובר בנגד אוהמי זרם של $0.25\,\text{A}$. מגדילים את המתח ב-$3.0\,\text{V}$.

      א. מה ההתנגדות של הנגד?

      ב. בכמה גדל הזרם?
    answer: >-
      א. $24\,\Omega$.

      ב. ב-$0.125\,\text{A}$ (מ-$0.25\,\text{A}$ ל-$0.375\,\text{A}$).
    solution:
      - kind: given
        text: >-
          $V_1 = 6.0\,\text{V}$, $I_1 = 0.25\,\text{A}$, והמתח החדש $V_2 = 6.0 + 3.0 = 9.0\,\text{V}$. הנגד אוהמי, ולכן ההתנגדות שלו לא משתנה כשהמתח משתנה.
      - kind: formula
        text: >-
          $R = \dfrac{V}{I}$, ומכאן $I = \dfrac{V}{R}$.
      - kind: substitution
        text: >-
          א. $R = \dfrac{6.0\,\text{V}}{0.25\,\text{A}} = 24\,\Omega$.

          ב. $I_2 = \dfrac{9.0\,\text{V}}{24\,\Omega} = 0.375\,\text{A}$, והגידול $I_2 - I_1 = 0.375 - 0.25 = 0.125\,\text{A}$.
      - kind: reasoning
        text: >-
          דרך קצרה יותר: ברכיב אוהמי גם תוספת המתח ותוספת הזרם נמצאות ביחס $R$, ולכן תוספת הזרם היא $\dfrac{3.0\,\text{V}}{24\,\Omega} = 0.125\,\text{A}$. (זה נכון רק ברכיב אוהמי.)
      - kind: result
        text: >-
          א. $R = 24\,\Omega$.

          ב. הזרם גדל ב-$0.125\,\text{A}$, ל-$0.375\,\text{A}$.

  - id: W-3.3-05
    level: mid
    qualitative: true
    objectives: [OBJ-3.3-2]
    prompt: >-
      על נורת להט כתוב שבמתח $6.0\,\text{V}$ עובר בה זרם של $0.50\,\text{A}$. תלמיד מודד את הנורה כשהיא קרה: הוא מחבר אליה מתח קטן מאוד, $0.050\,\text{V}$, שבו החוט מתחמם רק מעט, ומודד זרם של $27\,\text{mA}$.

      א. מה ההתנגדות של הנורה הקרה, ומה ההתנגדות שלה ב-$6.0\,\text{V}$?

      ב. התלמיד מסיק: "במתח $6.0\,\text{V}$ יעבור בנורה זרם של $6.0/1.85 \approx 3.2\,\text{A}$." קבעו ונמקו מה הטעות שלו.

      ג. נורות להט נשרפות לרוב ברגע ההדלקה, ולא אחרי שהן דולקות זמן מה. הסבירו למה.
    answer: >-
      א. כ-$1.9\,\Omega$ קרה, ו-$12\,\Omega$ ב-$6.0\,\text{V}$.

      ב. הנורה לא אוהמית: כשהיא מתחממת ההתנגדות שלה גדלה פי $6.5$ בערך, והזרם ב-$6.0\,\text{V}$ הוא רק $0.50\,\text{A}$.

      ג. ברגע ההדלקה החוט עוד קר, ההתנגדות שלו קטנה, ולרגע עובר בו זרם גדול בהרבה מהזרם הרגיל.
    solution:
      - kind: given
        text: >-
          במצב קר: $V = 0.050\,\text{V}$, $I = 27\,\text{mA} = 0.027\,\text{A}$. במצב חם: $V = 6.0\,\text{V}$, $I = 0.50\,\text{A}$.
      - kind: substitution
        text: >-
          א. $R_{\text{cold}} = \dfrac{0.050\,\text{V}}{0.027\,\text{A}} \approx 1.85\,\Omega$, ו-$R_{\text{hot}} = \dfrac{6.0\,\text{V}}{0.50\,\text{A}} = 12\,\Omega$. ההתנגדות החמה גדולה פי $\dfrac{12}{1.85} \approx 6.5$.
      - kind: reasoning
        text: >-
          ב. התלמיד הניח שההתנגדות קבועה, כלומר שהנורה אוהמית. אבל כשהזרם גדל, חוט הלהט מתחמם עד אלפי מעלות, האלקטרונים מתנגשים יותר ביונים הרוטטים, וההתנגדות גדלה. $R = V/I$ נכון בכל נקודה, אבל צריך את $R$ **של אותה נקודה**: ב-$6.0\,\text{V}$ זו $12\,\Omega$, ולא $1.85\,\Omega$.
      - kind: reasoning
        text: >-
          ג. ברגע ההדלקה כל המתח כבר על החוט, אבל החוט עוד קר, וההתנגדות שלו קטנה: כ-$1.9\,\Omega$, ובטמפרטורת החדר אף פחות. לכן לרגע קצר עובר בו זרם גדול פי כמה מהזרם הרגיל, עד שהוא מתחמם. החוט מתחמם בבת אחת, ואם יש בו נקודה דקה ושחוקה, היא נשרפת דווקא אז.
      - kind: result
        text: >-
          א. כ-$1.9\,\Omega$ קרה, ו-$12\,\Omega$ ב-$6.0\,\text{V}$.

          ב. הנורה לא אוהמית: ב-$6.0\,\text{V}$ החוט חם וההתנגדות שלו $12\,\Omega$, ולכן הזרם רק $0.50\,\text{A}$.

          ג. ברגע ההדלקה החוט קר וההתנגדות שלו קטנה, ולכן לרגע עובר בו זרם גדול מהרגיל.

  - id: W-3.3-06
    level: mid
    qualitative: false
    objectives: [OBJ-3.3-3, OBJ-3.3-1]
    prompt: >-
      שני תילים מאותו חומר. תיל B ארוך פי 3 מתיל A, והקוטר שלו גדול פי 2.

      א. מה היחס $R_B/R_A$?

      ב. מחברים כל תיל בנפרד לאותו ספק מתח. באיזה תיל הזרם גדול יותר, ופי כמה?
    answer: >-
      א. $R_B/R_A = 3/4 = 0.75$.

      ב. בתיל B, פי $4/3 \approx 1.33$.
    solution:
      - kind: given
        text: >-
          אותו חומר, ולכן אותה $\rho$. $L_B = 3L_A$ ו-$d_B = 2d_A$.
      - kind: formula
        text: >-
          $R = \rho\,\dfrac{L}{A}$, ולתיל עגול $A = \dfrac{\pi d^2}{4}$.
      - kind: manipulation
        text: >-
          א. קוטר כפול נותן שטח חתך פי $2^2 = 4$: $A_B = 4A_A$. כשמחלקים את ההתנגדויות זו בזו, $\rho$ מצטמצם:
          $$\frac{R_B}{R_A} = \frac{L_B}{L_A}\cdot\frac{A_A}{A_B} = 3\cdot\frac{1}{4} = \frac{3}{4}$$
      - kind: reasoning
        text: >-
          ב. באותו מתח $I = V/R$, ולכן הזרם ביחס הפוך להתנגדות: $\dfrac{I_B}{I_A} = \dfrac{R_A}{R_B} = \dfrac{4}{3}$. לתיל B התנגדות קטנה יותר, אף שהוא ארוך יותר, כי העובי שלו מנצח: האורך הגדיל את ההתנגדות פי 3, ושטח החתך הקטין אותה פי 4.
      - kind: result
        text: >-
          א. $R_B/R_A = 0.75$.

          ב. הזרם גדול יותר בתיל B, פי $4/3 \approx 1.33$.

  - id: W-3.3-07
    level: mid
    qualitative: true
    objectives: [OBJ-3.3-3]
    prompt: >-
      בניסוי מודדים את ההתנגדות של שני תילי קונסטנטן כפונקציה של האורך שלהם, ומשרטטים גרף של ההתנגדות (ציר אנכי) כפונקציה של האורך (ציר אופקי). לכל תיל מתקבל קו ישר דרך הראשית. הקו של תיל 1 עובר בנקודה $(2.0\,\text{m},\ 4.9\,\Omega)$, והקו של תיל 2 בנקודה $(4.0\,\text{m},\ 2.45\,\Omega)$.

      א. מה מייצג השיפוע של כל קו?

      ב. קבעו ונמקו: איזה תיל דק יותר, ופי כמה הקוטר שלו קטן יותר? אין צורך בערך של $\rho$.
    answer: >-
      א. השיפוע הוא $\rho/A$: ההתנגדות של מטר אחד מהתיל.

      ב. תיל 1 דק יותר: שטח החתך שלו קטן פי 4, והקוטר שלו קטן פי 2.
    solution:
      - kind: reasoning
        text: >-
          א. לפי $R = \rho\,\dfrac{L}{A} = \dfrac{\rho}{A}\cdot L$, ההתנגדות ביחס ישר לאורך, והשיפוע של הקו הוא $\dfrac{\rho}{A}$: ההתנגדות של כל מטר מהתיל.
      - kind: substitution
        text: >-
          ב. השיפועים: לתיל 1 $\dfrac{4.9\,\Omega}{2.0\,\text{m}} = 2.45\,\Omega/\text{m}$, ולתיל 2 $\dfrac{2.45\,\Omega}{4.0\,\text{m}} \approx 0.61\,\Omega/\text{m}$. תיל 1 מתנגד פי $\dfrac{2.45}{0.6125} = 4$ יותר לכל מטר.
      - kind: reasoning
        text: >-
          שני התילים מקונסטנטן, ולכן $\rho$ שווה, והשיפוע ביחס הפוך לשטח החתך. שיפוע גדול פי 4 אומר שטח חתך קטן פי 4. שטח החתך ביחס לריבוע הקוטר, $A = \pi d^2/4$, ולכן הקוטר קטן פי $\sqrt{4} = 2$.
      - kind: result
        text: >-
          א. השיפוע הוא $\rho/A$, ההתנגדות של מטר אחד מהתיל.

          ב. תיל 1 דק יותר: שטח החתך שלו קטן פי 4, והקוטר שלו קטן פי 2.

  - id: W-3.3-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-3.3-2, OBJ-3.3-1]
    prompt: >-
      נורת להט ונגד אוהמי של $12\,\Omega$. במתח $6.0\,\text{V}$ עובר בנורה זרם של $0.50\,\text{A}$, ובמתח $3.0\,\text{V}$ זרם של $0.33\,\text{A}$.

      א. מה ההתנגדות של הנורה במתח $6.0\,\text{V}$? השוו אותה להתנגדות של הנגד.

      ב. מחברים כל אחד מהם, בנפרד, למתח של $3.0\,\text{V}$. באיזה מהם עובר זרם גדול יותר? חשבו את שני הזרמים.

      ג. האופיינים של שני הרכיבים משורטטים על אותה מערכת צירים, זרם כפונקציה של מתח. בין $0$ ל-$6.0\,\text{V}$, איזה אופיין נמצא מעל השני? באיזה מתח הם נפגשים, מלבד הראשית? נמקו.
    answer: >-
      א. $12\,\Omega$, בדיוק כמו הנגד.

      ב. בנורה: $0.33\,\text{A}$, לעומת $0.25\,\text{A}$ בנגד.

      ג. האופיין של הנורה מעל זה של הנגד, והם נפגשים ב-$6.0\,\text{V}$.
    solution:
      - kind: given
        text: >-
          נגד: $R = 12\,\Omega$ בכל מתח. נורה: $(6.0\,\text{V},\ 0.50\,\text{A})$ ו-$(3.0\,\text{V},\ 0.33\,\text{A})$.
      - kind: substitution
        text: >-
          א. $R_{\text{bulb}} = \dfrac{6.0\,\text{V}}{0.50\,\text{A}} = 12\,\Omega$, שווה להתנגדות של הנגד.
      - kind: substitution
        text: >-
          ב. בנגד $I = \dfrac{3.0\,\text{V}}{12\,\Omega} = 0.25\,\text{A}$. בנורה הזרם נתון, $0.33\,\text{A}$: ההתנגדות שלה ב-$3.0\,\text{V}$ היא $\dfrac{3.0}{0.33} \approx 9.1\,\Omega$ בלבד, כי החוט חם פחות מאשר ב-$6.0\,\text{V}$.
      - kind: reasoning
        text: >-
          ג. ההתנגדות של הנורה גדלה עם המתח, ועד $6.0\,\text{V}$ היא קטנה מ-$12\,\Omega$. התנגדות קטנה יותר אומרת שבאותו מתח עובר זרם גדול יותר, ולכן מתחת ל-$6.0\,\text{V}$ האופיין של הנורה מעל זה של הנגד. ב-$6.0\,\text{V}$ ההתנגדויות שוות, ולכן גם הזרמים: שם האופיינים נפגשים. זו נקודת המפגש היחידה, כי ההתנגדות של הנורה עוברת את $12\,\Omega$ רק פעם אחת, כשהיא ממשיכה לגדול.
      - kind: result
        text: >-
          א. $12\,\Omega$, כמו הנגד.

          ב. בנורה עובר זרם גדול יותר: $0.33\,\text{A}$, לעומת $0.25\,\text{A}$ בנגד.

          ג. מתחת ל-$6.0\,\text{V}$ האופיין של הנורה מעל זה של הנגד, והם נפגשים ב-$6.0\,\text{V}$.

  - id: W-3.3-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-3.3-3, OBJ-3.3-1]
    prompt: >-
      תיל נחושת באורך $2.0\,\text{m}$ ובקוטר $1.0$ מילימטר מחובר למתח של $0.10\,\text{V}$. ההתנגדות הסגולית של נחושת $\rho = 1.7\cdot10^{-8}\,\Omega\cdot\text{m}$, ובכל מטר מעוקב של נחושת יש $n = 8.5\cdot10^{28}$ אלקטרונים חופשיים.

      א. מה ההתנגדות של התיל, ומה הזרם בו?

      ב. מה מהירות הסחיפה של האלקטרונים?

      ג. מה משתנה אם מחליפים את התיל בתיל נחושת באותו אורך, אבל בקוטר כפול, ומחברים אותו לאותו מתח? מה קורה להתנגדות, לזרם ולמהירות הסחיפה?
    answer: >-
      א. $R \approx 0.043\,\Omega$, $I \approx 2.3\,\text{A}$.

      ב. $v \approx 2.2\cdot10^{-4}\,\text{m/s}$.

      ג. ההתנגדות קטנה פי 4, הזרם גדל פי 4, ומהירות הסחיפה לא משתנה.
    solution:
      - kind: given
        text: >-
          $L = 2.0\,\text{m}$, $d = 1.0\cdot10^{-3}\,\text{m}$, $V = 0.10\,\text{V}$, $\rho = 1.7\cdot10^{-8}\,\Omega\cdot\text{m}$, $n = 8.5\cdot10^{28}\,\text{m}^{-3}$, $e = 1.6\cdot10^{-19}\,\text{C}$.
      - kind: formula
        text: >-
          $A = \dfrac{\pi d^2}{4}$, $R = \rho\,\dfrac{L}{A}$, $I = \dfrac{V}{R}$, ומשיעור 3.2 $I = nqvA$, כאן עם $q = e$.
      - kind: substitution
        text: >-
          א. $A = \dfrac{\pi(1.0\cdot10^{-3}\,\text{m})^2}{4} = 7.85\cdot10^{-7}\,\text{m}^2$.
          $$R = \frac{1.7\cdot10^{-8}\cdot2.0}{7.85\cdot10^{-7}} \approx 0.0433\,\Omega \qquad I = \frac{0.10\,\text{V}}{0.0433\,\Omega} \approx 2.31\,\text{A}$$
      - kind: manipulation
        text: >-
          ב. מבודדים את $v$ מ-$I = nqvA$ עם $q = e$: מחלקים את שני האגפים ב-$neA$, ומקבלים $v = \dfrac{I}{neA}$.
          $$v = \frac{2.31}{8.5\cdot10^{28}\cdot1.6\cdot10^{-19}\cdot7.85\cdot10^{-7}} \approx 2.2\cdot10^{-4}\,\text{m/s}$$
      - kind: reasoning
        text: >-
          ג. קוטר כפול נותן שטח חתך פי 4, ולכן ההתנגדות קטנה פי 4, ובאותו מתח הזרם גדל פי 4. אבל גם $A$ במכנה של $v = \dfrac{I}{neA}$ גדל פי 4, ושני השינויים מבטלים זה את זה. כדי לראות זאת בכלל, מציבים $I = \dfrac{V}{R} = \dfrac{VA}{\rho L}$ בתוך $v = \dfrac{I}{neA}$, ו-$A$ מצטמצם:
          $$v = \frac{V}{ne\rho L}$$
          מהירות הסחיפה תלויה רק במתח, בחומר ובאורך. בדיקה: $\dfrac{0.10}{8.5\cdot10^{28}\cdot1.6\cdot10^{-19}\cdot1.7\cdot10^{-8}\cdot2.0} \approx 2.2\cdot10^{-4}\,\text{m/s}$, כמו בסעיף ב.
      - kind: result
        text: >-
          א. $R \approx 0.043\,\Omega$ ו-$I \approx 2.3\,\text{A}$.

          ב. $v \approx 2.2\cdot10^{-4}\,\text{m/s}$.

          ג. ההתנגדות קטנה פי 4, הזרם גדל פי 4, ומהירות הסחיפה נשארת $2.2\cdot10^{-4}\,\text{m/s}$.

  - id: W-3.3-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-3.3-3, OBJ-3.3-1]
    prompt: >-
      מתכננים גוף חימום שיעבור בו זרם של $2.0\,\text{A}$ כשמחברים אותו לספק של $12\,\text{V}$. הניחו שההתנגדות לא תלויה בטמפרטורה.

      א. מה צריכה להיות ההתנגדות של גוף החימום?

      ב. באיזה אורך תיל ניכרום ($\rho = 1.1\cdot10^{-6}\,\Omega\cdot\text{m}$) בקוטר $0.30$ מילימטר צריך להשתמש?

      ג. מה משתנה אם משתמשים בתיל ניכרום בקוטר כפול? באיזה אורך צריך להשתמש עכשיו?

      ד. למה לא בונים גוף חימום מתיל נחושת ($\rho = 1.7\cdot10^{-8}\,\Omega\cdot\text{m}$) באותו קוטר כמו בסעיף ב? חשבו את האורך שהיה נדרש.
    answer: >-
      א. $6.0\,\Omega$.

      ב. כ-$0.39\,\text{m}$.

      ג. פי 4 ארוך יותר: כ-$1.5\,\text{m}$.

      ד. היה צריך כ-$25\,\text{m}$ של נחושת, ארוך מדי לגוף חימום.
    solution:
      - kind: given
        text: >-
          $V = 12\,\text{V}$, $I = 2.0\,\text{A}$, $\rho = 1.1\cdot10^{-6}\,\Omega\cdot\text{m}$, $d = 0.30\cdot10^{-3}\,\text{m}$.
      - kind: substitution
        text: >-
          א. $R = \dfrac{V}{I} = \dfrac{12\,\text{V}}{2.0\,\text{A}} = 6.0\,\Omega$.
      - kind: manipulation
        text: >-
          ב. מ-$R = \rho\,\dfrac{L}{A}$ כופלים ב-$A$ ומחלקים ב-$\rho$: $L = \dfrac{RA}{\rho}$. שטח החתך: $A = \dfrac{\pi(0.30\cdot10^{-3}\,\text{m})^2}{4} = 7.07\cdot10^{-8}\,\text{m}^2$.
          $$L = \frac{6.0\,\Omega\cdot7.07\cdot10^{-8}\,\text{m}^2}{1.1\cdot10^{-6}\,\Omega\cdot\text{m}} \approx 0.386\,\text{m}$$
      - kind: reasoning
        text: >-
          ג. ההתנגדות הנדרשת עדיין $6.0\,\Omega$. בקוטר כפול שטח החתך גדל פי 4, ולפי $L = \dfrac{RA}{\rho}$ גם האורך צריך לגדול פי 4: $4\cdot0.386 \approx 1.54\,\text{m}$. תיל עבה מתנגד פחות לכל מטר, ולכן צריך יותר מטרים.
      - kind: substitution
        text: >-
          ד. $L_{\text{Cu}} = \dfrac{6.0\cdot7.07\cdot10^{-8}}{1.7\cdot10^{-8}} \approx 25\,\text{m}$. ההתנגדות הסגולית של נחושת קטנה פי $65$ בערך מזו של ניכרום, ולכן צריך תיל ארוך פי $65$ בערך.
      - kind: result
        text: >-
          א. $6.0\,\Omega$.

          ב. כ-$0.39\,\text{m}$ של ניכרום.

          ג. אורך פי 4, כ-$1.5\,\text{m}$.

          ד. היה צריך כ-$25\,\text{m}$ של נחושת. לכן גופי חימום עושים מחומר שההתנגדות הסגולית שלו גדולה.

challenge:
  - id: W-3.3-c1
    stars: 1
    objectives: [OBJ-3.3-3]
    prompt: >-
      מותחים תיל מתכת שאורכו $L$ וההתנגדות שלו $R$, עד שהאורך שלו גדל פי $(1 + x)$. בזמן המתיחה הנפח של התיל וההתנגדות הסגולית שלו לא משתנים.

      א. הראו שההתנגדות החדשה היא $R' = (1 + x)^2 R$.

      ב. כש-$x$ קטן מאוד, השינוי היחסי בהתנגדות, $\Delta R/R$, הוא בערך $2x$. הראו זאת, וחשבו את ההתנגדות החדשה כש-$R = 100.0\,\Omega$ ו-$x = 0.001$.

      ג. מותחים את אותו תיל ב-$10\%$, כלומר $x = 0.10$. מה ההתנגדות החדשה, ומה היה נותן הקירוב של סעיף ב?
    answer: >-
      א. $R' = (1 + x)^2 R$.

      ב. $R' \approx 100.2\,\Omega$.

      ג. $121\,\Omega$; הקירוב היה נותן $120\,\Omega$.
    solution:
      - kind: given
        text: >-
          אורך התחלתי $L$, שטח חתך $A$, נפח $V_{\text{vol}} = AL$ קבוע, ו-$\rho$ קבועה. האורך החדש $L' = (1 + x)L$.
      - kind: reasoning
        text: >-
          א. הנפח לא משתנה: $A'L' = AL$. מחלקים ב-$L'$: $A' = \dfrac{AL}{L'} = \dfrac{A}{1 + x}$. התיל הארוך נעשה גם דק יותר. מציבים ב-$R = \rho\,\dfrac{L}{A}$:
          $$R' = \rho\,\frac{(1 + x)L}{A/(1 + x)} = (1 + x)^2\,\rho\,\frac{L}{A} = (1 + x)^2 R$$
          ההתנגדות גדלה פעם אחת כי התיל ארוך יותר, ופעם שנייה כי הוא דק יותר.
      - kind: manipulation
        text: >-
          ב. פותחים את הסוגריים: $(1 + x)^2 = 1 + 2x + x^2$. לכן
          $$\frac{\Delta R}{R} = \frac{R' - R}{R} = 2x + x^2$$
          כש-$x = 0.001$, האיבר $x^2 = 10^{-6}$ קטן פי 2000 מ-$2x = 0.002$, ואפשר להזניח אותו: $\Delta R/R \approx 2x$. לכן $\Delta R \approx 2\cdot0.001\cdot100.0\,\Omega = 0.2\,\Omega$, ו-$R' \approx 100.2\,\Omega$.
      - kind: substitution
        text: >-
          ג. בדיוק: $R' = (1.10)^2\cdot100.0\,\Omega = 1.21\cdot100.0\,\Omega = 121\,\Omega$. הקירוב נותן $R(1 + 2x) = 100.0\cdot1.20 = 120\,\Omega$. כאן $x^2 = 0.01$ כבר אינו זניח לעומת $2x = 0.2$, והקירוב טועה ב-$1\,\Omega$.
      - kind: result
        text: >-
          א. $R' = (1 + x)^2 R$.

          ב. $R' \approx 100.2\,\Omega$.

          ג. $121\,\Omega$ בדיוק; הקירוב $2x$ נותן $120\,\Omega$, כי במתיחה של $10\%$ כבר אי אפשר להזניח את $x^2$.
    source:
      name: British Physics Olympiad, Round 1
      year: 2017
      problem: 'Section 2, Question 2(b)'
      url: https://www.bpho.org.uk/Papers/R1/2017Nov_R1_S2.pdf
      verified: '2026-11-02'
      adapted: true

  - id: W-3.3-c2
    stars: 1
    objectives: [OBJ-3.3-3]
    prompt: >-
      לתיל ארוך ואחיד, בקוטר $1.40$ מילימטר, יש התנגדות של $0.478\,\Omega$. כדי לדעת את האורך שלו בלי לפרוש אותו, מגלגלים אותו לכדור ושוקלים: באוויר המשקל $4.60\,\text{N}$, וכשהכדור שקוע כולו במים, מד הכוח מראה $4.08\,\text{N}$. המים דוחפים את הכדור למעלה בכוח ששווה למשקל המים שהכדור דוחק, כלומר למשקל של מים בנפח של הכדור. צפיפות המים $1000\,\text{kg/m}^3$, ו-$g = 10\,\text{m/s}^2$.

      א. מה הנפח של התיל?

      ב. מה האורך של התיל?

      ג. מה ההתנגדות הסגולית של החומר שממנו הוא עשוי?
    answer: >-
      א. $5.2\cdot10^{-5}\,\text{m}^3$.

      ב. כ-$34\,\text{m}$.

      ג. $\rho \approx 2.2\cdot10^{-8}\,\Omega\cdot\text{m}$.
    solution:
      - kind: given
        text: >-
          $d = 1.40\cdot10^{-3}\,\text{m}$, $R = 0.478\,\Omega$, משקל באוויר $4.60\,\text{N}$, קריאה במים $4.08\,\text{N}$, $\rho_{\text{w}} = 1000\,\text{kg/m}^3$ (צפיפות המים; לא לבלבל עם ההתנגדות הסגולית $\rho$), $g = 10\,\text{m/s}^2$.
      - kind: reasoning
        text: >-
          א. במים מד הכוח מראה פחות, כי המים דוחפים את הכדור למעלה. הכוח הזה הוא ההפרש: $4.60 - 4.08 = 0.52\,\text{N}$. הוא שווה למשקל של מים בנפח הכדור: $\rho_{\text{w}}\,V_{\text{vol}}\,g = 0.52\,\text{N}$. מחלקים ב-$\rho_{\text{w}} g$:
          $$V_{\text{vol}} = \frac{0.52\,\text{N}}{1000\,\text{kg/m}^3\cdot10\,\text{m/s}^2} = 5.2\cdot10^{-5}\,\text{m}^3$$
      - kind: manipulation
        text: >-
          ב. התיל הוא גליל: $V_{\text{vol}} = AL$, ולכן $L = \dfrac{V_{\text{vol}}}{A}$. שטח החתך: $A = \dfrac{\pi(1.40\cdot10^{-3}\,\text{m})^2}{4} = 1.54\cdot10^{-6}\,\text{m}^2$.
          $$L = \frac{5.2\cdot10^{-5}\,\text{m}^3}{1.54\cdot10^{-6}\,\text{m}^2} \approx 33.8\,\text{m}$$
      - kind: manipulation
        text: >-
          ג. מ-$R = \rho\,\dfrac{L}{A}$ כופלים ב-$A$ ומחלקים ב-$L$: $\rho = \dfrac{RA}{L}$.
          $$\rho = \frac{0.478\,\Omega\cdot1.54\cdot10^{-6}\,\text{m}^2}{33.8\,\text{m}} \approx 2.18\cdot10^{-8}\,\Omega\cdot\text{m}$$
          (חישבנו עם הערכים הלא מעוגלים של $A$ ו-$L$.)
      - kind: result
        text: >-
          א. $V_{\text{vol}} = 5.2\cdot10^{-5}\,\text{m}^3$.

          ב. $L \approx 34\,\text{m}$.

          ג. $\rho \approx 2.2\cdot10^{-8}\,\Omega\cdot\text{m}$, קרוב לערכים של נחושת ושל אלומיניום שבטבלה.
    source:
      name: British Physics Olympiad, Round 1
      year: 2020
      problem: 'Section 1, Question 1(e)'
      url: https://www.bpho.org.uk/Papers/R1/2020Nov_R1_S1.pdf
      verified: '2026-11-02'
      adapted: true
