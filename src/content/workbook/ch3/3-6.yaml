# Workbook, lesson 3.6 (EMF and internal resistance). Format and rules: see .claude/CLAUDE.md, "Worked examples, workbook".
# Every number was recomputed with src/physics/circuits.ts (loopCurrent, terminalVoltage, solveCircuit,
# powerIR, powerVR, parallelR, seriesR, efficiency); scripts recompute-3-6-a.ts and -b.ts in the session scratchpad.
# In a >- block, consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '3.6'
practice:
  - id: W-3.6-01
    level: basic
    qualitative: false
    objectives: [OBJ-3.6-1]
    prompt: >-
      לסוללה כא״מ של $9\,\text{V}$. בזמן שהיא מספקת זרם קבוע של $0.25\,\text{A}$, התהליכים הכימיים שבתוכה עושים על המטען עבודה של $540\,\text{J}$.

      א. כמה מטען עבר בסוללה, ובכמה זמן?

      ב. בכל הזמן הזה מד מתח על ההדקים הראה $8.5\,\text{V}$. כמה אנרגיה קיבל המעגל החיצוני, וכמה הפכה לחום בתוך הסוללה?
    answer: >-
      א. $60\,\text{C}$, במשך $240\,\text{s}$ (4 דקות).

      ב. $510\,\text{J}$ למעגל החיצוני, ו-$30\,\text{J}$ חום בתוך הסוללה.
    solution:
      - kind: given
        text: >-
          $\varepsilon = 9\,\text{V}$, $I = 0.25\,\text{A}$, העבודה של הכא״מ $W = 540\,\text{J}$, ומתח ההדקים $V = 8.5\,\text{V}$.
      - kind: formula
        text: >-
          הכא״מ הוא עבודה לכל קולון, $\varepsilon = \dfrac{W}{q}$. הזרם הוא קצב המעבר של מטען, $I = \dfrac{q}{t}$ (שיעור 3.2). מטען $q$ שעובר במעגל החיצוני מוסר בו אנרגיה $qV$ (שיעור 3.1).
      - kind: manipulation
        text: >-
          כופלים את $\varepsilon = W/q$ ב-$q$ ומחלקים ב-$\varepsilon$, כדי לבודד את המטען: $q = \dfrac{W}{\varepsilon}$. באותה דרך $t = \dfrac{q}{I}$.
      - kind: substitution
        text: >-
          א. $q = \dfrac{540}{9} = 60\,\text{C}$, ו-$t = \dfrac{60}{0.25} = 240\,\text{s}$.

          ב. למעגל החיצוני: $qV = 60\cdot8.5 = 510\,\text{J}$. ההפרש, $540 - 510 = 30\,\text{J}$, לא יצא מהסוללה: הוא הפך לחום בתוכה, על ההתנגדות הפנימית.
      - kind: result
        text: >-
          א. $60\,\text{C}$, במשך $240\,\text{s}$.

          ב. $510\,\text{J}$ למעגל החיצוני, ו-$30\,\text{J}$ חום בתוך הסוללה.

  - id: W-3.6-02
    level: basic
    qualitative: true
    objectives: [OBJ-3.6-1, OBJ-3.6-3]
    prompt: >-
      למצבר של מכונית ולסוללה של צעצוע אותו כא״מ, $12\,\text{V}$. ההתנגדות הפנימית של המצבר קטנה מאוד, ושל סוללת הצעצוע גדולה פי מאה ויותר. קבעו ונמקו, בלי חישוב:

      א. מה יראה מד מתח שמחובר לכל אחת מהן, כשלא מחובר אליה שום דבר אחר?

      ב. מחברים לכל אחת, בנפרד, אותו נגד. איזו מהן תשמור על מתח הדקים קרוב יותר ל-$12\,\text{V}$?

      ג. אצל איזו מהן זרם הקצר גדול יותר? למה קצר במצבר מסוכן הרבה יותר?
    answer: >-
      א. $12\,\text{V}$ בשתיהן: בלי זרם, מתח ההדקים שווה לכא״מ.

      ב. המצבר: הירידה $Ir$ בתוכו קטנה.

      ג. אצל המצבר. זרם הקצר $\varepsilon/r$, ו-$r$ שלו קטנה מאוד, ולכן הזרם עצום, וכל ההספק $\varepsilon I$ מחמם את המצבר ואת התיל.
    solution:
      - kind: given
        text: >-
          לשתיהן $\varepsilon = 12\,\text{V}$; $r$ של המצבר קטנה מאוד, ו-$r$ של סוללת הצעצוע גדולה בהרבה.
      - kind: formula
        text: >-
          $V = \varepsilon - Ir$, $I = \dfrac{\varepsilon}{R + r}$, וזרם הקצר $I = \dfrac{\varepsilon}{r}$.
      - kind: reasoning
        text: >-
          א. מד המתח לבדו לא מעביר זרם, ולכן $I = 0$, אין ירידה בתוך הסוללה, ו-$V = \varepsilon$. מד מתח בלי עומס מודד את הכא״מ, ולכן הוא לא מבחין בין השתיים.
      - kind: reasoning
        text: >-
          ב. אצל המצבר $r$ קטנה הרבה מהנגד, ולכן הזרם כמעט כמו בסוללה אידאלית, והירידה $Ir$ זעירה. אצל סוללת הצעצוע $r$ גדולה, וחלק ניכר מהכא״מ נופל בתוכה. לדוגמה, אם $r$ של המצבר $0.01\,\Omega$, של הצעצוע $1.6\,\Omega$ והנגד $4\,\Omega$, מתח ההדקים הוא בערך $11.97\,\text{V}$ במצבר ו-$8.6\,\text{V}$ בסוללת הצעצוע.
      - kind: reasoning
        text: >-
          ג. בקצר רק $r$ מגבילה את הזרם. באותן דוגמאות: $\dfrac{12}{0.01} = 1200\,\text{A}$ במצבר, לעומת $\dfrac{12}{1.6} = 7.5\,\text{A}$ בסוללת הצעצוע. כל ההספק של הכא״מ, $\varepsilon I$, הופך לחום בתיל ובתוך המצבר: יותר מ-$14\,\text{kW}$.
      - kind: result
        text: >-
          א. $12\,\text{V}$ בשתיהן.

          ב. המצבר.

          ג. אצל המצבר, כי ההתנגדות הפנימית שלו קטנה מאוד; הזרם העצום מחמם את התיל ואת המצבר.

  - id: W-3.6-03
    level: basic
    qualitative: false
    objectives: [OBJ-3.6-2]
    prompt: >-
      לסוללה כא״מ של $4.5\,\text{V}$ והתנגדות פנימית של $0.3\,\Omega$. איזה נגד צריך לחבר אליה כדי שמתח ההדקים יהיה $3.6\,\text{V}$? מה ההספק בנגד הזה?
    answer: 'נגד של $1.2\,\Omega$; ההספק בו $10.8\,\text{W}$.'
    solution:
      - kind: given
        text: >-
          $\varepsilon = 4.5\,\text{V}$, $r = 0.3\,\Omega$, מתח ההדקים הרצוי $V = 3.6\,\text{V}$.
      - kind: formula
        text: >-
          $V = \varepsilon - Ir$. מתח ההדקים הוא גם המתח על הנגד, ולכן $R = \dfrac{V}{I}$.
      - kind: manipulation
        text: >-
          את $R$ אי אפשר למצוא לפני שיודעים את הזרם. את הזרם מוצאים מהירידה בתוך הסוללה: מעבירים אגפים, $Ir = \varepsilon - V$, ומחלקים ב-$r$: $I = \dfrac{\varepsilon - V}{r}$.
      - kind: substitution
        text: >-
          $I = \dfrac{4.5 - 3.6}{0.3} = \dfrac{0.9}{0.3} = 3\,\text{A}$. אז $R = \dfrac{3.6}{3} = 1.2\,\Omega$, וההספק בנגד $P = VI = 3.6\cdot3 = 10.8\,\text{W}$. בדיקה: $I = \dfrac{4.5}{1.2 + 0.3} = 3\,\text{A}$.
      - kind: result
        text: >-
          $R = 1.2\,\Omega$, ו-$P = 10.8\,\text{W}$.

  - id: W-3.6-04
    level: mid
    qualitative: true
    objectives: [OBJ-3.6-1]
    prompt: >-
      לפניכם ארבע טענות על סוללה שהכא״מ שלה $9\,\text{V}$. קבעו לגבי כל טענה אם היא נכונה, ונמקו.

      א. כשהסוללה לא מחוברת לשום דבר, הכא״מ שלה אפס, כי היא לא עושה עבודה.

      ב. כשהסוללה מספקת זרם, מתח ההדקים שלה לא יכול להיות גדול מ-$9\,\text{V}$.

      ג. אם מחברים לסוללה, בכל פעם, נגד אחר, הכא״מ שלה שונה בכל פעם.

      ד. בתוך הסוללה המטען החיובי עובר מההדק השלילי אל החיובי, כלומר מפוטנציאל נמוך לגבוה, ולכן משהו שאינו השדה החשמלי חייב לעשות עליו עבודה.
    answer: >-
      א. לא נכונה. ב. נכונה. ג. לא נכונה. ד. נכונה.
    solution:
      - kind: formula
        text: >-
          $\varepsilon = \dfrac{W}{q}$ היא העבודה לכל קולון שעובר בסוללה, ו-$V = \varepsilon - Ir$.
      - kind: reasoning
        text: >-
          א. לא נכונה. הכא״מ הוא תכונה של הסוללה: כמה עבודה היא עושה על **כל** קולון שעובר בה. כשלא עובר מטען, לא נעשית עבודה, אבל העבודה לקולון לא השתנתה. מד מתח על הדקי סוללה שלא מחוברת לשום דבר מראה בדיוק את הכא״מ, $9\,\text{V}$.
      - kind: reasoning
        text: >-
          ב. נכונה. כשהסוללה מספקת זרם, $I > 0$, והירידה $Ir$ בתוכה חיובית או אפס, ולכן $V = 9 - Ir$ קטן מ-$9\,\text{V}$ או שווה לו.
      - kind: reasoning
        text: >-
          ג. לא נכונה. הנגד משנה את הזרם, ולכן את הירידה $Ir$ ואת מתח ההדקים. הכא״מ, העבודה שהתהליכים הכימיים עושים על כל קולון, לא תלוי בנגד שבחוץ.
      - kind: reasoning
        text: >-
          ד. נכונה. במעגל החיצוני השדה דוחף את המטען החיובי מפוטנציאל גבוה לנמוך, "במורד". בתוך הסוללה הוא עולה "במעלה", נגד השדה, ולכן צריך כוח אחר שיעשה עליו עבודה: התהליכים הכימיים. העבודה הזאת, לכל קולון, היא הכא״מ.
      - kind: result
        text: >-
          א. לא נכונה. ב. נכונה. ג. לא נכונה. ד. נכונה.

  - id: W-3.6-05
    level: mid
    qualitative: false
    objectives: [OBJ-3.6-2]
    prompt: >-
      בפנס יש שתי סוללות זהות, זו אחרי זו בטור: ההדק החיובי של הראשונה נוגע בהדק השלילי של השנייה. לכל סוללה כא״מ של $1.5\,\text{V}$ והתנגדות פנימית של $0.25\,\Omega$. הנורה בפנס היא נגד של $2.5\,\Omega$.

      א. לכו סביב המעגל לפי פרופיל הגובה, ומצאו את הזרם.

      ב. מה המתח על הנורה, ומה יראה מד מתח שמחובר להדקים של סוללה אחת?

      ג. מכניסים את אחת הסוללות הפוך. מה הזרם עכשיו?
    answer: >-
      א. $1\,\text{A}$.

      ב. $2.5\,\text{V}$ על הנורה, ו-$1.25\,\text{V}$ על כל סוללה.

      ג. אפס.
    solution:
      - kind: given
        text: >-
          שתי סוללות בטור, לכל אחת $\varepsilon = 1.5\,\text{V}$ ו-$r = 0.25\,\Omega$; הנורה $R = 2.5\,\Omega$.
      - kind: reasoning
        text: >-
          א. אותו זרם $I$ עובר בכל המעגל, כי יש בו מסלול אחד. הולכים איתו סביב המעגל: בכל סוללה הפוטנציאל עולה ב-$1.5\,\text{V}$ ויורד ב-$0.25I$, ובנורה הוא יורד ב-$2.5I$. בחזרה לנקודת ההתחלה הגובה זהה, ולכן סכום העליות שווה לסכום הירידות.
      - kind: formula
        text: >-
          $$\varepsilon_1 + \varepsilon_2 = I\,(r_1 + r_2 + R)$$
          כלומר שתי הסוללות פועלות כמו סוללה אחת עם כא״מ של $3\,\text{V}$ והתנגדות פנימית של $0.5\,\Omega$.
      - kind: substitution
        text: >-
          א. $I = \dfrac{1.5 + 1.5}{0.25 + 0.25 + 2.5} = \dfrac{3}{3} = 1\,\text{A}$.

          ב. על הנורה $V = IR = 1\cdot2.5 = 2.5\,\text{V}$. על הדקי סוללה אחת $V = \varepsilon - Ir = 1.5 - 1\cdot0.25 = 1.25\,\text{V}$, ושתיהן יחד $2.5\,\text{V}$, בדיוק המתח על הנורה.
      - kind: reasoning
        text: >-
          ג. כשסוללה אחת הפוכה, הולכים בה מההדק החיובי אל השלילי, והפוטנציאל **יורד** בה ב-$1.5\,\text{V}$. סכום הכא״מים סביב המעגל הוא $1.5 - 1.5 = 0$, ולכן אין מה שידחוף זרם: $I = 0$, והנורה לא דולקת.
      - kind: result
        text: >-
          א. $1\,\text{A}$.

          ב. $2.5\,\text{V}$ על הנורה, ו-$1.25\,\text{V}$ על הדקי כל סוללה.

          ג. $I = 0$.

  - id: W-3.6-06
    level: mid
    qualitative: false
    objectives: [OBJ-3.6-3]
    prompt: >-
      לסוללה A כא״מ של $6\,\text{V}$ והתנגדות פנימית של $1\,\Omega$. לסוללה B כא״מ של $4.5\,\text{V}$ והתנגדות פנימית של $0.5\,\Omega$.

      א. מה זרם הקצר של כל אחת?

      ב. מחברים לכל סוללה, בנפרד, נגד זהה $R$. באיזה ערך של $R$ מתח ההדקים של שתיהן שווה, ומה הוא?

      ג. קבעו ונמקו: איזו סוללה נותנת מתח הדקים גדול יותר כשהנגד גדול מאוד, ואיזו כשהוא קטן מאוד?
    answer: >-
      א. $6\,\text{A}$ ל-A, $9\,\text{A}$ ל-B.

      ב. $R = 1\,\Omega$; לשתיהן $3\,\text{V}$.

      ג. נגד גדול מאוד: A (הכא״מ שלה גדול יותר). נגד קטן מאוד: B (ההתנגדות הפנימית שלה קטנה יותר).
    solution:
      - kind: given
        text: >-
          A: $\varepsilon_A = 6\,\text{V}$, $r_A = 1\,\Omega$. B: $\varepsilon_B = 4.5\,\text{V}$, $r_B = 0.5\,\Omega$.
      - kind: formula
        text: >-
          זרם הקצר $I = \dfrac{\varepsilon}{r}$. עם נגד $R$, מתח ההדקים הוא המתח על הנגד: $V = IR = \dfrac{\varepsilon R}{R + r}$.
      - kind: substitution
        text: >-
          א. $\dfrac{6}{1} = 6\,\text{A}$ ל-A, ו-$\dfrac{4.5}{0.5} = 9\,\text{A}$ ל-B.
      - kind: manipulation
        text: >-
          ב. משווים את מתחי ההדקים:
          $$\frac{6R}{R + 1} = \frac{4.5R}{R + 0.5}$$
          מחלקים את שני האגפים ב-$R$ (הוא לא אפס) וכופלים במכנים: $6(R + 0.5) = 4.5(R + 1)$, כלומר $6R + 3 = 4.5R + 4.5$. מעבירים אגפים: $1.5R = 1.5$, ולכן $R = 1\,\Omega$.
      - kind: substitution
        text: >-
          ב. $V_A = \dfrac{6\cdot1}{1 + 1} = 3\,\text{V}$ ו-$V_B = \dfrac{4.5\cdot1}{1 + 0.5} = 3\,\text{V}$. גם הזרם שווה בשתיהן: $3\,\text{A}$.
      - kind: reasoning
        text: >-
          ג. כשהנגד גדול מאוד, הזרם קטן, הירידה $Ir$ זניחה, ומתח ההדקים כמעט שווה לכא״מ: A מנצחת (למשל ב-$R = 4\,\Omega$: $4.8\,\text{V}$ מול $4\,\text{V}$). כשהנגד קטן מאוד, המצב קרוב לקצר, והזרם כמעט $\varepsilon/r$; מתח ההדקים, $IR$, גדול יותר אצל הסוללה שזרם הקצר שלה גדול יותר, B (ב-$R = 0.5\,\Omega$: $2.25\,\text{V}$ מול $2\,\text{V}$).
      - kind: result
        text: >-
          א. $6\,\text{A}$ ו-$9\,\text{A}$.

          ב. $R = 1\,\Omega$, ומתח ההדקים $3\,\text{V}$.

          ג. נגד גדול: A. נגד קטן: B.

  - id: W-3.6-07
    level: mid
    qualitative: true
    objectives: [OBJ-3.6-3]
    prompt: >-
      סוללה עם התנגדות פנימית ניכרת מזינה נורה $L_1$. מוסיפים נורה זהה $L_2$ **בטור** ל-$L_1$. קבעו ונמקו, בלי חישוב:

      א. מה קורה לזרם בסוללה?

      ב. מה קורה למתח ההדקים?

      ג. מה קורה לבהירות של $L_1$?

      ד. בדקו את תשובותיכם בחישוב, עם $\varepsilon = 9\,\text{V}$, $r = 1.5\,\Omega$ ונורות של $6\,\Omega$.
    answer: >-
      א. קטן. ב. גדל. ג. קטנה. ד. הזרם יורד מ-$1.2\,\text{A}$ ל-$0.67\,\text{A}$, מתח ההדקים עולה מ-$7.2\,\text{V}$ ל-$8\,\text{V}$, והמתח על $L_1$ יורד מ-$7.2\,\text{V}$ ל-$4\,\text{V}$.
    solution:
      - kind: formula
        text: >-
          $I = \dfrac{\varepsilon}{R + r}$, $V = \varepsilon - Ir$, ובטור המתח מתחלק בין הנורות.
      - kind: reasoning
        text: >-
          א. בטור ההתנגדות החיצונית גדלה מ-$R$ ל-$2R$, ולכן ההתנגדות הכוללת גדלה והזרם קטן.
      - kind: reasoning
        text: >-
          ב. זרם קטן יותר פירושו ירידה $Ir$ קטנה יותר בתוך הסוללה, ולכן מתח ההדקים $\varepsilon - Ir$ גדל. העומס קטן, והסוללה קרובה יותר למצב בלי זרם.
      - kind: reasoning
        text: >-
          ג. אף שמתח ההדקים גדל, $L_1$ מקבלת רק חצי ממנו, כי שתי נורות זהות בטור מתחלקות בו שווה בשווה. המתח עליה הוא $IR$, והזרם $I$ קטן, ולכן המתח עליה קטן והיא נחלשת. מתח הדקים גדול יותר לא אומר שכל נורה מקבלת יותר.
      - kind: substitution
        text: >-
          ד. נורה אחת: $I = \dfrac{9}{6 + 1.5} = 1.2\,\text{A}$, $V = 9 - 1.2\cdot1.5 = 7.2\,\text{V}$, וכולו על $L_1$. שתי נורות: $I = \dfrac{9}{12 + 1.5} = 0.67\,\text{A}$ (בדיוק $\tfrac{2}{3}\,\text{A}$), $V = 9 - \tfrac{2}{3}\cdot1.5 = 8\,\text{V}$, ועל $L_1$ רק $\tfrac{2}{3}\cdot6 = 4\,\text{V}$.
      - kind: result
        text: >-
          הזרם קטן, מתח ההדקים גדל, ו-$L_1$ נחלשת.

  - id: W-3.6-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-3.6-2]
    prompt: >-
      לסוללה כא״מ של $12\,\text{V}$ והתנגדות פנימית $r$ לא ידועה. תלמידים מחברים אליה, בכל פעם, נגד אחר, ומגלים שנגד של $2\,\Omega$ ונגד של $8\,\Omega$ מקבלים בדיוק אותו הספק.

      א. כתבו את ההספק בנגד $R$ בעזרת $\varepsilon$, $r$ ו-$R$, והראו שמהשוויון נובע $r^2 = R_1R_2$. מה $r$?

      ב. מה ההספק בכל אחד מהנגדים, ומה הנצילות של הסוללה בכל מקרה (איזה חלק מההספק של הכא״מ מגיע לנגד)?

      ג. איזה מהשניים עדיף אם רוצים לבזבז כמה שפחות אנרגיה בסוללה?
    answer: >-
      א. $r = 4\,\Omega$.

      ב. $8\,\text{W}$ בכל אחד; נצילות של כשליש עם $2\,\Omega$, ושל כשני שלישים עם $8\,\Omega$.

      ג. הנגד של $8\,\Omega$.
    solution:
      - kind: given
        text: >-
          $\varepsilon = 12\,\text{V}$, $R_1 = 2\,\Omega$, $R_2 = 8\,\Omega$, וההספקים בהם שווים.
      - kind: formula
        text: >-
          $I = \dfrac{\varepsilon}{R + r}$ ו-$P = I^2R$ (שיעור 3.4), ולכן
          $$P = \frac{\varepsilon^2 R}{(R + r)^2}$$
      - kind: manipulation
        text: >-
          א. משווים את ההספקים ומצמצמים את $\varepsilon^2$: $\dfrac{R_1}{(R_1 + r)^2} = \dfrac{R_2}{(R_2 + r)^2}$. כופלים בשני המכנים:
          $$R_1(R_2 + r)^2 = R_2(R_1 + r)^2$$
          פותחים סוגריים: $R_1R_2^2 + 2R_1R_2r + R_1r^2 = R_2R_1^2 + 2R_1R_2r + R_2r^2$. האיבר $2R_1R_2r$ מופיע בשני האגפים ומצטמצם. מקבצים:
          $$R_1R_2(R_2 - R_1) = r^2(R_2 - R_1)$$
          הנגדים שונים, ולכן מותר לחלק ב-$R_2 - R_1$, ומקבלים $r^2 = R_1R_2$.
      - kind: substitution
        text: >-
          א. $r^2 = 2\cdot8 = 16\,\Omega^2$, ולכן $r = 4\,\Omega$.

          ב. עם $2\,\Omega$: $I = \dfrac{12}{2 + 4} = 2\,\text{A}$, $P = 2^2\cdot2 = 8\,\text{W}$, והכא״מ עושה עבודה בהספק $\varepsilon I = 24\,\text{W}$; הנצילות $\dfrac{8}{24} = \dfrac{1}{3}$. עם $8\,\Omega$: $I = \dfrac{12}{8 + 4} = 1\,\text{A}$, $P = 1^2\cdot8 = 8\,\text{W}$, $\varepsilon I = 12\,\text{W}$, והנצילות $\dfrac{8}{12} = \dfrac{2}{3}$.
      - kind: reasoning
        text: >-
          ג. אותו הספק מגיע לנגד בשני המקרים, אבל עם $2\,\Omega$ הזרם כפול, והחום בסוללה, $I^2r$, גדול פי 4: $16\,\text{W}$ לעומת $4\,\text{W}$. לכן הנגד של $8\,\Omega$ עדיף.
      - kind: result
        text: >-
          א. $r = 4\,\Omega$.

          ב. $8\,\text{W}$ בכל אחד; נצילות $\tfrac{1}{3}$ עם $2\,\Omega$ ו-$\tfrac{2}{3}$ עם $8\,\Omega$.

          ג. הנגד של $8\,\Omega$.

  - id: W-3.6-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-3.6-2, OBJ-3.6-3]
    prompt: >-
      לסוללה כא״מ של $12\,\text{V}$ והתנגדות פנימית של $1\,\Omega$. מחוברים אליה, בטור, נגד $R_1 = 3\,\Omega$, ואחריו זוג נגדים במקביל זה לזה: $R_2 = 6\,\Omega$ ו-$R_3 = 12\,\Omega$.

      א. מצאו את הזרם בסוללה, את מתח ההדקים, ואת הזרם ב-$R_2$ וב-$R_3$.

      ב. מה משתנה אם מנתקים את $R_3$? קבעו קודם בלי חישוב איך משתנים הזרם בסוללה, מתח ההדקים והזרם ב-$R_2$, ואחר כך חשבו אותם.
    answer: >-
      א. $1.5\,\text{A}$ בסוללה, מתח הדקים $10.5\,\text{V}$, $1\,\text{A}$ ב-$R_2$ ו-$0.5\,\text{A}$ ב-$R_3$.

      ב. הזרם בסוללה קטן ל-$1.2\,\text{A}$, מתח ההדקים גדל ל-$10.8\,\text{V}$, והזרם ב-$R_2$ גדל ל-$1.2\,\text{A}$.
    solution:
      - kind: given
        text: >-
          $\varepsilon = 12\,\text{V}$, $r = 1\,\Omega$, $R_1 = 3\,\Omega$ בטור, ואחריו $R_2 = 6\,\Omega$ במקביל ל-$R_3 = 12\,\Omega$.
      - kind: formula
        text: >-
          במקביל $\dfrac{1}{R} = \dfrac{1}{R_2} + \dfrac{1}{R_3}$ (שיעור 3.5); $I = \dfrac{\varepsilon}{R + r}$; $V = \varepsilon - Ir$.
      - kind: substitution
        text: >-
          א. הזוג במקביל: $\dfrac{1}{R_{23}} = \dfrac{1}{6} + \dfrac{1}{12} = \dfrac{3}{12}$, ולכן $R_{23} = 4\,\Omega$. ההתנגדות החיצונית $3 + 4 = 7\,\Omega$, ו-$I = \dfrac{12}{7 + 1} = 1.5\,\text{A}$. מתח ההדקים $V = 12 - 1.5\cdot1 = 10.5\,\text{V}$. על הזוג $1.5\cdot4 = 6\,\text{V}$, ולכן ב-$R_2$ עובר $\dfrac{6}{6} = 1\,\text{A}$ וב-$R_3$ עובר $\dfrac{6}{12} = 0.5\,\text{A}$. בדיקה: $1 + 0.5 = 1.5\,\text{A}$.
      - kind: reasoning
        text: >-
          ב. בלי $R_3$, הזרם בחלק הזה עובר רק ב-$R_2$, שהתנגדותו $6\,\Omega$, יותר מ-$4\,\Omega$ של הזוג. ההתנגדות הכוללת גדלה, ולכן הזרם בסוללה קטן, הירידה $Ir$ קטנה, ומתח ההדקים גדל. גם הירידה על $R_1$, שהיא $IR_1$, קטנה, ולכן ל-$R_2$ נשאר מתח גדול יותר, והזרם בו גדל.
      - kind: substitution
        text: >-
          ב. $I = \dfrac{12}{3 + 6 + 1} = 1.2\,\text{A}$, $V = 12 - 1.2\cdot1 = 10.8\,\text{V}$. כל הזרם עובר עכשיו ב-$R_2$: $1.2\,\text{A}$, והמתח עליו $1.2\cdot6 = 7.2\,\text{V}$, לעומת $6\,\text{V}$ קודם.
      - kind: result
        text: >-
          א. $1.5\,\text{A}$, $10.5\,\text{V}$, $1\,\text{A}$ ב-$R_2$, $0.5\,\text{A}$ ב-$R_3$.

          ב. $1.2\,\text{A}$ בסוללה, $10.8\,\text{V}$ על ההדקים, ו-$1.2\,\text{A}$ ב-$R_2$.

  - id: W-3.6-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-3.6-1, OBJ-3.6-2]
    prompt: >-
      מחברים לסוללה, בכל פעם, עומס אחר, וקוראים מד זרם בטור ומד מתח על ההדקים (שניהם אידאליים: מד הזרם בלי התנגדות, ומד המתח לא מעביר זרם). עם העומס הראשון הקריאות הן $2\,\text{A}$ ו-$10\,\text{V}$, ועם השני $4\,\text{A}$ ו-$8\,\text{V}$.

      א. מצאו את הכא״מ ואת ההתנגדות הפנימית של הסוללה.

      ב. איזה נגד צריך לחבר לסוללה כדי שיקבל הספק של $27\,\text{W}$? יש שתי תשובות; מצאו את שתיהן.

      ג. השוו בין שני הנגדים: מה מתח ההדקים, כמה עבודה עושה הכא״מ על כל קולון, וכמה אנרגיה כל קולון מוסר לנגד? איזה מהנגדים עדיף, ולמה?
    answer: >-
      א. $\varepsilon = 12\,\text{V}$, $r = 1\,\Omega$.

      ב. $R = 3\,\Omega$ (זרם $3\,\text{A}$) או $R = \tfrac{1}{3}\,\Omega$ (זרם $9\,\text{A}$).

      ג. בשני המקרים הכא״מ עושה $12\,\text{J}$ על כל קולון. עם $3\,\Omega$ מתח ההדקים $9\,\text{V}$, וכל קולון מוסר לנגד $9\,\text{J}$ (נצילות $75\%$); עם $\tfrac{1}{3}\,\Omega$ מתח ההדקים $3\,\text{V}$, וכל קולון מוסר $3\,\text{J}$ (נצילות $25\%$). הנגד של $3\,\Omega$ עדיף.
    solution:
      - kind: given
        text: >-
          שתי מדידות של אותה סוללה: $I_1 = 2\,\text{A}$, $V_1 = 10\,\text{V}$; $I_2 = 4\,\text{A}$, $V_2 = 8\,\text{V}$. הכא״מ וההתנגדות הפנימית זהים בשתיהן.
      - kind: formula
        text: >-
          $V = \varepsilon - Ir$ לכל מדידה. ההספק בנגד הוא $P = VI$, וכשמציבים את מתח ההדקים, $P = (\varepsilon - Ir)I$.
      - kind: manipulation
        text: >-
          א. מחסירים את המשוואה של המדידה השנייה מזו של הראשונה, והכא״מ מצטמצם: $V_1 - V_2 = (I_2 - I_1)r$. מחלקים ב-$I_2 - I_1$ כדי לבודד את $r$:
          $$r = \frac{V_1 - V_2}{I_2 - I_1}$$
          כלומר: כשהזרם גדל ב-$2\,\text{A}$, מתח ההדקים ירד ב-$2\,\text{V}$, כי הירידה בתוך הסוללה גדלה בדיוק בזה.
      - kind: substitution
        text: >-
          א. $r = \dfrac{10 - 8}{4 - 2} = 1\,\Omega$, ומהמדידה הראשונה $\varepsilon = V_1 + I_1r = 10 + 2\cdot1 = 12\,\text{V}$. בדיקה במדידה השנייה: $12 - 4\cdot1 = 8\,\text{V}$.
      - kind: manipulation
        text: >-
          ב. הנגד לא ידוע, ולכן נוח יותר למצוא קודם את הזרם. מציבים במשוואת ההספק: $27 = (12 - I\cdot1)I$, כלומר $27 = 12I - I^2$. מעבירים הכול לאגף אחד:
          $$I^2 - 12I + 27 = 0$$
          זו משוואה ריבועית בזרם. לפי נוסחת השורשים:
          $$I = \frac{12 \pm \sqrt{12^2 - 4\cdot27}}{2} = \frac{12 \pm 6}{2}$$
      - kind: substitution
        text: >-
          ב. $I = 3\,\text{A}$ או $I = 9\,\text{A}$. לכל זרם מוצאים את מתח ההדקים ואת הנגד, $R = V/I$:

          עם $3\,\text{A}$: $V = 12 - 3\cdot1 = 9\,\text{V}$, ו-$R = \dfrac{9}{3} = 3\,\Omega$.

          עם $9\,\text{A}$: $V = 12 - 9\cdot1 = 3\,\text{V}$, ו-$R = \dfrac{3}{9} = \tfrac{1}{3}\,\Omega$.

          בדיקה: $9\cdot3 = 27\,\text{W}$ ו-$3\cdot9 = 27\,\text{W}$.
      - kind: reasoning
        text: >-
          ב. למה שתי תשובות? נגד גדול מקבל זרם קטן במתח גבוה, ונגד קטן מקבל זרם גדול במתח נמוך, ובשני המקרים המכפלה $VI$ יכולה לצאת אותו הספק. שני השורשים חיוביים, ושניהם נגדים אמיתיים, ולכן שניהם תשובות.
      - kind: reasoning
        text: >-
          ג. הכא״מ הוא העבודה על כל קולון שעובר בסוללה, ולכן בשני המקרים $12\,\text{J}$ לקולון. מתח ההדקים הוא האנרגיה שכל קולון מוסר במעגל החיצוני, כאן לנגד: $9\,\text{J}$ עם $3\,\Omega$, ורק $3\,\text{J}$ עם $\tfrac{1}{3}\,\Omega$. השאר, $3\,\text{J}$ או $9\,\text{J}$ לקולון, הופך לחום בתוך הסוללה. בהספקים: עם $3\,\Omega$ הכא״מ עושה עבודה בהספק $\varepsilon I = 36\,\text{W}$, ו-$I^2r = 9\,\text{W}$ מחממים את הסוללה; עם $\tfrac{1}{3}\,\Omega$ הוא עושה $108\,\text{W}$, ו-$81\,\text{W}$ מחממים את הסוללה. אותו הספק מגיע לנגד, אבל הנגד של $3\,\Omega$ מבזבז הרבה פחות, ולכן הוא עדיף.
      - kind: result
        text: >-
          א. $\varepsilon = 12\,\text{V}$, $r = 1\,\Omega$.

          ב. $R = 3\,\Omega$ או $R = \tfrac{1}{3}\,\Omega$.

          ג. $12\,\text{J}$ לקולון בשניהם; עם $3\,\Omega$ מתח הדקים $9\,\text{V}$ ו-$9\,\text{J}$ לקולון לנגד, עם $\tfrac{1}{3}\,\Omega$ מתח הדקים $3\,\text{V}$ ו-$3\,\text{J}$ לקולון. הנגד של $3\,\Omega$ עדיף.

challenge:
  - id: W-3.6-c1
    stars: 1
    objectives: [OBJ-3.6-2, OBJ-3.6-3]
    prompt: >-
      לסוללה כא״מ של $12\,\text{V}$. כשמחברים את ההדקים שלה ישירות במד זרם שההתנגדות שלו זניחה, הוא מראה $4\,\text{A}$.

      א. מה ההתנגדות הפנימית של הסוללה?

      ב. מחברים לסוללה נגד $R$. הראו שההספק בנגד הוא הגדול ביותר כש-$R = r$. רמז: כתבו את ההספק בעזרת $\varepsilon$, $r$ ו-$R$, חלקו את המונה ואת המכנה ב-$R$, והשתמשו בזהות $R + 2r + \dfrac{r^2}{R} = \left(\sqrt{R} - \dfrac{r}{\sqrt{R}}\right)^2 + 4r$.

      ג. מה ההספק הגדול ביותר שאפשר להעביר לנגד, כמה אנרגיה הוא מקבל אז בדקה אחת, ואיזה חלק זה מהעבודה שהכא״מ עושה?
    answer: >-
      א. $r = 3\,\Omega$.

      ב. ההספק $\dfrac{\varepsilon^2}{R + 2r + r^2/R}$ גדול ביותר כשהמכנה קטן ביותר, כלומר כשהריבוע בזהות מתאפס: $R = r$.

      ג. $12\,\text{W}$; $720\,\text{J}$ בדקה; חצי מהעבודה של הכא״מ.
    solution:
      - kind: given
        text: >-
          $\varepsilon = 12\,\text{V}$, וזרם הקצר $4\,\text{A}$.
      - kind: formula
        text: >-
          זרם הקצר $I = \dfrac{\varepsilon}{r}$. עם נגד: $I = \dfrac{\varepsilon}{R + r}$ ו-$P = I^2R$.
      - kind: substitution
        text: >-
          א. $r = \dfrac{\varepsilon}{I} = \dfrac{12}{4} = 3\,\Omega$.
      - kind: manipulation
        text: >-
          ב. ההספק בנגד, ואחרי חלוקת המונה והמכנה ב-$R$:
          $$P = \frac{\varepsilon^2 R}{(R + r)^2} = \frac{\varepsilon^2}{R + 2r + \dfrac{r^2}{R}} = \frac{\varepsilon^2}{\left(\sqrt{R} - \dfrac{r}{\sqrt{R}}\right)^2 + 4r}$$
          (פותחים את הריבוע ובודקים: $R - 2r + \dfrac{r^2}{R} + 4r$, כמו שצריך.) המונה קבוע, ולכן $P$ גדול ביותר כשהמכנה קטן ביותר. ריבוע אינו שלילי, ולכן המכנה לפחות $4r$, והוא שווה ל-$4r$ רק כשהריבוע אפס: $\sqrt{R} = \dfrac{r}{\sqrt{R}}$, כלומר $R = r$.
      - kind: substitution
        text: >-
          ג. $P_{\max} = \dfrac{\varepsilon^2}{4r} = \dfrac{144}{12} = 12\,\text{W}$. בדקה: $12\cdot60 = 720\,\text{J}$. עם $R = r = 3\,\Omega$ הזרם $I = \dfrac{12}{6} = 2\,\text{A}$, והכא״מ עושה עבודה בהספק $\varepsilon I = 24\,\text{W}$: הנגד מקבל חצי, והחצי השני מחמם את הסוללה. החצי הזה נכון רק כש-$R = r$, כי רק אז הירידה בתוך הסוללה שווה למתח על הנגד. בדיקה: $R = 2\,\Omega$ ו-$R = 4.5\,\Omega$ נותנים שניהם $11.52\,\text{W}$, פחות מ-$12\,\text{W}$.
      - kind: result
        text: >-
          א. $3\,\Omega$.

          ב. ההספק מרבי כש-$R = r$.

          ג. $12\,\text{W}$, $720\,\text{J}$ בדקה, חצי מהעבודה של הכא״מ.
    source:
      name: British Physics Olympiad (BPhO), Round 1
      year: 2017
      problem: 'Round 1, 17 November 2017, Section 1, Question 1(i)'
      url: https://www.bpho.org.uk/Papers/R1/2017Nov_R1_S1.pdf
      verified: '2026-11-02'
      adapted: true

  - id: W-3.6-c2
    stars: 2
    objectives: [OBJ-3.6-2, OBJ-3.6-3]
    prompt: >-
      שתי סוללות מחוברות במקביל: שני ההדקים החיוביים מחוברים בנקודה A, ושני השליליים בנקודה B. לסוללה 1 כא״מ $\varepsilon_1 = 10\,\text{V}$ והתנגדות פנימית $r_1 = 2\,\Omega$, ולסוללה 2 כא״מ $\varepsilon_2 = 12\,\text{V}$ והתנגדות פנימית $r_2 = 3\,\Omega$. בין A ל-B מחברים נגד $R$, העומס. נסמן ב-$V$ את המתח בין A ל-B, וב-$I$ את הזרם בעומס.

      א. כתבו את הזרם שכל סוללה דוחפת אל A בעזרת $V$. השתמשו בכך שהזרם שנכנס לצומת A שווה לזרם שיוצא ממנו, והראו ששתי הסוללות יחד מתנהגות כמו סוללה אחת: $V = \varepsilon_{\text{eq}} - Ir_{\text{eq}}$. מצאו את $\varepsilon_{\text{eq}}$ ואת $r_{\text{eq}}$.

      ב. $R = 1.2\,\Omega$. מה הזרם בכל סוללה, ומה ההספק בעומס?

      ג. מאיזו התנגדות $R$ ומעלה הזרם בסוללה 1 הפוך, כלומר סוללה 2 דוחפת זרם לתוך ההדק החיובי של סוללה 1? מה הזרם שעובר בין הסוללות כשמנתקים את העומס?
    answer: >-
      א. $\varepsilon_{\text{eq}} = 10.8\,\text{V}$, $r_{\text{eq}} = 1.2\,\Omega$.

      ב. $2.3\,\text{A}$ בסוללה 1, $2.2\,\text{A}$ בסוללה 2, ו-$24.3\,\text{W}$ בעומס.

      ג. מעל $15\,\Omega$; בלי עומס עובר $0.4\,\text{A}$ מסוללה 2 לתוך סוללה 1.
    solution:
      - kind: given
        text: >-
          $\varepsilon_1 = 10\,\text{V}$, $r_1 = 2\,\Omega$; $\varepsilon_2 = 12\,\text{V}$, $r_2 = 3\,\Omega$; שתיהן בין A (חיובי) ל-B (שלילי), והעומס $R$ בין A ל-B.
      - kind: reasoning
        text: >-
          א. הולכים בתוך סוללה 1 מ-B אל A, עם הזרם $I_1$ שהיא דוחפת: הפוטנציאל עולה ב-$\varepsilon_1$ ויורד ב-$I_1r_1$, ולכן $V = \varepsilon_1 - I_1r_1$, כלומר $I_1 = \dfrac{\varepsilon_1 - V}{r_1}$. אותו דבר לסוללה 2. אם יוצא זרם שלילי, הזרם בסוללה הזאת זורם בכיוון ההפוך, אל ההדק החיובי שלה.
      - kind: manipulation
        text: >-
          א. בצומת A: $I_1 + I_2 = I$, כלומר
          $$\frac{\varepsilon_1 - V}{r_1} + \frac{\varepsilon_2 - V}{r_2} = I$$
          מעבירים את האיברים עם $V$ לצד אחד: $V\left(\dfrac{1}{r_1} + \dfrac{1}{r_2}\right) = \dfrac{\varepsilon_1}{r_1} + \dfrac{\varepsilon_2}{r_2} - I$. מחלקים ב-$\dfrac{1}{r_1} + \dfrac{1}{r_2}$ כדי לבודד את $V$:
          $$V = \frac{\varepsilon_1/r_1 + \varepsilon_2/r_2}{1/r_1 + 1/r_2} - I\cdot\frac{1}{1/r_1 + 1/r_2}$$
          זו בדיוק הצורה $V = \varepsilon_{\text{eq}} - Ir_{\text{eq}}$. ההתנגדות $r_{\text{eq}}$ היא $r_1$ ו-$r_2$ במקביל.
      - kind: substitution
        text: >-
          א. $\dfrac{1}{r_1} + \dfrac{1}{r_2} = \dfrac{1}{2} + \dfrac{1}{3} = \dfrac{5}{6}\,\Omega^{-1}$, ולכן $r_{\text{eq}} = \dfrac{6}{5} = 1.2\,\Omega$, ו-$\varepsilon_{\text{eq}} = \dfrac{10/2 + 12/3}{5/6} = 9\cdot\dfrac{6}{5} = 10.8\,\text{V}$.

          ב. $I = \dfrac{10.8}{1.2 + 1.2} = 4.5\,\text{A}$, ו-$V = 10.8 - 4.5\cdot1.2 = 5.4\,\text{V}$. אז $I_1 = \dfrac{10 - 5.4}{2} = 2.3\,\text{A}$ ו-$I_2 = \dfrac{12 - 5.4}{3} = 2.2\,\text{A}$ (בדיקה: $2.3 + 2.2 = 4.5\,\text{A}$). ההספק בעומס $P = VI = 5.4\cdot4.5 = 24.3\,\text{W}$. כאן $R = r_{\text{eq}}$, ולכן לפי האתגר הקודם זה ההספק הגדול ביותר שהזוג יכול להעביר לעומס.
      - kind: manipulation
        text: >-
          ג. $I_1 = 0$ כש-$V = \varepsilon_1 = 10\,\text{V}$. מתח ההדקים של הזוג עם עומס $R$ הוא $V = \dfrac{\varepsilon_{\text{eq}}R}{R + r_{\text{eq}}}$, ולכן
          $$10 = \frac{10.8R}{R + 1.2}$$
          כופלים במכנה: $10R + 12 = 10.8R$, כלומר $0.8R = 12$, ו-$R = 15\,\Omega$. בעומס גדול יותר $V$ גדל מעבר ל-$10\,\text{V}$, ו-$I_1$ שלילי: סוללה 2 דוחפת זרם לתוך סוללה 1.
      - kind: substitution
        text: >-
          ג. בלי עומס $I = 0$, ולכן $V = \varepsilon_{\text{eq}} = 10.8\,\text{V}$. אז $I_2 = \dfrac{12 - 10.8}{3} = 0.4\,\text{A}$ ו-$I_1 = \dfrac{10 - 10.8}{2} = -0.4\,\text{A}$. בדיקה בהליכה סביב הלולאה של שתי הסוללות: $\dfrac{\varepsilon_2 - \varepsilon_1}{r_1 + r_2} = \dfrac{2}{5} = 0.4\,\text{A}$.
      - kind: result
        text: >-
          א. $\varepsilon_{\text{eq}} = 10.8\,\text{V}$, $r_{\text{eq}} = 1.2\,\Omega$.

          ב. $2.3\,\text{A}$, $2.2\,\text{A}$, ו-$24.3\,\text{W}$.

          ג. מעל $15\,\Omega$; בלי עומס $0.4\,\text{A}$ מסוללה 2 לתוך סוללה 1.
