# Workbook, lesson 5.9 (Maxwell's equations as the bridge to "radiation and matter"). Format and rules: see
# .claude/CLAUDE.md, "Worked examples, workbook". Every number was recomputed in this session with
# src/physics/maxwellfour.ts, induction.ts (inducedCircleEmf, inducedFieldStrength), magnetism.ts
# (straightWireField) and constants.ts (MU0; EPS0_DISPLAY = 8.85·10⁻¹², the sheet's ε₀). In a >- block,
# consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '5.9'
practice:
  - id: W-5.9-01
    level: basic
    qualitative: true
    objectives: [OBJ-5.9-1]
    prompt: >-
      לכל אחד מארבעת החוקים של מקסוול ענו:

      א. האם החוק מדבר על משטח סגור או על מסלול סגור?

      ב. מה נמדד בצד שמאל, ומה מופיע בצד ימין?

      ג. באיזה שיעור פגשנו אותו לראשונה?
    answer: >-
      חוק גאוס: משטח סגור; שטף חשמלי, ומטען כלוא חלקי $\varepsilon_0$; שיעור 1.7.

      חוק גאוס למגנטיות: משטח סגור; שטף מגנטי, ואפס; שיעור 5.1.

      חוק פאראדיי: מסלול סגור; סכום של $\vec E$ סביב המסלול, ומינוס קצב השינוי של השטף המגנטי; שיעורים 5.2 ו-5.7.

      חוק אמפר-מקסוול: מסלול סגור; סכום של $\vec B$ סביב המסלול, ו-$\mu_0$ כפול הזרם הכלוא ועוד $\mu_0\varepsilon_0$ כפול קצב השינוי של השטף החשמלי; שיעור 4.4, והתוספת בשיעור 5.9.
    solution:
      - kind: reasoning
        text: >-
          חוק שבצד שמאל שלו $\oint_S \ldots\cdot d\vec A$ מדבר על משטח סגור: אלה שני חוקי גאוס. חוק שבצד שמאל שלו $\oint_C \ldots\cdot d\vec l$ מדבר על מסלול סגור: פאראדיי ואמפר-מקסוול.
      - kind: reasoning
        text: >-
          בחוקי גאוס צד ימין הוא מה שנמצא **בתוך** המשטח: מטען (בשדה חשמלי) או כלום (בשדה מגנטי, כי אין קוטב בודד). בחוקי המסלול צד ימין הוא מה שעובר **דרך** משטח שהמסלול הוא השפה שלו: שטף מגנטי שמשתנה (פאראדיי), או זרם ושטף חשמלי שמשתנה (אמפר-מקסוול).
      - kind: result
        text: >-
          שני חוקי גאוס: משטח סגור, שטף בצד שמאל, מטען כלוא חלקי $\varepsilon_0$ או אפס בצד ימין (שיעורים 1.7 ו-5.1). פאראדיי ואמפר-מקסוול: מסלול סגור, סכום סביב המסלול בצד שמאל, ובצד ימין $-d\Phi_B/dt$ או $\mu_0 I_{\text{in}} + \mu_0\varepsilon_0\,d\Phi_E/dt$ (שיעורים 5.2, 5.7 ו-4.4).

  - id: W-5.9-02
    level: basic
    qualitative: false
    objectives: [OBJ-5.9-1, OBJ-5.9-2]
    prompt: >-
      בתוך קובייה דמיונית יש שלושה מטענים: $+2\,\text{nC}$, $+3\,\text{nC}$ ו-$-8\,\text{nC}$. ליד הקובייה, מחוצה לה, מונח מגנט חזק.

      א. מה השטף החשמלי דרך הקובייה?

      ב. מה השטף המגנטי דרך הקובייה?

      ג. מזיזים את המגנט כך שחציו בתוך הקובייה. מה השתנה בתשובות?
    answer: >-
      א. כ-$-339\,\text{N}\cdot\text{m}^2/\text{C}$ (השטף נכנס).

      ב. אפס.

      ג. שום דבר: השטף החשמלי עדיין $-339\,\text{N}\cdot\text{m}^2/\text{C}$, והמגנטי עדיין אפס.
    solution:
      - kind: given
        text: >-
          בתוך הקובייה: $+2$, $+3$ ו-$-8\,\text{nC}$. $\varepsilon_0 = 8.85\cdot10^{-12}\,\text{C}^2/(\text{N}\cdot\text{m}^2)$.
      - kind: formula
        text: >-
          $\oint \vec E\cdot d\vec A = \dfrac{Q_{\text{in}}}{\varepsilon_0}$ ו-$\oint \vec B\cdot d\vec A = 0$.
      - kind: substitution
        text: >-
          א. $Q_{\text{in}} = 2 + 3 - 8 = -3\,\text{nC}$, ולכן $\Phi_E = \dfrac{-3\cdot10^{-9}}{8.85\cdot10^{-12}} \approx -339\,\text{N}\cdot\text{m}^2/\text{C}$. הסימן מינוס אומר שנטו השדה נכנס לקובייה.
      - kind: reasoning
        text: >-
          ב. השטף המגנטי דרך כל משטח סגור הוא אפס, גם כשמגנט חזק נמצא לידו.

          ג. מגנט אינו טעון, ולכן הוא לא משנה את המטען הכלוא. וגם כשחציו בפנים, קווי השדה שלו שיוצאים מהקובייה נכנסים אליה במקום אחר: השטף המגנטי נשאר אפס.
      - kind: result
        text: >-
          א. כ-$-339\,\text{N}\cdot\text{m}^2/\text{C}$. ב. אפס. ג. שתי התשובות לא משתנות.

  - id: W-5.9-03
    level: basic
    qualitative: false
    objectives: [OBJ-5.9-4]
    prompt: >-
      השתמשו ב-$c = 3\cdot10^{8}\,\text{m/s}$.

      א. תחנת רדיו AM משדרת בתדירות $1\,\text{MHz}$. מה אורך הגל שלה?

      ב. רשת Wi-Fi עובדת בתדירות $5\,\text{GHz}$. מה אורך הגל?

      ג. לאור כתום יש אורך גל של $600\,\text{nm}$. מה התדירות שלו?
    answer: >-
      א. $300\,\text{m}$.

      ב. $6\,\text{cm}$.

      ג. $5\cdot10^{14}\,\text{Hz}$.
    solution:
      - kind: formula
        text: >-
          $c = \lambda f$, ולכן $\lambda = c/f$ ו-$f = c/\lambda$.
      - kind: substitution
        text: >-
          א. $\lambda = \dfrac{3\cdot10^{8}}{10^{6}} = 300\,\text{m}$.

          ב. $\lambda = \dfrac{3\cdot10^{8}}{5\cdot10^{9}} = 0.06\,\text{m} = 6\,\text{cm}$.

          ג. $f = \dfrac{3\cdot10^{8}}{6\cdot10^{-7}} = 5\cdot10^{14}\,\text{Hz}$.
      - kind: result
        text: >-
          א. $300\,\text{m}$. ב. $6\,\text{cm}$. ג. $5\cdot10^{14}\,\text{Hz}$.

  - id: W-5.9-04
    level: mid
    qualitative: true
    objectives: [OBJ-5.9-2]
    prompt: >-
      לכל תופעה קבעו איזה חוק של מקסוול מסביר אותה, ונמקו במשפט.

      א. כיריים אינדוקציה מחממות סיר מתכת: בכיריים זורם זרם חילופין, ובתחתית הסיר נוצרים זרמים.

      ב. בתוך מוליך בשיווי משקל אין שדה חשמלי, ולכן כל המטען העודף של המוליך יושב על פניו (שיעור 1.9).

      ג. במרכז סליל שזורם בו זרם יש שדה מגנטי חזק.

      ד. אנטנה של טלפון קולטת אות מאנטנה רחוקה, בלי חוט ביניהן.
    answer: >-
      א. חוק פאראדיי.

      ב. חוק גאוס.

      ג. חוק אמפר-מקסוול (האיבר של הזרם).

      ד. פאראדיי ואמפר-מקסוול יחד: גל אלקטרומגנטי.
    solution:
      - kind: reasoning
        text: >-
          א. זרם החילופין יוצר שדה מגנטי שמשתנה כל הזמן, ולכן השטף המגנטי דרך תחתית הסיר משתנה. שטף שמשתנה יוצר שדה חשמלי שמסתובב, והוא מניע זרמים במתכת: חוק פאראדיי.

          ב. משטח גאוס שעובר כולו בתוך המוליך, ממש מתחת לפני השטח, נמצא בשדה אפס, ולכן השטף דרכו אפס. לפי חוק גאוס, גם המטען בתוכו אפס: כל המטען העודף מחוץ למשטח, כלומר על פני המוליך.

          ג. זרם יוצר שדה מגנטי שמסתובב סביבו, וכל הכריכות יחד יוצרות שדה חזק בתוך הסליל: חוק אמפר-מקסוול, עם האיבר $\mu_0 I_{\text{in}}$ (שיעור 4.4).

          ד. בין האנטנות אין חוט ואין חומר שמוליך. מה שעובר הוא גל: שדה חשמלי שמשתנה יוצר שדה מגנטי (התוספת של מקסוול), ושדה מגנטי שמשתנה יוצר שדה חשמלי (פאראדיי). באנטנה הקולטת, השדה החשמלי של הגל מניע את האלקטרונים.
      - kind: result
        text: >-
          א. פאראדיי. ב. גאוס. ג. אמפר-מקסוול. ד. פאראדיי ואמפר-מקסוול יחד, בגל אלקטרומגנטי.

  - id: W-5.9-05
    level: mid
    qualitative: false
    objectives: [OBJ-5.9-2]
    prompt: >-
      בליבה של סליל ארוך, ברדיוס $2.5\,\text{cm}$, השדה המגנטי אחיד ויוצא מהדף, ו**קטן** בקצב קבוע של $1.2\,\text{T/s}$. מחוץ לליבה אין שדה מגנטי. משרטטים שני מעגלים שמרכזם על הציר: ברדיוס $1.5\,\text{cm}$ וברדיוס $5\,\text{cm}$.

      א. מה גודל הסכום $\oint \vec E\cdot d\vec l$ סביב כל מעגל?

      ב. מה עוצמת השדה החשמלי המושרה על כל מעגל?

      ג. האם השדה המושרה מקיף את הציר עם כיוון השעון או נגדו? נמקו.
    answer: >-
      א. כ-$8.48\cdot10^{-4}\,\text{V}$ וכ-$2.36\cdot10^{-3}\,\text{V}$.

      ב. $9\cdot10^{-3}\,\text{V/m}$ ו-$7.5\cdot10^{-3}\,\text{V/m}$.

      ג. נגד כיוון השעון.
    solution:
      - kind: given
        text: >-
          $R = 0.025\,\text{m}$, $\left|\dfrac{\Delta B}{\Delta t}\right| = 1.2\,\text{T/s}$, $r_1 = 0.015\,\text{m}$, $r_2 = 0.05\,\text{m}$.
      - kind: formula
        text: >-
          $\oint \vec E\cdot d\vec l = -\dfrac{\Delta\Phi_B}{\Delta t}$, ו-$\Phi_B = B\cdot A$, כאשר $A$ הוא השטח שבו יש שדה מגנטי. מהסימטריה $|\oint \vec E\cdot d\vec l| = E\cdot2\pi r$.
      - kind: substitution
        text: >-
          א. המעגל הקטן כולו בליבה: $\pi\cdot0.015^2\cdot1.2 \approx 8.48\cdot10^{-4}\,\text{V}$. המעגל הגדול מקיף את כל הליבה, ולכן השטח הוא $\pi R^2$: $\pi\cdot0.025^2\cdot1.2 \approx 2.36\cdot10^{-3}\,\text{V}$.
      - kind: manipulation
        text: >-
          ב. מחלקים את הסכום באורך המעגל: $E = \dfrac{|\oint \vec E\cdot d\vec l|}{2\pi r}$.
      - kind: substitution
        text: >-
          $E_1 = \dfrac{8.48\cdot10^{-4}}{2\pi\cdot0.015} = 9\cdot10^{-3}\,\text{V/m}$, $E_2 = \dfrac{2.36\cdot10^{-3}}{2\pi\cdot0.05} = 7.5\cdot10^{-3}\,\text{V/m}$.
      - kind: reasoning
        text: >-
          ג. הולכים נגד כיוון השעון, והאנך יוצא מהדף. השטף חיובי ו**קטן**, ולכן $-\Delta\Phi_B/\Delta t$ חיובי, והשדה פונה בכיוון ההליכה: נגד כיוון השעון. בדיקה בחוק לנץ: זרם נגד כיוון השעון היה יוצר שדה מגנטי שיוצא מהדף, ומנסה להשלים את השדה שקטן.
      - kind: result
        text: >-
          א. כ-$8.48\cdot10^{-4}\,\text{V}$ וכ-$2.36\cdot10^{-3}\,\text{V}$. ב. $9\cdot10^{-3}$ ו-$7.5\cdot10^{-3}\,\text{V/m}$. ג. נגד כיוון השעון.

  - id: W-5.9-06
    level: mid
    qualitative: false
    objectives: [OBJ-5.9-3]
    prompt: >-
      לוחות של קבל הם בשטח של $0.03\,\text{m}^2$ כל אחד. ברגע מסוים הקבל נטען בזרם של $0.6\,\text{A}$. הניחו שהשדה בין הלוחות אחיד.

      א. באיזה קצב גדל השדה החשמלי בין הלוחות?

      ב. מה זרם ההעתקה דרך משטח שחוצה את כל הרווח?

      ג. מה השדה המגנטי במרחק $15\,\text{cm}$ מהתיל שמוביל לקבל?
    answer: >-
      א. כ-$2.26\cdot10^{12}\,\text{V}/(\text{m}\cdot\text{s})$.

      ב. $0.6\,\text{A}$.

      ג. $8\cdot10^{-7}\,\text{T}$.
    solution:
      - kind: given
        text: >-
          $A = 0.03\,\text{m}^2$, $I = 0.6\,\text{A}$, $r = 0.15\,\text{m}$.
      - kind: formula
        text: >-
          $E = \dfrac{q}{\varepsilon_0 A}$, וזרם ההעתקה $\varepsilon_0\,\dfrac{\Delta\Phi_E}{\Delta t}$ עם $\Phi_E = EA$. השדה של תיל ישר $B = \dfrac{\mu_0 I}{2\pi r}$.
      - kind: manipulation
        text: >-
          $\varepsilon_0$ ו-$A$ קבועים, ולכן השדה גדל בקצב $\dfrac{\Delta E}{\Delta t} = \dfrac{1}{\varepsilon_0 A}\,\dfrac{\Delta q}{\Delta t} = \dfrac{I}{\varepsilon_0 A}$.
      - kind: substitution
        text: >-
          א. $\dfrac{\Delta E}{\Delta t} = \dfrac{0.6}{8.85\cdot10^{-12}\cdot0.03} \approx 2.26\cdot10^{12}\,\text{V}/(\text{m}\cdot\text{s})$.

          ב. $\varepsilon_0\,\dfrac{\Delta\Phi_E}{\Delta t} = \varepsilon_0 A\,\dfrac{\Delta E}{\Delta t} = I = 0.6\,\text{A}$.

          ג. $B = \dfrac{4\pi\cdot10^{-7}\cdot0.6}{2\pi\cdot0.15} = 8\cdot10^{-7}\,\text{T}$.
      - kind: result
        text: >-
          א. כ-$2.26\cdot10^{12}\,\text{V}/(\text{m}\cdot\text{s})$. ב. $0.6\,\text{A}$. ג. $8\cdot10^{-7}\,\text{T}$.

  - id: W-5.9-07
    level: mid
    qualitative: true
    objectives: [OBJ-5.9-3]
    prompt: >-
      קבל מחובר בטור לנגד ולסוללה, ובזמן $t = 0$ סוגרים את המתג. בשיעור 3.9 ראיתם שהזרם במעגל כזה הכי גדול מיד אחרי הסגירה, ודועך לאפס.

      א. מתי השדה המגנטי בין הלוחות הכי חזק: מיד אחרי סגירת המתג, או אחרי זמן רב? נמקו.

      ב. מתי השדה **החשמלי** בין הלוחות הכי חזק? האם זה סותר את סעיף א?

      ג. מחליפים את הסוללה במקור של מתח חילופין. האם יהיה שדה מגנטי בין הלוחות גם אחרי זמן רב? נמקו.
    answer: >-
      א. מיד אחרי סגירת המתג.

      ב. אחרי זמן רב. אין סתירה: השדה המגנטי תלוי בקצב השינוי של השדה החשמלי, לא בגודלו.

      ג. כן: השדה החשמלי ממשיך להשתנות כל הזמן, ולכן יש זרם העתקה, ושדה מגנטי שמתחלף.
    solution:
      - kind: reasoning
        text: >-
          א. זרם ההעתקה בין הלוחות שווה בכל רגע לזרם בתיל, $\varepsilon_0\,\Delta\Phi_E/\Delta t = I$. הזרם הכי גדול מיד אחרי הסגירה, ולכן גם זרם ההעתקה והשדה המגנטי שהוא יוצר.
      - kind: reasoning
        text: >-
          ב. השדה החשמלי ביחס ישר למטען על הלוחות, והמטען הכי גדול כשהקבל מלא, אחרי זמן רב. אז הוא כבר לא משתנה, וזרם ההעתקה אפס. מיד אחרי הסגירה המצב הפוך: השדה החשמלי כמעט אפס, אבל גדל הכי מהר. השדה המגנטי נקבע לפי קצב השינוי.
      - kind: reasoning
        text: >-
          ג. במתח חילופין המטען על הלוחות עולה ויורד כל הזמן, ולכן גם השדה החשמלי ביניהם. זרם ההעתקה לא דועך, ובכל רגע הוא שווה לזרם בתיל. כך "עובר" זרם חילופין דרך קבל, אף ששום מטען לא חוצה את הרווח.
      - kind: result
        text: >-
          א. מיד אחרי הסגירה. ב. אחרי זמן רב, בלי סתירה. ג. כן, שדה מגנטי שמתחלף כל הזמן.

  - id: W-5.9-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-5.9-1, OBJ-5.9-3]
    prompt: >-
      תיל ישר מביא זרם של $3\,\text{A}$ לקבל שנטען. סביב התיל, לפני הקבל, משרטטים מעגל ברדיוס $2\,\text{cm}$.

      א. מה השדה המגנטי על המעגל, ומה הסכום $\oint \vec B\cdot d\vec l$ סביבו?

      ב. על המעגל פורשים שקית שעוקפת את הלוח ומסתיימת בין הלוחות, כך שהתיל לא חוצה אותה. מה הזרם של מטענים דרך השקית?

      ג. לפי חוק אמפר-מקסוול, באיזה קצב חייב להשתנות השטף החשמלי דרך השקית?

      ד. מה היה מנבא חוק אמפר בלי התוספת של מקסוול, אם מחשבים אותו דרך השקית?
    answer: >-
      א. $3\cdot10^{-5}\,\text{T}$, וסכום של כ-$3.77\cdot10^{-6}\,\text{T}\cdot\text{m}$.

      ב. אפס.

      ג. כ-$3.39\cdot10^{11}\,\text{N}\cdot\text{m}^2/(\text{C}\cdot\text{s})$.

      ד. אפס, בסתירה לסעיף א.
    solution:
      - kind: given
        text: >-
          $I = 3\,\text{A}$, $r = 0.02\,\text{m}$, $\mu_0 = 4\pi\cdot10^{-7}\,\text{T}\cdot\text{m/A}$, $\varepsilon_0 = 8.85\cdot10^{-12}\,\text{C}^2/(\text{N}\cdot\text{m}^2)$.
      - kind: formula
        text: >-
          $B = \dfrac{\mu_0 I}{2\pi r}$, ו-$\oint \vec B\cdot d\vec l = \mu_0 I_{\text{in}} + \mu_0\varepsilon_0\,\dfrac{\Delta\Phi_E}{\Delta t}$.
      - kind: substitution
        text: >-
          א. $B = \dfrac{4\pi\cdot10^{-7}\cdot3}{2\pi\cdot0.02} = 3\cdot10^{-5}\,\text{T}$, ו-$\oint \vec B\cdot d\vec l = B\cdot2\pi r = \mu_0 I \approx 3.77\cdot10^{-6}\,\text{T}\cdot\text{m}$.
      - kind: reasoning
        text: >-
          ב. התיל נגמר בלוח, שבתוך השקית, ולכן הוא לא חוצה אותה. בין הלוחות לא עובר מטען. הזרם של מטענים דרך השקית הוא אפס.
      - kind: manipulation
        text: >-
          ג. צד שמאל לא תלוי במשטח, ולכן דרך השקית $\mu_0\varepsilon_0\,\dfrac{\Delta\Phi_E}{\Delta t} = \mu_0 I$. מחלקים ב-$\mu_0\varepsilon_0$: $\dfrac{\Delta\Phi_E}{\Delta t} = \dfrac{I}{\varepsilon_0}$.
      - kind: substitution
        text: >-
          $\dfrac{\Delta\Phi_E}{\Delta t} = \dfrac{3}{8.85\cdot10^{-12}} \approx 3.39\cdot10^{11}\,\text{N}\cdot\text{m}^2/(\text{C}\cdot\text{s})$.
      - kind: reasoning
        text: >-
          ד. בלי התוספת, צד ימין דרך השקית הוא $\mu_0\cdot0 = 0$, ואילו השדה האמיתי נותן $3.77\cdot10^{-6}\,\text{T}\cdot\text{m}$: החוק הישן סותר את עצמו.
      - kind: result
        text: >-
          א. $3\cdot10^{-5}\,\text{T}$; $3.77\cdot10^{-6}\,\text{T}\cdot\text{m}$. ב. אפס. ג. כ-$3.39\cdot10^{11}\,\text{N}\cdot\text{m}^2/(\text{C}\cdot\text{s})$. ד. אפס.

  - id: W-5.9-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-5.9-4]
    prompt: >-
      א. חשבו מתוך $\mu_0$ ו-$\varepsilon_0$ שבדף הנוסחאות את מהירות הגל האלקטרומגנטי בריק.

      ב. המרחק מהשמש לכדור הארץ הוא $1.5\cdot10^{11}\,\text{m}$. כמה זמן לוקח לאור להגיע אלינו?

      ג. אות GPS משודר בתדירות $1.575\,\text{GHz}$. מה אורך הגל שלו?

      ד. מה היה משתנה במהירות האור, אילו $\mu_0$ היה גדול פי 4 ($\varepsilon_0$ ללא שינוי)?
    answer: >-
      א. $3.00\cdot10^{8}\,\text{m/s}$.

      ב. $500\,\text{s}$, כשמונה דקות ועשרים שניות.

      ג. כ-$19.0\,\text{cm}$.

      ד. היא הייתה קטנה פי 2, ל-$1.5\cdot10^{8}\,\text{m/s}$.
    solution:
      - kind: formula
        text: >-
          $c = \dfrac{1}{\sqrt{\mu_0\varepsilon_0}}$, $t = \dfrac{d}{c}$, $\lambda = \dfrac{c}{f}$.
      - kind: substitution
        text: >-
          א. $\mu_0\varepsilon_0 = 4\pi\cdot10^{-7}\cdot8.85\cdot10^{-12} \approx 1.112\cdot10^{-17}\,\text{s}^2/\text{m}^2$, ולכן $c = \dfrac{1}{\sqrt{1.112\cdot10^{-17}}} \approx 3.00\cdot10^{8}\,\text{m/s}$.

          ב. $t = \dfrac{1.5\cdot10^{11}}{3\cdot10^{8}} = 500\,\text{s}$.

          ג. $\lambda = \dfrac{3\cdot10^{8}}{1.575\cdot10^{9}} \approx 0.190\,\text{m}$.
      - kind: reasoning
        text: >-
          ד. $c$ הפוך לשורש של $\mu_0$. אם $\mu_0$ גדל פי 4, השורש גדל פי $\sqrt4 = 2$, והמהירות קטנה פי 2: $1.5\cdot10^{8}\,\text{m/s}$.
      - kind: result
        text: >-
          א. $3.00\cdot10^{8}\,\text{m/s}$. ב. $500\,\text{s}$. ג. כ-$19.0\,\text{cm}$. ד. קטנה פי 2.

  - id: W-5.9-10
    level: bagrut
    qualitative: true
    objectives: [OBJ-5.9-2, OBJ-5.9-4]
    prompt: >-
      א. בריק אין מטען ואין זרם. אילו איברים במשוואות מקסוול נעלמים שם, ואילו שני חוקים נשארים עם צד ימין ששונה מאפס?

      ב. הסבירו במילים איך שני החוקים האלה מאפשרים לגל אלקטרומגנטי להתקדם בריק בלי שום חומר.

      ג. נניח שמקסוול לא היה מוסיף את האיבר שלו לחוק אמפר. האם עדיין היו גלים אלקטרומגנטיים? נמקו.

      ד. תלמיד אומר: "בגל, כשהשדה החשמלי בשיא, השדה המגנטי אפס, כי הם מתחלפים". האם הוא צודק?
    answer: >-
      א. $Q_{\text{in}}$ ו-$I_{\text{in}}$ נעלמים; נשארים פאראדיי והאיבר של מקסוול בחוק אמפר-מקסוול.

      ב. שדה מגנטי שמשתנה יוצר שדה חשמלי, ושדה חשמלי שמשתנה יוצר שדה מגנטי, וכך ההפרעה מתקדמת.

      ג. לא: בלי התוספת, שדה חשמלי שמשתנה לא יוצר שדה מגנטי, והשרשרת נקטעת.

      ד. לא: בגל השדות מגיעים לשיא יחד.
    solution:
      - kind: reasoning
        text: >-
          א. בחוק גאוס $Q_{\text{in}} = 0$, ובחוק אמפר-מקסוול $I_{\text{in}} = 0$. בחוק גאוס למגנטיות צד ימין אפס ממילא. נשארים $\oint \vec E\cdot d\vec l = -\dfrac{d\Phi_B}{dt}$ ו-$\oint \vec B\cdot d\vec l = \mu_0\varepsilon_0\,\dfrac{d\Phi_E}{dt}$.
      - kind: reasoning
        text: >-
          ב. אם במקום כלשהו השדה החשמלי משתנה, נוצר סביבו שדה מגנטי, שגם הוא משתנה. השדה המגנטי שמשתנה יוצר סביבו, קצת הלאה, שדה חשמלי שמשתנה, וכן הלאה. כל אחד מהשדות נוצר מהשינוי של השני, ולכן הם לא צריכים מטענים, זרמים או חומר. מה שמתקדם הוא תבנית של שדות, במהירות $c = 1/\sqrt{\mu_0\varepsilon_0}$.
      - kind: reasoning
        text: >-
          ג. בלי התוספת, בריק $\oint \vec B\cdot d\vec l = 0$ סביב כל מסלול: שדה חשמלי שמשתנה לא יוצר שדה מגנטי. השדה המגנטי של הגל לא היה נוצר, ולא היה שדה מגנטי שמשתנה כדי ליצור את השדה החשמלי הבא. השרשרת נקטעת, ואין גל. המהירות $c$ עצמה יוצאת מהמכפלה $\mu_0\varepsilon_0$, ו-$\varepsilon_0$ נכנס לחוק דרך התוספת.
      - kind: reasoning
        text: >-
          ד. לא. השדה המגנטי נוצר מקצב השינוי של השדה החשמלי **בסביבה**, לא מהערך שלו בנקודה אחת. בגל שמתקדם, השדה החשמלי והשדה המגנטי מגיעים לשיא באותה נקודה ובאותו רגע, כמו שרואים באיור 5.9ב.
      - kind: result
        text: >-
          א. נשארים פאראדיי והאיבר של מקסוול. ב. כל שדה נוצר מהשינוי של השני. ג. לא היו גלים. ד. התלמיד טועה: השדות באותו מופע.

challenge:
  - id: W-5.9-c1
    stars: 1
    objectives: [OBJ-5.9-3]
    prompt: >-
      בין הלוחות של קבל לוחות מקבילים נוצר זרם העתקה של $4.425\,\mu\text{A}$, בזמן שהמתח על הקבל משתנה בקצב של $10^{6}\,\text{V/s}$. השטח של כל לוח הוא $40\,\text{cm}^2$, וביניהם ריק.

      א. מה המרחק בין הלוחות?

      ב. מה הזרם בתילים שמובילים לקבל באותו רגע?

      ג. מה השדה המגנטי במרחק $10\,\text{cm}$ מאחד התילים?
    answer: >-
      א. $8\,\text{mm}$.

      ב. $4.425\,\mu\text{A}$.

      ג. כ-$8.85\cdot10^{-12}\,\text{T}$.
    solution:
      - kind: given
        text: >-
          $I_d = 4.425\cdot10^{-6}\,\text{A}$, $\dfrac{\Delta V}{\Delta t} = 10^{6}\,\text{V/s}$, $A = 40\cdot10^{-4}\,\text{m}^2 = 4\cdot10^{-3}\,\text{m}^2$, $\varepsilon_0 = 8.85\cdot10^{-12}\,\text{C}^2/(\text{N}\cdot\text{m}^2)$.
      - kind: formula
        text: >-
          בין הלוחות $E = V/d$, ולכן $\Phi_E = EA = \dfrac{VA}{d}$, וזרם ההעתקה $I_d = \varepsilon_0\,\dfrac{\Delta\Phi_E}{\Delta t} = \dfrac{\varepsilon_0 A}{d}\,\dfrac{\Delta V}{\Delta t}$. (זה גם $C\,\Delta V/\Delta t$, עם $C = \varepsilon_0 A/d$ של שיעור 2.6.)
      - kind: manipulation
        text: >-
          א. מכפילים את שני האגפים ב-$d$ ומחלקים ב-$I_d$: $d = \dfrac{\varepsilon_0 A}{I_d}\,\dfrac{\Delta V}{\Delta t}$.
      - kind: substitution
        text: >-
          $d = \dfrac{8.85\cdot10^{-12}\cdot4\cdot10^{-3}\cdot10^{6}}{4.425\cdot10^{-6}} = 8\cdot10^{-3}\,\text{m}$.
      - kind: reasoning
        text: >-
          ב. זרם ההעתקה בין הלוחות שווה בכל רגע לזרם שמביא את המטען ללוח: $I = 4.425\,\mu\text{A}$.
      - kind: substitution
        text: >-
          ג. $B = \dfrac{\mu_0 I}{2\pi r} = \dfrac{4\pi\cdot10^{-7}\cdot4.425\cdot10^{-6}}{2\pi\cdot0.1} \approx 8.85\cdot10^{-12}\,\text{T}$, פחות ממיליונית של השדה של כדור הארץ. לכן קשה כל כך למדוד את השדה של זרם ההעתקה.
      - kind: result
        text: >-
          א. $8\,\text{mm}$. ב. $4.425\,\mu\text{A}$. ג. כ-$8.85\cdot10^{-12}\,\text{T}$.
    source:
      name: JEE Main (NTA)
      year: 2022
      problem: '29 June 2022, Evening Shift (Shift 2): the plate separation x·10⁻³ m from a displacement current of 4.425 μA at 10⁶ V/s, plates of 40 cm²; parts (b) and (c) added'
      url: https://questions.examside.com/past-years/jee/question/pthe-displacement-current-of-4425-mua-is-developed-i-jee-main-physics-motion-vpq0mhcevpnpfoyt
      verified: '2026-11-05'
      adapted: true

  - id: W-5.9-c2
    stars: 2
    objectives: [OBJ-5.9-2, OBJ-5.9-3]
    prompt: >-
      קליפה כדורית עבה, עם רדיוס פנימי $a$ ורדיוס חיצוני $b$, עשויה מחומר שמוליך מעט מאוד: ההתנגדות הסגולית שלו $\rho = 10^{12}\,\Omega\cdot\text{m}$ (שיעור 3.3). במרכז הקליפה, בחלל הריק, מוחזק מטען נקודתי $q_0$. בזמן $t = 0$ כל החומר של הקליפה ניטרלי, גם הפנים וגם החוץ. עם הזמן נאסף על הפנים הפנימיים של הקליפה מטען $-Q(t)$, ועל הפנים החיצוניים $+Q(t)$, והחומר עצמו נשאר ניטרלי.

      א. בעזרת חוק גאוס, מצאו את השדה החשמלי בתוך החומר, במרחק $r$ מהמרכז ($a < r < b$), בזמן שהמטען על הפנים הפנימיים הוא $-Q$.

      ב. צפיפות הזרם בחומר היא $J = E/\rho$ (שיעור 3.3: $I = V/R$ ו-$R = \rho L/A$ נותנים זרם ליחידת שטח $E/\rho$). הראו שהזרם הכולל שזורם החוצה דרך כדור ברדיוס $r$ בתוך החומר הוא $I = \dfrac{q_0 - Q}{\varepsilon_0\,\rho}$, בלי תלות ב-$r$.

      ג. הזרם הזה הוא קצב הגידול של $Q$. זו אותה משוואה כמו בטעינת קבל דרך נגד (שיעור 3.9), עם קבוע זמן $\tau = \varepsilon_0\rho$. כתבו את $Q(t)$, ומצאו את $\tau$, את $Q$ כש-$t = \tau$, ואת הזמן שבו $Q = q_0/2$.

      ד. בחומר זורם זרם בכל הכיוונים החוצה. מהסימטריה, השדה המגנטי שהוא יוצר חייב להיות אפס. הראו בעזרת חוק אמפר-מקסוול שאין כאן סתירה: מה עושה זרם ההעתקה דרך משטח בתוך החומר?
    answer: >-
      א. $E = \dfrac{k\,(q_0 - Q)}{r^2}$, החוצה.

      ב. $I = 4\pi r^2\,\dfrac{E}{\rho} = \dfrac{q_0 - Q}{\varepsilon_0\rho}$.

      ג. $Q(t) = q_0\left(1 - e^{-t/\tau}\right)$; $\tau = 8.85\,\text{s}$; $Q(\tau) \approx 0.632\,q_0$; $Q = q_0/2$ אחרי כ-$6.13\,\text{s}$.

      ד. השדה החשמלי בחומר קטן, וזרם ההעתקה שווה לזרם בגודלו והפוך לו בכיוון: הסכום אפס, ולכן $B = 0$.
    solution:
      - kind: given
        text: >-
          $\rho = 10^{12}\,\Omega\cdot\text{m}$; מטען $q_0$ במרכז; $-Q$ על הפנים הפנימיים; $\varepsilon_0 = 8.85\cdot10^{-12}\,\text{C}^2/(\text{N}\cdot\text{m}^2)$, $k = \dfrac{1}{4\pi\varepsilon_0}$.
      - kind: reasoning
        text: >-
          א. משטח גאוס כדורי ברדיוס $r$ בתוך החומר מקיף את $q_0$ ואת $-Q$ שעל הפנים הפנימיים; החומר שביניהם ניטרלי. מהסימטריה השדה רדיאלי ושווה בגודלו על המשטח: $E\cdot4\pi r^2 = \dfrac{q_0 - Q}{\varepsilon_0}$, ולכן $E = \dfrac{q_0 - Q}{4\pi\varepsilon_0 r^2} = \dfrac{k\,(q_0 - Q)}{r^2}$.
      - kind: manipulation
        text: >-
          ב. הזרם דרך הכדור הוא צפיפות הזרם כפול השטח: $I = J\cdot4\pi r^2 = \dfrac{E}{\rho}\cdot4\pi r^2 = \dfrac{q_0 - Q}{4\pi\varepsilon_0 r^2\,\rho}\cdot4\pi r^2 = \dfrac{q_0 - Q}{\varepsilon_0\rho}$. ה-$r^2$ מצטמצם: כל מה שזורם דרך כדור אחד זורם גם דרך הבא, כי החומר לא צובר מטען.
      - kind: reasoning
        text: >-
          ג. הזרם מביא מטען אל הפנים החיצוניים, ולכן $\dfrac{\Delta Q}{\Delta t} = \dfrac{q_0 - Q}{\tau}$ עם $\tau = \varepsilon_0\rho$. בטעינת קבל, $\dfrac{\Delta q}{\Delta t} = \dfrac{C\varepsilon - q}{RC}$, והפתרון $q = C\varepsilon\left(1 - e^{-t/RC}\right)$. כאן $q_0$ במקום $C\varepsilon$ ו-$\tau$ במקום $RC$: $Q(t) = q_0\left(1 - e^{-t/\tau}\right)$.
      - kind: substitution
        text: >-
          $\tau = 8.85\cdot10^{-12}\cdot10^{12} = 8.85\,\text{s}$. ב-$t = \tau$: $Q = q_0(1 - e^{-1}) \approx 0.632\,q_0$. $Q = q_0/2$ כש-$e^{-t/\tau} = \tfrac12$, כלומר $t = \tau\ln2 \approx 8.85\cdot0.693 \approx 6.13\,\text{s}$.
      - kind: reasoning
        text: >-
          ד. ניקח מסלול מעגלי בתוך החומר, ועליו משטח: כיפה של הכדור ברדיוס $r$. דרך הכיפה עובר החוצה חלק מזרם המטענים. אבל השדה החשמלי בחומר, $\dfrac{k(q_0 - Q)}{r^2}$, **קטן** כש-$Q$ גדל, ולכן השטף החשמלי דרך הכיפה קטן, וזרם ההעתקה דרכה פונה **פנימה**. דרך כל הכדור: $\Phi_E = \dfrac{q_0 - Q}{\varepsilon_0}$, ולכן $\varepsilon_0\,\dfrac{\Delta\Phi_E}{\Delta t} = -\dfrac{\Delta Q}{\Delta t} = -I$. בכל חלק של הכדור זרם ההעתקה מבטל בדיוק את זרם המטענים, ולכן צד ימין של חוק אמפר-מקסוול אפס, ו-$B = 0$, כמו שהסימטריה דורשת. בלי התוספת של מקסוול, החוק היה דורש שדה מגנטי סביב הזרם, שהסימטריה אוסרת.
      - kind: result
        text: >-
          א. $E = k(q_0 - Q)/r^2$. ב. $I = (q_0 - Q)/(\varepsilon_0\rho)$. ג. $Q = q_0(1 - e^{-t/\tau})$, $\tau = 8.85\,\text{s}$, $Q(\tau) \approx 0.632\,q_0$, וחצי אחרי כ-$6.13\,\text{s}$. ד. זרם ההעתקה מבטל את זרם המטענים, ו-$B = 0$.
    source:
      name: USAPhO Semifinal Exam (AAPT)
      year: 2010
      problem: 'Part A, Question A2: a resistive spherical shell around a point charge, the charge on the outer surface as a function of time; part (d), on the Ampère–Maxwell law, added'
      url: https://www.aapt.org/physicsteam/2019/upload/USAPhO-2010-Solutions.pdf
      verified: '2026-11-05'
      adapted: true
