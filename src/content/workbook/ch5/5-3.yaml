# Workbook, lesson 5.3 (Lenz's law, eddy currents, forces on a loop). Format and rules: see .claude/CLAUDE.md,
# "Worked examples, workbook". Every number was recomputed with npx tsx against src/physics (constants.ts G = 10,
# MU0; calculus.ts riemann for the challenge's heat integral).
# Directions: the signed law of induction.ts; the face of a loop from which the current looks anticlockwise is its N pole (4.3).
# In a >- block, consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '5.3'
practice:
  - id: W-5.3-01
    level: basic
    qualitative: true
    objectives: [OBJ-5.3-1, OBJ-5.3-3]
    prompt: >-
      סליל ארוך מונח אופקית על השולחן, וקצותיו מחוברים זה לזה דרך נורה קטנה. דוחפים לתוך הקצה הימני של הסליל את הקוטב **הדרומי** של מגנט מוט.

      א. איזה קוטב נוצר בקצה הימני של הסליל?

      ב. מה כיוון הזרם בכריכות, כשמסתכלים על הסליל מימין?
    answer: >-
      א. קוטב דרומי.

      ב. עם כיוון השעון.
    solution:
      - kind: reasoning
        text: >-
          המגנט מתקרב, ולכן השטף דרך הסליל גדל. לפי חוק לנץ הסליל מתנגד להתקרבות, ולכן בקצה שפונה אל המגנט נוצר קוטב זהה לקוטב שלו, שדוחה אותו: דרומי.
      - kind: reasoning
        text: >-
          לפי שיעור 4.3, הקצה שממנו הזרם נראה עם כיוון השעון הוא הקוטב הדרומי. בדיקה במתכון: השדה של המגנט בתוך הסליל מצביע ימינה, אל הקוטב הדרומי שלו, והשטף ימינה גדל. השדה המושרה שמאלה, ובמבט מימין האגודל מצביע הרחק מכם: האצבעות עם כיוון השעון.
      - kind: result
        text: >-
          א. דרומי, ולכן הסליל דוחה את המגנט. ב. עם כיוון השעון, במבט מימין.

  - id: W-5.3-02
    level: basic
    qualitative: false
    objectives: [OBJ-5.3-1]
    prompt: >-
      סליל של 200 כריכות, ששטח כל כריכה $4\,\text{cm}^2$, מחובר לנגד, וההתנגדות הכוללת של המעגל $8\,\Omega$. השדה המגנטי לאורך הציר של הסליל, ימינה, גדל בקצב אחיד מ-$0.1\,\text{T}$ ל-$0.5\,\text{T}$ במשך $0.2\,\text{s}$.

      א. מה גודל הכא״מ המושרה ומה גודל הזרם?

      ב. מה כיוון השדה המגנטי של הזרם המושרה בתוך הסליל?
    answer: >-
      א. $0.16\,\text{V}$, $0.02\,\text{A}$.

      ב. שמאלה.
    solution:
      - kind: given
        text: >-
          $N = 200$, $A = 4\,\text{cm}^2 = 4\cdot10^{-4}\,\text{m}^2$, $\Delta B = 0.5 - 0.1 = 0.4\,\text{T}$, $\Delta t = 0.2\,\text{s}$, $R = 8\,\Omega$.
      - kind: formula
        text: >-
          $|\varepsilon| = N\,\dfrac{|\Delta\Phi|}{\Delta t} = N\,\dfrac{A\,|\Delta B|}{\Delta t}$, ו-$I = \dfrac{|\varepsilon|}{R}$.
      - kind: substitution
        text: >-
          $|\varepsilon| = 200\cdot\dfrac{4\cdot10^{-4}\cdot0.4}{0.2} = 0.16\,\text{V}$, ו-$I = \dfrac{0.16}{8} = 0.02\,\text{A}$.
      - kind: reasoning
        text: >-
          השטף ימינה גדל, ולכן השדה המושרה מתנגד לגידול: בתוך הסליל הוא מצביע שמאלה.
      - kind: result
        text: >-
          א. $0.16\,\text{V}$ ו-$0.02\,\text{A}$. ב. שמאלה, נגד השדה שגדל.

  - id: W-5.3-03
    level: basic
    qualitative: true
    objectives: [OBJ-5.3-3]
    prompt: >-
      טבעת אלומיניום מושחלת על מוט אופקי חלק, שעליו היא יכולה להחליק בלי חיכוך. מקרבים אל הטבעת מגנט, לאורך המוט, ואחרי רגע עוצרים את המגנט ומחזיקים אותו במקום.

      א. לאן נעה הטבעת בזמן שהמגנט מתקרב?

      ב. מה פועל על הטבעת אחרי שהמגנט נעצר, ומה היא עושה?
    answer: >-
      א. הרחק מהמגנט.

      ב. כוח מגנטי שמושך אותה אחורה, אל המגנט. היא ממשיכה להתרחק, אבל מאטה, עד שהיא כמעט נעצרת.
    solution:
      - kind: reasoning
        text: >-
          א. המגנט מתקרב, השטף דרך הטבעת גדל, והצד שלה שפונה אל המגנט הופך לקוטב זהה לקוטב שלו. הטבעת נדחית ומתחילה לנוע הרחק מהמגנט.
      - kind: reasoning
        text: >-
          ב. כשהמגנט נעצר, השטף דרך הטבעת עדיין משתנה, כי היא עצמה מתרחקת. אבל ההתרחקות מקטינה את השטף, ולכן הכוח עכשיו מושך את הטבעת אחורה, נגד התנועה **היחסית**. לכן הטבעת לא ממשיכה במהירות קבועה: היא מאטה. ככל שהיא מתרחקת והמהירות שלה קטנה, הכוח נחלש, ולכן היא לא חוזרת אל המגנט אלא מאטה והולכת. (בטבעת בלי חיכוך, הדחיפה שהיא קיבלה כשהמגנט התקרב נלקחת ממנה כמעט כולה בזמן שהיא מתרחקת, והיא כמעט נעצרת.)
      - kind: result
        text: >-
          א. הרחק מהמגנט. ב. כוח מגנטי שמושך אותה אחורה, נגד ההתרחקות: הטבעת מאטה עד שהיא כמעט נעצרת, ולא ממשיכה במהירות קבועה.

  - id: W-5.3-04
    level: mid
    qualitative: true
    objectives: [OBJ-5.3-1, OBJ-5.3-3]
    prompt: >-
      תיל ישר וארוך מונח אופקית במישור הדף, וזורם בו זרם ימינה. מתחת לתיל, באותו מישור, מונחת מסגרת מלבנית מוליכה. מגדילים את הזרם בתיל.

      א. מה כיוון הזרם המושרה במסגרת, כפי שאתם רואים את הדף?

      ב. האם המסגרת נמשכת אל התיל או נדחית ממנו? נמקו בשתי דרכים: בחוק לנץ, ובכוחות בין זרמים מקבילים (שיעור 4.9).
    answer: >-
      א. נגד כיוון השעון.

      ב. נדחית מהתיל.
    solution:
      - kind: reasoning
        text: >-
          א. לפי כלל יד ימין, מתחת לתיל שהזרם בו ימינה השדה מצביע לתוך הדף, ⊗. הזרם גדל, ולכן השטף לתוך הדף גדל. השדה המושרה מתנגד לגידול: בתוך המסגרת הוא החוצה מהדף, ⊙. האגודל אליכם, והאצבעות נגד כיוון השעון.
      - kind: reasoning
        text: >-
          ב. בחוק לנץ: המסגרת מתנגדת לגידול בשטף. אם היא תתרחק מהתיל, לאזור שבו השדה חלש יותר, השטף שלה יגדל פחות. לכן הכוח עליה מרחיק אותה.
      - kind: reasoning
        text: >-
          בכוחות בין זרמים: הזרם נגד כיוון השעון זורם בצלע העליונה של המסגרת **שמאלה**, נגד הזרם בתיל, ולכן היא נדחית; בצלע התחתונה הוא זורם ימינה, עם הזרם בתיל, ולכן היא נמשכת. הצלע העליונה קרובה יותר לתיל, ולכן הדחייה חזקה יותר. הכוחות על הצלעות האנכיות שווים והפוכים.
      - kind: result
        text: >-
          א. נגד כיוון השעון. ב. המסגרת נדחית מהתיל.

  - id: W-5.3-05
    level: mid
    qualitative: false
    objectives: [OBJ-5.3-2]
    prompt: >-
      דוחפים מגנט במהירות קבועה דרך סליל, וקצות הסליל מחוברים לנגד. ההתנגדות הכוללת של המעגל $3\,\Omega$. במשך $0.5\,\text{s}$ הכא״מ המושרה בסליל הוא בערך קבוע, $0.06\,\text{V}$, ובזמן הזה המגנט עובר $10\,\text{cm}$.

      א. כמה חום מתפתח במעגל?

      ב. כמה עבודה השקעתם נגד הכוח המגנטי, ומה גודלו הממוצע של הכוח הזה?

      ג. מה משתנה אם מנתקים את הנגד, כך שהמעגל פתוח?
    answer: >-
      א. $6\cdot10^{-4}\,\text{J}$.

      ב. $6\cdot10^{-4}\,\text{J}$; כוח של $6\cdot10^{-3}\,\text{N}$.

      ג. אין זרם, אין חום, ואין כוח שצריך להתגבר עליו.
    solution:
      - kind: given
        text: >-
          $\varepsilon = 0.06\,\text{V}$, $R = 3\,\Omega$, $\Delta t = 0.5\,\text{s}$, $d = 0.1\,\text{m}$, מהירות קבועה.
      - kind: formula
        text: >-
          הספק החום $P = \dfrac{\varepsilon^2}{R}$ (שיעור 3.4), והחום $Q = P\,\Delta t$. במהירות קבועה אנרגיית התנועה לא משתנה, ולכן $W = Q$, ו-$W = F\cdot d$.
      - kind: substitution
        text: >-
          א. $P = \dfrac{0.06^2}{3} = 1.2\cdot10^{-3}\,\text{W}$, ו-$Q = 1.2\cdot10^{-3}\cdot0.5 = 6\cdot10^{-4}\,\text{J}$.

          ב. $W = 6\cdot10^{-4}\,\text{J}$. מחלקים את שני האגפים של $W = F\cdot d$ ב-$d$: $F = \dfrac{6\cdot10^{-4}}{0.1} = 6\cdot10^{-3}\,\text{N}$.
      - kind: reasoning
        text: >-
          ג. במעגל פתוח עדיין נוצר כא״מ בין קצות הסליל, אבל אין זרם. בלי זרם אין חום, והסליל לא מפעיל כוח על המגנט.
      - kind: result
        text: >-
          א. $6\cdot10^{-4}\,\text{J}$. ב. $6\cdot10^{-4}\,\text{J}$, כוח ממוצע $6\cdot10^{-3}\,\text{N}$ נגד התנועה. ג. אין זרם, אין חום ואין כוח מגנטי.

  - id: W-5.3-06
    level: mid
    qualitative: true
    objectives: [OBJ-5.3-2]
    prompt: >-
      שני סלילים זהים ואנכיים. הקצוות של הסליל הראשון מחוברים לנורה קטנה, והקצוות של השני לא מחוברים לשום דבר. מפילים שני מגנטים זהים, מאותו גובה, כל אחד דרך סליל אחר.

      א. איזה מגנט מגיע לרצפה במהירות גדולה יותר? נמקו.

      ב. מאיפה באה האנרגיה שהנורה פולטת?
    answer: >-
      א. המגנט שעובר בסליל הפתוח.

      ב. מאנרגיית התנועה של המגנט: הוא מגיע לרצפה לאט יותר.
    solution:
      - kind: reasoning
        text: >-
          א. בסליל שמחובר לנורה זורם זרם מושרה. לפי חוק לנץ הוא דוחה את המגנט כשהוא מתקרב ומושך אותו כשהוא מתרחק, ושני הכוחות מאטים אותו. בסליל הפתוח אין זרם ואין כוח, והמגנט נופל נפילה חופשית.
      - kind: reasoning
        text: >-
          ב. שני המגנטים מאבדים אותה אנרגיה פוטנציאלית. בסליל הפתוח כולה הופכת לאנרגיית תנועה. בסליל הסגור חלק ממנה הופך לאור ולחום בנורה ובתילים, ולכן נשארת פחות אנרגיית תנועה.
      - kind: result
        text: >-
          א. המגנט שבסליל הפתוח. ב. מהאנרגיה הפוטנציאלית של המגנט: חלק ממנה הופך לאור ולחום במקום לאנרגיית תנועה.

  - id: W-5.3-07
    level: mid
    qualitative: false
    objectives: [OBJ-5.3-4]
    prompt: >-
      מגנט שמסתו $25\,\text{g}$ נופל בצינור אלומיניום אנכי, והמהירות הסופית שלו $8\,\text{cm/s}$. כוח הבלימה ביחס ישר למהירות, ואין חיכוך עם הדפנות.

      א. מה הקבוע $k$ בנוסחה $F = kv$?

      ב. דוחפים את המגנט בעזרת מוט דק **למעלה** בתוך הצינור, במהירות קבועה של $4\,\text{cm/s}$. באיזה כוח צריך לדחוף?

      ג. בדקו את התשובה בעזרת אנרגיה: לאן הולך ההספק שאתם משקיעים?
    answer: >-
      א. $k \approx 3.1\,\text{kg/s}$.

      ב. $0.375\,\text{N}$, למעלה.

      ג. $0.015\,\text{W}$: $0.010\,\text{W}$ לאנרגיה פוטנציאלית ו-$0.005\,\text{W}$ לחום בצינור.
    solution:
      - kind: given
        text: >-
          $m = 0.025\,\text{kg}$, $v_T = 0.08\,\text{m/s}$, $v = 0.04\,\text{m/s}$ למעלה, $g = 10\,\text{m/s}^2$.
      - kind: formula
        text: >-
          במהירות הסופית $kv_T = mg$. כוח הבלימה תמיד נגד התנועה: כשהמגנט עולה, הוא פועל למטה, יחד עם המשקל.
      - kind: manipulation
        text: >-
          א. מחלקים ב-$v_T$: $k = \dfrac{mg}{v_T}$. ב. במהירות קבועה הכוח השקול אפס, ולכן הכוח שהמוט מפעיל הוא $F = mg + kv$.
      - kind: substitution
        text: >-
          א. $k = \dfrac{0.025\cdot10}{0.08} = 3.125\,\text{kg/s}$.

          ב. $F = 0.25 + 3.125\cdot0.04 = 0.25 + 0.125 = 0.375\,\text{N}$.

          ג. $P = F\cdot v = 0.375\cdot0.04 = 0.015\,\text{W}$. מזה $mgv = 0.25\cdot0.04 = 0.010\,\text{W}$ הופכים לאנרגיה פוטנציאלית, ו-$kv^2 = 3.125\cdot0.04^2 = 0.005\,\text{W}$ לחום.
      - kind: result
        text: >-
          א. $k \approx 3.1\,\text{kg/s}$. ב. $0.375\,\text{N}$ למעלה: יותר מהמשקל, כי הבלימה מתנגדת גם לעלייה. ג. $0.015\,\text{W} = 0.010\,\text{W} + 0.005\,\text{W}$.

  - id: W-5.3-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-5.3-4, OBJ-5.3-2]
    prompt: >-
      מגנט שמסתו $15\,\text{g}$ מופל לצינור נחושת אנכי באורך $1.5\,\text{m}$. כמעט כל הדרך הוא נופל במהירות קבועה של $5\,\text{cm/s}$.

      א. בערך כמה זמן לוקח לו לעבור את הצינור?

      ב. בערך כמה חום מתפתח בצינור בזמן הזה? איזה חלק מהאנרגיה הפוטנציאלית הוא לא חום?

      ג. מחליפים את הצינור בצינור נחושת שהדופן שלו עבה פי 2, וכוח הבלימה בכל מהירות גדל פי 2. מה המהירות הסופית עכשיו, וכמה זמן לוקחת הנפילה?

      ד. כמה זמן הייתה לוקחת הנפילה בצינור פלסטיק באותו אורך?
    answer: >-
      א. כ-$30\,\text{s}$.

      ב. כ-$0.225\,\text{J}$; רק אנרגיית התנועה בסוף, כ-$1.9\cdot10^{-5}\,\text{J}$, אינה חום.

      ג. $2.5\,\text{cm/s}$, כ-$60\,\text{s}$.

      ד. כ-$0.55\,\text{s}$.
    solution:
      - kind: given
        text: >-
          $m = 0.015\,\text{kg}$, $h = 1.5\,\text{m}$, $v_T = 0.05\,\text{m/s}$, $g = 10\,\text{m/s}^2$.
      - kind: substitution
        text: >-
          א. $t \approx \dfrac{h}{v_T} = \dfrac{1.5}{0.05} = 30\,\text{s}$.

          ב. האנרגיה הפוטנציאלית שהמגנט מאבד: $mgh = 0.015\cdot10\cdot1.5 = 0.225\,\text{J}$. בסוף נשארת לו אנרגיית תנועה $\tfrac12 m v_T^2 = \tfrac12\cdot0.015\cdot0.05^2 \approx 1.9\cdot10^{-5}\,\text{J}$, וכל השאר הוא חום.
      - kind: reasoning
        text: >-
          ג. במהירות הסופית $kv_T = mg$, ולכן $v_T = \dfrac{mg}{k}$. כש-$k$ גדל פי 2, $v_T$ קטנה פי 2: $2.5\,\text{cm/s}$. הנפילה לוקחת פי 2 זמן: $\dfrac{1.5}{0.025} = 60\,\text{s}$.
      - kind: formula
        text: >-
          ד. בפלסטיק אין זרמים מושרים: נפילה חופשית מנוחה, $h = \tfrac12 g t^2$, ולכן $t = \sqrt{\dfrac{2h}{g}}$.
      - kind: substitution
        text: >-
          $t = \sqrt{\dfrac{2\cdot1.5}{10}} \approx 0.55\,\text{s}$.
      - kind: result
        text: >-
          א. כ-$30\,\text{s}$. ב. כ-$0.225\,\text{J}$ חום; רק כ-$1.9\cdot10^{-5}\,\text{J}$ נשארים כאנרגיית תנועה. ג. $2.5\,\text{cm/s}$ וכ-$60\,\text{s}$. ד. כ-$0.55\,\text{s}$.

  - id: W-5.3-09
    level: bagrut
    qualitative: true
    objectives: [OBJ-5.3-3, OBJ-5.3-1]
    prompt: >-
      שני סלילים שטוחים תלויים זה מול זה על חוטים, והציר שלהם משותף. סליל A מחובר לסוללה דרך מפסק פתוח. הקצוות של סליל B מחוברים זה לזה דרך נגד.

      א. סוגרים את המפסק. האם הסלילים נמשכים זה לזה או נדחים? האם הזרם ב-B זורם עם הזרם ב-A או נגדו (באותו כיוון סיבוב, כשמסתכלים מאותו צד)?

      ב. המפסק נשאר סגור דקה שלמה. מה הכוח בין הסלילים?

      ג. פותחים את המפסק. ענו שוב על השאלות של סעיף א.

      ד. מה משתנה אם מחליפים את הנגד של סליל B בחוט שאינו מחובר בקצה אחד?
    answer: >-
      א. נדחים; הזרם ב-B נגד הזרם ב-A.

      ב. אין כוח.

      ג. נמשכים; הזרם ב-B עם הזרם ב-A.

      ד. אין זרם ב-B, ובשום שלב אין כוח.
    solution:
      - kind: reasoning
        text: >-
          א. הזרם ב-A עולה מאפס, והשטף שלו דרך B גדל. לפי חוק לנץ הזרם ב-B יוצר שדה נגד השדה של A, ולכן הוא מסתובב בכיוון ההפוך. בצד של B שפונה אל A נוצר קוטב זהה לקוטב של A שמולו, והסלילים נדחים. אותה מסקנה משיעור 4.9: זרמים מנוגדים דוחים זה את זה.
      - kind: reasoning
        text: >-
          ב. הזרם ב-A קבוע, והשטף דרך B לא משתנה. אין זרם מושרה ב-B, ולכן אין כוח בין הסלילים.
      - kind: reasoning
        text: >-
          ג. הזרם ב-A יורד לאפס, והשטף דרך B קטן. הזרם ב-B מנסה להשלים את השדה החסר, ולכן הוא מסתובב באותו כיוון כמו הזרם ב-A. זרמים באותו כיוון מושכים: הסלילים נמשכים.
      - kind: reasoning
        text: >-
          ד. כש-B פתוח נוצר בו כא״מ, אבל לא זורם בו זרם. בלי זרם הוא לא יוצר שדה, ואין כוח בשום שלב.
      - kind: result
        text: >-
          א. נדחים, והזרם ב-B נגד הזרם ב-A. ב. אין כוח. ג. נמשכים, והזרם ב-B עם הזרם ב-A. ד. אין זרם ב-B ואין כוח.

  - id: W-5.3-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-5.3-4]
    prompt: >-
      לוח נחושת שמסתו $0.2\,\text{kg}$ תלוי כמטוטלת, ומתנדנד דרך הרווח שבין הקטבים של מגנט חזק, שנמצא בנקודה הנמוכה של התנודה. משחררים את הלוח ממנוחה, $5\,\text{cm}$ מעל הנקודה הנמוכה ביותר שלו. הזניחו את התנגדות האוויר ואת החיכוך בציר.

      א. אחרי כמה תנודות הלוח נעצר בנקודה הנמוכה. כמה חום התפתח בלוח?

      ב. מחליפים את הלוח בלוח מחורץ באותה מסה. אחרי התנודה הראשונה הוא מגיע לגובה $4.5\,\text{cm}$. כמה אנרגיה הפכה לחום בתנודה הזו?

      ג. למה הלוח המחורץ מאבד אנרגיה לאט יותר?

      ד. באיזו תנודה הלוח השלם מאבד הכי הרבה אנרגיה: בראשונה או באחרונות? נמקו.
    answer: >-
      א. $0.1\,\text{J}$.

      ב. $0.01\,\text{J}$.

      ג. החריצים קוטעים את מסלולי הזרם.

      ד. בראשונה, כשהמהירות הכי גדולה.
    solution:
      - kind: given
        text: >-
          $m = 0.2\,\text{kg}$, $h_0 = 0.05\,\text{m}$, $h_1 = 0.045\,\text{m}$ (הלוח המחורץ), $g = 10\,\text{m/s}^2$.
      - kind: formula
        text: >-
          אין חיכוך ואין התנגדות אוויר, ולכן כל האנרגיה המכנית שהלוח מאבד הופכת לחום בזרמי הערבולת: $Q = mg\,\Delta h$.
      - kind: substitution
        text: >-
          א. הלוח נעצר בנקודה הנמוכה, ולכן איבד את כל האנרגיה הפוטנציאלית: $Q = 0.2\cdot10\cdot0.05 = 0.1\,\text{J}$.

          ב. $Q = 0.2\cdot10\cdot(0.05 - 0.045) = 0.01\,\text{J}$.
      - kind: reasoning
        text: >-
          ג. זרמי הערבולת זורמים בלוח במסלולים סגורים. החריצים קוטעים את המסלולים הגדולים, ולכן הזרמים חלשים, החום קטן, והבלימה חלשה.

          ד. כוח הבלימה ביחס ישר למהירות, והמהירות בתנודה הראשונה היא הגדולה ביותר. לכן בתנודה הראשונה הכוח והחום הם הגדולים ביותר, ובתנודות האחרונות, כשהלוח איטי, הבלימה חלשה.
      - kind: result
        text: >-
          א. $0.1\,\text{J}$. ב. $0.01\,\text{J}$. ג. החריצים קוטעים את מסלולי זרמי הערבולת. ד. בראשונה.

challenge:
  - id: W-5.3-c1
    stars: 1
    objectives: [OBJ-5.3-1, OBJ-5.3-3]
    prompt: >-
      תיל ישר וארוך מונח אנכית במישור הדף, וזורם בו זרם קבוע **למעלה**. שתי כריכות קטנות מונחות באותו מישור, אחת משמאל לתיל ואחת מימינו. מרחיקים את שתיהן מהתיל באותה מהירות: את השמאלית שמאלה, ואת הימנית ימינה.

      א. מה כיוון הזרם המושרה בכל אחת מהכריכות, כפי שאתם רואים את הדף?

      ב. האם התיל מושך כל כריכה, או דוחה אותה? נמקו.

      ג. מזיזים את הכריכות במקביל לתיל, למעלה, ולא מרחיקים אותן ממנו. מה הזרם בהן?
    answer: >-
      א. בשמאלית נגד כיוון השעון, בימנית עם כיוון השעון.

      ב. מושך את שתיהן.

      ג. אין זרם.
    solution:
      - kind: reasoning
        text: >-
          א. לפי כלל יד ימין, כשהזרם למעלה השדה מימין לתיל לתוך הדף, ⊗, ומשמאל לו החוצה מהדף, ⊙. כשהכריכות מתרחקות השדה בהן נחלש, והשטף קטן. השדה המושרה מנסה להשלים את החסר: בימנית לתוך הדף, ולכן הזרם עם כיוון השעון; בשמאלית החוצה מהדף, ולכן נגד כיוון השעון.
      - kind: reasoning
        text: >-
          ב. בחוק לנץ: כל כריכה מתנגדת להתרחקות, ולכן נמשכת אל התיל. בדיקה בשיעור 4.9: בכריכה הימנית, עם כיוון השעון, הזרם בצלע הקרובה לתיל זורם למעלה, כמו בתיל, ולכן נמשך. בצלע הרחוקה הוא זורם למטה ונדחה, אבל השדה שם חלש יותר. בכריכה השמאלית, נגד כיוון השעון, הזרם בצלע הימנית, הקרובה לתיל, זורם גם הוא למעלה.
      - kind: reasoning
        text: >-
          ג. השדה של התיל תלוי רק במרחק ממנו. תנועה במקביל לתיל לא משנה את השטף, ולכן אין כא״מ ואין זרם.
      - kind: result
        text: >-
          א. שמאלית: נגד כיוון השעון; ימנית: עם כיוון השעון. ב. התיל מושך את שתיהן. ג. אין זרם.
    source:
      name: PhysicsBowl (AAPT)
      year: 2016
      problem: 'Question 47: two small loops moved away from a long wire with current up the page (official answer C); with added parts (b) and (c)'
      url: https://aapt.org/Programs/PhysicsBowl/upload/PhysicsBowl_2016.pdf
      verified: '2026-11-05'
      adapted: true

  - id: W-5.3-c2
    stars: 2
    objectives: [OBJ-5.3-2, OBJ-5.3-4, OBJ-5.3-1]
    prompt: >-
      ניסוי מחשבתי. נניח שקיים חלקיק דמיוני שנושא **מטען מגנטי** $q_m$, שיוצר סביבו שדה מגנטי רדיאלי, $B = \dfrac{\mu_0}{4\pi}\dfrac{q_m}{r^2}$, כמו השדה החשמלי של מטען נקודתי, ומקבל בשדה מגנטי כוח $F = q_m B$ בכיוון השדה. חלקיק שמסתו $m$ נע על מסילה חלקה ומבודדת בצורת U. בתחתית המסילה, שם היא כמעט ישרה, היא עוברת דרך מרכז כריכה שרדיוסה $b$. הכריכה עשויה מתיל שרדיוסו $a \ll b$ והתנגדותו הסגולית $\rho$. משחררים את החלקיק ממנוחה, בגובה $H$ מעל התחתית, והוא עובר דרך הכריכה הלוך ושוב פעמים רבות עד שהוא נעצר. הזניחו את ההשראות העצמית של הכריכה.

      א. כשהחלקיק במרחק $x$ ממרכז הכריכה, על הציר, השטף דרכה הוא $\Phi = \dfrac{\mu_0 q_m}{2}\left(1 - \dfrac{x}{\sqrt{b^2+x^2}}\right)$, כאשר $x$ גדל בכיוון התנועה. הסבירו בעזרת הנוסחה שהזרם בכריכה זורם **באותו כיוון** לאורך כל המעבר, ולא מתהפך כמו במגנט מוט שעובר דרך טבעת. למה בכל זאת הכריכה מאטה את החלקיק גם כשהוא מתקרב וגם כשהוא מתרחק?

      ב. כשהחלקיק נע במהירות $v$, הכא״מ בכריכה הוא $\varepsilon = \dfrac{\mu_0 q_m v\, b^2}{2(b^2+x^2)^{3/2}}$. הסבירו, בלי לחשב, למה החום שמתפתח בכריכה במעבר אחד ביחס ישר ל-$v$.

      ג. אפשר להראות שהחום במעבר אחד הוא $Q = \dfrac{3\pi\mu_0^2 q_m^2 a^2}{64\rho b^2}\,v$. במעבר אחד המהירות משתנה מעט. מצאו את השינוי במהירות, $\Delta v$, והראו שהוא לא תלוי במהירות.

      ד. כמה פעמים עובר החלקיק דרך הכריכה עד שהוא נעצר? ומה משתנה אם משחררים אותו מגובה גדול פי 4?
    answer: >-
      א. השטף רק קטן לאורך כל המעבר, ולכן לכא״מ סימן אחד. הקוטב שהכריכה מפנה אל החלקיק מתהפך כשהוא עובר אותה, ולכן לפני המעבר היא דוחה אותו ואחריו מושכת אותו.

      ב. $\varepsilon \propto v$, ההספק $\varepsilon^2/R \propto v^2$, ומשך המעבר $\propto 1/v$.

      ג. $\Delta v = -\dfrac{3\pi\mu_0^2 q_m^2 a^2}{64\rho b^2 m}$.

      ד. $N = \dfrac{64\sqrt{2gH}\,\rho b^2 m}{3\pi\mu_0^2 q_m^2 a^2}$; מגובה פי 4, פי 2 מעברים.
    solution:
      - kind: reasoning
        text: >-
          א. ככל ש-$x$ גדל, המנה $x/\sqrt{b^2+x^2}$ גדלה כל הזמן, מ-$-1$ (רחוק לפני הכריכה) ל-$+1$ (רחוק אחריה), ולכן $\Phi$ רק **קטן** לאורך כל המעבר. לפי חוק פאראדיי הכא״מ $-\Delta\Phi/\Delta t$ חיובי לאורך כל המעבר: הזרם לא מתהפך. (במגנט מוט השטף עולה ואחר כך יורד, ולכן הזרם מתהפך.)
      - kind: reasoning
        text: >-
          זרם בכיוון אחד הופך את הכריכה למגנט שטוח עם קוטב צפוני בצד אחד ודרומי בצד השני. לפני המעבר החלקיק מול צד אחד, ואחריו מול הצד השני. לפי חוק לנץ הזרם מתנגד לתנועה: לפני המעבר הצד שמולו דוחה אותו, ואחרי המעבר הצד השני, בעל הקוטב ההפוך, מושך אותו אחורה. שני הכוחות מאטים.
      - kind: reasoning
        text: >-
          ב. בכל מקום $x$ הכא״מ ביחס ישר ל-$v$, ולכן הספק החום $P = \varepsilon^2/R$ ביחס ישר ל-$v^2$. המעבר דרך האזור שבו יש כא״מ, כמה רדיוסים $b$ לפני הכריכה ואחריה, לוקח זמן ביחס ישר ל-$1/v$. החום הוא ההספק כפול הזמן: $Q \propto v^2\cdot\dfrac{1}{v} = v$.
      - kind: formula
        text: >-
          ג. החום בא מאנרגיית התנועה: $\Delta K = -Q$. כשהשינוי קטן, $\Delta K = \tfrac12 m(v+\Delta v)^2 - \tfrac12 m v^2 \approx m v\,\Delta v$ (מזניחים את $(\Delta v)^2$).
      - kind: manipulation
        text: >-
          $m v\,\Delta v = -\dfrac{3\pi\mu_0^2 q_m^2 a^2}{64\rho b^2}\,v$. מחלקים את שני האגפים ב-$mv$: $\Delta v = -\dfrac{3\pi\mu_0^2 q_m^2 a^2}{64\rho b^2 m}$. המהירות $v$ התבטלה: בכל מעבר המהירות קטנה באותו שיעור.
      - kind: substitution
        text: >-
          ד. בתחתית, בפעם הראשונה, $v_0 = \sqrt{2gH}$ (שימור אנרגיה). כל מעבר מוריד $|\Delta v|$ קבוע, ולכן $N = \dfrac{v_0}{|\Delta v|} = \dfrac{64\sqrt{2gH}\,\rho b^2 m}{3\pi\mu_0^2 q_m^2 a^2}$. מגובה פי 4, $v_0$ גדלה פי $\sqrt4 = 2$, ולכן גם $N$.
      - kind: result
        text: >-
          ג. $\Delta v = -\dfrac{3\pi\mu_0^2 q_m^2 a^2}{64\rho b^2 m}$, בלי תלות ב-$v$. ד. $N = \dfrac{64\sqrt{2gH}\,\rho b^2 m}{3\pi\mu_0^2 q_m^2 a^2}$, ומגובה פי 4 החלקיק עובר פי 2 פעמים.
    source:
      name: USAPhO Semifinal Exam (AAPT)
      year: 2012
      problem: 'Part B, Question B2 (magnetic monopole on a U-shaped track through a wire loop), parts a to d; the flux, the emf and the heat per pass are given as data, with added qualitative parts'
      url: https://aapt.org/physicsteam/2019/upload/USAPhO-2012-Solutions.pdf
      verified: '2026-11-05'
      adapted: true
