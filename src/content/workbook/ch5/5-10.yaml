# Workbook, lesson 5.10 (the electromagnetic wave, the bridge to "radiation and matter"). Format and rules: see
# .claude/CLAUDE.md, "Worked examples, workbook". Every number was recomputed in this session with
# src/physics/maxwellfour.ts (waveSpeed, travelTime, vacuumWavelength, vacuumFrequency, bandOf) and constants.ts
# (MU0; EPS0_DISPLAY = 8.85·10⁻¹², the sheet's ε₀). W-5.10-01, -08 and -09 came from lesson 5.9 (W-5.9-03, -09,
# -10). In a >- block, consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '5.10'
practice:
  - id: W-5.10-01
    level: basic
    qualitative: false
    objectives: [OBJ-5.10-3]
    prompt: >-
      השתמשו ב-$c = 3\cdot10^{8}\,\text{m/s}$.

      א. תחנת רדיו AM משדרת בתדירות $1\,\text{MHz}$. מה אורך הגל שלה?

      ב. רשת Wi-Fi עובדת בתדירות $5\,\text{GHz}$. מה אורך הגל?

      ג. לאור כתום יש אורך גל של $600\,\text{nm}$. מה התדירות שלו?
    answer: >-
      א. $300\,\text{m}$.

      ב. $6\,\text{cm}$.

      ג. $5\cdot10^{14}\,\text{Hz}$.
    solution:
      - kind: formula
        text: >-
          $c = \lambda f$, ולכן $\lambda = c/f$ ו-$f = c/\lambda$.
      - kind: substitution
        text: >-
          א. $\lambda = \dfrac{3\cdot10^{8}}{10^{6}} = 300\,\text{m}$.

          ב. $\lambda = \dfrac{3\cdot10^{8}}{5\cdot10^{9}} = 0.06\,\text{m} = 6\,\text{cm}$.

          ג. $f = \dfrac{3\cdot10^{8}}{6\cdot10^{-7}} = 5\cdot10^{14}\,\text{Hz}$.
      - kind: result
        text: >-
          א. $300\,\text{m}$. ב. $6\,\text{cm}$. ג. $5\cdot10^{14}\,\text{Hz}$.

  - id: W-5.10-02
    level: basic
    qualitative: true
    objectives: [OBJ-5.10-1]
    prompt: >-
      גל אלקטרומגנטי מתקדם צפונה, לאורך הקרקע. ברגע מסוים, בנקודה A, השדה החשמלי שלו מצביע מזרח.

      א. באיזה כיוון יכול להצביע השדה המגנטי בנקודה A? נמקו.

      ב. בנקודה אחרת, B, השדה החשמלי באותו רגע אפס. מה השדה המגנטי ב-B?

      ג. תלמידה אומרת: "השדה החשמלי מצביע מזרח, ולכן משהו בגל זז מזרחה". האם היא צודקת?
    answer: >-
      א. אנכי (ובדיוק: למטה).

      ב. אפס.

      ג. לא. החץ של השדה הוא גודל בנקודה, לא תנועה; מה שמתקדם, צפונה, הוא התבנית של השדות.
    solution:
      - kind: reasoning
        text: >-
          א. בגל אלקטרומגנטי השדה המגנטי ניצב לשדה החשמלי, ולכן הוא לא מזרח-מערב. הוא גם ניצב לכיוון ההתקדמות, ולכן הוא לא צפון-דרום. נשאר רק הכיוון האנכי. מבין שני הכיוונים האנכיים, הכיוון נקבע: באיור 5.10א, בגל שנע ימינה, כשהשדה החשמלי למעלה השדה המגנטי יוצא מהדף. נסובב את התמונה כך שימינה יהיה צפונה, ולמעלה בדף יהיה מזרחה: אז "יוצא מהדף" הוא למטה. (בשיעור 6.14, שמעבר לבגרות, תראו שזה הכלל שהמכפלה הווקטורית $\vec E\times\vec B$ פונה בכיוון ההתקדמות.)
      - kind: reasoning
        text: >-
          ב. בגל שמתקדם שני השדות באותו שלב של המחזור בכל נקודה: הם מגיעים לאפס, לשיא ולשפל יחד. ב-B השדה החשמלי אפס, ולכן גם השדה המגנטי.
      - kind: reasoning
        text: >-
          ג. החץ מראה את כיוון השדה החשמלי בנקודה: לאיזה כיוון הוא היה דוחף מטען חיובי שנמצא שם. שום דבר חומרי בגל לא זז, לא מזרחה ולא צפונה. מה שמתקדם צפונה, במהירות $c$, הוא התבנית של השדות.
      - kind: result
        text: >-
          א. אנכי, למטה. ב. אפס. ג. לא: החץ הוא ערך השדה בנקודה, ושום דבר לא זז מזרחה.

  - id: W-5.10-03
    level: basic
    qualitative: false
    objectives: [OBJ-5.10-2]
    prompt: >-
      השתמשו ב-$c = 3\cdot10^{8}\,\text{m/s}$.

      א. המרחק לירח הוא $3.84\cdot10^{8}\,\text{m}$. כמה זמן לוקח לאור שמוחזר מהירח להגיע אלינו?

      ב. המרחק לשמש הוא $1.5\cdot10^{11}\,\text{m}$. כמה זמן לוקח לאור השמש להגיע אלינו?

      ג. מחשב מבצע פעולה אחת בכל ננו-שנייה, $10^{-9}\,\text{s}$. כמה מטרים עובר אות חשמלי, שנע לכל היותר במהירות האור, בזמן כזה?
    answer: >-
      א. $1.28\,\text{s}$.

      ב. $500\,\text{s}$, כשמונה דקות ועשרים שניות.

      ג. לכל היותר $0.3\,\text{m}$, שלושים סנטימטרים.
    solution:
      - kind: formula
        text: >-
          $d = ct$, ולכן $t = \dfrac{d}{c}$.
      - kind: substitution
        text: >-
          א. $t = \dfrac{3.84\cdot10^{8}}{3\cdot10^{8}} = 1.28\,\text{s}$.

          ב. $t = \dfrac{1.5\cdot10^{11}}{3\cdot10^{8}} = 500\,\text{s}$.

          ג. $d = 3\cdot10^{8}\cdot10^{-9} = 0.3\,\text{m}$.
      - kind: result
        text: >-
          א. $1.28\,\text{s}$. ב. $500\,\text{s}$. ג. $0.3\,\text{m}$.

  - id: W-5.10-04
    level: mid
    qualitative: false
    objectives: [OBJ-5.10-3]
    prompt: >-
      לכל אחד מאורכי הגל מצאו את התדירות, וקבעו לאיזה תחום בספקטרום הגל שייך: $1\,\text{km}$, $10\,\text{cm}$, $10\,\mu\text{m}$, $500\,\text{nm}$, $0.1\,\text{nm}$.
    answer: >-
      $3\cdot10^{5}\,\text{Hz}$, גלי רדיו; $3\cdot10^{9}\,\text{Hz}$, מיקרוגל; $3\cdot10^{13}\,\text{Hz}$, תת-אדום; $6\cdot10^{14}\,\text{Hz}$, אור נראה; $3\cdot10^{18}\,\text{Hz}$, קרני רנטגן.
    solution:
      - kind: formula
        text: >-
          $c = \lambda f$, ולכן $f = \dfrac{c}{\lambda}$, עם $\lambda$ במטרים.
      - kind: substitution
        text: >-
          $\dfrac{3\cdot10^{8}}{10^{3}} = 3\cdot10^{5}\,\text{Hz}$; $\dfrac{3\cdot10^{8}}{0.1} = 3\cdot10^{9}\,\text{Hz}$; $\dfrac{3\cdot10^{8}}{10^{-5}} = 3\cdot10^{13}\,\text{Hz}$; $\dfrac{3\cdot10^{8}}{5\cdot10^{-7}} = 6\cdot10^{14}\,\text{Hz}$; $\dfrac{3\cdot10^{8}}{10^{-10}} = 3\cdot10^{18}\,\text{Hz}$.
      - kind: reasoning
        text: >-
          התחומים לפי אורך הגל (הגבולות מקובלים, לא חדים): מעל מטר בערך גלי רדיו; ממילימטר עד מטר מיקרוגל; מ-$700\,\text{nm}$ עד מילימטר תת-אדום; מ-$400$ עד $700\,\text{nm}$ אור נראה; קצר מזה על-סגול, ואחריו, מתחת לכ-$10\,\text{nm}$, קרני רנטגן.
      - kind: result
        text: >-
          רדיו ($3\cdot10^{5}\,\text{Hz}$), מיקרוגל ($3\cdot10^{9}$), תת-אדום ($3\cdot10^{13}$), אור נראה ($6\cdot10^{14}$), רנטגן ($3\cdot10^{18}\,\text{Hz}$).

  - id: W-5.10-05
    level: mid
    qualitative: true
    objectives: [OBJ-5.10-4]
    prompt: >-
      לרדיו נייד יש אנטנה: מוט מתכת ישר שאפשר להטות. התחנה משדרת מאנטנה אנכית.

      א. כשמטים את המוט עד שהוא אופקי, הקליטה נחלשת מאוד. הסבירו למה.

      ב. בזמן שהרדיו קולט, האם אלקטרונים מהתחנה נכנסים למוט? מה כן קורה לאלקטרונים במוט?

      ג. התחנה משדרת בתדירות $95\,\text{MHz}$. באיזו תדירות מתנודד הזרם במוט?

      ד. ברדיו אחר האנטנה היא לולאה של תיל. לפי איזה חוק נוצר בה כא״מ, ואיך כדאי להעמיד אותה?
    answer: >-
      א. השדה החשמלי של הגל אנכי, ומוט אופקי ניצב לו: השדה לא דוחף את האלקטרונים לאורך המוט.

      ב. לא. האלקטרונים שכבר במוט נעים הלוך ושוב לאורכו.

      ג. $95\,\text{MHz}$.

      ד. חוק פאראדיי. כך שהשדה המגנטי של הגל, האופקי, יהיה ניצב למישור הלולאה: הלולאה עומדת, והקו אל התחנה מונח במישור שלה.
    solution:
      - kind: reasoning
        text: >-
          א. האנטנה המשדרת אנכית, והמטענים בה נעים למעלה ולמטה, ולכן גם השדה החשמלי של הגל אנכי. הכוח על אלקטרון במוט הוא לאורך השדה. כשהמוט אנכי, הכוח דוחף את האלקטרונים לאורכו ונוצר זרם; כשהמוט אופקי, הכוח ניצב למוט, והאלקטרונים לא יכולים לזרום לאורכו.
      - kind: reasoning
        text: >-
          ב. שום מטען לא עובר מהתחנה לרדיו: הגל הוא שדות. השדה החשמלי של הגל מגיע למוט ומניע הלוך ושוב את האלקטרונים שבו.
      - kind: reasoning
        text: >-
          ג. השדה החשמלי של הגל מתהפך באותה תדירות שבה הזרם מתהפך באנטנה המשדרת, ולכן גם הזרם במוט: $95\,\text{MHz}$.
      - kind: reasoning
        text: >-
          ד. השדה המגנטי של הגל משתנה, ולכן השטף המגנטי דרך הלולאה משתנה, ולפי חוק פאראדיי נוצר בה כא״מ. השדה המגנטי ניצב לשדה החשמלי (האנכי) ולכיוון ההתקדמות, ולכן הוא אופקי וניצב לקו אל התחנה. השטף הכי גדול כשהשדה ניצב למישור הלולאה ($\cos\theta = 1$): הלולאה עומדת, והקו אל התחנה מונח במישור שלה.
      - kind: result
        text: >-
          א. מוט אופקי ניצב לשדה החשמלי. ב. לא; האלקטרונים במוט מתנודדים. ג. $95\,\text{MHz}$. ד. חוק פאראדיי; הלולאה עומדת, והקו אל התחנה במישור שלה.

  - id: W-5.10-06
    level: mid
    qualitative: false
    objectives: [OBJ-5.10-2]
    prompt: >-
      במצפה כוכבים שולחים פולס לייזר אל מראה על הירח, וקולטים את ההחזר אחרי $2.56\,\text{s}$.

      א. מה המרחק לירח?

      ב. רוצים לדעת את המרחק בדיוק של $3\,\text{cm}$. בכמה זמן משתנה זמן ההלוך-ושוב כשהמרחק משתנה ב-$3\,\text{cm}$?

      ג. מה משתנה בזמן ההלוך-ושוב אם משתמשים בלייזר ירוק במקום אדום?
    answer: >-
      א. $3.84\cdot10^{8}\,\text{m}$.

      ב. $2\cdot10^{-10}\,\text{s}$.

      ג. שום דבר: שני הצבעים נעים באותה מהירות.
    solution:
      - kind: given
        text: >-
          $t = 2.56\,\text{s}$ הלוך ושוב; $c = 3\cdot10^{8}\,\text{m/s}$.
      - kind: manipulation
        text: >-
          א. האור עובר את המרחק פעמיים: $2d = ct$, ולכן $d = \dfrac{ct}{2}$.
      - kind: substitution
        text: >-
          $d = \dfrac{3\cdot10^{8}\cdot2.56}{2} = 3.84\cdot10^{8}\,\text{m}$.
      - kind: manipulation
        text: >-
          ב. שינוי של $\Delta d$ במרחק משנה את הדרך ב-$2\Delta d$, ולכן $\Delta t = \dfrac{2\Delta d}{c}$.
      - kind: substitution
        text: >-
          $\Delta t = \dfrac{2\cdot0.03}{3\cdot10^{8}} = 2\cdot10^{-10}\,\text{s}$: חמישית של ננו-שנייה.
      - kind: reasoning
        text: >-
          ג. אור ירוק ואור אדום נבדלים רק בתדירות. בריק כל הגלים האלקטרומגנטיים נעים במהירות $c = 1/\sqrt{\mu_0\varepsilon_0}$, ולכן הזמן זהה.
      - kind: result
        text: >-
          א. $3.84\cdot10^{8}\,\text{m}$. ב. $2\cdot10^{-10}\,\text{s}$. ג. לא משתנה.

  - id: W-5.10-07
    level: mid
    qualitative: true
    objectives: [OBJ-5.10-1, OBJ-5.10-4]
    prompt: >-
      לכל מקור קבעו אם הוא שולח גל אלקטרומגנטי, ונמקו במשפט.

      א. בלון טעון שתלוי על חוט, בלי לזוז.

      ב. סליל שזורם בו זרם קבוע מסוללה.

      ג. אותו סליל, כשמחברים אותו לגנרטור של זרם חילופין (שיעור 5.8).

      ד. גחלים לוהטות, שהמטענים באטומים שלהן רוטטים מהר מאוד.
    answer: >-
      א. לא.

      ב. לא.

      ג. כן, בתדירות של הגנרטור.

      ד. כן: הן זורחות באור אדום ובקרינה תת-אדומה.
    solution:
      - kind: reasoning
        text: >-
          כדי שייווצר גל, השדות צריכים להשתנות: שדה חשמלי שמשתנה יוצר שדה מגנטי, ושדה מגנטי שמשתנה יוצר שדה חשמלי. בלי שינוי אין שרשרת.
      - kind: reasoning
        text: >-
          א. סביב הבלון שדה חשמלי קבוע. הוא לא משתנה, ולכן לא נוצר שדה מגנטי, ואין גל.

          ב. זרם קבוע יוצר שדה מגנטי קבוע. השטף לא משתנה, ולכן לא נוצר שדה חשמלי, ואין גל.

          ג. בזרם חילופין המטענים בסליל נעים הלוך ושוב, והשדה המגנטי שלו משתנה כל הזמן. השינוי מתקדם החוצה במהירות $c$ כגל, בתדירות של הזרם. (בתדירות נמוכה כמו $50\,\text{Hz}$ אורך הגל אלפי קילומטרים, והגל חלש מאוד.)

          ד. מטענים שרוטטים מהר הם אנטנות זעירות. הם שולחים גלים בתדירויות גבוהות מאוד: תת-אדום, וכשהגחלים חמות מספיק, גם אור נראה.
      - kind: result
        text: >-
          א. לא. ב. לא. ג. כן. ד. כן.

  - id: W-5.10-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-5.10-2, OBJ-5.10-3]
    prompt: >-
      א. חשבו מתוך $\mu_0$ ו-$\varepsilon_0$ שבדף הנוסחאות את מהירות הגל האלקטרומגנטי בריק.

      ב. המרחק מהשמש לכדור הארץ הוא $1.5\cdot10^{11}\,\text{m}$. כמה זמן לוקח לאור להגיע אלינו?

      ג. אות GPS משודר בתדירות $1.575\,\text{GHz}$. מה אורך הגל שלו?

      ד. מה היה משתנה במהירות האור, אילו $\mu_0$ היה גדול פי 4 ($\varepsilon_0$ ללא שינוי)?
    answer: >-
      א. $3.00\cdot10^{8}\,\text{m/s}$.

      ב. $500\,\text{s}$, כשמונה דקות ועשרים שניות.

      ג. כ-$19.0\,\text{cm}$.

      ד. היא הייתה קטנה פי 2, ל-$1.5\cdot10^{8}\,\text{m/s}$.
    solution:
      - kind: formula
        text: >-
          $c = \dfrac{1}{\sqrt{\mu_0\varepsilon_0}}$, $t = \dfrac{d}{c}$, $\lambda = \dfrac{c}{f}$.
      - kind: substitution
        text: >-
          א. $\mu_0\varepsilon_0 = 4\pi\cdot10^{-7}\cdot8.85\cdot10^{-12} \approx 1.112\cdot10^{-17}\,\text{s}^2/\text{m}^2$, ולכן $c = \dfrac{1}{\sqrt{1.112\cdot10^{-17}}} \approx 3.00\cdot10^{8}\,\text{m/s}$.

          ב. $t = \dfrac{1.5\cdot10^{11}}{3\cdot10^{8}} = 500\,\text{s}$.

          ג. $\lambda = \dfrac{3\cdot10^{8}}{1.575\cdot10^{9}} \approx 0.190\,\text{m}$.
      - kind: reasoning
        text: >-
          ד. $c$ הפוך לשורש של $\mu_0$. אם $\mu_0$ גדל פי 4, השורש גדל פי $\sqrt4 = 2$, והמהירות קטנה פי 2: $1.5\cdot10^{8}\,\text{m/s}$.
      - kind: result
        text: >-
          א. $3.00\cdot10^{8}\,\text{m/s}$. ב. $500\,\text{s}$. ג. כ-$19.0\,\text{cm}$. ד. קטנה פי 2.

  - id: W-5.10-09
    level: bagrut
    qualitative: true
    objectives: [OBJ-5.10-1]
    prompt: >-
      א. בריק אין מטען ואין זרם. אילו איברים במשוואות מקסוול נעלמים שם, ואילו שני חוקים נשארים עם צד ימין ששונה מאפס?

      ב. הסבירו במילים איך שני החוקים האלה מאפשרים לגל אלקטרומגנטי להתקדם בריק בלי שום חומר.

      ג. נניח שמקסוול לא היה מוסיף את האיבר שלו לחוק אמפר. האם עדיין היו גלים אלקטרומגנטיים? נמקו.

      ד. תלמיד אומר: "בגל, כשהשדה החשמלי בשיא, השדה המגנטי אפס, כי הם מתחלפים". האם הוא צודק?
    answer: >-
      א. $Q_{\text{in}}$ ו-$I_{\text{in}}$ נעלמים; נשארים פאראדיי והאיבר של מקסוול בחוק אמפר-מקסוול.

      ב. שדה מגנטי שמשתנה יוצר שדה חשמלי, ושדה חשמלי שמשתנה יוצר שדה מגנטי, וכך ההפרעה מתקדמת.

      ג. לא: בלי התוספת, שדה חשמלי שמשתנה לא יוצר שדה מגנטי, והשרשרת נקטעת.

      ד. לא: בגל השדות מגיעים לשיא יחד.
    solution:
      - kind: reasoning
        text: >-
          א. בחוק גאוס $Q_{\text{in}} = 0$, ובחוק אמפר-מקסוול $I_{\text{in}} = 0$. בחוק גאוס למגנטיות צד ימין אפס ממילא. נשארים $\oint \vec E\cdot d\vec l = -\dfrac{d\Phi_B}{dt}$ ו-$\oint \vec B\cdot d\vec l = \mu_0\varepsilon_0\,\dfrac{d\Phi_E}{dt}$.
      - kind: reasoning
        text: >-
          ב. אם במקום כלשהו השדה החשמלי משתנה, נוצר סביבו שדה מגנטי, שגם הוא משתנה. השדה המגנטי שמשתנה יוצר סביבו, קצת הלאה, שדה חשמלי שמשתנה, וכן הלאה. כל אחד מהשדות נוצר מהשינוי של השני, ולכן הם לא צריכים מטענים, זרמים או חומר. מה שמתקדם הוא תבנית של שדות, במהירות $c = 1/\sqrt{\mu_0\varepsilon_0}$.
      - kind: reasoning
        text: >-
          ג. בלי התוספת, בריק $\oint \vec B\cdot d\vec l = 0$ סביב כל מסלול: שדה חשמלי שמשתנה לא יוצר שדה מגנטי. השדה המגנטי של הגל לא היה נוצר, ולא היה שדה מגנטי שמשתנה כדי ליצור את השדה החשמלי הבא. השרשרת נקטעת, ואין גל. המהירות $c$ עצמה יוצאת מהמכפלה $\mu_0\varepsilon_0$, ו-$\varepsilon_0$ נכנס לחוק דרך התוספת.
      - kind: reasoning
        text: >-
          ד. לא. השדה המגנטי נוצר מקצב השינוי של השדה החשמלי **בסביבה**, לא מהערך שלו בנקודה אחת. בגל שמתקדם, השדה החשמלי והשדה המגנטי מגיעים לשיא באותה נקודה ובאותו רגע, כמו שהגשש באיור 5.10א מראה.
      - kind: result
        text: >-
          א. נשארים פאראדיי והאיבר של מקסוול. ב. כל שדה נוצר מהשינוי של השני. ג. לא היו גלים. ד. התלמיד טועה: השדות מגיעים לשיא יחד.

  - id: W-5.10-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-5.10-2, OBJ-5.10-3, OBJ-5.10-4]
    prompt: >-
      תחנת רדיו משדרת בתדירות $100\,\text{MHz}$ מאנטנה אנכית. מקלט נמצא במרחק $30\,\text{km}$ ממנה.

      א. מה אורך הגל, ומה זמן המחזור של הגל?

      ב. כמה זמן לוקח לאות להגיע למקלט? כמה אורכי גל יש לאורך הדרך?

      ג. כמה תנודות עושים האלקטרונים באנטנה של המקלט בזמן שהאות בדרך? השוו לתשובה בסעיף ב, והסבירו למה המספרים שווים.

      ד. באיזה כיוון כדאי להעמיד את האנטנה של המקלט, ולמה?
    answer: >-
      א. $3\,\text{m}$ ו-$10^{-8}\,\text{s}$.

      ב. $10^{-4}\,\text{s}$; $10^{4}$ אורכי גל.

      ג. $10^{4}$ תנודות, אותו מספר: בכל זמן מחזור הגל מתקדם אורך גל אחד.

      ד. אנכית, מקבילה לשדה החשמלי של הגל.
    solution:
      - kind: given
        text: >-
          $f = 10^{8}\,\text{Hz}$, $d = 3\cdot10^{4}\,\text{m}$, $c = 3\cdot10^{8}\,\text{m/s}$.
      - kind: formula
        text: >-
          $\lambda = \dfrac{c}{f}$, $T = \dfrac{1}{f}$, $t = \dfrac{d}{c}$.
      - kind: substitution
        text: >-
          א. $\lambda = \dfrac{3\cdot10^{8}}{10^{8}} = 3\,\text{m}$, $T = \dfrac{1}{10^{8}} = 10^{-8}\,\text{s}$.

          ב. $t = \dfrac{3\cdot10^{4}}{3\cdot10^{8}} = 10^{-4}\,\text{s}$. מספר אורכי הגל: $\dfrac{d}{\lambda} = \dfrac{3\cdot10^{4}}{3} = 10^{4}$.

          ג. מספר התנודות: $f\cdot t = 10^{8}\cdot10^{-4} = 10^{4}$.
      - kind: reasoning
        text: >-
          ג. $f\cdot t = f\cdot\dfrac{d}{c} = \dfrac{d}{c/f} = \dfrac{d}{\lambda}$. בכל זמן מחזור הגל מתקדם אורך גל אחד, ולכן מספר המחזורים בדרך שווה למספר אורכי הגל בדרך.

          ד. המטענים באנטנה המשדרת נעים למעלה ולמטה, והשדה החשמלי של הגל אנכי. הוא מניע את האלקטרונים לאורך אנטנה אנכית, ולא לאורך אנטנה אופקית.
      - kind: result
        text: >-
          א. $3\,\text{m}$, $10^{-8}\,\text{s}$. ב. $10^{-4}\,\text{s}$, $10^{4}$ אורכי גל. ג. $10^{4}$ תנודות. ד. אנכית.

challenge:
  - id: W-5.10-c1
    stars: 1
    objectives: [OBJ-5.10-2]
    prompt: >-
      בשיטה של פוקו למדידת מהירות האור יש מראה שמסתובבת במהירות זוויתית $\omega$. מקור אור ומקלט עומדים שניהם במרחק $300\,\text{m}$ מהמראה המסתובבת, ו-$0.60\,\text{m}$ זה מזה. אור יוצא מהמקור, מוחזר מהמראה המסתובבת אל מראה קבועה שנמצאת גם היא במרחק $300\,\text{m}$, חוזר אל המראה המסתובבת, ומוחזר שוב. כשהמראה עומדת, האור חוזר בדיוק אל המקור. רמז: כשמראה מסתובבת בזווית $\theta$, הקרן שמוחזרת ממנה מסתובבת בזווית $2\theta$.

      א. כמה זמן עובר האור מהמראה המסתובבת אל המראה הקבועה ובחזרה?

      ב. מה הזווית, ברדיאנים, בין הקו מהמראה המסתובבת אל המקור לבין הקו ממנה אל המקלט?

      ג. מה המהירות הזוויתית הקטנה ביותר שבה האור החוזר מגיע אל המקלט? כמה סיבובים בדקה זה?

      ד. מה משתנה בתשובה לסעיף ג אם מרחיקים את המראה הקבועה ל-$600\,\text{m}$?
    answer: >-
      א. $2\cdot10^{-6}\,\text{s}$.

      ב. $2\cdot10^{-3}\,\text{rad}$.

      ג. $500\,\text{rad/s}$, כ-$4.8\cdot10^{3}$ סיבובים בדקה.

      ד. היא קטנה פי 2, ל-$250\,\text{rad/s}$.
    solution:
      - kind: given
        text: >-
          המרחקים מהמראה המסתובבת: $L = 300\,\text{m}$ אל המראה הקבועה, $300\,\text{m}$ אל המקור ואל המקלט; המרחק בין המקור למקלט $s = 0.60\,\text{m}$; $c = 3\cdot10^{8}\,\text{m/s}$.
      - kind: substitution
        text: >-
          א. האור עובר $2L$: $\Delta t = \dfrac{2L}{c} = \dfrac{600}{3\cdot10^{8}} = 2\cdot10^{-6}\,\text{s}$.

          ב. הזווית קטנה מאוד, ולכן היא הקשת חלקי הרדיוס: $\alpha = \dfrac{s}{300} = \dfrac{0.60}{300} = 2\cdot10^{-3}\,\text{rad}$.
      - kind: reasoning
        text: >-
          ג. אילו המראה עמדה, האור היה חוזר אל המקור. כדי שיגיע אל המקלט, הקרן החוזרת צריכה להסתובב בזווית $\alpha$. לפי הרמז, המראה צריכה להסתובב, בזמן שהאור בדרך אל המראה הקבועה ובחזרה, בחצי מהזווית: $\theta = \dfrac{\alpha}{2} = 10^{-3}\,\text{rad}$.
      - kind: manipulation
        text: >-
          המהירות הזוויתית היא הזווית חלקי הזמן: $\omega = \dfrac{\theta}{\Delta t}$. סיבובים בשנייה: $\dfrac{\omega}{2\pi}$, ובדקה: כפול $60$.
      - kind: substitution
        text: >-
          $\omega = \dfrac{10^{-3}}{2\cdot10^{-6}} = 500\,\text{rad/s}$; $\dfrac{500}{2\pi} \approx 79.6$ סיבובים בשנייה, כ-$4.8\cdot10^{3}$ סיבובים בדקה.
      - kind: reasoning
        text: >-
          ד. הזווית הדרושה לא משתנה, אבל הזמן שהאור בדרך גדל פי 2, ל-$4\cdot10^{-6}\,\text{s}$. בזמן ארוך פי 2 המראה צריכה להסתובב באותה זווית, ולכן מהירות זוויתית קטנה פי 2 מספיקה: $250\,\text{rad/s}$. לכן מרחק ארוך עוזר: הוא מאפשר מדידה עם מראה שמסתובבת לאט יותר.
      - kind: result
        text: >-
          א. $2\cdot10^{-6}\,\text{s}$. ב. $2\cdot10^{-3}\,\text{rad}$. ג. $500\,\text{rad/s}$, כ-$4.8\cdot10^{3}$ סיבובים בדקה. ד. $250\,\text{rad/s}$.
    source:
      name: British Physics Olympiad, BPhO Round 1
      year: 2014
      problem: 'Section 1, Question 1(i) (14 November 2014): a rotating mirror, a fixed mirror, a source and a receiver all 0.30 km away, source and receiver 0.60 m apart, the lowest ω for detection (official answer 0.50·10³ rad/s); parts (a), (b) and (d) added'
      url: https://www.bpho.org.uk/Papers/R1/2014Nov_R1_S1.pdf
      verified: '2026-11-05'
      adapted: true

  - id: W-5.10-c2
    stars: 1
    objectives: [OBJ-5.10-2, OBJ-5.10-3]
    prompt: >-
      שתי תחנות רדיו עומדות על קו המשווה, בצדדים מנוגדים של כדור הארץ. הן מתקשרות דרך שני לוויינים גאוסטציונריים, שמקיפים את כדור הארץ במסלולים מעגליים בגובה $3.59\cdot10^{4}\,\text{km}$ מעל פני הקרקע. האות יוצא מתחנה אחת אל הלוויין הראשון בקו שמשיק לפני כדור הארץ, עובר אל הלוויין השני, ויורד ממנו אל התחנה השנייה, שוב בקו משיק. רדיוס כדור הארץ $6370\,\text{km}$.

      א. מה רדיוס המסלול של הלוויינים?

      ב. מה אורך הקטע מתחנה אל הלוויין שלה? רמז: הקו המשיק ניצב לרדיוס של כדור הארץ בנקודת ההשקה.

      ג. הסבירו למה הקטע בין שני הלוויינים שווה לקוטר כדור הארץ. מה אורך הדרך כולה, וכמה זמן לוקח לאות לעבור אותה?

      ד. תלמיד הציב בטעות את הגובה, $3.59\cdot10^{4}\,\text{km}$, במקום רדיוס המסלול. איזה זמן הוא קיבל?

      ה. הלוויינים משדרים בתדירות $4\,\text{GHz}$. מה אורך הגל, ובאיזה תחום של הספקטרום הוא?
    answer: >-
      א. $4.227\cdot10^{4}\,\text{km}$.

      ב. כ-$4.18\cdot10^{4}\,\text{km}$.

      ג. כ-$9.63\cdot10^{7}\,\text{m}$, וכ-$0.32\,\text{s}$.

      ד. כ-$0.28\,\text{s}$.

      ה. $7.5\,\text{cm}$, מיקרוגל.
    solution:
      - kind: given
        text: >-
          $r = 6.37\cdot10^{6}\,\text{m}$, הגובה $h = 3.59\cdot10^{7}\,\text{m}$, $c = 3\cdot10^{8}\,\text{m/s}$, $f = 4\cdot10^{9}\,\text{Hz}$.
      - kind: substitution
        text: >-
          א. $R = r + h = 6.37\cdot10^{6} + 3.59\cdot10^{7} = 4.227\cdot10^{7}\,\text{m}$.
      - kind: reasoning
        text: >-
          ב. המרכז של כדור הארץ, נקודת ההשקה והלוויין יוצרים משולש ישר-זווית: הרדיוס $r$ ניצב לקו המשיק, והיתר הוא $R$. לפי פיתגורס, הקטע המשיק הוא $\ell = \sqrt{R^2 - r^2}$.
      - kind: substitution
        text: >-
          $\ell = \sqrt{(4.227\cdot10^{7})^2 - (6.37\cdot10^{6})^2} \approx 4.179\cdot10^{7}\,\text{m}$.
      - kind: reasoning
        text: >-
          ג. שתי התחנות הן שני הקצוות של קוטר. המשיקים בשני קצות קוטר ניצבים לו, ולכן מקבילים זה לזה, והמרחק ביניהם הוא הקוטר, $2r$. שני הלוויינים נמצאים על שני המשיקים, באותו מרחק $\ell$ מהתחנות ובאותו צד של הקוטר, ולכן הקטע ביניהם מקביל לקוטר ושווה לו: $2r$.
      - kind: substitution
        text: >-
          הדרך: שני קטעים משיקים וקטע באורך $2r$ ביניהם: $L = 2\ell + 2r = 2\cdot4.179\cdot10^{7} + 1.274\cdot10^{7} \approx 9.63\cdot10^{7}\,\text{m}$. הזמן: $t = \dfrac{L}{c} = \dfrac{9.63\cdot10^{7}}{3\cdot10^{8}} \approx 0.321\,\text{s}$.
      - kind: substitution
        text: >-
          ד. עם $R = 3.59\cdot10^{7}\,\text{m}$: $\ell = \sqrt{(3.59\cdot10^{7})^2 - (6.37\cdot10^{6})^2} \approx 3.533\cdot10^{7}\,\text{m}$, $L \approx 8.34\cdot10^{7}\,\text{m}$, ו-$t \approx 0.278\,\text{s}$.
      - kind: substitution
        text: >-
          ה. $\lambda = \dfrac{c}{f} = \dfrac{3\cdot10^{8}}{4\cdot10^{9}} = 0.075\,\text{m}$: בין מילימטר למטר, תחום המיקרוגל.
      - kind: result
        text: >-
          א. $4.227\cdot10^{7}\,\text{m}$. ב. כ-$4.18\cdot10^{7}\,\text{m}$. ג. כ-$9.63\cdot10^{7}\,\text{m}$, כ-$0.32\,\text{s}$. ד. כ-$0.28\,\text{s}$. ה. $7.5\,\text{cm}$, מיקרוגל.
    source:
      name: British Physics Olympiad, BPhO Round 1
      year: 2017
      problem: 'Section 1, Question 1(m) (17 November 2017): two equatorial stations, diametrically opposite, linked by tangential radio signals through two geostationary satellites 3.59·10⁴ km up; the time delay (official answer 0.32 s, with 0.28 s from taking the altitude as the radius); parts (a), (b), (d) and (e) added'
      url: https://www.bpho.org.uk/Papers/R1/2017Nov_R1_S1.pdf
      verified: '2026-11-05'
      adapted: true
