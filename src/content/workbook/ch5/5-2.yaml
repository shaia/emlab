# Workbook, lesson 5.2 (Faraday's law). Format and rules: see .claude/CLAUDE.md, "Worked examples, workbook".
# Every number was recomputed with src/physics/induction.ts (averageEmf, fluxUniform), src/physics/faraday.ts
# (coaxialMutual) and src/physics/magnetism.ts (loopCenterField); scripts wb52.ts and c1.ts in the session scratchpad.
# In a >- block, consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '5.2'
practice:
  - id: W-5.2-01
    level: basic
    qualitative: false
    objectives: [OBJ-5.2-2]
    prompt: >-
      סליל של $80$ כריכות מחובר למעגל שההתנגדות הכוללת שלו $4\,\Omega$. מקרבים אליו מגנט, ותוך $0.03\,\text{s}$ השטף דרך כל כריכה גדל מ-$6\cdot10^{-5}\,\text{Wb}$ ל-$2.1\cdot10^{-4}\,\text{Wb}$.

      א. מה גודל הכא"מ המושרה הממוצע?

      ב. מה גודל הזרם המושרה הממוצע?
    answer: >-
      א. $0.4\,\text{V}$.

      ב. $0.1\,\text{A}$.
    solution:
      - kind: given
        text: >-
          $N = 80$, $\Phi_1 = 6\cdot10^{-5}\,\text{Wb}$, $\Phi_2 = 2.1\cdot10^{-4}\,\text{Wb}$, $\Delta t = 0.03\,\text{s}$, $R = 4\,\Omega$.
      - kind: formula
        text: >-
          $|\varepsilon| = N\,\dfrac{|\Delta\Phi|}{\Delta t}$, $I = \dfrac{|\varepsilon|}{R}$.
      - kind: substitution
        text: >-
          א. $\Delta\Phi = 2.1\cdot10^{-4} - 0.6\cdot10^{-4} = 1.5\cdot10^{-4}\,\text{Wb}$, ולכן $|\varepsilon| = 80\cdot\dfrac{1.5\cdot10^{-4}}{0.03} = 0.4\,\text{V}$.

          ב. $I = \dfrac{0.4}{4} = 0.1\,\text{A}$.
      - kind: result
        text: >-
          א. $0.4\,\text{V}$. ב. $0.1\,\text{A}$.

  - id: W-5.2-02
    level: basic
    qualitative: true
    objectives: [OBJ-5.2-1, OBJ-5.2-2]
    prompt: >-
      מורה מחזיקה מגנט מוט ליד סליל שמחובר לגלוונומטר שהאפס שלו באמצע, ועושה ארבעה דברים בזה אחר זה:

      א. מכניסה את המגנט לסליל לאט, הקוטב הצפוני קודם. המחוג זז שמאלה.

      ב. משאירה את המגנט בתוך הסליל עשר שניות.

      ג. מוציאה את המגנט מהר.

      ד. הופכת את המגנט, ומכניסה אותו לאט, הקוטב הדרומי קודם.

      בכל שלב קבעו: האם המחוג זז, לאיזה צד, והאם יותר או פחות מבשלב א. נמקו.
    answer: >-
      א. שמאלה (נתון). ב. אפס. ג. ימינה, יותר מבשלב א. ד. ימינה, בערך כמו בשלב א.
    solution:
      - kind: formula
        text: >-
          $\varepsilon = -N\,\dfrac{\Delta\Phi}{\Delta t}$: הכא"מ, והזרם, תלויים בקצב השינוי של השטף, והסימן שלהם הפוך לסימן השינוי.
      - kind: reasoning
        text: >-
          ב. המגנט נח: השטף גדול אבל קבוע, $\Delta\Phi = 0$, ולכן אין כא"מ, והמחוג באפס.
      - kind: reasoning
        text: >-
          ג. השטף קטן, במקום לגדול כמו בשלב א, ולכן השינוי בסימן הפוך, והזרם בכיוון ההפוך: ימינה. השינוי באותה כמות, אבל בזמן קצר יותר, ולכן הכא"מ גדול יותר, והמחוג זז יותר.
      - kind: reasoning
        text: >-
          ד. כשהקוטב הדרומי קודם, קווי השדה בתוך הסליל מצביעים לכיוון ההפוך. לכן השטף, לאורך אותו אנך, נעשה שלילי יותר ויותר: השינוי בסימן הפוך לשלב א, והמחוג זז ימינה. התנועה איטית כמו בשלב א, ולכן הסטייה בערך באותו גודל.
      - kind: result
        text: >-
          א. שמאלה. ב. אפס. ג. ימינה, יותר. ד. ימינה, בערך כמו בשלב א.

  - id: W-5.2-03
    level: basic
    qualitative: false
    objectives: [OBJ-5.2-3]
    prompt: >-
      השטף דרך כל כריכה של סליל בן $40$ כריכות, לאורך האנך שבחרנו, משתנה כך: מ-$0$ עד $0.1\,\text{s}$ הוא $2\cdot10^{-4}\,\text{Wb}$ קבוע; מ-$0.1$ עד $0.3\,\text{s}$ הוא עולה בקצב קבוע ל-$8\cdot10^{-4}\,\text{Wb}$; מ-$0.3$ עד $0.4\,\text{s}$ הוא נשאר $8\cdot10^{-4}\,\text{Wb}$.

      א. מה הכא"מ המושרה, כולל הסימן, ברגעים $t = 0.05\,\text{s}$, $t = 0.2\,\text{s}$ ו-$t = 0.35\,\text{s}$?

      ב. באיזה מהרגעים האלה השטף הכי גדול, ומה הכא"מ בו?
    answer: >-
      א. $0$, $-0.12\,\text{V}$, $0$.

      ב. ב-$t = 0.35\,\text{s}$, והכא"מ אז אפס.
    solution:
      - kind: given
        text: >-
          $N = 40$. הגרף של $\Phi(t)$ בנוי משלושה קטעים ישרים.
      - kind: formula
        text: >-
          הכא"מ ברגע מסוים הוא $-N$ כפול השיפוע של הגרף. בקטע ישר השיפוע הוא $\Delta\Phi/\Delta t$ של הקטע כולו.
      - kind: substitution
        text: >-
          א. ב-$t = 0.05\,\text{s}$ הגרף אופקי: $\varepsilon = 0$. ב-$t = 0.2\,\text{s}$: השיפוע $\dfrac{8\cdot10^{-4} - 2\cdot10^{-4}}{0.2} = 3\cdot10^{-3}\,\text{Wb/s}$, ולכן $\varepsilon = -40\cdot3\cdot10^{-3} = -0.12\,\text{V}$. ב-$t = 0.35\,\text{s}$ הגרף שוב אופקי: $\varepsilon = 0$.
      - kind: reasoning
        text: >-
          ב. השטף הכי גדול בקטע האחרון, $8\cdot10^{-4}\,\text{Wb}$, אבל שם הוא לא משתנה, ולכן הכא"מ אפס.
      - kind: result
        text: >-
          א. $0$, $-0.12\,\text{V}$, $0$. ב. ב-$t = 0.35\,\text{s}$; הכא"מ אפס.

  - id: W-5.2-04
    level: mid
    qualitative: false
    objectives: [OBJ-5.2-2]
    prompt: >-
      סליל ריבועי של $120$ כריכות, בצלע של $5\,\text{cm}$, נמצא בשדה מגנטי אחיד של $0.6\,\text{T}$ שניצב למישור הכריכות. ההתנגדות של המעגל של הסליל $12\,\Omega$. מכבים את האלקטרומגנט שיוצר את השדה, והשדה יורד לאפס תוך $0.15\,\text{s}$ בקצב קבוע.

      א. מה השטף דרך כל כריכה לפני הכיבוי?

      ב. מה גודל הכא"מ המושרה ומה גודל הזרם המושרה בזמן הכיבוי?

      ג. מה מראה מד הזרם אחרי שהשדה התאפס?
    answer: >-
      א. $1.5\cdot10^{-3}\,\text{Wb}$.

      ב. $1.2\,\text{V}$ ו-$0.1\,\text{A}$.

      ג. אפס.
    solution:
      - kind: given
        text: >-
          $N = 120$, $a = 0.05\,\text{m}$, $B_1 = 0.6\,\text{T}$, $B_2 = 0$, $\Delta t = 0.15\,\text{s}$, $R = 12\,\Omega$. השדה ניצב למישור, ולכן $\Phi = BA$.
      - kind: formula
        text: >-
          $A = a^2$, $\Phi = BA$, $|\varepsilon| = N\,\dfrac{|\Delta\Phi|}{\Delta t}$, $I = \dfrac{|\varepsilon|}{R}$.
      - kind: substitution
        text: >-
          א. $A = 0.05^2 = 2.5\cdot10^{-3}\,\text{m}^2$, ולכן $\Phi_1 = 0.6\cdot2.5\cdot10^{-3} = 1.5\cdot10^{-3}\,\text{Wb}$.

          ב. $|\Delta\Phi| = 1.5\cdot10^{-3}\,\text{Wb}$, ולכן $|\varepsilon| = 120\cdot\dfrac{1.5\cdot10^{-3}}{0.15} = 1.2\,\text{V}$, ו-$I = \dfrac{1.2}{12} = 0.1\,\text{A}$.
      - kind: reasoning
        text: >-
          ג. אחרי שהשדה התאפס, השטף נשאר אפס ולא משתנה, ולכן אין כא"מ ואין זרם.
      - kind: result
        text: >-
          א. $1.5\cdot10^{-3}\,\text{Wb}$. ב. $1.2\,\text{V}$, $0.1\,\text{A}$. ג. אפס.

  - id: W-5.2-05
    level: mid
    qualitative: true
    objectives: [OBJ-5.2-2]
    prompt: >-
      בניסוי של מגנט וסליל, הזרם המושרה קטן מדי. תלמיד מציע ארבע דרכים להכפיל אותו. בכל דרך קבעו ונמקו אם הזרם יוכפל, ואם לא, מה יקרה לו.

      א. להכניס את המגנט פי 2 מהר יותר.

      ב. ללפף מחדש את הסליל מאותו תיל, באותו קוטר, עם פי 2 כריכות.

      ג. ללפף מחדש את הסליל עם אותו מספר כריכות, מתיל עבה יותר, שההתנגדות שלו לכל מטר קטנה פי 2.

      ד. להחליף את המגנט במגנט חזק פי 2 באותו גודל, ולהכניס אותו באותה מהירות.

      (הניחו שההתנגדות של המעגל היא כולה ההתנגדות של הסליל.)
    answer: >-
      א. כן. ב. לא: הכא"מ גדל פי 2, אבל גם ההתנגדות, והזרם לא משתנה. ג. כן. ד. כן.
    solution:
      - kind: formula
        text: >-
          $|\varepsilon| = N\,\dfrac{|\Delta\Phi|}{\Delta t}$, ו-$I = \dfrac{|\varepsilon|}{R}$: הזרם פרופורציוני ל-$N\,|\Delta\Phi|/(R\,\Delta t)$.
      - kind: reasoning
        text: >-
          א. אותו $\Delta\Phi$ בחצי מהזמן: הכא"מ גדל פי 2, ההתנגדות לא משתנה, והזרם גדל פי 2.
      - kind: reasoning
        text: >-
          ב. פי 2 כריכות: הכא"מ גדל פי 2. אבל כל כריכה צורכת אותו אורך תיל, ולכן התיל ארוך פי 2, וההתנגדות גדלה פי 2. הזרם לא משתנה.
      - kind: reasoning
        text: >-
          ג. אותו מספר כריכות ואותו שטף: הכא"מ לא משתנה. ההתנגדות קטנה פי 2, ולכן הזרם גדל פי 2.
      - kind: reasoning
        text: >-
          ד. מגנט חזק פי 2 נותן שדה חזק פי 2 בכל נקודה, ולכן גם שטף גדול פי 2 בכל מקום. באותה מהירות, $\Delta\Phi$ גדל פי 2 באותו זמן: הכא"מ והזרם גדלים פי 2.
      - kind: result
        text: >-
          א, ג ו-ד מכפילות את הזרם. ב לא משנה אותו.

  - id: W-5.2-06
    level: mid
    qualitative: false
    objectives: [OBJ-5.2-3, OBJ-5.2-4]
    prompt: >-
      השטף דרך כל כריכה של סליל בן $60$ כריכות, לאורך האנך שבחרנו, יורד בקצב קבוע מ-$+5\cdot10^{-4}\,\text{Wb}$ ל-$-5\cdot10^{-4}\,\text{Wb}$ בין $t = 0$ ל-$t = 0.25\,\text{s}$, ואחר כך נשאר $-5\cdot10^{-4}\,\text{Wb}$.

      א. מה הכא"מ המושרה, כולל הסימן, בין $t = 0$ ל-$t = 0.25\,\text{s}$?

      ב. מה הכא"מ ברגע שבו השטף אפס? ומתי זה קורה?

      ג. מה הכא"מ אחרי $t = 0.25\,\text{s}$, כשהשטף שלילי?
    answer: >-
      א. $+0.24\,\text{V}$.

      ב. $+0.24\,\text{V}$, ברגע $t = 0.125\,\text{s}$.

      ג. אפס.
    solution:
      - kind: given
        text: >-
          $N = 60$, $\Phi_1 = +5\cdot10^{-4}\,\text{Wb}$, $\Phi_2 = -5\cdot10^{-4}\,\text{Wb}$, $\Delta t = 0.25\,\text{s}$.
      - kind: formula
        text: >-
          $\varepsilon = -N\,\dfrac{\Delta\Phi}{\Delta t}$, והכא"מ ברגע מסוים הוא $-N$ כפול השיפוע של הגרף.
      - kind: substitution
        text: >-
          א. $\Delta\Phi = -5\cdot10^{-4} - 5\cdot10^{-4} = -1\cdot10^{-3}\,\text{Wb}$, ולכן $\varepsilon = -60\cdot\dfrac{-1\cdot10^{-3}}{0.25} = +0.24\,\text{V}$.
      - kind: reasoning
        text: >-
          ב. הגרף ישר, ולכן השיפוע שלו, והכא"מ, זהים בכל הקטע, גם ברגע שבו השטף חוצה את האפס. הירידה בקצב קבוע, ולכן השטף אפס באמצע הזמן, $t = 0.125\,\text{s}$.
      - kind: reasoning
        text: >-
          ג. אחרי $t = 0.25\,\text{s}$ השטף לא משתנה. הסימן שלו לא משנה דבר: $\Delta\Phi = 0$, ו-$\varepsilon = 0$.
      - kind: result
        text: >-
          א. $+0.24\,\text{V}$. ב. $+0.24\,\text{V}$, ב-$t = 0.125\,\text{s}$. ג. אפס.

  - id: W-5.2-07
    level: mid
    qualitative: true
    objectives: [OBJ-5.2-4]
    prompt: >-
      כריכה מעגלית נמצאת במישור הדף, בשדה מגנטי אחיד שמצביע לתוך הדף, ⊗. השדה מתחזק.

      א. בוחרים אנך שיוצא מהדף, ⊙. מה הסימנים של $\Phi$, של $\Delta\Phi$ ושל $\varepsilon$? באיזה כיוון זורם הזרם המושרה, עם כיוון השעון או נגדו, כפי שרואים את הדף?

      ב. ענו על אותן שאלות עם אנך שנכנס לדף, ⊗.
    answer: >-
      א. $\Phi < 0$, $\Delta\Phi < 0$, $\varepsilon > 0$; הזרם נגד כיוון השעון.

      ב. $\Phi > 0$, $\Delta\Phi > 0$, $\varepsilon < 0$; הזרם נגד כיוון השעון, אותו זרם.
    solution:
      - kind: formula
        text: >-
          $\varepsilon = -N\,\dfrac{\Delta\Phi}{\Delta t}$. האנך קובע בכלל יד ימין את הכיוון החיובי: אנך ⊙ נותן כיוון חיובי נגד כיוון השעון, ואנך ⊗ נותן כיוון חיובי עם כיוון השעון.
      - kind: reasoning
        text: >-
          א. השדה נכנס לדף, נגד האנך ⊙: $\Phi < 0$. השדה מתחזק, ולכן $\Phi$ נעשה שלילי יותר: $\Delta\Phi < 0$, ו-$\varepsilon > 0$. הזרם בכיוון החיובי, נגד כיוון השעון.
      - kind: reasoning
        text: >-
          ב. עכשיו השדה בכיוון האנך: $\Phi > 0$, והוא גדל: $\Delta\Phi > 0$, ולכן $\varepsilon < 0$. הזרם נגד הכיוון החיובי של האנך ⊗, שהוא עם כיוון השעון, כלומר הזרם נגד כיוון השעון.
      - kind: result
        text: >-
          בשתי הבחירות הזרם זורם נגד כיוון השעון; רק הסימנים שכותבים מתהפכים.

  - id: W-5.2-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-5.2-2, OBJ-5.2-4]
    prompt: >-
      סליל שטוח של $200$ כריכות, ששטחו $40\,\text{cm}^2$, נמצא בשדה מגנטי אחיד של $0.25\,\text{T}$, ומישורו ניצב לשדה. ההתנגדות של המעגל $25\,\Omega$. בוחרים לסליל אנך בכיוון השדה, והאנך מסתובב יחד עם הסליל.

      א. הופכים את הסליל בחצי סיבוב תוך $0.1\,\text{s}$. מה השטף דרך כל כריכה לפני ההיפוך ואחריו?

      ב. מה הכא"מ הממוצע, כולל הסימן, ומה גודל הזרם הממוצע?

      ג. תלמיד טוען: "אחרי ההיפוך השטף באותו גודל כמו לפניו, ולכן אין כא"מ". מה הטעות?

      ד. מה הכא"מ הממוצע אם מסובבים את הסליל רק ברבע סיבוב, תוך $0.05\,\text{s}$?
    answer: >-
      א. $+10^{-3}\,\text{Wb}$ לפני, $-10^{-3}\,\text{Wb}$ אחרי.

      ב. $+4\,\text{V}$, $0.16\,\text{A}$.

      ג. השטף התהפך: השינוי הוא $-2\cdot10^{-3}\,\text{Wb}$, לא אפס.

      ד. $+4\,\text{V}$.
    solution:
      - kind: given
        text: >-
          $N = 200$, $A = 40\,\text{cm}^2 = 4\cdot10^{-3}\,\text{m}^2$, $B = 0.25\,\text{T}$, $R = 25\,\Omega$. בהתחלה האנך בכיוון השדה, $\theta = 0$; אחרי חצי סיבוב $\theta = 180^\circ$; אחרי רבע סיבוב $\theta = 90^\circ$.
      - kind: formula
        text: >-
          $\Phi = BA\cos\theta$ (שיעור 5.1), $\varepsilon = -N\,\dfrac{\Delta\Phi}{\Delta t}$, $I = \dfrac{\varepsilon}{R}$.
      - kind: substitution
        text: >-
          א. $\Phi_1 = 0.25\cdot4\cdot10^{-3}\cdot\cos0 = 10^{-3}\,\text{Wb}$, $\Phi_2 = 0.25\cdot4\cdot10^{-3}\cdot\cos180^\circ = -10^{-3}\,\text{Wb}$.

          ב. $\Delta\Phi = -2\cdot10^{-3}\,\text{Wb}$, ולכן $\varepsilon = -200\cdot\dfrac{-2\cdot10^{-3}}{0.1} = +4\,\text{V}$, ו-$I = \dfrac{4}{25} = 0.16\,\text{A}$.
      - kind: reasoning
        text: >-
          ג. השטף נמדד לאורך האנך, והאנך מסתובב עם הסליל: אחרי חצי סיבוב קווי השדה עוברים דרך הסליל מהצד השני. השטף עבר מ-$+10^{-3}$ ל-$-10^{-3}\,\text{Wb}$, שינוי של $2\cdot10^{-3}\,\text{Wb}$.
      - kind: substitution
        text: >-
          ד. $\Phi_2 = BA\cos90^\circ = 0$, ולכן $\Delta\Phi = -10^{-3}\,\text{Wb}$, ו-$\varepsilon = -200\cdot\dfrac{-10^{-3}}{0.05} = +4\,\text{V}$: חצי מהשינוי, בחצי מהזמן.
      - kind: result
        text: >-
          א. $\pm10^{-3}\,\text{Wb}$. ב. $+4\,\text{V}$, $0.16\,\text{A}$. ג. השינוי $-2\cdot10^{-3}\,\text{Wb}$. ד. $+4\,\text{V}$.

  - id: W-5.2-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-5.2-1, OBJ-5.2-2, OBJ-5.2-3]
    prompt: >-
      סליל A מחובר לסוללה דרך נגד משתנה, וסליל B, של $250$ כריכות, עומד לידו על אותו ציר, במעגל שההתנגדות שלו $5\,\Omega$. השטף דרך כל כריכה של B פרופורציוני לזרם ב-A: $1.5\cdot10^{-5}\,\text{Wb}$ לכל אמפר. הזרם ב-A משתנה כך: מ-$0$ עד $0.2\,\text{s}$ הוא עולה בקצב קבוע מ-$0$ ל-$4\,\text{A}$; מ-$0.2$ עד $0.5\,\text{s}$ הוא נשאר $4\,\text{A}$; מ-$0.5$ עד $0.6\,\text{s}$ הוא יורד בקצב קבוע ל-$1\,\text{A}$.

      א. מה הכא"מ המושרה ב-B, כולל הסימן, ומה הזרם בו, בכל אחד משלושת הקטעים? האנך של B בכיוון השדה של A.

      ב. באיזה קטע הזרם ב-B הכי גדול בגודלו, ולמה דווקא שם?

      ג. בקטע האמצעי זורם ב-A הזרם הגדול ביותר. למה דווקא אז אין זרם ב-B?
    answer: >-
      א. $-0.075\,\text{V}$ ו-$-0.015\,\text{A}$; $0$; $+0.1125\,\text{V}$ ו-$+0.0225\,\text{A}$.

      ב. בקטע השלישי.

      ג. כי הזרם ב-A קבוע, והשטף דרך B לא משתנה.
    solution:
      - kind: given
        text: >-
          $N = 250$, $R = 5\,\Omega$, $\Phi = 1.5\cdot10^{-5}\cdot I_A$. בשלושת הקטעים: $I_A$ מ-$0$ ל-$4\,\text{A}$ ב-$0.2\,\text{s}$, קבוע, ומ-$4$ ל-$1\,\text{A}$ ב-$0.1\,\text{s}$.
      - kind: formula
        text: >-
          $\varepsilon = -N\,\dfrac{\Delta\Phi}{\Delta t}$, $I = \dfrac{\varepsilon}{R}$.
      - kind: substitution
        text: >-
          א. בקטע הראשון $\Delta\Phi = 1.5\cdot10^{-5}\cdot4 = 6\cdot10^{-5}\,\text{Wb}$: $\varepsilon = -250\cdot\dfrac{6\cdot10^{-5}}{0.2} = -0.075\,\text{V}$, $I = -0.015\,\text{A}$. בקטע השני $\Delta\Phi = 0$: $\varepsilon = 0$. בקטע השלישי $\Delta\Phi = 1.5\cdot10^{-5}\cdot(1 - 4) = -4.5\cdot10^{-5}\,\text{Wb}$: $\varepsilon = -250\cdot\dfrac{-4.5\cdot10^{-5}}{0.1} = +0.1125\,\text{V}$, $I = +0.0225\,\text{A}$.
      - kind: reasoning
        text: >-
          ב. בקטע השלישי השטף משתנה בקצב $4.5\cdot10^{-4}\,\text{Wb/s}$, לעומת $3\cdot10^{-4}\,\text{Wb/s}$ בקטע הראשון: השינוי קטן יותר, אבל מהיר יותר.
      - kind: reasoning
        text: >-
          ג. הכא"מ תלוי בקצב השינוי של השטף, לא בשטף. בקטע האמצעי השטף הגדול ביותר, אבל קבוע.
      - kind: result
        text: >-
          א. $-0.075\,\text{V}$, $-0.015\,\text{A}$; $0$; $+0.1125\,\text{V}$, $+0.0225\,\text{A}$. ב. בקטע השלישי. ג. השטף קבוע.

  - id: W-5.2-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-5.2-2, OBJ-5.2-3]
    prompt: >-
      מגנט מוט נופל דרך סליל אנכי של $500$ כריכות, הקוטב הצפוני קודם. השטף דרך כל כריכה הוא כמעט אפס כשהמגנט רחוק, והוא הגדול ביותר, $3\cdot10^{-4}\,\text{Wb}$, כשמרכז המגנט במרכז הסליל. מהרגע שהמגנט מתחיל להשפיע ועד שמרכזו במרכז הסליל עוברות $0.05\,\text{s}$, ומשם ועד שהוא כבר רחוק מתחת לסליל, $0.03\,\text{s}$.

      א. מה הכא"מ הממוצע בכל אחד משני חלקי המעבר? בחרו אנך בכיוון השדה של המגנט בתוך הסליל.

      ב. ברגע שבו מרכז המגנט עובר במרכז הסליל, השטף הגדול ביותר. מה הכא"מ ברגע הזה?

      ג. הסבירו למה בחלק השני הכא"מ גדול יותר, ולמה המכפלה של הכא"מ הממוצע בזמן שווה בגודלה בשני החלקים.
    answer: >-
      א. $-3\,\text{V}$, ואחר כך $+5\,\text{V}$.

      ב. אפס.

      ג. המגנט מואץ, ולכן החלק השני מהיר יותר; בשני החלקים $|\varepsilon|\cdot\Delta t = N\,|\Delta\Phi| = 0.15\,\text{Wb}$.
    solution:
      - kind: given
        text: >-
          $N = 500$, $\Phi_{\max} = 3\cdot10^{-4}\,\text{Wb}$, $\Delta t_1 = 0.05\,\text{s}$, $\Delta t_2 = 0.03\,\text{s}$.
      - kind: formula
        text: >-
          $\varepsilon = -N\,\dfrac{\Delta\Phi}{\Delta t}$; ברגע מסוים, $-N$ כפול השיפוע של $\Phi(t)$.
      - kind: substitution
        text: >-
          א. בכניסה $\Delta\Phi = +3\cdot10^{-4}\,\text{Wb}$: $\varepsilon_1 = -500\cdot\dfrac{3\cdot10^{-4}}{0.05} = -3\,\text{V}$. ביציאה $\Delta\Phi = -3\cdot10^{-4}\,\text{Wb}$: $\varepsilon_2 = -500\cdot\dfrac{-3\cdot10^{-4}}{0.03} = +5\,\text{V}$.
      - kind: reasoning
        text: >-
          ב. ברגע שבו השטף מגיע לשיא שלו, הוא מפסיק לעלות ועוד לא התחיל לרדת: הגרף של $\Phi(t)$ אופקי שם, השיפוע אפס, והכא"מ אפס.
      - kind: reasoning
        text: >-
          ג. המגנט נופל ומואץ, ולכן הוא עובר את החלק השני מהר יותר: אותו שינוי בשטף בזמן קצר יותר נותן כא"מ גדול יותר. המכפלה $|\varepsilon|\cdot\Delta t = N\,|\Delta\Phi|$, ובשני החלקים השטף משתנה באותה כמות: $500\cdot3\cdot10^{-4} = 0.15\,\text{Wb}$.
      - kind: result
        text: >-
          א. $-3\,\text{V}$ ו-$+5\,\text{V}$. ב. אפס. ג. החלק השני מהיר יותר; $|\varepsilon|\cdot\Delta t = 0.15\,\text{Wb}$ בשניהם.

challenge:
  - id: W-5.2-c1
    stars: 1
    objectives: [OBJ-5.2-2]
    prompt: >-
      כריכה עגולה אחת, גדולה, ברדיוס $b = 20\,\text{cm}$, ובמרכזה, באותו מישור, סליל שטוח וקטן של $500$ כריכות ברדיוס $a = 2\,\text{cm}$. ההתנגדות של המעגל של הסליל הקטן $4\,\Omega$. בכריכה הגדולה זורם זרם של $10\,\text{A}$, ותוך $0.01\,\text{s}$ הוא משתנה בקצב קבוע לזרם של $10\,\text{A}$ בכיוון ההפוך.

      א. הסליל הקטן הרבה יותר קטן מהכריכה הגדולה. איזה קירוב זה מאפשר לגבי השדה של הכריכה הגדולה על פני הסליל הקטן? מה השטף דרך כל כריכה של הסליל הקטן לפני השינוי?

      ב. מה גודל הכא"מ המושרה הממוצע בסליל הקטן, ומה הזרם הממוצע בו?

      ג. החישוב המדויק, שמתחשב בכך שהשדה של הכריכה הגדולה מתחזק מעט ככל שמתרחקים מהמרכז שלה, נותן שטף גדול ב-$0.38\%$ בערך. האם זה משנה את התשובה לסעיף ב?
    answer: >-
      א. השדה כמעט אחיד על פני הסליל הקטן ושווה לשדה במרכז; $\Phi \approx 3.95\cdot10^{-8}\,\text{Wb}$.

      ב. $|\varepsilon| \approx 3.95\cdot10^{-3}\,\text{V}$, $I \approx 9.9\cdot10^{-4}\,\text{A}$.

      ג. לא, ברמת הדיוק של הנתונים: $3.96\cdot10^{-3}\,\text{V}$ במקום $3.95\cdot10^{-3}\,\text{V}$.
    solution:
      - kind: given
        text: >-
          $b = 0.2\,\text{m}$, $a = 0.02\,\text{m}$, $N = 500$, $R = 4\,\Omega$. הזרם בכריכה הגדולה משתנה מ-$+10\,\text{A}$ ל-$-10\,\text{A}$ תוך $\Delta t = 0.01\,\text{s}$.
      - kind: formula
        text: >-
          השדה במרכז כריכה עגולה $B = \dfrac{\mu_0 I}{2b}$ (שיעור 4.3), $\Phi = BA$ עם $A = \pi a^2$, $|\varepsilon| = N\,\dfrac{|\Delta\Phi|}{\Delta t}$, $I = \dfrac{|\varepsilon|}{R}$.
      - kind: reasoning
        text: >-
          א. הסליל הקטן תופס רק את האזור הקרוב למרכז הכריכה הגדולה, $a/b = 0.1$. שם השדה כמעט לא משתנה ממקום למקום, ולכן מציבים בכל שטח הסליל את השדה שבמרכז.
      - kind: substitution
        text: >-
          א. $B = \dfrac{4\pi\cdot10^{-7}\cdot10}{2\cdot0.2} \approx 3.14\cdot10^{-5}\,\text{T}$, $A = \pi\cdot0.02^2 \approx 1.26\cdot10^{-3}\,\text{m}^2$, ולכן $\Phi \approx 3.95\cdot10^{-8}\,\text{Wb}$.

          ב. הזרם מתהפך, ולכן השטף מתהפך: $|\Delta\Phi| = 2\cdot3.95\cdot10^{-8} = 7.90\cdot10^{-8}\,\text{Wb}$. $|\varepsilon| = 500\cdot\dfrac{7.90\cdot10^{-8}}{0.01} \approx 3.95\cdot10^{-3}\,\text{V}$, ו-$I = \dfrac{3.95\cdot10^{-3}}{4} \approx 9.9\cdot10^{-4}\,\text{A}$.
      - kind: reasoning
        text: >-
          ג. תיקון של פחות מאחוז אחד משנה רק את הספרה השלישית: $3.95\cdot10^{-3}\cdot1.0038 \approx 3.96\cdot10^{-3}\,\text{V}$. הנתונים נתונים בשתי ספרות, ולכן הקירוב טוב.
      - kind: result
        text: >-
          א. שדה אחיד, $\Phi \approx 3.95\cdot10^{-8}\,\text{Wb}$. ב. $3.95\cdot10^{-3}\,\text{V}$, $9.9\cdot10^{-4}\,\text{A}$. ג. לא משנה.
    source:
      name: JEE Main
      year: 2017
      problem: '8 April 2017 (online), Question 21: a small circular loop at the centre of a much larger coplanar loop carrying I₀cos ωt; the emf induced in the small loop'
      url: 'https://cracku.in/21-a-small-circular-loop-of-wire-of-radius-a-is-locat-x-nta-jee-main-8-apr-2017-online'
      verified: '2026-11-05'
      adapted: true

  - id: W-5.2-c2
    stars: 2
    objectives: [OBJ-5.2-4, OBJ-5.2-2]
    prompt: >-
      טבעת מתיל נחושת מבודד מסובבים פעם אחת באמצע, כך שהיא נעשית "שמינייה": שתי לולאות באותו מישור, אחת ששטחה $A = 50\,\text{cm}^2$ ואחת ששטחה $2A$. בנקודה שבה התיל חוצה את עצמו הוא מבודד, כך שזה תיל אחד רציף. ההתנגדות של כל התיל $0.5\,\Omega$. השמינייה מונחת במישור הדף, בשדה מגנטי אחיד שניצב לדף.

      א. הולכים לאורך התיל, פעם אחת סביב כל השמינייה. הראו שאם בלולאה אחת מקיפים אותה עם כיוון השעון, בלולאה השנייה מקיפים אותה נגד כיוון השעון. מה זה אומר על הכיוון החיובי ועל האנך של כל לולאה?

      ב. השדה עולה בקצב קבוע מ-$0$ ל-$0.8\,\text{T}$ תוך $0.2\,\text{s}$. מה גודל הכא"מ הממוצע בכל התיל, ומה הזרם?

      ג. מה היה הכא"מ אילו לא סובבו את הטבעת, והיא הייתה לולאה אחת ששטחה $3A$?

      ד. השדה קבוע, $0.8\,\text{T}$, ומסובבים את השמינייה ברבע סיבוב סביב הקו שעובר דרך שתי הלולאות ודרך נקודת החצייה, תוך $0.1\,\text{s}$. מה הכא"מ הממוצע? השוו לכא"מ בלולאה הקטנה לבדה.
    answer: >-
      א. הכיוונים החיוביים, והאנכים, של שתי הלולאות הפוכים.

      ב. $0.02\,\text{V}$, $0.04\,\text{A}$.

      ג. $0.06\,\text{V}$.

      ד. $0.04\,\text{V}$, כמו בלולאה הקטנה לבדה.
    solution:
      - kind: reasoning
        text: >-
          א. בנקודת החצייה התיל עובר מצד אחד של השמינייה לצד השני. מי שהולך לאורכו עם כיוון השעון בלולאה הראשונה, יוצא ממנה בנקודת החצייה ונכנס ללולאה השנייה כשהוא מקיף אותה בכיוון ההפוך. כשבוחרים כיוון חיובי אחד לכל התיל, הכיוון החיובי בלולאה אחת הוא עם כיוון השעון ובשנייה נגדו, ולכן, לפי כלל יד ימין, האנכים שלהן הפוכים: אחד ⊙ ואחד ⊗.
      - kind: formula
        text: >-
          הכא"מים של שתי הלולאות מחוברים בטור, ולכן הכא"מ הכולל הוא $-\dfrac{\Delta(\Phi_1 + \Phi_2)}{\Delta t}$, כשכל שטף נמדד לאורך האנך של הלולאה שלו. $\Phi = BA\cos\theta$.
      - kind: reasoning
        text: >-
          ב. השדה עובר דרך הלולאה הגדולה בכיוון האנך שלה ודרך הקטנה נגד האנך שלה (או להפך), ולכן $\Phi_1 + \Phi_2 = B(2A - A) = BA$: השמינייה מתנהגת כמו לולאה אחת ששטחה $A$.
      - kind: substitution
        text: >-
          ב. $|\varepsilon| = \dfrac{0.8\cdot50\cdot10^{-4}}{0.2} = 0.02\,\text{V}$, ו-$I = \dfrac{0.02}{0.5} = 0.04\,\text{A}$.

          ג. $|\varepsilon| = \dfrac{0.8\cdot3\cdot50\cdot10^{-4}}{0.2} = 0.06\,\text{V}$.

          ד. השטף הכולל עובר מ-$BA$ ל-$BA\cos90^\circ = 0$: $|\varepsilon| = \dfrac{0.8\cdot50\cdot10^{-4}}{0.1} = 0.04\,\text{V}$. הלולאה הקטנה לבדה, ששטחה $A$, הייתה נותנת בדיוק אותו כא"מ.
      - kind: result
        text: >-
          א. אנכים הפוכים. ב. $0.02\,\text{V}$, $0.04\,\text{A}$. ג. $0.06\,\text{V}$. ד. $0.04\,\text{V}$, כמו הלולאה הקטנה לבדה.
    source:
