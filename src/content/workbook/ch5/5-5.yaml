# Workbook, lesson 5.5 (flux, emf and current graphs; the charge Q = NΔΦ/R). Format and rules: see .claude/CLAUDE.md,
# "Worked examples, workbook". Every number was recomputed with src/physics/fluxgraphs.ts (pieceEmfs, passEmf,
# passCurrent, passPushForce, passPushPower, passWork, passCharge, passTimes) and src/physics/induction.ts
# (chargeThrough, fluxUniform, railStep for c2); scripts nums.ts, wb.mts, wb2.mts in the session scratchpad.
# Signs as in the lesson: the normal along the field, so the flux is positive; positive emf and current are clockwise
# when the field points into the page.
# In a >- block, consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '5.5'
practice:
  - id: W-5.5-01
    level: basic
    qualitative: false
    objectives: [OBJ-5.5-1]
    prompt: >-
      סליל של $25$ ליפופים מחובר לנגד, וההתנגדות הכוללת של המעגל $5\,\Omega$. השטף דרך כל ליפוף עולה בקו ישר מאפס ל-$8\,\text{mWb}$ בין $t = 0$ ל-$t = 4\,\text{s}$, נשאר קבוע עד $t = 6\,\text{s}$, ויורד בקו ישר לאפס עד $t = 8\,\text{s}$.

      א. מה הכא"מ בכל קטע?

      ב. שרטטו את גרף הזרם, ורשמו עליו את הערכים.
    answer: >-
      א. $-0.05\,\text{V}$, אפס, $+0.1\,\text{V}$.

      ב. מדרגות של $-10\,\text{mA}$ (0 עד 4 שניות), אפס (4 עד 6 שניות) ו-$+20\,\text{mA}$ (6 עד 8 שניות).
    solution:
      - kind: given
        text: >-
          $N = 25$, $R = 5\,\Omega$. שלושה קטעים ישרים: עלייה של $8\cdot10^{-3}\,\text{Wb}$ ב-$4\,\text{s}$, קטע קבוע, וירידה של $8\cdot10^{-3}\,\text{Wb}$ ב-$2\,\text{s}$.
      - kind: formula
        text: >-
          $\varepsilon = -N\dfrac{\Delta\Phi}{\Delta t}$, $I = \dfrac{\varepsilon}{R}$.
      - kind: substitution
        text: >-
          א. $\varepsilon_1 = -25\cdot\dfrac{8\cdot10^{-3}}{4} = -0.05\,\text{V}$; $\varepsilon_2 = 0$; $\varepsilon_3 = -25\cdot\dfrac{-8\cdot10^{-3}}{2} = +0.1\,\text{V}$.

          ב. $I_1 = \dfrac{-0.05}{5} = -0.01\,\text{A}$; $I_2 = 0$; $I_3 = \dfrac{0.1}{5} = 0.02\,\text{A}$.
      - kind: reasoning
        text: >-
          הירידה תלולה פי 2 מהעלייה (אותו שינוי בחצי זמן), ולכן המדרגה השלישית גבוהה פי 2 מהראשונה, ובסימן הפוך. בדיקה בעזרת השטחים: $0.01\cdot4 = 0.04\,\text{C}$ מתחת לציר, ו-$0.02\cdot2 = 0.04\,\text{C}$ מעליו. השטחים שווים, כי השטף חזר לאפס.
      - kind: result
        text: >-
          א. $-0.05\,\text{V}$, $0$, $+0.1\,\text{V}$.

          ב. $-10\,\text{mA}$, $0$, $+20\,\text{mA}$.

  - id: W-5.5-02
    level: basic
    qualitative: true
    objectives: [OBJ-5.5-1]
    prompt: >-
      לולאה קבועה נמצאת בשדה מגנטי שניצב למישור שלה, והשדה משתנה עם הזמן. בארבעה פרקי זמן השדה מתנהג כך:

      (1) השדה עולה בקצב קבוע.

      (2) השדה גדול וקבוע.

      (3) השדה יורד לאט, בקצב קבוע.

      (4) השדה יורד מהר, בקצב קבוע, ועובר דרך אפס.

      קבעו ונמקו: באיזה פרק זמן אין זרם? באיזה פרק הזרם הכי גדול? באילו פרקים הזרם באותו כיוון?
    answer: >-
      אין זרם ב-(2). הזרם הכי גדול ב-(4). ב-(3) וב-(4) הזרם באותו כיוון, וב-(1) בכיוון ההפוך.
    solution:
      - kind: formula
        text: >-
          בלולאה קבועה $\Phi = BA$, ולכן $\varepsilon = -A\dfrac{\Delta B}{\Delta t}$: הזרם תלוי בקצב השינוי של השדה, והסימן שלו נקבע לפי הסימן של הקצב.
      - kind: reasoning
        text: >-
          ב-(2) השדה גדול, אבל לא משתנה: אין כא"מ ואין זרם. ב-(4) הקצב הכי גדול, ולכן גם הזרם. ב-(3) וב-(4) השדה יורד, הקצב שלילי, והזרם באותו כיוון; העובדה שב-(4) השדה עובר דרך אפס לא משנה דבר, כי הוא ממשיך לרדת. ב-(1) השדה עולה, והזרם בכיוון ההפוך.
      - kind: result
        text: >-
          אין זרם ב-(2); הזרם הגדול ביותר ב-(4); כיוון אחד ב-(3) וב-(4), והכיוון ההפוך ב-(1).

  - id: W-5.5-03
    level: basic
    qualitative: false
    objectives: [OBJ-5.5-2]
    prompt: >-
      לולאה מרובעת של ליפוף אחד, שהצלע שלה $10\,\text{cm}$ וההתנגדות שלה $0.2\,\Omega$, נכנסת במהירות קבועה של $2\,\text{m/s}$ לשדה מגנטי אחיד של $0.3\,\text{T}$, החוצה מהדף (⊙). הלולאה נעה ימינה.

      א. מה הכא"מ והזרם בזמן הכניסה?

      ב. כמה זמן נמשכת הכניסה?

      ג. מה כיוון הזרם, כשמסתכלים על הדף?
    answer: >-
      א. $0.06\,\text{V}$, $0.3\,\text{A}$.

      ב. $0.05\,\text{s}$.

      ג. בכיוון השעון.
    solution:
      - kind: given
        text: >-
          $h = w = 0.1\,\text{m}$, $R = 0.2\,\Omega$, $v = 2\,\text{m/s}$, $B = 0.3\,\text{T}$ החוצה מהדף.
      - kind: formula
        text: >-
          $|\varepsilon| = Bhv$, $I = \dfrac{|\varepsilon|}{R}$, ומשך הכניסה $\dfrac{w}{v}$.
      - kind: substitution
        text: >-
          א. $|\varepsilon| = 0.3\cdot0.1\cdot2 = 0.06\,\text{V}$, $I = \dfrac{0.06}{0.2} = 0.3\,\text{A}$.

          ב. $t = \dfrac{0.1}{2} = 0.05\,\text{s}$.
      - kind: reasoning
        text: >-
          ג. השטף החוצה מהדף גדל. לפי חוק לנץ, הזרם יוצר בתוך הלולאה שדה **לתוך** הדף, ולפי כלל יד ימין זה זרם בכיוון השעון. (בשדה לתוך הדף, כמו בשיעור, הכיוון היה הפוך.)
      - kind: result
        text: >-
          א. $0.06\,\text{V}$ ו-$0.3\,\text{A}$. ב. $0.05\,\text{s}$. ג. בכיוון השעון.

  - id: W-5.5-04
    level: mid
    qualitative: true
    objectives: [OBJ-5.5-2]
    prompt: >-
      לולאה מלבנית של ליפוף אחד **רחבה מרצועת השדה**: הצלע שלה לאורך התנועה $50\,\text{cm}$, והצלע הניצבת לתנועה $10\,\text{cm}$. היא נעה ימינה במהירות קבועה של $0.5\,\text{m/s}$ דרך רצועה ברוחב $20\,\text{cm}$, שבה שדה אחיד של $0.4\,\text{T}$ לתוך הדף. ההתנגדות שלה $0.1\,\Omega$. ברגע $t = 0$ הצלע הימנית נמצאת $10\,\text{cm}$ משמאל לרצועה.

      א. תארו את שלבי המעבר: מתי כל צלע נכנסת לרצועה ויוצאת ממנה?

      ב. שרטטו את גרף השטף ואת גרף הזרם. מה השטף המרבי, ומה גודל הזרם?

      ג. קבעו ונמקו: בין $t = 0.6\,\text{s}$ ל-$t = 1.2\,\text{s}$ שתי הצלעות הניצבות לתנועה **מחוץ** לשדה. האם זורם זרם?
    answer: >-
      א. הצלע הימנית ברצועה בין $0.2$ ל-$0.6\,\text{s}$; השמאלית בין $1.2$ ל-$1.6\,\text{s}$.

      ב. השטף עולה ל-$8\,\text{mWb}$, קבוע, ויורד לאפס; הזרם $0.2\,\text{A}$ נגד כיוון השעון, אפס, ו-$0.2\,\text{A}$ בכיוון השעון.

      ג. לא: כל הרצועה בתוך הלולאה, והשטף קבוע.
    solution:
      - kind: given
        text: >-
          $w = 0.5\,\text{m}$, $h = 0.1\,\text{m}$, $v = 0.5\,\text{m/s}$, $d = 0.2\,\text{m}$, $B = 0.4\,\text{T}$, $R = 0.1\,\Omega$.
      - kind: reasoning
        text: >-
          א. הצלע הימנית מגיעה לרצועה אחרי $\dfrac{0.1}{0.5} = 0.2\,\text{s}$ ויוצאת ממנה אחרי עוד $\dfrac{0.2}{0.5} = 0.4\,\text{s}$, ב-$0.6\,\text{s}$. הצלע השמאלית נמצאת $50\,\text{cm}$ אחריה, כלומר $1\,\text{s}$ אחריה: היא ברצועה בין $1.2$ ל-$1.6\,\text{s}$.
      - kind: formula
        text: >-
          השטף הוא השדה כפול השטח של החלק מהרצועה שנמצא בתוך הלולאה. $|\varepsilon| = Bhv$ כשרק צלע אחת ברצועה.
      - kind: substitution
        text: >-
          ב. $\Phi_{\max} = Bhd = 0.4\cdot0.1\cdot0.2 = 8\cdot10^{-3}\,\text{Wb}$. $|\varepsilon| = 0.4\cdot0.1\cdot0.5 = 0.02\,\text{V}$, $I = \dfrac{0.02}{0.1} = 0.2\,\text{A}$.
      - kind: reasoning
        text: >-
          ג. בין $0.6$ ל-$1.2\,\text{s}$ הרצועה כולה בתוך הלולאה, והשטף נשאר $Bhd$. אין שינוי בשטף, ולכן אין זרם, גם אם אף צלע לא נמצאת בשדה. כאן הגבול של **השדה** הוא שקובע את השטף, לא הגבול של הלולאה.
      - kind: result
        text: >-
          ב. השטף: אפס, עולה בקו ישר ל-$8\,\text{mWb}$ (0.2 עד 0.6 שניות), קבוע עד $1.2\,\text{s}$, יורד לאפס עד $1.6\,\text{s}$. הזרם: $0.2\,\text{A}$ נגד כיוון השעון, אפס, $0.2\,\text{A}$ בכיוון השעון.

          ג. לא זורם זרם.

  - id: W-5.5-05
    level: mid
    qualitative: false
    objectives: [OBJ-5.5-3]
    prompt: >-
      מסגרת מלבנית של $20$ ליפופים, $8\,\text{cm}$ לאורך התנועה ו-$5\,\text{cm}$ בניצב לה, נדחפת במהירות קבועה של $0.4\,\text{m/s}$ דרך רצועת שדה רחבה ממנה, שבה $B = 0.5\,\text{T}$. ההתנגדות של המסגרת $4\,\Omega$. אין חיכוך.

      א. מה הכוח שצריך להפעיל בזמן הכניסה?

      ב. הראו שההספק של הכוח שווה להספק שהופך לחום.

      ג. כמה אנרגיה הופכת לחום במעבר שלם דרך הרצועה?
    answer: >-
      א. $0.025\,\text{N}$, בכיוון התנועה.

      ב. $Fv = I^2R = 0.01\,\text{W}$.

      ג. $4\cdot10^{-3}\,\text{J}$.
    solution:
      - kind: given
        text: >-
          $N = 20$, $w = 0.08\,\text{m}$, $h = 0.05\,\text{m}$, $v = 0.4\,\text{m/s}$, $B = 0.5\,\text{T}$, $R = 4\,\Omega$.
      - kind: formula
        text: >-
          $\varepsilon = NBhv$, $I = \dfrac{\varepsilon}{R}$, והדחיפה שווה לכוח הבולם על $N$ הצלעות שבשדה: $F = NBIh$.
      - kind: substitution
        text: >-
          א. $\varepsilon = 20\cdot0.5\cdot0.05\cdot0.4 = 0.2\,\text{V}$, $I = \dfrac{0.2}{4} = 0.05\,\text{A}$, $F = 20\cdot0.5\cdot0.05\cdot0.05 = 0.025\,\text{N}$.

          ב. $Fv = 0.025\cdot0.4 = 0.01\,\text{W}$; $I^2R = 0.05^2\cdot4 = 0.01\,\text{W}$.

          ג. הדחיפה פועלת לאורך $w$ בכניסה ולאורך $w$ ביציאה: $W = 2Fw = 2\cdot0.025\cdot0.08 = 4\cdot10^{-3}\,\text{J}$.
      - kind: result
        text: >-
          א. $0.025\,\text{N}$. ב. שניהם $0.01\,\text{W}$. ג. $4\cdot10^{-3}\,\text{J}$ של חום.

  - id: W-5.5-06
    level: mid
    qualitative: false
    objectives: [OBJ-5.5-4]
    prompt: >-
      בתוך סליל ארוך יש שדה מגנטי אחיד של $0.04\,\text{T}$, לאורך הציר. בתוך הסליל מונח סליל קטן של $150$ ליפופים, ששטח כל ליפוף $5\,\text{cm}^2$, ומישור הליפופים שלו ניצב לציר. הסליל הקטן מחובר למד מטען, וההתנגדות הכוללת של המעגל שלו $30\,\Omega$. מסובבים את הסליל הקטן ברבע סיבוב, עד שמישור הליפופים שלו מקביל לציר.

      א. מה השינוי בשטף דרך כל ליפוף?

      ב. כמה מטען עובר?
    answer: >-
      א. $2\cdot10^{-5}\,\text{Wb}$ (מ-$BA$ לאפס).

      ב. $10^{-4}\,\text{C}$.
    solution:
      - kind: given
        text: >-
          $B = 0.04\,\text{T}$, $N = 150$, $A = 5\cdot10^{-4}\,\text{m}^2$, $R = 30\,\Omega$.
      - kind: reasoning
        text: >-
          בהתחלה השדה ניצב למישור הליפופים, $\Phi = BA$. אחרי רבע סיבוב השדה במישור הליפופים, ואף קו שדה לא עובר דרכם: $\Phi = 0$.
      - kind: formula
        text: >-
          $Q = \dfrac{N|\Delta\Phi|}{R}$.
      - kind: substitution
        text: >-
          א. $|\Delta\Phi| = 0.04\cdot5\cdot10^{-4} = 2\cdot10^{-5}\,\text{Wb}$.

          ב. $Q = \dfrac{150\cdot2\cdot10^{-5}}{30} = 10^{-4}\,\text{C}$.
      - kind: result
        text: >-
          א. $2\cdot10^{-5}\,\text{Wb}$. ב. $10^{-4}\,\text{C} = 100\,\mu\text{C}$, באיזו מהירות שלא יסובבו את הסליל.

  - id: W-5.5-07
    level: mid
    qualitative: true
    objectives: [OBJ-5.5-1, OBJ-5.5-4]
    prompt: >-
      שתי תלמידות מקרבות מגנט לסליל ואחר כך מרחיקות אותו, כך שהשטף דרך הסליל עולה מאפס ל-$\Phi_0$ וחוזר לאפס. נגה מקרבת ומרחיקה בקצב אחיד, שנייה בכל כיוון. עדי מקרבת בשנייה אחת, אבל מרחיקה בתנועה חדה, בעשירית שנייה.

      קבעו ונמקו:

      א. אצל מי הזרם המרבי גדול יותר, ופי כמה?

      ב. האם המטען שעובר בזמן ההרחקה שונה אצל השתיים?

      ג. כמה מטען עובר נטו, אצל כל אחת, מתחילת התנועה ועד סופה?
    answer: >-
      א. אצל עדי, בזמן ההרחקה: פי 10.

      ב. לא: אותו מטען, $N\Phi_0/R$.

      ג. אפס אצל שתיהן.
    solution:
      - kind: formula
        text: >-
          $|I| = \dfrac{N}{R}\cdot\dfrac{|\Delta\Phi|}{\Delta t}$, ו-$Q = \dfrac{N|\Delta\Phi|}{R}$.
      - kind: reasoning
        text: >-
          א. בהרחקה של עדי אותו שינוי בשטף, $\Phi_0$, קורה ב-$0.1\,\text{s}$ במקום ב-$1\,\text{s}$: השיפוע גדול פי 10, וכך גם הזרם.

          ב. המטען תלוי רק בשינוי השטף, $\Phi_0$, שזהה. אצל עדי הזרם גדול פי 10, אבל זורם עשירית מהזמן: השטח מתחת לגרף הזרם זהה.

          ג. אצל שתיהן השטף חזר לאפס, ולכן $\Delta\Phi = 0$ נטו. בקירוב ובהרחקה עובר אותו מטען בכיוונים הפוכים.
      - kind: result
        text: >-
          א. אצל עדי, פי 10. ב. אותו מטען, $N\Phi_0/R$. ג. אפס אצל שתיהן.

  - id: W-5.5-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-5.5-2, OBJ-5.5-3, OBJ-5.5-4]
    prompt: >-
      לולאה מלבנית של ליפוף אחד, $30\,\text{cm}$ לאורך התנועה ו-$20\,\text{cm}$ בניצב לה, שההתנגדות שלה $0.4\,\Omega$, נדחפת ימינה במהירות קבועה של $1.5\,\text{m/s}$ דרך רצועה ברוחב $60\,\text{cm}$, שבה שדה מגנטי אחיד של $0.5\,\text{T}$ לתוך הדף. ברגע $t = 0$ הצלע הימנית נמצאת $15\,\text{cm}$ משמאל לרצועה. אין חיכוך.

      א. שרטטו את גרף השטף, גרף הזרם (חיובי בכיוון השעון) וגרף הכוח שצריך להפעיל, כפונקציה של הזמן, מ-$t = 0$ עד $t = 0.8\,\text{s}$. רשמו את הזמנים ואת הערכים.

      ב. כמה מטען עובר בכניסה, וכמה במעבר כולו?

      ג. כמה אנרגיה הופכת לחום במעבר כולו?

      ד. מחליפים את הלולאה בלולאה זהה מתיל דק יותר, שההתנגדות שלה $0.8\,\Omega$. מה משתנה בכל אחת מהתשובות?
    answer: >-
      א. השטף: אפס עד $0.1\,\text{s}$, עולה ל-$0.03\,\text{Wb}$ עד $0.3\,\text{s}$, קבוע עד $0.5\,\text{s}$, יורד לאפס עד $0.7\,\text{s}$. הזרם: $-0.375\,\text{A}$, אפס, $+0.375\,\text{A}$. הכוח: $0.0375\,\text{N}$ בכניסה וביציאה, אפס ביניהן.

      ב. $0.075\,\text{C}$ בכניסה (נגד כיוון השעון); אפס במעבר כולו.

      ג. $0.0225\,\text{J}$.

      ד. הזרם, הכוח, החום והמטען בכניסה קטנים פי 2; הכא"מ, הזמנים והמטען נטו (אפס) לא משתנים.
    solution:
      - kind: given
        text: >-
          $w = 0.3\,\text{m}$, $h = 0.2\,\text{m}$, $R = 0.4\,\Omega$, $v = 1.5\,\text{m/s}$, $d = 0.6\,\text{m}$, $B = 0.5\,\text{T}$, $N = 1$.
      - kind: reasoning
        text: >-
          הזמנים: הצלע הימנית מגיעה לרצועה אחרי $\dfrac{0.15}{1.5} = 0.1\,\text{s}$; הכניסה נמשכת $\dfrac{0.3}{1.5} = 0.2\,\text{s}$, עד $0.3\,\text{s}$; הצלע הימנית מגיעה לקצה הרצועה אחרי $0.1 + \dfrac{0.6}{1.5} = 0.5\,\text{s}$; והיציאה נמשכת עד $0.7\,\text{s}$.
      - kind: formula
        text: >-
          $\Phi_{\max} = Bhw$, $|\varepsilon| = Bhv$, $I = \dfrac{|\varepsilon|}{R}$, $F = BIh$, $Q = \dfrac{|\Delta\Phi|}{R}$, והחום שווה לעבודת הדחיפה, $2Fw$.
      - kind: substitution
        text: >-
          א. $\Phi_{\max} = 0.5\cdot0.2\cdot0.3 = 0.03\,\text{Wb}$. $|\varepsilon| = 0.5\cdot0.2\cdot1.5 = 0.15\,\text{V}$, $I = \dfrac{0.15}{0.4} = 0.375\,\text{A}$, $F = 0.5\cdot0.375\cdot0.2 = 0.0375\,\text{N}$.

          ב. $Q = \dfrac{0.03}{0.4} = 0.075\,\text{C}$; בדיקה: $0.375\cdot0.2 = 0.075\,\text{C}$.

          ג. $W = 2\cdot0.0375\cdot0.3 = 0.0225\,\text{J}$; בדיקה: $I^2R\cdot0.4\,\text{s} = 0.375^2\cdot0.4\cdot0.4 = 0.0225\,\text{J}$.
      - kind: reasoning
        text: >-
          כיוונים: בכניסה השטף לתוך הדף גדל, והזרם נגד כיוון השעון (שלילי); ביציאה בכיוון השעון (חיובי). הכוח שצריך להפעיל תמיד ימינה, בכיוון התנועה, כי הכוח המגנטי תמיד בולם: שתי מדרגות חיוביות.

          ד. $\varepsilon = Bhv$ לא תלוי ב-$R$. $I$, $F = BIh$ ו-$Q = |\Delta\Phi|/R$ פרופורציוניים ל-$1/R$, וגם החום $2Fw$.
      - kind: result
        text: >-
          א. כמו בתשובה הקצרה. ב. $0.075\,\text{C}$ בכניסה, אפס נטו. ג. $0.0225\,\text{J}$.

          ד. ב-$0.8\,\Omega$: $I = 0.1875\,\text{A}$, $F = 0.01875\,\text{N}$, חום $0.01125\,\text{J}$, ומטען $0.0375\,\text{C}$ בכניסה; הכא"מ $0.15\,\text{V}$ והזמנים כמו קודם.

  - id: W-5.5-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-5.5-1, OBJ-5.5-4]
    prompt: >-
      סליל קבוע של $40$ ליפופים, ששטח כל ליפוף $0.01\,\text{m}^2$, ניצב לשדה מגנטי אחיד. ההתנגדות הכוללת של המעגל $8\,\Omega$. השדה משתנה כך: בין $t = 0$ ל-$t = 0.1\,\text{s}$ הוא עולה בקו ישר מאפס ל-$0.2\,\text{T}$; עד $t = 0.3\,\text{s}$ הוא קבוע; ועד $t = 0.6\,\text{s}$ הוא יורד בקו ישר ל-$-0.1\,\text{T}$ (כלומר $0.1\,\text{T}$ בכיוון ההפוך).

      א. מה הזרם בכל קטע? שרטטו את גרף הזרם.

      ב. כמה מטען עובר בקטע הראשון, וכמה בקטע השלישי?

      ג. כמה מטען עובר נטו בין $t = 0$ ל-$t = 0.6\,\text{s}$? הראו שהתשובה מתאימה ל-$N\Delta\Phi/R$ של השינוי הכולל.
    answer: >-
      א. $-0.1\,\text{A}$, אפס, $+0.05\,\text{A}$.

      ב. $0.01\,\text{C}$ ו-$0.015\,\text{C}$, בכיוונים הפוכים.

      ג. $0.005\,\text{C}$, בכיוון של הקטע השלישי.
    solution:
      - kind: given
        text: >-
          $N = 40$, $A = 0.01\,\text{m}^2$, $R = 8\,\Omega$. הקטע הראשון: $\Delta B = +0.2\,\text{T}$ ב-$0.1\,\text{s}$. הקטע השלישי: $\Delta B = -0.3\,\text{T}$ ב-$0.3\,\text{s}$.
      - kind: formula
        text: >-
          $\varepsilon = -NA\dfrac{\Delta B}{\Delta t}$, $I = \dfrac{\varepsilon}{R}$, $Q = I\,\Delta t = -\dfrac{NA\,\Delta B}{R}$.
      - kind: substitution
        text: >-
          א. $\varepsilon_1 = -40\cdot0.01\cdot\dfrac{0.2}{0.1} = -0.8\,\text{V}$, $I_1 = -0.1\,\text{A}$; $I_2 = 0$; $\varepsilon_3 = -40\cdot0.01\cdot\dfrac{-0.3}{0.3} = +0.4\,\text{V}$, $I_3 = 0.05\,\text{A}$.

          ב. $Q_1 = 0.1\cdot0.1 = 0.01\,\text{C}$; $Q_3 = 0.05\cdot0.3 = 0.015\,\text{C}$.

          ג. $Q = -0.01 + 0.015 = +0.005\,\text{C}$. מהשינוי הכולל: $\Delta\Phi = A\,(B_{\text{end}} - B_{\text{start}}) = 0.01\cdot(-0.1 - 0) = -10^{-3}\,\text{Wb}$, ו-$-\dfrac{N\,\Delta\Phi}{R} = -\dfrac{40\cdot(-10^{-3})}{8} = +0.005\,\text{C}$.
      - kind: reasoning
        text: >-
          שימו לב: בקטע השלישי השדה מתהפך באמצע (ב-$t = 0.4\,\text{s}$), אבל הזרם לא מתהפך שם, כי השדה ממשיך לרדת באותו קצב. המטען נטו שונה מאפס כי השדה לא חזר לערך ההתחלתי.
      - kind: result
        text: >-
          א. $-0.1\,\text{A}$ (0 עד 0.1 שניות), $0$ (עד 0.3), $+0.05\,\text{A}$ (עד 0.6). ב. $0.01\,\text{C}$ ו-$0.015\,\text{C}$. ג. $0.005\,\text{C}$ נטו, כמו $N|\Delta\Phi|/R$.

  - id: W-5.5-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-5.5-3, OBJ-5.5-2, OBJ-5.5-4]
    prompt: >-
      תלמיד מושך לולאה מרובעת של ליפוף אחד דרך רצועת שדה רחבה ממנה, במהירות קבועה של $0.4\,\text{m/s}$, בעזרת חיישן כוח. ההתנגדות של הלולאה $0.5\,\Omega$, והצלע הניצבת לתנועה $10\,\text{cm}$. אין חיכוך. בגרף הכוח שהחיישן מודד יש שתי מדרגות, כל אחת של $8\cdot10^{-3}\,\text{N}$ ובמשך $0.25\,\text{s}$, ואפס ביניהן.

      א. מה עוצמת השדה ברצועה?

      ב. מה הצלע של הלולאה לאורך התנועה?

      ג. מה הזרם בזמן מדרגה, וכמה מטען עובר בה?

      ד. קבעו ונמקו: למה שתי המדרגות בגרף הכוח באותו סימן, אף שהזרם בהן בכיוונים הפוכים?
    answer: >-
      א. $1\,\text{T}$.

      ב. $10\,\text{cm}$.

      ג. $0.08\,\text{A}$, $0.02\,\text{C}$.

      ד. ביציאה גם הזרם מתהפך וגם הצלע שבשדה מתחלפת; הכוח המגנטי נשאר נגד התנועה, והדחיפה בכיוון התנועה.
    solution:
      - kind: given
        text: >-
          $v = 0.4\,\text{m/s}$, $R = 0.5\,\Omega$, $h = 0.1\,\text{m}$, $F = 8\cdot10^{-3}\,\text{N}$, משך כל מדרגה $\Delta t = 0.25\,\text{s}$.
      - kind: formula
        text: >-
          $F = BIh = \dfrac{B^2h^2v}{R}$. מבודדים את $B$: מכפילים ב-$R$ ומחלקים ב-$h^2v$, $B^2 = \dfrac{FR}{h^2v}$.
      - kind: substitution
        text: >-
          א. $B^2 = \dfrac{8\cdot10^{-3}\cdot0.5}{0.1^2\cdot0.4} = \dfrac{4\cdot10^{-3}}{4\cdot10^{-3}} = 1\,\text{T}^2$, ולכן $B = 1\,\text{T}$.

          ב. מדרגה נמשכת כל עוד הלולאה נכנסת: $w = v\,\Delta t = 0.4\cdot0.25 = 0.1\,\text{m}$.

          ג. $I = \dfrac{Bhv}{R} = \dfrac{1\cdot0.1\cdot0.4}{0.5} = 0.08\,\text{A}$, ו-$Q = I\,\Delta t = 0.08\cdot0.25 = 0.02\,\text{C}$. בדיקה: $Q = \dfrac{Bhw}{R} = \dfrac{1\cdot0.1\cdot0.1}{0.5} = 0.02\,\text{C}$.
      - kind: reasoning
        text: >-
          ד. בכניסה הצלע הקדמית בשדה, וביציאה האחורית; הזרם מתהפך, וגם הצלע מתחלפת. בכלל כף יד ימין שני ההיפוכים מבטלים זה את זה, והכוח המגנטי נגד התנועה בשני המקרים, כמו שחוק לנץ דורש. לכן החיישן מודד דחיפה בכיוון התנועה בשתי המדרגות.
      - kind: result
        text: >-
          א. $B = 1\,\text{T}$. ב. $w = 10\,\text{cm}$. ג. $0.08\,\text{A}$ ו-$0.02\,\text{C}$. ד. שני ההיפוכים מבטלים זה את זה: הכוח תמיד בולם.

challenge:
  - id: W-5.5-c1
    stars: 1
    objectives: [OBJ-5.5-4, OBJ-5.5-1]
    prompt: >-
      בסליל שההתנגדות הכוללת שלו $100\,\Omega$ מושרה זרם, כי השטף דרכו משתנה. גרף הזרם הוא משולש: הזרם עולה בקו ישר מאפס ל-$10\,\text{A}$ ברגע $t = 0.25\,\text{s}$, ויורד בקו ישר חזרה לאפס ברגע $t = 0.5\,\text{s}$.

      א. מה גודל השינוי בשטף דרך הסליל (השטף דרך כל הליפופים יחד, $N\Phi$)?

      ב. אם בסליל $50$ ליפופים, בכמה השתנה השטף דרך כל ליפוף?

      ג. קבעו ונמקו: השטף השתנה בכיוון אחד בכל חצי השנייה, או שבאמצע הוא התחיל לחזור?
    answer: >-
      א. $250\,\text{Wb}$.

      ב. $5\,\text{Wb}$.

      ג. בכיוון אחד: הזרם לא החליף סימן, ולכן השטף השתנה כל הזמן באותו כיוון; הוא השתנה הכי מהר ב-$t = 0.25\,\text{s}$.
    solution:
      - kind: formula
        text: >-
          המטען הוא השטח מתחת לגרף הזרם, ו-$Q = \dfrac{|\Delta(N\Phi)|}{R}$. מבודדים: $|\Delta(N\Phi)| = QR$.
      - kind: substitution
        text: >-
          א. שטח המשולש: $Q = \tfrac{1}{2}\cdot0.5\cdot10 = 2.5\,\text{C}$; $|\Delta(N\Phi)| = 2.5\cdot100 = 250\,\text{Wb}$.

          ב. $|\Delta\Phi| = \dfrac{250}{50} = 5\,\text{Wb}$.
      - kind: reasoning
        text: >-
          ג. הסימן של הזרם הוא הסימן של $-\Delta\Phi/\Delta t$. הזרם חיובי (או שלילי) לאורך כל המשולש ולא עובר דרך אפס באמצע, ולכן השטף השתנה כל הזמן באותו כיוון. ב-$t = 0.25\,\text{s}$ הזרם בשיא, כלומר שם גרף השטף הכי תלול.
      - kind: result
        text: >-
          א. $250\,\text{Wb}$. ב. $5\,\text{Wb}$ לכל ליפוף. ג. בכיוון אחד, הכי מהר באמצע. בדיקת יחידות: $\text{C}\cdot\Omega = \text{A}\cdot\text{s}\cdot\text{V/A} = \text{V}\cdot\text{s} = \text{Wb}$.
    source:
      name: JEE Main
      year: 2017
      problem: 'Question 22 (2 April 2017, offline paper): a coil of resistance 100 Ω, a triangular induced-current pulse (peak 10 A, base 0.5 s); the magnitude of the change in flux (answer 250 Wb)'
      url: https://cracku.in/22-in-a-coil-of-resistance-100-a-current-is-induced-b-x-nta-jee-main-2-apr-2017-offline
      verified: '2026-11-05'
      adapted: true

  - id: W-5.5-c2
    stars: 2
    objectives: [OBJ-5.5-2, OBJ-5.5-3, OBJ-5.5-4]
    prompt: >-
      מסגרת מרובעת קשיחה של ליפוף אחד, שהצלע שלה $L = 10\,\text{cm}$, המסה שלה $10\,\text{g}$ וההתנגדות שלה $0.02\,\Omega$, מחליקה על שולחן חלק ונכנסת, במהירות $2\,\text{m/s}$, לרצועה ברוחב $3L$ שבה שדה מגנטי אחיד של $0.4\,\text{T}$ לתוך הדף. **אף אחד לא דוחף אותה**: היא ממשיכה בתנועה חופשית. הזניחו את כוח הכובד במישור השולחן ואת החיכוך.

      א. הראו שבזמן הכניסה המהירות יורדת בקו ישר **כפונקציה של המקום** $x$ של הצלע הקדמית, ומצאו את השיפוע. רמז: בפרק זמן קצר, $m\,\Delta v = -F\,\Delta t$, ו-$v\,\Delta t = \Delta x$.

      ב. מה המהירות כשהמסגרת כולה בפנים, ומה המהירות אחרי שיצאה?

      ג. הראו שבכל שלב (כניסה או יציאה) השינוי בתנע שווה ל-$BLQ$, כש-$Q$ הוא המטען שעבר באותו שלב. כמה מטען עובר בכל שלב?

      ד. כמה חום נוצר במעבר כולו? מה המהירות ההתחלתית המזערית שבה המסגרת עוברת את כל הרצועה?
    answer: >-
      א. $v = v_0 - kx$, עם $k = \dfrac{B^2L^2}{mR} = 8\,\text{s}^{-1}$.

      ב. $1.2\,\text{m/s}$ בפנים, $0.4\,\text{m/s}$ אחרי היציאה.

      ג. $Q = BL^2/R = 0.2\,\text{C}$ בכל שלב; $\Delta p = BLQ = 8\cdot10^{-3}\,\text{kg·m/s}$.

      ד. $0.0192\,\text{J}$; מהירות מזערית $1.6\,\text{m/s}$.
    solution:
      - kind: given
        text: >-
          $L = 0.1\,\text{m}$, $m = 0.01\,\text{kg}$, $R = 0.02\,\Omega$, $v_0 = 2\,\text{m/s}$, $B = 0.4\,\text{T}$, רוחב הרצועה $0.3\,\text{m}$.
      - kind: formula
        text: >-
          בכניסה: $\varepsilon = BLv$, $I = \dfrac{BLv}{R}$, והכוח הבולם על הצלע שבשדה $F = BIL = \dfrac{B^2L^2v}{R}$.
      - kind: manipulation
        text: >-
          א. בפרק זמן קצר: $m\,\Delta v = -\dfrac{B^2L^2v}{R}\,\Delta t$. אבל $v\,\Delta t = \Delta x$, ולכן $m\,\Delta v = -\dfrac{B^2L^2}{R}\,\Delta x$: השינוי במהירות פרופורציוני לדרך, והמהירות יורדת בקו ישר כפונקציה של $x$, עם שיפוע $-k$, $k = \dfrac{B^2L^2}{mR}$.

          ג. נכתוב אחרת: $m\,\Delta v = -BL\cdot(I\,\Delta t)$, ו-$I\,\Delta t$ הוא המטען שעבר בפרק הזמן. בסכום על כל השלב: $|\Delta p| = BLQ$, ו-$Q = \dfrac{|\Delta\Phi|}{R} = \dfrac{BL^2}{R}$, לא תלוי במהירות.
      - kind: substitution
        text: >-
          א. $k = \dfrac{0.4^2\cdot0.1^2}{0.01\cdot0.02} = 8\,\text{s}^{-1}$.

          ב. בכניסה $\Delta x = L$: $v_1 = 2 - 8\cdot0.1 = 1.2\,\text{m/s}$. בפנים אין זרם ואין כוח, והמהירות קבועה. ביציאה עוד $L$ של בלימה: $v_2 = 1.2 - 0.8 = 0.4\,\text{m/s}$.

          ג. $Q = \dfrac{0.4\cdot0.01}{0.02} = 0.2\,\text{C}$; $BLQ = 0.4\cdot0.1\cdot0.2 = 8\cdot10^{-3}\,\text{kg·m/s}$, ובאמת $m\,\Delta v = 0.01\cdot0.8 = 8\cdot10^{-3}\,\text{kg·m/s}$.

          ד. החום הוא האנרגיה הקינטית שאבדה: $\tfrac{1}{2}\cdot0.01\cdot(2^2 - 0.4^2) = 0.0192\,\text{J}$. כדי לעבור, המסגרת צריכה לאבד $2kL = 1.6\,\text{m/s}$ ועדיין לנוע: $v_0 > 1.6\,\text{m/s}$.
      - kind: reasoning
        text: >-
          בדיקה: אילו מישהו היה דוחף במהירות קבועה, הכוח היה פרופורציוני ל-$v$ והחום ל-$v$. כאן, בלי דחיפה, התנע שאובד בכל שלב קבוע ($BLQ$), כי המטען בכל שלב לא תלוי במהירות. האנרגיה שאובדת, לעומת זאת, תלויה במהירות: בכניסה $\tfrac{1}{2}m(2^2 - 1.2^2) = 0.0128\,\text{J}$, וביציאה רק $0.0064\,\text{J}$. בדיקה מספרית: אינטגרציה של $m\,dv/dt = -B^2L^2v/R$ נותנת $v_1 = 1.2\,\text{m/s}$ ו-$0.0128\,\text{J}$ בכניסה.
      - kind: result
        text: >-
          א. $v = v_0 - 8x$ (במטרים לשנייה, $x$ במטרים). ב. $1.2\,\text{m/s}$ ו-$0.4\,\text{m/s}$. ג. $0.2\,\text{C}$ בכל שלב, ו-$\Delta p = BLQ$. ד. $0.0192\,\text{J}$; $v_0 > 1.6\,\text{m/s}$.
    source:
      name: JEE Advanced
      year: 2016
      problem: 'Paper 2, Question 14: a rigid square wire loop of side L and resistance R entering, at speed v0, a region of length 3L with a uniform field into the page; schematic plots of v(x), I(x) and F(x)'
      url: https://cracku.in/14-a-rigid-wire-loop-of-square-shape-having-side-of-l-x-jee-advanced-2016-paper-2
      verified: '2026-11-05'
      adapted: true
