# Workbook, lesson 5.1 (magnetic flux). Format and rules: see .claude/CLAUDE.md, "Worked examples, workbook".
# Every number was recomputed with src/physics/induction.ts (fluxUniform, wireRectFlux), src/physics/loopflux.ts
# (wireB, wireStripSum) and src/physics/magnetism.ts (loopAxisField).
# Φ is measured along the chosen normal n̂; θ is the angle between B and n̂. On a closed surface n̂ points outwards.
# In a >- block, consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '5.1'
practice:
  - id: W-5.1-01
    level: basic
    qualitative: false
    objectives: [OBJ-5.1-1]
    prompt: >-
      לולאה ריבועית שאורך צלעה $30\,\text{cm}$ נמצאת בשדה מגנטי אחיד של $0.2\,\text{T}$.

      א. מה השטף דרך הלולאה כשהשדה ניצב למישורה? ענו בובר ובמילי-ובר.

      ב. מה השטף כשקווי השדה מקבילים למישור הלולאה?
    answer: >-
      א. $0.018\,\text{Wb} = 18\,\text{mWb}$.

      ב. אפס.
    solution:
      - kind: given
        text: >-
          $B = 0.2\,\text{T}$, $A = 0.3^2 = 0.09\,\text{m}^2$. בסעיף א השדה ניצב למישור, כלומר מקביל לאנך: $\theta = 0$. בסעיף ב השדה במישור, כלומר ניצב לאנך: $\theta = 90^\circ$.
      - kind: formula
        text: >-
          $\Phi = BA\cos\theta$.
      - kind: substitution
        text: >-
          א. $\Phi = 0.2\cdot0.09\cdot\cos0 = 0.018\,\text{Wb}$. מילי-ובר הוא $10^{-3}\,\text{Wb}$, ולכן זה $18\,\text{mWb}$.

          ב. $\Phi = 0.2\cdot0.09\cdot\cos90^\circ = 0$: הקווים מחליקים לאורך הלולאה ואף קו לא עובר דרכה.
      - kind: result
        text: >-
          א. $18\,\text{mWb}$. ב. $0$.

  - id: W-5.1-02
    level: basic
    qualitative: true
    objectives: [OBJ-5.1-2, OBJ-5.1-1]
    prompt: >-
      לולאה ריבועית שטוחה נמצאת במישור הדף. בחצי השמאלי שלה יש שדה מגנטי אחיד של $0.3\,\text{T}$ החוצה מהדף (⊙), ובחצי הימני שדה אחיד של $0.3\,\text{T}$ לתוך הדף (⊗).

      א. מה השטף דרך הלולאה? נמקו.

      ב. תלמיד אומר: "השטף אפס, ולכן אין שדה מגנטי בלולאה." מה הטעות שלו?
    answer: >-
      א. אפס.

      ב. השדה חזק בכל הלולאה. שטף אפס אומר רק שנטו אף קו לא עובר דרכה: מה שעובר בחצי אחד בכיוון אחד מתקזז עם מה שעובר בחצי השני בכיוון ההפוך.
    solution:
      - kind: reasoning
        text: >-
          נבחר אנך שיוצא מהדף. בחצי השמאלי השדה בכיוון האנך, $\theta = 0$, והשטף $+0.3\cdot\dfrac{A}{2}$. בחצי הימני השדה נגד האנך, $\theta = 180^\circ$, והשטף $-0.3\cdot\dfrac{A}{2}$.
      - kind: reasoning
        text: >-
          השטף דרך הלולאה הוא סכום השטפים דרך שני החצאים: $+0.15A - 0.15A = 0$. בחירה של האנך ההפוך הופכת את שני הסימנים, והסכום עדיין אפס.
      - kind: reasoning
        text: >-
          ב. בכל נקודה בלולאה השדה הוא $0.3\,\text{T}$. השטף מודד את **נטו** הקווים שעוברים דרך הלולאה, ולא את עוצמת השדה. גם לולאה שמקבילה לשדה חזק מקבלת שטף אפס.
      - kind: result
        text: >-
          א. $\Phi = 0$. ב. שטף אפס לא אומר שאין שדה.

  - id: W-5.1-03
    level: basic
    qualitative: false
    objectives: [OBJ-5.1-1]
    prompt: >-
      דרך לולאה מעגלית שרדיוסה $10\,\text{cm}$ עובר שטף מגנטי של $6\,\text{mWb}$. השדה אחיד וניצב למישור הלולאה. מה עוצמת השדה?
    answer: >-
      כ-$0.19\,\text{T}$.
    solution:
      - kind: given
        text: >-
          $\Phi = 6\cdot10^{-3}\,\text{Wb}$, $r = 0.1\,\text{m}$, $\theta = 0$.
      - kind: formula
        text: >-
          $\Phi = BA\cos\theta$, עם $A = \pi r^2$.
      - kind: manipulation
        text: >-
          $\cos0 = 1$, ולכן $\Phi = BA$. מחלקים את שני האגפים ב-$A$: $B = \dfrac{\Phi}{A} = \dfrac{\Phi}{\pi r^2}$.
      - kind: substitution
        text: >-
          $A = \pi\cdot0.1^2 = 0.0314\,\text{m}^2$, ולכן $B = \dfrac{6\cdot10^{-3}}{0.0314} = 0.191\,\text{T}$.
      - kind: result
        text: >-
          $B \approx 0.19\,\text{T}$.

  - id: W-5.1-04
    level: mid
    qualitative: false
    objectives: [OBJ-5.1-1]
    prompt: >-
      במקום מסוים על פני כדור הארץ השדה המגנטי של כדור הארץ הוא $5\cdot10^{-5}\,\text{T}$, והוא פונה צפונה ונוטה ב-$60^\circ$ מתחת לאופק. חישוק שרדיוסו $50\,\text{cm}$ מונח על הרצפה, אופקית.

      א. מה השטף המגנטי דרך החישוק?

      ב. מרימים את החישוק ומעמידים אותו אנכית, כך שהאנך שלו פונה צפונה. מה השטף עכשיו?
    answer: >-
      א. כ-$3.4\cdot10^{-5}\,\text{Wb}$.

      ב. כ-$2.0\cdot10^{-5}\,\text{Wb}$.
    solution:
      - kind: given
        text: >-
          $B = 5\cdot10^{-5}\,\text{T}$, $r = 0.5\,\text{m}$, ולכן $A = \pi\cdot0.5^2 = 0.785\,\text{m}^2$. השדה נוטה ב-$60^\circ$ מתחת לאופק.
      - kind: reasoning
        text: >-
          א. החישוק אופקי, ולכן האנך שלו אנכי. השדה נוטה $60^\circ$ מהאופק, כלומר $90^\circ - 60^\circ = 30^\circ$ מהאנכי: $\theta = 30^\circ$.

          ב. עכשיו האנך אופקי ופונה צפונה. השדה פונה צפונה ונוטה $60^\circ$ מהאופק, ולכן $\theta = 60^\circ$.
      - kind: formula
        text: >-
          $\Phi = BA\cos\theta$.
      - kind: substitution
        text: >-
          א. $\Phi = 5\cdot10^{-5}\cdot0.785\cdot\cos30^\circ = 3.40\cdot10^{-5}\,\text{Wb}$.

          ב. $\Phi = 5\cdot10^{-5}\cdot0.785\cdot\cos60^\circ = 1.96\cdot10^{-5}\,\text{Wb}$.
      - kind: result
        text: >-
          א. $3.4\cdot10^{-5}\,\text{Wb}$. ב. $2.0\cdot10^{-5}\,\text{Wb}$. השדה קרוב יותר לאנכי מאשר לאופקי, ולכן החישוק השוכב מקבל יותר שטף.

  - id: W-5.1-05
    level: mid
    qualitative: true
    objectives: [OBJ-5.1-2]
    prompt: >-
      ארבע לולאות ריבועיות נמצאות באותו שדה מגנטי אחיד $B$, שממלא אזור גדול. סדרו אותן לפי גודל השטף, מהגדול לקטן, ונמקו:

      א. צלע $10\,\text{cm}$, השדה ניצב למישורה.

      ב. צלע $20\,\text{cm}$, השדה מקביל למישורה.

      ג. צלע $20\,\text{cm}$, הזווית בין השדה לאנך $60^\circ$.

      ד. צלע $10\,\text{cm}$, השדה ניצב למישורה, אבל רק חצי מהלולאה בתוך אזור השדה.
    answer: >-
      ג, א, ד, ב: $0.02B$, $0.01B$, $0.005B$ ו-$0$ (בובר, כש-$B$ בטסלה).
    solution:
      - kind: formula
        text: >-
          $\Phi = BA\cos\theta$, כש-$A$ הוא השטח שבתוך השדה.
      - kind: reasoning
        text: >-
          א. $A = 0.01\,\text{m}^2$, $\theta = 0$: $\Phi = 0.01B$.

          ב. השדה במישור, $\theta = 90^\circ$: $\Phi = 0$, אף שהלולאה הגדולה ביותר.

          ג. $A = 0.04\,\text{m}^2$ ו-$\cos60^\circ = 0.5$: $\Phi = 0.02B$. השטח פי 4, וההטיה מורידה רק חצי.

          ד. רק $0.005\,\text{m}^2$ בתוך השדה: $\Phi = 0.005B$.
      - kind: result
        text: >-
          ג > א > ד > ב.

  - id: W-5.1-06
    level: mid
    qualitative: false
    objectives: [OBJ-5.1-2, OBJ-5.1-1]
    prompt: >-
      לולאה ריבועית פונה אל שדה מגנטי אחיד, והשטף דרכה $\Phi_1$. משנים שלושה דברים: מכפילים את השדה, מחליפים את הלולאה בלולאה שצלעה חצי מהצלע המקורית, ומטים אותה עד שהזווית בין השדה לאנך $60^\circ$. פי כמה השטף החדש מהשטף המקורי? אם $\Phi_1 = 8\,\text{mWb}$, מה השטף החדש?
    answer: >-
      פי $0.25$: $2\,\text{mWb}$.
    solution:
      - kind: formula
        text: >-
          $\Phi = BA\cos\theta$. נשווה את השטף החדש לישן: $\dfrac{\Phi_2}{\Phi_1} = \dfrac{B_2}{B_1}\cdot\dfrac{A_2}{A_1}\cdot\dfrac{\cos\theta_2}{\cos\theta_1}$.
      - kind: reasoning
        text: >-
          השדה פי 2. צלע חצי נותנת שטח רבע: $(1/2)^2 = 1/4$. הזווית עוברת מ-$0$ ל-$60^\circ$: $\dfrac{\cos60^\circ}{\cos0} = 0.5$.
      - kind: substitution
        text: >-
          $\dfrac{\Phi_2}{\Phi_1} = 2\cdot\dfrac14\cdot0.5 = 0.25$, ולכן $\Phi_2 = 0.25\cdot8 = 2\,\text{mWb}$.
      - kind: result
        text: >-
          השטף קטן פי 4, ל-$2\,\text{mWb}$. שימו לב שהשטח קטן פי 4, לא פי 2.

  - id: W-5.1-07
    level: mid
    qualitative: true
    objectives: [OBJ-5.1-3, OBJ-5.1-2]
    prompt: >-
      מלבן נמצא במישור של תיל ישר וארוך שזורם בו זרם קבוע, וצלעותיו הארוכות מקבילות לתיל. קבעו ונמקו, לכל פעולה, אם השטף דרך המלבן גדל, קטן או לא משתנה:

      א. מזיזים את המלבן לאורך התיל.

      ב. מקרבים את המלבן לתיל, בלי שייגע בו.

      ג. מסובבים את המלבן רבע סיבוב סביב ציר שמקביל לתיל ועובר במרכז המלבן.

      ד. מגדילים את הזרם בתיל.
    answer: >-
      א. לא משתנה. ב. גדל. ג. קטן, עד אפס. ד. גדל.
    solution:
      - kind: reasoning
        text: >-
          השדה של התיל ניצב למישור שבו נמצאים התיל והמלבן, וגודלו $B = \dfrac{\mu_0 I}{2\pi r}$: הוא תלוי רק במרחק $r$ מהתיל.
      - kind: reasoning
        text: >-
          א. בהזזה לאורך התיל כל רצועה של המלבן נשארת באותו מרחק, ולכן באותו שדה. השטף לא משתנה.

          ב. כל הרצועות עוברות לשדה חזק יותר. השטף גדל.

          ג. אחרי רבע סיבוב המלבן ניצב למישור המקורי, וחציו מעל המישור הזה וחציו מתחתיו. כל קו שדה של התיל הוא מעגל סביבו, ומעגל שחוצה את המלבן חוצה אותו פעמיים: פעם בחצי העליון ופעם בחצי התחתון, בכיוונים הפוכים. לכן השטף נטו אפס, אף שהשדה לא מקביל למלבן בכל נקודה שלו. בדרך השטף קטן בהדרגה.

          ד. $B \propto I$ בכל נקודה, ולכן השטף גדל באותו יחס כמו הזרם.
      - kind: result
        text: >-
          א. לא משתנה. ב. גדל. ג. קטן לאפס. ד. גדל.

  - id: W-5.1-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-5.1-3]
    prompt: >-
      תיל ישר וארוך נושא זרם של $30\,\text{A}$. מלבן בגובה $50\,\text{cm}$ נמצא במישור התיל, וצלעותיו המקבילות לתיל במרחקים $10\,\text{cm}$ ו-$40\,\text{cm}$ ממנו.

      א. העריכו את השטף דרך המלבן בעזרת השדה באמצע המלבן.

      ב. העריכו אותו שוב בשלוש רצועות שוות.

      ג. חשבו את השטף המדויק בנוסחה $\Phi = \dfrac{\mu_0 I h}{2\pi}\ln\dfrac{r_2}{r_1}$, עם $\ln4 \approx 1.386$. בכמה אחוזים טעתה כל הערכה?

      ד. מזיזים את המלבן, בלי לשנות את רוחבו, כך שהצלע הקרובה במרחק $20\,\text{cm}$. מה השטף עכשיו? היעזרו ב-$\ln2.5 \approx 0.916$.
    answer: >-
      א. $3.6\cdot10^{-6}\,\text{Wb}$.

      ב. $4.06\cdot10^{-6}\,\text{Wb}$.

      ג. $4.16\cdot10^{-6}\,\text{Wb}$; ההערכה בסעיף א נמוכה בכ-13%, וההערכה בסעיף ב בכ-2.4%.

      ד. $2.75\cdot10^{-6}\,\text{Wb}$.
    solution:
      - kind: given
        text: >-
          $I = 30\,\text{A}$, $h = 0.5\,\text{m}$, $r_1 = 0.1\,\text{m}$, $r_2 = 0.4\,\text{m}$, $\dfrac{\mu_0}{2\pi} = 2\cdot10^{-7}\,\text{T}\cdot\text{m/A}$. רוחב המלבן $0.3\,\text{m}$, ושטחו $0.15\,\text{m}^2$.
      - kind: formula
        text: >-
          $B = \dfrac{\mu_0 I}{2\pi r}$, ולכל רצועה $\Phi \approx B_\text{mid}\cdot h\cdot\Delta r$, כש-$B_\text{mid}$ הוא השדה באמצע הרצועה.
      - kind: substitution
        text: >-
          א. אמצע המלבן ב-$0.25\,\text{m}$: $B = \dfrac{2\cdot10^{-7}\cdot30}{0.25} = 2.4\cdot10^{-5}\,\text{T}$, ו-$\Phi \approx 2.4\cdot10^{-5}\cdot0.15 = 3.6\cdot10^{-6}\,\text{Wb}$.

          ב. שלוש רצועות ברוחב $0.1\,\text{m}$ ובשטח $0.05\,\text{m}^2$, עם אמצעים ב-$0.15$, $0.25$ ו-$0.35\,\text{m}$: $B = 4\cdot10^{-5}$, $2.4\cdot10^{-5}$ ו-$1.71\cdot10^{-5}\,\text{T}$. הסכום: $(4 + 2.4 + 1.71)\cdot10^{-5}\cdot0.05 = 4.06\cdot10^{-6}\,\text{Wb}$.

          ג. $\Phi = 2\cdot10^{-7}\cdot30\cdot0.5\cdot\ln\dfrac{0.4}{0.1} = 3\cdot10^{-6}\cdot1.386 = 4.16\cdot10^{-6}\,\text{Wb}$. השגיאה של א: $\dfrac{4.16 - 3.6}{4.16} \approx 13\%$. של ב: $\dfrac{4.16 - 4.06}{4.16} \approx 2.4\%$.

          ד. עכשיו $r_1 = 0.2\,\text{m}$ ו-$r_2 = 0.5\,\text{m}$: $\Phi = 3\cdot10^{-6}\cdot\ln2.5 = 3\cdot10^{-6}\cdot0.916 = 2.75\cdot10^{-6}\,\text{Wb}$.
      - kind: result
        text: >-
          א. $3.6\cdot10^{-6}\,\text{Wb}$. ב. $4.06\cdot10^{-6}\,\text{Wb}$. ג. $4.16\cdot10^{-6}\,\text{Wb}$: יותר רצועות, הערכה טובה יותר. ד. $2.75\cdot10^{-6}\,\text{Wb}$: המלבן התרחק, והשטף קטן.

  - id: W-5.1-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-5.1-4, OBJ-5.1-1]
    prompt: >-
      מנסרה משולשת סגורה, כמו גג, עומדת בשדה מגנטי אחיד ואופקי של $0.5\,\text{T}$ שפונה ימינה. עומק המנסרה (בניצב לדף) $30\,\text{cm}$. החתך שלה בדף הוא משולש ישר-זווית: הבסיס האופקי באורך $40\,\text{cm}$, הצלע האנכית שמשמאל בגובה $30\,\text{cm}$, והיתר, באורך $50\,\text{cm}$, יורד מראש הצלע האנכית אל הקצה הימני של הבסיס. האנך של כל פאה מצביע החוצה מהמנסרה.

      א. מה השטף דרך הפאה האנכית?

      ב. מה השטף דרך הפאה המשופעת? הדרכה: מה שטח הצל שלה על מישור שניצב לשדה?

      ג. מה השטף דרך הבסיס ודרך שתי הפאות המשולשות? מה השטף דרך כל המנסרה?
    answer: >-
      א. $-0.045\,\text{Wb}$.

      ב. $+0.045\,\text{Wb}$.

      ג. אפס דרך כל אחת מהשלוש, ואפס דרך כל המנסרה.
    solution:
      - kind: given
        text: >-
          $B = 0.5\,\text{T}$ ימינה. הפאה האנכית: $0.3\cdot0.3 = 0.09\,\text{m}^2$, והאנך החיצוני שלה שמאלה. הפאה המשופעת: $0.5\cdot0.3 = 0.15\,\text{m}^2$, והאנך החיצוני שלה מצביע ימינה-למעלה. הבסיס והמשולשים מקבילים לשדה.
      - kind: formula
        text: >-
          $\Phi = BA\cos\theta$ לכל פאה, או: השדה כפול שטח הצל של הפאה על מישור שניצב לשדה, עם סימן לפי צד האנך.
      - kind: substitution
        text: >-
          א. האנך שמאלה, נגד השדה: $\Phi = 0.5\cdot0.09\cdot\cos180^\circ = -0.045\,\text{Wb}$.

          ב. הצל של הפאה המשופעת על מישור אנכי שניצב לשדה הוא מלבן בגובה $30\,\text{cm}$ ובעומק $30\,\text{cm}$: $0.09\,\text{m}^2$. (בזווית: $\cos\theta = \dfrac{0.3}{0.5} = 0.6$, ו-$0.15\cdot0.6 = 0.09\,\text{m}^2$.) האנך החיצוני פונה ימינה-למעלה, עם השדה, ולכן $\Phi = 0.5\cdot0.09 = +0.045\,\text{Wb}$.

          ג. הבסיס ושני המשולשים מקבילים לשדה: $\theta = 90^\circ$ ושטף אפס. הסכום: $-0.045 + 0.045 + 0 = 0$.
      - kind: result
        text: >-
          א. $-0.045\,\text{Wb}$. ב. $+0.045\,\text{Wb}$. ג. אפס, וגם דרך כל המנסרה אפס, כמו שחייב להיות בכל משטח סגור.

  - id: W-5.1-10
    level: bagrut
    qualitative: true
    objectives: [OBJ-5.1-4]
    prompt: >-
      קבעו ונמקו בכל מקרה מה השטף המגנטי דרך המשטח הסגור:

      א. כדור גדול שבתוכו מגנט מוט שלם.

      ב. גליל סגור (עם שני מכסים), ותיל ישר וארוך שזורם בו זרם עובר לאורך הציר שלו.

      ג. קופסה שבתוכה חצי של מגנט שבור, כשהחצי השני מחוץ לקופסה. תלמידה טוענת: "בקופסה רק הקוטב הצפוני של המגנט המקורי, ולכן השטף חיובי." מה הטעות שלה?
    answer: >-
      א. אפס. ב. אפס. ג. אפס: החצי שבקופסה הוא מגנט שלם, עם קוטב צפוני וקוטב דרומי.
    solution:
      - kind: reasoning
        text: >-
          בכל המקרים: קווי השדה המגנטי סגורים, ולכן כל קו שיוצא ממשטח סגור חוזר ונכנס אליו. השטף המגנטי דרך כל משטח סגור הוא אפס.
      - kind: reasoning
        text: >-
          א. הקווים יוצאים מהקוטב הצפוני, מסתובבים, ונכנסים לקוטב הדרומי. קו שיוצא מהכדור חוזר ונכנס אליו.

          ב. קווי השדה של תיל הם מעגלים סביבו, במישורים שניצבים לתיל. הם לא חוצים את מעטפת הגליל, שמקבילה להם, ולא את המכסים, שמקבילים למישור שלהם. כאן אף קו לא חוצה את המשטח, והשטף אפס בכל חלק שלו.

          ג. כשמגנט נשבר, במקום השבר נוצרים שני קטבים חדשים (שיעור 4.1). בקופסה יש מגנט שלם, והקווים שיוצאים מהקוטב הצפוני שלו נכנסים לקוטב הדרומי החדש, או חוזרים דרך גוף המגנט. אין קוטב מגנטי בודד שיוכל להיות מקור של שטף.
      - kind: result
        text: >-
          בשלושת המקרים השטף אפס.

challenge:
  - id: W-5.1-c1
    stars: 1
    objectives: [OBJ-5.1-4]
    prompt: >-
      כריכה מעגלית מונחת על שולחן אופקי, ובה זורם זרם קבוע. האנך שבחרנו לכריכה מצביע למעלה, והשטף המגנטי של הכריכה עצמה דרך השטח שבתוכה הוא $\Phi_0 = 3\cdot10^{-7}\,\text{Wb}$ (חיובי, למעלה).

      א. מה השטף המגנטי של הכריכה דרך כל שאר מישור השולחן, מחוץ לכריכה, עד אינסוף, באותו אנך כלפי מעלה? נמקו בעזרת קווי השדה.

      ב. לאיזה כיוון פונה השדה המגנטי של הכריכה על השולחן, מחוץ לכריכה?

      ג. מה השטף דרך המישור כולו, בתוך הכריכה ומחוצה לה יחד?
    answer: >-
      א. $-3\cdot10^{-7}\,\text{Wb}$.

      ב. למטה, נגד השדה שבתוך הכריכה.

      ג. אפס.
    solution:
      - kind: reasoning
        text: >-
          כל קו שדה של הכריכה הוא קו סגור. קו שעובר כלפי מעלה דרך השטח שבתוך הכריכה חייב לחזור ולחצות את מישור השולחן כלפי מטה, כדי להיסגר. הוא לא יכול לחזור דרך השטח שבתוך הכריכה, כי שם השדה פונה למעלה, ולכן הוא חוצה את המישור מחוץ לכריכה.
      - kind: reasoning
        text: >-
          אפשר לנסח את זה בעזרת משטח סגור: נדמיין את המישור כולו יחד עם חצי כדור ענק מעליו. כשהרדיוס של חצי הכדור גדל מאוד, השדה של הכריכה עליו נחלש מהר מאוד, והשטף דרכו שואף לאפס. לכן השטף דרך המישור כולו, כלומר דרך המשטח הסגור בלי חצי הכדור, שואף לאפס.
      - kind: substitution
        text: >-
          א. $\Phi_\text{out} + \Phi_0 = 0$, ולכן $\Phi_\text{out} = -\Phi_0 = -3\cdot10^{-7}\,\text{Wb}$.

          ב. השטף מחוץ לכריכה שלילי ביחס לאנך כלפי מעלה, ולכן השדה שם פונה למטה. זה מתאים לתמונת הקווים של כריכה (שיעור 4.3): הקווים יוצאים למעלה דרך הכריכה, מסתובבים, וחוזרים למטה מבחוץ.

          ג. $\Phi_0 + \Phi_\text{out} = 0$.
      - kind: result
        text: >-
          א. $-3\cdot10^{-7}\,\text{Wb}$. ב. למטה. ג. אפס.
    source:
      name: JEE Main
      year: 2020
      problem: '7 January 2020, Morning Slot: a circular coil carrying a constant current; the flux through the infinite plane containing the coil, outside it, compared with the flux through the coil (answer: its negative). Adapted: a numerical φ₀ and two added parts.'
      url: https://questions.examside.com/past-years/jee/question/consider-a-circular-coil-of-wire-carrying-constant-current-i-jee-main-physics-gravitation-gaopxgeyk4wwrhll
      verified: '2026-11-05'
      adapted: true

  - id: W-5.1-c2
    stars: 2
    objectives: [OBJ-5.1-1, OBJ-5.1-2]
    prompt: >-
      כריכה מעגלית אחת שרדיוסה $R = 20\,\text{cm}$ נמצאת במישור אופקי, וזורם בה זרם של $10\,\text{A}$. על הציר שלה, בגובה $R$ מעל מרכזה, נמצא מרכזו של סליל ריבועי קטן בן 2 כריכות, שאורך צלעו $a = 2\,\text{cm}$. מישור הסליל הקטן יוצר זווית של $45^\circ$ עם הציר של הכריכה הגדולה. השדה של כריכה על הציר שלה, במרחק $z$ ממרכזה, הוא $B = \dfrac{\mu_0 I R^2}{2(R^2 + z^2)^{3/2}}$, בכיוון הציר.

      א. למה מותר להניח שהשדה של הכריכה הגדולה אחיד על פני הסליל הקטן?

      ב. מה השדה בנקודה שבה נמצא הסליל הקטן?

      ג. מה השטף דרך כריכה אחת של הסליל הקטן, ומה סכום השטפים דרך שתי הכריכות שלו?

      ד. באיזו זווית בין מישור הסליל לציר הסכום הזה גדול ביותר, ומה ערכו?
    answer: >-
      א. $a \ll R$: הסליל קטן מאוד לעומת המרחק שעליו השדה משתנה.

      ב. כ-$1.11\cdot10^{-5}\,\text{T}$, לאורך הציר.

      ג. $3.14\cdot10^{-9}\,\text{Wb}$ דרך כריכה אחת, ו-$6.28\cdot10^{-9}\,\text{Wb}$ דרך שתיהן.

      ד. כשמישור הסליל ניצב לציר: $8.9\cdot10^{-9}\,\text{Wb}$.
    solution:
      - kind: reasoning
        text: >-
          א. השדה של הכריכה הגדולה משתנה במידה ניכרת רק לאורך מרחקים בסדר גודל של $R = 20\,\text{cm}$. הסליל הקטן רחב רק $2\,\text{cm}$, עשירית מזה, ולכן על פניו השדה כמעט זהה, כמו בשדה אחיד.
      - kind: given
        text: >-
          $I = 10\,\text{A}$, $R = z = 0.2\,\text{m}$, $a = 0.02\,\text{m}$, ולכן שטח כריכה קטנה $A = a^2 = 4\cdot10^{-4}\,\text{m}^2$. $\mu_0 = 4\pi\cdot10^{-7}\,\text{T}\cdot\text{m/A}$.
      - kind: substitution
        text: >-
          ב. ב-$z = R$: $R^2 + z^2 = 2R^2$, ולכן $B = \dfrac{\mu_0 I R^2}{2(2R^2)^{3/2}} = \dfrac{\mu_0 I}{2\cdot2^{3/2}R} = \dfrac{4\pi\cdot10^{-7}\cdot10}{2\cdot2.83\cdot0.2} = 1.11\cdot10^{-5}\,\text{T}$.
      - kind: reasoning
        text: >-
          ג. הזווית הנתונה היא בין **מישור** הסליל לציר, כלומר לשדה. האנך ניצב למישור, ולכן הזווית בין השדה לאנך היא $\theta = 90^\circ - 45^\circ = 45^\circ$. (כאן שתי הזוויות שוות, אבל בדרך כלל צריך להחסיר מ-$90^\circ$.)
      - kind: substitution
        text: >-
          ג. דרך כריכה אחת: $\Phi = BA\cos45^\circ = 1.11\cdot10^{-5}\cdot4\cdot10^{-4}\cdot0.707 = 3.14\cdot10^{-9}\,\text{Wb}$. שתי הכריכות צמודות, ודרך כל אחת עובר אותו שטף: $2\cdot3.14\cdot10^{-9} = 6.28\cdot10^{-9}\,\text{Wb}$.

          ד. השטף גדול ביותר כש-$\theta = 0$, כלומר כשהאנך בכיוון הציר ומישור הסליל ניצב לציר: $2BA = 2\cdot1.11\cdot10^{-5}\cdot4\cdot10^{-4} = 8.9\cdot10^{-9}\,\text{Wb}$.
      - kind: result
        text: >-
          ב. $1.11\cdot10^{-5}\,\text{T}$. ג. $3.14\cdot10^{-9}\,\text{Wb}$ ו-$6.28\cdot10^{-9}\,\text{Wb}$. ד. כשמישור הסליל ניצב לציר, $8.9\cdot10^{-9}\,\text{Wb}$.
    source:
      name: IIT-JEE (JEE Advanced)
      year: 2012
      problem: 'Paper 1, Physics, integer-answer question: a circular loop of radius R in the xy plane and a two-turn square loop of side a ≪ R centred on its axis at z = R, its plane at 45° to the z axis; asks for the mutual inductance p·10⁻⁹ H. Adapted: chosen R, a and I, and the flux asked for instead of the mutual inductance (not yet taught).'
      url: https://questions.examside.com/past-years/jee/question/pa-circular-wire-loop-of-radius-r-is-placed-in-the-xy-plan-jee-advanced-physics-units-and-measurements-ccgpwfsxgpgprqsy
      verified: '2026-11-05'
      adapted: true
