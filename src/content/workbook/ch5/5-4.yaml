# Workbook, lesson 5.4 (rod on rails, terminal speed). Format and rules: see .claude/CLAUDE.md, "Worked examples, workbook".
# Every number was recomputed with src/physics/induction.ts (motionalEmf, railCurrent, railBrakingForce,
# railTerminalSpeed, railTimeConstant, railSpeed, railDistance) and src/physics/railrod.ts (railAcceleration,
# railAt, railPowers, kinetic). The incline, the hanging mass and the vertical rails moved to 5.5 (5-5.yaml).
# Directions: x right, y up the page, z out of the page; F = qv×B on the rod's charges, F = I L×B on the rod.
# In a >- block, consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '5.4'
practice:
  - id: W-5.4-01
    level: basic
    qualitative: false
    objectives: [OBJ-5.4-1]
    prompt: >-
      מטוס טס אופקית צפונה במהירות $250\,\text{m/s}$. המרחק בין קצות הכנפיים שלו $30\,\text{m}$. הרכיב האנכי של השדה המגנטי של כדור הארץ במקום הוא $4\cdot10^{-5}\,\text{T}$, כלפי מטה.

      א. מה הכא"מ בין קצות הכנפיים?

      ב. איזה קצה, המזרחי או המערבי, טעון חיובית?
    answer: >-
      א. $0.3\,\text{V}$.

      ב. הקצה המערבי (הכנף השמאלית של הטייס).
    solution:
      - kind: given
        text: >-
          $v = 250\,\text{m/s}$ צפונה, $L = 30\,\text{m}$ (הכנפיים ממזרח למערב), $B = 4\cdot10^{-5}\,\text{T}$ כלפי מטה. הכנפיים, המהירות והשדה ניצבים זה לזה. רק הרכיב האנכי של השדה נחשב: הרכיב האופקי, צפונה, מקביל למהירות.
      - kind: formula
        text: >-
          $\varepsilon = BLv$, והכיוון בכלל כף יד ימין על מטען חיובי: האצבעות בכיוון השדה, האגודל בכיוון התנועה.
      - kind: substitution
        text: >-
          א. $\varepsilon = 4\cdot10^{-5}\cdot30\cdot250 = 0.3\,\text{V}$.

          ב. דמיינו מפה על הרצפה: האצבעות לתוך הרצפה (השדה כלפי מטה), האגודל צפונה. כף היד פונה מערבה, ולשם נדחפים המטענים החיוביים.
      - kind: result
        text: >-
          א. $0.3\,\text{V}$. ב. הקצה המערבי חיובי.

  - id: W-5.4-02
    level: basic
    qualitative: true
    objectives: [OBJ-5.4-1]
    prompt: >-
      מוט מתכת אופקי, שמונח בדף לאורך הכיוון ימינה-שמאלה, נמצא בשדה מגנטי אחיד לתוך הדף (⊗). קבעו ונמקו, בכל מקרה, אם נוצר כא"מ בין קצות המוט:

      א. המוט נע למעלה בדף, בניצב לעצמו.

      ב. המוט נע ימינה, לאורך עצמו.

      ג. המוט נע לתוך הדף, בכיוון השדה.
    answer: >-
      א. כן, $BLv$.

      ב. לא.

      ג. לא.
    solution:
      - kind: reasoning
        text: >-
          הכא"מ הוא העבודה של כוח לורנץ על כל קולון לאורך המוט. כוח לורנץ ניצב למהירות ולשדה, ויש כא"מ רק אם הכוח הזה פועל **לאורך** המוט.
      - kind: reasoning
        text: >-
          א. המהירות למעלה והשדה לתוך הדף: הכוח על מטען חיובי שמאלה (האצבעות לתוך הדף, האגודל למעלה, כף היד שמאלה), לאורך המוט. יש כא"מ, $BLv$, והקצה השמאלי חיובי.

          ב. המהירות ימינה: הכוח על מטען חיובי למעלה, ניצב למוט. המטענים נדחפים אל הדופן של המוט ולא לאורכו, ואין כא"מ בין הקצוות. בלשון השטף: מוט שגולש לאורך עצמו לא "גורף" שום שטח.

          ג. המהירות בכיוון השדה: אין כוח לורנץ בכלל, $\sin0 = 0$.
      - kind: result
        text: >-
          כא"מ נוצר רק במקרה א, שבו המוט נע בניצב לעצמו ולשדה.

  - id: W-5.4-03
    level: basic
    qualitative: false
    objectives: [OBJ-5.4-2, OBJ-5.4-3]
    prompt: >-
      מוט באורך $80\,\text{cm}$ מונח על מסילות אופקיות חלקות שמחוברות בנגד של $2\,\Omega$, בשדה של $0.25\,\text{T}$, לתוך הדף (⊗). כדי להזיז את המוט שמאלה, לכיוון הנגד, במהירות קבועה, צריך להפעיל עליו כוח של $0.08\,\text{N}$.

      א. מה מהירות המוט?

      ב. מה הזרם, ומה כיוונו במוט?
    answer: >-
      א. $4\,\text{m/s}$.

      ב. $0.4\,\text{A}$, במוט למטה בדף.
    solution:
      - kind: given
        text: >-
          $L = 0.8\,\text{m}$, $R = 2\,\Omega$, $B = 0.25\,\text{T}$, $F = 0.08\,\text{N}$. המהירות קבועה, ולכן הכוח המופעל שווה לכוח המגנטי ומנוגד לו.
      - kind: formula
        text: >-
          $F = \dfrac{B^2L^2v}{R}$, ו-$I = \dfrac{BLv}{R}$.
      - kind: manipulation
        text: >-
          מכפילים את שני האגפים ב-$R$ ומחלקים ב-$B^2L^2$: $v = \dfrac{FR}{B^2L^2}$.
      - kind: substitution
        text: >-
          א. $v = \dfrac{0.08\cdot2}{0.0625\cdot0.64} = \dfrac{0.16}{0.04} = 4\,\text{m/s}$.

          ב. $I = \dfrac{0.25\cdot0.8\cdot4}{2} = 0.4\,\text{A}$. הכיוון: האצבעות לתוך הדף, האגודל שמאלה, כף היד פונה למטה. בדיקה בחוק לנץ: המוט מתקרב לנגד, השטף לתוך הדף קטן, והזרם יוצר בתוך הלולאה שדה לתוך הדף, עם כיוון השעון; בצד הימני של הלולאה, במוט, זה כלפי מטה.
      - kind: result
        text: >-
          א. $4\,\text{m/s}$. ב. $0.4\,\text{A}$, במוט למטה בדף. (הכוח המגנטי ימינה, והכוח המופעל שמאלה.)

  - id: W-5.4-04
    level: mid
    qualitative: true
    objectives: [OBJ-5.4-3]
    prompt: >-
      תלמידה מושכת מוט ממנוחה בכוח קבוע על מסילות חלקות בשדה מגנטי, ומשרטטת את גרף המהירות לפי הזמן. בניסוי הראשון הגרף יוצא מהראשית בשיפוע $2\,\text{m/s}^2$ ומתקרב ל-$5\,\text{m/s}$. היא משנה דבר אחד בכל פעם (באותו כוח מושך):

      א. בניסוי השני הגרף יוצא באותו שיפוע, $2\,\text{m/s}^2$, אבל מתקרב ל-$10\,\text{m/s}$. מה שינתה: את ההתנגדות או את מסת המוט? פי כמה?

      ב. בניסוי השלישי הגרף מתקרב שוב ל-$5\,\text{m/s}$, אבל יוצא בשיפוע $1\,\text{m/s}^2$. מה שינתה הפעם?

      ג. באיזה מהניסויים המוט מתקרב למהירות הסופית הכי לאט?
    answer: >-
      א. את ההתנגדות: היא גדולה פי 2.

      ב. את המסה: המוט כבד פי 2.

      ג. בשני ובשלישי באותה איטיות (קבוע הזמן כפול), ובשניהם לאט יותר מבראשון.
    solution:
      - kind: reasoning
        text: >-
          השיפוע ההתחלתי הוא התאוצה ברגע הראשון, כשאין עדיין זרם: $a_0 = F/m$. הוא תלוי רק בכוח ובמסה. הערך שהגרף מתקרב אליו הוא $v_T = FR/(B^2L^2)$, שלא תלוי במסה.
      - kind: reasoning
        text: >-
          א. אותו שיפוע התחלתי, ולכן אותה מסה. $v_T$ גדלה פי 2, ולכן $R$ גדלה פי 2.

          ב. אותה $v_T$, ולכן $R$ (ו-$B$, $L$) לא השתנו. השיפוע ההתחלתי קטן פי 2, ולכן המסה גדלה פי 2.

          ג. קבוע הזמן $\tau = \dfrac{mR}{B^2L^2}$: בניסוי השני $R$ כפולה, בשלישי $m$ כפולה, ובשניהם $\tau$ כפול מבראשון.
      - kind: result
        text: >-
          א. $R$ פי 2. ב. $m$ פי 2. ג. בשני ובשלישי, עם קבוע זמן כפול.

  - id: W-5.4-05
    level: mid
    qualitative: false
    objectives: [OBJ-5.4-4, OBJ-5.4-2]
    prompt: >-
      מזיזים מוט באורך $40\,\text{cm}$ במהירות קבועה של $3\,\text{m/s}$ על מסילות חלקות, בשדה של $0.5\,\text{T}$ שניצב למישור המסילות. ההתנגדות הכוללת של המעגל $0.3\,\Omega$.

      א. מה הזרם במעגל?

      ב. מה ההספק בנגד, ומה ההספק של הכוח שמזיז את המוט?

      ג. כמה חום מתפתח בנגד בעשר שניות?
    answer: >-
      א. $2\,\text{A}$.

      ב. שניהם $1.2\,\text{W}$.

      ג. $12\,\text{J}$.
    solution:
      - kind: given
        text: >-
          $L = 0.4\,\text{m}$, $v = 3\,\text{m/s}$, $B = 0.5\,\text{T}$, $R = 0.3\,\Omega$. המהירות קבועה, ולכן הכוח המופעל שווה לכוח המגנטי.
      - kind: formula
        text: >-
          $\varepsilon = BLv$, $I = \varepsilon/R$, $P = I^2R$, $F = BIL$, והספק של כוח $P = Fv$.
      - kind: substitution
        text: >-
          א. $\varepsilon = 0.5\cdot0.4\cdot3 = 0.6\,\text{V}$, ו-$I = 0.6/0.3 = 2\,\text{A}$.

          ב. $I^2R = 4\cdot0.3 = 1.2\,\text{W}$. הכוח: $F = BIL = 0.5\cdot2\cdot0.4 = 0.4\,\text{N}$, והספקו $Fv = 0.4\cdot3 = 1.2\,\text{W}$.

          ג. ההספק קבוע, ולכן $Q = Pt = 1.2\cdot10 = 12\,\text{J}$.
      - kind: result
        text: >-
          א. $2\,\text{A}$. ב. $1.2\,\text{W}$ בשניהם: המהירות קבועה, וכל העבודה הופכת לחום. ג. $12\,\text{J}$.

  - id: W-5.4-06
    level: mid
    qualitative: false
    objectives: [OBJ-5.4-4, OBJ-5.4-2]
    prompt: >-
      מזיזים מוט במהירות קבועה של $4\,\text{m/s}$ לאורך $2\,\text{m}$ על מסילות אופקיות חלקות. המרחק בין המסילות $0.5\,\text{m}$, השדה $0.6\,\text{T}$ ניצב למישור המסילות, וההתנגדות הכוללת של המעגל $1.5\,\Omega$.

      א. מה הכוח הדרוש, ומה העבודה שלו לאורך $2\,\text{m}$?

      ב. כמה חום מתפתח בנגד בזמן הזה? למה זה בדיוק העבודה?

      ג. חוזרים על אותה דרך, $2\,\text{m}$, במהירות קבועה של $8\,\text{m/s}$. פי כמה גדלים הכוח, ההספק והעבודה?
    answer: >-
      א. $0.24\,\text{N}$; $0.48\,\text{J}$.

      ב. $0.48\,\text{J}$: המהירות קבועה, והאנרגיה הקינטית לא משתנה.

      ג. הכוח פי 2, ההספק פי 4, והעבודה פי 2 ($0.96\,\text{J}$).
    solution:
      - kind: given
        text: >-
          $v = 4\,\text{m/s}$, $d = 2\,\text{m}$, $L = 0.5\,\text{m}$, $B = 0.6\,\text{T}$, $R = 1.5\,\Omega$. המהירות קבועה, ולכן הכוח המופעל שווה לכוח המגנטי ומנוגד לו.
      - kind: formula
        text: >-
          $F = \dfrac{B^2L^2v}{R}$, $W = Fd$, $P = I^2R$ עם $I = \dfrac{BLv}{R}$, והזמן $t = d/v$.
      - kind: substitution
        text: >-
          א. $F = \dfrac{0.36\cdot0.25\cdot4}{1.5} = 0.24\,\text{N}$, ו-$W = 0.24\cdot2 = 0.48\,\text{J}$.

          ב. $I = \dfrac{0.6\cdot0.5\cdot4}{1.5} = 0.8\,\text{A}$, $P = 0.8^2\cdot1.5 = 0.96\,\text{W}$, והזמן $t = 2/4 = 0.5\,\text{s}$: $Q = 0.96\cdot0.5 = 0.48\,\text{J}$.

          ג. ב-$8\,\text{m/s}$: $F = 0.48\,\text{N}$ (פי 2, כי $F \propto v$), $I = 1.6\,\text{A}$ ו-$P = 3.84\,\text{W}$ (פי 4, כי $P = Fv \propto v^2$), והזמן $0.25\,\text{s}$ (חצי). העבודה $W = 0.48\cdot2 = 0.96\,\text{J}$, פי 2: הספק פי 4 במשך חצי זמן.
      - kind: result
        text: >-
          א. $0.24\,\text{N}$ ו-$0.48\,\text{J}$. ב. $0.48\,\text{J}$ חום, כל העבודה. ג. הכוח פי 2, ההספק פי 4, העבודה פי 2: כדי להזיז מוט מהר יותר באותה דרך משקיעים יותר אנרגיה, והכול הופך לחום.

  - id: W-5.4-07
    level: mid
    qualitative: false
    objectives: [OBJ-5.4-1, OBJ-5.4-2]
    prompt: >-
      מוט באורך $0.5\,\text{m}$, שההתנגדות שלו $0.5\,\Omega$, נע במהירות קבועה של $4\,\text{m/s}$ על מסילות שמחוברות בנגד של $2.5\,\Omega$, בשדה של $0.6\,\text{T}$ שניצב למישור המסילות. ההתנגדות של המסילות זניחה.

      א. מה הכא"מ במוט, ומה הזרם במעגל?

      ב. מה יראה מד מתח אידיאלי שמחובר בין שני קצות המוט?

      ג. מה הכוח הדרוש כדי לשמור על המהירות?
    answer: >-
      א. $1.2\,\text{V}$, $0.4\,\text{A}$.

      ב. $1.0\,\text{V}$.

      ג. $0.12\,\text{N}$.
    solution:
      - kind: given
        text: >-
          $L = 0.5\,\text{m}$, $r = 0.5\,\Omega$ (המוט), $R = 2.5\,\Omega$, $v = 4\,\text{m/s}$, $B = 0.6\,\text{T}$.
      - kind: reasoning
        text: >-
          המוט הנע הוא סוללה עם כא"מ $BLv$ והתנגדות פנימית $r$, ממש כמו בשיעור 3.6. ההתנגדות הכוללת במעגל $R + r$, ומד המתח בין קצות המוט מראה את מתח ההדקים, $\varepsilon - Ir$, שהוא גם המתח על הנגד.
      - kind: substitution
        text: >-
          א. $\varepsilon = 0.6\cdot0.5\cdot4 = 1.2\,\text{V}$, $I = \dfrac{1.2}{2.5 + 0.5} = 0.4\,\text{A}$.

          ב. $V = \varepsilon - Ir = 1.2 - 0.4\cdot0.5 = 1.0\,\text{V}$, וזה גם $IR = 0.4\cdot2.5$.

          ג. $F = BIL = 0.6\cdot0.4\cdot0.5 = 0.12\,\text{N}$.
      - kind: result
        text: >-
          א. $1.2\,\text{V}$ ו-$0.4\,\text{A}$. ב. $1.0\,\text{V}$, פחות מהכא"מ. ג. $0.12\,\text{N}$.

  - id: W-5.4-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-5.4-3, OBJ-5.4-4]
    prompt: >-
      מוט שמסתו $0.25\,\text{kg}$ מונח על מסילות אופקיות חלקות שהמרחק ביניהן $0.5\,\text{m}$, בשדה של $1\,\text{T}$ שניצב למישור המסילות. המסילות מחוברות בנגד של $1\,\Omega$, ושאר ההתנגדויות זניחות. מושכים את המוט ממנוחה בכוח קבוע של $0.5\,\text{N}$.

      א. מה המהירות הסופית, ומה קבוע הזמן?

      ב. מה התאוצה של המוט כשמהירותו $1\,\text{m/s}$?

      ג. כשהמוט נע במהירות הסופית, מחליפים במהירות את הנגד בנגד של $2\,\Omega$. מה הזרם ומה התאוצה מיד אחרי ההחלפה? מה המהירות הסופית החדשה, ומה הזרם כשהמוט מגיע אליה?

      ד. כשהמוט מגיע למהירות הסופית החדשה, מפסיקים למשוך אותו. כמה חום יתפתח בנגד עד שהמוט ייעצר?
    answer: >-
      א. $2\,\text{m/s}$; $1\,\text{s}$.

      ב. $1\,\text{m/s}^2$.

      ג. $0.5\,\text{A}$ ו-$1\,\text{m/s}^2$ מיד אחרי ההחלפה; $4\,\text{m/s}$, ובה הזרם שוב $1\,\text{A}$.

      ד. $2\,\text{J}$.
    solution:
      - kind: given
        text: >-
          $m = 0.25\,\text{kg}$, $L = 0.5\,\text{m}$, $B = 1\,\text{T}$, $R = 1\,\Omega$, $F = 0.5\,\text{N}$. $B^2L^2 = 0.25\,\text{T}^2\text{m}^2$.
      - kind: formula
        text: >-
          $ma = F - \dfrac{B^2L^2v}{R}$, $v_T = \dfrac{FR}{B^2L^2}$, $\tau = \dfrac{mR}{B^2L^2}$, $I = \dfrac{BLv}{R}$.
      - kind: substitution
        text: >-
          א. $v_T = \dfrac{0.5\cdot1}{0.25} = 2\,\text{m/s}$, $\tau = \dfrac{0.25\cdot1}{0.25} = 1\,\text{s}$.

          ב. $F_B = \dfrac{0.25\cdot1}{1} = 0.25\,\text{N}$, $a = \dfrac{0.5 - 0.25}{0.25} = 1\,\text{m/s}^2$.

          ג. ברגע ההחלפה המהירות עדיין $2\,\text{m/s}$, והכא"מ עדיין $BLv = 1\,\text{V}$. אבל ההתנגדות כפולה: $I = 1/2 = 0.5\,\text{A}$, $F_B = BIL = 0.25\,\text{N}$, ו-$a = \dfrac{0.5 - 0.25}{0.25} = 1\,\text{m/s}^2$: המוט שוב מאיץ. המהירות הסופית החדשה $v_T = \dfrac{0.5\cdot2}{0.25} = 4\,\text{m/s}$, ובה $I = \dfrac{1\cdot0.5\cdot4}{2} = 1\,\text{A}$, כמו קודם, כי במהירות הסופית $BIL = F$.
      - kind: reasoning
        text: >-
          ד. בלי הכוח המושך ובלי חיכוך, הכוח המגנטי מאט את המוט עד עצירה, וכל האנרגיה הקינטית הופכת לחום: $Q = \tfrac{1}{2}mv^2 = \tfrac{1}{2}\cdot0.25\cdot4^2 = 2\,\text{J}$.
      - kind: result
        text: >-
          א. $2\,\text{m/s}$, $1\,\text{s}$. ב. $1\,\text{m/s}^2$. ג. $0.5\,\text{A}$, $1\,\text{m/s}^2$; $4\,\text{m/s}$ ו-$1\,\text{A}$. ד. $2\,\text{J}$.

  - id: W-5.4-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-5.4-3, OBJ-5.4-4, OBJ-5.4-2]
    prompt: >-
      מוט שמסתו $0.2\,\text{kg}$ מונח על מסילות אופקיות חלקות שהמרחק ביניהן $0.5\,\text{m}$, בשדה של $0.4\,\text{T}$ שניצב למישור המסילות. ההתנגדות הכוללת של המעגל $0.5\,\Omega$. כוח קבוע של $0.2\,\text{N}$ מושך את המוט לאורך המסילות, אבל ברגע $t = 0$ המוט כבר נע בכיוון הכוח במהירות $6\,\text{m/s}$: מישהו דחף אותו.

      א. מה המהירות הסופית של המוט?

      ב. מה הזרם ומה התאוצה (גודל וכיוון) ברגע $t = 0$?

      ג. שרטטו, באופן איכותי, את גרף המהירות לפי הזמן, וכתבו מה הזרם אחרי זמן ארוך.

      ד. עד הרגע שבו מהירות המוט $4\,\text{m/s}$, המוט עבר $10.3\,\text{m}$. כמה חום התפתח בנגד בזמן הזה? האם הוא גדול או קטן מעבודת הכוח המושך, ולמה?
    answer: >-
      א. $2.5\,\text{m/s}$.

      ב. $2.4\,\text{A}$; $1.4\,\text{m/s}^2$ נגד התנועה (המוט מאט).

      ג. הגרף יורד מ-$6\,\text{m/s}$, בהתחלה מהר ואחר כך לאט, ומתקרב ל-$2.5\,\text{m/s}$ מלמעלה; הזרם מתקרב ל-$1\,\text{A}$.

      ד. כ-$4.1\,\text{J}$, יותר מעבודת הכוח ($2.06\,\text{J}$): גם אנרגיה קינטית הפכה לחום.
    solution:
      - kind: given
        text: >-
          $m = 0.2\,\text{kg}$, $L = 0.5\,\text{m}$, $B = 0.4\,\text{T}$, $R = 0.5\,\Omega$, $F = 0.2\,\text{N}$, $v_0 = 6\,\text{m/s}$. $B^2L^2 = 0.16\cdot0.25 = 0.04\,\text{T}^2\text{m}^2$.
      - kind: formula
        text: >-
          $ma = F - \dfrac{B^2L^2v}{R}$, $v_T = \dfrac{FR}{B^2L^2}$, $I = \dfrac{BLv}{R}$, ושימור האנרגיה $W_F = \Delta K + Q$.
      - kind: substitution
        text: >-
          א. $v_T = \dfrac{0.2\cdot0.5}{0.04} = 2.5\,\text{m/s}$.

          ב. $I_0 = \dfrac{0.4\cdot0.5\cdot6}{0.5} = 2.4\,\text{A}$. הכוח הבולם $F_B = \dfrac{0.04\cdot6}{0.5} = 0.48\,\text{N}$, גדול מ-$F$: $a = \dfrac{0.2 - 0.48}{0.2} = -1.4\,\text{m/s}^2$. הסימן השלילי אומר שהתאוצה נגד התנועה.
      - kind: reasoning
        text: >-
          ג. המוט מהיר מ-$v_T$, ולכן הבלימה גוברת על המשיכה והוא מאט. ככל שהוא מאט, הבלימה קטנה וההאטה מתמתנת, עד שהמהירות מתקרבת ל-$v_T$, הפעם מלמעלה. קבוע הזמן $\tau = \dfrac{mR}{B^2L^2} = 2.5\,\text{s}$ כמו בתנועה ממנוחה. אחרי זמן ארוך $BIL = F$, ולכן $I = \dfrac{F}{BL} = \dfrac{0.2}{0.2} = 1\,\text{A}$.
      - kind: manipulation
        text: >-
          ד. מבודדים את החום משימור האנרגיה: $Q = W_F - \Delta K = Fd + \left(\tfrac{1}{2}mv_0^2 - \tfrac{1}{2}mv^2\right)$. האנרגיה הקינטית **קטנה**, ולכן $-\Delta K$ חיובי ומוסיף לחום.
      - kind: substitution
        text: >-
          ד. $W_F = 0.2\cdot10.3 = 2.06\,\text{J}$, ו-$\tfrac{1}{2}\cdot0.2\cdot(36 - 16) = 2.0\,\text{J}$. לכן $Q = 2.06 + 2.0 \approx 4.1\,\text{J}$.
      - kind: result
        text: >-
          א. $2.5\,\text{m/s}$. ב. $2.4\,\text{A}$ ו-$1.4\,\text{m/s}^2$ נגד התנועה. ג. ירידה מתמתנת אל $2.5\,\text{m/s}$, והזרם מתקרב ל-$1\,\text{A}$. ד. כ-$4.1\,\text{J}$, יותר מ-$W_F = 2.06\,\text{J}$, כי גם האנרגיה הקינטית שהמוט איבד, $2\,\text{J}$, הפכה לחום.

  - id: W-5.4-10
    level: bagrut
    qualitative: true
    objectives: [OBJ-5.4-3, OBJ-5.4-4, OBJ-5.4-2]
    prompt: >-
      שני מוטות זהים מונחים על שני זוגות מסילות אופקיות חלקות וזהות, באותו שדה מגנטי. זוג המסילות הראשון מחובר בנגד $R$, והשני בנגד $2R$. נותנים לשני המוטות דחיפה קצרה, לאותה מהירות התחלתית, ומשאירים אותם לנוע.

      א. קבעו ונמקו: מה קורה לכל מוט, ואיזה מהם מאט מהר יותר ברגע הראשון?

      ב. איזה מוט עובר מרחק גדול יותר עד שהוא כמעט נעצר?

      ג. באיזה מעגל מתפתח יותר חום עד שהמוט נעצר?

      ד. מנתקים את הנגד מהמסילות של המוט השני, כך שהמעגל פתוח, ודוחפים אותו שוב. מה קורה עכשיו?
    answer: >-
      א. שניהם מאטים עד עצירה; המוט שבמעגל עם $R$ מאט מהר פי 2.

      ב. המוט שבמעגל עם $2R$.

      ג. אותו חום, $\tfrac{1}{2}mv_0^2$.

      ד. הוא נע במהירות קבועה.
    solution:
      - kind: reasoning
        text: >-
          א. אין כוח מושך, והכוח היחיד לאורך המסילות הוא הכוח המגנטי, $\dfrac{B^2L^2v}{R}$, נגד התנועה. שני המוטות מאטים, וההאטה מתמתנת עם המהירות. באותה מהירות, הזרם במעגל עם $R$ גדול פי 2, וגם הכוח הבולם: ההאטה שלו גדולה פי 2.
      - kind: reasoning
        text: >-
          ב. בכל מהירות, המוט שבמעגל עם $2R$ נבלם בחצי כוח, ולכן מאט לאט יותר ומגיע רחוק יותר. (קבוע הזמן $\tau = mR/(B^2L^2)$ שלו כפול; אפשר להראות שהמרחק עד עצירה הוא $v_0\tau$, כפול גם הוא.)
      - kind: reasoning
        text: >-
          ג. בשני המקרים כל האנרגיה הקינטית ההתחלתית הופכת לחום בנגד, כי אין חיכוך: $Q = \tfrac{1}{2}mv_0^2$. במעגל עם $2R$ החום מתפתח לאט יותר, לאורך זמן ארוך יותר.
      - kind: reasoning
        text: >-
          ד. במעגל פתוח יש כא"מ, אבל אין זרם, ולכן אין כוח מגנטי. אין חיכוך, והמוט נע במהירות קבועה.
      - kind: result
        text: >-
          א. המוט שבמעגל עם $R$ מאט מהר יותר. ב. המוט שבמעגל עם $2R$. ג. אותו חום. ד. מהירות קבועה: בלי זרם אין בלימה.

challenge:
  - id: W-5.4-c1
    stars: 1
    objectives: [OBJ-5.4-3, OBJ-5.4-4, OBJ-5.4-2]
    prompt: >-
      מוט מתכת שמסתו $0.2\,\text{kg}$ מונח על שתי מסילות אופקיות חלקות שהמרחק ביניהן $0.5\,\text{m}$, וההתנגדות שלהן זניחה. בקצה המסילות מחובר נגד של $0.4\,\Omega$, ובכל האזור שדה אחיד של $0.8\,\text{T}$, ניצב למישור המסילות. נותנים למוט מהירות התחלתית של $3\,\text{m/s}$, הרחק מהנגד, ומשאירים אותו. שום כוח אחר מלבד הכוח המגנטי לא פועל עליו לאורך המסילות.

      א. מה הכוח המגנטי על המוט ומה תאוצתו ברגע הראשון?

      ב. בכל פרק זמן קצר $\Delta t$ הכוח המגנטי משנה את התנע של המוט ב-$BIL\,\Delta t$, ו-$I\,\Delta t$ הוא המטען $\Delta q$ שעובר בנגד באותו זמן. הראו שעד שהמוט נעצר עובר בנגד מטען כולל $q = \dfrac{mv_0}{BL}$, וחשבו אותו.

      ג. באותו פרק זמן קצר, $I\,\Delta t = \dfrac{BLv\,\Delta t}{R}$. היעזרו בזה כדי להראות שהמוט עובר עד העצירה מרחק $x = \dfrac{mv_0R}{B^2L^2}$, וחשבו אותו.

      ד. כמה חום מתפתח בנגד עד שהמוט נעצר? האם החום הזה הוא רבע מהאנרגיה הקינטית ההתחלתית, חצי ממנה, או כולה?
    answer: >-
      א. $1.2\,\text{N}$ נגד התנועה; $6\,\text{m/s}^2$ (האטה).

      ב. $1.5\,\text{C}$.

      ג. $1.5\,\text{m}$.

      ד. $0.9\,\text{J}$, כל האנרגיה הקינטית ההתחלתית.
    solution:
      - kind: given
        text: >-
          $m = 0.2\,\text{kg}$, $L = 0.5\,\text{m}$, $R = 0.4\,\Omega$, $B = 0.8\,\text{T}$, $v_0 = 3\,\text{m/s}$, ואין כוח מושך. $B^2L^2 = 0.64\cdot0.25 = 0.16\,\text{T}^2\text{m}^2$.
      - kind: substitution
        text: >-
          א. $F_B = \dfrac{B^2L^2v_0}{R} = \dfrac{0.16\cdot3}{0.4} = 1.2\,\text{N}$, נגד התנועה, ולכן $a = \dfrac{1.2}{0.2} = 6\,\text{m/s}^2$ בכיוון ההפוך למהירות.
      - kind: reasoning
        text: >-
          ב. הכוח המגנטי הוא הכוח היחיד לאורך המסילות, ולכן לפי החוק השני של ניוטון בצורת תנע, בכל $\Delta t$ התנע קטן ב-$BIL\,\Delta t = BL\,\Delta q$. נסכם את כל פרקי הזמן עד העצירה: התנע ירד מ-$mv_0$ לאפס, והמטען שעבר הוא סכום כל ה-$\Delta q$. לכן $mv_0 = BLq$, כלומר $q = \dfrac{mv_0}{BL}$. כאן אין צורך לדעת איך הזרם משתנה בזמן: $B$ ו-$L$ קבועים, ולכן אפשר להוציא אותם מהסכום.
      - kind: reasoning
        text: >-
          ג. בכל $\Delta t$ המוט מתקדם $\Delta x = v\,\Delta t$, ולכן $\Delta q = I\,\Delta t = \dfrac{BL\,\Delta x}{R}$. נסכם: $q = \dfrac{BLx}{R}$. נשווה לסעיף ב: $\dfrac{BLx}{R} = \dfrac{mv_0}{BL}$, ומכפילים את שני האגפים ב-$\dfrac{R}{BL}$: $x = \dfrac{mv_0R}{B^2L^2}$. (זה $v_0\tau$, עם $\tau = \dfrac{mR}{B^2L^2}$.)
      - kind: substitution
        text: >-
          ב. $q = \dfrac{0.2\cdot3}{0.8\cdot0.5} = 1.5\,\text{C}$.

          ג. $x = \dfrac{0.2\cdot3\cdot0.4}{0.16} = 1.5\,\text{m}$. בדיקה: $\tau = \dfrac{0.2\cdot0.4}{0.16} = 0.5\,\text{s}$, ו-$v_0\tau = 1.5\,\text{m}$.

          ד. אין חיכוך ואין כוח מושך, ולכן כל האנרגיה הקינטית הופכת לחום: $Q = \tfrac{1}{2}\cdot0.2\cdot3^2 = 0.9\,\text{J}$.
      - kind: result
        text: >-
          א. $1.2\,\text{N}$ ו-$6\,\text{m/s}^2$ נגד התנועה. ב. $q = mv_0/(BL) = 1.5\,\text{C}$. ג. $x = mv_0R/(B^2L^2) = 1.5\,\text{m}$: המוט נעצר במרחק סופי, אף שמהירותו רק מתקרבת לאפס. ד. $0.9\,\text{J}$, כל האנרגיה הקינטית, לא רבע ולא חצי.
    source:
      name: NSEP (National Standard Examination in Physics, India)
      year: 2023
      problem: '26 November 2023 paper, Section B, Question 55: a rod of mass m and length ℓ launched at v₀ on frictionless rails closed by R in a field B into the page; true statements about v(t), the stopping distance mv₀R/(B²ℓ²), the heat and the charge mv₀/(Bℓ). Adapted: numbers, and the statements turned into derivation parts'
      url: https://cracku.in/55-a-metal-rod-of-mass-m-and-length-ell-slides-on-fri-x-nsep-2023-26th-nov
      verified: '2026-11-05'
      adapted: true

  - id: W-5.4-c2
    stars: 2
    objectives: [OBJ-5.4-3, OBJ-5.4-1, OBJ-5.4-4]
    prompt: >-
      מוט מתכת שמסתו $0.1\,\text{kg}$ מונח על שתי מסילות אופקיות חלקות שהמרחק ביניהן $0.4\,\text{m}$, בשדה אחיד של $0.5\,\text{T}$ שניצב למישור המסילות. בין המסילות מחוברים בטור סוללה אידיאלית של $1.5\,\text{V}$ ונגד של $0.5\,\Omega$; שאר ההתנגדויות זניחות. סוגרים את המעגל כשהמוט במנוחה. (זה המנוע של שיעור 4.8, אבל הפעם המוט חופשי לנוע.)

      א. מה הזרם ומה התאוצה של המוט ברגע הראשון?

      ב. כשהמוט נע, נוצר בו כא"מ מושרה. הסבירו למה הוא מתנגד לסוללה, ומצאו את הזרם כשהמוט נע במהירות $v$.

      ג. המוט מגיע למהירות סופית. מה היא, ומה הזרם בה? למה היא לא תלויה בהתנגדות ובמסה?

      ד. מהירות המוט היא $v(t) = v_T\left(1 - e^{-t/\tau}\right)$. מצאו את $\tau$.

      ה. עד שהמוט מגיע (כמעט) למהירות הסופית, כמה אנרגיה נותנת הסוללה, כמה ממנה נעשית אנרגיה קינטית וכמה חום? היעזרו בכך שבכל פרק זמן קצר התנע של המוט גדל ב-$BL\,\Delta q$, והסוללה נותנת $U\,\Delta q$.
    answer: >-
      א. $3\,\text{A}$; $6\,\text{m/s}^2$.

      ב. $I = \dfrac{U - BLv}{R}$.

      ג. $7.5\,\text{m/s}$, ובה הזרם אפס.

      ד. $1.25\,\text{s}$.

      ה. $5.625\,\text{J}$ מהסוללה: חצי, כ-$2.81\,\text{J}$, אנרגיה קינטית, וחצי חום.
    solution:
      - kind: given
        text: >-
          $m = 0.1\,\text{kg}$, $L = 0.4\,\text{m}$, $B = 0.5\,\text{T}$, $U = 1.5\,\text{V}$, $R = 0.5\,\Omega$, $v_0 = 0$. $BL = 0.2\,\text{T}\cdot\text{m}$.
      - kind: substitution
        text: >-
          א. במנוחה אין כא"מ מושרה: $I_0 = \dfrac{U}{R} = 3\,\text{A}$, $F = BI_0L = 0.5\cdot3\cdot0.4 = 0.6\,\text{N}$, ו-$a_0 = \dfrac{0.6}{0.1} = 6\,\text{m/s}^2$.
      - kind: reasoning
        text: >-
          ב. הכוח המגנטי מניע את המוט, ולכן התנועה היא התוצאה של הזרם. לפי חוק לנץ, הכא"מ המושרה $BLv$ מתנגד לסיבה, כלומר לזרם שמניע את המוט: הוא פועל נגד הסוללה. (בכוח לורנץ: על המטענים במוט שנע פועל כוח לאורכו, נגד כיוון הזרם.) במעגל יש שני כא"מים מנוגדים: $I = \dfrac{U - BLv}{R}$.
      - kind: reasoning
        text: >-
          ג. החוק השני של ניוטון: $ma = BIL = \dfrac{BL(U - BLv)}{R}$. התאוצה מתאפסת כש-$BLv_T = U$, כלומר כשהכא"מ המושרה שווה למתח הסוללה ואין זרם. לכן $v_T = \dfrac{U}{BL}$. בלי זרם אין כוח, ובלי כוח אין צורך בזרם: אין חיכוך שצריך לנצח. $R$ ו-$m$ קובעים רק כמה מהר המוט מגיע אליה.
      - kind: manipulation
        text: >-
          ד. נפתח סוגריים: $ma = \dfrac{BLU}{R} - \dfrac{B^2L^2v}{R}$. זו בדיוק המשוואה של מוט שנמשך בכוח קבוע $F = \dfrac{BLU}{R}$, ולכן $\tau = \dfrac{mR}{B^2L^2}$ כמו בשיעור.
      - kind: substitution
        text: >-
          ג. $v_T = \dfrac{1.5}{0.2} = 7.5\,\text{m/s}$, $I = 0$. ד. $\tau = \dfrac{0.1\cdot0.5}{0.04} = 1.25\,\text{s}$ (בדיקה: $v_T/a_0 = 7.5/6 = 1.25\,\text{s}$).
      - kind: reasoning
        text: >-
          ה. כמו באתגר הקודם, נסכם את השינויים בתנע: $mv_T = BLq$, ולכן המטען שעבר בסוללה $q = \dfrac{mv_T}{BL} = \dfrac{0.1\cdot7.5}{0.2} = 3.75\,\text{C}$. הסוללה נתנה $Uq = 1.5\cdot3.75 = 5.625\,\text{J}$. האנרגיה הקינטית $\tfrac{1}{2}\cdot0.1\cdot7.5^2 \approx 2.81\,\text{J}$. החום הוא ההפרש, $5.625 - 2.81 \approx 2.81\,\text{J}$. שימו לב: $Uq = U\cdot\dfrac{mv_T}{BL} = mv_T^2$, בדיוק פי 2 מהאנרגיה הקינטית, בכל $R$.
      - kind: result
        text: >-
          א. $3\,\text{A}$, $6\,\text{m/s}^2$. ב. $I = (U - BLv)/R$. ג. $v_T = U/(BL) = 7.5\,\text{m/s}$, בלי זרם. ד. $\tau = 1.25\,\text{s}$. ה. $5.625\,\text{J}$ מהסוללה, חצי לאנרגיה קינטית וחצי לחום, כמו בטעינת קבל מסוללה.
    source:
      name: Physics Olympiad Selection Competition (Hungary, IPhO team selection)
      year: 2024
      problem: 'Round 1, 26 February 2024, Problem F2: a rod of mass m on frictionless horizontal rails a distance ℓ apart in a field B, an ideal source U and a resistor R between the rails; (a) the speed against time from rest (part (b), the resistor replaced by an inductor, dropped). Adapted: numbers, the steps of (a) split into parts, and the energy part ה added'
      url: https://ipho.physics.bme.hu/pdfs/kunfalvi/kunfalvi_2024_eng.pdf
      verified: '2026-11-05'
      adapted: true
