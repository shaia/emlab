# Workbook for lesson 1.9: ten practice problems and two sourced challenge problems.
# Every number recomputed with src/physics (constants.ts: K, EPS0_DISPLAY, E_CHARGE;
# electrostatics.ts: shellField, pointFieldMagnitude, planeField). Field and charge arguments
# only: potential is chapter 2.

lesson: '1.9'
practice:
  - id: W-1.9-01
    level: basic
    qualitative: true
    objectives: [OBJ-1.9-1]
    prompt: >-
      מוט מתכת ניטרלי עומד אנכית על בסיס מבודד, בתוך שדה חשמלי אחיד שמצביע למעלה. נותנים למטענים זמן להתייצב.

      (א) איזה קצה של המוט נעשה שלילי, ואיזה חיובי?

      (ב) מה השדה באמצע המוט?

      (ג) מה הכוח החשמלי השקול על המוט כולו? נמקו.
    answer: >-
      (א) הקצה התחתון שלילי, והעליון חיובי.

      (ב) אפס.

      (ג) אפס.
    solution:
      - kind: reasoning
        text: >-
          (א) הכוח על אלקטרון הפוך לכיוון השדה. השדה מצביע למעלה, ולכן האלקטרונים החופשיים נדחפים למטה ומצטברים בקצה התחתון,
          שנעשה שלילי. בקצה העליון חסרים אלקטרונים, והוא נעשה חיובי.
      - kind: reasoning
        text: >-
          (ב) בשיווי משקל כל המטענים נחים. אילו היה שדה באמצע המוט, הוא היה מזיז את האלקטרונים החופשיים שם. לכן השדה בתוך המתכת אפס.
      - kind: reasoning
        text: >-
          (ג) המוט ניטרלי, ולכן המטען המושרה בקצה העליון שווה בגודלו למטען המושרה בקצה התחתון. השדה החיצוני אחיד,
          ולכן הוא דוחף את המטען החיובי למעלה ואת המטען השלילי למטה בכוחות שווים בגודלם. הכוחות שהמטענים המושרים מפעילים
          זה על זה הם כוחות פנימיים, והם מתבטלים בזוגות.
      - kind: result
        text: >-
          (א) הקצה התחתון שלילי והעליון חיובי.

          (ב) השדה באמצע המוט אפס.

          (ג) הכוח השקול אפס: מוליך ניטרלי בשדה אחיד מקבל מטענים מושרים, אבל לא נדחף.

  - id: W-1.9-02
    level: basic
    qualitative: false
    objectives: [OBJ-1.9-2]
    prompt: >-
      ממש מחוץ לפני גוף מתכת שנמצא בשיווי משקל, השדה הוא $4.5\cdot10^{4}\,\text{N/C}$, והוא מצביע אל פני הגוף, כלומר אל תוך המתכת.

      (א) מה צפיפות המטען המשטחית במקום הזה, כולל הסימן? ($\varepsilon_0 = 8.85\cdot10^{-12}\,\text{C}^2/(\text{N}\cdot\text{m}^2)$)

      (ב) כמה מטען יש על חלק של פני הגוף ששטחו $1\,\text{cm}^2$? כמה אלקטרונים עודפים זה?
    answer: >-
      (א) $\sigma \approx -4.0\cdot10^{-7}\,\text{C/m}^2$

      (ב) כ-$4.0\cdot10^{-11}\,\text{C}$, שלילי: כ-$2.5\cdot10^{8}$ אלקטרונים עודפים
    solution:
      - kind: given
        text: >-
          $E = 4.5\cdot10^{4}\,\text{N/C}$, אל תוך המתכת. $A = 1\,\text{cm}^2 = 10^{-4}\,\text{m}^2$.
      - kind: formula
        text: >-
          ליד פני מוליך $E = \sigma/\varepsilon_0$. מכפילים את שני האגפים ב-$\varepsilon_0$: $|\sigma| = \varepsilon_0 E$.
          השדה מצביע החוצה כש-$\sigma > 0$, ופנימה כש-$\sigma < 0$.
      - kind: substitution
        text: >-
          $|\sigma| = 8.85\cdot10^{-12} \cdot 4.5\cdot10^{4} \approx 3.98\cdot10^{-7}\,\text{C/m}^2$. השדה מצביע פנימה, ולכן הסימן שלילי.
      - kind: substitution
        text: >-
          (ב) $|q| = |\sigma| A = 3.98\cdot10^{-7} \cdot 10^{-4} \approx 3.98\cdot10^{-11}\,\text{C}$.
          מספר האלקטרונים הוא המטען חלקי המטען של אלקטרון אחד: $N = 3.98\cdot10^{-11} / 1.6\cdot10^{-19} \approx 2.5\cdot10^{8}$.
      - kind: result
        text: >-
          (א) $\sigma \approx -4.0\cdot10^{-7}\,\text{C/m}^2$.

          (ב) על $1\,\text{cm}^2$ יש כ-$4.0\cdot10^{-11}\,\text{C}$ של מטען שלילי, כלומר כ-$2.5\cdot10^{8}$ אלקטרונים עודפים.

  - id: W-1.9-03
    level: basic
    qualitative: false
    objectives: [OBJ-1.9-2, OBJ-1.9-1]
    prompt: >-
      כדור מתכת ברדיוס $5\,\text{cm}$ נמצא בשיווי משקל, ואין גופים טעונים אחרים בסביבה. ממש מחוץ לפני הכדור מודדים שדה של
      $3.6\cdot10^{4}\,\text{N/C}$, שמצביע אל מרכז הכדור.

      (א) מה המטען של הכדור, כולל הסימן?

      (ב) מה השדה בנקודה שנמצאת $2.5\,\text{cm}$ ממרכז הכדור?
    answer: >-
      (א) $Q = -1.0\cdot10^{-8}\,\text{C}$, כלומר $Q = -10\,\text{nC}$

      (ב) אפס
    solution:
      - kind: given
        text: >-
          $R = 0.05\,\text{m}$. ממש מחוץ לפני הכדור $E = 3.6\cdot10^{4}\,\text{N/C}$, אל המרכז.
      - kind: formula
        text: >-
          כל המטען על פני הכדור ומתפזר באחידות, ולכן מחוץ לכדור השדה כמו של מטען נקודתי במרכז. ממש ליד פני הכדור $E = k|Q|/R^2$.
      - kind: manipulation
        text: >-
          מכפילים את שני האגפים ב-$R^2$ ומחלקים ב-$k$: $|Q| = E R^2 / k$.
      - kind: substitution
        text: >-
          $|Q| = 3.6\cdot10^{4} \cdot 0.05^2 / 9\cdot10^{9} = 1.0\cdot10^{-8}\,\text{C}$. השדה מצביע אל המרכז, ולכן המטען שלילי.
      - kind: reasoning
        text: >-
          (ב) נקודה במרחק $2.5\,\text{cm}$ מהמרכז נמצאת בתוך המתכת, והכדור בשיווי משקל. לכן השדה בה אפס, בלי שום חישוב.
      - kind: result
        text: >-
          (א) $Q = -10\,\text{nC}$.

          (ב) השדה אפס.

  - id: W-1.9-04
    level: mid
    qualitative: false
    objectives: [OBJ-1.9-1]
    prompt: >-
      כדור מתכת ניטרלי ברדיוס $10\,\text{cm}$ עומד על בסיס מבודד. מטען נקודתי $q = +2\,\text{nC}$ נמצא במרחק $30\,\text{cm}$ ממרכז הכדור.

      (א) מה השדה הכולל במרכז הכדור?

      (ב) מה השדה שיוצרים המטענים המושרים לבדם במרכז הכדור: גודל וכיוון?

      (ג) מה השדה של המטענים המושרים לבדם בנקודה שבתוך הכדור, על הקו שבין $q$ למרכז, במרחק $25\,\text{cm}$ מ-$q$? האם השדה של המטענים המושרים אחיד בתוך הכדור?
    answer: >-
      (א) אפס.

      (ב) $200\,\text{N/C}$, בכיוון אל $q$.

      (ג) כ-$2.9\cdot10^{2}\,\text{N/C}$, בכיוון אל $q$. לא אחיד.
    solution:
      - kind: reasoning
        text: >-
          (א) הכדור מוליך בשיווי משקל, והמרכז בתוך המתכת. לכן השדה הכולל שם אפס.
      - kind: reasoning
        text: >-
          בכל נקודה בתוך המתכת השדה הכולל הוא הסכום של השדה של $q$ ושל השדה של המטענים המושרים, והסכום אפס.
          לכן השדה של המטענים המושרים שווה בגודלו לשדה של $q$ באותה נקודה, והפוך לו בכיוון.
      - kind: formula
        text: >-
          השדה של מטען נקודתי: $E = kq/r^2$. השדה של $q$ חיובי מצביע הרחק ממנו, ולכן השדה של המטענים המושרים מצביע אל $q$.
      - kind: substitution
        text: >-
          (ב) במרכז $r = 0.3\,\text{m}$: $E = 9\cdot10^{9} \cdot 2\cdot10^{-9} / 0.3^2 = 200\,\text{N/C}$.
      - kind: substitution
        text: >-
          (ג) הנקודה נמצאת $5\,\text{cm}$ מהמרכז, לכיוון $q$, כלומר בתוך הכדור. שם $r = 0.25\,\text{m}$:
          $E = 9\cdot10^{9} \cdot 2\cdot10^{-9} / 0.25^2 = 288\,\text{N/C}$.
      - kind: result
        text: >-
          (א) השדה הכולל במרכז אפס.

          (ב) המטענים המושרים יוצרים במרכז $200\,\text{N/C}$, בכיוון אל $q$.

          (ג) בנקודה השנייה הם יוצרים כ-$2.9\cdot10^{2}\,\text{N/C}$, גם כן בכיוון אל $q$. השדה שלהם לא אחיד: בכל נקודה הוא בדיוק ההפך של השדה של $q$ שם.

  - id: W-1.9-05
    level: mid
    qualitative: false
    objectives: [OBJ-1.9-2]
    prompt: >-
      לוח מתכת דק, ריבוע של $20\,\text{cm}$ על $20\,\text{cm}$, עומד על בסיס מבודד, ונותנים לו מטען עודף של $8\,\text{nC}$. אין שדה חיצוני.
      נתעלם מהשוליים: נבדוק את השדה בנקודות שקרובות ללוח ורחוקות משוליו.

      (א) איפה נמצא המטען, ומה צפיפות המטען המשטחית על כל אחת משתי הפאות?

      (ב) מה השדה ממש מחוץ ללוח, בכל אחד משני צדדיו?

      (ג) תלמידה התייחסה ללוח כאל לוח אינסופי אחד עם צפיפות $Q/A$, והשתמשה ב-$E = \sigma/(2\varepsilon_0)$. תלמיד אחר השתמש באותה צפיפות $Q/A$ וב-$E = \sigma/\varepsilon_0$. מי מהם קיבל את התשובה של סעיף ב?
    answer: >-
      (א) על שתי הפאות, חצי על כל אחת: $\sigma = 1.0\cdot10^{-7}\,\text{C/m}^2$.

      (ב) כ-$1.1\cdot10^{4}\,\text{N/C}$, הרחק מהלוח, משני צדדיו.

      (ג) התלמידה.
    solution:
      - kind: given
        text: >-
          $Q = 8\cdot10^{-9}\,\text{C}$, שטח פאה $A = 0.2 \cdot 0.2 = 0.04\,\text{m}^2$.
      - kind: reasoning
        text: >-
          (א) המטען העודף נמצא על פני המוליך. ללוח יש שתי פאות גדולות זהות, ושום דבר לא מבדיל ביניהן, ולכן המטען מתחלק ביניהן שווה בשווה:
          $4\,\text{nC}$ על כל פאה.
      - kind: substitution
        text: >-
          $\sigma = \dfrac{Q/2}{A} = \dfrac{4\cdot10^{-9}}{0.04} = 1.0\cdot10^{-7}\,\text{C/m}^2$ על כל פאה.
      - kind: formula
        text: >-
          (ב) ליד פני מוליך $E = \sigma/\varepsilon_0$, כשהצפיפות היא של הפאה הסמוכה.
      - kind: substitution
        text: >-
          $E = 1.0\cdot10^{-7} / 8.85\cdot10^{-12} \approx 1.13\cdot10^{4}\,\text{N/C}$. המטען חיובי, ולכן השדה מצביע הרחק מהלוח.
      - kind: substitution
        text: >-
          (ג) $Q/A = 2.0\cdot10^{-7}\,\text{C/m}^2$. התלמידה: $2.0\cdot10^{-7} / (2 \cdot 8.85\cdot10^{-12}) \approx 1.13\cdot10^{4}\,\text{N/C}$.
          התלמיד: $2.0\cdot10^{-7} / 8.85\cdot10^{-12} \approx 2.26\cdot10^{4}\,\text{N/C}$, כפול מהנכון.
      - kind: result
        text: >-
          (א) $4\,\text{nC}$ על כל פאה, $\sigma = 1.0\cdot10^{-7}\,\text{C/m}^2$.

          (ב) כ-$1.1\cdot10^{4}\,\text{N/C}$, הרחק מהלוח, משני צדדיו.

          (ג) התלמידה צדקה. $E = \sigma/\varepsilon_0$ מתאים לצפיפות של פאה אחת, ו-$E = \sigma/(2\varepsilon_0)$ מתאים לכל המטען כשכבה אחת.
          התלמיד ערבב: לקח את המטען של שתי הפאות עם הנוסחה של פאה אחת.

  - id: W-1.9-06
    level: mid
    qualitative: true
    objectives: [OBJ-1.9-3, OBJ-1.9-1]
    prompt: >-
      תלמיד טוען: "בתוך קופסת מתכת סגורה השדה החשמלי תמיד אפס." בדקו את הטענה בשלושה מצבים, ונמקו כל תשובה.
      בכל המצבים הקופסה לא מחוברת לשום דבר.

      (א) הקופסה ניטרלית, החלל שבתוכה ריק, והיא נמצאת בשדה חיצוני חזק וקבוע.

      (ב) הקופסה ניטרלית, אין שדה חיצוני, ובתוך החלל תלוי על חוט מבודד כדור קטן טעון.

      (ג) הקופסה עצמה טעונה במטען עודף, החלל ריק ואין שדה חיצוני.
    answer: >-
      (א) אפס. (ב) לא אפס. (ג) אפס. הטענה נכונה רק כשבחלל אין מטען.
    solution:
      - kind: reasoning
        text: >-
          (א) המטענים המושרים על הקופסה מבטלים את השדה החיצוני בתוך המתכת. בחלל ריק השדה גם כן אפס: קו שדה בחלל היה מאפשר
          להזיז מטען בוחן לאורכו, להרוויח אנרגיה, ולחזור דרך המתכת בלי לשלם. זה כלוב פאראדיי.
      - kind: reasoning
        text: >-
          (ב) הכדור הטעון יוצר שדה בחלל. על הדופן הפנימית מושרה מטען שווה ומנוגד למטען הכדור, וקווי השדה יוצאים מהכדור ונגמרים
          על הדופן (או מתחילים בה ונגמרים בכדור, אם הוא שלילי). השדה אפס רק בתוך המתכת, לא בחלל.
      - kind: reasoning
        text: >-
          (ג) המטען העודף נמצא על פני הקופסה מבחוץ. בחלל אין מטען, ולכן אותו נימוק כמו בסעיף א נותן שדה אפס בחלל.
      - kind: result
        text: >-
          (א) אפס. (ב) לא אפס: יש שדה בין הכדור לדופן. (ג) אפס.
          הטענה נכונה רק כשאין מטען בתוך החלל. הכלוב מגן מפני מה שבחוץ, ולא מבטל את השדה של מה שבתוכו.

  - id: W-1.9-07
    level: mid
    qualitative: false
    objectives: [OBJ-1.9-3, OBJ-1.9-2]
    prompt: >-
      כדור מתכת מלא ברדיוס $15\,\text{cm}$ טעון במטען עודף $Q = -6\,\text{nC}$. בתוך הכדור יש חלל כדורי קטן וריק, שהמרכז שלו
      לא במרכז הכדור. אין גופים טעונים אחרים בסביבה.

      (א) כמה מטען יש על הדופן של החלל?

      (ב) מה השדה בתוך החלל?

      (ג) מה השדה בנקודה שנמצאת $45\,\text{cm}$ ממרכז הכדור?
    answer: >-
      (א) אפס.

      (ב) אפס.

      (ג) כ-$2.7\cdot10^{2}\,\text{N/C}$, אל מרכז הכדור.
    solution:
      - kind: reasoning
        text: >-
          (ב) בחלל אין מטען. כמו בכלוב פאראדיי, בחלל ריק בתוך מוליך השדה אפס, גם כשהחלל לא במרכז.
      - kind: reasoning
        text: >-
          (א) נבחר משטח גאוס בתוך המתכת, סביב החלל. השדה עליו אפס, ולכן המטען הכלוא אפס. בחלל עצמו אין מטען, ולכן גם על הדופן
          המטען הכולל אפס. יותר מזה: ליד הדופן, מצד החלל, השדה אפס, ולפי $E = \sigma/\varepsilon_0$ גם $\sigma = 0$ בכל נקודה על הדופן.
      - kind: reasoning
        text: >-
          (ג) כל המטען, $6\,\text{nC}$ שליליים, נמצא על פני הכדור מבחוץ. החלל לא נושא מטען ואין בו שדה, ולכן מבחוץ אי אפשר להבדיל
          בין הכדור הזה לבין כדור מלא: המטען מתפזר באחידות על פני הכדור, ומחוצה לו השדה כמו של מטען נקודתי במרכז.
      - kind: formula
        text: >-
          $E = k|Q|/r^2$.
      - kind: substitution
        text: >-
          $E = 9\cdot10^{9} \cdot 6\cdot10^{-9} / 0.45^2 \approx 267\,\text{N/C}$. המטען שלילי, ולכן השדה מצביע אל הכדור.
      - kind: result
        text: >-
          (א) על דופן החלל אין מטען.

          (ב) בחלל השדה אפס.

          (ג) כ-$2.7\cdot10^{2}\,\text{N/C}$, אל מרכז הכדור. המקום של החלל לא משנה דבר מבחוץ.

  - id: W-1.9-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.9-3, OBJ-1.9-2]
    prompt: >-
      קליפה כדורית עבה ממתכת, שהרדיוס הפנימי שלה $8\,\text{cm}$ והחיצוני $10\,\text{cm}$, טעונה במטען עודף של $+5\,\text{nC}$.
      במרכז החלל שלה יש מטען נקודתי $q$ שלא ידוע. במרחק $30\,\text{cm}$ מהמרכז מודדים שדה של $900\,\text{N/C}$, שמצביע אל המרכז.

      (א) כמה מטען יש על הדופן החיצונית של הקליפה?

      (ב) כמה מטען יש על הדופן הפנימית של הקליפה?

      (ג) מהו $q$?

      (ד) מה השדה במרחק $5\,\text{cm}$ מהמרכז?
    answer: >-
      (א) $Q_2 = -9\,\text{nC}$

      (ב) $Q_1 = +14\,\text{nC}$

      (ג) $q = -14\,\text{nC}$

      (ד) כ-$5.0\cdot10^{4}\,\text{N/C}$, אל המרכז
    solution:
      - kind: given
        text: >-
          נסמן ב-$Q_1$ את המטען על הדופן הפנימית, וב-$Q_2$ את המטען על הדופן החיצונית. $Q_1 + Q_2 = +5\,\text{nC}$.
          בנקודה $r = 0.3\,\text{m}$ השדה $E = 900\,\text{N/C}$, אל המרכז.
      - kind: reasoning
        text: >-
          (א) המטען על הדופן הפנימית ו-$q$ סכומם אפס (משטח גאוס בתוך המתכת), ולכן מחוץ לקליפה המטען הכלוא הוא $Q_2$ בלבד.
          השדה מבחוץ כמו של מטען נקודתי $Q_2$ במרכז, והוא מצביע אל המרכז, ולכן $Q_2$ שלילי.
      - kind: manipulation
        text: >-
          מ-$E = k|Q_2|/r^2$: מכפילים ב-$r^2$ ומחלקים ב-$k$, ומקבלים $|Q_2| = E r^2 / k$.
      - kind: substitution
        text: >-
          $|Q_2| = 900 \cdot 0.3^2 / 9\cdot10^{9} = 9\cdot10^{-9}\,\text{C}$, ולכן $Q_2 = -9\,\text{nC}$.
      - kind: substitution
        text: >-
          (ב) $Q_1 = 5 - Q_2 = 5 - (-9) = 14\,\text{nC}$.
      - kind: reasoning
        text: >-
          (ג) משטח גאוס בתוך המתכת: $q + Q_1 = 0$, ולכן $q = -14\,\text{nC}$.
      - kind: substitution
        text: >-
          (ד) הנקודה בחלל, ובתוך כדור ברדיוס $5\,\text{cm}$ יש רק את $q$. $E = 9\cdot10^{9} \cdot 14\cdot10^{-9} / 0.05^2 \approx 5.0\cdot10^{4}\,\text{N/C}$.
          $q$ שלילי, ולכן השדה מצביע אל המרכז.
      - kind: result
        text: >-
          (א) $Q_2 = -9\,\text{nC}$.

          (ב) $Q_1 = +14\,\text{nC}$.

          (ג) $q = -14\,\text{nC}$.

          (ד) כ-$5.0\cdot10^{4}\,\text{N/C}$, אל המרכז. הקליפה טעונה חיובית, ובכל זאת השדה בחוץ מצביע פנימה: המטען שבחלל מנצח.

  - id: W-1.9-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.9-2, OBJ-1.9-1]
    prompt: >-
      שני לוחות מתכת זהים, ריבועים של $20\,\text{cm}$ על $20\,\text{cm}$, מקבילים וקרובים זה לזה. הלוח השמאלי A טעון ב-$+6\,\text{nC}$,
      והלוח הימני B טעון ב-$-2\,\text{nC}$. נתעלם מהשוליים ונתייחס לכל פאה כאל לוח אינסופי.

      נמספר את ארבע הפאות משמאל לימין: 1 ו-2 הן הפאות של A (2 פונה אל B), ו-3 ו-4 הן הפאות של B (3 פונה אל A).

      (א) מצאו את המטען על כל אחת מארבע הפאות. רמז: כל פאה היא לוח אינסופי שהשדה שלו $\sigma/(2\varepsilon_0)$ לשני צדדיו,
      והשדה בתוך המתכת של כל לוח, שהוא הסכום של ארבעת השדות, אפס.

      (ב) מה השדה בין הלוחות, ומה השדה מחוץ להם, משני הצדדים?
    answer: >-
      (א) $q_1 = q_4 = +2\,\text{nC}$, $q_2 = +4\,\text{nC}$, $q_3 = -4\,\text{nC}$.

      (ב) בין הלוחות כ-$1.1\cdot10^{4}\,\text{N/C}$, מ-A אל B. מחוץ להם כ-$5.6\cdot10^{3}\,\text{N/C}$, הרחק מהלוחות.
    solution:
      - kind: given
        text: >-
          $Q_A = +6\,\text{nC}$, $Q_B = -2\,\text{nC}$, $A = 0.04\,\text{m}^2$. לכל פאה צפיפות $\sigma_i = q_i/A$. ימינה הוא הכיוון החיובי.
      - kind: reasoning
        text: >-
          פאה עם $\sigma > 0$ יוצרת שדה $\sigma/(2\varepsilon_0)$ שמצביע הרחק ממנה: ימינה בנקודות שמימינה, ושמאלה בנקודות שמשמאלה.
      - kind: formula
        text: >-
          בתוך המתכת של A, פאה 1 משמאל לנקודה, ופאות 2, 3, 4 מימינה. בתוך המתכת של B, פאות 1, 2, 3 משמאל ופאה 4 מימין.
          מכפילים כל משוואה ב-$2\varepsilon_0$:

          $\sigma_1 - \sigma_2 - \sigma_3 - \sigma_4 = 0$ (בתוך A) וגם $\sigma_1 + \sigma_2 + \sigma_3 - \sigma_4 = 0$ (בתוך B).
      - kind: manipulation
        text: >-
          מחברים את שתי המשוואות: $2\sigma_1 - 2\sigma_4 = 0$, ולכן $\sigma_1 = \sigma_4$. מחסרים את הראשונה מהשנייה:
          $2\sigma_2 + 2\sigma_3 = 0$, ולכן $\sigma_3 = -\sigma_2$. אותו דבר נכון למטענים: $q_1 = q_4$ ו-$q_3 = -q_2$.
      - kind: substitution
        text: >-
          המטענים הכוללים: $q_1 + q_2 = 6$ ו-$q_3 + q_4 = -2$ (בננו-קולון). מחברים: $q_1 + q_4 + (q_2 + q_3) = 4$.
          הסוגריים אפס ו-$q_1 = q_4$, ולכן $2q_1 = 4$, כלומר $q_1 = q_4 = 2\,\text{nC}$. מכאן $q_2 = 6 - 2 = 4\,\text{nC}$ ו-$q_3 = -4\,\text{nC}$.
      - kind: formula
        text: >-
          (ב) ליד פני מוליך $E = \sigma/\varepsilon_0$, עם הצפיפות של הפאה הסמוכה.
      - kind: substitution
        text: >-
          בין הלוחות, ליד פאה 2: $\sigma_2 = 4\cdot10^{-9}/0.04 = 1.0\cdot10^{-7}\,\text{C/m}^2$, ו-$E = 1.0\cdot10^{-7}/8.85\cdot10^{-12} \approx 1.13\cdot10^{4}\,\text{N/C}$.
          מחוץ ללוחות, ליד פאה 1 או 4: $\sigma = 2\cdot10^{-9}/0.04 = 5.0\cdot10^{-8}\,\text{C/m}^2$, ו-$E \approx 5.65\cdot10^{3}\,\text{N/C}$.
      - kind: reasoning
        text: >-
          כיוונים: פאה 2 חיובית, ולכן בין הלוחות השדה מצביע ממנה, מ-A אל B. הפאות החיצוניות חיוביות, ולכן מבחוץ השדה מצביע הרחק מהלוחות.
          בדיקה: מבחוץ השדה כמו של כל המטען, $4\,\text{nC}$, כשכבה אחת: $\frac{4\cdot10^{-9}/0.04}{2 \cdot 8.85\cdot10^{-12}} \approx 5.65\cdot10^{3}\,\text{N/C}$.
      - kind: result
        text: >-
          (א) $q_1 = +2\,\text{nC}$, $q_2 = +4\,\text{nC}$, $q_3 = -4\,\text{nC}$ ו-$q_4 = +2\,\text{nC}$.

          (ב) בין הלוחות כ-$1.1\cdot10^{4}\,\text{N/C}$, מ-A אל B. מחוץ להם, משני הצדדים, כ-$5.6\cdot10^{3}\,\text{N/C}$, הרחק מהלוחות.
          הפאות הפונות זו לזו נושאות תמיד מטענים שווים ומנוגדים, והפאות החיצוניות נושאות כל אחת חצי מהמטען הכולל.

  - id: W-1.9-10
    level: bagrut
    qualitative: true
    objectives: [OBJ-1.9-3, OBJ-1.9-2]
    prompt: >-
      פחית מתכת ניטרלית עם מכסה (ובו פתח קטן) עומדת על בסיס מבודד. חוט מוליך מחבר את הדופן החיצונית שלה לאלקטרוסקופ שעומד בחוץ.
      דרך הפתח משלשלים לתוך הפחית, על חוט מבודד, כדור מתכת קטן שטעון במטען $+q$.

      (א) הכדור בתוך הפחית ולא נוגע בה. האם עלי האלקטרוסקופ נפתחים? נמקו.

      (ב) מזיזים את הכדור למקומות שונים בתוך הפחית, בלי לגעת בדפנות. האם פתיחת העלים משתנה?

      (ג) נוגעים בכדור בדופן הפנימית של הפחית. מה קורה למטען הכדור, למטען על הדופן הפנימית ולעלים?

      (ד) מוציאים את הכדור. מה המטען של הכדור, ומה המטען של הפחית (יחד עם האלקטרוסקופ)?
    answer: >-
      (א) כן. (ב) לא. (ג) הכדור והדופן הפנימית מתנטרלים, והעלים לא משתנים. (ד) הכדור ניטרלי, ולפחית יש $+q$.
    solution:
      - kind: reasoning
        text: >-
          (א) משטח גאוס בתוך המתכת של הפחית: השדה עליו אפס, ולכן המטען הכלוא אפס. לכן על הדופן הפנימית מופיע $(-q)$.
          הפחית ניטרלית, ולכן $+q$ מופיע בחוץ: על הדופן החיצונית ועל האלקטרוסקופ שמחובר אליה. העלים נפתחים.
      - kind: reasoning
        text: >-
          (ב) לכל מקום של הכדור בחלל אותו נימוק נותן $(-q)$ על הדופן הפנימית ו-$+q$ בחוץ. בתוך המתכת השדה אפס, ולכן מה שקורה בחלל
          לא מגיע אל החלק החיצוני. העלים לא משתנים.
      - kind: reasoning
        text: >-
          (ג) במגע הכדור נעשה חלק מהמוליך, והחלל נשאר בלי מטען. בחלל ריק של מוליך השדה אפס, ולכן אין מטען על הדופן הפנימית:
          $+q$ של הכדור ו-$(-q)$ של הדופן מתנטרלים. החלק החיצוני לא הרגיש דבר, והעלים לא משתנים.
      - kind: reasoning
        text: >-
          (ד) הכדור ניטרלי, ולכן גם בחוץ הוא לא לוקח איתו מטען. לפי שימור המטען, המטען $+q$ נשאר על הפחית ועל האלקטרוסקופ.
      - kind: result
        text: >-
          (א) כן: $+q$ מופיע על החלק החיצוני ועל האלקטרוסקופ.

          (ב) לא: המטען בחוץ הוא $+q$ בכל מקום של הכדור.

          (ג) הכדור מתנטרל, הדופן הפנימית מתנטרלת, והעלים נשארים כמו שהיו.

          (ד) הכדור ניטרלי, ולפחית ולאלקטרוסקופ יחד $+q$: כל המטען של הכדור עבר אל הפחית. כך פאראדיי הראה שהמטען המושרה על הדופן
          הפנימית שווה בדיוק למטען שבחלל.

challenge:
  - id: W-1.9-c1
    stars: 1
    objectives: [OBJ-1.9-3, OBJ-1.9-2]
    prompt: >-
      בתוך החלל של קליפה כדורית ניטרלית ממתכת, שלא מחוברת לשום דבר, נמצאים שני מטענים נקודתיים: $+3\,\text{nC}$ ו-$-3\,\text{nC}$.
      הם קרובים לדופן החלל, משני צדיו של המרכז. אין שדה חיצוני.

      (א) מה המטען הכולל על הדופן הפנימית של הקליפה? האם צפיפות המטען המשטחית על הדופן הפנימית אפס בכל נקודה?

      (ב) מה המטען הכולל על הדופן החיצונית? האם צפיפות המטען שם אפס בכל נקודה?

      (ג) מה השדה מחוץ לקליפה?
    answer: >-
      (א) המטען הכולל אפס, אבל הצפיפות לא אפס: שלילית ליד $+3\,\text{nC}$ וחיובית ליד $-3\,\text{nC}$.

      (ב) המטען הכולל אפס, והצפיפות אפס בכל נקודה.

      (ג) אפס.
    solution:
      - kind: reasoning
        text: >-
          (א) משטח גאוס בתוך המתכת, סביב החלל: השדה עליו אפס, ולכן המטען הכלוא אפס. בחלל יש $3 + (-3) = 0$, ולכן גם המטען הכולל
          על הדופן הפנימית אפס.
      - kind: reasoning
        text: >-
          אבל בחלל יש שדה: קווים יוצאים מ-$+3\,\text{nC}$, ורובם נגמרים על הדופן הקרובה אליו. ליד דופן שבה נגמר קו שדה, השדה
          מצביע אל המתכת, ולפי $E = \sigma/\varepsilon_0$ שם $\sigma < 0$. ליד $-3\,\text{nC}$ קורה ההפך, ושם $\sigma > 0$.
          הצפיפות לא אפס, אף שהסכום אפס.
      - kind: reasoning
        text: >-
          (ב) הקליפה ניטרלית והדופן הפנימית נושאת סך הכול אפס, ולכן גם הדופן החיצונית נושאת סך הכול אפס.
      - kind: reasoning
        text: >-
          נניח בשלילה שעל הדופן החיצונית יש כתמים חיוביים וכתמים שליליים. מחוץ לקליפה אין מטענים אחרים, והמטען הכולל על הדופן
          החיצונית אפס, ולכן קווי השדה בחוץ יוצאים מכתם חיובי וחוזרים אל כתם שלילי על אותה דופן. נזיז מטען בוחן לאורך קו כזה:
          השדה דוחף אותו כל הדרך, והוא מקבל אנרגיה. נחזיר אותו דרך המתכת, שבה אין שדה, בלי לשלם. זו אנרגיה יש מאין, ולכן אין
          שדה מחוץ לקליפה.
      - kind: reasoning
        text: >-
          ממש מחוץ לדופן החיצונית $E = 0$, ולפי $E = \sigma/\varepsilon_0$ גם $\sigma = 0$ בכל נקודה שם.
      - kind: result
        text: >-
          (א) על הדופן הפנימית המטען הכולל אפס, אבל הצפיפות לא אפס: שלילית ליד $+3\,\text{nC}$ וחיובית ליד $-3\,\text{nC}$.

          (ב) על הדופן החיצונית המטען הכולל אפס, והצפיפות אפס בכל נקודה.

          (ג) מחוץ לקליפה השדה אפס. מבחוץ אין שום סימן לכך שבחלל יש מטענים.
    source:
      name: JEE Main
      year: 2015
      problem: '10 April 2015 (online), Q15'
      url: https://cracku.in/15-shown-in-the-figure-are-two-point-charges-q-and-q--x-nta-jee-main-10-apr-2015-online
      verified: '2026-11-02'
      adapted: true

  - id: W-1.9-c2
    stars: 2
    objectives: [OBJ-1.9-2, OBJ-1.9-1]
    prompt: >-
      כדור מתכת חלול ברדיוס $R = 10\,\text{cm}$ בנוי משני חצאי כדור, שמונחים זה על זה ולא מחוברים. הכדור טעון ב-$Q = 0.2\,\mu\text{C}$
      ונמצא בשיווי משקל. המטען דוחה את שני החצאים זה מזה, ולכן צריך ללחוץ עליהם בכוח $F$ כדי שלא ייפרדו. מהו $F$?

      רמזים: (1) בחנו פיסה קטנה של פני הכדור. מקרוב היא נראית כמו לוח אינסופי, שהשדה שלו $\sigma/(2\varepsilon_0)$ לשני צדדיו.
      השדה ממש מחוץ לפיסה וממש בתוכה הוא הסכום של השדה שלה ושל השדה של כל שאר המטען. הפיסה לא דוחפת את עצמה: הכוח עליה בא רק
      מהשדה של שאר המטען.

      (2) כשכוח ליחידת שטח $P$ פועל בניצב לכל נקודה של חצי כדור, החוצה, הכוח השקול עליו שווה ל-$P \cdot \pi R^2$: שטח העיגול
      שסוגר את חצי הכדור. (לחץ אחיד על משטח סגור, למשל חצי הכדור יחד עם העיגול, לא נותן כוח שקול, ולכן הכוח על חצי הכדור שווה
      לכוח על העיגול.)
    answer: >-
      $F \approx 4.5\cdot10^{-3}\,\text{N}$
    solution:
      - kind: given
        text: >-
          $R = 0.1\,\text{m}$, $Q = 2\cdot10^{-7}\,\text{C}$. המטען מתפזר באחידות על פני הכדור:
          $\sigma = \dfrac{Q}{4\pi R^2} = \dfrac{2\cdot10^{-7}}{4\pi \cdot 0.1^2} \approx 1.59\cdot10^{-6}\,\text{C/m}^2$.
      - kind: reasoning
        text: >-
          נסמן ב-$E_r$ את השדה של שאר המטען, ליד הפיסה. השדה של הפיסה עצמה $\sigma/(2\varepsilon_0)$: החוצה מחוץ לכדור, ופנימה בתוכו.
          $E_r$ לא משתנה כשעוברים דרך הפיסה, כי המטענים שיוצרים אותו רחוקים ממנה.
      - kind: formula
        text: >-
          בתוך המתכת השדה אפס: $E_r - \dfrac{\sigma}{2\varepsilon_0} = 0$. ממש בחוץ: $E_r + \dfrac{\sigma}{2\varepsilon_0} = \dfrac{\sigma}{\varepsilon_0}$.
      - kind: manipulation
        text: >-
          מהמשוואה הראשונה $E_r = \dfrac{\sigma}{2\varepsilon_0}$, והשנייה מתאימה לה. הכוח ליחידת שטח על הפיסה הוא המטען ליחידת שטח כפול
          השדה שפועל עליו: $P = \sigma E_r = \dfrac{\sigma^2}{2\varepsilon_0}$, החוצה.
      - kind: substitution
        text: >-
          $P = \dfrac{(1.59\cdot10^{-6})^2}{2 \cdot 8.85\cdot10^{-12}} \approx 0.143\,\text{N/m}^2$.
      - kind: substitution
        text: >-
          לפי רמז (2): $F = P \cdot \pi R^2 = 0.143 \cdot \pi \cdot 0.1^2 \approx 4.5\cdot10^{-3}\,\text{N}$.
      - kind: reasoning
        text: >-
          בדיקה בלי $\varepsilon_0$: מציבים $\sigma = Q/(4\pi R^2)$ ו-$1/\varepsilon_0 = 4\pi k$, ומקבלים $F = \dfrac{kQ^2}{8R^2} = \dfrac{9\cdot10^{9} \cdot (2\cdot10^{-7})^2}{8 \cdot 0.1^2} = 4.5\cdot10^{-3}\,\text{N}$.
      - kind: result
        text: >-
          $F \approx 4.5\cdot10^{-3}\,\text{N}$. הכוח פועל על כל מטען על פני הכדור רק מהשדה של שאר המטען, $\sigma/(2\varepsilon_0)$: חצי מהשדה שמודדים ממש בחוץ.
