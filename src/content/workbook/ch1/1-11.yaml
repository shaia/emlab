# Workbook, lesson 1.11 (chapter-1 review: from experiment to theory). Format and rules: see .claude/CLAUDE.md,
# "Worked examples, workbook". The review lesson may combine any chapter-1 topic.
# Every number was recomputed against src/physics (constants.ts, electrostatics.ts, motion.ts); the drop tables come
# from lab-data.ts (drops, unitMisfit, emptyMarks) and the torsion-balance table of W-08 from lab.ts (measure,
# fitThroughOrigin, fitLine). The values "read on the line" are the least-squares line at those x values.
# In a >- block, consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '1.11'
practice:
  - id: W-1.11-01
    level: basic
    qualitative: true
    objectives: [OBJ-1.11-1]
    prompt: >-
      לפניכם חמש טענות מהפרק וחמישה ניסויים. התאימו לכל טענה את הניסוי שתומך בה, וכתבו במשפט אחד מה מדדו או ראו בניסוי.

      טענות:

      (1) יש שני סוגים של מטען.

      (2) הכוח בין שני מטענים נקודתיים ביחס הפוך לריבוע המרחק ביניהם.

      (3) כל מטען הוא כפולה שלמה של המטען היסודי $e$.

      (4) בחלל שבתוך מוליך סגור אין שדה, גם כשהמוליך טעון ואינו מוארק.

      (5) המנה $F/q_0$ בנקודה מסוימת לא תלויה במטען הבוחן $q_0$.

      ניסויים:

      (א) כלוב פאראדיי.

      (ב) מניחים מטעני בוחן שונים באותה נקודה ומודדים את הכוח על כל אחד.

      (ג) מאזן פיתול.

      (ד) אלקטרוסקופ טעון שמקרבים אליו מוטות טעונים.

      (ה) ניסוי טיפות השמן של מיליקן.
    answer: >-
      (1) ד, (2) ג, (3) ה, (4) א, (5) ב.
    solution:
      - kind: reasoning
        text: >-
          (1) ד: מוט אחד פותח את העלים של אלקטרוסקופ טעון עוד יותר, ומוט אחר סוגר אותם. אותו מכשיר מגיב בשני אופנים הפוכים, ולכן יש שני סוגים של מטען.
      - kind: reasoning
        text: >-
          (2) ג: מדדו את הכוח בין שני כדורים טעונים במרחקים שונים, לפי זווית הסיבוב של המוט. הגרף של $F$ מול $1/r^2$ יצא קו ישר.
      - kind: reasoning
        text: >-
          (3) ה: מדדו את המטען של הרבה טיפות. כל המטענים יצאו כפולות שלמות של $1.6\cdot10^{-19}\,\text{C}$, ואף טיפה לא נמצאה בין הכפולות.
      - kind: reasoning
        text: >-
          (4) א: פאראדיי ישב בתוך כלוב מתכת טעון חזק, ומכשירי המדידה שלו לא הראו שום שדה.
      - kind: reasoning
        text: >-
          (5) ב: מטען בוחן כפול מקבל כוח כפול, ולכן המנה $F/q_0$ זהה. היא תכונה של הנקודה, וזה השדה $E$.
      - kind: result
        text: >-
          (1) ד, (2) ג, (3) ה, (4) א, (5) ב. כל טענה נשענת על מדידה: זווית של מוט, פתיחה של עלים, מטען של טיפות, היעדר שדה בתוך הכלוב.

  - id: W-1.11-02
    level: basic
    qualitative: false
    objectives: [OBJ-1.11-3]
    prompt: >-
      בניסוי מיליקן מדדו את המטען של שש טיפות. התוצאות, ביחידות של $10^{-19}\,\text{C}$:
      $$3.29,\quad 8.15,\quad 4.68,\quad 11.19,\quad 6.59,\quad 9.75$$

      (א) הניחו שהמטען היסודי קרוב ל-$1.6\cdot10^{-19}\,\text{C}$, ומצאו כמה מטענים יסודיים $n$ יש על כל טיפה.

      (ב) העריכו מהנתונים את $e$: חלקו את סכום המטענים בסכום המספרים $n$.

      (ג) המנות שקיבלתם בסעיף א אינן מספרים שלמים בדיוק. למה, ולמה מותר לעגל אותן?
    answer: >-
      (א) $n = 2,\ 5,\ 3,\ 7,\ 4,\ 6$.

      (ב) $e \approx 1.62\cdot10^{-19}\,\text{C}$.

      (ג) בגלל שגיאת המדידה של כמה אחוזים. הסטייה מהמספר השלם קטנה בהרבה מחצי יחידה, ולכן ברור לאיזה מספר שלם כל טיפה שייכת.
    solution:
      - kind: given
        text: >-
          שישה מטענים, ביחידות של $10^{-19}\,\text{C}$. הערכה ראשונה של היחידה: $1.6$.
      - kind: formula
        text: >-
          $q = n\,e$, ולכן $n = q/e$. אחרי שמוצאים את $n$ של כל טיפה, ההערכה של $e$ היא
          $$e \approx \frac{q_1 + q_2 + \dots + q_6}{n_1 + n_2 + \dots + n_6}$$
      - kind: substitution
        text: >-
          (א) מחלקים כל מטען ב-$1.6$:
          $$\frac{q}{1.6} = 2.06,\ 5.09,\ 2.92,\ 6.99,\ 4.12,\ 6.09$$
          ומעגלים למספר השלם הקרוב: $n = 2,\ 5,\ 3,\ 7,\ 4,\ 6$.
      - kind: substitution
        text: >-
          (ב) סכום המטענים: $3.29 + 8.15 + 4.68 + 11.19 + 6.59 + 9.75 = 43.65$. סכום המספרים: $2 + 5 + 3 + 7 + 4 + 6 = 27$.
          $$e \approx \frac{43.65\cdot10^{-19}}{27} = 1.62\cdot10^{-19}\ \text{C}$$
      - kind: reasoning
        text: >-
          (ג) כל מדידה סוטה בכמה אחוזים. הסטייה הגדולה ביותר כאן היא $0.12$ יחידה (בטיפה של $6.59$), רחוק מחצי יחידה. לכן אין ספק לאיזה מספר שלם כל טיפה שייכת, והעיגול רק מסיר את השגיאה.
      - kind: result
        text: >-
          (א) $n = 2,\ 5,\ 3,\ 7,\ 4,\ 6$.

          (ב) $e \approx 1.62\cdot10^{-19}\,\text{C}$, קרוב מאוד לערך $1.6\cdot10^{-19}\,\text{C}$.

          (ג) המנות אינן שלמות בגלל שגיאת המדידה, והן קרובות מספיק למספר שלם כדי לעגל.

  - id: W-1.11-03
    level: basic
    qualitative: false
    objectives: [OBJ-1.11-2]
    prompt: >-
      שני כדורים קטנים וזהים נושאים מטען שווה. מדדו את הכוח ביניהם במרחקים שונים, וציירו גרף של $F$ מול $1/r^2$.
      הקו המתאים ביותר עובר דרך הראשית ודרך הנקודה $(400\,\text{m}^{-2},\ 0.036\,\text{N})$.

      (א) מה השיפוע של הקו, ומה היחידות שלו?

      (ב) מה המטען של כל כדור?

      (ג) מה הכוח בין הכדורים במרחק $3\,\text{cm}$?

      (ד) באיזה מרחק הכוח הוא $0.010\,\text{N}$?
    answer: >-
      (א) $9.0\cdot10^{-5}\,\text{N}\cdot\text{m}^2$.

      (ב) $1.0\cdot10^{-7}\,\text{C}$.

      (ג) $0.10\,\text{N}$.

      (ד) $9.5\,\text{cm}$.
    solution:
      - kind: given
        text: >-
          שתי נקודות על הקו: $(0,\ 0)$ ו-$(400\,\text{m}^{-2},\ 0.036\,\text{N})$. המטענים שווים: $q_1 = q_2 = q$.
      - kind: formula
        text: >-
          $F = (kq^2)\cdot\dfrac{1}{r^2}$, ולכן השיפוע הוא $s = kq^2$, והכוח בכל מרחק הוא $F = s/r^2$.
      - kind: substitution
        text: >-
          (א) $$s = \frac{0.036\ \text{N} - 0}{400\ \text{m}^{-2} - 0} = 9.0\cdot10^{-5}\ \text{N}\cdot\text{m}^2$$
          היחידות: $\text{N}$ חלקי $\text{m}^{-2}$, כלומר $\text{N}\cdot\text{m}^2$.
      - kind: manipulation
        text: >-
          (ב) $s = kq^2$. מחלקים ב-$k$ כדי לבודד את $q^2$, ומוציאים שורש:
          $$q^2 = \frac{s}{k} = \frac{9.0\cdot10^{-5}}{9\cdot10^{9}} = 1.0\cdot10^{-14}\ \text{C}^2 \qquad q = 1.0\cdot10^{-7}\ \text{C}$$
      - kind: substitution
        text: >-
          (ג) $r = 0.03\,\text{m}$, $r^2 = 9\cdot10^{-4}\,\text{m}^2$:
          $$F = \frac{9.0\cdot10^{-5}}{9\cdot10^{-4}} = 0.10\ \text{N}$$
      - kind: manipulation
        text: >-
          (ד) מ-$F = s/r^2$ מכפילים ב-$r^2$ ומחלקים ב-$F$: $r^2 = s/F$.
          $$r^2 = \frac{9.0\cdot10^{-5}}{0.010} = 9.0\cdot10^{-3}\ \text{m}^2 \qquad r = 0.095\ \text{m}$$
      - kind: result
        text: >-
          (א) $s = 9.0\cdot10^{-5}\,\text{N}\cdot\text{m}^2$.

          (ב) $q = 1.0\cdot10^{-7}\,\text{C}$ על כל כדור.

          (ג) $F = 0.10\,\text{N}$.

          (ד) $r = 9.5\,\text{cm}$.

  - id: W-1.11-04
    level: mid
    qualitative: true
    objectives: [OBJ-1.11-2]
    prompt: >-
      תלמידים מדדו במאזן פיתול את הכוח $F$ בין שני כדורים טעונים, במרחקים שונים $r$.

      (א) תלמיד אחד צייר את $F$ מול $1/r$. האם הנקודות יהיו על קו ישר? אם לא, האם העקומה תהיה תלולה יותר ויותר, או מתונה יותר ויותר, ככל ש-$1/r$ גדל? נמקו בעזרת חוק קולון.

      (ב) תלמידה ציירה את $F$ מול $1/r^2$ וקיבלה קו ישר, אבל נקודת החיתוך שלו עם הציר האנכי היא $0.004\,\text{N}$ ולא אפס. מה זה אומר על המדידה? האם השיפוע עדיין שווה ל-$kq_1q_2$?

      (ג) תלמיד שלישי, באותן מדידות, חישב את $q_2$ מכל נקודה לחוד, לפי $q_2 = \dfrac{F r^2}{k q_1}$, במקום מהשיפוע. באילו נקודות החישוב שלו שגוי יותר: במרחקים הקטנים או הגדולים? נמקו.
    answer: >-
      (א) לא. העקומה תלולה יותר ויותר, כי $F$ ביחס ישר לריבוע של $1/r$.

      (ב) כל קריאה גבוהה ב-$0.004\,\text{N}$ (שגיאת אפס של המכשיר). השיפוע לא מושפע ועדיין שווה ל-$kq_1q_2$.

      (ג) במרחקים הגדולים, שבהם הכוח קטן ו-$0.004\,\text{N}$ הם חלק גדול ממנו.
    solution:
      - kind: formula
        text: >-
          חוק קולון: $F = kq_1q_2\cdot\dfrac{1}{r^2}$. נסמן $x = 1/r$. אז $F = kq_1q_2\,x^2$.
      - kind: reasoning
        text: >-
          (א) מול $x = 1/r$ הכוח הוא $F \propto x^2$, כמו המרחק $d = \tfrac12 g t^2$ מול הזמן. זה לא קו ישר אלא עקומה שעולה תלולה יותר ויותר: כשמכפילים את $x$, הכוח גדל פי 4.
      - kind: reasoning
        text: >-
          (ב) לפי החוק, כשהמרחק גדול מאוד ($1/r^2 \to 0$) הכוח צריך להתאפס. נקודת חיתוך של $0.004\,\text{N}$ אומרת שכל הקריאות הוזזו באותה כמות: המכשיר מראה $0.004\,\text{N}$ גם בלי כוח. זו שגיאה שיטתית, שגיאת אפס. הזזה קבועה מעלה את כל הנקודות באותה מידה, ולכן הקו זז למעלה בלי לשנות את שיפועו. השיפוע עדיין $kq_1q_2$, ומחשבים ממנו את המטען כרגיל.
      - kind: reasoning
        text: >-
          (ג) בכל נקודה הכוח שנמדד גדול ב-$0.004\,\text{N}$ מהכוח האמיתי. במרחקים קטנים הכוח גדול, ו-$0.004\,\text{N}$ הם חלק קטן ממנו. במרחקים גדולים הכוח קטן, ואותה תוספת היא חלק גדול ממנו, ולכן $q_2$ שמחושב משם גבוה מדי בהרבה. השיפוע, לעומת זאת, משתמש בהבדלים בין הנקודות, וההזזה הקבועה מתבטלת בהם.
      - kind: result
        text: >-
          (א) לא קו ישר: עקומה תלולה יותר ויותר.

          (ב) שגיאת אפס של $0.004\,\text{N}$ בכל הקריאות. השיפוע לא משתנה ועדיין שווה ל-$kq_1q_2$.

          (ג) במרחקים הגדולים. לכן מחשבים מטען מהשיפוע ולא מנקודה בודדת.

  - id: W-1.11-05
    level: mid
    qualitative: false
    objectives: [OBJ-1.11-4]
    prompt: >-
      קליפה כדורית מוליכה וחלולה, עם רדיוס פנימי $10\,\text{cm}$ ורדיוס חיצוני $12\,\text{cm}$, טעונה במטען כולל של $5\,\mu\text{C}$. במרכז החלל מניחים מטען נקודתי $q = -2\,\mu\text{C}$, בלי לגעת בקליפה. המערכת בשיווי משקל אלקטרוסטטי.

      (א) מה המטען על הדופן הפנימית של הקליפה, ומה המטען על הדופן החיצונית?

      (ב) מה השדה (גודל וכיוון) במרחק $5\,\text{cm}$ מהמרכז?

      (ג) מה השדה במרחק $11\,\text{cm}$ מהמרכז?

      (ד) מה השדה (גודל וכיוון) במרחק $30\,\text{cm}$ מהמרכז?
    answer: >-
      (א) על הדופן הפנימית $2\,\mu\text{C}$, על החיצונית $3\,\mu\text{C}$ (שניהם חיוביים).

      (ב) $7.2\cdot10^{6}\,\text{N/C}$, אל המרכז.

      (ג) אפס.

      (ד) $3.0\cdot10^{5}\,\text{N/C}$, הרחק מהמרכז.
    solution:
      - kind: given
        text: >-
          מטען הקליפה $Q = 5\cdot10^{-6}\,\text{C}$. במרכז $q = -2\cdot10^{-6}\,\text{C}$. רדיוסים: $0.10\,\text{m}$ ו-$0.12\,\text{m}$.
      - kind: reasoning
        text: >-
          (א) בתוך המתכת השדה אפס (שיווי משקל). משטח גאוס כדורי שעובר בתוך המתכת, למשל ברדיוס $11\,\text{cm}$, עובר כולו במקום שבו $E = 0$, ולכן השטף דרכו אפס, וגם המטען הכלוא בו אפס. המטען הכלוא הוא $q$ ועוד המטען על הדופן הפנימית, ולכן על הדופן הפנימית יש מטען חיובי של $2\,\mu\text{C}$. סך המטען על הקליפה $5\,\mu\text{C}$, ולכן על הדופן החיצונית $5 - 2 = 3\,\mu\text{C}$.
      - kind: formula
        text: >-
          לפי חוק גאוס, במקום שבו התפלגות המטענים סימטרית כדורית, $E = \dfrac{k\,|q_{\text{in}}|}{r^2}$, כאשר $q_{\text{in}}$ הוא המטען הכלוא בכדור ברדיוס $r$.
      - kind: substitution
        text: >-
          (ב) ב-$5\,\text{cm}$ המטען הכלוא הוא רק $q$:
          $$E = \frac{9\cdot10^{9}\cdot 2\cdot10^{-6}}{0.05^2} = 7.2\cdot10^{6}\ \text{N/C}$$
          המטען שלילי, ולכן השדה מצביע אל המרכז. המטען שעל הדופן הפנימית מפוזר באופן אחיד, ובתוך קליפה כזו השדה שלה אפס.
      - kind: reasoning
        text: >-
          (ג) $11\,\text{cm}$ הם בתוך המתכת, ושם $E = 0$.
      - kind: substitution
        text: >-
          (ד) ב-$30\,\text{cm}$ המטען הכלוא הוא $q_{\text{in}} = (-2 + 2 + 3)\,\mu\text{C} = 3\,\mu\text{C}$:
          $$E = \frac{9\cdot10^{9}\cdot 3\cdot10^{-6}}{0.30^2} = 3.0\cdot10^{5}\ \text{N/C}$$
          המטען הכלוא חיובי, ולכן השדה מצביע הרחק מהמרכז.
      - kind: result
        text: >-
          (א) מטען חיובי של $2\,\mu\text{C}$ על הדופן הפנימית, ומטען חיובי של $3\,\mu\text{C}$ על החיצונית.

          (ב) $7.2\cdot10^{6}\,\text{N/C}$, אל המרכז.

          (ג) $E = 0$.

          (ד) $3.0\cdot10^{5}\,\text{N/C}$, הרחק מהמרכז.

  - id: W-1.11-06
    level: mid
    qualitative: true
    objectives: [OBJ-1.11-3]
    prompt: >-
      קבוצת תלמידים מדדה את המטען של חמש טיפות בלבד. התוצאות, ביחידות של $10^{-19}\,\text{C}$:
      $$3.26,\quad 6.50,\quad 9.54,\quad 12.92,\quad 6.51$$

      (א) מצאו את היחידה הגדולה ביותר שמתאימה לנתונים.

      (ב) הקבוצה מסיקה: המטען היסודי הוא $3.2\cdot10^{-19}\,\text{C}$. האם המסקנה נובעת מהנתונים האלה? מה חסר כדי לסמוך עליה?

      (ג) איזו מדידה אחת הייתה מכריעה שהיחידה היא $1.6\cdot10^{-19}\,\text{C}$ ולא $3.2\cdot10^{-19}\,\text{C}$?

      (ד) כל הנתונים שמתאימים ל-$1.6\cdot10^{-19}\,\text{C}$ מתאימים גם ל-$0.8\cdot10^{-19}\,\text{C}$. למה בכל זאת בוחרים ב-$1.6\cdot10^{-19}\,\text{C}$?
    answer: >-
      (א) $3.2\cdot10^{-19}\,\text{C}$.

      (ב) הנתונים תומכים בה, אבל חמש טיפות הן מעט מדי: אולי פשוט כולן נשאו מספר זוגי של מטענים יסודיים. צריך הרבה יותר טיפות.

      (ג) טיפה עם מטען של כ-$1.6$ או כ-$4.8\cdot10^{-19}\,\text{C}$ (כפולה אי-זוגית של $1.6$).

      (ד) כי בוחרים את היחידה הגדולה ביותר שמתאימה. במאות טיפות אף אחת לא נמצאה על כפולה אי-זוגית של $0.8\cdot10^{-19}\,\text{C}$.
    solution:
      - kind: substitution
        text: >-
          (א) מחלקים כל מטען ביחידות אפשריות:
          $$u = 3.2:\qquad \frac{q}{u} = 1.02,\ 2.03,\ 2.98,\ 4.04,\ 2.03$$
          $$u = 1.6:\qquad \frac{q}{u} = 2.04,\ 4.06,\ 5.96,\ 8.07,\ 4.07$$
          ב-$3.2$ כל המנות קרובות למספרים שלמים 1, 2, 3, 4, ואין אף כפולה ריקה. ב-$1.6$ המנות שלמות אבל כולן זוגיות, וכל הכפולות האי-זוגיות ריקות. היחידה הגדולה ביותר שמתאימה היא $3.2$. יחידה גדולה יותר לא מתאימה, כי הטיפה הראשונה כבר נושאת יחידה אחת בלבד.
      - kind: reasoning
        text: >-
          (ב) לפי הכלל, הנתונים האלה מצביעים על $3.2\cdot10^{-19}\,\text{C}$. אבל חמש טיפות הן מדגם קטן. אם המטען היסודי הוא $1.6\cdot10^{-19}\,\text{C}$, ייתכן שבמקרה כל חמש הטיפות נשאו מספר זוגי של מטענים יסודיים. המסקנה אמינה רק אחרי הרבה טיפות, בלי אף אחת שחורגת.
      - kind: reasoning
        text: >-
          (ג) מספיקה טיפה אחת שיושבת על כפולה אי-זוגית של $1.6\cdot10^{-19}\,\text{C}$, למשל $4.8\cdot10^{-19}\,\text{C}$. ביחידות של $3.2$ היא יוצאת $1.5$, כלומר חצי יחידה, וזה שולל את $3.2$.
      - kind: reasoning
        text: >-
          (ד) יחידה קטנה יותר תמיד "מתאימה": כל כפולה של $1.6$ היא גם כפולה של $0.8$. לכן ההתאמה שלה לא אומרת כלום. מה שאומר משהו הוא הכפולות הריקות: במאות הטיפות של מיליקן אף טיפה לא נמצאה על כפולה אי-זוגית של $0.8\cdot10^{-19}\,\text{C}$. לכן בוחרים את היחידה הגדולה ביותר שמתאימה לכל הנתונים.
      - kind: result
        text: >-
          (א) $3.2\cdot10^{-19}\,\text{C}$.

          (ב) המסקנה מתאימה לנתונים, אבל חמש טיפות הן מעט מדי כדי לסמוך עליה.

          (ג) טיפה על כפולה אי-זוגית של $1.6\cdot10^{-19}\,\text{C}$, למשל $4.8\cdot10^{-19}\,\text{C}$.

          (ד) בוחרים את היחידה הגדולה ביותר שמתאימה לכל הנתונים, ובמאות טיפות $1.6\cdot10^{-19}\,\text{C}$ היא כזו.

  - id: W-1.11-07
    level: mid
    qualitative: false
    objectives: [OBJ-1.11-4]
    prompt: >-
      שני לוחות מקבילים גדולים טעונים במטענים מנוגדים, בצפיפות מטען משטחית שגודלה $\sigma = 1.77\cdot10^{-6}\,\text{C/m}^2$.
      ($\varepsilon_0 = 8.85\cdot10^{-12}\,\text{C}^2/(\text{N}\cdot\text{m}^2)$, $e = 1.6\cdot10^{-19}\,\text{C}$, $m_p = 1.67\cdot10^{-27}\,\text{kg}$)

      (א) מה השדה בין הלוחות?

      (ב) פרוטון נמצא בין הלוחות. חשבו את הכוח החשמלי עליו ואת משקלו. כמה פעמים הכוח החשמלי גדול מהמשקל? מה התאוצה של הפרוטון?

      (ג) במקום הפרוטון מניחים בין הלוחות טיפת שמן שמסתה $1\cdot10^{-15}\,\text{kg}$, ועליה 3 אלקטרונים עודפים. כמה פעמים הכוח החשמלי עליה גדול ממשקלה? האם מותר להזניח כאן את הכבידה?
    answer: >-
      (א) $2.0\cdot10^{5}\,\text{N/C}$.

      (ב) $3.2\cdot10^{-14}\,\text{N}$ לעומת $1.67\cdot10^{-26}\,\text{N}$: פי $1.9\cdot10^{12}$. התאוצה $1.9\cdot10^{13}\,\text{m/s}^2$.

      (ג) פי $9.6$ בלבד. אסור להזניח את הכבידה.
    solution:
      - kind: given
        text: >-
          $\sigma = 1.77\cdot10^{-6}\,\text{C/m}^2$. פרוטון: $e$ ו-$m_p$. טיפה: $m = 1\cdot10^{-15}\,\text{kg}$, מטען $3e$. $g = 10\,\text{m/s}^2$.
      - kind: formula
        text: >-
          בין שני לוחות עם מטענים מנוגדים $E = \dfrac{\sigma}{\varepsilon_0}$ (חוק גאוס וסופרפוזיציה). הכוח החשמלי $F = qE$, המשקל $mg$.
      - kind: substitution
        text: >-
          (א) $$E = \frac{1.77\cdot10^{-6}}{8.85\cdot10^{-12}} = 2.0\cdot10^{5}\ \text{N/C}$$
      - kind: substitution
        text: >-
          (ב) $$F = 1.6\cdot10^{-19}\cdot 2.0\cdot10^{5} = 3.2\cdot10^{-14}\ \text{N} \qquad mg = 1.67\cdot10^{-27}\cdot 10 = 1.67\cdot10^{-26}\ \text{N}$$
          $$\frac{F}{mg} = \frac{3.2\cdot10^{-14}}{1.67\cdot10^{-26}} = 1.9\cdot10^{12} \qquad a = \frac{F}{m_p} = \frac{3.2\cdot10^{-14}}{1.67\cdot10^{-27}} = 1.9\cdot10^{13}\ \text{m/s}^2$$
      - kind: substitution
        text: >-
          (ג) $$F = 3\cdot1.6\cdot10^{-19}\cdot 2.0\cdot10^{5} = 9.6\cdot10^{-14}\ \text{N} \qquad mg = 1\cdot10^{-15}\cdot10 = 1\cdot10^{-14}\ \text{N}$$
          $$\frac{F}{mg} = 9.6$$
      - kind: reasoning
        text: >-
          לפרוטון הכבידה זניחה לגמרי: היא קטנה פי טריליון ויותר מהכוח החשמלי. לטיפת השמן המשקל הוא כעשירית מהכוח החשמלי, ולכן אסור להזניח אותו. בדיוק בגלל זה בניסוי מיליקן הכוח החשמלי והמשקל מאזנים זה את זה: הם מאותו סדר גודל.
      - kind: result
        text: >-
          (א) $E = 2.0\cdot10^{5}\,\text{N/C}$.

          (ב) הכוח החשמלי $3.2\cdot10^{-14}\,\text{N}$ גדול פי $1.9\cdot10^{12}$ מהמשקל, והתאוצה $1.9\cdot10^{13}\,\text{m/s}^2$.

          (ג) הכוח החשמלי גדול רק פי $9.6$ מהמשקל, ולכן לטיפה אסור להזניח את הכבידה.

  - id: W-1.11-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.11-1, OBJ-1.11-2]
    prompt: >-
      קולון בדק את התלות של הכוח במטען בלי לדעת למדוד מטען. בניסוי שמחקה את השיטה שלו, כדור A נושא מטען $q_A$ לא ידוע, וכדור B, שזהה לכדור שלישי C, נושא בהתחלה $q_B = 8\cdot10^{-8}\,\text{C}$.
      המרחק בין מרכזי A ו-B נשאר $r = 10\,\text{cm}$. אחרי כל מדידה נוגעים ב-B בכדור C, שפורק קודם, ומרחיקים את C. הכוחות שנמדדו בין A ל-B:
      $$q_B\ (10^{-8}\,\text{C}):\ 8,\ 4,\ 2,\ 1 \qquad F\ (\text{N}):\ 3.58\cdot10^{-3},\ 1.79\cdot10^{-3},\ 9.13\cdot10^{-4},\ 4.59\cdot10^{-4}$$

      (א) למה כל נגיעה ב-C מקטינה את המטען של B בדיוק פי 2? מה היה משתבש אילו C היה גדול מ-B?

      (ב) איזה גרף מתאים לבדיקה שהכוח ביחס ישר ל-$q_B$? מה צפוי להיות השיפוע שלו, לפי חוק קולון?

      (ג) מצאו את השיפוע וחשבו ממנו את $q_A$.

      (ד) הראו שהשיפוע שווה לגודל השדה שיוצר כדור A במקום של כדור B.
    answer: >-
      (א) הכדורים זהים, ולכן המטען מתחלק ביניהם שווה בשווה. אילו C היה גדול יותר, הוא היה לוקח יותר מחצי, והמטענים בטבלה היו שגויים.

      (ב) $F$ מול $q_B$: קו ישר דרך הראשית עם שיפוע $kq_A/r^2$.

      (ג) השיפוע כ-$4.5\cdot10^{4}\,\text{N/C}$, ו-$q_A = 5.0\cdot10^{-8}\,\text{C}$.

      (ד) $F = q_B\cdot\dfrac{kq_A}{r^2} = q_B E_A$, ולכן השיפוע הוא $E_A$.
    solution:
      - kind: reasoning
        text: >-
          (א) כשכדור B הטעון נוגע בכדור C הזהה והלא טעון, המטען עובר ביניהם עד שהמצב סימטרי. שום דבר לא מבדיל בין שני כדורים זהים, ולכן כל אחד מקבל חצי. אילו C היה גדול יותר, הוא היה לוקח יותר מחצי, ו-$q_B$ לא היה ידוע. השיטה נשענת על כך שהכדורים זהים.
      - kind: formula
        text: >-
          (ב) חוק קולון במרחק קבוע: $F = \left(\dfrac{kq_A}{r^2}\right)\cdot q_B$. המרחק והמטען $q_A$ קבועים, ולכן גרף של $F$ מול $q_B$ צריך להיות קו ישר דרך הראשית, עם שיפוע $s = kq_A/r^2$.
      - kind: substitution
        text: >-
          (ג) מציירים את ארבע הנקודות ואת הקו המתאים ביותר. הקו עובר כמעט בדיוק דרך נקודות הקצה, $(1\cdot10^{-8},\ 4.6\cdot10^{-4})$ ו-$(8\cdot10^{-8},\ 3.58\cdot10^{-3})$, ולכן אפשר לקרוא אותן כנקודות על הקו:
          $$s = \frac{3.58\cdot10^{-3} - 4.6\cdot10^{-4}}{8\cdot10^{-8} - 1\cdot10^{-8}} = \frac{3.12\cdot10^{-3}}{7\cdot10^{-8}} = 4.5\cdot10^{4}\ \text{N/C}$$
      - kind: manipulation
        text: >-
          $s = kq_A/r^2$. מכפילים ב-$r^2$ ומחלקים ב-$k$:
          $$q_A = \frac{s\,r^2}{k} = \frac{4.5\cdot10^{4}\cdot 0.10^2}{9\cdot10^{9}} = 5.0\cdot10^{-8}\ \text{C}$$
      - kind: reasoning
        text: >-
          (ד) השדה של כדור A, שמתנהג כמו מטען נקודתי, במרחק $r$ הוא $E_A = kq_A/r^2$. לכן $F = q_B\,E_A$: כדור B הוא מטען הבוחן, והשיפוע $F/q_B$ הוא בדיוק השדה $E_A$. גם היחידות מתאימות: $\text{N}$ חלקי $\text{C}$.
      - kind: result
        text: >-
          (א) הכדורים זהים, ולכן המטען מתחלק שווה בשווה. כדור C גדול יותר היה הורס את השיטה.

          (ב) $F$ מול $q_B$, קו ישר דרך הראשית עם שיפוע $kq_A/r^2$.

          (ג) $s = 4.5\cdot10^{4}\,\text{N/C}$, ו-$q_A = 5.0\cdot10^{-8}\,\text{C}$.

          (ד) השיפוע הוא השדה של A במקום של B, $E_A = 4.5\cdot10^{4}\,\text{N/C}$.

  - id: W-1.11-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.11-3, OBJ-1.11-4]
    prompt: >-
      בניסוי מיליקן טיפת שמן שמסתה $m = 1.28\cdot10^{-14}\,\text{kg}$ מרחפת בין שני לוחות מקבילים גדולים ואופקיים. ללוחות מטענים מנוגדים, בצפיפות מטען משטחית שגודלה $\sigma = 1.77\cdot10^{-6}\,\text{C/m}^2$. על הטיפה יש אלקטרונים עודפים.
      ($\varepsilon_0 = 8.85\cdot10^{-12}\,\text{C}^2/(\text{N}\cdot\text{m}^2)$, $e = 1.6\cdot10^{-19}\,\text{C}$)

      (א) מה השדה בין הלוחות? איזה לוח חיובי, העליון או התחתון? נמקו.

      (ב) מה המטען של הטיפה, וכמה אלקטרונים עודפים יש עליה?

      (ג) הטיפה קולטת עוד אלקטרון אחד. מה הכוח השקול עליה מיד אחר כך, ומה התאוצה שלה (גודל וכיוון)?

      (ד) לאיזו צפיפות מטען צריך לשנות את הלוחות כדי שהטיפה תרחף שוב?
    answer: >-
      (א) $2.0\cdot10^{5}\,\text{N/C}$. הלוח העליון חיובי.

      (ב) $6.4\cdot10^{-19}\,\text{C}$ בגודל, כלומר 4 אלקטרונים עודפים.

      (ג) $3.2\cdot10^{-14}\,\text{N}$ למעלה, ותאוצה $2.5\,\text{m/s}^2$ למעלה.

      (ד) $1.42\cdot10^{-6}\,\text{C/m}^2$.
    solution:
      - kind: given
        text: >-
          $m = 1.28\cdot10^{-14}\,\text{kg}$, $\sigma = 1.77\cdot10^{-6}\,\text{C/m}^2$, $g = 10\,\text{m/s}^2$. הטיפה שלילית.
      - kind: formula
        text: >-
          בין הלוחות $E = \dfrac{\sigma}{\varepsilon_0}$. כשהטיפה מרחפת, הכוח החשמלי מאזן את המשקל: $|q|E = mg$. לכן $|q| = \dfrac{mg}{E}$ ו-$n = \dfrac{|q|}{e}$.
      - kind: substitution
        text: >-
          (א) $$E = \frac{1.77\cdot10^{-6}}{8.85\cdot10^{-12}} = 2.0\cdot10^{5}\ \text{N/C}$$
      - kind: reasoning
        text: >-
          הכוח החשמלי צריך להצביע למעלה, נגד המשקל. הטיפה שלילית, ולכן הכוח עליה הפוך לשדה: השדה מצביע למטה. השדה מצביע מהלוח החיובי אל השלילי, ולכן הלוח העליון חיובי.
      - kind: substitution
        text: >-
          (ב) $$|q| = \frac{1.28\cdot10^{-14}\cdot 10}{2.0\cdot10^{5}} = 6.4\cdot10^{-19}\ \text{C} \qquad n = \frac{6.4\cdot10^{-19}}{1.6\cdot10^{-19}} = 4$$
      - kind: substitution
        text: >-
          (ג) עכשיו $|q| = 5\cdot1.6\cdot10^{-19} = 8.0\cdot10^{-19}\,\text{C}$. הכוח החשמלי $8.0\cdot10^{-19}\cdot2.0\cdot10^{5} = 1.6\cdot10^{-13}\,\text{N}$ למעלה, והמשקל $1.28\cdot10^{-13}\,\text{N}$ למטה.
          $$F_{\text{net}} = 1.6\cdot10^{-13} - 1.28\cdot10^{-13} = 3.2\cdot10^{-14}\ \text{N} \qquad a = \frac{3.2\cdot10^{-14}}{1.28\cdot10^{-14}} = 2.5\ \text{m/s}^2$$
      - kind: manipulation
        text: >-
          (ד) כדי לרחף שוב צריך $E' = \dfrac{mg}{|q|}$, ומ-$E' = \sigma'/\varepsilon_0$ מכפילים ב-$\varepsilon_0$:
          $$E' = \frac{1.28\cdot10^{-13}}{8.0\cdot10^{-19}} = 1.6\cdot10^{5}\ \text{N/C} \qquad \sigma' = \varepsilon_0 E' = 8.85\cdot10^{-12}\cdot1.6\cdot10^{5} = 1.42\cdot10^{-6}\ \text{C/m}^2$$
      - kind: result
        text: >-
          (א) $E = 2.0\cdot10^{5}\,\text{N/C}$, למטה. הלוח העליון חיובי.

          (ב) $q = -6.4\cdot10^{-19}\,\text{C}$: 4 אלקטרונים עודפים.

          (ג) כוח שקול $3.2\cdot10^{-14}\,\text{N}$ ותאוצה $2.5\,\text{m/s}^2$, שניהם למעלה.

          (ד) $\sigma' = 1.42\cdot10^{-6}\,\text{C/m}^2$, קטנה פי $4/5$ מהקודמת, כי המטען גדל פי $5/4$.

  - id: W-1.11-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.11-4]
    prompt: >-
      כדור קטן שמסתו $2\,\text{g}$ תלוי על חוט קל, ליד לוח אנכי גדול מאוד שטעון במטען חיובי בצפיפות מטען משטחית $\sigma = 8.85\cdot10^{-7}\,\text{C/m}^2$. בשיווי משקל החוט נוטה בזווית $26.6^\circ$ מהאנך, והכדור מורחק מהלוח.
      ($\varepsilon_0 = 8.85\cdot10^{-12}\,\text{C}^2/(\text{N}\cdot\text{m}^2)$)

      (א) מה השדה שיוצר הלוח במקום של הכדור, ולאן הוא מצביע?

      (ב) מה הסימן של מטען הכדור, ומה גודלו?

      (ג) מציבים לוח אנכי גדול שני, מקביל לראשון, בצד השני של הכדור, טעון במטען שלילי באותו גודל של צפיפות מטען. הכדור עכשיו בין שני הלוחות. מה הזווית החדשה של החוט? האם היא כפולה מהקודמת?
    answer: >-
      (א) $5.0\cdot10^{4}\,\text{N/C}$, בניצב ללוח והרחק ממנו.

      (ב) חיובי, $2.0\cdot10^{-7}\,\text{C}$.

      (ג) $45^\circ$. לא כפולה: מה שמוכפל הוא הטנגנס של הזווית, לא הזווית.
    solution:
      - kind: given
        text: >-
          $m = 2\cdot10^{-3}\,\text{kg}$, $\sigma = 8.85\cdot10^{-7}\,\text{C/m}^2$, $\theta = 26.6^\circ$, $g = 10\,\text{m/s}^2$.
      - kind: formula
        text: >-
          לוח אינסופי אחד: $E = \dfrac{\sigma}{2\varepsilon_0}$. על הכדור פועלים שלושה כוחות: המשקל $mg$ למטה, הכוח החשמלי $qE$ אופקי, ומתיחות החוט. בשיווי משקל, הרכיב האנכי של המתיחות מאזן את המשקל והרכיב האופקי מאזן את הכוח החשמלי:
          $$T\cos\theta = mg,\qquad T\sin\theta = qE \quad\Rightarrow\quad \tan\theta = \frac{qE}{mg}$$
      - kind: substitution
        text: >-
          (א) $$E = \frac{8.85\cdot10^{-7}}{2\cdot 8.85\cdot10^{-12}} = 5.0\cdot10^{4}\ \text{N/C}$$
          הלוח חיובי, ולכן השדה מצביע הרחק ממנו, בניצב ללוח.
      - kind: manipulation
        text: >-
          (ב) הכדור נדחה מהלוח החיובי, ולכן הכוח עליו בכיוון השדה, והמטען שלו חיובי. מ-$\tan\theta = \dfrac{qE}{mg}$ מכפילים ב-$mg$ ומחלקים ב-$E$:
          $$q = \frac{mg\tan\theta}{E} = \frac{2\cdot10^{-3}\cdot 10\cdot\tan 26.6^\circ}{5.0\cdot10^{4}} = \frac{0.02\cdot 0.50}{5.0\cdot10^{4}} = 2.0\cdot10^{-7}\ \text{C}$$
      - kind: reasoning
        text: >-
          (ג) בין שני לוחות עם מטענים מנוגדים השדות של שני הלוחות באותו כיוון (מהחיובי אל השלילי) ומתחברים: $E' = \sigma/\varepsilon_0 = 1.0\cdot10^{5}\,\text{N/C}$, פי 2. הכוח החשמלי כפול, והמשקל לא השתנה.
      - kind: substitution
        text: >-
          $$\tan\theta' = \frac{qE'}{mg} = \frac{2.0\cdot10^{-7}\cdot 1.0\cdot10^{5}}{0.02} = 1.0 \qquad \theta' = 45^\circ$$
          הטנגנס הוכפל, מ-$0.50$ ל-$1.0$, אבל הזווית לא הוכפלה: $2\cdot26.6^\circ = 53.2^\circ$, לא $45^\circ$.
      - kind: result
        text: >-
          (א) $E = 5.0\cdot10^{4}\,\text{N/C}$, בניצב ללוח והרחק ממנו.

          (ב) מטען חיובי של $2.0\cdot10^{-7}\,\text{C}$.

          (ג) $\theta' = 45^\circ$. הכוח החשמלי הוכפל, ולכן הוכפל $\tan\theta$, לא הזווית.
challenge:
  - id: W-1.11-c1
    stars: 1
    objectives: [OBJ-1.11-3, OBJ-1.11-4]
    prompt: >-
      טיפת שמן כדורית, ברדיוס $2\,\text{mm}$ ובצפיפות $3\,\text{g/cm}^3$, מרחפת בשדה חשמלי אחיד ואנכי שגודלו $3.55\cdot10^{5}\,\text{N/C}$. על הטיפה יש אלקטרונים עודפים.
      (נפח של כדור ברדיוס $r$ הוא $\tfrac43\pi r^3$, ו-$1\,\text{g/cm}^3 = 1000\,\text{kg/m}^3$.)

      (א) מה מסת הטיפה?

      (ב) מה גודל המטען של הטיפה, וכמה אלקטרונים עודפים יש עליה? לאן מצביע השדה?

      (ג) הטיפה קולטת עוד אלקטרון אחד. בכמה, באחוזים, צריך לשנות את השדה כדי שתרחף שוב?

      (ד) מיליקן השתמש בטיפות ברדיוס של כמיקרומטר אחד ($1\,\mu\text{m} = 10^{-6}\,\text{m}$). טיפה כזו, מאותו שמן, נושאת 2 אלקטרונים עודפים. מצאו את השדה שבו היא מרחפת, ואת השדה שבו היא מרחפת אחרי שקלטה עוד אלקטרון. הסבירו בעזרת סעיפים ג ו-ד למה מיליקן בחר טיפות זעירות.
    answer: >-
      (א) $1.0\cdot10^{-4}\,\text{kg}$.

      (ב) $2.8\cdot10^{-9}\,\text{C}$, כ-$1.8\cdot10^{10}$ אלקטרונים. השדה מצביע למטה.

      (ג) בכ-$6\cdot10^{-9}$ אחוז: שינוי שאי אפשר למדוד.

      (ד) $3.9\cdot10^{5}\,\text{N/C}$, ואחר כך $2.6\cdot10^{5}\,\text{N/C}$: שינוי של שליש, שקל לראות. רק בטיפה שנושאת מעט אלקטרונים רואים את הקפיצות של מטען יסודי אחד.
    solution:
      - kind: given
        text: >-
          $r = 2\cdot10^{-3}\,\text{m}$, צפיפות $\rho = 3\,\text{g/cm}^3 = 3000\,\text{kg/m}^3$ (האות $\rho$, רו, מסמנת צפיפות), $E = 3.55\cdot10^{5}\,\text{N/C}$, $g = 10\,\text{m/s}^2$.
      - kind: substitution
        text: >-
          (א) המסה היא הצפיפות כפול הנפח:
          $$m = \rho\cdot\frac{4}{3}\pi r^3 = 3000\cdot\frac{4}{3}\pi\left(2\cdot10^{-3}\right)^3 = 1.0\cdot10^{-4}\ \text{kg}$$
      - kind: formula
        text: >-
          (ב) הטיפה מרחפת, ולכן הכוח החשמלי מאזן את המשקל: $|q|E = mg$, כלומר $|q| = \dfrac{mg}{E}$, ו-$n = \dfrac{|q|}{e}$.
      - kind: substitution
        text: >-
          $$|q| = \frac{1.0\cdot10^{-4}\cdot 10}{3.55\cdot10^{5}} = 2.8\cdot10^{-9}\ \text{C} \qquad n = \frac{2.83\cdot10^{-9}}{1.6\cdot10^{-19}} = 1.8\cdot10^{10}$$
          הכוח החשמלי מצביע למעלה. הטיפה שלילית, והכוח עליה הפוך לשדה, ולכן השדה מצביע למטה.
      - kind: reasoning
        text: >-
          (ג) השדה שבו הטיפה מרחפת הוא $E = mg/|q|$, ביחס הפוך למטען. אלקטרון אחד נוסף מגדיל את המטען בחלק $1/n$ ממנו:
          $$\frac{1}{n} = \frac{1}{1.77\cdot10^{10}} = 5.6\cdot10^{-11}$$
          כלומר צריך להקטין את השדה בכ-$5.6\cdot10^{-9}$ אחוז. אין מכשיר שמבחין בשינוי כזה, ולכן בטיפה כזו המטען נראה רציף.
      - kind: substitution
        text: >-
          (ד) $$m' = 3000\cdot\frac{4}{3}\pi\left(10^{-6}\right)^3 = 1.26\cdot10^{-14}\ \text{kg}$$
          $$E_2 = \frac{m'g}{2e} = \frac{1.26\cdot10^{-13}}{3.2\cdot10^{-19}} = 3.9\cdot10^{5}\ \text{N/C} \qquad E_3 = \frac{m'g}{3e} = \frac{1.26\cdot10^{-13}}{4.8\cdot10^{-19}} = 2.6\cdot10^{5}\ \text{N/C}$$
      - kind: reasoning
        text: >-
          בטיפה הזעירה אלקטרון אחד משנה את השדה הדרוש בשליש, והקפיצה הזו בולטת מאוד. מיליקן רצה לראות שהמטען משתנה בקפיצות של $e$, ולכן היה צריך טיפות שנושאות מעט מטענים יסודיים, כלומר טיפות קטנות מאוד.
      - kind: result
        text: >-
          (א) $m = 1.0\cdot10^{-4}\,\text{kg}$.

          (ב) $|q| = 2.8\cdot10^{-9}\,\text{C}$, כ-$1.8\cdot10^{10}$ אלקטרונים עודפים, והשדה מצביע למטה.

          (ג) שינוי של כ-$6\cdot10^{-9}$ אחוז בלבד, שאי אפשר למדוד.

          (ד) $3.9\cdot10^{5}\,\text{N/C}$ ואחר כך $2.6\cdot10^{5}\,\text{N/C}$. רק בטיפות זעירות אלקטרון אחד משנה את התוצאה באופן שרואים.
    source:
      name: JEE Main
      year: 2021
      problem: '18 March 2021, Shift 1: the Millikan oil-drop question (no question number shown on the page)'
      url: https://competishun.com/an-oil-drop-of-radius-2-mm-with-a-density-3-mathrmg-mathrmcm-3-his-held-stationary-under-a-constant-electric-field-3-55-times-105-mathrmvm-1-in-the-millikans-oil-drop-experiment-what-is-the-number-of/
      verified: '2026-11-02'
      adapted: true

  - id: W-1.11-c2
    stars: 2
    objectives: [OBJ-1.11-4]
    prompt: >-
      על משטח אופקי חלק יש רצועה שבה פועל שדה חשמלי אחיד ואופקי: באזור $0 < x < L$ השדה הוא $E$ בכיוון החיובי של ציר x, ומחוץ לרצועה אין שדה.
      שני כדורים קטנים, כל אחד במסה $m$ ובמטען חיובי $q$, מחוברים בחוט קל שאינו נמתח, באורך $L$, בדיוק כרוחב הרצועה.
      בהתחלה החוט מתוח ומקביל לציר x: כדור A נמצא בשפת הרצועה, ב-$x = 0$, וכדור B מאחוריו, ב-$x = -L$. שני הכדורים כמעט במנוחה, עם מהירות זניחה בכיוון החיובי של ציר x.
      נתונים: $m = 1\cdot10^{-4}\,\text{kg}$, $q = 1\cdot10^{-8}\,\text{C}$, $E = 5\cdot10^{4}\,\text{N/C}$, $L = 0.5\,\text{m}$. הזניחו חיכוך.

      (א) הראו שכשהכדורים במרחק $L$ זה מזה, הכוח החשמלי ביניהם קטן מאוד לעומת הכוח של השדה על כל אחד מהם. מעכשיו הזניחו אותו.

      (ב) תארו את תנועת שני הכדורים בשלבים: מה התאוצה של כל אחד בכל שלב, ומתי מסתיים כל שלב?

      (ג) האם הכדורים יתנגשו? אם כן, כמה זמן אחרי ההתחלה?
    answer: >-
      (א) $3.6\cdot10^{-6}\,\text{N}$ לעומת $5\cdot10^{-4}\,\text{N}$: פחות מאחוז.

      (ב) שלב 1: שניהם יחד ב-$2.5\,\text{m/s}^2$ עד שכדור A יוצא מהרצועה. שלב 2: A במהירות קבועה, B ב-$5\,\text{m/s}^2$ והחוט רפוי, עד ש-B יוצא מהרצועה. שלב 3: שניהם במהירות קבועה, B מהיר יותר.

      (ג) כן, אחרי $1.18\,\text{s}$, כלומר $(2+\sqrt3)\sqrt{mL/(qE)}$.
    solution:
      - kind: given
        text: >-
          $qE = 1\cdot10^{-8}\cdot5\cdot10^{4} = 5\cdot10^{-4}\,\text{N}$. נסמן $u = \sqrt{\dfrac{mL}{qE}} = \sqrt{\dfrac{10^{-4}\cdot0.5}{5\cdot10^{-4}}} = 0.316\,\text{s}$.
      - kind: substitution
        text: >-
          (א) חוק קולון במרחק $L$:
          $$F_{AB} = \frac{kq^2}{L^2} = \frac{9\cdot10^{9}\cdot\left(10^{-8}\right)^2}{0.5^2} = 3.6\cdot10^{-6}\ \text{N}$$
          זה $0.7\%$ מהכוח $qE = 5\cdot10^{-4}\,\text{N}$.
      - kind: reasoning
        text: >-
          (ב) שלב 1: רק כדור A בשדה. השדה מושך אותו קדימה, והוא גורר את B בחוט המתוח. שני הכדורים נעים יחד, כגוף אחד במסה $2m$ שעליו כוח $qE$:
          $$a_1 = \frac{qE}{2m} = \frac{5\cdot10^{-4}}{2\cdot10^{-4}} = 2.5\ \text{m/s}^2$$
          השלב נגמר כש-A מגיע ל-$x = L$. באותו רגע B מגיע ל-$x = 0$ ונכנס לרצועה.
      - kind: substitution
        text: >-
          משך השלב והמהירות בסופו, מ-$L = \tfrac12 a_1 t_1^2$:
          $$t_1 = \sqrt{\frac{2L}{a_1}} = \sqrt{\frac{2\cdot0.5}{2.5}} = 0.632\ \text{s} \qquad v_1 = a_1 t_1 = 1.58\ \text{m/s}$$
      - kind: reasoning
        text: >-
          שלב 2: A יצא מהרצועה, ואין עליו כוח, ולכן הוא ממשיך במהירות קבועה $v_1$. B בתוך הרצועה, והשדה מאיץ אותו לבד: $a_2 = qE/m = 5\,\text{m/s}^2$. B מהיר מ-A, ולכן החוט רפוי. השלב נגמר כש-B עובר את כל רוחב הרצועה, $L$:
          $$v_2^2 = v_1^2 + 2a_2L = 2.5 + 5 = 7.5\ \text{m}^2/\text{s}^2 \qquad v_2 = 2.74\ \text{m/s}$$
          $$t_2 = \frac{v_2 - v_1}{a_2} = \frac{2.74 - 1.58}{5} = 0.231\ \text{s}$$
      - kind: substitution
        text: >-
          בתחילת שלב 2, A נמצא ב-$x = L$ ו-B ב-$x = 0$. בזמן $t_2$ כדור A עבר $v_1 t_2$, וכדור B עבר $L$. לכן בסוף השלב B ב-$x = L$, ו-A לפניו במרחק
          $$s = v_1 t_2 = 1.58\cdot0.231 = 0.366\ \text{m}$$
      - kind: substitution
        text: >-
          (ג) שלב 3: שניהם מחוץ לרצועה ונעים במהירויות קבועות. B מהיר יותר ב-$v_2 - v_1 = 1.16\,\text{m/s}$, ולכן הוא סוגר את המרחק $s$ ופוגע ב-A אחרי
          $$t_3 = \frac{s}{v_2 - v_1} = \frac{0.366}{1.16} = 0.316\ \text{s}$$
          $$t = t_1 + t_2 + t_3 = 0.632 + 0.231 + 0.316 = 1.18\ \text{s}$$
      - kind: reasoning
        text: >-
          בדיקה בצורה כללית: $t_1 = 2u$, $t_2 = (\sqrt3 - 1)u$ ו-$t_3 = u$, ולכן $t = (2+\sqrt3)\,u = 3.73\cdot0.316 = 1.18\,\text{s}$. שימו לב שההזנחה של סעיף א נכונה רק כשהכדורים רחוקים: רגע לפני ההתנגשות הם קרובים מאוד, והדחייה ביניהם כבר לא קטנה.
      - kind: result
        text: >-
          (א) $F_{AB} = 3.6\cdot10^{-6}\,\text{N}$, פחות מאחוז מ-$qE$.

          (ב) יחד ב-$2.5\,\text{m/s}^2$ במשך $0.632\,\text{s}$; אחר כך A במהירות קבועה ו-B ב-$5\,\text{m/s}^2$ במשך $0.231\,\text{s}$; אחר כך שניהם במהירות קבועה.

          (ג) הכדורים מתנגשים $1.18\,\text{s}$ אחרי ההתחלה.
