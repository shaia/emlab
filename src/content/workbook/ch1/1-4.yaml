# Workbook for lesson 1.4: ten practice problems and two sourced challenge problems.
# Every superposition number recomputed with forceOn (src/physics/electrostatics.ts) and K from constants.ts.

lesson: '1.4'
practice:
  - id: W-1.4-01
    level: basic
    qualitative: false
    objectives: [OBJ-1.4-1, OBJ-1.4-2]
    prompt: >-
      מטען $q$ נמצא על קו ישר יחד עם שני מטענים, A ו-B. כששני המטענים במקומם, הכוח השקול על $q$ הוא $0.50\,\text{N}$ ימינה.
      מרחיקים את B למרחק גדול מאוד, כך שהכוח שלו זניח, ו-A נשאר במקומו. עכשיו הכוח על $q$ הוא $0.20\,\text{N}$ שמאלה.
      מה הכוח (גודל וכיוון) ש-B הפעיל על $q$ כשהיה במקומו?
    answer: '$0.70\,\text{N}$ ימינה'
    solution:
      - kind: given
        text: >-
          נבחר את הכיוון ימינה כחיובי. הכוח השקול עם שני המטענים: $F = +0.50\,\text{N}$. הכוח של A לבדו: $F_A = -0.20\,\text{N}$.
      - kind: reasoning
        text: >-
          לפי עקרון הסופרפוזיציה, הכוח של A על $q$ לא תלוי ב-B. לכן גם כש-B היה במקומו, A הפעיל על $q$ בדיוק $0.20\,\text{N}$ שמאלה.
      - kind: formula
        text: >-
          $F = F_A + F_B$. מעבירים את $F_A$ לאגף השני: $F_B = F - F_A$.
      - kind: substitution
        text: >-
          $F_B = 0.50 - (-0.20) = +0.70\,\text{N}$.
      - kind: result
        text: >-
          B הפעיל על $q$ כוח של $0.70\,\text{N}$ ימינה. לא $0.30\,\text{N}$: מי שמחסיר גדלים שוכח ש-A מושך או דוחף שמאלה, ולכן B צריך גם לבטל אותו וגם לתת את השקול ימינה.

  - id: W-1.4-02
    level: basic
    qualitative: true
    objectives: [OBJ-1.4-1, OBJ-1.4-3]
    prompt: >-
      מטען $q$ נמצא בראשית הצירים. מטען A נמצא על החלק החיובי של ציר $x$, ומטען B נמצא על החלק החיובי של ציר $y$.
      הסימנים והגדלים של A ו-B לא ידועים, ושניהם אינם אפס.

      (א) האם הכוח השקול על $q$ יכול להיות אפס?

      (ב) האם הוא יכול לפנות בדיוק לאורך ציר $x$?

      נמקו.
    answer: >-
      (א) לא.

      (ב) לא.
    solution:
      - kind: reasoning
        text: >-
          הכוח של A פועל לאורך הקו שמחבר את A ל-$q$, כלומר לאורך ציר $x$ (אל A או הרחק ממנו). לכן יש לו רק רכיב $x$.
          באותו אופן, לכוח של B יש רק רכיב $y$.
      - kind: reasoning
        text: >-
          (א) רכיב $x$ של השקול בא רק מ-A, ורכיב $y$ רק מ-B, ושניהם אינם אפס. שני כוחות מבטלים זה את זה רק כשהם שווים בגודלם ומנוגדים בכיוונם, וכוחות מאונכים אף פעם אינם כאלה.
      - kind: reasoning
        text: >-
          (ב) כדי שהשקול יפנה לאורך ציר $x$, רכיב $y$ שלו צריך להיות אפס. אבל רכיב $y$ בא רק מ-B, והוא אינו אפס.
      - kind: result
        text: >-
          (א) לא: אין כוח אחר שיבטל את רכיב $x$ של A או את רכיב $y$ של B.

          (ב) לא: השקול נוטה תמיד מציר $x$, לכיוון שקובע הכוח של B.

  - id: W-1.4-03
    level: basic
    qualitative: false
    objectives: [OBJ-1.4-3]
    prompt: >-
      מטען $q_A = -2\,\mu\text{C}$ נמצא בראשית הצירים, ומטען $q_B = +3\,\mu\text{C}$ נמצא בנקודה $(0.3,\ 0.4)\,\text{m}$.
      מצאו את הגודל של הכוח ש-$q_B$ מפעיל על $q_A$, את הרכיבים שלו לאורך ציר $x$ וציר $y$, ואת הזווית שלו עם ציר $x$.
    answer: >-
      $0.22\,\text{N}$ אל $q_B$: $F_x \approx 0.13\,\text{N}$ ו-$F_y \approx 0.17\,\text{N}$, בזווית של כ-$53^\circ$ מעל ציר $x$ החיובי
    solution:
      - kind: given
        text: >-
          $q_A = -2\cdot10^{-6}\,\text{C}$, $q_B = 3\cdot10^{-6}\,\text{C}$. המרחק: $r = \sqrt{0.3^2 + 0.4^2} = 0.5\,\text{m}$.
      - kind: reasoning
        text: >-
          המטענים מנוגדים בסימנם, ולכן $q_B$ מושך את $q_A$ אליו: ימינה ולמעלה, לאורך הקו שמחבר אותם.
          מהמשולש: $\cos\alpha = 0.3/0.5 = 0.6$ ו-$\sin\alpha = 0.4/0.5 = 0.8$, כאשר $\alpha$ היא הזווית בין הקו לציר $x$.
      - kind: formula
        text: >-
          $F = \dfrac{k|q_A||q_B|}{r^2}$, ואחר כך $F_x = F\cos\alpha$ ו-$F_y = F\sin\alpha$ (שניהם חיוביים, כי הכוח ימינה ולמעלה).
      - kind: substitution
        text: >-
          $F = \dfrac{9\cdot10^9 \cdot 2\cdot10^{-6} \cdot 3\cdot10^{-6}}{0.5^2} = 0.216\,\text{N}$.
          $F_x = 0.216 \cdot 0.6 \approx 0.13\,\text{N}$ ו-$F_y = 0.216 \cdot 0.8 \approx 0.17\,\text{N}$.
          $\tan\alpha = 0.8/0.6 = 1.33$, ולכן $\alpha \approx 53^\circ$.
      - kind: result
        text: >-
          גודל הכוח כ-$0.22\,\text{N}$, והוא פונה אל $q_B$. רכיביו: $F_x \approx 0.13\,\text{N}$ ימינה ו-$F_y \approx 0.17\,\text{N}$ למעלה, בזווית של כ-$53^\circ$ מעל ציר $x$ החיובי.

  - id: W-1.4-04
    level: mid
    qualitative: false
    objectives: [OBJ-1.4-2]
    prompt: >-
      על ציר $x$ נמצאים מטען $q_A = +4\,\mu\text{C}$ בראשית הצירים ומטען $q_B = +1\,\mu\text{C}$ בנקודה $x = 0.2\,\text{m}$.
      בנקודה $x = 0.5\,\text{m}$ מניחים מטען שלישי, $q_C$. מה צריכים להיות הגודל והסימן של $q_C$, כדי שהכוח השקול על $q_B$ יהיה אפס?
    answer: '$q_C = +9\,\mu\text{C}$'
    solution:
      - kind: given
        text: >-
          המרחקים מ-$q_B$: $r_{AB} = 0.2\,\text{m}$ ו-$r_{CB} = 0.5 - 0.2 = 0.3\,\text{m}$.
      - kind: reasoning
        text: >-
          $q_A$ חיובי כמו $q_B$, ולכן הוא דוחף את $q_B$ ימינה. כדי שהשקול יהיה אפס, $q_C$ צריך לדחוף את $q_B$ שמאלה באותו גודל.
          $q_C$ נמצא מימין ל-$q_B$, ולכן כדי לדחוף אותו שמאלה הוא צריך **לדחות** אותו: $q_C$ חיובי.
      - kind: formula
        text: >-
          הגדלים שווים: $\dfrac{k\,q_A\,q_B}{r_{AB}^2} = \dfrac{k\,|q_C|\,q_B}{r_{CB}^2}$.
      - kind: manipulation
        text: >-
          מצמצמים את $k$ ואת $q_B$, שמופיעים בשני האגפים, ומכפילים את שני האגפים ב-$r_{CB}^2$:
          $|q_C| = q_A \cdot \left(\dfrac{r_{CB}}{r_{AB}}\right)^2$.
      - kind: substitution
        text: >-
          $|q_C| = 4\,\mu\text{C} \cdot \left(\dfrac{0.3}{0.2}\right)^2 = 4 \cdot 2.25 = 9\,\mu\text{C}$.
          בדיקה: $F_A = \dfrac{9\cdot10^9 \cdot 4\cdot10^{-6} \cdot 1\cdot10^{-6}}{0.2^2} = 0.9\,\text{N}$, ו-$F_C = \dfrac{9\cdot10^9 \cdot 9\cdot10^{-6} \cdot 1\cdot10^{-6}}{0.3^2} = 0.9\,\text{N}$.
      - kind: result
        text: >-
          $q_C = +9\,\mu\text{C}$. שימו לב שהתשובה לא תלויה ב-$q_B$: הוא הצטמצם, כי הוא מכפיל את שני הכוחות באותה מידה.

  - id: W-1.4-05
    level: mid
    qualitative: true
    objectives: [OBJ-1.4-1, OBJ-1.4-2]
    prompt: >-
      שלושה מטענים נמצאים על קו אופקי, במרווחים שווים $d$: משמאל מטען חיובי $Q$, באמצע מטען שלילי שגודלו $Q$, ומימין עוד מטען חיובי $Q$.
      נסמן $F_0 = kQ^2/d^2$.

      (א) מה הכוח השקול (גודל, בעזרת $F_0$, וכיוון) על כל אחד משלושת המטענים?

      (ב) מה הסכום של שלושת הכוחות השקולים? הסבירו למה התוצאה הזאת אינה מקרית.
    answer: >-
      (א) על השמאלי $0.75F_0$ ימינה, על האמצעי אפס, ועל הימני $0.75F_0$ שמאלה.

      (ב) אפס.
    solution:
      - kind: reasoning
        text: >-
          (א) **המטען האמצעי:** שני המטענים החיוביים מושכים אותו, אחד שמאלה ואחד ימינה. המרחקים והמטענים שווים, ולכן שני הכוחות שווים ל-$F_0$, והשקול אפס.
      - kind: reasoning
        text: >-
          **המטען השמאלי:** המטען האמצעי מושך אותו ימינה, מרחק $d$, בכוח $F_0$. המטען הימני דוחה אותו שמאלה, אבל ממרחק $2d$, ולכן בכוח קטן פי 4: $F_0/4$.
          נבחר את הכיוון ימינה כחיובי: $F = F_0 - F_0/4 = 0.75F_0$, ימינה.
      - kind: reasoning
        text: >-
          **המטען הימני:** הסידור סימטרי, ולכן זו תמונת מראה של המטען השמאלי: $0.75F_0$ שמאלה.
      - kind: reasoning
        text: >-
          (ב) $0.75F_0 + 0 + (-0.75F_0) = 0$. כל כוח בין שני מטענים מופיע פעמיים, פעם על כל אחד מהם, ושני הכוחות בזוג שווים בגודלם ומנוגדים בכיוונם (החוק השלישי של ניוטון). לכן בסכום על כל המטענים הם מבטלים זה את זה בזוגות.
      - kind: result
        text: >-
          (א) השמאלי: $0.75F_0$ ימינה. האמצעי: אפס. הימני: $0.75F_0$ שמאלה.

          (ב) הסכום אפס, תמיד, לכל קבוצה של מטענים שפועלים רק זה על זה.

  - id: W-1.4-06
    level: mid
    qualitative: false
    objectives: [OBJ-1.4-3]
    prompt: >-
      מטען $q_A = +1\,\mu\text{C}$ נמצא בראשית הצירים, ומטען $q_B = +4\,\mu\text{C}$ נמצא על ציר $x$ בנקודה $x = -0.2\,\text{m}$.
      רוצים להניח מטען $q_C$ על ציר $y$, בנקודה $y = 0.3\,\text{m}$, כך שהכוח השקול על $q_A$ יפנה ימינה-למטה, בזווית של $45^\circ$ מתחת לציר $x$ החיובי.

      (א) מה צריכים להיות הגודל והסימן של $q_C$?

      (ב) מה יהיה אז הגודל של הכוח השקול על $q_A$?
    answer: >-
      (א) $q_C = +9\,\mu\text{C}$.

      (ב) כ-$1.27\,\text{N}$.
    solution:
      - kind: given
        text: >-
          $r_{AB} = 0.2\,\text{m}$ ו-$r_{AC} = 0.3\,\text{m}$.
      - kind: reasoning
        text: >-
          $q_B$ חיובי ונמצא משמאל ל-$q_A$, ולכן הוא דוחף אותו ימינה: לכוח שלו יש רק רכיב $x$. הכוח של $q_C$, שנמצא על ציר $y$, פועל לאורך ציר $y$: יש לו רק רכיב $y$.
          שקול בזווית של $45^\circ$ מתחת לציר $x$ פירושו $F_y = -F_x$. לכן הכוח של $q_C$ צריך לפנות כלפי מטה, ולהיות שווה בגודלו לכוח של $q_B$.
      - kind: substitution
        text: >-
          $F_B = \dfrac{9\cdot10^9 \cdot 4\cdot10^{-6} \cdot 1\cdot10^{-6}}{0.2^2} = 0.9\,\text{N}$.
      - kind: reasoning
        text: >-
          $q_C$ נמצא מעל $q_A$. כדי לדחוף את $q_A$ כלפי מטה, הרחק ממנו, $q_C$ צריך לדחות אותו, ולכן הוא חיובי.
      - kind: formula
        text: >-
          $\dfrac{k\,|q_C|\,q_A}{r_{AC}^2} = 0.9\,\text{N}$.
      - kind: manipulation
        text: >-
          מכפילים את שני האגפים ב-$r_{AC}^2$ ומחלקים ב-$k\,q_A$: $|q_C| = \dfrac{0.9 \cdot r_{AC}^2}{k\,q_A}$.
      - kind: substitution
        text: >-
          (א) $|q_C| = \dfrac{0.9 \cdot 0.3^2}{9\cdot10^9 \cdot 1\cdot10^{-6}} = 9\cdot10^{-6}\,\text{C}$.

          (ב) $F = \sqrt{0.9^2 + 0.9^2} = 0.9\sqrt2 \approx 1.27\,\text{N}$.
      - kind: result
        text: >-
          (א) $q_C = +9\,\mu\text{C}$.

          (ב) הכוח השקול על $q_A$ הוא כ-$1.27\,\text{N}$, ימינה-למטה בזווית של $45^\circ$.

  - id: W-1.4-07
    level: mid
    qualitative: true
    objectives: [OBJ-1.4-1, OBJ-1.4-3]
    prompt: >-
      מטען חיובי $q$ נמצא במרכז של ריבוע. בכל קודקוד של הריבוע אפשר להניח מטען שגודלו $Q$, ומטען כזה מפעיל לבדו על $q$ כוח שגודלו $F_0$.
      מצאו את הכוח השקול על $q$ (גודל, בעזרת $F_0$, וכיוון) בכל אחד מהסידורים:

      (א) בכל ארבעת הקודקודים מטענים חיוביים.

      (ב) בשני הקודקודים העליונים מטענים חיוביים, ובשני התחתונים מטענים שליליים.

      (ג) כמו (א), אבל מוציאים את המטען שבקודקוד הימני העליון.
    answer: >-
      (א) אפס.

      (ב) $2\sqrt2\,F_0 \approx 2.8F_0$, ישר כלפי מטה.

      (ג) $F_0$, אל הקודקוד הריק (ימינה-למעלה, לאורך האלכסון).
    solution:
      - kind: reasoning
        text: >-
          כל הקודקודים נמצאים באותו מרחק מהמרכז, ולכן לכל כוח אותו גודל, $F_0$. כל כוח פועל לאורך אלכסון: הרחק מהקודקוד אם המטען שם חיובי, ואליו אם הוא שלילי.
      - kind: reasoning
        text: >-
          (א) כל שני קודקודים נגדיים דוחפים את $q$ לכיוונים מנוגדים לאורך אותו אלכסון, באותו גודל. הזוגות מבטלים זה את זה, והשקול אפס.
      - kind: reasoning
        text: >-
          (ב) המטען החיובי שבקודקוד השמאלי העליון דוחף את $q$ ימינה-למטה, והמטען השלילי שבקודקוד הימני התחתון מושך אותו לאותו כיוון. יחד: $2F_0$ ימינה-למטה.
          באותו אופן, הקודקוד הימני העליון והקודקוד השמאלי התחתון נותנים יחד $2F_0$ שמאלה-למטה.
      - kind: reasoning
        text: >-
          לשני הכוחות של $2F_0$ זווית של $45^\circ$ עם הקו האופקי, אחד מכל צד. הרכיבים האופקיים מבטלים זה את זה, והאנכיים מתחברים:
          $F = 2 \cdot 2F_0 \sin 45^\circ = 2\sqrt2\,F_0 \approx 2.83F_0$, כלפי מטה.
      - kind: reasoning
        text: >-
          (ג) הקודקודים השמאלי העליון והימני התחתון עדיין מבטלים זה את זה. המטען שבקודקוד השמאלי התחתון דוחף את $q$ ימינה-למעלה, ואין לו עכשיו בן זוג שיבטל אותו.
      - kind: result
        text: >-
          (א) אפס.

          (ב) $2\sqrt2\,F_0 \approx 2.8F_0$, ישר כלפי מטה, מהצד החיובי לצד השלילי.

          (ג) $F_0$, לאורך האלכסון אל הקודקוד הריק. הוצאת מטען אחת שקולה להוספת כוח הפוך לכוח שהוא הפעיל.

  - id: W-1.4-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.4-3]
    prompt: >-
      ארבעה מטענים נמצאים בקודקודי מלבן שצלעו האופקית $0.3\,\text{m}$ וצלעו האנכית $0.4\,\text{m}$.
      בקודקוד השמאלי התחתון, בראשית הצירים, נמצא $q_D = +1\,\mu\text{C}$. בקודקוד הימני התחתון נמצא $q_A = +3\,\mu\text{C}$,
      בקודקוד השמאלי העליון $q_C = +4\,\mu\text{C}$, ובקודקוד הימני העליון $q_B = -5\,\mu\text{C}$.
      חשבו את הכוח השקול על $q_D$: גודל וכיוון.
    answer: >-
      כ-$0.21\,\text{N}$, שמאלה-למטה, בזווית של כ-$23^\circ$ מתחת לציר $x$ השלילי
    solution:
      - kind: given
        text: >-
          המרחקים מ-$q_D$: $r_{DA} = 0.3\,\text{m}$, $r_{DC} = 0.4\,\text{m}$, ולאורך האלכסון $r_{DB} = \sqrt{0.3^2 + 0.4^2} = 0.5\,\text{m}$.
      - kind: reasoning
        text: >-
          **כיוונים:** $q_A$ חיובי ונמצא מימין, ולכן הוא דוחף את $q_D$ שמאלה. $q_C$ חיובי ונמצא מעל, ולכן הוא דוחף את $q_D$ כלפי מטה.
          $q_B$ שלילי, ולכן הוא מושך את $q_D$ אליו, ימינה-למעלה לאורך האלכסון. לאלכסון $\cos\alpha = 0.3/0.5 = 0.6$ ו-$\sin\alpha = 0.4/0.5 = 0.8$.
      - kind: formula
        text: >-
          $F = \dfrac{k|q_1||q_2|}{r^2}$ לכל כוח. אחר כך $F_x = \sum F_{ix}$, $F_y = \sum F_{iy}$, $F = \sqrt{F_x^2 + F_y^2}$.
      - kind: substitution
        text: >-
          $F_A = \dfrac{9\cdot10^9 \cdot 3\cdot10^{-6} \cdot 1\cdot10^{-6}}{0.3^2} = 0.3\,\text{N}$,
          $F_C = \dfrac{9\cdot10^9 \cdot 4\cdot10^{-6} \cdot 1\cdot10^{-6}}{0.4^2} = 0.225\,\text{N}$,
          $F_B = \dfrac{9\cdot10^9 \cdot 5\cdot10^{-6} \cdot 1\cdot10^{-6}}{0.5^2} = 0.18\,\text{N}$.
      - kind: substitution
        text: >-
          רכיבי $F_B$: $F_{Bx} = +0.18 \cdot 0.6 = +0.108\,\text{N}$ ו-$F_{By} = +0.18 \cdot 0.8 = +0.144\,\text{N}$.
          חיבור: $F_x = -0.3 + 0.108 = -0.192\,\text{N}$ ו-$F_y = -0.225 + 0.144 = -0.081\,\text{N}$.
      - kind: substitution
        text: >-
          $F = \sqrt{0.192^2 + 0.081^2} \approx 0.208\,\text{N}$, ו-$\tan\theta = \dfrac{0.081}{0.192} \approx 0.42$, ולכן $\theta \approx 23^\circ$.
      - kind: result
        text: >-
          הכוח השקול על $q_D$ הוא כ-$0.21\,\text{N}$. שני הרכיבים שליליים, ולכן הוא פונה שמאלה-למטה, $23^\circ$ מתחת לציר $x$ השלילי.

  - id: W-1.4-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.4-3, OBJ-1.4-1]
    prompt: >-
      מטען $q_A = +1\,\mu\text{C}$ נמצא בראשית הצירים. מטען $q_B = -2\,\mu\text{C}$ נמצא בנקודה $(0,\ 0.3)\,\text{m}$, ומטען $q_C = +5\,\mu\text{C}$ נמצא בנקודה $(0.4,\ 0.3)\,\text{m}$.

      (א) חשבו את הכוח השקול על $q_A$: גודל וכיוון.

      (ב) מה משתנה אם מחליפים את $q_B$ במטען חיובי שגודלו $2\,\mu\text{C}$? אילו מהכוחות משתנים, ומה הכוח השקול החדש?
    answer: >-
      (א) כ-$0.17\,\text{N}$, שמאלה-למעלה, בזווית של כ-$33^\circ$ מעל ציר $x$ השלילי.

      (ב) רק הכוח של $q_B$ מתהפך. השקול החדש כ-$0.34\,\text{N}$, שמאלה-למטה, בזווית של כ-$65^\circ$ מתחת לציר $x$ השלילי.
    solution:
      - kind: given
        text: >-
          $r_{AB} = 0.3\,\text{m}$ ו-$r_{AC} = \sqrt{0.4^2 + 0.3^2} = 0.5\,\text{m}$.
      - kind: reasoning
        text: >-
          **כיוונים:** $q_B$ שלילי ונמצא מעל $q_A$, ולכן הוא מושך את $q_A$ כלפי מעלה. $q_C$ חיובי, ולכן הוא דוחה את $q_A$ הרחק ממנו: שמאלה-למטה, לאורך הקו שמחבר אותם.
          לקו הזה $\cos\alpha = 0.4/0.5 = 0.8$ ו-$\sin\alpha = 0.3/0.5 = 0.6$.
      - kind: substitution
        text: >-
          $F_B = \dfrac{9\cdot10^9 \cdot 2\cdot10^{-6} \cdot 1\cdot10^{-6}}{0.3^2} = 0.2\,\text{N}$ ו-$F_C = \dfrac{9\cdot10^9 \cdot 5\cdot10^{-6} \cdot 1\cdot10^{-6}}{0.5^2} = 0.18\,\text{N}$.
      - kind: substitution
        text: >-
          רכיבי $F_C$: $F_{Cx} = -0.18 \cdot 0.8 = -0.144\,\text{N}$ ו-$F_{Cy} = -0.18 \cdot 0.6 = -0.108\,\text{N}$.
          חיבור: $F_x = -0.144\,\text{N}$ ו-$F_y = 0.2 - 0.108 = +0.092\,\text{N}$.
      - kind: substitution
        text: >-
          (א) $F = \sqrt{0.144^2 + 0.092^2} \approx 0.171\,\text{N}$, ו-$\tan\theta = \dfrac{0.092}{0.144} \approx 0.64$, ולכן $\theta \approx 33^\circ$.
      - kind: reasoning
        text: >-
          (ב) לפי עקרון הסופרפוזיציה, $F_C$ תלוי רק ב-$q_C$, ב-$q_A$ ובמרחק ביניהם, ולכן הוא לא משתנה. $F_B$ שומר על הגודל $0.2\,\text{N}$, אבל עכשיו $q_B$ דוחה את $q_A$, ולכן הכוח פונה כלפי מטה.
      - kind: substitution
        text: >-
          $F_x = -0.144\,\text{N}$ (ללא שינוי) ו-$F_y = -0.2 - 0.108 = -0.308\,\text{N}$.
          $F = \sqrt{0.144^2 + 0.308^2} = 0.34\,\text{N}$, ו-$\tan\theta = \dfrac{0.308}{0.144} \approx 2.14$, ולכן $\theta \approx 65^\circ$.
      - kind: result
        text: >-
          (א) כ-$0.17\,\text{N}$. $F_x < 0$ ו-$F_y > 0$, ולכן הכוח פונה שמאלה-למעלה, $33^\circ$ מעל ציר $x$ השלילי.

          (ב) רק $F_B$ מתהפך. השקול גדל לכ-$0.34\,\text{N}$, ופונה שמאלה-למטה, $65^\circ$ מתחת לציר $x$ השלילי.

  - id: W-1.4-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.4-2, OBJ-1.4-1]
    prompt: >-
      שני כדורים קטנים טעונים, $q_1 = +1\,\mu\text{C}$ ו-$q_2 = +4\,\mu\text{C}$, נמצאים במרחק $0.9\,\text{m}$ זה מזה, וחופשיים לנוע.
      רוצים להניח מטען שלישי, $q_3$, על הישר שעובר דרכם, כך שהכוח השקול על **כל אחד** משלושת המטענים יהיה אפס.

      (א) קבעו ונמקו באיזה תחום של הישר צריך להיות $q_3$, ומה הסימן שלו.

      (ב) מצאו את המקום של $q_3$ ואת הגודל שלו.
    answer: >-
      (א) בין שני הכדורים, ו-$q_3$ שלילי.

      (ב) $0.3\,\text{m}$ מ-$q_1$ (ו-$0.6\,\text{m}$ מ-$q_2$), ו-$q_3 = -\tfrac{4}{9}\,\mu\text{C} \approx -0.44\,\mu\text{C}$.
    solution:
      - kind: reasoning
        text: >-
          (א) **התחום:** על $q_3$ פועלים כוחות מ-$q_1$ ומ-$q_2$, ושניהם חיוביים. מחוץ לקטע שביניהם שני הכוחות על $q_3$ פועלים באותו כיוון (שניהם דוחים או שניהם מושכים), ואינם יכולים לבטל זה את זה. בין הכדורים הם מנוגדים, ולכן $q_3$ צריך להיות ביניהם.
      - kind: reasoning
        text: >-
          **הסימן:** $q_2$ דוחה את $q_1$ הרחק ממנו. כדי לבטל את זה, $q_3$, שנמצא בין השניים, צריך למשוך את $q_1$ אליו. לכן $q_3$ שלילי.
      - kind: formula
        text: >-
          (ב) **המקום:** נסמן ב-$x$ את המרחק של $q_3$ מ-$q_1$. שיווי הכוחות על $q_3$: $\dfrac{k\,q_1\,|q_3|}{x^2} = \dfrac{k\,q_2\,|q_3|}{(0.9 - x)^2}$.
      - kind: manipulation
        text: >-
          מצמצמים את $k$ ואת $|q_3|$ ומסדרים: $\left(\dfrac{0.9 - x}{x}\right)^2 = \dfrac{q_2}{q_1} = 4$, ולכן $\dfrac{0.9 - x}{x} = 2$ (השורש החיובי, כי שני המרחקים חיוביים).
          מכפילים ב-$x$: $0.9 - x = 2x$, ומכאן $x = 0.3\,\text{m}$.
      - kind: formula
        text: >-
          **הגודל:** שיווי הכוחות על $q_1$. המשיכה של $q_3$, ממרחק $0.3\,\text{m}$, מבטלת את הדחייה של $q_2$, ממרחק $0.9\,\text{m}$:
          $\dfrac{k\,q_1\,|q_3|}{0.3^2} = \dfrac{k\,q_1\,q_2}{0.9^2}$.
      - kind: manipulation
        text: >-
          מצמצמים את $k$ ואת $q_1$ ומכפילים ב-$0.3^2$: $|q_3| = q_2 \cdot \left(\dfrac{0.3}{0.9}\right)^2 = \dfrac{q_2}{9}$.
      - kind: substitution
        text: >-
          $|q_3| = \dfrac{4\,\mu\text{C}}{9} \approx 0.44\,\mu\text{C}$.
          בדיקה על $q_2$: $\dfrac{9\cdot10^9 \cdot 1\cdot10^{-6} \cdot 4\cdot10^{-6}}{0.9^2} \approx 0.044\,\text{N}$ (דחייה מ-$q_1$), ו-$\dfrac{9\cdot10^9 \cdot 0.444\cdot10^{-6} \cdot 4\cdot10^{-6}}{0.6^2} \approx 0.044\,\text{N}$ (משיכה אל $q_3$). גם $q_2$ בשיווי כוחות.
      - kind: result
        text: >-
          (א) $q_3$ בין שני הכדורים, והוא שלילי.

          (ב) $q_3$ נמצא $0.3\,\text{m}$ מ-$q_1$, קרוב יותר למטען הקטן, וגודלו $\tfrac{4}{9}\,\mu\text{C} \approx 0.44\,\mu\text{C}$, כלומר $q_3 \approx -0.44\,\mu\text{C}$. שימו לב: זה שיווי כוחות לא יציב. הזזה קטנה של אחד המטענים מפרה אותו, והמטענים כבר לא חוזרים למקומם.

challenge:
  - id: W-1.4-c1
    stars: 1
    objectives: [OBJ-1.4-3, OBJ-1.4-1]
    prompt: >-
      בכל אחד מארבעת הקודקודים של ריבוע שאורך צלעו $0.2\,\text{m}$ נמצא מטען שלילי שגודלו $4\,\mu\text{C}$. במרכז הריבוע מניחים מטען $q$.

      (א) מה צריכים להיות הגודל והסימן של $q$, כדי שהכוח השקול על **כל אחד** מחמשת המטענים יהיה אפס?

      (ב) נסמן ב-$Q$ את המטען שבכל קודקוד ($Q$ שלילי כאן). הראו שהתשובה לא תלויה באורך הצלע, ובטאו את $q$ בעזרת $Q$.
    answer: >-
      (א) $q \approx +3.8\,\mu\text{C}$.

      (ב) $q = -\dfrac{(1 + 2\sqrt2)\,Q}{4}$.
    solution:
      - kind: reasoning
        text: >-
          **המרכז:** ארבעת מטעני הקודקודים שווים ונמצאים באותו מרחק מהמרכז. כל שני קודקודים נגדיים מפעילים על $q$ כוחות מנוגדים ושווים, ולכן $q$ בשיווי כוחות בכל מקרה.
          נשאר לדאוג לקודקודים, ובגלל הסימטריה מספיק לבדוק קודקוד אחד.
      - kind: given
        text: >-
          $a = 0.2\,\text{m}$, $|Q| = 4\cdot10^{-6}\,\text{C}$. מקודקוד אחד: שני הקודקודים השכנים במרחק $a$, הקודקוד הנגדי במרחק $a\sqrt2$ (כלומר $r^2 = 0.08\,\text{m}^2$), והמרכז במרחק $a/\sqrt2$ (כלומר $r^2 = a^2/2 = 0.02\,\text{m}^2$).
      - kind: reasoning
        text: >-
          **כיוונים:** כל מטעני הקודקודים שליליים, ולכן הם דוחים זה את זה. שני השכנים דוחפים את הקודקוד לאורך הצלעות, החוצה מהריבוע. הכוחות שלהם מאונכים, וכל אחד מהם יוצר זווית של $45^\circ$ עם האלכסון. הקודקוד הנגדי דוחף לאורך האלכסון, החוצה.
      - kind: substitution
        text: >-
          $F_1 = \dfrac{9\cdot10^9 \cdot (4\cdot10^{-6})^2}{0.2^2} = 3.6\,\text{N}$ מכל שכן, ו-$F_2 = \dfrac{9\cdot10^9 \cdot (4\cdot10^{-6})^2}{0.08} = 1.8\,\text{N}$ מהקודקוד הנגדי.
      - kind: substitution
        text: >-
          הרכיבים של שני השכנים שניצבים לאלכסון מבטלים זה את זה. לאורך האלכסון, החוצה:
          $2 \cdot 3.6 \cos 45^\circ + 1.8 \approx 5.09 + 1.8 = 6.89\,\text{N}$.
      - kind: reasoning
        text: >-
          המטען שבמרכז צריך למשוך את הקודקוד פנימה, לאורך האלכסון, בכוח של $6.89\,\text{N}$. מושך פירושו סימן הפוך למטען השלילי שבקודקוד, ולכן $q$ חיובי.
      - kind: formula
        text: >-
          $\dfrac{k\,|Q|\,q}{a^2/2} = 6.89\,\text{N}$.
      - kind: manipulation
        text: >-
          מכפילים את שני האגפים ב-$a^2/2$ ומחלקים ב-$k|Q|$: $q = \dfrac{6.89 \cdot 0.02}{9\cdot10^9 \cdot 4\cdot10^{-6}} \approx 3.83\cdot10^{-6}\,\text{C}$.
      - kind: manipulation
        text: >-
          (ב) באותיות: הדחייה החוצה היא $\dfrac{kQ^2}{a^2}\left(\sqrt2 + \dfrac12\right)$, והמשיכה פנימה היא $\dfrac{2k|Q|q}{a^2}$.
          משווים, ומצמצמים את $k$, את $a^2$ ואת $|Q|$: $q = \dfrac{|Q|}{2}\left(\sqrt2 + \dfrac12\right) = \dfrac{(1 + 2\sqrt2)\,|Q|}{4}$.
          אורך הצלע הצטמצם, ולכן התשובה לא תלויה בו. בדיקה: $\dfrac{(1 + 2\sqrt2) \cdot 4}{4} \approx 3.83\,\mu\text{C}$.
      - kind: result
        text: >-
          (א) $q \approx +3.8\,\mu\text{C}$, מטען חיובי במרכז.

          (ב) $q = -\dfrac{(1 + 2\sqrt2)\,Q}{4} \approx -0.96\,Q$: סימן הפוך למטעני הקודקודים, וגודל קצת קטן משלהם, בכל ריבוע.
    source:
      name: AIEEE (today JEE Main)
      year: 2004
      problem: 'Physics, Q42'
      url: https://cracku.in/42-four-charges-equal-to-q-are-placed-at-the-four-cor-x-nta-jee-main-2004
      verified: '2026-11-02'
      adapted: true

  - id: W-1.4-c2
    stars: 2
    objectives: [OBJ-1.4-1, OBJ-1.4-3]
    prompt: >-
      ארבעה מטענים, שגודל כל אחד מהם $Q$, קבועים על ציר $x$: $q_1$ בנקודה $x = -2a$, $q_2$ בנקודה $x = -a$, $q_3$ בנקודה $x = a$ ו-$q_4$ בנקודה $x = 2a$.
      מטען חיובי $q$ נמצא על ציר $y$, בנקודה $y = b$, כאשר $b > 0$.

      (א) קבעו ונמקו, בלי חישוב, לאן פונה הכוח השקול על $q$ בכל אחד מהסידורים:
      (1) ארבעת המטענים חיוביים;
      (2) $q_1$ ו-$q_2$ חיוביים, $q_3$ ו-$q_4$ שליליים;
      (3) $q_1$ ו-$q_4$ חיוביים, $q_2$ ו-$q_3$ שליליים.

      (ב) בסידור רביעי $q_1$ ו-$q_3$ חיוביים, ו-$q_2$ ו-$q_4$ שליליים. הראו שהכוח השקול על $q$ מקביל לציר $x$.
      חשבו אותו עבור $a = 0.1\,\text{m}$ ו-$Q = q = 1\,\mu\text{C}$, פעם עם $b = 0.1\,\text{m}$ ופעם עם $b = 0.3\,\text{m}$.

      (ג) מה מלמדת התוצאה של (ב)? מצאו את היחס $b/a$ שבו הכוח השקול בסידור הרביעי מתאפס.
    answer: >-
      (א) (1) כלפי מעלה. (2) ימינה. (3) כלפי מטה.

      (ב) עבור $b = 0.1\,\text{m}$: כ-$0.31\,\text{N}$ שמאלה. עבור $b = 0.3\,\text{m}$: כ-$0.020\,\text{N}$ ימינה.

      (ג) בסידור הרביעי הכיוון תלוי ב-$b$, והשקול מתאפס ב-$b \approx 2.0\,a$.
    solution:
      - kind: given
        text: >-
          $q_2$ ו-$q_3$ נמצאים במרחק $r_1 = \sqrt{a^2 + b^2}$ מ-$q$, ו-$q_1$ ו-$q_4$ במרחק $r_2 = \sqrt{4a^2 + b^2}$. כל זוג סימטרי ביחס לציר $y$.
      - kind: reasoning
        text: >-
          **סימטריה:** לשני מטענים בזוג אותו גודל ואותו מרחק, ולכן הכוחות שלהם על $q$ שווים בגודלם. אם הזוג באותו סימן, רכיבי $x$ מבטלים זה את זה ורכיבי $y$ מתחברים.
          אם הזוג בסימנים מנוגדים, רכיבי $y$ מבטלים זה את זה ורכיבי $x$ מתחברים.
      - kind: reasoning
        text: >-
          (א) (1) שני הזוגות חיוביים, וכל אחד מהם דוחף את $q$ כלפי מעלה. השקול כלפי מעלה.
      - kind: reasoning
        text: >-
          (2) בכל זוג המטען השמאלי חיובי ודוחה את $q$ הרחק ממנו, עם רכיב ימינה, והמטען הימני שלילי ומושך את $q$ אליו, גם עם רכיב ימינה. השקול ימינה.
      - kind: reasoning
        text: >-
          (3) $q_1$ ו-$q_4$ דוחפים את $q$ כלפי מעלה, ו-$q_2$ ו-$q_3$ מושכים אותו כלפי מטה. רכיב $y$ של כל כוח הוא $F\cdot\dfrac{b}{r} = \dfrac{kQq\,b}{r^3}$.
          $r_1 < r_2$, ולכן המשיכה של הזוג הקרוב חזקה יותר. השקול כלפי מטה, לכל $b$.
      - kind: reasoning
        text: >-
          (ב) שני הזוגות בסימנים מנוגדים, ולכן רכיבי $y$ מתבטלים והשקול מקביל לציר $x$.
          הזוג הקרוב: $q_2$ השלילי מושך את $q$ שמאלה, ו-$q_3$ החיובי דוחה אותו שמאלה. הזוג הרחוק: $q_1$ החיובי דוחה את $q$ ימינה, ו-$q_4$ השלילי מושך אותו ימינה.
          רכיב $x$ של כל כוח הוא $F\cdot\dfrac{d}{r} = \dfrac{kQq\,d}{r^3}$, כאשר $d$ הוא המרחק של המטען מציר $y$.
      - kind: formula
        text: >-
          נבחר את הכיוון ימינה כחיובי: $F_x = 2kQq\left(\dfrac{2a}{r_2^3} - \dfrac{a}{r_1^3}\right)$.
      - kind: substitution
        text: >-
          $b = 0.1\,\text{m}$: הזוג הקרוב, $r_1^2 = 0.02\,\text{m}^2$, כוח של $0.45\,\text{N}$ מכל מטען, ורכיב $x$ של $0.45 \cdot \dfrac{0.1}{0.141} \approx 0.318\,\text{N}$; יחד $0.636\,\text{N}$ שמאלה.
          הזוג הרחוק, $r_2^2 = 0.05\,\text{m}^2$, כוח של $0.18\,\text{N}$, ורכיב $x$ של $0.18 \cdot \dfrac{0.2}{0.224} \approx 0.161\,\text{N}$; יחד $0.322\,\text{N}$ ימינה. השקול: כ-$0.31\,\text{N}$ שמאלה.
      - kind: substitution
        text: >-
          $b = 0.3\,\text{m}$: הזוג הקרוב, $r_1^2 = 0.1\,\text{m}^2$, כוח של $0.09\,\text{N}$, ורכיב $x$ של $0.09 \cdot \dfrac{0.1}{0.316} \approx 0.0285\,\text{N}$; יחד $0.057\,\text{N}$ שמאלה.
          הזוג הרחוק, $r_2^2 = 0.13\,\text{m}^2$, כוח של $0.0692\,\text{N}$, ורכיב $x$ של $0.0692 \cdot \dfrac{0.2}{0.361} \approx 0.0384\,\text{N}$; יחד $0.077\,\text{N}$ ימינה. השקול: כ-$0.020\,\text{N}$ ימינה.
      - kind: reasoning
        text: >-
          (ג) הכיוון התהפך. קרוב לציר $x$ הזוג הקרוב מנצח, כי הכוחות שלו חזקים בהרבה. רחוק מהציר הכוחות של שני הזוגות דומים בגודלם, אבל הכוחות של הזוג הרחוק נוטים יותר לכיוון האופקי, ולכן הרכיב האופקי שלהם גדול יותר.
      - kind: manipulation
        text: >-
          השקול מתאפס כאשר $\dfrac{2a}{r_2^3} = \dfrac{a}{r_1^3}$, כלומר $r_2^3 = 2r_1^3$. מעלים את שני האגפים בחזקת $\tfrac23$: $r_2^2 = 2^{2/3}\,r_1^2 \approx 1.587\,r_1^2$.
          מציבים: $4a^2 + b^2 = 1.587\,(a^2 + b^2)$, ומעבירים אגפים: $(1.587 - 1)\,b^2 = (4 - 1.587)\,a^2$. מחלקים ב-$0.587$: $b^2 \approx 4.11\,a^2$, ולכן $b \approx 2.03\,a$.
      - kind: result
        text: >-
          (א) (1) כלפי מעלה. (2) ימינה. (3) כלפי מטה.

          (ב) הכוח מקביל לציר $x$: כ-$0.31\,\text{N}$ שמאלה עבור $b = 0.1\,\text{m}$, וכ-$0.020\,\text{N}$ ימינה עבור $b = 0.3\,\text{m}$.

          (ג) בסידור הרביעי הכיוון תלוי במרחק: שמאלה כאשר $b < 2.0\,a$ בקירוב, וימינה כאשר $b > 2.0\,a$. בשאלה כזאת אי אפשר לקבוע כיוון רק לפי "מי קרוב יותר"; צריך להשוות רכיבים.
