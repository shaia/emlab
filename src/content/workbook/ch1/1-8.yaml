  - id: W-1.8-c2
    stars: 2
    objectives: [OBJ-1.8-2, OBJ-1.8-3]
    prompt: >-
      קליפה כדורית דקה ומבודדת, שרדיוסה $R = 10$ ס״מ, טעונה באופן אחיד במטען $Q = 2\,\mu\text{C}$. הקליפה בנויה משני חצאי כדור שאינם מודבקים זה לזה. חצאי הכדור דוחים זה את זה, ולכן כדי שהקליפה לא תתפרק לוחצים כל חצי אל השני בכוח $F$. סמנו ב-$\sigma$ את צפיפות המטען המשטחית של הקליפה.

      א. מה השדה ממש מחוץ לקליפה, ומה ממש בתוכה? בטאו את השדה שבחוץ בעזרת $\sigma$ ו-$\varepsilon_0$.

      ב. מקרוב, פיסה קטנה של הקליפה, ששטחה $\Delta A$, נראית כמו לוח אינסופי. מה השדה שהפיסה עצמה יוצרת, ממש לידה, משני צדיה? היעזרו בסופרפוזיציה ובסעיף א, ומצאו את השדה ש**שאר הקליפה** יוצרת במקום של הפיסה. מה הכוח על הפיסה?

      ג. הכוחות על הפיסות של חצי כדור מצביעים בכיוונים שונים, כולם הרחק מהמרכז. הראו שהרכיב שלהם לאורך ציר הסימטריה של חצי הכדור מסתכם ב-$F = \dfrac{\sigma^2}{2\varepsilon_0}\cdot\pi R^2$. רמז: חשבו על השטף של שדה אחיד, שמכוון לאורך הציר, דרך חצי הכדור ודרך העיגול השטוח שסוגר אותו.

      ד. חשבו את $F$.
    answer: >-
      א. בחוץ $E = kQ/R^2 = \sigma/\varepsilon_0 = 1.8\cdot10^{6}\,\text{N/C}$, הרחק מהמרכז. בפנים אפס.

      ב. הפיסה יוצרת $\sigma/2\varepsilon_0$ משני צדיה, הרחק ממנה. שאר הקליפה יוצרת במקומה $\sigma/2\varepsilon_0$ הרחק מהמרכז, והכוח על הפיסה $\dfrac{\sigma^2}{2\varepsilon_0}\Delta A$, הרחק מהמרכז.

      ג. ראו בפתרון.

      ד. $F = kQ^2/(8R^2) = 0.45\,\text{N}$.
    solution:
      - kind: given
        text: >-
          $R = 0.1\,\text{m}$, $Q = 2\cdot10^{-6}\,\text{C}$. המטען מפוזר על שטח $4\pi R^2$, ולכן $\sigma = \dfrac{Q}{4\pi R^2}$. וכזכור $k = \dfrac{1}{4\pi\varepsilon_0}$.
      - kind: reasoning
        text: >-
          א. בתוך הקליפה $E = 0$. ממש מחוצה לה $E = kQ/R^2$. מציבים $Q = \sigma\cdot4\pi R^2$ ואת $k$:
          $$E = \frac{1}{4\pi\varepsilon_0}\cdot\frac{\sigma\cdot4\pi R^2}{R^2} = \frac{\sigma}{\varepsilon_0}
          \qquad
          E =\frac{9\cdot10^{9}\cdot2\cdot10^{-6}}{0.1^2} = 1.8\cdot10^{6}\ \text{N/C}$$
      - kind: reasoning
        text: >-
          ב. הפיסה, כמו לוח אינסופי, יוצרת ממש לידה שדה $\sigma/2\varepsilon_0$ הרחק ממנה: בצד החיצוני החוצה מהמרכז, ובצד הפנימי אל המרכז. נסמן ב-$E_r$ את השדה של שאר הקליפה במקום הפיסה (החוצה חיובי). מאיפה באה הקפיצה של השדה, מאפס ממש בפנים ל-$\sigma/\varepsilon_0$ ממש בחוץ? מהפיסה עצמה: כמו לוח אינסופי, היא נותנת $\sigma/2\varepsilon_0$ לכל צד, בכיוונים מנוגדים, ולכן השדה שלה משתנה ב-$\sigma/\varepsilon_0$ כשעוברים דרכה. כשעוברים מצד אחד של הפיסה לצד השני, לא עוברים דרך שום חלק אחר של הקליפה. לכן השדה של שאר הקליפה לא קופץ שם, והוא זהה משני צדי הפיסה. סופרפוזיציה ממש בתוך הקליפה, שם השדה הכולל אפס:
          $$E_r - \frac{\sigma}{2\varepsilon_0} = 0$$
          וממש מחוצה לה, שם השדה הכולל $\sigma/\varepsilon_0$:
          $$E_r + \frac{\sigma}{2\varepsilon_0} = \frac{\sigma}{\varepsilon_0}$$
          שתי המשוואות נותנות $E_r = \sigma/2\varepsilon_0$, החוצה. הפיסה לא דוחפת את עצמה, ולכן הכוח עליה נובע רק מ-$E_r$:
          $$\Delta F = (\sigma\,\Delta A)\cdot\frac{\sigma}{2\varepsilon_0} = \frac{\sigma^2}{2\varepsilon_0}\,\Delta A$$
          הרחק מהמרכז, בניצב לקליפה.
      - kind: reasoning
        text: >-
          ג. לכל פיסה של חצי הכדור, נסמן ב-$\theta$ את הזווית בין האנך שלה (שמצביע הרחק מהמרכז) לבין ציר הסימטריה. הרכיב של הכוח לאורך הציר הוא $\dfrac{\sigma^2}{2\varepsilon_0}\,\Delta A\cos\theta$. הרכיבים הניצבים לציר מתבטלים בזוגות, מפיסות שמשני צדי הציר. לכן:
          $$F = \frac{\sigma^2}{2\varepsilon_0}\sum \Delta A\cos\theta$$
      - kind: reasoning
        text: >-
          את הסכום מוצאים בעזרת שטף. נדמיין שדה אחיד $E_u$ לאורך הציר. השטף שלו דרך חצי הכדור הוא $E_u\sum\Delta A\cos\theta$. חצי הכדור והעיגול השטוח ברדיוס $R$ שסוגר אותו יוצרים יחד משטח סגור, ובשדה הדמיוני אין בתוכו מטען, ולכן השטף הכולל דרכו אפס: מה שנכנס דרך העיגול יוצא דרך חצי הכדור. השטף דרך העיגול הוא $E_u\cdot\pi R^2$, ולכן:
          $$E_u\sum\Delta A\cos\theta = E_u\,\pi R^2 \quad\Longrightarrow\quad \sum\Delta A\cos\theta = \pi R^2$$
          ומכאן $F = \dfrac{\sigma^2}{2\varepsilon_0}\cdot\pi R^2$. חצי הכדור בשיווי משקל, ולכן כוח הלחיצה שווה לכוח הדחייה הזה.
      - kind: substitution
        text: >-
          ד. מציבים $\sigma = Q/(4\pi R^2)$ ו-$\varepsilon_0 = 1/(4\pi k)$ ומצמצמים:
          $$F = \frac{\pi R^2}{2\varepsilon_0}\cdot\frac{Q^2}{16\pi^2R^4} = \frac{4\pi k\,\pi R^2\,Q^2}{32\pi^2R^4} = \frac{kQ^2}{8R^2}$$
          $$F = \frac{9\cdot10^{9}\cdot(2\cdot10^{-6})^2}{8\cdot0.1^2} = 0.45\ \text{N}$$
          בדיקה במספרים: $\sigma = 1.59\cdot10^{-5}\,\text{C/m}^2$, והלחץ $\sigma^2/2\varepsilon_0 \approx 14.3\,\text{N/m}^2$, כפול $\pi R^2 = 0.0314\,\text{m}^2$, נותן $0.45\,\text{N}$.
      - kind: result
        text: >-
          כדי להחזיק את שני חצאי הכדור צמודים צריך כוח $F = \dfrac{\sigma^2}{2\varepsilon_0}\pi R^2 = \dfrac{kQ^2}{8R^2} \approx 0.45\,\text{N}$. בפרט $F$ ביחס ישר ל-$\sigma^2R^2/\varepsilon_0$.
