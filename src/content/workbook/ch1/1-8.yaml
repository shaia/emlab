# Workbook, lesson 1.8 (applications of Gauss's law). Format and rules: see .claude/CLAUDE.md, "Worked examples, workbook".
# Every number was recomputed with src/physics (shellField, planeField, parallelPlatesField, constants);
# students see ε₀ = 8.85·10⁻¹², and the engine's derived ε₀ changes no rounded value here.
# In a >- block, consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '1.8'
practice:
  - id: W-1.8-01
    level: basic
    qualitative: false
    objectives: [OBJ-1.8-2]
    prompt: >-
      קליפה כדורית דקה, שרדיוסה $5$ ס״מ, טעונה באופן אחיד. במרחק $15$ ס״מ ממרכזה השדה הוא $4\cdot10^{5}\,\text{N/C}$, והוא מצביע הרחק מהמרכז.

      א. מה מטען הקליפה (גודל וסימן)?

      ב. מה השדה בנקודה שנמצאת $3$ ס״מ ממרכז הקליפה?
    answer: >-
      א. $Q = +1\,\mu\text{C}$.

      ב. אפס.
    solution:
      - kind: given
        text: >-
          $R = 0.05\,\text{m}$. בנקודה שבה מודדים $r = 0.15\,\text{m}$, ושם $E = 4\cdot10^{5}\,\text{N/C}$, הרחק מהמרכז. $k = 9\cdot10^{9}\,\text{N}\cdot\text{m}^2/\text{C}^2$.
      - kind: formula
        text: >-
          הנקודה מחוץ לקליפה, כי $0.15 > 0.05$. מחוץ לקליפה השדה כמו של מטען נקודתי במרכז: $E = \dfrac{k|Q|}{r^2}$, כאשר $r$ נמדד מהמרכז.
      - kind: manipulation
        text: >-
          מכפילים את שני האגפים ב-$r^2$ ומחלקים ב-$k$, כדי לבודד את המטען:
          $$|Q| = \frac{E\,r^2}{k}$$
      - kind: substitution
        text: >-
          $$|Q| = \frac{4\cdot10^{5}\cdot0.15^2}{9\cdot10^{9}} = 1\cdot10^{-6}\ \text{C}$$
          השדה מצביע הרחק מהמרכז, ולכן המטען חיובי.
      - kind: reasoning
        text: >-
          ב. $3$ ס״מ קטן מהרדיוס, ולכן הנקודה בתוך הקליפה. משטח גאוס כדורי דרכה לא כולא שום מטען, והסימטריה מחייבת שדה אפס.
      - kind: result
        text: >-
          א. $Q = +1\cdot10^{-6}\,\text{C} = +1\,\mu\text{C}$.

          ב. בתוך הקליפה $E = 0$.

  - id: W-1.8-02
    level: basic
    qualitative: true
    objectives: [OBJ-1.8-1]
    prompt: >-
      על קליפה כדורית דקה, שרדיוסה $R$, מפוזר מטען חיובי $Q$, אבל **לא** באופן אחיד: על החצי העליון שלה יש יותר מטען מאשר על החצי התחתון. משטח גאוס הוא כדור שרדיוסו $2R$, באותו מרכז.

      א. מה השטף החשמלי הכולל דרך משטח הגאוס?

      ב. תלמיד ממשיך: "השטף הוא $E\cdot4\pi(2R)^2$, ולכן בכל נקודה על משטח הגאוס $E = kQ/(2R)^2$". קבעו ונמקו: האם הוא צודק?
    answer: >-
      א. $\Phi = Q/\varepsilon_0$.

      ב. לא. בלי סימטריה כדורית השדה על המשטח לא קבוע בגודלו ולא ניצב לו בכל נקודה, ולכן אי אפשר לחלץ אותו מהשטף.
    solution:
      - kind: formula
        text: >-
          חוק גאוס, $\Phi = q/\varepsilon_0$, נכון לכל משטח סגור ולכל התפלגות מטען.
      - kind: reasoning
        text: >-
          א. הכדור שרדיוסו $2R$ כולא את כל הקליפה, ולכן המטען הכלוא הוא $Q$. איך המטען מפוזר על הקליפה לא משנה את השטף הכולל.
      - kind: reasoning
        text: >-
          ב. כדי לכתוב את השטף כ-$E\cdot A$, השדה צריך להיות קבוע בגודלו על כל המשטח וניצב לו. זה נכון רק כשהמטען נראה אותו דבר מכל כיוון. כאן החצי העליון טעון יותר, ולכן מעל הקליפה השדה חזק יותר מאשר מתחתיה, והוא גם לא מצביע בדיוק הרחק מהמרכז.
          לכן אין ערך אחד של $E$ על המשטח. חוק גאוס נותן כאן רק את השטף הכולל, והערך $kQ/(2R)^2$ אינו השדה בנקודה מסוימת על המשטח.
      - kind: result
        text: >-
          א. $\Phi = Q/\varepsilon_0$, בדיוק כמו בקליפה אחידה.

          ב. התלמיד טועה: השטף נכון, אבל בלי סימטריה אי אפשר להסיק ממנו את השדה בכל נקודה.

  - id: W-1.8-03
    level: basic
    qualitative: false
    objectives: [OBJ-1.8-3]
    prompt: >-
      לוח דק וריבועי מחומר מבודד, שאורך צלעו $3\,\text{m}$, טעון באופן אחיד. ליד מרכז הלוח, במרחק קטן ממנו, השדה הוא $6\cdot10^{4}\,\text{N/C}$, והוא מצביע **אל** הלוח.
      מה צפיפות המטען המשטחית של הלוח (גודל וסימן), ומה המטען הכולל שעליו? ($\varepsilon_0 = 8.85\cdot10^{-12}\,\text{C}^2/(\text{N}\cdot\text{m}^2)$)
    answer: '$\sigma \approx -1.06\cdot10^{-6}\,\text{C/m}^2$, והמטען הכולל $q \approx -9.6\cdot10^{-6}\,\text{C}$'
    solution:
      - kind: given
        text: >-
          $E = 6\cdot10^{4}\,\text{N/C}$, אל הלוח. שטח הלוח $A = 3\,\text{m}\cdot3\,\text{m} = 9\,\text{m}^2$.
          הנקודה קרובה ללוח ורחוקה מקצותיו, ולכן משתמשים בדגם של לוח אינסופי.
      - kind: formula
        text: >-
          $E = \dfrac{|\sigma|}{2\varepsilon_0}$
      - kind: manipulation
        text: >-
          מכפילים את שני האגפים ב-$2\varepsilon_0$:
          $$|\sigma| = 2\varepsilon_0\,E$$
      - kind: substitution
        text: >-
          $$|\sigma| = 2\cdot8.85\cdot10^{-12}\cdot6\cdot10^{4} = 1.062\cdot10^{-6} \approx 1.06\cdot10^{-6}\ \text{C/m}^2$$
          בשלב הבא מציבים את הערך הלא מעוגל, $1.062\cdot10^{-6}$, כדי שהעיגול לא יצטבר.
      - kind: reasoning
        text: >-
          השדה מצביע אל הלוח, ולכן הלוח שלילי: $\sigma = -1.06\cdot10^{-6}\,\text{C/m}^2$.
      - kind: substitution
        text: >-
          המטען הכולל הוא הצפיפות כפול השטח:
          $$q = \sigma A = -1.062\cdot10^{-6}\cdot9 \approx -9.6\cdot10^{-6}\ \text{C}$$
      - kind: result
        text: >-
          $\sigma \approx -1.06\cdot10^{-6}\,\text{C/m}^2$, והמטען הכולל על הלוח $q \approx -9.6\,\mu\text{C}$.

  - id: W-1.8-04
    level: mid
    qualitative: false
    objectives: [OBJ-1.8-2]
    prompt: >-
      קליפה כדורית דקה, שרדיוסה $15$ ס״מ, טעונה באופן אחיד במטען חיובי. ממש מחוץ לפני הקליפה השדה הוא $2\cdot10^{6}\,\text{N/C}$.

      א. מה מטען הקליפה?

      ב. מה השדה במרחק $45$ ס״מ מהמרכז?

      ג. באיזה מרחק מהמרכז השדה הוא $5\cdot10^{5}\,\text{N/C}$?

      ד. מה השדה במרחק $10$ ס״מ מהמרכז?
    answer: >-
      א. $Q = 5\,\mu\text{C}$.

      ב. כ-$2.2\cdot10^{5}\,\text{N/C}$, הרחק מהמרכז.

      ג. $30$ ס״מ מהמרכז.

      ד. אפס.
    solution:
      - kind: given
        text: >-
          $R = 0.15\,\text{m}$. ממש מחוץ לפני הקליפה $r = R$, ושם $E = 2\cdot10^{6}\,\text{N/C}$.
      - kind: formula
        text: >-
          מחוץ לקליפה $E = \dfrac{kQ}{r^2}$, ו-$r$ נמדד מהמרכז. ממש מחוץ לפני הקליפה מציבים $r = R$.
      - kind: manipulation
        text: >-
          א. מכפילים ב-$R^2$ ומחלקים ב-$k$:
          $$Q = \frac{E\,R^2}{k} = \frac{2\cdot10^{6}\cdot0.15^2}{9\cdot10^{9}} = 5\cdot10^{-6}\ \text{C}$$
      - kind: reasoning
        text: >-
          ב. $45$ ס״מ הם פי 3 מהרדיוס. מחוץ לקליפה השדה יורד כמו $1/r^2$, ולכן הוא קטן פי $3^2 = 9$:
          $$E = \frac{2\cdot10^{6}}{9} \approx 2.2\cdot10^{5}\ \text{N/C}$$
          בדיקה בהצבה ישירה: $9\cdot10^{9}\cdot5\cdot10^{-6}/0.45^2 \approx 2.2\cdot10^{5}\,\text{N/C}$.
      - kind: reasoning
        text: >-
          ג. $5\cdot10^{5}$ הוא רבע מ-$2\cdot10^{6}$. כדי שהשדה יקטן פי 4, $r^2$ צריך לגדול פי 4, כלומר $r$ גדל פי 2: $r = 2R = 30$ ס״מ.
          בדיקה: $9\cdot10^{9}\cdot5\cdot10^{-6}/0.3^2 = 5\cdot10^{5}\,\text{N/C}$.
      - kind: reasoning
        text: >-
          ד. $10$ ס״מ קטן מהרדיוס, ולכן הנקודה בתוך הקליפה, והשדה שם אפס. שימו לב: השדה קופץ מאפס ממש בתוך הקליפה ל-$2\cdot10^{6}\,\text{N/C}$ ממש מחוצה לה.
      - kind: result
        text: >-
          א. $Q = 5\,\mu\text{C}$.

          ב. $E \approx 2.2\cdot10^{5}\,\text{N/C}$, הרחק מהמרכז.

          ג. $r = 30$ ס״מ.

          ד. $E = 0$.

  - id: W-1.8-05
    level: mid
    qualitative: true
    objectives: [OBJ-1.8-1, OBJ-1.8-3]
    prompt: >-
      בפיתוח השדה של לוח אינסופי, גליל הגאוס חצה את הלוח. עכשיו בוחרים גליל שכולו בצד אחד של לוח חיובי: שני הבסיסים שלו מקבילים ללוח, האחד במרחק $1$ ס״מ ממנו והשני במרחק $5$ ס״מ, ושטח כל בסיס $A$.

      א. מה השטף הכולל דרך הגליל? נמקו.

      ב. הראו מכך שהשדה בשני הבסיסים שווה בגודלו.

      ג. מה המסקנה על השדה של לוח אינסופי? מה הסימטריה לבדה לא קבעה, והגליל הזה קובע?
    answer: >-
      א. אפס, כי הגליל לא כולא מטען.

      ב. השדה נכנס דרך הבסיס הקרוב ויוצא דרך הרחוק, ולכן $E_2A - E_1A = 0$, כלומר $E_1 = E_2$.

      ג. השדה של לוח אינסופי לא תלוי במרחק מהלוח.
    solution:
      - kind: reasoning
        text: >-
          א. הגליל כולו בצד אחד של הלוח, ואף חלק של הלוח לא בתוכו. המטען הכלוא אפס, ולפי חוק גאוס גם השטף הכולל אפס.
      - kind: reasoning
        text: >-
          ב. מהסימטריה, השדה של הלוח ניצב ללוח. לכן הוא מקביל לדופן הגליל, והשטף דרך הדופן אפס.
          הלוח חיובי, ולכן השדה מצביע הרחק ממנו. דרך הבסיס הקרוב (שבו השדה $E_1$) הוא **נכנס** לגליל, והשטף שם $-E_1A$. דרך הבסיס הרחוק (שבו השדה $E_2$) הוא **יוצא**, והשטף שם $+E_2A$.
      - kind: manipulation
        text: >-
          השטף הכולל אפס:
          $$E_2A - E_1A + 0 = 0 \quad\Longrightarrow\quad E_1 = E_2$$
      - kind: reasoning
        text: >-
          ג. שני המרחקים נבחרו כרצוננו, ולכן השדה זהה בכל מרחק מהלוח. הסימטריה קבעה רק את הכיוון (ניצב ללוח) ואת השוויון בין שתי נקודות שהן תמונת ראי זו של זו. היא לא קבעה אם השדה נחלש עם המרחק. הגליל הזה קובע שלא, עוד בלי לדעת את $\sigma$.
      - kind: result
        text: >-
          א. השטף אפס.

          ב. $E_1 = E_2$.

          ג. השדה של לוח אינסופי קבוע בכל מרחק מהלוח, וזה נובע מחוק גאוס ומהסימטריה בלבד.

  - id: W-1.8-06
    level: mid
    qualitative: false
    objectives: [OBJ-1.8-2]
    prompt: >-
      קליפה כדורית טעונה באופן אחיד, ורדיוסה לא ידוע. במרחק $10$ ס״מ מ**פני** הקליפה השדה הוא $1.8\cdot10^{6}\,\text{N/C}$, ובמרחק $30$ ס״מ מפני הקליפה הוא $4.5\cdot10^{5}\,\text{N/C}$. בשתי הנקודות השדה מצביע אל מרכז הקליפה.
      מצאו את רדיוס הקליפה ואת מטענה (גודל וסימן).
    answer: '$R = 0.1\,\text{m}$ ו-$Q = -8\,\mu\text{C}$'
    solution:
      - kind: given
        text: >-
          בשתי הנקודות השדה אינו אפס, ולכן שתיהן מחוץ לקליפה. המרחקים מהמרכז: $r_1 = R + 0.1\,\text{m}$, שם $E_1 = 1.8\cdot10^{6}\,\text{N/C}$, ו-$r_2 = R + 0.3\,\text{m}$, שם $E_2 = 4.5\cdot10^{5}\,\text{N/C}$.
      - kind: formula
        text: >-
          מחוץ לקליפה $E = \dfrac{k|Q|}{r^2}$, ו-$r$ נמדד מ**המרכז**, לא מפני הקליפה.
      - kind: manipulation
        text: >-
          מחלקים את שתי המשוואות זו בזו, כדי שהמטען ו-$k$ יצטמצמו:
          $$\frac{E_1}{E_2} = \frac{k|Q|/r_1^2}{k|Q|/r_2^2} = \frac{r_2^2}{r_1^2}$$
          ומציבים את השדות הנתונים:
          $$\frac{r_2^2}{r_1^2} = \frac{1.8\cdot10^{6}}{4.5\cdot10^{5}} = 4$$
          ולכן $r_2 = 2r_1$ (שני המרחקים חיוביים).
      - kind: manipulation
        text: >-
          מציבים את המרחקים מהמרכז:
          $$R + 0.3 = 2(R + 0.1) = 2R + 0.2 \quad\Longrightarrow\quad R = 0.1\ \text{m}$$
      - kind: substitution
        text: >-
          עכשיו $r_1 = 0.2\,\text{m}$, ומבודדים את המטען (מכפילים ב-$r_1^2$ ומחלקים ב-$k$):
          $$|Q| = \frac{E_1\,r_1^2}{k} = \frac{1.8\cdot10^{6}\cdot0.2^2}{9\cdot10^{9}} = 8\cdot10^{-6}\ \text{C}$$
          השדה מצביע אל המרכז, ולכן המטען שלילי.
      - kind: reasoning
        text: >-
          בדיקה: ב-$r_2 = 0.4\,\text{m}$ מקבלים $9\cdot10^{9}\cdot8\cdot10^{-6}/0.4^2 = 4.5\cdot10^{5}\,\text{N/C}$, כמו בנתון. מי שמציב את המרחקים מפני הקליפה, $0.1$ ו-$0.3$, מצפה ליחס $9$ ולא $4$, ונתקע.
      - kind: result
        text: >-
          רדיוס הקליפה $R = 0.1\,\text{m} = 10$ ס״מ, ומטענה $Q = -8\,\mu\text{C}$.

  - id: W-1.8-07
    level: mid
    qualitative: true
    objectives: [OBJ-1.8-2]
    prompt: >-
      שתי קליפות כדוריות דקות טעונות באופן אחיד באותו מטען חיובי $Q$. רדיוס הקליפה הקטנה $R$, ורדיוס הגדולה $3R$. הקליפות רחוקות מאוד זו מזו, ובכל סעיף מתייחסים רק לשדה של קליפה אחת.

      א. משווים את השדה בנקודה שמרחקה $2R$ ממרכז הקליפה הקטנה לשדה בנקודה שמרחקה $2R$ ממרכז הקליפה הגדולה. באיזו נקודה השדה חזק יותר? נמקו.

      ב. ומה אם המרחק מכל מרכז הוא $4R$?

      ג. תלמיד אומר: "בכל נקודה שמחוץ לשתי הקליפות, כלומר במרחק $r$ שגדול מ-$3R$, השדה של הקליפה הגדולה חלש יותר מהשדה של הקטנה באותו מרחק $r$ ממרכזה, כי המטען שלה פרוס על שטח גדול יותר". קבעו ונמקו.
    answer: >-
      א. ליד הקליפה הקטנה, $kQ/(4R^2)$. הנקודה שבמרחק $2R$ ממרכז הגדולה נמצאת בתוך הקליפה הגדולה, ולכן שם השדה אפס.

      ב. השדות שווים, $kQ/(16R^2)$.

      ג. התלמיד טועה: מחוץ לשתי הקליפות, באותו מרחק $r$ מהמרכז, השדות שווים, $kQ/r^2$.
    solution:
      - kind: formula
        text: >-
          לכל קליפה: בתוכה $E = 0$, ומחוצה לה $E = kQ/r^2$, כאשר $r$ נמדד ממרכזה.
      - kind: reasoning
        text: >-
          א. $2R$ גדול מרדיוס הקליפה הקטנה, ולכן הנקודה מחוצה לה: $E = kQ/(2R)^2 = kQ/(4R^2)$. אבל $2R$ קטן מרדיוס הגדולה, $3R$, ולכן הנקודה השנייה בתוך הקליפה הגדולה, ושם $E = 0$.
      - kind: reasoning
        text: >-
          ב. $4R$ גדול משני הרדיוסים, ולכן שתי הנקודות מחוץ לקליפות. מחוץ לקליפה השדה תלוי רק במטען ובמרחק מהמרכז, לא ברדיוס: בשתיהן $E = kQ/(4R)^2 = kQ/(16R^2)$.
      - kind: reasoning
        text: >-
          ג. בנקודה שמחוץ לקליפה, משטח גאוס כדורי דרכה כולא את כל המטען $Q$, בלי קשר לרדיוס הקליפה. לכן השדה של כל אחת משתי הקליפות במרחק $r$ ממרכזה הוא $kQ/r^2$, כמו של מטען נקודתי $Q$ במרכז. באותו מרחק $r$ השדות שווים, ולא חלש יותר אצל הגדולה. סעיף ב הוא דוגמה אחת לכך, עם $r = 4R$.
      - kind: reasoning
        text: >-
          מאיפה באה הטעות? ממש מחוץ לפני הקליפה הגדולה השדה הוא $kQ/(9R^2)$, חלש פי 9 מהשדה ממש מחוץ לפני הקטנה, $kQ/R^2$. אבל שתי הנקודות האלה לא נמצאות באותו מרחק מהמרכז: הראשונה רחוקה פי 3. ההבדל נובע מהמרחק מהמרכז, לא מכך שהמטען פרוס על שטח גדול יותר.
      - kind: result
        text: >-
          א. במרחק $2R$ השדה חזק יותר ליד הקליפה הקטנה, $kQ/(4R^2)$ לעומת אפס בתוך הגדולה.

          ב. במרחק $4R$ השדות שווים, $kQ/(16R^2)$.

          ג. התלמיד טועה: מחוץ לקליפה השדה תלוי רק במטען ובמרחק מהמרכז, לא ברדיוס הקליפה, ולכן באותו מרחק השדות שווים.

  - id: W-1.8-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.8-3]
    prompt: >-
      שני לוחות מקבילים גדולים טעונים בצפיפויות מטען מנוגדות, שגודלן $\sigma = 1.77\,\mu\text{C/m}^2$. המרחק בין הלוחות $2$ ס״מ. פרוטון משתחרר ממנוחה ליד הלוח החיובי.
      ($e = 1.6\cdot10^{-19}\,\text{C}$, $m_p = 1.67\cdot10^{-27}\,\text{kg}$, $\varepsilon_0 = 8.85\cdot10^{-12}\,\text{C}^2/(\text{N}\cdot\text{m}^2)$, $g = 10\,\text{m/s}^2$)

      א. מה השדה בין הלוחות?

      ב. מה תאוצת הפרוטון? הראו שאפשר להזניח את כוח הכובד.

      ג. כמה זמן נמשכת התנועה עד הלוח השלילי, ומה מהירות הפרוטון כשהוא מגיע אליו?

      ד. מרחיקים את הלוחות זה מזה, כך שהמרחק ביניהם $4$ ס״מ, וצפיפות המטען לא משתנה. פי כמה גדלה המהירות שבה הפרוטון מגיע ללוח השלילי?
    answer: >-
      א. $E = 2\cdot10^{5}\,\text{N/C}$, מהלוח החיובי אל השלילי.

      ב. $a \approx 1.9\cdot10^{13}\,\text{m/s}^2$. הכוח החשמלי גדול מכוח הכובד פי כ-$2\cdot10^{12}$.

      ג. $t \approx 4.6\cdot10^{-8}\,\text{s}$ ו-$v \approx 8.8\cdot10^{5}\,\text{m/s}$.

      ד. פי $\sqrt2 \approx 1.41$.
    solution:
      - kind: given
        text: >-
          $\sigma = 1.77\cdot10^{-6}\,\text{C/m}^2$, המרחק בין הלוחות $d = 0.02\,\text{m}$, הפרוטון מתחיל ממנוחה.
      - kind: formula
        text: >-
          א. בין שני לוחות מקבילים עם מטענים מנוגדים: $E = \dfrac{\sigma}{\varepsilon_0}$.
      - kind: substitution
        text: >-
          $$E = \frac{1.77\cdot10^{-6}}{8.85\cdot10^{-12}} = 2\cdot10^{5}\ \text{N/C}$$
          הכיוון מהלוח החיובי אל השלילי, והשדה אחיד בכל האזור שבין הלוחות.
      - kind: substitution
        text: >-
          ב. הכוח החשמלי והתאוצה, לפי החוק השני של ניוטון:
          $$F = eE = 1.6\cdot10^{-19}\cdot2\cdot10^{5} = 3.2\cdot10^{-14}\ \text{N}
          \qquad
          a = \frac{F}{m_p} = \frac{3.2\cdot10^{-14}}{1.67\cdot10^{-27}} \approx 1.9\cdot10^{13}\ \text{m/s}^2$$
          כוח הכובד: $m_p\,g = 1.67\cdot10^{-27}\cdot10 = 1.67\cdot10^{-26}\,\text{N}$, קטן מהכוח החשמלי פי כ-$2\cdot10^{12}$, ולכן מזניחים אותו.
      - kind: manipulation
        text: >-
          ג. הכוח קבוע, ולכן התאוצה קבועה, והפרוטון מתחיל ממנוחה: $d = \tfrac12 a t^2$. מכפילים ב-2 ומחלקים ב-$a$, ואז מוציאים שורש:
          $$t^2 = \frac{2d}{a} \quad\Longrightarrow\quad t = \sqrt{\frac{2d}{a}}$$
      - kind: substitution
        text: >-
          מציבים את הערך הלא מעוגל של התאוצה, $1.916\cdot10^{13}\,\text{m/s}^2$, כדי שהעיגול לא יצטבר:
          $$t = \sqrt{\frac{2\cdot0.02}{1.916\cdot10^{13}}} = 4.569\cdot10^{-8} \approx 4.6\cdot10^{-8}\ \text{s}
          \qquad
          v = a\,t = 1.916\cdot10^{13}\cdot4.569\cdot10^{-8} \approx 8.8\cdot10^{5}\ \text{m/s}$$
          בדיקה: $v^2 = 2ad$ נותן את אותה מהירות.
      - kind: reasoning
        text: >-
          ד. צפיפות המטען לא השתנתה, והשדה בין הלוחות לא תלוי במרחק ביניהם. לכן גם התאוצה לא השתנתה. מ-$v^2 = 2ad$: כשהמרחק גדל פי 2, $v^2$ גדל פי 2, ו-$v$ גדל פי $\sqrt2$: $v \approx 1.24\cdot10^{6}\,\text{m/s}$.
      - kind: result
        text: >-
          א. $E = 2\cdot10^{5}\,\text{N/C}$, מהלוח החיובי אל השלילי.

          ב. $a \approx 1.9\cdot10^{13}\,\text{m/s}^2$, וכוח הכובד זניח.

          ג. $t \approx 4.6\cdot10^{-8}\,\text{s}$ ו-$v \approx 8.8\cdot10^{5}\,\text{m/s}$.

          ד. המהירות גדלה פי $\sqrt2 \approx 1.41$.

  - id: W-1.8-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.8-3]
    prompt: >-
      שני לוחות גדולים ומקבילים, A משמאל ו-B מימין, טעונים באופן אחיד, וצפיפויות המטען שלהם לא ידועות. מודדים את השדה: משמאל ל-A הוא $3.39\cdot10^{5}\,\text{N/C}$ ומצביע שמאלה, ובין הלוחות הוא $1.13\cdot10^{5}\,\text{N/C}$ ומצביע ימינה.
      ($\varepsilon_0 = 8.85\cdot10^{-12}\,\text{C}^2/(\text{N}\cdot\text{m}^2)$)

      א. מצאו את צפיפות המטען (גודל וסימן) של כל לוח.

      ב. מה השדה מימין ל-B?

      ג. קבעו ונמקו: האם התשובות היו משתנות, אילו המדידה משמאל ל-A הייתה במרחק כפול מ-A?
    answer: >-
      א. $\sigma_A = +4\,\mu\text{C/m}^2$ ו-$\sigma_B = +2\,\mu\text{C/m}^2$.

      ב. $3.39\cdot10^{5}\,\text{N/C}$, ימינה.

      ג. לא: השדה של לוח אינסופי לא תלוי במרחק ממנו.
    solution:
      - kind: given
        text: >-
          בוחרים את הכיוון ימינה כחיובי. אז משמאל ל-A השדה $-3.39\cdot10^{5}\,\text{N/C}$, ובין הלוחות $+1.13\cdot10^{5}\,\text{N/C}$.
      - kind: formula
        text: >-
          לוח עם צפיפות $\sigma$ (עם הסימן) יוצר שדה שגודלו $|\sigma|/2\varepsilon_0$. בנקודות שמימינו השדה שלו הוא $+\sigma/2\varepsilon_0$, ובנקודות שמשמאלו $-\sigma/2\varepsilon_0$. כך, ללוח חיובי השדה מצביע הרחק ממנו, וללוח שלילי אליו.
      - kind: manipulation
        text: >-
          משמאל ל-A הנקודה משמאל לשני הלוחות, ובין הלוחות היא מימין ל-A ומשמאל ל-B. מחברים בכל אזור (סופרפוזיציה):
          $$-\frac{\sigma_A + \sigma_B}{2\varepsilon_0} = -3.39\cdot10^{5}
          \qquad
          \frac{\sigma_A - \sigma_B}{2\varepsilon_0} = 1.13\cdot10^{5}$$
          מכפילים כל משוואה ב-$2\varepsilon_0$ (ואת הראשונה גם ב-$-1$):
      - kind: substitution
        text: >-
          $$\sigma_A + \sigma_B = 2\cdot8.85\cdot10^{-12}\cdot3.39\cdot10^{5} = 6.0\cdot10^{-6}\ \text{C/m}^2$$
          $$\sigma_A - \sigma_B = 2\cdot8.85\cdot10^{-12}\cdot1.13\cdot10^{5} = 2.0\cdot10^{-6}\ \text{C/m}^2$$
      - kind: manipulation
        text: >-
          מחברים את שתי המשוואות: $2\sigma_A = 8\cdot10^{-6}$, ולכן $\sigma_A = 4\cdot10^{-6}\,\text{C/m}^2$. מחסרים אותן: $2\sigma_B = 4\cdot10^{-6}$, ולכן $\sigma_B = 2\cdot10^{-6}\,\text{C/m}^2$. שני הלוחות חיוביים.
      - kind: reasoning
        text: >-
          בדיקה בלי סימנים: בין הלוחות A דוחף ימינה ו-B דוחף שמאלה, והשדה ימינה, כי A טעון יותר. משמאל לשניהם שניהם דוחפים שמאלה, ולכן שם השדה חזק יותר.
      - kind: substitution
        text: >-
          ב. מימין ל-B הנקודה מימין לשני הלוחות:
          $$E = \frac{\sigma_A + \sigma_B}{2\varepsilon_0} = \frac{6.0\cdot10^{-6}}{2\cdot8.85\cdot10^{-12}} = 3.39\cdot10^{5}\ \text{N/C}$$
          חיובי, כלומר ימינה.
      - kind: reasoning
        text: >-
          ג. השדה של כל לוח אינסופי לא תלוי במרחק ממנו, ולכן בכל נקודה משמאל ל-A, קרובה או רחוקה, היו מודדים אותו שדה. שום תשובה לא הייתה משתנה.
      - kind: result
        text: >-
          א. $\sigma_A = +4\,\mu\text{C/m}^2$ ו-$\sigma_B = +2\,\mu\text{C/m}^2$.

          ב. מימין ל-B השדה $3.39\cdot10^{5}\,\text{N/C}$, ימינה.

          ג. התשובות לא היו משתנות.

  - id: W-1.8-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.8-1, OBJ-1.8-2]
    prompt: >-
      שתי קליפות כדוריות דקות ומבודדות, באותו מרכז, טעונות כל אחת באופן אחיד. רדיוס הפנימית $10$ ס״מ, ורדיוס החיצונית $20$ ס״מ. המטענים לא ידועים. מודדים: במרחק $15$ ס״מ מהמרכז השדה $1.6\cdot10^{6}\,\text{N/C}$, הרחק מהמרכז, ובמרחק $40$ ס״מ מהמרכז השדה $2.25\cdot10^{5}\,\text{N/C}$, אל המרכז.

      א. איזה משטח גאוס מתאים כאן, ולמה? הסבירו למה השדה במרחק $15$ ס״מ תלוי רק בקליפה הפנימית.

      ב. מצאו את המטען של כל קליפה.

      ג. מה השדה במרחק $5$ ס״מ מהמרכז?

      ד. מכפילים את מטען הקליפה הפנימית, ומטען החיצונית לא משתנה. מה השדה עכשיו במרחק $15$ ס״מ, ומה במרחק $40$ ס״מ?
    answer: >-
      א. כדור באותו מרכז. ב-$15$ ס״מ הנקודה בתוך הקליפה החיצונית, שהשדה שלה אפס בכל נקודה בתוכה, ולכן נשאר רק השדה של הפנימית.

      ב. $Q_1 = +4\,\mu\text{C}$ (פנימית) ו-$Q_2 = -8\,\mu\text{C}$ (חיצונית).

      ג. אפס.

      ד. ב-$15$ ס״מ: $3.2\cdot10^{6}\,\text{N/C}$, הרחק מהמרכז. ב-$40$ ס״מ: אפס.
    solution:
      - kind: reasoning
        text: >-
          א. שתי הקליפות נראות אותו דבר מכל כיוון סביב המרכז המשותף, ולכן השדה רדיאלי ותלוי רק במרחק $r$ מהמרכז. משטח גאוס מתאים הוא כדור באותו מרכז: עליו השדה ניצב למשטח ובגודל זהה, ו-$E\cdot4\pi r^2 = q/\varepsilon_0$, כלומר $E = kq/r^2$, כאשר $q$ הוא המטען הכלוא.
          כדור ברדיוס $15$ ס״מ כולא את הקליפה הפנימית בלבד. אבל זה לבדו לא מספיק: מטען שמחוץ למשטח גאוס יכול באופן כללי לשנות את השדה עליו (שיעור 1.7). הסיבה שהקליפה החיצונית לא תורמת כלום ב-$15$ ס״מ היא שהנקודה **בתוכה**, והשדה של קליפה כדורית אחידה הוא אפס בכל נקודה בתוכה. לכן השדה שם הוא רק השדה של הקליפה הפנימית.
      - kind: manipulation
        text: >-
          ב. מבודדים את המטען הכלוא (מכפילים ב-$r^2$ ומחלקים ב-$k$): $q = E\,r^2/k$.
      - kind: substitution
        text: >-
          ב-$r = 0.15\,\text{m}$ המטען הכלוא הוא $Q_1$, והשדה הרחק מהמרכז, ולכן $Q_1$ חיובי:
          $$Q_1 = \frac{1.6\cdot10^{6}\cdot0.15^2}{9\cdot10^{9}} = 4\cdot10^{-6}\ \text{C}$$
          ב-$r = 0.4\,\text{m}$ הכדור כולא את שתי הקליפות, והשדה אל המרכז, ולכן המטען הכלוא שלילי:
          $$|Q_1 + Q_2| = \frac{2.25\cdot10^{5}\cdot0.4^2}{9\cdot10^{9}} = 4\cdot10^{-6}\ \text{C}
          \quad\Longrightarrow\quad Q_1 + Q_2 = -4\cdot10^{-6}\ \text{C}$$
      - kind: manipulation
        text: >-
          מבודדים את מטען הקליפה החיצונית:
          $$Q_2 = (Q_1 + Q_2) - Q_1 = -4\cdot10^{-6} - 4\cdot10^{-6} = -8\cdot10^{-6}\ \text{C}$$
      - kind: reasoning
        text: >-
          ג. $5$ ס״מ קטן משני הרדיוסים. כדור גאוס ברדיוס הזה לא כולא מטען, ולכן $E = 0$.
      - kind: reasoning
        text: >-
          ד. ב-$15$ ס״מ המטען הכלוא הוא רק הפנימית, שהוכפל, ולכן גם השדה מוכפל: $3.2\cdot10^{6}\,\text{N/C}$, הרחק מהמרכז. ב-$40$ ס״מ המטען הכלוא הוא $8 - 8 = 0\,\mu\text{C}$, ולכן השדה שם אפס.
      - kind: result
        text: >-
          א. כדור באותו מרכז. ב-$15$ ס״מ השדה הוא רק של הקליפה הפנימית, כי השדה של החיצונית אפס בכל נקודה בתוכה.

          ב. $Q_1 = +4\,\mu\text{C}$ ו-$Q_2 = -8\,\mu\text{C}$.

          ג. $E = 0$.

          ד. ב-$15$ ס״מ $E = 3.2\cdot10^{6}\,\text{N/C}$ הרחק מהמרכז, וב-$40$ ס״מ $E = 0$.

challenge:
  - id: W-1.8-c1
    stars: 1
    objectives: [OBJ-1.8-3]
    prompt: >-
      שני לוחות דקים ואינסופיים, כל אחד טעון באופן אחיד בצפיפות $\sigma = 2\,\mu\text{C/m}^2$, נחתכים לאורך קו ישר. במבט לאורך קו החיתוך כל לוח נראה כקו ישר שעובר דרך נקודה O: לוח אחד אופקי, והשני נוטה ב-$30^\circ$ מעל האופק, כשהוא עולה ימינה. הלוחות מחלקים את המרחב לארבעה אזורים. מתעניינים באזור הצר שמימין ל-O, שבין הלוח האופקי ללוח הנטוי (זווית הפתח שלו $30^\circ$).
      ($\varepsilon_0 = 8.85\cdot10^{-12}\,\text{C}^2/(\text{N}\cdot\text{m}^2)$)

      א. מה הכיוון של השדה של כל לוח באזור הזה?

      ב. מצאו את גודל השדה השקול באזור ואת כיוונו.

      ג. הסבירו בעזרת סימטריה למה כיוון השדה השקול יצא כפי שיצא.
