      שני קווים עבים יוצאים מהנקודה O: אחד אופקי, והשני עולה ימינה בזווית של 30 מעלות מעליו. אלה שני הלוחות במבט לאורך קו החיתוך. האזור הצר שביניהם, מימין ל-O, מוצלל, וקו מקווקו חוצה את הזווית שלו. ליד כל לוח כתוב פלוס סיגמה.
    answer: >-
      א. של הלוח האופקי: למעלה. של הלוח הנטוי: ניצב לו, למטה וימינה (ב-$60^\circ$ מתחת לאופק).

      ב. $E \approx 5.8\cdot10^{4}\,\text{N/C}$, ב-$15^\circ$ מעל האופק, כלומר לאורך חוצה הזווית של האזור, הרחק מ-O.

      ג. שיקוף בחוצה הזווית מחליף בין שני הלוחות ומשאיר את המערכת כפי שהיא, ולכן השדה על החוצה חייב להיות לאורכו.
    solution:
      - kind: given
        text: >-
          לכל לוח $E_0 = \dfrac{\sigma}{2\varepsilon_0} = \dfrac{2\cdot10^{-6}}{2\cdot8.85\cdot10^{-12}} = 1.13\cdot10^{5}\,\text{N/C}$, בכל מרחק. ציר x ימינה וציר y למעלה. נקודה באזור נמצאת מעל הלוח האופקי ומתחת ללוח הנטוי.
      - kind: reasoning
        text: >-
          א. השדה של לוח חיובי ניצב לו ומצביע הרחק ממנו. הנקודה מעל הלוח האופקי, ולכן השדה שלו מצביע הרחק ממנו, כלומר **למעלה**. הנקודה מתחת ללוח הנטוי, ולכן השדה שלו מצביע הרחק ממנו, בניצב לו, **למטה וימינה**: הלוח נוטה ב-$30^\circ$ מעל האופק, ולכן הניצב לו נוטה ב-$60^\circ$ מתחת לאופק.
      - kind: substitution
        text: >-
          ב. רכיבים:
          $$\vec E_1 = (0,\ E_0) \qquad \vec E_2 = (E_0\cos60^\circ,\ -E_0\sin60^\circ) = (0.5\,E_0,\ -0.866\,E_0)$$
          $$E_x = 0.5\cdot1.13\cdot10^{5} \approx 5.65\cdot10^{4}\ \text{N/C}
          \qquad
          E_y = (1 - 0.866)\cdot1.13\cdot10^{5} \approx 1.51\cdot10^{4}\ \text{N/C}$$
      - kind: substitution
        text: >-
          $$E = \sqrt{E_x^2 + E_y^2} = \sqrt{(5.65\cdot10^{4})^2 + (1.51\cdot10^{4})^2} \approx 5.85\cdot10^{4}\ \text{N/C}
          \qquad
          \tan\alpha = \frac{E_y}{E_x} = \frac{1.51}{5.65} \approx 0.268 \ \Longrightarrow\ \alpha \approx 15^\circ$$
          השדה נוטה ב-$15^\circ$ מעל האופק, בדיוק באמצע בין שני הלוחות, ומצביע הרחק מ-O, אל הפתח של האזור.
      - kind: reasoning
        text: >-
          בדיקה: שני השדות שווים בגודלם. האחד מצביע למעלה, והשני $60^\circ$ מתחת לאופק, ולכן הזווית ביניהם $90^\circ + 60^\circ = 150^\circ$. השקול של שני וקטורים שווים נמצא על חוצה הזווית שביניהם, וגודלו $2E_0\cos75^\circ \approx 0.518\,E_0 \approx 5.85\cdot10^{4}\,\text{N/C}$.
      - kind: reasoning
        text: >-
          ג. שיקוף במישור שחוצה את הזווית שבין הלוחות מעביר את הלוח האופקי למקום של הנטוי ולהפך. שני הלוחות טעונים אותו דבר, ולכן אחרי השיקוף המערכת נראית בדיוק כמו קודם. נקודה על החוצה נשארת במקומה, ולכן גם השדה בה חייב להישאר כפי שהיה. רכיב שניצב לחוצה מתהפך בשיקוף, ולכן הוא חייב להיות אפס: השדה על החוצה מצביע לאורכו. ומאחר שהשדה של לוח אינסופי לא תלוי במרחק, השדה זהה בכל נקודה באזור.
      - kind: result
        text: >-
          השדה באזור הצר אחיד: $E \approx 5.8\cdot10^{4}\,\text{N/C}$, לאורך חוצה הזווית שבין הלוחות ($15^\circ$ מעל האופק), הרחק מקו החיתוך.
