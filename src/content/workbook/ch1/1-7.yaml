# Workbook for lesson 1.7: ten practice problems and two sourced challenge problems.
# Every number recomputed with src/physics (constants.ts: EPS0_DISPLAY, E_CHARGE; gauss.ts: fluxFlat;
# electrostatics.ts: fluxThroughCube, fieldAt3 for face-by-face integrals). Students see ε₀ = 8.85·10⁻¹².

lesson: '1.7'
practice:
  - id: W-1.7-01
    level: basic
    qualitative: false
    objectives: [OBJ-1.7-1]
    prompt: >-
      ביום בהיר יש ליד פני הקרקע שדה חשמלי אחיד בקירוב, של כ-$150\,\text{N/C}$, שמצביע אנכית למטה.
      הגג של מחסן הוא שטוח ואופקי, ושטחו $20\,\text{m}^2$. מה השטף החשמלי דרך הגג, כשבוחרים את האנך לגג כלפי מעלה?
    answer: >-
      השטף הוא $-3.0\cdot10^{3}\,\text{N}\cdot\text{m}^2/\text{C}$: שלילי, כי השדה מצביע נגד האנך
    solution:
      - kind: given
        text: >-
          $E = 150\,\text{N/C}$ כלפי מטה, $A = 20\,\text{m}^2$, והאנך לגג כלפי מעלה.
      - kind: reasoning
        text: >-
          השדה מצביע למטה והאנך מצביע למעלה, כלומר בכיוונים מנוגדים. לכן הזווית ביניהם היא $\theta = 180^\circ$, ו-$\cos180^\circ = -1$.
      - kind: formula
        text: >-
          $\Phi = EA\cos\theta$.
      - kind: substitution
        text: >-
          $\Phi = 150\cdot20\cdot(-1) = -3000\,\text{N}\cdot\text{m}^2/\text{C}$.
      - kind: result
        text: >-
          השטף הוא $-3.0\cdot10^{3}\,\text{N}\cdot\text{m}^2/\text{C}$. אילו בחרנו את האנך כלפי מטה, היה יוצא אותו מספר עם סימן חיובי: בחלון פתוח הסימן תלוי בבחירה.

  - id: W-1.7-02
    level: basic
    qualitative: true
    objectives: [OBJ-1.7-2]
    prompt: >-
      באיור של קווי שדה, כמו איור 1.7ב, כל קו מייצג אותו שטף. סביב קבוצת מטענים מציירים משטח סגור, וסופרים: 7 קווים יוצאים ממנו ו-3 קווים נכנסים אליו.

      (א) מה הסימן של המטען הכלוא? נמקו.

      (ב) מציירים משטח סגור אחר, גדול יותר, שמקיף את אותם מטענים ולא מטענים נוספים. סופרים בו 12 קווים יוצאים. כמה קווים נכנסים אליו?

      (ג) האם ייתכן שבתוך המשטח הראשון יש גם מטען שלילי? נמקו.
    answer: >-
      (א) חיובי.

      (ב) 8 קווים.

      (ג) כן, בתנאי שסכום כל המטענים שבפנים חיובי.
    solution:
      - kind: reasoning
        text: >-
          (א) במשטח סגור קו שיוצא נספר חיובי וקו שנכנס נספר שלילי. נטו: $7 - 3 = 4$ קווים יוצאים. השטף חיובי, ולפי חוק גאוס $\Phi = q/\varepsilon_0$, ולכן גם המטען הכלוא חיובי.
      - kind: reasoning
        text: >-
          (ב) המשטח החדש כולא את אותו מטען, ולכן השטף שלו זהה, כלומר גם בו הנטו הוא 4 קווים יוצאים. מספר הקווים שנכנסים: $12 - 4 = 8$.
      - kind: reasoning
        text: >-
          (ג) חוק גאוס קובע רק את **הסכום** של המטענים שבפנים, עם הסימנים. מטען שלילי יכול להיות שם, אם המטענים החיוביים גדולים ממנו.
      - kind: result
        text: >-
          (א) המטען הכלוא חיובי.

          (ב) 8 קווים נכנסים.

          (ג) כן: למשל מטען גדול חיובי ולידו מטען שלילי קטן ממנו.

  - id: W-1.7-03
    level: basic
    qualitative: false
    objectives: [OBJ-1.7-3]
    prompt: >-
      על כדור פלסטיק קטן יש עודף של $5\cdot10^{12}$ אלקטרונים. מקיפים את הכדור במשטח סגור דמיוני.
      מה השטף החשמלי דרך המשטח?
    answer: >-
      השטף שלילי, וגודלו כ-$9.0\cdot10^{4}\,\text{N}\cdot\text{m}^2/\text{C}$: הקווים נכנסים אל המשטח
    solution:
      - kind: given
        text: >-
          $n = 5\cdot10^{12}$ אלקטרונים, ולכל אחד מטען $-e$, כאשר $e = 1.6\cdot10^{-19}\,\text{C}$. $\varepsilon_0 = 8.85\cdot10^{-12}\,\text{C}^2/(\text{N}\cdot\text{m}^2)$.
      - kind: formula
        text: >-
          המטען הכלוא: $q = -ne$. חוק גאוס: $\Phi = q/\varepsilon_0$.
      - kind: substitution
        text: >-
          $q = -5\cdot10^{12}\cdot1.6\cdot10^{-19} = -8\cdot10^{-7}\,\text{C}$.
      - kind: substitution
        text: >-
          $$\Phi = \frac{-8\cdot10^{-7}}{8.85\cdot10^{-12}} = -9.0\cdot10^{4}\ \text{N}\cdot\text{m}^2/\text{C}$$
      - kind: result
        text: >-
          השטף הוא $-9.0\cdot10^{4}\,\text{N}\cdot\text{m}^2/\text{C}$. הוא שלילי כי המטען הכלוא שלילי: הקווים מצביעים פנימה, אל הכדור.

  - id: W-1.7-04
    level: mid
    qualitative: false
    objectives: [OBJ-1.7-1]
    prompt: >-
      במישור הדף יש שדה חשמלי אחיד, שהרכיבים שלו הם $\vec E = (3000, 4000)\,\text{N/C}$ (ציר x ימינה, ציר y למעלה).
      בשדה יש שני חלונות שטוחים, כל אחד בשטח $0.05\,\text{m}^2$. חלון 1 אופקי, והאנך שלו מצביע למעלה. חלון 2 עומד אנכית וניצב לדף, והאנך שלו מצביע ימינה.

      (א) חשבו את השטף דרך כל אחד מהחלונות.

      (ב) איך צריך לכוון חלון באותו שטח כדי שהשטף דרכו יהיה הגדול ביותר? מה השטף אז?
    answer: >-
      (א) דרך חלון 1 $200\,\text{N}\cdot\text{m}^2/\text{C}$, ודרך חלון 2 $150\,\text{N}\cdot\text{m}^2/\text{C}$.

      (ב) כשהאנך מצביע בכיוון השדה: $250\,\text{N}\cdot\text{m}^2/\text{C}$.
    solution:
      - kind: given
        text: >-
          $E_x = 3000\,\text{N/C}$, $E_y = 4000\,\text{N/C}$, $A = 0.05\,\text{m}^2$.
      - kind: formula
        text: >-
          $\Phi = EA\cos\theta$. המכפלה $E\cos\theta$ היא הרכיב של השדה בכיוון האנך, ולכן אפשר לכתוב: השטף הוא רכיב השדה לאורך האנך, כפול השטח.
      - kind: reasoning
        text: >-
          (א) האנך של חלון 1 מצביע לאורך ציר y, ולכן רק $E_y$ עובר דרכו. האנך של חלון 2 מצביע לאורך ציר x, ולכן רק $E_x$ עובר דרכו.
      - kind: substitution
        text: >-
          $\Phi_1 = E_y A = 4000\cdot0.05 = 200\,\text{N}\cdot\text{m}^2/\text{C}$, ו-$\Phi_2 = E_x A = 3000\cdot0.05 = 150\,\text{N}\cdot\text{m}^2/\text{C}$.
      - kind: reasoning
        text: >-
          בדיקה בדרך השנייה: $E = \sqrt{3000^2 + 4000^2} = 5000\,\text{N/C}$, והזווית בין השדה לאנך של חלון 1 מקיימת $\cos\theta = 4000/5000 = 0.8$. אז $\Phi_1 = 5000\cdot0.05\cdot0.8 = 200\,\text{N}\cdot\text{m}^2/\text{C}$, כמו קודם.
      - kind: reasoning
        text: >-
          (ב) $\cos\theta$ הגדול ביותר הוא 1, כש-$\theta = 0$: האנך מצביע בכיוון השדה, כלומר בזווית של כ-$53^\circ$ מעל ציר x ($\tan\alpha = 4000/3000$). אז $\Phi = EA = 5000\cdot0.05 = 250\,\text{N}\cdot\text{m}^2/\text{C}$.
      - kind: result
        text: >-
          (א) $\Phi_1 = 200\,\text{N}\cdot\text{m}^2/\text{C}$ ו-$\Phi_2 = 150\,\text{N}\cdot\text{m}^2/\text{C}$.

          (ב) האנך בכיוון השדה, בזווית של כ-$53^\circ$ מעל ציר x, והשטף $250\,\text{N}\cdot\text{m}^2/\text{C}$. שימו לב: $200 + 150 \neq 250$. שטפים דרך חלונות שונים לא מתחברים לשטף דרך חלון שלישי.

  - id: W-1.7-05
    level: mid
    qualitative: true
    objectives: [OBJ-1.7-2, OBJ-1.7-3]
    prompt: >-
      שלושה מטענים נקודתיים: $q_A = +q$, $q_B = -2q$ ו-$q_C = +3q$. מציירים ארבעה משטחים סגורים:
      $S_1$ מקיף רק את $A$; $S_2$ מקיף את $A$ ואת $B$; $S_3$ מקיף את $B$ ואת $C$; $S_4$ מקיף את שלושת המטענים.
      דרגו את השטפים דרך ארבעת המשטחים מהגדול לקטן (עם הסימן), ונמקו.
    answer: >-
      $\Phi_4 > \Phi_1 = \Phi_3 > \Phi_2$
    solution:
      - kind: formula
        text: >-
          חוק גאוס לכל משטח בנפרד: $\Phi = q/\varepsilon_0$, כאשר $q$ הוא המטען הכלוא של אותו משטח, עם הסימנים. מטענים שמחוץ למשטח לא נספרים.
      - kind: reasoning
        text: >-
          המטענים הכלואים: ב-$S_1$ הוא $+q$. ב-$S_2$ הוא $q + (-2q) = -q$. ב-$S_3$ הוא $-2q + 3q = +q$. ב-$S_4$ הוא $q - 2q + 3q = +2q$.
      - kind: reasoning
        text: >-
          השטף ביחס ישר למטען הכלוא, ולכן הדירוג של השטפים הוא הדירוג של המטענים הכלואים: $+2q$, אחריו $+q$ ו-$+q$, ובסוף $-q$.
      - kind: result
        text: >-
          $\Phi_4 > \Phi_1 = \Phi_3 > \Phi_2$. השטף דרך $S_2$ שלילי. $S_1$ ו-$S_3$ מקיפים מטענים שונים לגמרי, ובכל זאת השטף דרכם שווה, כי המטען הכלוא שלהם שווה.

  - id: W-1.7-06
    level: mid
    qualitative: false
    objectives: [OBJ-1.7-3, OBJ-1.7-2]
    prompt: >-
      מטען נקודתי לא ידוע נמצא במרכז קובייה דמיונית. השטף דרך אחת הפאות, החוצה, הוא $3.77\cdot10^{4}\,\text{N}\cdot\text{m}^2/\text{C}$.

      (א) מה המטען?

      (ב) מוסיפים בתוך הקובייה, קרוב לאחת הפאות, מטען נקודתי של $-0.5\,\mu\text{C}$. מה השטף דרך כל הקובייה עכשיו? האם אפשר עדיין למצוא את השטף דרך פאה אחת בחלוקה ב-6? נמקו.
    answer: >-
      (א) $+2.0\,\mu\text{C}$.

      (ב) כ-$1.7\cdot10^{5}\,\text{N}\cdot\text{m}^2/\text{C}$. לא: הפאות כבר אינן שוות.
    solution:
      - kind: reasoning
        text: >-
          (א) המטען במרכז, וכל שש הפאות נמצאות באותו מרחק ממנו ובאותו מצב ביחס אליו. לכן השטף דרך כל פאה זהה, והשטף דרך כל הקובייה הוא פי 6 מהשטף דרך פאה אחת.
      - kind: substitution
        text: >-
          $\Phi = 6\cdot3.77\cdot10^{4} = 2.26\cdot10^{5}\,\text{N}\cdot\text{m}^2/\text{C}$.
      - kind: formula
        text: >-
          חוק גאוס: $\Phi = q/\varepsilon_0$. הנעלם הוא $q$, ולכן מכפילים את שני האגפים ב-$\varepsilon_0$: $q = \Phi\,\varepsilon_0$.
      - kind: substitution
        text: >-
          $q = 2.26\cdot10^{5}\cdot8.85\cdot10^{-12} = 2.0\cdot10^{-6}\,\text{C} = 2.0\,\mu\text{C}$, חיובי כי השטף החוצה.
      - kind: substitution
        text: >-
          (ב) המטען הכלוא עכשיו: $2.0 - 0.5 = 1.5\,\mu\text{C}$, ולכן $\Phi = \dfrac{1.5\cdot10^{-6}}{8.85\cdot10^{-12}} = 1.7\cdot10^{5}\,\text{N}\cdot\text{m}^2/\text{C}$.
      - kind: reasoning
        text: >-
          המטען החדש אינו במרכז: הוא קרוב לפאה אחת ורחוק מהאחרות. השטף שהוא תורם לכל פאה שונה, ולכן אי אפשר לחלק את השטף הכולל ב-6. חוק גאוס נותן רק את הסכום על כל הקובייה.
      - kind: result
        text: >-
          (א) המטען הוא $+2.0\,\mu\text{C}$.

          (ב) השטף דרך הקובייה הוא כ-$1.7\cdot10^{5}\,\text{N}\cdot\text{m}^2/\text{C}$. את השטף דרך פאה אחת כבר אי אפשר למצוא בחלוקה ב-6.

  - id: W-1.7-07
    level: mid
    qualitative: false
    objectives: [OBJ-1.7-3]
    prompt: >-
      כדור מתכת קטן $A$, שמטענו $+5\,\mu\text{C}$, נמצא בתוך משטח סגור דמיוני. כדור מתכת זהה $B$, שמטענו $-3\,\mu\text{C}$, נמצא מחוץ למשטח.

      (א) מה השטף דרך המשטח?

      (ב) מכניסים את $B$ לתוך המשטח ומצמידים את שני הכדורים זה לזה. מה השטף כשהם צמודים?

      (ג) מפרידים את הכדורים, ומוציאים את $B$ בחזרה אל מחוץ למשטח. מה השטף עכשיו?
    answer: >-
      (א) $5.65\cdot10^{5}\,\text{N}\cdot\text{m}^2/\text{C}$.

      (ב) $2.26\cdot10^{5}\,\text{N}\cdot\text{m}^2/\text{C}$.

      (ג) $1.13\cdot10^{5}\,\text{N}\cdot\text{m}^2/\text{C}$.
    solution:
      - kind: given
        text: >-
          $q_A = +5\cdot10^{-6}\,\text{C}$, $q_B = -3\cdot10^{-6}\,\text{C}$, $\varepsilon_0 = 8.85\cdot10^{-12}\,\text{C}^2/(\text{N}\cdot\text{m}^2)$.
      - kind: formula
        text: >-
          חוק גאוס: $\Phi = q/\varepsilon_0$, כאשר $q$ הוא סכום המטענים שבתוך המשטח באותו רגע.
      - kind: substitution
        text: >-
          (א) רק $A$ בפנים: $\Phi = \dfrac{5\cdot10^{-6}}{8.85\cdot10^{-12}} = 5.65\cdot10^{5}\,\text{N}\cdot\text{m}^2/\text{C}$.
      - kind: substitution
        text: >-
          (ב) שני הכדורים בפנים, והמטען הכולל נשמר גם כשהם נוגעים: $5 + (-3) = 2\,\mu\text{C}$. לכן $\Phi = \dfrac{2\cdot10^{-6}}{8.85\cdot10^{-12}} = 2.26\cdot10^{5}\,\text{N}\cdot\text{m}^2/\text{C}$.
      - kind: reasoning
        text: >-
          (ג) הכדורים זהים, ולכן במגע המטען הכולל, $2\,\mu\text{C}$, מתחלק ביניהם שווה בשווה (שיעור 1.2): לכל כדור $+1\,\mu\text{C}$. אחרי ש-$B$ יוצא, נשאר בפנים רק $A$, עם $+1\,\mu\text{C}$.
      - kind: substitution
        text: >-
          $\Phi = \dfrac{1\cdot10^{-6}}{8.85\cdot10^{-12}} = 1.13\cdot10^{5}\,\text{N}\cdot\text{m}^2/\text{C}$.
      - kind: result
        text: >-
          (א) $5.65\cdot10^{5}\,\text{N}\cdot\text{m}^2/\text{C}$.

          (ב) $2.26\cdot10^{5}\,\text{N}\cdot\text{m}^2/\text{C}$: המגע לא משנה את סך המטען שבפנים.

          (ג) $1.13\cdot10^{5}\,\text{N}\cdot\text{m}^2/\text{C}$: $B$ יצא ולקח איתו חצי מהמטען.

  - id: W-1.7-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.7-1, OBJ-1.7-2]
    prompt: >-
      קערה דמיונית בצורת חצי כדור, ברדיוס $0.2\,\text{m}$, נמצאת בשדה חשמלי אחיד של $5000\,\text{N/C}$. הציר של הקערה מקביל לשדה,
      והפתח העגול שלה פונה אל הכיוון שממנו מגיעים הקווים: הקווים נכנסים דרך הפתח ופוגשים את הדופן המעוגלת.
      אין מטענים בתוך הקערה.

      (א) חשבו את השטף דרך הדופן המעוגלת, כשהאנך שלה מצביע החוצה מהקערה. רמז: סגרו את הקערה במכסה שטוח ועגול, וחשבו מה השטף דרך המשטח הסגור שנוצר.

      (ב) מטים את הקערה כך שהציר שלה יוצר זווית של $60^\circ$ עם השדה. מה השטף דרך הדופן המעוגלת עכשיו?
    answer: >-
      (א) כ-$6.3\cdot10^{2}\,\text{N}\cdot\text{m}^2/\text{C}$.

      (ב) כ-$3.1\cdot10^{2}\,\text{N}\cdot\text{m}^2/\text{C}$.
    solution:
      - kind: reasoning
        text: >-
          הדופן המעוגלת אינה שטוחה, והזווית בין האנך שלה לשדה משתנה מנקודה לנקודה. לכן אי אפשר להציב אותה ישירות ב-$EA\cos\theta$. במקום זה סוגרים את הקערה במכסה עגול ושטוח: הדופן והמכסה יחד הם משטח סגור, ובתוכו אין מטען.
      - kind: formula
        text: >-
          חוק גאוס למשטח הסגור: $\Phi_1 + \Phi_2 = q/\varepsilon_0 = 0$, כאשר $\Phi_1$ הוא השטף דרך הדופן המעוגלת ו-$\Phi_2$ השטף דרך המכסה. לכן $\Phi_1 = -\Phi_2$.
      - kind: reasoning
        text: >-
          המכסה שטוח, והשדה אחיד, ולכן בו כן מותר $\Phi = EA\cos\theta$. שטחו $A = \pi R^2$, כאשר $R = 0.2\,\text{m}$ הוא הרדיוס. האנך של המכסה מצביע החוצה מהמשטח הסגור, כלומר החוצה דרך הפתח, אל הכיוון שממנו מגיעים הקווים: נגד השדה. לכן $\theta = 180^\circ$.
      - kind: substitution
        text: >-
          (א) $A = \pi\cdot0.2^2 \approx 0.126\,\text{m}^2$, ו-$\Phi_2 = 5000\cdot\pi\cdot0.2^2\cdot(-1) = -628\,\text{N}\cdot\text{m}^2/\text{C}$. לכן $\Phi_1 = +628\,\text{N}\cdot\text{m}^2/\text{C}$.
      - kind: reasoning
        text: >-
          (ב) הציר של הקערה, ואיתו האנך של המכסה, הסתובב ב-$60^\circ$. האנך של המכסה מצביע עכשיו בזווית $180^\circ - 60^\circ = 120^\circ$ לשדה.
      - kind: substitution
        text: >-
          $\Phi_2 = 5000\cdot\pi\cdot0.2^2\cdot\cos120^\circ = 628\cdot(-0.5) = -314\,\text{N}\cdot\text{m}^2/\text{C}$, ולכן $\Phi_1 = +314\,\text{N}\cdot\text{m}^2/\text{C}$.
      - kind: result
        text: >-
          (א) $\Phi \approx 6.3\cdot10^{2}\,\text{N}\cdot\text{m}^2/\text{C}$: כל קו שנכנס דרך הפתח יוצא דרך הדופן, ולכן דרך הדופן עובר אותו שטף שעובר דרך עיגול ברדיוס $0.2\,\text{m}$ הפונה אל השדה.

          (ב) $\Phi \approx 3.1\cdot10^{2}\,\text{N}\cdot\text{m}^2/\text{C}$.

  - id: W-1.7-09
    level: bagrut
    qualitative: true
    objectives: [OBJ-1.7-2]
    prompt: >-
      מטען נקודתי של $+0.5\,\mu\text{C}$ נמצא מחוץ לקובייה דמיונית שאורך צלעה $0.2\,\text{m}$, במרחק $0.05\,\text{m}$ מאמצע אחת הפאות.
      חישוב במחשב נותן שהשטף דרך הפאה הקרובה למטען, כשהאנך שלה מצביע החוצה מהקובייה, הוא $-1.7\cdot10^{4}\,\text{N}\cdot\text{m}^2/\text{C}$.

      (א) למה השטף דרך הפאה הקרובה שלילי?

      (ב) מה השטף דרך חמש הפאות האחרות יחד? נמקו, בלי לחשב שדות.

      (ג) מחליפים את המטען במטען של $-0.5\,\mu\text{C}$, באותו מקום. מה השטף דרך הפאה הקרובה, ומה דרך חמש הפאות האחרות יחד?
    answer: >-
      (א) הקווים נכנסים לקובייה דרך הפאה הזאת, נגד האנך.

      (ב) $+1.7\cdot10^{4}\,\text{N}\cdot\text{m}^2/\text{C}$.

      (ג) $+1.7\cdot10^{4}$ דרך הפאה הקרובה ו-$-1.7\cdot10^{4}$ דרך חמש האחרות (ביחידות $\text{N}\cdot\text{m}^2/\text{C}$).
    solution:
      - kind: reasoning
        text: >-
          (א) השדה של מטען חיובי מצביע הרחק ממנו. ליד הפאה הקרובה "הרחק מהמטען" פירושו אל תוך הקובייה, בעוד שהאנך מצביע החוצה. הזווית בין השדה לאנך גדולה מ-$90^\circ$, והשטף שלילי: הקווים נכנסים.
      - kind: reasoning
        text: >-
          (ב) המטען מחוץ לקובייה, ולכן המטען הכלוא אפס, ולפי חוק גאוס השטף דרך כל הקובייה אפס. השטף דרך כל הקובייה הוא סכום השטפים דרך שש הפאות: נסמן ב-$\Phi'$ את השטף דרך חמש הפאות האחרות יחד. אז $-1.7\cdot10^{4} + \Phi' = 0$, ולכן $+1.7\cdot10^{4}\,\text{N}\cdot\text{m}^2/\text{C}$. כל קו שנכנס דרך הפאה הקרובה יוצא דרך אחת האחרות.
      - kind: reasoning
        text: >-
          (ג) השדה של $-0.5\,\mu\text{C}$ זהה בגודלו לשדה של $+0.5\,\mu\text{C}$ בכל נקודה, ומנוגד לו בכיוון. לכן כל שטף מחליף סימן: הפאה הקרובה $+1.7\cdot10^{4}$, וחמש האחרות יחד $-1.7\cdot10^{4}$. הסכום עדיין אפס, כמו שחוק גאוס דורש.
      - kind: result
        text: >-
          (א) הקווים נכנסים דרך הפאה הקרובה, נגד האנך שמצביע החוצה.

          (ב) $+1.7\cdot10^{4}\,\text{N}\cdot\text{m}^2/\text{C}$ דרך חמש הפאות האחרות יחד.

          (ג) $+1.7\cdot10^{4}\,\text{N}\cdot\text{m}^2/\text{C}$ דרך הפאה הקרובה, ו-$-1.7\cdot10^{4}\,\text{N}\cdot\text{m}^2/\text{C}$ דרך חמש האחרות יחד.

  - id: W-1.7-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.7-1, OBJ-1.7-2, OBJ-1.7-3]
    prompt: >-
      קובייה דמיונית שאורך צלעה $0.3\,\text{m}$ נמצאת בשדה חשמלי אחיד של $2000\,\text{N/C}$. השדה מצביע ימינה, וניצב לשתיים מהפאות של הקובייה.
      במרכז הקובייה נמצא מטען נקודתי של $+2\,\text{nC}$.

      (א) מה השטף דרך כל הקובייה?

      (ב) מה השטף דרך הפאה הימנית, דרך הפאה השמאלית, ודרך כל אחת מארבע הפאות האחרות?

      (ג) בדקו שסכום השטפים מסעיף (ב) שווה לתשובה של סעיף (א).
    answer: >-
      (א) $226\,\text{N}\cdot\text{m}^2/\text{C}$.

      (ב) ימנית $218$, שמאלית $-142$, וכל אחת מהאחרות $37.7$ (ביחידות $\text{N}\cdot\text{m}^2/\text{C}$).
    solution:
      - kind: given
        text: >-
          $a = 0.3\,\text{m}$, ולכן שטח פאה הוא $A = 0.3^2 = 0.09\,\text{m}^2$. $E = 2000\,\text{N/C}$ ימינה. $q = 2\,\text{nC} = 2\cdot10^{-9}\,\text{C}$.
      - kind: reasoning
        text: >-
          השדה על הקובייה הוא סכום של שני שדות: השדה האחיד והשדה של המטען (סופרפוזיציה). השטף הוא השדה כפול השטח, ולכן גם השטפים מתחברים: השטף דרך כל פאה הוא השטף של השדה האחיד ועוד השטף של המטען.
      - kind: formula
        text: >-
          (א) חוק גאוס: $\Phi = q/\varepsilon_0$. השדה האחיד לא תורם לשטף דרך הקובייה, כי הוא לא נוצר ממטען שבתוכה: כל קו שלו שנכנס משמאל יוצא מימין.
      - kind: substitution
        text: >-
          $\Phi = \dfrac{2\cdot10^{-9}}{8.85\cdot10^{-12}} = 226\,\text{N}\cdot\text{m}^2/\text{C}$.
      - kind: substitution
        text: >-
          (ב) השדה האחיד: בפאה הימנית האנך ימינה, $\theta = 0$, ו-$\Phi = EA = 2000\cdot0.09 = 180\,\text{N}\cdot\text{m}^2/\text{C}$. בפאה השמאלית האנך שמאלה, $\theta = 180^\circ$, ו-$\Phi = -180\,\text{N}\cdot\text{m}^2/\text{C}$. בארבע האחרות $\theta = 90^\circ$, ו-$\Phi = 0$.
      - kind: substitution
        text: >-
          המטען במרכז, ולכן כל פאה מקבלת שישית מהשטף שלו: $226/6 = 37.7\,\text{N}\cdot\text{m}^2/\text{C}$.
      - kind: substitution
        text: >-
          מחברים: ימנית $180 + 37.7 = 217.7 \approx 218$, שמאלית $-180 + 37.7 = -142.3 \approx -142$, וכל אחת מהאחרות $0 + 37.7 = 37.7$ (ביחידות $\text{N}\cdot\text{m}^2/\text{C}$).
      - kind: substitution
        text: >-
          (ג) $217.7 + (-142.3) + 4\cdot37.7 = 226.2 \approx 226\,\text{N}\cdot\text{m}^2/\text{C}$. ההפרש הקטן נובע מעיגול.
      - kind: result
        text: >-
          (א) $226\,\text{N}\cdot\text{m}^2/\text{C}$.

          (ב) ימנית כ-$218$, שמאלית $-142$, וכל אחת מארבע האחרות כ-$37.7$ (ביחידות $\text{N}\cdot\text{m}^2/\text{C}$).

          (ג) הסכום שווה ל-$226\,\text{N}\cdot\text{m}^2/\text{C}$, עד כדי עיגול: השדה האחיד משנה כל פאה בנפרד, אבל לא את הסכום.

challenge:
  - id: W-1.7-c1
    stars: 1
    objectives: [OBJ-1.7-2, OBJ-1.7-3]
    prompt: >-
      תיבה דמיונית (קופסה מלבנית) שמידותיה $0.2\,\text{m}\times0.2\,\text{m}\times0.1\,\text{m}$.
      מטען נקודתי של $+3\,\mu\text{C}$ נמצא בדיוק באמצע אחת הפאות הגדולות, $S$ (פאה של $0.2\,\text{m}\times0.2\,\text{m}$).

      (א) מה השטף דרך הפאה שמול $S$?

      (ב) מה השטף דרך כל אחת מארבע הפאות הצדדיות, של $0.2\,\text{m}\times0.1\,\text{m}$?

      (ג) מה השטף דרך $S$ עצמה?
    answer: >-
      (א) $5.65\cdot10^{4}\,\text{N}\cdot\text{m}^2/\text{C}$.

      (ב) $2.82\cdot10^{4}\,\text{N}\cdot\text{m}^2/\text{C}$ דרך כל אחת.

      (ג) אפס.
    solution:
      - kind: reasoning
        text: >-
          המטען יושב על המשטח, ולכן אי אפשר להפעיל את חוק גאוס על התיבה ישירות: המטען אינו בפנים וגם אינו בחוץ. הרעיון: מדמיינים תיבה שנייה, זהה, צמודה לראשונה מהצד של $S$. שתי התיבות יחד הן קובייה שאורך צלעה $0.2\,\text{m}$, והמטען נמצא בדיוק במרכזה.
      - kind: formula
        text: >-
          חוק גאוס לקובייה הגדולה: $\Phi = q/\varepsilon_0$. המטען במרכזה, ולכן כל שש הפאות שלה מקבלות שטף שווה, $q/(6\varepsilon_0)$.
      - kind: reasoning
        text: >-
          (א) הפאה שמול $S$ היא פאה שלמה של הקובייה הגדולה.
      - kind: substitution
        text: >-
          $$\Phi_1 = \frac{q}{6\varepsilon_0} = \frac{3\cdot10^{-6}}{6\cdot8.85\cdot10^{-12}} = 5.65\cdot10^{4}\ \text{N}\cdot\text{m}^2/\text{C}$$
      - kind: reasoning
        text: >-
          (ב) כל פאה צדדית של הקובייה הגדולה ($0.2\,\text{m}\times0.2\,\text{m}$) מורכבת משני חצאים: אחד שייך לתיבה המקורית ואחד לתיבה המדומיינת. שני החצאים הם תמונת ראי זה של זה ביחס למישור של $S$, שבו נמצא המטען, ולכן השטף דרכם שווה. כל אחד מקבל חצי מ-$q/(6\varepsilon_0)$, כלומר $q/(12\varepsilon_0)$.
      - kind: substitution
        text: >-
          $\Phi_2 = \dfrac{5.65\cdot10^{4}}{2} = 2.82\cdot10^{4}\,\text{N}\cdot\text{m}^2/\text{C}$.
      - kind: reasoning
        text: >-
          (ג) המטען נמצא במישור של $S$. בכל נקודה של $S$ השדה מצביע הרחק מהמטען, לאורך המישור הזה, כלומר ניצב לאנך של $S$. לכן $\theta = 90^\circ$ בכל נקודה, ואף קו לא חוצה את $S$.
      - kind: reasoning
        text: >-
          בדיקה: $5.65\cdot10^{4} + 4\cdot2.82\cdot10^{4} = 1.69\cdot10^{5}\,\text{N}\cdot\text{m}^2/\text{C}$. זה בדיוק חצי מ-$q/\varepsilon_0 = 3.39\cdot10^{5}$, כמצופה: חצי מהקווים של המטען יוצאים לצד של התיבה, וחצי לצד השני.
      - kind: result
        text: >-
          (א) $5.65\cdot10^{4}\,\text{N}\cdot\text{m}^2/\text{C}$.

          (ב) $2.82\cdot10^{4}\,\text{N}\cdot\text{m}^2/\text{C}$ דרך כל פאה צדדית.

          (ג) אפס: השדה על $S$ מקביל לה.
    source:
      name: JEE Main
      year: 2023
      problem: '29 Jan 2023, Shift 1 (question number not shown on the page)'
      url: https://competishun.com/in-a-cuboid-of-dimension-2l-2l-l-a-charge-q-is-placed-at-the-centre-of-the-surface-s-having-area-of-4-mathrml2-the-flux-through-the-opposite-surface-to-s-is-given-by/
      verified: '2026-11-02'
      adapted: true

  - id: W-1.7-c2
    stars: 2
    objectives: [OBJ-1.7-2, OBJ-1.7-3]
    prompt: >-
      קובייה דמיונית שאורך צלעה $a = 0.4\,\text{m}$ ומרכזה בראשית הצירים. הפאות שלה נמצאות במישורים $x = \pm a/2$, $y = \pm a/2$ ו-$z = \pm a/2$.
      כל הגופים הבאים נמצאים במישור $z = 0$, שחוצה את הקובייה באמצע:

      דיסקה דקה ברדיוס $a/4$, שעליה מטען של $+4\,\mu\text{C}$ מפוזר באופן אחיד, ומרכזה בנקודה $(-a/2,\ 0,\ 0)$.

      מוט דק באורך $a$, שעליו מטען של $+8\,\mu\text{C}$ מפוזר באופן אחיד, מונח על ציר x, מ-$x = a/4$ עד $x = 5a/4$.

      מטען נקודתי של $-5\,\mu\text{C}$ בנקודה $(a/4,\ -a/4,\ 0)$, ומטען נקודתי של $+3\,\mu\text{C}$ בנקודה $(-3a/4,\ 3a/4,\ 0)$.

      (א) מה השטף החשמלי דרך הקובייה?

      (ב) איזה מטען נקודתי צריך להוסיף במרכז הקובייה כדי שהשטף דרכה יתאפס?
    answer: >-
      (א) $\Phi = -1.13\cdot10^{5}\,\text{N}\cdot\text{m}^2/\text{C}$ (הקווים נכנסים).

      (ב) $+1\,\mu\text{C}$.
    solution:
      - kind: reasoning
        text: >-
          לפי חוק גאוס צריך רק את המטען הכלוא. לכן עוברים על כל גוף ושואלים איזה חלק ממנו נמצא בתוך הקובייה, כלומר בתחום $-a/2 < x < a/2$, ובאותו אופן ב-$y$ וב-$z$. מטען "מפוזר באופן אחיד" פירושו שלכל חלק של הגוף יש מטען ביחס ישר לגודלו: חצי מהשטח של הדיסקה נושא חצי מהמטען שלה.
      - kind: reasoning
        text: >-
          הדיסקה: מרכזה על הפאה $x = -a/2$, והפאה חוצה אותה בדיוק באמצע. ב-$y$ היא משתרעת מ-$-a/4$ עד $a/4$, בתוך התחום. לכן חציה בתוך הקובייה, עם חצי מהמטען: $+2\,\mu\text{C}$.
      - kind: reasoning
        text: >-
          המוט: הוא משתרע מ-$x = a/4$ עד $x = 5a/4$, וחלקו שבתוך הקובייה הוא מ-$a/4$ עד $a/2$, כלומר באורך $a/4$, רבע מאורכו. לכן בתוך הקובייה רבע מהמטען: $+8/4 = +2\,\mu\text{C}$.
      - kind: reasoning
        text: >-
          המטענים הנקודתיים: בנקודה $(a/4,\ -a/4,\ 0)$ כל השיעורים קטנים מ-$a/2$ בערכם המוחלט, ולכן $-5\,\mu\text{C}$ בפנים. בנקודה $(-3a/4,\ 3a/4,\ 0)$ השיעור $x$ גדול מ-$a/2$ בערכו המוחלט, ולכן $+3\,\mu\text{C}$ בחוץ ולא נספר.
      - kind: substitution
        text: >-
          המטען הכלוא: $q = 2 + 2 + (-5) = -1\,\mu\text{C}$.
      - kind: formula
        text: >-
          $\Phi = q/\varepsilon_0$.
      - kind: substitution
        text: >-
          $$\Phi = \frac{-1\cdot10^{-6}}{8.85\cdot10^{-12}} = -1.13\cdot10^{5}\ \text{N}\cdot\text{m}^2/\text{C}$$
      - kind: reasoning
        text: >-
          (ב) כדי שהשטף יתאפס, המטען הכלוא צריך להיות אפס: $-1\,\mu\text{C} + q' = 0$, ולכן $q' = +1\,\mu\text{C}$. אורך הצלע $a$ לא נחוץ בשום שלב: השטף אינו תלוי בגודל המשטח.
      - kind: result
        text: >-
          (א) $\Phi \approx -1.13\cdot10^{5}\,\text{N}\cdot\text{m}^2/\text{C}$: המטען הכלוא $-1\,\mu\text{C}$, והקווים נכנסים לקובייה.

          (ב) מטען של $+1\,\mu\text{C}$ במרכז.
    source:
