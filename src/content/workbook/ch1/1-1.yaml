# Workbook for lesson 1.1: ten practice problems and sourced challenge problems.
# Every number recomputed with src/physics/constants.ts (E_CHARGE, M_ELECTRON).

lesson: '1.1'
practice:
  - id: W-1.1-01
    level: basic
    qualitative: true
    objectives: [OBJ-1.1-1]
    prompt: >-
      שני כדורים קלים תלויים על חוטי משי, זה ליד זה. כשמקרבים אותם, החוטים נוטים והכדורים מתרחקים זה מזה.
      ידוע שכדור X טעון שלילית, ושגודל המטען על כדור Y גדול פי שלושה מגודל המטען על X.

      (א) מה הסימן של כדור Y?

      (ב) על איזה כדור פועל כוח חשמלי גדול יותר?
    answer: >-
      (א) שלילי.

      (ב) הכוחות שווים בגודלם ומנוגדים בכיוונם.
    solution:
      - kind: reasoning
        text: >-
          הכדורים מתרחקים זה מזה, כלומר דוחים זה את זה. דחייה קורית רק בין מטענים מאותו סימן.
          X שלילי, ולכן גם Y שלילי.
      - kind: reasoning
        text: >-
          הכוח ש-X מפעיל על Y והכוח ש-Y מפעיל על X הם זוג כוחות לפי החוק השלישי של ניוטון:
          שווים בגודלם ומנוגדים בכיוונם, בלי קשר לשאלה איזה כדור טעון יותר.
      - kind: result
        text: >-
          (א) Y טעון שלילית.

          (ב) הכוחות שווים בגודלם. המטען הגדול על Y לא נותן לו "כוח גדול יותר"; הוא משפיע על שני הכוחות באותה מידה.

  - id: W-1.1-02
    level: basic
    qualitative: false
    objectives: [OBJ-1.1-2]
    prompt: >-
      גוף ניטרלי איבד $2.0\cdot10^{10}$ אלקטרונים. מה המטען שלו, בננו-קולון ($1\,\text{nC} = 10^{-9}\,\text{C}$), ומה הסימן?
      ($e = 1.6\cdot10^{-19}\,\text{C}$)
    answer: '$q = +3.2\,\text{nC}$'
    solution:
      - kind: given
        text: >-
          $n = 2.0\cdot10^{10}$ אלקטרונים חסרים, $e = 1.6\cdot10^{-19}\,\text{C}$.
      - kind: reasoning
        text: >-
          לגוף חסרים אלקטרונים, ולכן יש בו יותר פרוטונים מאלקטרונים: המטען חיובי, $q = +n\,e$.
      - kind: formula
        text: '$|q| = n\,e$'
      - kind: substitution
        text: >-
          $|q| = 2.0\cdot10^{10} \cdot 1.6\cdot10^{-19} = 3.2\cdot10^{-9}\,\text{C}$.
          במכפלה מחברים את החזקות: $10 + (-19) = -9$.
      - kind: result
        text: >-
          $q = +3.2\cdot10^{-9}\,\text{C} = +3.2\,\text{nC}$.

  - id: W-1.1-03
    level: basic
    qualitative: true
    objectives: [OBJ-1.1-3, OBJ-1.1-1]
    prompt: >-
      מוט A ובד B, שניהם ניטרליים, משפשפים זה בזה. אחר כך מקרבים את המוט לכדור קטן שידוע שהוא טעון שלילית,
      והמוט דוחה את הכדור.

      (א) מה הסימן של המטען על הבד?

      (ב) אם מקרבים את הבד לאותו כדור, האם הוא ימשוך אותו או ידחה אותו?
    answer: >-
      (א) חיובי.

      (ב) הבד ימשוך את הכדור.
    solution:
      - kind: reasoning
        text: >-
          המוט דוחה כדור שלילי, ולכן המוט שלילי: הוא קיבל אלקטרונים בשפשוף.
      - kind: reasoning
        text: >-
          לפני השפשוף סך המטען של המוט והבד היה אפס, ומטען נשמר. האלקטרונים שהמוט קיבל באו מהבד,
          ולכן הבד חיובי, באותו גודל מטען.
      - kind: reasoning
        text: >-
          הבד חיובי והכדור שלילי: סימנים הפוכים מושכים.
      - kind: result
        text: >-
          (א) הבד טעון חיובית.

          (ב) הבד ימשוך את הכדור.

  - id: W-1.1-04
    level: mid
    qualitative: false
    objectives: [OBJ-1.1-2]
    prompt: >-
      תלמיד טוען: "מטען של $1.0\,\text{nC}$ לא יכול להיות, כי $1.0\cdot10^{-9}/1.6\cdot10^{-19} = 6.25\cdot10^{9}$, וזה לא מספר שלם."

      (א) האם התלמיד צודק? קבעו ונמקו.

      (ב) האם מטען של $1.0\cdot10^{-18}\,\text{C}$ יכול להיות המטען של גוף?

      ($e = 1.6\cdot10^{-19}\,\text{C}$)
    answer: >-
      (א) לא: $6.25\cdot10^{9} = 6\,250\,000\,000$ הוא מספר שלם, ולכן המטען אפשרי.

      (ב) לא: זה $6.25$ אלקטרונים.
    solution:
      - kind: formula
        text: >-
          מטען אפשרי רק אם $n = |q|/e$ יוצא מספר שלם.
      - kind: reasoning
        text: >-
          (א) הנקודה העשרונית ב-$6.25$ מטעה. החזקה $10^{9}$ מזיזה אותה תשעה מקומות ימינה:
          $6.25\cdot10^{9} = 6\,250\,000\,000$, מספר שלם. לכן $1.0\,\text{nC}$ הוא כ-6,250,000,000 מטענים יסודיים.
      - kind: substitution
        text: >-
          (ב) $n = \dfrac{1.0\cdot10^{-18}}{1.6\cdot10^{-19}} = \dfrac{10\cdot10^{-19}}{1.6\cdot10^{-19}} = 6.25$.
          כאן אין חזקה שמזיזה את הנקודה, ונשאר רבע אלקטרון.
      - kind: result
        text: >-
          (א) התלמיד טועה: $1.0\,\text{nC}$ הוא מטען אפשרי.

          (ב) $1.0\cdot10^{-18}\,\text{C}$ אינו אפשרי, כי אי אפשר להעביר רבע אלקטרון.
          במטענים גדולים הקוונטיזציה כמעט לא מורגשת, ובמטענים של כמה אלקטרונים היא קובעת הכול.

  - id: W-1.1-05
    level: mid
    qualitative: false
    objectives: [OBJ-1.1-3, OBJ-1.1-2]
    prompt: >-
      שלושה גופים מבודדים, A, B ו-C, ניטרליים בהתחלה. משפשפים את A ב-B, ואחרי זה מטען A הוא $+6\,\text{nC}$.
      אחר כך משפשפים את B ב-C, ואחרי זה מטען B הוא $-10\,\text{nC}$. בכל השלבים נוגעים רק בין הגופים האלה.

      (א) מה המטען של כל גוף בסוף?

      (ב) כמה אלקטרונים עברו בשפשוף השני, ומאיזה גוף לאיזה?

      ($e = 1.6\cdot10^{-19}\,\text{C}$)
    answer: >-
      (א) $q_A = +6\,\text{nC}$, $q_B = -10\,\text{nC}$, $q_C = +4\,\text{nC}$.

      (ב) $2.5\cdot10^{10}$ אלקטרונים, מ-C אל B.
    solution:
      - kind: reasoning
        text: >-
          שפשוף ראשון: A ו-B התחילו ניטרליים, ולכן $q_A + q_B = 0$. מכאן $q_B = -6\,\text{nC}$ אחרי השפשוף הראשון.
      - kind: reasoning
        text: >-
          שפשוף שני: B ו-C התחילו עם סך מטען $-6 + 0 = -6\,\text{nC}$, וסך המטען הזה נשמר.
          A לא משתתף בשפשוף, והמטען שלו נשאר $+6\,\text{nC}$.
      - kind: substitution
        text: >-
          $q_C = -6 - (-10) = +4\,\text{nC}$. בדיקה: $q_A + q_B + q_C = 6 - 10 + 4 = 0$, כמו בהתחלה.
      - kind: reasoning
        text: >-
          בשפשוף השני B עבר מ-$-6$ ל-$-10\,\text{nC}$, כלומר קיבל עוד $4\,\text{nC}$ של מטען שלילי. האלקטרונים האלה באו מ-C.
      - kind: substitution
        text: >-
          $n = \dfrac{4\cdot10^{-9}}{1.6\cdot10^{-19}} = 2.5\cdot10^{10}$.
      - kind: result
        text: >-
          (א) $q_A = +6\,\text{nC}$, $q_B = -10\,\text{nC}$, $q_C = +4\,\text{nC}$.

          (ב) $2.5\cdot10^{10}$ אלקטרונים עברו מ-C אל B.

  - id: W-1.1-06
    level: mid
    qualitative: false
    objectives: [OBJ-1.1-4, OBJ-1.1-3]
    prompt: >-
      מפזרים מטען של $-12\,\text{nC}$ על המחצית השמאלית בלבד של שני מוטות שווים: מסרק פלסטיק ומוט מתכת.
      מוט המתכת תלוי על חוטי משי. אחרי רגע חותכים כל מוט באמצע, בעזרת כלי מבודד, ומפרידים את החצאים.

      (א) מה המטען של כל אחד מארבעת החצאים?

      (ב) כמה אלקטרונים עודפים יש בכל חצי של מוט המתכת?

      ($e = 1.6\cdot10^{-19}\,\text{C}$)
    answer: >-
      (א) מסרק: $-12\,\text{nC}$ בחצי השמאלי, $0$ בימני. מתכת: $-6\,\text{nC}$ בכל חצי.

      (ב) $3.75\cdot10^{10}$ אלקטרונים בכל חצי.
    solution:
      - kind: reasoning
        text: >-
          בפלסטיק, מבודד, האלקטרונים העודפים כמעט לא נעים. המטען נשאר במחצית השמאלית, והחצי הימני ניטרלי.
      - kind: reasoning
        text: >-
          במתכת, מוליך, האלקטרונים העודפים דוחים זה את זה ומתפזרים על כל המוט.
          המוט זהה משני צדי האמצע, ולכן הפיזור סימטרי: בכל חצי בדיוק חצי מהמטען.
      - kind: reasoning
        text: >-
          המוט תלוי על משי והחיתוך נעשה בכלי מבודד, ולכן מטען לא יוצא: בכל מוט סך שני החצאים נשאר $-12\,\text{nC}$.
      - kind: substitution
        text: >-
          $n = \dfrac{6\cdot10^{-9}}{1.6\cdot10^{-19}} = 3.75\cdot10^{10}$.
      - kind: result
        text: >-
          (א) המסרק: $-12\,\text{nC}$ בחצי השמאלי ו-$0$ בחצי הימני. מוט המתכת: $-6\,\text{nC}$ בכל חצי.

          (ב) בכל חצי של מוט המתכת יש $3.75\cdot10^{10}$ אלקטרונים עודפים.

  - id: W-1.1-07
    level: mid
    qualitative: true
    objectives: [OBJ-1.1-1, OBJ-1.1-3]
    prompt: >-
      משפשפים מוט זכוכית בבד משי, והזכוכית נעשית חיובית. בנפרד משפשפים מוט PVC בבד צמר, וה-PVC נעשה שלילי.
      אחר כך מקרבים את ארבעת הגופים זה לזה, שניים בכל פעם.
      אילו זוגות ימשכו זה את זה, ואילו ידחו זה את זה?
    answer: >-
      דוחים: זכוכית וצמר, משי ו-PVC. כל ארבעת הזוגות האחרים מושכים.
    solution:
      - kind: reasoning
        text: >-
          בכל שפשוף שני הגופים התחילו ניטרליים, ומטען נשמר. לכן הבד בכל זוג מקבל סימן הפוך למוט שלו:
          המשי שלילי, והצמר חיובי.
      - kind: reasoning
        text: >-
          חיוביים: זכוכית וצמר. שליליים: משי ו-PVC.
      - kind: reasoning
        text: >-
          יש שישה זוגות. שני זוגות מאותו סימן, זכוכית-צמר ומשי-PVC, דוחים.
          ארבעת הזוגות האחרים, זכוכית-משי, זכוכית-PVC, צמר-משי וצמר-PVC, הם מסימנים הפוכים ומושכים.
      - kind: result
        text: >-
          דוחים: זכוכית וצמר, משי ו-PVC. מושכים: זכוכית ומשי, זכוכית ו-PVC, צמר ומשי, צמר ו-PVC.

  - id: W-1.1-08
    level: bagrut
    qualitative: true
    objectives: [OBJ-1.1-2, OBJ-1.1-3, OBJ-1.1-4]
    prompt: >-
      שלושה תלמידים מסבירים את מה שראו בכיתה. לכל טענה, קבעו אם היא נכונה ונמקו.

      (א) "אפשר לטעון גוף בכל כמות מטען שרוצים, למשל $0.8\cdot10^{-19}\,\text{C}$, אם רק משפשפים מספיק בעדינות."

      (ב) "כשמשפשפים בלון בשיער, החיכוך יוצר מטען שלילי על הבלון, והשיער נשאר כמו שהיה."

      (ג) "אי אפשר לטעון מתכת בשפשוף, כי ניסינו לשפשף כפית מתכת שהחזקנו ביד, והיא לא נטענה."
    answer: >-
      שלוש הטענות שגויות.
    solution:
      - kind: reasoning
        text: >-
          (א) $0.8\cdot10^{-19}/1.6\cdot10^{-19} = 0.5$: חצי אלקטרון. מטען עובר רק באלקטרונים שלמים,
          ולכן $|q| = n\,e$ עם $n$ שלם. הכמות הקטנה ביותר שאפשר להעביר היא $e$, ושפשוף עדין לא משנה זאת.
      - kind: reasoning
        text: >-
          (ב) החיכוך לא יוצר מטען. האלקטרונים שהבלון קיבל באו מהשיער, ולכן השיער טעון חיובית, באותו גודל מטען.
          סך המטען של הבלון והשיער נשאר אפס.
      - kind: reasoning
        text: >-
          (ג) הכפית כן קיבלה או איבדה אלקטרונים בשפשוף. אבל המתכת מוליכה, וגם הגוף שלנו מוליך,
          ולכן המטען עבר מיד דרך היד אל האדמה. אם מחזיקים את הכפית בידית מבודדת, למשל פלסטיק, היא נשארת טעונה.
      - kind: result
        text: >-
          (א) שגויה: מטען הוא כפולה שלמה של $e$.

          (ב) שגויה: מטען נשמר, והשיער טעון חיובית.

          (ג) שגויה: המטען עבר דרך היד לאדמה. כפית בידית מבודדת אפשר לטעון.

  - id: W-1.1-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.1-2, OBJ-1.1-3]
    prompt: >-
      בכדור מתכת קטן וניטרלי יש בערך $1.0\cdot10^{23}$ אלקטרונים. טוענים אותו למטען $+5.0\,\text{nC}$.

      (א) כמה אלקטרונים הוסרו מהכדור, ואיזה חלק הם מכל האלקטרונים שהיו בו?

      (ב) כמה פרוטונים יש בכדור אחרי הטעינה? מה המטען הכולל של כל הפרוטונים שבו?

      (ג) המטען הכולל של הפרוטונים גדול מאוד, ובכל זאת מטען הכדור רק $5.0\,\text{nC}$. הסבירו.

      ($e = 1.6\cdot10^{-19}\,\text{C}$)
    answer: >-
      (א) $3.1\cdot10^{10}$ אלקטרונים, כ-$3\cdot10^{-13}$ מכולם.

      (ב) $1.0\cdot10^{23}$ פרוטונים, עם מטען כולל של כ-$1.6\cdot10^{4}\,\text{C}$.

      (ג) מטען האלקטרונים מקזז כמעט את כולו.
    solution:
      - kind: given
        text: >-
          מספר האלקטרונים בכדור הניטרלי: $N = 1.0\cdot10^{23}$. מטען הכדור אחרי הטעינה: $q = +5.0\cdot10^{-9}\,\text{C}$.
      - kind: formula
        text: >-
          $n = \dfrac{|q|}{e}$. הכדור חיובי, ולכן $n$ הוא מספר האלקטרונים שהוסרו.
      - kind: substitution
        text: >-
          $n = \dfrac{5.0\cdot10^{-9}}{1.6\cdot10^{-19}} = 3.125\cdot10^{10} \approx 3.1\cdot10^{10}$.
      - kind: substitution
        text: >-
          החלק שהוסר: מחלקים את מספר האלקטרונים שהוסרו במספר שהיה,
          $\dfrac{3.1\cdot10^{10}}{1.0\cdot10^{23}} \approx 3.1\cdot10^{-13}$.
      - kind: reasoning
        text: >-
          (ב) הפרוטונים כלואים בגרעינים ולא עוברים, ולכן מספרם לא השתנה. בכדור ניטרלי מספר הפרוטונים שווה
          למספר האלקטרונים, כלומר $1.0\cdot10^{23}$.
      - kind: substitution
        text: >-
          המטען של כל הפרוטונים: $1.0\cdot10^{23} \cdot 1.6\cdot10^{-19} = 1.6\cdot10^{4}\,\text{C}$.
      - kind: reasoning
        text: >-
          (ג) בכדור נשארו $1.0\cdot10^{23} - 3.1\cdot10^{10}$ אלקטרונים, ומטענם השלילי מקזז כמעט את כל המטען של הפרוטונים.
          מה שנשאר בלי קיזוז הוא רק המטען של $3.1\cdot10^{10}$ הפרוטונים שאין מולם אלקטרון: $5.0\,\text{nC}$.
      - kind: result
        text: >-
          (א) $3.1\cdot10^{10}$ אלקטרונים הוסרו, כ-$3.1\cdot10^{-13}$ מכל האלקטרונים.

          (ב) $1.0\cdot10^{23}$ פרוטונים, עם מטען כולל של כ-$1.6\cdot10^{4}\,\text{C}$.

          (ג) המטען של הכדור הוא ההפרש בין מטען הפרוטונים למטען האלקטרונים, והפרש זעיר בין שני מספרים ענקיים.

  - id: W-1.1-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.1-2, OBJ-1.1-3, OBJ-1.1-4]
    prompt: >-
      רצועה נעה לוקחת אלקטרונים מכדור מתכת B ומביאה אותם לכיפת מתכת. בכל שנייה מגיעים לכיפה $2.0\cdot10^{12}$ אלקטרונים.
      הכיפה והכדור B עומדים על עמודים מבודדים, ושניהם ניטרליים בהתחלה. האוויר מבודד, ומטען לא בורח דרכו.

      (א) כעבור כמה זמן מטען הכיפה יהיה $-4.0\,\mu\text{C}$?

      (ב) מה המטען של B ברגע הזה?

      (ג) תלמיד אומר שברגע מסוים בדרך מטען הכיפה היה בדיוק $-1.0\cdot10^{-18}\,\text{C}$. קבעו ונמקו.

      (ד) מה משתנה אם מעמידים את הכיפה על עמוד מתכת שנוגע ברצפה?

      ($e = 1.6\cdot10^{-19}\,\text{C}$)
    answer: >-
      (א) $12.5\,\text{s}$.

      (ב) $+4.0\,\mu\text{C}$.

      (ג) לא נכון: זה $6.25$ אלקטרונים.

      (ד) הכיפה לא נטענת: המטען עובר דרך העמוד אל האדמה.
    solution:
      - kind: given
        text: >-
          קצב ההגעה: $2.0\cdot10^{12}$ אלקטרונים בשנייה. המטען הרצוי: $q = -4.0\cdot10^{-6}\,\text{C}$.
      - kind: formula
        text: >-
          מספר האלקטרונים שצריכים להגיע הוא $n = |q|/e$. הזמן הוא המספר הזה חלקי מספר האלקטרונים שמגיעים בכל שנייה.
      - kind: substitution
        text: >-
          $n = \dfrac{4.0\cdot10^{-6}}{1.6\cdot10^{-19}} = 2.5\cdot10^{13}$,
          ו-$t = \dfrac{2.5\cdot10^{13}}{2.0\cdot10^{12}\ \text{1/s}} = 12.5\,\text{s}$.
      - kind: reasoning
        text: >-
          (ב) הכיפה, הרצועה והכדור B הם מערכת סגורה שסך המטען שלה אפס. מזניחים את המעט שנמצא על הרצועה עצמה ברגע הזה. כל אלקטרון שהגיע לכיפה יצא מ-B,
          ולכן B איבד $2.5\cdot10^{13}$ אלקטרונים ומטענו $+4.0\,\mu\text{C}$.
      - kind: reasoning
        text: >-
          (ג) $\dfrac{1.0\cdot10^{-18}}{1.6\cdot10^{-19}} = 6.25$. האלקטרונים מגיעים אחד-אחד, ולכן המטען קופץ מ-$6e$ ישר ל-$7e$
          (בגודלו) ולא עובר בערכים שביניהם.
      - kind: reasoning
        text: >-
          (ד) עמוד המתכת, הרצפה והאדמה מוליכים. האלקטרונים העודפים דוחים זה את זה וממשיכים לנוע דרך העמוד אל האדמה,
          ולכן הכיפה נשארת ניטרלית כמעט לגמרי. המערכת כבר לא סגורה, והמטען השלילי מצטבר באדמה.
      - kind: result
        text: >-
          (א) כעבור $12.5\,\text{s}$.

          (ב) $q_B = +4.0\,\mu\text{C}$.

          (ג) הטענה שגויה: $-1.0\cdot10^{-18}\,\text{C}$ הוא $6.25$ מטענים יסודיים, ומטען כזה לא קיים.

          (ד) הכיפה לא נטענת, כי המטען עובר דרך עמוד המתכת אל האדמה. B עדיין נטען חיובית.

challenge:
  - id: W-1.1-c1
    stars: 1
    objectives: [OBJ-1.1-3, OBJ-1.1-4, OBJ-1.1-2]
    prompt: >-
      מעבירים מסרק פלסטיק ניטרלי בשיער, והמסרק נעשה טעון שלילית. כל הזמן מחזיקים את המסרק ביד.

      (א) אילו חלקיקים עברו בתהליך, ובאיזה כיוון?

      (ב) תלמידה מציעה הסבר אחר: "המסרק איבד פרוטונים אל היד שמחזיקה אותו, ולכן נשאר שלילי." מה לא נכון בהסבר?

      (ג) מטען המסרק $-4.8\,\text{nC}$. כמה אלקטרונים עברו, ומה מטען השיער? הניחו שהמסרק והשיער הם מערכת סגורה.

      (ד) למה המסרק נשאר טעון אף שמחזיקים אותו ביד, ואילו מסרק מתכת שמחזיקים ביד לא היה נשאר טעון?

      ($e = 1.6\cdot10^{-19}\,\text{C}$)
    answer: >-
      (א) אלקטרונים, מהשיער אל המסרק.

      (ב) פרוטונים לא עוברים בטעינה, כי הם כלואים בגרעינים.

      (ג) $3.0\cdot10^{10}$ אלקטרונים; השיער $+4.8\,\text{nC}$.

      (ד) הפלסטיק מבודד, והמטען לא מגיע ליד.
    solution:
      - kind: reasoning
        text: >-
          (א) בגופים מוצקים רק אלקטרונים עוברים. המסרק נעשה שלילי, ולכן קיבל אלקטרונים. הם באו מהשיער, שנעשה חיובי.
      - kind: reasoning
        text: >-
          (ב) הפרוטונים כלואים בגרעיני האטומים, ובטעינה הם לא עוברים מגוף לגוף. מה שקובע את הסימן הוא
          אילו אלקטרונים עברו. חוץ מזה, המסרק עשוי פלסטיק, ומטען לא זורם דרכו אל היד.
      - kind: formula
        text: '$n = \dfrac{|q|}{e}$, ושימור המטען: $q_1 + q_2 = 0$ (1 למסרק, 2 לשיער).'
      - kind: substitution
        text: >-
          $n = \dfrac{4.8\cdot10^{-9}}{1.6\cdot10^{-19}} = 3.0\cdot10^{10}$. מטען השיער: $+4.8\,\text{nC}$.
      - kind: reasoning
        text: >-
          (ד) בפלסטיק, מבודד, האלקטרונים העודפים נשארים במקום שבו נחתו, על השיניים ששפשפו, ולא מגיעים אל היד.
          במתכת, מוליך, הם היו מתפזרים על כל המסרק, מגיעים אל היד, ועוברים דרך הגוף, שגם הוא מוליך, אל האדמה.
      - kind: result
        text: >-
          (א) אלקטרונים עברו מהשיער אל המסרק.

          (ב) פרוטונים לא עוברים בטעינה, והמטען לא יכול לזרום דרך הפלסטיק אל היד.

          (ג) $3.0\cdot10^{10}$ אלקטרונים, והשיער טעון $+4.8\,\text{nC}$.

          (ד) פלסטיק מבודד שומר את המטען במקום. מסרק מתכת היה מעביר אותו דרך היד אל האדמה.
    source:
      name: AAPT PhysicsBowl
      year: 2009
      problem: 'Q23'
      url: https://www.aapt.org/Programs/PhysicsBowl/upload/PhysicsBowl_2009_Exam.pdf
      verified: '2026-11-02'
      adapted: true

  - id: W-1.1-c2
    stars: 1
    objectives: [OBJ-1.1-1, OBJ-1.1-2]
    prompt: >-
      שלושה כדורי מתכת, A, B ו-C, תלויים כל אחד על חוט משי. מקרבים אותם שניים-שניים:
      A ו-B דוחים זה את זה, וגם B ו-C דוחים זה את זה.

      (א) מה אפשר לומר בוודאות על הסימנים של שלושת הכדורים?

      (ב) האם ייתכן שאחד הכדורים ניטרלי? קבעו ונמקו.

      (ג) מה יקרה כשיקרבו את A ל-C?

      (ד) ידוע שמטען B הוא $-3.2\,\text{nC}$. כמה אלקטרונים עודפים יש עליו?

      ($e = 1.6\cdot10^{-19}\,\text{C}$)
    answer: >-
      (א) לשלושתם אותו סימן.

      (ב) לא.

      (ג) הם ידחו זה את זה.

      (ד) $2.0\cdot10^{10}$ אלקטרונים עודפים.
    solution:
      - kind: reasoning
        text: >-
          (א) דחייה קורית רק בין שני גופים טעונים מאותו סימן. A ו-B דוחים, ולכן הם מאותו סימן.
          B ו-C דוחים, ולכן גם הם מאותו סימן. מכאן שלשלושתם אותו סימן, אבל מהנתונים אי אפשר לדעת איזה.
      - kind: reasoning
        text: >-
          (ב) כל אחד מהכדורים משתתף לפחות בדחייה אחת, ודחייה דורשת ששני הגופים יהיו טעונים. לכן אף אחד מהם לא ניטרלי.
      - kind: reasoning
        text: >-
          (ג) A ו-C מאותו סימן, ולכן ידחו זה את זה. אין צורך לדעת אם הסימן חיובי או שלילי.
      - kind: substitution
        text: >-
          (ד) $n = \dfrac{|q|}{e} = \dfrac{3.2\cdot10^{-9}}{1.6\cdot10^{-19}} = 2.0\cdot10^{10}$.
          המטען שלילי, ולכן אלה אלקטרונים עודפים.
      - kind: result
        text: >-
          (א) לשלושת הכדורים אותו סימן, שאינו ידוע מהנתונים.

          (ב) לא: כל אחד מהם נדחה, ורק גוף טעון נדחה.

          (ג) A ו-C ידחו זה את זה.

          (ד) על B יש $2.0\cdot10^{10}$ אלקטרונים עודפים, ולכן גם A ו-C שליליים.
    source:
      name: University of Saskatchewan High School Physics Scholarship Competition
      year: 2007
      problem: 'Q27'
