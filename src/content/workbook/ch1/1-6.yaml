# Workbook for lesson 1.6: ten practice problems and two sourced challenge problems.
# Every number recomputed with src/physics/electrostatics.ts (fieldAt, traceFieldLine) and constants.ts.

lesson: '1.6'
practice:
  - id: W-1.6-01
    level: basic
    qualitative: true
    objectives: [OBJ-1.6-2, OBJ-1.6-1]
    prompt: >-
      בציור מטען נקודתי חיובי בודד וקווי השדה שלו. הנקודה A נמצאת $2\,\text{cm}$ מימין למטען,
      והנקודה B נמצאת $4\,\text{cm}$ מעליו.

      (א) מה כיוון השדה ב-A, ומה כיוונו ב-B?

      (ב) באיזו משתי הנקודות השדה חזק יותר? נמקו פעם אחת מהציור, ופעם אחת מהנוסחה, וקבעו פי כמה.
    answer: >-
      (א) ב-A ימינה, ב-B למעלה: הרחק מהמטען.

      (ב) ב-A, פי 4.
    solution:
      - kind: reasoning
        text: >-
          (א) הקווים של מטען חיובי בודד ישרים ויוצאים ממנו לכל הכיוונים (כלל 1). הקו שעובר ב-A פונה ימינה, והקו שעובר ב-B פונה למעלה. השדה משיק לקו ובכיוון החץ (כלל 2).
      - kind: reasoning
        text: >-
          (ב) מהציור: הקווים מתרווחים ככל שמתרחקים מהמטען, ולכן ב-A, הקרובה, הם צפופים יותר והשדה חזק יותר (כלל 3).
      - kind: formula
        text: >-
          מהנוסחה: $E = k|Q|/r^2$. המרחק של B גדול פי 2, ולכן העוצמה שם קטנה פי $2^2 = 4$.
      - kind: result
        text: >-
          (א) ב-A ימינה, ב-B למעלה. (ב) השדה ב-A חזק פי 4 מהשדה ב-B. הציור נותן רק "חזק יותר", והנוסחה נותנת "פי כמה".

  - id: W-1.6-02
    level: basic
    qualitative: false
    objectives: [OBJ-1.6-3]
    prompt: >-
      צייר בחר לצייר 20 קווים למטען של $5\,\mu\text{C}$.

      (א) כמה קווים יצייר באותו ציור למטען $q = -3\,\mu\text{C}$, והאם הם ייצאו ממנו או ייכנסו אליו?

      (ב) ממטען אחר באותו ציור יוצאים 30 קווים. מה המטען שלו?
    answer: >-
      (א) 12 קווים, שנכנסים אליו.

      (ב) $+7.5\,\mu\text{C}$
    solution:
      - kind: given
        text: >-
          20 קווים ל-$5\,\mu\text{C}$, ובאותו ציור מספר הקווים ביחס ישר לגודל המטען (כלל 5).
      - kind: manipulation
        text: >-
          מחלקים את מספר הקווים במטען, כדי לדעת כמה קווים מקבל כל $\mu\text{C}$: $20/5 = 4$ קווים לכל $\mu\text{C}$.
      - kind: substitution
        text: >-
          (א) $3 \cdot 4 = 12$ קווים. המטען שלילי, ולכן הקווים נכנסים אליו (כלל 1).
      - kind: substitution
        text: >-
          (ב) מחלקים את מספר הקווים במספר הקווים לכל $\mu\text{C}$: $30/4 = 7.5\,\mu\text{C}$. הקווים יוצאים, ולכן המטען חיובי.
      - kind: result
        text: >-
          (א) 12 קווים, שנכנסים למטען. (ב) $+7.5\,\mu\text{C}$.

  - id: W-1.6-03
    level: basic
    qualitative: false
    objectives: [OBJ-1.6-2]
    prompt: >-
      בנקודה P בציור, קו השדה פונה ימינה. על מטען $q = -2\,\mu\text{C}$ שמונח ב-P פועל כוח חשמלי של $0.04\,\text{N}$.

      (א) מה כיוון הכוח על המטען?

      (ב) מה עוצמת השדה ב-P, ומה כיוונו?

      (ג) מחליפים את המטען בפרוטון. מה הכוח על הפרוטון: גודל וכיוון?
    answer: >-
      (א) שמאלה.

      (ב) $2\cdot10^{4}\,\text{N/C}$, ימינה.

      (ג) $3.2\cdot10^{-15}\,\text{N}$, ימינה.
    solution:
      - kind: reasoning
        text: >-
          (א) הקו ב-P פונה ימינה, ולכן השדה ב-P פונה ימינה. המטען שלילי, והכוח עליו הפוך לשדה: שמאלה.
      - kind: formula
        text: >-
          $E = \dfrac{F}{|q|}$. השדה לא תלוי במטען הבוחן, ולכן הוא אותו שדה גם כשמחליפים את המטען.
      - kind: substitution
        text: >-
          (ב) $E = \dfrac{0.04}{2\cdot10^{-6}} = 2\cdot10^{4}\,\text{N/C}$, בכיוון הקו: ימינה.
      - kind: substitution
        text: >-
          (ג) $F = eE = 1.6\cdot10^{-19} \cdot 2\cdot10^{4} = 3.2\cdot10^{-15}\,\text{N}$. הפרוטון חיובי, ולכן הכוח עליו בכיוון השדה.
      - kind: result
        text: >-
          (א) שמאלה. (ב) $2\cdot10^{4}\,\text{N/C}$, ימינה. (ג) $3.2\cdot10^{-15}\,\text{N}$, ימינה, בכיוון החץ שעל הקו.

  - id: W-1.6-04
    level: mid
    qualitative: true
    objectives: [OBJ-1.6-1]
    prompt: >-
      בציור של מטען חיובי בודד, 12 קווים יוצאים מהמטען, כולם מאותה נקודה. תלמיד אומר:
      "במקום של המטען נפגשים 12 קווים. אז קווי שדה כן יכולים להיחתך, ו'כלל 4' לא תמיד נכון."

      (א) האם התלמיד צודק? נמקו.

      (ב) בנקודה P, רחוק מהמטען, השדה אינו אפס. כמה קווים יכולים לעבור דרך P: אפס, אחד, או שניים?
    answer: >-
      (א) לא. כלל 4 מדבר על נקודות שאין בהן מטען. במטען הקווים מתחילים או מסתיימים.

      (ב) אפס או אחד, אף פעם לא שניים.
    solution:
      - kind: reasoning
        text: >-
          (א) הנימוק של כלל 4: בנקודה שבה יש שדה, יש לו כיוון אחד, והקו משיק לכיוון הזה. בנקודה של מטען נקודתי אין לשדה כיוון אחד: ליד המטען החיובי השדה מצביע הרחק ממנו לכל הכיוונים.
      - kind: reasoning
        text: >-
          לכן במטען הקווים לא "נחתכים". זו הנקודה שבה הם מתחילים (במטען חיובי) או מסתיימים (במטען שלילי), כמו בכלל 1.
      - kind: reasoning
        text: >-
          (ב) ב-P יש לשדה כיוון אחד. אם מציירים דרך P קו, הוא משיק לכיוון הזה, ולכן יש רק קו אחד אפשרי. ואם הצייר בחר לא לצייר קו דרך P, יש שם שדה גם בלי קו.
      - kind: result
        text: >-
          (א) התלמיד טועה: הקווים נפגשים רק במטען עצמו, שם הם מתחילים או מסתיימים. מחוץ למטענים קווים לא נחתכים. (ב) אפס או אחד.

  - id: W-1.6-05
    level: mid
    qualitative: false
    objectives: [OBJ-1.6-3, OBJ-1.6-1]
    prompt: >-
      בציור יש שלושה מטענים, וכל $1\,\mu\text{C}$ מצויר עם 2 קווים. ממטען A יוצאים 8 קווים. אל מטען B נכנסים 8 קווים,
      ואל מטען C נכנסים 4 קווים.

      (א) מצאו את המטען של כל אחד מהשלושה.

      (ב) כמה מהקווים שנכנסים ל-B ול-C לא התחילו ב-A? מאיפה הם מגיעים?

      (ג) מה המטען הכולל של שלושת המטענים, ואיך ייראו הקווים רחוק מאוד מהם?
    answer: >-
      (א) $q_A = +4\,\mu\text{C}$, $q_B = -4\,\mu\text{C}$, $q_C = -2\,\mu\text{C}$.

      (ב) 4 קווים, שמגיעים מרחוק.

      (ג) $q_A + q_B + q_C = -2\,\mu\text{C}$. מרחוק הקווים ישרים ונכנסים פנימה, כמו אל מטען שלילי אחד.
    solution:
      - kind: given
        text: >-
          2 קווים לכל $\mu\text{C}$. A: 8 קווים יוצאים, B: 8 נכנסים, C: 4 נכנסים.
      - kind: substitution
        text: >-
          (א) מחלקים כל מספר קווים ב-2: $|q_A| = 4\,\mu\text{C}$, $|q_B| = 4\,\mu\text{C}$, $|q_C| = 2\,\mu\text{C}$. מ-A הקווים יוצאים, ולכן הוא חיובי. ל-B ול-C הם נכנסים, ולכן הם שליליים.
      - kind: reasoning
        text: >-
          (ב) קו נכנס למטען שלילי רק אם הוא התחיל במטען חיובי או הגיע מרחוק. נכנסים $8 + 4 = 12$ קווים, ורק 8 יוצאים מ-A. המטען הכולל שלילי (מחשבים אותו בסעיף ג), ולכן רחוק מהמטענים הקווים רק נכנסים, ואף קו של A לא בורח הרחק: כל 8 הקווים של A נגמרים ב-B או ב-C. לכן $12 - 8 = 4$ קווים מגיעים מרחוק, מחוץ לציור.
      - kind: substitution
        text: >-
          (ג) $q_A + q_B + q_C = 4 - 4 - 2 = -2\,\mu\text{C}$. בדיקה: 4 הקווים שמגיעים מרחוק הם $4/2 = 2\,\mu\text{C}$.
      - kind: result
        text: >-
          (א) $+4$, $(-4)$ ו-$(-2)$ מיקרו-קולון. (ב) 4 קווים מגיעים מרחוק. (ג) המטען הכולל $q_A + q_B + q_C = -2\,\mu\text{C}$, ורחוק מאוד הקווים נראים כמו קווים ישרים שנכנסים למטען שלילי אחד.

  - id: W-1.6-06
    level: mid
    qualitative: true
    objectives: [OBJ-1.6-2, OBJ-1.6-1]
    prompt: >-
      שני מטענים חיוביים שווים נמצאים במרחק קבוע זה מזה, ו-M היא נקודת האמצע ביניהם. הנקודה U נמצאת מעל M, על הקו שניצב לקטע שבין המטענים,
      והנקודה D נמצאת מתחת ל-M, באותו מרחק ממנה.

      (א) קבעו ונמקו: מה כיוון השדה ב-U, ומה כיוונו ב-D?

      (ב) תלמידה אומרת: "ב-M הקווים של שני המטענים נפגשים חזיתית, ולכן עוברים דרך M שני קווים." מה באמת קורה ב-M?

      (ג) משחררים ממנוחה פרוטון בנקודה U. לאיזה כיוון הוא מתחיל לנוע?
    answer: >-
      (א) ב-U למעלה, וב-D למטה: הרחק מ-M.

      (ב) ב-M השדה אפס, ולכן לא עובר דרכה אף קו.

      (ג) למעלה.
    solution:
      - kind: reasoning
        text: >-
          (א) U נמצאת באותו מרחק משני המטענים, והם שווים, ולכן לשני השדות ב-U אותה עוצמה. השדה של המטען השמאלי פונה הרחק ממנו, למעלה וימינה. השדה של הימני פונה למעלה ושמאלה.
          הרכיבים האופקיים שווים ומנוגדים ומתבטלים, והרכיבים האנכיים, שניהם למעלה, מתחברים. ב-D הכול הפוך בתמונת ראי: שני הרכיבים האנכיים למטה.
      - kind: reasoning
        text: >-
          בציור רואים זאת כך: הקווים שיוצאים משני המטענים אל האמצע מתעקלים הצידה, למעלה או למטה, ולאורך הקו האנכי שעובר ב-M הם פונים הרחק מ-M.
      - kind: reasoning
        text: >-
          (ב) ב-M שני השדות שווים ומנוגדים, ולכן השדה השקול אפס. שם אין לשדה כיוון, ולכן אין קו (זו נקודת האפס). גם בלי זה, שני קווים לא יכולים לעבור באותה נקודה (כלל 4).
      - kind: reasoning
        text: >-
          (ג) הפרוטון חיובי, ולכן הכוח עליו בכיוון השדה ב-U, למעלה. הוא במנוחה, ולכן מתחיל לנוע בכיוון הכוח.
      - kind: result
        text: >-
          (א) ב-U למעלה, וב-D למטה. (ב) ב-M השדה אפס, ואין דרכה אף קו. (ג) הפרוטון מתחיל לנוע למעלה, הרחק משני המטענים.

  - id: W-1.6-07
    level: mid
    qualitative: false
    objectives: [OBJ-1.6-2, OBJ-1.6-1]
    prompt: >-
      שני מטענים של $+2\,\mu\text{C}$ נמצאים במרחק $0.4\,\text{m}$ זה מזה. M היא נקודת האמצע ביניהם. הנקודה P נמצאת על הקטע שבין המטענים,
      $0.05\,\text{m}$ מימין ל-M. הנקודה S נמצאת על הקטע, $0.05\,\text{m}$ משמאל למטען הימני.

      (א) מה עוצמת השדה ב-M?

      (ב) חשבו את השדה ב-P וב-S: גודל וכיוון.

      (ג) הסבירו בעזרת התוצאות למה בציור הקווים האזור סביב M נראה כמעט ריק.
    answer: >-
      (א) אפס.

      (ב) ב-P כ-$5.1\cdot10^{5}\,\text{N/C}$ וב-S כ-$7.1\cdot10^{6}\,\text{N/C}$, בשתיהן שמאלה.

      (ג) ב-P, קרוב ל-M, השדה חלש פי 14 בערך מאשר ב-S, ליד המטען, ולכן סביב M הקווים דלילים מאוד.
    solution:
      - kind: given
        text: >-
          $q = 2\cdot10^{-6}\,\text{C}$ לכל מטען. P נמצאת $0.15\,\text{m}$ מהמטען הימני ו-$0.25\,\text{m}$ מהשמאלי. S נמצאת $0.05\,\text{m}$ מהמטען הימני ו-$0.35\,\text{m}$ מהשמאלי.
      - kind: reasoning
        text: >-
          (א) ב-M המרחקים שווים והמטענים שווים, והשדות מנוגדים. לכן $E_M = 0$: זו נקודת האפס.
      - kind: reasoning
        text: >-
          כיוונים ב-P וב-S: השדה של המטען הימני פונה הרחק ממנו, שמאלה, והשדה של השמאלי פונה ימינה. המטען הימני קרוב יותר, ולכן השדה השקול שמאלה, ועוצמתו היא ההפרש.
      - kind: formula
        text: >-
          $E = kq\left(\dfrac{1}{r_1^2} - \dfrac{1}{r_2^2}\right)$, כש-$r_1$ המרחק מהמטען הקרוב ו-$r_2$ מהרחוק.
      - kind: substitution
        text: >-
          $E_P = 9\cdot10^9 \cdot 2\cdot10^{-6}\left(\dfrac{1}{0.15^2} - \dfrac{1}{0.25^2}\right) \approx 5.1\cdot10^{5}\,\text{N/C}$
      - kind: substitution
        text: >-
          $E_S = 9\cdot10^9 \cdot 2\cdot10^{-6}\left(\dfrac{1}{0.05^2} - \dfrac{1}{0.35^2}\right) \approx 7.1\cdot10^{6}\,\text{N/C}$
      - kind: reasoning
        text: >-
          (ג) $E_S / E_P \approx 14$. צפיפות הקווים מראה את עוצמת השדה, ולכן סביב M הקווים דלילים מאוד. שימו לב: ב-P השדה פונה שמאלה, אל M. על הקטע, משני צדי M, השדה פונה אל נקודת האפס.
      - kind: result
        text: >-
          (א) $E_M = 0$. (ב) ב-P כ-$5.1\cdot10^{5}\,\text{N/C}$, וב-S כ-$7.1\cdot10^{6}\,\text{N/C}$, בשתיהן שמאלה. (ג) סביב M השדה קטן, אבל לא אפס, ולכן הקווים שם מעטים, ודרך M עצמה לא עובר קו.

  - id: W-1.6-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.6-3]
    prompt: >-
      בציור של שני מטענים, A ו-B, המרחק ביניהם $0.35\,\text{m}$. מ-A יוצאים 25 קווים. גם מ-B יוצאים קווים, אבל הם מצוירים מטושטשים ואי אפשר לספור אותם.
      נקודת האפס נמצאת על הקטע שבין המטענים, $0.1\,\text{m}$ מ-B.

      (א) מה הסימן של B? נמקו בשתי דרכים.

      (ב) פי כמה A גדול מ-B, וכמה קווים יוצאים מ-B?

      (ג) נתון $q_A = 5\,\mu\text{C}$. מצאו את $q_B$, ובדקו שבנקודת האפס השדות של שני המטענים שווים בגודלם.
    answer: >-
      (א) חיובי.

      (ב) פי 6.25, ו-4 קווים.

      (ג) $q_B = 0.8\,\mu\text{C}$. בנקודת האפס כל אחד מהשדות $7.2\cdot10^{5}\,\text{N/C}$.
    solution:
      - kind: reasoning
        text: >-
          (א) דרך ראשונה: קווים יוצאים מ-B, ולכן הוא חיובי. דרך שנייה: נקודת האפס נמצאת על הקטע שבין המטענים. שם השדות של שני המטענים מנוגדים בכיוונם רק אם הסימנים שלהם שווים, ו-A חיובי.
      - kind: given
        text: >-
          המרחק של נקודת האפס מ-A הוא $0.35 - 0.1 = 0.25\,\text{m}$, ומ-B הוא $0.1\,\text{m}$.
      - kind: formula
        text: >-
          בנקודת האפס $\dfrac{kq_A}{r_A^2} = \dfrac{kq_B}{r_B^2}$.
      - kind: manipulation
        text: >-
          מחלקים את שני האגפים ב-$kq_B$ וכופלים ב-$r_A^2$, כדי לבודד את היחס בין המטענים: $\dfrac{q_A}{q_B} = \left(\dfrac{r_A}{r_B}\right)^2$.
      - kind: substitution
        text: >-
          (ב) $\dfrac{q_A}{q_B} = \left(\dfrac{0.25}{0.1}\right)^2 = 2.5^2 = 6.25$. מספר הקווים ביחס ישר למטען, ולכן מ-B יוצאים $25 / 6.25 = 4$ קווים.
      - kind: substitution
        text: >-
          (ג) $q_B = 5 / 6.25 = 0.8\,\mu\text{C}$. בדיקה: $E_A = \dfrac{9\cdot10^9 \cdot 5\cdot10^{-6}}{0.25^2} = 7.2\cdot10^{5}\,\text{N/C}$, ו-$E_B = \dfrac{9\cdot10^9 \cdot 0.8\cdot10^{-6}}{0.1^2} = 7.2\cdot10^{5}\,\text{N/C}$.
      - kind: result
        text: >-
          (א) B חיובי. (ב) A גדול פי 6.25 מ-B, ומ-B יוצאים 4 קווים. (ג) $q_B = 0.8\,\mu\text{C}$, ובנקודת האפס כל אחד מהשדות $7.2\cdot10^{5}\,\text{N/C}$, בכיוונים מנוגדים.

  - id: W-1.6-09
    level: bagrut
    qualitative: true
    objectives: [OBJ-1.6-1, OBJ-1.6-3]
    prompt: >-
      מטען $+4q$ נמצא משמאל, ומטען $(-q)$ נמצא מימין לו. בציור מצוירים 4 קווים לכל $q$.

      (א) כמה קווים יוצאים מ-$+4q$, כמה מהם נגמרים במטען השלילי, ומה קורה לשאר? באיזה צד נמצאת נקודת האפס: בין המטענים, משמאל ל-$+4q$, או מימין למטען השלילי?

      (ב) מה משתנה אם מחליפים את המטען השלילי במטען $(-4q)$?

      (ג) ומה משתנה אם מחליפים אותו במטען $(-8q)$?
    answer: >-
      (א) 16 יוצאים, 4 נגמרים במטען השלילי, ו-12 ממשיכים הרחק. נקודת האפס מימין למטען השלילי.

      (ב) כל 16 הקווים נגמרים במטען השלילי, ואין נקודת אפס.

      (ג) 32 קווים נכנסים למטען השלילי: 16 מ-$+4q$ ו-16 מרחוק. נקודת האפס עוברת לצד שמאל של $+4q$.
    solution:
      - kind: reasoning
        text: >-
          (א) מ-$+4q$ יוצאים $4 \cdot 4 = 16$ קווים, ואל המטען השלילי נכנסים 4. המטען הכולל חיובי ($+3q$), ולכן רחוק מהזוג הקווים רק יוצאים, ואף קו לא מגיע מרחוק. הקווים שנכנסים למטען השלילי מגיעים אפוא כולם מהמטען החיובי, ולכן $16 - 4 = 12$ קווים ממשיכים הרחק.
      - kind: reasoning
        text: >-
          נקודת האפס: בין המטענים שני השדות פונים ימינה (הרחק מהחיובי ואל השלילי), ולכן שם אין אפס. משמאל ל-$+4q$ המטען הגדול קרוב יותר, ושדהו גובר. מימין למטען השלילי הכיוונים מנוגדים, והמטען הקטן קרוב יותר, ולכן שם השדות יכולים להתבטל.
      - kind: reasoning
        text: >-
          (ב) המטענים שווים בגודלם: 16 קווים יוצאים ו-16 נכנסים, ולכן כל קו שיוצא מהחיובי נגמר בשלילי. בין המטענים השדות באותו כיוון. מחוץ לקטע השדות מנוגדים, אבל המטענים שווים, ולכן בכל נקודה שם המטען הקרוב יותר גובר. לכן אין נקודת אפס.
      - kind: reasoning
        text: >-
          (ג) עכשיו אל המטען השלילי נכנסים 32 קווים, ורק 16 יוצאים מ-$+4q$. לכן 16 קווים מגיעים מרחוק. התפקידים התהפכו: המטען הקטן בגודלו הוא $+4q$, ונקודת האפס נמצאת מצדו החיצוני, משמאל לו.
      - kind: result
        text: >-
          (א) 16, מהם 4 נגמרים בשלילי ו-12 ממשיכים הרחק. נקודת האפס מימין למטען השלילי. (ב) כל הקווים עוברים מהחיובי אל השלילי, ואין נקודת אפס. (ג) 16 קווים מגיעים מרחוק אל המטען השלילי, ונקודת האפס עוברת לשמאל של $+4q$. נקודת האפס תמיד נמצאת מהצד החיצוני של המטען הקטן בגודלו.

  - id: W-1.6-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.6-2]
    prompt: >-
      ארבעה מטענים נמצאים בקודקודים של ריבוע שאורך צלעו $0.3\,\text{m}$. בשני הקודקודים השמאליים יש מטענים חיוביים של $1\,\mu\text{C}$,
      ובשני הקודקודים הימניים יש מטענים שליליים של $1\,\mu\text{C}$.

      (א) קבעו ונמקו, בלי חישוב: לאיזה כיוון פונה קו השדה שעובר במרכז הריבוע?

      (ב) חשבו את עוצמת השדה במרכז הריבוע.

      (ג) מניחים במרכז הריבוע אלקטרון. מה הכוח עליו, גודל וכיוון, ולאיזה כיוון הוא מתחיל לנוע?
    answer: >-
      (א) ימינה.

      (ב) כ-$5.7\cdot10^{5}\,\text{N/C}$.

      (ג) כ-$9.1\cdot10^{-14}\,\text{N}$, שמאלה, והוא מתחיל לנוע שמאלה.
    solution:
      - kind: reasoning
        text: >-
          (א) הקווים יוצאים מהמטענים החיוביים שמשמאל ונכנסים לשליליים שמימין. הריבוע סימטרי ביחס לקו האופקי שעובר במרכזו, ולכן במרכז אין לשדה רכיב למעלה או למטה. הקו במרכז פונה ימינה, מהחיוביים אל השליליים.
      - kind: given
        text: >-
          המרחק מהמרכז לכל קודקוד הוא חצי האלכסון: $r^2 = \dfrac{a^2}{2} = \dfrac{0.3^2}{2} = 0.045\,\text{m}^2$. כל ארבע התרומות שוות בגודלן.
      - kind: substitution
        text: >-
          תרומה אחת: $E_1 = \dfrac{kq}{r^2} = \dfrac{9\cdot10^9 \cdot 1\cdot10^{-6}}{0.045} = 2\cdot10^{5}\,\text{N/C}$.
      - kind: reasoning
        text: >-
          כיוונים: השדה של כל מטען חיובי פונה הרחק ממנו, והשדה של כל מטען שלילי פונה אליו. כל אחת מארבע התרומות נוטה $45^\circ$ מהכיוון ימינה, שתיים למעלה ושתיים למטה. הרכיבים האנכיים מתבטלים, והרכיבים האופקיים, כולם ימינה, מתחברים.
      - kind: substitution
        text: >-
          (ב) $E = 4E_1\cos 45^\circ = 4 \cdot 2\cdot10^{5} \cdot 0.707 \approx 5.7\cdot10^{5}\,\text{N/C}$, ימינה.
      - kind: substitution
        text: >-
          (ג) $F = eE = 1.6\cdot10^{-19} \cdot 5.66\cdot10^{5} \approx 9.1\cdot10^{-14}\,\text{N}$. האלקטרון שלילי, ולכן הכוח הפוך לשדה: שמאלה. הוא נמצא במנוחה, ולכן מתחיל לנוע בכיוון הכוח.
      - kind: result
        text: >-
          (א) ימינה. (ב) כ-$5.7\cdot10^{5}\,\text{N/C}$, ימינה. (ג) כ-$9.1\cdot10^{-14}\,\text{N}$, שמאלה, ושמאלה הוא מתחיל לנוע: נגד החץ שעל הקו, אל המטענים החיוביים.

challenge:
  - id: W-1.6-c1
    stars: 1
    objectives: [OBJ-1.6-1, OBJ-1.6-3]
    prompt: >-
      מטען $+8q$ נמצא בראשית ציר x, ומטען $(-2q)$ נמצא בנקודה $x = L$. נתון $q = 1\,\mu\text{C}$ ו-$L = 0.3\,\text{m}$.

      (א) באיזו נקודה על ציר x השדה השקול אפס?

      (ב) בציור הקווים יוצאים מ-$+8q$ 32 קווים. כמה מהם נגמרים ב-$(-2q)$, וכמה ממשיכים הרחק?

      (ג) מה כיוון השדה על ציר x בין $x = L$ לנקודת האפס, ומה כיוונו מעבר לנקודת האפס? הסבירו בעזרת הקווים.
    answer: >-
      (א) $x = 2L = 0.6\,\text{m}$.

      (ב) 8 נגמרים ב-$(-2q)$, ו-24 ממשיכים הרחק.

      (ג) בין $L$ לנקודת האפס השדה פונה שמאלה, אל $(-2q)$. מעבר לנקודת האפס הוא פונה ימינה.
    solution:
      - kind: reasoning
        text: >-
          (א) מחפשים איפה שני השדות מנוגדים בכיוונם. בין המטענים שניהם פונים ימינה (הרחק מהחיובי ואל השלילי), ולכן שם אין אפס. משמאל לראשית המטען הגדול גם קרוב יותר, ושדהו גובר. נשאר האזור $x > L$: שם השדות מנוגדים, והמטען הקטן קרוב יותר.
      - kind: formula
        text: >-
          בנקודת האפס $\dfrac{k \cdot 8q}{x^2} = \dfrac{k \cdot 2q}{(x - L)^2}$.
      - kind: manipulation
        text: >-
          מצמצמים את $kq$ ומסדרים: $\dfrac{x^2}{(x-L)^2} = 4$. שני המרחקים חיוביים, ולכן מוציאים שורש: $\dfrac{x}{x - L} = 2$. כופלים ב-$(x - L)$: $x = 2x - 2L$, ולכן $x = 2L$.
      - kind: substitution
        text: >-
          $x = 2 \cdot 0.3 = 0.6\,\text{m}$. בדיקה: $\dfrac{8}{0.6^2} = \dfrac{2}{0.3^2} \approx 22.2$ (ביחידות של $kq$).
      - kind: substitution
        text: >-
          (ב) 32 קווים ל-$8q$ הם 4 קווים לכל $q$, ולכן אל $(-2q)$ נכנסים 8 קווים. המטען הכולל חיובי ($+6q$), ולכן אף קו לא מגיע מרחוק, וכל 8 הקווים מגיעים מהמטען החיובי. לכן $32 - 8 = 24$ קווים ממשיכים הרחק.
      - kind: reasoning
        text: >-
          (ג) בין $x = 0.3\,\text{m}$ ל-$x = 0.6\,\text{m}$ המטען השלילי קרוב, ושדהו גובר: השדה פונה שמאלה, אליו. כאן עוברים קווים שבאים מימין ונכנסים ל-$(-2q)$. מעבר ל-$0.6\,\text{m}$ גובר השדה של $+8q$, והשדה פונה ימינה: כאן עוברים חלק מ-24 הקווים שממשיכים הרחק. בנקודת האפס הכיוון מתהפך, ולכן דרכה לא עובר קו.
      - kind: result
        text: >-
          (א) $x = 2L = 0.6\,\text{m}$, מעבר למטען השלילי. (ב) 8 קווים נגמרים ב-$(-2q)$, ו-24 ממשיכים הרחק. (ג) בין $L$ ל-$2L$ השדה פונה שמאלה, ומעבר ל-$2L$ ימינה.
    source:
      name: AIEEE (listed as JEE Main)
      year: 2005
      problem: 'Q41'
      url: https://cracku.in/41-two-point-charges-8q-and-2q-are-located-at-x-0-and-x-nta-jee-main-2005
      verified: '2026-11-02'
      adapted: true

  - id: W-1.6-c2
    stars: 2
    objectives: [OBJ-1.6-1, OBJ-1.6-3]
    prompt: >-
      מטען $q_1 = -3e$ ומטען $q_2 = +e$ נמצאים במרחק קבוע זה מזה, $q_2$ מימין ל-$q_1$. קו שדה אחד יוצא מ-$q_2$ כמעט ישר ימינה, כלומר בכיוון ההפוך ל-$q_1$.

      (א) הסבירו למה כל הקווים שיוצאים מ-$q_2$ נגמרים ב-$q_1$, ולמה ל-$q_1$ מגיעים גם קווים שלא התחילו ב-$q_2$.

      (ב) הקו שיוצא מ-$q_2$ ימינה מתעקל ומגיע ל-$q_1$. מצאו את הזווית בין הקו הזה, בנקודה שבה הוא מגיע ל-$q_1$, לבין הקטע שמחבר את $q_1$ אל $q_2$.

      (ג) מצאו את אותה זווית כש-$q_1 = -ne$, עבור מספר שלם $n \ge 2$.

      רמזים: קווי השדה האמיתיים נמצאים בתלת-ממד. קרוב מאוד למטען השדה שלו גובר על כל השאר, ולכן הקווים נכנסים אליו (או יוצאים ממנו) באופן אחיד לכל הכיוונים במרחב.
      חרוט שקודקודו במרכז כדור שרדיוסו $r$, וזווית הפתיחה שלו מהציר היא $\theta$, חותך מהכדור כיפה ששטחה $2\pi r^2(1 - \cos\theta)$.
    answer: >-
      (א) המטען הכולל $q_1 + q_2 = -2e$, ולכן מרחוק הקווים נכנסים פנימה.

      (ב) $\cos\theta = 1/3$, כלומר $\theta \approx 71^\circ$.

      (ג) $\cos\theta = (n - 2)/n$.
    solution:
      - kind: reasoning
        text: >-
          (א) המטען הכולל הוא $q_1 + q_2 = -3e + e = -2e$. רחוק מאוד המטענים נראים כמו מטען שלילי אחד, והקווים שם נכנסים פנימה. לכן אף קו לא יוצא מ-$q_2$ הרחק, וכל הקווים שלו נגמרים ב-$q_1$, המטען השלילי היחיד. מספר הקווים ביחס ישר למטען: אם $q_2$ מצויר עם $N$ קווים, אל $q_1$ נכנסים $3N$, ולכן $2N$ מהם מגיעים מרחוק.
      - kind: reasoning
        text: >-
          (ב) הסידור סימטרי סביב הקו שמחבר את המטענים. הקו שיוצא מ-$q_2$ ימינה, מסובב סביב הציר, יוצר משטח שכל $N$ הקווים של $q_2$ עוברים בתוכו: הוא הקו הקיצוני שלהם. קווים לא נחתכים, ולכן הם לא יוצאים מהמשטח הזה. ליד $q_1$ המשטח הוא חרוט שזווית הפתיחה שלו $\theta$, סביב הכיוון אל $q_2$, וכל הקווים שנכנסים ל-$q_1$ בתוך החרוט הזה באים מ-$q_2$.
      - kind: formula
        text: >-
          ליד $q_1$ הקווים נכנסים באופן אחיד לכל הכיוונים. לכן החלק מ-$3N$ הקווים שנכנס דרך הכיפה שווה ליחס בין שטח הכיפה לשטח הכדור: $\dfrac{2\pi r^2(1 - \cos\theta)}{4\pi r^2} = \dfrac{1 - \cos\theta}{2}$.
      - kind: manipulation
        text: >-
          מספר הקווים בתוך החרוט שווה למספר הקווים של $q_2$: $3N \cdot \dfrac{1 - \cos\theta}{2} = N$. מחלקים ב-$N$ וכופלים ב-$\dfrac{2}{3}$: $1 - \cos\theta = \dfrac{2}{3}$.
      - kind: substitution
        text: >-
          $\cos\theta = 1 - \dfrac{2}{3} = \dfrac{1}{3}$, ולכן $\theta \approx 70.5^\circ$.
      - kind: substitution
        text: >-
          (ג) עם $nN$ קווים שנכנסים ל-$q_1$: $nN \cdot \dfrac{1 - \cos\theta}{2} = N$, ולכן $1 - \cos\theta = \dfrac{2}{n}$, כלומר $\cos\theta = \dfrac{n - 2}{n}$.
      - kind: reasoning
        text: >-
          בדיקת גבולות: עבור $n = 2$ יוצא $\cos\theta = 0$, כלומר $\theta = 90^\circ$: הקווים של $q_2$ ממלאים בדיוק חצי מהכיוונים סביב $q_1$. כש-$n$ גדל מאוד, $\cos\theta \to 1$ ו-$\theta \to 0$: מעט קווים מ-$q_2$, שנכנסים ל-$q_1$ בצר סביב הכיוון אליו. מעקב מספרי אחר הקו, צעד אחר צעד בכיוון השדה, נותן $70.5^\circ$ עבור $n = 3$.
      - kind: result
        text: >-
          (א) המטען הכולל $q_1 + q_2 = -2e$: כל קווי $q_2$ נגמרים ב-$q_1$, ועוד $2N$ קווים מגיעים אליו מרחוק. (ב) $\theta \approx 71^\circ$ ($\cos\theta = 1/3$). (ג) $\cos\theta = (n - 2)/n$.
