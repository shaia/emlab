# Workbook for lesson 1.3: ten practice problems and two sourced challenge problems.
# Every number recomputed with src/physics/constants.ts and electrostatics.ts (coulombForce).

lesson: '1.3'
practice:
  - id: W-1.3-01
    level: basic
    qualitative: false
    objectives: [OBJ-1.3-1]
    prompt: >-
      שני כדורים קטנים טעונים, $q_1 = -5\,\text{nC}$ ו-$q_2 = -8\,\text{nC}$, נמצאים במרחק $6$ ס״מ זה מזה
      (ננו-קולון: $1\,\text{nC} = 10^{-9}\,\text{C}$).
      מה גודל הכוח שכל אחד מהם מפעיל על השני, והאם הכוח דוחה או מושך?
    answer: '$1\cdot10^{-4}\,\text{N}$, דוחה'
    solution:
      - kind: given
        text: >-
          $|q_1| = 5\cdot10^{-9}\,\text{C}$, $|q_2| = 8\cdot10^{-9}\,\text{C}$, $r = 0.06\,\text{m}$.
      - kind: formula
        text: >-
          $F = \dfrac{k|q_1||q_2|}{r^2}$
      - kind: substitution
        text: >-
          $F = \dfrac{9\cdot10^9 \cdot 5\cdot10^{-9} \cdot 8\cdot10^{-9}}{0.06^2} = \dfrac{3.6\cdot10^{-7}}{3.6\cdot10^{-3}} = 1\cdot10^{-4}\,\text{N}$
      - kind: reasoning
        text: >-
          שני המטענים שליליים, כלומר מאותו סימן, ולכן הם דוחים זה את זה. בנוסחה מציבים רק את הגדלים, והסימנים קובעים את הכיוון.
      - kind: result
        text: >-
          כל כדור נדחה מהשני בכוח של $1\cdot10^{-4}\,\text{N}$.

  - id: W-1.3-02
    level: basic
    qualitative: true
    objectives: [OBJ-1.3-1, OBJ-1.3-2]
    prompt: >-
      כדור A טעון במטען חיובי. מקרבים אליו כדור קטן וקל שתלוי בחוט מבודד, ולא יודעים אם הכדור הקטן טעון.

      (א) הכדור הקטן נדחה מ-A. מה אפשר לקבוע על המטען שלו?

      (ב) בניסוי אחר, עם כדור קטן אחר, הכדור נמשך אל A. האם אפשר לקבוע שהוא טעון במטען שלילי? נמקו.
    answer: >-
      (א) הוא טעון במטען חיובי.

      (ב) לא: הוא יכול להיות שלילי, אבל גם ניטרלי, כי גוף ניטרלי מתקטב ונמשך.
    solution:
      - kind: reasoning
        text: >-
          (א) דחייה פועלת רק בין מטענים מאותו סימן. גוף ניטרלי לעולם אינו נדחה: כשמקרבים אליו מטען הוא מתקטב ונמשך. לכן הכדור שנדחה טעון, והמטען שלו חיובי, כמו של A.
      - kind: reasoning
        text: >-
          (ב) משיכה יכולה לבוא ממטען שלילי. אבל גם בכדור ניטרלי, A גורם לקיטוב: הצד הקרוב ל-A מקבל מטען שלילי, והצד הרחוק מטען חיובי באותו גודל.
          לפי חוק קולון הכוח גדל כשהמרחק קטן, ולכן המשיכה לצד הקרוב חזקה מהדחייה של הצד הרחוק, והכוח השקול מושך.
      - kind: result
        text: >-
          (א) חיובי.

          (ב) לא, הכדור יכול להיות גם ניטרלי. רק דחייה מוכיחה שגוף טעון.

  - id: W-1.3-03
    level: basic
    qualitative: false
    objectives: [OBJ-1.3-1]
    prompt: >-
      מטען $q_1 = 3\,\mu\text{C}$ ומטען שלילי שגודלו $12\,\mu\text{C}$ מושכים זה את זה בכוח של $8.1\,\text{N}$.
      מה המרחק ביניהם?
    answer: '$0.2\,\text{m}$, כלומר $20$ ס״מ'
    solution:
      - kind: given
        text: >-
          $|q_1| = 3\cdot10^{-6}\,\text{C}$, $|q_2| = 12\cdot10^{-6}\,\text{C}$, $F = 8.1\,\text{N}$. מחפשים את $r$.
      - kind: formula
        text: >-
          $F = \dfrac{k|q_1||q_2|}{r^2}$
      - kind: manipulation
        text: >-
          כופלים את שני האגפים ב-$r^2$: $F r^2 = k|q_1||q_2|$. מחלקים ב-$F$ כדי לבודד את $r^2$: $r^2 = \dfrac{k|q_1||q_2|}{F}$. בסוף מוציאים שורש.
      - kind: substitution
        text: >-
          $r^2 = \dfrac{9\cdot10^9 \cdot 3\cdot10^{-6} \cdot 12\cdot10^{-6}}{8.1} = \dfrac{0.324}{8.1} = 0.04\,\text{m}^2$, ולכן $r = \sqrt{0.04} = 0.2\,\text{m}$.
      - kind: result
        text: >-
          המרחק בין המטענים הוא $0.2\,\text{m}$, כלומר $20$ ס״מ. בדיקת יחידות: $\text{N}\cdot\text{m}^2/\text{C}^2$ כפול $\text{C}^2$ חלקי $\text{N}$ נותן $\text{m}^2$.

  - id: W-1.3-04
    level: mid
    qualitative: false
    objectives: [OBJ-1.3-2, OBJ-1.3-1]
    prompt: >-
      בניסוי מודדים את הכוח בין שני כדורים קטנים בעלי מטענים שווים, בשלושה מרחקים.
      במרחק $10$ ס״מ הכוח הוא $2.7\,\text{N}$, במרחק $20$ ס״מ הוא $0.675\,\text{N}$, ובמרחק $30$ ס״מ הוא $0.3\,\text{N}$.

      (א) הראו שהמדידות מתאימות לחוק הריבוע ההפוך.

      (ב) מה יהיה הכוח במרחק $15$ ס״מ?

      (ג) מה המטען של כל כדור?
    answer: >-
      (א) המכפלה $F r^2$ שווה בשלוש המדידות.

      (ב) $1.2\,\text{N}$.

      (ג) כ-$1.7\cdot10^{-6}\,\text{C}$, בערך $1.7\,\mu\text{C}$.
    solution:
      - kind: reasoning
        text: >-
          (א) אם $F = \dfrac{kq^2}{r^2}$, אז המכפלה $F r^2 = kq^2$ קבועה, כי המטענים לא משתנים. בודקים אותה בכל מדידה, עם $r$ במטרים.
      - kind: substitution
        text: >-
          $2.7 \cdot 0.1^2 = 0.027$, $\ 0.675 \cdot 0.2^2 = 0.027$, $\ 0.3 \cdot 0.3^2 = 0.027$, כולם ב-$\text{N}\cdot\text{m}^2$. המכפלה זהה, ולכן המדידות מתאימות לחוק הריבוע ההפוך.
      - kind: manipulation
        text: >-
          (ב) מאותה מכפלה קבועה: $F = \dfrac{0.027}{r^2}$, ולכן $F = \dfrac{0.027}{0.15^2} = \dfrac{0.027}{0.0225} = 1.2\,\text{N}$.
      - kind: manipulation
        text: >-
          (ג) $kq^2 = 0.027\,\text{N}\cdot\text{m}^2$. מחלקים ב-$k$ כדי לבודד את $q^2$: $q^2 = \dfrac{0.027}{9\cdot10^9} = 3\cdot10^{-12}\,\text{C}^2$, ומוציאים שורש: $q = \sqrt{3\cdot10^{-12}} \approx 1.73\cdot10^{-6}\,\text{C}$.
      - kind: result
        text: >-
          (א) $F r^2 = 0.027\,\text{N}\cdot\text{m}^2$ בשלוש המדידות.

          (ב) במרחק $15$ ס״מ הכוח הוא $1.2\,\text{N}$.

          (ג) המטען של כל כדור הוא כ-$1.7\cdot10^{-6}\,\text{C}$.

  - id: W-1.3-05
    level: mid
    qualitative: true
    objectives: [OBJ-1.3-2]
    prompt: >-
      אלקטרון ופרוטון מוחזקים במרחק מסוים זה מזה, הרחק מכל גוף אחר, ומשחררים את שניהם באותו רגע.
      ($m_e = 9.1\cdot10^{-31}\,\text{kg}$, $m_p = 1.67\cdot10^{-27}\,\text{kg}$)

      (א) על איזה מהם פועל כוח גדול יותר?

      (ב) לאיזה מהם תאוצה גדולה יותר, ופי כמה בערך?

      (ג) מה קורה לכוחות ולתאוצות כשהחלקיקים מתקרבים זה לזה?
    answer: >-
      (א) הכוחות שווים בגודלם.

      (ב) לאלקטרון, פי כ-1800.

      (ג) הכוחות והתאוצות גדלים, והיחס בין התאוצות נשאר כ-1800.
    solution:
      - kind: reasoning
        text: >-
          (א) הכוח שהפרוטון מפעיל על האלקטרון והכוח שהאלקטרון מפעיל על הפרוטון הם זוג של פעולה ותגובה. בחוק קולון שני המטענים מופיעים באותה צורה, ולכן הכוחות שווים בגודלם ומנוגדים בכיוונם: כל חלקיק נמשך אל השני.
      - kind: formula
        text: >-
          (ב) לפי החוק השני של ניוטון $a = F/m$. הכוח זהה, ולכן התאוצות ביחס הפוך למסות: $\dfrac{a_e}{a_p} = \dfrac{m_p}{m_e}$.
      - kind: substitution
        text: >-
          $\dfrac{m_p}{m_e} = \dfrac{1.67\cdot10^{-27}}{9.1\cdot10^{-31}} \approx 1.8\cdot10^{3}$
      - kind: reasoning
        text: >-
          (ג) כשהמרחק קטן, הכוח גדל כמו $1/r^2$, וגם שתי התאוצות גדלות. אבל הכוחות נשארים שווים זה לזה, והמסות לא משתנות, ולכן היחס בין התאוצות נשאר זהה.
      - kind: result
        text: >-
          (א) הכוחות שווים בגודלם.

          (ב) תאוצת האלקטרון גדולה פי כ-1800, כי המסה שלו קטנה פי כ-1800. כוח שווה אינו אומר תאוצה שווה.

          (ג) הכוחות והתאוצות גדלים ככל שהחלקיקים מתקרבים, והיחס בין התאוצות נשאר כ-1800.

  - id: W-1.3-06
    level: mid
    qualitative: false
    objectives: [OBJ-1.3-1, OBJ-1.3-2]
    prompt: >-
      כדור קטן במסה $5\,\text{g}$ ובמטען $q_1 = +0.2\,\mu\text{C}$ תלוי בחוט מבודד. ($g = 10\,\text{m/s}^2$)

      (א) מקרבים מלמטה כדור קטן שני, במטען $q_2 = -0.5\,\mu\text{C}$, ומחזיקים אותו $3$ ס״מ ישירות מתחת לכדור התלוי. מה המתיחות בחוט?

      (ב) מחליפים את הכדור השני בכדור שהמטען שלו $q_3 = +0.5\,\mu\text{C}$. באיזה מרחק ישירות מתחת לכדור התלוי צריך להחזיק אותו כדי שהמתיחות בחוט תהיה אפס?
    answer: >-
      (א) $1.05\,\text{N}$.

      (ב) כ-$0.13\,\text{m}$, כלומר כ-$13$ ס״מ.
    solution:
      - kind: given
        text: >-
          $m = 5\cdot10^{-3}\,\text{kg}$, ולכן המשקל $mg = 0.05\,\text{N}$. $|q_1| = 2\cdot10^{-7}\,\text{C}$, $|q_2| = |q_3| = 5\cdot10^{-7}\,\text{C}$.
      - kind: substitution
        text: >-
          (א) הכוח החשמלי: $F = \dfrac{9\cdot10^9 \cdot 2\cdot10^{-7} \cdot 5\cdot10^{-7}}{0.03^2} = \dfrac{9\cdot10^{-4}}{9\cdot10^{-4}} = 1\,\text{N}$.
      - kind: reasoning
        text: >-
          הסימנים שונים, ולכן הכדור התלוי נמשך למטה, אל הכדור השני. על הכדור התלוי פועלים: המתיחות $T$ למעלה, והמשקל והכוח החשמלי, שניהם למטה. הוא נח, ולכן הכוח השקול אפס: $T = mg + F$.
      - kind: substitution
        text: >-
          $T = 0.05 + 1 = 1.05\,\text{N}$. הכוח החשמלי גדול פי 20 מהמשקל.
      - kind: reasoning
        text: >-
          (ב) עכשיו הסימנים זהים, והכוח החשמלי על הכדור התלוי הוא דחייה, כלומר למעלה. המתיחות אפס כשהכוח החשמלי לבדו מאזן את המשקל: $F = mg$.
      - kind: manipulation
        text: >-
          $\dfrac{k|q_1||q_3|}{r^2} = mg$. כופלים ב-$r^2$ ומחלקים ב-$mg$: $r^2 = \dfrac{k|q_1||q_3|}{mg} = \dfrac{9\cdot10^{-4}}{0.05} = 0.018\,\text{m}^2$, ולכן $r = \sqrt{0.018} \approx 0.134\,\text{m}$.
      - kind: result
        text: >-
          (א) המתיחות בחוט היא $1.05\,\text{N}$.

          (ב) מחזיקים את הכדור השלישי כ-$13$ ס״מ מתחת לכדור התלוי. במרחק קטן יותר הדחייה גדולה מהמשקל, והחוט מתרופף.

  - id: W-1.3-07
    level: mid
    qualitative: true
    objectives: [OBJ-1.3-3]
    prompt: >-
      היחס $F_e/F_g$ בין הכוח החשמלי לכוח הכבידה תלוי בזוג החלקיקים.

      (א) דרגו, בלי לחשב מספרים, את ארבעת הזוגות לפי היחס הזה, מהגדול לקטן:
      (1) שני אלקטרונים; (2) אלקטרון ופרוטון; (3) שני פרוטונים; (4) שני חלקיקים שלכל אחד מהם מטען $2e$ ומסה של בערך $4m_p$, כמו גרעין של אטום הליום.

      (ב) האם הדירוג ישתנה אם המרחק בכל זוג יהיה אחר? נמקו.
    answer: >-
      (א) $(1) > (2) > (3) > (4)$.

      (ב) לא, כי היחס בכל זוג אינו תלוי במרחק.
    solution:
      - kind: formula
        text: >-
          $\dfrac{F_e}{F_g} = \dfrac{k|q_1||q_2|/r^2}{G m_1 m_2/r^2} = \dfrac{k|q_1||q_2|}{G m_1 m_2}$
      - kind: reasoning
        text: >-
          (א) בזוגות (1), (2), (3) המונה זהה, $ke^2$. לכן היחס קטן ככל שמכפלת המסות גדלה: $m_e m_e < m_e m_p < m_p m_p$. מכאן (1) הגדול, אחריו (2), ואחריו (3).
      - kind: reasoning
        text: >-
          בזוג (4) המונה גדל פי $2\cdot2 = 4$ לעומת (3), והמכנה גדל פי $4\cdot4 = 16$. היחס קטן פי 4 מזה של (3), ולכן הוא הקטן מכולם.
      - kind: reasoning
        text: >-
          (ב) $r^2$ מצטמצם בחלוקה, ולכן כל יחס נקבע רק על ידי המטענים והמסות של החלקיקים.
      - kind: result
        text: >-
          (א) (1) הגדול, אחריו (2), אחריו (3), ו-(4) הקטן. גם היחס הקטן ביותר עצום: הכוח החשמלי שולט בכל ארבעת הזוגות.

          (ב) הדירוג לא תלוי במרחקים.

  - id: W-1.3-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.3-1, OBJ-1.3-3]
    prompt: >-
      בגרעין של אטום, שני פרוטונים נמצאים במרחק של כ-$2\cdot10^{-15}\,\text{m}$ זה מזה.
      ($e = 1.6\cdot10^{-19}\,\text{C}$, $m_p = 1.67\cdot10^{-27}\,\text{kg}$, $g = 10\,\text{m/s}^2$)

      (א) מה גודל הכוח החשמלי בין שני הפרוטונים, והאם הוא דוחה או מושך?

      (ב) פי כמה הכוח הזה גדול מהמשקל של פרוטון על פני כדור הארץ?

      (ג) מה הייתה תאוצת הפרוטון אילו פעל עליו רק הכוח הזה?

      (ד) לפי התוצאות, מה אפשר להסיק על הכוח שמחזיק את הגרעין?
    answer: >-
      (א) כ-$58\,\text{N}$, דוחה.

      (ב) פי כ-$3.4\cdot10^{27}$.

      (ג) כ-$3.4\cdot10^{28}\,\text{m/s}^2$.

      (ד) הוא חייב להיות מושך וחזק מהדחייה החשמלית. כוח הכבידה חלש מדי.
    solution:
      - kind: given
        text: >-
          לכל פרוטון מטען $e = 1.6\cdot10^{-19}\,\text{C}$, ו-$r = 2\cdot10^{-15}\,\text{m}$.
      - kind: substitution
        text: >-
          (א) $F = \dfrac{ke^2}{r^2} = \dfrac{9\cdot10^9 \cdot (1.6\cdot10^{-19})^2}{(2\cdot10^{-15})^2} = \dfrac{2.304\cdot10^{-28}}{4\cdot10^{-30}} \approx 57.6\,\text{N}$. שני הפרוטונים חיוביים, ולכן הכוח דוחה.
      - kind: substitution
        text: >-
          (ב) משקל הפרוטון: $m_p g = 1.67\cdot10^{-27} \cdot 10 = 1.67\cdot10^{-26}\,\text{N}$. היחס: $\dfrac{57.6}{1.67\cdot10^{-26}} \approx 3.4\cdot10^{27}$.
      - kind: substitution
        text: >-
          (ג) $a = \dfrac{F}{m_p} = \dfrac{57.6}{1.67\cdot10^{-27}} \approx 3.4\cdot10^{28}\,\text{m/s}^2$.
      - kind: reasoning
        text: >-
          (ד) הגרעין יציב, ולכן משהו מאזן את הדחייה העצומה הזאת. הכבידה בין הפרוטונים חלשה ממנה בהרבה, כמו שראינו בשיעור. לכן פועל שם כוח אחר, מושך, וחזק עוד יותר במרחקים כאלה.
      - kind: result
        text: >-
          (א) כ-$58\,\text{N}$, דוחה: בערך המשקל של גוף שמסתו כ-$6\,\text{kg}$, על חלקיק זעיר.

          (ב) פי כ-$3.4\cdot10^{27}$ מהמשקל של הפרוטון.

          (ג) כ-$3.4\cdot10^{28}\,\text{m/s}^2$.

          (ד) את הגרעין מחזיק כוח מושך, שאינו חשמלי ואינו כבידה, וחזק מהדחייה החשמלית.

  - id: W-1.3-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.3-1, OBJ-1.3-2]
    prompt: >-
      לכדור מתכת קטן A יש מטען $q_0$ שאינו ידוע. כדור B, זהה לו, אינו טעון.
      נוגעים ב-A בכדור B, ואחר כך מציבים את שני הכדורים במרחק $10$ ס״מ זה מזה. הכוח ביניהם דוחה, וגודלו $0.9\,\text{N}$.

      (א) מה גודל המטען $q_0$? האם אפשר לדעת את הסימן שלו?

      (ב) נוגעים ב-B בכדור שלישי, זהה ולא טעון, ומרחיקים את הכדור השלישי. מה גודל הכוח בין A ל-B עכשיו, באותו מרחק?

      (ג) לאיזה מרחק צריך לקרב את A ו-B כדי שהכוח ביניהם יחזור להיות $0.9\,\text{N}$?
    answer: >-
      (א) $2\cdot10^{-6}\,\text{C}$. את הסימן אי אפשר לדעת.

      (ב) $0.45\,\text{N}$.

      (ג) כ-$7.1$ ס״מ.
    solution:
      - kind: reasoning
        text: >-
          (א) הכדורים זהים, ולכן במגע המטען מתחלק ביניהם שווה בשווה: לכל אחד $q_0/2$. גם סך המטען נשמר.
      - kind: formula
        text: >-
          $F = \dfrac{k\,(q_0/2)^2}{r^2}$
      - kind: manipulation
        text: >-
          כופלים ב-$r^2$ ומחלקים ב-$k$: $(q_0/2)^2 = \dfrac{F r^2}{k} = \dfrac{0.9 \cdot 0.1^2}{9\cdot10^9} = 1\cdot10^{-12}\,\text{C}^2$. מוציאים שורש: $q_0/2 = 1\cdot10^{-6}\,\text{C}$, ולכן $q_0 = 2\cdot10^{-6}\,\text{C}$.
      - kind: reasoning
        text: >-
          לשני הכדורים אותו מטען, ולכן הם דוחים זה את זה בכל מקרה, אם $q_0$ חיובי ואם הוא שלילי. הניסוי לא מגלה את הסימן.
      - kind: reasoning
        text: >-
          (ב) הכדור השלישי לוקח מחצית מהמטען של B. עכשיו ל-A יש $q_0/2$ ול-B יש $q_0/4$. מכפלת המטענים קטנה פי 2, והמרחק לא השתנה, ולכן גם הכוח קטן פי 2: $F = 0.9/2 = 0.45\,\text{N}$.
      - kind: reasoning
        text: >-
          (ג) כדי שהכוח יגדל פי 2, צריך ש-$r^2$ יקטן פי 2, כלומר ש-$r$ יקטן פי $\sqrt2$: $r = \dfrac{10}{\sqrt2} \approx 7.1$ ס״מ.
      - kind: result
        text: >-
          (א) $q_0 = 2\cdot10^{-6}\,\text{C}$ בגודלו, והסימן לא ידוע.

          (ב) $0.45\,\text{N}$.

          (ג) כ-$7.1$ ס״מ. זו בדיוק הדרך שבה קולון שינה מטענים בניסויים שלו: נגיעה בכדור זהה ולא טעון מחלקת את המטען לשניים.

  - id: W-1.3-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.3-1, OBJ-1.3-2]
    prompt: >-
      מטען נקודתי $Q = +1\,\mu\text{C}$ מקובע בתחתית של מישור משופע חלק, שיוצר זווית של $30^\circ$ עם האופק.
      כדור קטן במסה $10\,\text{g}$ ובמטען $q = +1\,\mu\text{C}$ מונח על המישור, על הקו שעולה מ-$Q$ לאורך המישור, ונשאר במנוחה. ($g = 10\,\text{m/s}^2$)

      (א) מה המרחק בין הכדור ל-$Q$?

      (ב) דוחפים את הכדור מעט במורד המישור, אל $Q$, ומשחררים. לאיזה כיוון פועל עליו הכוח השקול? ומה אם דוחפים אותו מעט במעלה המישור? נמקו.

      (ג) מה משתנה אם מכפילים את $Q$? מצאו את המרחק החדש שבו הכדור נח.
    answer: >-
      (א) כ-$0.42\,\text{m}$.

      (ב) בשני המקרים הכוח השקול מחזיר את הכדור אל המקום שבו נח קודם.

      (ג) המרחק גדל פי $\sqrt2$, ל-$0.6\,\text{m}$.
    solution:
      - kind: given
        text: >-
          $m = 10^{-2}\,\text{kg}$, $q = Q = 10^{-6}\,\text{C}$, זווית המישור $30^\circ$.
      - kind: reasoning
        text: >-
          לאורך המישור פועלים שני כוחות: רכיב המשקל במורד המישור, $mg\sin30^\circ$, והכוח החשמלי במעלה המישור, כי שני המטענים חיוביים ו-$Q$ נמצא למטה. הכוח הנורמלי ניצב למישור. הכדור נח, ולכן לאורך המישור $F = mg\sin30^\circ$.
      - kind: substitution
        text: >-
          $mg\sin30^\circ = 10^{-2} \cdot 10 \cdot 0.5 = 0.05\,\text{N}$.
      - kind: manipulation
        text: >-
          $\dfrac{kqQ}{d^2} = mg\sin30^\circ$. כופלים ב-$d^2$ ומחלקים ב-$mg\sin30^\circ$: $d^2 = \dfrac{kqQ}{mg\sin30^\circ} = \dfrac{9\cdot10^9 \cdot 10^{-6} \cdot 10^{-6}}{0.05} = \dfrac{9\cdot10^{-3}}{0.05} = 0.18\,\text{m}^2$, ולכן $d = \sqrt{0.18} \approx 0.42\,\text{m}$.
      - kind: reasoning
        text: >-
          (ב) רכיב המשקל לאורך המישור לא תלוי במקום. הכוח החשמלי כן: קרוב יותר ל-$Q$ הוא גדול יותר, ולכן הכוח השקול פונה במעלה המישור. רחוק יותר הוא קטן יותר, והכוח השקול פונה במורד המישור. בשני המקרים הכוח השקול מכוון חזרה אל מקום המנוחה.
      - kind: reasoning
        text: >-
          (ג) לפי הביטוי ל-$d^2$, הוא ביחס ישר ל-$Q$. כש-$Q$ גדל פי 2, $d^2$ גדל פי 2, ו-$d$ גדל פי $\sqrt2$: $d = \sqrt{0.36} = 0.6\,\text{m}$.
      - kind: result
        text: >-
          (א) $d \approx 0.42\,\text{m}$.

          (ב) הכוח השקול תמיד מחזיר את הכדור אל מקום המנוחה, כי הכוח החשמלי גדל כשמתקרבים ל-$Q$ וקטן כשמתרחקים ממנו.

          (ג) $d = 0.6\,\text{m}$, פי $\sqrt2$ מהמרחק הקודם ולא פי 2.

challenge:
  - id: W-1.3-c1
    stars: 1
    objectives: [OBJ-1.3-3, OBJ-1.3-1]
    prompt: >-
      שני כדורי עופרת זהים, כל אחד במסה $10\,\text{kg}$, תלויים בשני חוטים קלים. המרחק מכל נקודת תלייה למרכז הכדור שלה הוא $L = 2\,\text{m}$.
      שתי נקודות התלייה נמצאות על קו אופקי אחד, במרחק $0.5\,\text{m}$ זו מזו, כך שכשהחוטים אנכיים המרחק בין מרכזי הכדורים הוא $0.5\,\text{m}$.
      התייחסו לכדורים כאל מסות ומטענים נקודתיים במרכזיהם.
      ($G = 6.67\cdot10^{-11}\,\text{N}\cdot\text{m}^2/\text{kg}^2$, $g = 10\,\text{m/s}^2$, $e = 1.6\cdot10^{-19}\,\text{C}$)

      (א) כוח הכבידה בין הכדורים מטה כל חוט מעט מהאנך. בכמה זז כל כדור הצידה? הניחו שהתזוזה קטנה כל כך שאפשר להזניח את השינוי במרחק בין הכדורים, ושלזווית קטנה מאוד $\sin\theta \approx \tan\theta$.

      (ב) נותנים לשני הכדורים אותו מטען חיובי $Q$. מה צריך להיות $Q$ כדי שהחוטים יחזרו להיות אנכיים?

      (ג) כמה אלקטרונים צריך להוציא מכל כדור כדי לתת לו את המטען הזה?
    answer: >-
      (א) כ-$5.3\cdot10^{-10}\,\text{m}$, כל כדור אל השני.

      (ב) $Q \approx 8.6\cdot10^{-10}\,\text{C}$.

      (ג) כ-$5.4\cdot10^{9}$ אלקטרונים.
    solution:
      - kind: substitution
        text: >-
          (א) כוח הכבידה בין הכדורים: $F_g = \dfrac{Gm^2}{x^2} = \dfrac{6.67\cdot10^{-11} \cdot 10^2}{0.5^2} \approx 2.67\cdot10^{-8}\,\text{N}$, אופקי, כל כדור אל השני.
      - kind: reasoning
        text: >-
          על כל כדור פועלים המשקל, המתיחות בחוט וכוח הכבידה האופקי. בשיווי משקל, כמו בכדורים התלויים בחוטים, $\tan\theta = \dfrac{F_g}{mg}$. התזוזה הצידה היא $\delta = L\sin\theta \approx L\tan\theta$.
      - kind: substitution
        text: >-
          $\delta = \dfrac{L F_g}{mg} = \dfrac{GmL}{g x^2} = \dfrac{6.67\cdot10^{-11} \cdot 10 \cdot 2}{10 \cdot 0.5^2} \approx 5.3\cdot10^{-10}\,\text{m}$
      - kind: reasoning
        text: >-
          (ב) החוטים אנכיים כשהכוח האופקי השקול על כל כדור אפס, כלומר כשהדחייה החשמלית שווה למשיכת הכבידה. שני הכוחות מחולקים באותו $x^2$, ולכן המרחק מצטמצם.
      - kind: manipulation
        text: >-
          $\dfrac{kQ^2}{x^2} = \dfrac{Gm^2}{x^2}$, ולכן $Q^2 = \dfrac{Gm^2}{k}$ ו-$Q = m\sqrt{\dfrac{G}{k}}$.
      - kind: substitution
        text: >-
          $Q = 10 \cdot \sqrt{\dfrac{6.67\cdot10^{-11}}{9\cdot10^9}} \approx 10 \cdot 8.6\cdot10^{-11} \approx 8.6\cdot10^{-10}\,\text{C}$
      - kind: substitution
        text: >-
          (ג) מספר האלקטרונים: $N = \dfrac{Q}{e} = \dfrac{8.6\cdot10^{-10}}{1.6\cdot10^{-19}} \approx 5.4\cdot10^{9}$.
      - kind: result
        text: >-
          (א) כל כדור זז כ-$5.3\cdot10^{-10}\,\text{m}$ אל השני, בערך בגודל של אטום אחד או שניים.

          (ב) $Q \approx 8.6\cdot10^{-10}\,\text{C}$, והתשובה לא תלויה במרחק בין הכדורים.

          (ג) כ-$5.4\cdot10^{9}$ אלקטרונים. בכדור של $10\,\text{kg}$ יש מספר עצום של אלקטרונים, ומספיק להוציא מהם חלק זעיר כדי לבטל את משיכת הכבידה בין שני הכדורים.
    source:
      name: Oxford Physics Aptitude Test (PAT)
      year: 2018
      problem: 'Question 18'
      url: https://www.physics.ox.ac.uk/system/files/file_attachments/pat-2018.pdf
      verified: '2026-11-02'
      adapted: true

  - id: W-1.3-c2
    stars: 2
    objectives: [OBJ-1.3-1, OBJ-1.3-2]
    prompt: >-
      כדור קטן במסה $4\,\text{g}$ ובמטען $q = 1\,\mu\text{C}$ קשור לקצה של חוט מבודד באורך $L = 0.5\,\text{m}$. הקצה השני של החוט קשור לנקודה קבועה O, ובנקודה O מקובע כדור קטן שני, בעל אותו מטען.
      בהתחלה הכדור תלוי בנקודה הנמוכה ביותר. ($g = 10\,\text{m/s}^2$)

      (א) מה המהירות האופקית הקטנה ביותר שצריך לתת לכדור כדי שישלים סיבוב שלם במעגל אנכי סביב O, והחוט יישאר מתוח כל הזמן?

      (ב) מה משתנה אם המטען של כל אחד משני הכדורים הוא $2\,\mu\text{C}$? מצאו את המהירות הקטנה ביותר במקרה הזה.
    answer: >-
      (א) כ-$4.5\,\text{m/s}$ ($\sqrt{20.5}\,\text{m/s}$).

      (ב) מעט יותר מ-$4.47\,\text{m/s}$ ($\sqrt{20}\,\text{m/s}$): עכשיו החוט מתוח בכל מהירות, ומספיק שהכדור יגיע לנקודה העליונה.
    solution:
      - kind: reasoning
        text: >-
          המרחק בין הכדורים תמיד שווה לאורך החוט, ולכן גודל הכוח החשמלי קבוע: $F = \dfrac{kq^2}{L^2}$. זו דחייה, לאורך החוט והחוצה מ-O.
      - kind: reasoning
        text: >-
          הכוח החשמלי ניצב תמיד למהירות, שמשיקה למעגל, ולכן הוא אינו מבצע עבודה. רק כוח הכבידה משנה את האנרגיה הקינטית, ושימור האנרגיה המכנית בין הנקודה התחתונה לעליונה נותן: $\tfrac12 m v_b^2 = \tfrac12 m v_t^2 + mg\cdot 2L$, כלומר $v_b^2 = v_t^2 + 4gL$.
      - kind: formula
        text: >-
          בנקודה העליונה, בכיוון אל המרכז O: $T + mg - F = \dfrac{m v_t^2}{L}$. החוט הכי פחות מתוח בנקודה הזאת, כי שם המהירות הקטנה ביותר והמשקל כולו פונה אל המרכז.
      - kind: substitution
        text: >-
          (א) $F = \dfrac{9\cdot10^9 \cdot (10^{-6})^2}{0.5^2} = 0.036\,\text{N}$, ו-$mg = 4\cdot10^{-3} \cdot 10 = 0.04\,\text{N}$.
      - kind: manipulation
        text: >-
          החוט מתוח כש-$T \ge 0$: $\dfrac{m v_t^2}{L} \ge mg - F$. כופלים ב-$L$ ומחלקים ב-$m$: $v_t^2 \ge \dfrac{(mg - F)L}{m} = \dfrac{(0.04 - 0.036) \cdot 0.5}{4\cdot10^{-3}} = 0.5\,\text{m}^2/\text{s}^2$.
      - kind: substitution
        text: >-
          $v_b^2 = 0.5 + 4 \cdot 10 \cdot 0.5 = 20.5\,\text{m}^2/\text{s}^2$, ולכן $v_b = \sqrt{20.5} \approx 4.53\,\text{m/s}$. בלי מטענים היינו מקבלים $\sqrt{5gL} = 5\,\text{m/s}$.
      - kind: substitution
        text: >-
          (ב) $F = \dfrac{9\cdot10^9 \cdot (2\cdot10^{-6})^2}{0.5^2} = 0.144\,\text{N}$, גדול מהמשקל $0.04\,\text{N}$.
      - kind: reasoning
        text: >-
          בכל נקודה הכוח החשמלי החוצה גדול מרכיב המשקל שפונה אל המרכז, ולכן החוט מתוח גם כשהכדור כמעט עוצר. בנקודה העליונה, למשל, $T = \dfrac{m v_t^2}{L} + F - mg \ge 0.104\,\text{N}$. התנאי היחיד הוא שהכדור יגיע לנקודה העליונה במהירות כלשהי: $v_t^2 > 0$, כלומר $v_b^2 > 4gL = 20\,\text{m}^2/\text{s}^2$.
      - kind: result
        text: >-
          (א) $v_b \approx 4.5\,\text{m/s}$: הדחייה מקטינה את המהירות הדרושה מ-$5\,\text{m/s}$.

          (ב) מעט יותר מ-$\sqrt{20} \approx 4.47\,\text{m/s}$. כשהכוח החשמלי גדול מהמשקל, החוט לעולם אינו מתרופף, והשאלה היא רק אם יש לכדור מספיק אנרגיה קינטית כדי לעלות לגובה $2L$.
    source:
      name: IIT JEE (the source page labels it JEE Advanced)
      year: 2001
      problem: 'Canvas Classes question bank ELST-283 (the original paper''s question number is not shown)'
      url: https://www.canvasclasses.in/the-crucible/q/7ad257c4-70bb-4d79-a985-8f956102140f
      verified: '2026-11-02'
      adapted: true
