# Workbook for lesson 1.5: ten practice problems and two sourced challenge problems.
# Every field number recomputed with fieldAt from src/physics/electrostatics.ts and the constants
# in src/physics/constants.ts (K = 9e9, E_CHARGE, G = 10).

lesson: '1.5'
practice:
  - id: W-1.5-01
    level: basic
    qualitative: false
    objectives: [OBJ-1.5-1, OBJ-1.5-2]
    prompt: >-
      בנקודה P, ליד כדור טעון גדול, השדה החשמלי הוא $2\cdot10^{4}\,\text{N/C}$, למעלה.
      מניחים ב-P טיפת מים זעירה שמטענה $5\,\text{pC}$ (פיקו-קולון: $1\,\text{pC} = 10^{-12}\,\text{C}$).

      (א) מה הכוח החשמלי על הטיפה, אם מטענה חיובי?

      (ב) מה הכוח, אם מטענה שלילי ובאותו גודל?
    answer: >-
      (א) $10^{-7}\,\text{N}$, למעלה.

      (ב) $10^{-7}\,\text{N}$, למטה.
    solution:
      - kind: given
        text: >-
          $E = 2\cdot10^{4}\,\text{N/C}$ למעלה, ו-$|q| = 5\cdot10^{-12}\,\text{C}$.
      - kind: formula
        text: >-
          השדה הוא כוח לכל קולון, ולכן מטען $q$ מקבל כוח $\vec F = q\vec E$. לגודל: $F = |q|\,E$.
      - kind: substitution
        text: >-
          $F = 5\cdot10^{-12} \cdot 2\cdot10^{4} = 1\cdot10^{-7}\,\text{N}$.
      - kind: reasoning
        text: >-
          על מטען חיובי הכוח בכיוון השדה, למעלה. על מטען שלילי הכוח הפוך לשדה, למטה. השדה עצמו זהה בשני המקרים.
      - kind: result
        text: >-
          (א) $10^{-7}\,\text{N}$, למעלה. (ב) $10^{-7}\,\text{N}$, למטה: אותו גודל, כיוון הפוך.

  - id: W-1.5-02
    level: basic
    qualitative: true
    objectives: [OBJ-1.5-2]
    prompt: >-
      מטען נקודתי **שלילי** נמצא בנקודה O. שלוש נקודות נמצאות באותו מרחק ממנו: A מימין ל-O, B מעל O, ו-C משמאל ל-O.

      (א) מה כיוון השדה החשמלי בכל אחת מהנקודות?

      (ב) השוו את עוצמות השדה בשלוש הנקודות.

      (ג) מניחים אלקטרון בנקודה B. מה כיוון הכוח עליו?
    answer: >-
      (א) ב-A שמאלה, ב-B למטה, ב-C ימינה: בכל נקודה אל O.

      (ב) העוצמות שוות.

      (ג) למעלה, הרחק מ-O.
    solution:
      - kind: reasoning
        text: >-
          כיוון השדה הוא כיוון הכוח על מטען בוחן חיובי. מטען בוחן חיובי נמשך אל המטען השלילי, ולכן בכל נקודה השדה מצביע אל O.
          מ-A, שנמצאת מימין, הכיוון אל O הוא שמאלה. מ-B, שנמצאת מעל, הכיוון הוא למטה. מ-C, שנמצאת משמאל, הכיוון הוא ימינה.
      - kind: reasoning
        text: >-
          עוצמת השדה של מטען נקודתי היא $E = k|Q|/r^2$. היא תלויה רק במטען ובמרחק, לא בכיוון. שלוש הנקודות באותו מרחק, ולכן העוצמות שוות.
      - kind: reasoning
        text: >-
          האלקטרון שלילי, ולכן הכוח עליו הפוך לשדה. ב-B השדה למטה, ולכן הכוח על האלקטרון למעלה. זה מתאים לכך ששני מטענים שליליים דוחים זה את זה.
      - kind: result
        text: >-
          (א) ב-A שמאלה, ב-B למטה, ב-C ימינה, כלומר תמיד אל המטען השלילי. (ב) העוצמות שוות. (ג) הכוח על האלקטרון למעלה, הרחק מ-O.

  - id: W-1.5-03
    level: basic
    qualitative: false
    objectives: [OBJ-1.5-3]
    prompt: >-
      כדור קטן טעון במטען של $+8\,\mu\text{C}$.

      (א) באיזה מרחק מהכדור עוצמת השדה היא $2\cdot10^{5}\,\text{N/C}$?

      (ב) באיזה מרחק עוצמת השדה גדולה פי 4, $8\cdot10^{5}\,\text{N/C}$? נסו לענות בלי להציב שוב בנוסחה.
    answer: >-
      (א) $0.6\,\text{m}$.

      (ב) $0.3\,\text{m}$.
    solution:
      - kind: given
        text: >-
          $Q = 8\cdot10^{-6}\,\text{C}$ ו-$E = 2\cdot10^{5}\,\text{N/C}$. מחפשים את $r$.
      - kind: formula
        text: >-
          $E = \dfrac{kQ}{r^2}$.
      - kind: manipulation
        text: >-
          המרחק נמצא במכנה, ולכן מכפילים קודם את שני האגפים ב-$r^2$: $E\,r^2 = kQ$. עכשיו מחלקים ב-$E$: $r^2 = \dfrac{kQ}{E}$, ולבסוף מוציאים שורש.
      - kind: substitution
        text: >-
          $r^2 = \dfrac{9\cdot10^{9} \cdot 8\cdot10^{-6}}{2\cdot10^{5}} = 0.36\,\text{m}^2$, ולכן $r = \sqrt{0.36} = 0.6\,\text{m}$.
      - kind: reasoning
        text: >-
          (ב) השדה הפוך לריבוע המרחק. כדי שהשדה יגדל פי 4, $r^2$ צריך לקטון פי 4, כלומר $r$ צריך לקטון פי 2: $0.6/2 = 0.3\,\text{m}$.
          בדיקה: $\dfrac{9\cdot10^{9} \cdot 8\cdot10^{-6}}{0.3^2} = 8\cdot10^{5}\,\text{N/C}$.
      - kind: result
        text: >-
          (א) $0.6\,\text{m}$. (ב) $0.3\,\text{m}$: שדה חזק פי 4 נמצא במרחק קטן פי 2, לא פי 4.

  - id: W-1.5-04
    level: mid
    qualitative: true
    objectives: [OBJ-1.5-3]
    prompt: >-
      במרחק $10\,\text{cm}$ ממטען נקודתי עוצמת השדה היא $E_0$.

      (א) בטאו בעזרת $E_0$ את עוצמת השדה במרחקים $20\,\text{cm}$, $30\,\text{cm}$ ו-$50\,\text{cm}$ מהמטען.

      (ב) באיזה מרחק עוצמת השדה היא $E_0/100$?

      (ג) מכפילים את המטען. מה עוצמת השדה עכשיו במרחק $20\,\text{cm}$?
    answer: >-
      (א) $E_0/4$, $E_0/9$ ו-$E_0/25$.

      (ב) $1\,\text{m}$.

      (ג) $E_0/2$.
    solution:
      - kind: formula
        text: >-
          $E = \dfrac{k|Q|}{r^2}$. כשהמטען קבוע, השדה הפוך לריבוע המרחק: מרחק גדול פי $n$ נותן שדה חלש פי $n^2$.
      - kind: reasoning
        text: >-
          (א) $20\,\text{cm}$ הוא פי 2 מ-$10\,\text{cm}$, ולכן השדה חלש פי $2^2 = 4$. באותו אופן, פי 3 במרחק נותן חלש פי 9, ופי 5 נותן חלש פי 25.
      - kind: reasoning
        text: >-
          (ב) שדה חלש פי 100 דורש מרחק גדול פי $\sqrt{100} = 10$, כלומר $10 \cdot 10\,\text{cm} = 100\,\text{cm} = 1\,\text{m}$.
      - kind: reasoning
        text: >-
          (ג) השדה ביחס ישר למטען. במרחק $20\,\text{cm}$ השדה היה $E_0/4$, ומטען כפול מכפיל אותו: $2 \cdot E_0/4 = E_0/2$.
      - kind: result
        text: >-
          (א) $E_0/4$, $E_0/9$, $E_0/25$. (ב) במרחק $1\,\text{m}$. (ג) $E_0/2$.

  - id: W-1.5-05
    level: mid
    qualitative: false
    objectives: [OBJ-1.5-3, OBJ-1.5-2]
    prompt: >-
      הנקודות P ו-R נמצאות על קו ישר שיוצא ממטען נקודתי, ו-R קרובה למטען ב-$10\,\text{cm}$ יותר מ-P.
      בנקודה P השדה הוא $3.6\cdot10^{5}\,\text{N/C}$ ומצביע הרחק מהמטען, ובנקודה R השדה חזק פי 4.
      מצאו את המרחק של כל נקודה מהמטען, ואת המטען (גודל וסימן).
    answer: >-
      P במרחק $0.2\,\text{m}$ ו-R במרחק $0.1\,\text{m}$. המטען $+1.6\,\mu\text{C}$.
    solution:
      - kind: given
        text: >-
          $E_P = 3.6\cdot10^{5}\,\text{N/C}$, $E_R = 4E_P$, ו-$r_P - r_R = 0.1\,\text{m}$.
      - kind: formula
        text: >-
          $E = \dfrac{k|Q|}{r^2}$, ולכן היחס בין השדות הוא היחס ההפוך בין ריבועי המרחקים: $\dfrac{E_R}{E_P} = \dfrac{r_P^2}{r_R^2}$.
      - kind: manipulation
        text: >-
          $\dfrac{r_P^2}{r_R^2} = 4$, ומוציאים שורש: $r_P = 2r_R$. מציבים בהפרש המרחקים: $2r_R - r_R = 0.1$, ולכן $r_R = 0.1\,\text{m}$ ו-$r_P = 0.2\,\text{m}$.
      - kind: manipulation
        text: >-
          כדי לבודד את $|Q|$ מכפילים את $E_P = k|Q|/r_P^2$ ב-$r_P^2$ ומחלקים ב-$k$: $|Q| = \dfrac{E_P\,r_P^2}{k}$.
      - kind: substitution
        text: >-
          $|Q| = \dfrac{3.6\cdot10^{5} \cdot 0.2^2}{9\cdot10^{9}} = 1.6\cdot10^{-6}\,\text{C}$.
      - kind: reasoning
        text: >-
          השדה מצביע הרחק מהמטען, ולכן המטען חיובי. בדיקה ב-R: $\dfrac{9\cdot10^{9} \cdot 1.6\cdot10^{-6}}{0.1^2} = 1.44\cdot10^{6}\,\text{N/C}$, שהוא בדיוק פי 4 מ-$3.6\cdot10^{5}$.
      - kind: result
        text: >-
          $r_P = 0.2\,\text{m}$ ו-$r_R = 0.1\,\text{m}$. המטען הוא $+1.6\,\mu\text{C}$.

  - id: W-1.5-06
    level: mid
    qualitative: true
    objectives: [OBJ-1.5-4, OBJ-1.5-2, OBJ-1.5-3]
    prompt: >-
      מטען $+Q$ נמצא בראשית ציר x. הנקודה P נמצאת ב-$x = d$. רוצים להניח על ציר x מטען שני, כך שהשדה השקול ב-P יתאפס.
      מה צריכים להיות הסימן והגודל של המטען השני, אם מניחים אותו:

      (א) בנקודה $x = 2d$?

      (ב) בנקודה $x = -d$?

      (ג) בנקודה $x = d/2$?
    answer: >-
      (א) $+Q$.

      (ב) $-4Q$.

      (ג) $-Q/4$.
    solution:
      - kind: reasoning
        text: >-
          השדה של $+Q$ ב-P מצביע ימינה (הרחק ממנו), ועוצמתו $kQ/d^2$. המטען השני צריך ליצור ב-P שדה באותה עוצמה, שמאלה.
      - kind: reasoning
        text: >-
          (א) המטען השני נמצא מימין ל-P, במרחק $d$. כדי שהשדה שלו ב-P יצביע שמאלה, הרחק ממנו, הוא צריך להיות חיובי.
          המרחק שלו מ-P שווה למרחק של $+Q$, ולכן גם גודלו $Q$.
      - kind: reasoning
        text: >-
          (ב) המטען השני נמצא משמאל ל-P, במרחק $2d$. כדי שהשדה שלו ב-P יצביע שמאלה, אליו, הוא צריך להיות שלילי.
          המרחק כפול, ולכן השדה שלו חלש פי 4 ממטען באותו גודל במרחק $d$. כדי לפצות, הוא צריך להיות גדול פי 4: $-4Q$.
      - kind: reasoning
        text: >-
          (ג) המטען השני נמצא משמאל ל-P, במרחק $d/2$. גם כאן השדה שלו צריך להצביע אליו, ולכן הוא שלילי.
          המרחק קטן פי 2, ולכן השדה שלו חזק פי 4. כדי שהעוצמות יהיו שוות, הוא צריך להיות קטן פי 4: $-Q/4$.
      - kind: result
        text: >-
          (א) $+Q$. (ב) $-4Q$. (ג) $-Q/4$. בכל מקרה קובעים קודם את הסימן לפי הכיוון הדרוש, ואחר כך את הגודל לפי המרחק בריבוע.

  - id: W-1.5-07
    level: mid
    qualitative: false
    objectives: [OBJ-1.5-1, OBJ-1.5-2]
    prompt: >-
      גרגר אבק שמסתו $4\cdot10^{-15}\,\text{kg}$ מרחף במנוחה באוויר, במקום שבו השדה החשמלי הוא $5\cdot10^{4}\,\text{N/C}$ ומצביע למטה.
      הזניחו את כל הכוחות מלבד הכובד והכוח החשמלי ($g = 10\,\text{m/s}^2$).

      (א) מה סימן המטען של הגרגר?

      (ב) מה גודל המטען?

      (ג) כמה אלקטרונים עודפים יש על הגרגר?
    answer: >-
      (א) שלילי.

      (ב) $8\cdot10^{-19}\,\text{C}$.

      (ג) 5 אלקטרונים.
    solution:
      - kind: reasoning
        text: >-
          הגרגר במנוחה, ולכן לפי החוק הראשון של ניוטון הכוח השקול עליו אפס. הכובד מושך למטה, ולכן הכוח החשמלי צריך להיות למעלה, באותו גודל.
          השדה מצביע למטה, והכוח למעלה, כלומר הפוך לשדה. לכן המטען שלילי.
      - kind: formula
        text: >-
          $|q|\,E = mg$.
      - kind: manipulation
        text: >-
          מחלקים את שני האגפים ב-$E$: $|q| = \dfrac{mg}{E}$.
      - kind: substitution
        text: >-
          $mg = 4\cdot10^{-15} \cdot 10 = 4\cdot10^{-14}\,\text{N}$, ולכן $|q| = \dfrac{4\cdot10^{-14}}{5\cdot10^{4}} = 8\cdot10^{-19}\,\text{C}$.
      - kind: substitution
        text: >-
          מספר האלקטרונים העודפים: $n = \dfrac{|q|}{e} = \dfrac{8\cdot10^{-19}}{1.6\cdot10^{-19}} = 5$.
      - kind: result
        text: >-
          (א) שלילי. (ב) $8\cdot10^{-19}\,\text{C}$. (ג) 5 אלקטרונים עודפים. יצא מספר שלם, כפי שצריך: המטען תמיד כפולה שלמה של המטען היסודי.

  - id: W-1.5-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.5-4, OBJ-1.5-3, OBJ-1.5-2]
    prompt: >-
      מטען $q_1 = +2\,\mu\text{C}$ נמצא בראשית ציר x, ומטען $q_2 = -8\,\mu\text{C}$ נמצא בנקודה $x = 0.3\,\text{m}$.

      (א) חשבו את השדה השקול (גודל וכיוון) בנקודה $x = 0.1\,\text{m}$.

      (ב) מניחים בנקודה הזו אלקטרון. מה הכוח עליו (גודל וכיוון)?

      (ג) באיזה אזור של ציר x יכולה להיות נקודה שבה השדה השקול מתאפס? מצאו אותה.
    answer: >-
      (א) $3.6\cdot10^{6}\,\text{N/C}$, בכיוון $+x$.

      (ב) כ-$5.8\cdot10^{-13}\,\text{N}$, בכיוון $-x$.

      (ג) משמאל ל-$q_1$, בנקודה $x = -0.3\,\text{m}$.
    solution:
      - kind: given
        text: >-
          $q_1 = 2\cdot10^{-6}\,\text{C}$ בנקודה $x = 0$, ו-$q_2 = -8\cdot10^{-6}\,\text{C}$ בנקודה $x = 0.3\,\text{m}$. הכיוון החיובי הוא $+x$, ימינה.
      - kind: reasoning
        text: >-
          (א) בנקודה $x = 0.1\,\text{m}$ השדה של $q_1$ החיובי מצביע הרחק ממנו, ימינה. השדה של $q_2$ השלילי מצביע אליו, גם ימינה. השדות באותו כיוון, ולכן מחברים.
      - kind: substitution
        text: >-
          המרחק מ-$q_1$ הוא $0.1\,\text{m}$, והמרחק מ-$q_2$ הוא $0.2\,\text{m}$:
          $E_1 = \dfrac{9\cdot10^{9} \cdot 2\cdot10^{-6}}{0.1^2} = 1.8\cdot10^{6}\,\text{N/C}$ ו-$E_2 = \dfrac{9\cdot10^{9} \cdot 8\cdot10^{-6}}{0.2^2} = 1.8\cdot10^{6}\,\text{N/C}$.
          השקול: $E = 3.6\cdot10^{6}\,\text{N/C}$, ימינה.
      - kind: substitution
        text: >-
          (ב) $F = eE = 1.6\cdot10^{-19} \cdot 3.6\cdot10^{6} \approx 5.8\cdot10^{-13}\,\text{N}$. האלקטרון שלילי, ולכן הכוח הפוך לשדה: שמאלה.
      - kind: reasoning
        text: >-
          (ג) בין המטענים השדות באותו כיוון, ולכן שם אין ביטול. מימין ל-$q_2$ השדות מנוגדים, אבל $q_2$ גם גדול יותר וגם קרוב יותר, ולכן השדה שלו חזק יותר תמיד.
          נשאר רק האזור משמאל ל-$q_1$: שם השדות מנוגדים, והמטען הקטן קרוב יותר, כך שהמרחק יכול לפצות על הגודל.
      - kind: manipulation
        text: >-
          נסמן ב-$s$ את המרחק של נקודת האפס משמאל ל-$q_1$. המרחק שלה מ-$q_2$ הוא $s + 0.3$. משווים עוצמות ומצמצמים את $k$ ואת $10^{-6}$:
          $\dfrac{2}{s^2} = \dfrac{8}{(s + 0.3)^2}$. מכפילים את שני האגפים ב-$s^2(s + 0.3)^2$ ומחלקים ב-2: $(s + 0.3)^2 = 4s^2$.
          שני הצדדים חיוביים, ולכן מוציאים שורש: $s + 0.3 = 2s$, ומכאן $s = 0.3\,\text{m}$.
      - kind: reasoning
        text: >-
          בדיקה: ב-$x = -0.3\,\text{m}$ המרחקים הם $0.3\,\text{m}$ ו-$0.6\,\text{m}$.
          $\dfrac{9\cdot10^{9} \cdot 2\cdot10^{-6}}{0.3^2} = 2\cdot10^{5}\,\text{N/C}$ ו-$\dfrac{9\cdot10^{9} \cdot 8\cdot10^{-6}}{0.6^2} = 2\cdot10^{5}\,\text{N/C}$, בכיוונים מנוגדים.
      - kind: result
        text: >-
          (א) $3.6\cdot10^{6}\,\text{N/C}$, ימינה. (ב) כ-$5.8\cdot10^{-13}\,\text{N}$, שמאלה. (ג) נקודת האפס נמצאת משמאל למטען הקטן, ב-$x = -0.3\,\text{m}$.

  - id: W-1.5-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.5-4, OBJ-1.5-3]
    prompt: >-
      שני מטענים של $+4\,\mu\text{C}$ נמצאים על ציר x, בנקודות $(-0.3, 0)\,\text{m}$ ו-$(0.3, 0)\,\text{m}$. הנקודה P נמצאת על ציר y, ב-$(0, 0.4)\,\text{m}$.

      (א) מה המרחק של P מכל אחד מהמטענים?

      (ב) מצאו את השדה השקול ב-P (גודל וכיוון).

      (ג) מה משתנה אם מחליפים את המטען הימני במטען של $-4\,\mu\text{C}$? מצאו את השדה השקול ב-P במקרה הזה.
    answer: >-
      (א) $0.5\,\text{m}$.

      (ב) כ-$2.3\cdot10^{5}\,\text{N/C}$, בכיוון $+y$.

      (ג) כ-$1.7\cdot10^{5}\,\text{N/C}$, בכיוון $+x$, מהמטען החיובי לכיוון השלילי.
    solution:
      - kind: substitution
        text: >-
          (א) לפי פיתגורס: $r = \sqrt{0.3^2 + 0.4^2} = 0.5\,\text{m}$, לשני המטענים.
      - kind: substitution
        text: >-
          העוצמה של כל שדה לבדו: $E_1 = \dfrac{9\cdot10^{9} \cdot 4\cdot10^{-6}}{0.5^2} = 1.44\cdot10^{5}\,\text{N/C}$.
      - kind: reasoning
        text: >-
          (ב) כל שדה מצביע הרחק מהמטען שלו, לאורך הקו מהמטען אל P. לאורך הקו הזה הצעד הוא $0.3\,\text{m}$ בציר x ו-$0.4\,\text{m}$ בציר y, מתוך $0.5\,\text{m}$.
          לכן לכל שדה רכיב אופקי של $0.6$ מהעוצמה ורכיב אנכי של $0.8$ ממנה.
          השדה של המטען השמאלי מצביע ימינה ולמעלה, והשדה של המטען הימני מצביע שמאלה ולמעלה.
      - kind: substitution
        text: >-
          הרכיבים האופקיים, $\pm 0.6 \cdot 1.44\cdot10^{5} = \pm 8.64\cdot10^{4}\,\text{N/C}$, מבטלים זה את זה.
          הרכיבים האנכיים מתחברים: $E_y = 2 \cdot 0.8 \cdot 1.44\cdot10^{5} \approx 2.3\cdot10^{5}\,\text{N/C}$.
      - kind: reasoning
        text: >-
          (ג) השדה של המטען השמאלי לא משתנה: ימינה ולמעלה. השדה של המטען הימני, שעכשיו שלילי, מצביע אליו: ימינה ולמטה, באותה עוצמה.
          עכשיו הרכיבים האנכיים מבטלים זה את זה, והרכיבים האופקיים מתחברים.
      - kind: substitution
        text: >-
          $E_x = 2 \cdot 0.6 \cdot 1.44\cdot10^{5} \approx 1.7\cdot10^{5}\,\text{N/C}$.
      - kind: result
        text: >-
          (א) $0.5\,\text{m}$. (ב) כ-$2.3\cdot10^{5}\,\text{N/C}$, בכיוון $+y$. (ג) כ-$1.7\cdot10^{5}\,\text{N/C}$, בכיוון $+x$: השדה מסתובב ב-$90^\circ$, וקטן.

  - id: W-1.5-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.5-4, OBJ-1.5-1, OBJ-1.5-2]
    prompt: >-
      מטען $q_1 = +1\,\mu\text{C}$ נמצא בראשית ציר x, ומטען לא ידוע $q_2$ נמצא בנקודה $x = 0.2\,\text{m}$.
      מודדים את השדה בנקודה $x = 0.1\,\text{m}$ בעזרת מטען בוחן.

      (א) השדה שנמדד הוא $2.7\cdot10^{6}\,\text{N/C}$, בכיוון $+x$. מצאו את $q_2$ (גודל וסימן).

      (ב) מה היה $q_2$ אילו השדה שנמדד היה אפס?

      (ג) מה היה $q_2$ אילו השדה שנמדד היה $4.5\cdot10^{5}\,\text{N/C}$, בכיוון $+x$?

      (ד) איזו תוצאה של המדידה (גודל וכיוון) מראה מיד ש-$q_2$ שלילי, בלי שום חישוב נוסף?
    answer: >-
      (א) $-2\,\mu\text{C}$.

      (ב) $+1\,\mu\text{C}$.

      (ג) $+0.5\,\mu\text{C}$.

      (ד) שדה בכיוון $+x$ שגדול מ-$9\cdot10^{5}\,\text{N/C}$.
    solution:
      - kind: given
        text: >-
          הנקודה $x = 0.1\,\text{m}$ נמצאת במרחק $0.1\,\text{m}$ משני המטענים. הכיוון החיובי הוא $+x$.
      - kind: substitution
        text: >-
          השדה של $q_1$ לבדו: $E_1 = \dfrac{9\cdot10^{9} \cdot 1\cdot10^{-6}}{0.1^2} = 9\cdot10^{5}\,\text{N/C}$, בכיוון $+x$ (הרחק מ-$q_1$).
      - kind: formula
        text: >-
          לפי עקרון הסופרפוזיציה $\vec E = \vec E_1 + \vec E_2$, ולכן $\vec E_2 = \vec E - \vec E_1$. על הציר זה חשבון עם סימנים.
      - kind: substitution
        text: >-
          (א) $E_2 = 2.7\cdot10^{6} - 9\cdot10^{5} = 1.8\cdot10^{6}\,\text{N/C}$, בכיוון $+x$, כלומר אל $q_2$. שדה שמצביע אל המטען אומר שהמטען שלילי.
          מבודדים את הגודל: $|q_2| = \dfrac{E_2\,r^2}{k} = \dfrac{1.8\cdot10^{6} \cdot 0.1^2}{9\cdot10^{9}} = 2\cdot10^{-6}\,\text{C}$.
      - kind: reasoning
        text: >-
          (ב) שדה אפס פירושו $\vec E_2 = -\vec E_1$: $9\cdot10^{5}\,\text{N/C}$ בכיוון $-x$, הרחק מ-$q_2$. לכן $q_2$ חיובי, ובאותו מרחק כמו $q_1$ הוא צריך להיות שווה לו: $+1\,\mu\text{C}$.
      - kind: substitution
        text: >-
          (ג) $E_2 = 4.5\cdot10^{5} - 9\cdot10^{5} = -4.5\cdot10^{5}\,\text{N/C}$: בכיוון $-x$, הרחק מ-$q_2$, ולכן $q_2$ חיובי.
          $|q_2| = \dfrac{4.5\cdot10^{5} \cdot 0.1^2}{9\cdot10^{9}} = 5\cdot10^{-7}\,\text{C}$.
      - kind: reasoning
        text: >-
          (ד) $q_2$ שלילי יוצר בנקודה שדה בכיוון $+x$ (אליו), כמו $q_1$. אז שני השדות מתחברים, והשקול בכיוון $+x$ וגדול מ-$9\cdot10^{5}\,\text{N/C}$.
          $q_2$ חיובי מחליש את השדה של $q_1$ או הופך אותו, ולכן לא יכול לתת תוצאה כזו.
      - kind: result
        text: >-
          (א) $q_2 = -2\,\mu\text{C}$. (ב) $+1\,\mu\text{C}$. (ג) $+0.5\,\mu\text{C}$. (ד) שדה בכיוון $+x$ שגדול מ-$9\cdot10^{5}\,\text{N/C}$, השדה של $q_1$ לבדו.

challenge:
  - id: W-1.5-c1
    stars: 1
    objectives: [OBJ-1.5-4, OBJ-1.5-2, OBJ-1.5-3]
    prompt: >-
      ארבעה מטענים נקודתיים נמצאים בקודקודים של ריבוע שאורך צלעו $10\,\text{cm}$.
      בקודקוד השמאלי העליון A יש מטען של $+10\,\text{nC}$, בקודקוד הימני העליון B יש $+8\,\text{nC}$,
      בקודקוד הימני התחתון C יש $-12\,\text{nC}$, ובקודקוד השמאלי התחתון D יש $-6\,\text{nC}$.
      מצאו את השדה החשמלי השקול במרכז הריבוע: גודל וכיוון.
    answer: >-
      כ-$4.7\cdot10^{4}\,\text{N/C}$, כמעט ישר למטה: נוטה כ-$12.5^\circ$ מהאנך לכיוון ימין (כ-$77.5^\circ$ מתחת לכיוון $+x$).
    solution:
      - kind: given
        text: >-
          המרחק מכל קודקוד למרכז הוא חצי אלכסון: $r = \dfrac{0.1\sqrt2}{2}\,\text{m}$, ולכן $r^2 = \dfrac{0.1^2}{2} = 5\cdot10^{-3}\,\text{m}^2$.
      - kind: substitution
        text: >-
          עוצמת השדה של כל מטען במרכז, $E = k|q|/r^2$: מ-A $1.8\cdot10^{4}$, מ-B $1.44\cdot10^{4}$, מ-C $2.16\cdot10^{4}$, ומ-D $1.08\cdot10^{4}\,\text{N/C}$.
      - kind: reasoning
        text: >-
          כיוונים: השדה של A החיובי מצביע הרחק ממנו, לאורך האלכסון אל C. השדה של C השלילי מצביע אליו, גם הוא לאורך האלכסון אל C.
          באותו אופן, השדה של B החיובי והשדה של D השלילי מצביעים שניהם לאורך האלכסון השני, מ-B אל D.
      - kind: substitution
        text: >-
          לאורך האלכסון מ-A אל C: $1.8\cdot10^{4} + 2.16\cdot10^{4} = 3.96\cdot10^{4}\,\text{N/C}$. לאורך האלכסון מ-B אל D: $1.44\cdot10^{4} + 1.08\cdot10^{4} = 2.52\cdot10^{4}\,\text{N/C}$.
      - kind: reasoning
        text: >-
          האלכסונים של ריבוע מאונכים זה לזה, ולכן שני הסכומים האלה הם רכיבים מאונכים של השדה השקול. נוח להשתמש באלכסונים כצירים.
      - kind: substitution
        text: >-
          $E = \sqrt{(3.96\cdot10^{4})^2 + (2.52\cdot10^{4})^2} \approx 4.7\cdot10^{4}\,\text{N/C}$.
          הזווית מהאלכסון אל C: $\tan\varphi = 2.52/3.96 \approx 0.64$, ולכן $\varphi \approx 32.5^\circ$, לכיוון D.
      - kind: reasoning
        text: >-
          האלכסון אל C פונה למטה וימינה, $45^\circ$ מתחת לכיוון $+x$. סיבוב של $32.5^\circ$ לכיוון D (למטה ושמאלה) נותן כ-$77.5^\circ$ מתחת לכיוון $+x$:
          כמעט ישר למטה, ונוטה כ-$12.5^\circ$ ימינה מהאנך.
      - kind: result
        text: >-
          כ-$4.7\cdot10^{4}\,\text{N/C}$, למטה ומעט ימינה: כ-$77.5^\circ$ מתחת לכיוון $+x$.
    source:
      name: British Physics Olympiad (BPhO), Round 1
      year: 2018
      problem: 'Round 1, November 2018, Section 1, Question 1(r)(i)'
      url: https://www.bpho.org.uk/Papers/R1/2018Nov_R1_S1.pdf
      verified: '2026-11-02'
      adapted: true

  - id: W-1.5-c2
    stars: 2
    objectives: [OBJ-1.5-2, OBJ-1.5-3, OBJ-1.5-4]
    prompt: >-
      משושה משוכלל, שאורך כל צלע שלו $a = 10\,\text{cm}$, מונח כך שאחת מצלעותיו אופקית ונמצאת למעלה. מרכז המשושה הוא הנקודה O.
      ליד כל אחת משש הצלעות, מחוץ למשושה, נמצא מטען נקודתי. מקומו נקבע כך: מורידים אנך מ-O אל הצלע וממשיכים אותו החוצה, והצלע חוצה את הקטע שבין O למטען בדיוק באמצע.
      חמישה מהמטענים שווים, $q = 2\,\text{nC}$ כל אחד (חיוביים). המטען השישי, זה שמתחת לצלע התחתונה, הוא $q_6$, והוא משתנה מסעיף לסעיף.

      (א) מה המרחק של כל מטען מ-O? רמז: משושה משוכלל בנוי משישה משולשים שווי צלעות, שלכולם קודקוד משותף ב-O.

      (ב) נניח $q_6 = q$. מה השדה החשמלי ב-O? נמקו בלי חישוב.

      (ג) נניח שהמטען השישי שלילי ושווה בגודלו לאחרים: $q_6 = -q$. מה השדה ב-O, גודל וכיוון?

      (ד) איזה מטען $q_6$ צריך לשים במקום השישי כדי שהשדה ב-O יהיה $1800\,\text{N/C}$ כלפי מעלה?
    answer: >-
      (א) $r = \sqrt3\,a \approx 0.17\,\text{m}$.

      (ב) אפס.

      (ג) $1.2\cdot10^{3}\,\text{N/C}$, כלפי מטה (אל המטען השישי).

      (ד) $q_6 = 8\,\text{nC}$, חיובי.
    solution:
      - kind: given
        text: >-
          $a = 0.1\,\text{m}$, $q = 2\cdot10^{-9}\,\text{C}$, $k = 9\cdot10^{9}\,\text{N}\cdot\text{m}^2/\text{C}^2$.
      - kind: reasoning
        text: >-
          (א) המשושה בנוי משישה משולשים שווי צלעות שצלעם $a$. האנך מ-O אל צלע הוא הגובה של אחד המשולשים: $h = \dfrac{\sqrt3}{2}\,a$.
          הצלע חוצה את הקטע מ-O אל המטען באמצע, ולכן המטען רחוק מ-O פי 2 מהצלע: $r = 2h = \sqrt3\,a$.
      - kind: substitution
        text: >-
          $r = \sqrt3 \cdot 0.1 \approx 0.173\,\text{m}$. נוח יותר לעבוד עם הריבוע: $r^2 = 3a^2 = 0.03\,\text{m}^2$.
      - kind: reasoning
        text: >-
          כל ששת המטענים באותו מרחק מ-O. לכל מטען יש שותף מעבר ל-O: המטען שליד הצלע הנגדית, על אותו קו ובאותו מרחק.
          כך ששת המטענים מתחלקים לשלושה זוגות: הזוג האנכי (העליון והשישי) ושני זוגות אלכסוניים.
      - kind: reasoning
        text: >-
          (ב) כש-$q_6 = q$, בכל זוג יש שני מטענים חיוביים שווים. השדה של כל אחד מהם ב-O מצביע הרחק ממנו, ולכן שני השדות שווים בגודלם ומנוגדים בכיוונם, ומבטלים זה את זה.
          שלושת הזוגות נותנים אפס, ולכן השדה ב-O הוא אפס.
      - kind: formula
        text: >-
          עוצמת השדה של מטען אחד ב-O: $E_1 = \dfrac{kq}{r^2}$.
      - kind: substitution
        text: >-
          $E_1 = \dfrac{9\cdot10^{9} \cdot 2\cdot10^{-9}}{0.03} = 600\,\text{N/C}$.
      - kind: reasoning
        text: >-
          (ג) שני הזוגות האלכסוניים לא השתנו, ועדיין מבטלים זה את זה. נשאר הזוג האנכי. המטען העליון חיובי, והשדה שלו ב-O מצביע הרחק ממנו, כלומר כלפי מטה.
          המטען השישי שלילי, והשדה שלו ב-O מצביע אליו, גם הוא כלפי מטה. שני השדות באותו כיוון ומתחברים:
          $$E = 2E_1 = 2 \cdot 600 = 1200\ \text{N/C}$$
      - kind: reasoning
        text: >-
          דרך קצרה יותר, בעזרת עקרון הסופרפוזיציה: אפשר לחשוב על המטען השישי כעל שני מטענים באותה נקודה, $q$ ועוד מטען נוסף שגודלו $2q$ והוא שלילי, כי $q + (-2q) = -q$.
          ששת המטענים השווים נותנים ב-O אפס (סעיף ב), ולכן השדה ב-O הוא השדה של המטען הנוסף לבדו:
          $$E = \frac{k \cdot 2q}{r^2} = 2E_1 = 1200\ \text{N/C}$$
          אל המטען הנוסף, כי הוא שלילי, כלומר כלפי מטה.
      - kind: reasoning
        text: >-
          (ד) אותו רעיון: המטען השישי שקול למטען $q$ ועוד מטען נוסף $q_6 - q$ באותה נקודה. ששת המטענים השווים מבטלים זה את זה, ולכן השדה ב-O הוא השדה של המטען הנוסף לבדו, שנמצא במרחק $r$ מתחת ל-O.
          השדה צריך להצביע כלפי מעלה, כלומר הרחק מהמטען הנוסף. לכן המטען הנוסף חיובי: $q_6 > q$.
      - kind: manipulation
        text: >-
          $\dfrac{k(q_6 - q)}{r^2} = 1800\,\text{N/C}$. כופלים ב-$r^2$ ומחלקים ב-$k$:
          $$q_6 - q = \frac{1800 \cdot 0.03}{9\cdot10^{9}} = 6\cdot10^{-9}\ \text{C}$$
      - kind: substitution
        text: >-
          $q_6 = 2\cdot10^{-9} + 6\cdot10^{-9} = 8\cdot10^{-9}\,\text{C}$, כלומר $8\,\text{nC}$.
      - kind: result
        text: >-
          (א) $r = \sqrt3\,a \approx 0.17\,\text{m}$.

          (ב) השדה ב-O הוא אפס: המטענים מבטלים זה את זה בזוגות.

          (ג) $1.2\cdot10^{3}\,\text{N/C}$, כלפי מטה.

          (ד) $q_6 = 8\,\text{nC}$, חיובי. השדה ב-O תלוי רק בהפרש $q_6 - q$, כי כל השאר מתבטל בזוגות.
    source:
      name: JEE Advanced
      year: 2022
      problem: 'Paper 1, Physics, Q.13'
      url: https://jeeadv.ac.in/past_qps/2022_1_English.pdf
      verified: '2026-11-02'
      adapted: true
