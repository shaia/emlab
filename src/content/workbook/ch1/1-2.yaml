# Workbook, lesson 1.2 (charging by friction, contact and induction; the electroscope; polarisation).
# Format and rules: see .claude/CLAUDE.md, "Worked examples, workbook". Chapter 1 scope: no Coulomb's law yet
# (lesson 1.3), so "nearer charges push and pull harder" is used only qualitatively, as the lesson itself does.

lesson: '1.2'
practice:
  - id: W-1.2-01
    level: basic
    qualitative: false
    objectives: [OBJ-1.2-1]
    prompt: >-
      מסרקים שיער במסרק פלסטיק ניטרלי, והמסרק מקבל מהשיער $5\cdot10^{11}$ אלקטרונים. ($e = 1.6\cdot10^{-19}\,\text{C}$)

      (א) מה המטען של המסרק, ומה המטען של השיער?

      (ב) בכמה גדלה המסה של המסרק? מסת אלקטרון היא $m_e = 9.1\cdot10^{-31}\,\text{kg}$. האם אפשר להרגיש את השינוי הזה במשקל?
    answer: >-
      (א) המסרק טעון $-8\cdot10^{-8}\,\text{C}$, והשיער טעון $+8\cdot10^{-8}\,\text{C}$.

      (ב) המסה גדלה בכ-$4.6\cdot10^{-19}\,\text{kg}$, וזה רחוק מאוד מכל מה שאפשר להרגיש או לשקול.
    solution:
      - kind: given
        text: >-
          $n = 5\cdot10^{11}$ אלקטרונים עברו מהשיער אל המסרק. לפני הסירוק שני הגופים ניטרליים.
      - kind: formula
        text: >-
          כל אלקטרון נושא מטען $-e$, ולכן המטען של המסרק הוא $q = -n\,e$. לפי שימור המטען, השיער טעון באותו גודל ובסימן הפוך. כל אלקטרון מוסיף למסרק את המסה שלו, ולכן תוספת המסה היא $\Delta m = n\,m_e$.
      - kind: substitution
        text: >-
          $q = -5\cdot10^{11}\cdot1.6\cdot10^{-19}\,\text{C} = -8\cdot10^{-8}\,\text{C}$, ו-$\Delta m = 5\cdot10^{11}\cdot9.1\cdot10^{-31}\,\text{kg} \approx 4.6\cdot10^{-19}\,\text{kg}$.
      - kind: reasoning
        text: >-
          מסרק שוקל כמה גרמים, כלומר בערך $10^{-2}\,\text{kg}$. תוספת של $10^{-19}\,\text{kg}$ קטנה ממנו פי $10^{16}$ בערך, ולכן אין שום מאזניים שיראו אותה. המטען, לעומת זאת, מספיק כדי להרים פיסות נייר.
      - kind: result
        text: >-
          (א) המסרק $-8\cdot10^{-8}\,\text{C}$ והשיער $+8\cdot10^{-8}\,\text{C}$. (ב) המסה גדלה בכ-$4.6\cdot10^{-19}\,\text{kg}$, וזה זניח לגמרי.

  - id: W-1.2-02
    level: basic
    qualitative: true
    objectives: [OBJ-1.2-2, OBJ-1.2-3]
    prompt: >-
      אלקטרוסקופ טעון חיובית, והעלים שלו פתוחים. אין שום גוף טעון בקרבת מקום. נוגעים בכדור של האלקטרוסקופ באצבע. גוף האדם מוליך, ודרכו האלקטרוסקופ מחובר לאדמה.

      (א) מה קורה לעלים?

      (ב) באיזה כיוון עוברים אלקטרונים? למה לא עוברים פרוטונים?

      (ג) מה המטען של האלקטרוסקופ אחרי שמרחיקים את האצבע?
    answer: >-
      (א) העלים נסגרים.

      (ב) אלקטרונים עוברים מהאדמה, דרך הגוף, אל האלקטרוסקופ. פרוטונים כלואים בגרעינים ולא עוברים.

      (ג) האלקטרוסקופ ניטרלי.
    solution:
      - kind: reasoning
        text: >-
          האלקטרוסקופ החיובי חסר אלקטרונים. כשהאצבע נוגעת בו, הוא, הגוף והאדמה הם מוליך אחד, והאדמה היא מאגר ענק של אלקטרונים.
      - kind: reasoning
        text: >-
          המטען החיובי של האלקטרוסקופ מושך אלקטרונים מהמאגר. הם עוברים דרך הגוף אל האלקטרוסקופ ומשלימים את החסר. מה שזז הם האלקטרונים, כי הפרוטונים נמצאים בגרעינים של האטומים ולא עוברים בין גופים מוצקים.
      - kind: reasoning
        text: >-
          אין גוף טעון קרוב שיחזיק מטען באלקטרוסקופ, ולכן המעבר נמשך עד שהאלקטרוסקופ ניטרלי. על העלים לא נשאר מטען עודף, והם נסגרים. כשמרחיקים את האצבע אין שום שינוי: האלקטרוסקופ כבר ניטרלי.
      - kind: result
        text: >-
          העלים נסגרים, כי אלקטרונים עוברים מהאדמה אל האלקטרוסקופ. בסוף האלקטרוסקופ ניטרלי.

  - id: W-1.2-03
    level: basic
    qualitative: false
    objectives: [OBJ-1.2-1]
    prompt: >-
      שני כדורי מתכת זהים: על A יש מטען $+10\,\text{nC}$, ועל B יש מטען $-4\,\text{nC}$. מקרבים אותם עד שהם נוגעים זה בזה, ומפרידים. ($e = 1.6\cdot10^{-19}\,\text{C}$)

      (א) מה המטען של כל כדור?

      (ב) כמה אלקטרונים עברו, ובאיזה כיוון?
    answer: >-
      (א) לכל כדור $+3\,\text{nC}$.

      (ב) כ-$4.4\cdot10^{10}$ אלקטרונים עברו מ-B אל A.
    solution:
      - kind: given
        text: >-
          $q_A = +10\,\text{nC}$ ו-$q_B = -4\,\text{nC}$. הכדורים זהים.
      - kind: formula
        text: >-
          לפי שימור המטען, סך המטען לא משתנה. כדורים זהים מתחלקים בו שווה בשווה: $q' = \dfrac{q_A + q_B}{2}$. מספר האלקטרונים שעברו הוא $n = \dfrac{|\Delta q|}{e}$, כש-$\Delta q$ הוא השינוי במטען של אחד הכדורים.
      - kind: substitution
        text: >-
          $q' = \dfrac{+10\,\text{nC} + (-4\,\text{nC})}{2} = +3\,\text{nC}$. המטען של B השתנה מ-$-4\,\text{nC}$ ל-$+3\,\text{nC}$, כלומר ב-$7\,\text{nC}$.
      - kind: reasoning
        text: >-
          B נעשה חיובי יותר, ולכן הוא איבד אלקטרונים, ו-A, שנעשה פחות חיובי, קיבל אותם. B נתן ל-A את כל האלקטרונים העודפים שלו (מטען של $4\,\text{nC}$), ועוד אלקטרונים משלו (מטען של $3\,\text{nC}$).
      - kind: substitution
        text: >-
          $n = \dfrac{7\cdot10^{-9}\,\text{C}}{1.6\cdot10^{-19}\,\text{C}} \approx 4.4\cdot10^{10}$
      - kind: result
        text: >-
          (א) לכל כדור $+3\,\text{nC}$. (ב) כ-$4.4\cdot10^{10}$ אלקטרונים עברו מ-B אל A.

  - id: W-1.2-04
    level: mid
    qualitative: true
    objectives: [OBJ-1.2-3]
    prompt: >-
      אלקטרוסקופ טעון חיובית, והעלים שלו פתוחים מעט. לפניכם שלוש פעולות. לכל פעולה קבעו אם העלים נפתחים יותר, נסגרים חלקית או לא משתנים, ונמקו. לפני כל פעולה מחזירים את האלקטרוסקופ למצבו ההתחלתי.

      (א) מקרבים אל הכדור מוט טעון שלילית במטען קטן, בלי לגעת.

      (ב) מקרבים אל הכדור מוט טעון חיובית, בלי לגעת.

      (ג) נוגעים בכדור שלו בכדור של אלקטרוסקופ שני, זהה וניטרלי, ומפרידים. מה קורה לעלים של כל אחד משני האלקטרוסקופים?
    answer: >-
      (א) נסגרים חלקית.

      (ב) נפתחים יותר.

      (ג) העלים של הראשון נסגרים חלקית, והעלים של השני נפתחים. לכל אחד מהם יש עכשיו חצי מהמטען, חיובי.
    solution:
      - kind: reasoning
        text: >-
          (א) המוט השלילי דוחה אלקטרונים מהכדור אל העלים. על העלים היה חסר באלקטרונים, והאלקטרונים שמגיעים ממלאים חלק ממנו. המטען החיובי על העלים קטן, והם נסגרים חלקית. המוט חלש, ולכן הוא לא דוחה מספיק אלקטרונים כדי שהעלים ייסגרו לגמרי וייפתחו שוב.
      - kind: reasoning
        text: >-
          (ב) המוט החיובי מושך אלקטרונים מהעלים אל הכדור. על העלים החסר באלקטרונים גדל, המטען החיובי שעליהם גדל, והם נפתחים יותר.
      - kind: reasoning
        text: >-
          (ג) בזמן המגע שני האלקטרוסקופים הם מוליך אחד. הם זהים, ולכן המטען החיובי מתחלק ביניהם שווה בשווה: אלקטרונים עוברים מהשני אל הראשון. לראשון נשאר חצי מהמטען, והעלים שלו נסגרים חלקית. השני נעשה חיובי, והעלים שלו נפתחים באותה מידה.
      - kind: result
        text: >-
          (א) נסגרים חלקית. (ב) נפתחים יותר. (ג) העלים של הראשון נסגרים חלקית, והעלים של השני נפתחים, ולשניהם אותה פתיחה.

  - id: W-1.2-05
    level: mid
    qualitative: false
    objectives: [OBJ-1.2-1]
    prompt: >-
      לכדור מתכת A יש מטען לא ידוע. נוגעים בו בכדור B, זהה וניטרלי, ומפרידים. אחר כך נוגעים ב-B בכדור C, גם הוא זהה וניטרלי, ומפרידים. בסוף המטען של C הוא $+2\,\text{nC}$. ($e = 1.6\cdot10^{-19}\,\text{C}$)

      (א) מה היה המטען של A בהתחלה?

      (ב) כמה אלקטרונים עברו במגע הראשון, ובאיזה כיוון?
    answer: >-
      (א) $+8\,\text{nC}$.

      (ב) $2.5\cdot10^{10}$ אלקטרונים עברו מ-B אל A.
    solution:
      - kind: given
        text: >-
          A, B ו-C זהים. B ו-C ניטרליים בהתחלה. אחרי המגע השני $q_C = +2\,\text{nC}$.
      - kind: formula
        text: >-
          כדורים זהים שנוגעים מתחלקים בסך המטען שלהם שווה בשווה. הולכים אחורה בזמן, מהמגע האחרון לראשון.
      - kind: manipulation
        text: >-
          במגע השני, B (עם המטען $q_B$ שקיבל במגע הראשון) נוגע ב-C הניטרלי, ולכן $q_C = \dfrac{q_B}{2}$. כופלים את שני האגפים ב-2: $q_B = 2\,q_C$.
      - kind: substitution
        text: >-
          $q_B = 2\cdot(+2\,\text{nC}) = +4\,\text{nC}$. במגע הראשון A ו-B קיבלו מטען שווה, ולכן גם ל-A נשאר $+4\,\text{nC}$, וסך המטען לפני המגע היה $q_A = +4 + 4 = +8\,\text{nC}$.
      - kind: reasoning
        text: >-
          במגע הראשון B עבר מ-$0$ ל-$+4\,\text{nC}$: הוא איבד אלקטרונים, ו-A קיבל אותם. מספרם הוא $n = \dfrac{4\cdot10^{-9}\,\text{C}}{1.6\cdot10^{-19}\,\text{C}} = 2.5\cdot10^{10}$.
      - kind: result
        text: >-
          (א) המטען של A בהתחלה היה $+8\,\text{nC}$. (ב) $2.5\cdot10^{10}$ אלקטרונים עברו מ-B אל A.

  - id: W-1.2-06
    level: mid
    qualitative: true
    objectives: [OBJ-1.2-2]
    prompt: >-
      ארבעה תלמידים מנסים לטעון אלקטרוסקופ ניטרלי בעזרת מוט טעון **חיובית**, שלא נוגע באלקטרוסקופ. כל אחד מבצע את אותן ארבע פעולות בסדר אחר. לכל תלמיד קבעו מה המטען של האלקטרוסקופ בסוף, ונמקו.

      תלמיד 1: מקרב את המוט, מארק, מנתק את ההארקה, מרחיק את המוט.

      תלמיד 2: מארק, מקרב את המוט, מנתק את ההארקה, מרחיק את המוט.

      תלמיד 3: מקרב את המוט, מארק, מרחיק את המוט, מנתק את ההארקה.

      תלמיד 4: מארק, מנתק את ההארקה, מקרב את המוט, מרחיק את המוט.
    answer: >-
      תלמידים 1 ו-2: האלקטרוסקופ שלילי. תלמידים 3 ו-4: האלקטרוסקופ ניטרלי.
    solution:
      - kind: reasoning
        text: >-
          הכלל: אלקטרונים עוברים בין האדמה לאלקטרוסקופ רק כשהחוט מחובר **וגם** המוט קרוב. האלקטרוסקופ נשאר טעון רק אם מנתקים את החוט בזמן שהמוט עדיין קרוב. המוט החיובי מושך אלקטרונים מהאדמה אל האלקטרוסקופ, ולכן המטען שנשאר הוא שלילי.
      - kind: reasoning
        text: >-
          תלמיד 1: זה הסדר של השיעור. בזמן ההארקה עולים אלקטרונים מהאדמה, הניתוק כולא אותם, והאלקטרוסקופ שלילי.
      - kind: reasoning
        text: >-
          תלמיד 2: כשהוא מארק, עוד אין מוט, ולכן לא קורה כלום. אבל החוט עדיין מחובר כשהמוט מתקרב, ואז אלקטרונים עולים מהאדמה. הוא מנתק לפני שהוא מרחיק, ולכן גם אצלו האלקטרוסקופ שלילי.
      - kind: reasoning
        text: >-
          תלמיד 3: הוא מרחיק את המוט כשהחוט עדיין מחובר. כבר אין מה שמחזיק את האלקטרונים הנוספים, והם חוזרים לאדמה. כשהוא מנתק, האלקטרוסקופ ניטרלי.
      - kind: reasoning
        text: >-
          תלמיד 4: החוט מנותק כל הזמן שהמוט קרוב. המוט רק מזיז אלקטרונים בתוך האלקטרוסקופ (העלים נפתחים), ואף אלקטרון לא נכנס ולא יוצא. כשהוא מרחיק את המוט, העלים נסגרים והאלקטרוסקופ ניטרלי.
      - kind: result
        text: >-
          תלמידים 1 ו-2 מקבלים אלקטרוסקופ שלילי, בסימן הפוך למוט. אצל תלמידים 3 ו-4 האלקטרוסקופ נשאר ניטרלי.

  - id: W-1.2-07
    level: mid
    qualitative: true
    objectives: [OBJ-1.2-4]
    prompt: >-
      סרגל פלסטיק ניטרלי תלוי בחוט שקשור באמצעו, והוא יכול להסתובב בחופשיות במישור אופקי. מקרבים מוט טעון **שלילית** אל קצה אחד של הסרגל, בלי לגעת, והקצה הזה מסתובב אל המוט.

      (א) הסבירו למה הקצה מסתובב אל המוט, אף על פי שהסרגל ניטרלי.

      (ב) איזה מטען נמצא על שפת הסרגל הקרובה למוט?

      (ג) מחליפים את המוט במוט טעון **חיובית**. לאיזה כיוון יסתובב הקצה עכשיו?

      (ד) האם המטען הכולל של הסרגל השתנה במהלך הניסוי?
    answer: >-
      (א) הסרגל מתקטב, והמשיכה לצד הקרוב חזקה מהדחייה של הצד הרחוק.

      (ב) מטען חיובי.

      (ג) שוב אל המוט.

      (ד) לא, הוא נשאר אפס.
    solution:
      - kind: reasoning
        text: >-
          פלסטיק הוא מבודד, ולכן האלקטרונים לא עוברים בו מצד לצד. המוט השלילי דוחה את האלקטרונים של כל מולקולה, והם זזים מעט הרחק ממנו ונשארים בתוך המולקולה. זה קיטוב.
      - kind: reasoning
        text: >-
          בתוך הסרגל המטענים של מולקולות שכנות מקזזים זה את זה. על השפה הקרובה למוט נשאר מטען חיובי, ועל השפה הרחוקה מטען שלילי.
      - kind: reasoning
        text: >-
          המוט מושך את המטען החיובי הקרוב ודוחה את המטען השלילי הרחוק. המטען החיובי קרוב יותר, והכוח בין מטענים קרובים חזק יותר (נראה זאת בשיעור 1.3). לכן הכוח השקול על הקצה הוא משיכה, והקצה מסתובב אל המוט.
      - kind: reasoning
        text: >-
          עם מוט חיובי, האלקטרונים של כל מולקולה זזים מעט **אל** המוט. עכשיו השפה הקרובה שלילית, שוב בסימן הפוך למוט, ושוב יש משיכה.
      - kind: reasoning
        text: >-
          אף אלקטרון לא נכנס לסרגל ולא יצא ממנו: המטענים רק זזו מעט בתוך המולקולות. לכן המטען הכולל נשאר אפס.
      - kind: result
        text: >-
          (א) קיטוב: הצד הקרוב מנוגד בסימן למוט וקרוב אליו יותר. (ב) חיובי. (ג) הקצה מסתובב שוב אל המוט. (ד) המטען הכולל לא השתנה, והוא אפס.

  - id: W-1.2-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.2-1, OBJ-1.2-2, OBJ-1.2-3]
    prompt: >-
      מוט מבודד טעון $-20\,\text{nC}$. שני אלקטרוסקופים זהים, A ו-B, ניטרליים. ($e = 1.6\cdot10^{-19}\,\text{C}$)

      בשלב הראשון טוענים את A בהשראה בעזרת המוט. בזמן ההארקה עוברים לאדמה $2.5\cdot10^{10}$ אלקטרונים.

      בשלב השני נוגעים במוט בכדור של B ומרחיקים אותו. אחרי המגע המטען של B הוא $-6\,\text{nC}$.

      (א) מה המטען של A ומה המטען של המוט אחרי השלב הראשון?

      (ב) מה המטען של המוט אחרי השלב השני?

      (ג) מקרבים את A ואת B עד שהכדורים שלהם נוגעים זה בזה, ומפרידים. מה המטען של כל אלקטרוסקופ? כמה אלקטרונים עברו, ובאיזה כיוון? האם העלים שלהם פתוחים?
    answer: >-
      (א) A טעון $+4.0\,\text{nC}$, והמוט נשאר $-20\,\text{nC}$.

      (ב) $-14\,\text{nC}$.

      (ג) לכל אלקטרוסקופ $-1.0\,\text{nC}$. כ-$3.1\cdot10^{10}$ אלקטרונים עברו מ-B אל A. העלים של שניהם פתוחים מעט, כי על שניהם נשאר מטען.
    solution:
      - kind: given
        text: >-
          המוט: $-20\,\text{nC}$. בשלב הראשון $n_1 = 2.5\cdot10^{10}$ אלקטרונים עוזבים את A. בשלב השני $q_B = -6\,\text{nC}$.
      - kind: reasoning
        text: >-
          בהשראה המוט לא נוגע ולא מאבד מטען. A איבד אלקטרונים, ולכן הוא חיובי.
      - kind: substitution
        text: >-
          $q_A = +n_1 e = 2.5\cdot10^{10}\cdot1.6\cdot10^{-19}\,\text{C} = 4.0\cdot10^{-9}\,\text{C} = +4.0\,\text{nC}$
      - kind: reasoning
        text: >-
          במגע עם B, המטען ש-B קיבל בא מהמוט. לפי שימור המטען, סך המטען של המוט ושל B נשאר $-20\,\text{nC}$, ולכן המטען של המוט הוא $-20 - (-6) = -14\,\text{nC}$.
      - kind: formula
        text: >-
          A ו-B זהים, ולכן במגע ביניהם הם מתחלקים בסך המטען שלהם שווה בשווה: $q' = \dfrac{q_A + q_B}{2}$.
      - kind: substitution
        text: >-
          $q' = \dfrac{+4.0\,\text{nC} + (-6.0\,\text{nC})}{2} = -1.0\,\text{nC}$
      - kind: reasoning
        text: >-
          A עבר מ-$+4.0\,\text{nC}$ ל-$-1.0\,\text{nC}$, כלומר קיבל אלקטרונים שהמטען שלהם $5.0\,\text{nC}$. הם באו מ-B. מספרם הוא $n = \dfrac{5.0\cdot10^{-9}\,\text{C}}{1.6\cdot10^{-19}\,\text{C}} \approx 3.1\cdot10^{10}$. על כל אלקטרוסקופ נשאר מטען עודף, ולכן העלים שלו פתוחים, פחות מבהתחלה.
      - kind: result
        text: >-
          (א) $q_A = +4.0\,\text{nC}$ והמוט $-20\,\text{nC}$. (ב) המוט $-14\,\text{nC}$. (ג) לכל אלקטרוסקופ $-1.0\,\text{nC}$, כ-$3.1\cdot10^{10}$ אלקטרונים עברו מ-B אל A, והעלים של שניהם פתוחים מעט.

  - id: W-1.2-09
    level: bagrut
    qualitative: true
    objectives: [OBJ-1.2-1, OBJ-1.2-2, OBJ-1.2-3]
    prompt: >-
      משפשפים מוט PVC בצמר, והמוט נטען שלילית. בעזרת המוט טוענים בהשראה אלקטרוסקופ X. בעזרת הצמר טוענים במגע אלקטרוסקופ Y, זהה ל-X: נוגעים בצמר בכדור של Y ומרחיקים אותו.

      (א) מה הסימן של הצמר, של X ושל Y? נמקו כל אחד.

      (ב) מקרבים לאט את מוט ה-PVC, בלי לגעת, קודם אל X ואחר כך אל Y. מה קורה לעלים של כל אחד מהם כשהמוט מתחיל להתקרב מרחוק?

      (ג) מקרבים את X ואת Y עד שהכדורים שלהם נוגעים זה בזה, ומפרידים. האם העלים של כל אחד מהם פתוחים או סגורים? נמקו.

      (ד) חוזרים על סעיף (ג), אבל בזמן ש-X ו-Y נוגעים זה בזה נוגעים באצבע בכדור של X. אין גוף טעון קרוב. מה המצב אחרי שמפרידים?
    answer: >-
      (א) הצמר חיובי, X חיובי ו-Y חיובי.

      (ב) אצל שניהם העלים נסגרים חלקית.

      (ג) העלים של שניהם פתוחים.

      (ד) שניהם ניטרליים, והעלים סגורים.
    solution:
      - kind: reasoning
        text: >-
          (א) בחיכוך אלקטרונים עברו מהצמר אל המוט, ולכן הצמר חיובי. בהשראה האלקטרוסקופ מקבל סימן הפוך לגוף הטעון, ולכן X חיובי. במגע שני הגופים נשארים באותו סימן: הצמר החיובי משך אלקטרונים מ-Y, ולכן Y חיובי.
      - kind: reasoning
        text: >-
          (ב) X ו-Y חיוביים, והמוט שלילי. המוט דוחה אלקטרונים מהכדור אל העלים, והם ממלאים חלק מהחסר שעל העלים. המטען החיובי על העלים קטן, והעלים נסגרים חלקית, אצל כל אחד מהם.
      - kind: reasoning
        text: >-
          (ג) שני האלקטרוסקופים חיוביים, ולכן סך המטען שלהם חיובי. הם זהים, ולכן הם מתחלקים בו שווה בשווה, ולכל אחד יש מטען חיובי. על העלים של כל אחד יש מטען עודף, והם פתוחים.
      - kind: reasoning
        text: >-
          (ד) בזמן המגע X, Y, הגוף והאדמה הם מוליך אחד. אין גוף טעון קרוב שיחזיק מטען, ולכן אלקטרונים עוברים מהאדמה אל שני האלקטרוסקופים עד שהם ניטרליים. גם Y מתנטרל, אף על פי שלא נגעו בו, כי הוא נוגע ב-X.
      - kind: result
        text: >-
          (א) הצמר, X ו-Y חיוביים. (ב) אצל שניהם העלים נסגרים חלקית. (ג) העלים של שניהם פתוחים. (ד) שניהם ניטרליים והעלים סגורים.

  - id: W-1.2-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.2-4, OBJ-1.2-1, OBJ-1.2-2]
    prompt: >-
      כדור קל עטוף ברדיד אלומיניום, ניטרלי, תלוי בחוט מבודד. מקרבים אליו מוט זכוכית טעון **חיובית**. ($e = 1.6\cdot10^{-19}\,\text{C}$)

      (א) הכדור נמשך אל המוט. הסבירו למה, אף על פי שהוא ניטרלי.

      (ב) הכדור נוגע במוט, ומיד אחר כך נדחה ממנו. הסבירו, וקבעו את סימן המטען של הכדור.

      (ג) אחרי המגע המטען של הכדור הוא $+1.6\,\text{nC}$. כמה אלקטרונים עזבו את הכדור, ולאן הם הלכו?

      (ד) מרחיקים את המוט ונוגעים בכדור באצבע. אחר כך מקרבים שוב את המוט. מה יקרה לכדור?
    answer: >-
      (א) מטען מושרה: הצד הקרוב שלילי ומושך חזק יותר.

      (ב) במגע הכדור נטען חיובית, באותו סימן כמו המוט, ולכן נדחה.

      (ג) $1.0\cdot10^{10}$ אלקטרונים, מהכדור אל המוט.

      (ד) הכדור מתנטרל, ושוב נמשך אל המוט.
    solution:
      - kind: reasoning
        text: >-
          (א) הרדיד הוא מוליך. המוט החיובי מושך את האלקטרונים החופשיים שלו אל הצד הקרוב, ובצד הרחוק נשאר חסר באלקטרונים. הצד הקרוב שלילי, הוא קרוב יותר למוט, והמשיכה אליו חזקה מהדחייה של הצד הרחוק. לכן הכוח השקול הוא משיכה.
      - kind: reasoning
        text: >-
          (ב) במגע, המוט החיובי מושך אלקטרונים מהכדור אל עצמו. הכדור מאבד אלקטרונים ונעשה חיובי, כמו המוט. שני גופים חיוביים דוחים זה את זה, ולכן הכדור נדחה.
      - kind: formula
        text: >-
          (ג) הכדור איבד $n$ אלקטרונים, ולכן $q = +n\,e$, ומכאן $n = \dfrac{q}{e}$.
      - kind: substitution
        text: >-
          $n = \dfrac{1.6\cdot10^{-9}\,\text{C}}{1.6\cdot10^{-19}\,\text{C}} = 1.0\cdot10^{10}$
      - kind: reasoning
        text: >-
          (ד) אין גוף טעון קרוב, ולכן הנגיעה באצבע היא הארקה שמנטרלת: אלקטרונים עוברים מהאדמה אל הכדור עד שהוא ניטרלי. כשמקרבים שוב את המוט, הכדור הניטרלי שוב נמשך, כמו בסעיף (א), ואם ייגע שוב הוא שוב יידחה.
      - kind: result
        text: >-
          (א) נמשך בגלל המטען המושרה. (ב) במגע נעשה חיובי ונדחה. (ג) $1.0\cdot10^{10}$ אלקטרונים עברו מהכדור אל המוט. (ד) הכדור מתנטרל, ושוב נמשך אל המוט.

challenge:
  - id: W-1.2-c1
    stars: 1
    objectives: [OBJ-1.2-4, OBJ-1.2-1]
    prompt: >-
      שני כדורים זהים וקלים, עשויים מחומר מבודד, תלויים בחוטים מבודדים זה לצד זה. החוטים אנכיים, והכדורים נוגעים זה בזה. בהתחלה שני הכדורים ניטרליים. טוענים את אחד הכדורים במטען חיובי, והשני נשאר ניטרלי.

      (א) מה מצב הכדורים והחוטים אחרי הטעינה: האם הכדורים מתרחקים זה מזה, האם החוטים נוטים, או שהכול נשאר במקום? נמקו בעזרת הכוחות שפועלים על כל כדור.

      (ב) מה היה קורה אילו שני הכדורים היו עשויים ממתכת?
    answer: >-
      (א) הכול נשאר במקום: הכדורים תלויים אנכית ונוגעים זה בזה. הכדור הניטרלי מתקטב ונמשך אל הטעון, אבל הם כבר נוגעים, והכוח שכל כדור מפעיל על השני במגע מאזן את המשיכה.

      (ב) המטען היה מתחלק שווה בשווה, שני הכדורים היו חיוביים ודוחים זה את זה, והחוטים היו נוטים הצידה, כל אחד לצד שלו, באותה זווית.
    solution:
      - kind: reasoning
        text: >-
          הכדורים מבודדים, ולכן במגע ביניהם מטען לא עובר מהכדור הטעון אל הניטרלי (השאלה גם אומרת שהשני נשאר ניטרלי). הכדור הטעון מקטב את הכדור הניטרלי: בכל מולקולה שלו האלקטרונים זזים מעט אל הכדור החיובי. על השפה הקרובה לכדור הטעון נשאר מטען שלילי, ועל השפה הרחוקה מטען חיובי.
      - kind: reasoning
        text: >-
          המטען השלילי קרוב יותר לכדור הטעון, ולכן המשיכה חזקה מהדחייה, ובין הכדורים יש משיכה. היא פועלת לאורך הקו שמחבר את מרכזי הכדורים, כלומר אופקית.
      - kind: reasoning
        text: >-
          הכוחות על כל כדור: כוח הכובד למטה, המתיחות בחוט למעלה, המשיכה החשמלית אל הכדור השני, והכוח שהכדור השני מפעיל עליו במגע, שדוחף אותו הרחק מהשני. המשיכה מנסה לקרב את הכדורים, אבל הם כבר נוגעים, ולכן כוח המגע ביניהם גדל עד שהוא מאזן אותה בדיוק. הכוח השקול האופקי על כל כדור נשאר אפס, והחוטים נשארים אנכיים.
      - kind: reasoning
        text: >-
          (ב) מתכת היא מוליך. ברגע שהכדור הטעון נוגע בכדור השני, אלקטרונים עוברים מהניטרלי אל החיובי, והכדורים הזהים מתחלקים במטען שווה בשווה. עכשיו שניהם חיוביים, והם דוחים זה את זה ומתרחקים. לפי החוק השלישי של ניוטון הכוחות שהם מפעילים זה על זה שווים בגודלם, ולכדורים אותה מסה, ולכן שני החוטים נוטים באותה זווית, כל אחד לצד שלו.
      - kind: result
        text: >-
          (א) הכדורים נשארים תלויים אנכית ונוגעים זה בזה: יש משיכה בגלל הקיטוב, וכוח המגע מאזן אותה. (ב) כדורי מתכת היו מתחלקים במטען, נעשים שניהם חיוביים ונדחים, והחוטים היו נוטים באותה זווית לשני הצדדים.
    source:
      name: CAP High School Prize Exam
      year: 2007
      problem: 'Part B, Question 21'
      url: https://research-groups.usask.ca/physics-high-school-outreach/documents/cap_exam07_english.pdf
      verified: '2026-11-02'
      adapted: true

  - id: W-1.2-c2
    stars: 1
    objectives: [OBJ-1.2-2, OBJ-1.2-4]
    prompt: >-
      שני כדורים קלים וזהים, ניטרליים, מצופים בשכבה מוליכה, תלויים בחוטים מבודדים זה לצד זה ונוגעים זה בזה. מקרבים מוט זכוכית טעון **חיובית** אל כדור A, מהצד הרחוק מכדור B, בלי לגעת. בזמן שהמוט קרוב מפרידים בין הכדורים, ורק אחר כך מרחיקים את המוט. נסמן ב-$q_A$ וב-$q_B$ את המטענים של הכדורים בסוף.

      (א) איזו מהאפשרויות נכונה? נמקו.

      (1) $q_A < 0$ וגם $q_B < 0$

      (2) $q_A < 0$ וגם $q_B > 0$

      (3) $q_A > 0$ וגם $q_B < 0$

      (4) $q_A > 0$ וגם $q_B > 0$

      (ב) מה משתנה אם הכדורים עשויים כולם ממבודד, בלי השכבה המוליכה?

      (ג) חוזרים לכדורים המוליכים, אבל הפעם מקרבים את המוט אל נקודת המגע בין הכדורים, מהצד, כך שהוא נמצא במרחק שווה משני הכדורים. אחר כך מפרידים את הכדורים בתנועה שווה לשני הצדדים, ומרחיקים את המוט. מה המטען של כל כדור?
    answer: >-
      (א) אפשרות (2): $q_A < 0$ ו-$q_B > 0$, בגודל שווה.

      (ב) שני הכדורים נשארים ניטרליים: הם רק מתקטבים, ומטען לא עובר מכדור לכדור.

      (ג) שני הכדורים נשארים ניטרליים, כי המצב סימטרי ואין סיבה שאלקטרונים יעברו לכדור אחד יותר מלשני.
    solution:
      - kind: reasoning
        text: >-
          (א) כל עוד הכדורים נוגעים, השכבות המוליכות שלהם הן מוליך אחד. המוט החיובי מושך אלקטרונים חופשיים אל הצד הקרוב אליו, כלומר אל A. B, הרחוק, מאבד אלקטרונים. כשמפרידים בזמן שהמוט קרוב, האלקטרונים כבר לא יכולים לחזור, ולכן A נשאר שלילי ו-B חיובי.
      - kind: reasoning
        text: >-
          לפי שימור המטען, סך המטען של שני הכדורים נשאר אפס, ולכן $q_A = -q_B$. המוט לא נגע, והמטען שלו לא השתנה. לכן אפשרות (2). אפשרויות (1) ו-(4) סותרות את שימור המטען, ואפשרות (3) הופכת את כיוון התנועה של האלקטרונים.
      - kind: reasoning
        text: >-
          (ב) במבודד האלקטרונים לא עוברים ממקום למקום. המוט מקטב כל מולקולה בשני הכדורים, אבל האלקטרונים נשארים בתוך המולקולות, ואף אלקטרון לא עובר מ-B אל A דרך נקודת המגע. כשמפרידים ומרחיקים את המוט, הקיטוב נעלם, וכל כדור נשאר עם המטען שהיה לו: אפס.
      - kind: reasoning
        text: >-
          (ג) עכשיו המוט נמצא במרחק שווה משני הכדורים הזהים. המוט מושך אלקטרונים אל הצד של כל כדור שפונה אליו, אבל אין שום הבדל בין A ל-B שיגרום לאלקטרונים לעבור מכדור אחד לשני. גם ההפרדה סימטרית. לכן לשני הכדורים אותו מטען, וסך המטען הוא אפס, כך שכל אחד מהם ניטרלי.
      - kind: result
        text: >-
          (א) אפשרות (2): A שלילי ו-B חיובי, בגודל שווה. (ב) כדורים מבודדים נשארים ניטרליים. (ג) כשהמוט במרחק שווה משני הכדורים, שניהם נשארים ניטרליים.
