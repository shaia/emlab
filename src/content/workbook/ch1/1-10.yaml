# Workbook for lesson 1.10: ten practice problems and two sourced challenge problems.
# Every number recomputed with src/physics (constants.ts, motion.ts: deflection + rk4Step,
# charge-in-field.ts: crtPath).

lesson: '1.10'
practice:
  - id: W-1.10-01
    level: basic
    qualitative: false
    objectives: [OBJ-1.10-1]
    prompt: >-
      איזה שדה חשמלי (גודל וכיוון) יחזיק פרוטון במנוחה, כך שהכוח החשמלי יאזן את המשקל שלו?
      השוו את התוצאה לשדה של $5\cdot10^{3}\,\text{N/C}$, שמסיט אלקטרונים בשפופרת.
      ($m_p = 1.67\cdot10^{-27}\,\text{kg}$, $e = 1.6\cdot10^{-19}\,\text{C}$, $g = 10\,\text{m/s}^2$)
    answer: >-
      $1.0\cdot10^{-7}\,\text{N/C}$, כלפי מעלה: חלש בערך פי $5\cdot10^{10}$ מהשדה בשפופרת
    solution:
      - kind: given
        text: >-
          $m_p = 1.67\cdot10^{-27}\,\text{kg}$, $e = 1.6\cdot10^{-19}\,\text{C}$, $g = 10\,\text{m/s}^2$.
      - kind: reasoning
        text: >-
          המשקל פונה למטה, ולכן הכוח החשמלי צריך לפנות למעלה. הפרוטון חיובי, והכוח עליו בכיוון השדה, ולכן השדה מצביע כלפי מעלה.
      - kind: formula
        text: >-
          שוויון הכוחות: $eE = m_p g$.
      - kind: manipulation
        text: >-
          מחלקים את שני האגפים ב-$e$ כדי לבודד את $E$: $E = \dfrac{m_p g}{e}$.
      - kind: substitution
        text: >-
          $E = \dfrac{1.67\cdot10^{-27}\cdot 10}{1.6\cdot10^{-19}} = 1.0\cdot10^{-7}\,\text{N/C}$.
          היחס לשדה בשפופרת: $\dfrac{5\cdot10^{3}}{1.0\cdot10^{-7}} \approx 5\cdot10^{10}$.
      - kind: result
        text: >-
          שדה של $1.0\cdot10^{-7}\,\text{N/C}$ כלפי מעלה מספיק. השדה בשפופרת חזק ממנו בערך פי $5\cdot10^{10}$, ולכן בשפופרת מותר להתעלם מהמשקל של החלקיק.

  - id: W-1.10-02
    level: basic
    qualitative: true
    objectives: [OBJ-1.10-1]
    prompt: >-
      בנקודה מסוימת בשדה חשמלי אחיד, אלקטרון מקבל תאוצה של $10^{15}\,\text{m/s}^2$ כלפי מטה.

      (א) לאן מצביע השדה?

      (ב) שמים באותה נקודה פרוטון במקום האלקטרון. לאן תפנה התאוצה שלו? האם היא גדולה או קטנה מזו של האלקטרון, ופי כמה בערך?
    answer: >-
      (א) כלפי מעלה.

      (ב) כלפי מעלה, וקטנה פי 1800 בערך.
    solution:
      - kind: reasoning
        text: >-
          (א) התאוצה היא בכיוון הכוח, ולכן הכוח על האלקטרון פונה למטה. האלקטרון שלילי, והכוח עליו הפוך לשדה. לכן השדה מצביע כלפי מעלה.
      - kind: reasoning
        text: >-
          (ב) הפרוטון חיובי, ולכן הכוח עליו בכיוון השדה, כלפי מעלה. גודל המטען שלו שווה לזה של האלקטרון, ולכן גם גודל הכוח $eE$ שווה.
      - kind: reasoning
        text: >-
          לפי $a = eE/m$, אותו כוח על מסה גדולה פי 1800 בערך נותן תאוצה קטנה פי 1800 בערך: כ-$5\cdot10^{11}\,\text{m/s}^2$.
      - kind: result
        text: >-
          (א) השדה מצביע כלפי מעלה.

          (ב) התאוצה של הפרוטון כלפי מעלה, הפוכה לזו של האלקטרון, וקטנה ממנה פי 1800 בערך.

  - id: W-1.10-03
    level: basic
    qualitative: true
    objectives: [OBJ-1.10-2]
    prompt: >-
      מצלמים אלקטרון שנכנס אופקית בין שני לוחות, בהבזקים במרווחי זמן שווים, החל מהרגע שבו הוא נכנס לשדה.
      בהבזק הראשון אחרי הכניסה, ההסטה שלו היא $0.2\,\text{mm}$.

      (א) מה ההסטה שלו בהבזק הרביעי? (הוא עדיין בין הלוחות.)

      (ב) בכמה גדלה ההסטה בין ההבזק השלישי להבזק הרביעי?
    answer: >-
      (א) $3.2\,\text{mm}$.

      (ב) $1.4\,\text{mm}$.
    solution:
      - kind: reasoning
        text: >-
          האלקטרון נכנס בלי מהירות אנכית, והתאוצה האנכית קבועה. לכן ההסטה היא $y = \tfrac12 at^2$: היא גדלה כמו ריבוע הזמן.
      - kind: reasoning
        text: >-
          בהבזק ה-$n$ הזמן מאז הכניסה הוא פי $n$ מהזמן של ההבזק הראשון, ולכן ההסטה גדולה פי $n^2$: פי 1, 4, 9, 16.
      - kind: substitution
        text: >-
          (א) $16\cdot 0.2\,\text{mm} = 3.2\,\text{mm}$.
          (ב) בהבזק השלישי $9\cdot 0.2\,\text{mm} = 1.8\,\text{mm}$, ולכן ההפרש הוא $3.2\,\text{mm} - 1.8\,\text{mm} = 1.4\,\text{mm}$.
      - kind: result
        text: >-
          (א) $3.2\,\text{mm}$.

          (ב) $1.4\,\text{mm}$. ההפרשים בין הבזקים עוקבים גדלים (1, 3, 5, 7 יחידות של $0.2\,\text{mm}$), כמו בנפילה חופשית, כי המהירות האנכית גדלה כל הזמן.

  - id: W-1.10-04
    level: mid
    qualitative: false
    objectives: [OBJ-1.10-1]
    prompt: >-
      אלקטרון עובר דרך חור קטן בלוח ונכנס לאזור שבו שדה אחיד $E = 1.0\cdot10^{3}\,\text{N/C}$.
      המהירות שלו $4\cdot10^{6}\,\text{m/s}$, **בכיוון השדה**.

      (א) תארו את התנועה שלו.

      (ב) עד איזה מרחק מהחור הוא מגיע?

      (ג) אחרי כמה זמן הוא חוזר אל החור?
    answer: >-
      (א) הוא מאט בקו ישר, נעצר לרגע וחוזר.

      (ב) כ-$4.6\,\text{cm}$.

      (ג) כ-$4.6\cdot10^{-8}\,\text{s}$.
    solution:
      - kind: given
        text: >-
          $v_0 = 4\cdot10^{6}\,\text{m/s}$, $E = 1.0\cdot10^{3}\,\text{N/C}$, $e = 1.6\cdot10^{-19}\,\text{C}$, $m_e = 9.1\cdot10^{-31}\,\text{kg}$.
      - kind: reasoning
        text: >-
          (א) האלקטרון שלילי, ולכן הכוח עליו הפוך לשדה, כלומר הפוך לכיוון התנועה. הכוח קבוע, ולכן האלקטרון מאט בתאוצה קבועה, נעצר לרגע, וחוזר באותו קו אל החור.
      - kind: formula
        text: >-
          (ב) לפי משפט העבודה והאנרגיה הקינטית מהמכניקה: עבודת הכוח שווה לשינוי באנרגיה הקינטית. הכוח $eE$ פועל נגד ההעתק $d$, ולכן העבודה שלו שלילית, $W = -eE\,d$.
          האנרגיה הקינטית יורדת מ-$\tfrac12 m_e v_0^2$ לאפס, ולכן גם $W = 0 - \tfrac12 m_e v_0^2$.
      - kind: manipulation
        text: >-
          משווים את שני הביטויים ל-$W$ וכופלים את שני האגפים ב-$(-1)$: $eE\,d = \tfrac12 m_e v_0^2$. מחלקים ב-$eE$: $d = \dfrac{m_e v_0^2}{2eE}$.
      - kind: substitution
        text: >-
          $d = \dfrac{9.1\cdot10^{-31}\cdot\left(4\cdot10^{6}\right)^2}{2\cdot 1.6\cdot10^{-19}\cdot 1.0\cdot10^{3}} = 4.55\cdot10^{-2}\,\text{m} \approx 4.6\,\text{cm}$.
      - kind: substitution
        text: >-
          (ג) התאוצה: $a = \dfrac{eE}{m_e} = \dfrac{1.6\cdot10^{-19}\cdot 1.0\cdot10^{3}}{9.1\cdot10^{-31}} = 1.76\cdot10^{14}\,\text{m/s}^2$.
          זמן העצירה $v_0/a = 2.28\cdot10^{-8}\,\text{s}$, והחזרה נמשכת אותו זמן (תנועה סימטרית, כמו אבן שנזרקת למעלה). בסך הכול $t = 2v_0/a = 4.55\cdot10^{-8}\,\text{s} \approx 4.6\cdot10^{-8}\,\text{s}$.
      - kind: result
        text: >-
          (א) האלקטרון מאט, נעצר וחוזר בקו ישר.

          (ב) הוא מגיע עד כ-$4.6\,\text{cm}$ מהחור.

          (ג) הוא חוזר אל החור אחרי כ-$4.6\cdot10^{-8}\,\text{s}$, באותה מהירות שבה נכנס, בכיוון ההפוך.

  - id: W-1.10-05
    level: mid
    qualitative: false
    objectives: [OBJ-1.10-2]
    prompt: >-
      בשפופרת, אלקטרונים נכנסים בין הלוחות במהירות $3\cdot10^{7}\,\text{m/s}$. אורך הלוחות $5\,\text{cm}$,
      והמסך נמצא $20\,\text{cm}$ מסוף הלוחות. הכתם על המסך נמצא $2.5\,\text{cm}$ מעל המרכז.
      מה עוצמת השדה בין הלוחות, ולאן הוא מצביע?
    answer: >-
      $1.1\cdot10^{4}\,\text{N/C}$, כלפי מטה
    solution:
      - kind: given
        text: >-
          $v = 3\cdot10^{7}\,\text{m/s}$, $L = 0.05\,\text{m}$, $D = 0.20\,\text{m}$, $Y = 0.025\,\text{m}$.
      - kind: formula
        text: >-
          $$Y = \frac{eEL}{m_e v^2}\left(\frac{L}{2} + D\right)$$
      - kind: manipulation
        text: >-
          הנעלם הוא $E$. כופלים את שני האגפים ב-$m_e v^2$, ומחלקים ב-$eL\left(\tfrac{L}{2} + D\right)$:
          $$E = \frac{Y\,m_e v^2}{eL\left(\frac{L}{2} + D\right)}$$
      - kind: substitution
        text: >-
          $\tfrac{L}{2} + D = 0.025 + 0.20 = 0.225\,\text{m}$.
          $$E = \frac{0.025\cdot 9.1\cdot10^{-31}\cdot\left(3\cdot10^{7}\right)^2}{1.6\cdot10^{-19}\cdot 0.05\cdot 0.225} = \frac{2.05\cdot10^{-17}}{1.8\cdot10^{-21}} = 1.1\cdot10^{4}\ \text{N/C}$$
      - kind: reasoning
        text: >-
          הכתם מעל המרכז, ולכן הכוח על האלקטרון פונה למעלה. האלקטרון שלילי, ולכן השדה הפוך לכוח: כלפי מטה.
      - kind: result
        text: >-
          השדה הוא $1.1\cdot10^{4}\,\text{N/C}$, כלפי מטה (הלוח העליון חיובי).

  - id: W-1.10-06
    level: mid
    qualitative: true
    objectives: [OBJ-1.10-3, OBJ-1.10-2]
    prompt: >-
      בשפופרת מחליפים את הלוחות בלוחות ארוכים פי 2. השדה, המהירות והחלקיק לא משתנים, וגם המרחק $D$ מסוף הלוחות עד המסך לא משתנה.
      קבעו ונמקו, בלי להציב מספרים:

      (א) פי כמה משתנה ההסטה בסוף הלוחות?

      (ב) פי כמה משתנה $\tan\theta$, כאשר $\theta$ היא זווית היציאה?

      (ג) תלמיד אומר: "ההסטה על המסך תגדל פי 4, כמו ההסטה בסוף הלוחות". האם הוא צודק?
    answer: >-
      (א) פי 4.

      (ב) פי 2.

      (ג) לא. ההסטה על המסך גדלה פי $\dfrac{2(L + D)}{L/2 + D}$, כלומר פי 2 עד 4: פי 4 רק אם המסך צמוד ללוחות.
    solution:
      - kind: formula
        text: >-
          $y_L = \dfrac{|q|EL^2}{2mv^2}$, $\tan\theta = \dfrac{|q|EL}{mv^2}$, ו-$Y = \tan\theta\left(\dfrac{L}{2} + D\right)$.
      - kind: reasoning
        text: >-
          (א) $y_L \propto L^2$: אורך כפול נותן הסטה גדולה פי 4. החלקיק שוהה בין הלוחות זמן כפול, וההסטה תלויה בריבוע הזמן.
      - kind: reasoning
        text: >-
          (ב) $\tan\theta \propto L$: המהירות האנכית ביציאה, $v_y = at$, גדלה פי 2 כי הזמן כפול. המהירות האופקית לא משתנה, ולכן $\tan\theta$ גדל פי 2.
      - kind: reasoning
        text: >-
          (ג) עם הלוחות החדשים, באורך $2L$:
          $$Y' = 2\tan\theta\left(\frac{2L}{2} + D\right) = 2\tan\theta\,(L + D)$$
          היחס $\dfrac{Y'}{Y} = \dfrac{2(L + D)}{L/2 + D}$. כש-$D = 0$ הוא 4, וכש-$D$ גדול בהרבה מ-$L$ הוא מתקרב ל-2.
      - kind: result
        text: >-
          (א) פי 4. (ב) פי 2.

          (ג) התלמיד טועה. כשהמסך רחוק מהלוחות (כש-$D$ גדול מ-$L/2$), רוב ההסטה על המסך נוצרת בקטע הישר, שתלוי ב-$\tan\theta$, שגדל רק פי 2. בכל מקרה ההסטה על המסך גדלה פי 2 עד 4, לפי המרחק למסך, ופי 4 בדיוק רק כשהמסך צמוד ללוחות.

  - id: W-1.10-07
    level: mid
    qualitative: false
    objectives: [OBJ-1.10-4]
    prompt: >-
      תלמידים חזרו על ניסוי מיליקן וקיבלו ארבעה מטענים, ביחידות של $10^{-19}\,\text{C}$: 6.5, 9.6, 3.3, 11.1.
      בכל מדידה יש שגיאה של כמה אחוזים.

      (א) כמה מטענים יסודיים יש בכל טיפה?

      (ב) מה ההערכה הטובה ביותר של המטען היסודי מהמדידות האלה?

      (ג) תלמיד אחר טוען שהיחידה היא $3.2\cdot10^{-19}\,\text{C}$. הראו שהוא טועה.
    answer: >-
      (א) 4, 6, 2, 7.

      (ב) כ-$1.6\cdot10^{-19}\,\text{C}$.

      (ג) $11.1/3.2 \approx 3.5$ ו-$6.5/3.2 \approx 2.0$, ולכן 11.1 אינו כפולה שלמה של 3.2.
    solution:
      - kind: substitution
        text: >-
          (א) מחלקים כל מטען ב-$1.6$ (ביחידות של $10^{-19}\,\text{C}$): $6.5/1.6 = 4.06$, $9.6/1.6 = 6.00$, $3.3/1.6 = 2.06$, $11.1/1.6 = 6.94$.
          כל התוצאות קרובות לשלמים, בתוך השגיאה של כמה אחוזים: 4, 6, 2, 7.
      - kind: reasoning
        text: >-
          גם $0.8$ "מתאים": מקבלים 8, 12, 4, 14. אבל כל המספרים האלה זוגיים, ואף טיפה לא נתנה מספר אי-זוגי של יחידות כאלה. לכן אין סיבה להניח יחידה קטנה מ-$1.6$.
      - kind: formula
        text: >-
          (ב) ההערכה הטובה ביותר משתמשת בכל המדידות יחד: סכום המטענים חלקי סכום מספרי היחידות.
      - kind: substitution
        text: >-
          $$e \approx \frac{6.5 + 9.6 + 3.3 + 11.1}{4 + 6 + 2 + 7} = \frac{30.5}{19} = 1.61$$
          כלומר $1.61\cdot10^{-19}\,\text{C}$.
      - kind: reasoning
        text: >-
          (ג) $6.5/3.2 = 2.03$, $9.6/3.2 = 3.00$, $3.3/3.2 = 1.03$, אבל $11.1/3.2 = 3.47$: כמעט באמצע בין 3 ל-4, רחוק מכל שלם הרבה יותר מכמה אחוזים.
      - kind: result
        text: >-
          (א) 4, 6, 2 ו-7 מטענים יסודיים.

          (ב) $e \approx 1.6\cdot10^{-19}\,\text{C}$ (החישוב נותן $1.61\cdot10^{-19}\,\text{C}$).

          (ג) הטיפה הרביעית מפריכה את $3.2\cdot10^{-19}\,\text{C}$: המטען שלה אינו כפולה שלמה שלו.

  - id: W-1.10-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.10-1, OBJ-1.10-2, OBJ-1.10-3]
    prompt: >-
      בשפופרת, אלקטרון משתחרר ממנוחה ומואץ בשדה אחיד $E_1 = 5\cdot10^{4}\,\text{N/C}$ לאורך $d_1 = 1\,\text{cm}$.
      אחר כך הוא נכנס, בניצב לשדה, בין לוחות באורך $L = 4\,\text{cm}$ שביניהם שדה אחיד $E_2 = 1\cdot10^{4}\,\text{N/C}$.

      (א) מה מהירות האלקטרון בכניסה ללוחות?

      (ב) מה ההסטה שלו בסוף הלוחות?

      (ג) הראו שההסטה בסוף הלוחות היא $y_L = \dfrac{E_2 L^2}{4E_1 d_1}$, ולכן היא לא תלויה במטען ובמסה של החלקיק.

      (ד) במקום האלקטרון מאיצים פרוטון. כיוון שדה ההאצה הפוך, כדי שהפרוטון יואץ קדימה, ושדה ההסטה לא משתנה. מה ההסטה של הפרוטון, ובאיזו מהירות הוא נכנס ללוחות?
    answer: >-
      (א) $1.33\cdot10^{7}\,\text{m/s}$.

      (ב) $0.80\,\text{cm}$.

      (ד) אותה הסטה, $0.80\,\text{cm}$, לצד ההפוך. הפרוטון נכנס במהירות $3.1\cdot10^{5}\,\text{m/s}$ בלבד.
    solution:
      - kind: substitution
        text: >-
          (א) התאוצה בשדה ההאצה: $a_1 = \dfrac{eE_1}{m_e} = \dfrac{1.6\cdot10^{-19}\cdot 5\cdot10^{4}}{9.1\cdot10^{-31}} = 8.79\cdot10^{15}\,\text{m/s}^2$.
          מתחילים ממנוחה, ולכן $v^2 = 2a_1 d_1$:
          $$v = \sqrt{2\cdot 8.79\cdot10^{15}\cdot 0.01} = 1.33\cdot10^{7}\ \text{m/s}$$
      - kind: substitution
        text: >-
          (ב)
          $$y_L = \frac{eE_2L^2}{2m_e v^2} = \frac{1.6\cdot10^{-19}\cdot 1\cdot10^{4}\cdot 0.04^2}{2\cdot 9.1\cdot10^{-31}\cdot\left(1.33\cdot10^{7}\right)^2} = 8.0\cdot10^{-3}\ \text{m}$$
      - kind: manipulation
        text: >-
          (ג) מ-$v^2 = 2a_1d_1 = \dfrac{2eE_1d_1}{m}$ כופלים את שני האגפים ב-$m$ ומקבלים $mv^2 = 2eE_1d_1$. מציבים את זה במכנה של נוסחת ההסטה:
          $$y_L = \frac{eE_2L^2}{2\cdot 2eE_1d_1} = \frac{E_2L^2}{4E_1d_1}$$
          המטען מצטמצם, והמסה נעלמה. בדיקה: $\dfrac{1\cdot10^{4}\cdot 0.04^2}{4\cdot 5\cdot10^{4}\cdot 0.01} = 8.0\cdot10^{-3}\,\text{m}$, כמו בסעיף (ב).
      - kind: reasoning
        text: >-
          (ד) הנוסחה של (ג) לא תלויה במטען ובמסה, ולכן גודל ההסטה זהה. הפרוטון חיובי ושדה ההסטה לא השתנה, ולכן הוא מוסט לצד ההפוך מהאלקטרון.
          הפרוטון כבד יותר, ולכן הוא יוצא מההאצה איטי יותר: $v_p = \sqrt{\dfrac{2eE_1d_1}{m_p}} = \sqrt{\dfrac{2\cdot 1.6\cdot10^{-19}\cdot 5\cdot10^{4}\cdot 0.01}{1.67\cdot10^{-27}}} = 3.1\cdot10^{5}\,\text{m/s}$.
          הוא שוהה בין הלוחות זמן ארוך יותר, וזה מפצה בדיוק על התאוצה הקטנה יותר.
      - kind: result
        text: >-
          (א) $1.33\cdot10^{7}\,\text{m/s}$. (ב) $0.80\,\text{cm}$.

          (ג) $y_L = \dfrac{E_2L^2}{4E_1d_1}$: תלוי רק בשדות ובמידות.

          (ד) הפרוטון מוסט $0.80\,\text{cm}$ לצד ההפוך, ונכנס ללוחות במהירות $3.1\cdot10^{5}\,\text{m/s}$.

  - id: W-1.10-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.10-2, OBJ-1.10-1]
    prompt: >-
      לוחות באורך $L = 6\,\text{cm}$ מחולקים לשני חלקים שווים. בחצי הראשון השדה הוא $5\cdot10^{3}\,\text{N/C}$ כלפי מטה, ובחצי השני שדה באותה עוצמה כלפי מעלה.
      אלקטרון נכנס אופקית במהירות $2\cdot10^{7}\,\text{m/s}$.

      (א) תארו את המסלול שלו בכל אחד מהחצאים.

      (ב) באיזה כיוון הוא יוצא מהלוחות?

      (ג) מה ההסטה שלו ביציאה? השוו להסטה בסוף הלוחות כשיש שדה של $5\cdot10^{3}\,\text{N/C}$ כלפי מטה לכל אורכם.
    answer: >-
      (ב) אופקית, במקביל לכיוון הכניסה.

      (ג) $0.20\,\text{cm}$ מעל כיוון הכניסה, חצי מ-$0.40\,\text{cm}$ שמתקבלים עם שדה אחד לכל האורך.
    solution:
      - kind: given
        text: >-
          כל חצי באורך $0.03\,\text{m}$. הזמן בכל חצי: $t = \dfrac{0.03}{2\cdot10^{7}} = 1.5\cdot10^{-9}\,\text{s}$.
          גודל התאוצה בכל חצי: $a = \dfrac{eE}{m_e} = \dfrac{1.6\cdot10^{-19}\cdot 5\cdot10^{3}}{9.1\cdot10^{-31}} = 8.79\cdot10^{14}\,\text{m/s}^2$.
      - kind: reasoning
        text: >-
          (א) בחצי הראשון השדה למטה, ולכן הכוח על האלקטרון למעלה: פרבולה שמתכופפת למעלה, והמהירות האנכית גדלה.
          בחצי השני הכוח למטה, נגד המהירות האנכית: האלקטרון ממשיך לעלות, אבל המהירות האנכית שלו קטנה. המסלול מתכופף עכשיו למטה.
      - kind: reasoning
        text: >-
          (ב) המהירות האופקית לא משתנה, ולכן שני החצאים נמשכים אותו זמן $t$. בחצי הראשון המהירות האנכית גדלה ל-$at$, ובחצי השני היא קטנה בדיוק באותה כמות. ביציאה המהירות האנכית אפס: האלקטרון יוצא אופקית.
      - kind: formula
        text: >-
          (ג) בחצי הראשון $y_1 = \tfrac12 at^2$. בחצי השני הוא מתחיל עם מהירות אנכית $at$ ומאט: $y_2 = (at)\,t - \tfrac12 at^2 = \tfrac12 at^2$. בסך הכול $y = y_1 + y_2 = at^2$.
      - kind: substitution
        text: >-
          $y = 8.79\cdot10^{14}\cdot\left(1.5\cdot10^{-9}\right)^2 = 1.98\cdot10^{-3}\,\text{m} \approx 0.20\,\text{cm}$.
          עם שדה אחד לכל האורך: $y_L = \dfrac{eEL^2}{2m_e v^2} = \dfrac{1.6\cdot10^{-19}\cdot 5\cdot10^{3}\cdot 0.06^2}{2\cdot 9.1\cdot10^{-31}\cdot\left(2\cdot10^{7}\right)^2} = 3.96\cdot10^{-3}\,\text{m} \approx 0.40\,\text{cm}$.
      - kind: result
        text: >-
          (א) בחצי הראשון פרבולה שמתכופפת למעלה, ובחצי השני פרבולה שמתכופפת למטה.

          (ב) האלקטרון יוצא אופקית, במקביל לכיוון הכניסה.

          (ג) $0.20\,\text{cm}$ מעל קו הכניסה: חצי מההסטה עם שדה אחד לכל האורך, וגם בלי זווית יציאה. כך אפשר להזיז קרן במקביל לעצמה.

  - id: W-1.10-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-1.10-4]
    prompt: >-
      טיפת שמן מרחפת בין שני לוחות אופקיים כשהשדה ביניהם $4.0\cdot10^{4}\,\text{N/C}$. אחרי זמן מה המטען שלה משתנה,
      ועכשיו כדי שתרחף צריך שדה של $5.0\cdot10^{4}\,\text{N/C}$. מסת הטיפה לא ידועה. ($g = 10\,\text{m/s}^2$, $e = 1.6\cdot10^{-19}\,\text{C}$)

      (א) האם גודל המטען של הטיפה גדל או קטן? מצאו את היחס בין גודל המטען הראשון לגודל המטען השני.

      (ב) מהם מספרי המטענים היסודיים הקטנים ביותר שמתאימים ליחס הזה, ומה מסת הטיפה במקרה הזה?

      (ג) מדידה אחרת של מסת הטיפה נתנה $6.4\cdot10^{-15}\,\text{kg}$. כמה מטענים יסודיים היו בה בכל שלב?
    answer: >-
      (א) קטן. היחס הוא $5/4$.

      (ב) 5 ואחר כך 4. המסה $3.2\cdot10^{-15}\,\text{kg}$.

      (ג) 10 ואחר כך 8.
    solution:
      - kind: formula
        text: >-
          בכל ריחוף הכוח החשמלי מאזן את המשקל: $|q_1|E_1 = mg$ וגם $|q_2|E_2 = mg$. המשקל לא השתנה, ולכן $|q_1|E_1 = |q_2|E_2$.
      - kind: manipulation
        text: >-
          (א) מחלקים את שני האגפים ב-$|q_2|E_1$: $\dfrac{|q_1|}{|q_2|} = \dfrac{E_2}{E_1} = \dfrac{5.0\cdot10^{4}}{4.0\cdot10^{4}} = \dfrac{5}{4}$.
          צריך שדה חזק יותר כדי להחזיק את אותה טיפה, ולכן גודל המטען קטן.
      - kind: reasoning
        text: >-
          (ב) כל מטען הוא כפולה שלמה של $e$: $|q_1| = n_1e$ ו-$|q_2| = n_2e$, עם $n_1/n_2 = 5/4$. השלמים הקטנים ביותר הם $n_1 = 5$ ו-$n_2 = 4$.
      - kind: substitution
        text: >-
          מ-$n_1eE_1 = mg$ מחלקים ב-$g$: $m = \dfrac{n_1eE_1}{g} = \dfrac{5\cdot 1.6\cdot10^{-19}\cdot 4.0\cdot10^{4}}{10} = 3.2\cdot10^{-15}\,\text{kg}$.
          בדיקה בשלב השני: $4\cdot 1.6\cdot10^{-19}\cdot 5.0\cdot10^{4} = 3.2\cdot10^{-14}\,\text{N} = mg$.
      - kind: substitution
        text: >-
          (ג) עכשיו $mg = 6.4\cdot10^{-14}\,\text{N}$. מחלקים ב-$eE$ בכל שלב:
          $n_1 = \dfrac{6.4\cdot10^{-14}}{1.6\cdot10^{-19}\cdot 4.0\cdot10^{4}} = 10$ ו-$n_2 = \dfrac{6.4\cdot10^{-14}}{1.6\cdot10^{-19}\cdot 5.0\cdot10^{4}} = 8$.
          גם $10/8 = 5/4$, כמו שהיחס דורש.
      - kind: result
        text: >-
          (א) גודל המטען קטן, ביחס $5/4$.

          (ב) אם המטענים הם 5 ו-4 יחידות, מסת הטיפה $3.2\cdot10^{-15}\,\text{kg}$.

          (ג) עם המסה שנמדדה היו בטיפה 10 מטענים יסודיים, ואחר כך 8. היחס לבדו לא קובע את המספרים, ולכן מיליקן היה צריך למדוד גם את מסת הטיפה.

challenge:
  - id: W-1.10-c1
    stars: 1
    objectives: [OBJ-1.10-4, OBJ-1.10-1]
    prompt: >-
      טיפת שמן שמסתה $3.2\cdot10^{-15}\,\text{kg}$ נמצאת באוויר בין שני לוחות **אנכיים**.
      על טיפה שנעה, האוויר מפעיל כוח התנגדות שגודלו יחסי למהירות שלה, והוא פונה נגד כיוון התנועה.
      ($g = 10\,\text{m/s}^2$, $e = 1.6\cdot10^{-19}\,\text{C}$)

      (א) כשאין שדה בין הלוחות, הטיפה יורדת אנכית במהירות קבועה. הסבירו למה.

      (ב) מפעילים בין הלוחות שדה אחיד **אופקי** של $6.67\cdot10^{4}\,\text{N/C}$. עכשיו הטיפה נעה במהירות קבועה, בקו ישר שנוטה ב-$45^\circ$ מהאנך.
      הסבירו בעזרת הכוחות שפועלים על הטיפה, ומצאו את גודל המטען שלה.

      (ג) פתאום כיוון התנועה משתנה, והקו נוטה עכשיו ב-$18.4^\circ$ מהאנך. מאוחר יותר הוא משתנה שוב, ל-$33.7^\circ$.
      הסבירו מה קרה, ומצאו מכל המדידות את המטען היסודי.

      (ד) עכשיו הלוחות אופקיים. טיפה אחרת, שמסתה $1.0\cdot10^{-14}\,\text{kg}$, יורדת בלי שדה במהירות קבועה של $4.0\cdot10^{-4}\,\text{m/s}$.
      כשמפעילים שדה אנכי של $1.25\cdot10^{5}\,\text{N/C}$, היא עולה במהירות קבועה של $8.0\cdot10^{-5}\,\text{m/s}$. כמה מטענים יסודיים יש בה?
    answer: >-
      (ב) $4.8\cdot10^{-19}\,\text{C}$, כלומר $3e$.

      (ג) המטען השתנה ל-$1.6\cdot10^{-19}\,\text{C}$ ואחר כך ל-$3.2\cdot10^{-19}\,\text{C}$. המטען היסודי $1.6\cdot10^{-19}\,\text{C}$.

      (ד) 6.
    solution:
      - kind: reasoning
        text: >-
          (א) בהתחלה המשקל מאיץ את הטיפה למטה. ככל שהיא מהירה יותר, כוח ההתנגדות גדל, עד שהוא שווה למשקל. מאותו רגע הכוח השקול אפס, ולכן המהירות קבועה (החוק הראשון של ניוטון).
      - kind: reasoning
        text: >-
          (ב) על הטיפה פועלים שלושה כוחות: המשקל $mg$ למטה, הכוח החשמלי $|q|E$ אופקי, וכוח ההתנגדות. המהירות קבועה, ולכן הכוח השקול אפס: ההתנגדות שווה בגודלה לסכום הווקטורי של המשקל והכוח החשמלי, והפוכה לו.
          ההתנגדות פונה נגד המהירות, ולכן המהירות פונה בכיוון הסכום של $mg$ ו-$|q|E$. הזווית $\alpha$ של הסכום הזה מהאנך מקיימת $\tan\alpha = \dfrac{|q|E}{mg}$.
      - kind: manipulation
        text: >-
          כופלים את שני האגפים ב-$mg$ ומחלקים ב-$E$: $|q| = \dfrac{mg\tan\alpha}{E}$.
      - kind: substitution
        text: >-
          $mg = 3.2\cdot10^{-14}\,\text{N}$ ו-$\tan 45^\circ = 1$:
          $$|q| = \frac{3.2\cdot10^{-14}\cdot 1}{6.67\cdot10^{4}} = 4.8\cdot10^{-19}\ \text{C} = 3e$$
      - kind: reasoning
        text: >-
          (ג) המסה והשדה לא השתנו, ולכן $\tan\alpha$ יחסי למטען. שינוי פתאומי בכיוון אומר שהמטען של הטיפה השתנה: היא תפסה אלקטרונים או איבדה אותם, למשל מהאוויר.
      - kind: substitution
        text: >-
          $\tan 18.4^\circ = 0.333$, ולכן $|q'| = \dfrac{3.2\cdot10^{-14}\cdot 0.333}{6.67\cdot10^{4}} = 1.6\cdot10^{-19}\,\text{C}$.
          $\tan 33.7^\circ = 0.667$, ולכן $|q''| = \dfrac{3.2\cdot10^{-14}\cdot 0.667}{6.67\cdot10^{4}} = 3.2\cdot10^{-19}\,\text{C}$.
          שלושת המטענים נמצאים ביחס $3 : 1 : 2$, וכולם כפולות שלמות של $1.6\cdot10^{-19}\,\text{C}$.
      - kind: formula
        text: >-
          (ד) נסמן את קבוע ההתנגדות ב-$b$: גודל כוח ההתנגדות הוא $bv$. בלי שדה, בירידה במהירות קבועה: $mg = bv_1$.
          בעלייה במהירות קבועה ההתנגדות פונה למטה, יחד עם המשקל: $|q|E = mg + bv_2$.
      - kind: manipulation
        text: >-
          מהמשוואה הראשונה $b = mg/v_1$. מציבים בשנייה: $|q|E = mg + mg\dfrac{v_2}{v_1} = mg\left(1 + \dfrac{v_2}{v_1}\right)$, ומחלקים ב-$E$:
          $$|q| = \frac{mg}{E}\left(1 + \frac{v_2}{v_1}\right)$$
      - kind: substitution
        text: >-
          $$|q| = \frac{1.0\cdot10^{-13}}{1.25\cdot10^{5}}\left(1 + \frac{8.0\cdot10^{-5}}{4.0\cdot10^{-4}}\right) = 8.0\cdot10^{-19}\cdot 1.2 = 9.6\cdot10^{-19}\ \text{C}$$
          $n = \dfrac{9.6\cdot10^{-19}}{1.6\cdot10^{-19}} = 6$.
      - kind: result
        text: >-
          (א) ההתנגדות מאזנת את המשקל, והכוח השקול אפס.

          (ב) הטיפה נעה בכיוון הסכום של המשקל והכוח החשמלי. גודל המטען $4.8\cdot10^{-19}\,\text{C}$, כלומר $3e$.

          (ג) המטען השתנה ל-$e$ ואחר כך ל-$2e$. המטען היסודי $1.6\cdot10^{-19}\,\text{C}$.

          (ד) בטיפה 6 מטענים יסודיים.
    source:
      name: British Physics Olympiad (BPhO), Round 1
      year: 2012
      problem: 'Round 1, 16 November 2012, Section 2, Q4'
      url: https://www.bpho.org.uk/Papers/R1/2012Nov_R1_S2.pdf
      verified: '2026-11-02'
      adapted: true

  - id: W-1.10-c2
    stars: 2
    objectives: [OBJ-1.10-1, OBJ-1.10-2]
    prompt: >-
      באזור מסוים יש שדה חשמלי אחיד $E = \sqrt{3}\cdot10^{4}\,\text{N/C}$ (כ-$1.73\cdot10^{4}\,\text{N/C}$) שמצביע כלפי מטה.
      חלקיק טעון חיובי נורה מנקודה A שבתוך האזור, במהירות $1.0\cdot10^{6}\,\text{m/s}$. היחס בין המטען של החלקיק למסה שלו הוא $q/m = 10^{8}\,\text{C/kg}$.
      המטרה T נמצאת $0.5\,\text{m}$ מ-A, באותו גובה.

      (א) הראו שמותר להזניח את המשקל של החלקיק.

      (ב) באילו זוויות מעל האופק אפשר לירות את החלקיק כדי שיפגע ב-T?

      (ג) כמה זמן נמשכת התנועה מ-A עד T בכל אחת מהזוויות?

      (ד) מה המהירות הקטנה ביותר שבה אפשר עוד לפגוע ב-T, ובאיזו זווית יורים אז?
    answer: >-
      (ב) $30^\circ$ או $60^\circ$.

      (ג) $5.8\cdot10^{-7}\,\text{s}$ בזווית $30^\circ$, ו-$1.0\cdot10^{-6}\,\text{s}$ בזווית $60^\circ$.

      (ד) $9.3\cdot10^{5}\,\text{m/s}$, בזווית $45^\circ$.
    solution:
      - kind: substitution
        text: >-
          (א) התאוצה מהשדה: $a = \dfrac{q}{m}E = 10^{8}\cdot\sqrt{3}\cdot10^{4} = 1.73\cdot10^{12}\,\text{m/s}^2$, כלפי מטה, כי החלקיק חיובי.
          היא גדולה מ-$g = 10\,\text{m/s}^2$ בערך פי $1.7\cdot10^{11}$, ולכן המשקל זניח.
      - kind: reasoning
        text: >-
          (ב) התאוצה קבועה וכלפי מטה, בדיוק כמו בזריקה משופעת בשדה הכבידה, רק עם $a$ במקום $g$. אופקית: $x = v\cos\theta\,t$. אנכית: $y = v\sin\theta\,t - \tfrac12 at^2$.
      - kind: manipulation
        text: >-
          החלקיק חוזר לגובה של A כש-$y = 0$. מוציאים $t$ כגורם משותף: $t\left(v\sin\theta - \tfrac12 at\right) = 0$, ולכן (מלבד $t = 0$) $t = \dfrac{2v\sin\theta}{a}$.
          מציבים ב-$x$, ומשתמשים ב-$2\sin\theta\cos\theta = \sin 2\theta$:
          $$R = v\cos\theta\cdot\frac{2v\sin\theta}{a} = \frac{v^2\sin 2\theta}{a}$$
      - kind: substitution
        text: >-
          כדי לפגוע ב-T צריך $R = 0.5\,\text{m}$. כופלים ב-$a$ ומחלקים ב-$v^2$:
          $$\sin 2\theta = \frac{aR}{v^2} = \frac{1.73\cdot10^{12}\cdot 0.5}{\left(1.0\cdot10^{6}\right)^2} = 0.866$$
          יש שתי זוויות שה-$\sin$ שלהן $0.866$: $2\theta = 60^\circ$ או $2\theta = 120^\circ$. לכן $\theta = 30^\circ$ או $\theta = 60^\circ$.
      - kind: substitution
        text: >-
          (ג) $t = \dfrac{2v\sin\theta}{a}$.
          $$\theta = 30^\circ:\quad t = \frac{2\cdot 1.0\cdot10^{6}\cdot 0.5}{1.73\cdot10^{12}} = 5.8\cdot10^{-7}\ \text{s}
          \qquad
          \theta = 60^\circ:\quad t = \frac{2\cdot 1.0\cdot10^{6}\cdot 0.866}{1.73\cdot10^{12}} = 1.0\cdot10^{-6}\ \text{s}$$
      - kind: reasoning
        text: >-
          (ד) $\sin 2\theta$ לא יכול לעלות על 1. לכן אפשר לפגוע ב-T רק אם $\dfrac{aR}{v^2} \le 1$, כלומר $v^2 \ge aR$.
          המהירות הקטנה ביותר מתקבלת כש-$\sin 2\theta = 1$, כלומר $\theta = 45^\circ$:
          $v_{\min} = \sqrt{aR} = \sqrt{1.73\cdot10^{12}\cdot 0.5} = 9.3\cdot10^{5}\,\text{m/s}$.
      - kind: result
        text: >-
          (ב) אפשר לפגוע ב-T בזווית $30^\circ$ או $60^\circ$ מעל האופק.

          (ג) בזווית $30^\circ$ התנועה נמשכת $5.8\cdot10^{-7}\,\text{s}$, ובזווית $60^\circ$ היא נמשכת $1.0\cdot10^{-6}\,\text{s}$: המסלול הגבוה איטי יותר.

          (ד) במהירות קטנה מ-$9.3\cdot10^{5}\,\text{m/s}$ אי אפשר לפגוע ב-T. במהירות הזו יורים בזווית $45^\circ$.
