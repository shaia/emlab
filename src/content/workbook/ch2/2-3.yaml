# Workbook for lesson 2.3: ten practice problems and two sourced challenge problems.
# Every number recomputed with src/physics/potential.ts (uniformPotential, fieldWork, toEV),
# src/physics/electrostatics.ts (fieldAt, potentialAt) and constants.ts.

lesson: '2.3'
practice:
  - id: W-2.3-01
    level: basic
    qualitative: false
    objectives: [OBJ-2.3-2, OBJ-2.3-1]
    prompt: >-
      באזור מסוים יש שדה אחיד של $1500\,\text{V/m}$, שמצביע ימינה. משרטטים בו קווים שווי פוטנציאל בצעדים של $30\,\text{V}$.

      (א) איך מונחים הקווים?

      (ב) מה המרחק בין שני קווים שכנים?

      (ג) הנקודות K ו-L נמצאות על אותו קו שדה, ו-L נמצאת $5\,\text{cm}$ מימין ל-K. מה המתח בין שתי הנקודות, ובאיזו מהן הפוטנציאל גבוה יותר?
    answer: >-
      (א) אנכיים, ניצבים לשדה.

      (ב) $2\,\text{cm}$

      (ג) $75\,\text{V}$, והפוטנציאל ב-K גבוה יותר.
    solution:
      - kind: given
        text: >-
          $E = 1500\,\text{V/m}$, ימינה. הצעד בין קווים שכנים $\Delta V = 30\,\text{V}$. המרחק בין K ל-L, לאורך השדה, $0.05\,\text{m}$.
      - kind: reasoning
        text: >-
          (א) קווים שווי פוטנציאל ניצבים לשדה. השדה אופקי, ולכן הקווים אנכיים: קווים ישרים במרווחים שווים, כי השדה אחיד.
      - kind: formula
        text: >-
          $E = \dfrac{\Delta V}{d}$, כאשר $d$ הוא המרחק בכיוון השדה. כדי לבודד את $d$ מכפילים את שני האגפים ב-$d$ ומחלקים ב-$E$: $d = \dfrac{\Delta V}{E}$.
      - kind: substitution
        text: >-
          (ב) $d = \dfrac{30\,\text{V}}{1500\,\text{V/m}} = 0.02\,\text{m} = 2\,\text{cm}$.
      - kind: substitution
        text: >-
          (ג) $V_K - V_L = E\,d = 1500 \cdot 0.05 = 75\,\text{V}$. השדה מצביע מ-K אל L, והפוטנציאל יורד בכיוון השדה, ולכן הפוטנציאל ב-K גבוה יותר.
      - kind: result
        text: >-
          (א) אנכיים. (ב) $2\,\text{cm}$. (ג) $75\,\text{V}$, והפוטנציאל ב-K גבוה יותר. בין K ל-L עוברים שני מרווחים וחצי בין קווים, $5/2 = 2.5$, ואכן $2.5 \cdot 30 = 75$.

  - id: W-2.3-02
    level: basic
    qualitative: true
    objectives: [OBJ-2.3-1]
    prompt: >-
      מטען נקודתי שלילי נמצא לבדו במרחב.

      (א) מה הצורה של המשטחים שווי הפוטנציאל סביבו?

      (ב) לאיזה משטח פוטנציאל גבוה יותר: למשטח שנמצא $10\,\text{cm}$ מהמטען, או למשטח שנמצא $20\,\text{cm}$ ממנו?

      (ג) מה כיוון השדה בנקודה שעל המשטח הקרוב, ביחס למשטח וביחס למטען?

      (ד) מעבירים פרוטון לאט חצי סיבוב סביב המטען, לאורך המשטח הקרוב. כמה עבודה עושה עליו השדה?
    answer: >-
      (א) כדורים שמרכזם במטען.

      (ב) למשטח הרחוק, של $20\,\text{cm}$.

      (ג) ניצב למשטח, ומצביע אל המטען.

      (ד) אפס.
    solution:
      - kind: reasoning
        text: >-
          (א) הפוטנציאל של מטען נקודתי תלוי רק במרחק ממנו, $V = kQ/r$. כל הנקודות שנמצאות באותו מרחק מהמטען נמצאות באותו פוטנציאל, והן יוצרות כדור שמרכזו במטען. באיור רואים את החתך שלו, מעגל.
      - kind: reasoning
        text: >-
          (ב) המטען שלילי, ולכן הפוטנציאל שלילי בכל מקום. נסמן ב-$|Q|$ את גודל המטען: $V_{10} = -k|Q|/0.1$ ו-$V_{20} = -k|Q|/0.2$. הערך המוחלט של $V_{20}$ קטן פי 2, כלומר $V_{20}$ קרוב יותר לאפס, ולכן הוא הגבוה מבין השניים. סביב מטען שלילי הפוטנציאל עולה ככל שמתרחקים.
      - kind: reasoning
        text: >-
          (ג) השדה ניצב למשטח שווה פוטנציאל, ומצביע לכיוון שבו הפוטנציאל יורד. הפוטנציאל יורד כשמתקרבים למטען, ולכן השדה מצביע פנימה, אל המטען. זה מתאים לשיעור 1.5: השדה של מטען שלילי מצביע אליו.
      - kind: formula
        text: >-
          (ד) $W = q(V_A - V_B)$, הפוטנציאל בהתחלה פחות הפוטנציאל בסוף.
      - kind: reasoning
        text: >-
          ההתחלה והסוף נמצאות על אותו משטח, ולכן $V_A - V_B = 0$ והעבודה אפס. גם בכל צעד בדרך השדה ניצב לתזוזה, ולכן לא עושה עבודה.
      - kind: result
        text: >-
          (א) כדורים שמרכזם במטען. (ב) הפוטנציאל של המשטח הרחוק גבוה יותר. (ג) ניצב למשטח, אל המטען. (ד) העבודה אפס.

  - id: W-2.3-03
    level: basic
    qualitative: false
    objectives: [OBJ-2.3-1]
    prompt: >-
      שלושה משטחים שווי פוטנציאל: של $100\,\text{V}$, של $200\,\text{V}$ ושל $300\,\text{V}$. פרוטון עובר במסלול בן שלושה קטעים: מהנקודה A שעל המשטח של $100\,\text{V}$ אל הנקודה B שעל המשטח של $300\,\text{V}$; מ-B, לאורך המשטח של $300\,\text{V}$, מסלול של $40\,\text{cm}$ אל הנקודה C; ומ-C אל הנקודה D שעל המשטח של $200\,\text{V}$.

      (א) כמה עבודה עושה השדה על הפרוטון בכל קטע? ענו באלקטרון-וולט.

      (ב) מה העבודה במסלול כולו, באלקטרון-וולט ובג׳אול? בדקו את התשובה בדרך קצרה יותר.
    answer: >-
      (א) מ-A ל-B $W_1 = -200\,\text{eV}$, מ-B ל-C $W_2 = 0$, ומ-C ל-D $W_3 = 100\,\text{eV}$.

      (ב) $W = -100\,\text{eV} = -1.6\cdot10^{-17}\,\text{J}$
    solution:
      - kind: given
        text: >-
          מטען הפרוטון $q = e$. $V_A = 100\,\text{V}$, $V_B = V_C = 300\,\text{V}$, $V_D = 200\,\text{V}$.
      - kind: formula
        text: >-
          לכל קטע $W = q(V_1 - V_2)$, כאשר $V_1$ הוא הפוטנציאל בתחילת הקטע ו-$V_2$ הפוטנציאל בסופו. כשהמטען $e$, מספר הוולטים בהפרש הוא מספר האלקטרון-וולטים.
      - kind: substitution
        text: >-
          (א) מ-A ל-B: $W_1 = e\,(100 - 300)\,\text{V} = -200\,\text{eV}$. מ-B ל-C: $W_2 = e\,(300 - 300)\,\text{V} = 0$, בלי קשר לאורך המסלול. מ-C ל-D: $W_3 = e\,(300 - 200)\,\text{V} = 100\,\text{eV}$.
      - kind: substitution
        text: >-
          (ב) $W = -200 + 0 + 100 = -100\,\text{eV}$, כלומר $W = -100 \cdot 1.6\cdot10^{-19} = -1.6\cdot10^{-17}\,\text{J}$. בדיקה: ישר מ-A ל-D, $W = e\,(100 - 200)\,\text{V} = -100\,\text{eV}$. העבודה תלויה רק בפוטנציאל של ההתחלה ושל הסוף.
      - kind: result
        text: >-
          (א) $W_1 = -200\,\text{eV}$, $W_2 = 0$, $W_3 = 100\,\text{eV}$. (ב) $W = -100\,\text{eV} = -1.6\cdot10^{-17}\,\text{J}$. העבודה שלילית, כי הפרוטון הגיע לפוטנציאל גבוה יותר מזה שיצא ממנו.

  - id: W-2.3-04
    level: mid
    qualitative: false
    objectives: [OBJ-2.3-2, OBJ-2.3-3]
    prompt: >-
      לאורך ציר x יש שדה אחיד של $800\,\text{V/m}$, שמצביע **שמאלה**, לכיוון השלילי של הציר. הפוטנציאל בראשית $100\,\text{V}$.

      (א) מה הפוטנציאל בנקודה $x = 0.25\,\text{m}$?

      (ב) מה הפוטנציאל בנקודה $x = -0.1\,\text{m}$?

      (ג) באיזו נקודה על הציר הפוטנציאל אפס? מה עוצמת השדה שם?
    answer: >-
      (א) $300\,\text{V}$

      (ב) $20\,\text{V}$

      (ג) בנקודה $x = -0.125\,\text{m}$. השדה שם $800\,\text{V/m}$, כמו בכל מקום.
    solution:
      - kind: given
        text: >-
          $E = 800\,\text{V/m}$, שמאלה. $V(0) = 100\,\text{V}$.
      - kind: reasoning
        text: >-
          השדה מצביע לכיוון שבו הפוטנציאל יורד. הוא מצביע שמאלה, ולכן הפוטנציאל יורד שמאלה ועולה ימינה. השדה אחיד, ולכן בכל מטר ימינה הפוטנציאל עולה ב-$800\,\text{V}$.
      - kind: formula
        text: >-
          מ-$E = V/d$, אחרי הכפלה ב-$d$: השינוי בפוטנציאל לאורך מרחק $d$ בכיוון השדה הוא $\Delta V = E\,d$.
      - kind: substitution
        text: >-
          (א) הנקודה נמצאת $0.25\,\text{m}$ מימין לראשית, ושם הפוטנציאל גבוה יותר: $V = 100 + 800 \cdot 0.25 = 300\,\text{V}$.
      - kind: substitution
        text: >-
          (ב) הנקודה נמצאת $0.1\,\text{m}$ משמאל לראשית, ושם הפוטנציאל נמוך יותר: $V = 100 - 800 \cdot 0.1 = 20\,\text{V}$.
      - kind: manipulation
        text: >-
          (ג) הפוטנציאל צריך לרדת ב-$100\,\text{V}$ מהערך שבראשית, ולכן הנקודה משמאל לראשית. כדי למצוא את המרחק מחלקים את הירידה בעוצמת השדה: $d = \dfrac{100\,\text{V}}{800\,\text{V/m}} = 0.125\,\text{m}$, כלומר $x = -0.125\,\text{m}$.
      - kind: reasoning
        text: >-
          השדה אחיד, ולכן גם בנקודה שבה $V = 0$ עוצמתו $800\,\text{V/m}$. הוא נקבע לפי השיפוע של הפוטנציאל, ולא לפי הערך שלו.
      - kind: result
        text: >-
          (א) $300\,\text{V}$. (ב) $20\,\text{V}$. (ג) בנקודה $x = -0.125\,\text{m}$, והשדה שם $800\,\text{V/m}$, שמאלה: פוטנציאל אפס, ושדה לא אפס.

  - id: W-2.3-05
    level: mid
    qualitative: true
    objectives: [OBJ-2.3-3, OBJ-2.3-1]
    prompt: >-
      מטען $+Q$ נמצא בנקודה $(-a, 0)$, ומטען שלילי באותו גודל נמצא בנקודה $(a, 0)$: זה דיפול. ציר y עובר באמצע בין המטענים, בניצב לקו שמחבר אותם.

      (א) מה הפוטנציאל בכל נקודה על ציר y? נמקו.

      (ב) מה כיוון השדה בנקודות שעל ציר y? נמקו בעזרת התשובה ל-(א), בלי לחבר וקטורים.

      (ג) מעבירים אלקטרון לאט לאורך ציר y, מנקודה רחוקה מאוד ועד הראשית. כמה עבודה עושה עליו השדה?

      (ד) תלמיד מסיק מ-(ג) שעל ציר y השדה אפס. קבעו אם הוא צודק, ונמקו.
    answer: >-
      (א) אפס בכל נקודה.

      (ב) ניצב לציר y, כלומר מקביל לציר x, לכיוון המטען השלילי.

      (ג) אפס.

      (ד) לא. עבודה אפס אומרת שהשדה ניצב לתזוזה, לא שהוא אפס.
    solution:
      - kind: reasoning
        text: >-
          (א) כל נקודה על ציר y נמצאת באותו מרחק $r$ משני המטענים. התרומות שלהם לפוטנציאל שוות בגודלן והפוכות בסימן: $V = \dfrac{kQ}{r} + \dfrac{k(-Q)}{r} = 0$. לכן ציר y הוא קו שווה פוטנציאל, של $V = 0$.
      - kind: reasoning
        text: >-
          (ב) השדה ניצב לקו שווה פוטנציאל, ולכן ניצב לציר y, כלומר מקביל לציר x. לאיזה צד? ליד $+Q$ הפוטנציאל חיובי, וליד המטען השלילי הוא שלילי. השדה מצביע לכיוון שבו הפוטנציאל יורד: ימינה, אל המטען השלילי.
      - kind: formula
        text: >-
          (ג) $W = q(V_A - V_B)$.
      - kind: reasoning
        text: >-
          כל המסלול, כולל ההתחלה הרחוקה והראשית, נמצא על ציר y, שבו $V = 0$. לכן $W = (-e)(0 - 0) = 0$.
      - kind: reasoning
        text: >-
          (ד) התלמיד לא צודק. השדה ניצב למסלול בכל נקודה, ולכן לא עושה עבודה, אבל הוא לא אפס. בראשית, למשל, השדה של $+Q$ מצביע ימינה, הרחק ממנו, וגם השדה של המטען השלילי מצביע ימינה, אליו. השדות מתחברים. לכן על האלקטרון פועל לאורך כל הדרך כוח שמאלה, והיד שמזיזה אותו צריכה להחזיק אותו נגד הכוח הזה.
      - kind: result
        text: >-
          (א) $V = 0$ בכל ציר y. (ב) מקביל לציר x, לכיוון המטען השלילי. (ג) העבודה אפס. (ד) לא נכון: על ציר y הפוטנציאל אפס והעבודה אפס, אבל השדה לא אפס.

  - id: W-2.3-06
    level: mid
    qualitative: false
    objectives: [OBJ-2.3-2, OBJ-2.3-1]
    prompt: >-
      במפה של קווים שווי פוטנציאל הקווים משורטטים בצעדים של $20\,\text{V}$. הנקודה A נמצאת בין שני קווים שכנים שהמרחק ביניהם $4\,\text{mm}$, והנקודה B נמצאת בין שני קווים שכנים שהמרחק ביניהם $1.6\,\text{cm}$.

      (א) העריכו את עוצמת השדה ליד A וליד B. פי כמה השדה ליד A חזק יותר?

      (ב) פרוטון עובר מהקו של $120\,\text{V}$ אל הקו של $60\,\text{V}$. כמה עבודה עושה עליו השדה? האם התשובה תלויה בשאלה אם עבר ליד A או ליד B?
    answer: >-
      (א) ליד A כ-$5000\,\text{V/m}$, ליד B כ-$1250\,\text{V/m}$: פי 4.

      (ב) $W = 60\,\text{eV} = 9.6\cdot10^{-18}\,\text{J}$, בלי קשר לדרך.
    solution:
      - kind: given
        text: >-
          $\Delta V = 20\,\text{V}$ בין קווים שכנים. ליד A $d_A = 4\,\text{mm} = 4\cdot10^{-3}\,\text{m}$, וליד B $d_B = 1.6\,\text{cm} = 1.6\cdot10^{-2}\,\text{m}$.
      - kind: reasoning
        text: >-
          בין שני קווים קרובים השדה כמעט לא משתנה, ולכן אפשר להעריך אותו כמו בשדה אחיד. השדה ניצב לקווים, ולכן המרחק בין הקווים, שנמדד בניצב להם, הוא המרחק בכיוון השדה.
      - kind: formula
        text: >-
          $E \approx \dfrac{\Delta V}{d}$
      - kind: substitution
        text: >-
          (א) $E_A \approx \dfrac{20}{4\cdot10^{-3}} = 5000\,\text{V/m}$ ו-$E_B \approx \dfrac{20}{1.6\cdot10^{-2}} = 1250\,\text{V/m}$. היחס $5000/1250 = 4$, בדיוק היחס בין המרווחים, $16\,\text{mm}$ לעומת $4\,\text{mm}$.
      - kind: substitution
        text: >-
          (ב) $W = q(V_A - V_B) = e\,(120 - 60)\,\text{V} = 60\,\text{eV}$, כלומר $60 \cdot 1.6\cdot10^{-19} = 9.6\cdot10^{-18}\,\text{J}$. העבודה תלויה רק בפוטנציאל של ההתחלה ושל הסוף, ולכן לא משנה איפה הפרוטון עבר.
      - kind: result
        text: >-
          (א) $E_A \approx 5000\,\text{V/m}$ ו-$E_B \approx 1250\,\text{V/m}$: ליד A השדה חזק פי 4. (ב) $W = 60\,\text{eV} = 9.6\cdot10^{-18}\,\text{J}$, ליד A או ליד B.

  - id: W-2.3-07
    level: mid
    qualitative: true
    objectives: [OBJ-2.3-1, OBJ-2.3-2]
    prompt: >-
      בשדה אחיד משורטטים שלושה קווים שווי פוטנציאל אנכיים: משמאל קו של $300\,\text{V}$, באמצע קו של $200\,\text{V}$, ומימין קו של $100\,\text{V}$. בנקודה P שעל הקו האמצעי משחררים ממנוחה פרוטון, ובפעם אחרת, באותה נקודה, אלקטרון.

      (א) מה כיוון השדה ב-P?

      (ב) לאיזה כיוון יתחיל לנוע כל אחד מהחלקיקים, ואל איזה קו?

      (ג) לכל אחד מהחלקיקים: האם האנרגיה הפוטנציאלית החשמלית שלו גדלה או קטנה כשהוא מתחיל לנוע? האם השדה עושה עליו עבודה חיובית או שלילית?

      (ד) האם אפשר לזרוק את הפרוטון מ-P בכיוון כזה שבתחילת התנועה השדה לא עושה עליו עבודה?
    answer: >-
      (א) ימינה.

      (ב) הפרוטון ימינה, אל הקו של $100\,\text{V}$. האלקטרון שמאלה, אל הקו של $300\,\text{V}$.

      (ג) אצל שניהם האנרגיה הפוטנציאלית קטנה, והשדה עושה עבודה חיובית.

      (ד) כן: למעלה או למטה, לאורך הקו של $200\,\text{V}$.
    solution:
      - kind: reasoning
        text: >-
          (א) השדה ניצב לקווים, ולכן אופקי. הוא מצביע לכיוון שבו הפוטנציאל יורד, כלומר ימינה, מ-$300\,\text{V}$ אל $100\,\text{V}$.
      - kind: reasoning
        text: >-
          (ב) על הפרוטון, שמטענו חיובי, הכוח בכיוון השדה: ימינה, אל הקו של $100\,\text{V}$. על האלקטרון הכוח הפוך לשדה: שמאלה, אל הקו של $300\,\text{V}$. כל אחד מהם יוצא ממנוחה, ולכן מתחיל לנוע בכיוון הכוח עליו.
      - kind: formula
        text: >-
          (ג) האנרגיה הפוטנציאלית החשמלית $U = qV$ (שיעור 2.2), ועבודת השדה $W = q(V_A - V_B)$.
      - kind: reasoning
        text: >-
          הפרוטון: $q > 0$ ו-$V$ יורד, ולכן $U$ קטנה. האלקטרון: $q < 0$ ו-$V$ עולה. למשל ב-$200\,\text{V}$ האנרגיה שלו $U = -200\,\text{eV}$, וב-$300\,\text{V}$ היא $U = -300\,\text{eV}$, נמוכה יותר. אצל שניהם $U$ קטנה, והשדה עושה עבודה חיובית. אם יגיעו לקווים, עבור הפרוטון $W = e\,(200 - 100)\,\text{V} = 100\,\text{eV}$, ועבור האלקטרון $W = (-e)(200 - 300)\,\text{V} = 100\,\text{eV}$.
      - kind: reasoning
        text: >-
          (ד) כן. אם זורקים את הפרוטון למעלה או למטה, לאורך הקו של $200\,\text{V}$, המהירות שלו ניצבת לכוח, והשדה לא עושה עליו עבודה בתחילת התנועה. מיד אחר כך הכוח מעקם את המסלול ימינה, והפרוטון עוזב את הקו.
      - kind: result
        text: >-
          (א) ימינה. (ב) הפרוטון ימינה, האלקטרון שמאלה. (ג) אצל שניהם $U$ קטנה והעבודה חיובית: מטען חיובי "נופל" לפוטנציאל נמוך, ומטען שלילי לפוטנציאל גבוה. (ד) כן, לאורך הקו שווה הפוטנציאל.

  - id: W-2.3-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-2.3-1, OBJ-2.3-2]
    prompt: >-
      מטען נקודתי $Q = 1\,\text{nC}$ נמצא לבדו. משרטטים סביבו ארבעה משטחים שווי פוטנציאל, בצעדים שווים של $15\,\text{V}$: של $90$, $75$, $60$ ו-$45\,\text{V}$.

      (א) חשבו את הרדיוס של כל משטח.

      (ב) חשבו את המרווחים בין משטחים שכנים. מה המרווחים ההולכים וגדלים אומרים על השדה?

      (ג) העריכו את עוצמת השדה בין המשטח של $90\,\text{V}$ למשטח של $75\,\text{V}$ בעזרת $\Delta V/\Delta r$, והשוו לעוצמה המדויקת $kQ/r^2$ באמצע ביניהם, ב-$r = 11\,\text{cm}$.

      (ד) עשו את אותה השוואה בין המשטח של $60\,\text{V}$ למשטח של $45\,\text{V}$. באיזה זוג ההערכה טובה יותר, ולמה?
    answer: >-
      (א) $10$, $12$, $15$ ו-$20\,\text{cm}$.

      (ב) $2$, $3$ ו-$5\,\text{cm}$: השדה נחלש ככל שמתרחקים מהמטען.

      (ג) כ-$750\,\text{V/m}$, לעומת $744\,\text{V/m}$ מדויק.

      (ד) $300\,\text{V/m}$ לעומת $294\,\text{V/m}$. ההערכה טובה יותר בזוג הראשון, שבו המרווח קטן יותר ביחס למרחק מהמטען.
    solution:
      - kind: given
        text: >-
          $Q = 1\cdot10^{-9}\,\text{C}$, ולכן $kQ = 9\cdot10^{9} \cdot 1\cdot10^{-9} = 9\,\text{V}\cdot\text{m}$.
      - kind: formula
        text: >-
          $V = \dfrac{kQ}{r}$. כדי לבודד את $r$ מכפילים את שני האגפים ב-$r$ ומחלקים ב-$V$: $r = \dfrac{kQ}{V}$.
      - kind: substitution
        text: >-
          (א) $r_{90} = 9/90 = 0.1\,\text{m}$, $r_{75} = 9/75 = 0.12\,\text{m}$, $r_{60} = 9/60 = 0.15\,\text{m}$, $r_{45} = 9/45 = 0.2\,\text{m}$.
      - kind: reasoning
        text: >-
          (ב) המרווחים הם $2$, $3$ ו-$5\,\text{cm}$. אותו הפרש של $15\,\text{V}$ מתפרש על מרחק הולך וגדל, כלומר השיפוע של $V$ קטן, והשדה נחלש ככל שמתרחקים. זה מתאים ל-$E = kQ/r^2$.
      - kind: substitution
        text: >-
          (ג) הערכה: $E \approx \dfrac{15\,\text{V}}{0.02\,\text{m}} = 750\,\text{V/m}$. מדויק: $E = \dfrac{9}{0.11^2} = 743.8 \approx 744\,\text{V/m}$. ההערכה גדולה בכ-$0.8\%$.
      - kind: substitution
        text: >-
          (ד) הערכה: $E \approx \dfrac{15\,\text{V}}{0.05\,\text{m}} = 300\,\text{V/m}$. מדויק: $E = \dfrac{9}{0.175^2} = 293.9 \approx 294\,\text{V/m}$. ההערכה גדולה בכ-$2\%$.
      - kind: reasoning
        text: >-
          $\Delta V/\Delta r$ נותן את השדה הממוצע על פני המרווח, והשדה משתנה לאורכו. בזוג הראשון המרווח הוא $2\,\text{cm}$ מתוך מרחק של $11\,\text{cm}$, ובשני $5\,\text{cm}$ מתוך $17.5\,\text{cm}$: יחסית למרחק, המרווח השני גדול יותר, והשדה משתנה לאורכו יותר.
      - kind: result
        text: >-
          (א) $10$, $12$, $15$, $20\,\text{cm}$. (ב) המרווחים גדלים, כי השדה נחלש. (ג) $750\,\text{V/m}$ לעומת $744\,\text{V/m}$. (ד) $300\,\text{V/m}$ לעומת $294\,\text{V/m}$: ההערכה טובה יותר היכן שהמרווח קטן ביחס למרחק.

  - id: W-2.3-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-2.3-1, OBJ-2.3-2, OBJ-2.3-3]
    prompt: >-
      באזור שבו השדה אחיד מודדים את הפוטנציאל בשלוש נקודות במישור. בנקודה A הפוטנציאל $150\,\text{V}$. בנקודה B, שנמצאת $4\,\text{cm}$ ימינה מ-A, הפוטנציאל גם הוא $150\,\text{V}$. בנקודה C, שנמצאת $3\,\text{cm}$ למעלה מ-A, הפוטנציאל $60\,\text{V}$.

      (א) מה כיוון השדה? נמקו.

      (ב) מה עוצמת השדה?

      (ג) מה הפוטנציאל בנקודה D, שנמצאת $4\,\text{cm}$ ימינה ו-$3\,\text{cm}$ למעלה מ-A?

      (ד) באיזו נקודה על הקו שעובר דרך A ו-C הפוטנציאל אפס? האם השדה שם אפס?

      (ה) אלקטרון עובר מ-A ל-D. כמה עבודה עושה עליו השדה, באלקטרון-וולט ובג׳אול?
    answer: >-
      (א) למעלה.

      (ב) $3000\,\text{V/m}$

      (ג) $60\,\text{V}$

      (ד) $5\,\text{cm}$ מעל A. השדה שם $3000\,\text{V/m}$, לא אפס.

      (ה) $W = -90\,\text{eV} = -1.44\cdot10^{-17}\,\text{J}$
    solution:
      - kind: given
        text: >-
          $V_A = V_B = 150\,\text{V}$, ו-B נמצאת $0.04\,\text{m}$ ימינה מ-A. $V_C = 60\,\text{V}$, ו-C נמצאת $0.03\,\text{m}$ למעלה מ-A.
      - kind: reasoning
        text: >-
          (א) ל-A ול-B אותו פוטנציאל, ולכן הן על אותו קו שווה פוטנציאל. בשדה אחיד הקווים שווי הפוטנציאל ישרים, ולכן הקו האופקי שעובר דרך A ו-B הוא קו שווה פוטנציאל. השדה ניצב לו, כלומר אנכי. מ-A למעלה אל C הפוטנציאל יורד, מ-$150\,\text{V}$ ל-$60\,\text{V}$, והשדה מצביע לכיוון שבו הפוטנציאל יורד: למעלה.
      - kind: formula
        text: >-
          $E = \dfrac{\Delta V}{d}$, כאשר $d$ הוא המרחק בכיוון השדה. הקטע AC אנכי, כלומר בכיוון השדה.
      - kind: substitution
        text: >-
          (ב) $E = \dfrac{150 - 60}{0.03} = 3000\,\text{V/m}$.
      - kind: reasoning
        text: >-
          (ג) D נמצאת באותו גובה כמו C, כלומר על אותו קו אופקי, שהוא קו שווה פוטנציאל. לכן $V_D = V_C = 60\,\text{V}$. בדיקה מ-B: D נמצאת $0.03\,\text{m}$ מעל B, והפוטנציאל יורד ב-$3000 \cdot 0.03 = 90\,\text{V}$, מ-$150$ ל-$60\,\text{V}$.
      - kind: manipulation
        text: >-
          (ד) מ-A הפוטנציאל צריך לרדת ב-$150\,\text{V}$, ולכן הנקודה מעל A. כדי למצוא את המרחק מחלקים את הירידה בעוצמת השדה: $d = \dfrac{150\,\text{V}}{3000\,\text{V/m}} = 0.05\,\text{m}$. השדה אחיד, ולכן גם שם הוא $3000\,\text{V/m}$, למעלה.
      - kind: substitution
        text: >-
          (ה) $W = q(V_A - V_D) = (-e)(150 - 60)\,\text{V} = -90\,\text{eV}$, כלומר $W = -90 \cdot 1.6\cdot10^{-19} = -1.44\cdot10^{-17}\,\text{J}$. העבודה שלילית: על האלקטרון הכוח מצביע למטה, הפוך לשדה, והוא עלה $3\,\text{cm}$. התזוזה ימינה, לאורך קו שווה פוטנציאל, לא תורמת לעבודה.
      - kind: result
        text: >-
          (א) למעלה. (ב) $3000\,\text{V/m}$. (ג) $60\,\text{V}$. (ד) $5\,\text{cm}$ מעל A, ושם השדה $3000\,\text{V/m}$: פוטנציאל אפס, ושדה לא אפס. (ה) $W = -90\,\text{eV} = -1.44\cdot10^{-17}\,\text{J}$.

  - id: W-2.3-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-2.3-2, OBJ-2.3-3]
    prompt: >-
      שני מטענים שווים, $2\,\text{nC}$ כל אחד, נמצאים על ציר x בנקודות $x = -0.1\,\text{m}$ ו-$x = 0.1\,\text{m}$. מודדים את הפוטנציאל בארבע נקודות על הציר, בין המטענים: ב-$x = 0$ הוא $360\,\text{V}$, ב-$x = 0.02\,\text{m}$ הוא $375\,\text{V}$, ב-$x = 0.04\,\text{m}$ הוא $428.6\,\text{V}$, וב-$x = 0.06\,\text{m}$ הוא $562.5\,\text{V}$.

      (א) העריכו את השדה (עוצמה וכיוון) בכל אחד משלושת המרווחים שבין הנקודות, בעזרת $\Delta V/\Delta x$.

      (ב) היכן על הקטע שבין המטענים השדה אפס? מה הפוטנציאל שם? הסבירו בעזרת הגרף של $V(x)$ למה הפוטנציאל שם לא אפס.

      (ג) חשבו את השדה המדויק בנקודה $x = 0.05\,\text{m}$, באמצע המרווח השלישי, והשוו להערכה. מה ההערכה מודדת, ולמה היא גדולה מהערך המדויק?
    answer: >-
      (א) כ-$750\,\text{V/m}$, כ-$2.7\cdot10^{3}\,\text{V/m}$ וכ-$6.7\cdot10^{3}\,\text{V/m}$, כולם שמאלה, לכיוון הראשית.

      (ב) בראשית. הפוטנציאל שם $360\,\text{V}$.

      (ג) $6.4\cdot10^{3}\,\text{V/m}$, שמאלה: כ-$5\%$ פחות מההערכה.
    solution:
      - kind: given
        text: >-
          $Q = 2\cdot10^{-9}\,\text{C}$ בכל מטען, ולכן $kQ = 9\cdot10^{9} \cdot 2\cdot10^{-9} = 18\,\text{V}\cdot\text{m}$. המרווח בין נקודות המדידה $\Delta x = 0.02\,\text{m}$.
      - kind: formula
        text: >-
          $E_x = -\dfrac{\Delta V}{\Delta x}$. על הציר השדה מצביע לאורך הציר, ולכן הרכיב הזה הוא כל השדה.
      - kind: substitution
        text: >-
          (א) $\dfrac{375 - 360}{0.02} = 750\,\text{V/m}$, $\dfrac{428.6 - 375}{0.02} = 2679 \approx 2.7\cdot10^{3}\,\text{V/m}$, $\dfrac{562.5 - 428.6}{0.02} = 6696 \approx 6.7\cdot10^{3}\,\text{V/m}$.
      - kind: reasoning
        text: >-
          הפוטנציאל עולה ימינה, ולכן $E_x$ שלילי: השדה מצביע שמאלה, לכיוון הראשית. זה מתאים לכך שהנקודות קרובות יותר למטען הימני, והשדה שלו דוחף מטען בוחן חיובי שמאלה.
      - kind: reasoning
        text: >-
          (ב) בראשית שני המטענים במרחק $0.1\,\text{m}$, והשדות שלהם שווים ומנוגדים, ולכן השדה אפס. הפוטנציאל שם $V = 2 \cdot \dfrac{18}{0.1} = 360\,\text{V}$, כמו בנתונים. לאורך הקטע הגרף של $V(x)$ הוא עמק: הוא עולה לכיוון כל מטען. בתחתית העמק השיפוע אפס, ולכן השדה אפס, אבל הגובה, הפוטנציאל, הוא $360\,\text{V}$.
      - kind: substitution
        text: >-
          (ג) המטען הימני במרחק $0.05\,\text{m}$ ודוחף שמאלה, והשמאלי במרחק $0.15\,\text{m}$ ודוחף ימינה: $E = \dfrac{18}{0.05^2} - \dfrac{18}{0.15^2} = 18 \cdot (400 - 44.4) = 6.4\cdot10^{3}\,\text{V/m}$, שמאלה.
      - kind: reasoning
        text: >-
          $\Delta V/\Delta x$ הוא השדה הממוצע על פני המרווח. במרווח השלישי השדה משתנה הרבה: בערך $4.1\cdot10^{3}\,\text{V/m}$ בנקודה $x = 0.04\,\text{m}$, ובערך $1.05\cdot10^{4}\,\text{V/m}$ בנקודה $x = 0.06\,\text{m}$. הוא גדל מהר יותר ויותר ככל שמתקרבים למטען, ולכן בחצי הימני של המרווח הוא גדל יותר ממה שהוא קטן בחצי השמאלי, והממוצע גדול מהערך שבאמצע.
      - kind: result
        text: >-
          (א) $750$, $2.7\cdot10^{3}$ ו-$6.7\cdot10^{3}\,\text{V/m}$, שמאלה. (ב) בראשית, והפוטנציאל שם $360\,\text{V}$: שדה אפס, ופוטנציאל לא אפס. (ג) $6.4\cdot10^{3}\,\text{V/m}$, שמאלה. ההערכה, השדה הממוצע במרווח, גדולה בכ-$5\%$.

challenge:
  - id: W-2.3-c1
    stars: 1
    objectives: [OBJ-2.3-3]
    prompt: >-
      מטען $+4Q$ נמצא בנקודה A, ומטען שלילי שגודלו $Q$ נמצא בנקודה B, במרחק $a$ מימין ל-A.

      (א) מצאו את הנקודה על הקו שעובר דרך A ו-B שבה השדה אפס. נמקו למה אין נקודה כזאת בשאר האזורים של הקו.

      (ב) מה הפוטנציאל בנקודה שמצאתם? בטאו אותו בעזרת $k$, $Q$ ו-$a$.

      (ג) מצאו את הנקודה שבין A ל-B שבה הפוטנציאל אפס, ואת השדה שם (עוצמה וכיוון).

      (ד) כתבו משוואה שמקיימת כל נקודה על המשטח שווה הפוטנציאל של פוטנציאל $V$, בעזרת המרחקים $r_A$ ו-$r_B$ של הנקודה מ-A ומ-B.
    answer: >-
      (א) במרחק $a$ מימין ל-B, כלומר $2a$ מ-A.

      (ב) $V = kQ/a$

      (ג) במרחק $0.8a$ מ-A. השדה שם $31.25\,kQ/a^2$, לכיוון B.

      (ד) $\dfrac{4}{r_A} - \dfrac{1}{r_B} = \dfrac{V}{kQ}$
    solution:
      - kind: reasoning
        text: >-
          (א) בודקים כל אזור. בין A ל-B השדה של $+4Q$ מצביע לכיוון B, הרחק מ-A, וגם השדה של המטען השלילי מצביע לכיוון B, אליו. השדות באותו כיוון ולא מבטלים זה את זה. משמאל ל-A השדות מנוגדים, אבל A קרובה יותר ומטענה גדול יותר, ולכן השדה שלה חזק יותר בכל נקודה. מימין ל-B השדות מנוגדים, ושם המטען הקטן קרוב יותר, ולכן העוצמות יכולות להיות שוות.
      - kind: manipulation
        text: >-
          נסמן ב-$x$ את המרחק של הנקודה מימין ל-B. המרחק שלה מ-A הוא $a + x$. משווים עוצמות: $\dfrac{k \cdot 4Q}{(a + x)^2} = \dfrac{kQ}{x^2}$. מצמצמים את $kQ$ ומכפילים את שני האגפים ב-$x^2(a + x)^2$: $4x^2 = (a + x)^2$. שני המרחקים חיוביים, ולכן מוציאים שורש: $2x = a + x$, כלומר $x = a$.
      - kind: substitution
        text: >-
          (ב) בנקודה הזאת המרחק מ-A הוא $2a$ והמרחק מ-B הוא $a$. את הפוטנציאלים מחברים עם הסימנים: $V = \dfrac{k \cdot 4Q}{2a} + \dfrac{k(-Q)}{a} = \dfrac{2kQ}{a} - \dfrac{kQ}{a} = \dfrac{kQ}{a}$. השדה אפס, והפוטנציאל לא.
      - kind: manipulation
        text: >-
          (ג) נסמן ב-$y$ את המרחק של הנקודה מ-A. המרחק שלה מ-B הוא $a - y$. $V = \dfrac{4kQ}{y} - \dfrac{kQ}{a - y} = 0$, ולכן $\dfrac{4}{y} = \dfrac{1}{a - y}$. מכפילים את שני האגפים ב-$y(a - y)$: $4(a - y) = y$, כלומר $4a = 5y$. מחלקים ב-5: $y = 0.8a$.
      - kind: substitution
        text: >-
          שם המרחקים $0.8a$ מ-A ו-$0.2a$ מ-B, ושני השדות מצביעים לכיוון B: $E = \dfrac{4kQ}{(0.8a)^2} + \dfrac{kQ}{(0.2a)^2} = (6.25 + 25)\dfrac{kQ}{a^2} = 31.25\,\dfrac{kQ}{a^2}$. הפוטנציאל אפס, והשדה חזק.
      - kind: formula
        text: >-
          (ד) הפוטנציאל בנקודה הוא סכום התרומות: $V = \dfrac{k \cdot 4Q}{r_A} + \dfrac{k(-Q)}{r_B}$. מחלקים את שני האגפים ב-$kQ$: $\dfrac{4}{r_A} - \dfrac{1}{r_B} = \dfrac{V}{kQ}$.
      - kind: result
        text: >-
          (א) נקודה אחת, במרחק $a$ מימין ל-B. (ב) $V = kQ/a$. (ג) $0.8a$ מ-A, והשדה שם $31.25\,kQ/a^2$, לכיוון B. (ד) $\dfrac{4}{r_A} - \dfrac{1}{r_B} = \dfrac{V}{kQ}$. בנקודה שבה השדה אפס הפוטנציאל לא אפס, ובנקודה שבה הפוטנציאל אפס השדה לא אפס.
    source:
      name: British Physics Olympiad (BPhO), Round 1
      year: 2013
      problem: 'Round 1, November 2013, Section 2, Q3 (parts b and c)'
      url: https://www.bpho.org.uk/Papers/R1/2013Nov_R1_S2.pdf
      verified: '2026-11-02'
      adapted: true

  - id: W-2.3-c2
    stars: 2
    objectives: [OBJ-2.3-3, OBJ-2.3-1]
    prompt: >-
      הנקודה O היא מרכז של מעגל שרדיוסו $R$. הנקודה C נמצאת על המעגל, משמאל ל-O. הנקודה A נמצאת על המעגל בחציו התחתון, כך שהזווית CAB היא $60^\circ$, והנקודה B היא הנקודה שמול A על המעגל, כך ש-AB הוא קוטר. בנקודה A יש מטען $q/3$, בנקודה B מטען $q/3$, ובנקודה C מטען $q_C = -2q/3$, כאשר $q > 0$.

      (א) הראו שהפוטנציאל בנקודה O הוא אפס.

      (ב) מצאו את השדה בנקודה O (עוצמה וכיוון), בעזרת $k$, $q$ ו-$R$.

      (ג) מצאו את המרחקים AC ו-BC, ואת גודל הכוח בין המטען שב-C למטען שב-B.

      (ד) האם האנרגיה הפוטנציאלית החשמלית של המערכת אפס?

      (ה) מביאים מטען בוחן קטן $q_0$ ממרחק רב מאוד אל הנקודה O. כמה עבודה עושה עליו השדה של שלושת המטענים? האם פירוש הדבר שב-O לא פועל עליו כוח?
    answer: >-
      (א) $V_O = 0$

      (ב) $E = \dfrac{2kq}{3R^2}$, שמאלה, לכיוון C.

      (ג) $AC = R$, $BC = \sqrt{3}\,R$, והכוח $F = \dfrac{2kq^2}{27R^2}$ (משיכה).

      (ד) לא: $U \approx -0.29\,kq^2/R$.

      (ה) העבודה אפס, אבל ב-O פועל כוח $\dfrac{2kqq_0}{3R^2}$.
    solution:
      - kind: given
        text: >-
          שלושת המטענים נמצאים על המעגל, ולכן כל אחד מהם במרחק $R$ מ-O. AB קוטר, ו-C נמצאת משמאל ל-O.
      - kind: substitution
        text: >-
          (א) הפוטנציאל הוא סכום של מספרים עם סימנים: $V_O = \dfrac{k}{R}\Big(\dfrac{q}{3} + \dfrac{q}{3} - \dfrac{2q}{3}\Big) = 0$. סכום המטענים אפס, וכולם באותו מרחק מ-O.
      - kind: reasoning
        text: >-
          (ב) A ו-B נמצאות בשני הקצוות של קוטר, באותו מרחק מ-O ועם מטענים שווים. השדות שלהן ב-O שווים בעוצמתם ומנוגדים בכיוונם, ולכן מבטלים זה את זה. נשאר השדה של המטען שב-C. הוא שלילי, ולכן השדה שלו מצביע אליו: שמאלה. עוצמתו $E = \dfrac{k \cdot \frac{2q}{3}}{R^2} = \dfrac{2kq}{3R^2}$.
      - kind: reasoning
        text: >-
          (ג) AB קוטר, ולכן הזווית ACB, שנשענת על הקוטר, ישרה. במשולש ישר הזווית ABC היתר הוא $AB = 2R$, ולכן $AC = AB\cos 60^\circ = 2R \cdot \tfrac12 = R$ ו-$BC = AB\sin 60^\circ = 2R \cdot \tfrac{\sqrt{3}}{2} = \sqrt{3}\,R$.
      - kind: substitution
        text: >-
          לפי חוק קולון: $F = \dfrac{k \cdot \frac{q}{3} \cdot \frac{2q}{3}}{(\sqrt{3}\,R)^2} = \dfrac{2kq^2/9}{3R^2} = \dfrac{2kq^2}{27R^2}$. הסימנים מנוגדים, ולכן זו משיכה.
      - kind: substitution
        text: >-
          (ד) האנרגיה הפוטנציאלית של המערכת היא סכום של $U = kq_1q_2/r$ על כל זוג (שיעור 2.1): זוג AB במרחק $2R$, זוג AC במרחק $R$, וזוג BC במרחק $\sqrt{3}\,R$.

          $U = \dfrac{kq^2}{R}\Big(\dfrac{1}{18} - \dfrac{2}{9} - \dfrac{2}{9\sqrt{3}}\Big) \approx \dfrac{kq^2}{R}(0.056 - 0.222 - 0.128) \approx -0.29\,\dfrac{kq^2}{R}$. היא לא אפס.
      - kind: reasoning
        text: >-
          (ה) $W = q_0(V_\infty - V_O) = q_0(0 - 0) = 0$, בכל מסלול. אבל ב-O השדה, לפי (ב), אינו אפס, ולכן פועל שם על המטען כוח $F = q_0E = \dfrac{2kqq_0}{3R^2}$. פוטנציאל אפס אומר רק שהבאת המטען מהאינסוף לא דורשת עבודה בסך הכול; הוא לא אומר שהשיפוע של הפוטנציאל, השדה, אפס.
      - kind: result
        text: >-
          (א) $V_O = 0$. (ב) $\dfrac{2kq}{3R^2}$, שמאלה, לכיוון C. (ג) $AC = R$, $BC = \sqrt{3}\,R$, ו-$F = \dfrac{2kq^2}{27R^2}$, משיכה. (ד) לא, $U \approx -0.29\,kq^2/R$. (ה) העבודה אפס, ובכל זאת ב-O פועל כוח: פוטנציאל אפס, ושדה לא אפס.
