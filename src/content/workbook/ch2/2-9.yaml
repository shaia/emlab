# Workbook, lesson 2.9 (review: from experiment to theory). Format and rules: see .claude/CLAUDE.md, "Worked examples, workbook".
# Every table was generated with src/physics/lab.ts (measure, seeded scatter) and every slope recomputed with fitLine or
# fitThroughOrigin; the values "read on the line" are the least-squares line at those x values. Every other number was
# recomputed with capacitors.ts, potential.ts and constants.ts.
# The learner works on paper, so a line drawn by eye whose slope is within about 5% of the fit counts as right.
# In a >- block, consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '2.9'
practice:
  - id: W-2.9-01
    level: basic
    qualitative: false
    objectives: [OBJ-2.9-1]
    prompt: >-
      תלמידה טוענת קבל למתחים שונים, ובכל פעם מודדת במד מטען את המטען $Q$ על הלוח ($1\,\text{nC} = 10^{-9}\,\text{C}$):

      $$\begin{array}{c|ccccc} V\ (\text{V}) & 20 & 40 & 60 & 80 & 100 \\ \hline Q\ (\text{nC}) & 9.46 & 19.1 & 28.5 & 36.9 & 46.8 \end{array}$$

      (א) שרטטו גרף של $Q$ כפונקציה של $V$, העבירו את הקו המתאים ביותר, ומצאו ממנו את הקיבול של הקבל.

      (ב) מה יהיה המטען על הלוח אם טוענים את הקבל ל-$150\,\text{V}$?
    answer: >-
      (א) $C \approx 4.7\cdot10^{-10}\,\text{F}$.

      (ב) $Q \approx 7.0\cdot10^{-8}\,\text{C}$.
    solution:
      - kind: given
        text: >-
          חמש מדידות של מתח ומטען. מד המטען מראה את המטען על לוח אחד.
      - kind: formula
        text: >-
          $Q = CV$: קו ישר שעובר בראשית, והשיפוע שלו בגרף של $Q$ מול $V$ הוא הקיבול, $C = \dfrac{\Delta Q}{\Delta V}$.
      - kind: reasoning
        text: >-
          משרטטים את הנקודות ומעבירים קו ישר דרך הראשית, קרוב לכולן. הקו עובר בנקודה $(100\,\text{V},\ 46.8\,\text{nC})$, שהיא במקרה גם המדידה האחרונה.
          לוקחים אותה ואת הראשית, שתי נקודות רחוקות זו מזו על הקו.
      - kind: substitution
        text: >-
          $$C = \frac{46.8\cdot10^{-9} - 0}{100 - 0} = 4.68\cdot10^{-10}\ \text{F}$$
      - kind: substitution
        text: >-
          (ב) הקיבול תלוי רק במבנה הקבל, ולכן הוא אותו קיבול גם ב-$150\,\text{V}$:
          $$Q = CV = 4.68\cdot10^{-10}\cdot150 = 7.0\cdot10^{-8}\ \text{C}$$
      - kind: result
        text: >-
          (א) $C \approx 4.7\cdot10^{-10}\,\text{F}$ (מקו שמשרטטים ביד, כל ערך בין $4.5\cdot10^{-10}$ ל-$4.9\cdot10^{-10}\,\text{F}$ נכון).

          (ב) $Q \approx 7.0\cdot10^{-8}\,\text{C}$.

  - id: W-2.9-02
    level: basic
    qualitative: true
    objectives: [OBJ-2.9-1]
    prompt: >-
      על אותה מערכת צירים, מטען $Q$ (אנכי) כפונקציה של מתח $V$ (אופקי), משורטטים הקווים של שני קבלים, A ו-B. שני הקווים יוצאים מהראשית, והקו של A תלול יותר.

      (א) לאיזה קבל קיבול גדול יותר? נמקו.

      (ב) שני הקבלים טעונים לאותו מתח. באיזה מהם אגורה יותר אנרגיה?

      (ג) שני הקבלים טעונים לאותו מטען. באיזה מהם אגורה יותר אנרגיה?
    answer: >-
      (א) ל-A.

      (ב) ב-A.

      (ג) ב-B.
    solution:
      - kind: reasoning
        text: >-
          (א) בגרף של $Q$ מול $V$ השיפוע הוא $\Delta Q/\Delta V = C$. הקו של A תלול יותר, ולכן הקיבול של A גדול יותר: באותו מתח הוא מחזיק יותר מטען.
      - kind: formula
        text: >-
          האנרגיה היא השטח מתחת לגרף של $V$ כפונקציה של $Q$, משולש: $U = \tfrac12 QV$. אפשר לכתוב אותה גם $U = \tfrac12 CV^2$ או $U = \dfrac{Q^2}{2C}$.
      - kind: reasoning
        text: >-
          (ב) באותו מתח, על A יש יותר מטען ($Q = CV$ ו-$C$ שלו גדול יותר). המשולש של A גבוה באותה מידה ורחב יותר, ולכן $U = \tfrac12 CV^2$ גדול יותר ב-A.
      - kind: reasoning
        text: >-
          (ג) באותו מטען, המתח על B גדול יותר, כי $V = Q/C$ והקיבול של B קטן יותר. עכשיו המשולשים רחבים באותה מידה, והמשולש של B גבוה יותר, ולכן $U = \dfrac{Q^2}{2C}$ גדול יותר ב-B.
      - kind: result
        text: >-
          (א) ל-A, כי הקו שלו תלול יותר. (ב) ב-A. (ג) ב-B. התשובה ל"איזה קבל אוגר יותר" תלויה במה שווה בין השניים: המתח או המטען.

  - id: W-2.9-03
    level: basic
    qualitative: false
    objectives: [OBJ-2.9-2]
    prompt: >-
      בניסוי שבו מודדים את הקיבול של קבל לוחות בכמה מרחקים בין הלוחות, הגרף של הקיבול כפונקציה של $1/d$ הוא קו ישר דרך הראשית, עם שיפוע של $2.0\cdot10^{-13}\,\text{F}\cdot\text{m}$.

      (א) מה שטח הלוחות? אם הלוחות ריבועיים, מה אורך הצלע שלהם?

      (ב) מה הקיבול כשהמרחק בין הלוחות $2.5$ מ״מ?
    answer: >-
      (א) $A \approx 0.023\,\text{m}^2$, צלע של כ-$15\,\text{cm}$.

      (ב) $C = 8.0\cdot10^{-11}\,\text{F}$.
    solution:
      - kind: given
        text: >-
          השיפוע $m = 2.0\cdot10^{-13}\,\text{F}\cdot\text{m}$, ו-$\varepsilon_0 = 8.85\cdot10^{-12}\,\text{C}^2/(\text{N}\cdot\text{m}^2)$.
      - kind: formula
        text: >-
          $C = (\varepsilon_0 A)\cdot\dfrac1d$: קו מהצורה $y = mx$ עם $x = 1/d$, ולכן השיפוע הוא $m = \varepsilon_0 A$.
      - kind: manipulation
        text: >-
          מבודדים את השטח: מחלקים את שני האגפים של $m = \varepsilon_0 A$ ב-$\varepsilon_0$, ומקבלים $A = \dfrac{m}{\varepsilon_0}$.
      - kind: substitution
        text: >-
          $$A = \frac{2.0\cdot10^{-13}}{8.85\cdot10^{-12}} = 0.0226\ \text{m}^2$$
          ללוח ריבועי $A = a^2$, ולכן $a = \sqrt{0.0226} = 0.150\,\text{m}$.
      - kind: substitution
        text: >-
          (ב) על הקו, $C = m\cdot\dfrac1d$, עם $d = 2.5\cdot10^{-3}\,\text{m}$:
          $$C = \frac{2.0\cdot10^{-13}}{2.5\cdot10^{-3}} = 8.0\cdot10^{-11}\ \text{F}$$
      - kind: result
        text: >-
          (א) $A \approx 0.023\,\text{m}^2$, ריבוע שאורך הצלע שלו כ-$15\,\text{cm}$.

          (ב) $C = 8.0\cdot10^{-11}\,\text{F}$.

  - id: W-2.9-04
    level: mid
    qualitative: false
    objectives: [OBJ-2.9-1]
    prompt: >-
      בגרף של המתח על קבל כפונקציה של המטען עליו, הקו יוצא מהראשית ועובר בנקודה $(6.0\cdot10^{-8}\,\text{C},\ 300\,\text{V})$.

      (א) מה הקיבול של הקבל?

      (ב) הקבל טעון ל-$100\,\text{V}$, וממשיכים לטעון אותו עד $300\,\text{V}$. כמה אנרגיה נוספה לקבל? חשבו אותה כשטח מתחת לגרף.
    answer: >-
      (א) $C = 2.0\cdot10^{-10}\,\text{F}$.

      (ב) $8.0\cdot10^{-6}\,\text{J}$.
    solution:
      - kind: formula
        text: >-
          בגרף של $V$ מול $Q$ השיפוע הוא $\Delta V/\Delta Q = 1/C$, ולכן $C = \dfrac{Q}{V}$ בכל נקודה על הקו. האנרגיה היא השטח מתחת לגרף.
      - kind: substitution
        text: >-
          (א) $$C = \frac{6.0\cdot10^{-8}}{300} = 2.0\cdot10^{-10}\ \text{F}$$
      - kind: substitution
        text: >-
          (ב) המטען ב-$100\,\text{V}$: $Q_1 = CV_1 = 2.0\cdot10^{-10}\cdot100 = 2.0\cdot10^{-8}\,\text{C}$. ב-$300\,\text{V}$: $Q_2 = 6.0\cdot10^{-8}\,\text{C}$.
      - kind: reasoning
        text: >-
          האנרגיה שנוספה היא השטח מתחת לקו בין $Q_1$ ל-$Q_2$. זה טרפז: הצלעות המקבילות הן המתחים $100\,\text{V}$ ו-$300\,\text{V}$, והגובה שלו (לאורך הציר האופקי) הוא $Q_2 - Q_1$.
      - kind: substitution
        text: >-
          $$\Delta U = \tfrac12\,(V_1 + V_2)\,(Q_2 - Q_1) = \tfrac12\cdot(100 + 300)\cdot(6.0\cdot10^{-8} - 2.0\cdot10^{-8}) = 8.0\cdot10^{-6}\ \text{J}$$
          בדיקה: $\tfrac12 CV_2^2 - \tfrac12 CV_1^2 = \tfrac12\cdot2.0\cdot10^{-10}\cdot(300^2 - 100^2) = 8.0\cdot10^{-6}\,\text{J}$.
      - kind: result
        text: >-
          (א) $C = 2.0\cdot10^{-10}\,\text{F}$.

          (ב) נוספו $8.0\cdot10^{-6}\,\text{J}$. מי שמציבים את הפרש המתחים, $\tfrac12 C\,(200)^2$, מקבלים $4.0\cdot10^{-6}\,\text{J}$, חצי מהנכון: האנרגיה תלויה ב-$V^2$, ולכן מחסירים אנרגיות, לא מתחים.

  - id: W-2.9-05
    level: mid
    qualitative: true
    objectives: [OBJ-2.9-2]
    prompt: >-
      תלמיד מציע ללנארז את הנתונים של ניסוי הקיבול מול המרחק בדרך אחרת: לשרטט את $1/C$ כפונקציה של $d$.

      (א) האם לפי הנוסחה של קבל לוחות זה קו ישר? אם כן, מה השיפוע שלו, ואיך מוצאים ממנו את $\varepsilon_0$?

      (ב) במכשיר אמיתי, הכבלים מוסיפים קיבול קבוע $C_0$ שמחובר במקביל לקבל. איזה משני הגרפים, $C$ מול $1/d$ או $1/C$ מול $d$, נשאר ישר גם אז? נמקו.
    answer: >-
      (א) כן: קו ישר דרך הראשית עם שיפוע $m = \dfrac{1}{\varepsilon_0 A}$, ולכן $\varepsilon_0 = \dfrac{1}{mA}$.

      (ב) רק $C$ מול $1/d$ נשאר ישר (נקודת החיתוך שלו זזה ל-$C_0$). $1/C$ מול $d$ כבר לא ישר.
    solution:
      - kind: formula
        text: >-
          $C = \dfrac{\varepsilon_0 A}{d}$, ולכן $\dfrac1C = \dfrac{d}{\varepsilon_0 A} = \dfrac{1}{\varepsilon_0 A}\cdot d$.
      - kind: reasoning
        text: >-
          (א) זה קו מהצורה $y = mx$ עם $y = 1/C$ ו-$x = d$: ישר דרך הראשית, עם שיפוע $m = \dfrac{1}{\varepsilon_0 A}$. כדי למצוא את $\varepsilon_0$ כופלים את שני האגפים ב-$\varepsilon_0$ ומחלקים ב-$m$: $\varepsilon_0 = \dfrac{1}{mA}$.
      - kind: reasoning
        text: >-
          (ב) בקבלים במקביל הקיבולים מתחברים (שיעור 2.8), ולכן המכשיר מראה $C = \dfrac{\varepsilon_0 A}{d} + C_0$.
          מול $1/d$ זה עדיין קו ישר: אותו שיפוע $\varepsilon_0 A$, ונקודת חיתוך $C_0$ במקום אפס.
      - kind: reasoning
        text: >-
          לעומת זאת $\dfrac1C = \dfrac{1}{\varepsilon_0 A/d + C_0}$, והתוספת נמצאת בתוך המכנה. זה לא קו ישר מול $d$: במרחקים גדולים הקיבול של הלוחות קטן, $C$ שואף ל-$C_0$, ו-$1/C$ מפסיק לגדול ומתיישר אל הערך $1/C_0$.
      - kind: result
        text: >-
          (א) כן, $1/C$ מול $d$ ישר דרך הראשית עם שיפוע $1/(\varepsilon_0 A)$, ו-$\varepsilon_0 = 1/(mA)$.

          (ב) $C$ מול $1/d$ נשאר ישר, כי הקיבול של הכבלים רק מוסיף לו מספר קבוע. לכן זה הגרף העדיף בניסוי אמיתי.

  - id: W-2.9-06
    level: mid
    qualitative: false
    objectives: [OBJ-2.9-2]
    prompt: >-
      לקבל לוחות ריבועיים שאורך הצלע שלהם $25\,\text{cm}$ מודדים את הקיבול בכמה מרחקים בין הלוחות ($1\,\text{pF} = 10^{-12}\,\text{F}$):

      $$\begin{array}{c|cccccc} d\ (\text{mm}) & 2 & 3 & 4 & 5 & 6 & 8 \\ \hline C\ (\text{pF}) & 277 & 188 & 136 & 112 & 91.1 & 69.4 \end{array}$$

      שרטטו גרף שבו הנקודות על קו ישר, ומצאו ממנו את $\varepsilon_0$.

      רמז: על הציר האופקי צריך גודל שמחשבים מ-$d$. חשבו אותו לכל מדידה, עם $d$ במטרים.
    answer: >-
      גרף של $C$ מול $1/d$, שיפוע כ-$5.6\cdot10^{-13}\,\text{F}\cdot\text{m}$, ו-$\varepsilon_0 \approx 8.9\cdot10^{-12}\,\text{C}^2/(\text{N}\cdot\text{m}^2)$ (מקו שמשרטטים ביד, כל ערך בין $8.5\cdot10^{-12}$ ל-$9.3\cdot10^{-12}$ נכון).
    solution:
      - kind: given
        text: >-
          $A = 0.25^2 = 0.0625\,\text{m}^2$, ושש מדידות של $d$ ו-$C$.
      - kind: formula
        text: >-
          $C = (\varepsilon_0 A)\cdot\dfrac1d$: גרף של $C$ מול $1/d$ הוא קו ישר דרך הראשית, עם שיפוע $m = \varepsilon_0 A$.
      - kind: manipulation
        text: >-
          מחשבים את $1/d$ (ב-$1/\text{m}$):
          $$\begin{array}{c|cccccc} 1/d\ (1/\text{m}) & 500 & 333 & 250 & 200 & 167 & 125 \\ \hline C\ (\text{pF}) & 277 & 188 & 136 & 112 & 91.1 & 69.4 \end{array}$$
      - kind: reasoning
        text: >-
          משרטטים ומעבירים את הקו המתאים ביותר. הוא עובר כמעט בראשית, ובשתי נקודות רחוקות זו מזו: $(500\,\tfrac{1}{\text{m}},\ 278\,\text{pF})$ ו-$(125\,\tfrac{1}{\text{m}},\ 69.0\,\text{pF})$. אלה נקודות על הקו, קרובות למדידות הראשונה והאחרונה אבל לא בדיוק עליהן.
      - kind: substitution
        text: >-
          $$m = \frac{278\cdot10^{-12} - 69.0\cdot10^{-12}}{500 - 125} = \frac{2.09\cdot10^{-10}}{375} = 5.57\cdot10^{-13}\ \text{F}\cdot\text{m}$$
      - kind: substitution
        text: >-
          השיפוע הוא $\varepsilon_0 A$, ולכן מחלקים בשטח:
          $$\varepsilon_0 = \frac{m}{A} = \frac{5.57\cdot10^{-13}}{0.0625} = 8.9\cdot10^{-12}\ \frac{\text{C}^2}{\text{N}\cdot\text{m}^2}$$
      - kind: result
        text: >-
          גרף של $C$ מול $1/d$ הוא קו ישר, ומהשיפוע שלו $\varepsilon_0 \approx 8.9\cdot10^{-12}\,\text{C}^2/(\text{N}\cdot\text{m}^2)$, כאחוז אחד מהערך שבדף הנוסחאות.

  - id: W-2.9-07
    level: mid
    qualitative: false
    objectives: [OBJ-2.9-3]
    prompt: >-
      באזור בריק יש שדה חשמלי, ומפה של קווים שווי פוטנציאל מתארת אותו. אלקטרון עובר בנקודה A שעל הקו של $-20\,\text{V}$ במהירות $2.0\cdot10^{6}\,\text{m/s}$, ומגיע לנקודה B שעל הקו של $+80\,\text{V}$. השדה בין הנקודות לא אחיד, והמסלול לא ידוע.

      (א) מה מהירות האלקטרון ב-B?

      (ב) פרוטון עובר ב-A באותה מהירות, $2.0\cdot10^{6}\,\text{m/s}$, ומגיע ל-B. האם הוא מאיץ או מאט? מה מהירותו ב-B?
    answer: >-
      (א) $6.3\cdot10^{6}\,\text{m/s}$.

      (ב) מאט, אבל כמעט לא: כ-$2.0\cdot10^{6}\,\text{m/s}$ (בדיוק $1.995\cdot10^{6}\,\text{m/s}$).
    solution:
      - kind: reasoning
        text: >-
          השדה לא אחיד והמסלול לא ידוע, ולכן אין תאוצה קבועה וקינמטיקה לא תעבוד. השדה משמר, ולכן משתמשים בשימור אנרגיה: השינוי באנרגיה הקינטית תלוי רק בפוטנציאלים של שתי הנקודות.
      - kind: formula
        text: >-
          $\Delta K = -q\,(V_B - V_A)$.
      - kind: given
        text: >-
          $V_B - V_A = 80 - (-20) = 100\,\text{V}$. לאלקטרון $q = -1.6\cdot10^{-19}\,\text{C}$ ו-$m = 9.1\cdot10^{-31}\,\text{kg}$.
      - kind: substitution
        text: >-
          (א) $\Delta K = -(-1.6\cdot10^{-19})\cdot100 = +1.6\cdot10^{-17}\,\text{J}$: אלקטרון שעובר לפוטנציאל גבוה יותר מאיץ.
          $$K_A = \tfrac12\cdot9.1\cdot10^{-31}\cdot(2.0\cdot10^{6})^2 = 1.82\cdot10^{-18}\ \text{J}$$
          $$K_B = 1.82\cdot10^{-18} + 1.6\cdot10^{-17} = 1.78\cdot10^{-17}\ \text{J}$$
      - kind: manipulation
        text: >-
          מבודדים את המהירות מ-$K_B = \tfrac12 m v_B^2$: כופלים ב-2, מחלקים ב-$m$, ומוציאים שורש:
          $$v_B = \sqrt{\frac{2K_B}{m}} = \sqrt{\frac{2\cdot1.78\cdot10^{-17}}{9.1\cdot10^{-31}}} = 6.3\cdot10^{6}\ \text{m/s}$$
      - kind: substitution
        text: >-
          (ב) לפרוטון $q = +1.6\cdot10^{-19}\,\text{C}$, ולכן $\Delta K = -1.6\cdot10^{-17}\,\text{J}$: הוא מאט. אבל המסה שלו גדולה בהרבה, $1.67\cdot10^{-27}\,\text{kg}$:
          $$K_A = \tfrac12\cdot1.67\cdot10^{-27}\cdot(2.0\cdot10^{6})^2 = 3.34\cdot10^{-15}\ \text{J}$$
          זה פי 200 בערך מהאנרגיה שהוא מאבד. $K_B = 3.34\cdot10^{-15} - 0.016\cdot10^{-15} = 3.324\cdot10^{-15}\,\text{J}$, ולכן
          $$v_B = \sqrt{\frac{2\cdot3.324\cdot10^{-15}}{1.67\cdot10^{-27}}} = 1.995\cdot10^{6}\ \text{m/s}$$
      - kind: result
        text: >-
          (א) האלקטרון מאיץ ל-$6.3\cdot10^{6}\,\text{m/s}$.

          (ב) הפרוטון מאט, אבל רק מעט: ל-$1.995\cdot10^{6}\,\text{m/s}$, כלומר עדיין כ-$2.0\cdot10^{6}\,\text{m/s}$. אותו מתח נותן לשני החלקיקים שינוי אנרגיה זהה בגודלו, אבל לפרוטון באותה מהירות יש אנרגיה קינטית גדולה פי כ-1800.

  - id: W-2.9-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-2.9-3]
    prompt: >-
      את הקבל של ניסוי 1 (לוחות של $0.04\,\text{m}^2$ במרחק $1$ מ״מ) טוענים ל-$300\,\text{V}$ ומנתקים מהסוללה. אחר כך מחברים אותו, לוח חיובי ללוח ולוח שלילי ללוח, לקבל זהה שאינו טעון.

      (א) מה המתח המשותף אחרי החיבור, ומה המטען על כל קבל?

      (ב) כמה אנרגיה הייתה בקבל לפני החיבור, וכמה יש בשני הקבלים אחריו? לאן הלך ההפרש?

      (ג) מה השדה בין הלוחות של כל קבל אחרי החיבור?

      (ד) אלקטרון משתחרר ממנוחה ליד הלוח השלילי של אחד הקבלים אחרי החיבור. באיזו מהירות יגיע ללוח החיובי?
    answer: >-
      (א) $150\,\text{V}$, ו-$5.3\cdot10^{-8}\,\text{C}$ על כל קבל.

      (ב) לפני $1.59\cdot10^{-5}\,\text{J}$, אחרי $7.97\cdot10^{-6}\,\text{J}$: חצי הלך לחום בחוטים (ולקרינה).

      (ג) $1.5\cdot10^{5}\,\text{V/m}$.

      (ד) $7.3\cdot10^{6}\,\text{m/s}$.
    solution:
      - kind: given
        text: >-
          $A = 0.04\,\text{m}^2$, $d = 10^{-3}\,\text{m}$, $V_0 = 300\,\text{V}$. הקבל השני זהה ואינו טעון.
      - kind: substitution
        text: >-
          קיבול כל קבל (שיעור 2.6): $C = \dfrac{\varepsilon_0 A}{d} = \dfrac{8.85\cdot10^{-12}\cdot0.04}{10^{-3}} = 3.54\cdot10^{-10}\,\text{F}$. המטען לפני החיבור: $Q_0 = CV_0 = 3.54\cdot10^{-10}\cdot300 = 1.06\cdot10^{-7}\,\text{C}$.
      - kind: reasoning
        text: >-
          (א) שימור מטען: המטען שעל הלוחות המחוברים אין לו לאן לברוח, ולכן הוא מתחלק בין שני הקבלים. מטען זורם עד ששני הקבלים באותו מתח, כי הלוחות המחוברים הם מוליך אחד עם פוטנציאל אחד. הקבלים זהים, ולכן כל אחד מקבל חצי מהמטען, והמתח $V = \dfrac{Q_0}{2C} = \dfrac{V_0}{2} = 150\,\text{V}$. על כל קבל $Q = CV = 3.54\cdot10^{-10}\cdot150 = 5.31\cdot10^{-8}\,\text{C}$.
      - kind: substitution
        text: >-
          (ב) $$U_{0} = \tfrac12 CV_0^2 = \tfrac12\cdot3.54\cdot10^{-10}\cdot300^2 = 1.59\cdot10^{-5}\ \text{J}$$
          $$U = 2\cdot\tfrac12 CV^2 = 3.54\cdot10^{-10}\cdot150^2 = 7.97\cdot10^{-6}\ \text{J}$$
      - kind: reasoning
        text: >-
          חצי מהאנרגיה נעלם מהקבלים. המטען זרם בחוטים, והחוטים התחממו (וחלק קטן נפלט כקרינה). המטען נשמר, האנרגיה של הקבלים לא.
      - kind: substitution
        text: >-
          (ג) השדה בין לוחות במתח $150\,\text{V}$ ובמרחק $1$ מ״מ: $E = \dfrac{V}{d} = \dfrac{150}{10^{-3}} = 1.5\cdot10^{5}\,\text{V/m}$.
      - kind: substitution
        text: >-
          (ד) שימור אנרגיה: האלקטרון עובר $150\,\text{V}$ בכיוון שבו הוא מואץ, ולכן $\tfrac12 mv^2 = eV$:
          $$v = \sqrt{\frac{2eV}{m}} = \sqrt{\frac{2\cdot1.6\cdot10^{-19}\cdot150}{9.1\cdot10^{-31}}} = 7.3\cdot10^{6}\ \text{m/s}$$
      - kind: result
        text: >-
          (א) $V = 150\,\text{V}$, ועל כל קבל $5.3\cdot10^{-8}\,\text{C}$.

          (ב) $1.59\cdot10^{-5}\,\text{J}$ לפני ו-$7.97\cdot10^{-6}\,\text{J}$ אחרי: חצי מהאנרגיה הפך לחום בחוטים.

          (ג) $E = 1.5\cdot10^{5}\,\text{V/m}$.

          (ד) $v \approx 7.3\cdot10^{6}\,\text{m/s}$.

  - id: W-2.9-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-2.9-2, OBJ-2.9-3]
    prompt: >-
      ניסוי אחר למדידת $\varepsilon_0$: טוענים את קבל הלוחות (שטח $0.04\,\text{m}^2$) ומנתקים אותו מהסוללה. מד מתח שכמעט לא מושך מטען מהלוחות מראה את המתח ביניהם, ומרחיקים את הלוחות צעד אחר צעד:

      $$\begin{array}{c|ccccc} d\ (\text{mm}) & 1 & 2 & 3 & 4 & 5 \\ \hline V\ (\text{V}) & 57.3 & 113 & 170 & 226 & 286 \end{array}$$

      בסוף מחברים את הקבל למד מטען, והוא מראה $Q = 2.0\cdot10^{-8}\,\text{C}$.

      (א) הראו שלפי התאוריה הגרף של $V$ כפונקציה של $d$ הוא קו ישר דרך הראשית. מה השיפוע שלו?

      (ב) מצאו את השיפוע מהנתונים, וחשבו ממנו את $\varepsilon_0$.

      (ג) לשיפוע של הגרף הזה יש משמעות פיזיקלית נוספת. מהי, ומה היא אומרת על השדה בזמן שמרחיקים את הלוחות?

      (ד) כמה עבודה עשתה היד שהרחיקה את הלוחות מ-$1$ מ״מ ל-$5$ מ״מ?
    answer: >-
      (א) $V = \dfrac{Q}{\varepsilon_0 A}\cdot d$, ישר דרך הראשית עם שיפוע $\dfrac{Q}{\varepsilon_0 A}$.

      (ב) שיפוע כ-$5.7\cdot10^{4}\,\text{V/m}$, ו-$\varepsilon_0 \approx 8.8\cdot10^{-12}\,\text{C}^2/(\text{N}\cdot\text{m}^2)$.

      (ג) השיפוע $V/d$ הוא השדה בין הלוחות: קבוע, כ-$5.7\cdot10^{4}\,\text{V/m}$, בכל מרחק.

      (ד) כ-$2.3\cdot10^{-6}\,\text{J}$.
    solution:
      - kind: reasoning
        text: >-
          (א) הקבל מנותק, ולכן המטען על הלוחות קבוע. $V = \dfrac{Q}{C}$ ו-$C = \dfrac{\varepsilon_0 A}{d}$, ולכן
          $$V = \frac{Q}{\varepsilon_0 A/d} = \frac{Q}{\varepsilon_0 A}\cdot d$$
          זה קו מהצורה $y = mx$ עם $x = d$, ושיפוע $m = \dfrac{Q}{\varepsilon_0 A}$, כי $Q$ ו-$A$ קבועים.
      - kind: reasoning
        text: >-
          (ב) משרטטים את $V$ מול $d$ (עם $d$ במטרים). הקו המתאים ביותר עובר כמעט בראשית, ובנקודות $(1\cdot10^{-3}\,\text{m},\ 56.4\,\text{V})$ ו-$(5\cdot10^{-3}\,\text{m},\ 284.5\,\text{V})$. אלה נקודות על הקו, לא המדידות עצמן.
      - kind: substitution
        text: >-
          $$m = \frac{284.5 - 56.4}{5\cdot10^{-3} - 1\cdot10^{-3}} = \frac{228.1}{4\cdot10^{-3}} = 5.70\cdot10^{4}\ \text{V/m}$$
      - kind: manipulation
        text: >-
          מבודדים את $\varepsilon_0$ מ-$m = \dfrac{Q}{\varepsilon_0 A}$: כופלים את שני האגפים ב-$\varepsilon_0$, ומחלקים ב-$m$: $\varepsilon_0 = \dfrac{Q}{mA}$.
      - kind: substitution
        text: >-
          $$\varepsilon_0 = \frac{2.0\cdot10^{-8}}{5.70\cdot10^{4}\cdot0.04} = 8.8\cdot10^{-12}\ \frac{\text{C}^2}{\text{N}\cdot\text{m}^2}$$
      - kind: reasoning
        text: >-
          (ג) השיפוע הוא $V/d$, וזה בדיוק השדה בין הלוחות, $E = V/d$. הגרף ישר, ולכן השדה נשאר אותו שדה בכל מרחק: המטען והשטח לא משתנים, ולכן גם $E = \dfrac{Q}{\varepsilon_0 A}$ לא משתנה. המתח גדל רק כי השדה הקבוע משתרע על מרחק גדול יותר.
      - kind: reasoning
        text: >-
          (ד) היד עושה עבודה נגד המשיכה בין הלוחות, והעבודה היא תוספת האנרגיה בקבל (שיעור 2.7). המטען קבוע, ולכן $U = \tfrac12 QV$, והתוספת היא $\tfrac12 Q\,(V_2 - V_1)$. את המתחים לוקחים מהקו: $56.4\,\text{V}$ ו-$284.5\,\text{V}$.
      - kind: substitution
        text: >-
          $$W = \tfrac12\cdot2.0\cdot10^{-8}\cdot(284.5 - 56.4) = 2.3\cdot10^{-6}\ \text{J}$$
      - kind: result
        text: >-
          (א) $V = \dfrac{Q}{\varepsilon_0 A}\cdot d$, שיפוע $\dfrac{Q}{\varepsilon_0 A}$.

          (ב) $m \approx 5.7\cdot10^{4}\,\text{V/m}$, ו-$\varepsilon_0 \approx 8.8\cdot10^{-12}\,\text{C}^2/(\text{N}\cdot\text{m}^2)$.

          (ג) השיפוע הוא השדה בין הלוחות, והוא לא משתנה כשמרחיקים אותם.

          (ד) $W \approx 2.3\cdot10^{-6}\,\text{J}$.

  - id: W-2.9-10
    level: bagrut
    qualitative: true
    objectives: [OBJ-2.9-3, OBJ-2.9-1]
    prompt: >-
      קבל לוחות שלוחותיו אופקיים מחובר לסוללה. הלוח התחתון חיובי והעליון שלילי. גרגר אבק טעון במטען חיובי מרחף במנוחה בין הלוחות. עכשיו מרחיקים את הלוח העליון כך שהמרחק בין הלוחות גדל פי 2, והסוללה נשארת מחוברת.

      (א) קבעו ונמקו מה קורה לקיבול, למתח, למטען, לשדה בין הלוחות ולאנרגיה האגורה (פי כמה כל אחד משתנה).

      (ב) מה יקרה לגרגר האבק? מה התאוצה שלו מיד אחרי ההרחקה?

      (ג) תארו את המצב לפני ההרחקה ואחריה כשתי נקודות על גרף של $V$ כפונקציה של $Q$, והסבירו בעזרת הגרף מה קרה לאנרגיה.
    answer: >-
      (א) הקיבול קטן פי 2, המתח לא משתנה, המטען קטן פי 2, השדה קטן פי 2, והאנרגיה קטנה פי 2.

      (ב) הגרגר מתחיל ליפול, בתאוצה $g/2 = 5\,\text{m/s}^2$ כלפי מטה.

      (ג) הנקודה זזה אופקית שמאלה, לחצי המטען באותו מתח, והמשולש שמתחתיה (האנרגיה) קטן לחצי.
    solution:
      - kind: reasoning
        text: >-
          (א) הסוללה מחוברת, ולכן המתח $V$ קבוע. $C = \dfrac{\varepsilon_0 A}{d}$: המרחק גדל פי 2, ולכן הקיבול קטן פי 2. $Q = CV$: המטען קטן פי 2, חצי ממנו חזר לסוללה. $E = V/d$: אותו מתח על מרחק כפול, ולכן השדה קטן פי 2. $U = \tfrac12 CV^2$: קטנה פי 2.
      - kind: reasoning
        text: >-
          (ב) לפני ההרחקה הגרגר במנוחה, ולכן הכוחות עליו מאוזנים: הכוח החשמלי $qE$ כלפי מעלה (השדה מצביע מהלוח החיובי שלמטה אל השלילי שלמעלה, והמטען חיובי) שווה למשקל: $qE = mg$.
      - kind: reasoning
        text: >-
          אחרי ההרחקה השדה הוא $E/2$, והכוח החשמלי הוא $\tfrac12 mg$. השקול הוא $mg - \tfrac12 mg = \tfrac12 mg$ כלפי מטה, ולפי החוק השני של ניוטון התאוצה היא $a = \dfrac{mg/2}{m} = \dfrac{g}{2} = 5\,\text{m/s}^2$, כלפי מטה. השדה בין הלוחות אחיד, ולכן התאוצה הזו נשארת קבועה עד שהגרגר פוגע בלוח התחתון.
      - kind: reasoning
        text: >-
          (ג) בגרף של $V$ (אנכי) מול $Q$ (אופקי), המצב לפני הוא נקודה בגובה $V$ ובמרחק $Q$ מהציר. אחרי ההרחקה המתח אותו מתח והמטען חצי, ולכן הנקודה זזה אופקית, לחצי הדרך אל הציר האנכי. האנרגיה היא שטח המשולש מתחת לקו מהראשית לנקודה, $\tfrac12 QV$: אותו גובה, חצי בסיס, חצי שטח.
      - kind: reasoning
        text: >-
          לאן הלכה האנרגיה? היד עשתה עבודה חיובית נגד המשיכה בין הלוחות, ובכל זאת האנרגיה בקבל קטנה. גם העבודה של היד וגם האנרגיה שהקבל איבד עברו לסוללה, עם המטען שחזר אליה (שיעור 2.7).
      - kind: result
        text: >-
          (א) $C$ קטן פי 2, $V$ לא משתנה, $Q$, $E$ ו-$U$ קטנים פי 2.

          (ב) הגרגר נופל בתאוצה קבועה $g/2 = 5\,\text{m/s}^2$ כלפי מטה.

          (ג) הנקודה זזה אופקית לחצי המטען באותו מתח, והמשולש שמתחת לקו, האנרגיה, קטן לחצי.
challenge:
  - id: W-2.9-c1
    stars: 1
    objectives: [OBJ-2.9-3]
    prompt: >-
      לענן סערה יש בסיס שטוח ואופקי שהשטח שלו $25\,\text{km}^2$, בגובה $750\,\text{m}$ מעל פני הקרקע. נתייחס לבסיס הענן ולקרקע שמתחתיו כאל שני הלוחות של קבל לוחות. הפוטנציאל של הענן גבוה ב-$1.00\cdot10^{5}\,\text{V}$ מזה של הקרקע.

      (א) כמה אנרגיה חשמלית אגורה ב"קבל" הזה?

      (ב) הענן עולה לגובה $1250\,\text{m}$, והמטען שעליו לא משתנה. האם האנרגיה האגורה גדלה או קטנה? נמקו.

      (ג) בכמה השתנתה האנרגיה, ומאיפה באה ההשתנות?
    answer: >-
      (א) $U_1 \approx 1.48\cdot10^{3}\,\text{J}$.

      (ב) גדלה.

      (ג) גדלה בכ-$9.8\cdot10^{2}\,\text{J}$ (ל-$2.46\cdot10^{3}\,\text{J}$), מהעבודה של זרמי האוויר שהרימו את הענן נגד המשיכה החשמלית לקרקע.
    solution:
      - kind: given
        text: >-
          $A = 25\,\text{km}^2 = 25\cdot10^{6}\,\text{m}^2$, $d_1 = 750\,\text{m}$, $V_1 = 1.00\cdot10^{5}\,\text{V}$, $d_2 = 1250\,\text{m}$.
      - kind: reasoning
        text: >-
          המודל של קבל לוחות סביר כאן, כי המרחק קטן בהרבה מגודל הלוחות: צלע של ריבוע בשטח $25\,\text{km}^2$ היא $5000\,\text{m}$, פי 7 מ-$750\,\text{m}$. בגובה $1250\,\text{m}$ היחס כבר רק פי 4, והמודל גס יותר.
      - kind: substitution
        text: >-
          (א) $$C_1 = \frac{\varepsilon_0 A}{d_1} = \frac{8.85\cdot10^{-12}\cdot25\cdot10^{6}}{750} = 2.95\cdot10^{-7}\ \text{F}$$
          $$U_1 = \tfrac12 C_1V_1^2 = \tfrac12\cdot2.95\cdot10^{-7}\cdot(1.00\cdot10^{5})^2 = 1.48\cdot10^{3}\ \text{J}$$
      - kind: reasoning
        text: >-
          (ב) הענן מבודד מהקרקע, ולכן המטען $Q$ קבוע (זה "קבל מנותק"). המרחק גדל, ולכן הקיבול קטן. ב-$U = \dfrac{Q^2}{2C}$, עם מטען קבוע וקיבול קטן יותר, האנרגיה גדלה.
      - kind: manipulation
        text: >-
          (ג) עם מטען קבוע, $U = \dfrac{Q^2}{2C} = \dfrac{Q^2 d}{2\varepsilon_0 A}$: האנרגיה ביחס ישר למרחק. לכן $U_2 = U_1\cdot\dfrac{d_2}{d_1}$.
      - kind: substitution
        text: >-
          $$U_2 = 1.475\cdot10^{3}\cdot\frac{1250}{750} = 2.46\cdot10^{3}\ \text{J}
          \qquad
          \Delta U = 2.46\cdot10^{3} - 1.48\cdot10^{3} \approx 9.8\cdot10^{2}\ \text{J}$$
          (בחישוב לוקחים את $U_1$ הלא מעוגל, $1.475\cdot10^{3}\,\text{J}$, ולכן ההפרש יוצא $983\,\text{J}$.) המתח עולה באותו יחס, ל-$1.67\cdot10^{5}\,\text{V}$.
      - kind: reasoning
        text: >-
          המטען על הענן והמטען שהוא משרה בקרקע מנוגדים, ולכן הם מושכים זה את זה. מה שהרים את הענן, זרמי אוויר עולים, עשה עבודה נגד המשיכה הזו, והעבודה נאגרה כאנרגיה חשמלית: $W = \Delta U$.
      - kind: result
        text: >-
          (א) $U_1 \approx 1.48\cdot10^{3}\,\text{J}$.

          (ב) האנרגיה גדלה, כי עם מטען קבוע $U = Q^2/(2C)$ והקיבול קטן.

          (ג) $\Delta U \approx 9.8\cdot10^{2}\,\text{J}$, מהעבודה של זרמי האוויר נגד המשיכה בין הענן לקרקע.
    source:
      name: British Physics Olympiad (BPhO), Round 1
      year: 2012
      problem: 'Round 1, 16 November 2012, Section 1, Question 1(h)'
      url: https://www.bpho.org.uk/Papers/R1/2012Nov_R1_S1.pdf
      verified: '2026-11-02'
      adapted: true

  - id: W-2.9-c2
    stars: 2
    objectives: [OBJ-2.9-3]
    prompt: >-
      ארבעה לוחות מתכת ריבועיים זהים, כל אחד בשטח $0.04\,\text{m}^2$, תלויים זה מעל זה במקביל, והמרחק בין כל שני לוחות סמוכים $1$ מ״מ. נמספר אותם מלמעלה: 1, 2, 3, 4. התהליך:

      שלב 1: מחברים את לוחות 1 ו-4 לסוללה של $600\,\text{V}$ (לוח 1 בצד החיובי), ומחברים את לוחות 2 ו-3 זה לזה בחוט.

      שלב 2: מסירים את החוט שבין 2 ל-3.

      שלב 3: מנתקים את הסוללה, ובמקומה מחברים את לוחות 1 ו-4 זה לזה בחוט.

      (א) מצאו בסוף התהליך את המתח בין 1 ל-2, בין 2 ל-3 ובין 3 ל-4, וקבעו בכל זוג איזה לוח בפוטנציאל הגבוה יותר.

      (ב) כמה אנרגיה הייתה אגורה בין הלוחות בסוף שלב 2, וכמה בסוף שלב 3? לאן הלך ההפרש?
    answer: >-
      (א) $V_{12} = 100\,\text{V}$ (לוח 1 גבוה), בין 2 ל-3 $200\,\text{V}$ (לוח 3 גבוה), $V_{34} = 100\,\text{V}$ (לוח 3 גבוה).

      (ב) $3.19\cdot10^{-5}\,\text{J}$ בסוף שלב 2, ו-$1.06\cdot10^{-5}\,\text{J}$ בסוף שלב 3: $2.12\cdot10^{-5}\,\text{J}$ הפכו לחום בחוט.
    solution:
      - kind: given
        text: >-
          כל זוג לוחות סמוכים הוא קבל עם $C = \dfrac{\varepsilon_0 A}{d} = \dfrac{8.85\cdot10^{-12}\cdot0.04}{10^{-3}} = 3.54\cdot10^{-10}\,\text{F}$. בין הלוחות השדה אחיד, ו-$V = Ed$ בכל רווח.
      - kind: reasoning
        text: >-
          שלב 1: לוחות 2 ו-3 מחוברים, ולכן הם באותו פוטנציאל, והמתח בין 2 ל-3 הוא אפס. נשארים שני קבלים בטור, 1-2 ו-3-4, זהים, ולכן כל אחד מקבל חצי מהמתח, $300\,\text{V}$. המטען: $q_0 = C\cdot300 = 3.54\cdot10^{-10}\cdot300 = 1.06\cdot10^{-7}\,\text{C}$. על לוח 1 יש $+q_0$, על 2 יש $-q_0$, על 3 יש $+q_0$ ועל 4 יש $-q_0$.
      - kind: reasoning
        text: >-
          שלב 2: הסרת החוט לא מזיזה מטען, ולכן לכל לוח נשאר המטען שלו. מעכשיו לוח 2 מבודד עם $-q_0$, ולוח 3 מבודד עם $+q_0$. המטענים האלה נשמרים עד הסוף.
      - kind: reasoning
        text: >-
          שלב 3: לוחות 1 ו-4 מחוברים בחוט. המטען הכולל שלהם, $+q_0 - q_0 = 0$, נשמר, ולכן אם על לוח 1 יש $x$, על לוח 4 יש $-x$. כל לוח הוא משטח טעון שיוצר שדה $\dfrac{|q|}{2\varepsilon_0 A}$ משני צדדיו (שיעור 1.8), ובכל רווח מחברים את השדות של ארבעת הלוחות.
      - kind: manipulation
        text: >-
          בוחרים כיוון חיובי כלפי מטה. ברווח בין 1 ל-2, לוח 1 מעל והשאר מתחת: $E_{12} = \dfrac{x - (-q_0 + q_0 - x)}{2\varepsilon_0 A} = \dfrac{x}{\varepsilon_0 A}$. באותו אופן $E_{23} = \dfrac{x - q_0}{\varepsilon_0 A}$ ו-$E_{34} = \dfrac{x}{\varepsilon_0 A}$.
      - kind: manipulation
        text: >-
          לוחות 1 ו-4 מחוברים, ולכן הם באותו פוטנציאל: סכום המתחים בשלושת הרווחים, מלמעלה למטה, הוא אפס. כל הרווחים באותו רוחב $d$, ולכן
          $$\frac{d}{\varepsilon_0 A}\,\bigl(x + (x - q_0) + x\bigr) = 0 \quad\Rightarrow\quad 3x = q_0 \quad\Rightarrow\quad x = \frac{q_0}{3}$$
      - kind: substitution
        text: >-
          (א) בכל רווח $V = Ed$, ו-$\dfrac{d}{\varepsilon_0 A} = \dfrac1C$, ולכן המתח ברווח הוא המונה של השדה חלקי $C$:
          $$V_{12} = \frac{q_0/3}{C} = \frac{300}{3} = 100\ \text{V}
          \qquad
          V_{23} = \frac{q_0/3 - q_0}{C} = -\frac{2}{3}\cdot300 = -200\ \text{V}
          \qquad
          V_{34} = 100\ \text{V}$$
          סימן חיובי פירושו שהלוח העליון בזוג בפוטנציאל הגבוה. בדיקה: $100 - 200 + 100 = 0$.
      - kind: substitution
        text: >-
          (ב) בסוף שלב 2 יש שני קבלים במתח $300\,\text{V}$ והשלישי ריק:
          $$U_2 = 2\cdot\tfrac12\cdot3.54\cdot10^{-10}\cdot300^2 = 3.19\cdot10^{-5}\ \text{J}$$
          בסוף שלב 3:
          $$U_3 = \tfrac12\cdot3.54\cdot10^{-10}\cdot(100^2 + 200^2 + 100^2) = 1.06\cdot10^{-5}\ \text{J}$$
      - kind: result
        text: >-
          (א) בין 1 ל-2: $100\,\text{V}$, לוח 1 גבוה. בין 2 ל-3: $200\,\text{V}$, לוח 3 גבוה. בין 3 ל-4: $100\,\text{V}$, לוח 3 גבוה.

          (ב) $3.19\cdot10^{-5}\,\text{J}$ בסוף שלב 2 ו-$1.06\cdot10^{-5}\,\text{J}$ בסוף שלב 3. ההפרש, $2.12\cdot10^{-5}\,\text{J}$, הפך לחום בחוט שחיבר את 1 ל-4 בזמן שהמטען זרם בו.
