# Workbook, lesson 2.8 (capacitors in series and in parallel). Format and rules: see .claude/CLAUDE.md, "Worked examples, workbook".
# Every number was recomputed with src/physics/capacitors.ts (series, parallel, seriesString, parallelBank,
# shareCharge, energyCV, plateCapacitance); plateCapacitance uses the sheet's ε₀ = 8.85·10⁻¹².
# In a >- block, consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '2.8'
practice:
  - id: W-2.8-01
    level: basic
    qualitative: false
    objectives: [OBJ-2.8-1]
    prompt: >-
      יש ארבעה קבלים זהים, כל אחד בקיבול $8\,\mu\text{F}$.

      א. מה הקיבול השקול כשמחברים את ארבעתם בטור?

      ב. מה הקיבול השקול כשמחברים את ארבעתם במקביל?

      ג. פי כמה גדול הקיבול השקול במקביל מהקיבול השקול בטור?
    answer: >-
      א. $2\,\mu\text{F}$.

      ב. $32\,\mu\text{F}$.

      ג. פי 16.
    solution:
      - kind: given
        text: >-
          ארבעה קבלים, כל אחד $C = 8\,\mu\text{F}$.
      - kind: formula
        text: >-
          בטור $\dfrac{1}{C_{\text{eq}}} = \dfrac{1}{C_1} + \dfrac{1}{C_2} + \dots$, ובמקביל $C_{\text{eq}} = C_1 + C_2 + \dots$
      - kind: manipulation
        text: >-
          כשכל הקבלים זהים, בטור יש ארבעה איברים שווים: $\dfrac{1}{C_{\text{eq}}} = \dfrac{4}{C}$, ואחרי היפוך $C_{\text{eq}} = \dfrac{C}{4}$. במקביל $C_{\text{eq}} = 4C$.
      - kind: substitution
        text: >-
          בטור $C_{\text{eq}} = \dfrac{8}{4} = 2\,\mu\text{F}$. במקביל $C_{\text{eq}} = 4\cdot8 = 32\,\mu\text{F}$. היחס: $\dfrac{32}{2} = 16$, כלומר $4^2$.
      - kind: result
        text: >-
          א. $2\,\mu\text{F}$.

          ב. $32\,\mu\text{F}$.

          ג. פי 16.

  - id: W-2.8-02
    level: basic
    qualitative: true
    objectives: [OBJ-2.8-3]
    prompt: >-
      קבל $C_1$ נטען למתח $V_0$ ומנותק מהסוללה. מחברים אותו לקבל ריק $C_2$, שהקיבול שלו גדול פי 99: $C_2 = 99\,C_1$. קבעו ונמקו:

      א. איזה חלק מהמטען נשאר על $C_1$, ומה המתח המשותף אחרי החיבור?

      ב. איזה חלק מהאנרגיה החשמלית נשאר אחרי החיבור?
    answer: >-
      א. נשאר אחוז אחד מהמטען, והמתח המשותף $V_0/100$.

      ב. נשאר אחוז אחד מהאנרגיה; 99% ממנה הופכים לחום.
    solution:
      - kind: reasoning
        text: >-
          אחרי החיבור שני הקבלים מחוברים בין אותן שתי נקודות, כלומר במקביל, ולכן המתח עליהם שווה. המטען $C_1V_0$ נשמר, כי אין לו לאן ללכת.
      - kind: reasoning
        text: >-
          א. באותו מתח, לפי $Q = CV$, המטען מתחלק ביחס לקיבולים, $1 : 99$. לכן על $C_1$ נשאר $\tfrac{1}{100}$ מהמטען. המתח הוא המטען חלקי הקיבול הכולל:
          $$V = \frac{C_1V_0}{C_1 + 99\,C_1} = \frac{V_0}{100}$$
      - kind: reasoning
        text: >-
          ב. המטען $Q$ לא השתנה, והקיבול שעליו הוא יושב גדל פי 100, מ-$C_1$ ל-$100\,C_1$. לפי $U = \dfrac{Q^2}{2C}$, באותו $Q$ האנרגיה קטנה פי 100.
      - kind: result
        text: >-
          א. על $C_1$ נשאר אחוז אחד מהמטען, והמתח המשותף $V_0/100$.

          ב. נשאר אחוז אחד מהאנרגיה, ו-99% ממנה הופכים לחום בחוטים.

  - id: W-2.8-03
    level: basic
    qualitative: false
    objectives: [OBJ-2.8-2]
    prompt: >-
      קבל של $3\,\mu\text{F}$ וקבל של $6\,\mu\text{F}$ מחוברים בטור לסוללה. ידוע שהמתח על הקבל של $3\,\mu\text{F}$ הוא $8\,\text{V}$.

      א. מה המטען על כל אחד מהקבלים?

      ב. מה המתח על הקבל של $6\,\mu\text{F}$, ומה המתח של הסוללה?
    answer: >-
      א. $24\,\mu\text{C}$ על כל אחד.

      ב. $4\,\text{V}$ על הקבל של $6\,\mu\text{F}$, והסוללה $12\,\text{V}$.
    solution:
      - kind: given
        text: >-
          $C_1 = 3\,\mu\text{F}$ ו-$C_2 = 6\,\mu\text{F}$ בטור, והמתח על $C_1$ הוא $V_1 = 8\,\text{V}$.
      - kind: formula
        text: >-
          $Q = CV$ לכל קבל. בטור על כל הקבלים אותו מטען, והמתחים מתחברים למתח של הסוללה.
      - kind: substitution
        text: >-
          א. $Q = C_1V_1 = 3\cdot10^{-6}\cdot8 = 2.4\cdot10^{-5}\,\text{C} = 24\,\mu\text{C}$, ואותו מטען על $C_2$.
      - kind: substitution
        text: >-
          ב. $V_2 = \dfrac{Q}{C_2} = \dfrac{24\cdot10^{-6}}{6\cdot10^{-6}} = 4\,\text{V}$, והסוללה: $V = 8 + 4 = 12\,\text{V}$.

          בדיקה: $C_{\text{eq}} = \dfrac{3\cdot6}{3+6} = 2\,\mu\text{F}$, ו-$C_{\text{eq}}V = 2\cdot12 = 24\,\mu\text{C}$, אותו מטען.
      - kind: result
        text: >-
          א. על כל קבל $24\,\mu\text{C}$.

          ב. על הקבל של $6\,\mu\text{F}$ יש $4\,\text{V}$, והמתח של הסוללה $12\,\text{V}$.

  - id: W-2.8-04
    level: mid
    qualitative: false
    objectives: [OBJ-2.8-1]
    prompt: >-
      שני קבלים מחוברים במקביל, והקיבול השקול שלהם $9\,\mu\text{F}$. כשמחברים את אותם שני קבלים בטור, הקיבול השקול הוא $2\,\mu\text{F}$. מה הקיבול של כל אחד מהם?
    answer: '$3\,\mu\text{F}$ ו-$6\,\mu\text{F}$.'
    solution:
      - kind: given
        text: >-
          במקביל $C_1 + C_2 = 9\,\mu\text{F}$, ובטור $\dfrac{C_1C_2}{C_1 + C_2} = 2\,\mu\text{F}$. בהמשך כל הקיבולים במיקרו-פאראד.
      - kind: manipulation
        text: >-
          המכנה של הביטוי לטור הוא בדיוק הסכום, שכבר ידוע: $C_1 + C_2 = 9$. מכפילים את שני האגפים של משוואת הטור ב-$9$:
          $$C_1C_2 = 2\cdot9 = 18$$
          מחפשים שני מספרים שסכומם 9 ומכפלתם 18.
      - kind: manipulation
        text: >-
          מציבים $C_2 = 9 - C_1$ במשוואת המכפלה: $C_1(9 - C_1) = 18$. פותחים סוגריים ומעבירים אגפים:
          $$C_1^2 - 9C_1 + 18 = 0 \quad\Rightarrow\quad (C_1 - 3)(C_1 - 6) = 0$$
      - kind: substitution
        text: >-
          $C_1 = 3$ ואז $C_2 = 6$, או להפך. בדיקה: $3 + 6 = 9$, ו-$\dfrac{3\cdot6}{9} = 2$.
      - kind: result
        text: >-
          הקבלים הם $3\,\mu\text{F}$ ו-$6\,\mu\text{F}$.

  - id: W-2.8-05
    level: mid
    qualitative: true
    objectives: [OBJ-2.8-2, OBJ-2.8-3]
    prompt: >-
      קבל $C_1$ מחובר לסוללה שהמתח שלה $V$, ונטען. משווים בין שני ניסויים.

      א. בניסוי הראשון **משאירים את הסוללה מחוברת**, ומחברים קבל ריק $C_2$ במקביל ל-$C_1$. מה קורה למתח על $C_1$ ולמטען עליו? מאיפה בא המטען שמגיע ל-$C_2$?

      ב. בניסוי השני **מנתקים קודם את הסוללה**, ורק אחר כך מחברים את $C_2$ הריק ל-$C_1$. מה קורה עכשיו למתח על $C_1$ ולמטען עליו?
    answer: >-
      א. המתח על $C_1$ נשאר $V$, והמטען עליו לא משתנה. את המטען $C_2V$ מספקת הסוללה.

      ב. המתח יורד ל-$C_1V/(C_1 + C_2)$, והמטען על $C_1$ קטן: חלק ממנו עובר ל-$C_2$.
    solution:
      - kind: reasoning
        text: >-
          א. הסוללה מחזיקה מתח קבוע בין שני הצדדים שלה, ו-$C_1$ מחובר ישר אליהם. לכן המתח על $C_1$ נשאר $V$, והמטען עליו, $C_1V$, לא משתנה.
          גם $C_2$ מחובר לאותן שתי נקודות, ולכן גם הוא מגיע למתח $V$ ולמטען $C_2V$. המטען הזה לא בא מ-$C_1$, שהמטען שלו לא השתנה, אלא מהסוללה.
      - kind: reasoning
        text: >-
          ב. בלי סוללה אין מקור למטען חדש: המטען $C_1V$ נשמר, ומתחלק בין שני הקבלים עד שהמתח עליהם שווה. הקיבול הכולל גדל ל-$C_1 + C_2$, ולכן המתח יורד ל-$\dfrac{C_1V}{C_1 + C_2}$, והמטען על $C_1$ קטן.
      - kind: result
        text: >-
          א. עם הסוללה: המתח והמטען של $C_1$ לא משתנים, והסוללה מספקת ל-$C_2$ את המטען $C_2V$.

          ב. בלי הסוללה: המתח יורד ל-$C_1V/(C_1 + C_2)$, וחלק מהמטען של $C_1$ עובר ל-$C_2$.

  - id: W-2.8-06
    level: mid
    qualitative: true
    objectives: [OBJ-2.8-3]
    prompt: >-
      יש קבל של $2\,\mu\text{F}$ וקבל של $3\,\mu\text{F}$. בניסוי A טוענים את הקבל של $2\,\mu\text{F}$ ל-$10\,\text{V}$, ומחברים אותו לקבל של $3\,\mu\text{F}$ כשהוא ריק. בניסוי B טוענים דווקא את הקבל של $3\,\mu\text{F}$ ל-$10\,\text{V}$, ומחברים אותו לקבל של $2\,\mu\text{F}$ כשהוא ריק.

      א. קבעו ונמקו: באיזה ניסוי המתח המשותף בסוף גבוה יותר?

      ב. קבעו ונמקו: באיזה ניסוי הולך לאיבוד חלק גדול יותר מהאנרגיה ההתחלתית?

      ג. בדקו את שתי התשובות בחישוב.
    answer: >-
      א. בניסוי B: $6\,\text{V}$, לעומת $4\,\text{V}$ בניסוי A.

      ב. בניסוי A: הולכים לאיבוד 60% מהאנרגיה, לעומת 40% בניסוי B.
    solution:
      - kind: reasoning
        text: >-
          א. בשני הניסויים בסוף אותם שני קבלים במקביל, עם קיבול כולל $5\,\mu\text{F}$. המתח המשותף הוא המטען שנשמר חלקי $5\,\mu\text{F}$. בניסוי B הקבל הטעון גדול יותר, ולכן באותו מתח התחלתי יש בו יותר מטען, והמתח בסוף גבוה יותר.
      - kind: reasoning
        text: >-
          ב. המטען $Q$ נשמר, ולפי $U = \dfrac{Q^2}{2C}$ האנרגיה קטנה פי היחס בין הקיבול שבסוף לקיבול שבהתחלה. בניסוי A הקיבול גדל מ-$2$ ל-$5\,\mu\text{F}$, ולכן נשארים $\tfrac25$ מהאנרגיה. בניסוי B הוא גדל מ-$3$ ל-$5\,\mu\text{F}$, ונשארים $\tfrac35$. בניסוי A הולך לאיבוד חלק גדול יותר.
      - kind: substitution
        text: >-
          ג. ניסוי A: $Q = 2\cdot10 = 20\,\mu\text{C}$, $V = \dfrac{20}{5} = 4\,\text{V}$. האנרגיה לפני $\tfrac12\cdot2\cdot10^{-6}\cdot10^2 = 1.0\cdot10^{-4}\,\text{J}$, ואחרי $\tfrac12\cdot5\cdot10^{-6}\cdot4^2 = 4.0\cdot10^{-5}\,\text{J}$: הלכו לאיבוד 60%.

          ניסוי B: $Q = 3\cdot10 = 30\,\mu\text{C}$, $V = \dfrac{30}{5} = 6\,\text{V}$. לפני $\tfrac12\cdot3\cdot10^{-6}\cdot10^2 = 1.5\cdot10^{-4}\,\text{J}$, ואחרי $\tfrac12\cdot5\cdot10^{-6}\cdot6^2 = 9.0\cdot10^{-5}\,\text{J}$: הלכו לאיבוד 40%.
      - kind: result
        text: >-
          א. המתח המשותף גבוה יותר בניסוי B ($6\,\text{V}$ לעומת $4\,\text{V}$).

          ב. בניסוי A הולך לאיבוד חלק גדול יותר: 60%, לעומת 40% בניסוי B.

  - id: W-2.8-07
    level: mid
    qualitative: false
    objectives: [OBJ-2.8-1, OBJ-2.8-2]
    prompt: >-
      יש שלושה קבלים זהים, כל אחד בקיבול $6\,\mu\text{F}$, וסוללה של $12\,\text{V}$.

      א. יש ארבע דרכים לחבר את שלושת הקבלים יחד: שלושתם בטור; שלושתם במקביל; שניים בטור, והזוג במקביל לשלישי; שניים במקביל, והזוג בטור עם השלישי. מצאו את הקיבול השקול בכל אחת מהן.

      ב. מחברים לסוללה את הרשת האחרונה (זוג במקביל, בטור עם הקבל השלישי). מה המטען והמתח על כל אחד משלושת הקבלים?
    answer: >-
      א. בטור $2\,\mu\text{F}$; במקביל $18\,\mu\text{F}$; זוג בטור במקביל לשלישי $9\,\mu\text{F}$; זוג במקביל בטור עם השלישי $4\,\mu\text{F}$.

      ב. על הקבל הבודד $48\,\mu\text{C}$ ו-$8\,\text{V}$. על כל אחד מהזוג $24\,\mu\text{C}$ ו-$4\,\text{V}$.
    solution:
      - kind: given
        text: >-
          $C = 6\,\mu\text{F}$ לכל קבל, $V = 12\,\text{V}$. בהמשך הקיבולים במיקרו-פאראד.
      - kind: substitution
        text: >-
          א. שלושתם בטור: $\dfrac{1}{C_{\text{eq}}} = \dfrac{3}{6}$, ולכן $C_{\text{eq}} = 2$. שלושתם במקביל: $3\cdot6 = 18$.

          שניים בטור הם $\dfrac{6}{2} = 3$, ובמקביל לשלישי: $3 + 6 = 9$.

          שניים במקביל הם $12$, ובטור עם השלישי: $\dfrac{12\cdot6}{12+6} = 4$.
      - kind: reasoning
        text: >-
          ב. הרשת היא קבל בודד של $6\,\mu\text{F}$ בטור עם הזוג, שהוא קבל שקול של $12\,\mu\text{F}$. בטור על שניהם אותו מטען, שהוא כל המטען מהסוללה.
      - kind: substitution
        text: >-
          $Q = C_{\text{eq}}V = 4\cdot10^{-6}\cdot12 = 4.8\cdot10^{-5}\,\text{C} = 48\,\mu\text{C}$.
          על הקבל הבודד: $V = \dfrac{48}{6} = 8\,\text{V}$. על הזוג: $\dfrac{48}{12} = 4\,\text{V}$, ובדיקה: $8 + 4 = 12\,\text{V}$.
          שני הקבלים של הזוג במקביל, ולכן על כל אחד $4\,\text{V}$, והמטען על כל אחד $6\cdot4 = 24\,\mu\text{C}$.
      - kind: result
        text: >-
          א. $2$, $18$, $9$ ו-$4\,\mu\text{F}$, לפי הסדר בשאלה.

          ב. על הקבל הבודד $48\,\mu\text{C}$ ו-$8\,\text{V}$. על כל אחד משני הקבלים שבמקביל $24\,\mu\text{C}$ ו-$4\,\text{V}$.

  - id: W-2.8-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-2.8-2]
    prompt: >-
      לכל קבל יש מתח מרבי שהיצרן מתיר. במתח גבוה יותר השדה בין הלוחות חזק מדי, והקבל נהרס. לקבל $C_1 = 2\,\mu\text{F}$ מותר מתח של עד $200\,\text{V}$, ולקבל $C_2 = 3\,\mu\text{F}$ מותר מתח של עד $100\,\text{V}$.

      א. מחברים את שני הקבלים בטור. מה המתח הגבוה ביותר של סוללה שאפשר לחבר לשרשרת, בלי שאף אחד מהקבלים ייהרס?

      ב. במתח הזה, מה המטען על כל קבל, ומה האנרגיה הכוללת האגורה בשרשרת?

      ג. מה המתח הגבוה ביותר אם מחברים את שני הקבלים במקביל?
    answer: >-
      א. $250\,\text{V}$.

      ב. $300\,\mu\text{C}$ על כל קבל, ו-$U = 3.75\cdot10^{-2}\,\text{J}$.

      ג. $100\,\text{V}$.
    solution:
      - kind: given
        text: >-
          $C_1 = 2\,\mu\text{F}$, מותר עד $200\,\text{V}$. $C_2 = 3\,\mu\text{F}$, מותר עד $100\,\text{V}$.
      - kind: reasoning
        text: >-
          א. בטור על שני הקבלים אותו מטען $Q$, ולכן $V_1 = Q/C_1$ ו-$V_2 = Q/C_2$. היחס ביניהם $\dfrac{V_2}{V_1} = \dfrac{C_1}{C_2} = \dfrac23$: על הקבל הגדול המתח קטן יותר.
      - kind: manipulation
        text: >-
          מציבים $V_2 = \tfrac23 V_1$ בסכום $V = V_1 + V_2$: $V = \tfrac53 V_1$, ולכן $V_1 = \tfrac35 V$ ו-$V_2 = \tfrac25 V$.
          שני התנאים: $\tfrac35 V \le 200$, כלומר $V$ לכל היותר כ-$333\,\text{V}$; ו-$\tfrac25 V \le 100$, כלומר $V \le 250\,\text{V}$. שניהם חייבים להתקיים, ולכן קובע הקטן מביניהם.
      - kind: substitution
        text: >-
          ב. ב-$250\,\text{V}$: $V_1 = 150\,\text{V}$ (פחות מ-$200\,\text{V}$, תקין) ו-$V_2 = 100\,\text{V}$. המטען $Q = C_2V_2 = 3\cdot10^{-6}\cdot100 = 3\cdot10^{-4}\,\text{C} = 300\,\mu\text{C}$.
          הקיבול השקול $C_{\text{eq}} = \dfrac{2\cdot3}{2+3} = 1.2\,\mu\text{F}$, והאנרגיה:
          $$U = \tfrac12 C_{\text{eq}}V^2 = \tfrac12\cdot1.2\cdot10^{-6}\cdot250^2 = 3.75\cdot10^{-2}\ \text{J}$$
      - kind: reasoning
        text: >-
          ג. במקביל המתח על שני הקבלים שווה למתח של הסוללה, ולכן הוא מוגבל על ידי הקבל עם המתח המותר הנמוך: $100\,\text{V}$.
      - kind: result
        text: >-
          א. $250\,\text{V}$. התשובה $300\,\text{V}$, סכום המתחים המותרים, שגויה: המתח לא מתחלק לפי המתחים המותרים אלא ביחס הפוך לקיבולים.

          ב. על כל קבל $300\,\mu\text{C}$, והאנרגיה הכוללת $3.75\cdot10^{-2}\,\text{J}$.

          ג. $100\,\text{V}$.

  - id: W-2.8-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-2.8-2]
    prompt: >-
      שתי שרשראות של קבלים מחוברות במקביל לסוללה של $12\,\text{V}$. בשרשרת הראשונה שני קבלים של $2\,\mu\text{F}$ בטור, ונקודת החיבור ביניהם היא M. בשרשרת השנייה קבל של $3\,\mu\text{F}$ בטור עם קבל של $6\,\mu\text{F}$, ונקודת החיבור ביניהם היא N. הקבל של $3\,\mu\text{F}$ מחובר לצד החיובי של הסוללה.

      א. מה המטען והמתח על כל אחד מארבעת הקבלים?

      ב. הצד השלילי של הסוללה הוא נקודת הייחוס, שבה הפוטנציאל אפס. מה הפוטנציאל בנקודה M ובנקודה N? איזו מהן בפוטנציאל גבוה יותר, ובכמה?

      ג. מחליפים רק את הקבל של $6\,\mu\text{F}$ בקבל אחר. מה צריך להיות הקיבול שלו כדי שהפוטנציאל של M ושל N יהיה שווה?
    answer: >-
      א. בשרשרת הראשונה $12\,\mu\text{C}$ ו-$6\,\text{V}$ על כל קבל. בשנייה $24\,\mu\text{C}$ על כל קבל, $8\,\text{V}$ על הקבל של $3\,\mu\text{F}$ ו-$4\,\text{V}$ על הקבל של $6\,\mu\text{F}$.

      ב. $V_M = 6\,\text{V}$ ו-$V_N = 4\,\text{V}$: הפוטנציאל של M גבוה ב-$2\,\text{V}$.

      ג. $3\,\mu\text{F}$.
    solution:
      - kind: reasoning
        text: >-
          כל שרשרת מחוברת ישר לשני הצדדים של הסוללה, ולכן על כל שרשרת $12\,\text{V}$. אפשר לטפל בכל שרשרת לחוד, כאילו השנייה לא קיימת.
      - kind: substitution
        text: >-
          א. שרשרת ראשונה: $C_{\text{eq}} = \dfrac{2}{2} = 1\,\mu\text{F}$, ולכן $Q = 1\cdot12 = 12\,\mu\text{C}$ על כל קבל. הקבלים זהים, ולכן המתח מתחלק שווה: $6\,\text{V}$ על כל אחד.

          שרשרת שנייה: $C_{\text{eq}} = \dfrac{3\cdot6}{3+6} = 2\,\mu\text{F}$, ולכן $Q = 2\cdot12 = 24\,\mu\text{C}$ על כל קבל. $V = \dfrac{24}{3} = 8\,\text{V}$ על הקבל של $3\,\mu\text{F}$, ו-$\dfrac{24}{6} = 4\,\text{V}$ על הקבל של $6\,\mu\text{F}$.
      - kind: reasoning
        text: >-
          ב. הצד החיובי של הסוללה בפוטנציאל $12\,\text{V}$. כשעוברים מהצד החיובי דרך הקבל הראשון בשרשרת, הפוטנציאל יורד במתח שעל הקבל.
          $V_M = 12 - 6 = 6\,\text{V}$, ו-$V_N = 12 - 8 = 4\,\text{V}$. בדיקה מהצד השני: N נמצאת $4\,\text{V}$ מעל הצד השלילי, דרך הקבל של $6\,\mu\text{F}$.
      - kind: reasoning
        text: >-
          ג. כדי ש-$V_N = 6\,\text{V}$, המתח צריך להתחלק שווה בשרשרת השנייה. בטור המתח מתחלק ביחס הפוך לקיבולים, ולכן הוא מתחלק שווה רק כשהקיבולים שווים: הקבל החדש צריך להיות $3\,\mu\text{F}$.
      - kind: result
        text: >-
          א. בשרשרת הראשונה $12\,\mu\text{C}$ ו-$6\,\text{V}$ על כל קבל. בשנייה $24\,\mu\text{C}$ על כל קבל, $8\,\text{V}$ על הקבל של $3\,\mu\text{F}$ ו-$4\,\text{V}$ על הקבל של $6\,\mu\text{F}$.

          ב. $V_M = 6\,\text{V}$, $V_N = 4\,\text{V}$, והפוטנציאל של M גבוה מזה של N ב-$2\,\text{V}$.

          ג. $3\,\mu\text{F}$.

  - id: W-2.8-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-2.8-3]
    prompt: >-
      קבל $C_1 = 4\,\mu\text{F}$ נטען ל-$12\,\text{V}$ ומנותק מהסוללה.

      א. מחברים אליו קבל ריק $C_2 = 2\,\mu\text{F}$. מה המתח המשותף?

      ב. מנתקים את $C_2$, מרוקנים אותו (מחברים את שני הלוחות שלו בחוט, עד שלא נשאר עליו מטען), ומחברים אותו שוב ל-$C_1$. מה המתח המשותף עכשיו?

      ג. כמה אנרגיה חשמלית הפכה לחום בסך הכול, מההתחלה ועד סוף סעיף ב?

      ד. חוזרים שוב ושוב על הריקון של $C_2$ ועל החיבור מחדש. אחרי כמה חיבורים, כולל הראשון, יורד המתח על $C_1$ לראשונה מתחת ל-$1\,\text{V}$?
    answer: >-
      א. $8\,\text{V}$.

      ב. $5.33\,\text{V}$.

      ג. $2.03\cdot10^{-4}\,\text{J}$.

      ד. אחרי 7 חיבורים.
    solution:
      - kind: given
        text: >-
          $C_1 = 4\,\mu\text{F}$, $V_0 = 12\,\text{V}$, $C_2 = 2\,\mu\text{F}$ ריק לפני כל חיבור.
      - kind: formula
        text: >-
          המטען של $C_1$ נשמר בכל חיבור, ומתחלק עד שהמתח שווה. אם לפני החיבור המתח על $C_1$ הוא $V'$, המטען שלו $C_1V'$, ואחרי החיבור $V = \dfrac{C_1V'}{C_1 + C_2}$. כאן $\dfrac{C_1}{C_1 + C_2} = \dfrac46 = \dfrac23$: כל חיבור מוריד את המתח לשני שלישים.
      - kind: substitution
        text: >-
          א. $V_1 = \tfrac23\cdot12 = 8\,\text{V}$.

          ב. אחרי הריקון $C_2$ שוב ריק, ו-$C_1$ נשאר עם $8\,\text{V}$. לכן $V_2 = \tfrac23\cdot8 = \tfrac{16}{3} \approx 5.33\,\text{V}$.
      - kind: substitution
        text: >-
          ג. האנרגיה בהתחלה: $\tfrac12\cdot4\cdot10^{-6}\cdot12^2 = 2.88\cdot10^{-4}\,\text{J}$. בסוף סעיף ב שני הקבלים במתח $\tfrac{16}{3}\,\text{V}$ (בחישוב משתמשים בשבר, לא בערך המעוגל):
          $$U = \tfrac12\cdot6\cdot10^{-6}\cdot\left(\tfrac{16}{3}\right)^2 = 8.53\cdot10^{-5}\ \text{J}$$
          לחום הפכו $2.88\cdot10^{-4} - 0.853\cdot10^{-4} = 2.03\cdot10^{-4}\,\text{J}$. זה כולל את האנרגיה של $C_2$ שהפכה לחום בריקון, $\tfrac12\cdot2\cdot10^{-6}\cdot8^2 = 6.4\cdot10^{-5}\,\text{J}$.
      - kind: reasoning
        text: >-
          ד. אחרי $n$ חיבורים $V_n = 12\cdot\left(\tfrac23\right)^n$. אחרי 6 חיבורים $V_6 = 12\cdot\tfrac{64}{729} \approx 1.05\,\text{V}$, עדיין מעל $1\,\text{V}$. אחרי 7 חיבורים $V_7 = \tfrac23\cdot1.05 \approx 0.70\,\text{V}$.
      - kind: result
        text: >-
          א. $8\,\text{V}$.

          ב. $\tfrac{16}{3} \approx 5.33\,\text{V}$.

          ג. $2.03\cdot10^{-4}\,\text{J}$ הפכו לחום.

          ד. אחרי 7 חיבורים.

challenge:
  - id: W-2.8-c1
    stars: 1
    objectives: [OBJ-2.8-2]
    prompt: >-
      שלושה קבלים, $C_1 = 2\,\mu\text{F}$, $C_2 = 3\,\mu\text{F}$ ו-$C_3 = 1\,\mu\text{F}$, נפגשים בנקודה X: לוח אחד של כל קבל מחובר ל-X. הלוח השני של $C_3$ מחובר לחוט משותף שהפוטנציאל שלו אפס. הלוח השני של $C_1$ מחובר לצד החיובי של סוללה A, שהמתח שלה $V_A = 12\,\text{V}$, והלוח השני של $C_2$ מחובר לצד החיובי של סוללה B, שהמתח שלה $V_B = 6\,\text{V}$. הצד השלילי של שתי הסוללות מחובר לחוט המשותף. לפני שחיברו את הסוללות כל הקבלים היו ריקים.

      א. הסבירו למה המטען הכולל על שלושת הלוחות שמחוברים ל-X הוא אפס.

      ב. נסמן את הפוטנציאל של X ב-$V_X$. כתבו את המטען על כל אחד משלושת הלוחות האלה בעזרת $V_X$, ומצאו ביטוי ל-$V_X$ בעזרת הקיבולים והמתחים של הסוללות.

      ג. מה המתח והמטען על כל קבל? איזה מהלוחות של $C_2$ טעון בחיוב?
