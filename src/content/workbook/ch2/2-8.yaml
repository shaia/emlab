    diagramAlt: >-
      מעגל מלבני. בחוט העליון שני קבלים, C1 משמאל ו-C2 מימין, וביניהם הנקודה X. מ-X יורד קבל C3 אל החוט התחתון, שהפוטנציאל שלו אפס. בצלע השמאלית סוללה A של 12 וולט, ובצלע הימנית סוללה B של 6 וולט. בשתיהן הקו הארוך, הצד החיובי, למעלה.
    answer: >-
      א. X ושלושת הלוחות שמחוברים אליה הם מוליך מבודד שהתחיל בלי מטען, ולכן המטען הכולל שלו נשאר אפס.

      ב. $V_X = \dfrac{C_1V_A + C_2V_B}{C_1 + C_2 + C_3}$.

      ג. $V_X = 7\,\text{V}$. על $C_1$: $5\,\text{V}$ ו-$10\,\mu\text{C}$. על $C_2$: $1\,\text{V}$ ו-$3\,\mu\text{C}$. על $C_3$: $7\,\text{V}$ ו-$7\,\mu\text{C}$. הלוח של $C_2$ שמחובר ל-X הוא החיובי.
    solution:
      - kind: reasoning
        text: >-
          א. בין X לשאר המעגל יש רק רווחים בין לוחות של קבלים, ומטען לא עובר דרכם. לכן X, החוטים שלה ושלושת הלוחות הם מוליך מבודד. בהתחלה לא היה עליו מטען, ומטען נשמר, ולכן המטען הכולל עליו נשאר אפס. זה אותו נימוק כמו בלוחות הפנימיים של קבלים בטור.
      - kind: formula
        text: >-
          על כל לוח של קבל יש מטען $C$ כפול הפוטנציאל של הלוח פחות הפוטנציאל של הלוח שמולו. החיבור של כל לוח קובע את הפוטנציאל שלו: הלוח שמול X בקבל $C_1$ נמצא ב-$V_A$, זה שב-$C_2$ נמצא ב-$V_B$, וזה שב-$C_3$ נמצא ב-$0$.
      - kind: manipulation
        text: >-
          ב. המטענים על שלושת הלוחות שב-X הם $C_1(V_X - V_A)$, $C_2(V_X - V_B)$ ו-$C_3V_X$, וסכומם אפס:
          $$C_1(V_X - V_A) + C_2(V_X - V_B) + C_3V_X = 0$$
          מעבירים את האיברים שאין בהם $V_X$ לאגף ימין, ומחלקים בסכום הקיבולים כדי לבודד את $V_X$:
          $$V_X = \frac{C_1V_A + C_2V_B}{C_1 + C_2 + C_3}$$
          בדיקה: אם $V_A = V_B = V$ ו-$C_3$ שואף לאפס, מתקבל $V_X = V$, ואז אין מתח על $C_1$ ועל $C_2$, כפי שצריך.
      - kind: substitution
        text: >-
          ג. $V_X = \dfrac{2\cdot12 + 3\cdot6}{2+3+1} = \dfrac{42}{6} = 7\,\text{V}$.
          על $C_1$: $12 - 7 = 5\,\text{V}$, ו-$2\cdot5 = 10\,\mu\text{C}$; הלוח שליד סוללה A חיובי.
          על $C_2$: $7 - 6 = 1\,\text{V}$, ו-$3\cdot1 = 3\,\mu\text{C}$; X בפוטנציאל גבוה יותר מהצד החיובי של סוללה B, ולכן הלוח שב-X הוא החיובי.
          על $C_3$: $7\,\text{V}$ ו-$7\,\mu\text{C}$.
          בדיקה: על הלוחות שב-X יש $-10 + 3 + 7 = 0\,\mu\text{C}$.
      - kind: result
        text: >-
          א. X ושלושת הלוחות הם מוליך מבודד שהתחיל ניטרלי.

          ב. $V_X = \dfrac{C_1V_A + C_2V_B}{C_1 + C_2 + C_3}$.

          ג. $C_1$: $5\,\text{V}$, $10\,\mu\text{C}$. $C_2$: $1\,\text{V}$, $3\,\mu\text{C}$, והלוח החיובי שלו הוא זה שב-X, אף שהוא מחובר לצד החיובי של סוללה B. $C_3$: $7\,\text{V}$, $7\,\mu\text{C}$.
    source:
      name: British Physics Olympiad (BPhO), Round 1
      year: 2023
      problem: 'Round 1, 10 November 2023, Section 1, Question 1(q)'
      url: https://www.bpho.org.uk/Papers/R1/2023Nov_R1_S1.pdf
      verified: '2026-11-02'
      adapted: true

  - id: W-2.8-c2
    stars: 2
    objectives: [OBJ-2.8-1]
    prompt: >-
      ארבעה לוחות מתכת דקים וזהים, ריבועים שהצלע שלהם $a = 10\,\text{cm}$, עומדים במקביל זה לזה, בשורה, והמרחק בין כל שני לוחות סמוכים הוא $d = 1\,\text{mm}$. ממספרים אותם 1, 2, 3, 4 לפי הסדר. נסמן $C_0 = \dfrac{\varepsilon_0a^2}{d}$, הקיבול של שני לוחות סמוכים לבד. התעלמו משדות השוליים. ($\varepsilon_0 = 8.85\cdot10^{-12}\,\text{C}^2/(\text{N}\cdot\text{m}^2)$)

      א. חשבו את $C_0$.

      ב. מה הקיבול בין לוח 1 ללוח 4, כשלוחות 2 ו-3 לא מחוברים לשום דבר?

      ג. מה הקיבול בין לוח 1 ללוח 4, כשלוח 2 מחובר בחוט ללוח 3?

      ד. מה הקיבול בין לוח 1 ללוח 3, כשלוח 2 מחובר בחוט ללוח 4?

      ה. מה הקיבול בין לוח 1 ללוח 2, כשלוח 3 מחובר בחוט ללוח 1, ולוח 4 מחובר בחוט ללוח 2?
    answer: >-
      א. $C_0 = 8.85\cdot10^{-11}\,\text{F}$.

      ב. $C_0/3 \approx 2.95\cdot10^{-11}\,\text{F}$.

      ג. $C_0/2 \approx 4.43\cdot10^{-11}\,\text{F}$.

      ד. $2C_0/3 = 5.90\cdot10^{-11}\,\text{F}$.

      ה. $3C_0 \approx 2.66\cdot10^{-10}\,\text{F}$.
    solution:
      - kind: substitution
        text: >-
          א. $a^2 = 0.1^2 = 10^{-2}\,\text{m}^2$, $d = 10^{-3}\,\text{m}$, ו-$d$ קטן בהרבה מ-$a$, ולכן אפשר להתעלם משדות השוליים:
          $$C_0 = \frac{8.85\cdot10^{-12}\cdot10^{-2}}{10^{-3}} = 8.85\cdot10^{-11}\ \text{F}$$
      - kind: reasoning
        text: >-
          הרעיון: כל רווח בין שני לוחות סמוכים הוא קבל $C_0$. ללוח פנימי יש שני צדדים, וכל צד הוא לוח של קבל אחר. מה שנשאר הוא לבדוק, לפי החוטים, בין אילו שתי נקודות מחובר כל אחד משלושת הרווחים: 1–2, 2–3 ו-3–4.
      - kind: reasoning
        text: >-
          ב. לוחות 2 ו-3 מבודדים וניטרליים, בדיוק כמו הלוחות הפנימיים של קבלים בטור. שלושת הרווחים הם שלושה קבלים $C_0$ בטור: $\dfrac{1}{C} = \dfrac{3}{C_0}$, ולכן $C = \dfrac{C_0}{3} \approx 2.95\cdot10^{-11}\,\text{F}$.
      - kind: reasoning
        text: >-
          ג. לוחות 2 ו-3 מחוברים, ולכן הם באותו פוטנציאל. בין שני לוחות באותו פוטנציאל אין מתח, ולכן אין ביניהם שדה ואין מטען על הצדדים שפונים זה לזה: הרווח 2–3 לא משתתף. נשארים 1–2 ו-3–4, מחוברים בטור דרך החוט: $C = \dfrac{C_0}{2} \approx 4.43\cdot10^{-11}\,\text{F}$.
      - kind: reasoning
        text: >-
          ד. מודדים את הקיבול בין לוח 1 ללוח 3. לוחות 2 ו-4 מחוברים, ונקרא לזוג הזה Y. הרווח 1–2 מחובר בין לוח 1 ל-Y. הרווח 2–3 מחובר בין Y ללוח 3, וגם הרווח 3–4 מחובר בין לוח 3 ל-Y. כלומר בין Y ללוח 3 יש שני קבלים במקביל, $2C_0$, והם בטור עם $C_0$ שבין לוח 1 ל-Y:
          $$C = \frac{C_0\cdot2C_0}{C_0 + 2C_0} = \frac{2C_0}{3} = 5.90\cdot10^{-11}\ \text{F}$$
      - kind: reasoning
        text: >-
          ה. עכשיו לוחות 1 ו-3 מחוברים, והם צד אחד של הקבל השקול. לוחות 2 ו-4 מחוברים, והם הצד השני. כל אחד משלושת הרווחים, 1–2, 2–3 ו-3–4, מחובר בין לוח מהזוג הראשון ללוח מהזוג השני. שלושה קבלים $C_0$ במקביל: $C = 3C_0 \approx 2.66\cdot10^{-10}\,\text{F}$.
      - kind: result
        text: >-
          א. $C_0 = 8.85\cdot10^{-11}\,\text{F}$.

          ב. $C_0/3 \approx 2.95\cdot10^{-11}\,\text{F}$.

          ג. $C_0/2 \approx 4.43\cdot10^{-11}\,\text{F}$.

          ד. $2C_0/3 = 5.90\cdot10^{-11}\,\text{F}$.

          ה. $3C_0 \approx 2.66\cdot10^{-10}\,\text{F}$.
