# Workbook for lesson 2.1: ten practice problems and two sourced challenge problems.
# Every number recomputed with src/physics (constants.ts, potential.ts: pairEnergy, uniformWork,
# workAlongPath).

lesson: '2.1'
practice:
  - id: W-2.1-01
    level: basic
    qualitative: false
    objectives: [OBJ-2.1-1]
    prompt: >-
      בין שני לוחות אופקיים יש שדה חשמלי אחיד שעוצמתו $1.5\cdot10^{4}\,\text{N/C}$, כלפי מעלה.
      גרגר אבק שמטענו $q = -4\,\text{nC}$ יורד $2$ ס"מ אנכית בין הלוחות.
      כמה עבודה עשה השדה החשמלי על הגרגר? קבעו גם את הסימן שלה.
    answer: '$+1.2\cdot10^{-6}\,\text{J}$ (עבודה חיובית)'
    solution:
      - kind: given
        text: >-
          $q = -4\cdot10^{-9}\,\text{C}$, $E = 1.5\cdot10^{4}\,\text{N/C}$ כלפי מעלה. הגרגר יורד $0.02\,\text{m}$.
      - kind: reasoning
        text: >-
          הגרגר שלילי, ולכן הכוח החשמלי עליו הפוך לשדה: כלפי מטה. הגרגר יורד, כלומר זז בכיוון הכוח, ולכן העבודה חיובית.
      - kind: formula
        text: >-
          $W = qEd$, כאשר $d$ הוא ההעתק בכיוון השדה, עם סימן. השדה כלפי מעלה והגרגר יורד, ולכן $d = -0.02\,\text{m}$.
      - kind: substitution
        text: >-
          $W = (-4\cdot10^{-9})\cdot 1.5\cdot10^{4}\cdot(-0.02) = +1.2\cdot10^{-6}\,\text{J}$.
      - kind: result
        text: >-
          השדה עשה על הגרגר עבודה חיובית של $1.2\cdot10^{-6}\,\text{J}$. שני הסימנים השליליים (של המטען ושל ההעתק) מתבטלים, ומתאימים לכך שהגרגר זז בכיוון הכוח.

  - id: W-2.1-02
    level: basic
    qualitative: true
    objectives: [OBJ-2.1-1]
    prompt: >-
      בשדה חשמלי אחיד שמצביע ימינה זזים ארבעה מטענים. קבעו ונמקו, בלי לחשב, את הסימן של העבודה שהשדה עושה על כל אחד מהם:

      (1) מטען חיובי זז שמאלה.

      (2) מטען שלילי זז למעלה.

      (3) מטען שלילי זז שמאלה.

      (4) מטען חיובי זז באלכסון, ימינה ולמעלה.
    answer: >-
      (1) שלילית. (2) אפס. (3) חיובית. (4) חיובית.
    solution:
      - kind: reasoning
        text: >-
          קודם קובעים את כיוון הכוח: על מטען חיובי הכוח בכיוון השדה, ימינה, ועל מטען שלילי הכוח הפוך לשדה, שמאלה. אחר כך בודקים את הרכיב של ההעתק בכיוון הכוח.
      - kind: reasoning
        text: >-
          (1) הכוח ימינה וההעתק שמאלה, נגד הכוח: העבודה שלילית.
          (2) ההעתק למעלה, ניצב לכוח האופקי: העבודה אפס, אף שהמטען שלילי.
          (3) הכוח שמאלה וההעתק שמאלה, בכיוון הכוח: העבודה חיובית.
          (4) לרכיב האנכי של ההעתק אין עבודה. הרכיב האופקי ימינה, בכיוון הכוח: העבודה חיובית.
      - kind: result
        text: >-
          (1) שלילית. (2) אפס. (3) חיובית. (4) חיובית. הסימן נקבע לפי כיוון התזוזה ביחס **לכוח**, לא ביחס לשדה.

  - id: W-2.1-03
    level: basic
    qualitative: false
    objectives: [OBJ-2.1-3]
    prompt: >-
      בגרעין של אטום, שני פרוטונים נמצאים במרחק של כ-$3\cdot10^{-15}\,\text{m}$ זה מזה.

      (א) מה האנרגיה הפוטנציאלית החשמלית של הזוג (עם $U = 0$ במרחק אינסופי)?

      (ב) מה אומר הסימן שלה על הכוח החשמלי ביניהם, ועל מה שצריך כדי שהגרעין לא יתפרק?
    answer: >-
      (א) $U \approx 7.7\cdot10^{-14}\,\text{J}$, חיובית.

      (ב) הפרוטונים דוחים זה את זה. כדי שהגרעין לא יתפרק צריך כוח נוסף, לא חשמלי, שמחזיק אותם יחד.
    solution:
      - kind: given
        text: >-
          $q_1 = q_2 = e = 1.6\cdot10^{-19}\,\text{C}$, $r = 3\cdot10^{-15}\,\text{m}$.
      - kind: formula
        text: >-
          $U = \dfrac{kq_1q_2}{r}$.
      - kind: substitution
        text: >-
          $$U = \frac{9\cdot10^{9}\cdot 1.6\cdot10^{-19}\cdot 1.6\cdot10^{-19}}{3\cdot10^{-15}} = 7.68\cdot10^{-14}\ \text{J}$$
      - kind: reasoning
        text: >-
          (ב) $U$ חיובית, כי שני המטענים חיוביים: הם דוחים זה את זה. אילו הכוח החשמלי היה הכוח היחיד, השדה היה מרחיק אותם זה מזה, $U$ הייתה יורדת לאפס, והאנרגיה הייתה הופכת לאנרגיה קינטית. הגרעין יציב, ולכן פועל בו כוח נוסף שמושך את הפרוטונים זה אל זה.
      - kind: result
        text: >-
          (א) $U \approx 7.7\cdot10^{-14}\,\text{J}$.

          (ב) $U > 0$: הפרוטונים דוחים זה את זה, ובגרעין חייב לפעול עוד כוח, שמחזיק אותם יחד.

  - id: W-2.1-04
    level: mid
    qualitative: false
    objectives: [OBJ-2.1-1, OBJ-2.1-2]
    prompt: >-
      בשדה אחיד $E = 2\cdot10^{3}\,\text{N/C}$ שמצביע ימינה, מטען $q = -6\,\mu\text{C}$ יוצא מנקודה A ועובר ארבעה קטעים ישרים, בזה אחר זה:
      $10$ ס"מ למעלה, $30$ ס"מ ימינה, $10$ ס"מ למטה, ו-$50$ ס"מ שמאלה.

      (א) חשבו את העבודה של השדה בכל קטע.

      (ב) מה העבודה הכוללת? בדקו שהיא שווה לעבודה בדרך ישרה מ-A לנקודת הסיום.

      (ג) מה השינוי באנרגיה הפוטנציאלית של המערכת?
    answer: >-
      (א) $0$, $-3.6\cdot10^{-3}\,\text{J}$, $0$, $+6.0\cdot10^{-3}\,\text{J}$.

      (ב) $+2.4\cdot10^{-3}\,\text{J}$.

      (ג) $\Delta U = -2.4\cdot10^{-3}\,\text{J}$.
    solution:
      - kind: given
        text: >-
          $q = -6\cdot10^{-6}\,\text{C}$, $E = 2\cdot10^{3}\,\text{N/C}$ ימינה. ההעתקים בכיוון השדה: $0$, $+0.3\,\text{m}$, $0$, $-0.5\,\text{m}$.
      - kind: formula
        text: >-
          לכל קטע $W = qEd$, כאשר $d$ הוא ההעתק בכיוון השדה, עם סימן. $qE = (-6\cdot10^{-6})\cdot 2\cdot10^{3} = -1.2\cdot10^{-2}\,\text{N}$: הכוח על המטען השלילי פונה שמאלה.
      - kind: substitution
        text: >-
          (א) בקטעים האנכיים ההעתק ניצב לשדה: $W = 0$.
          בקטע ימינה: $W = (-1.2\cdot10^{-2})\cdot 0.3 = -3.6\cdot10^{-3}\,\text{J}$, כי המטען זז נגד הכוח.
          בקטע שמאלה: $W = (-1.2\cdot10^{-2})\cdot(-0.5) = +6.0\cdot10^{-3}\,\text{J}$, כי המטען זז בכיוון הכוח.
      - kind: substitution
        text: >-
          (ב) $W = 0 - 3.6\cdot10^{-3} + 0 + 6.0\cdot10^{-3} = 2.4\cdot10^{-3}\,\text{J}$.
          נקודת הסיום נמצאת בגובה של A, $0.2\,\text{m}$ משמאל לה ($0.3 - 0.5 = -0.2$). בדרך ישרה: $W = (-1.2\cdot10^{-2})\cdot(-0.2) = 2.4\cdot10^{-3}\,\text{J}$, אותה עבודה, כי השדה משמר.
      - kind: substitution
        text: >-
          (ג) $\Delta U = -W = -2.4\cdot10^{-3}\,\text{J}$.
      - kind: result
        text: >-
          (א) $0$, $-3.6\cdot10^{-3}\,\text{J}$, $0$, $+6.0\cdot10^{-3}\,\text{J}$.

          (ב) $+2.4\cdot10^{-3}\,\text{J}$, כמו בדרך הישרה, אף שהמסלול ארוך פי 5 ממנה ($1.0\,\text{m}$ לעומת $0.2\,\text{m}$).

          (ג) $\Delta U = -2.4\cdot10^{-3}\,\text{J}$.

  - id: W-2.1-05
    level: mid
    qualitative: true
    objectives: [OBJ-2.1-2]
    prompt: >-
      תלמידה מציירת "שדה חשמלי" שקווי השדה שלו הם מעגלים סגורים סביב נקודה מרכזית, וכולם מסתובבים באותו כיוון, נגד כיוון השעון.

      (א) מטען בוחן חיובי מקיף פעם אחת את אחד המעגלים, בכיוון של קווי השדה. מה הסימן של העבודה שהשדה הזה עושה עליו בסיבוב?

      (ב) הסבירו למה שדה כזה לא יכול להיות שדה משמר.

      (ג) הסבירו למה מטענים במנוחה לא יכולים ליצור שדה כזה.
    answer: >-
      (א) חיובית.

      (ב) במסלול סגור העבודה של שדה משמר היא אפס, וכאן היא חיובית.

      (ג) השדה של מטענים במנוחה משמר, ולכן הוא לא יכול לעשות עבודה חיובית במסלול סגור.
    solution:
      - kind: reasoning
        text: >-
          (א) בכל נקודה על המעגל השדה משיק למעגל, בכיוון התנועה של המטען. המטען חיובי, ולכן הכוח עליו בכיוון השדה, כלומר בכיוון התנועה. בכל צעד קטן העבודה חיובית, ולכן גם הסכום שלהם בסיבוב שלם חיובי.
      - kind: reasoning
        text: >-
          (ב) המטען חזר לנקודת ההתחלה, ולכן זה מסלול סגור. בשדה משמר העבודה במסלול סגור היא אפס: $W = U_A - U_A = 0$. כאן היא חיובית, ולכן אי אפשר לשייך לכל מקום ערך אחד של אנרגיה פוטנציאלית: אחרי כל סיבוב המטען היה "מרוויח" אנרגיה, באותה נקודה בדיוק.
      - kind: reasoning
        text: >-
          (ג) בשיעור ראינו שהשדה של מטען נקודתי משמר, והשדה של כמה מטענים הוא סכום השדות שלהם (עקרון הסופרפוזיציה). העבודה של סכום כוחות היא סכום העבודות, ולכן גם השדה של כמה מטענים במנוחה משמר: במסלול סגור העבודה שלו אפס, ולא חיובית.
      - kind: result
        text: >-
          (א) העבודה חיובית.

          (ב) שדה משמר עושה במסלול סגור עבודה אפס, ולכן השדה המצויר לא משמר.

          (ג) מטענים במנוחה יוצרים רק שדה משמר, ולכן קווי השדה שלהם לא יכולים להיות מעגלים סגורים שהמטען מקיף בכיוונם. (בפרק 5 נפגוש שדה חשמלי שקווי השדה שלו סגורים: הוא לא נוצר ממטענים במנוחה.)

  - id: W-2.1-06
    level: mid
    qualitative: false
    objectives: [OBJ-2.1-3, OBJ-2.1-2]
    prompt: >-
      מטען $q_1 = +3\,\mu\text{C}$ ומטען $q_2 = -6\,\mu\text{C}$ נמצאים במרחק כזה זה מזה, שהאנרגיה הפוטנציאלית של הזוג היא $-0.9\,\text{J}$.

      (א) מה המרחק ביניהם?

      (ב) מקרבים את המטענים עד חצי מהמרחק הזה. מה האנרגיה הפוטנציאלית עכשיו?

      (ג) כמה עבודה עשה השדה החשמלי בזמן הקירוב, ומה הסימן שלה?
    answer: >-
      (א) $18$ ס"מ.

      (ב) $-1.8\,\text{J}$.

      (ג) $+0.9\,\text{J}$.
    solution:
      - kind: given
        text: >-
          $q_1 = 3\cdot10^{-6}\,\text{C}$, $q_2 = -6\cdot10^{-6}\,\text{C}$, $U = -0.9\,\text{J}$.
      - kind: formula
        text: >-
          $U = \dfrac{kq_1q_2}{r}$.
      - kind: manipulation
        text: >-
          (א) הנעלם הוא $r$. כופלים את שני האגפים ב-$r$ ומחלקים ב-$U$: $r = \dfrac{kq_1q_2}{U}$.
      - kind: substitution
        text: >-
          $$r = \frac{9\cdot10^{9}\cdot 3\cdot10^{-6}\cdot(-6\cdot10^{-6})}{-0.9} = \frac{-0.162}{-0.9} = 0.18\ \text{m}$$
          שני הסימנים השליליים מתבטלים, והמרחק חיובי, כמו שצריך.
      - kind: reasoning
        text: >-
          (ב) $U$ הפוכה למרחק: כשהמרחק קטן פי 2, $U$ גדלה בגודלה פי 2. $U_f = 2\cdot(-0.9) = -1.8\,\text{J}$.
      - kind: substitution
        text: >-
          (ג) $W = U_i - U_f = -0.9 - (-1.8) = +0.9\,\text{J}$.
      - kind: result
        text: >-
          (א) $r = 0.18\,\text{m}$, כלומר $18$ ס"מ.

          (ב) $U = -1.8\,\text{J}$: היא קטנה, כי נעשתה שלילית יותר.

          (ג) השדה עשה עבודה חיובית של $0.9\,\text{J}$: המטענים מושכים זה את זה, והם התקרבו בכיוון הכוח.

  - id: W-2.1-07
    level: mid
    qualitative: false
    objectives: [OBJ-2.1-1, OBJ-2.1-2]
    prompt: >-
      מטען $q = +2\,\mu\text{C}$ עובר בשדה אחיד מנקודה A לנקודה B, בקו ישר באורך $25$ ס"מ, שיוצר זווית של $60^\circ$ עם כיוון השדה.
      השדה עושה עליו עבודה של $1.5\cdot10^{-3}\,\text{J}$.

      (א) מה עוצמת השדה?

      (ב) המטען חוזר מ-B ל-A במסלול אחר, מעוקל. כמה עבודה עושה השדה בדרך חזרה?

      (ג) מה השינוי באנרגיה הפוטנציאלית בדרך הלוך, ומה בסיבוב השלם?
    answer: >-
      (א) $6\cdot10^{3}\,\text{N/C}$.

      (ב) $-1.5\cdot10^{-3}\,\text{J}$.

      (ג) $-1.5\cdot10^{-3}\,\text{J}$ בדרך הלוך, ואפס בסיבוב השלם.
    solution:
      - kind: given
        text: >-
          $q = 2\cdot10^{-6}\,\text{C}$, אורך הקטע $0.25\,\text{m}$, הזווית עם השדה $60^\circ$, $W_{A\to B} = 1.5\cdot10^{-3}\,\text{J}$.
      - kind: formula
        text: >-
          $W = qEd$, כאשר $d$ הוא הרכיב של ההעתק בכיוון השדה: $d = 0.25\cos 60^\circ = 0.125\,\text{m}$.
      - kind: manipulation
        text: >-
          (א) הנעלם הוא $E$. מחלקים את שני האגפים ב-$qd$: $E = \dfrac{W}{qd}$.
      - kind: substitution
        text: >-
          $$E = \frac{1.5\cdot10^{-3}}{2\cdot10^{-6}\cdot 0.125} = 6\cdot10^{3}\ \text{N/C}$$
      - kind: reasoning
        text: >-
          (ב) השדה משמר, ולכן העבודה מ-B ל-A לא תלויה במסלול. בסיבוב השלם A, B, A העבודה אפס, ולכן $W_{B\to A} = -W_{A\to B} = -1.5\cdot10^{-3}\,\text{J}$.
      - kind: reasoning
        text: >-
          (ג) $\Delta U_{A\to B} = -W_{A\to B} = -1.5\cdot10^{-3}\,\text{J}$. בסיבוב השלם המטען חזר ל-A, ולכן $U$ חזרה לערך ההתחלתי: $\Delta U = 0$.
      - kind: result
        text: >-
          (א) $E = 6\cdot10^{3}\,\text{N/C}$.

          (ב) $-1.5\cdot10^{-3}\,\text{J}$, בכל מסלול חזרה.

          (ג) בדרך הלוך $\Delta U = -1.5\cdot10^{-3}\,\text{J}$, ובסיבוב השלם $\Delta U = 0$.

  - id: W-2.1-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-2.1-3, OBJ-2.1-2]
    prompt: >-
      על ציר x מקובעים שני מטענים: $q_1 = +2\,\mu\text{C}$ בראשית, ו-$q_2 = -2\,\mu\text{C}$ בנקודה $x = 0.4\,\text{m}$.
      מטען $q = +1\,\mu\text{C}$ עובר מהנקודה P, ב-$x = 0.1\,\text{m}$, אל הנקודה S, ב-$x = 0.3\,\text{m}$.

      (א) הכוח על $q$ הוא סכום הכוחות של $q_1$ ושל $q_2$. הסבירו למה גם העבודה של השדה על $q$ היא סכום של שתי עבודות: זו של השדה של $q_1$ וזו של השדה של $q_2$.

      (ב) חשבו את העבודה של כל אחד משני השדות, ואת העבודה הכוללת.

      (ג) האם התשובה ל-(ב) משתנה אם $q$ עובר מ-P ל-S בחצי מעגל, מעל הציר?

      (ד) מה העבודה הכוללת כש-$q$ עובר מהנקודה M, ב-$x = 0.2\,\text{m}$, למקום רחוק מאוד?
    answer: >-
      (ב) $0.12\,\text{J}$ מכל שדה, ובסך הכול $+0.24\,\text{J}$.

      (ג) לא.

      (ד) אפס.
    solution:
      - kind: reasoning
        text: >-
          (א) בכל צעד קטן, העבודה היא הכוח כפול רכיב ההעתק בכיוונו. הכוח הוא סכום של שני כוחות, ולכן העבודה בכל צעד היא סכום העבודות של שני הכוחות באותו צעד. כשמחברים את כל הצעדים, העבודה הכוללת היא העבודה של השדה של $q_1$ ועוד העבודה של השדה של $q_2$.
      - kind: formula
        text: >-
          לכל אחד מהשדות לחוד: $W = U_P - U_S$, עם $U = \dfrac{kq_iq}{r}$. המרחק מ-$q_1$ הוא $x$, והמרחק מ-$q_2$ הוא $0.4 - x$.
      - kind: substitution
        text: >-
          (ב) השדה של $q_1$: $U_P = \dfrac{9\cdot10^{9}\cdot 2\cdot10^{-6}\cdot 10^{-6}}{0.1} = 0.18\,\text{J}$ ו-$U_S = \dfrac{9\cdot10^{9}\cdot 2\cdot10^{-6}\cdot 10^{-6}}{0.3} = 0.06\,\text{J}$, ולכן $W_1 = 0.18 - 0.06 = 0.12\,\text{J}$.
      - kind: substitution
        text: >-
          השדה של $q_2$: ב-P המרחק $0.3\,\text{m}$ וב-S המרחק $0.1\,\text{m}$. $U_P = \dfrac{9\cdot10^{9}\cdot(-2\cdot10^{-6})\cdot 10^{-6}}{0.3} = -0.06\,\text{J}$ ו-$U_S = \dfrac{9\cdot10^{9}\cdot(-2\cdot10^{-6})\cdot 10^{-6}}{0.1} = -0.18\,\text{J}$, ולכן $W_2 = -0.06 - (-0.18) = 0.12\,\text{J}$.
      - kind: reasoning
        text: >-
          שתי העבודות חיוביות: $q$ מתרחק מ-$q_1$, שדוחה אותו, ומתקרב ל-$q_2$, שמושך אותו. בשני המקרים הוא זז בכיוון הכוח. סך הכול $W = 0.12 + 0.12 = 0.24\,\text{J}$.
      - kind: reasoning
        text: >-
          (ג) כל אחד משני השדות משמר, ולכן העבודה של כל אחד מהם תלויה רק ב-P וב-S. גם הסכום לא תלוי במסלול: $0.24\,\text{J}$ גם בחצי המעגל.
      - kind: substitution
        text: >-
          (ד) M נמצאת $0.2\,\text{m}$ משני המטענים: $U_M = \dfrac{9\cdot10^{9}\cdot 2\cdot10^{-6}\cdot 10^{-6}}{0.2} + \dfrac{9\cdot10^{9}\cdot(-2\cdot10^{-6})\cdot 10^{-6}}{0.2} = 0.09 - 0.09 = 0$.
          במקום רחוק מאוד גם $U = 0$, ולכן $W = U_M - 0 = 0$: העבודה החיובית של השדה של $q_1$ מקוזזת בדיוק בעבודה השלילית של השדה של $q_2$.
      - kind: result
        text: >-
          (א) העבודה של סכום כוחות היא סכום העבודות שלהם.

          (ב) כל שדה עושה $0.12\,\text{J}$, ובסך הכול $+0.24\,\text{J}$.

          (ג) לא: גם בחצי המעגל $0.24\,\text{J}$.

          (ד) העבודה הכוללת אפס.

  - id: W-2.1-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-2.1-1, OBJ-2.1-2]
    prompt: >-
      כדור קטן שמסתו $4\,\text{g}$ ומטענו $-2\,\mu\text{C}$ נמצא באזור שבו שדה חשמלי אחיד $E = 1\cdot10^{4}\,\text{N/C}$, כלפי מטה.
      הכדור מחליק על מסלול מעוקל, חלק ומבודד, מנקודה A לנקודה B, שנמצאת $0.5\,\text{m}$ מעל A. בנקודה A מהירותו $4\,\text{m/s}$.
      ($g = 10\,\text{m/s}^2$)

      (א) מה העבודה של הכוח החשמלי ומה העבודה של כוח הכבידה בדרך מ-A ל-B?

      (ב) מה מהירות הכדור ב-B?

      (ג) האם התשובה ל-(ב) תלויה בצורה של המסלול? נמקו.
    answer: >-
      (א) הכוח החשמלי: $+0.01\,\text{J}$. כוח הכבידה: $-0.02\,\text{J}$.

      (ב) כ-$3.3\,\text{m/s}$.

      (ג) לא.
    solution:
      - kind: given
        text: >-
          $m = 4\cdot10^{-3}\,\text{kg}$, $q = -2\cdot10^{-6}\,\text{C}$, $E = 1\cdot10^{4}\,\text{N/C}$ כלפי מטה, $h = 0.5\,\text{m}$, $v_A = 4\,\text{m/s}$.
      - kind: reasoning
        text: >-
          הכדור שלילי, ולכן הכוח החשמלי עליו הפוך לשדה: כלפי מעלה, בגודל $|q|E = 2\cdot10^{-6}\cdot 10^{4} = 0.02\,\text{N}$. המשקל $mg = 0.04\,\text{N}$, כלפי מטה. הכדור עולה $0.5\,\text{m}$: בכיוון הכוח החשמלי ונגד כוח הכבידה.
      - kind: substitution
        text: >-
          (א) שני הכוחות קבועים ואנכיים, ולכן רק העלייה האנכית נחשבת. הכוח החשמלי: $W_E = 0.02\cdot 0.5 = +0.01\,\text{J}$. כוח הכבידה: $W_g = -mgh = -0.04\cdot 0.5 = -0.02\,\text{J}$.
      - kind: formula
        text: >-
          (ב) המסלול חלק, והכוח הנורמלי ניצב לתנועה ולא עושה עבודה. לפי משפט העבודה והאנרגיה הקינטית: $\tfrac12 mv_B^2 = \tfrac12 mv_A^2 + W_E + W_g$.
      - kind: substitution
        text: >-
          $\tfrac12 mv_A^2 = \tfrac12\cdot 4\cdot10^{-3}\cdot 4^2 = 0.032\,\text{J}$, ולכן $\tfrac12 mv_B^2 = 0.032 + 0.01 - 0.02 = 0.022\,\text{J}$.
          כופלים ב-2 ומחלקים ב-$m$: $v_B^2 = \dfrac{2\cdot 0.022}{4\cdot10^{-3}} = 11\,\text{m}^2/\text{s}^2$, ולכן $v_B = \sqrt{11} \approx 3.3\,\text{m/s}$.
      - kind: reasoning
        text: >-
          (ג) גם השדה החשמלי האחיד וגם שדה הכבידה משמרים, והכוח הנורמלי לא עושה עבודה. לכן העבודות תלויות רק ב-A וב-B, ולא בצורת המסלול.
      - kind: result
        text: >-
          (א) הכוח החשמלי עושה $+0.01\,\text{J}$, וכוח הכבידה עושה $-0.02\,\text{J}$.

          (ב) $v_B \approx 3.3\,\text{m/s}$.

          (ג) לא: שני השדות משמרים, ולכן רק נקודת ההתחלה ונקודת הסיום קובעות.

  - id: W-2.1-10
    level: bagrut
    qualitative: true
    objectives: [OBJ-2.1-3, OBJ-2.1-2]
    prompt: >-
      מטען $+q$ ומטען $-q$ נמצאים במרחק $r$ זה מזה, והאנרגיה הפוטנציאלית של הזוג היא $U_0$. קבעו ונמקו, בלי להציב מספרים, ובטאו כל תשובה בעזרת $U_0$:

      (א) מה הסימן של $U_0$?

      (ב) מה האנרגיה הפוטנציאלית אם מגדילים פי 2 את הגודל של שני המטענים, וגם מגדילים את המרחק ל-$3r$? האם היא גדולה או קטנה מ-$U_0$?

      (ג) מחליפים את המטען $-q$ במטען $+2q$, במרחק $2r$. מה האנרגיה הפוטנציאלית עכשיו?

      (ד) במצב ההתחלתי, יד מרחיקה לאט את המטענים זה מזה, ממרחק $r$ למרחק $3r$. מה העבודה של היד, ומה העבודה של השדה? מה הסימן של כל אחת?

      (ה) במצב ההתחלתי, $+q$ מקובע ומשחררים את $-q$ ממנוחה. מה האנרגיה הקינטית שלו כשהמרחק ביניהם $r/2$?
    answer: >-
      (א) שלילי.

      (ב) $\tfrac43 U_0$, קטנה מ-$U_0$.

      (ג) $U = -U_0$, חיובית.

      (ד) עבודת היד $W_F = -\tfrac23 U_0$, חיובית. עבודת השדה $W = \tfrac23 U_0$, שלילית.

      (ה) $K = -U_0 = |U_0|$.
    solution:
      - kind: formula
        text: >-
          $U = \dfrac{kq_1q_2}{r}$. במצב ההתחלתי $U_0 = -\dfrac{kq^2}{r}$.
      - kind: reasoning
        text: >-
          (א) המטענים בסימנים מנוגדים, ולכן המכפלה $q_1q_2$ שלילית, ו-$U_0 < 0$.
      - kind: reasoning
        text: >-
          (ב) המכפלה של המטענים גדלה פי $2\cdot2 = 4$, והמרחק גדל פי 3. לכן $U = \dfrac{4}{3}U_0$. $U_0$ שלילית, ולכן $\tfrac43 U_0$ שלילית יותר: קטנה מ-$U_0$.
      - kind: reasoning
        text: >-
          (ג) עכשיו $U = \dfrac{k\cdot q\cdot 2q}{2r} = \dfrac{kq^2}{r} = -U_0$: אותו גודל כמו $U_0$, אבל חיובית, כי שני המטענים חיוביים.
      - kind: reasoning
        text: >-
          (ד) במרחק $3r$: $U = \tfrac13 U_0$. לכן $\Delta U = \tfrac13 U_0 - U_0 = -\tfrac23 U_0$, וזה מספר חיובי, כי $U_0 < 0$.
          עבודת השדה: $W = -\Delta U = \tfrac23 U_0$, שלילית: המטענים מושכים זה את זה, וההרחקה נגד הכוח.
          "לאט": האנרגיה הקינטית לא משתנה, ולכן העבודה הכוללת אפס, ועבודת היד $W_F = -W = -\tfrac23 U_0$, חיובית.
      - kind: reasoning
        text: >-
          (ה) הכוח החשמלי הוא הכוח היחיד שעושה עבודה. במרחק $r/2$: $U = 2U_0$. העבודה של השדה $W = U_0 - 2U_0 = -U_0$, וזו האנרגיה הקינטית שנוספה. המטען התחיל במנוחה, ולכן $K = -U_0 = |U_0|$.
      - kind: result
        text: >-
          (א) $U_0 < 0$.

          (ב) $\tfrac43 U_0$, קטנה מ-$U_0$ (שלילית יותר).

          (ג) $U = -U_0$, חיובית.

          (ד) עבודת היד $W_F = -\tfrac23 U_0 > 0$, ועבודת השדה $W = \tfrac23 U_0 < 0$.

          (ה) $K = |U_0|$: בדיוק כמה ש-$U$ ירדה, מ-$U_0$ ל-$2U_0$.

challenge:
  - id: W-2.1-c1
    stars: 1
    objectives: [OBJ-2.1-3, OBJ-2.1-2]
    prompt: >-
      שלושה מטענים נקודתיים נמצאים בקודקודים של משולש ישר-זווית ושווה-שוקיים, שאורך כל ניצב שלו $a = 10$ ס"מ.
      בקודקוד של הזווית הישרה נמצא מטען $q = +2\,\mu\text{C}$. בקצה אחד של היתר נמצא עוד מטען $q = +2\,\mu\text{C}$, ובקצה השני של היתר נמצא מטען $Q$.

      **האנרגיה של מערכת מטענים** היא העבודה שיד צריכה לעשות כדי להביא את המטענים לאט, אחד אחרי השני, ממרחק אינסופי זה מזה עד המקומות שלהם.

      (א) הראו שהאנרגיה של שלושה מטענים היא סכום האנרגיות של שלושת הזוגות, $U = U_{12} + U_{13} + U_{23}$. היעזרו בכך שהשדה של שני מטענים הוא סכום השדות שלהם.

      (ב) מה צריך להיות $Q$ (גודל וסימן) כדי שהאנרגיה של המערכת תהיה אפס?

      (ג) עם הערך של $Q$ מ-(ב): כמה עבודה צריכה יד לעשות כדי להוציא לאט את $Q$ למרחק אינסופי, כששני המטענים האחרים נשארים במקומם?
    answer: >-
      (ב) $Q = -\dfrac{\sqrt2\,q}{\sqrt2 + 1} \approx -1.17\,\mu\text{C}$.

      (ג) $+0.36\,\text{J}$.
    solution:
      - kind: reasoning
        text: >-
          (א) את המטען הראשון מביאים כשאין עוד מטענים: אין עליו כוח, והעבודה אפס.
          את המטען השני מביאים בשדה של הראשון. בתנועה איטית עבודת היד שווה ל-$\Delta U$, ולכן היא $U_{12}$.
          את המטען השלישי מביאים בשדה של שני הראשונים. הכוח עליו הוא סכום שני כוחות, ולכן גם העבודה היא סכום: עבודה $U_{13}$ נגד השדה של הראשון, ועבודה $U_{23}$ נגד השדה של השני.
          בסך הכול $U = U_{12} + U_{13} + U_{23}$.
      - kind: given
        text: >-
          (ב) המרחקים: בין המטען שבזווית הישרה לכל אחד מקצות היתר המרחק הוא $a$, ובין שני קצות היתר המרחק הוא $\sqrt2\,a$ (משפט פיתגורס).
          לכן $q$ ו-$q$ נמצאים במרחק $a$, $Q$ והמטען שבזווית הישרה במרחק $a$, ו-$Q$ והמטען בקצה השני של היתר במרחק $\sqrt2\,a$.
      - kind: formula
        text: >-
          $$U = \frac{kq^2}{a} + \frac{kQq}{a} + \frac{kQq}{\sqrt2\,a} = 0$$
      - kind: manipulation
        text: >-
          מחלקים את שני האגפים ב-$\dfrac{kq}{a}$: $q + Q + \dfrac{Q}{\sqrt2} = 0$. מוציאים את $Q$ כגורם משותף: $Q\left(1 + \dfrac{1}{\sqrt2}\right) = -q$, ומחלקים בסוגריים:
          $$Q = -\frac{q}{1 + \frac{1}{\sqrt2}} = -\frac{\sqrt2\,q}{\sqrt2 + 1}$$
      - kind: substitution
        text: >-
          $Q = -\dfrac{1.414\cdot 2\cdot10^{-6}}{2.414} = -1.17\cdot10^{-6}\,\text{C}$.
          הסימן שלילי, כמו שצריך: הזוג $q$, $q$ תורם אנרגיה חיובית, ורק זוגות עם $Q$ שלילי יכולים לקזז אותה.
      - kind: reasoning
        text: >-
          (ג) כשמוציאים את $Q$ נעלמים שני הזוגות שבהם הוא משתתף, ונשאר רק הזוג $q$, $q$. האנרגיה עוברת מ-$0$ ל-$\dfrac{kq^2}{a}$, ובתנועה איטית עבודת היד שווה לשינוי הזה.
      - kind: substitution
        text: >-
          $W = \dfrac{kq^2}{a} - 0 = \dfrac{9\cdot10^{9}\cdot\left(2\cdot10^{-6}\right)^2}{0.1} = 0.36\,\text{J}$.
      - kind: result
        text: >-
          (א) כל מטען שמביאים מוסיף את האנרגיה של הזוגות שלו עם המטענים שכבר נמצאים במקומם.

          (ב) $Q = -\dfrac{\sqrt2\,q}{\sqrt2 + 1} \approx -1.17\,\mu\text{C}$.

          (ג) היד עושה $+0.36\,\text{J}$: $Q$ נמשך אל שני המטענים החיוביים, וצריך להשקיע עבודה כדי להרחיק אותו.
    source:
      name: JEE Main
      year: 2019
      problem: 'January 2019, Shift 1 (Canvas Classes question bank ELST-034; the day and the paper''s question number are not shown on the page)'
      url: https://www.canvasclasses.in/the-crucible/q/35bfa4e4-305b-403f-ae7b-47781b649369
      verified: '2026-11-02'
      adapted: true

  - id: W-2.1-c2
    stars: 1
    objectives: [OBJ-2.1-3, OBJ-2.1-2]
    prompt: >-
      **האנרגיה של מערכת מטענים** היא העבודה שיד צריכה לעשות כדי להביא את המטענים לאט, אחד אחרי השני, ממרחק אינסופי זה מזה עד המקומות שלהם.
      היא שווה לסכום האנרגיות $\dfrac{kq_iq_j}{r_{ij}}$ של כל הזוגות במערכת (למה? ראו את שאלת האתגר הקודמת).

      בכל אחת מארבע הפינות של ריבוע שאורך הצלע שלו $10$ ס"מ מקובע מטען $+Q$, כאשר $Q = 1\,\mu\text{C}$. במרכז הריבוע מקובע מטען $-Q$.

      (א) חשבו את האנרגיה של המערכת. סמנו $a = 5$ ס"מ (חצי צלע), והראו שהתוצאה היא $U = \dfrac{kQ^2}{a}\left(2 + \dfrac{1}{\sqrt2} - 2\sqrt2\right)$.

      (ב) עכשיו המטענים $+Q$ נמצאים בשמונה הפינות של קובייה שאורך הצלע שלה $10$ ס"מ, והמטען $-Q$ במרכז הקובייה. חשבו את האנרגיה של המערכת.

      (ג) מה אומר הסימן של כל אחת משתי התשובות? כמה עבודה צריכה יד לעשות, בכל מערכת, כדי להוציא לאט את המטען שבמרכז למרחק אינסופי?
    answer: >-
      (א) $U \approx -0.12\,\dfrac{kQ^2}{a} \approx -2.2\cdot10^{-2}\,\text{J}$.

      (ב) $U \approx 6.78\,\dfrac{kQ^2}{a} \approx 1.22\,\text{J}$.

      (ג) בריבוע $U < 0$ ובקובייה $U > 0$. עבודת היד: $0.51\,\text{J}$ בריבוע ו-$0.83\,\text{J}$ בקובייה.
    solution:
      - kind: given
        text: >-
          $Q = 1\cdot10^{-6}\,\text{C}$, $a = 0.05\,\text{m}$ (חצי צלע, כך שהצלע היא $2a$).
          $\dfrac{kQ^2}{a} = \dfrac{9\cdot10^{9}\cdot\left(10^{-6}\right)^2}{0.05} = 0.18\,\text{J}$.
      - kind: reasoning
        text: >-
          (א) בריבוע יש 5 מטענים, ולכן 10 זוגות. סופרים לפי מרחק:
          4 זוגות של פינות סמוכות, במרחק $2a$;
          2 זוגות של פינות נגדיות, לאורך האלכסון, במרחק $2\sqrt2\,a$;
          4 זוגות של המרכז עם פינה, במרחק חצי אלכסון, $\sqrt2\,a$. רק בזוגות האלה המטענים בסימנים מנוגדים.
      - kind: substitution
        text: >-
          $$U = \frac{kQ^2}{a}\left(\frac{4}{2} + \frac{2}{2\sqrt2} - \frac{4}{\sqrt2}\right) = \frac{kQ^2}{a}\left(2 + \frac{1}{\sqrt2} - 2\sqrt2\right)$$
          $2 + 0.707 - 2.828 = -0.121$, ולכן $U = -0.121\cdot 0.18 = -2.2\cdot10^{-2}\,\text{J}$.
      - kind: reasoning
        text: >-
          (ב) בקובייה יש 9 מטענים, ולכן 36 זוגות. בין שמונה הפינות יש 28 זוגות:
          12 לאורך הצלעות, במרחק $2a$;
          12 לאורך האלכסונים של הפאות, במרחק $2\sqrt2\,a$;
          4 לאורך האלכסונים של הקובייה, במרחק $2\sqrt3\,a$ (פיתגורס פעמיים: $\sqrt{(2a)^2 + (2a)^2 + (2a)^2}$).
          ועוד 8 זוגות של המרכז עם פינה, במרחק חצי אלכסון של הקובייה, $\sqrt3\,a$.
      - kind: substitution
        text: >-
          $$U = \frac{kQ^2}{a}\left(\frac{12}{2} + \frac{12}{2\sqrt2} + \frac{4}{2\sqrt3} - \frac{8}{\sqrt3}\right) = \frac{kQ^2}{a}\left(6 + 4.243 + 1.155 - 4.619\right) = 6.78\,\frac{kQ^2}{a}$$
          $U = 6.78\cdot 0.18 = 1.22\,\text{J}$.
      - kind: reasoning
        text: >-
          (ג) בריבוע $U < 0$: כדי לפרק את המערכת לגמרי, עד שכל המטענים רחוקים זה מזה, יד צריכה להשקיע $2.2\cdot10^{-2}\,\text{J}$. המשיכה למרכז מנצחת בקושי את הדחייה בין הפינות.
          בקובייה $U > 0$: הדחייה בין שמונה הפינות מנצחת, ואילו המטענים היו משתחררים כולם יחד, השדה היה עושה עבודה חיובית של $1.22\,\text{J}$ בזמן שהם מתרחקים.
      - kind: substitution
        text: >-
          הוצאת המטען שבמרכז מבטלת רק את הזוגות שלו, שכולם שליליים. נסמן ב-$U_c$ את סכום האנרגיות של הזוגות של המרכז. בתנועה איטית עבודת היד היא $\Delta U = 0 - U_c = -U_c$:
          בריבוע $\dfrac{4}{\sqrt2}\cdot 0.18 = 2\sqrt2\cdot 0.18 = 0.51\,\text{J}$, ובקובייה $\dfrac{8}{\sqrt3}\cdot 0.18 = 0.83\,\text{J}$.
      - kind: result
        text: >-
          (א) $U \approx -0.12\,\dfrac{kQ^2}{a} \approx -2.2\cdot10^{-2}\,\text{J}$.

          (ב) $U \approx 6.78\,\dfrac{kQ^2}{a} \approx 1.22\,\text{J}$.

          (ג) המערכת של הריבוע קשורה ($U < 0$), והמערכת של הקובייה לא ($U > 0$). בשתיהן המטען שבמרכז קשור: כדי להוציא אותו יד צריכה לעשות $0.51\,\text{J}$ בריבוע ו-$0.83\,\text{J}$ בקובייה.
