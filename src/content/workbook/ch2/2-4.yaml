# Workbook for lesson 2.4: ten practice problems and two sourced challenge problems.
# Every number recomputed with src/physics (constants.ts; potential.ts: speedAfter, kineticGain,
# gapTransit, closestApproach, pairEnergy, pointPotential, toEV; motion.ts: rk4Step for W09 and
# a four-body RK4 for c2).

lesson: '2.4'
practice:
  - id: W-2.4-01
    level: basic
    qualitative: false
    objectives: [OBJ-2.4-1]
    prompt: >-
      אלקטרון יוצא ממנוחה ומואץ בין שתי אלקטרודות. איזה הפרש פוטנציאלים צריך כדי שיגיע למהירות של $1.0\cdot10^{7}\,\text{m/s}$?
      ($m_e = 9.1\cdot10^{-31}\,\text{kg}$, $e = 1.6\cdot10^{-19}\,\text{C}$)
    answer: 'כ-$280\,\text{V}$ (החישוב נותן $284\,\text{V}$)'
    solution:
      - kind: given
        text: >-
          $v = 1.0\cdot10^{7}\,\text{m/s}$, $v_0 = 0$, $m_e = 9.1\cdot10^{-31}\,\text{kg}$, $e = 1.6\cdot10^{-19}\,\text{C}$.
      - kind: formula
        text: >-
          ממנוחה, האנרגיה הקינטית בסוף שווה לאנרגיה שהשדה נתן: $\tfrac12 m_e v^2 = eV$.
      - kind: manipulation
        text: >-
          הנעלם הוא $V$, ולכן מחלקים את שני האגפים ב-$e$: $V = \dfrac{m_e v^2}{2e}$.
      - kind: substitution
        text: >-
          $$V = \frac{9.1\cdot10^{-31}\cdot\left(1.0\cdot10^{7}\right)^2}{2\cdot1.6\cdot10^{-19}} = \frac{9.1\cdot10^{-17}}{3.2\cdot10^{-19}} = 284\ \text{V}$$
      - kind: result
        text: >-
          צריך הפרש פוטנציאלים של כ-$280\,\text{V}$. האלקטרון מקבל אז אנרגיה קינטית של כ-$280\,\text{eV}$.

  - id: W-2.4-02
    level: basic
    qualitative: true
    objectives: [OBJ-2.4-2]
    prompt: >-
      פרוטון משתחרר ממנוחה בנקודה A, שבה הפוטנציאל $200\,\text{V}$, ורק הכוח החשמלי פועל עליו. בסביבה יש שלוש נקודות נוספות:
      בנקודה B הפוטנציאל $120\,\text{V}$, בנקודה C הוא $V_C = -50\,\text{V}$, ובנקודה D הוא $250\,\text{V}$.

      (א) לאילו מהנקודות האנרגיה מתירה לפרוטון להגיע, ולאילו לא?

      (ב) באיזו מהנקודות שהוא יכול להגיע אליהן הוא יהיה המהיר ביותר? נמקו.
    answer: >-
      (א) ל-B ול-C כן, ל-D לא.

      (ב) ב-C, שבה הפוטנציאל הנמוך ביותר.
    solution:
      - kind: formula
        text: >-
          שימור אנרגיה ממנוחה: $K = 0 - q\,(V - V_A) = e\,(V_A - V)$. פרוטון צובר אנרגיה קינטית רק כשהוא עובר לפוטנציאל נמוך יותר.
      - kind: reasoning
        text: >-
          (א) נקודה D גבוהה מ-A ב-$50\,\text{V}$. כדי להגיע אליה הפרוטון היה צריך לשלם $50\,\text{eV}$, ואין לו אנרגיה קינטית בכלל. לכן הוא לא יכול להגיע ל-D.
          הנקודות B ו-C נמוכות מ-A, ולכן האנרגיה לא מונעת ממנו להגיע אליהן.
      - kind: reasoning
        text: >-
          (ב) ככל שהפוטנציאל בנקודה נמוך יותר, הפרוטון מאבד שם יותר אנרגיה פוטנציאלית, ולכן יש לו שם יותר אנרגיה קינטית. ב-B הוא היה מקבל $80\,\text{eV}$, וב-C $250\,\text{eV}$.
      - kind: result
        text: >-
          (א) הפרוטון יכול להגיע ל-B ול-C, ולא ל-D.

          (ב) ב-C הוא המהיר ביותר, כי שם הפוטנציאל הנמוך ביותר. שימו לב: שימור אנרגיה אומר לאן **אסור** לו להגיע. אם הוא אכן יעבור ב-B או ב-C תלוי בצורת השדה.

  - id: W-2.4-03
    level: basic
    qualitative: false
    objectives: [OBJ-2.4-3]
    prompt: >-
      פרוטון נע במהירות $1.0\cdot10^{7}\,\text{m/s}$, ממרחק רב, ישר לעבר גרעין עופרת שמטענו $82e$. הגרעין כבד מאוד, והוא נשאר במקומו.
      מהו מרחק הגישה הקרוב ביותר של הפרוטון לגרעין?
      ($m_p = 1.67\cdot10^{-27}\,\text{kg}$)
    answer: '$2.3\cdot10^{-13}\,\text{m}$'
    solution:
      - kind: given
        text: >-
          $v_0 = 1.0\cdot10^{7}\,\text{m/s}$, $q = e$, $Q = 82e$, $m_p = 1.67\cdot10^{-27}\,\text{kg}$.
      - kind: substitution
        text: >-
          כאן נתונה מהירות, ולא אנרגיה, ולכן מחשבים קודם את האנרגיה הקינטית:
          $K = \tfrac12 m_p v_0^2 = \tfrac12\cdot1.67\cdot10^{-27}\cdot\left(1.0\cdot10^{7}\right)^2 = 8.35\cdot10^{-14}\,\text{J}$.
      - kind: formula
        text: >-
          הפרוטון בא ממרחק רב, שם $U \approx 0$. בנקודת החזרה $K = 0$, ולכן $K_0 = \dfrac{kqQ}{r_{\min}}$, כלומר $r_{\min} = \dfrac{kqQ}{K_0}$.
      - kind: substitution
        text: >-
          $$r_{\min} = \frac{9\cdot10^{9}\cdot1.6\cdot10^{-19}\cdot82\cdot1.6\cdot10^{-19}}{8.35\cdot10^{-14}} = 2.3\cdot10^{-13}\ \text{m}$$
      - kind: result
        text: >-
          הפרוטון מגיע עד $2.3\cdot10^{-13}\,\text{m}$ ממרכז הגרעין, נעצר לרגע וחוזר.

  - id: W-2.4-04
    level: mid
    qualitative: false
    objectives: [OBJ-2.4-1]
    prompt: >-
      פרוטון נע במהירות $4.0\cdot10^{5}\,\text{m/s}$ ונכנס לאזור שבו הוא נע לעבר פוטנציאל גבוה יותר. עד היציאה מהאזור הפוטנציאל עולה ב-$500\,\text{V}$.

      (א) האם הפרוטון יוצא מהאזור? נמקו בחישוב.

      (ב) מה מהירותו ביציאה?
    answer: >-
      (א) כן: יש לו $835\,\text{eV}$, והעלייה דורשת $500\,\text{eV}$.

      (ב) $2.5\cdot10^{5}\,\text{m/s}$.
    solution:
      - kind: given
        text: >-
          $v_0 = 4.0\cdot10^{5}\,\text{m/s}$, $q = e$, $m_p = 1.67\cdot10^{-27}\,\text{kg}$, $\Delta V = 500\,\text{V}$ (עלייה).
      - kind: substitution
        text: >-
          (א) $K_0 = \tfrac12 m_p v_0^2 = \tfrac12\cdot1.67\cdot10^{-27}\cdot\left(4.0\cdot10^{5}\right)^2 = 1.34\cdot10^{-16}\,\text{J}$.
          מחלקים ב-$1.6\cdot10^{-19}$ כדי לעבור לאלקטרון-וולט: $K_0 = 835\,\text{eV}$.
      - kind: reasoning
        text: >-
          פרוטון חיובי משלם $e\cdot500\,\text{V} = 500\,\text{eV}$ כדי לעלות $500\,\text{V}$. יש לו יותר מזה, ולכן הוא יוצא, עם $835 - 500 = 335\,\text{eV}$.
      - kind: formula
        text: >-
          (ב) $\tfrac12 m_p v^2 = K_0 - e\,\Delta V$. מכפילים ב-2 ומחלקים ב-$m_p$, ואז מוציאים שורש: $v = \sqrt{\dfrac{2\,(K_0 - e\,\Delta V)}{m_p}}$.
      - kind: substitution
        text: >-
          $K_0 - e\,\Delta V = 335\,\text{eV} = 335\cdot1.6\cdot10^{-19} = 5.36\cdot10^{-17}\,\text{J}$.
          $$v = \sqrt{\frac{2\cdot5.36\cdot10^{-17}}{1.67\cdot10^{-27}}} = 2.5\cdot10^{5}\ \text{m/s}$$
      - kind: result
        text: >-
          (א) הפרוטון יוצא מהאזור.

          (ב) הוא יוצא במהירות $2.5\cdot10^{5}\,\text{m/s}$. האנרגיה הקינטית ירדה ל-$\tfrac{335}{835}$ מערכה, כ-40%, אבל המהירות ירדה רק לכ-63%, כי המהירות היא השורש של האנרגיה.

  - id: W-2.4-05
    level: mid
    qualitative: true
    objectives: [OBJ-2.4-2]
    prompt: >-
      לאורך ציר x הפוטנציאל משתנה כך: מ-$x = 0$ עד $x = 2\,\text{cm}$ הוא עולה בקצב קבוע מ-$0\,\text{V}$ ל-$300\,\text{V}$.
      מ-$x = 2\,\text{cm}$ עד $x = 4\,\text{cm}$ הוא קבוע, $300\,\text{V}$. מ-$x = 4\,\text{cm}$ עד $x = 6\,\text{cm}$ הוא יורד בקצב קבוע ל-$100\,\text{V}$, ומשם הוא קבוע.
      אלקטרון משתחרר ממנוחה בנקודה $x = 0$.

      (א) תארו את התנועה שלו בכל אחד משלושת הקטעים: מואץ, נע במהירות קבועה או מאט?

      (ב) איפה מהירותו הגדולה ביותר?

      (ג) האם הוא עובר את $x = 6\,\text{cm}$? אם כן, עם איזו אנרגיה קינטית?
    answer: >-
      (א) מואץ, נע במהירות קבועה, מאט.

      (ב) בכל הקטע שבין $2\,\text{cm}$ ל-$4\,\text{cm}$.

      (ג) כן, עם $100\,\text{eV}$.
    solution:
      - kind: reasoning
        text: >-
          (א) אלקטרון נדחף לכיוון הפוטנציאל הגבוה. בקטע הראשון הפוטנציאל עולה בכיוון התנועה, ולכן הכוח קדימה והאלקטרון מואץ.
          בקטע השני הפוטנציאל קבוע, ולכן השדה שם אפס (שיעור 2.3): אין כוח, והמהירות קבועה. בקטע השלישי הפוטנציאל יורד בכיוון התנועה, ולכן הכוח אחורה והאלקטרון מאט.
      - kind: formula
        text: >-
          כמותית: ממנוחה ב-$V = 0$, $K = 0 - q\,(V - 0) = eV$, כאשר $V$ הוא הפוטנציאל במקום שבו האלקטרון נמצא.
      - kind: reasoning
        text: >-
          (ב) $K = eV$ גדולה ביותר במקום שבו $V$ הגבוה ביותר, $300\,\text{V}$: לכל אורך הקטע השני, עם $300\,\text{eV}$.
      - kind: reasoning
        text: >-
          (ג) ב-$x = 6\,\text{cm}$ הפוטנציאל $100\,\text{V}$, ולכן שם $K = 100\,\text{eV}$, מספר חיובי: האלקטרון מגיע לשם ועובר. אחר כך הפוטנציאל קבוע, והוא ממשיך במהירות קבועה.
      - kind: result
        text: >-
          (א) בקטע הראשון הוא מואץ, בשני נע במהירות קבועה, ובשלישי מאט.

          (ב) המהירות הגדולה ביותר בכל הקטע שבין $x = 2\,\text{cm}$ ל-$x = 4\,\text{cm}$, עם $300\,\text{eV}$.

          (ג) הוא עובר את $x = 6\,\text{cm}$ וממשיך עם $100\,\text{eV}$. לא צריך לדעת את השדות או את המרחקים: מספיק הפוטנציאל בכל מקום.

  - id: W-2.4-06
    level: mid
    qualitative: false
    objectives: [OBJ-2.4-3]
    prompt: >-
      הרדיוס של גרעין זהב (מטען $79e$) הוא כ-$7.0\cdot10^{-15}\,\text{m}$. כדי שחלקיק אלפא (מטען $2e$) שנורה ישר לעבר הגרעין ממרחק רב יגיע בדיוק עד פני הגרעין, מה צריכה להיות האנרגיה הקינטית שלו?
      ענו בג'אול וב-MeV, והשוו לחלקיקי האלפא של $5\,\text{MeV}$ שבשיעור. ($1\,\text{MeV} = 10^{6}\,\text{eV}$)
    answer: '$5.2\cdot10^{-12}\,\text{J}$, כלומר כ-$33\,\text{MeV}$: פי 6.5 בערך מ-$5\,\text{MeV}$'
    solution:
      - kind: given
        text: >-
          $q = 2e$, $Q = 79e$, $r_{\min} = 7.0\cdot10^{-15}\,\text{m}$, החלקיק בא ממרחק רב.
      - kind: formula
        text: >-
          בנקודת החזרה כל האנרגיה הקינטית ההתחלתית הפכה לאנרגיה פוטנציאלית: $K_0 = \dfrac{kqQ}{r_{\min}}$. כאן $r_{\min}$ נתון, ו-$K_0$ הוא הנעלם, ולכן אין צורך לסדר מחדש.
      - kind: substitution
        text: >-
          $$K_0 = \frac{9\cdot10^{9}\cdot2\cdot1.6\cdot10^{-19}\cdot79\cdot1.6\cdot10^{-19}}{7.0\cdot10^{-15}} = 5.2\cdot10^{-12}\ \text{J}$$
          באלקטרון-וולט מחלקים ב-$1.6\cdot10^{-19}$: $3.25\cdot10^{7}\,\text{eV} = 32.5\,\text{MeV}$.
      - kind: substitution
        text: >-
          היחס ל-$5\,\text{MeV}$: $\dfrac{32.5}{5} = 6.5$.
      - kind: result
        text: >-
          האלפא צריך כ-$5.2\cdot10^{-12}\,\text{J}$, כלומר כ-$33\,\text{MeV}$, פי 6.5 בערך מהאנרגיה של חלקיקי האלפא של רתרפורד. לכן בניסוי שלו האלפא לא נגע בגרעין, והדחייה החשמלית לבדה תיארה את התנועה.

  - id: W-2.4-07
    level: mid
    qualitative: true
    objectives: [OBJ-2.4-1]
    prompt: >-
      פרוטון משתחרר ממנוחה ליד לוח אחד ומואץ אל הלוח השני, בשדה אחיד שבין שני לוחות מקבילים. הוא מגיע ללוח השני במהירות $v$.

      (א) תלמידה טוענת: "באמצע הדרך המהירות שלו היא $v/2$". האם היא צודקת? מה המהירות באמצע הדרך?

      (ב) באיזה מקום בין הלוחות המהירות שלו היא בדיוק $v/2$?
    answer: >-
      (א) לא. באמצע הדרך המהירות היא $v/\sqrt2 \approx 0.71v$.

      (ב) ברבע הדרך מהלוח שממנו יצא.
    solution:
      - kind: reasoning
        text: >-
          בשדה אחיד הפוטנציאל משתנה בקצב קבוע לאורך הדרך (שיעור 2.3). לכן עד אמצע הדרך הפרוטון עבר חצי מהפרש הפוטנציאלים, ועד רבע הדרך רבע ממנו.
      - kind: formula
        text: >-
          ממנוחה $\tfrac12 mv^2 = e\,\Delta V$: האנרגיה הקינטית ביחס ישר להפרש הפוטנציאלים שעבר, והמהירות ביחס ישר לשורש שלו.
      - kind: reasoning
        text: >-
          (א) באמצע הדרך הפרוטון עבר חצי מהמתח, ולכן יש לו חצי מהאנרגיה הקינטית הסופית. המהירות קטנה רק פי $\sqrt2$: $\dfrac{v}{\sqrt2} \approx 0.71v$, יותר מ-$v/2$.
      - kind: reasoning
        text: >-
          (ב) מהירות $v/2$ פירושה אנרגיה קינטית קטנה פי $2^2 = 4$, כלומר רבע מהאנרגיה הסופית. את הרבע הזה הפרוטון מקבל כשעבר רבע מהמתח, כלומר רבע מהדרך.
      - kind: result
        text: >-
          (א) התלמידה טועה: באמצע הדרך המהירות כבר $0.71v$. "חצי מהדרך" נותן חצי מה**אנרגיה**, לא חצי מהמהירות.

          (ב) המהירות היא $v/2$ ברבע הדרך. ברוב הדרך הפרוטון כבר מהיר, ולכן הוא עובר אותה בזמן קצר יחסית.

  - id: W-2.4-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-2.4-1, OBJ-2.4-2]
    prompt: >-
      שלושה לוחות מקבילים עומדים זה אחרי זה. לוח A בפוטנציאל $0\,\text{V}$. במרחק $1.0\,\text{cm}$ ממנו יש רשת B (לוח מחורר שאלקטרונים עוברים דרכו) בפוטנציאל $500\,\text{V}$.
      במרחק $3.0\,\text{cm}$ אחרי הרשת נמצא לוח C. השדה בין כל שני לוחות סמוכים אחיד. אלקטרון משתחרר ממנוחה בלוח A.

      (א) באיזו מהירות האלקטרון עובר את הרשת B?

      (ב) הפוטנציאל של לוח C הוא $V_C = -100\,\text{V}$. האם האלקטרון מגיע ל-C? אם לא, באיזה מרחק מהרשת הוא נעצר?

      (ג) מה צריך להיות הפוטנציאל של C כדי שהאלקטרון יפגע בו עם אנרגיה קינטית של $200\,\text{eV}$? מה מהירותו אז?
    answer: >-
      (א) $1.33\cdot10^{7}\,\text{m/s}$.

      (ב) לא. הוא נעצר $2.5\,\text{cm}$ אחרי הרשת, וחוזר.

      (ג) $V_C = 200\,\text{V}$, והמהירות $8.4\cdot10^{6}\,\text{m/s}$.
    solution:
      - kind: given
        text: >-
          $V_A = 0$, $V_B = 500\,\text{V}$, $q = -e$, $m_e = 9.1\cdot10^{-31}\,\text{kg}$, האלקטרון מתחיל במנוחה. המרחק בין B ל-C הוא $3.0\,\text{cm}$.
      - kind: formula
        text: >-
          ממנוחה ב-A: $K = 0 - q\,(V - V_A) = eV$, כאשר $V$ הוא הפוטנציאל במקום שבו האלקטרון נמצא. האלקטרון יכול להיות רק במקומות שבהם $V \ge 0$.
      - kind: substitution
        text: >-
          (א) ברשת $K = e\cdot500\,\text{V} = 500\,\text{eV} = 8.0\cdot10^{-17}\,\text{J}$. מבודדים את $v$ מ-$\tfrac12 m_e v^2 = K$:
          $$v = \sqrt{\frac{2\cdot8.0\cdot10^{-17}}{9.1\cdot10^{-31}}} = 1.33\cdot10^{7}\ \text{m/s}$$
      - kind: reasoning
        text: >-
          (ב) ב-C הייתה לאלקטרון אנרגיה קינטית $K = e\cdot(-100\,\text{V}) = -100\,\text{eV}$, מספר שלילי. לכן הוא לא מגיע ל-C.
          הוא נעצר במקום שבו $K = 0$, כלומר במקום שבו הפוטנציאל שוב $0\,\text{V}$, כמו בנקודת היציאה.
      - kind: substitution
        text: >-
          בין B ל-C הפוטנציאל יורד בקצב קבוע, מ-$500\,\text{V}$ ל-$V_C = -100\,\text{V}$: ירידה של $600\,\text{V}$ לאורך $3.0\,\text{cm}$.
          ירידה של $500\,\text{V}$, עד $0\,\text{V}$, מתקבלת אחרי $\tfrac{500}{600}$ מהדרך: $\tfrac{500}{600}\cdot3.0\,\text{cm} = 2.5\,\text{cm}$ אחרי הרשת.
      - kind: manipulation
        text: >-
          (ג) רוצים $K_C = eV_C = 200\,\text{eV}$. מחלקים ב-$e$: $V_C = 200\,\text{V}$. המהירות: $K_C = 200\cdot1.6\cdot10^{-19} = 3.2\cdot10^{-17}\,\text{J}$, ולכן
          $$v_C = \sqrt{\frac{2\cdot3.2\cdot10^{-17}}{9.1\cdot10^{-31}}} = 8.4\cdot10^{6}\ \text{m/s}$$
      - kind: result
        text: >-
          (א) $1.33\cdot10^{7}\,\text{m/s}$.

          (ב) האלקטרון לא מגיע ל-C. הוא נעצר $2.5\,\text{cm}$ אחרי הרשת, במקום שבו הפוטנציאל $0\,\text{V}$, כמו ב-A, וחוזר.

          (ג) $V_C = 200\,\text{V}$, והאלקטרון פוגע ב-C במהירות $8.4\cdot10^{6}\,\text{m/s}$. מה שקורה ברשת לא משנה את התשובה: קובעים רק הפוטנציאל בנקודת היציאה ובנקודת ההגעה.

  - id: W-2.4-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-2.4-2, OBJ-2.4-1]
    prompt: >-
      שני מטענים נקודתיים קבועים, כל אחד $+2\,\text{nC}$, נמצאים במרחק $4.0\,\text{cm}$ זה מזה. פרוטון נורה ממרחק רב לאורך האנך האמצעי לקטע שמחבר אותם, ישר לעבר נקודת האמצע M של הקטע.

      (א) מה הפוטנציאל בנקודה M?

      (ב) מה המהירות הקטנה ביותר שבה צריך לירות את הפרוטון כדי שיעבור דרך M ויצא מהצד השני?

      (ג) הפרוטון נורה במהירות $1.0\cdot10^{6}\,\text{m/s}$. מה מהירותו ב-M, ומה מהירותו כשהוא רחוק מאוד בצד השני?
    answer: >-
      (א) $1800\,\text{V}$.

      (ב) $5.9\cdot10^{5}\,\text{m/s}$.

      (ג) ב-M $8.1\cdot10^{5}\,\text{m/s}$, ורחוק בצד השני שוב $1.0\cdot10^{6}\,\text{m/s}$.
    solution:
      - kind: given
        text: >-
          $Q = 2\cdot10^{-9}\,\text{C}$ לכל מטען, המרחק מכל מטען ל-M הוא $0.020\,\text{m}$, $q = e$, $m_p = 1.67\cdot10^{-27}\,\text{kg}$.
      - kind: substitution
        text: >-
          (א) הפוטנציאל הוא סכום הפוטנציאלים של שני המטענים (שיעור 2.2):
          $$V_M = 2\cdot\frac{9\cdot10^{9}\cdot2\cdot10^{-9}}{0.020} = 1800\ \text{V}$$
      - kind: reasoning
        text: >-
          (ב) על האנך האמצעי הכוחות של שני המטענים סימטריים, והרכיבים שלהם לרוחב מבטלים זה את זה. לכן הפרוטון נשאר על האנך.
          בנקודה על האנך, במרחק $r$ מכל מטען, הפוטנציאל $2kQ/r$. המרחק $r$ הקטן ביותר ב-M, ולכן הפוטנציאל הגבוה ביותר על האנך הוא ב-M: זו "פסגת הגבעה" שהפרוטון צריך לעבור.
      - kind: formula
        text: >-
          ממרחק רב ($V = 0$) עד M: הפרוטון עובר אם $\tfrac12 m_p v_0^2 \ge eV_M$. המהירות הקטנה ביותר מקיימת שוויון; מכפילים ב-2, מחלקים ב-$m_p$ ומוציאים שורש: $v_{\min} = \sqrt{\dfrac{2eV_M}{m_p}}$.
      - kind: substitution
        text: >-
          $$v_{\min} = \sqrt{\frac{2\cdot1.6\cdot10^{-19}\cdot1800}{1.67\cdot10^{-27}}} = 5.9\cdot10^{5}\ \text{m/s}$$
      - kind: substitution
        text: >-
          (ג) $K_0 = \tfrac12\cdot1.67\cdot10^{-27}\cdot\left(1.0\cdot10^{6}\right)^2 = 8.35\cdot10^{-16}\,\text{J}$, כלומר $5220\,\text{eV}$ (אחרי חלוקה ב-$1.6\cdot10^{-19}$).
          ב-M: $K_M = 5220 - 1800 = 3420\,\text{eV} = 5.47\cdot10^{-16}\,\text{J}$, ולכן $v_M = \sqrt{\dfrac{2\cdot5.47\cdot10^{-16}}{1.67\cdot10^{-27}}} = 8.1\cdot10^{5}\,\text{m/s}$.
      - kind: reasoning
        text: >-
          רחוק מאוד בצד השני הפוטנציאל שוב אפס, כמו בהתחלה, ולכן גם האנרגיה הקינטית חוזרת להיות $K_0$, והמהירות $1.0\cdot10^{6}\,\text{m/s}$.
      - kind: result
        text: >-
          (א) $V_M = 1800\,\text{V}$.

          (ב) צריך לפחות $5.9\cdot10^{5}\,\text{m/s}$.

          (ג) ב-M הפרוטון מאט ל-$8.1\cdot10^{5}\,\text{m/s}$, ורחוק בצד השני הוא חוזר ל-$1.0\cdot10^{6}\,\text{m/s}$.

  - id: W-2.4-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-2.4-3, OBJ-2.4-1]
    prompt: >-
      חלקיק אלפא (מטען $2e$, מסה $4m_p$) שהאנרגיה הקינטית שלו $7.7\,\text{MeV}$ נורה ממרחק רב ישר לעבר גרעין כסף (מטען $47e$), שנשאר במקומו.
      ($m_p = 1.67\cdot10^{-27}\,\text{kg}$, $1\,\text{MeV} = 10^{6}\,\text{eV}$)

      (א) מה מהירות האלפא בהתחלה, ומהו מרחק הגישה הקרוב ביותר?

      (ב) מה מהירות האלפא כשהוא במרחק כפול ממרחק הגישה הקרוב ביותר? פי כמה היא קטנה מהמהירות ההתחלתית?

      (ג) מה גודל הכוח על האלפא ברגע הגישה הקרובה ביותר, ומה התאוצה שלו אז?

      (ד) מה משתנה אם… במקום האלפא נורה פרוטון **באותה מהירות**. מה מרחק הגישה הקרוב ביותר שלו?
    answer: >-
      (א) $1.9\cdot10^{7}\,\text{m/s}$; $1.8\cdot10^{-14}\,\text{m}$.

      (ב) $1.36\cdot10^{7}\,\text{m/s}$, קטנה פי $\sqrt2$.

      (ג) $70\,\text{N}$; $1.0\cdot10^{28}\,\text{m/s}^2$, הרחק מהגרעין.

      (ד) כפול: $3.5\cdot10^{-14}\,\text{m}$.
    solution:
      - kind: given
        text: >-
          $K_0 = 7.7\,\text{MeV} = 7.7\cdot10^{6}\cdot1.6\cdot10^{-19} = 1.23\cdot10^{-12}\,\text{J}$, $q = 2e$, $Q = 47e$, $m_\alpha = 4\cdot1.67\cdot10^{-27} = 6.68\cdot10^{-27}\,\text{kg}$.
      - kind: substitution
        text: >-
          (א) מבודדים את $v_0$ מ-$\tfrac12 m_\alpha v_0^2 = K_0$: $v_0 = \sqrt{\dfrac{2\cdot1.23\cdot10^{-12}}{6.68\cdot10^{-27}}} = 1.9\cdot10^{7}\,\text{m/s}$.
          $$r_{\min} = \frac{kqQ}{K_0} = \frac{9\cdot10^{9}\cdot2\cdot1.6\cdot10^{-19}\cdot47\cdot1.6\cdot10^{-19}}{1.23\cdot10^{-12}} = 1.76\cdot10^{-14}\ \text{m}$$
      - kind: reasoning
        text: >-
          (ב) האנרגיה הפוטנציאלית $kqQ/r$ ביחס הפוך למרחק. ב-$r_{\min}$ היא שווה ל-$K_0$, ולכן במרחק $2r_{\min}$ היא $K_0/2$.
          לפי שימור אנרגיה, שם $K = K_0 - K_0/2 = K_0/2$. חצי מהאנרגיה הקינטית פירושו מהירות קטנה פי $\sqrt2$:
          $v = \dfrac{1.92\cdot10^{7}}{\sqrt2} = 1.36\cdot10^{7}\,\text{m/s}$.
      - kind: substitution
        text: >-
          (ג) לפי חוק קולון, $F = \dfrac{kqQ}{r_{\min}^2} = \dfrac{9\cdot10^{9}\cdot2\cdot1.6\cdot10^{-19}\cdot47\cdot1.6\cdot10^{-19}}{\left(1.76\cdot10^{-14}\right)^2} = 70\,\text{N}$.
          $a = \dfrac{F}{m_\alpha} = \dfrac{70}{6.68\cdot10^{-27}} = 1.0\cdot10^{28}\,\text{m/s}^2$, הרחק מהגרעין (דחייה).
      - kind: reasoning
        text: >-
          (ד) באותה מהירות, לפרוטון מסה קטנה פי 4, ולכן אנרגיה קינטית קטנה פי 4: $K_p = K_0/4$. גם המטען שלו קטן פי 2.
          $$r_p = \frac{k\,e\,Q}{K_0/4} = \frac{4\,keQ}{K_0} = 2\cdot\frac{k\,(2e)\,Q}{K_0} = 2r_{\min}$$
          כלומר $2\cdot1.76\cdot10^{-14} = 3.5\cdot10^{-14}\,\text{m}$.
      - kind: result
        text: >-
          (א) $v_0 = 1.9\cdot10^{7}\,\text{m/s}$, ומרחק הגישה $1.8\cdot10^{-14}\,\text{m}$.

          (ב) $1.36\cdot10^{7}\,\text{m/s}$, קטנה פי $\sqrt2$ מהמהירות ההתחלתית: חצי מהאנרגיה כבר הפך לפוטנציאלית.

          (ג) כוח של כ-$70\,\text{N}$ על חלקיק זעיר, ותאוצה של כ-$10^{28}\,\text{m/s}^2$, הרחק מהגרעין.

          (ד) הפרוטון מגיע רק עד $3.5\cdot10^{-14}\,\text{m}$, פי 2 רחוק יותר: האנרגיה שלו קטנה פי 4, והדחייה עליו חלשה רק פי 2.

challenge:
  - id: W-2.4-c1
    stars: 1
    objectives: [OBJ-2.4-1, OBJ-2.4-2]
    prompt: >-
      כדור מוליך קטן שהרדיוס שלו $1.0\,\text{mm}$ טעון לפוטנציאל של $2.0\,\text{kV}$ (הפוטנציאל רחוק מאוד הוא אפס).
      מחוץ לכדור, השדה שלו שווה לשדה של מטען נקודתי שנמצא במרכזו (שיעור 1.8), ולכן גם הפוטנציאל שלו שם כמו של מטען כזה, $V = kQ/r$.

      (א) מה המטען של הכדור?

      (ב) יון שלילי שמטענו $q = -e$ משתחרר ממנוחה בנקודה שנמצאת $3.0\,\text{mm}$ מפני הכדור. כמה אנרגיה קינטית, באלקטרון-וולט, הוא צובר כשהוא מתקרב לכדור ב-$1.0\,\text{mm}$?

      (ג) המסה של היון פי 16 ממסת הפרוטון. באיזו מהירות הוא פוגע בכדור?

      (ד) איזה חלק מהאנרגיה הקינטית הסופית צובר היון במילימטר האחרון של הדרך? הסבירו למה דווקא שם.
    answer: >-
      (א) $2.2\cdot10^{-10}\,\text{C}$.

      (ב) כ-$170\,\text{eV}$ (החישוב נותן $166.7\,\text{eV}$).

      (ג) $1.3\cdot10^{5}\,\text{m/s}$.

      (ד) שני שלישים: $1000\,\text{eV}$ מתוך $1500\,\text{eV}$.
    solution:
      - kind: given
        text: >-
          $R = 1.0\cdot10^{-3}\,\text{m}$, $V_R = 2000\,\text{V}$ על פני הכדור, $q = -e$, $m = 16\cdot1.67\cdot10^{-27} = 2.67\cdot10^{-26}\,\text{kg}$.
          היון מתחיל $3.0\,\text{mm}$ מפני הכדור, כלומר $r_0 = 4.0\,\text{mm}$ ממרכזו.
      - kind: manipulation
        text: >-
          (א) על פני הכדור $V_R = \dfrac{kQ}{R}$. מכפילים את שני האגפים ב-$R$ ומחלקים ב-$k$: $Q = \dfrac{V_R R}{k} = \dfrac{2000\cdot1.0\cdot10^{-3}}{9\cdot10^{9}} = 2.2\cdot10^{-10}\,\text{C}$.
      - kind: reasoning
        text: >-
          נוח לכתוב את הפוטנציאל בלי $Q$: $V(r) = \dfrac{kQ}{r} = V_R\,\dfrac{R}{r}$. כלומר הפוטנציאל ביחס הפוך למרחק מהמרכז: במרחק כפול מ-$R$ הוא חצי מ-$V_R$, וכן הלאה.
      - kind: substitution
        text: >-
          (ב) $V(4.0\,\text{mm}) = 2000\cdot\tfrac14 = 500\,\text{V}$ ו-$V(3.0\,\text{mm}) = 2000\cdot\tfrac13 = 666.7\,\text{V}$.
          היון שלילי, ולכן הוא צובר אנרגיה קינטית כשהוא עובר לפוטנציאל גבוה יותר: $\Delta K = -q\,\Delta V = e\cdot(666.7 - 500)\,\text{V} = 166.7\,\text{eV}$.
      - kind: substitution
        text: >-
          (ג) עד פני הכדור: $K = e\cdot(2000 - 500)\,\text{V} = 1500\,\text{eV} = 2.4\cdot10^{-16}\,\text{J}$. מבודדים את $v$ מ-$\tfrac12 mv^2 = K$:
          $$v = \sqrt{\frac{2\cdot2.4\cdot10^{-16}}{2.67\cdot10^{-26}}} = 1.3\cdot10^{5}\ \text{m/s}$$
      - kind: reasoning
        text: >-
          (ד) המילימטר האחרון הוא הדרך מ-$r = 2.0\,\text{mm}$ ($V = 1000\,\text{V}$) עד $r = 1.0\,\text{mm}$ ($V = 2000\,\text{V}$): שם היון צובר $1000\,\text{eV}$ מתוך $1500\,\text{eV}$.
          ליד הכדור הפוטנציאל משתנה מהר, כי הוא ביחס הפוך למרחק: חצייה של המרחק מכפילה אותו. במילים אחרות, השדה שם הכי חזק.
      - kind: result
        text: >-
          (א) $Q = 2.2\cdot10^{-10}\,\text{C}$.

          (ב) כ-$170\,\text{eV}$.

          (ג) היון פוגע בכדור במהירות $1.3\cdot10^{5}\,\text{m/s}$.

          (ד) שני שלישים מהאנרגיה נצברים במילימטר האחרון מתוך שלושה, כי ליד הכדור הפוטנציאל משתנה הכי מהר.
    source:
      name: British Physics Olympiad (BPhO), Round 1
      year: 2021
      problem: 'Round 1, 12 November 2021, Section 2, Question 4(b)(i) and (iii)'
      url: https://www.bpho.org.uk/Papers/R1/2021Nov_R1_S2.pdf
      verified: '2026-11-02'
      adapted: true

  - id: W-2.4-c2
    stars: 2
    objectives: [OBJ-2.4-1, OBJ-2.4-2, OBJ-2.4-3]
    prompt: >-
      ארבעה חלקיקים זהים, לכל אחד מטען $q$ ומסה $m$, נמצאים בפינות של ריבוע שאורך הצלע שלו $L$. משגרים את כולם בבת אחת, באותה מהירות $v_0$,
      כל אחד לאורך האלכסון של הריבוע, **הרחק** מהמרכז. רק הכוחות החשמליים ביניהם פועלים (אין כבידה).
      האנרגיה הפוטנציאלית של כמה מטענים היא סכום האנרגיות $kq_iq_j/r_{ij}$ של כל הזוגות.

      (א) הסבירו למה בכל רגע החלקיקים נמצאים בפינות של ריבוע, ונעים באותה מהירות.

      (ב) הראו שאחרי זמן רב מהירות כל חלקיק היא $v_f = \sqrt{v_0^2 + \dfrac{kq^2}{mL}\left(2 + \dfrac{\sqrt2}{2}\right)}$.

      (ג) עכשיו משגרים את החלקיקים באותה מהירות $v_0$, אבל לאורך האלכסונים **אל** המרכז. מה המהירות שלהם אחרי זמן רב?

      (ד) במצב של סעיף (ג), עם $q = 1.0\,\mu\text{C}$, $m = 1.0\,\text{g}$, $L = 0.10\,\text{m}$ ו-$v_0 = 10\,\text{m/s}$: עד איזה מרחק מהמרכז מתקרב כל חלקיק? מה מהירותו אחרי זמן רב?
    answer: >-
      (א) מהסימטריה: כל ארבעת החלקיקים נעים באותה מהירות, כל אחד לאורך האלכסון שלו.

      (ב) לפי שימור האנרגיה, האנרגיה החשמלית ההתחלתית והאנרגיה הקינטית ההתחלתית הופכות כולן לאנרגיה קינטית.

      (ג) אותה מהירות $v_f$ כמו בסעיף (ב).

      (ד) עד $5.0\,\text{cm}$ מהמרכז (בהתחלה $7.1\,\text{cm}$); המהירות הסופית $18.5\,\text{m/s}$.
    solution:
      - kind: reasoning
        text: >-
          (א) הסידור סימטרי: סיבוב של הריבוע ברבע סיבוב סביב המרכז מעביר כל חלקיק למקום של שכנו, עם אותה מהירות. לכן מה שקורה לחלקיק אחד קורה לכולם.
          על כל חלקיק הכוח השקול פונה לאורך האלכסון שלו, הרחק מהמרכז (הכוחות של שני השכנים שווים, ורכיביהם לרוחב מבטלים זה את זה). לכן כל חלקיק נשאר על האלכסון שלו, והריבוע רק גדל או קטן.
      - kind: formula
        text: >-
          (ב) בריבוע יש 6 זוגות: 4 צלעות באורך $L$, ו-2 אלכסונים באורך $\sqrt2\,L$. האנרגיה הפוטנציאלית ההתחלתית:
          $$U_0 = 4\,\frac{kq^2}{L} + 2\,\frac{kq^2}{\sqrt2\,L} = \frac{kq^2}{L}\left(4 + \sqrt2\right)$$
      - kind: manipulation
        text: >-
          אחרי זמן רב החלקיקים רחוקים מאוד זה מזה, $U \to 0$, וכל האנרגיה קינטית. שימור אנרגיה:
          $$4\cdot\tfrac12 mv_0^2 + \frac{kq^2}{L}\left(4 + \sqrt2\right) = 4\cdot\tfrac12 mv_f^2$$
          מחלקים את שני האגפים ב-$2m$: $v_f^2 = v_0^2 + \dfrac{kq^2}{mL}\cdot\dfrac{4 + \sqrt2}{2} = v_0^2 + \dfrac{kq^2}{mL}\left(2 + \dfrac{\sqrt2}{2}\right)$, ומוציאים שורש.
      - kind: reasoning
        text: >-
          (ג) האנרגיה הקינטית ההתחלתית תלויה רק בגודל המהירות, לא בכיוון, ולכן האנרגיה הכוללת זהה לסעיף (ב). החלקיקים מתקרבים, נעצרים יחד ברגע אחד, ומתרחקים. אחרי זמן רב שוב $U \to 0$, ולכן המהירות שוב $v_f$.
      - kind: formula
        text: >-
          (ד) נסמן ב-$s$ את המרחק של כל חלקיק מהמרכז. אז הצלע $\sqrt2\,s$ והאלכסון $2s$, ולכן
          $$U(s) = 4\,\frac{kq^2}{\sqrt2\,s} + 2\,\frac{kq^2}{2s} = \frac{kq^2}{s}\left(2\sqrt2 + 1\right)$$
          ברגע העצירה כל האנרגיה פוטנציאלית: $U(s_{\min}) = E$. מכפילים ב-$s_{\min}$ ומחלקים ב-$E$: $s_{\min} = \dfrac{kq^2\left(2\sqrt2 + 1\right)}{E}$.
      - kind: substitution
        text: >-
          $\dfrac{kq^2}{L} = \dfrac{9\cdot10^{9}\cdot\left(1.0\cdot10^{-6}\right)^2}{0.10} = 0.090\,\text{J}$, ולכן $U_0 = 0.090\cdot\left(4 + \sqrt2\right) = 0.487\,\text{J}$.
          $K_0 = 4\cdot\tfrac12\cdot1.0\cdot10^{-3}\cdot10^2 = 0.200\,\text{J}$, ולכן $E = 0.687\,\text{J}$.
          $$s_{\min} = \frac{9\cdot10^{-3}\cdot3.83}{0.687} = 5.0\cdot10^{-2}\ \text{m}$$
          בהתחלה $s_0 = L/\sqrt2 = 7.1\,\text{cm}$. המהירות הסופית: $4\cdot\tfrac12 mv_f^2 = E$, ולכן $v_f = \sqrt{\dfrac{E}{2m}} = \sqrt{\dfrac{0.687}{2.0\cdot10^{-3}}} = 18.5\,\text{m/s}$.
      - kind: result
        text: >-
          (ב) $v_f = \sqrt{v_0^2 + \dfrac{kq^2}{mL}\left(2 + \dfrac{\sqrt2}{2}\right)}$.

          (ג) אותה מהירות סופית, בלי תלות בכיוון השיגור.

          (ד) כל חלקיק מתקרב מ-$7.1\,\text{cm}$ עד $5.0\,\text{cm}$ מהמרכז, נעצר וחוזר, ואחרי זמן רב מהירותו $18.5\,\text{m/s}$.
