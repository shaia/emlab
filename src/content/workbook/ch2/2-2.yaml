# Workbook for lesson 2.2: ten practice problems and two sourced challenge problems.
# Every number recomputed with pointPotential, fieldWork and toEV from src/physics/potential.ts,
# potentialAt from src/physics/electrostatics.ts, and the constants in src/physics/constants.ts.

lesson: '2.2'
practice:
  - id: W-2.2-01
    level: basic
    qualitative: false
    objectives: [OBJ-2.2-1]
    prompt: >-
      חלקיק אלפא הוא גרעין של אטום הליום, והמטען שלו הוא $2e$ (חיובי).

      (א) חלקיק אלפא עובר הפרש פוטנציאלים של $500\,\text{V}$, מפוטנציאל גבוה לנמוך. כמה עבודה עושה עליו השדה, באלקטרון-וולט ובג'אול?

      (ב) פרוטון עובר את אותו הפרש פוטנציאלים, באותו כיוון. כמה עבודה עושה עליו השדה, באלקטרון-וולט?

      (ג) אנרגיה של חלקיק אחר היא $3.2\cdot10^{-17}\,\text{J}$. כמה זה באלקטרון-וולט?
    answer: >-
      (א) $1000\,\text{eV}$, כלומר $1.6\cdot10^{-16}\,\text{J}$.

      (ב) $500\,\text{eV}$.

      (ג) $200\,\text{eV}$.
    solution:
      - kind: given
        text: >-
          $q_\alpha = 2e$, $q_p = e$, הפרש הפוטנציאלים $V_A - V_B = 500\,\text{V}$, ו-$1\,\text{eV} = 1.6\cdot10^{-19}\,\text{J}$.
      - kind: formula
        text: >-
          $W_{A\to B} = q\,(V_A - V_B)$. כשהמטען כתוב ביחידות של $e$ והמתח בוולט, העבודה יוצאת ישר באלקטרון-וולט.
      - kind: substitution
        text: >-
          (א) $W = 2e \cdot 500\,\text{V} = 1000\,\text{eV}$. בג'אול: $1000 \cdot 1.6\cdot10^{-19} = 1.6\cdot10^{-16}\,\text{J}$.
      - kind: substitution
        text: >-
          (ב) $W = e \cdot 500\,\text{V} = 500\,\text{eV}$: חצי מהעבודה על חלקיק האלפא, כי המטען חצי.
      - kind: manipulation
        text: >-
          (ג) כל $1.6\cdot10^{-19}\,\text{J}$ הם אלקטרון-וולט אחד, ולכן כדי לדעת כמה אלקטרון-וולט יש באנרגיה מחלקים אותה ב-$1.6\cdot10^{-19}$:
          $$\frac{3.2\cdot10^{-17}}{1.6\cdot10^{-19}} = 200$$
      - kind: result
        text: >-
          (א) $1000\,\text{eV} = 1.6\cdot10^{-16}\,\text{J}$. (ב) $500\,\text{eV}$. (ג) $200\,\text{eV}$.

  - id: W-2.2-02
    level: basic
    qualitative: false
    objectives: [OBJ-2.2-2]
    prompt: >-
      במרחק $50$ ס״מ מכדור קטן וטעון הפוטנציאל הוא $V = -360\,\text{V}$ (אפס רחוק מאוד מהכדור).

      (א) מה המטען של הכדור, עם הסימן?

      (ב) באיזה מרחק מהכדור הפוטנציאל הוא $V = -1800\,\text{V}$?

      (ג) מה הפוטנציאל במרחק $1\,\text{m}$ מהכדור?
    answer: >-
      (א) $Q = -2\cdot10^{-8}\,\text{C}$, כלומר $Q = -20\,\text{nC}$.

      (ב) $0.1\,\text{m}$, כלומר $10$ ס״מ.

      (ג) $V = -180\,\text{V}$.
    solution:
      - kind: given
        text: >-
          $r_1 = 0.5\,\text{m}$, $V_1 = -360\,\text{V}$, $k = 9\cdot10^{9}\,\text{N}\cdot\text{m}^2/\text{C}^2$. הכדור קטן, ולכן אפשר לטפל בו כמו במטען נקודתי.
      - kind: formula
        text: >-
          $V = \dfrac{kQ}{r}$.
      - kind: manipulation
        text: >-
          (א) כופלים את שני האגפים ב-$r$ ומחלקים ב-$k$: $Q = \dfrac{V r}{k}$.
      - kind: substitution
        text: >-
          $Q = \dfrac{-360 \cdot 0.5}{9\cdot10^{9}} = -2\cdot10^{-8}\,\text{C}$. הסימן יוצא לבד: פוטנציאל שלילי סביב מטען יחיד אומר שהמטען שלילי.
      - kind: manipulation
        text: >-
          (ב) מבודדים את $r$: כופלים את שני האגפים ב-$r$ ומחלקים ב-$V$, ומקבלים $r = \dfrac{kQ}{V}$.
          $$r = \frac{9\cdot10^{9}\cdot(-2\cdot10^{-8})}{-1800} = 0.1\ \text{m}$$
      - kind: reasoning
        text: >-
          בדיקה בלי חישוב: $1800$ גדול פי 5 מ-$360$, ו-$V$ ביחס הפוך למרחק, ולכן המרחק קטן פי 5: $0.5/5 = 0.1\,\text{m}$.
      - kind: reasoning
        text: >-
          (ג) המרחק $1\,\text{m}$ כפול מ-$0.5\,\text{m}$, ולכן הפוטנציאל קטן בגודלו פי 2: $V = -360/2 = -180\,\text{V}$.
      - kind: result
        text: >-
          (א) $Q = -20\,\text{nC}$. (ב) $10$ ס״מ מהכדור. (ג) $V = -180\,\text{V}$.

  - id: W-2.2-03
    level: basic
    qualitative: true
    objectives: [OBJ-2.2-1, OBJ-2.2-3]
    prompt: >-
      שתי תלמידות מחשבות פוטנציאלים באותו מקום. נועה בוחרת $V = 0$ רחוק מאוד מכל המטענים, כמו בשיעור. מאיה בוחרת $V = 0$ בנקודה B שליד המטענים, נקודה שבה הפוטנציאל של נועה אינו אפס. לכן כל פוטנציאל של מאיה שונה מהפוטנציאל של נועה באותה נקודה, ובאותו מספר וולטים בכל הנקודות: בדיוק הפוטנציאל של B אצל נועה.

      איזה מהגדלים הבאים יוצא לשתיהן שווה, ואיזה שונה? נמקו.

      (א) הפוטנציאל בנקודה A.

      (ב) המתח בין A ל-B.

      (ג) האנרגיה הפוטנציאלית של מטען $q$ שמונח ב-A.

      (ד) העבודה שהשדה עושה על מטען $q$ שעובר מ-A ל-B.
    answer: >-
      (א) שונה. (ב) שווה. (ג) שונה. (ד) שווה: העבודה תלויה רק בהפרש הפוטנציאלים.
    solution:
      - kind: reasoning
        text: >-
          (א) מאיה מחסירה מכל פוטנציאל של נועה את אותו מספר, הפוטנציאל של B אצל נועה, שאינו אפס. לכן גם ב-A הפוטנציאל שלה שונה.
      - kind: reasoning
        text: >-
          (ב) המתח הוא הפרש: $V_A - V_B$. כשמחסירים את אותו מספר משני הפוטנציאלים, ההפרש לא משתנה. למשל, אם אצל נועה $V_A = 300\,\text{V}$ ו-$V_B = 100\,\text{V}$,
          אצל מאיה $V_A = 200\,\text{V}$ ו-$V_B = 0$. בשני המקרים המתח $200\,\text{V}$.
      - kind: reasoning
        text: >-
          (ג) $U = qV$, ו-$V$ ב-A שונה, ולכן גם $U$ שונה. גם האנרגיה הפוטנציאלית נמדדת ביחס לנקודה שבחרנו בה אפס.
      - kind: reasoning
        text: >-
          (ד) $W_{A\to B} = q\,(V_A - V_B)$ תלויה רק במתח, ולכן היא שווה לשתיהן. בדוגמה המספרית, למטען $q = 1\,\text{nC}$: $W = 10^{-9}\cdot 200 = 2\cdot10^{-7}\,\text{J}$ אצל שתיהן.
      - kind: result
        text: >-
          הפוטנציאל והאנרגיה הפוטנציאלית תלויים בבחירת האפס. המתח והעבודה לא תלויים בה: (ב) ו-(ד) שווים, (א) ו-(ג) שונים.

  - id: W-2.2-04
    level: mid
    qualitative: false
    objectives: [OBJ-2.2-2, OBJ-2.2-3]
    prompt: >-
      מטען $q_1 = +3\,\mu\text{C}$ נמצא בראשית, $x = 0$, ומטען $q_2 = -5\,\mu\text{C}$ נמצא ב-$x = 0.4\,\text{m}$. הנקודה P נמצאת ב-$x = 0.6\,\text{m}$, והנקודה R ב-$x = 1.0\,\text{m}$.

      (א) חשבו את הפוטנציאל ב-P וב-R.

      (ב) מטען $q = +1\,\text{nC}$ עובר מ-P ל-R. כמה עבודה עושה עליו השדה? האם הוא עובר לפוטנציאל גבוה יותר או נמוך יותר?
    answer: >-
      (א) $V_P = -1.8\cdot10^{5}\,\text{V}$, $V_R = -4.8\cdot10^{4}\,\text{V}$.

      (ב) $W = -1.32\cdot10^{-4}\,\text{J}$. המטען עובר לפוטנציאל גבוה יותר (פחות שלילי).
    solution:
      - kind: given
        text: >-
          המרחקים של P: $0.6\,\text{m}$ מ-$q_1$ ו-$0.2\,\text{m}$ מ-$q_2$. המרחקים של R: $1.0\,\text{m}$ מ-$q_1$ ו-$0.6\,\text{m}$ מ-$q_2$.
      - kind: formula
        text: >-
          $V = \dfrac{kq_1}{r_1} + \dfrac{kq_2}{r_2}$, עם הסימנים, ו-$W_{P\to R} = q\,(V_P - V_R)$.
      - kind: substitution
        text: >-
          $$V_P = \frac{9\cdot10^{9}\cdot 3\cdot10^{-6}}{0.6} + \frac{9\cdot10^{9}\cdot(-5\cdot10^{-6})}{0.2} = 4.5\cdot10^{4} - 2.25\cdot10^{5} = -1.8\cdot10^{5}\ \text{V}$$
      - kind: substitution
        text: >-
          $$V_R = \frac{9\cdot10^{9}\cdot 3\cdot10^{-6}}{1.0} + \frac{9\cdot10^{9}\cdot(-5\cdot10^{-6})}{0.6} = 2.7\cdot10^{4} - 7.5\cdot10^{4} = -4.8\cdot10^{4}\ \text{V}$$
      - kind: substitution
        text: >-
          $$W = 10^{-9}\cdot\big(-1.8\cdot10^{5} - (-4.8\cdot10^{4})\big) = 10^{-9}\cdot(-1.32\cdot10^{5}) = -1.32\cdot10^{-4}\ \text{J}$$
      - kind: reasoning
        text: >-
          $V_R = -4.8\cdot10^{4}\,\text{V}$ גבוה מ-$V_P = -1.8\cdot10^{5}\,\text{V}$: מספר שלילי קטן יותר בגודלו הוא גבוה יותר. לכן המטען החיובי עולה לפוטנציאל גבוה יותר, והעבודה של השדה עליו שלילית.
      - kind: result
        text: >-
          (א) $V_P = -1.8\cdot10^{5}\,\text{V}$, $V_R = -4.8\cdot10^{4}\,\text{V}$. (ב) $W = -1.32\cdot10^{-4}\,\text{J}$: המטען עולה לפוטנציאל גבוה יותר, נגד הכוח.

  - id: W-2.2-05
    level: mid
    qualitative: true
    objectives: [OBJ-2.2-3]
    prompt: >-
      מטען עובר מנקודה A לנקודה B, והשדה עושה עליו עבודה שלילית. ידוע שהפוטנציאל ב-A גבוה מהפוטנציאל ב-B.

      (א) האם המטען חיובי או שלילי? נמקו.

      (ב) עכשיו המטען חוזר מ-B ל-A באותו מסלול. מה סימן העבודה של השדה עליו?

      (ג) המטען עובר שוב מ-A ל-B, אבל במסלול אחר וארוך יותר. האם העבודה של השדה שונה מזו של המעבר הראשון? נמקו.
    answer: >-
      (א) שלילי. (ב) חיובית. (ג) לא: אותה עבודה, כי היא תלויה רק בפוטנציאלים של נקודות ההתחלה והסיום.
    solution:
      - kind: formula
        text: >-
          $W_{A\to B} = q\,(V_A - V_B)$.
      - kind: reasoning
        text: >-
          (א) $V_A > V_B$, ולכן $V_A - V_B > 0$. העבודה שלילית, ומכפלה של מספר חיובי ב-$q$ שלילית רק כש-$q < 0$. המטען שלילי.
      - kind: reasoning
        text: >-
          (ב) בחזרה $W_{B\to A} = q\,(V_B - V_A) = -W_{A\to B}$: אותו גודל, סימן הפוך. העבודה חיובית. זה מתאים לכך שמטען שלילי "נופל" לכיוון הפוטנציאל הגבוה.
      - kind: reasoning
        text: >-
          (ג) השדה החשמלי משמר (שיעור 2.1), ולכן העבודה בין שתי נקודות לא תלויה במסלול. לכן גם $W = q\,(V_A - V_B)$ כוללת רק את הפוטנציאלים בהתחלה ובסוף.
      - kind: result
        text: >-
          (א) המטען שלילי. (ב) העבודה חיובית. (ג) העבודה זהה לזו של המעבר הראשון: היא לא תלויה במסלול.

  - id: W-2.2-06
    level: mid
    qualitative: false
    objectives: [OBJ-2.2-1, OBJ-2.2-3]
    prompt: >-
      מטען $q = -3\,\text{nC}$ עובר מנקודה A לנקודה B, והשדה עושה עליו עבודה $W = -6\cdot10^{-5}\,\text{J}$. הפוטנציאל ב-B הוא $V_B = -5000\,\text{V}$.

      (א) מה המתח $V_A - V_B$?

      (ב) מה הפוטנציאל ב-A?

      (ג) פרוטון עובר מ-A ל-B. כמה עבודה עושה עליו השדה, באלקטרון-וולט ובג'אול?
    answer: >-
      (א) $V_A - V_B = 2\cdot10^{4}\,\text{V}$.

      (ב) $V_A = 1.5\cdot10^{4}\,\text{V}$.

      (ג) $2\cdot10^{4}\,\text{eV}$, כלומר $3.2\cdot10^{-15}\,\text{J}$.
    solution:
      - kind: given
        text: >-
          $q = -3\cdot10^{-9}\,\text{C}$, $W_{A\to B} = -6\cdot10^{-5}\,\text{J}$, $V_B = -5000\,\text{V}$.
      - kind: formula
        text: >-
          $W_{A\to B} = q\,(V_A - V_B)$.
      - kind: manipulation
        text: >-
          (א) הנעלם הוא המתח, והוא מוכפל ב-$q$. לכן מחלקים את שני האגפים ב-$q$: $V_A - V_B = \dfrac{W_{A\to B}}{q}$.
      - kind: substitution
        text: >-
          $$V_A - V_B = \frac{-6\cdot10^{-5}}{-3\cdot10^{-9}} = 2\cdot10^{4}\ \text{V}$$
          המתח חיובי: A בפוטנציאל גבוה יותר מ-B.
      - kind: substitution
        text: >-
          (ב) $V_A = V_B + 2\cdot10^{4} = -5000 + 20000 = 1.5\cdot10^{4}\,\text{V}$.
      - kind: substitution
        text: >-
          (ג) לפרוטון $q = +e$: $W = e \cdot 2\cdot10^{4}\,\text{V} = 2\cdot10^{4}\,\text{eV}$. בג'אול: $2\cdot10^{4}\cdot 1.6\cdot10^{-19} = 3.2\cdot10^{-15}\,\text{J}$.
      - kind: result
        text: >-
          (א) $2\cdot10^{4}\,\text{V}$. (ב) $V_A = 1.5\cdot10^{4}\,\text{V}$. (ג) $W = 2\cdot10^{4}\,\text{eV} = 3.2\cdot10^{-15}\,\text{J}$, חיובית: הפרוטון יורד לפוטנציאל נמוך יותר.

  - id: W-2.2-07
    level: mid
    qualitative: true
    objectives: [OBJ-2.2-2, OBJ-2.2-3]
    prompt: >-
      שני מטענים חיוביים שווים, $+Q$, נמצאים על ציר x, ב-$x = -d$ וב-$x = +d$. הנקודה O היא הראשית, והנקודה P נמצאת על ציר y, במרחק $d$ מעל O.

      (א) באיזו נקודה הפוטנציאל גבוה יותר, O או P? נמקו בלי לחשב מספרים.

      (ב) אלקטרון עובר מ-O ל-P. מה סימן העבודה שהשדה עושה עליו?

      (ג) פרוטון עובר מ-O ל-P. מה סימן העבודה שהשדה עושה עליו?
    answer: >-
      (א) ב-O. (ב) שלילית. (ג) חיובית.
    solution:
      - kind: reasoning
        text: >-
          (א) בשתי הנקודות שני המטענים תורמים פוטנציאל חיובי, ושתי התרומות שוות, כי כל נקודה נמצאת באותו מרחק משני המטענים.
          מ-O המרחק לכל מטען הוא $d$. מ-P המרחק לכל מטען הוא היתר במשולש ישר זווית שניצביו $d$ ו-$d$, ולכן הוא גדול מ-$d$.
          במרחק גדול יותר כל תרומה $kQ/r$ קטנה יותר, ולכן $V_O > V_P$.
      - kind: formula
        text: >-
          $W_{O\to P} = q\,(V_O - V_P)$, ו-$V_O - V_P > 0$.
      - kind: reasoning
        text: >-
          (ב) לאלקטרון $q < 0$, ולכן $W < 0$: האלקטרון יורד לפוטנציאל נמוך יותר, נגד הכוח עליו.
      - kind: reasoning
        text: >-
          (ג) לפרוטון $q > 0$, ולכן $W > 0$: מטען חיובי שיורד לפוטנציאל נמוך יותר זז בכיוון הכוח.
      - kind: result
        text: >-
          (א) $V_O > V_P$. (ב) העבודה על האלקטרון שלילית. (ג) העבודה על הפרוטון חיובית.

  - id: W-2.2-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-2.2-2, OBJ-2.2-3]
    prompt: >-
      ריבוע ABCD, שאורך צלעו $20$ ס״מ, מונח כך ש-AB היא הצלע התחתונה ו-CD העליונה: A בפינה השמאלית התחתונה, B בימנית התחתונה, C בימנית העליונה ו-D בשמאלית העליונה.
      בפינות A ו-B יש מטענים של $+2\,\text{nC}$ כל אחד, ובפינה C מטען של $-1\,\text{nC}$. O הוא מרכז הריבוע.

      (א) איזה מטען $q_4$ צריך לשים בפינה D כדי שהפוטנציאל ב-O יהיה אפס?

      (ב) עם המטען שמצאתם ב-D, חשבו את הפוטנציאל בנקודה M, אמצע הצלע AB.

      (ג) מטען $q = -5\,\text{nC}$ עובר מ-O ל-M. כמה עבודה עושה עליו השדה?

      (ד) N היא אמצע הצלע CD. קבעו את הפוטנציאל ב-N בלי חישוב חדש, ונמקו.
    answer: >-
      (א) $q_4 = -3\,\text{nC}$.

      (ב) $V_M \approx 199\,\text{V}$.

      (ג) $W \approx 9.95\cdot10^{-7}\,\text{J}$, כלומר בערך $10^{-6}\,\text{J}$.

      (ד) $V_N \approx -199\,\text{V}$.
    solution:
      - kind: given
        text: >-
          $a = 0.2\,\text{m}$. $q_A = q_B = 2\cdot10^{-9}\,\text{C}$, $q_C = -10^{-9}\,\text{C}$.
      - kind: reasoning
        text: >-
          (א) כל ארבע הפינות באותו מרחק מ-O, ולכן $V_O = \dfrac{k\,(q_A + q_B + q_C + q_4)}{r}$, והוא אפס כשסכום המטענים אפס:
          $2 + 2 - 1 + q_4 = 0$ (בננו-קולון), ולכן $q_4 = -3\,\text{nC}$.
      - kind: given
        text: >-
          (ב) מרחקים מ-M: לפינות A ו-B $0.1\,\text{m}$. לפינות C ו-D, לפי משפט פיתגורס, $\sqrt{0.1^2 + 0.2^2} = \sqrt{0.05} \approx 0.224\,\text{m}$.
      - kind: substitution
        text: >-
          המטענים הקרובים, $+2$ ו-$+2\,\text{nC}$, נמצאים באותו מרחק ממש, ולכן אפשר לחבר אותם. כך גם את הרחוקים, $-1$ ו-$-3\,\text{nC}$:
          $$V_M = \frac{9\cdot10^{9}\cdot 4\cdot10^{-9}}{0.1} + \frac{9\cdot10^{9}\cdot(-4\cdot10^{-9})}{0.224} \approx 360 - 161 = 199\ \text{V}$$
      - kind: formula
        text: >-
          (ג) $W_{O\to M} = q\,(V_O - V_M)$.
      - kind: substitution
        text: >-
          $$W = (-5\cdot10^{-9})\cdot(0 - 199) \approx 9.95\cdot10^{-7}\ \text{J}$$
          העבודה חיובית: מטען שלילי שעובר לפוטנציאל גבוה יותר מקבל מהשדה עבודה חיובית, כמו אלקטרון ש"נופל" לכיוון הפוטנציאל הגבוה.
      - kind: reasoning
        text: >-
          (ד) מ-N, הפינות הקרובות הן C ו-D (במרחק $0.1\,\text{m}$), וסכום המטענים בהן $-4\,\text{nC}$. הפינות הרחוקות הן A ו-B (במרחק $0.224\,\text{m}$), וסכום המטענים בהן $+4\,\text{nC}$.
          זה בדיוק החישוב של M עם כל הסימנים הפוכים, ולכן $V_N = -V_M$.
      - kind: result
        text: >-
          (א) $q_4 = -3\,\text{nC}$. (ב) $V_M \approx 199\,\text{V}$. (ג) $W \approx 9.95\cdot10^{-7}\,\text{J}$, חיובית. (ד) $V_N \approx -199\,\text{V}$.

  - id: W-2.2-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-2.2-1, OBJ-2.2-2, OBJ-2.2-3]
    prompt: >-
      במודל פשוט של אטום המימן, אלקטרון נמצא במרחק $r = 5.3\cdot10^{-11}\,\text{m}$ מפרוטון. הפרוטון הוא מטען נקודתי $+e$, והפוטנציאל אפס רחוק מאוד ממנו.

      (א) מה הפוטנציאל שהפרוטון יוצר במקום שבו נמצא האלקטרון?

      (ב) מה האנרגיה הפוטנציאלית של האלקטרון שם, באלקטרון-וולט ובג'אול?

      (ג) מרחיקים את האלקטרון מהפרוטון למרחק $2r$. כמה עבודה עושה עליו השדה של הפרוטון, באלקטרון-וולט?

      (ד) ואם מרחיקים אותו מהמרחק $r$ עד מרחק רב מאוד?
    answer: >-
      (א) $V \approx 27.2\,\text{V}$.

      (ב) $U \approx -27.2\,\text{eV}$, כלומר $U \approx -4.35\cdot10^{-18}\,\text{J}$.

      (ג) $W \approx -13.6\,\text{eV}$.

      (ד) $W \approx -27.2\,\text{eV}$.
    solution:
      - kind: given
        text: >-
          $Q = e = 1.6\cdot10^{-19}\,\text{C}$, $r = 5.3\cdot10^{-11}\,\text{m}$, ולאלקטרון $q = -e$.
      - kind: formula
        text: >-
          $V = \dfrac{kQ}{r}$, $U = qV$, ו-$W_{A\to B} = q\,(V_A - V_B)$.
      - kind: substitution
        text: >-
          (א)
          $$V = \frac{9\cdot10^{9}\cdot 1.6\cdot10^{-19}}{5.3\cdot10^{-11}} \approx 27.17\ \text{V}$$
          נעגל ל-$27.2\,\text{V}$ רק בתשובה, ובהמשך נשתמש בערך הלא מעוגל.
      - kind: substitution
        text: >-
          (ב) $U = (-e)\cdot 27.17\,\text{V} \approx -27.2\,\text{eV}$. בג'אול: $U = -27.17 \cdot 1.6\cdot10^{-19} \approx -4.35\cdot10^{-18}\,\text{J}$.
      - kind: reasoning
        text: >-
          (ג) במרחק כפול הפוטנציאל קטן פי 2: $V(2r) \approx 13.58\,\text{V}$. אז
          $$W = (-e)\,\big(V(r) - V(2r)\big) = (-e)\cdot(27.17 - 13.58)\ \text{V} \approx -13.6\ \text{eV}$$
      - kind: substitution
        text: >-
          (ד) רחוק מאוד $V = 0$:
          $$W = (-e)\,(27.17 - 0)\ \text{V} \approx -27.2\ \text{eV}$$
      - kind: reasoning
        text: >-
          העבודה שלילית בשני המקרים: האלקטרון נמשך אל הפרוטון, ומרחיקים אותו נגד הכוח. חצי מהעבודה נעשית כבר בדרך מ-$r$ ל-$2r$, כי הפוטנציאל יורד כמו $1/r$.
      - kind: result
        text: >-
          (א) $V \approx 27.2\,\text{V}$. (ב) $U \approx -27.2\,\text{eV} \approx -4.35\cdot10^{-18}\,\text{J}$. (ג) $W \approx -13.6\,\text{eV}$. (ד) $W \approx -27.2\,\text{eV}$.

  - id: W-2.2-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-2.2-2, OBJ-2.2-3]
    prompt: >-
      מטען $q_1 = +8\,\text{nC}$ נמצא בראשית, $x = 0$, ומטען $q_2$, שאינו ידוע, נמצא ב-$x = 0.5\,\text{m}$. הנקודה M באמצע ביניהם, ב-$x = 0.25\,\text{m}$, והפוטנציאל בה הוא $360\,\text{V}$.

      (א) מצאו את $q_2$, עם הסימן.

      (ב) מה הפוטנציאל בנקודה R, ב-$x = 1.0\,\text{m}$?

      (ג) אלקטרון עובר מ-M ל-R. כמה עבודה עושה עליו השדה, באלקטרון-וולט ובג'אול?

      (ד) משחררים אלקטרון ממנוחה ב-R. לאיזה כיוון הוא יתחיל לנוע? נמקו בעזרת הכוחות, ובדקו שהתשובה מתאימה לכלל על תנועת מטען שלילי ביחס לפוטנציאל.
    answer: >-
      (א) $q_2 = +2\,\text{nC}$.

      (ב) $V_R = 108\,\text{V}$.

      (ג) $W = -252\,\text{eV} \approx -4.0\cdot10^{-17}\,\text{J}$.

      (ד) שמאלה, אל המטענים: לכיוון הפוטנציאל הגבוה.
    solution:
      - kind: given
        text: >-
          $q_1 = 8\cdot10^{-9}\,\text{C}$. ב-M שני המטענים במרחק $0.25\,\text{m}$, ו-$V_M = 360\,\text{V}$.
      - kind: formula
        text: >-
          $V_M = \dfrac{kq_1}{r} + \dfrac{kq_2}{r} = \dfrac{k\,(q_1 + q_2)}{r}$, כי המרחקים שווים.
      - kind: manipulation
        text: >-
          (א) כופלים ב-$r$ ומחלקים ב-$k$, ואז מחסירים $q_1$: $q_2 = \dfrac{V_M\,r}{k} - q_1$.
          $$q_2 = \frac{360\cdot 0.25}{9\cdot10^{9}} - 8\cdot10^{-9} = 10^{-8} - 8\cdot10^{-9} = 2\cdot10^{-9}\ \text{C}$$
      - kind: substitution
        text: >-
          (ב) מ-R המרחק ל-$q_1$ הוא $1.0\,\text{m}$, והמרחק ל-$q_2$ הוא $0.5\,\text{m}$:
          $$V_R = \frac{9\cdot10^{9}\cdot 8\cdot10^{-9}}{1.0} + \frac{9\cdot10^{9}\cdot 2\cdot10^{-9}}{0.5} = 72 + 36 = 108\ \text{V}$$
      - kind: substitution
        text: >-
          (ג) $W_{M\to R} = (-e)\,(V_M - V_R) = (-e)\cdot(360 - 108)\,\text{V} = -252\,\text{eV}$. בג'אול: $W = -252\cdot 1.6\cdot10^{-19} \approx -4.03\cdot10^{-17}\,\text{J}$.
      - kind: reasoning
        text: >-
          (ד) שני המטענים חיוביים ונמצאים משמאל ל-R. השדה של כל אחד מהם ב-R מצביע הרחק ממנו, כלומר ימינה, ולכן השדה השקול ב-R ימינה.
          הכוח על אלקטרון הפוך לשדה: שמאלה. האלקטרון נע שמאלה, אל M, שבה הפוטנציאל גבוה יותר ($360\,\text{V}$ לעומת $108\,\text{V}$). זה מתאים לכלל: מטען שלילי זז לכיוון הפוטנציאל הגבוה.
      - kind: result
        text: >-
          (א) $q_2 = +2\,\text{nC}$. (ב) $V_R = 108\,\text{V}$. (ג) $W = -252\,\text{eV} \approx -4.0\cdot10^{-17}\,\text{J}$. (ד) שמאלה, לכיוון הפוטנציאל הגבוה.

challenge:
  - id: W-2.2-c1
    stars: 1
    objectives: [OBJ-2.2-2, OBJ-2.2-3]
    prompt: >-
      מטען $Q_A = +8\,\text{nC}$ מקובע ב-$x = -15$ ס״מ, ומטען $Q_B = -2\,\text{nC}$ מקובע ב-$x = +15$ ס״מ. מטען שלישי, $q = +2\,\text{nC}$, עובר מהראשית O אל הנקודה P שב-$x = 30$ ס״מ.
      הוא לא יכול לעבור בקו ישר, ולכן הוא עובר לאורך חצי מעגל שהקוטר שלו הוא הקטע OP.

      (א) למה המטען לא יכול לעבור מ-O ל-P בקו ישר?

      (ב) חשבו את הפוטנציאל ב-O וב-P.

      (ג) כמה עבודה עושה השדה על המטען $q$ לאורך חצי המעגל? בכמה השתנתה האנרגיה הפוטנציאלית שלו?

      (ד) הראו שלאורך כל חצי המעגל התרומה של $Q_B$ לפוטנציאל קבועה, וחשבו את העבודה שוב בדרך הזו.
    answer: >-
      (א) הקו הישר עובר דרך $Q_B$.

      (ב) $V_O = 360\,\text{V}$, $V_P = 40\,\text{V}$.

      (ג) $W = 6.4\cdot10^{-7}\,\text{J}$, והאנרגיה הפוטנציאלית קטנה ב-$6.4\cdot10^{-7}\,\text{J}$.

      (ד) המרכז של חצי המעגל הוא המקום של $Q_B$, ולכן התרומה של $Q_B$ היא $V_B = -120\,\text{V}$ בכל נקודה עליו. התרומה של $Q_A$ יורדת ב-$320\,\text{V}$, ושוב $W = 6.4\cdot10^{-7}\,\text{J}$.
    solution:
      - kind: given
        text: >-
          $Q_A = 8\cdot10^{-9}\,\text{C}$ ב-$x = -0.15\,\text{m}$, $Q_B = -2\cdot10^{-9}\,\text{C}$ ב-$x = 0.15\,\text{m}$, $q = 2\cdot10^{-9}\,\text{C}$. O ב-$x = 0$ ו-P ב-$x = 0.3\,\text{m}$.
      - kind: reasoning
        text: >-
          (א) $Q_B$ מקובע בדיוק באמצע הקטע OP. בקו ישר המטען $q$ היה נתקע במטען $Q_B$ עצמו: ככל שהוא מתקרב אליו, הכוח בין שני המטענים גדל בלי גבול.
      - kind: substitution
        text: >-
          (ב) מ-O שני המטענים במרחק $0.15\,\text{m}$:
          $$V_O = \frac{9\cdot10^{9}\cdot 8\cdot10^{-9}}{0.15} + \frac{9\cdot10^{9}\cdot(-2\cdot10^{-9})}{0.15} = 480 - 120 = 360\ \text{V}$$
      - kind: substitution
        text: >-
          מ-P המרחק ל-$Q_A$ הוא $0.45\,\text{m}$, והמרחק ל-$Q_B$ הוא $0.15\,\text{m}$:
          $$V_P = \frac{9\cdot10^{9}\cdot 8\cdot10^{-9}}{0.45} + \frac{9\cdot10^{9}\cdot(-2\cdot10^{-9})}{0.15} = 160 - 120 = 40\ \text{V}$$
      - kind: reasoning
        text: >-
          (ג) השדה משמר, ולכן העבודה לא תלויה בצורת המסלול, כל עוד הוא לא עובר דרך מטען:
          $$W_{O\to P} = q\,(V_O - V_P) = 2\cdot10^{-9}\cdot(360 - 40) = 6.4\cdot10^{-7}\ \text{J}$$
          לפי $\Delta U = -W$ (שיעור 2.1), האנרגיה הפוטנציאלית של $q$ קטנה ב-$6.4\cdot10^{-7}\,\text{J}$.
      - kind: reasoning
        text: >-
          (ד) המרכז של מעגל שהקוטר שלו OP הוא אמצע הקטע, $x = 0.15\,\text{m}$: בדיוק המקום של $Q_B$. כל נקודה על חצי המעגל רחוקה מ-$Q_B$ כרדיוס, $0.15\,\text{m}$.
          לכן התרומה של $Q_B$ זהה בכל נקודה על המסלול, $\dfrac{9\cdot10^{9}\cdot(-2\cdot10^{-9})}{0.15} = -120\,\text{V}$, ובהפרש $V_O - V_P$ היא מתבטלת.
      - kind: substitution
        text: >-
          נשארת רק התרומה של $Q_A$, שיורדת מ-$480\,\text{V}$ ל-$160\,\text{V}$:
          $$W = q\,(480 - 160) = 2\cdot10^{-9}\cdot 320 = 6.4\cdot10^{-7}\ \text{J}$$
      - kind: result
        text: >-
          (א) הקו הישר עובר דרך $Q_B$. (ב) $V_O = 360\,\text{V}$ ו-$V_P = 40\,\text{V}$. (ג) $W = 6.4\cdot10^{-7}\,\text{J}$, והאנרגיה הפוטנציאלית קטנה באותו שיעור.
          (ד) לאורך חצי המעגל התרומה של $Q_B$ היא תמיד $V_B = -120\,\text{V}$, ולכן רק $Q_A$ קובע את העבודה, ושוב $W = 6.4\cdot10^{-7}\,\text{J}$.
    source:
      name: JEE Main
      year: 2020
      problem: '4 September 2020, Shift 1, Physics Section A, Question 11'
      url: https://cracku.in/11-a-two-point-charges-4q-and-q-are-fixed-on-the-x-ax-x-nta-jee-main-4-sep-2020-shift-1-physics
      verified: '2026-11-02'
      adapted: true

  - id: W-2.2-c2
    stars: 2
    objectives: [OBJ-2.2-2, OBJ-2.2-3]
    prompt: >-
      במישור xy, מטען $-Q$ נמצא בראשית $(0, 0)$, ומטען $+Q/\sqrt3$ נמצא בנקודה $(2, 0)$. כל המרחקים במטרים.

      (א) מצאו את שתי הנקודות על ציר x שבהן הפוטנציאל אפס, והראו שאין נקודה כזו משמאל לראשית.

      (ב) הראו שכל הנקודות במישור שבהן הפוטנציאל אפס נמצאות על מעגל, ומצאו את המרכז שלו ואת הרדיוס שלו. רמז: כתבו את התנאי $V = 0$ כקשר בין שני המרחקים, והעלו את שני האגפים בריבוע.

      (ג) האם הפוטנציאל בתוך המעגל חיובי או שלילי? ומחוץ לו? נמקו.

      (ד) נתון $Q = 3\,\text{nC}$. פרוטון עובר ממרכז המעגל אל מרחק רב מאוד. כמה עבודה עושה עליו השדה, באלקטרון-וולט?
    answer: >-
      (א) $x = 3 - \sqrt3 \approx 1.27\,\text{m}$ ו-$x = 3 + \sqrt3 \approx 4.73\,\text{m}$.

      (ב) מעגל שמרכזו $(3, 0)$ ורדיוסו $\sqrt3 \approx 1.73\,\text{m}$.

      (ג) בתוך המעגל חיובי, ומחוץ לו שלילי.

      (ד) $W \approx +6.6\,\text{eV}$.
    solution:
      - kind: reasoning
        text: >-
          נסמן ב-$r_1$ את המרחק מהמטען $-Q$ וב-$r_2$ את המרחק מהמטען $+Q/\sqrt3$. הפוטנציאל אפס כשהתרומות שוות בגודלן:
          $$\frac{kQ}{r_1} = \frac{kQ}{\sqrt3\,r_2}$$
          מחלקים ב-$kQ$ והופכים את שני האגפים: $r_1 = \sqrt3\,r_2$. כלומר הנקודה רחוקה מ-$-Q$ פי $\sqrt3$ ממה שהיא רחוקה מ-$+Q/\sqrt3$.
      - kind: reasoning
        text: >-
          (א) משמאל לראשית כל נקודה קרובה יותר ל-$-Q$ מאשר למטען השני, $r_1 < r_2$, ולכן $r_1 = \sqrt3\,r_2$ בלתי אפשרי.
          בין המטענים $r_1 = x$ ו-$r_2 = 2 - x$: מ-$x = \sqrt3\,(2 - x)$ מקבלים $x\,(1 + \sqrt3) = 2\sqrt3$, ולכן $x = \dfrac{2\sqrt3}{1 + \sqrt3}$. כופלים מונה ומכנה ב-$\sqrt3 - 1$, והמכנה הופך ל-$3 - 1 = 2$: $x = 3 - \sqrt3 \approx 1.27$.
          מימין למטען השני $r_2 = x - 2$: מ-$x = \sqrt3\,(x - 2)$ מקבלים $x\,(\sqrt3 - 1) = 2\sqrt3$, ולכן $x = \dfrac{2\sqrt3}{\sqrt3 - 1}$. כופלים מונה ומכנה ב-$\sqrt3 + 1$: $x = 3 + \sqrt3 \approx 4.73$.
      - kind: manipulation
        text: >-
          (ב) בנקודה $(x, y)$: $r_1^2 = x^2 + y^2$ ו-$r_2^2 = (x - 2)^2 + y^2$. מעלים את $r_1 = \sqrt3\,r_2$ בריבוע:
          $$x^2 + y^2 = 3\big[(x - 2)^2 + y^2\big] = 3x^2 - 12x + 12 + 3y^2$$
          מעבירים הכול לאגף אחד ומחלקים ב-2: $x^2 - 6x + 6 + y^2 = 0$. משלימים לריבוע, $x^2 - 6x = (x - 3)^2 - 9$:
          $$(x - 3)^2 + y^2 = 3$$
      - kind: reasoning
        text: >-
          זו משוואה של מעגל שמרכזו $(3, 0)$ ורדיוסו $\sqrt3$. בדיקה: שתי הנקודות מסעיף (א), $3 \mp \sqrt3$, הן קצות הקוטר שלו על ציר x.
      - kind: reasoning
        text: >-
          (ג) המטען החיובי, ב-$(2, 0)$, נמצא בתוך המעגל: רחוק מהמרכז $1 < \sqrt3$. קרוב אליו התרומה שלו גוברת, והפוטנציאל חיובי.
          המטען $-Q$ נמצא מחוץ למעגל, רחוק מהמרכז $3 > \sqrt3$. רחוק מאוד משניהם $r_1 \approx r_2$, והתרומה של $-Q$, הגדול יותר בגודלו, גוברת: הפוטנציאל שלילי.
          כדי לעבור מנקודה שבה $V > 0$ לנקודה שבה $V < 0$, הפוטנציאל חייב לעבור דרך אפס, ואפס יש רק על המעגל.
          לכן בכל התחום שבתוך המעגל $V > 0$, ובכל התחום שמחוץ לו $V < 0$.
      - kind: substitution
        text: >-
          (ד) במרכז $(3, 0)$: $r_1 = 3\,\text{m}$, $r_2 = 1\,\text{m}$, והמטען השני $Q/\sqrt3 \approx 1.73\,\text{nC}$:
          $$V_c = \frac{9\cdot10^{9}\cdot(-3\cdot10^{-9})}{3} + \frac{9\cdot10^{9}\cdot 1.73\cdot10^{-9}}{1} \approx -9 + 15.6 = 6.6\ \text{V}$$
      - kind: substitution
        text: >-
          רחוק מאוד $V = 0$, ולפרוטון $q = +e$:
          $$W = e\,(V_c - 0) \approx 6.6\ \text{eV}$$
          העבודה חיובית, כמו שמתאים לסעיף (ג): הפרוטון יוצא מתחום חיובי ויורד לפוטנציאל נמוך יותר.
      - kind: result
        text: >-
          (א) $x = 3 \mp \sqrt3$, כלומר בערך $1.27\,\text{m}$ ו-$4.73\,\text{m}$. (ב) מעגל שמרכזו $(3, 0)$ ורדיוסו $\sqrt3\,\text{m}$. (ג) בפנים $V > 0$, בחוץ $V < 0$. (ד) $W \approx 6.6\,\text{eV}$.
