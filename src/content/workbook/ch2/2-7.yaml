# Workbook, lesson 2.7 (energy in a capacitor). Format and rules: see .claude/CLAUDE.md, "Worked examples, workbook".
# Every number was recomputed with src/physics/capacitors.ts (energyCV, energyQC, plateState, plateCapacitance,
# plateForce); ε₀ = 8.85·10⁻¹² as on the formula sheet.
# In a >- block, consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '2.7'
practice:
  - id: W-2.7-01
    level: basic
    qualitative: false
    objectives: [OBJ-2.7-1]
    prompt: >-
      מכשיר החייאה (דפיברילטור) צריך לאגור בקבל שלו אנרגיה של $200\,\text{J}$. הקיבול של הקבל $100\,\mu\text{F}$.

      א. לאיזה מתח צריך לטעון את הקבל?

      ב. מה המטען על הקבל במתח הזה?
    answer: >-
      א. $V = 2000\,\text{V}$.

      ב. $Q = 0.2\,\text{C}$.
    solution:
      - kind: given
        text: '$U = 200\,\text{J}$, $C = 100\,\mu\text{F} = 10^{-4}\,\text{F}$.'
      - kind: formula
        text: 'נתונים הקיבול והאנרגיה, והמתח חסר, ולכן משתמשים בצורה שבה מופיעים שלושתם: $U = \tfrac12 CV^2$.'
      - kind: manipulation
        text: >-
          מכפילים את שני האגפים ב-2 ומחלקים ב-$C$, כדי לבודד את $V^2$, ואז מוציאים שורש:
          $$V^2 = \frac{2U}{C} \qquad V = \sqrt{\frac{2U}{C}}$$
      - kind: substitution
        text: >-
          $$V = \sqrt{\frac{2\cdot 200}{10^{-4}}} = \sqrt{4\cdot10^{6}} = 2000\ \text{V}$$
          ב. $Q = CV = 10^{-4}\cdot 2000 = 0.2\,\text{C}$.
      - kind: reasoning
        text: 'בדיקה: $\tfrac12 QV = \tfrac12\cdot 0.2\cdot 2000 = 200\,\text{J}$.'
      - kind: result
        text: >-
          א. $V = 2000\,\text{V} = 2\,\text{kV}$.

          ב. $Q = 0.2\,\text{C}$.

  - id: W-2.7-02
    level: basic
    qualitative: true
    objectives: [OBJ-2.7-1]
    prompt: >-
      תלמידה כותבת: "לפי $U = \tfrac12 CV^2$ האנרגיה בקבל גדלה כשהקיבול גדל, אבל לפי $U = Q^2/(2C)$ היא קטנה כשהקיבול גדל. אחת הנוסחאות שגויה."
      קבעו ונמקו: האם יש כאן סתירה? הדגימו בקבל שמגדילים את הקיבול שלו פי 2, פעם כשהוא מחובר לסוללה ופעם כשהוא מנותק.
    answer: 'אין סתירה. שתי הנוסחאות נכונות; כל אחת מתאימה למצב אחר. במתח קבוע (מחובר) קיבול כפול נותן אנרגיה כפולה; במטען קבוע (מנותק) קיבול כפול נותן חצי אנרגיה.'
    solution:
      - kind: reasoning
        text: >-
          שתי הנוסחאות שוות, כי $Q = CV$: אם מציבים $V = Q/C$ ב-$\tfrac12 CV^2$ מקבלים $\tfrac12 C\cdot Q^2/C^2 = Q^2/(2C)$.
          ההבדל הוא מה **קבוע** כשהקיבול משתנה. אי אפשר לשנות את $C$ ולהשאיר גם את $V$ וגם את $Q$ קבועים, כי $Q = CV$.
      - kind: reasoning
        text: >-
          קבל מחובר: הסוללה מחזיקה את $V$ קבוע. ב-$U = \tfrac12 CV^2$ רק $C$ משתנה, ולכן קיבול כפול נותן אנרגיה כפולה. (המטען גדל פי 2, ולכן ב-$Q^2/(2C)$ המונה גדל פי 4 והמכנה פי 2: גם כאן פי 2.)
      - kind: reasoning
        text: >-
          קבל מנותק: $Q$ קבוע. ב-$U = Q^2/(2C)$ רק $C$ משתנה, ולכן קיבול כפול נותן חצי אנרגיה. (המתח קטן פי 2, ולכן ב-$\tfrac12 CV^2$ הגורם $C$ גדל פי 2 והגורם $V^2$ קטן פי 4: גם כאן חצי.)
      - kind: result
        text: 'אין סתירה. בוחרים את הצורה שבה הגודל הקבוע מופיע: מחובר, $\tfrac12 CV^2$, והאנרגיה גדלה פי 2; מנותק, $Q^2/(2C)$, והאנרגיה קטנה פי 2.'

  - id: W-2.7-03
    level: basic
    qualitative: false
    objectives: [OBJ-2.7-3]
    prompt: >-
      סוללה של $12\,\text{V}$ טוענת קבל ריק. מדידה מראה שבזמן הטעינה התחממו החוטים, והתפתח בהם חום של $3.6\cdot10^{-3}\,\text{J}$.

      א. כמה אנרגיה נאגרה בקבל, וכמה עבודה עשתה הסוללה?

      ב. מה הקיבול של הקבל?
    answer: >-
      א. בקבל $3.6\cdot10^{-3}\,\text{J}$; הסוללה עשתה $7.2\cdot10^{-3}\,\text{J}$.

      ב. $C = 50\,\mu\text{F}$.
    solution:
      - kind: given
        text: '$V = 12\,\text{V}$, החום בחוטים $3.6\cdot10^{-3}\,\text{J}$, הקבל התחיל ריק.'
      - kind: reasoning
        text: >-
          א. בטעינה של קבל ריק מסוללה, הסוללה עושה עבודה $QV$, ובקבל נאגרת חצי ממנה, $\tfrac12 QV$. החצי השני הופך לחום. לכן החום שווה לאנרגיה שנאגרה: $U = 3.6\cdot10^{-3}\,\text{J}$, והעבודה של הסוללה כפולה: $W = 7.2\cdot10^{-3}\,\text{J}$.
      - kind: formula
        text: 'ב. $U = \tfrac12 CV^2$, עם המתח הסופי על הקבל, שהוא המתח של הסוללה.'
      - kind: manipulation
        text: >-
          מכפילים ב-2 ומחלקים ב-$V^2$:
          $$C = \frac{2U}{V^2}$$
      - kind: substitution
        text: >-
          $$C = \frac{2\cdot 3.6\cdot10^{-3}}{12^2} = \frac{7.2\cdot10^{-3}}{144} = 5\cdot10^{-5}\ \text{F}$$
      - kind: result
        text: >-
          א. נאגרו $3.6\cdot10^{-3}\,\text{J}$, והסוללה עשתה $7.2\cdot10^{-3}\,\text{J}$.

          ב. $C = 5\cdot10^{-5}\,\text{F} = 50\,\mu\text{F}$.

  - id: W-2.7-04
    level: mid
    qualitative: false
    objectives: [OBJ-2.7-1]
    prompt: >-
      ברגע מסוים בזמן הטעינה של קבל, המטען עליו $40\,\mu\text{C}$ והאנרגיה האגורה בו $0.4\,\text{mJ}$.

      א. מה המתח על הקבל ברגע הזה, ומה הקיבול שלו?

      ב. ממשיכים לטעון. מה יהיה המטען על הקבל כשהאנרגיה האגורה תהיה $1.6\,\text{mJ}$, ומה יהיה אז המתח?
    answer: >-
      א. $V = 20\,\text{V}$, $C = 2\,\mu\text{F}$.

      ב. $Q = 80\,\mu\text{C}$, $V = 40\,\text{V}$.
    solution:
      - kind: given
        text: '$Q = 4\cdot10^{-5}\,\text{C}$, $U = 0.4\,\text{mJ} = 4\cdot10^{-4}\,\text{J}$.'
      - kind: formula
        text: 'א. נתונים $Q$ ו-$U$, ולכן נוח להתחיל מ-$U = \tfrac12 QV$.'
      - kind: manipulation
        text: >-
          מכפילים ב-2 ומחלקים ב-$Q$:
          $$V = \frac{2U}{Q}$$
      - kind: substitution
        text: >-
          $$V = \frac{2\cdot 4\cdot10^{-4}}{4\cdot10^{-5}} = 20\ \text{V}
          \qquad
          C = \frac{Q}{V} = \frac{4\cdot10^{-5}}{20} = 2\cdot10^{-6}\ \text{F}$$
      - kind: reasoning
        text: >-
          ב. הקיבול לא משתנה בזמן הטעינה, ולפי $U = Q^2/(2C)$ האנרגיה ביחס ישר לריבוע המטען. האנרגיה גדלה פי $1.6/0.4 = 4$, ולכן המטען גדל פי $\sqrt4 = 2$: $Q = 80\,\mu\text{C}$. המתח $V = Q/C$ גדל גם הוא פי 2, ל-$40\,\text{V}$.
      - kind: reasoning
        text: 'בדיקה: $\tfrac12 QV = \tfrac12\cdot 8\cdot10^{-5}\cdot 40 = 1.6\cdot10^{-3}\,\text{J}$.'
      - kind: result
        text: >-
          א. $V = 20\,\text{V}$, $C = 2\,\mu\text{F}$.

          ב. $Q = 80\,\mu\text{C}$, $V = 40\,\text{V}$.

  - id: W-2.7-05
    level: mid
    qualitative: true
    objectives: [OBJ-2.7-2]
    prompt: >-
      קבל לוחות נטען ל-$300\,\text{V}$ ונותק מהסוללה. אחר כך מקרבים את הלוחות זה לזה, עד שהמתח ביניהם יורד ל-$100\,\text{V}$. קבעו ונמקו:

      א. פי כמה קטן המרחק בין הלוחות?

      ב. מה קרה לשדה בין הלוחות ולאנרגיה האגורה?

      ג. האנרגיה השתנתה. מי עשה עבודה, ומה הסימן שלה?
    answer: >-
      א. פי 3.

      ב. השדה לא השתנה; האנרגיה קטנה פי 3.

      ג. המשיכה בין הלוחות עשתה עבודה חיובית; היד שהחזיקה את הלוח עשתה עבודה שלילית, שגודלה כמו הירידה באנרגיה.
    solution:
      - kind: given
        text: 'הקבל מנותק, ולכן המטען $Q$ קבוע. המתח ירד פי 3, מ-$300\,\text{V}$ ל-$100\,\text{V}$.'
      - kind: reasoning
        text: >-
          א. $V = Q/C$ עם $Q$ קבוע, ולכן הקיבול גדל פי 3. בקבל לוחות $C = \varepsilon_0 A/d$, והשטח לא השתנה, ולכן המרחק קטן פי 3.
      - kind: reasoning
        text: >-
          ב. השדה בין הלוחות הוא $E = \sigma/\varepsilon_0$. המטען והשטח לא השתנו, ולכן גם צפיפות המטען והשדה לא השתנו. (בדיקה: $E = V/d$, והמתח והמרחק קטנו שניהם פי 3.)
          האנרגיה: $U = \tfrac12 QV$, עם $Q$ קבוע ו-$V$ שקטן פי 3, ולכן היא קטנה פי 3.
      - kind: reasoning
        text: >-
          ג. הלוחות טעונים במטענים מנוגדים ומושכים זה את זה. כשהם מתקרבים, כוח המשיכה פועל בכיוון התנועה ועושה עבודה חיובית. אם הלוח זז לאט, בלי לצבור אנרגיה קינטית, היד מחזיקה אותו נגד המשיכה ועושה עבודה שלילית, שגודלה שווה לירידה באנרגיה של הקבל.
      - kind: result
        text: 'א. המרחק קטן פי 3. ב. השדה לא השתנה; האנרגיה קטנה פי 3. ג. המשיכה בין הלוחות עשתה עבודה חיובית, והאנרגיה שירדה עברה דרך היד, שעשתה עבודה שלילית.'

  - id: W-2.7-06
    level: mid
    qualitative: false
    objectives: [OBJ-2.7-2]
    prompt: >-
      קבל לוחות באוויר: שטח הלוחות $0.05\,\text{m}^2$, והמרחק ביניהם $1\,\text{mm}$. הקבל מחובר לסוללה של $50\,\text{V}$. בלי לנתק אותו, מרחיקים את הלוחות ל-$3\,\text{mm}$.

      א. חשבו את האנרגיה האגורה לפני ההרחקה ואחריה.

      ב. כמה מטען חזר לסוללה?

      ג. מה השדה בין הלוחות לפני ההרחקה ואחריה?
    answer: >-
      א. לפני $5.5\cdot10^{-7}\,\text{J}$, אחרי $1.8\cdot10^{-7}\,\text{J}$ (פי 3 פחות).

      ב. $1.5\cdot10^{-8}\,\text{C}$.

      ג. לפני $5\cdot10^{4}\,\text{V/m}$, אחרי $1.7\cdot10^{4}\,\text{V/m}$.
    solution:
      - kind: given
        text: '$A = 0.05\,\text{m}^2$, $d_1 = 10^{-3}\,\text{m}$, $d_2 = 3\cdot10^{-3}\,\text{m}$, $V = 50\,\text{V}$ קבוע (הקבל מחובר), $\varepsilon_0 = 8.85\cdot10^{-12}\,\text{C}^2/(\text{N}\cdot\text{m}^2)$.'
      - kind: formula
        text: '$C = \dfrac{\varepsilon_0 A}{d}$, $U = \tfrac12 CV^2$ (המתח קבוע), $Q = CV$, $E = V/d$.'
      - kind: substitution
        text: >-
          א. $$C_1 = \frac{8.85\cdot10^{-12}\cdot 0.05}{10^{-3}} = 4.425\cdot10^{-10}\ \text{F}
          \qquad
          U_1 = \tfrac12\cdot 4.425\cdot10^{-10}\cdot 50^2 \approx 5.5\cdot10^{-7}\ \text{J}$$
          במרחק פי 3 הקיבול קטן פי 3: $C_2 = 1.475\cdot10^{-10}\,\text{F}$, ו-$U_2 = \tfrac12\cdot 1.475\cdot10^{-10}\cdot 50^2 \approx 1.8\cdot10^{-7}\,\text{J}$.
      - kind: substitution
        text: >-
          ב. $Q_1 = C_1 V = 2.2125\cdot10^{-8}\,\text{C}$ ו-$Q_2 = C_2 V = 7.375\cdot10^{-9}\,\text{C}$. ההפרש חזר לסוללה:
          $$\Delta Q = Q_1 - Q_2 = 1.475\cdot10^{-8} \approx 1.5\cdot10^{-8}\ \text{C}$$
      - kind: substitution
        text: >-
          ג. $E_1 = \dfrac{50}{10^{-3}} = 5\cdot10^{4}\,\text{V/m}$, ו-$E_2 = \dfrac{50}{3\cdot10^{-3}} \approx 1.7\cdot10^{4}\,\text{V/m}$: אותו מתח מתפרש על מרחק פי 3.
      - kind: result
        text: >-
          א. $U_1 \approx 5.5\cdot10^{-7}\,\text{J}$, $U_2 \approx 1.8\cdot10^{-7}\,\text{J}$.

          ב. $\Delta Q \approx 1.5\cdot10^{-8}\,\text{C}$.

          ג. $E_1 = 5\cdot10^{4}\,\text{V/m}$, $E_2 \approx 1.7\cdot10^{4}\,\text{V/m}$.

  - id: W-2.7-07
    level: mid
    qualitative: true
    objectives: [OBJ-2.7-2, OBJ-2.7-1]
    prompt: >-
      שני קבלי לוחות זהים, P ו-R, נטענים מאותה סוללה. את P משאירים מחובר לסוללה, ואת R מנתקים ממנה. אחר כך מרחיקים בשני הקבלים את הלוחות למרחק פי 3 מהמרחק ההתחלתי. קבעו ונמקו:

      א. באיזה קבל אגורה עכשיו יותר אנרגיה, ופי כמה?

      ב. באיזה קבל השדה בין הלוחות חזק יותר, ופי כמה?
    answer: >-
      א. ב-R, פי 9.

      ב. ב-R, פי 3.
    solution:
      - kind: given
        text: 'לפני ההרחקה לשני הקבלים אותו קיבול $C$, אותו מתח $V$, ולכן אותה אנרגיה $U_0$ ואותו שדה $E_0$. בשניהם הקיבול קטן פי 3, ל-$C/3$.'
      - kind: reasoning
        text: >-
          P (מחובר): המתח נשאר $V$. לפי $U = \tfrac12 CV^2$ האנרגיה קטנה פי 3, ל-$U_0/3$. השדה $E = V/d$ קטן פי 3, ל-$E_0/3$.
      - kind: reasoning
        text: >-
          R (מנותק): המטען נשאר $Q = CV$. לפי $U = Q^2/(2C)$ האנרגיה גדלה פי 3, ל-$3U_0$. השדה תלוי רק בצפיפות המטען, $E = \sigma/\varepsilon_0$, ולכן הוא נשאר $E_0$.
      - kind: reasoning
        text: 'היחסים: $\dfrac{U_R}{U_P} = \dfrac{3U_0}{U_0/3} = 9$, ו-$\dfrac{E_R}{E_P} = \dfrac{E_0}{E_0/3} = 3$.'
      - kind: result
        text: 'א. ב-R אגורה אנרגיה פי 9 מאשר ב-P. ב. השדה ב-R חזק פי 3.'

  - id: W-2.7-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-2.7-2, OBJ-2.7-3]
    prompt: >-
      קבל לוחות של $6\,\mu\text{F}$ מחובר לסוללה של $50\,\text{V}$. בלי לנתק אותו, מרחיקים לאט את הלוחות למרחק כפול.

      א. מה האנרגיה האגורה לפני ההרחקה ואחריה?

      ב. כמה מטען חזר לסוללה, וכמה אנרגיה קיבלה הסוללה?

      ג. כמה עבודה עשתה היד שהרחיקה את הלוחות? הראו שמאזן האנרגיה נסגר.

      ד. מה משתנה אם מנתקים את הקבל מהסוללה לפני ההרחקה: כמה עבודה הייתה עושה היד אז?
    answer: >-
      א. לפני $7.5\cdot10^{-3}\,\text{J}$, אחרי $3.75\cdot10^{-3}\,\text{J}$.

      ב. $1.5\cdot10^{-4}\,\text{C}$; הסוללה קיבלה $7.5\cdot10^{-3}\,\text{J}$.

      ג. $3.75\cdot10^{-3}\,\text{J}$.

      ד. $7.5\cdot10^{-3}\,\text{J}$, פי 2.
    solution:
      - kind: given
        text: '$C = 6\cdot10^{-6}\,\text{F}$, $V = 50\,\text{V}$ קבוע כל עוד הקבל מחובר. במרחק כפול $C'' = 3\cdot10^{-6}\,\text{F}$.'
      - kind: substitution
        text: >-
          א. $$U_1 = \tfrac12\cdot 6\cdot10^{-6}\cdot 50^2 = 7.5\cdot10^{-3}\ \text{J}
          \qquad
          U_2 = \tfrac12\cdot 3\cdot10^{-6}\cdot 50^2 = 3.75\cdot10^{-3}\ \text{J}$$
      - kind: substitution
        text: >-
          ב. $Q_1 = CV = 3\cdot10^{-4}\,\text{C}$ ו-$Q_2 = C'V = 1.5\cdot10^{-4}\,\text{C}$, ולכן חזר לסוללה $\Delta Q = 1.5\cdot10^{-4}\,\text{C}$. המטען הזה עובר דרך הסוללה "הפוך", מההדק החיובי פנימה, במתח $V$, ולכן הסוללה מקבלת
          $$\Delta Q\cdot V = 1.5\cdot10^{-4}\cdot 50 = 7.5\cdot10^{-3}\ \text{J}$$
      - kind: reasoning
        text: >-
          ג. הלוחות זזים לאט, ולכן המתח על הקבל שווה בכל רגע למתח הסוללה: המטען חוזר בלי הפרש מתח, וכמעט לא נוצר חום. גם אנרגיה קינטית אין. לכן האנרגיה שהסוללה קיבלה באה משני מקורות: מהקבל, שאיבד $U_1 - U_2$, ומהעבודה $W$ של היד:
          $$W + (U_1 - U_2) = \Delta Q\cdot V$$
      - kind: manipulation
        text: >-
          מבודדים את $W$ (מעבירים את $U_1 - U_2$ לאגף השני):
          $$W = \Delta Q\cdot V - (U_1 - U_2) = 7.5\cdot10^{-3} - 3.75\cdot10^{-3} = 3.75\cdot10^{-3}\ \text{J}$$
          העבודה חיובית, כמו שמתאים: היד מושכת את הלוח בכיוון התנועה, נגד המשיכה בין הלוחות.
      - kind: reasoning
        text: >-
          ד. בקבל מנותק $Q = 3\cdot10^{-4}\,\text{C}$ נשמר, ואין סוללה במאזן: כל העבודה של היד נאגרת בקבל. אחרי ההרחקה $U = Q^2/(2C') = (3\cdot10^{-4})^2/(2\cdot 3\cdot10^{-6}) = 1.5\cdot10^{-2}\,\text{J}$, ולכן
          $W = 1.5\cdot10^{-2} - 7.5\cdot10^{-3} = 7.5\cdot10^{-3}\,\text{J}$.
          בקבל המנותק השדה, ולכן גם כוח המשיכה, נשאר קבוע. בקבל המחובר המטען והשדה קטנים בזמן ההרחקה, הכוח נחלש, והעבודה קטנה יותר.
      - kind: result
        text: >-
          א. $U_1 = 7.5\cdot10^{-3}\,\text{J}$, $U_2 = 3.75\cdot10^{-3}\,\text{J}$.

          ב. חזרו $1.5\cdot10^{-4}\,\text{C}$, והסוללה קיבלה $7.5\cdot10^{-3}\,\text{J}$.

          ג. $W = 3.75\cdot10^{-3}\,\text{J}$. מאזן: היד $3.75\cdot10^{-3}$ ועוד הקבל $3.75\cdot10^{-3}$ שווים לאנרגיה שהסוללה קיבלה, $7.5\cdot10^{-3}\,\text{J}$.

          ד. בקבל מנותק היד הייתה עושה $7.5\cdot10^{-3}\,\text{J}$, פי 2.

  - id: W-2.7-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-2.7-3, OBJ-2.7-1]
    prompt: >-
      קבל לוחות באוויר: שטח כל לוח $0.04\,\text{m}^2$, והמרחק ביניהם $5\,\text{mm}$. טוענים אותו ל-$1000\,\text{V}$ ומנתקים מהסוללה. לוח אחד מקובע, והשני מותקן על עגלה קלה שנוסעת בלי חיכוך על מסילה אופקית, בניצב ללוחות. המסה של הלוח עם העגלה $2\,\text{g}$. משחררים את הלוח החופשי ממנוחה.

      א. כמה אנרגיה אגורה בקבל ברגע השחרור?

      ב. מה מהירות הלוח רגע לפני שהוא פוגע בלוח הקבוע?

      ג. מה משתנה אם משחררים את הלוח כשהמרחק $10\,\text{mm}$, עם אותו מטען: פי כמה תגדל מהירות הפגיעה?
    answer: >-
      א. $U \approx 3.5\cdot10^{-5}\,\text{J}$.

      ב. $v \approx 0.19\,\text{m/s}$.

      ג. פי $\sqrt2$, לכ-$0.27\,\text{m/s}$.
    solution:
      - kind: given
        text: '$A = 0.04\,\text{m}^2$, $d = 5\cdot10^{-3}\,\text{m}$, $V = 1000\,\text{V}$, $m = 2\cdot10^{-3}\,\text{kg}$. הקבל מנותק, ולכן המטען קבוע. הלוח נע אופקית, ולכן הכבידה לא עושה עליו עבודה, והכוח הנורמלי מהמסילה ניצב לתנועה.'
      - kind: substitution
        text: >-
          א. $$C = \frac{\varepsilon_0 A}{d} = \frac{8.85\cdot10^{-12}\cdot 0.04}{5\cdot10^{-3}} = 7.08\cdot10^{-11}\ \text{F}
          \qquad
          U = \tfrac12 CV^2 = \tfrac12\cdot 7.08\cdot10^{-11}\cdot 1000^2 = 3.54\cdot10^{-5}\ \text{J}$$
      - kind: reasoning
        text: >-
          ב. הלוחות מושכים זה את זה, והמשיכה עושה עבודה חיובית על הלוח החופשי. בקבל מנותק השדה קבוע, ולכן $U = \tfrac12 QV = \tfrac12 QEd$ ביחס ישר למרחק. כשהמרחק כמעט אפס, גם האנרגיה האגורה כמעט אפס: כל האנרגיה שהייתה בקבל הפכה לאנרגיה קינטית של הלוח.
      - kind: formula
        text: 'שימור אנרגיה: $\tfrac12 m v^2 = U$.'
      - kind: manipulation
        text: >-
          מכפילים ב-2, מחלקים ב-$m$ ומוציאים שורש:
          $$v = \sqrt{\frac{2U}{m}}$$
      - kind: substitution
        text: >-
          $$v = \sqrt{\frac{2\cdot 3.54\cdot10^{-5}}{2\cdot10^{-3}}} = \sqrt{3.54\cdot10^{-2}} \approx 0.19\ \text{m/s}$$
      - kind: reasoning
        text: >-
          ג. עם אותו מטען, השדה זהה, והאנרגיה $\tfrac12 QEd$ ביחס ישר למרחק: במרחק כפול היא כפולה, $7.08\cdot10^{-5}\,\text{J}$. האנרגיה הקינטית בפגיעה כפולה, ולכן המהירות גדלה פי $\sqrt2$:
          $v = \sqrt{2\cdot 7.08\cdot10^{-5}/(2\cdot10^{-3})} \approx 0.27\,\text{m/s}$.
      - kind: result
        text: >-
          א. $U \approx 3.5\cdot10^{-5}\,\text{J}$.

          ב. $v \approx 0.19\,\text{m/s}$.

          ג. המהירות גדלה פי $\sqrt2$, לכ-$0.27\,\text{m/s}$.

  - id: W-2.7-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-2.7-2, OBJ-2.7-3]
    prompt: >-
      קבל של $3\,\mu\text{F}$ נטען בסוללה של $100\,\text{V}$ ומנותק ממנה. מרחיקים את הלוחות שלו למרחק פי 3.

      א. מה המתח על הקבל עכשיו, וכמה עבודה עשתה היד?

      ב. עכשיו מחברים את הקבל שוב לאותה סוללה, הדק חיובי ללוח החיובי. מה המטען והאנרגיה האגורה בסוף?

      ג. כמה מטען עבר בחיבור, ובאיזה כיוון? כמה אנרגיה קיבלה הסוללה, וכמה הפכה לחום?
    answer: >-
      א. $300\,\text{V}$; העבודה $3\cdot10^{-2}\,\text{J}$.

      ב. $Q = 10^{-4}\,\text{C}$, $U = 5\cdot10^{-3}\,\text{J}$.

      ג. $2\cdot10^{-4}\,\text{C}$ חזרו מהקבל לסוללה; הסוללה קיבלה $2\cdot10^{-2}\,\text{J}$, ו-$2\cdot10^{-2}\,\text{J}$ הפכו לחום.
    solution:
      - kind: given
        text: '$C = 3\cdot10^{-6}\,\text{F}$, $V_0 = 100\,\text{V}$. במרחק פי 3, $C'' = 10^{-6}\,\text{F}$.'
      - kind: substitution
        text: >-
          א. $Q = CV_0 = 3\cdot10^{-4}\,\text{C}$ נשמר. $V_1 = Q/C' = 3\cdot10^{-4}/10^{-6} = 300\,\text{V}$.
          $$U_0 = \tfrac12 CV_0^2 = 1.5\cdot10^{-2}\ \text{J}
          \qquad
          U_1 = \frac{Q^2}{2C'} = \frac{(3\cdot10^{-4})^2}{2\cdot10^{-6}} = 4.5\cdot10^{-2}\ \text{J}$$
          העבודה של היד היא תוספת האנרגיה: $W = U_1 - U_0 = 3\cdot10^{-2}\,\text{J}$.
      - kind: reasoning
        text: >-
          ב. אחרי החיבור, המתח על הקבל שווה שוב למתח הסוללה, $100\,\text{V}$, והקיבול עדיין $C'$.
          $Q_2 = C'V_0 = 10^{-6}\cdot 100 = 10^{-4}\,\text{C}$, ו-$U_2 = \tfrac12 C'V_0^2 = 5\cdot10^{-3}\,\text{J}$.
      - kind: reasoning
        text: >-
          ג. על הקבל היה מטען $3\cdot10^{-4}\,\text{C}$ ונשאר $10^{-4}\,\text{C}$, ולכן $\Delta Q = 2\cdot10^{-4}\,\text{C}$ עבר מהקבל אל הסוללה, דרכה "הפוך", מההדק החיובי פנימה. הסוללה מקבלת אנרגיה $\Delta Q\cdot V_0 = 2\cdot10^{-4}\cdot 100 = 2\cdot10^{-2}\,\text{J}$.
      - kind: reasoning
        text: >-
          הקבל איבד $U_1 - U_2 = 4.5\cdot10^{-2} - 0.5\cdot10^{-2} = 4\cdot10^{-2}\,\text{J}$. הסוללה קיבלה רק חצי מזה. השאר הפך לחום בחוטים, כי ברגע החיבור המתח על הקבל ($300\,\text{V}$) שונה מהמתח של הסוללה ($100\,\text{V}$), והמטען עובר בהפרש מתח, בדיוק כמו בטעינה של קבל ריק. החום:
          $$4\cdot10^{-2} - 2\cdot10^{-2} = 2\cdot10^{-2}\ \text{J}$$
      - kind: result
        text: >-
          א. $V_1 = 300\,\text{V}$, $W = 3\cdot10^{-2}\,\text{J}$.

          ב. $Q_2 = 10^{-4}\,\text{C}$, $U_2 = 5\cdot10^{-3}\,\text{J}$.

          ג. $2\cdot10^{-4}\,\text{C}$ חזרו מהקבל לסוללה. הסוללה קיבלה $2\cdot10^{-2}\,\text{J}$, ועוד $2\cdot10^{-2}\,\text{J}$ הפכו לחום.

challenge:
  - id: W-2.7-c1
    stars: 1
    objectives: [OBJ-2.7-2, OBJ-2.7-3]
    prompt: >-
      קבל לוחות באוויר: שטח הלוחות $0.05\,\text{m}^2$, והמרחק ההתחלתי ביניהם $d = 2\,\text{mm}$. הקבל מחובר לסוללה של $100\,\text{V}$, והאנרגיה האגורה בו $U_1$. בלי לנתק, מקרבים לאט את הלוחות עד למרחק $d/3$. אז מנתקים את הסוללה, ומחזירים לאט את הלוחות למרחק $d$. האנרגיה האגורה בסוף היא $U_3$.

      א. בטאו את $U_3$ בעזרת $U_1$.

      ב. חשבו את $U_1$ ואת ההפרש $U_3 - U_1$.

      ג. מי סיפק את ההפרש? חשבו כמה נתנה הסוללה וכמה עשתה היד בכל אחד משני השלבים.
    answer: >-
      א. $U_3 = 9U_1$.

      ב. $U_1 \approx 1.1\cdot10^{-6}\,\text{J}$, $U_3 - U_1 = 8U_1 \approx 8.9\cdot10^{-6}\,\text{J}$.

      ג. בשלב הראשון הסוללה נתנה $4U_1$ והיד עשתה עבודה שלילית שגודלה $2U_1$; בשלב השני היד עשתה $6U_1$. בסך הכול: הסוללה $4U_1$ והיד $4U_1$.
    solution:
      - kind: given
        text: '$A = 0.05\,\text{m}^2$, $d = 2\cdot10^{-3}\,\text{m}$, $V = 100\,\text{V}$. נסמן ב-$C$ את הקיבול ההתחלתי, כך ש-$U_1 = \tfrac12 CV^2$.'
      - kind: reasoning
        text: >-
          א. שלב 1 (מחובר, $V$ קבוע): במרחק $d/3$ הקיבול $3C$. המטען $Q_2 = 3CV$, והאנרגיה $U_2 = \tfrac12\cdot 3C\cdot V^2 = 3U_1$.
      - kind: reasoning
        text: >-
          שלב 2 (מנותק, $Q_2 = 3CV$ קבוע): במרחק $d$ הקיבול חוזר ל-$C$. לכן
          $$U_3 = \frac{Q_2^2}{2C} = \frac{9C^2V^2}{2C} = 9\cdot\tfrac12 CV^2 = 9U_1$$
          (והמתח בסוף $3V = 300\,\text{V}$.)
      - kind: substitution
        text: >-
          ב. $$C = \frac{8.85\cdot10^{-12}\cdot 0.05}{2\cdot10^{-3}} = 2.2125\cdot10^{-10}\ \text{F}
          \qquad
          U_1 = \tfrac12\cdot 2.2125\cdot10^{-10}\cdot 100^2 \approx 1.11\cdot10^{-6}\ \text{J}$$
          $$U_3 - U_1 = 8U_1 = 8.85\cdot10^{-6} \approx 8.9\cdot10^{-6}\ \text{J}$$
      - kind: reasoning
        text: >-
          ג. שלב 1: הסוללה העבירה מטען נוסף $\Delta Q = 3CV - CV = 2CV$ במתח $V$, ולכן נתנה $2CV^2 = 4U_1$. הקבל קיבל רק $U_2 - U_1 = 2U_1$. התנועה איטית, ולכן אין חום ואין אנרגיה קינטית, והיתרה, $2U_1$, עברה ליד: היד עשתה עבודה שלילית שגודלה $2U_1$, כי היא מחזיקה את הלוח נגד המשיכה בזמן שהוא מתקרב.
      - kind: reasoning
        text: >-
          שלב 2: אין סוללה. היד מרחיקה את הלוחות נגד המשיכה, וכל העבודה שלה נאגרת: $U_3 - U_2 = 9U_1 - 3U_1 = 6U_1$.
          בסך הכול: הסוללה נתנה $4U_1$, והיד $6U_1 - 2U_1 = 4U_1$. יחד $8U_1$, בדיוק ההפרש.
      - kind: result
        text: >-
          א. $U_3 = 9U_1$.

          ב. $U_1 \approx 1.1\cdot10^{-6}\,\text{J}$, ו-$U_3 - U_1 = 8U_1 \approx 8.9\cdot10^{-6}\,\text{J}$.

          ג. הסוללה סיפקה $4U_1$ (כולה בשלב 1), והיד סיפקה בסך הכול $4U_1$: עבודה שלילית שגודלה $2U_1$ בשלב 1, ו-$6U_1$ בשלב 2.
    source:
      name: British Physics Olympiad (BPhO), Round 1
      year: 2021
      problem: 'Round 1, 12 November 2021, Section 1, Question 1(s)'
      url: https://www.bpho.org.uk/Papers/R1/2021Nov_R1_S1.pdf
      verified: '2026-11-02'
      adapted: true

  - id: W-2.7-c2
    stars: 2
    objectives: [OBJ-2.7-3, OBJ-2.7-2]
    prompt: >-
      קבל לוחות באוויר: הלוחות מלבנים באורך $L = 0.2\,\text{m}$ וברוחב $w = 0.1\,\text{m}$ (שטח $0.02\,\text{m}^2$), והמרחק ביניהם $d = 4\,\text{mm}$. טוענים אותו ל-$200\,\text{V}$ ומנתקים מהסוללה. אחר כך מכניסים לאט בין הלוחות, לאורך $L$, לוח מתכת לא טעון באותן מידות ובעובי $d/2$, מקביל ללוחות, עד שהוא כולו בפנים (בלי לגעת בלוחות).

      א. מה השדה בתוך לוח המתכת, ומה השדה במרווחי האוויר שמשני צדדיו? נמקו.

      ב. מה המתח בין לוחות הקבל אחרי שלוח המתכת בפנים, ומה האנרגיה האגורה, לפני ההכנסה ואחריה?

      ג. כמה עבודה עשתה היד שהכניסה את לוח המתכת? מה הסימן שלה, ומה הוא אומר על הכוח שהקבל מפעיל על לוח המתכת?

      ד. מה משתנה אם הקבל נשאר מחובר לסוללה בזמן ההכנסה? חשבו את העבודה של היד גם במקרה הזה.

      ה. עדיין במקרה המחובר: לוח המתכת נכנס רק עד מרחק $x$ (בין $0$ ל-$L$). בטאו את הקיבול כפונקציה של $x$. חשבו את הכוח שבו הקבל מושך את לוח המתכת פנימה, והסבירו למה הוא לא תלוי ב-$x$.
    answer: >-
      א. בתוך המתכת אפס; במרווחי האוויר $5\cdot10^{4}\,\text{V/m}$, כמו לפני ההכנסה.

      ב. $100\,\text{V}$; האנרגיה יורדת מ-$8.85\cdot10^{-7}\,\text{J}$ ל-$4.4\cdot10^{-7}\,\text{J}$.

      ג. $W \approx -4.4\cdot10^{-7}\,\text{J}$: הקבל מושך את לוח המתכת פנימה, והיד מעכבת אותו.

      ד. האנרגיה גדלה ל-$1.77\cdot10^{-6}\,\text{J}$, הסוללה נותנת $1.77\cdot10^{-6}\,\text{J}$, והיד עושה $W \approx -8.9\cdot10^{-7}\,\text{J}$: שוב משיכה פנימה, חזקה יותר.

      ה. $C(x) = \dfrac{\varepsilon_0 w\,(L + x)}{d}$; הכוח $F = \dfrac{\varepsilon_0 w V^2}{2d} \approx 4.4\cdot10^{-6}\,\text{N}$, פנימה, בכל $x$: כל סנטימטר נוסף של לוח המתכת מוסיף לקיבול אותה תוספת.
    solution:
      - kind: given
        text: '$L = 0.2\,\text{m}$, $w = 0.1\,\text{m}$, $A = Lw = 0.02\,\text{m}^2$, $d = 4\cdot10^{-3}\,\text{m}$, $V = 200\,\text{V}$, עובי לוח המתכת $2\cdot10^{-3}\,\text{m}$.'
      - kind: substitution
        text: >-
          לפני ההכנסה:
          $$C = \frac{8.85\cdot10^{-12}\cdot 0.02}{4\cdot10^{-3}} = 4.425\cdot10^{-11}\ \text{F}
          \qquad
          Q = CV = 8.85\cdot10^{-9}\ \text{C}
          \qquad
          U_0 = \tfrac12 CV^2 = 8.85\cdot10^{-7}\ \text{J}$$
          והשדה $E = V/d = 200/(4\cdot10^{-3}) = 5\cdot10^{4}\,\text{V/m}$.
      - kind: reasoning
        text: >-
          א. לוח המתכת הוא מוליך, ובשיווי משקל אלקטרוסטטי השדה בתוך מוליך הוא אפס (שיעור 1.9): על פני השטח שלו נוצרים מטענים מושרים, $-Q$ מול הלוח החיובי ו-$+Q$ מול השלילי, שמבטלים את השדה בתוכו. במרווחי האוויר השדה נקבע מצפיפות המטען על לוחות הקבל, $E = \sigma/\varepsilon_0$. הקבל מנותק, ולכן המטען וצפיפות המטען לא השתנו, והשדה באוויר נשאר $5\cdot10^{4}\,\text{V/m}$.
      - kind: reasoning
        text: >-
          ב. המתח בין הלוחות הוא סכום המכפלות של השדה באורך של כל קטע. השדה פועל רק לאורך מרווחי האוויר, שאורכם הכולל $d - d/2 = d/2$, ובתוך המתכת התרומה אפס:
          $$V' = E\cdot\frac{d}{2} = 5\cdot10^{4}\cdot 2\cdot10^{-3} = 100\ \text{V}$$
          $$U' = \tfrac12 QV' = \tfrac12\cdot 8.85\cdot10^{-9}\cdot 100 = 4.425\cdot10^{-7}\ \text{J} = \tfrac12 U_0$$
          (הקיבול גדל פי 2: $C' = Q/V' = 8.85\cdot10^{-11}\,\text{F}$.)
      - kind: reasoning
        text: >-
          ג. הקבל מנותק, ולוח המתכת נכנס לאט, ולכן כל העבודה של היד היא שינוי האנרגיה האגורה:
          $$W = U' - U_0 = 4.425\cdot10^{-7} - 8.85\cdot10^{-7} \approx -4.4\cdot10^{-7}\ \text{J}$$
          העבודה שלילית: היד מושכת את לוח המתכת החוצה, נגד כיוון התנועה. כלומר הקבל מושך את לוח המתכת פנימה, והיד רק מעכבת אותו כדי שייכנס לאט. טיעון האנרגיה מספיק כדי לדעת זאת.
          מאיפה בא הכוח עצמו? לא מהמשיכה בין המטענים המושרים ללוחות הקבל שמולם: היא ניצבת ללוחות, והמשיכה למעלה והמשיכה למטה מתבטלות. את המשיכה בכיוון ההכנסה יוצר השדה העקום שליד קצות הלוחות, שבו קווי השדה כבר לא ניצבים ללוחות. המודל שלנו מזניח את השדה הזה בחישוב האנרגיה, אבל הוא זה שמושך את לוח המתכת פנימה.
      - kind: reasoning
        text: >-
          ד. כשהקבל מחובר, המתח נשאר $200\,\text{V}$. כמו בסעיף ב, השדה פועל רק לאורך $d/2$ של אוויר, ולכן במתח $V$ השדה באוויר הוא $V/(d/2) = 2V/d$, כפול מאשר בהתחלה. לפי $E = \sigma/\varepsilon_0$ גם צפיפות המטען והמטען כפולים, $2CV$, כלומר הקיבול $2C$, ולכן
          $U_2 = \tfrac12\cdot 2C\cdot V^2 = 2U_0 = 1.77\cdot10^{-6}\,\text{J}$.
          הסוללה העבירה מטען נוסף $\Delta Q = 2CV - CV = CV = 8.85\cdot10^{-9}\,\text{C}$ במתח $V$, ולכן נתנה $\Delta Q\cdot V = 1.77\cdot10^{-6}\,\text{J} = 2U_0$.
      - kind: manipulation
        text: >-
          התנועה איטית, ולכן אין חום ואין אנרגיה קינטית: העבודה של הסוללה ועוד העבודה $W$ של היד שוות לתוספת האנרגיה בקבל. מבודדים את $W$:
          $$W = (U_2 - U_0) - \Delta Q\cdot V = U_0 - 2U_0 = -U_0 \approx -8.9\cdot10^{-7}\ \text{J}$$
          שוב עבודה שלילית: גם בקבל מחובר לוח המתכת נמשך פנימה, והפעם העבודה כפולה, כי הסוללה מוסיפה מטען ומחזקת את השדה בזמן ההכנסה.
      - kind: reasoning
        text: >-
          ה. כשלוח המתכת בפנים עד מרחק $x$, הקבל הוא קבל אחד עם שני אזורים, שניהם במתח $V$. באזור הריק (באורך $L - x$) השדה $V/d$, ולכן צפיפות המטען על הלוח $\varepsilon_0 V/d$. באזור שבו לוח המתכת (באורך $x$) השדה פועל רק לאורך $d/2$ של אוויר, ולכן הוא $2V/d$, וצפיפות המטען $2\varepsilon_0 V/d$. המטען על הלוח הוא סכום שני האזורים:
          $$Q(x) = \frac{\varepsilon_0 V}{d}\,w\,(L - x) + \frac{2\varepsilon_0 V}{d}\,w\,x = \frac{\varepsilon_0 w V}{d}\,(L + x)$$
          מחלקים ב-$V$:
          $$C(x) = \frac{\varepsilon_0 w\,(L + x)}{d}$$
          הקיבול עולה בקו ישר עם $x$, מ-$C$ (ב-$x = 0$) עד $2C$ (ב-$x = L$). כל מטר של הכנסה מוסיף $\varepsilon_0 w/d = 8.85\cdot10^{-12}\cdot0.1/(4\cdot10^{-3}) = 2.2125\cdot10^{-10}\,\text{F}$.
      - kind: reasoning
        text: >-
          נכניס את לוח המתכת עוד קטע קטן $\Delta x$. הקיבול גדל ב-$\Delta C = (\varepsilon_0 w/d)\,\Delta x$. כמו בסעיף ד, האנרגיה בקבל גדלה ב-$\tfrac12 V^2\Delta C$, והסוללה נותנת $\Delta Q\cdot V = V^2\Delta C$. לכן העבודה של היד על הקטע היא $\tfrac12 V^2\Delta C - V^2\Delta C = -\tfrac12 V^2\Delta C$, וכוח המשיכה פנימה, שהיד מאזנת, הוא
          $$F = \frac{\tfrac12 V^2\,\Delta C}{\Delta x} = \frac{\varepsilon_0 w V^2}{2d}$$
      - kind: substitution
        text: >-
          $$F = \frac{8.85\cdot10^{-12}\cdot 0.1\cdot 200^2}{2\cdot 4\cdot10^{-3}} = 4.425\cdot10^{-6} \approx 4.4\cdot10^{-6}\ \text{N}$$
          בדיקה מול סעיף ד: כוח קבוע לאורך כל $L = 0.2\,\text{m}$ נותן עבודה $4.425\cdot10^{-6}\cdot0.2 = 8.85\cdot10^{-7}\,\text{J} = U_0$, בדיוק גודל העבודה של היד שם.
      - kind: reasoning
        text: >-
          למה הכוח לא תלוי ב-$x$? כל סנטימטר נוסף של לוח המתכת הופך רצועה של הקבל, באותו גודל, מאזור במרווח $d$ לאזור במרווח $d/2$, ולכן מוסיף לקיבול (ולאנרגיה ולעבודת הסוללה) אותה תוספת. גם השדה העקום שליד שפת לוח המתכת, שהוא מה שמושך, נראה אותו דבר בכל $x$, כל עוד השפה רחוקה מקצות הלוחות.
      - kind: result
        text: >-
          א. בתוך המתכת $E = 0$; באוויר $E = 5\cdot10^{4}\,\text{V/m}$, ללא שינוי.

          ב. $V' = 100\,\text{V}$. האנרגיה יורדת מ-$8.85\cdot10^{-7}\,\text{J}$ ל-$4.4\cdot10^{-7}\,\text{J}$, חצי.

          ג. $W \approx -4.4\cdot10^{-7}\,\text{J}$: הקבל מושך את לוח המתכת פנימה.

          ד. במחובר: האנרגיה גדלה ל-$1.77\cdot10^{-6}\,\text{J}$, הסוללה נותנת $1.77\cdot10^{-6}\,\text{J}$, והיד עושה $W \approx -8.9\cdot10^{-7}\,\text{J}$.

          ה. $C(x) = \varepsilon_0 w\,(L + x)/d$, ו-$F = \varepsilon_0 w V^2/(2d) \approx 4.4\cdot10^{-6}\,\text{N}$, פנימה, קבוע: הקיבול עולה בקו ישר עם $x$.
