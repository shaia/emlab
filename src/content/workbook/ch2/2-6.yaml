# Workbook, lesson 2.6 (the plate capacitor). Format and rules: see .claude/CLAUDE.md, "Worked examples, workbook".
# Every number was recomputed with src/physics/capacitors.ts (plateCapacitance, chargeOf, gapField, plateSigma,
# fieldFromSigma, plateState) and constants.ts; ε₀ = 8.85·10⁻¹², as on the formula sheet.
# In a >- block, consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '2.6'
practice:
  - id: W-2.6-01
    level: basic
    qualitative: false
    objectives: [OBJ-2.6-1]
    prompt: >-
      לקבל אחד קיבול של $2\,\mu\text{F}$, ולקבל שני קיבול של $0.5\,\mu\text{F}$. את הקבל הראשון מחברים לסוללה של $6\,\text{V}$.

      א. כמה מטען יש על כל לוח של הקבל הראשון?

      ב. לאיזה מתח צריך לטעון את הקבל השני כדי שיהיה עליו אותו מטען?
    answer: >-
      א. $12\,\mu\text{C}$ ($+12\,\mu\text{C}$ על לוח אחד ו-$-12\,\mu\text{C}$ על השני).

      ב. $24\,\text{V}$.
    solution:
      - kind: given
        text: >-
          $C_1 = 2\cdot10^{-6}\,\text{F}$, $V_1 = 6\,\text{V}$, $C_2 = 0.5\cdot10^{-6}\,\text{F}$.
      - kind: formula
        text: >-
          $C = \dfrac{Q}{V}$, ולכן $Q = CV$.
      - kind: substitution
        text: >-
          א. $Q = C_1V_1 = 2\cdot10^{-6}\cdot6 = 12\cdot10^{-6}\,\text{C}$.
      - kind: manipulation
        text: >-
          ב. כדי לבודד את המתח מכפילים את שני האגפים של $C = Q/V$ ב-$V$, ומחלקים ב-$C$:
          $$V = \frac{Q}{C}$$
      - kind: substitution
        text: >-
          $$V_2 = \frac{12\cdot10^{-6}}{0.5\cdot10^{-6}} = 24\ \text{V}$$
          לקבל השני קיבול קטן פי 4, ולכן הוא צריך מתח גדול פי 4 כדי לאגור אותו מטען.
      - kind: result
        text: >-
          א. $Q = 12\,\mu\text{C}$ על כל לוח, בסימנים מנוגדים.

          ב. $V_2 = 24\,\text{V}$.

  - id: W-2.6-02
    level: basic
    qualitative: false
    objectives: [OBJ-2.6-2]
    prompt: >-
      קבל לוחות באוויר בנוי משני לוחות עגולים שרדיוסם $5$ ס״מ, והמרחק ביניהם $0.2$ מ״מ.

      א. מה הקיבול שלו?

      ב. רוצים לבנות קבל עם אותו קיבול ואותו מרחק בין הלוחות, אבל מלוחות מרובעים. מה צריך להיות אורך הצלע שלהם?
    answer: >-
      א. $C \approx 3.48\cdot10^{-10}\,\text{F} = 348\,\text{pF}$.

      ב. כ-$8.9$ ס״מ.
    solution:
      - kind: given
        text: >-
          $r = 0.05\,\text{m}$, $d = 0.2\,\text{mm} = 2\cdot10^{-4}\,\text{m}$, $\varepsilon_0 = 8.85\cdot10^{-12}\,\text{C}^2/(\text{N}\cdot\text{m}^2)$.
      - kind: formula
        text: >-
          שטח עיגול $A = \pi r^2$, והקיבול $C = \dfrac{\varepsilon_0 A}{d}$.
      - kind: substitution
        text: >-
          א. $A = \pi\cdot0.05^2 = 7.85\cdot10^{-3}\,\text{m}^2$, ולכן
          $$C = \frac{8.85\cdot10^{-12}\cdot7.85\cdot10^{-3}}{2\cdot10^{-4}} = 3.48\cdot10^{-10}\ \text{F}$$
      - kind: reasoning
        text: >-
          ב. אותו קיבול ואותו מרחק פירושם אותו שטח: הצורה של הלוחות לא מופיעה בנוסחה, רק השטח. לכן צריך ריבוע ששטחו $7.85\cdot10^{-3}\,\text{m}^2$, ואורך הצלע שלו הוא השורש של השטח:
          $$a = \sqrt{7.85\cdot10^{-3}} = 0.0886\ \text{m}$$
      - kind: result
        text: >-
          א. $C = 3.48\cdot10^{-10}\,\text{F} = 348\,\text{pF}$.

          ב. צלע של כ-$8.9$ ס״מ.

  - id: W-2.6-03
    level: basic
    qualitative: true
    objectives: [OBJ-2.6-2]
    prompt: >-
      בקבלים אמיתיים הלוחות הם שתי רצועות ארוכות של רדיד מתכת דק, ושכבה דקה מאוד של חומר מבודד מפרידה ביניהן. את שלוש השכבות מגלגלים יחד לגליל קטן.

      א. הסבירו בעזרת הנוסחה של הקיבול של קבל לוחות למה הרצועות ארוכות ולמה השכבה המבודדת דקה.

      ב. מה היה קורה אילו שתי הרצועות נגעו זו בזו באיזשהו מקום?

      ג. בקבל מחובר לסוללה, מה מגביל את הדילול של השכבה המבודדת?
    answer: >-
      א. $C = \varepsilon_0A/d$: רצועה ארוכה נותנת שטח $A$ גדול, ושכבה דקה נותנת $d$ קטן; שניהם מגדילים את הקיבול.

      ב. הרצועות היו הופכות למוליך אחד, ולא היו יכולות להחזיק מטענים מנוגדים: אין קבל.

      ג. השדה $E = V/d$ גדל כשהשכבה דקה יותר, ושדה חזק מדי הופך גם חומר מבודד למוליך.
    solution:
      - kind: formula
        text: >-
          $C = \dfrac{\varepsilon_0 A}{d}$: הקיבול ביחס ישר לשטח הלוחות וביחס הפוך למרחק ביניהם.
      - kind: reasoning
        text: >-
          א. רצועה ארוכה היא לוח בשטח גדול, והגלגול מכניס את השטח הגדול לנפח קטן. השכבה המבודדת קובעת את המרחק בין הלוחות, ושכבה דקה פירושה $d$ קטן. שני הצעדים מגדילים את $C$, ולכן באותו מתח הקבל אוגר יותר מטען.
      - kind: reasoning
        text: >-
          ב. קבל הוא שני מוליכים **מבודדים** זה מזה. אילו הרצועות נגעו, מטען היה עובר ביניהן עד שהפוטנציאל של שתיהן שווה, כלומר עד שהמתח ביניהן אפס. אז אין עליהן מטענים מנוגדים, והקבל לא אוגר כלום.
      - kind: reasoning
        text: >-
          ג. כשהקבל מחובר לסוללה, המתח $V$ בין הלוחות קבוע, והשדה ביניהם $E = V/d$. ככל שהשכבה דקה יותר השדה חזק יותר, ובשדה חזק מספיק אלקטרונים נקרעים מהמולקולות, החומר המבודד הופך למוליך, וניצוץ פורץ דרכו.
      - kind: result
        text: >-
          א. שטח גדול ומרחק קטן מגדילים את $C = \varepsilon_0A/d$.

          ב. מגע הופך את שני הלוחות למוליך אחד, והקבל מפסיק לאגור מטען.

          ג. השדה $V/d$ גדל כשהשכבה מתדללת, ושדה חזק מדי פורץ את החומר המבודד.

  - id: W-2.6-04
    level: mid
    qualitative: false
    objectives: [OBJ-2.6-3, OBJ-2.6-2]
    prompt: >-
      קבל לוחות מחובר לסוללה. המרחק בין הלוחות $1.5$ מ״מ, שטח כל לוח $0.024\,\text{m}^2$, והשדה שנמדד בין הלוחות הוא $3\cdot10^{4}\,\text{V/m}$.

      א. מה המתח של הסוללה?

      ב. מה צפיפות המטען על הלוחות, ומה המטען על כל לוח?

      ג. מה הקיבול? חשבו אותו בשתי דרכים, והשוו.
    answer: >-
      א. $45\,\text{V}$.

      ב. $\sigma = 2.66\cdot10^{-7}\,\text{C/m}^2$, ו-$Q = 6.37\cdot10^{-9}\,\text{C}$.

      ג. $C = 1.42\cdot10^{-10}\,\text{F} = 142\,\text{pF}$ בשתי הדרכים.
    solution:
      - kind: given
        text: >-
          $d = 1.5\cdot10^{-3}\,\text{m}$, $A = 0.024\,\text{m}^2$, $E = 3\cdot10^{4}\,\text{V/m}$.
      - kind: formula
        text: >-
          בשדה אחיד $V = Ed$. בין הלוחות $E = \sigma/\varepsilon_0$, ו-$\sigma = Q/A$.
      - kind: substitution
        text: >-
          א. $V = Ed = 3\cdot10^{4}\cdot1.5\cdot10^{-3} = 45\,\text{V}$. הקבל מחובר לסוללה, ולכן זה גם המתח שלה.
      - kind: manipulation
        text: >-
          ב. מכפילים את שני האגפים של $E = \sigma/\varepsilon_0$ ב-$\varepsilon_0$: $\sigma = \varepsilon_0 E$. ומ-$\sigma = Q/A$, אחרי הכפלה ב-$A$: $Q = \sigma A$.
      - kind: substitution
        text: >-
          $$\sigma = 8.85\cdot10^{-12}\cdot3\cdot10^{4} = 2.655\cdot10^{-7}\ \text{C/m}^2$$
          $$Q = 2.655\cdot10^{-7}\cdot0.024 = 6.37\cdot10^{-9}\ \text{C}$$
          (בחישוב של $Q$ השתמשנו ב-$\sigma$ לפני העיגול.)
      - kind: substitution
        text: >-
          ג. מההגדרה: $C = \dfrac{Q}{V} = \dfrac{6.372\cdot10^{-9}}{45} = 1.42\cdot10^{-10}\,\text{F}$. ממבנה הקבל:
          $$C = \frac{\varepsilon_0 A}{d} = \frac{8.85\cdot10^{-12}\cdot0.024}{1.5\cdot10^{-3}} = 1.42\cdot10^{-10}\ \text{F}$$
          שתי הדרכים נותנות אותו מספר, כי שתיהן נובעות מאותם שלושה צעדים של הפיתוח.
      - kind: result
        text: >-
          א. $V = 45\,\text{V}$.

          ב. $\sigma = 2.66\cdot10^{-7}\,\text{C/m}^2$, $Q = 6.37\cdot10^{-9}\,\text{C}$.

          ג. $C = 1.42\cdot10^{-10}\,\text{F} = 142\,\text{pF}$.

  - id: W-2.6-05
    level: mid
    qualitative: true
    objectives: [OBJ-2.6-1, OBJ-2.6-2, OBJ-2.6-3]
    prompt: >-
      בגרף של המטען $Q$ כפונקציה של המתח $V$ משורטטים שני קווים ישרים שיוצאים מהראשית: קו I של קבל לוחות אחד, וקו II של קבל לוחות אחר. שטח הלוחות של שני הקבלים שווה, והשיפוע של קו I גדול פי 3 מהשיפוע של קו II.

      א. איזה גודל מייצג השיפוע של כל קו?

      ב. באיזה קבל הלוחות קרובים יותר זה לזה, ופי כמה?

      ג. מחברים כל אחד מהקבלים לסוללה זהה. באיזה קבל השדה בין הלוחות חזק יותר, ופי כמה? ובאיזה קבל צפיפות המטען גדולה יותר?
    answer: >-
      א. את הקיבול $C$.

      ב. בקבל I: המרחק בין הלוחות שלו קטן פי 3.

      ג. בקבל I השדה חזק פי 3, וגם צפיפות המטען גדולה פי 3.
    solution:
      - kind: reasoning
        text: >-
          א. השיפוע הוא $\Delta Q/\Delta V$. הקו עובר בראשית, ולכן השיפוע שווה ל-$Q/V$ בכל נקודה עליו, וזה הקיבול. לכן $C_I = 3C_{II}$.
      - kind: formula
        text: >-
          $C = \dfrac{\varepsilon_0 A}{d}$, $E = \dfrac{V}{d}$, $E = \dfrac{\sigma}{\varepsilon_0}$.
      - kind: reasoning
        text: >-
          ב. השטחים שווים, ולכן הקיבול ביחס הפוך למרחק בלבד. קיבול גדול פי 3 פירושו מרחק קטן פי 3: $d_I = d_{II}/3$.
      - kind: reasoning
        text: >-
          ג. אותה סוללה, ולכן אותו מתח $V$. השדה $E = V/d$, והמרחק בקבל I קטן פי 3, ולכן השדה בו גדול פי 3. מ-$E = \sigma/\varepsilon_0$, גם צפיפות המטען בקבל I גדולה פי 3. (אותה תשובה מהמטען: $Q = CV$ גדול פי 3, על אותו שטח.)
      - kind: result
        text: >-
          א. השיפוע הוא הקיבול.

          ב. בקבל I, והמרחק בו קטן פי 3.

          ג. בקבל I השדה וצפיפות המטען גדולים פי 3.

  - id: W-2.6-06
    level: mid
    qualitative: false
    objectives: [OBJ-2.6-2]
    prompt: >-
      תלמידים בונים קבל לוחות באוויר עם לוחות קבועים, ומודדים את הקיבול שלו בשלושה מרחקים שונים בין הלוחות. במרחק $1.0$ מ״מ הקיבול $300\,\text{pF}$, במרחק $2.0$ מ״מ הוא $150\,\text{pF}$, ובמרחק $3.0$ מ״מ הוא $100\,\text{pF}$.

      א. הראו שהמדידות מתאימות לטענה שהקיבול ביחס הפוך למרחק.

      ב. מה שטח הלוחות?

      ג. מה הקיבול הצפוי במרחק $0.5$ מ״מ?
    answer: >-
      א. המכפלה $Cd$ זהה בשלוש המדידות: $3\cdot10^{-13}\,\text{F}\cdot\text{m}$.

      ב. $A \approx 0.034\,\text{m}^2$.

      ג. $600\,\text{pF}$.
    solution:
      - kind: reasoning
        text: >-
          א. אם $C$ ביחס הפוך ל-$d$, המכפלה $Cd$ קבועה. בודקים: $300\cdot10^{-12}\cdot1.0\cdot10^{-3} = 150\cdot10^{-12}\cdot2.0\cdot10^{-3} = 100\cdot10^{-12}\cdot3.0\cdot10^{-3} = 3\cdot10^{-13}\,\text{F}\cdot\text{m}$. המכפלה זהה בשלוש המדידות.
      - kind: formula
        text: >-
          $C = \dfrac{\varepsilon_0 A}{d}$, ולכן $Cd = \varepsilon_0 A$: המכפלה הקבועה היא $\varepsilon_0$ כפול השטח.
      - kind: manipulation
        text: >-
          ב. מחלקים את שני האגפים של $Cd = \varepsilon_0 A$ ב-$\varepsilon_0$:
          $$A = \frac{Cd}{\varepsilon_0}$$
      - kind: substitution
        text: >-
          $$A = \frac{3\cdot10^{-13}}{8.85\cdot10^{-12}} = 0.0339\ \text{m}^2$$
      - kind: substitution
        text: >-
          ג. $C = \dfrac{Cd}{d} = \dfrac{3\cdot10^{-13}}{0.5\cdot10^{-3}} = 6\cdot10^{-10}\,\text{F} = 600\,\text{pF}$: חצי מהמרחק של המדידה הראשונה, ולכן פי 2 מהקיבול שלה.
      - kind: result
        text: >-
          א. $Cd = 3\cdot10^{-13}\,\text{F}\cdot\text{m}$ בכל המדידות, ולכן $C$ ביחס הפוך ל-$d$.

          ב. $A = 0.034\,\text{m}^2$ (למשל ריבוע שצלעו כ-$18$ ס״מ).

          ג. $C = 600\,\text{pF}$.

  - id: W-2.6-07
    level: mid
    qualitative: false
    objectives: [OBJ-2.6-3]
    prompt: >-
      קבל לוחות באוויר, ששטח כל לוח שלו $0.05\,\text{m}^2$ והמרחק בין לוחותיו $3$ מ״מ, מחובר לסוללה של $60\,\text{V}$. בלי לנתק את הסוללה, מקרבים את הלוחות למרחק של $1$ מ״מ.

      א. כמה מטען עובר דרך הסוללה בזמן הקירוב? האם הוא נוסף ללוחות או חוזר מהם?

      ב. מה השדה בין הלוחות לפני הקירוב ואחריו?
    answer: >-
      א. $1.77\cdot10^{-8}\,\text{C}$, שנוסף ללוחות (המטען על כל לוח גדל פי 3).

      ב. $2\cdot10^{4}\,\text{V/m}$ לפני, $6\cdot10^{4}\,\text{V/m}$ אחרי.
    solution:
      - kind: given
        text: >-
          $A = 0.05\,\text{m}^2$, $d_1 = 3\cdot10^{-3}\,\text{m}$, $d_2 = 10^{-3}\,\text{m}$, $V = 60\,\text{V}$ כל הזמן, כי הסוללה מחוברת.
      - kind: formula
        text: >-
          $C = \dfrac{\varepsilon_0 A}{d}$, $Q = CV$, $E = \dfrac{V}{d}$.
      - kind: substitution
        text: >-
          א. לפני:
          $$C_1 = \frac{8.85\cdot10^{-12}\cdot0.05}{3\cdot10^{-3}} = 1.475\cdot10^{-10}\ \text{F}, \qquad Q_1 = C_1V = 8.85\cdot10^{-9}\ \text{C}$$
          אחרי:
          $$C_2 = \frac{8.85\cdot10^{-12}\cdot0.05}{10^{-3}} = 4.425\cdot10^{-10}\ \text{F}, \qquad Q_2 = C_2V = 2.655\cdot10^{-8}\ \text{C}$$
      - kind: reasoning
        text: >-
          המטען על הלוחות גדל, ולכן הסוללה העבירה עוד מטען אל הלוחות: $\Delta Q = Q_2 - Q_1 = 2.655\cdot10^{-8} - 0.885\cdot10^{-8} = 1.77\cdot10^{-8}\,\text{C}$. הסוללה שומרת על המתח, לא על המטען: כשהקיבול גדל פי 3, היא מוסיפה מטען עד שהמתח שוב $60\,\text{V}$.
      - kind: substitution
        text: >-
          ב. $E_1 = \dfrac{60}{3\cdot10^{-3}} = 2\cdot10^{4}\,\text{V/m}$, ו-$E_2 = \dfrac{60}{10^{-3}} = 6\cdot10^{4}\,\text{V/m}$.
      - kind: result
        text: >-
          א. $\Delta Q = 1.77\cdot10^{-8}\,\text{C}$ עובר מהסוללה אל הלוחות.

          ב. השדה גדל פי 3, מ-$2\cdot10^{4}$ ל-$6\cdot10^{4}\,\text{V/m}$.

  - id: W-2.6-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-2.6-3, OBJ-2.6-2]
    prompt: >-
      מתכננים קבל לוחות באוויר שיחובר לסוללה של $1500\,\text{V}$. כשהשדה באוויר עולה על $3\cdot10^{6}\,\text{V/m}$, האוויר הופך למוליך וניצוץ קופץ בין הלוחות.

      א. מה המרחק הקטן ביותר האפשרי בין הלוחות?

      ב. במרחק הזה, מה צפיפות המטען על הלוחות? מה השטח הקטן ביותר של כל לוח, כדי שעל כל לוח יהיה מטען של $1\,\mu\text{C}$?

      ג. מה הקיבול של הקבל שתכננתם?

      ד. מחליפים את הסוללה בסוללה של $3000\,\text{V}$, ומשאירים את אותם לוחות. איך צריך לשנות את המרחק ביניהם כדי שלא יקפוץ ניצוץ, ומה יהיה אז המטען על כל לוח?
    answer: >-
      א. $0.5$ מ״מ.

      ב. $\sigma = 2.66\cdot10^{-5}\,\text{C/m}^2$, ו-$A \approx 0.038\,\text{m}^2$.

      ג. $C \approx 6.7\cdot10^{-10}\,\text{F} = 667\,\text{pF}$.

      ד. להגדיל את המרחק לפחות ל-$1$ מ״מ. במרחק המינימלי הזה, $1$ מ״מ בדיוק, המטען נשאר $1\,\mu\text{C}$; במרחק גדול יותר הוא קטן יותר.
    solution:
      - kind: given
        text: >-
          $V = 1500\,\text{V}$, השדה המרבי $E_{max} = 3\cdot10^{6}\,\text{V/m}$, $Q = 10^{-6}\,\text{C}$.
      - kind: formula
        text: >-
          $E = \dfrac{V}{d}$, $E = \dfrac{\sigma}{\varepsilon_0}$, $\sigma = \dfrac{Q}{A}$, $C = \dfrac{Q}{V}$.
      - kind: manipulation
        text: >-
          א. המתח קבוע, ולכן השדה גדל ככל שהמרחק קטן. המרחק הקטן ביותר הוא זה שבו השדה בדיוק $E_{max}$. מכפילים את $E = V/d$ ב-$d$ ומחלקים ב-$E$:
          $$d_{min} = \frac{V}{E_{max}} = \frac{1500}{3\cdot10^{6}} = 5\cdot10^{-4}\ \text{m}$$
      - kind: substitution
        text: >-
          ב. בשדה הזה $\sigma = \varepsilon_0 E_{max} = 8.85\cdot10^{-12}\cdot3\cdot10^{6} = 2.655\cdot10^{-5}\,\text{C/m}^2$. זו גם צפיפות המטען הגדולה ביותר שאפשר להגיע אליה בלי ניצוץ. מ-$\sigma = Q/A$, אחרי הכפלה ב-$A$ וחלוקה ב-$\sigma$:
          $$A = \frac{Q}{\sigma} = \frac{10^{-6}}{2.655\cdot10^{-5}} = 0.0377\ \text{m}^2$$
      - kind: substitution
        text: >-
          ג. $C = \dfrac{Q}{V} = \dfrac{10^{-6}}{1500} = 6.67\cdot10^{-10}\,\text{F}$. בדיקה ממבנה הקבל: $\dfrac{\varepsilon_0 A}{d} = \dfrac{8.85\cdot10^{-12}\cdot0.0377}{5\cdot10^{-4}} = 6.67\cdot10^{-10}\,\text{F}$.
      - kind: reasoning
        text: >-
          ד. במתח כפול, באותו מרחק, השדה היה $6\cdot10^{6}\,\text{V/m}$, מעל הסף. כדי שהשדה יישאר $3\cdot10^{6}\,\text{V/m}$ לכל היותר, צריך מרחק של לפחות $d = 3000/(3\cdot10^{6}) = 10^{-3}\,\text{m}$. במרחק הזה הקיבול קטן פי 2, ל-$3.33\cdot10^{-10}\,\text{F}$, והמתח גדל פי 2, ולכן $Q = CV = 3.33\cdot10^{-10}\cdot3000 = 10^{-6}\,\text{C}$: אותו מטען. זה לא מקרה: בשדה המרבי צפיפות המטען היא $\varepsilon_0E_{max}$, בלי קשר למתח, ולכן על אותם לוחות אפשר לאגור לכל היותר $1\,\mu\text{C}$.
      - kind: result
        text: >-
          א. $d_{min} = 0.5\,\text{mm}$.

          ב. $\sigma = 2.66\cdot10^{-5}\,\text{C/m}^2$, $A = 0.038\,\text{m}^2$.

          ג. $C = 6.67\cdot10^{-10}\,\text{F}$.

          ד. מרחק של לפחות $1\,\text{mm}$. במרחק המינימלי, $1\,\text{mm}$ בדיוק, המטען על כל לוח נשאר $1\,\mu\text{C}$; במרחק גדול יותר $C$ קטן יותר, וגם המטען.

  - id: W-2.6-09
    level: bagrut
    qualitative: true
    objectives: [OBJ-2.6-3, OBJ-2.6-2]
    prompt: >-
      קבל לוחות, שהמרחק בין לוחותיו $d$, מחובר לסוללה שהמתח שלה $V$, והמטען על כל לוח הוא $Q_0$. מכניסים בין הלוחות לוח מתכת לא טעון בעובי $d/2$, באותו שטח כמו לוחות הקבל, במקביל להם ובדיוק באמצע, כך שבכל צד נשאר רווח אוויר של $d/4$. הסוללה נשארת מחוברת.

      א. מה השדה בתוך לוח המתכת?

      ב. פי כמה משתנה השדה ברווחי האוויר לעומת השדה לפני הכנסת הלוח?

      ג. פי כמה משתנים הקיבול והמטען על לוחות הקבל?

      ד. איזה מטען מופיע על כל אחד משני הפנים של לוח המתכת?
    answer: >-
      א. אפס.

      ב. גדל פי 2.

      ג. שניהם גדלים פי 2.

      ד. $-2Q_0$ על פני הלוח שמול הלוח החיובי, ו-$+2Q_0$ על פני הלוח שמול הלוח השלילי.
    solution:
      - kind: reasoning
        text: >-
          א. לוח המתכת הוא מוליך. אחרי שהמטענים בו מפסיקים לזוז, השדה בתוכו אפס: אילו היה שם שדה, הוא היה מזיז את האלקטרונים החופשיים.
      - kind: formula
        text: >-
          בשדה אחיד $V = Ed$ לכל קטע, והמתח בין הלוחות הוא סכום המתחים לאורך הדרך מלוח ללוח. בין לוח לבין פני מתכת שמולו $E = \sigma/\varepsilon_0$.
      - kind: reasoning
        text: >-
          ב. השדה בשני רווחי האוויר שווה. הסיבה: נניח שעל הלוח החיובי צפיפות מטען $\sigma$. כל קווי השדה שיוצאים ממנו מסתיימים על פני המתכת שמולו, כי בתוך המתכת אין שדה. לכן על פני המתכת האלה יש צפיפות $-\sigma$, והשדה ברווח הוא $\sigma/\varepsilon_0$. לוח המתכת לא טעון, ולכן על הפנים השניים שלו יש $+\sigma$, ועל הלוח השלילי של הקבל $-\sigma$ (כך הקבל טעון תמיד). גם ברווח השני השדה $\sigma/\varepsilon_0$.
      - kind: manipulation
        text: >-
          הולכים מהלוח החיובי לשלילי: רווח אוויר באורך $d/4$, מתכת באורך $d/2$ שבה $E = 0$, ועוד רווח באורך $d/4$. סכום המתחים שווה למתח הסוללה:
          $$V = E\cdot\frac{d}{4} + 0\cdot\frac{d}{2} + E\cdot\frac{d}{4} = E\cdot\frac{d}{2} \quad\Longrightarrow\quad E = \frac{2V}{d}$$
          לפני הכנסת הלוח $E = V/d$, ולכן השדה ברווחים גדל פי 2.
      - kind: reasoning
        text: >-
          ג. $E = \sigma/\varepsilon_0$, ולכן אם השדה גדל פי 2, גם $\sigma$ גדלה פי 2, וכך גם המטען $Q = \sigma A$ על כל לוח: $Q = 2Q_0$. המתח לא השתנה, ולכן $C = Q/V$ גדל פי 2. הקבל מתנהג כמו קבל לוחות שהמרחק בו $d/2$: רק רווחי האוויר נחשבים.
      - kind: reasoning
        text: >-
          ד. לפי סעיף ב, על פני המתכת שמול הלוח החיובי יש מטען שווה ומנוגד למטען הלוח, $-2Q_0$, ועל הפנים השניים $+2Q_0$. הסכום אפס, כמו שצריך ללוח לא טעון.
      - kind: result
        text: >-
          א. $E = 0$ בתוך המתכת.

          ב. השדה ברווחי האוויר גדל פי 2, ל-$2V/d$.

          ג. הקיבול והמטען גדלים פי 2.

          ד. $-2Q_0$ מול הלוח החיובי ו-$+2Q_0$ מול הלוח השלילי.

  - id: W-2.6-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-2.6-3]
    prompt: >-
      שני לוחות אופקיים באורך $5$ ס״מ, במרחק $1$ ס״מ זה מזה, מחוברים לסוללה של $100\,\text{V}$, והלוח העליון מחובר להדק החיובי. אלקטרון נכנס בדיוק באמצע בין הלוחות, במהירות $2\cdot10^{7}\,\text{m/s}$ במקביל ללוחות. הזניחו את הכובד ואת השדה שליד שולי הלוחות.

      א. מה השדה בין הלוחות, ומה התאוצה של האלקטרון (גודל וכיוון)?

      ב. האם האלקטרון יוצא מבין הלוחות? אם לא, באיזה מרחק מתחילת הלוחות הוא פוגע בלוח, ובאיזה לוח?

      ג. בלי לנתק את הסוללה מרחיקים את הלוחות למרחק של $2$ ס״מ, ושוב אלקטרון נכנס בדיוק באמצע, באותה מהירות. האם הוא יוצא עכשיו? פי כמה השתנה המטען על הלוחות?
    answer: >-
      א. $E = 10^{4}\,\text{V/m}$, למטה; $a = 1.76\cdot10^{15}\,\text{m/s}^2$, למעלה.

      ב. לא: הוא פוגע בלוח העליון כ-$4.8$ ס״מ מתחילת הלוחות.

      ג. כן: הוא סוטה רק $2.75$ מ״מ ויוצא; המטען על הלוחות קטן פי 2.
    solution:
      - kind: given
        text: >-
          $L = 0.05\,\text{m}$, $d = 0.01\,\text{m}$, $V = 100\,\text{V}$, $v_0 = 2\cdot10^{7}\,\text{m/s}$, $e = 1.6\cdot10^{-19}\,\text{C}$, $m_e = 9.1\cdot10^{-31}\,\text{kg}$. האלקטרון נכנס במרחק $d/2 = 5\,\text{mm}$ מכל לוח.
      - kind: formula
        text: >-
          $E = \dfrac{V}{d}$, $a = \dfrac{eE}{m_e}$, ותנועה של קליע (שיעור 1.10): $x = v_0t$, $y = \tfrac12at^2$.
      - kind: substitution
        text: >-
          א. $E = \dfrac{100}{0.01} = 10^{4}\,\text{V/m}$, מהלוח העליון (החיובי) אל התחתון, כלומר למטה. הכוח על האלקטרון השלילי הפוך לשדה, כלומר למעלה:
          $$a = \frac{1.6\cdot10^{-19}\cdot10^{4}}{9.1\cdot10^{-31}} = 1.76\cdot10^{15}\ \text{m/s}^2$$
      - kind: substitution
        text: >-
          ב. אילו הלוחות לא היו עוצרים אותו, זמן המעבר היה $t = L/v_0 = 0.05/(2\cdot10^{7}) = 2.5\cdot10^{-9}\,\text{s}$, והסטייה למעלה בסוף הלוחות:
          $$y = \tfrac12\cdot1.76\cdot10^{15}\cdot(2.5\cdot10^{-9})^2 = 5.49\cdot10^{-3}\ \text{m}$$
          זה יותר מ-$5\,\text{mm}$, המרחק עד הלוח העליון. לכן האלקטרון פוגע בלוח העליון לפני הסוף.
      - kind: manipulation
        text: >-
          כדי למצוא איפה, מציבים $y = d/2$ ומבודדים את הזמן: מכפילים ב-2, מחלקים ב-$a$ ומוציאים שורש, $t = \sqrt{d/a}$. אחר כך $x = v_0t$:
          $$t = \sqrt{\frac{0.01}{1.76\cdot10^{15}}} = 2.39\cdot10^{-9}\ \text{s}, \qquad x = 2\cdot10^{7}\cdot2.39\cdot10^{-9} = 0.0477\ \text{m}$$
      - kind: reasoning
        text: >-
          ג. המתח נשאר $100\,\text{V}$ והמרחק הוכפל, ולכן השדה והתאוצה קטנים פי 2, וגם הסטייה בסוף הלוחות: $y = 5.49/2 = 2.75\,\text{mm}$. עכשיו המרחק עד הלוח הוא $10\,\text{mm}$, ולכן האלקטרון יוצא. הקיבול $\varepsilon_0A/d$ קטן פי 2 והמתח לא השתנה, ולכן המטען $Q = CV$ קטן פי 2.
      - kind: result
        text: >-
          א. $E = 10^{4}\,\text{V/m}$ למטה; $a = 1.76\cdot10^{15}\,\text{m/s}^2$ למעלה.

          ב. האלקטרון פוגע בלוח העליון, כ-$4.8$ ס״מ מתחילת הלוחות.

          ג. האלקטרון יוצא, אחרי סטייה של $2.75$ מ״מ; המטען על הלוחות קטן פי 2.

challenge:
  - id: W-2.6-c1
    stars: 1
    objectives: [OBJ-2.6-2]
    prompt: >-
      שני לוחות מתכת דקים וזהים, בשטח $0.02\,\text{m}^2$ כל אחד, טעונים מראש: על לוח 1 מטען של $+6\,\text{nC}$, ועל לוח 2 מטען של $+2\,\text{nC}$ (שימו לב: שני המטענים חיוביים). מקרבים אותם למרחק $1$ מ״מ זה מזה, במקביל, כך שהם יוצרים קבל לוחות; לוח 1 משמאל. הלוחות לא מחוברים לשום דבר. הזניחו את השדה שליד שולי הלוחות.

      א. מה השדה (גודל וכיוון) בין הלוחות, ומה השדה מחוץ להם, משמאל ומימין?

      ב. מה המתח בין הלוחות? הראו שהוא שווה ל-$(q_1 - q_2)/(2C)$, כאשר $C$ הוא הקיבול של הקבל.

      ג. תלמיד כותב: "המתח על קבל הוא $Q/C$, ולכן $V = q_1/C$". מצאו את הטעות. מתי $Q/C$ כן נותן את המתח?
    answer: >-
      א. בין הלוחות $1.13\cdot10^{4}\,\text{V/m}$, ימינה (מלוח 1 ללוח 2). בחוץ $2.26\cdot10^{4}\,\text{V/m}$, הרחק מהלוחות: שמאלה משמאל, ימינה מימין.

      ב. $V = 11.3\,\text{V}$, וזה $(q_1 - q_2)/(2C)$ עם $C = 177\,\text{pF}$.

      ג. $Q/C$ נכון רק כשעל הלוחות מטענים שווים ומנוגדים, $+Q$ ו-$-Q$. כאן הוא נותן $33.9\,\text{V}$, פי 3 מהנכון.
    solution:
      - kind: given
        text: >-
          $q_1 = 6\cdot10^{-9}\,\text{C}$, $q_2 = 2\cdot10^{-9}\,\text{C}$, $A = 0.02\,\text{m}^2$, $d = 10^{-3}\,\text{m}$.
      - kind: formula
        text: >-
          לוח טעון גדול לבדו יוצר משני צדדיו שדה אחיד $\dfrac{\sigma}{2\varepsilon_0}$, הרחק ממנו כשהוא חיובי (שיעור 1.8). השדה של שני הלוחות הוא סכום וקטורי של שני השדות (סופרפוזיציה), ובשדה אחיד $V = Ed$.
      - kind: reasoning
        text: >-
          א. בין הלוחות: השדה של לוח 1 מצביע הרחק ממנו, ימינה, והשדה של לוח 2 מצביע הרחק ממנו, שמאלה. לכן מחסרים. משמאל לשני הלוחות שני השדות מצביעים שמאלה, ומימין שניהם ימינה, ולכן מחברים:
          $$E_{in} = \frac{q_1 - q_2}{2\varepsilon_0 A}, \qquad E_{out} = \frac{q_1 + q_2}{2\varepsilon_0 A}$$
      - kind: substitution
        text: >-
          $$E_{in} = \frac{4\cdot10^{-9}}{2\cdot8.85\cdot10^{-12}\cdot0.02} = 1.13\cdot10^{4}\ \text{V/m}, \qquad E_{out} = \frac{8\cdot10^{-9}}{2\cdot8.85\cdot10^{-12}\cdot0.02} = 2.26\cdot10^{4}\ \text{V/m}$$
      - kind: manipulation
        text: >-
          ב. $V = E_{in}d = \dfrac{(q_1 - q_2)\,d}{2\varepsilon_0 A}$. כותבים $\dfrac{d}{\varepsilon_0 A} = \dfrac{1}{C}$, כי $C = \dfrac{\varepsilon_0 A}{d}$:
          $$V = \frac{q_1 - q_2}{2C}$$
      - kind: substitution
        text: >-
          $C = \dfrac{8.85\cdot10^{-12}\cdot0.02}{10^{-3}} = 1.77\cdot10^{-10}\,\text{F}$, ולכן $V = \dfrac{4\cdot10^{-9}}{2\cdot1.77\cdot10^{-10}} = 11.3\,\text{V}$. אותו מספר יוצא מ-$E_{in}d = 1.13\cdot10^{4}\cdot10^{-3}$.
      - kind: reasoning
        text: >-
          ג. בפיתוח של $C = Q/V$ הנחנו שעל הלוחות $+Q$ ו-$-Q$: רק אז השדה בחוץ אפס, וכל השדה $Q/(\varepsilon_0A)$ נמצא בין הלוחות. כאן המטענים לא מנוגדים. החלק "המשותף" של המטען, $(q_1 + q_2)/2 = 4\,\text{nC}$ על כל לוח, יוצר שדה רק מחוץ ללוחות, ולא תורם למתח ביניהם. רק החלק "המנוגד", $\pm(q_1 - q_2)/2 = \pm2\,\text{nC}$, יוצר את השדה שבין הלוחות. הנוסחה $V = Q/C$ עובדת עם $Q = (q_1 - q_2)/2$. התלמיד הציב $q_1$ וקיבל $q_1/C = 33.9\,\text{V}$. אם $q_2 = -q_1$, הנוסחה של סעיף ב נותנת $V = 2q_1/(2C) = q_1/C$: המקרה הרגיל של קבל.
      - kind: result
        text: >-
          א. $E_{in} = 1.13\cdot10^{4}\,\text{V/m}$ ימינה; $E_{out} = 2.26\cdot10^{4}\,\text{V/m}$, הרחק מהלוחות משני הצדדים.

          ב. $V = (q_1 - q_2)/(2C) = 11.3\,\text{V}$.

          ג. $Q/C$ נכון רק למטענים $+Q$ ו-$-Q$; כאן המטען שקובע את המתח הוא $(q_1 - q_2)/2$.
    source:
      name: JEE Main
      year: 2022
      problem: '29 July 2022, Shift 2 (question number not shown on the page)'
      url: https://competishun.com/two-identical-thin-metal-plates-has-charge-mathrmq_1-and-mathrmq_2-respectively-such-that-q_1q_2-the-plates-were-brought-close-to-each-other-to-form-a-parallel-plate-capacitor-of-capacitance-c-the-pot
      verified: '2026-11-02'
      adapted: true

  - id: W-2.6-c2
    stars: 1
    objectives: [OBJ-2.6-3, OBJ-2.6-2]
    prompt: >-
      שני לוחות מתכת גדולים, אנכיים ומקבילים, נמצאים במרחק $1$ ס״מ זה מזה ומחוברים למקור מתח $X$. פרוטון משתחרר ממנוחה בדיוק באמצע בין הלוחות, ומתחיל לנוע בזווית של $45^\circ$ לאנך. ($m_p = 1.67\cdot10^{-27}\,\text{kg}$, $g = 10\,\text{m/s}^2$.)

      א. מה המתח $X$?

      ב. כמה זמן עובר עד שהפרוטון פוגע באחד הלוחות, ומה מהירותו ברגע זה?

      ג. נניח שכל לוח הוא ריבוע שצלעו $10$ ס״מ. כמה מטען צריך להיות על כל לוח, ביחידות של המטען היסודי $e$? מה התוצאה אומרת על הניסוי?
    answer: >-
      א. $X \approx 1.0\cdot10^{-9}\,\text{V}$.

      ב. אחרי $0.032\,\text{s}$, במהירות $0.45\,\text{m/s}$.

      ג. כ-$0.06e$: פחות ממטען של אלקטרון אחד. מטען כזה לא קיים, ולכן אי אפשר להכין את המצב הזה עם לוחות כאלה.
    solution:
      - kind: given
        text: >-
          $d = 0.01\,\text{m}$, $m_p = 1.67\cdot10^{-27}\,\text{kg}$, $e = 1.6\cdot10^{-19}\,\text{C}$, $g = 10\,\text{m/s}^2$. הפרוטון במרחק $d/2 = 5\,\text{mm}$ מכל לוח.
      - kind: reasoning
        text: >-
          על הפרוטון פועלים שני כוחות קבועים: הכובד $m_pg$ למטה, והכוח החשמלי $eE$ אופקי (השדה בין לוחות אנכיים אופקי). הוא יוצא ממנוחה, ולכן הוא נע בקו ישר בכיוון הכוח השקול. זווית של $45^\circ$ לאנך פירושה ששני הרכיבים שווים: $eE = m_pg$.
      - kind: manipulation
        text: >-
          א. מחלקים את $eE = m_pg$ ב-$e$, ומציבים $E = X/d$:
          $$E = \frac{m_pg}{e} = \frac{1.67\cdot10^{-27}\cdot10}{1.6\cdot10^{-19}} = 1.04\cdot10^{-7}\ \text{V/m}, \qquad X = Ed = 1.04\cdot10^{-9}\ \text{V}$$
      - kind: substitution
        text: >-
          ב. התאוצה האופקית שווה לאנכית, $g$. הפרוטון פוגע בלוח כשהוא עובר $d/2$ אופקית: $\tfrac12gt^2 = d/2$, ולכן
          $$t = \sqrt{\frac{d}{g}} = \sqrt{\frac{0.01}{10}} = 0.0316\ \text{s}$$
          התאוצה הכוללת היא $g\sqrt2$, ולכן $v = g\sqrt2\,t = 10\cdot1.414\cdot0.0316 = 0.447\,\text{m/s}$.
      - kind: substitution
        text: >-
          ג. $A = 0.1^2 = 0.01\,\text{m}^2$, ולכן $C = \dfrac{8.85\cdot10^{-12}\cdot0.01}{0.01} = 8.85\cdot10^{-12}\,\text{F}$, ו-
          $$Q = CX = 8.85\cdot10^{-12}\cdot1.04\cdot10^{-9} = 9.2\cdot10^{-21}\ \text{C}, \qquad \frac{Q}{e} = \frac{9.2\cdot10^{-21}}{1.6\cdot10^{-19}} \approx 0.06$$
      - kind: reasoning
        text: >-
          מטען מגיע רק בכפולות שלמות של $e$ (שיעור 1.1), ולכן על לוח אי אפשר לשים $0.06e$. גם המטען הקטן ביותר האפשרי, $+e$ על לוח אחד ו-$-e$ על השני, יוצר בין לוחות כאלה שדה
          $$E = \frac{e}{\varepsilon_0 A} = \frac{1.6\cdot10^{-19}}{8.85\cdot10^{-12}\cdot0.01} = 1.8\cdot10^{-6}\ \text{V/m}$$
          חזק פי 17 בערך מהשדה הדרוש. לכן עם לוחות כאלה אי אפשר ליצור שדה כל כך חלש: המצב שבשאלה דורש לוחות גדולים בהרבה (בלוחות של $1\,\text{m}^2$ המטען הדרוש הוא כ-$6e$, עדיין מעט מאוד).
      - kind: result
        text: >-
          א. $X = 1.0\cdot10^{-9}\,\text{V}$.

          ב. $t = 0.032\,\text{s}$, $v = 0.45\,\text{m/s}$.

          ג. $Q \approx 0.06e$, פחות ממטען יסודי אחד: המצב שבשאלה לא ניתן להכנה עם לוחות כאלה.
