# Workbook for lesson 2.5: ten practice problems and two sourced challenge problems.
# Every number recomputed with src/physics (constants.ts: K, E_CHARGE; potential.ts: spherePotentialAt,
# sphereFieldAt, connectSpheres, earthedSphereCharge, sphereSurfaceField, pointPotential).
# Charges are kept small enough that no surface field exceeds the air-breakdown value of W-2.5-10.

lesson: '2.5'
practice:
  - id: W-2.5-01
    level: basic
    qualitative: false
    objectives: [OBJ-2.5-1]
    prompt: >-
      קליפה כדורית דקה ממתכת (כדור חלול) ברדיוס $20\,\text{cm}$ טעונה במטען $-5\,\text{nC}$, ואין לידה גופים טעונים אחרים.

      (א) מה הפוטנציאל במרכז הקליפה, על פניה, ובנקודה שנמצאת $50\,\text{cm}$ מהמרכז?

      (ב) באיזה מרחק מהמרכז הפוטנציאל הוא $-45\,\text{V}$?
    answer: >-
      (א) $-225\,\text{V}$ במרכז ועל פני הקליפה, ו-$-90\,\text{V}$ במרחק $50\,\text{cm}$.

      (ב) $1\,\text{m}$ מהמרכז.
    solution:
      - kind: given
        text: '$Q = -5\cdot10^{-9}\,\text{C}$, $R = 0.2\,\text{m}$.'
      - kind: reasoning
        text: >-
          כדור חלול ממתכת מתנהג כמו כדור מלא: המטען העודף יושב על פני השטח, השדה בתוך הקליפה אפס, ולכן הפוטנציאל לא
          משתנה בתוכה. כל החלל נמצא באותו פוטנציאל כמו פני הקליפה.
      - kind: formula
        text: 'בתוך הכדור ועל פניו $V = kQ/R$. מחוץ לכדור $V = kQ/r$, כאשר $r$ הוא המרחק מהמרכז.'
      - kind: substitution
        text: >-
          (א) במרכז ועל פני הקליפה: $V = 9\cdot10^{9} \cdot (-5\cdot10^{-9}) / 0.2 = -225\,\text{V}$.
          במרחק $0.5\,\text{m}$: $V = 9\cdot10^{9} \cdot (-5\cdot10^{-9}) / 0.5 = -90\,\text{V}$.
      - kind: reasoning
        text: >-
          (ב) בתוך הקליפה ועל פניה הפוטנציאל $-225\,\text{V}$ בכל מקום. הערך $-45\,\text{V}$ קרוב יותר לאפס, ולכן הנקודה
          מחוץ לקליפה, ושם $V = kQ/r$.
      - kind: manipulation
        text: 'מכפילים את שני האגפים ב-$r$ ומחלקים ב-$V$: $r = kQ/V$.'
      - kind: substitution
        text: '$r = 9\cdot10^{9} \cdot (-5\cdot10^{-9}) / (-45) = (-45)/(-45) = 1\,\text{m}$.'
      - kind: result
        text: >-
          (א) $-225\,\text{V}$ במרכז ועל פני הקליפה, ו-$-90\,\text{V}$ במרחק $50\,\text{cm}$.

          (ב) במרחק $1\,\text{m}$ מהמרכז, פי 5 מהרדיוס, ולכן הפוטנציאל שם חמישית מהפוטנציאל של הקליפה.

  - id: W-2.5-02
    level: basic
    qualitative: true
    objectives: [OBJ-2.5-1]
    prompt: >-
      כדור מתכת מלא טעון במטען חיובי, ואין לידו גופים טעונים אחרים. A היא מרכז הכדור, B היא נקודה בתוך הכדור ממש ליד
      פניו, ו-C היא נקודה מחוץ לכדור.

      (א) סדרו את הפוטנציאלים בשלוש הנקודות מהגבוה לנמוך.

      (ב) מזיזים מטען בוחן חיובי מ-A אל B. כמה עבודה עושה השדה?

      (ג) תלמיד אומר: "בתוך הכדור השדה אפס, ולכן הפוטנציאל בתוכו שווה לפוטנציאל באינסוף, כלומר אפס." מה הטעות?
    answer: >-
      (א) $V_A = V_B > V_C$.

      (ב) אפס.

      (ג) שדה אפס פירושו שהפוטנציאל לא משתנה בתוך הכדור, לא שהוא אפס. הוא $kQ/R$, כמו על פני הכדור.
    solution:
      - kind: reasoning
        text: >-
          (א) בתוך הכדור השדה אפס, ולכן הפוטנציאל לא משתנה ממקום למקום: ב-A וב-B הוא $kQ/R$, כמו על פני הכדור.
          ב-C, מחוץ לכדור, $V = kQ/r$ עם $r > R$. המטען חיובי, ולכן $V_C < kQ/R$.
      - kind: reasoning
        text: >-
          (ב) עבודת השדה היא $W = q(V_A - V_B)$, והפוטנציאלים שווים, ולכן $W = 0$. אותו דבר רואים גם בלי פוטנציאל:
          בתוך הכדור אין שדה, ולכן אין כוח חשמלי על מטען הבוחן לאורך כל הדרך.
      - kind: reasoning
        text: >-
          (ג) כדי להגיע מתוך הכדור לאינסוף צריך לעבור דרך האזור שמחוץ לכדור, ושם יש שדה. לאורך הקטע הזה הפוטנציאל יורד
          מ-$kQ/R$ על פני הכדור עד אפס באינסוף. השדה אפס רק בתוך הכדור, ולכן רק שם הפוטנציאל קבוע.
      - kind: result
        text: >-
          (א) $V_A = V_B > V_C$.

          (ב) השדה לא עושה עבודה.

          (ג) התלמיד בלבל בין "הפוטנציאל לא משתנה" לבין "הפוטנציאל אפס". בתוך הכדור $V = kQ/R$, ושונה מאפס.

  - id: W-2.5-03
    level: basic
    qualitative: false
    objectives: [OBJ-2.5-2]
    prompt: >-
      כדור A ברדיוס $6\,\text{cm}$ טעון ב-$+0.5\,\mu\text{C}$, וכדור B ברדיוס $4\,\text{cm}$ טעון ב-$-0.1\,\mu\text{C}$.
      הכדורים רחוקים זה מזה, ומחברים אותם בחוט מוליך.

      (א) מה המטען על כל כדור אחרי החיבור, ומה הפוטנציאל המשותף?

      (ב) כמה מטען עבר בחוט? כמה אלקטרונים עברו, ולאיזה כיוון?
    answer: >-
      (א) $q_A = +0.24\,\mu\text{C}$, $q_B = +0.16\,\mu\text{C}$, והפוטנציאל המשותף $3.6\cdot10^{4}\,\text{V}$.

      (ב) $0.26\,\mu\text{C}$: כ-$1.6\cdot10^{12}$ אלקטרונים, מ-B אל A.
    solution:
      - kind: given
        text: >-
          $R_A = 0.06\,\text{m}$, $Q_A = 5\cdot10^{-7}\,\text{C}$, $R_B = 0.04\,\text{m}$, $Q_B = -1\cdot10^{-7}\,\text{C}$.
      - kind: formula
        text: >-
          שימור המטען, $q_A + q_B = Q_A + Q_B$, ושוויון הפוטנציאלים, $kq_A/R_A = kq_B/R_B$. מהשוויון
          $q_B = q_A R_B/R_A$, ואחרי הצבה בשימור המטען המטען מתחלק לפי הרדיוסים:
          $q_A = Q\,\dfrac{R_A}{R_A + R_B}$, כאשר $Q$ הוא המטען הכולל.
      - kind: substitution
        text: >-
          המטען הכולל, עם הסימנים: $Q = 0.5 + (-0.1) = 0.4\,\mu\text{C}$. היחס בין הרדיוסים $6 : 4$, ולכן
          $q_A = 0.4 \cdot 0.6 = 0.24\,\mu\text{C}$ ו-$q_B = 0.4 \cdot 0.4 = 0.16\,\mu\text{C}$.
      - kind: substitution
        text: '$V = \dfrac{kq_A}{R_A} = \dfrac{9\cdot10^{9} \cdot 2.4\cdot10^{-7}}{0.06} = 3.6\cdot10^{4}\,\text{V}$.'
      - kind: reasoning
        text: >-
          (ב) לפני החיבור $V_A = 9\cdot10^{9} \cdot 5\cdot10^{-7}/0.06 = 7.5\cdot10^{4}\,\text{V}$, ו-$V_B = 9\cdot10^{9} \cdot (-1\cdot10^{-7})/0.04 = -2.25\cdot10^{4}\,\text{V}$.
          אלקטרונים נעים אל הפוטנציאל הגבוה, כלומר מ-B אל A.
      - kind: substitution
        text: >-
          המטען של B השתנה מ-$-0.1$ ל-$+0.16\,\mu\text{C}$, כלומר ב-$0.26\,\mu\text{C}$ (ו-A איבד בדיוק את אותה כמות, מ-$0.5$ ל-$0.24$).
          מספר האלקטרונים: $N = 2.6\cdot10^{-7} / 1.6\cdot10^{-19} \approx 1.6\cdot10^{12}$.
      - kind: result
        text: >-
          (א) $q_A = +0.24\,\mu\text{C}$, $q_B = +0.16\,\mu\text{C}$, $V = 3.6\cdot10^{4}\,\text{V}$.

          (ב) עבר מטען של $0.26\,\mu\text{C}$: כ-$1.6\cdot10^{12}$ אלקטרונים עברו מ-B אל A. B, שהיה שלילי, נעשה חיובי.

  - id: W-2.5-04
    level: mid
    qualitative: false
    objectives: [OBJ-2.5-3]
    prompt: >-
      כדור מתכת ברדיוס $4\,\text{cm}$ מחובר לאדמה. לידו נמצא מטען נקודתי $q = +0.3\,\mu\text{C}$, ועל הכדור יש מטען של
      $-0.06\,\mu\text{C}$.

      (א) מה המרחק בין המטען הנקודתי למרכז הכדור?

      (ב) מרחיקים את המטען הנקודתי, עד שהמרחק שלו ממרכז הכדור כפול, והכדור נשאר מחובר לאדמה. מה המטען על הכדור עכשיו?
      כמה אלקטרונים עברו בחוט ההארקה, ולאיזה כיוון?
    answer: >-
      (א) $20\,\text{cm}$.

      (ב) $-0.03\,\mu\text{C}$: כ-$1.9\cdot10^{11}$ אלקטרונים עברו מהכדור אל האדמה.
    solution:
      - kind: given
        text: '$R = 0.04\,\text{m}$, $q = 3\cdot10^{-7}\,\text{C}$, והמטען על הכדור $Q = -6\cdot10^{-8}\,\text{C}$.'
      - kind: reasoning
        text: >-
          הכדור מוארק, ולכן כולו בפוטנציאל אפס, ובכלל זה המרכז שלו. במרכז המטען הנקודתי תורם $kq/D$, וכל המטען של הכדור
          יושב על פני השטח, במרחק $R$ מהמרכז, ותורם $kQ/R$.
      - kind: formula
        text: '$\dfrac{kQ}{R} + \dfrac{kq}{D} = 0$'
      - kind: manipulation
        text: >-
          מעבירים את $kQ/R$ לאגף השני ומצמצמים את $k$: $\dfrac{q}{D} = -\dfrac{Q}{R}$. מכפילים את שני האגפים ב-$D$ וב-$R$,
          ומחלקים ב-$(-Q)$: $D = -\dfrac{qR}{Q}$.
      - kind: substitution
        text: '(א) $D = -\dfrac{3\cdot10^{-7} \cdot 0.04}{-6\cdot10^{-8}} = 0.2\,\text{m}$.'
      - kind: substitution
        text: >-
          (ב) לפי $Q = -qR/D$, כשהמרחק כפול המטען על הכדור קטן פי 2:
          $Q' = -\dfrac{3\cdot10^{-7} \cdot 0.04}{0.4} = -3\cdot10^{-8}\,\text{C}$.
      - kind: reasoning
        text: >-
          המטען על הכדור עבר מ-$-0.06$ ל-$-0.03\,\mu\text{C}$: הוא איבד מטען שלילי, כלומר אלקטרונים עזבו אותו אל האדמה.
          מספרם $N = 3\cdot10^{-8} / 1.6\cdot10^{-19} \approx 1.9\cdot10^{11}$.
      - kind: result
        text: >-
          (א) $D = 20\,\text{cm}$.

          (ב) $Q' = -0.03\,\mu\text{C}$. כ-$1.9\cdot10^{11}$ אלקטרונים עברו מהכדור אל האדמה: המטען הנקודתי התרחק, ומשך
          פחות אלקטרונים.

  - id: W-2.5-05
    level: mid
    qualitative: true
    objectives: [OBJ-2.5-4, OBJ-2.5-1]
    prompt: >-
      גוף מתכת בצורת טיפה, עם צד אחד עגול ורחב וצד שני מחודד, טעון במטען חיובי ועומד על מעמד מבודד. קבעו ונמקו:

      (א) האם הפוטנציאל בקצה המחודד גבוה מהפוטנציאל בצד העגול, נמוך ממנו או שווה לו?

      (ב) ליד איזה צד השדה חזק יותר? ואיפה צפיפות המטען המשטחית גדולה יותר?

      (ג) למה את הכדור של מחולל ון דה גרף בונים גדול וחלק, ואילו לכליא ברק נותנים קצה מחודד?
    answer: >-
      (א) שווה.

      (ב) ליד הקצה המחודד, ושם גם צפיפות המטען גדולה יותר.

      (ג) באותו פוטנציאל, ליד כדור גדול וחלק השדה חלש, ולכן אפשר להגיע לפוטנציאל גבוה בלי שהאוויר יתחיל להוליך. בכליא
      ברק רוצים דווקא שדה חזק, כדי שהמטען יברח בהדרגה.
    solution:
      - kind: reasoning
        text: >-
          (א) מוליך בשיווי משקל הוא משטח שווה פוטנציאל אחד: אילו היה הפרש פוטנציאלים בין שני הקצוות, היה בתוך המתכת שדה,
          והאלקטרונים החופשיים היו זזים. לכן הפוטנציאל שווה בכל הגוף.
      - kind: reasoning
        text: >-
          (ב) מודל איכותי: הקצה המחודד דומה לכדור קטן שמחובר לגוף, והצד העגול לכדור גדול. על פני כדור $E = V/R$, ושני
          הצדדים באותו פוטנציאל, ולכן ליד הצד שהרדיוס שלו קטן השדה חזק יותר. (הקצה לא רחוק משאר הגוף, ולכן זה הסבר ולא
          חישוב.)
      - kind: reasoning
        text: >-
          ליד פני מוליך $E = \sigma/\varepsilon_0$ (שיעור 1.9), כלומר השדה פרופורציוני לצפיפות המטען המשטחית. איפה שהשדה
          חזק יותר, גם הצפיפות גדולה יותר: המטען מצטופף בחוד.
      - kind: reasoning
        text: >-
          (ג) האוויר מתחיל להוליך כשהשדה בו חזק מספיק, ואז המטען בורח מהגוף. על פני כדור $E = V/R$: כדי להגיע לפוטנציאל
          גבוה בלי לחצות את הגבול צריך רדיוס גדול. כל בליטה חדה הייתה מתנהגת כמו כדור קטן, עם שדה חזק, ופורקת את המטען,
          ולכן הכדור חלק. בכליא ברק המטרה הפוכה: לפרוק את המטען בהדרגה, ולכן הקצה מחודד.
      - kind: result
        text: >-
          (א) הפוטנציאל שווה בכל הגוף.

          (ב) ליד הקצה המחודד השדה חזק יותר, ושם גם צפיפות המטען המשטחית גדולה יותר.

          (ג) באותו פוטנציאל, רדיוס גדול נותן שדה חלש ($E = V/R$), ולכן מחולל ון דה גרף שומר על המטען שלו. החוד של כליא
          הברק יוצר שדה חזק, וזה בדיוק מה שרוצים ממנו.

  - id: W-2.5-06
    level: mid
    qualitative: false
    objectives: [OBJ-2.5-2]
    prompt: >-
      שלושה כדורים מוליכים רחוקים זה מזה: A ברדיוס $10\,\text{cm}$, טעון ב-$+0.9\,\mu\text{C}$; B ברדיוס $20\,\text{cm}$
      ו-C ברדיוס $10\,\text{cm}$, שניהם לא טעונים. מחברים את A ו-B בחוט, ואחר כך מנתקים את החוט. אחר כך מחברים את B
      ו-C בחוט, ומנתקים גם אותו.

      (א) מה המטען על כל אחד משלושת הכדורים בסוף?

      (ב) מה הפוטנציאל של כל כדור בסוף? לאיזה כדור הפוטנציאל הגבוה ביותר?

      (ג) מחברים עכשיו את A ו-C בחוט. לאיזה כיוון נעים האלקטרונים בחוט, ומה המטען על כל אחד מהם בסוף?
    answer: >-
      (א) $q_A = 0.3\,\mu\text{C}$, $q_B = 0.4\,\mu\text{C}$, $q_C = 0.2\,\mu\text{C}$.

      (ב) $V_A = 2.7\cdot10^{4}\,\text{V}$, $V_B = V_C = 1.8\cdot10^{4}\,\text{V}$: ל-A.

      (ג) מ-C אל A. בסוף $0.25\,\mu\text{C}$ על כל אחד.
    solution:
      - kind: formula
        text: >-
          בכל חיבור של שני כדורים רחוקים המטען הכולל שלהם נשמר ומתחלק לפי הרדיוסים: $q_1 = Q\,\dfrac{R_1}{R_1 + R_2}$.
          אחרי הניתוק המטען על כל כדור לא משתנה.
      - kind: substitution
        text: >-
          חיבור A-B: $Q = 0.9\,\mu\text{C}$, והיחס $10 : 20$. $q_A = 0.9 \cdot \tfrac{1}{3} = 0.3\,\mu\text{C}$ ו-$q_B = 0.6\,\mu\text{C}$.
      - kind: substitution
        text: >-
          חיבור B-C: עכשיו $Q = 0.6\,\mu\text{C}$ (A מנותק), והיחס $20 : 10$. $q_B = 0.6 \cdot \tfrac{2}{3} = 0.4\,\mu\text{C}$
          ו-$q_C = 0.2\,\mu\text{C}$.
      - kind: substitution
        text: >-
          (ב) $V = kq/R$: $V_A = 9\cdot10^{9} \cdot 3\cdot10^{-7}/0.1 = 2.7\cdot10^{4}\,\text{V}$,
          $V_B = 9\cdot10^{9} \cdot 4\cdot10^{-7}/0.2 = 1.8\cdot10^{4}\,\text{V}$, $V_C = 9\cdot10^{9} \cdot 2\cdot10^{-7}/0.1 = 1.8\cdot10^{4}\,\text{V}$.
          B ו-C שווים, כי הם חוברו זה לזה בפעם האחרונה.
      - kind: reasoning
        text: >-
          (ג) הפוטנציאל של A גבוה מזה של C. אלקטרונים נעים אל הפוטנציאל הגבוה, ולכן הם עוברים בחוט מ-C אל A.
      - kind: substitution
        text: >-
          המטען הכולל $0.3 + 0.2 = 0.5\,\mu\text{C}$, והרדיוסים שווים, ולכן $0.25\,\mu\text{C}$ על כל אחד.
          הפוטנציאל המשותף $9\cdot10^{9} \cdot 2.5\cdot10^{-7}/0.1 = 2.25\cdot10^{4}\,\text{V}$, בין $1.8\cdot10^{4}$ ל-$2.7\cdot10^{4}\,\text{V}$, כצפוי.
      - kind: result
        text: >-
          (א) $q_A = 0.3\,\mu\text{C}$, $q_B = 0.4\,\mu\text{C}$, $q_C = 0.2\,\mu\text{C}$ (סך הכול $0.9\,\mu\text{C}$, כמו בהתחלה).

          (ב) $V_A = 2.7\cdot10^{4}\,\text{V}$, ו-$V_B = V_C = 1.8\cdot10^{4}\,\text{V}$. ל-A הפוטנציאל הגבוה ביותר, אף שעל B
          המטען הגדול ביותר.

          (ג) אלקטרונים עוברים מ-C אל A, ובסוף על כל אחד מהם $0.25\,\mu\text{C}$.

  - id: W-2.5-07
    level: mid
    qualitative: true
    objectives: [OBJ-2.5-3]
    prompt: >-
      שני תלמידים מתווכחים. הראשון: "גוף מוארק תמיד ניטרלי." השני: "גוף מוארק תמיד בפוטנציאל אפס."

      (א) מי מהם צודק? תנו דוגמה שמפריכה את הטענה השגויה.

      (ב) כדור מתכת מחובר לאדמה, ובמרחק מה ממנו נמצא מטען נקודתי שלילי. מה הסימן של המטען על הכדור? נמקו בעזרת הפוטנציאל
      במרכז הכדור.

      (ג) מקרבים את המטען הנקודתי אל הכדור, בלי לגעת בו. האם בחוט ההארקה עוברים אלקטרונים? אם כן, לאיזה כיוון?
    answer: >-
      (א) השני. כדור מוארק ליד מטען נקודתי טעון: $Q = -qR/D$.

      (ב) חיובי.

      (ג) כן: אלקטרונים עוברים מהכדור אל האדמה.
    solution:
      - kind: reasoning
        text: >-
          (א) הארקה מחברת את הגוף לכדור הארץ, שהפוטנציאל שלו אפס, ומטען עובר עד שהפוטנציאלים שווים. לכן גוף מוארק תמיד
          בפוטנציאל אפס, והשני צודק. המטען שלו לא תמיד אפס: כדור מוארק במרחק $D$ ממטען נקודתי $q$ נושא מטען $-qR/D$.
          הוא ניטרלי רק כשאין לידו מטענים.
      - kind: reasoning
        text: >-
          (ב) במרכז הכדור הפוטנציאל הוא סכום של שתי תרומות: של המטען הנקודתי, $kq/D$, שלילית כי $q$ שלילי, ושל המטען $Q$
          של הכדור, $kQ/R$, כי כל המטען שלו על פני השטח, במרחק $R$ מהמרכז. הסכום אפס, ולכן $kQ/R$ חיובי, כלומר $Q$ חיובי.
      - kind: reasoning
        text: >-
          (ג) מ-$Q = -qR/D$: כש-$D$ קטן, הגודל של $Q$ גדל, והוא נשאר חיובי. כדי להיעשות חיובי יותר הכדור צריך לאבד
          אלקטרונים, ולכן הם עוברים בחוט מהכדור אל האדמה, דחויים מהמטען השלילי שמתקרב.
      - kind: result
        text: >-
          (א) השני צודק: גוף מוארק תמיד בפוטנציאל אפס, אבל לא תמיד ניטרלי. כדור מוארק ליד מטען נקודתי טעון במטען $-qR/D$.

          (ב) המטען על הכדור חיובי, בסימן הפוך למטען הנקודתי.

          (ג) כן: אלקטרונים עוברים מהכדור אל האדמה, והמטען החיובי של הכדור גדל.

  - id: W-2.5-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-2.5-2, OBJ-2.5-4]
    prompt: >-
      כדור A ברדיוס $5\,\text{cm}$ טעון ב-$+0.4\,\mu\text{C}$. כדור B ברדיוס $15\,\text{cm}$ טעון במטען שלא ידוע. הכדורים
      רחוקים זה מזה. מחברים אותם בחוט מוליך, ומודדים שהפוטנציאל המשותף הוא $3.6\cdot10^{4}\,\text{V}$.

      (א) מה היה המטען על B לפני החיבור?

      (ב) כמה מטען עבר בחוט, ולאיזה כיוון נעו האלקטרונים? בדקו שהכיוון מתאים לפוטנציאלים של הכדורים לפני החיבור.

      (ג) מה השדה ליד פני כל כדור אחרי החיבור?

      (ד) מה משתנה אם… המטען על B לפני החיבור היה $-0.4\,\mu\text{C}$? מה המטען על כל כדור, מה הפוטנציאל המשותף, וכמה
      מטען עובר בחוט?
    answer: >-
      (א) $+0.4\,\mu\text{C}$.

      (ב) $0.2\,\mu\text{C}$; האלקטרונים נעו מ-B אל A.

      (ג) ליד A $7.2\cdot10^{5}\,\text{N/C}$, וליד B $2.4\cdot10^{5}\,\text{N/C}$.

      (ד) שני הכדורים ניטרליים, הפוטנציאל אפס, ובחוט עובר $0.4\,\mu\text{C}$.
    solution:
      - kind: given
        text: '$R_A = 0.05\,\text{m}$, $Q_A = 4\cdot10^{-7}\,\text{C}$, $R_B = 0.15\,\text{m}$, $V = 3.6\cdot10^{4}\,\text{V}$ אחרי החיבור.'
      - kind: formula
        text: >-
          אחרי החיבור $q_A = VR_A/k$ ו-$q_B = VR_B/k$ (מ-$V = kq/R$ לכל כדור). המטען הכולל $Q = q_A + q_B$, ולכן
          $V = \dfrac{kQ}{R_A + R_B}$.
      - kind: manipulation
        text: 'מכפילים את שני האגפים ב-$(R_A + R_B)$ ומחלקים ב-$k$: $Q = \dfrac{V(R_A + R_B)}{k}$.'
      - kind: substitution
        text: >-
          (א) $Q = \dfrac{3.6\cdot10^{4} \cdot 0.2}{9\cdot10^{9}} = 8\cdot10^{-7}\,\text{C}$. המטען נשמר, ולכן
          $Q_B = 0.8 - 0.4 = 0.4\,\mu\text{C}$.
      - kind: substitution
        text: >-
          (ב) אחרי החיבור $q_A = \dfrac{3.6\cdot10^{4} \cdot 0.05}{9\cdot10^{9}} = 2\cdot10^{-7}\,\text{C}$ ו-$q_B = 6\cdot10^{-7}\,\text{C}$.
          A ירד מ-$0.4$ ל-$0.2\,\mu\text{C}$: עבר מטען של $0.2\,\mu\text{C}$. A איבד מטען חיובי, כלומר קיבל אלקטרונים: הם נעו מ-B אל A.
      - kind: substitution
        text: >-
          בדיקה: לפני החיבור $V_A = 9\cdot10^{9} \cdot 4\cdot10^{-7}/0.05 = 7.2\cdot10^{4}\,\text{V}$ ו-$V_B = 9\cdot10^{9} \cdot 4\cdot10^{-7}/0.15 = 2.4\cdot10^{4}\,\text{V}$.
          אלקטרונים נעים אל הפוטנציאל הגבוה, מ-B אל A, כמו שמצאנו. המטענים היו שווים, ובכל זאת עבר מטען: מה שקובע הוא הפוטנציאל.
      - kind: substitution
        text: >-
          (ג) על פני כדור $E = V/R$: $E_A = 3.6\cdot10^{4}/0.05 = 7.2\cdot10^{5}\,\text{N/C}$ ו-$E_B = 3.6\cdot10^{4}/0.15 = 2.4\cdot10^{5}\,\text{N/C}$.
          שני הכדורים חיוביים, ולכן השדה מצביע הרחק מכל אחד מהם.
      - kind: reasoning
        text: >-
          (ד) המטען הכולל $0.4 + (-0.4) = 0$. מטען כולל אפס מתחלק לפי הרדיוסים לאפס ואפס, והפוטנציאל המשותף $kQ/(R_A + R_B) = 0$.
          A עבר מ-$+0.4$ לאפס ו-B מ-$-0.4$ לאפס, ולכן בחוט עבר $0.4\,\mu\text{C}$: אלקטרונים מ-B אל A.
      - kind: result
        text: >-
          (א) $Q_B = +0.4\,\mu\text{C}$.

          (ב) עבר $0.2\,\mu\text{C}$, והאלקטרונים נעו מ-B אל A, מהפוטנציאל הנמוך ($2.4\cdot10^{4}\,\text{V}$) אל הגבוה ($7.2\cdot10^{4}\,\text{V}$).

          (ג) $E_A = 7.2\cdot10^{5}\,\text{N/C}$ ו-$E_B = 2.4\cdot10^{5}\,\text{N/C}$: ליד הכדור הקטן השדה חזק פי 3.

          (ד) שני הכדורים מתנטרלים, הפוטנציאל המשותף אפס, ובחוט עובר $0.4\,\mu\text{C}$.

  - id: W-2.5-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-2.5-2, OBJ-2.5-3]
    prompt: >-
      כדור A ברדיוס $10\,\text{cm}$ טעון ב-$+0.6\,\mu\text{C}$. כדור B ברדיוס $5\,\text{cm}$ לא טעון. הכדורים רחוקים זה מזה.
      מבצעים שוב ושוב מחזור של שלושה שלבים: מחברים את A ו-B בחוט ומנתקים אותו; מחברים את B לאדמה; מנתקים את ההארקה.

      (א) מה המטען על כל כדור, ומה הפוטנציאל המשותף, כשהם מחוברים בפעם הראשונה?

      (ב) מה עובר בחוט ההארקה כשמארקים את B בפעם הראשונה: כמה, ולאיזה כיוון?

      (ג) מה המטען על כל כדור, ומה הפוטנציאל המשותף, בחיבור השני?

      (ד) איזה חלק מהמטען של A נשאר עליו בכל חיבור? אחרי איזה חיבור יירד המטען על A לראשונה מתחת ל-$0.1\,\mu\text{C}$?
    answer: >-
      (א) $0.4\,\mu\text{C}$ על A ו-$0.2\,\mu\text{C}$ על B; $3.6\cdot10^{4}\,\text{V}$.

      (ב) כ-$1.25\cdot10^{12}$ אלקטרונים, מהאדמה אל B.

      (ג) כ-$0.27\,\mu\text{C}$ על A וכ-$0.13\,\mu\text{C}$ על B; $2.4\cdot10^{4}\,\text{V}$.

      (ד) שני שלישים; אחרי החיבור החמישי.
    solution:
      - kind: given
        text: '$R_A = 0.1\,\text{m}$, $R_B = 0.05\,\text{m}$, ובהתחלה $Q_A = 6\cdot10^{-7}\,\text{C}$.'
      - kind: formula
        text: >-
          בחיבור המטען מתחלק לפי הרדיוסים, $10 : 5 = 2 : 1$: על A נשארים $\tfrac{2}{3}$ מהמטען הכולל, ועל B עובר $\tfrac{1}{3}$.
          הפוטנציאל המשותף $V = kq_A/R_A$.
      - kind: substitution
        text: >-
          (א) $q_A = \tfrac{2}{3} \cdot 0.6 = 0.4\,\mu\text{C}$ ו-$q_B = 0.2\,\mu\text{C}$.
          $V = 9\cdot10^{9} \cdot 4\cdot10^{-7}/0.1 = 3.6\cdot10^{4}\,\text{V}$.
      - kind: reasoning
        text: >-
          (ב) B לבד, בלי מטענים בקרבתו (A רחוק), ולכן כשמארקים אותו הוא מגיע לפוטנציאל אפס ומתנטרל. היה עליו מטען חיובי,
          כלומר חסרו לו אלקטרונים: הם עוברים מהאדמה אל B.
      - kind: substitution
        text: 'מספר האלקטרונים: $N = 2\cdot10^{-7} / 1.6\cdot10^{-19} = 1.25\cdot10^{12}$.'
      - kind: substitution
        text: >-
          (ג) עכשיו A מתחיל עם $0.4\,\mu\text{C}$ ו-B ניטרלי. $q_A = \tfrac{2}{3} \cdot 0.4 \approx 0.27\,\mu\text{C}$ ו-$q_B \approx 0.13\,\mu\text{C}$.
          $V = \dfrac{k \cdot 0.4\cdot10^{-6}}{R_A + R_B} = \dfrac{9\cdot10^{9} \cdot 4\cdot10^{-7}}{0.15} = 2.4\cdot10^{4}\,\text{V}$.
      - kind: reasoning
        text: >-
          (ד) בכל מחזור B מתחיל ניטרלי, ולכן בכל חיבור על A נשארים $\tfrac{2}{3}$ מהמטען שהיה עליו. אחרי החיבור ה-$n$
          המטען על A הוא $0.6 \cdot (2/3)^n\,\mu\text{C}$.
      - kind: substitution
        text: >-
          נחשב חיבור אחרי חיבור: $0.4$, $0.267$, $0.178$, $0.119$, $0.079\,\mu\text{C}$. אחרי החיבור הרביעי עדיין
          $0.119\,\mu\text{C}$, ורק בחיבור החמישי המטען יורד מתחת ל-$0.1\,\mu\text{C}$.
      - kind: result
        text: >-
          (א) $q_A = 0.4\,\mu\text{C}$, $q_B = 0.2\,\mu\text{C}$, $V = 3.6\cdot10^{4}\,\text{V}$.

          (ב) כ-$1.25\cdot10^{12}$ אלקטרונים עוברים מהאדמה אל B, ו-B מתנטרל.

          (ג) $q_A \approx 0.27\,\mu\text{C}$, $q_B \approx 0.13\,\mu\text{C}$, $V = 2.4\cdot10^{4}\,\text{V}$.

          (ד) בכל חיבור נשארים על A שני שלישים מהמטען שלו. המטען יורד מתחת ל-$0.1\,\mu\text{C}$ אחרי החיבור החמישי
          (כ-$0.079\,\mu\text{C}$). בכל מחזור B "מעביר" שליש מהמטען של A אל האדמה.

  - id: W-2.5-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-2.5-4, OBJ-2.5-2]
    prompt: >-
      האוויר מתחיל להוליך, ונוצרים ניצוצות, כשהשדה בו מגיע ל-$3\cdot10^{6}\,\text{N/C}$. כדור מתכת גדול ברדיוס
      $30\,\text{cm}$ עומד על מעמד מבודד.

      (א) מה הפוטנציאל הגבוה ביותר שאפשר לטעון אליו את הכדור לבדו, ומה המטען עליו אז?

      (ב) מחברים לכדור הגדול, בחוט ארוך ודק, כדור קטן ברדיוס $1\,\text{cm}$, שנמצא רחוק ממנו. ליד איזה מהשניים השדה יגיע
      ראשון ל-$3\cdot10^{6}\,\text{N/C}$ כשמוסיפים להם מטען? נמקו.

      (ג) מה המטען הכולל הגבוה ביותר שהזוג המחובר יכול להחזיק בלי שהאוויר יתחיל להוליך? כמה ממנו נמצא על כל כדור?

      (ד) פי כמה קטן המטען הזה מהמטען שמצאתם בסעיף א? הסבירו בעזרת התוצאה למה קשה לשמור מטען על מוליך שיש לו חוד.
    answer: >-
      (א) $9\cdot10^{5}\,\text{V}$, ו-$3\cdot10^{-5}\,\text{C}$.

      (ב) ליד הכדור הקטן.

      (ג) כ-$1.03\cdot10^{-6}\,\text{C}$: כ-$3.3\cdot10^{-8}\,\text{C}$ על הקטן, ו-$1.0\cdot10^{-6}\,\text{C}$ על הגדול.

      (ד) פי 29 בערך.
    solution:
      - kind: given
        text: '$E_{\max} = 3\cdot10^{6}\,\text{N/C}$, $R = 0.3\,\text{m}$, $r = 0.01\,\text{m}$.'
      - kind: formula
        text: 'על פני כדור $E = \dfrac{kQ}{R^2}$, ומכיוון ש-$V = \dfrac{kQ}{R}$, אפשר לכתוב $E = \dfrac{V}{R}$.'
      - kind: manipulation
        text: '(א) מכפילים את שני האגפים ב-$R$: $V_{\max} = E_{\max} R$. ומ-$V = kQ/R$: $Q = VR/k$.'
      - kind: substitution
        text: >-
          $V_{\max} = 3\cdot10^{6} \cdot 0.3 = 9\cdot10^{5}\,\text{V}$, ו-$Q = \dfrac{9\cdot10^{5} \cdot 0.3}{9\cdot10^{9}} = 3\cdot10^{-5}\,\text{C}$.
      - kind: reasoning
        text: >-
          (ב) אחרי החיבור שני הכדורים באותו פוטנציאל $V$. ליד הקטן $E = V/r$, וליד הגדול $E = V/R$. $r$ קטן פי 30 מ-$R$, ולכן
          ליד הכדור הקטן השדה חזק פי 30, והוא מגיע לגבול ראשון.
      - kind: substitution
        text: >-
          (ג) הגבול נקבע בכדור הקטן: $V_{\max} = E_{\max} r = 3\cdot10^{6} \cdot 0.01 = 3\cdot10^{4}\,\text{V}$.
          המטען הכולל כשהזוג בפוטנציאל הזה: $Q = \dfrac{V(R + r)}{k} = \dfrac{3\cdot10^{4} \cdot 0.31}{9\cdot10^{9}} \approx 1.03\cdot10^{-6}\,\text{C}$.
      - kind: substitution
        text: >-
          החלוקה לפי הרדיוסים: על הקטן $q = \dfrac{V r}{k} = \dfrac{3\cdot10^{4} \cdot 0.01}{9\cdot10^{9}} \approx 3.3\cdot10^{-8}\,\text{C}$,
          ועל הגדול $\dfrac{3\cdot10^{4} \cdot 0.3}{9\cdot10^{9}} = 1.0\cdot10^{-6}\,\text{C}$.
          בדיקה: ליד הגדול $E = 3\cdot10^{4}/0.3 = 10^{5}\,\text{N/C}$, הרבה מתחת לגבול.
      - kind: substitution
        text: '(ד) $\dfrac{3\cdot10^{-5}}{1.03\cdot10^{-6}} \approx 29$.'
      - kind: reasoning
        text: >-
          כדור קטן אחד, עם פחות מ-$4\%$ מהמטען, מוריד פי 29 את המטען שהכדור הגדול יכול להחזיק: השדה החזק ליד הכדור הקטן
          מגביל את הפוטנציאל של כל המוליך. חוד דומה, באופן איכותי, לכדור קטן מאוד שמחובר לגוף, ולכן מוליך עם חוד מאבד
          מטען לאוויר כבר בפוטנציאל נמוך.
      - kind: result
        text: >-
          (א) $V_{\max} = 9\cdot10^{5}\,\text{V}$, $Q = 3\cdot10^{-5}\,\text{C}$.

          (ב) ליד הכדור הקטן: באותו פוטנציאל השדה שם חזק פי 30.

          (ג) כ-$1.03\cdot10^{-6}\,\text{C}$: כ-$3.3\cdot10^{-8}\,\text{C}$ על הקטן ו-$1.0\cdot10^{-6}\,\text{C}$ על הגדול.

          (ד) פי 29 בערך. החוד קובע את הפוטנציאל המרבי של כל המוליך, ולכן מחולל ון דה גרף בנוי חלק, וכליא ברק בנוי מחודד.

challenge:
  - id: W-2.5-c1
    stars: 1
    objectives: [OBJ-2.5-1, OBJ-2.5-4]
    prompt: >-
      $125$ טיפות כספית זהות, כדוריות, ברדיוס $1\,\text{mm}$ כל אחת. כל טיפה טעונה, והפוטנציאל שלה $18\,\text{V}$. בהתחלה
      הטיפות רחוקות זו מזו. מקרבים אותן, והן מתאחדות לטיפה כדורית אחת גדולה. כספית היא מתכת, ולכן כל טיפה היא כדור מוליך.

      (א) מה המטען על כל טיפה קטנה?

      (ב) מה הרדיוס של הטיפה הגדולה, ומה הפוטנציאל שלה?

      (ג) תלמיד טוען: "המטען גדל פי 125, ולכן גם הפוטנציאל גדל פי 125." מה הטעות?

      (ד) פי כמה השדה ליד פני הטיפה הגדולה חזק מהשדה ליד פני טיפה קטנה?
    answer: >-
      (א) $2\cdot10^{-12}\,\text{C}$.

      (ב) $5\,\text{mm}$, ו-$450\,\text{V}$.

      (ג) גם הרדיוס גדל, פי 5, ולכן הפוטנציאל גדל רק פי $125/5 = 25$.

      (ד) פי 5: $9\cdot10^{4}$ לעומת $1.8\cdot10^{4}\,\text{N/C}$.
    solution:
      - kind: given
        text: '$N = 125$ טיפות, $r = 10^{-3}\,\text{m}$, והפוטנציאל של כל טיפה $V = 18\,\text{V}$.'
      - kind: manipulation
        text: '(א) מ-$V = kq/r$: מכפילים את שני האגפים ב-$r$ ומחלקים ב-$k$, $q = Vr/k$.'
      - kind: substitution
        text: '$q = \dfrac{18 \cdot 10^{-3}}{9\cdot10^{9}} = 2\cdot10^{-12}\,\text{C}$.'
      - kind: reasoning
        text: >-
          (ב) שני דברים נשמרים באיחוד: המטען והנפח של הכספית. המטען: $Q = 125\,q = 2.5\cdot10^{-10}\,\text{C}$.
          הנפח: $\tfrac{4}{3}\pi R^3 = 125 \cdot \tfrac{4}{3}\pi r^3$. מצמצמים את $\tfrac{4}{3}\pi$ ומקבלים $R^3 = 125\,r^3$.
          מוציאים שורש שלישי משני האגפים: $R = 5r = 5\,\text{mm}$.
      - kind: substitution
        text: >-
          $V' = \dfrac{kQ}{R} = \dfrac{9\cdot10^{9} \cdot 2.5\cdot10^{-10}}{5\cdot10^{-3}} = 450\,\text{V}$.
          אפשר גם ביחסים: $\dfrac{V'}{V} = \dfrac{Q/R}{q/r} = \dfrac{125}{5} = 25$, ו-$25 \cdot 18 = 450\,\text{V}$.
      - kind: reasoning
        text: >-
          (ג) הפוטנציאל של כדור הוא $kQ/R$: הוא תלוי גם ברדיוס. המטען גדל פי 125, אבל הרדיוס גדל פי 5, ולכן הפוטנציאל גדל
          רק פי 25. התלמיד היה מקבל $2250\,\text{V}$.
      - kind: substitution
        text: >-
          (ד) על פני כדור $E = V/R$. לטיפה קטנה $E = 18/10^{-3} = 1.8\cdot10^{4}\,\text{N/C}$, ולגדולה
          $E' = 450/(5\cdot10^{-3}) = 9\cdot10^{4}\,\text{N/C}$. היחס $\dfrac{E'}{E} = \dfrac{V'/V}{R/r} = \dfrac{25}{5} = 5$.
      - kind: result
        text: >-
          (א) $q = 2\cdot10^{-12}\,\text{C}$.

          (ב) $R = 5\,\text{mm}$, $V' = 450\,\text{V}$.

          (ג) התלמיד שכח שהרדיוס גדל פי 5: הפוטנציאל גדל פי 25, לא פי 125.

          (ד) פי 5. באופן כללי, כשמאחדים $N$ טיפות, המטען גדל פי $N$, הרדיוס פי $\sqrt[3]{N}$, הפוטנציאל פי $N/\sqrt[3]{N}$,
          והשדה ליד פני הטיפה פי $\sqrt[3]{N}$.
    source:
      name: JEE Main
      year: 2021
      problem: '25 February 2021, Shift 1, Question 26'
      url: https://cracku.in/26-512-identical-drops-of-mercury-are-charged-to-a-po-x-nta-jee-main-25-feb-2021-shift-1-physics
      verified: '2026-11-02'
      adapted: true

  - id: W-2.5-c2
    stars: 2
    objectives: [OBJ-2.5-3, OBJ-2.5-1]
    prompt: >-
      כדור מתכת ניטרלי ברדיוס $10\,\text{cm}$ עומד על מעמד מבודד. מטען נקודתי $q = +4\,\text{nC}$ נמצא $30\,\text{cm}$
      ממרכז הכדור.

      (א) מה הפוטנציאל של הכדור? רמז: כל הכדור בפוטנציאל אחד, ולכן אפשר לחשב אותו בנקודה הנוחה ביותר.

      (ב) מחברים את הכדור לאדמה. כמה מטען עובר בין הכדור לאדמה, ולאיזה כיוון נעים האלקטרונים?

      (ג) מנתקים את ההארקה. אחר כך מרחיקים את המטען הנקודתי לאורך הקו שמחבר אותו למרכז הכדור, עד שהוא נמצא $60\,\text{cm}$
      מהמרכז. מה המטען על הכדור עכשיו, ומה הפוטנציאל שלו?

      (ד) ומה יהיה הפוטנציאל של הכדור אם ירחיקו את המטען הנקודתי עד אינסוף?
    answer: >-
      (א) $120\,\text{V}$.

      (ב) $\tfrac{4}{3}\,\text{nC}$ (כ-$8.3\cdot10^{9}$ אלקטרונים), מהאדמה אל הכדור.

      (ג) $Q = -\tfrac{4}{3}\,\text{nC}$, והפוטנציאל $-60\,\text{V}$.

      (ד) $-120\,\text{V}$.
    solution:
      - kind: given
        text: '$R = 0.1\,\text{m}$, $q = 4\cdot10^{-9}\,\text{C}$, $D = 0.3\,\text{m}$, ואחר כך $D'' = 0.6\,\text{m}$.'
      - kind: reasoning
        text: >-
          (א) המטען הנקודתי משרה על הכדור מטען שלילי בצד הקרוב ומטען חיובי בצד הרחוק, ולא ידוע בדיוק איך הוא מתפזר. אבל
          כל המטענים המושרים יושבים על פני הכדור, כולם במרחק $R$ מהמרכז. נסמן ב-$Q_i$ את הסכום שלהם: התרומה שלהם
          לפוטנציאל במרכז היא $kQ_i/R$. הכדור ניטרלי, ולכן $Q_i = 0$, ובמרכז נשארת רק התרומה של $q$.
      - kind: substitution
        text: '$V = \dfrac{kq}{D} = \dfrac{9\cdot10^{9} \cdot 4\cdot10^{-9}}{0.3} = 120\,\text{V}$. זה הפוטנציאל של כל הכדור.'
      - kind: formula
        text: >-
          (ב) כדור מוארק נמצא בפוטנציאל אפס, ובכלל זה המרכז: $\dfrac{kQ}{R} + \dfrac{kq}{D} = 0$. מעבירים אגף, מצמצמים את
          $k$ ומכפילים ב-$R$: $Q = -\dfrac{qR}{D}$.
      - kind: substitution
        text: >-
          $Q = -\dfrac{4\cdot10^{-9} \cdot 0.1}{0.3} = -\tfrac{4}{3}\cdot10^{-9}\,\text{C} \approx -1.33\,\text{nC}$.
          הכדור עבר מאפס למטען שלילי, ולכן קיבל אלקטרונים מהאדמה: $N = 1.33\cdot10^{-9} / 1.6\cdot10^{-19} \approx 8.3\cdot10^{9}$.
      - kind: reasoning
        text: >-
          (ג) אחרי הניתוק אין לאלקטרונים דרך לעבור, ולכן המטען על הכדור נשאר $-\tfrac{4}{3}\,\text{nC}$ גם כשהמטען הנקודתי זז.
          הכדור כבר לא מוארק, ולכן הפוטנציאל שלו כבר לא חייב להיות אפס. מחשבים אותו שוב במרכז: התרומה של מטען הכדור לא
          תלויה באיך הוא מתפזר, כי כולו במרחק $R$.
      - kind: substitution
        text: >-
          $V = \dfrac{kQ}{R} + \dfrac{kq}{D'} =\dfrac{9\cdot10^{9} \cdot (-\tfrac{4}{3}\cdot10^{-9})}{0.1} + \dfrac{9\cdot10^{9} \cdot 4\cdot10^{-9}}{0.6} = -120 + 60 = -60\,\text{V}$.
      - kind: substitution
        text: '(ד) כשהמטען הנקודתי באינסוף התרומה שלו אפס: $V = \dfrac{kQ}{R} = -120\,\text{V}$.'
      - kind: result
        text: >-
          (א) $V = 120\,\text{V}$, אף שהכדור ניטרלי.

          (ב) עובר מטען של $\tfrac{4}{3}\,\text{nC}$: כ-$8.3\cdot10^{9}$ אלקטרונים עוברים מהאדמה אל הכדור, ועליו נשאר $-\tfrac{4}{3}\,\text{nC}$.

          (ג) המטען נשאר $-\tfrac{4}{3}\,\text{nC}$, והפוטנציאל $-60\,\text{V}$.

          (ד) $-120\,\text{V}$. אחרי שמנתקים את ההארקה הפוטנציאל של הכדור כבר לא אפס, וכל תזוזה של המטען הנקודתי משנה אותו.
