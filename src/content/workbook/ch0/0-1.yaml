# Workbook, lesson 0.1 (how to learn in this course). Format and rules: see .claude/CLAUDE.md, "Worked examples, workbook".
# The method problems use mechanics the learner already knows; each one makes the learner commit to a prediction first.

lesson: '0.1'
practice:
  - id: W-0.1-01
    level: basic
    qualitative: true
    objectives: [OBJ-0.1-1]
    prompt: >-
      ששת החלקים הראשונים של שיעור בקורס מופיעים כאן בערבוביה: הסבר, חזו, בדקו את עצמכם, תופעה, דוגמה פתורה, חקרו.
      סדרו אותם לפי הסדר שבו הם מופיעים בשיעור, וכתבו במשפט אחד מה עושים בחלק "חקרו".
    answer: >-
      תופעה, חזו, חקרו, הסבר, דוגמה פתורה, בדקו את עצמכם. בחלק "חקרו" מבצעים משימות באיור החי, והאיור מזהה בעצמו שביצעתם אותן.
    solution:
      - kind: reasoning
        text: >-
          כל שיעור פותח בתופעה, משהו שקורה בעולם, ובשאלה עליה. מיד אחר כך מתחייבים לחיזוי, **לפני** כל הסבר, כדי שאפשר יהיה להשוות בכנות בין מה שחשבתם לבין מה שגיליתם.
      - kind: reasoning
        text: >-
          אחרי החיזוי חוקרים באיור החי, ורק אז מגיע ההסבר עם הנוסחאות. כך ההסבר עונה על שאלה שכבר שאלתם את עצמכם.
      - kind: reasoning
        text: >-
          אחרי ההסבר באה דוגמה פתורה, שמנסים לפתור לבד לפני שפותחים את הפתרון, ואחריה שאלות לבדיקה עצמית עם משוב מיידי.
      - kind: result
        text: >-
          תופעה, חזו, חקרו, הסבר, דוגמה פתורה, בדקו את עצמכם. ב"חקרו" מבצעים משימות באיור, והאיור מסמן ✓ ליד כל משימה שביצעתם.

  - id: W-0.1-02
    level: basic
    qualitative: false
    objectives: [OBJ-0.1-3]
    prompt: >-
      מכונית שנוסעת במהירות $10\,\text{m/s}$ בולמת בתאוטה קבועה, ונעצרת אחרי $10\,\text{m}$.
      עכשיו אותה מכונית, באותה תאוטה, נוסעת במהירות $20\,\text{m/s}$.
      כתבו קודם חיזוי: מה יהיה מרחק הבלימה? אחר כך חשבו, והשוו לחיזוי.
    answer: '$40\,\text{m}$, פי 4 מאשר במהירות הקודמת (ולא פי 2, כפי שרבים חוזים)'
    solution:
      - kind: given
        text: >-
          במקרה הראשון $v_0 = 10\,\text{m/s}$, ו-$d = 10\,\text{m}$ עד העצירה. במקרה השני $v_0 = 20\,\text{m/s}$, והתאוטה $a$ זהה. המהירות הסופית בשני המקרים היא אפס.
      - kind: formula
        text: >-
          לתנועה בתאוצה קבועה, עם הכיוון קדימה חיובי: $v^2 = v_0^2 - 2ad$. כשהמכונית נעצרת, $v = 0$.
      - kind: manipulation
        text: >-
          מכאן $d = \dfrac{v_0^2}{2a}$, ומהמקרה הראשון $a = \dfrac{v_0^2}{2d}$.
      - kind: substitution
        text: >-
          $a = \dfrac{(10\ \text{m/s})^2}{2\cdot 10\ \text{m}} = 5\ \text{m/s}^2$, ובמקרה השני $d = \dfrac{(20\ \text{m/s})^2}{2\cdot 5\ \text{m/s}^2} = 40\ \text{m}$.
      - kind: reasoning
        text: >-
          המהירות נכנסת לנוסחה בריבוע, ולכן מהירות פי 2 נותנת מרחק בלימה פי 4. החיזוי "פי 2" מניח בלי לשים לב שהמרחק גדל כמו המהירות.
      - kind: result
        text: >-
          מרחק הבלימה הוא $40\,\text{m}$, פי 4 מהמקרה הראשון.

  - id: W-0.1-03
    level: basic
    qualitative: true
    objectives: [OBJ-0.1-2]
    prompt: >-
      באיור חי ממכניקה, תיבה מקבלת דחיפה אחת על משטח ללא חיכוך, וממשיכה לנוע במהירות קבועה עד קצה המסך.
      תלמיד אומר: "האיור הראה שספר שאדחוף על השולחן בכיתה ימשיך לנוע בלי סוף."
      קבעו מה האיור כן מראה ומה הוא לא יכול להראות, ונמקו.
    answer: >-
      האיור מראה מה החוק הראשון של ניוטון צופה כשאין חיכוך. על ספר אמיתי בכיתה הוא לא יכול לומר דבר, כי חיכוך לא הוכנס לתוכו. את זה מכריע ניסוי, והספר נעצר.
    solution:
      - kind: reasoning
        text: >-
          האיור מחשב לפי החוקים שהכניסו לתוכו. כאן הכניסו את החוק השני של ניוטון בלי שום כוח אופקי, ולכן התיבה חייבת להמשיך במהירות קבועה. זה מה שהחוק הראשון צופה.
      - kind: reasoning
        text: >-
          על השולחן בכיתה פועל כוח חיכוך, שלא נמצא באיור. האיור לא "יודע" עליו, ולכן לא יכול לומר מה יקרה לספר.
      - kind: reasoning
        text: >-
          מה שקורה לספר אמיתי מכריע ניסוי: דוחפים את הספר ורואים שהוא נעצר. הניסוי לא סותר את החוק הראשון, אלא מראה שפועל על הספר כוח נוסף.
      - kind: result
        text: >-
          האיור מראה מה צופה החוק כשאין חיכוך, ולא מה יקרה בכיתה. על השולחן האמיתי הספר נעצר, בגלל החיכוך.

  - id: W-0.1-04
    level: mid
    qualitative: false
    objectives: [OBJ-0.1-3]
    prompt: >-
      כדור מתגלגל על שולחן שגובהו $1.25\,\text{m}$, ועוזב את קצה השולחן במהירות אופקית $2\,\text{m/s}$. בפעם השנייה הוא עוזב את השולחן במהירות אופקית $4\,\text{m/s}$. הזניחו את התנגדות האוויר.
      חזו קודם: האם בפעם השנייה הכדור יהיה באוויר זמן רב יותר, שווה או קצר יותר? ופי כמה ירחק מהשולחן?
      אחר כך חשבו את זמן התעופה ואת המרחק האופקי בשתי הפעמים.
    answer: 'זמן התעופה $0.5\,\text{s}$ בשתי הפעמים. המרחק האופקי $1\,\text{m}$ בפעם הראשונה ו-$2\,\text{m}$ בשנייה.'
    solution:
      - kind: given
        text: >-
          $h = 1.25\,\text{m}$, מהירות אופקית $2\,\text{m/s}$ ואחר כך $4\,\text{m/s}$, ומהירות אנכית התחלתית אפס בשתי הפעמים.
      - kind: reasoning
        text: >-
          התנועה האנכית לא תלויה במהירות האופקית. בשתי הפעמים הכדור מתחיל ליפול במהירות אנכית אפס מאותו גובה, ולכן זמן הנפילה שווה.
      - kind: formula
        text: >-
          $h = \tfrac12 g t^2$, ולכן $t = \sqrt{2h/g}$. המרחק האופקי הוא $x = v_x t$.
      - kind: substitution
        text: >-
          $t = \sqrt{\dfrac{2\cdot 1.25\ \text{m}}{10\ \text{m/s}^2}} = 0.5\ \text{s}$, ואז $x_1 = 2\ \text{m/s}\cdot 0.5\ \text{s} = 1\ \text{m}$ ו-$x_2 = 4\ \text{m/s}\cdot 0.5\ \text{s} = 2\ \text{m}$.
      - kind: result
        text: >-
          הכדור נמצא באוויר $0.5\,\text{s}$ בשתי הפעמים. בפעם השנייה הוא נוחת פי 2 רחוק יותר, $2\,\text{m}$ במקום $1\,\text{m}$.

  - id: W-0.1-05
    level: mid
    qualitative: true
    objectives: [OBJ-0.1-4]
    prompt: >-
      דנה ויוסי ענו על השאלה: "ספר מונח על שולחן. איזה כוח הוא הכוח שמתאים, לפי החוק השלישי של ניוטון, לכוח הכובד שכדור הארץ מפעיל על הספר?"
      שניהם ענו את אותה תשובה שגויה: "הכוח הנורמלי שהשולחן מפעיל על הספר". דנה לחצה "בדיקה · בטוחים", ויוסי לחץ "בדיקה · לא בטוחים".
      למי מהם דחוף יותר לחזור על הנושא? מה כדאי לכל אחד מהם לעשות? נמקו.
    answer: >-
      לדנה. אצלה הטעות בביטחון מרמזת על תפיסה שגויה, שצריך לנסח ולבדוק מול החוק. אצל יוסי זה חור בידע שהוא כבר יודע עליו: חזרה על ההסבר ותרגול בלי להציץ.
    solution:
      - kind: reasoning
        text: >-
          התשובה הנכונה: הכוח שהספר מפעיל על כדור הארץ, משיכה כלפי מעלה. לפי החוק השלישי, שני הכוחות בזוג פועלים על שני גופים **שונים**. הכוח הנורמלי והכובד פועלים שניהם על הספר, ולכן הם לא זוג כזה, גם אם הם שווים בגודלם.
      - kind: reasoning
        text: >-
          דנה טעתה בביטחון. זה סימן לתפיסה שגויה, כנראה "שני כוחות שווים ומנוגדים הם תמיד זוג של החוק השלישי". היא לא יודעת שהיא טועה, ולכן הטעות לא תתוקן מעצמה. כדאי לה לנסח את הרעיון במילים, ולבדוק אותו מול השאלה "על איזה גוף פועל כל כוח?".
      - kind: reasoning
        text: >-
          יוסי טעה בלי ביטחון. זה חור בידע, והוא כבר יודע עליו. כדאי לו לחזור להסבר על החוק השלישי, ולפתור שאלה דומה בלי להציץ.
      - kind: result
        text: >-
          דחוף יותר לדנה, כי טעות בביטחון לא מתגלה בלי עזרה. דנה צריכה לזהות ולהפריך רעיון שגוי, ויוסי צריך ללמוד ולתרגל.

  - id: W-0.1-06
    level: mid
    qualitative: false
    objectives: [OBJ-0.1-2]
    prompt: >-
      באיור חי של מטוטלת פשוטה, תלמידה מודדת בשעון שבאיור את זמן המחזור, פעם באורך חוט $0.4\,\text{m}$ ופעם באורך $1.6\,\text{m}$.
      היא מוצאת שזמן המחזור גדל פי 2, ואומרת: "בדקתי את הנוסחה $T = 2\pi\sqrt{L/g}$, והיא נכונה."

      (א) חשבו לפי הנוסחה את זמן המחזור בשני האורכים. (ב) האם מה שעשתה הוא בדיקה של הנוסחה? (ג) איך הייתם בודקים אותה באמת?
    answer: '(א) $1.26\,\text{s}$ ו-$2.51\,\text{s}$, פי 2. (ב) לא, כי האיור מחשב לפי אותה נוסחה. (ג) מודדים זמן מחזור של מטוטלת אמיתית בשעון עצר, בכמה אורכים.'
    solution:
      - kind: given
        text: >-
          $L_1 = 0.4\,\text{m}$, $L_2 = 1.6\,\text{m}$, ו-$g = 10\,\text{m/s}^2$.
      - kind: formula
        text: >-
          $T = 2\pi\sqrt{L/g}$
      - kind: substitution
        text: >-
          $T_1 = 2\pi\sqrt{\dfrac{0.4\ \text{m}}{10\ \text{m/s}^2}} = 2\pi\cdot 0.2\ \text{s} \approx 1.26\ \text{s}$, ו-$T_2 = 2\pi\cdot 0.4\ \text{s} \approx 2.51\ \text{s}$. האורך גדל פי 4, והזמן פי $\sqrt{4} = 2$.
      - kind: reasoning
        text: >-
          האיור מחשב את תנועת המטוטלת לפי חוקים שהכניסו לתוכו. לכן הוא תמיד יסכים עם הנוסחה שנובעת מהם, והסכמה כזו לא בודקת כלום. האיור מראה מה הנוסחה אומרת, וזה שימושי, אבל לא מוכיח אותה.
      - kind: reasoning
        text: >-
          בדיקה אמיתית היא ניסוי: תולים משקולת על חוט באורכים שונים, מודדים בשעון עצר זמן של עשרה מחזורים ומחלקים בעשר, ומשווים לנוסחה.
      - kind: result
        text: >-
          לפי הנוסחה $T_1 \approx 1.26\,\text{s}$ ו-$T_2 \approx 2.51\,\text{s}$. המדידה באיור לא בודקת את הנוסחה, ומה שבודק אותה הוא מדידה במטוטלת אמיתית.

  - id: W-0.1-07
    level: mid
    qualitative: true
    objectives: [OBJ-0.1-3]
    prompt: >-
      חברה מספרת: "ניסיתי בעצמי. פעם אחת קראתי פרק ארבע פעמים ובחנתי את עצמי מיד אחר כך. פעם אחרת קראתי פרק פעם אחת וניסיתי להיזכר. בפעם הראשונה הצלחתי יותר, אז אצלי קריאה חוזרת עובדת טוב יותר."
      האם הניסוי שלה מראה את מה שהיא חושבת? היעזרו בתוצאות הניסוי של רודיגר וקרפיקה מהשיעור, ונמקו.
    answer: >-
      לא. היא נבחנה מיד, וגם בניסוי של רודיגר וקרפיקה קריאה חוזרת ניצחה מעט במבחן מיידי. אחרי שבוע ניסיון להיזכר ניצח, ולכן כדי לבדוק צריך מבחן מאוחר.
    solution:
      - kind: reasoning
        text: >-
          בניסוי מהשיעור, חמש דקות אחרי הלמידה הקבוצה שקראה ארבע פעמים זכרה קצת יותר. שבוע אחר כך התמונה התהפכה: מי שניסו להיזכר זכרו בערך 60% מהקטע, ומי שקראו שוב ושוב בערך 40%.
      - kind: reasoning
        text: >-
          החברה בחנה את עצמה מיד, כלומר עשתה את "מבחן חמש הדקות". התוצאה שלה מתאימה בדיוק למה שהניסוי מצא, ולא אומרת כלום על מה שתזכור בעוד שבוע, בבוחן.
      - kind: reasoning
        text: >-
          גם התחושה שלה מטעה: בניסוי, מי שקראו ארבע פעמים היו בטוחים יותר שיזכרו, וזכרו פחות. טקסט מוכר קל לזהות, אבל בוחן דורש לשלוף אותו מהזיכרון.
      - kind: reasoning
        text: >-
          בדיקה הוגנת: ללמוד שני פרקים דומים, כל אחד בשיטה אחרת ובאותו זמן, ולהיבחן על שניהם רק אחרי שבוע.
      - kind: result
        text: >-
          לא. מבחן מיידי מעדיף קריאה חוזרת, ולמה שצריך לזכור גם בשבוע הבא ניסיון להיזכר מנצח.

  - id: W-0.1-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-0.1-3]
    prompt: >-
      תיבה מחליקה ממנוחה במורד מדרון חלק, ללא חיכוך, שאורכו $10\,\text{m}$ וזווית השיפוע שלו $30^\circ$. כדור נופל ממנוחה, ישר למטה, מגובה ראש המדרון עד הקרקע.
      לפני שאתם פותרים, חזו: מי מגיע לקרקע במהירות גדולה יותר, ומי מגיע מוקדם יותר?

      (א) חשבו את התאוצה של התיבה. (ב) חשבו כמה זמן התיבה מחליקה, ומה מהירותה בתחתית המדרון. (ג) חשבו את זמן הנפילה של הכדור ואת מהירותו בקרקע, והשוו לחיזוי.
    answer: '(א) $5\,\text{m/s}^2$ (ב) $2\,\text{s}$, ו-$10\,\text{m/s}$ בתחתית (ג) $1\,\text{s}$, ו-$10\,\text{m/s}$: אותה מהירות, והכדור מגיע פי 2 מוקדם יותר.'
    solution:
      - kind: given
        text: >-
          $L = 10\,\text{m}$, $\theta = 30^\circ$, מהירות התחלתית אפס לשניהם, ו-$g = 10\,\text{m/s}^2$. גובה ראש המדרון: $h = L\sin 30^\circ = 5\,\text{m}$.
      - kind: formula
        text: >-
          על מדרון חלק, הכוח היחיד לאורך המדרון הוא חלק מהכובד, והתאוצה לאורך המדרון היא $a = g\sin\theta$. לתנועה ממנוחה בתאוצה קבועה $L = \tfrac12 a t^2$ ו-$v = at$.
      - kind: substitution
        text: >-
          $a = 10\ \text{m/s}^2\cdot 0.5 = 5\ \text{m/s}^2$, אז $t = \sqrt{\dfrac{2\cdot 10\ \text{m}}{5\ \text{m/s}^2}} = 2\ \text{s}$, ו-$v = 5\ \text{m/s}^2\cdot 2\ \text{s} = 10\ \text{m/s}$.
      - kind: substitution
        text: >-
          לכדור: $t = \sqrt{\dfrac{2\cdot 5\ \text{m}}{10\ \text{m/s}^2}} = 1\ \text{s}$, ו-$v = \sqrt{2\cdot 10\ \text{m/s}^2\cdot 5\ \text{m}} = 10\ \text{m/s}$.
      - kind: reasoning
        text: >-
          החיזוי הנפוץ, "המדרון מאט את התיבה, ולכן היא תגיע לאט יותר", נכון רק לגבי הזמן. המהירות בקרקע תלויה רק בגובה שירדו: לפי שימור האנרגיה $mgh = \tfrac12 mv^2$, בלי קשר לדרך. על המדרון התאוצה קטנה יותר, אבל הדרך ארוכה יותר.
      - kind: result
        text: >-
          (א) $5\,\text{m/s}^2$. (ב) $2\,\text{s}$, ו-$10\,\text{m/s}$. (ג) $1\,\text{s}$, ו-$10\,\text{m/s}$. שניהם מגיעים באותה מהירות, והכדור מגיע פי 2 מוקדם יותר.

  - id: W-0.1-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-0.1-3, OBJ-0.1-4]
    prompt: >-
      מראש מגדל שגובהו $45\,\text{m}$ משחררים ממנוחה כדור א'. שנייה אחת אחריו משחררים מאותה נקודה כדור ב', גם ממנוחה. הזניחו את התנגדות האוויר.
      חזו קודם, וסמנו לעצמכם אם אתם בטוחים: בזמן ששני הכדורים נופלים, המרחק ביניהם גדל, קטן או נשאר קבוע?

      (א) חשבו את המרחק בין הכדורים שנייה אחת, שתי שניות ושלוש שניות אחרי שחרור כדור א'.

      (ב) מה ההפרש בין המהירויות שלהם בזמן ששניהם נופלים?

      (ג) מי שחזה "המרחק קבוע" וסימן "בטוחים": על מה זה מרמז, ומה כדאי לו לעשות?
    answer: '(א) $5\,\text{m}$, $15\,\text{m}$ ו-$25\,\text{m}$: המרחק גדל. (ב) $10\,\text{m/s}$, וההפרש קבוע. (ג) טעות בביטחון, כלומר תפיסה שגויה: כנראה "אותה תאוצה פירושה אותה מהירות". כדאי לנסח את הרעיון ולבדוק אותו מול החישוב.'
    solution:
      - kind: given
        text: >-
          גובה $45\,\text{m}$, שני הכדורים ממנוחה, כדור ב' משוחרר $1\,\text{s}$ אחרי כדור א', ו-$g = 10\,\text{m/s}^2$.
      - kind: formula
        text: >-
          נבחר את הכיוון למטה כחיובי, ונמדוד את $t$ מרגע שחרור כדור א'. המרחק שכל כדור נפל: $y_A = \tfrac12 g t^2$, ו-$y_B = \tfrac12 g (t-1)^2$ כש-$t \ge 1\,\text{s}$.
      - kind: substitution
        text: >-
          ב-$t = 1\,\text{s}$: $5\,\text{m} - 0 = 5\,\text{m}$. ב-$t = 2\,\text{s}$: $20\,\text{m} - 5\,\text{m} = 15\,\text{m}$. ב-$t = 3\,\text{s}$: $45\,\text{m} - 20\,\text{m} = 25\,\text{m}$, ובאותו רגע כדור א' מגיע לקרקע.
      - kind: manipulation
        text: >-
          המהירויות: $v_A = gt$ ו-$v_B = g(t-1)$, ולכן $v_A - v_B = g\cdot 1\,\text{s} = 10\,\text{m/s}$ בכל רגע. כדור א' מהיר יותר תמיד ב-$10\,\text{m/s}$, ולכן המרחק גדל ב-$10\,\text{m}$ בכל שנייה.
      - kind: reasoning
        text: >-
          "אותה תאוצה" פירושה שהמהירות של שני הכדורים **משתנה** באותו קצב, לא שהמהירויות שוות. כדור א' התחיל להאיץ שנייה קודם, ולכן הוא תמיד מהיר יותר. מי שחזה "קבוע" בביטחון טעה בביטחון, וזה סימן לתפיסה שגויה. כדאי לו לכתוב את הרעיון שהוביל לחיזוי, ולבדוק אותו מול טבלת המרחקים שחישב.
      - kind: result
        text: >-
          (א) $5\,\text{m}$, $15\,\text{m}$, $25\,\text{m}$: המרחק גדל. (ב) $10\,\text{m/s}$, קבוע. (ג) תפיסה שגויה שכדאי לנסח ולהפריך מול החישוב.

  - id: W-0.1-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-0.1-2, OBJ-0.1-3]
    prompt: >-
      מכונית חולפת במהירות קבועה $20\,\text{m/s}$ על פני ניידת משטרה עומדת. באותו רגע הניידת יוצאת בעקבותיה ממנוחה, בתאוצה קבועה $4\,\text{m/s}^2$.
      חזו קודם: מה תהיה מהירות הניידת ברגע שתשיג את המכונית?

      (א) אחרי כמה זמן ובאיזה מרחק הניידת משיגה את המכונית, ומה מהירותה אז?

      (ב) מה משתנה אם תאוצת הניידת היא $8\,\text{m/s}^2$?

      (ג) איור חי שמריץ את המרדף בשתי התאוצות מראה בשתיהן אותה מהירות השגה. האם זה מוכיח שכך יהיה בכל תאוצה? אם לא, הוכיחו.
    answer: '(א) אחרי $10\,\text{s}$, במרחק $200\,\text{m}$, במהירות $40\,\text{m/s}$. (ב) אחרי $5\,\text{s}$ ובמרחק $100\,\text{m}$, אבל שוב במהירות $40\,\text{m/s}$. (ג) לא. הפיתוח מראה שמהירות ההשגה היא תמיד פי 2 ממהירות המכונית, בכל תאוצה.'
    solution:
      - kind: given
        text: >-
          מהירות המכונית $v = 20\,\text{m/s}$, קבועה. הניידת מתחילה ממנוחה באותו מקום ובאותו רגע, בתאוצה $a = 4\,\text{m/s}^2$ ואחר כך $a = 8\,\text{m/s}^2$.
      - kind: formula
        text: >-
          $x_{\text{car}} = vt$, ו-$x_{\text{police}} = \tfrac12 a t^2$. הניידת משיגה את המכונית כשהמקומות שווים.
      - kind: manipulation
        text: >-
          $vt = \tfrac12 a t^2$, ולכן (מלבד $t = 0$) $t = \dfrac{2v}{a}$. מהירות הניידת אז: $v_{\text{police}} = a\cdot\dfrac{2v}{a} = 2v$. התאוצה מצטמצמת.
      - kind: substitution
        text: >-
          כש-$a = 4\,\text{m/s}^2$: $t = \dfrac{2\cdot 20\ \text{m/s}}{4\ \text{m/s}^2} = 10\ \text{s}$, $x = 20\ \text{m/s}\cdot 10\ \text{s} = 200\ \text{m}$, ו-$v_{\text{police}} = 40\ \text{m/s}$.
      - kind: substitution
        text: >-
          כש-$a = 8\,\text{m/s}^2$: $t = 5\ \text{s}$, $x = 100\ \text{m}$, ושוב $v_{\text{police}} = 8\ \text{m/s}^2\cdot 5\ \text{s} = 40\ \text{m/s}$.
      - kind: reasoning
        text: >-
          האיור הריץ שני מקרים, לפי אותם חוקים שבפיתוח. שני מקרים לא מוכיחים כלל, וגם אלף מקרים לא היו מוכיחים, כי האיור רק מראה מה החוקים צופים. הפיתוח מוכיח: התאוצה מצטמצמת, ולכן $v_{\text{police}} = 2v$ בכל תאוצה. ויש גם נימוק קצר: עד ההשגה שניהם עברו אותו מרחק באותו זמן, כך שהמהירות הממוצעת של הניידת היא $20\,\text{m/s}$. בתאוצה קבועה ממנוחה, המהירות הממוצעת היא חצי מהמהירות הסופית.
      - kind: result
        text: >-
          (א) $10\,\text{s}$, $200\,\text{m}$, $40\,\text{m/s}$. (ב) הזמן והמרחק קטנים פי 2, והמהירות נשארת $40\,\text{m/s}$. (ג) האיור לא מוכיח, והפיתוח מראה שמהירות ההשגה היא $2v$ בכל תאוצה.

challenge:
  - id: W-0.1-c1
    stars: 1
    objectives: [OBJ-0.1-3]
    prompt: >-
      כדור נזרק אנכית כלפי מעלה מהקרקע, מגיע לגובה מרבי וחוזר לקרקע. הפעם התנגדות האוויר **לא** זניחה: היא פועלת תמיד נגד כיוון התנועה.
      חזו לפני שאתם מנמקים: מה ארוך יותר, זמן העלייה או זמן הירידה? ואחר כך: האם הכדור פוגע בקרקע במהירות שבה נזרק?
    answer: >-
      הירידה ארוכה יותר, והכדור פוגע בקרקע במהירות קטנה ממהירות הזריקה.
    solution:
      - kind: reasoning
        text: >-
          החיזוי המפתה: "הזמנים שווים", כמו שלמדנו בזריקה אנכית בלי אוויר. או: "הירידה קצרה יותר, כי הכובד עוזר". הסימטריה בין עלייה לירידה נכונה רק כשאין כוח שמבזבז אנרגיה, וכאן יש.
      - kind: reasoning
        text: >-
          הכוחות: בעלייה גם הכובד וגם התנגדות האוויר פונים למטה, ולכן הכדור מאט בתאוצה שגודלה גדול מ-$g$. בירידה הכובד פונה למטה והתנגדות האוויר למעלה, ולכן הכדור מאיץ בתאוצה שגודלה קטן מ-$g$.
      - kind: reasoning
        text: >-
          האנרגיה: התנגדות האוויר עושה עבודה שלילית לאורך כל הדרך, ולכן האנרגיה המכנית רק קטנה. בכל גובה, האנרגיה הפוטנציאלית בירידה זהה לזו שבעלייה, ולכן נשארת פחות אנרגיה קינטית: בכל גובה הכדור עובר בירידה **לאט יותר** מאשר בעלייה.
      - kind: reasoning
        text: >-
          הדרך למעלה והדרך למטה שוות באורכן. אם בכל נקודה בדרך הכדור איטי יותר בירידה, הירידה נמשכת זמן רב יותר. ובאותו נימוק, ברגע הפגיעה בקרקע הכדור איטי יותר מברגע הזריקה.
      - kind: result
        text: >-
          זמן הירידה ארוך מזמן העלייה, ומהירות הפגיעה קטנה ממהירות הזריקה.
    source:
      name: PhysicsBowl (AAPT)
      year: 2026
      problem: 'Question 11'
      url: https://www.aapt.org/Programs/PhysicsBowl/upload/PB-Exam-2026.pdf
      verified: '2026-11-01'
      adapted: true

  - id: W-0.1-c2
    stars: 1
    objectives: [OBJ-0.1-3]
    prompt: >-
      חץ נורה מהקרקע בזווית כלשהי, ועובר דרך שתי טבעות שתלויות שתיהן באותו גובה $h$ מעל הקרקע. הוא עובר בטבעת הראשונה שנייה אחת אחרי הירי, ובטבעת השנייה עוד שתי שניות אחר כך. הזניחו את התנגדות האוויר.
      לא נתונים מהירות הירי, זווית הירי או המרחק בין הטבעות. חזו קודם: אפשר למצוא את $h$, או שחסרים נתונים?

      (א) מצאו את $h$, אם אפשר. (ב) מצאו את הגובה המרבי של החץ. (ג) האם אפשר למצוא את המרחק האופקי בין הטבעות?
    answer: '(א) $h = 15\,\text{m}$. (ב) $20\,\text{m}$. (ג) לא: המרחק תלוי במהירות האופקית, שאינה נתונה.'
    solution:
      - kind: reasoning
        text: >-
          החיזוי המפתה: "חסרים נתונים, כי לא נתונות המהירות והזווית". החיזוי נכשל כי התנועה האנכית לא תלויה בתנועה האופקית, ושני הזמנים קובעים את התנועה האנכית לגמרי.
      - kind: given
        text: >-
          החץ בגובה $h$ ב-$t_1 = 1\,\text{s}$ וב-$t_2 = 3\,\text{s}$, ו-$g = 10\,\text{m/s}^2$.
      - kind: reasoning
        text: >-
          בלי אוויר, התנועה האנכית סימטרית: החץ עובר בגובה $h$ פעם בעלייה ופעם בירידה, והשיא נמצא בדיוק באמצע, ב-$t = \tfrac12(t_1 + t_2) = 2\,\text{s}$.
      - kind: formula
        text: >-
          בשיא המהירות האנכית אפס, ולכן המהירות האנכית ההתחלתית היא $v_{y0} = g\cdot 2\,\text{s}$. הגובה בכל רגע: $y = v_{y0}t - \tfrac12 g t^2$.
      - kind: substitution
        text: >-
          $v_{y0} = 10\ \text{m/s}^2\cdot 2\ \text{s} = 20\ \text{m/s}$, ו-$h = 20\ \text{m/s}\cdot 1\ \text{s} - \tfrac12\cdot 10\ \text{m/s}^2\cdot(1\ \text{s})^2 = 15\ \text{m}$. בדיקה ב-$t_2$: $20\cdot 3 - 5\cdot 9 = 15$, כלומר שוב $15\,\text{m}$.
      - kind: substitution
        text: >-
          הגובה המרבי: $H = \dfrac{v_{y0}^2}{2g} = \dfrac{(20\ \text{m/s})^2}{2\cdot 10\ \text{m/s}^2} = 20\ \text{m}$.
      - kind: reasoning
        text: >-
          המרחק האופקי בין הטבעות הוא $v_x\cdot 2\,\text{s}$, ו-$v_x$ לא נתון. כל מהירות אופקית נותנת את אותם זמנים ואותם גבהים, ולכן הנתונים לא קובעים את המרחק הזה.
      - kind: result
        text: >-
          (א) $h = 15\,\text{m}$. (ב) $20\,\text{m}$. (ג) אי אפשר: המרחק תלוי ב-$v_x$, שאינה נתונה.
    source:
      name: F=ma Exam (AAPT, U.S. Physics Team)
      year: 2024
      problem: 'Question 1'
      url: https://www.aapt.org/physicsteam/upload/2024_F-ma_Exam.pdf
      verified: '2026-11-01'
      adapted: true
