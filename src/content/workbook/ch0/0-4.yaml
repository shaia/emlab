# Workbook, lesson 0.4 (graphs and linearization). Format and rules: see .claude/CLAUDE.md, "Worked examples, workbook".
# Every table was generated with src/physics/lab.ts (measure, seeded scatter) and every slope and intercept
# recomputed with fitLine; the values "read on the line" are the least-squares line at those x values.
# The learner works on paper, so a line drawn by eye whose slope is within about 5% of the fit counts as right.
# In a >- block, consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '0.4'
practice:
  - id: W-0.4-01
    level: basic
    qualitative: false
    objectives: [OBJ-0.4-1]
    prompt: >-
      עגלה נוסעת במהירות קבועה **לכיוון** החיישן, והחיישן מודד את המרחק $x$ שלה ממנו בכל רגע $t$.
      הגרף של $x$ מול $t$ הוא קו ישר, שעובר בנקודות $(2.0\,\text{s},\ 1.90\,\text{m})$ ו-$(6.0\,\text{s},\ 0.70\,\text{m})$.
      מצאו את השיפוע ואת נקודת החיתוך עם הציר האנכי, עם יחידות, והסבירו מה כל אחד מהם אומר על העגלה.
    answer: >-
      השיפוע $a = -0.30\,\text{m/s}$: העגלה מתקרבת לחיישן ב-$0.30\,\text{m/s}$.

      נקודת החיתוך $b = 2.50\,\text{m}$: המרחק שלה מהחיישן ברגע $t = 0$.
    solution:
      - kind: given
        text: >-
          שתי נקודות על הקו: $(x_1, y_1) = (2.0\,\text{s},\ 1.90\,\text{m})$ ו-$(x_2, y_2) = (6.0\,\text{s},\ 0.70\,\text{m})$.
      - kind: formula
        text: >-
          $a = \dfrac{y_2 - y_1}{x_2 - x_1}$, ואת נקודת החיתוך מוצאים מ-$y = a\,x + b$ באחת הנקודות: $b = y_1 - a\,x_1$.
      - kind: substitution
        text: >-
          $$a = \frac{0.70\ \text{m} - 1.90\ \text{m}}{6.0\ \text{s} - 2.0\ \text{s}} = \frac{-1.20\ \text{m}}{4.0\ \text{s}} = -0.30\ \text{m/s}$$
          $$b = 1.90\ \text{m} - (-0.30\ \text{m/s})\cdot 2.0\ \text{s} = 2.50\ \text{m}$$
      - kind: reasoning
        text: >-
          השיפוע שלילי, כי המרחק קטן עם הזמן: בכל שנייה העגלה מתקרבת לחיישן ב-$0.30\,\text{m}$. גודל השיפוע הוא גודל המהירות.
          נקודת החיתוך היא הערך של $x$ כאשר $t = 0$: המרחק שממנו העגלה התחילה.
      - kind: result
        text: >-
          השיפוע $a = -0.30\,\text{m/s}$ (העגלה מתקרבת ב-$0.30\,\text{m/s}$), ונקודת החיתוך $b = 2.50\,\text{m}$ (המרחק ההתחלתי מהחיישן).

  - id: W-0.4-02
    level: basic
    qualitative: true
    objectives: [OBJ-0.4-1]
    prompt: >-
      לכל אחד מהגרפים הבאים, כתבו את היחידות של השיפוע, וקבעו איזה גודל פיזיקלי השיפוע מייצג.

      א. המסה $m$ (ב-$\text{kg}$) של כמה גושים מאותה מתכת, מול הנפח שלהם $V$ (ב-$\text{m}^3$).

      ב. הכוח השקול $F$ (ב-$\text{N}$) שפועל על עגלה אחת, מול התאוצה שלה $a$ (ב-$\text{m/s}^2$).

      ג. העבודה $W$ (ב-$\text{J}$) שכוח קבוע עושה על גוף, מול הדרך $d$ (ב-$\text{m}$) שהגוף עובר בכיוון הכוח.
    answer: >-
      א. $\text{kg/m}^3$, הצפיפות של המתכת.

      ב. $\text{kg}$, המסה של העגלה.

      ג. $\text{N}$, הכוח.
    solution:
      - kind: formula
        text: >-
          היחידות של השיפוע הן היחידות של הציר האנכי חלקי היחידות של הציר האופקי. כדי לזהות את הגודל, כותבים את החוק בצורה $y = (\ldots)\cdot x$, ומה שמכפיל את $x$ הוא השיפוע.
      - kind: reasoning
        text: >-
          א. $m = \rho\,V$, כאשר $\rho$ היא הצפיפות. היחידות: $\text{kg}$ חלקי $\text{m}^3$, כלומר $\text{kg/m}^3$.
      - kind: reasoning
        text: >-
          ב. לפי החוק השני של ניוטון $F = m\,a$, ולכן השיפוע הוא המסה. היחידות: $\dfrac{\text{N}}{\text{m/s}^2} = \dfrac{\text{kg}\cdot\text{m/s}^2}{\text{m/s}^2} = \text{kg}$.
      - kind: reasoning
        text: >-
          ג. $W = F\,d$, ולכן השיפוע הוא הכוח. היחידות: $\dfrac{\text{J}}{\text{m}} = \dfrac{\text{N}\cdot\text{m}}{\text{m}} = \text{N}$.
      - kind: result
        text: >-
          א. $\text{kg/m}^3$, הצפיפות.

          ב. $\text{kg}$, המסה.

          ג. $\text{N}$, הכוח.

          בכל המקרים היחידות של השיפוע הן היחידות של הגודל שהוא מייצג.

  - id: W-0.4-03
    level: basic
    qualitative: true
    objectives: [OBJ-0.4-2]
    prompt: >-
      לכל אחד מהזוגות הבאים, קבעו אם הגודל הראשון ביחס ישר לשני, בקשר קווי שאינו יחס ישר, או בקשר שאינו קווי בכלל.

      א. המהירות $v$ של כדור שנזרק למטה במהירות $5\,\text{m/s}$, מול הזמן $t$ מרגע הזריקה.

      ב. הכוח השקול $F$ על עגלה שמסתה קבועה, מול התאוצה שלה $a$.

      ג. המרחק $d$ שכדור עבר מאז ששוחרר ממנוחה, מול הזמן $t$.

      ד. המרחק $d$ שכדור עבר מאז ששוחרר ממנוחה, מול $t^2$.

      ה. האורך $L$ של קפיץ, מול הכוח $F$ שמותח אותו.
    answer: >-
      יחס ישר: ב, ד.

      קשר קווי שאינו יחס ישר: א, ה.

      קשר שאינו קווי: ג.
    solution:
      - kind: formula
        text: >-
          יחס ישר הוא $y = a\,x$: קו ישר דרך הראשית. קשר קווי הוא $y = a\,x + b$, ואם $b$ אינו אפס הקו לא עובר בראשית. בכל מקרה כותבים את החוק ובודקים לאיזו צורה הוא מתאים.
      - kind: reasoning
        text: >-
          א. $v = 5 + 10\,t$ (ביחידות SI). קו ישר עם נקודת חיתוך $5\,\text{m/s}$: קשר קווי, לא יחס ישר.

          ב. $F = m\,a$: יחס ישר, עם שיפוע $m$.
      - kind: reasoning
        text: >-
          ג. $d = \tfrac12 g\,t^2$: מול $t$ זו עקומה, לא קו ישר.

          ד. אותו חוק מול $t^2$ הוא קו ישר דרך הראשית: יחס ישר, עם שיפוע $\tfrac12 g$.
      - kind: reasoning
        text: >-
          ה. $L = L_0 + F/k$: קו ישר שחותך את הציר באורך הטבעי $L_0$. רק ההתארכות $L - L_0$ ביחס ישר לכוח, לא האורך.
      - kind: result
        text: >-
          יחס ישר: ב, ד.

          קשר קווי שאינו יחס ישר: א, ה.

          קשר שאינו קווי: ג.

          ושימו לב לג ולד: אותו חוק יכול להיות עקומה מול $t$ ויחס ישר מול $t^2$.

  - id: W-0.4-04
    level: mid
    qualitative: true
    objectives: [OBJ-0.4-3]
    prompt: >-
      כדור קשור בחוט ומסתובב במעגל אופקי. הכוח השקול $F$ שפועל עליו הוא $F = \dfrac{m\,v^2}{R}$, כאשר $m$ המסה, $v$ גודל המהירות ו-$R$ הרדיוס של המעגל.

      א. משנים רק את המהירות, באותו כדור ובאותו רדיוס. מה כדאי לשים על הציר האופקי, כדי שהגרף של $F$ יהיה קו ישר? מה מייצג השיפוע, ומה היחידות שלו?

      ב. משנים רק את הרדיוס, ושומרים על אותה מהירות. מה שמים עכשיו על הציר האופקי? מה מייצג השיפוע, ומה היחידות שלו?
    answer: >-
      א. $v^2$, והשיפוע $m/R$ ביחידות $\text{kg/m}$.

      ב. $1/R$, והשיפוע $m\,v^2$ ביחידות $\text{N}\cdot\text{m}$, שהן $\text{J}$.
    solution:
      - kind: formula
        text: >-
          הכלל: כותבים את החוק כך ש-$F$ לבדו בצד אחד, ובצד השני מכפלה של קבוע בגודל שמשתנה. את הגודל שמשתנה שמים על הציר האופקי, והקבוע הוא השיפוע.
      - kind: manipulation
        text: >-
          א. $F = \left(\dfrac{m}{R}\right)\cdot v^2$. מה שמשתנה הוא $v^2$, ולכן גרף של $F$ מול $v^2$ הוא קו ישר דרך הראשית, עם שיפוע $m/R$.
      - kind: manipulation
        text: >-
          ב. $F = \left(m\,v^2\right)\cdot\dfrac{1}{R}$. עכשיו מה שמשתנה הוא $1/R$, ולכן שמים על הציר $1/R$, והשיפוע הוא $m\,v^2$. גרף של $F$ מול $R$ עצמו הוא עקומה יורדת.
      - kind: reasoning
        text: >-
          היחידות בסעיף א: $\dfrac{\text{N}}{\text{m}^2/\text{s}^2} = \dfrac{\text{kg}\cdot\text{m/s}^2}{\text{m}^2/\text{s}^2} = \text{kg/m}$, כמו $m/R$.

          היחידות בסעיף ב: $\dfrac{\text{N}}{1/\text{m}} = \text{N}\cdot\text{m}$, כמו $m\,v^2$. ניוטון כפול מטר הוא ג׳אול, $\text{N}\cdot\text{m} = \text{J}$: אותה יחידה כמו של אנרגיה.
      - kind: result
        text: >-
          א. $F$ מול $v^2$, עם שיפוע $m/R$ ($\text{kg/m}$).

          ב. $F$ מול $1/R$, עם שיפוע $m\,v^2$ ($\text{N}\cdot\text{m}$, כלומר $\text{J}$).

  - id: W-0.4-05
    level: mid
    qualitative: false
    objectives: [OBJ-0.4-1, OBJ-0.4-4]
    prompt: >-
      תולים על קפיץ משקולות שונות, ובכל פעם מודדים את האורך $L$ של הקפיץ, כשהמשקולת במנוחה:

      $$\begin{array}{c|ccccc} m\ (\text{kg}) & 0.05 & 0.10 & 0.15 & 0.20 & 0.25 \\ \hline L\ (\text{m}) & 0.169 & 0.191 & 0.208 & 0.231 & 0.251 \end{array}$$

      שרטטו גרף של $L$ מול $m$ והעבירו את הקו המתאים ביותר. מצאו את השיפוע עם יחידות, את האורך הטבעי $L_0$ של הקפיץ, ואת קבוע הקפיץ $k$.

      קו שמשרטטים ביד נחשב נכון אם השיפוע שלו שונה מזה שבפתרון בפחות מ-5% בערך.
    answer: >-
      השיפוע כ-$0.41\,\text{m/kg}$, $L_0 \approx 0.15\,\text{m}$, ו-$k \approx 25\,\text{N/m}$ (מקו שמשרטטים ביד, כל ערך בין $23$ ל-$26\,\text{N/m}$ נכון).
    solution:
      - kind: given
        text: >-
          חמש מדידות של $m$ ושל $L$. הקפיץ מחזיק את המשקולת במנוחה, ולכן הכוח שמותח אותו שווה למשקל $m\,g$.
      - kind: formula
        text: >-
          חוק הוק: $m\,g = k\,(L - L_0)$.
      - kind: manipulation
        text: >-
          מבודדים את $L$: $L = L_0 + \dfrac{g}{k}\cdot m$. זה קו ישר מול $m$, עם שיפוע $\dfrac{g}{k}$ ונקודת חיתוך $L_0$. לכן $k$ הוא $g$ חלקי השיפוע.
      - kind: substitution
        text: >-
          על הקו המתאים ביותר קוראים $L = 0.149\,\text{m}$ ב-$m = 0$, ו-$L = 0.251\,\text{m}$ ב-$m = 0.25\,\text{kg}$ (כאן הקו עובר כמעט בדיוק דרך המדידה).
          $$\frac{\Delta L}{\Delta m} = \frac{0.251\ \text{m} - 0.149\ \text{m}}{0.25\ \text{kg} - 0} = 0.408\ \text{m/kg}$$
          $$k = \frac{10\ \text{m/s}^2}{0.408\ \text{m/kg}} \approx 24.5\ \text{N/m}$$
      - kind: result
        text: >-
          השיפוע כ-$0.41\,\text{m/kg}$, האורך הטבעי $L_0 \approx 0.15\,\text{m}$, וקבוע הקפיץ $k \approx 25\,\text{N/m}$. מי ששכח את $g$ קיבל $1/0.408 \approx 2.5$, ביחידות $\text{kg/m}$, שאינן יחידות של קבוע קפיץ.

  - id: W-0.4-06
    level: mid
    qualitative: true
    objectives: [OBJ-0.4-2, OBJ-0.4-1]
    prompt: >-
      עגלה מתגלגלת במורד מסילה נטויה, וחיישן מודד את המהירות שלה. הגרף של המהירות $v$ מול הזמן $t$ הוא קו ישר עולה, שחותך את הציר האנכי ב-$0.60\,\text{m/s}$.
      תלמיד טוען: "הגרף הוא קו ישר, ולכן המהירות ביחס ישר לזמן".

      א. קבעו ונמקו: האם הוא צודק?

      ב. מה המשמעות של נקודת החיתוך?

      ג. מה ישתנה בגרף אם משחררים את העגלה ממנוחה ברגע $t = 0$, על אותה מסילה? מה יקרה לשיפוע של הגרף?
    answer: >-
      א. לא: הקו לא עובר בראשית, ולכן זה קשר קווי ולא יחס ישר.

      ב. המהירות ברגע $t = 0$.

      ג. הקו יעבור בראשית, עם אותו שיפוע (אותה תאוצה).
    solution:
      - kind: reasoning
        text: >-
          א. יחס ישר הוא רק קו ישר שעובר בראשית. כאן $v = 0.60\,\text{m/s} + a\,t$, וכשמכפילים את $t$, רק החלק $a\,t$ מוכפל. המהירות לא מוכפלת, ולכן אין יחס ישר.
      - kind: reasoning
        text: >-
          ב. נקודת החיתוך היא הערך של $v$ כאשר $t = 0$: ברגע שהתחילו למדוד, העגלה כבר נעה ב-$0.60\,\text{m/s}$.
      - kind: reasoning
        text: >-
          ג. השיפוע של הגרף הוא התאוצה, והיא נקבעת על ידי זווית הנטייה של המסילה, לא על ידי הרגע שבו התחלנו למדוד. משחרור ממנוחה $v = 0$ ב-$t = 0$, ולכן הקו עובר בראשית, במקביל לקו הקודם.
      - kind: result
        text: >-
          א. הטענה שגויה: זה קשר קווי, לא יחס ישר.

          ב. נקודת החיתוך היא המהירות ההתחלתית.

          ג. משחרור ממנוחה מתקבל קו מקביל דרך הראשית, עם אותו שיפוע.

  - id: W-0.4-07
    level: mid
    qualitative: false
    objectives: [OBJ-0.4-1, OBJ-0.4-4]
    prompt: >-
      משקולת תלויה על קפיץ ומתנודדת למעלה ולמטה. זמן המחזור שלה הוא $T = 2\pi\sqrt{\dfrac{m}{k}}$, כאשר $m$ המסה של המשקולת ו-$k$ קבוע הקפיץ.
      תלמידים מדדו את $T$ עם משקולות שונות, ושרטטו גרף של $T^2$ מול $m$. הקו המתאים ביותר עובר בנקודות $(0.10\,\text{kg},\ 0.16\,\text{s}^2)$ ו-$(0.50\,\text{kg},\ 0.80\,\text{s}^2)$.
      מצאו את השיפוע עם יחידות, ואת $k$.
    answer: 'השיפוע $1.6\,\text{s}^2/\text{kg}$, ו-$k \approx 25\,\text{N/m}$.'
    solution:
      - kind: given
        text: >-
          שתי נקודות על הקו: $(0.10\,\text{kg},\ 0.16\,\text{s}^2)$ ו-$(0.50\,\text{kg},\ 0.80\,\text{s}^2)$.
      - kind: manipulation
        text: >-
          מעלים בריבוע: $T^2 = \dfrac{4\pi^2}{k}\cdot m$. זה קו ישר דרך הראשית מול $m$, עם שיפוע $\dfrac{4\pi^2}{k}$. לכן $k$ הוא $4\pi^2$ חלקי השיפוע.
      - kind: substitution
        text: >-
          $$\frac{\Delta (T^2)}{\Delta m} = \frac{0.80\ \text{s}^2 - 0.16\ \text{s}^2}{0.50\ \text{kg} - 0.10\ \text{kg}} = \frac{0.64\ \text{s}^2}{0.40\ \text{kg}} = 1.6\ \text{s}^2/\text{kg}$$
          $$k = \frac{4\pi^2}{1.6\ \text{s}^2/\text{kg}} \approx 24.7\ \text{N/m}$$
      - kind: reasoning
        text: >-
          בדיקת יחידות: $\text{kg/s}^2 = \text{kg}\cdot\text{m/s}^2$ חלקי $\text{m}$, כלומר $\text{N/m}$, יחידות של קבוע קפיץ.
      - kind: result
        text: >-
          השיפוע $1.6\,\text{s}^2/\text{kg}$, וקבוע הקפיץ $k \approx 25\,\text{N/m}$.

  - id: W-0.4-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-0.4-3, OBJ-0.4-4]
    prompt: >-
      על שולחן מונחת מסילה קצרה, שמסתיימת בקצה השולחן. כדור מתגלגל לאורך המסילה ועוזב את קצה השולחן במהירות אופקית $v_0$, שזהה בכל הניסויים.
      משנים את הגובה $H$ של קצה השולחן מעל הרצפה, ומודדים את המרחק האופקי $R$ מקצה השולחן עד המקום שבו הכדור פוגע ברצפה:

      $$\begin{array}{c|ccccc} H\ (\text{m}) & 0.20 & 0.40 & 0.60 & 0.80 & 1.00 \\ \hline R\ (\text{m}) & 0.299 & 0.424 & 0.516 & 0.598 & 0.670 \end{array}$$

      א. הראו ש-$R^2 = \dfrac{2v_0^2}{g}\,H$ (התנגדות האוויר זניחה).

      ב. איזה גרף כדאי לשרטט כדי לקבל קו ישר? שרטטו אותו והעבירו את הקו המתאים ביותר.

      ג. מצאו מהשיפוע את $v_0$.

      קו שמשרטטים ביד נחשב נכון אם השיפוע שלו שונה מזה שבפתרון בפחות מ-5% בערך.
    answer: >-
      גרף של $R^2$ מול $H$, קו ישר דרך הראשית.

      השיפוע כ-$0.45\,\text{m}$, ו-$v_0 \approx 1.5\,\text{m/s}$.
    solution:
      - kind: formula
        text: >-
          בזריקה אופקית: בציר האנכי נפילה ממנוחה, $H = \tfrac12 g\,t^2$. בציר האופקי מהירות קבועה, $R = v_0\,t$.
      - kind: manipulation
        text: >-
          א. מהמשוואה האנכית $t^2 = \dfrac{2H}{g}$. מעלים בריבוע את המשוואה האופקית ומציבים: $R^2 = v_0^2\,t^2 = \dfrac{2v_0^2}{g}\cdot H$.
      - kind: reasoning
        text: >-
          ב. $R^2$ ביחס ישר ל-$H$, ולכן גרף של $R^2$ מול $H$ הוא קו ישר דרך הראשית, עם שיפוע $\dfrac{2v_0^2}{g}$. (גם $R$ מול $\sqrt{H}$ הוא קו ישר, אבל דרך $R^2$ מול $H$ החישוב פשוט יותר.)
      - kind: substitution
        text: >-
          מחשבים את $R^2$ בכל שורה: $0.089$, $0.180$, $0.266$, $0.358$, $0.449$ (ב-$\text{m}^2$). הקו המתאים ביותר עובר כמעט בראשית, וב-$H = 1.00\,\text{m}$ קוראים עליו $R^2 = 0.448\,\text{m}^2$. השיפוע:
          $$\frac{\Delta (R^2)}{\Delta H} = \frac{0.448\ \text{m}^2 - 0}{1.00\ \text{m} - 0} = 0.448\ \text{m}$$
      - kind: reasoning
        text: >-
          בדיקת יחידות: מהגרף, $\text{m}^2$ חלקי $\text{m}$ הם $\text{m}$. ומהנוסחה, $\dfrac{v_0^2}{g}$ הוא $\dfrac{\text{m}^2/\text{s}^2}{\text{m/s}^2} = \text{m}$. שתי הדרכים נותנות מטרים, כמו שצריך.
      - kind: substitution
        text: >-
          ג. השיפוע שווה ל-$\dfrac{2v_0^2}{g}$, ולכן
          $$v_0 = \sqrt{\frac{g\cdot 0.448\ \text{m}}{2}} = \sqrt{\frac{10\ \text{m/s}^2\cdot 0.448\ \text{m}}{2}} \approx 1.50\ \text{m/s}$$
      - kind: result
        text: >-
          גרף של $R^2$ מול $H$ הוא קו ישר דרך הראשית, עם שיפוע כ-$0.45\,\text{m}$, ומהירות היציאה $v_0 \approx 1.5\,\text{m/s}$.

  - id: W-0.4-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-0.4-2, OBJ-0.4-3, OBJ-0.4-4]
    prompt: >-
      עגלה נעה במורד מסילה נטויה וחלקה. היא עוברת בשער A כשהיא כבר בתנועה, ושערי אור מודדים את המהירות $v$ שלה במרחקים שונים $x$ מ-A, במורד המסילה:

      $$\begin{array}{c|ccccc} x\ (\text{m}) & 0.20 & 0.40 & 0.60 & 0.80 & 1.00 \\ \hline v\ (\text{m/s}) & 1.117 & 1.366 & 1.570 & 1.728 & 1.905 \end{array}$$

      א. איזה גרף כדאי לשרטט כדי לקבל קו ישר? נמקו בעזרת נוסחה מהמכניקה.

      ב. מצאו מהגרף את התאוצה $a$ של העגלה ואת המהירות $v_A$ שלה בשער A.

      ג. החיכוך זניח. מצאו את זווית הנטייה של המסילה (הזווית בין המסילה לבין האופק).

      ד. מה משתנה בגרף אם משחררים את העגלה ממנוחה בדיוק בשער A?

      קו שמשרטטים ביד נחשב נכון אם השיפוע שלו שונה מזה שבפתרון בפחות מ-5% בערך.
    answer: >-
      א. גרף של $v^2$ מול $x$.

      ב. $a \approx 1.48\,\text{m/s}^2$, $v_A \approx 0.82\,\text{m/s}$.

      ג. זווית הנטייה של המסילה כ-$8.5^\circ$.

      ד. הקו עובר בראשית, עם אותו שיפוע.
    solution:
      - kind: formula
        text: >-
          בתאוצה קבועה: $v^2 = v_A^2 + 2a\,x$.
      - kind: reasoning
        text: >-
          א. זה קו ישר מהצורה $y = (\ldots)\cdot x + b$, עם $y = v^2$ והמרחק $x$ על הציר האופקי. השיפוע $2a$, ונקודת החיתוך $v_A^2$. הקו לא עובר בראשית: זה קשר קווי, לא יחס ישר.
      - kind: substitution
        text: >-
          ב. מחשבים את $v^2$: $1.25$, $1.87$, $2.46$, $2.99$, $3.63$ (ב-$\text{m}^2/\text{s}^2$). על הקו המתאים ביותר קוראים $v^2 = 0.67\,\text{m}^2/\text{s}^2$ ב-$x = 0$, ו-$v^2 = 3.62\,\text{m}^2/\text{s}^2$ ב-$x = 1.00\,\text{m}$:
          $$\frac{\Delta (v^2)}{\Delta x} = \frac{3.62 - 0.67}{1.00 - 0}\ \frac{\text{m}^2/\text{s}^2}{\text{m}} = 2.95\ \text{m/s}^2$$
          $$a = \frac{2.95\ \text{m/s}^2}{2} \approx 1.48\ \text{m/s}^2 \qquad v_A = \sqrt{0.67\ \text{m}^2/\text{s}^2} \approx 0.82\ \text{m/s}$$
      - kind: substitution
        text: >-
          ג. התאוצה מסעיף ב היא חצי השיפוע של הגרף, $a = 2.95/2 \approx 1.48\,\text{m/s}^2$. על מסילה נטויה חלקה $a = g\sin\theta$, כאשר $\theta$ זווית הנטייה של המסילה. לכן $\sin\theta = \dfrac{a}{g} = \dfrac{1.48}{10} \approx 0.148$, ו-$\theta \approx 8.5^\circ$.
      - kind: reasoning
        text: >-
          ד. משחרור ממנוחה ב-A, $v_A = 0$, ולכן נקודת החיתוך אפס: הקו עובר בראשית. התאוצה לא משתנה, ולכן השיפוע של הגרף נשאר זהה, והקו החדש מקביל לקודם.
      - kind: result
        text: >-
          א. גרף של $v^2$ מול $x$.

          ב. $a \approx 1.48\,\text{m/s}^2$, $v_A \approx 0.82\,\text{m/s}$.

          ג. זווית הנטייה של המסילה כ-$8.5^\circ$.

          ד. משחרור ממנוחה ב-A: קו מקביל דרך הראשית.

  - id: W-0.4-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-0.4-3, OBJ-0.4-4]
    prompt: >-
      נהג רואה מכשול ולוחץ על הבלם. מרחק העצירה $d$ כולל שני חלקים: בזמן התגובה $t_r$ המכונית ממשיכה במהירות קבועה $v$, ואחר כך היא בולמת בתאוצה קבועה שגודלה $a$. לכן
      $$d = v\,t_r + \frac{v^2}{2a}$$
      בבדיקה מדדו את מרחק העצירה בכמה מהירויות:

      $$\begin{array}{c|ccccc} v\ (\text{m/s}) & 10 & 15 & 20 & 25 & 30 \\ \hline d\ (\text{m}) & 15.4 & 28.1 & 44.8 & 64.7 & 89.5 \end{array}$$

      א. הראו שגרף של $d/v$ מול $v$ הוא קו ישר. מה מייצגים השיפוע ונקודת החיתוך?

      ב. שרטטו את הגרף, ומצאו ממנו את $t_r$ ואת $a$.

      ג. איזה חלק ממרחק העצירה במהירות $20\,\text{m/s}$ עוברת המכונית עוד לפני שהבלמים מתחילים לפעול?

      קו שמשרטטים ביד נחשב נכון אם השיפוע שלו שונה מזה שבפתרון בפחות מ-5% בערך.
    answer: >-
      א. השיפוע $\tfrac{1}{2a}$ ונקודת החיתוך $t_r$.

      ב. השיפוע כ-$0.072\,\text{s}^2/\text{m}$, ולכן $a \approx 6.9\,\text{m/s}^2$, ו-$t_r \approx 0.80\,\text{s}$.

      ג. ב-$20\,\text{m/s}$, כ-$16\,\text{m}$ מתוך כ-$45\,\text{m}$: יותר משליש.
    solution:
      - kind: manipulation
        text: >-
          א. מחלקים את שני האגפים ב-$v$:
          $$\frac{d}{v} = \frac{1}{2a}\cdot v + t_r$$
          זה קו ישר מהצורה $y = (\ldots)\cdot x + b$, עם $y = d/v$ והמהירות $v$ על הציר האופקי. השיפוע $\dfrac{1}{2a}$, ונקודת החיתוך היא זמן התגובה $t_r$.
      - kind: substitution
        text: >-
          ב. מחשבים את $d/v$: $1.54$, $1.87$, $2.24$, $2.59$, $2.98$ (ב-$\text{s}$). על הקו המתאים ביותר קוראים $1.52\,\text{s}$ ב-$v = 10\,\text{m/s}$, ו-$2.96\,\text{s}$ ב-$v = 30\,\text{m/s}$:
          $$\frac{\Delta (d/v)}{\Delta v} = \frac{2.96\ \text{s} - 1.52\ \text{s}}{30\ \text{m/s} - 10\ \text{m/s}} = 0.072\ \text{s}^2/\text{m}$$
      - kind: substitution
        text: >-
          נקודת החיתוך: $t_r = 1.52\,\text{s} - 0.072\,\text{s}^2/\text{m}\cdot 10\,\text{m/s} = 0.80\,\text{s}$. ומהשיפוע:
          $$a = \frac{1}{2\cdot 0.072\ \text{s}^2/\text{m}} \approx 6.9\ \text{m/s}^2$$
      - kind: substitution
        text: >-
          ג. בזמן התגובה המכונית עוברת $v\,t_r = 20\,\text{m/s}\cdot 0.80\,\text{s} = 16\,\text{m}$, מתוך מרחק עצירה של כ-$44.8\,\text{m}$: כ-36%, יותר משליש.
      - kind: result
        text: >-
          ב. $t_r \approx 0.80\,\text{s}$ ו-$a \approx 6.9\,\text{m/s}^2$.

          ג. ב-$20\,\text{m/s}$, כ-$16\,\text{m}$ מתוך כ-$45\,\text{m}$ עוברים עוד לפני הבלימה.

challenge:
  - id: W-0.4-c1
    stars: 1
    objectives: [OBJ-0.4-3, OBJ-0.4-4]
    prompt: >-
      רוכב אופניים נוסע במהירות קבועה $v$ על כביש ישר ואופקי, בלי רוח. הכוח שמתנגד לתנועה שלו הוא $F = A\,v^2 + B$, כאשר $A$ ו-$B$ קבועים.
      בטבלה ההספק $P$ שהרוכב מפתח בכל מהירות:

      $$\begin{array}{c|cccccc} v\ (\text{m/s}) & 2 & 4 & 6 & 8 & 10 & 12 \\ \hline P\ (\text{W}) & 9.46 & 28.3 & 67.0 & 132 & 238 & 390 \end{array}$$

      א. בחרו מה לשים על הצירים כדי לקבל קו ישר, שרטטו, ומצאו את $A$ ואת $B$ עם יחידות. רמז: גם את מה ששמים על הציר האנכי אפשר לחשב מהמדידות.

      ב. מה המשמעות הפיזיקלית של כל אחד משני האיברים, $A\,v^2$ ו-$B$?

      ג. הרוכב מסוגל לפתח $60\,\text{W}$ לאורך זמן. מה המהירות הגדולה ביותר שהוא יכול לשמור עליה לאורך זמן?

      קו שמשרטטים ביד נחשב נכון אם השיפוע שלו שונה מזה שבפתרון בפחות מ-5% בערך.
    answer: >-
      א. גרף של $F = P/v$ מול $v^2$: $A \approx 0.20\,\text{kg/m}$, $B \approx 3.9\,\text{N}$.

      ב. $A\,v^2$ היא התנגדות האוויר, ו-$B$ החיכוך בין הצמיגים לכביש ובחלקי האופניים.

      ג. כ-$5.7\,\text{m/s}$.
    solution:
      - kind: reasoning
        text: >-
          א. במהירות קבועה הכוח השקול אפס, ולכן הרוכב מפעיל כוח קדימה ששווה בגודלו לכוח המתנגד. ההספק הוא $P = F\,v$, ולכן מכל שורה בטבלה מקבלים $F = P/v$.
      - kind: formula
        text: >-
          $F = A\cdot v^2 + B$ הוא קו ישר מהצורה $y = (\ldots)\cdot x + b$, עם $y = F$ ו-$v^2$ על הציר האופקי. השיפוע $A$, ונקודת החיתוך $B$.
      - kind: substitution
        text: >-
          מחשבים: $v^2 = 4,\ 16,\ 36,\ 64,\ 100,\ 144$ (ב-$\text{m}^2/\text{s}^2$), ו-$F = 4.73,\ 7.08,\ 11.2,\ 16.5,\ 23.8,\ 32.5$ (ב-$\text{N}$).
          על הקו המתאים ביותר קוראים $F = 3.93\,\text{N}$ ב-$v^2 = 0$, ו-$F = 32.5\,\text{N}$ ב-$v^2 = 144\,\text{m}^2/\text{s}^2$ (כאן הקו עובר כמעט בדיוק דרך המדידה):
          $$A = \frac{32.5\ \text{N} - 3.93\ \text{N}}{144\ \text{m}^2/\text{s}^2 - 0} \approx 0.198\ \text{kg/m} \qquad B \approx 3.9\ \text{N}$$
          היחידות של $A$: $\dfrac{\text{N}}{\text{m}^2/\text{s}^2} = \dfrac{\text{kg}\cdot\text{m/s}^2}{\text{m}^2/\text{s}^2} = \text{kg/m}$.
      - kind: reasoning
        text: >-
          ב. $A\,v^2$ גדל מהר עם המהירות: זו התנגדות האוויר. $B$ לא תלוי במהירות: זה החיכוך בין הצמיגים לכביש, וחיכוך בחלקי האופניים.
      - kind: substitution
        text: >-
          ג. צריך $P = (A\,v^2 + B)\,v = 60\,\text{W}$. מנסים ערכים: ב-$v = 5.5\,\text{m/s}$ מקבלים כ-$55\,\text{W}$, ב-$v = 6\,\text{m/s}$ כ-$66\,\text{W}$, וב-$v = 5.7\,\text{m/s}$ כ-$59\,\text{W}$. התשובה בין $5.7$ ל-$5.8\,\text{m/s}$.
      - kind: result
        text: >-
          א. $A \approx 0.20\,\text{kg/m}$ ו-$B \approx 3.9\,\text{N}$.

          ב. $A\,v^2$ היא התנגדות האוויר, ו-$B$ החיכוך בין הצמיגים לכביש.

          ג. המהירות הגדולה ביותר ב-$60\,\text{W}$ היא כ-$5.7\,\text{m/s}$, כ-$21\,\text{km/h}$.
    source:
      name: British Physics Olympiad (BPhO), Round 1
      year: 2015
      problem: 'Round 1, November 2015, Section 2, Q3'
      url: https://www.bpho.org.uk/Papers/R1/2015Nov_R1_S2.pdf
      verified: '2026-11-01'
      adapted: true

  - id: W-0.4-c2
    stars: 2
    objectives: [OBJ-0.4-1, OBJ-0.4-3, OBJ-0.4-4]
    prompt: >-
      כדי למדוד את מקדם החיכוך הקינטי $\mu$ בין נייר לנייר, מצפים קרש בנייר ומשעינים אותו על קיר בזווית $\theta$ לרצפה. גם הרצפה שאחרי הקרש מכוסה בנייר.
      גוף עטוף בנייר מתחיל ממנוחה בראש הקרש, מחליק לאורך כל הקרש (שאורכו $s$, לא ידוע), וממשיך להחליק על הרצפה עד שהוא נעצר במרחק $d$ מתחתית הקרש. חוזרים על הניסוי בכמה זוויות:

      $$\begin{array}{c|cccccc} \theta & 40^\circ & 45^\circ & 50^\circ & 55^\circ & 60^\circ & 70^\circ \\ \hline d\ (\text{m}) & 0.18 & 0.37 & 0.55 & 0.73 & 0.86 & 1.18 \end{array}$$

      מצאו קשר בין $d$ לבין $\theta$, וכתבו אותו כקו ישר $y = a\,x + b$, כאשר $x$ ו-$y$ תלויים רק ב-$\theta$ וב-$d$. שרטטו את הגרף, ומצאו ממנו את $\mu$ ואת אורך הקרש $s$.
      הניחו שהגוף לא מאבד מהירות במעבר מהקרש לרצפה.
    answer: >-
      גרף של $d/\cos\theta$ מול $\tan\theta$: שיפוע $s/\mu \approx 1.68\,\text{m}$ ונקודת חיתוך $b = -s \approx -1.15\,\text{m}$.

      לכן $s \approx 1.15\,\text{m}$ ו-$\mu \approx 0.69$.
    solution:
      - kind: formula
        text: >-
          משפט עבודה-אנרגיה מראש הקרש עד העצירה: הגוף מתחיל ומסיים במנוחה, ולכן העבודה של כוח הכובד שווה לעבודה של החיכוך. על הקרש הכוח הנורמלי $m\,g\cos\theta$, ועל הרצפה $m\,g$:
          $$m\,g\,s\sin\theta = \mu\,m\,g\cos\theta\cdot s + \mu\,m\,g\cdot d$$
      - kind: manipulation
        text: >-
          המסה ו-$g$ מצטמצמים. מבודדים את $d$:
          $$d = \frac{s}{\mu}\sin\theta - s\cos\theta$$
          כך עוד אין קו ישר: גם $\sin\theta$ וגם $\cos\theta$ משתנים עם הזווית. מחלקים ב-$\cos\theta$, כדי שאיבר אחד יהפוך לקבוע והשני יהיה ביחס ישר ל-$\tan\theta$:
          $$\frac{d}{\cos\theta} = \frac{s}{\mu}\cdot\tan\theta - s$$
          זה קו ישר עם $y = d/\cos\theta$ ו-$x = \tan\theta$. השיפוע $\dfrac{s}{\mu}$, ונקודת החיתוך $b = -s$.
      - kind: substitution
        text: >-
          מחשבים: $\tan\theta = 0.84,\ 1.00,\ 1.19,\ 1.43,\ 1.73,\ 2.75$, ו-$d/\cos\theta = 0.23,\ 0.52,\ 0.86,\ 1.27,\ 1.72,\ 3.45$ (ב-$\text{m}$).
          על הקו המתאים ביותר, בתוך תחום המדידות, קוראים $0.355\,\text{m}$ ב-$\tan\theta = 0.90$, ו-$3.37\,\text{m}$ ב-$\tan\theta = 2.70$:
          $$\frac{\Delta y}{\Delta x} = \frac{3.37\ \text{m} - 0.355\ \text{m}}{2.70 - 0.90} \approx 1.68\ \text{m}$$
      - kind: substitution
        text: >-
          נקודת החיתוך: $b = 0.355\,\text{m} - 1.675\,\text{m}\cdot 0.90 \approx -1.15\,\text{m}$, ולכן $s \approx 1.15\,\text{m}$. ומהשיפוע:
          $$\mu = \frac{s}{1.675\ \text{m}} = \frac{1.15\ \text{m}}{1.675\ \text{m}} \approx 0.69$$
      - kind: reasoning
        text: >-
          בדיקה: הגוף מאיץ במורד הקרש רק כאשר $\tan\theta$ גדול מ-$\mu$, כלומר בזוויות שמעל כ-$35^\circ$. כל הזוויות בטבלה גדולות מזה. וכמו בכל ליניאריזציה, הקו הישר מראה שהמודל מתאים למדידות, לא שהוא מוכח.
      - kind: result
        text: >-
          גרף של $d/\cos\theta$ מול $\tan\theta$ הוא קו ישר. ממנו $s \approx 1.15\,\text{m}$ ו-$\mu \approx 0.69$.
    source:
      name: Australian Science Olympiad Exam (ASOE), Physics
      year: 2025
      problem: 'Question 2d'
      url: https://asi.edu.au/wp-content/uploads/2026/06/2025_ASO_Physics_Exam.pdf
      verified: '2026-11-01'
      adapted: true
