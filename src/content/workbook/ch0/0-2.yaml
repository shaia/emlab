# Workbook for lesson 0.2: ten practice problems and two sourced challenge problems.
# Every number recomputed with src/physics/vec.ts (add, sub, scale, len, angle).

lesson: '0.2'
practice:
  - id: W-0.2-01
    level: basic
    qualitative: true
    objectives: [OBJ-0.2-1]
    prompt: >-
      אצנית מקיפה פעם אחת מסלול ריצה סגור שאורכו $400\,\text{m}$, ומסיימת בדיוק בנקודת הזינוק.
      מה הדרך שהיא עברה, ומה ההעתק שלה? איזה מהשניים הוא סקלר, ואיזה וקטור?
    answer: >-
      הדרך היא $400\,\text{m}$ והיא סקלר. ההעתק הוא אפס, והוא וקטור.
    solution:
      - kind: reasoning
        text: >-
          הדרך היא האורך שהאצנית עברה לאורך המסלול: מספר עם יחידות, בלי כיוון. לכן היא סקלר, $400\,\text{m}$.
      - kind: reasoning
        text: >-
          ההעתק הוא החץ מנקודת ההתחלה לנקודת הסיום. יש לו גודל וכיוון, ולכן הוא וקטור.
          כאן ההתחלה והסיום הן אותה נקודה, ולכן אורך החץ אפס.
      - kind: result
        text: >-
          הדרך $400\,\text{m}$ (סקלר), וההעתק אפס (וקטור). הדרך אף פעם לא קצרה מגודל ההעתק, אבל היא יכולה להיות ארוכה ממנו בהרבה.

  - id: W-0.2-02
    level: basic
    qualitative: false
    objectives: [OBJ-0.2-1]
    prompt: >-
      רחפן טס $8\,\text{m}$ מזרחה ואחר כך $6\,\text{m}$ צפונה. מה גודל ההעתק שלו, ובאיזו זווית הוא נוטה מכיוון מזרח לכיוון צפון?
    answer: >-
      $10\,\text{m}$, בזווית של כ-$37^\circ$ מכיוון מזרח לכיוון צפון
    solution:
      - kind: given
        text: >-
          ציר x מזרחה וציר y צפונה. רכיבי ההעתק: $\Delta x = 8\,\text{m}$ ו-$\Delta y = 6\,\text{m}$.
      - kind: formula
        text: >-
          $|\Delta\vec r| = \sqrt{\Delta x^2 + \Delta y^2}$ ו-$\tan\theta = \Delta y / \Delta x$.
      - kind: substitution
        text: >-
          $|\Delta\vec r| = \sqrt{8^2 + 6^2} = \sqrt{100} = 10\,\text{m}$, ו-$\tan\theta = 6/8 = 0.75$, ולכן $\theta \approx 37^\circ$.
      - kind: result
        text: >-
          ההעתק הוא $10\,\text{m}$, בזווית של כ-$37^\circ$ מכיוון מזרח לכיוון צפון. לא $14\,\text{m}$: את הרכיבים לא מחברים כמו מספרים.

  - id: W-0.2-03
    level: basic
    qualitative: false
    objectives: [OBJ-0.2-2, OBJ-0.2-1]
    prompt: >-
      שומר הולך במסדרון ישר: $7\,\text{m}$ קדימה, אחר כך $10\,\text{m}$ אחורה, ולבסוף $4\,\text{m}$ קדימה.
      מה ההעתק שלו (גודל וכיוון), ומה הדרך שעבר?
    answer: >-
      ההעתק $1\,\text{m}$ קדימה, והדרך $21\,\text{m}$
    solution:
      - kind: given
        text: >-
          בוחרים את הכיוון קדימה כחיובי. שלושת ההעתקים הם $+7$, $(-10)$ ו-$+4$ מטרים.
      - kind: formula
        text: >-
          על קו אחד מחברים את ההעתקים עם הסימנים שלהם. את הדרך מחברים בלי סימנים, כי היא סקלר שאינו שלילי.
      - kind: substitution
        text: >-
          העתק: $7 + (-10) + 4 = +1\,\text{m}$. דרך: $7 + 10 + 4 = 21\,\text{m}$.
      - kind: result
        text: >-
          השומר נמצא $1\,\text{m}$ לפני נקודת ההתחלה, כלומר ההעתק הוא $1\,\text{m}$ קדימה. הדרך שעבר היא $21\,\text{m}$.

  - id: W-0.2-04
    level: mid
    qualitative: false
    objectives: [OBJ-0.2-3, OBJ-0.2-1]
    prompt: >-
      נתון הווקטור $\vec A = (4, -2)\,\text{N}$. מצאו את הרכיבים ואת הגודל של הווקטור $\vec B = -1.5\,\vec A$.
      פי כמה $\vec B$ ארוך מ-$\vec A$, ולאיזה כיוון הוא מצביע ביחס ל-$\vec A$?
    answer: >-
      $\vec B = (-6, 3)\,\text{N}$, וגודלו כ-$6.7\,\text{N}$: פי 1.5 מ-$\vec A$, בכיוון ההפוך
    solution:
      - kind: formula
        text: >-
          כפל במספר מכפיל כל רכיב באותו מספר: $k\vec A = (kA_x,\ kA_y)$. הגודל מוכפל ב-$|k|$.
      - kind: substitution
        text: >-
          $\vec B = (-1.5 \cdot 4,\ -1.5 \cdot (-2)) = (-6, 3)\,\text{N}$.
      - kind: substitution
        text: >-
          $|\vec A| = \sqrt{4^2 + 2^2} = \sqrt{20} \approx 4.47\,\text{N}$, ו-$|\vec B| = \sqrt{6^2 + 3^2} = \sqrt{45} \approx 6.71\,\text{N}$.
      - kind: reasoning
        text: >-
          בדיקה: $1.5 \cdot 4.47 \approx 6.71$. הסימנים של שני הרכיבים התהפכו, ולכן $\vec B$ מצביע הפוך ל-$\vec A$.
      - kind: result
        text: >-
          $\vec B = (-6, 3)\,\text{N}$, וגודלו כ-$6.7\,\text{N}$. הוא ארוך פי 1.5 מ-$\vec A$ ומצביע בכיוון ההפוך. הגודל חיובי למרות המינוס.

  - id: W-0.2-05
    level: mid
    qualitative: true
    objectives: [OBJ-0.2-4, OBJ-0.2-3]
    prompt: >-
      מצלמה תלויה גבוה מעל מנחת מסוקים ומצלמת מסוק ישר מלמעלה. התמונה שלה היא הדף.

      (א) המסוק עולה. איך מסמנים בתמונה את המהירות שלו?

      (ב) מאוחר יותר המסוק יורד, באותה מהירות בגודלה. כתבו את המהירות בירידה, $\vec v_2$, בעזרת המהירות בעלייה, $\vec v_1$, וציינו איך מסמנים אותה בתמונה.

      (ג) איך מסמנים בתמונה את כוח הכובד על המסוק, בעלייה ובירידה?
    answer: >-
      (א) ⊙.

      (ב) $\vec v_2 = -\vec v_1$, ⊗.

      (ג) ⊗ בשני המקרים.
    solution:
      - kind: reasoning
        text: >-
          המצלמה, כלומר העין, נמצאת למעלה. למעלה פירושו אל המצלמה, החוצה מהדף. למטה פירושו הרחק ממנה, לתוך הדף.
      - kind: reasoning
        text: >-
          (א) בעלייה המסוק מתקרב למצלמה: רואים את החוד של חץ המהירות, ⊙.
      - kind: reasoning
        text: >-
          (ב) אותו גודל וכיוון הפוך פירושו כפל ב-$(-1)$: $\vec v_2 = -\vec v_1$. ההפך של ⊙ הוא ⊗.
      - kind: reasoning
        text: >-
          (ג) כוח הכובד פונה תמיד אל הקרקע, הרחק מהמצלמה, בלי קשר לכיוון התנועה: ⊗.
      - kind: result
        text: >-
          (א) ⊙.

          (ב) $\vec v_2 = -\vec v_1$, ומסמנים ⊗.

          (ג) ⊗, גם בעלייה וגם בירידה. הכיוון של כוח לא נקבע לפי כיוון התנועה.

  - id: W-0.2-06
    level: mid
    qualitative: false
    objectives: [OBJ-0.2-2, OBJ-0.2-1]
    prompt: >-
      על גוף פועלים שני כוחות ניצבים: $7\,\text{N}$ מזרחה, וכוח לא ידוע צפונה. גודל הכוח השקול הוא $25\,\text{N}$.
      מה גודל הכוח הלא ידוע, ובאיזו זווית מכיוון מזרח פועל הכוח השקול?
    answer: >-
      $24\,\text{N}$ צפונה. הכוח השקול נוטה כ-$74^\circ$ מכיוון מזרח לכיוון צפון.
    solution:
      - kind: given
        text: >-
          $F_1 = 7\,\text{N}$ (מזרחה), $F = 25\,\text{N}$ (הכוח השקול). הכוחות מאונכים זה לזה, ולכן הם שני הניצבים במשולש ישר-זווית שהכוח השקול הוא היתר שלו.
      - kind: formula
        text: >-
          $F^2 = F_1^2 + F_2^2$, ולכן $F_2 = \sqrt{F^2 - F_1^2}$. לזווית: $\tan\theta = F_2 / F_1$.
      - kind: substitution
        text: >-
          $F_2 = \sqrt{25^2 - 7^2} = \sqrt{625 - 49} = \sqrt{576} = 24\,\text{N}$.
      - kind: substitution
        text: >-
          $\tan\theta = 24/7 \approx 3.43$, ולכן $\theta \approx 74^\circ$.
      - kind: result
        text: >-
          הכוח הלא ידוע הוא $24\,\text{N}$, צפונה. הכוח השקול נוטה כ-$74^\circ$ מכיוון מזרח לכיוון צפון, קרוב לצפון, כי הרכיב הצפוני גדול בהרבה.

  - id: W-0.2-07
    level: mid
    qualitative: true
    objectives: [OBJ-0.2-2, OBJ-0.2-1]
    prompt: >-
      על גוף פועלים שלושה כוחות, שגודלם $3\,\text{N}$, $4\,\text{N}$ ו-$8\,\text{N}$, וכיווניהם יכולים להיות כל כיוון במישור.

      (א) האם הכוח השקול יכול להיות אפס? קבעו ונמקו.

      (ב) מה הגודל הקטן ביותר שהכוח השקול יכול לקבל, ובאיזה סידור?
    answer: >-
      (א) לא.

      (ב) $1\,\text{N}$, כששני הכוחות הקטנים פונים יחד הפוך לכוח הגדול.
    solution:
      - kind: reasoning
        text: >-
          כדי שהכוח השקול יהיה אפס, הסכום של שני הכוחות הקטנים צריך לבטל את הכוח של $8\,\text{N}$, ולכן גודלו צריך להיות בדיוק $8\,\text{N}$.
      - kind: reasoning
        text: >-
          אבל גודל הסכום של $3\,\text{N}$ ו-$4\,\text{N}$ הוא לכל היותר $3 + 4 = 7\,\text{N}$, כשהם באותו כיוון. בכל סידור אחר הוא קטן יותר.
      - kind: reasoning
        text: >-
          (ב) הכי קרוב לביטול מגיעים כששני הכוחות הקטנים באותו כיוון, הפוך לכוח הגדול: $8 + (-3) + (-4) = 1\,\text{N}$.
      - kind: result
        text: >-
          (א) לא: שני הכוחות הקטנים יחד נותנים לכל היותר $7\,\text{N}$, פחות מ-$8\,\text{N}$.

          (ב) הכוח השקול הקטן ביותר הוא $1\,\text{N}$, בכיוון של הכוח הגדול.

  - id: W-0.2-08
    level: bagrut
    qualitative: false
    objectives: [OBJ-0.2-1, OBJ-0.2-2, OBJ-0.2-3]
    prompt: >-
      מטיילת הולכת $6\,\text{km}$ מזרחה, ואחר כך $10\,\text{km}$ בכיוון שנוטה $53^\circ$ מכיוון מערב לכיוון צפון.
      ($\cos 53^\circ \approx 0.6$, $\sin 53^\circ \approx 0.8$)

      (א) מצאו את ההעתק הכולל שלה: גודל וכיוון.

      (ב) מה ההעתק שעליה לעבור כדי לחזור בקו ישר לנקודת ההתחלה?

      (ג) השוו את הדרך שעברה לגודל ההעתק.
    answer: >-
      (א) $8\,\text{km}$ צפונה.

      (ב) $8\,\text{km}$ דרומה.

      (ג) הדרך $16\,\text{km}$, פי 2 מגודל ההעתק.
    solution:
      - kind: given
        text: >-
          ציר x מזרחה וציר y צפונה. הקטע הראשון: $(6, 0)\,\text{km}$. בקטע השני הרכיב לאורך x שלילי (מערבה) והרכיב לאורך y חיובי (צפונה).
      - kind: formula
        text: >-
          רכיבי הקטע השני: $\Delta x_2 = -10\cos 53^\circ$ ו-$\Delta y_2 = 10\sin 53^\circ$. ההעתק הכולל הוא סכום הרכיבים.
      - kind: substitution
        text: >-
          $\Delta x_2 = -10 \cdot 0.6 = -6\,\text{km}$ ו-$\Delta y_2 = 10 \cdot 0.8 = 8\,\text{km}$.
          סכום: $(6 + (-6),\ 0 + 8) = (0, 8)\,\text{km}$.
      - kind: reasoning
        text: >-
          (ב) כדי לחזור צריך העתק שמבטל את ההעתק הכולל: אותו גודל, כיוון הפוך, כלומר $(-1) \cdot (0, 8) = (0, -8)\,\text{km}$.
      - kind: reasoning
        text: >-
          (ג) הדרך היא סכום אורכי הקטעים: $6 + 10 = 16\,\text{km}$.
      - kind: result
        text: >-
          (א) ההעתק הכולל הוא $8\,\text{km}$ צפונה: רכיבי מזרח-מערב התבטלו.

          (ב) $8\,\text{km}$ דרומה.

          (ג) הדרך, $16\,\text{km}$, ארוכה פי 2 מגודל ההעתק.

  - id: W-0.2-09
    level: bagrut
    qualitative: false
    objectives: [OBJ-0.2-1, OBJ-0.2-2]
    prompt: >-
      מנורה שמשקלה $60\,\text{N}$ תלויה במנוחה על שני חוטים זהים. כל חוט נוטה $30^\circ$ מהקו האנכי, אחד ימינה ואחד שמאלה.
      ($\cos 30^\circ \approx 0.87$, $\cos 60^\circ = 0.5$)

      (א) מה גודל הכוח שכל חוט מפעיל על המנורה?

      (ב) מה משתנה אם מרחיקים את נקודות התלייה זו מזו, עד שכל חוט נוטה $60^\circ$ מהקו האנכי?
    answer: >-
      (א) כ-$35\,\text{N}$ בכל חוט.

      (ב) הכוח בכל חוט גדל ל-$60\,\text{N}$, כמו המשקל כולו.
    solution:
      - kind: given
        text: >-
          ציר y למעלה וציר x ימינה. כוח הכובד $(0, -60)\,\text{N}$. לשני החוטים אותו גודל $T$, כי הסידור סימטרי.
      - kind: reasoning
        text: >-
          רכיבי ה-x של שני החוטים שווים בגודלם והפוכים בכיוונם, ולכן מתבטלים. המנורה במנוחה, ולכן רכיבי ה-y של החוטים יחד מבטלים את המשקל.
      - kind: formula
        text: >-
          רכיב ה-y של כל חוט הוא $T\cos\beta$, כאשר $\beta$ היא הזווית מהקו האנכי. לכן $2T\cos\beta = 60\,\text{N}$, כלומר $T = \dfrac{60\,\text{N}}{2\cos\beta}$.
      - kind: substitution
        text: >-
          (א) $T = \dfrac{60}{2 \cdot 0.87} \approx 34.5\,\text{N}$, כלומר כ-$35\,\text{N}$.

          (ב) $T = \dfrac{60}{2 \cdot 0.5} = 60\,\text{N}$.
      - kind: result
        text: >-
          (א) כל חוט מושך בכוח של כ-$35\,\text{N}$, יותר מחצי המשקל, כי רק הרכיב האנכי שלו מחזיק את המנורה.

          (ב) הכוח בכל חוט גדל ל-$60\,\text{N}$: ככל שהחוטים נוטים יותר הצידה, הרכיב האנכי של כל אחד קטן, וכל חוט צריך למשוך חזק יותר.

  - id: W-0.2-10
    level: bagrut
    qualitative: false
    objectives: [OBJ-0.2-2, OBJ-0.2-3, OBJ-0.2-1]
    prompt: >-
      על גוף פועלים שלושה כוחות במישור. $\vec F_1$ הוא $10\,\text{N}$ בזווית של $53^\circ$ מעל ציר x החיובי, ו-$\vec F_2$ הוא $4\,\text{N}$ בכיוון x השלילי.
      ($\cos 53^\circ \approx 0.6$, $\sin 53^\circ \approx 0.8$)
      מצאו את הכוח השלישי, $\vec F_3$ (רכיבים, גודל וכיוון), כך שהכוח השקול יהיה $10\,\text{N}$ בכיוון x החיובי.
    answer: >-
      $\vec F_3 = (8, -8)\,\text{N}$: כ-$11.3\,\text{N}$, בזווית של $45^\circ$ מתחת לציר x החיובי
    solution:
      - kind: given
        text: >-
          $\vec F_1 = (10 \cdot 0.6,\ 10 \cdot 0.8) = (6, 8)\,\text{N}$, $\vec F_2 = (-4, 0)\,\text{N}$, והכוח השקול הרצוי $\vec R = (10, 0)\,\text{N}$.
      - kind: formula
        text: >-
          $\vec F_1 + \vec F_2 + \vec F_3 = \vec R$, ולכן $\vec F_3 = \vec R + (-1)\vec F_1 + (-1)\vec F_2$.
      - kind: substitution
        text: >-
          $F_{3x} = 10 - 6 - (-4) = 8\,\text{N}$, ו-$F_{3y} = 0 - 8 - 0 = -8\,\text{N}$.
      - kind: substitution
        text: >-
          $|\vec F_3| = \sqrt{8^2 + 8^2} \approx 11.3\,\text{N}$. הרכיבים שווים בגודלם, ולכן הזווית $45^\circ$. רכיב ה-y שלילי, ולכן מתחת לציר x.
      - kind: result
        text: >-
          $\vec F_3 = (8, -8)\,\text{N}$: כ-$11.3\,\text{N}$, ימינה ולמטה, בזווית של $45^\circ$ מתחת לציר x החיובי. בדיקה: $(6, 8) + (-4, 0) + (8, -8) = (10, 0)$.

challenge:
  - id: W-0.2-c1
    stars: 1
    objectives: [OBJ-0.2-1, OBJ-0.2-2]
    prompt: >-
      רוחב נהר הוא $60\,\text{m}$, והמים בו זורמים במהירות $3\,\text{m/s}$ במקביל לגדות. סירת מנוע יוצאת מגדה אחת,
      וצריכה להגיע לנקודה שנמצאת בדיוק מולה בגדה השנייה, תוך $15\,\text{s}$, בתנועה בקו ישר.
      המהירות של הסירה ביחס לגדה היא הסכום הווקטורי של המהירות שלה ביחס למים ושל מהירות המים.

      (א) באיזו מהירות, ביחס למים, צריכה הסירה לשוט, ולאיזה כיוון יש לכוון אותה?

      (ב) האם סירה שהמהירות המרבית שלה ביחס למים היא $2.5\,\text{m/s}$ יכולה להגיע לנקודה שמולה, בזמן כלשהו? נמקו.
    answer: >-
      (א) $5\,\text{m/s}$, מכוונת נגד הזרם בזווית של כ-$53^\circ$ לגדה (כ-$37^\circ$ מהכיוון הניצב לגדה).

      (ב) לא.
    solution:
      - kind: given
        text: >-
          ציר x לאורך הגדה, בכיוון הזרם, וציר y ניצב לגדה, אל הגדה השנייה. מהירות המים $\vec u = (3, 0)\,\text{m/s}$.
      - kind: reasoning
        text: >-
          כדי לנוע בקו ישר אל הנקודה שמולה, המהירות ביחס לגדה צריכה להיות ניצבת לגדה: $\vec V = (0,\ 60/15) = (0, 4)\,\text{m/s}$.
      - kind: formula
        text: >-
          $\vec V = \vec v + \vec u$, ולכן המהירות ביחס למים היא $\vec v = \vec V + (-1)\vec u$.
      - kind: substitution
        text: >-
          $\vec v = (0 - 3,\ 4 - 0) = (-3, 4)\,\text{m/s}$, ו-$|\vec v| = \sqrt{3^2 + 4^2} = 5\,\text{m/s}$.
      - kind: reasoning
        text: >-
          הרכיב לאורך הגדה שלילי, כלומר נגד הזרם. הזווית לגדה: $\tan\theta = 4/3$, ולכן $\theta \approx 53^\circ$, ומהכיוון הניצב לגדה $90^\circ - 53^\circ = 37^\circ$.
      - kind: reasoning
        text: >-
          (ב) כדי לא להיסחף, הרכיב נגד הזרם של מהירות הסירה ביחס למים חייב להיות $3\,\text{m/s}$. אבל רכיב אף פעם אינו גדול מגודל הווקטור, ו-$2.5\,\text{m/s}$ קטן מ-$3\,\text{m/s}$.
      - kind: result
        text: >-
          (א) $5\,\text{m/s}$ ביחס למים, מכוונת נגד הזרם בזווית של כ-$53^\circ$ לגדה.

          (ב) לא: בכל כיוון שמכוונים אותה, הזרם יסחוף אותה במורד הנהר.
    source:
      name: Oxford Physics Aptitude Test (PAT)
      year: 2016
      problem: 'Section B, Q15'
      url: https://www.physics.ox.ac.uk/system/files/file_attachments/pat-2016.pdf
      verified: '2026-11-01'
      adapted: true

  - id: W-0.2-c2
    stars: 1
    objectives: [OBJ-0.2-1, OBJ-0.2-2]
    prompt: >-
      במגרש רוגבי ציר x פונה מזרחה וציר y צפונה. שחקנית א תופסת את הכדור בראשית הצירים ורצה במהירות קבועה שרכיביה $(3, 4)\,\text{m/s}$.
      באותו רגע שחקנית ב, שעומדת $21\,\text{m}$ מזרחית לראשית, מתחילה לרוץ בקו ישר במהירות שגודלה $8.5\,\text{m/s}$,
      בכיוון שנבחר כך שתפגוש את שחקנית א.

      (א) מה גודל המהירות של שחקנית א?

      (ב) כעבור כמה זמן הן נפגשות?

      (ג) מה ההעתק של שחקנית א עד המפגש, ובאיזה כיוון רצה שחקנית ב?
    answer: >-
      (א) $5\,\text{m/s}$.

      (ב) $2\,\text{s}$.

      (ג) $10\,\text{m}$ בזווית של כ-$53^\circ$ מכיוון מזרח לכיוון צפון; שחקנית ב רצה בזווית של כ-$28^\circ$ מכיוון מערב לכיוון צפון.
    solution:
      - kind: substitution
        text: >-
          (א) $|\vec v_A| = \sqrt{3^2 + 4^2} = 5\,\text{m/s}$.
      - kind: given
        text: >-
          אחרי זמן $t$ שחקנית א נמצאת בנקודה $(3t, 4t)$. שחקנית ב יוצאת מהנקודה $(21, 0)$, ולכן ההעתק שלה עד המפגש הוא $(3t - 21,\ 4t)$.
      - kind: formula
        text: >-
          גודל ההעתק של שחקנית ב שווה לדרך שהיא עוברת בקו ישר, $8.5t$: $(3t - 21)^2 + (4t)^2 = (8.5t)^2$.
      - kind: manipulation
        text: >-
          פותחים סוגריים: $9t^2 - 126t + 441 + 16t^2 = 72.25t^2$, כלומר $47.25t^2 + 126t - 441 = 0$. מחלקים את כל המשוואה ב-$15.75$ ומקבלים $3t^2 + 8t - 28 = 0$.
      - kind: substitution
        text: >-
          $t = \dfrac{-8 \pm \sqrt{64 + 336}}{6} = \dfrac{-8 \pm 20}{6}$. הפתרון החיובי הוא $t = 2\,\text{s}$ (הפתרון השני שלילי, ואין לו משמעות כאן).
      - kind: substitution
        text: >-
          (ג) ההעתק של שחקנית א: $(6, 8)\,\text{m}$, שגודלו $\sqrt{36 + 64} = 10\,\text{m}$, ו-$\tan\theta = 8/6$, כלומר $\theta \approx 53^\circ$.
          ההעתק של שחקנית ב: $(6 - 21,\ 8) = (-15, 8)\,\text{m}$, שגודלו $17\,\text{m}$ (בדיקה: $17/2 = 8.5\,\text{m/s}$), ו-$\tan\varphi = 8/15$, כלומר $\varphi \approx 28^\circ$.
      - kind: result
        text: >-
          (א) $5\,\text{m/s}$.

          (ב) הן נפגשות כעבור $2\,\text{s}$.

          (ג) שחקנית א עברה $10\,\text{m}$, בזווית של כ-$53^\circ$ מכיוון מזרח לכיוון צפון. שחקנית ב רצה $17\,\text{m}$, בזווית של כ-$28^\circ$ מכיוון מערב לכיוון צפון.
    source:
      name: British Physics Olympiad (BPhO) Round 1
      year: 2020
      problem: 'Section 1, Question 1(d)'
      url: https://www.bpho.org.uk/Papers/R1/2020Nov_R1_S1.pdf
      verified: '2026-11-01'
      adapted: true
