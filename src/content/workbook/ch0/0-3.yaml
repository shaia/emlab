  - id: W-0.3-c2
    stars: 2
    objectives: [OBJ-0.3-4]
    prompt: >-
      גלגל תנופה הוא דסקה מסתובבת שאוגרת אנרגיה קינטית. הדסקה עשויה מחומר שהצפיפות שלו $\rho$, ב-$\text{kg/m}^3$.
      החומר נקרע כשהכוח שמותח כל מטר רבוע של חתך עולה על $\sigma$, ולכן $\sigma$ נמדד ב-$\text{N/m}^2$.
      רדיוס הדסקה $r$ ועוביה $h$. כשהדסקה מסתובבת מהר מדי, היא נקרעת.
      מחפשים את האנרגיה הקינטית המרבית שאפשר לאגור בכל קילוגרם של דסקה, $E/m$. המספר $\alpha$ הוא בלי יחידות.

      (א) אילו מהביטויים הבאים יכולים להיות נכונים לפי היחידות?

      (1) $\alpha\rho\sigma/r$ (2) $\alpha h\rho\sigma/r$ (3) $\alpha(h/r)(\sigma/\rho)^2$ (4) $\alpha(h/r)(\sigma/\rho)$ (5) $\alpha\sigma/\rho$

      (ב) היחידות לבדן לא מכריעות בין שני ביטויים. הכריעו ביניהם בעזרת ניסוי מחשבתי:
      מניחים שתי דסקאות זהות זו על זו, ומדביקים אותן לדסקה אחת שעוביה $2h$.
    answer: 'לפי היחידות רק (4) ו-(5) אפשריים; הניסוי המחשבתי פוסל את (4), ולכן $E/m = \alpha\sigma/\rho$.'
    solution:
      - { kind: given, text: 'אנרגיה לקילוגרם נמדדת ב-$\text{J/kg} = \dfrac{\text{kg}\cdot\text{m}^2/\text{s}^2}{\text{kg}} = \text{m}^2/\text{s}^2$. וגם $\sigma$: $\text{N/m}^2 = \dfrac{\text{kg}}{\text{m}\cdot\text{s}^2}$.' }
      - { kind: reasoning, text: 'היחידות של $\sigma/\rho$: $\dfrac{\text{kg}}{\text{m}\cdot\text{s}^2}\cdot\dfrac{\text{m}^3}{\text{kg}} = \dfrac{\text{m}^2}{\text{s}^2}$, בדיוק יחידות של אנרגיה לקילוגרם. ל-$h/r$ אין יחידות, כי זה מטר חלקי מטר.' }
      - { kind: reasoning, text: 'לכן (4) ו-(5) נותנים $\text{m}^2/\text{s}^2$. (3) נותן $\text{m}^4/\text{s}^4$. (1) נותן $\dfrac{\text{kg}^2}{\text{m}^5\cdot\text{s}^2}$, ו-(2) נותן $\dfrac{\text{kg}^2}{\text{m}^4\cdot\text{s}^2}$. שלושתם נפסלים.' }
      - { kind: reasoning, text: '(ב) בדסקה המודבקת כל שכבה מסתובבת בדיוק כמו דסקה בודדת, ונקרעת באותה מהירות סיבוב. לכן כל קילוגרם בה אוגר אותה אנרגיה כמו קודם: $E/m$ לא תלוי בעובי $h$.' }
      - { kind: reasoning, text: 'ביטוי (4) גדל פי 2 כשהעובי גדל פי 2, ולכן הוא נפסל. ביטוי (5) לא תלוי ב-$h$, ונשאר.' }
      - { kind: result, text: '$E/m = \alpha\sigma/\rho$: חומר חזק וקל אוגר יותר אנרגיה בכל קילוגרם. היחידות צמצמו חמישה ביטויים לשניים, והפיזיקה הכריעה ביניהם.' }
