# Lesson 5.1 misconceptions (magnetic flux). Each is detected by a tagged distractor in questions/ch5/5-1.yaml.
# The electric-flux ones of lesson 1.7 (MC-flux-*) are their electric twins; these are for the magnetic case.

- id: MC-magflux-ignores-tilt
  title: השטף המגנטי הוא תמיד השדה כפול השטח
  belief: אם השדה והשטח לא השתנו, גם השטף לא השתנה, גם אם הלולאה הוטתה.
  truth: 'השטף הוא Φ = BA·cosθ. כשמטים את הלולאה, פחות קווים עוברים דרכה: ב-60° חצי מהם, וב-90° אף אחד, אף שהשדה והשטח לא השתנו.'
  remedy: { lesson: '5.1', anchor: fig-5-1a, label: 'איור 5.1א: הטו את הלולאה, וספרו את הקווים שעוברים דרכה במבט לאורך השדה' }

- id: MC-magflux-angle-from-plane
  title: הזווית בנוסחה היא בין השדה למישור הלולאה
  belief: 'בנוסחה Φ = BA·cosθ מציבים את הזווית בין קווי השדה למישור הלולאה.'
  truth: 'θ היא הזווית בין השדה לאנך ללולאה. אם נתונה הזווית α בין השדה למישור, אז θ = 90° − α, והשטף BA·sinα. כשהשדה במישור הלולאה (α = 0) השטף אפס.'
  remedy: { lesson: '5.1', anchor: fig-5-1a, label: 'איור 5.1א: האנך n והזווית θ מסומנים במבט מהצד' }

- id: MC-magflux-zero-means-no-field
  title: שטף אפס פירושו שאין שדה
  belief: אם השטף דרך לולאה הוא אפס, אין שם שדה מגנטי.
  truth: שטף אפס אומר רק שנטו אין קווים שעוברים דרך הלולאה. השדה יכול להיות חזק ומקביל למישור שלה, או לעבור בחלק אחד שלה בכיוון אחד ובחלק אחר בכיוון ההפוך.
  remedy: { lesson: '5.1', anchor: fig-5-1a, label: 'איור 5.1א: ב-θ = 90° השדה חזק כמו קודם, ואף קו לא עובר דרך הלולאה' }

- id: MC-magflux-sign-fixed
  title: לשטף אין סימן, ולכן היפוך הלולאה לא משנה אותו
  belief: שטף הוא כמות חיובית. לולאה שמסתובבת חצי סיבוב חוזרת לאותו שטף, ולכן השטף לא השתנה.
  truth: 'השטף נמדד ביחס לאנך שבחרנו. אחרי חצי סיבוב הקווים עוברים דרך הלולאה מהצד השני, והשטף מתהפך מ-BA ל-−BA: השינוי הוא 2BA, לא אפס.'
  remedy: { lesson: '5.1', anchor: fig-5-1a, label: 'איור 5.1א: הטו את הלולאה ל-180°, או הפכו את האנך' }

- id: MC-magflux-motion-changes-flux
  title: כל תנועה של לולאה בשדה משנה את השטף
  belief: לולאה שזזה בתוך שדה מגנטי אחיד, גם בלי להסתובב, משנה את השטף שעובר דרכה.
  truth: בשדה אחיד, הזזה של לולאה בלי סיבוב ובלי שינוי צורה משאירה את השטף כפי שהיה. השטף משתנה רק אם משתנים B, השטח שבתוך השדה או הזווית.
  remedy: { lesson: '5.1', anchor: ex-5-1-2, label: 'דוגמה 5.1.2: שלוש הדרכים לשנות שטף' }

- id: MC-magflux-equal-areas-equal-flux
  title: בשדה לא אחיד, שטחים שווים מקבלים שטף שווה
  belief: 'ליד תיל, השטף דרך מלבן הוא השדה באמצע המלבן כפול השטח, ושני חצאים שווים של המלבן מקבלים שטף שווה.'
  truth: 'השדה של תיל חלש ככל שמתרחקים, B ∝ 1/r. החצי הקרוב לתיל מקבל יותר שטף מהחצי הרחוק, ואת השטף מוצאים בסכום על רצועות דקות. "השדה באמצע כפול השטח" הוא רק הערכה, וליד תיל היא קטנה מהערך האמיתי.'
  remedy: { lesson: '5.1', anchor: fig-5-1b, label: 'איור 5.1ב: הוסיפו רצועות, והשוו את הסכום לערך המדויק' }

- id: MC-magflux-pole-like-charge
  title: קוטב מגנטי הוא מקור של שטף, כמו מטען
  belief: 'מהקוטב הצפוני קווים רק יוצאים, ולכן השטף דרך משטח סגור שמקיף אותו חיובי, כמו השטף החשמלי דרך משטח שמקיף מטען חיובי.'
  truth: 'קווי השדה המגנטי סגורים: הקווים שיוצאים מהקוטב הצפוני חוזרים דרך גוף המגנט. לכן כל קו שיוצא ממשטח סגור גם נכנס אליו, והשטף המגנטי דרך כל משטח סגור הוא אפס. אין קוטב מגנטי בודד שהיה יכול לשמש מקור.'
  remedy: { lesson: '5.1', anchor: fig-5-1c, label: 'איור 5.1ג: הקיפו את הקוטב הצפוני בעיגול, וספרו קווים שיוצאים ונכנסים' }

- id: MC-magflux-bigger-surface-more-flux
  title: משטח גדול יותר על אותה לולאה מקבל יותר שטף
  belief: 'משטח מעוקל, כמו קערה, ששפתו היא הלולאה, מקבל יותר שטף מהמשטח השטוח של הלולאה, כי השטח שלו גדול יותר.'
  truth: הקערה והמשטח השטוח יוצרים יחד משטח סגור, והשטף דרך משטח סגור הוא אפס. לכן כל קו שעובר דרך הלולאה השטוחה עובר גם דרך הקערה, והשטף דרכם שווה.
  remedy: { lesson: '5.1', anchor: ex-5-1-6, label: 'דוגמה 5.1.6: קובייה בשדה אחיד וקערה על לולאה' }
