# Lesson 6.15 misconceptions. Each is detected by a tagged distractor in questions/ch6/6-15.yaml.

- id: MC-force-type-absolute
  title: אם הכוח מגנטי, הוא מגנטי בכל מערכת ייחוס
  belief: 'השאלה אם כוח הוא חשמלי או מגנטי היא עובדה מוחלטת: הכוח שהתיל מפעיל על מטען נע הוא מגנטי, ולכן במערכת שבה המטען במנוחה אין עליו כוח, והוא לא נדחף.'
  truth: 'שהמטען נדחף לעבר התיל או הרחק ממנו זו עובדה שכל המודדים מסכימים עליה. אבל אם קוראים לדחיפה "חשמלית" או "מגנטית" תלוי במערכת הייחוס: במעבדה הכוח מגנטי, qvB, ובמערכת המנוחה של המטען התיל טעון, והכוח חשמלי, qE′.'
  remedy: { lesson: '6.15', anchor: fig-6-15a, label: 'איור 6.15א: השוו את חץ הכוח בשתי המערכות' }

- id: MC-neutral-in-every-frame
  title: תיל ניטרלי ניטרלי בכל מערכת ייחוס
  belief: 'מטען נשמר, ולכן תיל שניטרלי במעבדה ניטרלי גם במערכת ייחוס שנעה לאורכו.'
  truth: 'המטען של כל יון ושל כל אלקטרון אכן זהה בכל מערכת. אבל הצפיפות הקווית, מטען לכל מטר, תלויה במרווחים, והמרווחים מתכווצים לפי המהירות של כל שורה. במערכת של מטען נע, היונים והאלקטרונים נעים במהירויות שונות, מתכווצים בשיעורים שונים, והתיל טעון. רק כשאין זרם, שתי השורות נעות יחד, והתיל ניטרלי בכל מערכת.'
  remedy: { lesson: '6.15', anchor: fig-6-15a, label: 'איור 6.15א: השוו את המרווחים של היונים ושל האלקטרונים במערכת של q' }

- id: MC-lab-density-is-rest-density
  title: הצפיפות שנמדדת במעבדה היא הצפיפות במנוחה של האלקטרונים
  belief: 'במעבדה צפיפות האלקטרונים היא λ₀, ולכן גם במערכת שבה האלקטרונים במנוחה הצפיפות שלהם λ₀, ורק היונים מתכווצים.'
  truth: 'במעבדה האלקטרונים נעים, ולכן הצפיפות λ₀ שלהם שם כבר מכווצת פי γ. במערכת המנוחה שלהם המרווחים גדולים פי γ, והצפיפות λ₀/γ. לכן הצפיפות הנטו היא λ₀(γ − 1/γ), ולא λ₀(γ − 1).'
  remedy: { lesson: '6.15', anchor: densities, label: 'שיעור 6.15: "המטען של התיל במערכת של q"' }

- id: MC-relativity-too-small
  title: אפקט יחסותי בתיל אמיתי קטן מכדי שיורגש
  belief: 'האלקטרונים בתיל נעים בפחות ממילימטר בשנייה, ולכן כל אפקט של תורת היחסות בתיל זניח לגמרי. המגנטיות לא יכולה לנבוע ממנו.'
  truth: 'היחס λ′/λ₀ באמת זעיר: למטען שנע לאט בהרבה מהאור, 10⁻¹² ופחות. אבל λ₀ עצום, כעשרת אלפים קולון לכל מטר, והכוח החשמלי חזק מאוד. חוסר האיזון הזעיר כפול צפיפות עצומה נותן בדיוק את הכוח המגנטי שמודדים. המגנטיות היא שארית קטנה של כוחות חשמליים עצומים שמבטלים זה את זה כמעט לגמרי.'
  remedy: { lesson: '6.15', anchor: real-wire, label: 'שיעור 6.15: "ובתיל אמיתי?"' }
