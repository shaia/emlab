# Misconceptions of lesson 6.5. Format and rules: see misconceptions/1-5.yaml.

- id: MC-area-vector-direction
  title: 'וקטור השטח מצביע בכיוון השדה, או מונח במשטח'
  belief: 'וקטור השטח dA מצביע לאן שהשדה מצביע, או שהוא מונח במישור המשטח, לאורכו.'
  truth: 'וקטור השטח ניצב למשטח, ובמשטח סגור הוא מצביע החוצה. הוא נקבע לפי המשטח בלבד, והשדה לא משנה אותו. הזווית בין השניים היא מה שקובע את E·dA.'
  remedy: { lesson: '6.5', anchor: fig-6-5a, label: 'איור 6.5א: החצים הכהים על כל פאה, ניצבים לה ופונים החוצה' }

- id: MC-flux-one-point
  title: 'השטף הוא השדה בנקודה אחת כפול השטח'
  belief: 'כדי למצוא את השטף דרך משטח, כופלים את השדה בנקודה אחת עליו (למשל באמצע, או במקום שבו הוא הכי חזק) בשטח כולו.'
  truth: 'זה נכון רק כשהרכיב הניצב של השדה שווה בכל המשטח. אחרת מחלקים את המשטח לחתיכות קטנות ומחברים E·ΔA, ובגבול מקבלים אינטגרל משטח.'
  remedy: { lesson: '6.5', anchor: fig-6-5a, label: 'איור 6.5א: חתיכה אחת בכל פאה, n = 1, נותנת כמעט פי 2 מהשטף האמיתי' }

- id: MC-cube-equal-share-faces
  title: 'כל פאה של הקובייה מקבלת שישית מהשטף'
  belief: 'מטען בתוך קובייה שולח שישית מהשטף דרך כל פאה, בכל מקום שהוא נמצא בה.'
  truth: 'רק כשהמטען במרכז. כשמזיזים אותו אל פאה, השטף דרכה גדל עד כמעט חצי מהשטף הכולל, ודרך הפאה שממול הוא קטן. הסכום נשאר q/ε₀.'
  remedy: { lesson: '6.5', anchor: fig-6-5a, label: 'איור 6.5א: גררו את המטען אל פאה וקראו את השטף דרך כל פאה' }

- id: MC-gauss-caps-carry-flux
  title: 'גם בסיסי גליל גאוס תורמים לשטף'
  belief: 'בגליל גאוס סביב גליל טעון אינסופי, גם דרך שני הבסיסים עובר שטף, E·πr² דרך כל אחד.'
  truth: 'השדה של גליל אינסופי מצביע הרחק מהציר, כלומר מקביל לבסיסים. וקטור השטח של בסיס מצביע לאורך הציר, ניצב לשדה, ולכן E·dA = 0 בכל נקודה בבסיס. כל השטף עובר דרך הדופן.'
  remedy: { lesson: '6.5', anchor: fig-6-5b, label: 'איור 6.5ב, גליל: על הבסיסים החצים הכהים ניצבים לחצים הכתומים' }

- id: MC-rho-times-volume
  title: 'המטען הכלוא הוא הצפיפות ברדיוס r כפול הנפח'
  belief: 'בכדור שהצפיפות בו משתנה, המטען בתוך רדיוס r הוא ρ(r) כפול נפח הכדור, (4/3)πr³.'
  truth: 'הצפיפות שונה בכל קליפה, ולכן צריך לחבר את המטען של הקליפות הדקות, ρ(s)·4πs²·ds, מ-0 עד r. זה האינטגרל ∫ρ dV. רק בצפיפות אחידה הוא שווה ל-ρ·(4/3)πr³.'
  remedy: { lesson: '6.5', anchor: fig-6-5b, label: 'איור 6.5ב: השוו את המטען הכלוא באחידה ובצפיפות ρ ∝ r' }

- id: MC-outside-depends-on-profile
  title: 'מחוץ לגוף השדה תלוי באיך המטען מפוזר בתוכו'
  belief: 'שני כדורים עם אותו מטען כולל יוצרים מחוצה להם שדות שונים, אם המטען מפוזר בהם אחרת (למשל קרוב יותר לפני הכדור).'
  truth: 'כל עוד הצפיפות תלויה רק במרחק מהמרכז, משטח גאוס מחוץ לגוף כולא את כל המטען, והשדה הוא kQ/r² בכל מקרה. ההבדל בין הפרופילים קיים רק בפנים.'
  remedy: { lesson: '6.5', anchor: fig-6-5b, label: 'איור 6.5ב: מחוץ לגוף שלושת הגרפים מתלכדים' }

- id: MC-ball-field-max-at-centre
  title: 'בתוך כדור טעון השדה הכי חזק במרכז'
  belief: 'בתוך כדור טעון השדה הכי חזק במרכז, כי שם המטען "מקיף" את הנקודה מכל הצדדים.'
  truth: 'במרכז השדה אפס: מהסימטריה, כל מטען מתקזז מול המטען שממול. מחוק גאוס E = kQ_in/r², ובכדור אחיד או בכדור שהצפיפות בו גדלה כלפי חוץ, השדה גדל עד פני הכדור.'
  remedy: { lesson: '6.5', anchor: fig-6-5b, label: 'איור 6.5ב: גררו את משטח גאוס מהמרכז החוצה' }
