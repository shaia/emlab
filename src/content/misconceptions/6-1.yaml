# Lesson 6.1 misconceptions. Each is detected by a tagged distractor in questions/ch6/6-1.yaml.

- id: MC-derivative-average-is-instant
  title: 'הקצב הממוצע הוא הקצב ברגע'
  belief: 'המהירות (או הזרם) ברגע מסוים היא השינוי הכולל חלקי הזמן הכולל, למשל x/t, או השינוי על פני קטע ארוך חלקי אורך הקטע.'
  truth: 'Δx/Δt על פני קטע הוא קצב ממוצע: השיפוע של המיתר. כשהקצב משתנה בתוך הקטע, הממוצע שונה מהקצב בכל רגע. הקצב הרגעי הוא הגבול של שיפוע המיתר כשהקטע מתכווץ לאפס: הנגזרת.'
  remedy: { lesson: '6.1', anchor: fig-6-1a, label: 'איור 6.1א: קרבו את Q אל P וראו את שיפוע המיתר משתנה עד שהוא מתייצב' }

- id: MC-derivative-zero-over-zero
  title: 'כשהקטע שואף לאפס, השיפוע הוא אפס חלקי אפס, או אפס'
  belief: 'כש-Δx שואף לאפס גם Δy שואף לאפס, ולכן שיפוע המיתר הופך לאפס חלקי אפס, שאין לו ערך, או שהוא עצמו שואף לאפס.'
  truth: 'Δy ו-Δx קטנים יחד, והיחס ביניהם מתקרב למספר מסוים, שיפוע המשיק. לא מציבים Δx = 0: מצמצמים קודם באלגברה, ורק אז שואלים לאן הביטוי מתקרב. מקרוב, כל גרף חלק נראה כמו קו ישר, והשיפוע שלו לא אפס.'
  remedy: { lesson: '6.1', anchor: fig-6-1a, label: 'איור 6.1א: קרבו את Q עד 0.001, והדליקו את הזכוכית המגדלת' }

- id: MC-derivative-value-not-slope
  title: 'כשהפונקציה גדולה, גם הנגזרת גדולה'
  belief: 'במקום שבו הגרף גבוה, הנגזרת גדולה: הנגזרת של מקום גבוה היא מהירות גדולה, ובמקום שבו הפוטנציאל או המטען הכי גדולים, השדה או הזרם הכי גדולים.'
  truth: 'הנגזרת היא השיפוע של הגרף, לא הגובה שלו. בשיא של גרף השיפוע אפס (sin בנקודה π/2, כדור בשיא הזריקה), וגרף יכול להיות נמוך ותלול מאוד.'
  remedy: { lesson: '6.1', anchor: fig-6-1b, label: 'איור 6.1ב: בגרף של sin, הדליקו את המשיק והזיזו את P לשיא' }

- id: MC-chain-rule-forgotten
  title: 'הנגזרת של sin(ωt) היא cos(ωt)'
  belief: 'כשגוזרים פונקציה של פונקציה, כמו sin(ωt) או e בחזקת −t/τ, גוזרים רק את הפונקציה החיצונית ומשאירים את מה שבפנים כמו שהוא.'
  truth: 'לפי כלל השרשרת כופלים גם בנגזרת של מה שבפנים: הנגזרת של sin(ωt) היא ω·cos(ωt), ושל e בחזקת −t/τ היא −(1/τ) כפול אותה פונקציה. הזווית ωt משתנה פי ω מהר יותר מהזמן, ולכן גם הפונקציה.'
  remedy: { lesson: '6.1', anchor: fig-6-1c, label: 'איור 6.1ג: בגרף של המתנד, השיפוע ב-t = 0 הוא Aω, לא A' }
