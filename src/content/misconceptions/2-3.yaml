# Lesson 2.3 misconceptions. Each is detected by a tagged distractor in questions/ch2/2-3.yaml.

- id: MC-zero-field-zero-potential
  title: היכן שהשדה אפס, גם הפוטנציאל אפס
  belief: בנקודה שבה השדה החשמלי מתאפס, הפוטנציאל חייב להיות אפס.
  truth: השדה קשור לשינוי של הפוטנציאל ממקום למקום (השיפוע), לא לערך שלו. באמצע בין שני מטענים חיוביים שווים השדה אפס והפוטנציאל 2kQ/d. כמו פסגה של גבעה, שבה השיפוע אפס אבל הגובה לא.
  remedy: { lesson: '2.3', anchor: fig-2-3b, label: 'איור 2.3ב: בשני מטענים זהים, גררו את P לאמצע ועקבו אחרי הגרף' }

- id: MC-zero-potential-zero-field
  title: היכן שהפוטנציאל אפס, אין כוח
  belief: בנקודה שבה הפוטנציאל אפס לא פועל כוח על מטען.
  truth: הכוח תלוי בשדה, כלומר בקצב השינוי של הפוטנציאל. באמצע דיפול V = 0, אבל הפוטנציאל משתנה שם מהר, והשדה חזק.
  remedy: { lesson: '2.3', anchor: fig-2-3b, label: 'איור 2.3ב: בדיפול, גררו את P לאמצע וקראו את השדה' }

- id: MC-field-points-to-higher-v
  title: השדה מצביע לכיוון הפוטנציאל הגבוה
  belief: השדה החשמלי מצביע מפוטנציאל נמוך לפוטנציאל גבוה.
  truth: השדה מצביע לכיוון שבו הפוטנציאל יורד. מהלוח החיובי (פוטנציאל גבוה) אל הלוח השלילי (פוטנציאל נמוך).
  remedy: { lesson: '2.3', anchor: fig-2-3b, label: 'איור 2.3ב: בשני לוחות, השוו את כיוון החץ לכיוון הירידה בגרף' }

- id: MC-equipotentials-along-field
  title: קווים שווי פוטנציאל הולכים לאורך קווי השדה
  belief: הקווים שווי הפוטנציאל הם עוד דרך לצייר את קווי השדה, והם מקבילים להם.
  truth: הקווים שווי הפוטנציאל ניצבים לקווי השדה בכל נקודה. לאורך קו שווה פוטנציאל השדה לא עושה עבודה, ולכן אין לו רכיב בכיוון הזה.
  remedy: { lesson: '2.3', anchor: fig-2-3a, label: 'איור 2.3א: הדליקו את קווי השדה ובדקו את הזווית בינם לבין הקווים שווי הפוטנציאל' }

- id: MC-high-potential-strong-field
  title: היכן שהפוטנציאל גבוה, השדה חזק
  belief: עוצמת השדה בנקודה נקבעת לפי גודל הפוטנציאל בה.
  truth: עוצמת השדה נקבעת לפי השיפוע של הפוטנציאל, כלומר כמה מהר הוא משתנה עם המקום (E = ΔV/d). בין שני לוחות השדה זהה בכל מקום, אף שהפוטנציאל משתנה מלוח ללוח.
  remedy: { lesson: '2.3', anchor: fig-2-3b, label: 'איור 2.3ב: בשני לוחות, גררו את P בין הלוחות וקראו את V ואת E' }
