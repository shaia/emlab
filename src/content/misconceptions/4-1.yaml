# Lesson 4.1 misconceptions. Each is detected by a tagged distractor in questions/ch4/4-1.yaml.

- id: MC-poles-are-charges
  title: קטבים מגנטיים הם מטענים חשמליים
  belief: הקוטב הצפוני של מגנט טעון חיובית והדרומי שלילית, ולכן קטבים שונים מושכים, כמו מטענים שונים.
  truth: מגנט אינו טעון. מוט טעון מושך את שני הקצוות של מחט מצפן באותה מידה (קיטוב, שיעור 1.2), אבל קוטב של מגנט מושך קצה אחד של המחט ודוחה את השני. ומטען יכול להיות לבד, ואילו קוטב מגנטי בודד לא נמצא אף פעם.
  remedy: { lesson: '4.1', anchor: materials, label: 'שיעור 4.1: "מגנטים וחומרים"' }

- id: MC-break-magnet-separates-poles
  title: שבירת מגנט מפרידה בין הקטבים
  belief: אם שוברים מגנט מוט באמצע, חצי אחד יהיה קוטב צפוני בלבד והחצי השני קוטב דרומי בלבד.
  truth: כל חצי הוא מגנט שלם, עם קוטב צפוני וקוטב דרומי משלו, ובמקום השבר נוצרים שני קטבים חדשים. אי אפשר לבודד קוטב מגנטי.
  remedy: { lesson: '4.1', anchor: fig-4-1a, label: 'איור 4.1א: לחצו על "שברו את המגנט" ובדקו את הקטבים של כל חצי' }

- id: MC-compass-points-to-magnetic-north
  title: מצפן מצביע על קוטב צפוני מגנטי
  belief: הקוטב הצפוני של מחט המצפן פונה צפונה כי שם נמצא הקוטב הצפוני המגנטי של כדור הארץ.
  truth: קטבים שונים מושכים, ולכן הקוטב הצפוני של המחט נמשך לקוטב דרומי מגנטי. ליד הקוטב הצפוני הגאוגרפי נמצא הקוטב הדרומי של "המגנט" שבתוך כדור הארץ, וקווי השדה נכנסים לשם.
  remedy: { lesson: '4.1', anchor: earth, label: 'שיעור 4.1: "השדה המגנטי של כדור הארץ"' }

- id: MC-magnetic-lines-start-at-n
  title: קווי שדה מגנטי מתחילים בקוטב הצפוני ונגמרים בדרומי
  belief: קו שדה מגנטי יוצא מהקוטב הצפוני ומסתיים בקוטב הדרומי, כמו קו שדה חשמלי שיוצא ממטען חיובי ונגמר במטען שלילי. בתוך המגנט אין שדה.
  truth: לקווי שדה מגנטי אין התחלה ואין סוף. מחוץ למגנט הם הולכים מהצפוני לדרומי, ובתוכו הם ממשיכים מהדרומי לצפוני, וכל קו נסגר על עצמו.
  remedy: { lesson: '4.1', anchor: fig-4-1a, label: 'איור 4.1א: עקבו אחרי קו שדה שנכנס לקוטב הדרומי ומצאו איפה הוא ממשיך' }

- id: MC-magnet-attracts-all-metals
  title: מגנט מושך כל מתכת
  belief: מגנט מושך כל חפץ ממתכת, גם אלומיניום, נחושת, זהב וכסף.
  truth: מגנט מושך רק חומרים מעטים, בעיקר ברזל (וגם פלדה, שהיא סגסוגת של ברזל), ניקל וקובלט. פחית אלומיניום, תיל נחושת וטבעת זהב אינם נמשכים.
  remedy: { lesson: '4.1', anchor: materials, label: 'שיעור 4.1: "מגנטים וחומרים"' }

- id: MC-magnetic-field-only-on-lines
  title: השדה המגנטי קיים רק על הקווים המצוירים
  belief: מצפן שמונח בין שני קווי שדה מצוירים לא מרגיש שדה, כי שם אין קו.
  truth: השדה קיים בכל נקודה סביב המגנט. הקווים הם רק ציור שבוחר כמה מסלולים; מצפן שמונח בין הקווים מתיישר לאורך השדה בדיוק כמו מצפן שעל קו.
  remedy: { lesson: '4.1', anchor: fig-4-1a, label: 'איור 4.1א: הדליקו "מצפנים בכל מקום" וגררו מצפן בין הקווים' }
