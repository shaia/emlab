# Misconceptions of lesson 1.7. Format and rules: see misconceptions/1-5.yaml.

- id: MC-flux-ignores-angle
  title: השטף לא תלוי בזווית
  belief: השטף דרך משטח הוא תמיד השדה כפול השטח, בלי קשר לאופן שבו המשטח מוטה.
  truth: חשוב רק החלק של השדה שניצב למשטח. השטף הוא EA cosθ, והוא מתאפס כשהמשטח מקביל לשדה.
  remedy: { lesson: '1.7', anchor: fig-1-7a, label: 'איור 1.7א: הטו את החלון עד שהקווים מחליקים לאורכו' }

- id: MC-flux-sin-for-cos
  title: השטף הוא EA sinθ
  belief: בנוסחת השטף כותבים sinθ במקום cosθ.
  truth: הזווית נמדדת בין האנך למשטח לבין השדה. כשהאנך בכיוון השדה (θ = 0) השטף מקסימלי, ולכן cosθ.
  remedy: { lesson: '1.7', anchor: fig-1-7a, label: 'איור 1.7א: בזווית אפס עוברים הכי הרבה קווים' }

- id: MC-flux-always-positive
  title: שטף הוא תמיד חיובי
  belief: שטף הוא כמות, ולכן אי אפשר שיהיה שלילי.
  truth: לשטף יש סימן. כשהקווים עוברים נגד כיוון האנך, השטף שלילי.
  remedy: { lesson: '1.7', anchor: fig-1-7a, label: 'איור 1.7א: הטו את החלון מעבר ל-90 מעלות' }

- id: MC-gauss-flux-depends-on-size
  title: שטף גדול יותר דרך משטח גדול יותר
  belief: ככל שהמשטח הסגור גדול יותר או רחוק יותר מהמטען, כך השטף דרכו גדול או קטן יותר.
  truth: השטף דרך משטח סגור תלוי רק במטען הכלוא. כל קו שיוצא מהמטען חוצה כל משטח שמקיף אותו.
  remedy: { lesson: '1.7', anchor: fig-1-7c, label: 'איור 1.7ג: החליפו בין כדור לקובייה והזיזו את המטען בתוך המשטח' }

- id: MC-gauss-outside-charge-counts
  title: מטען שמחוץ למשטח תורם לשטף
  belief: מטען קרוב למשטח, גם אם הוא מבחוץ, יוצר שטף נטו דרכו.
  truth: כל קו שנכנס למשטח סגור גם יוצא ממנו. מטען חיצוני לא תורם לשטף נטו.
  remedy: { lesson: '1.7', anchor: fig-1-7b, label: 'איור 1.7ב: סידור "מטען מחוץ"' }

- id: MC-gauss-zero-flux-zero-field
  title: שטף אפס אומר שדה אפס
  belief: אם השטף דרך המשטח אפס, אין שדה על המשטח.
  truth: שטף אפס אומר שמה שנכנס שווה למה שיוצא. השדה על המשטח יכול להיות חזק מאוד.
  remedy: { lesson: '1.7', anchor: fig-1-7b, label: 'איור 1.7ב: סידור "שני מטענים מנוגדים"' }

- id: MC-gauss-flux-equals-kq
  title: השטף הוא kq
  belief: שטף דרך משטח סביב מטען שווה ל-kq.
  truth: Φ = q/ε₀ = 4πkq. הגורם 4π בא משטח הכדור, והוא חלק מהתוצאה.
  remedy: { lesson: '1.7', anchor: gauss-law, label: 'ההסבר: שטף דרך כדור סביב מטען נקודתי' }
