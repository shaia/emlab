# Lesson 2.1 misconceptions. Each is detected by a tagged distractor in questions/ch2/2-1.yaml.

- id: MC-work-depends-on-path
  title: במסלול ארוך יותר השדה עושה יותר עבודה
  belief: העבודה של השדה גדלה עם אורך המסלול, כמו שהליכה ארוכה יותר מעייפת יותר.
  truth: השדה החשמלי הוא שדה משמר. העבודה שלו בין שתי נקודות תלויה רק בנקודות עצמן ולא במסלול. בקטעים שבהם המטען זז נגד הכוח העבודה שלילית, והיא מקזזת את הקטעים החיוביים.
  remedy: { lesson: '2.1', anchor: fig-2-1a, label: 'איור 2.1א: הגיעו ל-B בשני מסלולים והשוו את העבודות ברשימה' }

- id: MC-work-across-field
  title: השדה עושה עבודה גם כשזזים בניצב לו
  belief: כל תזוזה של מטען בשדה מלווה בעבודה של השדה, כי הכוח פועל כל הזמן.
  truth: עבודה נעשית רק על ידי רכיב הכוח שבכיוון התזוזה. כשהמטען זז בניצב לשדה האחיד, הכוח ניצב לתזוזה והעבודה אפס.
  remedy: { lesson: '2.1', anchor: fig-2-1a, label: 'איור 2.1א: גררו את המטען בקו אנכי וקראו את העבודה' }

- id: MC-work-raises-energy
  title: עבודה חיובית של השדה מגדילה את האנרגיה הפוטנציאלית
  belief: כשהשדה עושה עבודה חיובית, הוא "מוסיף" אנרגיה פוטנציאלית למערכת, ולכן U גדלה.
  truth: 'עבודת השדה באה על חשבון האנרגיה הפוטנציאלית: ΔU = −W. כשהשדה עושה עבודה חיובית, U קטנה (והאנרגיה הקינטית יכולה לגדול), כמו כדור שנופל בשדה הכבידה.'
  remedy: { lesson: '2.1', anchor: fig-2-1a, label: 'איור 2.1א: השוו בשורה שמתחת לאיור את W ואת ΔU' }

- id: MC-closer-means-more-energy
  title: מטענים קרובים יותר תמיד אוגרים יותר אנרגיה
  belief: ככל ששני מטענים קרובים יותר, האנרגיה הפוטנציאלית שלהם גדולה יותר, בלי קשר לסימנים.
  truth: לשני מטענים באותו סימן U = kq₁q₂/r חיובית, והיא גדלה כשהם מתקרבים. למטענים בסימנים מנוגדים U שלילית, והיא קטנה (נעשית שלילית יותר) כשהם מתקרבים, כי השדה עושה עבודה חיובית כשהם נמשכים זה אל זה.
  remedy: { lesson: '2.1', anchor: fig-2-1b, label: 'איור 2.1ב: קרבו מטען בוחן חיובי ואחר כך שלילי, וקראו את U' }

- id: MC-negative-energy-impossible
  title: אנרגיה פוטנציאלית לא יכולה להיות שלילית
  belief: אנרגיה היא "כמות של משהו", ולכן ערך שלילי של U הוא טעות בחישוב.
  truth: הערך של U תלוי בבחירת נקודת הייחוס. כשבוחרים U = 0 באינסוף, לזוג מטענים בסימנים מנוגדים U שלילית. המשמעות היא שצריך להשקיע עבודה כדי להפריד אותם עד לאינסוף.
  remedy: { lesson: '2.1', anchor: fig-2-1b, label: 'איור 2.1ב: הפכו את מטען הבוחן לשלילי וקראו את U' }
