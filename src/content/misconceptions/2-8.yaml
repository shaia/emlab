# Lesson 2.8 misconceptions. Each is detected by a tagged distractor in questions/ch2/2-8.yaml.

- id: MC-series-capacitances-add
  title: בטור הקיבולים מתחברים
  belief: שני קבלים בטור הם כמו קבל אחד גדול יותר, ולכן C = C₁ + C₂.
  truth: בטור המתח מתחלק בין הקבלים, ולכן כל קולון "עולה" יותר מתח. הקיבול השקול נתון ב-1/C = 1/C₁ + 1/C₂, והוא קטן מהקטן שבהם. החיבור הפשוט שייך לחיבור במקביל.
  remedy: { lesson: '2.8', anchor: fig-2-8a, label: 'איור 2.8א: עברו בין "בטור" ל"במקביל" וקראו את הקיבול השקול' }

- id: MC-series-equal-voltage
  title: בטור המתח מתחלק שווה בשווה
  belief: בשני קבלים בטור, על כל אחד חצי מהמתח של הסוללה.
  truth: בטור המטען על שני הקבלים שווה, והמתח על כל אחד הוא V = Q/C. לכן על הקבל הקטן יותר המתח גדול יותר. החלוקה שווה רק כשהקבלים שווים.
  remedy: { lesson: '2.8', anchor: fig-2-8a, label: 'איור 2.8א: בטור, קבעו שני קבלים שונים והשוו את המתחים' }

- id: MC-series-charge-by-c
  title: בטור הקבל הגדול מקבל יותר מטען
  belief: בטור, כמו במקביל, הקבל שהקיבול שלו גדול יותר אוגר יותר מטען.
  truth: בטור המטען שעובר לקבל אחד חייב לבוא מהלוח של הקבל השכן, ולכן על כל הקבלים אותו מטען. מה ששונה ביניהם הוא המתח.
  remedy: { lesson: '2.8', anchor: fig-2-8a, label: 'איור 2.8א: בטור, קראו את המטען על כל קבל' }

- id: MC-parallel-equal-charge
  title: במקביל המטען מתחלק שווה בשווה
  belief: שני קבלים במקביל מקבלים מהסוללה אותו מטען.
  truth: במקביל המתח על שני הקבלים שווה, והמטען על כל אחד הוא Q = CV. הקבל הגדול יותר אוגר יותר.
  remedy: { lesson: '2.8', anchor: fig-2-8a, label: 'איור 2.8א: במקביל, קראו את המטען על כל קבל' }

- id: MC-share-energy-conserved
  title: כשקבל טעון מעביר מטען לקבל ריק, האנרגיה נשמרת
  belief: המטען נשמר בחיבור, ולכן גם האנרגיה החשמלית הכוללת נשמרת.
  truth: המטען נשמר, אבל האנרגיה החשמלית קטנה. החלק החסר הופך לחום בחוטים (ולפעמים לניצוץ), כמו בחיבור של שני כדורים מוליכים בשיעור 2.5.
  remedy: { lesson: '2.8', anchor: fig-2-8b, label: 'איור 2.8ב: העבירו את המתג והשוו את האנרגיה לפני ואחרי' }
