# Lesson 5.8 misconceptions. Each is detected by a tagged distractor in questions/ch5/5-8.yaml.

- id: MC-generator-emf-follows-flux
  title: 'הכא"מ הכי גדול כשהשטף הכי גדול'
  belief: 'בגנרטור הכא"מ הכי גדול כשמישור הכריכה ניצב לשדה, כי אז הכי הרבה קווי שדה עוברים דרכה; כשמישור הכריכה לאורך השדה ואין שטף, אין גם כא"מ.'
  truth: 'הכא"מ תלוי בקצב השינוי של השטף, השיפוע של גרף Φ(t), ולא בשטף עצמו. כשהשטף הכי גדול הגרף שטוח לרגע, והכא"מ אפס. כשהשטף עובר באפס הוא משתנה הכי מהר, והכא"מ הכי גדול: ε = NBAω·sinθ, Φ = BA·cosθ.'
  remedy: { lesson: '5.8', anchor: fig-5-8a, label: 'איור 5.8א: עצרו את הכריכה במצבים המיוחדים, והשוו את הקו המשיק בגרף השטף לגרף הכא"מ' }

- id: MC-generator-faster-same-peak
  title: 'סיבוב מהיר רק מחליף כיוון לעתים קרובות יותר'
  belief: 'כשמסובבים גנרטור מהר יותר, הזרם מחליף כיוון בתדירות גבוהה יותר, אבל השיא של הכא"מ לא משתנה, כי השדה, השטח ומספר הכריכות לא השתנו.'
  truth: 'סיבוב מהיר יותר משנה את השטף באותה כמות בזמן קצר יותר, ולכן קצב השינוי גדול יותר: ε₀ = NBAω. במהירות זוויתית כפולה זמן המחזור חצי, והשיא כפול.'
  remedy: { lesson: '5.8', anchor: fig-5-8a, label: 'איור 5.8א: הכפילו את מספר הסיבובים בשנייה והשוו לעקומה המקווקוות של ההתחלה' }

- id: MC-commutator-steady-dc
  title: 'גנרטור עם קומוטטור נותן מתח קבוע, כמו סוללה'
  belief: 'הקומוטטור הופך את הזרם לזרם ישר, ולכן מתח היציאה של גנרטור עם קומוטטור קבוע בזמן.'
  truth: 'הקומוטטור רק הופך את החיבור למברשות בכל חצי סיבוב, בדיוק כשהכא"מ עובר באפס. הכיוון נשאר קבוע, אבל הגודל עדיין עולה מאפס לשיא וחוזר לאפס פעמיים בכל סיבוב: זרם ישר פועם, |ε₀·sinωt|.'
  remedy: { lesson: '5.8', anchor: fig-5-8a, label: 'איור 5.8א: עברו לטבעת המפוצלת והסתכלו בגרף הכא"מ' }

- id: MC-ac-mean-zero-no-energy
  title: 'הממוצע של זרם חילופין אפס, ולכן הוא לא מעביר אנרגיה'
  belief: 'זרם חילופין זורם חצי מהזמן לכיוון אחד וחצי מהזמן לכיוון השני, ולכן בממוצע הוא אפס, ובממוצע הנורה לא מקבלת אנרגיה (או שהאנרגיה של חצי מחזור אחד מתבטלת בחצי השני).'
  truth: 'הממוצע של הזרם אפס, אבל ההספק ברגע p = I²R לא שלילי אף פעם: הנורה מתחממת בשני כיווני הזרם. לכן ההספק הממוצע חיובי, ε₀²/(2R).'
  remedy: { lesson: '5.8', anchor: fig-5-8a, label: 'איור 5.8א: גרף ההספק של הנורה, שתמיד מעל אפס, והנורה שנדלקת בשני חצאי המחזור' }

- id: MC-ac-mean-power-peak-squared
  title: 'ההספק הממוצע הוא ההספק בשיא, או רבע ממנו'
  belief: 'ההספק הממוצע של גנרטור בנגד הוא ε₀²/R, ההספק בשיא; או שמציבים בו את חצי השיא, ומקבלים ε₀²/(4R).'
  truth: 'ההספק ברגע ε₀²·sin²(ωt)/R, והממוצע של sin² על מחזור הוא ½: הגבעות שמעל לקו החצי ממלאות בדיוק את הגומות שמתחתיו. לכן ההספק הממוצע ε₀²/(2R), חצי מההספק בשיא.'
  remedy: { lesson: '5.8', anchor: rms, label: 'הסבר "הערך האפקטיבי", וגרף ההספק באיור 5.8א עם קו הממוצע' }

- id: MC-ac-effective-is-half-peak
  title: 'הערך האפקטיבי הוא חצי השיא, או הממוצע'
  belief: 'הערך האפקטיבי של מתח חילופין הוא חצי מערך השיא (כי הממוצע של המתח בחצי מחזור הוא בערך חצי), או הממוצע של המתח, שהוא אפס.'
  truth: 'הערך האפקטיבי מוגדר דרך ההספק: המתח הקבוע שנותן בנגד את אותו הספק ממוצע. ההספק הממוצע ε₀²/(2R) = (ε₀/√2)²/R, ולכן הערך האפקטיבי ε₀/√2, כ-0.71 מהשיא, לא 0.5 ולא 0.'
  remedy: { lesson: '5.8', anchor: rms, label: 'הסבר "הערך האפקטיבי": מההספק הממוצע לערך האפקטיבי' }

- id: MC-grid-230-is-peak
  title: '230 וולט הוא השיא של מתח הרשת'
  belief: 'מתח הרשת עולה עד 230 V ויורד ל-−230 V; 230 V הוא ערך השיא.'
  truth: '230 V הוא הערך האפקטיבי, שקובע את ההספק הממוצע. השיא גדול פי √2, כ-325 V, והמתח נע בין +325 V ל-−325 V, 50 פעמים בשנייה.'
  remedy: { lesson: '5.8', anchor: grid, label: 'הסבר "רשת החשמל": 230 וולט אפקטיבי, 325 וולט בשיא' }

- id: MC-generator-free-energy
  title: 'גנרטור שמסתובב לא צריך שיסובבו אותו בכוח'
  belief: 'קשה רק להתחיל לסובב גנרטור; אחר כך, בלי חיכוך, הוא ממשיך להסתובב ולתת זרם בלי שמשקיעים עבודה, ואם מדליקים עוד נורות אין צורך לסובב חזק יותר.'
  truth: 'הזרם המושרה בסליל זורם בשדה המגנטי, ולפי חוק לנץ הכוחות עליו יוצרים מומנט נגד הסיבוב, כמו במנוע של שיעור 4.10. כדי לשמור על מהירות קבועה, מי שמסובב משקיע בכל רגע הספק ששווה להספק החשמלי, ε²/R. ככל שהזרם גדול יותר, צריך לסובב חזק יותר.'
  remedy: { lesson: '5.8', anchor: motor, label: 'הסבר "הגנרטור והמנוע": המומנט של הזרם המושרה נגד הסיבוב' }
