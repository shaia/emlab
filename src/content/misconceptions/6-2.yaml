# Lesson 6.2 misconceptions. Each is detected by a tagged distractor in questions/ch6/6-2.yaml.

- id: MC-integral-area-always-positive
  title: 'השטח מתחת לגרף תמיד חיובי'
  belief: 'אינטגרל הוא שטח, ושטח תמיד חיובי, ולכן גם החלק של הגרף שמתחת לציר מוסיף לאינטגרל.'
  truth: 'האינטגרל הוא שטח מסומן: ברצועה שמתחת לציר הגובה f(x) שלילי, והמכפלה f(x)·dx מחסירה מהסכום. בגרף מהירות-זמן האינטגרל הוא ההעתק; הדרך היא השטח בלי סימנים, והיא חישוב אחר.'
  remedy: { lesson: '6.2', anchor: fig-6-2b, label: 'איור 6.2ב: גרף המהירות הלוך וחזור, והזיזו את b מעבר לרגע שבו המכונית נעצרת' }

- id: MC-riemann-always-under
  title: 'סכום רימן תמיד קטן מהשטח האמיתי'
  belief: 'המלבנים של סכום רימן תמיד נמצאים מתחת לגרף, ולכן הסכום תמיד מעריך פחות מהשטח.'
  truth: 'זה תלוי בכלל ובגרף. בגרף עולה הכלל השמאלי מעריך פחות והימני יותר; בגרף יורד, כמו זרם פריקה, להפך. נקודת האמצע והטרפז יכולים לטעות לשני הכיוונים, לפי העקמומיות.'
  remedy: { lesson: '6.2', anchor: fig-6-2a, label: 'איור 6.2א: עברו בין הכלל השמאלי לימני, ובאיור 6.2ב עשו זאת בגרף זרם הפריקה' }

- id: MC-integral-units-same-as-f
  title: 'לאינטגרל יש אותן יחידות כמו לפונקציה'
  belief: 'האינטגרל של זרם הוא זרם, והאינטגרל של כוח הוא כוח: היחידות לא משתנות.'
  truth: 'כל רצועה היא גובה כפול רוחב, ולכן יחידות האינטגרל הן יחידות f כפול יחידות x: אמפר כפול שנייה הוא קולון, וניוטון כפול מטר הוא ג׳ול.'
  remedy: { lesson: '6.2', anchor: fig-6-2b, label: 'איור 6.2ב: עברו בין ארבעת הגרפים הפיזיקליים וקראו את יחידות השטח' }

- id: MC-integral-end-value-times-width
  title: 'גודל משתנה: כופלים את הערך שלו ברוחב'
  belief: 'כשכוח (או זרם, או מתח) משתנה, העבודה היא הכוח בסוף (או בהתחלה, או המקסימלי) כפול כל הדרך.'
  truth: 'כפל אחד כזה הוא מלבן אחד, והוא נכון רק כשהגודל קבוע. כשהגודל משתנה צריך את השטח כולו, כלומר את האינטגרל: הרבה רצועות, כל אחת עם הגובה שלה.'
  remedy: { lesson: '6.2', anchor: fig-6-2b, label: 'איור 6.2ב: גרף כוח קולון; השוו את השטח למלבן אחד בגובה הכוח בהתחלה' }

- id: MC-ftc-uses-f
  title: 'מציבים את הגבולות בפונקציה עצמה'
  belief: 'האינטגרל של f מ-a עד b הוא f(b) − f(a).'
  truth: 'המשפט היסודי מציב את הגבולות בפונקציה קדומה F, שהנגזרת שלה היא f: ∫ₐᵇ f dx = F(b) − F(a). ההפרש f(b) − f(a) הוא שינוי הגובה של הגרף, לא השטח מתחתיו.'
  remedy: { lesson: '6.2', anchor: fig-6-2c, label: 'איור 6.2ג: השוו את הגובה f(b) לשטח A(b) שמתחת לגרף' }

- id: MC-antiderivative-is-derivative
  title: 'פונקציה קדומה היא הנגזרת'
  belief: 'כדי למצוא פונקציה קדומה של f גוזרים את f.'
  truth: 'פונקציה קדומה היא הכיוון ההפוך: פונקציה F שהנגזרת שלה היא f. של x² היא x³/3, לא 2x. תמיד אפשר לבדוק: גוזרים את התשובה וצריך לקבל את f.'
  remedy: { lesson: '6.2', anchor: fig-6-2c, label: 'איור 6.2ג: השיפוע של פונקציית השטח שווה לגובה הגרף' }
