# Misconceptions of lesson 1.6. Format and rules: see misconceptions/1-5.yaml.

- id: MC-lines-cross
  title: קווי שדה יכולים להיחתך
  belief: בנקודה שבה נפגשים שני קווי שדה יש שני שדות, כל אחד בכיוון של קו אחר.
  truth: בכל נקודה יש לשדה כיוון אחד בלבד, ולכן שני קווי שדה לא נחתכים. רק בנקודת אפס אין קו בכלל.
  remedy: { lesson: '1.6', anchor: fig-1-6c, label: 'איור 1.6ג: שני מטענים זהים ונקודת האפס' }

- id: MC-lines-connect-like
  title: קווי שדה תמיד מחברים בין מטענים
  belief: בין שני מטענים זהים עוברים קווי שדה ישרים שמחברים ביניהם.
  truth: קווי שדה יוצאים ממטען חיובי ונכנסים למטען שלילי. בין שני מטענים חיוביים הקווים נדחים החוצה, ובאמצע ביניהם אין קווים כי שם השדה אפס.
  remedy: { lesson: '1.6', anchor: fig-1-6c, label: 'איור 1.6ג: שני מטענים זהים' }

- id: MC-lines-negative-source
  title: קווי שדה יוצאים גם ממטען שלילי
  belief: קווי שדה יוצאים מכל מטען, חיובי או שלילי.
  truth: קווי שדה יוצאים ממטען חיובי ונכנסים למטען שלילי. ממטען שלילי הקווים לא יוצאים אלא מסתיימים בו.
  remedy: { lesson: '1.6', anchor: fig-1-6b, label: 'איור 1.6ב: דיפול' }

- id: MC-lines-between-empty
  title: בין הקווים אין שדה
  belief: בנקודה שאין דרכה קו שדה אין שם שדה.
  truth: קווי השדה הם ציור, ולא כל נקודה זוכה לקו. בכל נקודה במרחב יש שדה, וכיוונו משיק לקו שהיה עובר דרכה.
  remedy: { lesson: '1.6', anchor: fig-1-6b, label: 'איור 1.6ב: גררו את מטען הבוחן בין הקווים' }

- id: MC-lines-trajectory
  title: מטען נע בדיוק לאורך קו שדה
  belief: מטען שמשחררים בשדה נע לאורך קו השדה שבו הוא התחיל.
  truth: הכוח משיק לקו, אבל מטען שנע ממשיך בכיוון שהיה לו. כשהקו מתעקל המטען יוצא ממנו. המסלול והקו זהים רק כשהקו ישר, ובתנאים מיוחדים.
  remedy: { lesson: '1.6', anchor: fig-1-6b, label: 'איור 1.6ב: החץ משיק לקו, והקו מתעקל' }
