# Misconceptions this lesson detects and remedies. Format and rules: see misconceptions/1-5.yaml.

- id: MC-add-magnitudes-always
  title: גודל הסכום הוא תמיד סכום הגדלים
  belief: כוח של 3 ניוטון ועוד כוח של 4 ניוטון נותנים תמיד 7 ניוטון.
  truth: רק כששני הווקטורים באותו כיוון. בכיוונים מנוגדים מחסירים (1 ניוטון), במאונך משתמשים בפיתגורס (5 ניוטון), ובכל זווית אחרת יוצא משהו בין 1 ל-7.
  remedy: { lesson: '0.2', anchor: fig-0-2b, label: 'איור 0.2ב: סובבו את B וקראו את גודל הסכום' }

- id: MC-magnitude-sum-components
  title: גודל הווקטור הוא סכום הרכיבים
  belief: לווקטור עם רכיבים 3 ו-4 יש גודל 7.
  truth: הרכיבים הם הניצבים במשולש ישר-זווית, והווקטור הוא היתר. לפי פיתגורס הגודל הוא 5.
  remedy: { lesson: '0.2', anchor: fig-0-2a, label: 'איור 0.2א: בנו וקטור שרכיביו 3 ו-4' }

- id: MC-component-bigger
  title: רכיב יכול להיות גדול מהווקטור
  belief: אם הזווית מתאימה, רכיב של וקטור יכול להיות ארוך מהווקטור עצמו.
  truth: רכיב הוא ניצב במשולש ישר-זווית שהווקטור הוא היתר שלו, ולכן הוא לעולם לא ארוך יותר. במקרה הקיצוני, וקטור לאורך ציר, הרכיב שווה לגודל.
  remedy: { lesson: '0.2', anchor: fig-0-2a, label: 'איור 0.2א: הדליקו את הרכיבים וסובבו את A' }

- id: MC-negative-vector-smaller
  title: כפל במספר שלילי מקטין את הווקטור
  belief: הווקטור −A קטן מ-A, או קטן מאפס.
  truth: כפל במספר שלילי הופך את הכיוון. הגודל מוכפל בערך המוחלט של המספר, והוא אף פעם לא שלילי.
  remedy: { lesson: '0.2', anchor: fig-0-2a, label: 'איור 0.2א: הכפילו את A במספר שלילי' }

- id: MC-dot-cross-swap
  title: ⊙ ו-⊗ מתחלפים
  belief: ⊗ פירושו החוצה מהדף, ו-⊙ פירושו לתוכו.
  truth: ⊙ הוא החוד של חץ שמתקרב אליכם, החוצה מהדף. ⊗ הוא הנוצות בזנב של חץ שמתרחק מכם, לתוך הדף.
  remedy: { lesson: '0.2', anchor: fig-0-2c, label: 'איור 0.2ג: הסתכלו על החץ ישר מלמעלה' }
