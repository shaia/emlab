# Lesson 2.6 misconceptions. Each is detected by a tagged distractor in questions/ch2/2-6.yaml.

- id: MC-capacitance-depends-on-charge
  title: הקיבול גדל כשמגדילים את המתח או את המטען
  belief: אם מחברים קבל למתח כפול, הקיבול שלו גדל פי 2, כי C = Q/V והמטען גדל.
  truth: כשהמתח מוכפל, המטען מוכפל גם הוא, והיחס C = Q/V לא משתנה. הקיבול נקבע רק מהמבנה, ε₀A/d.
  remedy: { lesson: '2.6', anchor: fig-2-6a, label: 'איור 2.6א: שנו את המתח של הסוללה וקראו את הקיבול' }

- id: MC-capacitor-net-charge
  title: לקבל טעון יש מטען כולל
  belief: קבל שטעון ב-Q נושא מטען כולל Q, כמו כדור טעון.
  truth: על הלוח האחד +Q ועל השני −Q. המטען הכולל של הקבל אפס. "המטען של הקבל" הוא המטען על אחד הלוחות.
  remedy: { lesson: '2.6', anchor: capacitance, label: 'שיעור 2.6: מהו קבל' }

- id: MC-wider-gap-more-capacitance
  title: לוחות רחוקים יותר אוגרים יותר
  belief: כשמרחיקים את הלוחות יש יותר מקום ביניהם, ולכן הקיבול גדל.
  truth: הקיבול הוא ε₀A/d, ביחס הפוך למרחק. כשמרחיקים את הלוחות, אותו מטען יוצר אותו שדה לאורך דרך ארוכה יותר, והמתח גדל. לכן Q/V קטן.
  remedy: { lesson: '2.6', anchor: fig-2-6a, label: 'איור 2.6א: הגדילו את המרחק בין הלוחות וקראו את הקיבול' }

- id: MC-field-grows-with-area
  title: לוחות גדולים יותר יוצרים שדה חזק יותר
  belief: בקבל שמחובר לסוללה, הגדלת שטח הלוחות מחזקת את השדה ביניהם, כי יש יותר מטען.
  truth: השדה בקבל המחובר לסוללה הוא E = V/d, והוא לא תלוי בשטח. המטען גדל עם השטח, אבל מתפזר על שטח גדול יותר, וצפיפות המטען σ לא משתנה.
  remedy: { lesson: '2.6', anchor: fig-2-6a, label: 'איור 2.6א: הגדילו את השטח וקראו את השדה' }
