# Misconceptions of lesson 6.4. Format and rules: see misconceptions/1-5.yaml.
# Each is detected by a tagged distractor in questions/ch6/6-4.yaml.

- id: MC-ring-centre-max
  title: 'השדה במרכז טבעת מקסימלי'
  belief: 'על הציר של טבעת טעונה השדה החזק ביותר נמצא במרכז הטבעת, כי שם הנקודה קרובה ביותר לכל המטען.'
  truth: 'במרכז השדה אפס: כל חתיכה של הטבעת מושכת או דוחפת בכיוון אחר, וכל חתיכה מבטלת את החתיכה שמולה. על הציר השדה גדל מאפס, מגיע לשיא ב-z = R/√2, ויורד כמו kQ/z² רחוק מהטבעת.'
  remedy: { lesson: '6.4', anchor: fig-6-4b, label: 'איור 6.4ב: הביאו את P למרכז הטבעת, ומצאו את השיא בגרף' }

- id: MC-add-magnitudes
  title: 'מחברים את הגדלים של dE בלי כיוון'
  belief: 'את השדה של התפלגות רציפה מקבלים מסכום (אינטגרל) של k·dq/r², בלי לחשוב על הכיוונים של התרומות.'
  truth: 'כל dE הוא וקטור. מחברים רכיבים: קודם בודקים בעזרת סימטריה אילו רכיבים מתבטלים, ומחשבים אינטגרל רק לרכיב שנשאר, עם הגורם שמטיל את dE עליו (למשל cosθ).'
  remedy: { lesson: '6.4', anchor: fig-6-4a, label: 'איור 6.4א: שרשרת החצים, וזוג חתיכות סימטרי' }

- id: MC-more-pieces-more-field
  title: 'יותר חתיכות נותנות שדה גדול יותר'
  belief: 'כשמחלקים את הגוף ליותר מטענים נקודתיים מחברים יותר תרומות, ולכן הסכום גדל בלי גבול כש-N גדל.'
  truth: 'המטען הכולל קבוע: כשמגדילים את N, המטען של כל חתיכה, dq = Q/N, קטן באותו יחס. הסכום מתקרב לערך סופי אחד, האינטגרל.'
  remedy: { lesson: '6.4', anchor: fig-6-4a, label: 'איור 6.4א: הגדילו את N, ועקבו אחרי הסכום' }

- id: MC-rod-as-point
  title: 'מוט סופי הוא מטען נקודתי במרכזו'
  belief: 'את השדה של מוט טעון אפשר תמיד לחשב כאילו כל המטען מרוכז באמצע המוט, kQ/r².'
  truth: 'זה נכון רק רחוק מאוד מהמוט, במרחק גדול בהרבה מאורכו. קרוב יותר, החלקים השונים של המוט נמצאים במרחקים שונים ובכיוונים שונים, והשדה שונה מ-kQ/r²: על הציר הוא kQ/(d(d+L)).'
  remedy: { lesson: '6.4', anchor: fig-6-4a, label: 'איור 6.4א: השוו את האינטגרל לשורה "מטען נקודתי"' }

- id: MC-line-formula-everywhere
  title: 'השדה של כל מוט הוא 2kλ/r'
  belief: 'השדה של מוט טעון, בכל אורך ובכל מרחק, נתון בנוסחה של תיל אינסופי, 2kλ/r.'
  truth: 'הנוסחה היא גבול: היא מתקבלת רק כשהמרחק מהמוט קטן בהרבה מאורכו, ורחוק מהקצוות. רחוק מהמוט השדה יורד כמו 1/r², לא כמו 1/r.'
  remedy: { lesson: '6.4', anchor: fig-6-4a, label: 'איור 6.4א: קצרו את המוט והרחיקו את P, והשוו לשורה "תיל אינסופי"' }

- id: MC-dq-whole-body
  title: 'dq הוא המטען של כל הגוף'
  belief: 'כשכותבים dq לדיסקה או למוט, מציבים את השטח או את האורך של כל הגוף, למשל dq = σπR².'
  truth: 'dq הוא המטען של חתיכה קטנה אחת: צפיפות כפול הגודל הקטן של החתיכה, dq = λ·dx, או dq = σ·2πs·ds לטבעת דקה בדיסקה. את כל הגוף מקבלים רק באינטגרל.'
  remedy: { lesson: '6.4', anchor: recipe, label: 'ההסבר: המתכון, מסכום לאינטגרל' }
