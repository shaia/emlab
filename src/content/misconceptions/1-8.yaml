# Misconceptions of lesson 1.8. Format and rules: see misconceptions/1-5.yaml.

- id: MC-gauss-always-solves
  title: חוק גאוס מחשב שדה לכל התפלגות
  belief: אפשר להשתמש בחוק גאוס כדי למצוא את השדה של כל התפלגות מטענים, למשל של דיפול.
  truth: החוק נכון תמיד, אבל הוא נותן את השדה רק כשהסימטריה מבטיחה שהשדה קבוע בגודלו וניצב למשטח. בלי סימטריה הוא נותן רק שטף כולל.
  remedy: { lesson: '1.8', anchor: symmetry-needed, label: 'ההסבר: מתי חוק גאוס עוזר' }

- id: MC-shell-inside-field
  title: בתוך קליפה טעונה יש שדה
  belief: בתוך קליפה טעונה השדה הוא kQ/r², או שהוא שווה לשדה על הקליפה.
  truth: משטח גאוס בתוך הקליפה לא כולא מטען, ולכן השדה בתוכה אפס.
  remedy: { lesson: '1.8', anchor: fig-1-8a, label: 'איור 1.8א: כווצו את משטח גאוס לתוך הקליפה' }

- id: MC-shell-distance-from-surface
  title: r נמדד מפני הקליפה
  belief: ב-kQ/r² מציבים את המרחק מפני הקליפה.
  truth: מחוץ לקליפה השדה כמו של מטען נקודתי במרכז, ולכן r הוא המרחק מהמרכז.
  remedy: { lesson: '1.8', anchor: fig-1-8a, label: 'איור 1.8א: רדיוס משטח גאוס נמדד מהמרכז' }

- id: MC-plane-field-falls
  title: השדה של לוח אינסופי יורד עם המרחק
  belief: ככל שמתרחקים מלוח טעון, השדה נחלש, כמו אצל מטען נקודתי.
  truth: השדה של לוח אינסופי קבוע, σ/2ε₀, בכל מרחק. הקווים המקבילים לא מתרווחים.
  remedy: { lesson: '1.8', anchor: fig-1-8b, label: 'איור 1.8ב: הזיזו את נקודת המדידה קרוב ורחוק מלוח יחיד' }

- id: MC-plane-factor-two
  title: בלבול בגורם 2 של השדה
  belief: השדה של לוח הוא תמיד σ/ε₀, או שבין שני לוחות הוא σ/2ε₀.
  truth: לוח יחיד נותן σ/2ε₀ בכל צד. בין שני לוחות מנוגדים שני השדות מתחברים ונותנים σ/ε₀.
  remedy: { lesson: '1.8', anchor: fig-1-8b, label: 'איור 1.8ב: עברו בין לוח אחד לשני לוחות' }

- id: MC-plates-outside-field
  title: מחוץ לשני לוחות מנוגדים יש שדה
  belief: מחוץ לשני לוחות מקבילים עם מטענים מנוגדים יש שדה, כמו ביניהם.
  truth: מחוץ ללוחות שני השדות מנוגדים ושווים, ולכן סכומם אפס. השדה נמצא רק בין הלוחות.
  remedy: { lesson: '1.8', anchor: fig-1-8b, label: 'איור 1.8ב: מדדו מחוץ לשני לוחות + ו-−' }
