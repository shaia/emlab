# Lesson 2.7 misconceptions. Each is detected by a tagged distractor in questions/ch2/2-7.yaml.

- id: MC-energy-linear-in-v
  title: האנרגיה בקבל ביחס ישר למתח
  belief: אם מכפילים את המתח על קבל, האנרגיה שלו מוכפלת.
  truth: U = ½CV². במתח כפול גם המטען כפול, ולכן האנרגיה, ½QV, גדלה פי 4. בגרף V–Q המשולש גדל פי 2 בגובה ופי 2 ברוחב.
  remedy: { lesson: '2.7', anchor: fig-2-7a, label: 'איור 2.7א: הכפילו את המתח והשוו את שני המשולשים בגרף' }

- id: MC-isolated-energy-constant
  title: האנרגיה של קבל מנותק לא יכולה להשתנות
  belief: קבל שנותק מהסוללה לא מקבל אנרגיה משום מקום, ולכן האנרגיה שלו קבועה גם כשמרחיקים את הלוחות.
  truth: הלוחות מושכים זה את זה (מטענים מנוגדים). מי שמרחיק אותם עושה עבודה נגד המשיכה, והעבודה הזו נאגרת, כך שהאנרגיה גדלה. המטען הוא שקבוע, לא האנרגיה.
  remedy: { lesson: '2.7', anchor: fig-2-7a, label: 'איור 2.7א: נתקו את הקבל, הרחיקו את הלוחות וקראו את האנרגיה' }

- id: MC-isolated-v-constant
  title: בקבל מנותק המתח נשאר קבוע
  belief: הקבל נטען ב-200 V, ולכן גם אחרי שנותק והלוחות זזו, המתח עליו 200 V, וכל השאר מחושב לפי המתח הזה.
  truth: בקבל מנותק המטען קבוע, והמתח הוא V = Q/C. כשמרחיקים את הלוחות C קטן, ולכן V גדל. המתח נשאר קבוע רק כשהקבל מחובר לסוללה.
  remedy: { lesson: '2.7', anchor: fig-2-7a, label: 'איור 2.7א: השוו הרחקת לוחות בקבל מחובר ובקבל מנותק' }

- id: MC-connected-q-constant
  title: בקבל מחובר המטען נשאר קבוע
  belief: כשמרחיקים את הלוחות של קבל שמחובר לסוללה, המטען על הלוחות לא משתנה, והמתח גדל.
  truth: הסוללה מחזיקה את המתח קבוע. כשהקיבול קטן, מטען חוזר מהלוחות לסוללה, Q = CV קטן, והשדה V/d נחלש.
  remedy: { lesson: '2.7', anchor: fig-2-7a, label: 'איור 2.7א: הרחיקו את הלוחות כשהקבל מחובר וקראו את המטען' }

- id: MC-battery-work-all-stored
  title: כל העבודה של הסוללה נאגרת בקבל
  belief: הסוללה עושה עבודה QV בטעינת הקבל, וכל העבודה הזו נאגרת בו.
  truth: בקבל נאגרת רק ½QV. החצי השני הופך לחום בחוטים (ולפעמים לאור בניצוץ). כך תמיד בטעינה ישירה מסוללה, בלי קשר להתנגדות החוטים.
  remedy: { lesson: '2.7', anchor: battery, label: 'שיעור 2.7: מאיפה באה האנרגיה' }
