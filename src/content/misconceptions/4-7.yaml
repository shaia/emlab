# Lesson 4.7 misconceptions. Each is detected by a tagged distractor in questions/ch4/4-7.yaml.

- id: MC-selector-depends-on-mass
  title: המהירות שעוברת בבורר תלויה במסה או במטען
  belief: חלקיק כבד יותר, או עם מטען גדול יותר, צריך מהירות אחרת כדי לעבור ישר באותו בורר מהירויות.
  truth: 'שני הכוחות, qE ו-qvB, יחסיים למטען, ולכן הוא מצטמצם מתנאי האיזון: v = E/B. המסה בכלל לא מופיעה, כי כשהכוחות מאוזנים אין תאוצה. המסה והמטען קובעים רק כמה חזק מתכופף חלקיק שמהירותו שונה מ-E/B.'
  remedy: { lesson: '4.7', anchor: fig-4-7a, label: 'איור 4.7א: כשהפרוטון עובר ישר, החליפו לחלקיק אלפא או ליון שלילי' }

- id: MC-selector-sign-matters
  title: חלקיק שלילי צריך שדות הפוכים או מהירות אחרת
  belief: בורר שמכוון לפרוטונים לא יעביר יונים שליליים באותה מהירות; בשבילם צריך להפוך את השדות.
  truth: 'כשהמטען שלילי, גם הכוח החשמלי וגם הכוח המגנטי מתהפכים, ולכן הם נשארים מנוגדים ושווים. אותו בורר מעביר חלקיקים חיוביים ושליליים באותה מהירות E/B.'
  remedy: { lesson: '4.7', anchor: fig-4-7a, label: 'איור 4.7א: בחרו יון מימן שלילי וראו את שני הכוחות מתהפכים' }

- id: MC-selector-fast-to-electric
  title: חלקיק מהיר מדי נוטה לצד של הכוח החשמלי
  belief: חלקיק שמהיר יותר מ-E/B מתכופף לכיוון הכוח החשמלי (או שמהירות לא משפיעה על הצד).
  truth: 'רק הכוח המגנטי, qvB, גדל עם המהירות; הכוח החשמלי, qE, לא תלוי בה. חלקיק מהיר יותר מ-E/B מתכופף לצד של הכוח המגנטי, ואיטי יותר לצד של הכוח החשמלי.'
  remedy: { lesson: '4.7', anchor: fig-4-7a, label: 'איור 4.7א: הגדילו את המהירות מעל E/B והשוו את חיצי הכוחות' }

- id: MC-selector-changes-speed
  title: השדות משנים את מהירות החלקיק שעובר ישר
  belief: החלקיק שעובר ישר בבורר יוצא ממנו מהיר יותר (או איטי יותר), כי פועלים עליו שני שדות.
  truth: 'הכוח השקול על החלקיק הנבחר הוא אפס, ולכן מהירותו לא משתנה. גם בנפרד: הכוח המגנטי לא עושה עבודה, והכוח החשמלי ניצב לתנועה הישרה, ולכן גם הוא לא עושה עליו עבודה.'
  remedy: { lesson: '4.7', anchor: too-fast, label: 'שיעור 4.7: "מהיר מדי, איטי מדי"' }

- id: MC-bainbridge-mass-only
  title: בספקטרומטר מקום הפגיעה תלוי רק במסה
  belief: יונים עם אותה מסה תמיד פוגעים באותו מקום בגלאי, ויונים עם מסה שונה תמיד במקומות שונים.
  truth: 'הרדיוס r = mE/(qBB′) תלוי ביחס m/q. דויטרון (מסה 2, מטען 1) וחלקיק אלפא (מסה 4, מטען 2) פוגעים באותו מקום, ויון עם מטען כפול פוגע בחצי המרחק.'
  remedy: { lesson: '4.7', anchor: fig-4-7b, label: 'איור 4.7ב: הוסיפו חלקיקי אלפא לדאוטרונים' }
