# Lesson 3.7 misconceptions. Each is detected by a tagged distractor in questions/ch3/3-7.yaml.

- id: MC-ammeter-across
  title: מד זרם מחברים משני צדי הרכיב
  belief: כמו מד מתח, מחברים את מד הזרם בין שני הקצוות של הרכיב שרוצים למדוד בו את הזרם.
  truth: 'מד זרם צריך שהזרם יעבור **דרכו**, ולכן מחברים אותו בטור, בתוך המסלול של הזרם. ההתנגדות שלו קטנה מאוד, ולכן מד זרם שמחובר משני צדי רכיב הוא כמעט קצר: רוב הזרם עובר בו, והרכיב כמעט נכבה.'
  remedy: { lesson: '3.7', anchor: fig-3-7a, label: 'איור 3.7א: עברו ל"מד זרם במקביל"' }

- id: MC-voltmeter-in-line
  title: מד מתח בטור מודד את המתח של הרכיב
  belief: מד מתח שמחובר בטור לנורה מודד את המתח שעליה.
  truth: 'מד מתח מחברים בין שתי הנקודות שאת המתח ביניהן מודדים, במקביל לרכיב. ההתנגדות שלו גדולה מאוד, ולכן בטור הוא כמעט עוצר את הזרם: הנורה נכבית, ומד המתח מראה כמעט את כל המתח של הסוללה.'
  remedy: { lesson: '3.7', anchor: fig-3-7a, label: 'איור 3.7א: עברו ל"מד מתח בטור"' }

- id: MC-meters-never-disturb
  title: מכשיר מדידה לא משנה את המעגל
  belief: מד מתח מראה תמיד את המתח שהיה שם גם בלעדיו.
  truth: מד מתח אמיתי מעביר מעט זרם, ולכן הוא כמו נגד נוסף במקביל לרכיב. כשההתנגדות שלו לא גדולה הרבה יותר מזו של הרכיב, הוא משנה את המתח שהוא מודד. לכן מד מתח טוב הוא בעל התנגדות גדולה מאוד.
  remedy: { lesson: '3.7', anchor: fig-3-7a, label: 'איור 3.7א: "מד מתח על מחלק מתח", שנו את ההתנגדות של המד' }

- id: MC-rheostat-up-brighter
  title: יותר התנגדות בנגד המשתנה, נורה בהירה יותר
  belief: מגדילים את ההתנגדות של נגד משתנה שמחובר בטור לנורה, ובגלל ש"יש יותר התנגדות" הנורה מתחממת ומאירה יותר.
  truth: הגדלת הנגד המשתנה מגדילה את ההתנגדות השקולה של המעגל, ולכן הזרם קטן. בנורה עובר פחות זרם, המתח עליה קטן, והיא מאירה פחות.
  remedy: { lesson: '3.7', anchor: fig-3-7b, label: 'איור 3.7ב: הגדילו את הנגד המשתנה' }
