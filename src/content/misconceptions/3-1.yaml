# Lesson 3.1 misconceptions. Each is detected by a tagged distractor in questions/ch3/3-1.yaml.

- id: MC-no-current-no-voltage
  title: אין זרם, אז אין מתח
  belief: במקום שלא זורם בו זרם, למשל על פני מפסק פתוח, אין מתח.
  truth: מתח הוא הפרש פוטנציאלים, והוא קיים גם בלי זרם. על פני מפסק פתוח נמצא כל המתח של הסוללה, כי צד אחד שלו מחובר להדק החיובי והצד השני להדק השלילי. הזרם הוא תוצאה של מתח, לא תנאי לו.
  remedy: { lesson: '3.1', anchor: fig-3-1a, label: 'איור 3.1א: כשהמפסק פתוח, מדדו את המתח בין שני הצדדים שלו' }

- id: MC-wire-potential-drops
  title: הפוטנציאל יורד לאט לאורך התיל
  belief: ככל שמתרחקים מהסוללה לאורך תיל מחבר, הפוטנציאל יורד בהדרגה, ולכן בין שתי נקודות של אותו תיל יש מתח ניכר.
  truth: 'לתיל מחבר יש התנגדות זניחה, ולכן כל הנקודות שלו באותו פוטנציאל, והמתח בין שתי נקודות שלו הוא כמעט אפס. הפוטנציאל משתנה רק ברכיבים: עולה בסוללה ויורד בנורה.'
  remedy: { lesson: '3.1', anchor: fig-3-1a, label: 'איור 3.1א: שימו את שני החודים של מד המתח על אותו תיל' }

- id: MC-single-wire
  title: מספיק תיל אחד מהסוללה לנורה
  belief: נורה שמחוברת בתיל אחד להדק של סוללה תדלק, אולי חלש, כי "החשמל" מגיע אליה בתיל.
  truth: כדי שיזרום זרם צריך מסלול סגור מהדק אחד של הסוללה, דרך הנורה, אל ההדק השני. בתיל אחד, שני הקצוות של הנורה באותו פוטנציאל, אין מתח על חוט הלהט ואין בו שדה, ולכן אין זרם.
  remedy: { lesson: '3.1', anchor: fig-3-1c, label: 'איור 3.1ג: חברו לנורה תיל אחד בלבד, ואחר כך גם את השני' }

- id: MC-battery-stores-charge
  title: הסוללה היא מיכל של מטען
  belief: בתוך הסוללה יש מלאי של אלקטרונים, והיא שופכת אותם לתילים. כשהמלאי נגמר, הסוללה ריקה.
  truth: האלקטרונים החופשיים נמצאים בתילים ובחוט הלהט מההתחלה. הסוללה רק שומרת על הפרש פוטנציאלים, וכך נותנת אנרגיה למטען שעובר דרכה. אותה כמות מטען שיוצאת מהדק אחד נכנסת להדק השני. סוללה "ריקה" היא סוללה שהחומרים הכימיים שלה נגמרו, לא המטען שלה.
  remedy: { lesson: '3.1', anchor: battery-pump, label: 'שיעור 3.1: "מה הסוללה עושה, ומה היא לא עושה"' }

- id: MC-switch-position
  title: מפסק עובד רק בצד החיובי
  belief: הזרם יוצא מההדק החיובי, ולכן מפסק שנמצא אחרי הנורה (בצד השלילי) לא יכבה אותה.
  truth: זרם זורם רק כשהמסלול כולו סגור. נתק בכל מקום במעגל, לפני הנורה או אחריה, עוצר את הזרם בכל המעגל בבת אחת.
  remedy: { lesson: '3.1', anchor: fig-3-1c, label: 'איור 3.1ג: שימו מפסק בתיל שמוביל להדק השלילי, ופתחו אותו' }

- id: MC-voltage-flows
  title: המתח זורם במעגל
  belief: מה שזורם בתילים מהסוללה אל הנורה הוא המתח (או "החשמל"), והוא נכנס לנורה.
  truth: 'מה שזורם הוא מטען: האלקטרונים החופשיים. מתח הוא הפרש פוטנציאלים בין שתי נקודות, והוא לא זורם לשום מקום. המתח על חוט הלהט יוצר בו שדה, והשדה מניע את המטען.'
  remedy: { lesson: '3.1', anchor: fig-3-1a, label: 'איור 3.1א: סגרו את המפסק וקראו את הפוטנציאל בקצות הנורה' }
