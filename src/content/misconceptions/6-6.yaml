# Lesson 6.6 misconceptions. Each is detected by a tagged distractor in questions/ch6/6-6.yaml.
# The lesson also tags misconceptions registered by earlier lessons: MC-work-depends-on-path (2.1),
# MC-field-points-to-higher-v, MC-high-potential-strong-field (2.3), MC-potential-is-vector (2.2).

- id: MC-lineint-enclosed-charge-counts
  title: 'מסלול שעובר מהצד השני של המטען נותן אינטגרל אחר'
  belief: 'אם שני מסלולים מ-A ל-B עוברים משני צדי מטען, כך שהמטען כלוא ביניהם, האינטגרל הקווי ∫E·dl שונה ביניהם; וסביב מסלול סגור שמקיף מטען ∮E·dl אינו אפס, כמו השטף בחוק גאוס או הסכום בחוק אמפר.'
  truth: 'השדה האלקטרוסטטי משמר בכל המרחב: ∮E·dl = 0 סביב כל מסלול סגור, גם כזה שמקיף מטען. מה שכלוא במשטח סגור קובע את השטף (גאוס), אבל לא את האינטגרל הקווי.'
  remedy: { lesson: '6.6', anchor: fig-6-6a, label: 'איור 6.6א: גררו את מסלול 2 לצד השני של המטען, והשוו את שני האינטגרלים' }

- id: MC-every-field-conservative
  title: 'לכל שדה יש פוטנציאל'
  belief: 'האינטגרל הקווי של כל שדה וקטורי בין שתי נקודות לא תלוי במסלול, ולכן לכל שדה אפשר להגדיר פוטנציאל.'
  truth: 'רק בשדה משמר האינטגרל לא תלוי במסלול. בשדה מערבולת, למשל, מסלול שהולך עם הסיבוב מקבל יותר ממסלול שהולך נגדו, ∮E·dl ≠ 0, ואין פונקציה V שהשדה הוא מינוס הגרדיאנט שלה.'
  remedy: { lesson: '6.6', anchor: fig-6-6a, label: 'איור 6.6א: עברו לשדה המערבולת, ושנו את מסלול 2' }

- id: MC-lineint-length-times-field
  title: 'האינטגרל הקווי הוא השדה כפול אורך המסלול'
  belief: 'כדי לחשב ∫E·dl כופלים את עוצמת השדה (בהתחלה, או בממוצע) באורך המסלול.'
  truth: 'בכל חתיכה נספר רק רכיב השדה לאורך הצעד, E·dl = E dl cosθ, והשדה יכול להשתנות לאורך המסלול. רק בשדה אחיד ובמסלול ישר לאורך השדה מקבלים E כפול האורך.'
  remedy: { lesson: '6.6', anchor: fig-6-6a, label: 'איור 6.6א: מסלול 2 ארוך פי 1.5, והאינטגרל לא גדל' }

- id: MC-axis-potential-gives-full-field
  title: 'הפוטנציאל על הציר נותן את כל השדה'
  belief: 'אם יודעים את V על ציר הטבעת, אפשר לקבל ממנו בגזירה את כל וקטור השדה, גם את הרכיבים הניצבים לציר ואת השדה מחוץ לציר.'
  truth: 'גזירה לאורך הציר נותנת רק את הרכיב לאורכו, E_z = −dV/dz. לרכיבים הניצבים צריך לדעת איך V משתנה כשזזים הצידה, מחוץ לציר. על הציר הם אפס בגלל הסימטריה, לא בגלל הגזירה.'
  remedy: { lesson: '6.6', anchor: fig-6-6c, label: 'איור 6.6ג: הגרף של V לאורך הציר והשיפוע שלו' }
