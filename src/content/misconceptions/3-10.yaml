# Lesson 3.10 misconceptions. Each is detected by a tagged distractor in questions/ch3/3-10.yaml.

- id: MC-battery-line-origin
  title: האופיין של סוללה עובר בראשית
  belief: גרף של המתח כתלות בזרם הוא תמיד קו דרך הראשית, כמו בנגד אוהמי, ולכן גם הגרף של סוללה.
  truth: 'בנגד V = IR, ולכן הקו עובר בראשית. בסוללה V = ε − Ir: כשהזרם אפס המתח הוא ε, לא אפס, והקו יורד ככל שהזרם גדל. החיתוך עם ציר המתח הוא הכא"מ.'
  remedy: { lesson: '3.10', anchor: fig-3-10b, label: 'איור 3.10ב: הניחו את הסרגל וקראו היכן הוא חותך את ציר המתח' }

- id: MC-slope-positive-r
  title: השיפוע של האופיין הוא r
  belief: ההתנגדות הפנימית שווה לשיפוע של גרף V כתלות ב-I, כולל הסימן, או שהשיפוע חיובי.
  truth: הקו יורד, והשיפוע שלו שלילי, −r. ההתנגדות הפנימית היא הגודל של השיפוע. שיפוע שלילי לא אומר שההתנגדות שלילית.
  remedy: { lesson: '3.10', anchor: fig-3-10b, label: 'איור 3.10ב: קראו את השיפוע של הסרגל, עם הסימן' }
