# Lesson 6.14 misconceptions. Each is detected by a tagged distractor in questions/ch6/6-14.yaml.

- id: MC-em-fields-alternate
  title: 'בגל אלקטרומגנטי השדה החשמלי והשדה המגנטי מתחלפים'
  belief: 'כשהשדה החשמלי בגל הכי חזק, השדה המגנטי אפס, ולהפך: האנרגיה עוברת הלוך ושוב בין השדות, כמו בין אנרגיה קינטית לפוטנציאלית במתנד.'
  truth: 'בגל שמתקדם בריק E ו-B באותו מופע: הם מגיעים לפסגה, לאפס ולשפל יחד, באותה נקודה ובאותו רגע. חוק פאראדיי דורש זאת: ∂E/∂x ו-∂B/∂t חייבים להיות שווים בכל נקודה, וזה קורה רק אם לשניהם אותה צורת sin. האנרגיה לא עוברת בין השדות; היא נעה יחד עם הגל.'
  remedy: { lesson: '6.14', anchor: fig-6-14a, label: 'איור 6.14א: הגשש בפסגה של E קורא גם את B הגדול ביותר; בגל הניסיוני עם פיגור של רבע מחזור שני החוקים נשברים' }

- id: MC-magnetic-energy-negligible
  title: 'השדה המגנטי של גל אור נושא חלק זניח מהאנרגיה'
  belief: 'B = E/c קטן פי 3·10⁸ מ-E, ולכן כמעט כל האנרגיה של הגל נמצאת בשדה החשמלי, והשדה המגנטי הוא תוספת זניחה.'
  truth: 'השוואה בין E ל-B היא השוואה בין גדלים ביחידות שונות, ואין לה משמעות. צפיפות האנרגיה המגנטית היא B²/(2μ₀), ו-μ₀ קטן מאוד: עם B = E/c יוצא B²/(2μ₀) = ε₀E²/2 בדיוק. בכל נקודה של הגל חצי מהאנרגיה בשדה החשמלי וחצי בשדה המגנטי.'
  remedy: { lesson: '6.14', anchor: fig-6-14a, label: 'איור 6.14א: שני הגרפים שמתחת לגל, u_E ו-u_B, מתלכדים; הגשש קורא אותם שווים בכל נקודה' }

- id: MC-em-wave-needs-medium
  title: 'גל אלקטרומגנטי צריך תווך שינוע בו'
  belief: 'גל הוא תנועה של חומר, כמו גל במים או קול באוויר, ולכן גם אור צריך משהו שיתנודד בו. בריק מוחלט הוא לא יכול לעבור.'
  truth: 'הגזירה בשיעור משתמשת רק בחוק פאראדיי ובחוק אמפר-מקסוול בריק, בלי שום חומר. השדה החשמלי שמשתנה יוצר שדה מגנטי, והשדה המגנטי שמשתנה יוצר שדה חשמלי, וכך הגל מקיים את עצמו. אור השמש מגיע אלינו דרך 150 מיליון קילומטרים של כמעט-ריק.'
  remedy: { lesson: '6.14', anchor: fig-6-14a, label: 'איור 6.14א: הגל מקיים את שני החוקים בריק; זרם ההעתקה מחליף כאן כל זרם של חומר' }

- id: MC-wave-arrows-are-motion
  title: 'החצים בציור של גל אלקטרומגנטי הם משהו שזז למעלה ולמטה'
  belief: 'בציור של גל אלקטרומגנטי הקו המתפתל הוא מסלול של משהו, או חבל שמתנודד, והאור תופס מקום ברוחב שהחצים מגיעים אליו.'
  truth: 'שום דבר לא זז הצידה. כל חץ מצויר בנקודה אחת על ציר x, ואורכו הוא עוצמת השדה בנקודה הזו, לא מרחק. הקו המתפתל רק מחבר את קצות החצים. הגל המישורי ממלא את כל המרחב, וגודל החצים לא קשור לרוחב של האור.'
  remedy: { lesson: '6.14', anchor: fig-6-14a, label: 'איור 6.14א: הגדילו את המשרעת: החצים מתארכים, אבל הגשש עדיין קורא את השדה על הציר עצמו, ויחידות החץ הן וולט למטר' }

- id: MC-energy-flows-in-wire
  title: 'האנרגיה במעגל זורמת בתוך התיל, יחד עם האלקטרונים'
  belief: 'האלקטרונים נושאים את האנרגיה מהסוללה לנגד, דרך התיל, כמו מים שמובילים חום בצינור.'
  truth: 'האלקטרונים בתיל נעים לאט מאוד (מילימטרים בדקה בזרם רגיל). האנרגיה זורמת בשדה שמחוץ לתיל: וקטור פוינטינג E×B/μ₀ מצביע אל תוך הנגד מכל צדדיו, והשטף שלו דרך פני הנגד שווה בדיוק להספק VI שהופך בו לחום.'
  remedy: { lesson: '6.14', anchor: ex-6-14-6, label: 'דוגמה 6.14-6: וקטור פוינטינג על פני תיל חימום מצביע פנימה, והשטף שלו הוא VI' }
