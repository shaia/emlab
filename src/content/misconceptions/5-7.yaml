# Lesson 5.7 misconceptions. Each is detected by a tagged distractor in questions/ch5/5-7.yaml.

- id: MC-induced-lorentz-at-rest
  title: 'בלולאה נייחת הכוח המגנטי מניע את המטענים'
  belief: 'כשהשדה המגנטי דרך לולאה נייחת משתנה, הכוח המגנטי על המטענים שבתיל (כוח לורנץ) הוא שמניע אותם.'
  truth: 'הכוח המגנטי על מטען הוא qvB, והמטענים בלולאה נייחת לא נעים, v = 0. את המטענים מניע שדה חשמלי מושרה, שנוצר מהשינוי של השדה המגנטי. כוח לורנץ מניע את המטענים רק כשהמוליך עצמו נע בשדה (שיעור 5.4).'
  remedy: { lesson: '5.7', anchor: fig-5-7a, label: 'איור 5.7א: לולאה נייחת בליבה, והחיצים של השדה החשמלי המושרה' }

- id: MC-induced-field-from-charges
  title: 'השדה המושרה נוצר ממטענים, וקוויו מתחילים ונגמרים'
  belief: 'גם השדה החשמלי המושרה נוצר ממטענים (למשל מטענים שמצטברים בלולאה), ולכן קוויו יוצאים ממטען חיובי ונכנסים למטען שלילי, או מצביעים מהציר החוצה.'
  truth: 'השדה החשמלי המושרה נוצר מהשינוי של השדה המגנטי, לא ממטענים. קוויו סגורים: מעגלים סביב הציר של הסליל, בלי התחלה ובלי סוף.'
  remedy: { lesson: '5.7', anchor: fig-5-7a, label: 'איור 5.7א: התצוגה "קווי שדה", מעגלים סגורים סביב הציר' }

- id: MC-induced-field-needs-loop
  title: 'השדה המושרה קיים רק בתוך תיל'
  belief: 'שדה חשמלי מושרה נוצר רק בתוך תיל או לולאה מוליכה. בלי לולאה אין שדה.'
  truth: 'השדה המושרה קיים בכל המרחב סביב השדה המגנטי המשתנה, גם בריק, גם כשאין שם שום לולאה. לולאה מוליכה רק מאפשרת לו להניע זרם, וחרוז טעון בצינור מבודד מראה אותו בלי שום תיל.'
  remedy: { lesson: '5.7', anchor: fig-5-7a, label: 'איור 5.7א: החיצים מצוירים בכל מקום, לא רק על הלולאה' }

- id: MC-induced-field-zero-outside
  title: 'מחוץ לליבה, שם אין שדה מגנטי, אין גם שדה חשמלי מושרה'
  belief: 'השדה החשמלי המושרה קיים רק במקום שבו השדה המגנטי משתנה. מחוץ לליבה של סליל, שם B = 0, גם השדה החשמלי אפס, ולכן לולאה שמקיפה את הסליל מבחוץ לא מקבלת כא"מ.'
  truth: 'מחוץ לליבה השדה החשמלי המושרה לא אפס: הוא יורד כמו 1/r. לולאה שמקיפה את הליבה מקבלת כא"מ, אף שאין שדה מגנטי במקום שבו נמצא התיל שלה: הכא"מ תלוי בשינוי השטף דרך הלולאה כולה.'
  remedy: { lesson: '5.7', anchor: fig-5-7a, label: 'איור 5.7א: לולאה גדולה שמקיפה את הליבה, והחיצים שמחוץ לליבה' }

- id: MC-induced-emf-grows-with-loop
  title: 'לולאה גדולה יותר סביב הליבה מקבלת כא"מ גדול יותר'
  belief: 'הכא"מ בלולאה שמקיפה סליל גדל עם השטח של הלולאה, גם כשהלולאה כבר מקיפה את כל הליבה.'
  truth: 'השטף עובר רק דרך הליבה. כל לולאה שמקיפה את כל הליבה מקיפה אותו שטף, ולכן הכא"מ זהה: πa²·ΔB/Δt. בלולאה גדולה השדה עליה חלש יותר, אבל היא ארוכה יותר, והמכפלה לא משתנה.'
  remedy: { lesson: '5.7', anchor: fig-5-7a, label: 'איור 5.7א: הגדילו את הלולאה מעבר לליבה, וקראו את הכא"מ' }

- id: MC-induced-field-conservative
  title: 'גם בשדה המושרה העבודה במסלול סגור אפס'
  belief: 'כמו בכל שדה חשמלי, העבודה של השדה המושרה על מטען שחוזר לנקודת ההתחלה היא אפס, ולכן אפשר להגדיר לו פוטנציאל ומתח בין כל שתי נקודות.'
  truth: 'העבודה ליחידת מטען סביב לולאה שהשטף דרכה משתנה היא הכא"מ, והוא לא אפס. השדה המושרה הוא שדה לא משמר: העבודה בין שתי נקודות תלויה במסלול, ואין לו פוטנציאל. רק השדה האלקטרוסטטי, של מטענים במנוחה, משמר (שיעור 2.1).'
  remedy: { lesson: '5.7', anchor: fig-5-7a, label: 'איור 5.7א: שחררו חרוז טעון על לולאה שמקיפה את הליבה, וספרו סיבובים' }

- id: MC-induced-direction-follows-b
  title: 'כיוון השדה המושרה נקבע רק לפי כיוון השדה המגנטי'
  belief: 'כיוון השדה החשמלי המושרה נקבע לפי כיוון השדה המגנטי בלבד: למשל, שדה ⊗ תמיד יוצר שדה חשמלי נגד כיוון השעון.'
  truth: 'הכיוון נקבע לפי השינוי: לפי חוק לנץ, הזרם שהשדה המושרה היה מניע מתנגד לשינוי בשטף. שדה ⊗ שגדל ושדה ⊗ שקטן יוצרים שדות מושרים הפוכים; שדה ⊙ שגדל ושדה ⊗ שקטן יוצרים אותו כיוון, עם כיוון השעון.'
  remedy: { lesson: '5.7', anchor: fig-5-7a, label: 'איור 5.7א: הפכו את כיוון השדה, ואחר כך את השינוי, ועקבו אחרי החיצים' }
