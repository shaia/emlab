# Misconceptions this lesson detects and remedies. Format and rules: see misconceptions/1-5.yaml.

- id: MC-rereading-best
  title: קריאה חוזרת היא הדרך הטובה ביותר ללמוד
  belief: כדי לזכור חומר כדאי לקרוא אותו שוב ושוב, עד שהוא נראה מוכר.
  truth: ניסיון להיזכר, למשל לענות על שאלות בלי להציץ, משאיר יותר בזיכרון לאורך זמן מקריאה חוזרת, גם כשהוא מרגיש קשה יותר. תחושת ההיכרות מטעה.
  remedy: { lesson: '0.1', anchor: why, label: 'שיעור 0.1: למה הספר בנוי כך' }

- id: MC-wrong-prediction-wasted
  title: חיזוי שגוי הוא כישלון
  belief: חיזוי שהתברר כשגוי הוא בזבוז זמן, או שהוא מוריד ציון.
  truth: אין ציון על חיזוי. חיזוי שגוי שבודקים מיד מול הניסוי מראה בדיוק איזה רעיון צריך לתקן, ושם הלמידה קורית.
  remedy: { lesson: '0.1', anchor: why, label: 'שיעור 0.1: למה מנחשים לפני ההסבר' }

- id: MC-confidence-irrelevant
  title: הסימון בטוחים / לא בטוחים לא משנה
  belief: אפשר לסמן תמיד "בטוחים" (או תמיד "לא בטוחים"); זה לא משפיע על כלום.
  truth: טעות בביטחון היא סימן לתפיסה שגויה, וטעות בלי ביטחון היא חור בידע. הקורס מבחין ביניהן רק אם הסימון כנה.
  remedy: { lesson: '0.1', anchor: confidence, label: 'שיעור 0.1: בטוחים, או לא בטוחים?' }

- id: MC-sim-proves
  title: הסימולציה מוכיחה את החוק
  belief: מה שרואים באיור חי הוא הוכחה לחוק הפיזיקלי, כי מחשב לא טועה.
  truth: האיור מחשב לפי חוק שכבר הכניסו לתוכו, ולכן הוא מראה רק מה החוק צופה. הוא עוזר לפתח אינטואיציה; ההוכחה באה מניסוי אמיתי ומפיתוח.
  remedy: { lesson: '0.1', anchor: why, label: 'שיעור 0.1: מה איור חי יכול להראות' }
