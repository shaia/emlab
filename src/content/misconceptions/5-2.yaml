# Lesson 5.2 misconceptions. Each is detected by a tagged distractor in questions/ch5/5-2.yaml.

- id: MC-faraday-field-not-change
  title: 'שדה מגנטי דרך סליל מספיק כדי ליצור זרם'
  belief: 'מגנט חזק שמונח בתוך סליל, או זרם קבוע בסליל סמוך, משרה בסליל זרם כל עוד הוא שם, וזרם גדול יותר ככל שהשדה חזק יותר.'
  truth: 'כא"מ מושרה נוצר רק כשהשטף דרך הסליל משתנה. מגנט במנוחה בתוך הסליל, חזק ככל שיהיה, נותן שטף גדול אבל קבוע, והכא"מ אפס. המחוג זז רק כשמזיזים את המגנט, או כשהזרם בסליל הסמוך נדלק, נכבה או משתנה.'
  remedy: { lesson: '5.2', anchor: fig-5-2a, label: 'איור 5.2א: הכניסו את המגנט לסליל ועזבו אותו שם, וצפו במחוג ובגרף של ε' }

- id: MC-faraday-emf-follows-flux
  title: 'הכא"מ הכי גדול כשהשטף הכי גדול'
  belief: 'הכא"מ המושרה פרופורציוני לשטף עצמו: היכן שהשטף (או גובה הגרף של Φ) הכי גדול, שם הכא"מ הכי גדול, ושטף אפס פירושו כא"מ אפס.'
  truth: 'הכא"מ תלוי בקצב השינוי של השטף, ε = −N·ΔΦ/Δt: בגרף של Φ(t) הוא מינוס N כפול השיפוע, לא הגובה. כשהשטף הכי גדול ולא משתנה, הכא"מ אפס. ברגע שבו השטף עובר דרך אפס תוך כדי שינוי, הכא"מ יכול להיות הגדול ביותר.'
  remedy: { lesson: '5.2', anchor: fig-5-2b, label: 'איור 5.2ב: עצרו את הגרף והזיזו את הסמן; השוו את השיפוע של Φ לכא"מ' }

- id: MC-faraday-change-not-rate
  title: 'הכא"מ תלוי רק בכמה השטף השתנה, לא בכמה מהר'
  belief: 'אם השטף משתנה באותה כמות, הכא"מ המושרה זהה, בין שהשינוי לקח עשירית שנייה ובין שלקח שנייה.'
  truth: 'הכא"מ הוא קצב השינוי: אותו ΔΦ בזמן קצר פי 3 נותן כא"מ גדול פי 3. מה שלא תלוי במהירות הוא המטען שעובר במעגל (שיעור 5.6), לא הכא"מ.'
  remedy: { lesson: '5.2', anchor: fig-5-2a, label: 'איור 5.2א: הכניסו את המגנט פעם ב-0.6 שניות ופעם ב-0.2 שניות, והשוו את הממוצע −NΔΦ/Δt' }

- id: MC-faraday-ignore-turns
  title: 'מספר הכריכות לא משנה את הכא"מ'
  belief: 'הכא"מ המושרה בסליל שווה לזה שבכריכה אחת, או שהכריכות הנוספות מגדילות את השטף דרך כל כריכה.'
  truth: 'כל כריכה היא לולאה שבה נוצר כא"מ ΔΦ/Δt, והכריכות מחוברות בטור, כמו סוללות בטור, ולכן הכא"מ גדל פי N. השטף דרך כל כריכה לא משתנה כשמוסיפים כריכות.'
  remedy: { lesson: '5.2', anchor: fig-5-2a, label: 'איור 5.2א: הכפילו את N והכניסו את המגנט שוב' }

- id: MC-faraday-sign-follows-flux
  title: 'הסימן של הכא"מ הוא הסימן של השטף או של השינוי'
  belief: 'כששטף חיובי גדל, גם הכא"מ חיובי; או: הסימן של ε נקבע לפי הסימן של Φ, ושוכחים את המינוס בחוק פאראדיי.'
  truth: 'לפי ε = −N·ΔΦ/Δt, הכא"מ מנוגד בסימנו לשינוי בשטף: כשהשטף לאורך האנך גדל, ε שלילי, והזרם זורם נגד הכיוון החיובי. הסימן של Φ עצמו לא קובע דבר.'
  remedy: { lesson: '5.2', anchor: fig-5-2b, label: 'איור 5.2ב: הפכו את האנך, וצפו בסימנים של Φ ושל ε ובמחוג' }
