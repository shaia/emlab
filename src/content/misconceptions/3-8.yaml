# Lesson 3.8 misconceptions. Each is detected by a tagged distractor in questions/ch3/3-8.yaml.

- id: MC-junction-equal-split
  title: בצומת הזרם מתפצל שווה בשווה
  belief: זרם שמגיע לצומת מתחלק תמיד חצי-חצי בין שני הענפים שיוצאים ממנו.
  truth: חוק הצמתים קובע רק שהסכום נשמר. איך הזרם מתחלק נקבע לפי הענפים, ובענפים שעליהם אותו מתח הזרם מתחלק ביחס הפוך להתנגדויות.
  remedy: { lesson: '3.8', anchor: fig-3-8a, label: 'איור 3.8א: השוו את הזרמים בשלושת מדי הזרם' }

- id: MC-negative-current-mistake
  title: זרם שלילי הוא טעות בחישוב
  belief: אם בפתרון של משוואות קירכהוף יוצא זרם שלילי, טעיתי איפשהו.
  truth: את כיוון הזרם בכל ענף בוחרים מראש, לפעמים לא נכון. זרם שלילי אומר שהזרם האמיתי זורם בכיוון ההפוך לזה שבחרנו, והגודל שלו נכון.
  remedy: { lesson: '3.8', anchor: solve, label: 'שיעור 3.8: "פותרים מעגל עם שתי סוללות"' }

- id: MC-loop-all-add
  title: בלולאה כל המתחים מתחברים
  belief: במשוואת לולאה מחברים את כל המתחים, של הסוללות ושל הנגדים, עם סימן פלוס.
  truth: 'לכל שינוי בפוטנציאל יש סימן: עוברים סוללה מ-− ל-+, הפוטנציאל עולה (+ε); עוברים נגד בכיוון הזרם, הוא יורד (−IR). הסכום של כל השינויים בלולאה הוא אפס.'
  remedy: { lesson: '3.8', anchor: fig-3-8a, label: 'איור 3.8א: עקבו אחרי גרף הגובה של לולאה' }

- id: MC-battery-always-delivers
  title: כל סוללה במעגל מספקת אנרגיה
  belief: בכל סוללה במעגל, הזרם יוצא מההדק החיובי והסוללה נותנת אנרגיה.
  truth: כשיש במעגל כמה סוללות, אחת מהן יכולה לקבל זרם שנכנס להדק החיובי שלה. אז היא מקבלת אנרגיה במקום לתת, כמו מצבר שנטען.
  remedy: { lesson: '3.8', anchor: fig-3-8a, label: 'איור 3.8א: הסתכלו על כיוון הזרם ב-ε₂, ושנו את הכא"מ שלה' }
