# Lesson 4.9 misconceptions. Each is detected by a tagged distractor in questions/ch4/4-9.yaml.

- id: MC-like-currents-repel
  title: זרמים באותו כיוון דוחים זה את זה
  belief: 'כמו מטענים, "דומים נדחים": שני תילים שהזרמים בהם באותו כיוון דוחים זה את זה, וזרמים בכיוונים מנוגדים מושכים.'
  truth: 'בדיוק הפוך ממטענים. השדה של תיל 1 במקום תיל 2 ניצב לתיל, וכלל כף יד ימין נותן כוח לעבר תיל 1 כשהזרמים באותו כיוון. זרמים באותו כיוון נמשכים, וזרמים בכיוונים מנוגדים נדחים.'
  remedy: { lesson: '4.9', anchor: fig-4-9a, label: 'איור 4.9א: הפכו את הזרם בתיל 2 וראו את הכוחות מתהפכים' }

- id: MC-larger-current-larger-force
  title: הזרם הגדול מפעיל כוח גדול יותר
  belief: 'כשבתיל אחד זרם גדול ובשני זרם קטן, התיל עם הזרם הגדול מפעיל על השני כוח גדול יותר ממה שהוא מקבל.'
  truth: 'הכוח F/L = μ₀I₁I₂/(2πd) תלוי במכפלה של שני הזרמים, ולכן הוא שווה על שני התילים: התיל עם הזרם הגדול יוצר שדה חזק, אבל הזרם שעליו השדה הזה פועל קטן, ולהפך. זה החוק השלישי של ניוטון.'
  remedy: { lesson: '4.9', anchor: fig-4-9a, label: 'איור 4.9א: קבעו זרמים שונים והשוו את שני חיצי הכוח' }

- id: MC-wires-attract-charged
  title: התילים נמשכים כי הם טעונים
  belief: 'תילים עם זרם נמשכים או נדחים בגלל כוח חשמלי: יש עליהם מטען, כמו על מוטות שחוככו.'
  truth: 'תיל שזורם בו זרם נשאר ניטרלי: בכל קטע שלו יש בדיוק אותו מספר של אלקטרונים חופשיים ושל יונים חיוביים. הכוח בין התילים מגנטי. העדות: כשהופכים את הזרם באחד התילים, הכוח מתהפך, וכשמפסיקים את הזרם, הכוח נעלם.'
  remedy: { lesson: '4.9', anchor: not-electric, label: 'שיעור 4.9: "למה זה לא כוח חשמלי"' }

- id: MC-wire-own-field-force
  title: התיל נדחף בשדה של עצמו
  belief: 'כדי למצוא את הכוח על תיל 2, משתמשים בשדה שתיל 2 עצמו יוצר, או בשדה הכולל של שני התילים במקום תיל 2.'
  truth: 'השדה של תיל לא מפעיל כוח שקול על התיל עצמו. על תיל 2 פועל רק השדה של התילים האחרים במקום שבו הוא נמצא: F₂ = B₁I₂L.'
  remedy: { lesson: '4.9', anchor: fig-4-9a, label: 'איור 4.9א: הדליקו "רק השדה של תיל 1" וראו מה דוחף את תיל 2' }

- id: MC-parallel-wires-inverse-square
  title: הכוח בין תילים יורד כמו 1/d²
  belief: 'כמו בחוק קולון, כשמכפילים את המרחק בין שני תילים, הכוח ביניהם קטן פי 4.'
  truth: 'הכוח ליחידת אורך הוא μ₀I₁I₂/(2πd): הוא יורד כמו 1/d, כי השדה של תיל ארוך יורד כמו 1/r. במרחק כפול הכוח קטן פי 2.'
  remedy: { lesson: '4.9', anchor: fig-4-9a, label: 'איור 4.9א: הגדילו את המרחק פי 2 וקראו את הכוח' }
