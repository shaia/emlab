# Lesson 4.4 misconceptions. Each is detected by a tagged distractor in questions/ch4/4-4.yaml.

- id: MC-ampere-zero-enclosed-zero-field
  title: 'אם הזרם הכלוא אפס, השדה על המסלול אפס'
  belief: 'כשמסלול סגור לא מקיף שום זרם (או מקיף זרמים שמתקזזים), השדה המגנטי בכל נקודה על המסלול הוא אפס.'
  truth: 'חוק אמפר אומר שהסכום B∥·Δℓ סביב המסלול אפס, לא שהשדה אפס. בחלק מהמסלול B∥ חיובי ובחלק שלילי, והתרומות מתקזזות.'
  remedy: { lesson: '4.4', anchor: fig-4-4a, label: 'איור 4.4א: הזיזו את המסלול כך שלא יקיף זרם, והסתכלו על החיצים לאורכו' }

- id: MC-ampere-outside-currents-count
  title: 'זרם מחוץ למסלול משנה את הסכום'
  belief: 'זרם שעובר מחוץ למסלול הסגור משנה את הסכום B∥·Δℓ סביב המסלול, כי הוא משנה את השדה על המסלול.'
  truth: 'זרם חיצוני משנה את השדה בנקודות של המסלול, אבל התרומה שלו לסכום מתקזזת סביב המסלול. הסכום תלוי רק בזרם הכלוא.'
  remedy: { lesson: '4.4', anchor: fig-4-4a, label: 'איור 4.4א: שני תילים, מעגל סביב התיל השמאלי בלבד' }

- id: MC-ampere-bigger-path-bigger-sum
  title: 'מסלול גדול יותר נותן סכום גדול יותר (או קטן יותר)'
  belief: 'הסכום B∥·Δℓ סביב תיל תלוי בגודל המסלול, כי מסלול ארוך יותר מכיל יותר קטעים, או כי רחוק מהתיל השדה חלש.'
  truth: 'השדה של תיל חלש כמו 1/r, וההיקף גדל כמו r. המכפלה B·2πr = μ₀I לא תלויה ברדיוס, ולמעשה הסכום לא תלוי בשום דבר בצורת המסלול, רק בזרם הכלוא.'
  remedy: { lesson: '4.4', anchor: fig-4-4a, label: 'איור 4.4א: הגדילו והקטינו את המעגל סביב התיל' }

- id: MC-ampere-always-gives-field
  title: 'מחלקים את הסכום באורך המסלול ומקבלים את השדה'
  belief: 'בכל מקרה, השדה על מסלול סגור הוא μ₀I חלקי אורך המסלול.'
  truth: 'החלוקה נותנת את השדה רק כשהשדה שווה בגודלו בכל נקודה על המסלול ומשיק לו, כלומר כשיש סימטריה (תיל ישר לבד, סליל ארוך). כשיש עוד תילים, או מסלול בצורה כלשהי, החלוקה נותנת רק ממוצע של B∥.'
  remedy: { lesson: '4.4', anchor: fig-4-4a, label: 'איור 4.4א: שני תילים, וחיצי השדה הלא שווים על המעגל' }

- id: MC-thick-wire-max-at-axis
  title: 'בתיל עבה השדה חזק ביותר על הציר'
  belief: 'בתוך תיל עבה השדה המגנטי חזק ביותר במרכז, כמו שליד תיל דק הוא חזק ביותר קרוב לתיל.'
  truth: 'על הציר השדה אפס: מעגל ברדיוס אפס לא מקיף זרם. בפנים השדה גדל כמו r, כי המעגל מקיף חלק גדל מהזרם, והוא הגדול ביותר על פני התיל. בחוץ הוא יורד כמו 1/r.'
  remedy: { lesson: '4.4', anchor: fig-4-4a, label: 'איור 4.4א: בתיל העבה, גררו את הגשש מהציר אל פני התיל והחוצה' }
