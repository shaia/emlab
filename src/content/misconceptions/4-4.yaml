# Lesson 4.4 misconceptions. Each is detected by a tagged distractor in questions/ch4/4-4.yaml.

- id: MC-magnetic-force-along-field
  title: הכוח המגנטי פועל בכיוון השדה
  belief: כמו בשדה חשמלי, הכוח המגנטי על מטען מצביע בכיוון השדה המגנטי (או נגדו).
  truth: 'הכוח המגנטי ניצב לשדה וגם למהירות. כיוונו נקבע בכלל כף יד ימין: האצבעות בכיוון השדה, האגודל בכיוון המהירות, והכוח יוצא מכף היד. לאורך השדה עצמו אין לכוח רכיב כלל.'
  remedy: { lesson: '4.4', anchor: fig-4-4a, label: 'איור 4.4א: סובבו את זווית ההסתכלות וראו שהכוח ניצב לשדה' }

- id: MC-magnetic-force-at-rest
  title: שדה מגנטי מפעיל כוח על מטען במנוחה
  belief: מטען שנמצא בשדה מגנטי מרגיש כוח גם כשהוא לא זז, למשל נמשך לאחד הקטבים.
  truth: 'הכוח המגנטי הוא F = qvB·sinα. כשהמהירות אפס, גם הכוח אפס. רק שדה חשמלי מפעיל כוח על מטען במנוחה.'
  remedy: { lesson: '4.4', anchor: fig-4-4a, label: 'איור 4.4א: הורידו את המהירות לאפס' }

- id: MC-magnetic-force-does-work
  title: הכוח המגנטי מאיץ את המטען
  belief: הכוח המגנטי עושה עבודה על המטען, ולכן מגדיל (או מקטין) את גודל המהירות ואת האנרגיה הקינטית שלו.
  truth: 'הכוח המגנטי ניצב למהירות בכל רגע, ולכן העבודה שלו אפס. הוא משנה רק את כיוון התנועה, וגודל המהירות והאנרגיה הקינטית נשארים קבועים.'
  remedy: { lesson: '4.4', anchor: fig-4-4b, label: 'איור 4.4ב: השוו את מהירות היציאה בשדה מגנטי ובשדה חשמלי' }

- id: MC-magnetic-force-sign-blind
  title: מטען שלילי מקבל כוח באותו כיוון
  belief: הכיוון של הכוח המגנטי נקבע רק לפי השדה והמהירות, ולכן אלקטרון ופרוטון שנעים באותו כיוון מקבלים כוח לאותו צד.
  truth: 'כלל כף יד ימין נותן את כיוון הכוח על מטען חיובי. על מטען שלילי שנע באותו כיוון הכוח בכיוון ההפוך, ולכן אלקטרון ופרוטון מתעקמים לצדדים מנוגדים.'
  remedy: { lesson: '4.4', anchor: fig-4-4a, label: 'איור 4.4א: החליפו בין פרוטון לאלקטרון' }

- id: MC-magnetic-force-max-parallel
  title: הכוח המגנטי הגדול ביותר כשהמטען נע לאורך השדה
  belief: מטען שנע בכיוון השדה המגנטי "נדחף" ממנו הכי חזק, כמו בשדה חשמלי.
  truth: 'הכוח פרופורציוני ל-sinα: הוא הגדול ביותר כשהמהירות ניצבת לשדה, α = 90°, ואפס כשהמטען נע לאורך השדה.'
  remedy: { lesson: '4.4', anchor: fig-4-4a, label: 'איור 4.4א: שנו את הזווית α מ-90° עד 0°' }
