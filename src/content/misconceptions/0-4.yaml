# Misconceptions this lesson detects and remedies. Format and rules: see misconceptions/1-5.yaml.

- id: MC-linear-means-proportional
  title: כל קו ישר הוא יחס ישר
  belief: אם הגרף הוא קו ישר, הכפלת x מכפילה גם את y.
  truth: יחס ישר הוא רק קו ישר שעובר בראשית. קו ישר שחותך את הציר האנכי במקום אחר הוא קשר קווי, y = ax + b, וכשמכפילים את x רק החלק ax מוכפל.
  remedy: { lesson: '0.4', anchor: fig-0-4a, label: 'איור 0.4א: הקפיץ, שהקו שלו לא עובר בראשית' }

- id: MC-slope-from-data-points
  title: את השיפוע מחשבים מנקודות המדידה
  belief: את השיפוע מחשבים משתי מדידות מהטבלה, או כמנה y/x של נקודה אחת.
  truth: מחשבים משתי נקודות על הקו המתאים ביותר, רחוקות זו מזו. הקו כבר שקלל את השגיאות של כל המדידות. המנה y/x של נקודה אחת שווה לשיפוע רק כשהקו עובר בראשית.
  remedy: { lesson: '0.4', anchor: fig-0-4a, label: 'איור 0.4א: הניחו סרגל על הנקודות' }

- id: MC-slope-no-units
  title: לשיפוע אין יחידות
  belief: שיפוע הוא רק מספר, ואפשר לכתוב אותו בלי יחידות.
  truth: לשיפוע יש יחידות של y חלקי יחידות של x, והן אומרות איזה גודל פיזיקלי הוא מייצג. שיפוע של d מול t² הוא ב-m/s², כמו תאוצה.
  remedy: { lesson: '0.4', anchor: fig-0-4a, label: 'איור 0.4א: השיפוע ויחידותיו' }

- id: MC-curve-means-no-law
  title: עקומה פירושה שאין חוק, או שהמדידה שגויה
  belief: אם הנקודות לא על קו ישר, אין ביניהן קשר פשוט, או שמשהו בניסוי השתבש.
  truth: הרבה חוקים פשוטים נותנים עקומה, למשל d = ½gt². ליניאריזציה מוצאת מה לשים על הצירים כדי שהעקומה תהפוך לקו ישר.
  remedy: { lesson: '0.4', anchor: fig-0-4b, label: 'איור 0.4ב: הנפילה החופשית מול t ומול t²' }

- id: MC-decreasing-means-inverse
  title: גודל שקטן פירושו יחס הפוך
  belief: אם F קטן כשמגדילים את r, אז F ביחס הפוך ל-r, וגרף של F מול 1/r יהיה קו ישר.
  truth: גודל שקטן כש-r גדל יכול להתנהג כמו 1/r, כמו 1/r² או אחרת. רק הגרף מכריע. בכוח בין שני מטענים, הקו הישר מתקבל מול 1/r².
  remedy: { lesson: '0.4', anchor: fig-0-4b, label: 'איור 0.4ב: הכדורים הטעונים מול 1/r ומול 1/r²' }
