# Lesson 3.2 misconceptions. Each is detected by a tagged distractor in questions/ch3/3-2.yaml.

- id: MC-current-used-up
  title: הנורה צורכת זרם
  belief: חלק מהזרם "נצרך" בנורה, ולכן אחרי הנורה הזרם קטן יותר מאשר לפניה.
  truth: המטען נשמר, ובמצב יציב כמה מטען שנכנס לנורה בכל שנייה, אותו מטען יוצא ממנה. הזרם לפני הנורה ואחריה שווה. מה שהנורה צורכת הוא אנרגיה, W = qV, לא מטען.
  remedy: { lesson: '3.2', anchor: fig-3-2b, label: 'איור 3.2ב: סגרו את המפסק והשוו את שני מדי הזרם' }

- id: MC-electrons-fast
  title: האלקטרונים טסים מהסוללה לנורה
  belief: הנורה נדלקת מיד כי האלקטרונים עוברים את התיל במהירות עצומה, אולי במהירות האור.
  truth: האלקטרונים נסחפים לאט מאוד, בערך עשירית מילימטר בשנייה. הנורה נדלקת מיד כי התיל כבר מלא באלקטרונים חופשיים, והשדה שמניע אותם נוצר בכל המעגל כמעט בבת אחת.
  remedy: { lesson: '3.2', anchor: fig-3-2a, label: 'איור 3.2א: קראו כמה זמן לוקח לאלקטרון לעבור מטר אחד' }

- id: MC-electron-direction
  title: הזרם זורם לכיוון שבו נעים האלקטרונים
  belief: כיוון הזרם במעגל הוא הכיוון שבו נעים האלקטרונים, מההדק השלילי אל החיובי.
  truth: כיוון הזרם המוסכם הוא הכיוון שבו היה נע מטען חיובי, מההדק החיובי אל השלילי במעגל החיצוני. האלקטרונים, שהם שליליים, נעים בכיוון ההפוך. שני התיאורים נותנים אותו זרם.
  remedy: { lesson: '3.2', anchor: fig-3-2b, label: 'איור 3.2ב: הראו את האלקטרונים והשוו לחצים הצהובים' }

- id: MC-current-plus-to-minus-inside
  title: הזרם זורם מפלוס למינוס גם בתוך הסוללה
  belief: הזרם תמיד זורם מההדק החיובי אל השלילי, גם בתוך הסוללה.
  truth: 'הזרם זורם במעגל סגור, באותו כיוון לאורך כל הלולאה. במעגל החיצוני הוא זורם מהחיובי אל השלילי, ולכן בתוך הסוללה הוא זורם מהשלילי אל החיובי: שם הסוללה "מרימה" את המטען.'
  remedy: { lesson: '3.2', anchor: fig-3-2b, label: 'איור 3.2ב: עקבו אחרי החצים הצהובים דרך הסוללה' }

- id: MC-bulbs-light-in-turn
  title: הנורה הקרובה לסוללה נדלקת קודם
  belief: כשסוגרים מעגל עם כמה נורות, הזרם מגיע קודם לנורה הקרובה להדק החיובי, ורק אחר כך לאחרות.
  truth: השדה שמניע את המטען נוצר בכל המעגל כמעט במהירות האור, וכל האלקטרונים החופשיים, בכל התילים ובכל הנורות, מתחילים לנוע כמעט באותו רגע. כל הנורות נדלקות יחד.
  remedy: { lesson: '3.2', anchor: at-once, label: 'שיעור 3.2: "לאט, ובכל זאת מיד"' }
