# Lesson 5.5 misconceptions. Each is detected by a tagged distractor in questions/ch5/5-5.yaml.
# MC-rail-incline-full-field moved here from 5-4.yaml with the incline (ids are global and keep their names).

- id: MC-rail-incline-full-field
  title: 'במדרון עם שדה אנכי מציבים את כל B'
  belief: 'כשהמסילות משופעות והשדה אנכי, הכא"מ הוא BLv והכוח הבולם הוא B²L²v/R, בדיוק כמו במסילות אופקיות.'
  truth: 'רק הרכיב של השדה שניצב למישור המסילות, B·cosα, עובר דרך המעגל ויוצר כא"מ, ולכן ε = BLv·cosα. גם הכוח המגנטי, שהוא אופקי, בולם רק ברכיב שלו לאורך המסילות, ולכן v_T = mgR·sinα/(B²L²cos²α).'
  remedy: { lesson: '5.5', anchor: incline-vertical, label: 'שדה אנכי במדרון: כמה מהשדה עובר דרך המעגל' }

- id: MC-rail-mass-never-matters
  title: 'המהירות הסופית של מוט לא תלויה במסה שלו, אף פעם'
  belief: 'בשיעור 5.4 המסה לא שינתה את המהירות הסופית, ולכן גם מוט כבד יותר שמחליק במדרון או נופל בין מסילות אנכיות מגיע לאותה מהירות סופית.'
  truth: 'בשיעור 5.4 הכוח המושך היה קבוע, ולא תלוי במסה. כשהכובד מניע את המוט, הכוח המניע mg·sinα גדל עם המסה, והכוח הבולם B²L²v/R לא תלוי בה: מוט כבד פי 2 מגיע למהירות סופית גדולה פי 2.'
  remedy: { lesson: '5.5', anchor: fig-5-5a, label: 'איור 5.5: במסילות האנכיות הכפילו את מסת המוט' }

- id: MC-rail-falls-like-free-fall
  title: 'מוט שנופל בין מסילות אנכיות נופל חופשית'
  belief: 'השדה המגנטי לא משפיע על נפילה: מוט שנופל בין מסילות אנכיות בשדה נופל בתאוצה g כל הזמן, כמו כל גוף אחר.'
  truth: 'רק ברגע הראשון, במנוחה, אין זרם והתאוצה g. ככל שהמוט מהיר יותר, הזרם המושרה והכוח הבולם, כלפי מעלה, גדלים, והתאוצה קטנה עד שהמוט נופל במהירות קבועה mgR/(B²L²), כמו צנחן. אם המעגל פתוח, אין זרם, והמוט אכן נופל חופשית.'
  remedy: { lesson: '5.5', anchor: fig-5-5a, label: 'איור 5.5: במסילות האנכיות השוו את הגרף לקו של נפילה חופשית' }

- id: MC-rail-pulley-rod-mass-only
  title: 'במוט שמשקולת מושכת, החוק השני של ניוטון כולל רק את מסת המוט'
  belief: 'כשמשקולת M תלויה על חוט שעובר מעל גלגלת ומושכת את המוט, הכוח המניע Mg מאיץ רק את המוט, ולכן ברגע הראשון a = Mg/m.'
  truth: 'המוט והמשקולת נעים יחד, באותה מהירות ובאותה תאוצה, ו-Mg מאיץ את שניהם: (m + M)·a = Mg − B²L²v/R. ברגע הראשון a = Mg/(m + M). המסה של המוט לא משנה את המהירות הסופית MgR/(B²L²), רק כמה זמן לוקח להגיע אליה.'
  remedy: { lesson: '5.5', anchor: pulley, label: 'משקולת שמושכת את המוט: החוק השני של ניוטון למערכת כולה' }

- id: MC-rail-field-supplies-energy
  title: 'את החום בנגד מספק המגנט'
  belief: 'כשמוט נופל במהירות קבועה בשדה מגנטי ומחמם את הנגד, האנרגיה באה מהמגנט או מהשדה, שהולך ונחלש.'
  truth: 'המהירות קבועה, ולכן האנרגיה הקינטית לא משתנה; המוט מאבד אנרגיה פוטנציאלית בקצב mgv, וזה בדיוק ההספק בנגד, I²R. את העבודה עושה הכובד. השדה רק מעביר את האנרגיה מהתנועה לזרם, והוא לא נחלש.'
  remedy: { lesson: '5.5', anchor: energy, label: 'מי עושה את העבודה: הכובד, לא השדה' }
