# Lesson 5.5 misconceptions. Each is detected by a tagged distractor in questions/ch5/5-5.yaml.

- id: MC-graph-emf-peak-at-flux-peak
  title: 'הכא"מ הכי גדול כשהשטף הכי גדול'
  belief: 'הכא"מ המושרה גדל עם השטף, ולכן ברגע שבו השטף דרך הלולאה בשיא, גם הכא"מ בשיא.'
  truth: 'הכא"מ תלוי בקצב שבו השטף משתנה, כלומר בשיפוע של גרף Φ(t). בשיא של השטף המשיק אופקי, השיפוע אפס, ולכן הכא"מ אפס. הכא"מ הכי גדול במקומות שבהם הגרף הכי תלול.'
  remedy: { lesson: '5.5', anchor: fig-5-5b, label: 'איור 5.5ב, מגנט עובר בסליל: הזיזו את הסמן לשיא של השטף' }

- id: MC-graph-no-emf-at-zero-flux
  title: 'כשהשטף אפס, אין כא"מ'
  belief: 'ברגע שבו השטף דרך הלולאה אפס אין כא"מ מושרה, כי אין שטף שיכול להשתנות.'
  truth: 'הכא"מ תלוי בשיפוע של Φ(t), לא בערך שלו. שטף שעובר דרך אפס בקו ישר משתנה באותו קצב גם ברגע הזה, ולכן הכא"מ שם שווה לכא"מ בכל הקטע.'
  remedy: { lesson: '5.5', anchor: fig-5-5b, label: 'איור 5.5ב: בגרף השטף, בקטע שעובר דרך אפס, הכא"מ לא משתנה' }

- id: MC-graph-current-follows-field-sign
  title: 'כשהשדה מתהפך, גם הזרם המושרה מתהפך'
  belief: 'הזרם המושרה בלולאה זורם בכיוון אחד כל עוד השדה בכיוון אחד, ומחליף כיוון ברגע שהשדה מחליף כיוון.'
  truth: 'כיוון הזרם נקבע לפי הסימן של קצב השינוי של השטף, לא לפי הסימן של השדה. שדה שיורד בקו ישר, עובר דרך אפס וממשיך לרדת, משרה זרם קבוע בכיוון אחד לאורך כל הקטע.'
  remedy: { lesson: '5.5', anchor: fig-5-5b, label: 'איור 5.5ב, גרף של השדה: בנו את הכא"מ בקטע שבו השדה מתהפך' }

- id: MC-strip-current-inside-field
  title: 'לולאה שנעה בתוך שדה מגנטי, מושרה בה זרם'
  belief: 'כל עוד לולאה סגורה זזה בתוך שדה מגנטי נוצר בה זרם, גם כשהיא כולה בתוך שדה אחיד.'
  truth: 'כשהלולאה כולה בתוך השדה האחיד, השטף דרכה לא משתנה, ולכן אין כא"מ ואין זרם. בשתי הצלעות הניצבות לתנועה נוצרים כא"מים שווים שמבטלים זה את זה.'
  remedy: { lesson: '5.5', anchor: fig-5-5a, label: 'איור 5.5א: עצרו את הזמן כשהלולאה כולה בתוך השדה' }

- id: MC-strip-same-direction-out
  title: 'ביציאה מהשדה הזרם זורם באותו כיוון כמו בכניסה'
  belief: 'הלולאה נעה כל הזמן באותו כיוון ובאותו שדה, ולכן גם הזרם שמושרה ביציאה מהשדה זורם באותו כיוון כמו בכניסה.'
  truth: 'בכניסה השטף גדל, וביציאה הוא קטן. השיפוע של Φ(t) מחליף סימן, ולכן הכא"מ והזרם מתהפכים. במעבר שלם עובר בכל כיוון אותו מטען, והמטען נטו אפס.'
  remedy: { lesson: '5.5', anchor: fig-5-5a, label: 'איור 5.5א: העבירו את הלולאה מעבר שלם, והשוו את הזרם בכניסה וביציאה' }

- id: MC-charge-depends-on-speed
  title: 'דחיפה מהירה מעבירה יותר מטען'
  belief: 'אם מכניסים לולאה לשדה מהר יותר, הזרם גדול יותר, ולכן עובר בה יותר מטען. (או להפך: לאט יותר, הזרם זורם זמן רב יותר ועובר יותר מטען.)'
  truth: 'המטען שעובר הוא Q = N·ΔΦ/R. במהירות כפולה הזרם כפול, אבל הוא זורם חצי זמן, והשטח מתחת לגרף הזרם לא משתנה. המהירות משנה את הזרם ואת האנרגיה, לא את המטען.'
  remedy: { lesson: '5.5', anchor: fig-5-5c, label: 'איור 5.5ג: הכניסו את הלולאה בשתי מהירויות, והשוו את השטחים' }

- id: MC-strip-no-push-needed
  title: 'במהירות קבועה ובלי חיכוך, לא צריך לדחוף'
  belief: 'לולאה שנעה במהירות קבועה על משטח חלק ממשיכה לנוע לבד, גם כשהיא נכנסת לשדה מגנטי או יוצאת ממנו.'
  truth: 'בזמן הכניסה והיציאה זורם בלולאה זרם, ועל הצלע שבתוך השדה פועל כוח מגנטי שמתנגד לתנועה. כדי לשמור על מהירות קבועה צריך לדחוף בכוח שווה לו, והעבודה של הדחיפה הופכת לחום בלולאה. רק כשאין זרם, לא צריך לדחוף.'
  remedy: { lesson: '5.5', anchor: fig-5-5a, label: 'איור 5.5א: הציגו את הכוחות, ועקבו אחרי הדחיפה בכל שלב של המעבר' }
