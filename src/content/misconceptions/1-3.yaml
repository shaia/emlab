# Misconception register for lesson 1.3. Format and rules: see misconceptions/1-5.yaml.

- id: MC-coulomb-linear-in-r
  title: הכוח יורד כמו 1/r
  belief: במרחק כפול הכוח חלש פי 2.
  truth: הכוח בין מטענים נקודתיים יורד כמו 1/r². במרחק כפול הוא חלש פי 4, ובמרחק משולש פי 9.
  remedy: { lesson: '1.3', anchor: fig-1-3a, label: 'איור 1.3א: הכפילו את המרחק וקראו את הכוח' }

- id: MC-coulomb-bigger-charge-bigger-force
  title: המטען הגדול מקבל כוח גדול יותר
  belief: בין מטען גדול למטען קטן, המטען הגדול מפעיל כוח חזק יותר, או מקבל כוח חזק יותר.
  truth: הכוחות על שני המטענים שווים בגודלם ומנוגדים בכיוונם, לפי החוק השלישי של ניוטון. גודל המטען משפיע על שניהם באותה מידה.
  remedy: { lesson: '1.3', anchor: fig-1-3a, label: 'איור 1.3א: בחרו מטענים שונים מאוד והשוו את החצים' }

- id: MC-coulomb-signs-reversed
  title: מטענים שונים דוחים, מטענים זהים מושכים
  belief: מטענים מסימנים שונים דוחים זה את זה, ומטענים מאותו סימן נמשכים.
  truth: מטענים מאותו סימן דוחים, ומטענים מסימנים שונים מושכים.
  remedy: { lesson: '1.3', anchor: fig-1-3a, label: 'איור 1.3א: הפכו מטען לשלילי וראו את החצים מתהפכים' }

- id: MC-coulomb-negative-force-weaker
  title: כוח משיכה חלש מכוח דחייה
  belief: כשהמכפלה q₁q₂ שלילית הכוח "שלילי", ולכן קטן יותר.
  truth: הסימן קובע רק אם הכוח דוחה או מושך. הגודל נקבע על ידי ערכים מוחלטים, ולכן שני מטענים של 2 μC מפעילים אותו גודל כוח בין אם סימניהם זהים ובין אם שונים.
  remedy: { lesson: '1.3', anchor: fig-1-3a, label: 'איור 1.3א: הפכו מטען לשלילי וקראו את F' }

- id: MC-coulomb-add-charges
  title: הכוח תלוי בסכום המטענים
  belief: הכוח תלוי ב-q₁ + q₂, ולכן מטענים שסכומם אפס לא מפעילים כוח.
  truth: הכוח ביחס ישר למכפלה q₁q₂. הכפלת מטען אחד מכפילה את הכוח, והכפלת שניהם מכפילה אותו פי 4.
  remedy: { lesson: '1.3', anchor: fig-1-3a, label: 'איור 1.3א: הכפילו מטען אחד, ואחר כך את שניהם' }

- id: MC-electric-force-short-range
  title: הכוח החשמלי פועל רק קרוב
  belief: הכוח החשמלי נעלם במרחקים גדולים יותר מכמה סנטימטרים.
  truth: הכוח החשמלי יורד כמו 1/r² אבל לא מתאפס אף פעם. בגרף הוא מתקרב לציר ולא נוגע בו.
  remedy: { lesson: '1.3', anchor: fig-1-3b, label: 'איור 1.3ב: הגרף של F כתלות ב-r' }

- id: MC-gravity-stronger-than-electric
  title: הכבידה חזקה מהכוח החשמלי
  belief: הכבידה היא הכוח החזק ביותר, כי היא מחזיקה כוכבי לכת וגלקסיות.
  truth: >-
    בין שני חלקיקים הכוח החשמלי חזק פי 10³⁶ עד 10³⁹ מהכבידה. הכבידה שולטת בקנה מידה גדול כי גופים גדולים ניטרליים,
    ולכן המטענים מתקזזים, והמסות מצטברות.
  remedy: { lesson: '1.3', anchor: fig-1-3c, label: 'איור 1.3ג: ההפרש בין שני הקווים' }

- id: MC-electric-gravity-ratio-depends-on-r
  title: היחס בין החשמל לכבידה תלוי במרחק
  belief: אם מתרחקים מספיק, הכבידה תהיה חזקה מהכוח החשמלי.
  truth: שני הכוחות יורדים כמו 1/r², ולכן היחס ביניהם זהה בכל מרחק.
  remedy: { lesson: '1.3', anchor: fig-1-3c, label: 'איור 1.3ג: שני הקווים המקבילים' }
