# Lesson 3.6 misconceptions. Each is detected by a tagged distractor in questions/ch3/3-6.yaml.

- id: MC-terminal-equals-emf
  title: מתח ההדקים תמיד שווה לכא"מ
  belief: על סוללה של 12 וולט, מד מתח שמחובר להדקים יראה תמיד 12 וולט, גם כשהיא מספקת זרם.
  truth: כשזורם זרם, חלק מהכא"מ "נופל" על ההתנגדות הפנימית, ומתח ההדקים קטן ממנו, V = ε − Ir. ככל שהזרם גדול יותר, מתח ההדקים קטן יותר. רק כשלא זורם זרם, V = ε.
  remedy: { lesson: '3.6', anchor: fig-3-6a, label: 'איור 3.6א: הקטינו את R₁ וקראו את מד המתח שעל ההדקים' }

- id: MC-emf-is-force
  title: כוח אלקטרו-מניע הוא כוח
  belief: כא"מ הוא כוח, שנמדד בניוטון, שדוחף את האלקטרונים.
  truth: הכא"מ הוא עבודה ליחידת מטען, ε = W/q, והיחידה שלו וולט, ג'אול לקולון. השם "כוח" נשאר מהמאה ה-19.
  remedy: { lesson: '3.6', anchor: emf, label: 'שיעור 3.6: "הכא"מ: עבודה לכל קולון"' }

- id: MC-real-battery-ideal
  title: הוספת נורה במקביל אף פעם לא משפיעה על האחרות
  belief: גם בסוללה אמיתית, נורה שמוסיפים במקביל לא משנה את הבהירות של הנורות האחרות.
  truth: זה נכון רק לסוללה אידאלית. בסוללה אמיתית, הנורה הנוספת מגדילה את הזרם הכולל, הירידה Ir בתוך הסוללה גדלה, ומתח ההדקים, שעליו כל הנורות, קטן. הנורות האחרות נחלשות, מעט או הרבה, לפי גודל r.
  remedy: { lesson: '3.6', anchor: fig-3-6a, label: 'איור 3.6א: הקטינו את העומס וראו את מתח ההדקים יורד' }
