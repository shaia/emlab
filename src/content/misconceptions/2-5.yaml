# Lesson 2.5 misconceptions. Each is detected by a tagged distractor in questions/ch2/2-5.yaml.

- id: MC-equal-share-on-connect
  title: שני מוליכים מחוברים מתחלקים במטען שווה בשווה
  belief: כשמחברים שני כדורים מוליכים בתיל, המטען מתחלק ביניהם חצי-חצי.
  truth: המטען עובר עד שהפוטנציאלים שווים, kq₁/R₁ = kq₂/R₂. לכן הוא מתחלק לפי הרדיוסים, q ∝ R. רק לכדורים שווים בגודלם החלוקה שווה.
  remedy: { lesson: '2.5', anchor: fig-2-5b, label: 'איור 2.5ב: חברו כדורים בגדלים שונים וקראו את המטענים' }

- id: MC-flow-from-more-charge
  title: המטען זורם מהגוף שיש לו יותר מטען
  belief: כשמחברים שני מוליכים, מטען חיובי עובר מזה שיש עליו יותר מטען אל זה שיש עליו פחות.
  truth: מה שקובע את כיוון המעבר הוא הפוטנציאל, לא המטען. מטען חיובי עובר מהפוטנציאל הגבוה לנמוך. כדור קטן עם מעט מטען יכול להיות בפוטנציאל גבוה יותר מכדור גדול עם הרבה מטען.
  remedy: { lesson: '2.5', anchor: fig-2-5b, label: 'איור 2.5ב: תנו לכדור הקטן פחות מטען, וראו לאן הוא זורם' }

- id: MC-zero-potential-inside-conductor
  title: בתוך כדור מוליך הפוטנציאל אפס
  belief: השדה בתוך כדור מוליך טעון הוא אפס, ולכן גם הפוטנציאל שם אפס.
  truth: השדה בתוך הכדור אפס, ולכן הפוטנציאל בתוכו לא משתנה ממקום למקום. הוא שווה בכל מקום לפוטנציאל של פני הכדור, kQ/R, ולא לאפס.
  remedy: { lesson: '2.5', anchor: fig-2-5a, label: 'איור 2.5א: גררו את P לתוך הכדור והסתכלו על הגרף' }

- id: MC-earth-shares-half
  title: כדור הארץ לוקח רק חלק מהמטען
  belief: כשמארקים כדור טעון, הוא מתחלק במטען עם כדור הארץ, ונשאר עליו חלק ניכר מהמטען.
  truth: כדור הארץ הוא מוליך ענק, ורדיוס ענק פירושו שהוא לוקח כמעט את כל המטען (q ∝ R). הכדור המוארק מגיע לפוטנציאל של האדמה, אפס, ובלי מטענים אחרים בקרבתו הוא נשאר ניטרלי.
  remedy: { lesson: '2.5', anchor: fig-2-5b, label: 'איור 2.5ב: הארקו כדור טעון וקראו כמה מטען נשאר' }

- id: MC-big-sphere-strong-field
  title: לכדור הגדול יש את השדה החזק יותר על פניו
  belief: אחרי חיבור, לכדור הגדול יש יותר מטען, ולכן השדה ליד פני השטח שלו חזק יותר.
  truth: בפוטנציאל משותף q ∝ R, והשדה על פני כדור הוא kq/R² ∝ 1/R. השדה ליד הכדור הקטן חזק יותר. לכן ליד חודים חדים השדה חזק במיוחד.
  remedy: { lesson: '2.5', anchor: sharp, label: 'שיעור 2.5: חודים וכליא ברק' }
