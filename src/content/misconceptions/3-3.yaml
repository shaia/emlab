# Lesson 3.3 misconceptions. Each is detected by a tagged distractor in questions/ch3/3-3.yaml.

- id: MC-ohm-law-universal
  title: לכל רכיב יש התנגדות קבועה
  belief: חוק אוהם מתקיים בכל רכיב, ולכן מתח כפול תמיד נותן זרם כפול, גם בנורה.
  truth: R = V/I היא הגדרה, ומותר לחשב אותה בכל רכיב ובכל רגע. חוק אוהם הוא הטענה שהיחס הזה קבוע, והוא נכון רק לרכיבים אוהמיים. בנורת להט ההתנגדות גדלה כשהחוט מתחמם, ולכן מתח כפול נותן פחות מזרם כפול.
  remedy: { lesson: '3.3', anchor: fig-3-3a, label: 'איור 3.3א: רשמו מדידות בנורה, והשוו לנגד' }

- id: MC-resistance-depends-on-V
  title: ההתנגדות גדלה כשמגדילים את המתח
  belief: לפי R = V/I, אם מכפילים את המתח על נגד, ההתנגדות שלו מוכפלת.
  truth: בנגד אוהמי, כשמכפילים את המתח גם הזרם מוכפל, והיחס V/I לא משתנה. ההתנגדות היא תכונה של הרכיב (החומר, האורך, העובי והטמפרטורה), לא של המתח שמפעילים עליו.
  remedy: { lesson: '3.3', anchor: fig-3-3a, label: 'איור 3.3א: בנגד, קראו את R = V/I בכמה מתחים' }

- id: MC-thicker-more-resistance
  title: תיל עבה מתנגד יותר
  belief: בתיל עבה יש יותר חומר שמפריע לזרם, ולכן ההתנגדות שלו גדולה יותר.
  truth: בתיל עבה יש יותר מסלולים לזרם, כאילו כמה תילים דקים זה לצד זה. ההתנגדות קטנה ביחס הפוך לשטח החתך, R = ρL/A.
  remedy: { lesson: '3.3', anchor: fig-3-3b, label: 'איור 3.3ב: הגדילו את הקוטר וקראו את ההתנגדות' }

- id: MC-diameter-linear
  title: קוטר כפול, התנגדות חצי
  belief: אם מכפילים את הקוטר של תיל, ההתנגדות שלו קטנה פי 2.
  truth: ההתנגדות תלויה בשטח החתך, לא בקוטר. לתיל עגול A = πd²/4, ולכן קוטר כפול נותן שטח גדול פי 4 והתנגדות קטנה פי 4.
  remedy: { lesson: '3.3', anchor: fig-3-3b, label: 'איור 3.3ב: הכפילו את הקוטר, ופי כמה קטנה ההתנגדות?' }
