# Lesson 4.10 misconceptions. Each is detected by a tagged distractor in questions/ch4/4-10.yaml.

- id: MC-compass-angle-proportional
  title: זווית הסטייה של המצפן גדלה ביחס ישר לזרם
  belief: 'אם זרם של 2 A מסובב את המחט ב-23°, זרם של 4 A יסובב אותה ב-46°: הזווית גדלה פי כמה שהזרם גדל.'
  truth: 'השדה של התיל גדל ביחס ישר לזרם, אבל המחט מצביעה לאורך השדה השקול, ולכן tanθ = B_w/B_E הוא שגדל ביחס ישר לזרם, לא θ. הכפלת הזרם מ-2 A ל-4 A מעבירה את המחט מ-23° ל-40° בלבד.'
  remedy: { lesson: '4.10', anchor: fig-4-10a, label: 'איור 4.10א: רשמו מדידות ב-2 A וב-4 A, והשוו את הזוויות ואת הטנגנסים' }

- id: MC-compass-wire-orientation
  title: לא משנה באיזה כיוון מניחים את התיל מעל המצפן
  belief: 'כל תיל שזורם בו זרם מעל מצפן יסובב את המחט באותה זווית, בלי קשר לכיוון של התיל.'
  truth: 'השדה של התיל מתחתיו ניצב לתיל. כשהתיל בכיוון צפון–דרום, השדה שלו ניצב לשדה של כדור הארץ, והמחט סוטה ב-θ שבה tanθ = B_w/B_E. כשהתיל בכיוון מזרח–מערב, השדה שלו מקביל לשדה של כדור הארץ או מנוגד לו: המחט לא זזה, או מתהפכת.'
  remedy: { lesson: '4.10', anchor: fig-4-10a, label: 'איור 4.10א: סובבו את התיל לכיוון מזרח–מערב' }

- id: MC-compass-past-90
  title: בזרם גדול מספיק המחט עוברת את 90°
  belief: 'אם מגדילים את הזרם עוד ועוד, המחט ממשיכה להסתובב, עוברת את 90° ואפילו מסתובבת סיבוב שלם.'
  truth: 'המחט מצביעה לאורך הסכום של B_E, צפונה, ושל B_w, מערבה או מזרחה. לסכום יש תמיד רכיב צפוני B_E, ולכן θ מתקרבת ל-90° ככל ש-B_w גדל, אבל לא מגיעה אליה ולא עוברת אותה.'
  remedy: { lesson: '4.10', anchor: fig-4-10a, label: 'איור 4.10א: הנמיכו את התיל והגדילו את הזרם עד הסוף' }

- id: MC-earth-field-negligible
  title: השדה של כדור הארץ זניח ליד תיל
  belief: 'השדה של כדור הארץ חלש מאוד, ולכן ליד תיל שזורם בו זרם אפשר להתעלם ממנו: המחט פשוט מתיישרת לאורך השדה של התיל.'
  truth: 'השדה של כדור הארץ, כ-3·10⁻⁵ T, הוא בגודל של השדה של תיל עם כמה אמפר במרחק של כמה סנטימטרים: 4.8 A בגובה 3 cm נותנים בדיוק את אותו שדה. לכן המחט מצביעה בין שני השדות, ומהזווית שלה מודדים את השדה של כדור הארץ.'
  remedy: { lesson: '4.10', anchor: fig-4-10a, label: 'איור 4.10א: משולש השדות, בזרמים קטנים ובזרמים גדולים' }
