# Lesson 4.10 misconceptions. Each is detected by a tagged distractor in questions/ch4/4-10.yaml.

- id: MC-coil-torque-plane-angle
  title: 'המומנט הכי גדול כשהכריכה "פונה" אל השדה'
  belief: 'על כריכה בשדה פועל המומנט הגדול ביותר כשמישור הכריכה ניצב לקווי השדה, ובנוסחה τ = NBIA·sinθ אפשר להציב את הזווית בין מישור הכריכה לשדה.'
  truth: 'θ בנוסחה היא הזווית בין האנך לכריכה לבין השדה. כשמישור הכריכה ניצב לשדה, האנך מקביל לשדה, θ = 0, והמומנט אפס. המומנט הכי גדול כשמישור הכריכה לאורך השדה, θ = 90°. אם נתונה הזווית β בין המישור לשדה, θ = 90° − β.'
  remedy: { lesson: '4.10', anchor: fig-4-10a, label: 'איור 4.10א: סובבו את הכריכה וקראו את θ, את הזווית בין המישור לשדה ואת המומנט' }

- id: MC-coil-net-force-nonzero
  title: 'השדה דוחף את הכריכה כולה'
  belief: 'על כריכה שזורם בה זרם, בשדה מגנטי אחיד, פועל כוח שקול שמזיז אותה, או שאם הכוח השקול אפס אז גם אין מומנט.'
  truth: 'בשדה אחיד הכוחות על צלעות נגדיות שווים בגודלם והפוכים בכיוונם, ולכן הכוח השקול תמיד אפס. אבל שני הכוחות על הצלעות שמקבילות לציר לא פועלים לאורך אותו קו, ולכן הם יוצרים מומנט שמסובב את הכריכה.'
  remedy: { lesson: '4.10', anchor: fig-4-10a, label: 'איור 4.10א: שני הכוחות על הצלעות הארוכות והזרוע שלהם' }

- id: MC-coil-all-sides-torque
  title: 'כל ארבע הצלעות מסובבות את הכריכה'
  belief: 'המומנט על כריכה מלבנית הוא סכום המומנטים של הכוחות על ארבע הצלעות שלה.'
  truth: 'רק שתי הצלעות שמקבילות לציר יוצרות מומנט סביבו. הכוחות על שתי הצלעות האחרות פועלים לאורך הציר, שווים והפוכים, ורק מותחים את הכריכה או לוחצים עליה.'
  remedy: { lesson: '4.10', anchor: fig-4-10a, label: 'איור 4.10א, המבט מהצד: הכוחות על הצלעות הקצרות לאורך הציר' }

- id: MC-coil-equilibrium-no-forces
  title: 'במצב שיווי המשקל אין כוחות על הכריכה'
  belief: 'כשהכריכה נעצרת, מישורה ניצב לשדה, הכוחות המגנטיים על הצלעות שלה נעלמים.'
  truth: 'הכוחות על הצלעות לא תלויים בזווית: כל צלע שמקבילה לציר נשארת ניצבת לשדה, והכוח עליה NBIa. במצב שיווי המשקל הכוחות פועלים לאורך קו אחד שעובר דרך הציר, ולכן הזרוע אפס והמומנט אפס.'
  remedy: { lesson: '4.10', anchor: fig-4-10a, label: 'איור 4.10א: סובבו את הכריכה עד שהמומנט אפס, והסתכלו על חיצי הכוח' }

- id: MC-motor-without-commutator
  title: 'גם בלי קומוטטור הסליל ממשיך להסתובב'
  belief: 'אם מחברים סליל על ציר ישירות לסוללה, בתוך שדה של מגנט, הוא מסתובב כל הזמן לאותו כיוון.'
  truth: 'בלי קומוטטור המומנט מתהפך בכל פעם שהסליל עובר את המצב שבו מישורו ניצב לשדה. הסליל מתנדנד סביב המצב הזה ונעצר בו. הקומוטטור הופך את הזרם בדיוק שם, ולכן המומנט שומר על כיוונו.'
  remedy: { lesson: '4.10', anchor: motor, label: 'איור 4.10א במצב "מנוע": כבו את הקומוטטור והפעילו' }
