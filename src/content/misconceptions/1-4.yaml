# Misconception register for lesson 1.4. Format and rules: see misconceptions/1-5.yaml.

- id: MC-superposition-shielding
  title: מטען שלישי חוסם או משנה את הכוח בין שני מטענים
  belief: כשמוסיפים מטען שלישי, הכוח בין שני המטענים הראשונים נחלש או משתנה.
  truth: הכוח בין כל שני מטענים תלוי רק בהם ובמרחק ביניהם. מטען נוסף מוסיף כוח משלו, והכוחות מתחברים.
  remedy: { lesson: '1.4', anchor: fig-1-4a, label: 'איור 1.4א: הרחיקו את C וראו שהכוח של A לא משתנה' }

- id: MC-forces-add-as-numbers
  title: מחברים גדלי כוחות במקום וקטורים
  belief: הכוח השקול הוא סכום הגדלים של הכוחות, גם כשהם בכיוונים שונים.
  truth: מחברים וקטורים. כוחות לאורך אותו קו מחברים או מחסירים לפי הכיוון, וכוחות מאונכים נותנים סכום קטן מסכום הגדלים.
  remedy: { lesson: '1.4', anchor: fig-1-4b, label: 'איור 1.4ב: חיבור ראש-לזנב' }

- id: MC-forces-sign-decides
  title: מחסירים כוחות לפי סימני המטענים
  belief: אם שני מטענים מנוגדים בסימנם, הכוחות שלהם על מטען שלישי מחסירים זה את זה.
  truth: הכיוון של כל כוח נקבע לפי דחייה או משיכה על המטען שאליו מחשבים. חיבור או החסרה תלויים בכיוונים של הכוחות, לא בסימני המטענים.
  remedy: { lesson: '1.4', anchor: fig-1-4a, label: 'איור 1.4א: קבעו כיוון לכל חץ לפני שמחברים' }

- id: MC-superposition-always-cancel
  title: מטענים משני צדדים תמיד מבטלים זה את זה
  belief: כשיש מטענים משני צדי המטען, הכוחות מתאפסים.
  truth: הכוחות מתאפסים רק כשהם שווים בגודלם ומנוגדים בכיוונם. אם המרחקים או המטענים שונים, נשאר כוח שקול.
  remedy: { lesson: '1.4', anchor: fig-1-4a, label: 'איור 1.4א: חפשו את הנקודה שבה הכוח השקול מתאפס' }

- id: MC-components-swap
  title: מחליפים בין sin ל-cos ברכיבי הכוח
  belief: הרכיב האנכי של כוח הוא תמיד F·cos θ.
  truth: זה תלוי בזווית. כשהזווית נמדדת מציר x, הרכיב האנכי הוא F·sin θ והרכיב האופקי הוא F·cos θ.
  remedy: { lesson: '1.4', anchor: fig-1-4b, label: 'איור 1.4ב: רכיבי x ו-y של הכוח השקול' }
