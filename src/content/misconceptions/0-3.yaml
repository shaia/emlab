# Misconceptions this lesson detects and remedies. Format and rules: see misconceptions/1-5.yaml.

- id: MC-power-direction
  title: חזקה שלילית בכיוון ההפוך
  belief: μ פירושו כפול מיליון, ולכן 3 μC הם 3·10⁶ C. באותו אופן, 10⁻⁴ נראה כמו מספר גדול.
  truth: חזקה שלילית פירושה מספר קטן מ-1. μ היא 10⁻⁶, מיליונית, ולכן 3 μC הם 3·10⁻⁶ C, מספר קטן מאוד של קולונים.
  remedy: { lesson: '0.3', anchor: fig-0-3a, label: 'איור 0.3א: מצאו את 2 μC על הסרגל' }

- id: MC-square-mantissa-only
  title: מעלים בריבוע רק את המספר שלפני החזקה
  belief: (3·10⁻²)² = 9·10⁻².
  truth: מעלים בריבוע את שני הגורמים, המספר והחזקה. (3·10⁻²)² = 9·10⁻⁴.
  remedy: { lesson: '0.3', anchor: powers, label: 'שיעור 0.3: חשבון עם חזקות' }

- id: MC-area-prefix-once
  title: ממירים יחידות שטח כמו יחידות אורך
  belief: 1 cm = 10⁻² m, ולכן גם 1 cm² = 10⁻² m².
  truth: בשטח יש שני אורכים, וכל אחד מהם מומר. 1 cm² = (10⁻² m)² = 10⁻⁴ m². במטר רבוע יש 10,000 סנטימטרים רבועים, לא 100.
  remedy: { lesson: '0.3', anchor: powers, label: 'שיעור 0.3: שטח בסנטימטרים רבועים' }

- id: MC-more-digits-better
  title: יותר ספרות זה יותר מדויק
  belief: כדאי להעתיק את כל הספרות מהמחשבון, כי תשובה עם יותר ספרות מדויקת יותר.
  truth: התוצאה לא יכולה להיות מדויקת יותר מהנתונים. בדרך כלל כותבים בה בערך כמו מספר הספרות המשמעותיות בנתון הכי פחות מדויק, כלומר 2 או 3.
  remedy: { lesson: '0.3', anchor: sigfigs, label: 'שיעור 0.3: כמה ספרות לכתוב' }

- id: MC-units-decoration
  title: יחידות הן קישוט
  belief: אפשר להציב מספרים בכל יחידה (סנטימטרים, מיקרו-קולון) ולסדר את היחידות בסוף, או לא לכתוב אותן בכלל.
  truth: הקבועים בדף הנוסחאות כתובים ביחידות SI, ולכן ממירים ל-SI לפני ההצבה. היחידות של התוצאה הן גם בדיקה, כי יחידות שגויות מגלות טעות.
  remedy: { lesson: '0.3', anchor: format, label: 'שיעור 0.3: מבנה של פתרון' }
