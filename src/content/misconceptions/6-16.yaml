# Lesson 6.16 misconceptions. Each is detected by a tagged distractor in questions/ch6/6-16.yaml.

- id: MC-one-limit-enough
  title: 'נוסחה שעוברת גבול אחד נכונה'
  belief: 'אם ביטוי סגור נותן את הנוסחה המוכרת בקצה אחד (למשל μ₀nI לסליל ארוך), הוא נכון, ואין צורך לבדוק את הקצה השני.'
  truth: 'לכל ביטוי שני קצוות לפחות, וכל אחד מהם בודק חלק אחר שלו. ⁦μ₀NI/√(L²+R²)⁩ נותן μ₀NI/L לסליל ארוך, אבל μ₀NI/R לסליל שטוח, פי 2 מהנכון. רק ביטוי שעובר את כל הקצוות, את היחידות ואת הסימטריה ראוי לאמון.'
  remedy: { lesson: '6.16', anchor: fig-6-16a, label: 'איור 6.16א: סליל במצב "נוסחה חשודה", בשני הקצוות' }

- id: MC-units-prove-formula
  title: 'אם היחידות נכונות, הנוסחה נכונה'
  belief: 'מספיק לבדוק שלנוסחה יש את היחידות הנכונות של שדה כדי לדעת שהיא נכונה.'
  truth: 'בדיקת יחידות תופסת רק חלק מהטעויות: גורם מספרי (פי 2, פי π) או חזקה שגויה של יחס חסר יחידות (R/z) לא משנים את היחידות. כל הנוסחאות החשודות באיור 6.16א הן ביחידות של שדה, וכל אחת נכשלת בגבול.'
  remedy: { lesson: '6.16', anchor: fig-6-16a, label: 'איור 6.16א: הנוסחאות החשודות, שכולן ביחידות הנכונות' }

- id: MC-bagrut-formula-exact
  title: 'נוסחת הבגרות היא השדה המדויק של הגוף'
  belief: 'σ/(2ε₀) הוא השדה של לוח טעון אמיתי, ו-μ₀nI הוא השדה בכל נקודה בתוך סליל אמיתי, בכל מרחק ובכל אורך.'
  truth: 'רוב נוסחאות הבגרות הן גבולות של ביטוי מדויק: σ/(2ε₀) נכון ליד לוח רחב, כשהמרחק קטן בהרבה מהרוחב, ו-μ₀nI במרכז סליל ארוך בהרבה מהרדיוס שלו. רחוק מלוח השדה הוא kQ/r². רק מעטות מדויקות בתנאים שלהן, כמו kQ/r² מחוץ לכדור טעון אחיד.'
  remedy: { lesson: '6.16', anchor: fig-6-16a, label: 'איור 6.16א: דיסקה, מרדיוס קטן לרדיוס גדול' }

- id: MC-theory-needs-no-test
  title: 'חוק שנגזר מתאוריה לא צריך ניסוי'
  belief: 'מקסוול חישב מהמשוואות שלו את מהירות הגל, ולכן כבר ידעו שהאור הוא גל אלקטרומגנטי; הניסוי של הרץ רק הדגים משהו ידוע.'
  truth: 'זרם ההעתקה היה הנחה של מקסוול, לא מדידה. הגלים שהמשוואות חוזות היו השערה עד שהרץ יצר אותם ממעגל חשמלי, מדד את אורך הגל שלהם ומצא שהם נעים במהירות האור. ניסוי יכול להפיל תאוריה; בלי ניסוי היא חיזוי בלבד.'
  remedy: { lesson: '6.16', anchor: experiments, label: 'שיעור 6.16: ניסוי ותאוריה, מקולון עד הרץ' }
