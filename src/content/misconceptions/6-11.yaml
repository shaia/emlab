# Lesson 6.11 misconceptions. Each is detected by a tagged distractor in questions/ch6/6-11.yaml.

- id: MC-short-wire-infinite-formula
  title: השדה של תיל קצר הוא μ₀I/(2πr)
  belief: הנוסחה B = μ₀I/(2πr) נותנת את השדה של כל תיל ישר, גם של תיל קצר או של חתיכה ממעגל, ובכל נקודה לידו.
  truth: הנוסחה נכונה רק לתיל ארוך מאוד, כשהנקודה רחוקה מהקצוות שלו. לקטע סופי B = μ₀I/(4πs)·(sinθ₂ − sinθ₁), תמיד פחות מ-μ₀I/(2πs). מול האמצע של קטע שאורכו פי 2 מהמרחק, השדה רק כ-71% מהנוסחה של התיל האינסופי, ומול הקצה של תיל ארוך הוא חצי ממנה.
  remedy: { lesson: '6.11', anchor: fig-6-11a, label: 'איור 6.11א: האריכו את הקטע, ומדדו כמה מהשדה של תיל אינסופי הוא נותן' }

- id: MC-biot-savart-along-r
  title: התרומה של אלמנט זרם מצביעה אל הנקודה או ממנה
  belief: כמו השדה החשמלי של אלמנט מטען, השדה המגנטי של אלמנט זרם מצביע לאורך הקו שמחבר אותו לנקודה, או לאורך הזרם.
  truth: בחוק ביו-סבר יש מכפלה וקטורית. התרומה dB ניצבת גם לאלמנט dℓ וגם לווקטור r שמחבר אותו לנקודה. כשהתיל והנקודה בדף, כל התרומות יוצאות מהדף או נכנסות אליו.
  remedy: { lesson: '6.11', anchor: law, label: 'שיעור 6.11: "חוק ביו-סבר", הכיוון של dB' }

- id: MC-element-in-line-contributes
  title: גם אלמנט שמצביע אל הנקודה תורם לשדה בה
  belief: כל חתיכה של התיל תורמת לשדה בנקודה, לפי המרחק שלה בלבד, גם חתיכה שהזרם בה זורם ישר אל הנקודה או ממנה.
  truth: התרומה פרופורציונית ל-sinφ, כאשר φ היא הזווית בין dℓ לבין הקו אל הנקודה. כשהזרם זורם לאורך הקו הזה, φ = 0 והתרומה אפס. לכן נקודה על ההמשך של קטע ישר לא מקבלת ממנו שדה כלל.
  remedy: { lesson: '6.11', anchor: law, label: 'שיעור 6.11: "חוק ביו-סבר", המקדם sinφ' }

- id: MC-loop-far-inverse-square
  title: רחוק מכריכה, השדה יורד כמו 1/z²
  belief: כמו השדה של מטען נקודתי, השדה של כריכה קטנה, רחוק ממנה, יורד פי 4 כשמכפילים את המרחק.
  truth: 'התרומה של כל אלמנט אכן יורדת כמו 1/z², אבל רחוק מהכריכה התרומות של צדדים מנוגדים כמעט מבטלות זו את זו, ונשאר רק רכיב קטן לאורך הציר. השדה הוא של דיפול מגנטי, μ₀m/(2πz³): פי 2 במרחק נותן פי 8 פחות.'
  remedy: { lesson: '6.11', anchor: fig-6-11b, label: 'איור 6.11ב: התרחקו עם P לאורך הציר, והשוו לנוסחת הדיפול' }

- id: MC-solenoid-end-zero
  title: בקצה של סליל השדה אפס, או שווה לשדה שבפנים
  belief: השדה של סליל נמצא רק בתוכו, ולכן בפתח של סליל ארוך הוא נעלם; או שהוא אחיד לכל אורך הציר, גם בקצה.
  truth: 'בקצה של סליל ארוך השדה על הציר הוא בדיוק חצי מהשדה שבפנים, μ₀nI/2. אפשר לראות את זה בלי חשבון: שני סלילים ארוכים זה מול זה יוצרים יחד סליל ארוך אחד, ובנקודת המפגש כל אחד מהם תורם חצי.'
  remedy: { lesson: '6.11', anchor: solenoid, label: 'שיעור 6.11: "סליל: ערימה של כריכות"' }
