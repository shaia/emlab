# Lesson 2.2 misconceptions. Each is detected by a tagged distractor in questions/ch2/2-2.yaml.

- id: MC-potential-is-vector
  title: פוטנציאלים מתקזזים לפי כיוון, כמו שדות
  belief: באמצע בין שני מטענים חיוביים שווים השדות מתקזזים, ולכן גם הפוטנציאלים מתקזזים והפוטנציאל אפס.
  truth: הפוטנציאל הוא סקלר, בלי כיוון. מחברים את הפוטנציאלים של המטענים כמספרים עם סימן. באמצע בין שני מטענים חיוביים שווים V = 2kQ/d, שאינו אפס, גם כשהשדה שם אפס.
  remedy: { lesson: '2.2', anchor: fig-2-2b, label: 'איור 2.2ב: גררו את P לאמצע בין שני המטענים הזהים וקראו את V₁ ואת V₂' }

- id: MC-potential-equals-energy
  title: פוטנציאל ואנרגיה פוטנציאלית הם אותו דבר
  belief: אם מכפילים את המטען שמניחים בנקודה, גם הפוטנציאל בנקודה מוכפל.
  truth: האנרגיה הפוטנציאלית U = qV מוכפלת, אבל הפוטנציאל V = U/q לא משתנה. V תלוי רק במטענים שיוצרים את השדה ובמקום, כמו השדה E.
  remedy: { lesson: '2.2', anchor: definition, label: 'שיעור 2.2: ההגדרה V = U/q' }

- id: MC-electron-to-lower-potential
  title: כל מטען זז לכיוון הפוטנציאל הנמוך
  belief: מטען שמשחררים ממנוחה זז תמיד מפוטנציאל גבוה לפוטנציאל נמוך, גם אלקטרון.
  truth: מטען חיובי זז לכיוון הפוטנציאל הנמוך, ומטען שלילי לכיוון הפוטנציאל הגבוה. בשני המקרים האנרגיה הפוטנציאלית U = qV קטנה.
  remedy: { lesson: '2.2', anchor: work, label: 'שיעור 2.2: עבודה והפרש פוטנציאלים, מטען חיובי מול מטען שלילי' }

- id: MC-ev-is-voltage
  title: אלקטרון-וולט הוא יחידה של מתח
  belief: eV מודד פוטנציאל או מתח, כמו וולט.
  truth: אלקטרון-וולט הוא יחידה של אנרגיה, 1 eV = 1.6·10⁻¹⁹ J. זו האנרגיה שמטען יסודי מקבל כשהוא עובר הפרש פוטנציאלים של 1 V.
  remedy: { lesson: '2.2', anchor: ev, label: 'שיעור 2.2: האלקטרון-וולט' }

- id: MC-potential-inverse-square
  title: הפוטנציאל יורד כמו 1/r²
  belief: כמו השדה, גם הפוטנציאל של מטען נקודתי קטן פי 4 כשהמרחק מוכפל.
  truth: הפוטנציאל של מטען נקודתי הוא V = kQ/r. במרחק כפול הוא קטן פי 2 בלבד, ואילו השדה E = kQ/r² קטן פי 4.
  remedy: { lesson: '2.2', anchor: fig-2-2a, label: 'איור 2.2א: גררו את P למרחק כפול והשוו את V ואת E' }
