# Lesson 4.8 misconceptions. Each is detected by a tagged distractor in questions/ch4/4-8.yaml.

- id: MC-wire-force-along-b
  title: הכוח על תיל פועל בכיוון השדה
  belief: תיל שזורם בו זרם בתוך שדה מגנטי נדחף בכיוון קווי השדה, כמו שמטען חיובי נדחף בכיוון השדה החשמלי.
  truth: הכוח ניצב לשדה, וגם לתיל. אם השדה לתוך הדף, הכוח על תיל שבדף נמצא בתוך הדף, בניצב לתיל. את הכיוון קובעים בכלל כף יד ימין.
  remedy: { lesson: '4.8', anchor: fig-4-8a, label: 'איור 4.8א: השדה לתוך הדף, והחץ של הכוח נשאר בתוך הדף' }

- id: MC-wire-force-along-i
  title: הכוח על תיל פועל לאורך התיל
  belief: השדה המגנטי דוחף את התיל בכיוון הזרם, או מאט את הזרם.
  truth: הכוח ניצב לתיל. כל נושא מטען מקבל כוח ניצב למהירות שלו, ומכיוון שנושאי המטען לא יכולים לצאת מהתיל, הם מעבירים את הכוח לתיל עצמו, בניצב לו.
  remedy: { lesson: '4.8', anchor: fig-4-8a, label: 'איור 4.8א: הציגו את נושאי המטען וראו את חיצי הכוח הקטנים שלהם' }

- id: MC-wire-parallel-force
  title: גם על תיל שמקביל לשדה פועל כוח
  belief: כל תיל שזורם בו זרם בתוך שדה מגנטי מקבל כוח, וכשהתיל לאורך קווי השדה הכוח אפילו הגדול ביותר.
  truth: F = BIL·sinα. כשהתיל מקביל לשדה, α = 0 או 180°, והכוח אפס. הכוח הגדול ביותר כשהתיל ניצב לשדה.
  remedy: { lesson: '4.8', anchor: fig-4-8a, label: 'איור 4.8א, תיל בזווית לשדה: סובבו את התיל עד α = 0' }

- id: MC-wire-whole-length
  title: כל אורך התיל נכנס לנוסחה
  belief: בנוסחה F = BIL מציבים את האורך של כל התיל, גם של החלק שמחוץ לשדה.
  truth: כוח פועל רק על נושאי המטען שבתוך השדה. L הוא אורך התיל שבתוך השדה, ותיל ארוך יותר שעובר באותו אזור שדה מקבל אותו כוח.
  remedy: { lesson: '4.8', anchor: fig-4-8a, label: 'איור 4.8א: לנושאי המטען שמחוץ לאזור השדה אין חיצי כוח' }

- id: MC-wire-force-without-current
  title: המגנט מושך את תיל הנחושת גם בלי זרם
  belief: מגנט מושך כל תיל מתכת, ולכן גם תיל נחושת שאין בו זרם יימשך אל הקטבים.
  truth: נחושת ואלומיניום אינם נמשכים למגנט. הכוח על התיל נובע מנושאי המטען הנעים בו, ולכן בלי זרם אין כוח. כשהזרם מתהפך, הכוח מתהפך, וזו לא משיכה.
  remedy: { lesson: '4.8', anchor: fig-4-8a, label: 'איור 4.8א: הורידו את הזרם לאפס, והכוח נעלם' }

- id: MC-wire-force-electrons-opposite
  title: האלקטרונים נעים נגד הזרם, ולכן הכוח הפוך לכלל
  belief: בתיל מתכת האלקטרונים נעים נגד כיוון הזרם, ולכן הכוח על התיל הפוך למה שכלל כף יד ימין נותן עם האגודל בכיוון הזרם.
  truth: 'לאלקטרון שני "היפוכים": הוא נע נגד הזרם, והמטען שלו שלילי. שני ההיפוכים מבטלים זה את זה, והכוח על כל אלקטרון בדיוק בכיוון שהכלל נותן עם הזרם.'
  remedy: { lesson: '4.8', anchor: fig-4-8a, label: 'איור 4.8א: עברו ממטענים חיוביים לאלקטרונים, וחיצי הכוח לא משתנים' }
