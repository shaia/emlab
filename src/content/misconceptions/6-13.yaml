# Lesson 6.13 misconceptions. Each is detected by a tagged distractor in questions/ch6/6-13.yaml.

- id: MC-pole-is-magnetic-charge
  title: 'קוטב של מגנט הוא מטען מגנטי'
  belief: 'מהקוטב הצפוני של מגנט קווי השדה יוצאים כמו ממטען חיובי, ולכן קופסה סגורה סביב הקוטב הצפוני מקבלת שטף מגנטי נטו החוצה.'
  truth: 'קווי השדה המגנטי לא מתחילים בקוטב: הם מגיעים אליו מתוך המגנט. דרך הדופן שבתוך המגנט נכנס אותו שטף שיוצא בחוץ, ולכן השטף נטו אפס, ו-∇·B = 0 בכל נקודה. אין מטען מגנטי.'
  remedy: { lesson: '6.13', anchor: fig-6-13a, label: 'איור 6.13א: תיבה סביב הקצה העליון של הסליל השטוח' }

- id: MC-integral-needs-symmetry
  title: 'הצורה האינטגרלית נכונה רק כשיש סימטריה'
  belief: 'חוק גאוס וחוק אמפר בצורה האינטגרלית מתקיימים רק למשטחים ולמסלולים סימטריים, ולכן הם חוקים חלשים יותר מהצורה הדיפרנציאלית.'
  truth: 'הצורה האינטגרלית מתקיימת לכל משטח סגור ולכל מסלול סגור. סימטריה רק עוזרת לחלץ ממנה את השדה. הצורה הדיפרנציאלית היא אותו חוק בדיוק, ובזכות "לכל משטח" אפשר לעבור ממנה אליה.'
  remedy: { lesson: '6.13', anchor: fig-6-13a, label: 'איור 6.13א: תיבה שחוצה את דופן המוט הטעון' }

- id: MC-induced-e-only-inside
  title: 'השדה המושרה קיים רק איפה שהשדה המגנטי משתנה'
  belief: 'שדה מגנטי שמשתנה רק בתוך ליבה של סליל יוצר שדה חשמלי רק בתוך הליבה; מחוצה לה אין שדה חשמלי.'
  truth: 'השדה החשמלי המושרה קיים גם מחוץ לליבה, ויורד שם כמו 1/s. מה שאפס מחוץ לליבה הוא הרוטור שלו: ∇×E = −∂B/∂t, ושם B לא משתנה.'
  remedy: { lesson: '6.13', anchor: fig-6-13a, label: 'איור 6.13א: לולאה מחוץ לליבה שהשדה בה גדל' }

- id: MC-curl-e-always-zero
  title: 'לשדה חשמלי תמיד אין רוטור'
  belief: 'לשדה החשמלי אין אף פעם רוטור, ולכן תמיד יש לו פוטנציאל, E = −∇V.'
  truth: '∇×E = 0 רק בסטטיקה. כשהשדה המגנטי משתנה, ∇×E = −∂B/∂t, ולשדה המושרה אין פוטנציאל: הסירקולציה שלו היא הכא"מ המושרה.'
  remedy: { lesson: '6.13', anchor: fig-6-13a, label: 'איור 6.13א: לולאה בליבה שהשדה בה גדל, עם המתג "סטטי" ובלעדיו' }

- id: MC-continuity-without-displacement
  title: 'שימור המטען לא תלוי בזרם ההעתקה'
  belief: 'זרם ההעתקה חשוב רק לגלים. גם בלעדיו משוואות מקסוול היו מתאימות לשימור המטען, ולקבל שנטען.'
  truth: 'הדיברגנץ של רוטור הוא תמיד אפס. בלי איבר ההעתקה, חוק אמפר היה דורש ∇·J = 0 בכל נקודה ובכל רגע, כלומר שמטען לא יצטבר אף פעם, וזה סותר את הלוח של קבל שנטען. עם האיבר יוצאת משוואת הרציפות.'
  remedy: { lesson: '6.13', anchor: continuity, label: 'שיעור 6.13: שימור המטען, ולמה מקסוול היה חייב את זרם ההעתקה' }
