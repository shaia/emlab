# Lesson 6.8 misconceptions. Each is detected by a tagged distractor in questions/ch6/6-8.yaml.

- id: MC-curl-means-circles
  title: 'רוטור פירושו קווים מעגליים'
  belief: 'לשדה יש רוטור אם ורק אם קווי השדה שלו מעגלים או מתעקלים; לשדה עם קווים ישרים ומקבילים אין רוטור, ולשדה עם קווים מעגליים יש.'
  truth: 'הרוטור הוא הסירקולציה סביב לולאה זעירה, חלקי השטח שלה, ולא צורת הקווים. בשדה גזירה, כמו בתוך שכבת זרם, הקווים ישרים והרוטור שונה מאפס; מחוץ לתיל דק הקווים מעגלים והרוטור אפס.'
  remedy: { lesson: '6.8', anchor: fig-6-8a, label: 'איור 6.8א: גלגל המשוטים בשכבת הזרם, וליד התיל הדק' }

- id: MC-curl-zero-where-field-zero
  title: 'במקום שבו השדה אפס אין רוטור'
  belief: 'אם השדה בנקודה הוא אפס, גם הרוטור שם אפס, ואין שם זרם.'
  truth: 'הרוטור תלוי בשינוי של השדה סביב הנקודה, לא בערך שלו בה. בקו האמצע של שכבת זרם השדה אפס, אבל מעליו הוא שמאלה ומתחתיו ימינה, והרוטור μ₀J.'
  remedy: { lesson: '6.8', anchor: fig-6-8a, label: 'איור 6.8א: לולאה על קו האמצע של שכבת הזרם' }

- id: MC-electrostatic-curl-nonzero
  title: 'סביב מטען יש סירקולציה, כמו סביב זרם'
  belief: 'מסלול סגור שמקיף קו טעון (או מטען) נותן סירקולציה של E ששונה מאפס, כמו שמסלול סביב זרם נותן סירקולציה של B.'
  truth: 'השדה האלקטרוסטטי משמר: הסירקולציה שלו אפס סביב כל מסלול סגור, גם סביב מטענים, ולכן ∇×E = 0. מטען קובע את השטף (הדיברגנץ), לא את הסירקולציה.'
  remedy: { lesson: '6.8', anchor: fig-6-8a, label: 'איור 6.8א: לולאה שמקיפה את הקו הטעון' }

- id: MC-stokes-inner-edges-count
  title: 'הצלעות הפנימיות מוסיפות סירקולציה'
  belief: 'כשמחלקים לולאה ללולאות קטנות, סכום הסירקולציות שלהן גדול מהסירקולציה של הלולאה הגדולה, כי יש יותר צלעות.'
  truth: 'כל צלע פנימית שייכת לשתי לולאות שכנות, ובכל אחת הולכים לאורכה בכיוון ההפוך, ולכן התרומה שלה מתבטלת. נשארות רק הצלעות של הלולאה הגדולה.'
  remedy: { lesson: '6.8', anchor: fig-6-8a, label: 'איור 6.8א: חלקו את הלולאה ללולאות קטנות, והשוו את הסכום' }
