# Lesson 4.2 misconceptions. Each is detected by a tagged distractor in questions/ch4/4-2.yaml.

- id: MC-wire-field-radial
  title: השדה של תיל מצביע אל התיל או ממנו
  belief: קווי השדה המגנטי של תיל ישר יוצאים ממנו החוצה (או נכנסים אליו), כמו קווי השדה החשמלי של מטען.
  truth: קווי השדה של תיל ישר הם מעגלים סביב התיל, במישור שניצב לו. בכל נקודה השדה משיק למעגל, וניצב לקו שמחבר את הנקודה לתיל. אין לו רכיב לכיוון התיל או ממנו.
  remedy: { lesson: '4.2', anchor: fig-4-2a, label: 'איור 4.2א: הדליקו את המצפנים ואת קווי השדה סביב התיל' }

- id: MC-wire-field-along-current
  title: השדה המגנטי של תיל הוא בכיוון הזרם
  belief: השדה המגנטי של תיל מצביע לאורך התיל, בכיוון שבו זורם הזרם.
  truth: השדה ניצב לזרם. הוא מקיף את התיל, וכיוונו נקבע בכלל יד ימין, האגודל בכיוון הזרם והאצבעות המכופפות בכיוון השדה. לאורך התיל עצמו אין לשדה רכיב.
  remedy: { lesson: '4.2', anchor: grip-rule, label: 'שיעור 4.2: "כלל יד ימין"' }

- id: MC-wire-field-inverse-square
  title: השדה של תיל יורד כמו אחד חלקי המרחק בריבוע
  belief: כמו השדה של מטען נקודתי, השדה של תיל ארוך יורד פי ארבעה כשמכפילים את המרחק ממנו.
  truth: השדה של תיל ישר ארוך הוא B = μ₀I/(2πr), כלומר הפוך למרחק עצמו. כשמכפילים את המרחק השדה יורד פי שניים בלבד. התיל הוא קו ארוך, לא נקודה.
  remedy: { lesson: '4.2', anchor: fig-4-2a, label: 'איור 4.2א: גררו את P עד שהשדה בה יהיה חצי, ומדדו את המרחק' }

- id: MC-compass-along-wire
  title: מצפן מתחת לתיל מסתובב עד שהוא מקביל לתיל
  belief: כשזורם זרם חזק בתיל שמעל מצפן, המחט מסתובבת ומתיישרת לאורך התיל.
  truth: מתחת לתיל השדה של התיל ניצב לתיל. לכן המחט מסתובבת לכיוון שניצב לתיל, ובזרם חזק כמעט עד ניצב. השדה של כדור הארץ מושך אותה בחזרה, ולכן היא נעצרת בזווית שתלויה ביחס בין שני השדות.
  remedy: { lesson: '4.2', anchor: grip-rule, label: 'שיעור 4.2: "כלל יד ימין", התיל מעל המצפן' }

- id: MC-fields-add-as-numbers
  title: שדות של שני מקורות פשוט מתחברים כמספרים
  belief: השדה בנקודה שליד שני תילים הוא סכום הגדלים של שני השדות, ולכן ליד שני זרמים השדה תמיד חזק יותר מאשר ליד אחד.
  truth: שדה מגנטי הוא וקטור, ושדות מתחברים כווקטורים. באמצע בין שני תילים עם זרמים שווים באותו כיוון, השדות מנוגדים ומבטלים זה את זה, והשדה אפס.
  remedy: { lesson: '4.2', anchor: fig-4-2b, label: 'איור 4.2ב: שני זרמים באותו כיוון, הנקודה P באמצע' }
