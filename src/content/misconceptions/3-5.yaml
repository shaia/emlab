# Lesson 3.5 misconceptions. Each is detected by a tagged distractor in questions/ch3/3-5.yaml.

- id: MC-battery-constant-current
  title: הסוללה נותנת תמיד אותו זרם
  belief: סוללה מספקת כמות קבועה של זרם, והנורות מתחלקות בה. לכן כשמוסיפים נורה במקביל, הנורות האחרות נחלשות.
  truth: מה שהסוללה שומרת עליו הוא המתח בין ההדקים (בסוללה אידאלית). הזרם שהיא מספקת נקבע לפי המעגל, I = ε/R השקולה. נורה שמוסיפים במקביל מקבלת את אותו מתח, והסוללה פשוט מספקת יותר זרם, והנורות האחרות לא משתנות.
  remedy: { lesson: '3.5', anchor: fig-3-5a, label: 'איור 3.5א: "במקביל", סגרו את המפסק וקראו את הזרם ב-L₁ ובסוללה' }

- id: MC-parallel-r-adds
  title: במקביל ההתנגדויות מתחברות
  belief: שני נגדים במקביל הם יותר התנגדות מנגד אחד, ולכן R = R₁ + R₂.
  truth: במקביל כל נגד הוא מסלול נוסף לזרם, ובאותו מתח הסוללה מספקת יותר זרם. ההתנגדות השקולה קטנה מהקטנה שבהן, 1/R = 1/R₁ + 1/R₂. החיבור הפשוט שייך לחיבור בטור.
  remedy: { lesson: '3.5', anchor: fig-3-5a, label: 'איור 3.5א: "במקביל", הוסיפו את L₂ וקראו את הזרם בסוללה' }

- id: MC-series-first-brighter
  title: בטור, הנורה הראשונה מאירה יותר
  belief: בשתי נורות זהות בטור, הנורה הקרובה להדק החיובי מאירה יותר, כי הזרם מגיע אליה קודם ו"משתמש" בחלק ממנו.
  truth: בטור אותו זרם עובר בשתי הנורות (שיעור 3.2), ולנורות זהות יש אותו מתח ואותו הספק. הן מאירות באותה מידה, בלי קשר לסדר.
  remedy: { lesson: '3.5', anchor: fig-3-5a, label: 'איור 3.5א: "בטור", השוו את הזרם וההספק של שתי הנורות' }

- id: MC-shorted-bulb-unchanged
  title: קצר על נורה לא משנה את המעגל
  belief: כשמחברים תיל משני צדי נורה בטור, הנורה ממשיכה לדלוק, ושאר המעגל לא מושפע.
  truth: 'התיל מחבר את שני צדי הנורה, ולכן הם באותו פוטנציאל: על הנורה אין מתח, והיא נכבית. ההתנגדות השקולה של המעגל קטנה, הזרם גדל, והנורות האחרות מאירות יותר.'
  remedy: { lesson: '3.5', anchor: fig-3-5a, label: 'איור 3.5א: "בטור", סגרו את המפסק שעוקף את L₂' }
