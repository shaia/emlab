# Lesson 6.10 misconceptions. Each is detected by a tagged distractor in questions/ch6/6-10.yaml.
# The lesson also tags two older ones: MC-zero-potential-zero-field (2.3) and MC-polarisation-sign-matters (1.2).

- id: MC-dipole-field-inverse-square
  title: 'שדה של דיפול דועך כמו 1/r²'
  belief: 'הדיפול בנוי ממטענים, ולכן גם השדה שלו, כמו השדה של כל מטען, דועך כמו 1/r²: במרחק כפול הוא חלש פי 4.'
  truth: 'רחוק מהדיפול השדות של שני המטענים כמעט מבטלים זה את זה, ומה שנשאר הוא ההפרש ביניהם, שדועך כמו 1/r³: במרחק כפול השדה חלש פי 8. רק קרוב לאחד המטענים, הרבה פחות מ-d ממנו, רואים 1/r² של המטען הזה לבדו.'
  remedy: { lesson: '6.10', anchor: fig-6-10a, label: 'איור 6.10א: הרחיקו את P וקראו את השיפוע בגרף הלוגריתמי' }

- id: MC-dipole-uniform-net-force
  title: 'שדה אחיד דוחף דיפול'
  belief: 'דיפול בשדה חשמלי אחיד מקבל כוח שקול, ולכן הוא זז בכיוון השדה (או נגדו).'
  truth: 'בשדה אחיד הכוחות על שני המטענים שווים בגודלם, qE, ומנוגדים בכיוונם, והכוח השקול אפס. הם רק מסובבים את הדיפול: המומנט τ = pE·sinθ. כוח שקול פועל על דיפול רק בשדה לא אחיד.'
  remedy: { lesson: '6.10', anchor: fig-6-10b, label: 'איור 6.10ב: סובבו את הדיפול והסתכלו על שני חיצי הכוח' }

- id: MC-dipole-moment-direction
  title: 'מומנט הדיפול מצביע מהחיובי לשלילי'
  belief: 'מומנט הדיפול מצביע מהמטען החיובי אל השלילי, כמו קווי השדה שבין שני המטענים.'
  truth: 'מומנט הדיפול מוגדר מהמטען השלילי אל החיובי. בין המטענים השדה אכן מצביע מהחיובי לשלילי, כלומר הפוך ל-p, ולכן על האנך האמצעי השדה מנוגד ל-p.'
  remedy: { lesson: '6.10', anchor: fig-6-10b, label: 'איור 6.10ב: החץ p שליד הדיפול' }

- id: MC-dipole-both-equilibria-stable
  title: 'בשני מצבי שיווי המשקל הדיפול יציב'
  belief: 'כש-p בכיוון השדה וכש-p נגד השדה המומנט אפס, ולכן בשני המצבים הדיפול יציב באותה מידה.'
  truth: 'בשני המצבים המומנט אפס, אבל רק כש-p בכיוון השדה האנרגיה −pE מינימלית, ובהטיה קטנה המומנט מחזיר אותו. כש-p נגד השדה האנרגיה +pE מקסימלית, וכל הטיה קטנה גדלה: שיווי משקל רופף.'
  remedy: { lesson: '6.10', anchor: fig-6-10b, label: 'איור 6.10ב: גרף האנרגיה, והדיפול כש-p נגד השדה' }

- id: MC-dielectric-adds-charge
  title: 'חומר מקוטב נטען'
  belief: 'כשחומר מבודד מתקטב בשדה, נוסף לו מטען, ולכן הוא טעון בסך הכול.'
  truth: 'הקיטוב רק מזיז מטענים בתוך כל מולקולה. המטען הכולל של החומר נשאר אפס: על פן אחד שכבה שלילית ועל הפן השני שכבה חיובית שווה לה.'
  remedy: { lesson: '6.10', anchor: fig-6-10c, label: 'איור 6.10ג: הראו את המטען שעל פני החומר' }
