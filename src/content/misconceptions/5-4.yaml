# Lesson 5.4 misconceptions. Each is detected by a tagged distractor in questions/ch5/5-4.yaml.

- id: MC-rail-rod-speeds-up-forever
  title: 'כוח קבוע מאיץ את המוט בלי סוף'
  belief: 'מוט שמושכים בכוח קבוע על מסילות חלקות מאיץ כל הזמן באותה תאוצה, F/m, ומהירותו גדלה בלי גבול.'
  truth: 'ככל שהמוט מהיר יותר, הכא"מ, הזרם והכוח המגנטי עליו, B²L²v/R, גדלים, והכוח הזה פועל נגד התנועה. התאוצה קטנה, והמהירות מתקרבת למהירות הסופית FR/(B²L²).'
  remedy: { lesson: '5.4', anchor: fig-5-4a, label: 'איור 5.4: הפעילו את התנועה וראו את גרף המהירות מתיישר ליד v_T' }

- id: MC-rail-magnetic-force-helps
  title: 'הכוח המגנטי על המוט דוחף אותו קדימה'
  belief: 'הזרם המושרה במוט יוצר עליו כוח מגנטי בכיוון התנועה, כמו במנוע, והכוח עוזר לכוח המושך.'
  truth: 'הכוח המגנטי על הזרם המושרה תמיד נגד התנועה. אילו דחף קדימה, המוט היה מאיץ ומייצר עוד זרם ועוד חום בלי שמישהו עושה עבודה, וזה סותר את שימור האנרגיה (חוק לנץ).'
  remedy: { lesson: '5.4', anchor: brake, label: 'הכוח הבולם: כלל כף יד ימין עם הזרם המושרה' }

- id: MC-rail-more-resistance-slower
  title: 'התנגדות גדולה יותר נותנת מהירות סופית קטנה יותר'
  belief: 'התנגדות היא סוג של חיכוך, ולכן כשמגדילים את R המוט מגיע למהירות סופית קטנה יותר.'
  truth: 'באותה מהירות, התנגדות גדולה יותר נותנת זרם קטן יותר, ולכן כוח בולם קטן יותר. המוט צריך לנוע מהר יותר כדי שהכוח הבולם ישתווה לכוח המושך, v_T = FR/(B²L²) גדלה עם R.'
  remedy: { lesson: '5.4', anchor: fig-5-4a, label: 'איור 5.4: הכפילו את R אחרי שהמוט הגיע למהירות הסופית' }

- id: MC-rail-uniform-field-no-emf
  title: 'בשדה אחיד וקבוע אין השראה'
  belief: 'השדה המגנטי בין המסילות אחיד ולא משתנה, ולכן אין שום שינוי ואין כא"מ מושרה או זרם.'
  truth: 'השדה קבוע, אבל המוט נע: על המטענים החופשיים שבו פועל כוח לורנץ, והשטח של המעגל, ואיתו השטף דרכו, גדל בקצב BLv. השטף יכול להשתנות גם כשרק השטח משתנה.'
  remedy: { lesson: '5.4', anchor: flux, label: 'אותה תוצאה מחוק פאראדיי: השטח של המעגל גדל' }

- id: MC-rail-emf-needs-closed-circuit
  title: 'במוט שאינו מחובר לשום דבר אין כא"מ'
  belief: 'כא"מ מושרה נוצר רק כשהמוט סוגר מעגל. מוט שנע בשדה בלי מסילות ובלי נגד הוא סתם מוט, ואין הפרש פוטנציאלים בין קצותיו.'
  truth: 'כוח לורנץ פועל על המטענים במוט בכל מקרה. במוט פתוח הם מצטברים בקצוות עד שהשדה החשמלי שלהם מאזן את הכוח המגנטי, ואז בין הקצוות יש מתח BLv, כמו בין הדקי סוללה שלא מחוברת. בלי מעגל סגור אין רק זרם.'
  remedy: { lesson: '5.4', anchor: derive, label: 'מאיפה הכא"מ: מוט פתוח הוא סוללה' }

- id: MC-rail-terminal-no-current
  title: 'במהירות הסופית כבר אין זרם'
  belief: 'כשהמוט נע במהירות קבועה שום דבר לא משתנה, ולכן אין במעגל זרם ואין על המוט כוח מגנטי.'
  truth: 'במהירות הסופית הזרם הוא הגדול ביותר בכל הדרך, BLv_T/R, כי השטח של המעגל ממשיך לגדול באותו קצב. הכוח המגנטי שווה לכוח המושך, והם מבטלים זה את זה; לכן המהירות קבועה.'
  remedy: { lesson: '5.4', anchor: fig-5-4a, label: 'איור 5.4: במהירות הסופית הזרם והכוח F_B עדיין שם' }

- id: MC-rail-work-all-kinetic
  title: 'כל עבודת הכוח המושך הופכת לאנרגיה קינטית'
  belief: 'העבודה שהכוח המושך עושה על המוט הולכת כולה לאנרגיה הקינטית שלו, כמו בגוף שנמשך על משטח חלק בלי שדה.'
  truth: 'חלק מהעבודה הופך לחום בנגד, Q, בכל רגע שזורם זרם. בדרך למהירות הסופית W = ΔK + Q, ובמהירות הסופית כל העבודה הופכת לחום, F·v = I²R.'
  remedy: { lesson: '5.4', anchor: fig-5-4a, label: 'איור 5.4: עמודות האנרגיה, K₀ + W לעומת K + Q' }

- id: MC-rail-coasts-forever
  title: 'בלי הכוח המושך המוט ממשיך במהירות קבועה'
  belief: 'המסילות חלקות, ולכן אם מפסיקים למשוך את המוט הוא ממשיך לנוע במהירות קבועה, לפי החוק הראשון של ניוטון.'
  truth: 'הכוח המגנטי ממשיך לפעול כל עוד המוט נע, ונגד התנועה. בלי הכוח המושך זה הכוח היחיד לאורך המסילות, והמוט מאט עד שהוא נעצר. האנרגיה הקינטית שלו הופכת כולה לחום בנגד.'
  remedy: { lesson: '5.4', anchor: fig-5-4a, label: 'איור 5.4: הסירו את הכוח F כשהמוט נע מהר' }
