# Lesson 5.9 misconceptions. Each is detected by a tagged distractor in questions/ch5/5-9.yaml. The lesson's
# questions also tag misconceptions owned by other lessons: MC-gauss-outside-charge-counts, MC-gauss-flux-equals-kq
# (1.7), MC-no-field-between-plates, MC-displacement-is-charge-flow and MC-displacement-follows-field (6.12).
# The wave's misconceptions moved to 5-10.yaml with lesson 5.10.

- id: MC-maxwell-faraday-flux-closed-surface
  title: 'בחוק פאראדיי השטף נמדד דרך משטח סגור'
  belief: 'השטף המגנטי שבחוק פאראדיי (ובחוק אמפר-מקסוול, השטף החשמלי) נמדד דרך משטח סגור שמקיף את המסלול, כמו בחוקי גאוס.'
  truth: 'בשני החוקים של מסלול סגור, השטף נמדד דרך משטח פתוח שהמסלול הוא השפה שלו, כמו קרום של בועת סבון על טבעת. דרך משטח סגור השטף המגנטי תמיד אפס, ולכן אילו מדדו אותו כך, לא היה אף פעם כא״מ מושרה.'
  remedy: { lesson: '5.9', anchor: fig-5-9a, label: 'איור 5.9א: חוק אמפר-מקסוול, המשטח השטוח והשקית על אותו מסלול' }

- id: MC-maxwell-pole-is-a-source
  title: 'הקוטב הצפוני הוא מקור של שדה מגנטי, כמו מטען חיובי'
  belief: 'מהקוטב הצפוני של מגנט קווי השדה יוצאים לכל הכיוונים, ולכן דרך משטח סגור שמקיף רק אותו יש שטף מגנטי החוצה.'
  truth: 'קווי השדה המגנטי ממשיכים בתוך המגנט, מהקוטב הדרומי אל הצפוני. מה שיוצא מהמשטח בצד החיצוני נכנס אליו מבפנים, דרך המגנט, והשטף נטו אפס. אין קוטב מגנטי בודד: גם חצי מגנט הוא מגנט שלם.'
  remedy: { lesson: '5.9', anchor: fig-5-9a, label: 'איור 5.9א: חוק גאוס למגנטיות, הקובייה סביב הקוטב הצפוני' }

- id: MC-maxwell-flux-through-empty-area
  title: 'השטף דרך מסלול הוא השדה כפול כל השטח שלו'
  belief: 'השטף המגנטי דרך מסלול שמקיף ליבה של סליל הוא השדה שבליבה כפול כל השטח של המסלול, גם החלק שאין בו שדה. לכן כשהמסלול גדל, הסכום סביבו ממשיך לגדול.'
  truth: 'השטף נספר רק איפה שיש שדה מגנטי. כשהמסלול כבר מקיף את כל הליבה, השטף והסכום סביב המסלול לא גדלים יותר, אף שהשדה החשמלי המושרה קיים גם מחוץ לליבה.'
  remedy: { lesson: '5.9', anchor: fig-5-9a, label: 'איור 5.9א: חוק פאראדיי, הגדילו את המסלול מעבר לליבה' }

- id: MC-maxwell-no-induced-field-outside
  title: 'שדה מושרה יש רק איפה שהשדה המגנטי משתנה'
  belief: 'השדה החשמלי המושרה קיים רק בתוך האזור שבו השדה המגנטי משתנה. מחוץ לליבה של סליל אין שדה חשמלי, ולכן גם הסכום סביב מסלול שמקיף אותה מבחוץ הוא אפס.'
  truth: 'השדה המושרה ממלא את כל המרחב סביב הליבה, ונחלש עם המרחק. מסלול שמקיף את הליבה מבחוץ מקבל כא״מ שווה למינוס קצב השינוי של כל השטף שבליבה.'
  remedy: { lesson: '5.9', anchor: fig-5-9a, label: 'איור 5.9א: חוק פאראדיי, החיצים הכתומים מחוץ לליבה' }
