# Misconception register for lesson 1.1. Format and rules: see misconceptions/1-5.yaml.

- id: MC-charge-created
  title: שפשוף יוצר מטען
  belief: כשמשפשפים שני גופים נוצר מטען חדש, ולכן הבד יכול להישאר ניטרלי או להיטען באותו סימן כמו המוט.
  truth: מטען לא נוצר ולא נעלם. אלקטרונים עוברים מגוף אחד לשני. מה שהאחד איבד השני קיבל, והמטען הכולל נשאר אפס.
  remedy: { lesson: '1.1', anchor: fig-1-1b, label: 'איור 1.1ב: שפשפו וקראו את Q₁ + Q₂' }

- id: MC-charge-protons-move
  title: פרוטונים עוברים בחיכוך
  belief: גוף נעשה חיובי כי הוא קיבל פרוטונים.
  truth: בגופים מוצקים הפרוטונים כלואים בגרעינים. גוף נעשה חיובי כי איבד אלקטרונים.
  remedy: { lesson: '1.1', anchor: fig-1-1b, label: 'איור 1.1ב: רק האלקטרונים זזים' }

- id: MC-charge-neutral-means-empty
  title: ניטרלי פירושו בלי מטענים
  belief: גוף ניטרלי הוא גוף שאין בו מטענים חשמליים.
  truth: בגוף ניטרלי יש פרוטונים ואלקטרונים בכמויות שוות, ולכן הם מתקזזים.
  remedy: { lesson: '1.1', anchor: fig-1-1b, label: 'איור 1.1ב: גוף ניטרלי בתחילת השפשוף' }

- id: MC-charge-sign-decides-force
  title: סימן המטען קובע אם מושכים או דוחים
  belief: מטען חיובי תמיד מושך ומטען שלילי תמיד דוחה.
  truth: הכוח תלוי בצירוף של שני הסימנים. אותו סימן דוחה, סימנים הפוכים מושכים.
  remedy: { lesson: '1.1', anchor: fig-1-1a, label: 'איור 1.1א: נסו את ארבעת הצירופים' }

- id: MC-charge-continuous
  title: מטען יכול להיות כל ערך
  belief: אפשר לטעון גוף במטען כלשהו, גם של חצי אלקטרון.
  truth: המטען תמיד כפולה שלמה של המטען היסודי, |q| = n·e. אין מטען של חצי אלקטרון.
  remedy: { lesson: '1.1', anchor: fig-1-1b, label: 'איור 1.1ב: המטען קופץ בקפיצות של e' }

- id: MC-charge-conductor-stays
  title: במוליך המטען נשאר במקומו
  belief: מטען עודף שמונח על מתכת נשאר במקום שבו הונח.
  truth: במוליך האלקטרונים חופשיים והם דוחים זה את זה, ולכן המטען מתפזר על כל הגוף.
  remedy: { lesson: '1.1', anchor: fig-1-1c, label: 'איור 1.1ג: הניחו אלקטרונים על המוט המתכתי' }

- id: MC-charge-insulator-spreads
  title: גם במבודד המטען מתפזר
  belief: מטען עודף על פלסטיק מתפזר על כל הגוף, כמו במתכת.
  truth: במבודד האלקטרונים כמעט לא נעים, ולכן המטען נשאר במקום שבו נוצר.
  remedy: { lesson: '1.1', anchor: fig-1-1c, label: 'איור 1.1ג: המוט הפלסטי' }
