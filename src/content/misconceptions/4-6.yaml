# Lesson 4.6 misconceptions. Each is detected by a tagged distractor in questions/ch4/4-6.yaml.

- id: MC-orbit-period-depends-on-speed
  title: 'חלקיק מהיר יותר משלים סיבוב בפחות זמן'
  belief: 'אם מגדילים את המהירות של חלקיק טעון שמסתובב בשדה מגנטי, הוא משלים כל סיבוב מהר יותר.'
  truth: 'חלקיק מהיר יותר נע במעגל גדול יותר, r = mv/(qB). הדרך גדלה בדיוק פי כמה שהמהירות גדלה, ולכן זמן המחזור, T = 2πm/(qB), לא תלוי במהירות.'
  remedy: { lesson: '4.6', anchor: fig-4-6a, label: 'איור 4.6א: הפעילו "חלקיק שני במהירות כפולה" וראו ששניהם משלימים סיבוב יחד' }

- id: MC-spectrometer-heavier-closer
  title: 'יון כבד יותר נוחת קרוב יותר לסדק'
  belief: 'בספקטרומטר מסות, היון הכבד "נופל" מהר יותר או מתכופף יותר, ולכן נוחת קרוב יותר לסדק.'
  truth: 'לכל היונים אותו מטען, והם מקבלים אותה אנרגיה מהמתח המאיץ. היון הכבד יוצא איטי יותר, אבל קשה יותר לסובב אותו, והרדיוס שלו גדול יותר, r = √(2mU/q)/B. הוא נוחת רחוק יותר.'
  remedy: { lesson: '4.6', anchor: fig-4-6c, label: 'איור 4.6ג: השוו את נקודות הנחיתה של האיזוטופים' }

- id: MC-magnetic-orbit-spirals
  title: 'חלקיק בשדה מגנטי מאט ומסתחרר פנימה'
  belief: 'חלקיק טעון שמסתובב בשדה מגנטי מאבד מהירות עם הזמן, ולכן המסלול שלו הוא ספירלה שהולכת וקטנה.'
  truth: 'הכוח המגנטי ניצב תמיד למהירות, ולכן הוא לא עושה עבודה וגודל המהירות לא משתנה. בריק המסלול הוא מעגל סגור. ספירלה (כמו בתאי בועות) נוצרת רק כשהחלקיק מאבד אנרגיה בהתנגשויות עם חומר.'
  remedy: { lesson: '4.6', anchor: fig-4-6a, label: 'איור 4.6א: גודל המהירות בשורה שמתחת לאיור לא משתנה, והמעגל נסגר' }

- id: MC-electron-proton-same-sense
  title: 'אלקטרון ופרוטון מסתובבים לאותו כיוון'
  belief: 'באותו שדה מגנטי, אלקטרון ופרוטון שנעים באותו כיוון מתכופפים לאותו צד, כי השדה קובע את הכיוון.'
  truth: 'הכוח המגנטי על מטען שלילי הפוך לכוח על מטען חיובי שנע באותה מהירות. לכן אלקטרון ופרוטון מסתובבים בכיוונים מנוגדים, ובכניסה לאזור שדה הם מתכופפים לצדדים מנוגדים.'
  remedy: { lesson: '4.6', anchor: fig-4-6a, label: 'איור 4.6א: עברו בין פרוטון לאלקטרון ושימו לב לכיוון הסיבוב' }

- id: MC-orbit-force-outward
  title: 'על חלקיק שמסתובב פועל כוח החוצה מהמרכז'
  belief: 'חלקיק שמסתובב במעגל "נזרק החוצה", ולכן הכוח המגנטי עליו, או כוח נוסף, מכוון החוצה ממרכז המעגל.'
  truth: 'בתנועה מעגלית קצובה הכוח השקול מכוון אל המרכז, F = mv²/r. בשדה מגנטי הכוח המגנטי הוא הכוח הזה: הוא מכוון בכל רגע אל מרכז המעגל. אין כוח שמכוון החוצה.'
  remedy: { lesson: '4.6', anchor: fig-4-6a, label: 'איור 4.6א: חץ הכוח F מצביע תמיד אל מרכז המעגל' }
