# Lesson 3.9 misconceptions. Each is detected by a tagged distractor in questions/ch3/3-9.yaml.

- id: MC-charge-crosses-gap
  title: הזרם עובר דרך הקבל
  belief: בזמן הטעינה מטען עובר מלוח ללוח, דרך הרווח שבין לוחות הקבל.
  truth: 'בין הלוחות יש מבודד (או אוויר), ומטען לא עובר דרכו. בזמן הטעינה מטען זורם בתילים אל לוח אחד ומהלוח השני, ושם הוא מצטבר: +Q על לוח אחד ו-−Q על השני. הזרם בתילים נמשך רק כל עוד המטען על הלוחות משתנה.'
  remedy: { lesson: '3.9', anchor: fig-3-9a, label: 'איור 3.9א: עקבו אחרי הסימנים + ו-− שמצטברים על הלוחות בזמן הטעינה' }

- id: MC-capacitor-instant
  title: קבל נטען בבת אחת, או בקצב קבוע
  belief: ברגע שסוגרים את המעגל הקבל מתמלא מיד, או שהמתח עליו עולה באותו קצב עד שהוא מלא.
  truth: הקבל נטען מהר בהתחלה ולאט בסוף. ככל שהמתח עליו מתקרב לכא"מ, נשאר פחות מתח על הנגד, והזרם קטן. הקצב נקבע לפי τ = RC.
  remedy: { lesson: '3.9', anchor: fig-3-9a, label: 'איור 3.9א: הסתכלו על צורת הגרף של המתח בזמן הטעינה' }

- id: MC-full-after-tau
  title: אחרי τ הקבל מלא
  belief: קבוע הזמן τ הוא הזמן שלוקח לקבל להיטען עד הסוף.
  truth: אחרי τ אחד הקבל מגיע רק לכ-63% מהמתח הסופי. בכל τ נוסף נסגר עוד 63% מהפער שנשאר. אחרי כ-5τ הוא מגיע לכ-99%.
  remedy: { lesson: '3.9', anchor: fig-3-9a, label: 'איור 3.9א: גררו את הזמן ל-τ ול-5τ וקראו את המתח' }

- id: MC-tau-depends-emf
  title: סוללה חזקה יותר טוענת מהר יותר
  belief: עם סוללה של מתח גבוה יותר, הקבל נטען בזמן קצר יותר.
  truth: 'קבוע הזמן τ = RC לא תלוי בכא"מ. סוללה גבוהה יותר טוענת את הקבל למתח גבוה יותר ומתחילה בזרם גדול יותר, אבל באותו קצב יחסי: אחרי τ, 63% מהמתח הסופי.'
  remedy: { lesson: '3.9', anchor: fig-3-9a, label: 'איור 3.9א: שנו את הכא"מ וקראו את τ' }

- id: MC-current-through-cap-steady
  title: במצב יציב זורם זרם גם בענף של הקבל
  belief: במעגל זרם ישר, גם אחרי זמן רב, הקבל מעביר זרם כמו נגד.
  truth: 'במצב יציב המטען על הקבל כבר לא משתנה, ולכן בענף שלו לא זורם זרם: הקבל הוא כמו נתק. המתח עליו שווה למתח על הרכיבים שמחוברים אליו במקביל.'
  remedy: { lesson: '3.9', anchor: fig-3-9b, label: 'איור 3.9ב: קראו את הזרם בקבל' }
