# Lesson 4.3 misconceptions. Each is detected by a tagged distractor in questions/ch4/4-3.yaml.

- id: MC-coil-field-along-current
  title: השדה במרכז כריכה נמצא במישור הכריכה, לאורך הזרם
  belief: במרכז כריכה השדה המגנטי מצביע במישור הכריכה, באותו כיוון כמו הזרם, או מקביל לאחד מצדדיה.
  truth: כל קטע של הכריכה יוצר שדה שמקיף אותו (כלל יד ימין), ובמרכז כל הקטעים תורמים באותו כיוון, ניצב למישור הכריכה. מכופפים את האצבעות בכיוון הזרם, והאגודל מראה את השדה במרכז.
  remedy: { lesson: '4.3', anchor: fig-4-3a, label: 'איור 4.3א: כריכה אחת, השדה בין שני החתכים של הכריכה' }

- id: MC-solenoid-axis-zero
  title: על ציר הסליל השדה מתבטל
  belief: על ציר הסליל השדה אפס או חלש, כי השדות של הכריכות מצד אחד ומצד שני מבטלים זה את זה.
  truth: בחתך דרך הציר, הזרם בצד העליון של כל כריכה יוצא מהדף (⊙) ובצד התחתון נכנס לדף (⊗). בין שני הצדדים השדות שלהם באותו כיוון, לאורך הציר, ולכן הם מתחברים.
  remedy: { lesson: '4.3', anchor: fig-4-3a, label: 'איור 4.3א: הגשש על ציר הכריכה ועל ציר הסליל' }

- id: MC-solenoid-strongest-near-winding
  title: בתוך סליל השדה חזק ביותר ליד הכריכות
  belief: בתוך סליל השדה חזק ביותר קרוב לתיל, וחלש יותר באמצע, כמו ליד תיל ישר.
  truth: בתוך סליל ארוך השדה כמעט אחיד, B = μ₀nI, גם על הציר וגם ליד הכריכות (רק צמוד ממש לתיל מורגשות הכריכות הבודדות). כשמתרחקים מכריכה אחת מתקרבים לכריכה שבצד השני, והתרומות מתאזנות.
  remedy: { lesson: '4.3', anchor: fig-4-3a, label: 'איור 4.3א: בסליל, גררו את הגשש מהציר אל קרוב לכריכות' }

- id: MC-solenoid-radius-weakens
  title: סליל רחב יותר נותן שדה חלש יותר
  belief: אם מגדילים את הרדיוס של סליל ארוך ומשאירים את מספר הכריכות למטר ואת הזרם, השדה בתוכו נחלש, כי הכריכות רחוקות יותר מהמרכז.
  truth: בנוסחה B = μ₀nI אין רדיוס. בסליל ארוך, השדה בפנים תלוי רק בצפיפות הכריכות ובזרם. (בכריכה אחת השדה במרכז כן תלוי ברדיוס, B = μ₀NI/(2R).)
  remedy: { lesson: '4.3', anchor: fig-4-3a, label: 'איור 4.3א: בסליל, שנו את הרדיוס R וקראו את השדה בפנים' }

- id: MC-solenoid-length-irrelevant
  title: מתיחת סליל לא משנה את השדה
  belief: לסליל ארוך יותר עם אותו מספר כריכות ואותו זרם יש אותו שדה בפנים, כי יש בו אותן כריכות.
  truth: השדה תלוי בצפיפות הכריכות, n = N/L. מתיחת הסליל לאורך כפול, עם אותן N כריכות, מקטינה את n לחצי, ולכן גם את השדה.
  remedy: { lesson: '4.3', anchor: fig-4-3a, label: 'איור 4.3א: בסליל, קצרו את L לחצי בלי לשנות את N' }

- id: MC-compass-inside-solenoid
  title: מצפן בתוך סליל מצביע אל הקצה הדרומי
  belief: הקוטב הצפוני של מצפן שבתוך סליל מצביע אל הקצה הדרומי של הסליל, כמו ליד מגנט מבחוץ.
  truth: קווי השדה סגורים. מחוץ לסליל הם יוצאים מהקצה הצפוני ונכנסים לדרומי, ובתוכו הם ממשיכים מהדרומי אל הצפוני. לכן בתוך הסליל מחט המצפן מצביעה אל הקצה הצפוני.
  remedy: { lesson: '4.3', anchor: fig-4-3a, label: 'איור 4.3א: בסליל, הגשש בתוך הסליל ומחוץ לו' }
