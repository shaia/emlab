# Lesson 2.4 misconceptions. Each is detected by a tagged distractor in questions/ch2/2-4.yaml.

- id: MC-wider-gap-faster
  title: מרחק גדול יותר בין הלוחות נותן מהירות גדולה יותר
  belief: אם מרחיקים את הלוחות (באותו מתח), החלקיק מואץ לאורך דרך ארוכה יותר ולכן מגיע מהר יותר.
  truth: האנרגיה הקינטית שהחלקיק מקבל היא |q|V, והיא תלויה רק במתח. בלוחות רחוקים יותר השדה E = V/d חלש יותר, והחלקיק מואץ לאט יותר לאורך דרך ארוכה יותר. המהירות בסוף זהה.
  remedy: { lesson: '2.4', anchor: fig-2-4a, label: 'איור 2.4א: שגרו באותו מתח עם מרחק שונה בין הלוחות' }

- id: MC-speed-proportional-voltage
  title: המהירות ביחס ישר למתח
  belief: מתח כפול נותן מהירות כפולה.
  truth: המתח קובע את האנרגיה הקינטית, ½mv² = |q|V. לכן v ∝ √V, ומתח גדול פי 4 נותן מהירות גדולה פי 2.
  remedy: { lesson: '2.4', anchor: fig-2-4a, label: 'איור 2.4א: שגרו במתח מסוים ובמתח גדול פי 4' }

- id: MC-same-voltage-same-speed
  title: אותו מתח נותן אותה מהירות לכל חלקיק
  belief: אלקטרון ופרוטון שעוברים אותו הפרש פוטנציאלים מגיעים לאותה מהירות.
  truth: הם מקבלים אותה אנרגיה קינטית, eV, כי גודל המטען שלהם שווה. אבל המסות שונות, ולכן האלקטרון מהיר פי √(m_p/m_e) ≈ 43.
  remedy: { lesson: '2.4', anchor: fig-2-4a, label: 'איור 2.4א: שגרו אלקטרון ופרוטון באותו מתח' }

- id: MC-climbs-any-hill
  title: חלקיק רק מאט, ובסוף עובר כל מחסום
  belief: חלקיק שנע נגד הכוח החשמלי רק מאט, ובסוף מגיע לצד השני, גם אם האנרגיה שלו קטנה.
  truth: אם האנרגיה הקינטית קטנה מ-|qΔV|, החלקיק נעצר בנקודת החזרה וחוזר. הוא מגיע רק אם K ≥ |qΔV|.
  remedy: { lesson: '2.4', anchor: fig-2-4a, label: 'איור 2.4א: שגרו פרוטון עם אנרגיה קטנה מול מתח גדול' }

- id: MC-no-energy-at-turn
  title: בנקודת החזרה לחלקיק אין אנרגיה
  belief: ברגע שהחלקיק נעצר, האנרגיה שלו אפס.
  truth: בנקודת החזרה האנרגיה הקינטית אפס, אבל האנרגיה הפוטנציאלית מקסימלית. האנרגיה הכוללת שווה לזו שהייתה לו בהתחלה, ולכן הוא חוזר באותה מהירות.
  remedy: { lesson: '2.4', anchor: fig-2-4b, label: 'איור 2.4ב: הסתכלו על הקו המקווקו של האנרגיה הכוללת בנקודת החזרה' }
