# Lesson 6.9 misconceptions. Each is detected by a tagged distractor in questions/ch6/6-9.yaml.

- id: MC-laplace-means-zero
  title: 'במקום שאין בו מטען, הפוטנציאל או השדה אפס'
  belief: 'משוואת לפלס, ∇²V = 0, אומרת שבאזור בלי מטען הפוטנציאל אפס, או לפחות שהשדה שם אפס.'
  truth: 'משוואת לפלס אומרת רק שסכום הנגזרות השניות אפס: הפוטנציאל בכל נקודה שווה לממוצע של סביבתה. V יכול להיות גדול, והשדה חזק; למשל בין לוחות קבל V משתנה קווית, ו-∇²V = 0.'
  remedy: { lesson: '6.9', anchor: fig-6-9a, label: 'איור 6.9א: הקופסה עם המכסה. בפנים אין מטען, ובכל זאת הפוטנציאל בין 0 ל-100 V' }

- id: MC-interior-potential-extremum
  title: 'באזור ריק יכול להיות לפוטנציאל שיא או שקע'
  belief: 'בין מוליכים או מטענים יכולה להיות באזור ריק נקודה שבה הפוטנציאל גבוה (או נמוך) מכל סביבתה, ושם מטען יכול לשבת בשיווי משקל יציב.'
  truth: 'במקום בלי מטען V שווה לממוצע של סביבתו, ולכן אינו יכול להיות גבוה מכל השכנים או נמוך מכולם. הערכים הקיצוניים נמצאים על המוליכים או על המטענים. מכאן משפט ארנשו: אין שיווי משקל יציב בכוחות אלקטרוסטטיים בלבד.'
  remedy: { lesson: '6.9', anchor: fig-6-9a, label: 'איור 6.9א: הערך הגבוה ביותר בצומת ריק תמיד צמוד למוליך' }

- id: MC-image-charge-real
  title: 'מטען הדמות קיים באמת בתוך המוליך'
  belief: 'מאחורי המישור המוליך יש באמת מטען −q, והפוטנציאל של q ושל הדמות נכון גם בתוך המוליך.'
  truth: 'הדמות היא כלי חישוב. המטען האמיתי הוא המטען המושרה, הפרוס על פני המישור. הפתרון q + דמות נכון רק בצד של המטען; בתוך המוליך V = 0 ואין שדה.'
  remedy: { lesson: '6.9', anchor: fig-6-9a, label: 'איור 6.9א, "תיל מול מישור": בתוך המתכת הפוטנציאל אפס, והדמות מסומנת כטבעת מקווקוות' }

- id: MC-image-distance-d
  title: 'הכוח על מטען ליד מישור מוארק הוא kq²/d²'
  belief: 'מטען q במרחק d ממישור מוליך מוארק מרגיש כוח kq²/d², כאילו מטען −q יושב על המישור עצמו.'
  truth: 'הדמות נמצאת במרחק d מאחורי המישור, כלומר 2d מהמטען, והכוח kq²/(2d)²: רבע מ-kq²/d².'
  remedy: { lesson: '6.9', anchor: images, label: 'שיעור 6.9, "מטען מול מישור מוארק": איפה יושבת הדמות' }

- id: MC-uniqueness-needs-solving
  title: 'פוטנציאל שניחשנו הוא רק קירוב'
  belief: 'פתרון שמתקבל מניחוש (כמו מטען דמות) הוא קירוב או פתרון אפשרי אחד מני רבים, ואי אפשר לסמוך עליו בלי לפתור את המשוואה ישירות.'
  truth: 'משפט היחידות: אם הניחוש מקיים את משוואת פואסון באזור ואת כל תנאי השפה, אין פתרון אחר. ניחוש נכון הוא הפתרון המדויק.'
  remedy: { lesson: '6.9', anchor: fig-6-9a, label: 'איור 6.9א: ניחוש אקראי, והרשת מתכנסת שוב לאותו פתרון' }
