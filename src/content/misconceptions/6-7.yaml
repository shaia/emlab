# Lesson 6.7 misconceptions. Each is detected by a tagged distractor in questions/ch6/6-7.yaml.

- id: MC-div-zero-means-field-zero
  title: 'דיברגנץ אפס פירושו שאין שדה'
  belief: 'אם ∇·E = 0 בנקודה או באזור, השדה החשמלי שם הוא אפס.'
  truth: '∇·E = 0 אומר שאין מטען בנקודה: כמה שטף שנכנס לתיבה זעירה סביבה, כך יוצא. השדה עצמו יכול להיות חזק, כמו בשדה אחיד או ליד קו טעון.'
  remedy: { lesson: '6.7', anchor: fig-6-7a, label: 'איור 6.7א: תיבה ליד הקו הטעון, שבה השדה חזק והשטף נטו אפס' }

- id: MC-strong-field-big-divergence
  title: 'שדה חזק פירושו דיברגנץ גדול'
  belief: 'במקום שבו השדה חזק, או שבו הקווים מתפזרים, השטף נטו מתיבה קטנה גדול, ולכן גם הדיברגנץ.'
  truth: 'הדיברגנץ תלוי בשינוי של השדה סביב הנקודה, לא בעוצמה שלו. ליד קו טעון, מחוץ לו, השטף שנכנס לתיבה שווה לשטף שיוצא ממנה, והדיברגנץ אפס.'
  remedy: { lesson: '6.7', anchor: fig-6-7a, label: 'איור 6.7א: קרבו את התיבה לקו הטעון בלי שיעבור בתוכה' }

- id: MC-zero-field-zero-divergence
  title: 'במקום שבו השדה אפס אין מטען'
  belief: 'אם השדה החשמלי בנקודה הוא אפס, אין בה מטען, כלומר ∇·E = 0 שם.'
  truth: 'שדה אפס בנקודה לא אומר כלום על השינוי שלו סביבה. בציר של מוט טעון באחידות השדה אפס, אבל הוא גדל לכל הכיוונים כשמתרחקים מהציר, ו-∇·E = ρ/ε₀.'
  remedy: { lesson: '6.7', anchor: fig-6-7a, label: 'איור 6.7א: במוט הטעון, הביאו את מרכז התיבה לציר' }

- id: MC-inner-faces-count
  title: 'הדפנות הפנימיות מוסיפות שטף'
  belief: 'כשמחלקים נפח לתיבות קטנות, הסכום של השטפים שלהן גדול מהשטף של התיבה הגדולה, כי יש יותר דפנות.'
  truth: 'כל דופן פנימית משותפת לשתי תיבות, והאנך "החוצה" שלה מצביע לכיוונים הפוכים בשתיהן: מה שיוצא מאחת נכנס לשנייה. בסכום השטף דרכה מתבטל, ונשארות רק הדפנות החיצוניות.'
  remedy: { lesson: '6.7', anchor: fig-6-7a, label: 'איור 6.7א: חלקו את התיבה לקוביות קטנות, והשוו את סכום השטפים לשטף של התיבה הגדולה' }
