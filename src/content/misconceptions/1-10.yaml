# Lesson 1.10 misconceptions. Each is detected by a tagged distractor in questions/ch1/1-10.yaml.

- id: MC-beam-follows-field
  title: החלקיק תמיד נע בכיוון השדה
  belief: מטען בשדה חשמלי מואץ בכיוון השדה, בלי קשר לסימן המטען. אלקטרון בשדה שמצביע ימינה יואץ ימינה.
  truth: הכוח הוא F = qE. על מטען חיובי הוא בכיוון השדה, ועל מטען שלילי, כמו אלקטרון, בכיוון ההפוך.
  remedy: { lesson: '1.10', anchor: fig-1-10a, label: 'איור 1.10א: החליפו בין אלקטרון לפרוטון והפכו את השדה' }

- id: MC-heavier-deflects-more
  title: חלקיק כבד מוסט יותר
  belief: פרוטון כבד פי 1800 בערך מאלקטרון, ולכן הוא מוסט יותר.
  truth: הכוח על שניהם שווה בגודלו, qE עם |q| = e. התאוצה היא a = qE/m, ולכן חלקיק כבד יותר מואץ פחות ומוסט פחות.
  remedy: { lesson: '1.10', anchor: fig-1-10a, label: 'איור 1.10א: עברו לפרוטון באותה מהירות' }

- id: MC-faster-deflects-more
  title: חלקיק מהיר מוסט יותר
  belief: חלקיק מהיר יותר "חזק" יותר, ולכן ההסטה שלו גדולה יותר.
  truth: חלקיק מהיר עובר את הלוחות בזמן קצר יותר, ולכן השדה פועל עליו זמן קצר יותר. ההסטה y = qEx²/(2mv²) קטנה כשהמהירות גדלה, פי 4 כשהמהירות מוכפלת.
  remedy: { lesson: '1.10', anchor: fig-1-10a, label: 'איור 1.10א: הגדילו את המהירות וקראו את הכתם' }

- id: MC-beam-keeps-bending
  title: הקרן ממשיכה להתעקם אחרי הלוחות
  belief: אחרי שהקרן יוצאת מהלוחות המסלול שלה ממשיך להיות עקום.
  truth: מחוץ ללוחות אין שדה, ולכן אין כוח. הקרן ממשיכה בקו ישר במהירות הקבועה שהייתה לה ביציאה.
  remedy: { lesson: '1.10', anchor: fig-1-10b, label: 'איור 1.10ב: עקבו אחרי הקרן עד המסך' }

- id: MC-hover-no-forces
  title: טיפה מרחפת היא טיפה בלי כוחות
  belief: אם הטיפה לא זזה, לא פועל עליה כוח חשמלי, או שאין שדה.
  truth: 'שני כוחות פועלים עליה והם שווים והפוכים: המשקל כלפי מטה וכוח השדה כלפי מעלה. הסכום שלהם אפס, וזה מה שמאפשר למדוד את המטען.'
  remedy: { lesson: '1.10', anchor: fig-1-10c, label: 'איור 1.10ג: הציגו את חיצי הכוחות וכווננו את השדה' }

- id: MC-ignore-drift-after-plates
  title: הכתם על המסך הוא ההסטה בסוף הלוחות
  belief: המרחק של הכתם מהמרכז הוא ההסטה y בסוף הלוחות.
  truth: אחרי הלוחות הקרן ממשיכה בקו ישר בשיפוע tan θ, ומתרחקת מהציר עוד D·tan θ. הכתם רחוק מההסטה בסוף הלוחות.
  remedy: { lesson: '1.10', anchor: fig-1-10b, label: 'איור 1.10ב: עקבו אחרי הקרן מסוף הלוחות עד המסך' }
