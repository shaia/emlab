# Misconception register for lesson 1.2. Format and rules: see misconceptions/1-5.yaml.

- id: MC-contact-all-charge-moves
  title: במגע כל המטען עובר
  belief: כשגוף טעון נוגע בגוף זהה, כל המטען עובר אליו.
  truth: בשני גופים מוליכים זהים המטען מתחלק שווה בשווה. כל גוף נשאר עם מחצית.
  remedy: { lesson: '1.2', anchor: fig-1-2b, label: 'איור 1.2ב: אחרי המגע גם המוט נשאר טעון' }

- id: MC-contact-opposite-sign
  title: במגע מתקבל סימן הפוך
  belief: אחרי מגע עם מוט שלילי האלקטרוסקופ נעשה חיובי.
  truth: במגע אלקטרונים עוברים מהמוט, והגופים נשארים מאותו סימן. סימן הפוך מתקבל רק בהשראה.
  remedy: { lesson: '1.2', anchor: fig-1-2b, label: 'איור 1.2ב: טעינה במגע' }

- id: MC-induction-same-sign
  title: בהשראה מתקבל אותו סימן כמו במוט
  belief: אחרי טעינה בהשראה האלקטרוסקופ נושא את הסימן של המוט.
  truth: בהשראה האלקטרונים של הצד הרחוק יוצאים לאדמה, ולכן האלקטרוסקופ נשאר עם סימן הפוך למוט.
  remedy: { lesson: '1.2', anchor: fig-1-2b, label: 'איור 1.2ב: טעינה בהשראה, שלב אחר שלב' }

- id: MC-induction-rod-loses-charge
  title: בהשראה המוט מוותר על מטען
  belief: בטעינה בהשראה המוט נותן מטען לאלקטרוסקופ ולכן המטען שלו קטן.
  truth: המוט לא נוגע באלקטרוסקופ ולא מאבד מטען. הוא רק גורם למטענים באלקטרוסקופ לזוז.
  remedy: { lesson: '1.2', anchor: fig-1-2b, label: 'איור 1.2ב: המטען של המוט בשורת הנתונים' }

- id: MC-ground-neutralises
  title: הארקה תמיד מנטרלת
  belief: אחרי הארקה הגוף תמיד ניטרלי, ולכן אי אפשר לטעון באמצעותה.
  truth: כשמארקים בזמן שמוט טעון קרוב, האדמה לוקחת אלקטרונים או נותנת אותם. אם מנתקים את ההארקה לפני שמרחיקים את המוט, הגוף נשאר טעון. אם מרחיקים לפני, הוא חוזר להיות ניטרלי.
  remedy: { lesson: '1.2', anchor: fig-1-2b, label: 'איור 1.2ב: הארקה, ניתוק והרחקה, בשני הסדרים' }

- id: MC-electroscope-needs-net-charge
  title: עלים נפתחים רק אם יש מטען כולל
  belief: אם האלקטרוסקופ ניטרלי, העלים לא יכולים להיפתח.
  truth: העלים נפתחים כשיש עליהם מטען עודף, גם אם המטען הכולל אפס. מוט קרוב מזיז אלקטרונים אל העלים.
  remedy: { lesson: '1.2', anchor: fig-1-2a, label: 'איור 1.2א: קרבו מוט לאלקטרוסקופ ניטרלי' }

- id: MC-electroscope-sign-by-opening
  title: פתיחת העלים מראה את הסימן
  belief: ממידת הפתיחה של העלים אפשר לדעת אם המטען חיובי או שלילי.
  truth: 'העלים נפתחים באותו אופן לשני הסימנים. הסימן נקבע לפי ההשפעה של מוט ידוע: נפתחים עוד או נסגרים.'
  remedy: { lesson: '1.2', anchor: fig-1-2a, label: 'איור 1.2א: מוט מאותו סימן ומסימן הפוך' }

- id: MC-neutral-no-force
  title: גוף ניטרלי לא מרגיש כוח
  belief: גוף ניטרלי לא נמשך ולא נדחה על ידי גוף טעון.
  truth: במבודד ניטרלי המטענים זזים מעט, הצד הקרוב מנוגד בסימן לגוף הטעון, ויש כוח משיכה.
  remedy: { lesson: '1.2', anchor: fig-1-2c, label: 'איור 1.2ג: קרבו גוף טעון אל מבודד ניטרלי' }

- id: MC-polarisation-needs-transfer
  title: כדי להיצמד צריך שיעבור מטען
  belief: בלון נדבק לקיר כי הוא העביר לקיר מטען, או כי הקיר טעון.
  truth: הקיר ניטרלי ולא קיבל אלקטרונים. הוא מתקטב, והמולקולות שבו מתיישרות כך שהצד הקרוב לבלון מנוגד לו.
  remedy: { lesson: '1.2', anchor: fig-1-2c, label: 'איור 1.2ג: אף אלקטרון לא עוזב את המולקולה' }

- id: MC-polarisation-sign-matters
  title: גוף ניטרלי נמשך רק לסימן אחד
  belief: פיסת נייר ניטרלית נמשכת רק למוט מסימן מסוים, או נדחית ממוט מהסימן שלה.
  truth: הנייר נמשך לשני הסימנים, כי הצד הקרוב תמיד מנוגד בסימן למוט.
  remedy: { lesson: '1.2', anchor: fig-1-2c, label: 'איור 1.2ג: הפכו את סימן הגוף הטעון' }
