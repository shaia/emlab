# Lesson 5.3 misconceptions. Each is detected by a tagged distractor in questions/ch5/5-3.yaml.

- id: MC-lenz-opposes-field
  title: השדה המושרה תמיד הפוך לשדה של המגנט
  belief: לפי חוק לנץ השדה המגנטי של הזרם המושרה תמיד מצביע נגד השדה של המגנט.
  truth: השדה המושרה מתנגד לשינוי בשטף, לא לשדה. כשהשטף גדל, השדה המושרה הפוך לשדה של המגנט; כשהשטף קטן, השדה המושרה באותו כיוון כמו השדה של המגנט, כאילו הוא מנסה להשלים את מה שחסר.
  remedy: { lesson: '5.3', anchor: fig-5-3a, label: 'איור 5.3א: קרבו את המגנט והרחיקו אותו, והשוו את החץ החלול של השדה המושרה לקווי השדה של המגנט' }

- id: MC-lenz-ring-attracted-like-iron
  title: טבעת נחושת נמשכת אל מגנט שמתקרב
  belief: מגנט מושך מתכות, ולכן טבעת נחושת או אלומיניום תימשך אל מגנט שמקרבים אליה, כמו מסמר ברזל.
  truth: נחושת ואלומיניום כמעט לא מגיבים למגנט שעומד במקום. כשהמגנט מתקרב, הזרם המושרה הופך את הצד של הטבעת שפונה אליו לקוטב זהה לקוטב שלו, והטבעת נדחית.
  remedy: { lesson: '5.3', anchor: fig-5-3a, label: 'איור 5.3א: קרבו את המגנט וראו את חץ הכוח על הטבעת' }

- id: MC-lenz-always-repels
  title: השראה תמיד דוחה
  belief: כוח ההשראה תמיד דוחה את הטבעת מהמגנט, גם כשהמגנט מתרחק ממנה.
  truth: הכוח מתנגד לתנועה היחסית. כשהמגנט מתקרב הטבעת נדחית; כשהוא מתרחק, השטף קטן, הצד שפונה למגנט הופך לקוטב הנגדי, והטבעת נמשכת אחריו.
  remedy: { lesson: '5.3', anchor: fig-5-3a, label: 'איור 5.3א: הרחיקו את המגנט וראו את חץ הכוח מתהפך' }

- id: MC-lenz-pole-decides-force
  title: קוטב צפוני דוחה את הטבעת, קוטב דרומי מושך אותה
  belief: הכיוון של הכוח על הטבעת נקבע לפי הקוטב של המגנט שפונה אליה.
  truth: הכוח נקבע לפי התנועה, לא לפי הקוטב. מגנט מתקרב דוחה את הטבעת, בין שהקוטב הצפוני פונה אליה ובין שהדרומי. הפיכת המגנט הופכת את כיוון הזרם ואת הקוטב שנוצר בטבעת, אבל לא את הכוח.
  remedy: { lesson: '5.3', anchor: fig-5-3a, label: 'איור 5.3א: הפכו את המגנט וקרבו אותו שוב' }

- id: MC-lenz-force-without-motion
  title: מגנט שעומד ליד טבעת מפעיל עליה כוח
  belief: יש זרם מושרה, ולכן גם כוח על הטבעת, בכל פעם שיש שטף מגנטי דרכה, גם כשהמגנט במנוחה.
  truth: זרם מושרה זורם רק כשהשטף משתנה. מגנט שמוחזק במנוחה ליד טבעת נחושת, אפילו בתוכה, לא יוצר בה זרם ולא מפעיל עליה כוח.
  remedy: { lesson: '5.3', anchor: fig-5-3a, label: 'איור 5.3א: עצרו את המגנט ליד הטבעת, וקראו את הזרם' }

- id: MC-lenz-direction-arbitrary
  title: הכיוון בחוק לנץ הוא סתם הסכם
  belief: הכיוון של הזרם המושרה הוא עניין של הגדרה, וגם זרם בכיוון ההפוך היה מתאים לטבע.
  truth: זרם בכיוון ההפוך היה מושך מגנט שמתקרב, מאיץ אותו, ומגדיל עוד את הזרם, ובכל זאת הטבעת הייתה מתחממת. אנרגיה הייתה נוצרת מכלום. חוק לנץ הוא שימור אנרגיה.
  remedy: { lesson: '5.3', anchor: energy, label: 'ההסבר "למה דווקא מתנגד?" והמתג "מה אם הזרם הפוך?" באיור 5.3א' }

- id: MC-lenz-split-ring-jumps
  title: גם טבעת חתוכה קופצת
  belief: הטבעת קופצת מעל הסליל כי היא עשויה מתכת, ולכן גם טבעת עם חריץ תקפוץ.
  truth: בטבעת חתוכה אין מסלול סגור, ולכן אין בה זרם מושרה, אין קוטב ואין כוח. היא נשארת במקומה.
  remedy: { lesson: '5.3', anchor: jumping-ring, label: 'ההסבר על הטבעת הקופצת' }

- id: MC-eddy-copper-magnetic
  title: הנחושת מאטה את המגנט כי היא נמשכת אליו
  belief: מגנט נופל לאט בצינור נחושת כי הנחושת מגנטית, והמגנט נצמד לדפנות.
  truth: נחושת לא נמשכת למגנט במנוחה. המגנט הנופל משנה את השטף דרך כל טבעת של הצינור, וזרמי הערבולת בדופן דוחים אותו מלמטה ומושכים אותו מלמעלה. גליל ברזל לא ממוגנט נופל באותו צינור בנפילה חופשית.
  remedy: { lesson: '5.3', anchor: fig-5-3b, label: 'איור 5.3ב: השוו נחושת לפלסטיק, וראו את הזרמים בדופן מקרוב' }

- id: MC-eddy-brake-stops-completely
  title: בלם מגנטי עוצר לגמרי
  belief: בלם מגנטי מפעיל כוח קבוע, ולכן הוא יכול לעצור רכבת עד לעצירה מלאה, או לעצור מגנט בתוך צינור.
  truth: כוח הבלימה המגנטית ביחס ישר למהירות. ככל שהגוף מאט, הכוח נחלש, ובמהירות אפס הוא נעלם. מגנט בצינור לא נעצר אלא מגיע למהירות סופית, ורכבת צריכה בלם חיכוך כדי לעצור לגמרי.
  remedy: { lesson: '5.3', anchor: fig-5-3b, label: 'איור 5.3ב: גרף המהירות של מגנט בצינור נחושת מגיע לקו אופקי, לא לאפס' }

- id: MC-eddy-slots-no-effect
  title: חריצים בלוח מתכת לא משנים את הבלימה
  belief: לוח מתכת עם חריצים נבלם בשדה מגנטי בדיוק כמו לוח שלם, כי זו אותה מתכת.
  truth: זרמי הערבולת זורמים במסלולים סגורים בתוך הלוח. חריצים קוטעים את המסלולים הגדולים, הזרמים נחלשים מאוד, והלוח המחורץ מתנדנד כמעט בלי בלימה.
  remedy: { lesson: '5.3', anchor: eddy, label: 'ההסבר "זרמי ערבולת" על המטוטלת עם הלוח השלם והלוח המחורץ' }
