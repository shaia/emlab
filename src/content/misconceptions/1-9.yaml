# Misconceptions of lesson 1.9. Format and rules: see misconceptions/1-5.yaml.

- id: MC-conductor-partial-shield
  title: מוליך רק מחליש את השדה בפנים
  belief: בתוך מוליך בשדה חיצוני נשאר שדה, קטן יותר מבחוץ.
  truth: המטענים החופשיים זזים עד שהשדה בתוך המוליך מתאפס לגמרי. כל עוד נשאר שדה, יש כוח והמטענים ממשיכים לנוע.
  remedy: { lesson: '1.9', anchor: fig-1-9a, label: 'איור 1.9א: גררו את מטען הבוחן לתוך המוליך' }

- id: MC-conductor-volume-charge
  title: מטען עודף מתפזר בכל נפח המוליך
  belief: מטען שמוסיפים למוליך מתפזר בתוך הנפח, או מתרכז במרכזו.
  truth: מטענים בני אותו סימן דוחים זה את זה, ובשיווי משקל כל המטען העודף נמצא על פני השטח החיצוניים. בתוך המוליך אין מטען עודף.
  remedy: { lesson: '1.9', anchor: fig-1-9b, label: 'איור 1.9ב: המטענים המושרים נמצאים רק על פני הכדור' }

- id: MC-conductor-tangential-field
  title: השדה ליד פני מוליך יכול להיות בכל זווית
  belief: ליד פני מוליך השדה יכול לפגוש את המשטח בכל זווית, גם לאורכו.
  truth: אם לשדה היה רכיב לאורך המשטח, המטענים החופשיים היו מחליקים לאורכו. בשיווי משקל השדה ליד המשטח ניצב לו.
  remedy: { lesson: '1.9', anchor: fig-1-9b, label: 'איור 1.9ב: הקווים פוגשים את הכדור בזווית ישרה' }

- id: MC-cage-hides-inside-charge
  title: כלוב פאראדיי חוסם גם שדה של מטען מבפנים
  belief: מטען שנמצא בתוך כלוב מתכת לא יוצר שדה מחוצה לו.
  truth: הכלוב מגן על מה שבתוכו מפני שדה חיצוני סטטי. מטען בתוך חלל מושרה על פני המוליך, ויוצר שדה גם מחוץ לו.
  remedy: { lesson: '1.9', anchor: cage-inside-charge, label: 'הסבר: מטען בתוך החלל' }
