# Lesson 5.10 misconceptions. Each is detected by a tagged distractor in questions/ch5/5-10.yaml. The first two
# came from lesson 5.9 when the wave became a lesson of its own. The lesson's questions also tag misconceptions
# owned by lesson 6.14: MC-em-fields-alternate, MC-em-wave-needs-medium and MC-wave-arrows-are-motion.

- id: MC-maxwell-speed-depends-on-frequency
  title: 'גל בתדירות גבוהה נע מהר יותר'
  belief: 'קרני רנטגן ואור נעים בריק מהר יותר מגלי רדיו, כי התדירות שלהם גבוהה יותר: יותר מחזורים בשנייה פירושו התקדמות מהירה יותר.'
  truth: 'בריק כל הגלים האלקטרומגנטיים נעים באותה מהירות, c = 1/√(μ₀ε₀), כי היא תלויה רק בשני הקבועים. תדירות גבוהה יותר פירושה אורך גל קצר יותר, λ = c/f, לא מהירות גדולה יותר.'
  remedy: { lesson: '5.10', anchor: fig-5-10a, label: 'איור 5.10א: שנו את התדירות, וקראו את המהירות ואת אורך הגל' }

- id: MC-maxwell-light-unlike-radio
  title: 'אור וגלי רדיו הם שני דברים שונים במהותם'
  belief: 'גלי רדיו הם תופעה חשמלית, ואור הוא משהו אחר לגמרי. רק מה שאנטנות משדרות קשור לחשמל ולמגנטיות.'
  truth: 'אור, גלי רדיו, מיקרוגל, קרני רנטגן וקרינת גמא הם כולם גלים אלקטרומגנטיים: שדה חשמלי ושדה מגנטי שמקיימים זה את זה. הם נבדלים רק בתדירות, ולכן באורך הגל, ונעים בריק באותה מהירות.'
  remedy: { lesson: '5.10', anchor: fig-5-10a, label: 'איור 5.10א: הספקטרום, מגלי רדיו ועד קרינת גמא' }

- id: MC-em-wave-from-steady-current
  title: 'כל זרם, וכל מטען, משדר גל אלקטרומגנטי'
  belief: 'אנטנה משדרת גל כל עוד יש בה זרם, גם זרם קבוע מסוללה. גם מטען שעומד במקום שולח גל, כי יש סביבו שדה.'
  truth: 'גל נוצר רק כשהשדות משתנים. מטען במנוחה יוצר שדה חשמלי קבוע, וזרם קבוע יוצר שדה מגנטי קבוע: אין שם שום קצב שינוי, ולכן אין שרשרת של שדות שיוצרים זה את זה. אנטנה משדרת כשהמטענים בה נעים הלוך ושוב, בזרם חילופין, והגל יוצא באותה תדירות.'
  remedy: { lesson: '5.10', anchor: fig-5-10a, label: 'איור 5.10א: הגל קיים רק כל עוד השדות בו משתנים, בתדירות שבפס הגרירה' }

- id: MC-em-wave-carries-charge
  title: 'האות של הרדיו הוא מטענים שעפים מהמשדר למקלט'
  belief: 'הזרם שבאנטנה המשדרת ממשיך באוויר אל האנטנה הקולטת: אלקטרונים יוצאים מהמשדר ומגיעים למקלט, וכך נוצר בו זרם.'
  truth: 'שום מטען לא עובר מהמשדר למקלט. האלקטרונים של המשדר נעים הלוך ושוב במקום, בתוך האנטנה. מה שמתקדם הוא שדות: השדה החשמלי של הגל מגיע לאנטנה הקולטת ומניע הלוך ושוב את האלקטרונים שכבר נמצאים בה. הגל נושא אנרגיה ומידע, לא חומר ולא מטען.'
  remedy: { lesson: '5.10', anchor: fig-5-10a, label: 'איור 5.10א: החצים הם ערכי השדה בנקודות על הקו; שום דבר חומרי לא זז לאורכו' }
