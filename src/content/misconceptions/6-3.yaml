# Lesson 6.3 misconceptions. Each is detected by a tagged distractor in questions/ch6/6-3.yaml.

- id: MC-partial-zero-field-zero
  title: 'נגזרת חלקית אפס פירושה שדה אפס'
  belief: 'אם בנקודה מסוימת ∂V/∂x = 0, אז השדה החשמלי בנקודה הזו הוא אפס (או שהפוטנציאל לא משתנה בכלל סביבה).'
  truth: 'נגזרת חלקית מודדת שינוי בכיוון אחד בלבד. ∂V/∂x = 0 אומר רק שרכיב x של השדה אפס, Ex = −∂V/∂x = 0. בכיוון y הפוטנציאל יכול להשתנות, ואז Ey ≠ 0.'
  remedy: { lesson: '6.3', anchor: fig-6-3a, label: 'איור 6.3א: הציבו את P ישר מעל המטען, והשוו את ∂V/∂x לשדה E' }

- id: MC-field-nonzero-all-partials
  title: 'אם יש שדה, הפוטנציאל משתנה בכל כיוון'
  belief: 'בנקודה שבה השדה אינו אפס, כל הנגזרות החלקיות של הפוטנציאל שונות מאפס: V משתנה לא משנה לאן זזים.'
  truth: 'בכיוון שניצב לשדה הפוטנציאל לא משתנה. למשל ישר מעל מטען נקודתי השדה אנכי, ולכן ∂V/∂x = 0 שם, אף שהשדה חזק.'
  remedy: { lesson: '6.3', anchor: fig-6-3a, label: 'איור 6.3א: הזיזו את P לאורך קו אנכי שעובר דרך המטען, וקראו את ∂V/∂x' }

- id: MC-cyl-s-is-distance-from-origin
  title: 'בקואורדינטות גליליות, s הוא המרחק מהראשית'
  belief: 'הקואורדינטה s בקואורדינטות גליליות היא המרחק של הנקודה מהראשית, כמו r בקואורדינטות כדוריות.'
  truth: 's הוא המרחק מציר z, לא מהראשית: s = √(x² + y²), בלי z. רק במישור z = 0 מתקיים s = r. באופן כללי s = r sin θ.'
  remedy: { lesson: '6.3', anchor: fig-6-3b, label: 'איור 6.3ב: עברו בין גליליות לכדוריות, והרימו את P בציר z' }

- id: MC-cross-product-commutes
  title: 'הסדר במכפלה וקטורית לא משנה'
  belief: 'A×B = B×A, כמו בכפל של מספרים ובמכפלה סקלרית.'
  truth: 'החלפת הסדר הופכת את הכיוון: B×A = −A×B. הגודל זהה, אבל וקטור שיצא מהדף נכנס לתוכו.'
  remedy: { lesson: '6.3', anchor: fig-6-3c, label: 'איור 6.3ג: החליפו בין A×B ל-B×A וצפו בסימן ⊙ שהופך ל-⊗' }

- id: MC-cross-product-in-plane
  title: 'המכפלה הווקטורית נמצאת במישור של שני הווקטורים'
  belief: 'A×B מצביע לכיוון כלשהו בין A ל-B, במישור ששניהם נמצאים בו, כמו הסכום שלהם.'
  truth: 'A×B ניצב לשני הווקטורים, ולכן ניצב למישור שלהם. כששניהם בדף, המכפלה יוצאת מהדף (⊙) או נכנסת אליו (⊗).'
  remedy: { lesson: '6.3', anchor: fig-6-3c, label: 'איור 6.3ג: הפעילו את המכפלה הווקטורית, וראו שהיא מסומנת ⊙ או ⊗' }

- id: MC-coulomb-distance-from-origin
  title: 'בחוק קולון, r הוא המרחק מהראשית'
  belief: 'גם כשהמטען לא נמצא בראשית, בחוק קולון מציבים את המרחק של נקודת השדה מהראשית, |r|, והשדה מצביע לאורך r.'
  truth: 'השדה תלוי רק במיקום של נקודת השדה ביחס למטען: במרחק |r − r′| ובכיוון של r − r′. הנוסחה E = kq/r² של הבגרות מניחה בשקט שהמטען בראשית.'
  remedy: { lesson: '6.3', anchor: fig-6-3d, label: 'איור 6.3ד: גררו את הראשית O, וראו ש-r משתנה אבל E לא' }

- id: MC-separation-reversed
  title: 'וקטור ההפרדה מצביע מנקודת השדה אל המטען'
  belief: 'וקטור ההפרדה r − r′ יוצא מהנקודה שבה מודדים ומצביע אל המטען (או שאין הבדל בין r − r′ ל-r′ − r).'
  truth: 'r − r′ יוצא מנקודת המקור r′ (המטען) ומגיע לנקודת השדה r. לכן השדה של מטען חיובי מצביע לאורכו, הרחק מהמטען. r′ − r הוא הווקטור ההפוך, והוא היה הופך את כיוון השדה.'
  remedy: { lesson: '6.3', anchor: fig-6-3d, label: 'איור 6.3ד: החץ R = r − r′ יוצא מהמטען אל P' }

- id: MC-separation-magnitude-difference
  title: 'המרחק בין שתי נקודות הוא הפרש המרחקים שלהן מהראשית'
  belief: '|r − r′| = |r| − |r′|: כדי למצוא את המרחק בין המטען לנקודת השדה, מחסירים את המרחקים שלהם מהראשית.'
  truth: 'מחסירים וקטורים, רכיב-רכיב, ורק אחר כך לוקחים גודל. |r| − |r′| שווה למרחק רק כששתי הנקודות על אותה קרן מהראשית.'
  remedy: { lesson: '6.3', anchor: fig-6-3d, label: 'איור 6.3ד: השוו את |R| שבקריאה להפרש בין האורכים של r ו-r′' }
