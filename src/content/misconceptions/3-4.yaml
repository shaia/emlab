# Lesson 3.4 misconceptions. Each is detected by a tagged distractor in questions/ch3/3-4.yaml.

- id: MC-higher-r-brighter
  title: נורה עם התנגדות גדולה מאירה יותר
  belief: נורה שההתנגדות שלה גדולה "מתנגדת" יותר לזרם, ולכן מתחממת ומאירה יותר, בכל חיבור.
  truth: זה תלוי במה שמשותף לנורות. כששתיהן מחוברות לאותו מתח, P = V²/R, ולכן הנורה עם ההתנגדות **הקטנה** מאירה יותר. רק כשהן נושאות אותו זרם (בטור, שיעור 3.5), P = I²R והגדולה מאירה יותר.
  remedy: { lesson: '3.4', anchor: fig-3-4b, label: 'איור 3.4ב: שתי נורות על אותו מתח, איזו מאירה יותר?' }

- id: MC-power-proportional-v
  title: מתח כפול, הספק כפול
  belief: אם מכפילים את המתח על נגד, ההספק בו מוכפל.
  truth: כשמכפילים את המתח, גם הזרם מוכפל, וההספק P = VI גדל פי 4. בנגד קבוע P = V²/R, ביחס לריבוע המתח.
  remedy: { lesson: '3.4', anchor: fig-3-4a, label: 'איור 3.4א: הכפילו את המתח של הסוללה וקראו את ההספק' }

- id: MC-rated-power-fixed
  title: נורה של 60 וואט צורכת תמיד 60 וואט
  belief: ההספק שכתוב על מכשיר הוא ההספק שלו בכל מתח.
  truth: ההספק הנקוב הוא ההספק במתח הנקוב. מה שבערך קבוע הוא ההתנגדות, R = V²/P, ולכן במתח נמוך יותר ההספק קטן, ביחס לריבוע המתח.
  remedy: { lesson: '3.4', anchor: fig-3-4a, label: 'איור 3.4א: שנו את המתח של הסוללה, באותה נורה' }

- id: MC-kwh-is-power
  title: קילוואט-שעה הוא יחידה של הספק
  belief: קילוואט-שעה הוא "קילוואט לשעה", יחידה של הספק, כמו קמ"ש למהירות.
  truth: 'קילוואט-שעה הוא הספק **כפול** זמן, כלומר אנרגיה: 1 kWh = 1000 W · 3600 s = 3.6·10⁶ J. חשבון החשמל משלם על אנרגיה.'
  remedy: { lesson: '3.4', anchor: energy, label: 'שיעור 3.4: "אנרגיה וחשבון החשמל"' }

- id: MC-energy-lost
  title: האנרגיה שלא נוצלה נעלמה
  belief: במכשיר שהנצילות שלו 5%, 95% מהאנרגיה נעלמים.
  truth: אנרגיה לא נעלמת. החלק שלא הפך לצורה המועילה הפך לצורה אחרת, בדרך כלל לחום. נורת להט היא תנור טוב יותר משהיא מנורה.
  remedy: { lesson: '3.4', anchor: efficiency, label: 'שיעור 3.4: "נצילות"' }
