# Chapter-review misconceptions. Each is detected by a tagged distractor in questions/ch1/1-11.yaml.

- id: MC-leaves-show-sign
  title: פתיחת העלים מגלה את סימן המטען
  belief: אם העלים של אלקטרוסקופ לא טעון נפתחים כשמקרבים אליו מוט, המוט חיובי.
  truth: אלקטרוסקופ לא טעון מגיב באותו אופן לשני הסימנים, כי השראה מפרידה בו מטענים בשני המקרים. הפתיחה מראה שיש מטען, לא איזה סימן. כדי לקבוע סימן צריך אלקטרוסקופ שכבר טעון בסימן ידוע.
  remedy: { lesson: '1.11', anchor: exp-electroscope, label: 'הסבר: האלקטרוסקופ ומה הוא מראה' }

- id: MC-cage-needs-grounding
  title: כלוב פאראדיי מגן רק אם הוא מורקע
  belief: כדי שבתוך כלוב מתכת לא יהיה שדה, צריך לחבר אותו לאדמה.
  truth: בתוך חלל סגור של מוליך השדה אפס גם בלי הארקה, כי המטענים על המוליך מסתדרים עד שהשדה בתוכו מתאפס.
  remedy: { lesson: '1.11', anchor: exp-cage, label: 'הסבר: כלוב פאראדיי' }

- id: MC-cage-shields-both-ways
  title: כלוב מבטל את השדה גם מחוצה לו
  belief: אם מניחים מטען בתוך כלוב מתכת, לא יהיה שדה מחוץ לכלוב.
  truth: מטען בתוך חלל גורר מטען שווה ומנוגד על פנים החלל, ומטען עודף על המשטח החיצוני. המטען החיצוני יוצר שדה מחוץ לכלוב, אלא אם הכלוב מורקע.
  remedy: { lesson: '1.11', anchor: exp-cage, label: 'הסבר: כלוב פאראדיי, מטען בפנים' }

- id: MC-curve-shape-not-proof
  title: כל עקומה יורדת מוכיחה חוק ריבועי הפוך
  belief: אם הכוח קטן כשהמרחק גדל, זה מראה שהכוח הפוך לריבוע המרחק.
  truth: הרבה חוקים יורדים עם המרחק, למשל 1/r. כדי לדעת איזה, מציירים את F מול 1/r² ובודקים אם הנקודות על קו ישר.
  remedy: { lesson: '1.11', anchor: fig-1-11a, label: 'איור 1.11א: נסו את שלושת הצירים' }

- id: MC-slope-is-k
  title: שיפוע הגרף הוא הקבוע k
  belief: השיפוע של F מול 1/r² תמיד שווה ל-k.
  truth: השיפוע הוא k·q₁·q₂. רק כשמחלקים אותו במכפלת המטענים מקבלים את k, ומכפלת המטענים נחשבת מהשיפוע כשידוע k.
  remedy: { lesson: '1.11', anchor: fig-1-11a, label: 'איור 1.11א: קראו את השיפוע' }

- id: MC-unit-any-divisor
  title: כל יחידה שמתאימה לנתונים היא המטען היסודי
  belief: אם כל המטענים הם כפולות שלמות של יחידה כלשהי, היחידה הזו היא המטען היסודי.
  truth: אם כל הנתונים מתחלקים ביחידה u, הם מתחלקים גם בכל חלק שלה, כמו u/2. היחידה שמחפשים היא הגדולה ביותר שמתאימה, כי יחידה קטנה ממנה משאירה סימונים שאף טיפה לא הגיעה אליהם.
  remedy: { lesson: '1.11', anchor: fig-1-11b, label: 'איור 1.11ב: הקטינו את היחידה לחצי' }
