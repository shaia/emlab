# Lesson 6.12 misconceptions. Each is detected by a tagged distractor in questions/ch6/6-12.yaml.

- id: MC-displacement-is-charge-flow
  title: 'זרם העתקה הוא זרימת מטענים'
  belief: 'בין לוחות הקבל עוברים מטענים, למשל אלקטרונים שקופצים דרך הרווח, וזה זרם ההעתקה.'
  truth: 'בין הלוחות אין שום מטען שעובר: הרווח מבודד, והמטענים נערמים על הלוחות. זרם ההעתקה הוא ε₀ כפול קצב השינוי של השטף החשמלי. הוא נמדד באמפר ויוצר שדה מגנטי כמו זרם, אבל הוא שדה חשמלי שמשתנה, לא תנועה של מטען.'
  remedy: { lesson: '6.12', anchor: fig-6-12a, label: 'איור 6.12א: הנקודות שמסמנות את הזרם נעצרות על הלוחות, ובין הלוחות רק השדה החשמלי גדל' }

- id: MC-displacement-follows-field
  title: 'שדה חשמלי חזק פירושו זרם העתקה גדול'
  belief: 'זרם ההעתקה גדול כשהשדה בין הלוחות חזק, ולכן הוא הגדול ביותר כשהקבל מלא.'
  truth: 'זרם ההעתקה תלוי בקצב השינוי של השטף, לא בגודל השדה. כשהקבל מלא השדה הכי חזק, אבל הוא כבר לא משתנה, וזרם ההעתקה אפס. ברגע סגירת המתג השדה אפס, אבל הוא גדל הכי מהר, וזרם ההעתקה הכי גדול.'
  remedy: { lesson: '6.12', anchor: fig-6-12a, label: 'איור 6.12א: גררו את הזמן ל-5τ והשוו את השדה החשמלי לזרם ההעתקה' }

- id: MC-no-field-between-plates
  title: 'בין לוחות הקבל אין שדה מגנטי, כי אין שם זרם'
  belief: 'השדה המגנטי נוצר רק סביב תילים שזורם בהם זרם, ולכן ברווח שבין הלוחות, שאין בו מטענים נעים, אין שדה מגנטי.'
  truth: 'בזמן הטעינה יש שדה מגנטי גם בין הלוחות: הוא מקיף את הציר, כמו סביב התיל. מחוץ לשפת הלוחות הוא בדיוק μ₀I/(2πr), כמו ליד התיל. את השדה הזה יוצר זרם ההעתקה, והוא נמדד בניסויים.'
  remedy: { lesson: '6.12', anchor: fig-6-12a, label: 'איור 6.12א: הזיזו את מסלול אמפר אל בין הלוחות וקראו את השדה עליו' }

- id: MC-gap-field-like-wire
  title: 'בין הלוחות השדה המגנטי הוא μ₀I/(2πr) בכל מרחק'
  belief: 'בין לוחות הקבל השדה המגנטי יורד כמו 1/r מהציר, כמו ליד תיל, ולכן הוא הכי חזק ליד הציר.'
  truth: 'מעגל ברדיוס r קטן מרדיוס הלוחות מקיף רק את החלק r²/a² של השטף, ולכן גם של זרם ההעתקה. השדה בפנים הוא μ₀Ir/(2πa²): אפס על הציר, גדל כמו r, והגדול ביותר בשפת הלוחות. רק מעבר לשפה הוא μ₀I/(2πr).'
  remedy: { lesson: '6.12', anchor: fig-6-12a, label: 'איור 6.12א: גרף השדה לפי המרחק מהציר, ומסלול אמפר בין הלוחות שרדיוסו משתנה' }
