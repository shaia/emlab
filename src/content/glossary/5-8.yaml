# Lesson 5.8 terms. Added ahead of chapter 5, because lessons 6.13–6.14 use them. Format and rules: see glossary/1-5.yaml.

- id: maxwell-equations
  term: משוואות מקסוול
  en: Maxwell's equations
  definition: 'ארבעת החוקים שמתארים יחד את כל החשמל והמגנטיות: חוק גאוס לשדה החשמלי, חוק גאוס לשדה המגנטי (אין מטען מגנטי), חוק פאראדיי, וחוק אמפר-מקסוול. בצורה האינטגרלית הם מדברים על שטף וסירקולציה; בצורה הדיפרנציאלית על דיברגנץ ורוטור בכל נקודה.'
  lesson: '5.8'

- id: electromagnetic-spectrum
  term: ספקטרום אלקטרומגנטי
  en: electromagnetic spectrum
  definition: 'כל הגלים האלקטרומגנטיים, מסודרים לפי התדירות או לפי אורך הגל: גלי רדיו, מיקרוגל, תת-אדום, אור נראה, על-סגול, קרני רנטגן וקרינת גמא. בריק כולם נעים באותה מהירות, c = 3·10⁸ m/s, ונבדלים רק בתדירות, ולכן גם באורך הגל, λ = c/f. הגבולות בין התחומים מקובלים, ולא חדים.'
  lesson: '5.8'
