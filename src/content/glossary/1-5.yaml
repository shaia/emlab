# One spelling per concept, course-wide, matching the Bagrut papers.
# `reject` lists spellings that must not appear in course text (lint-content enforces it).

- id: electric-field
  term: שדה חשמלי
  en: electric field
  symbol: E
  unit: N/C
  definition: תכונה של המרחב סביב מטען. בכל נקודה, השדה הוא הכוח שפועל על מטען בוחן, מחולק במטען הבוחן, E = F/q₀. כיוונו הוא כיוון הכוח על מטען חיובי.
  reject: [שדה אלקטרי]
  lesson: '1.5'


- id: field-strength
  term: עוצמת השדה החשמלי
  en: electric field strength
  symbol: E
  unit: N/C
  definition: גודל וקטור השדה החשמלי בנקודה, בניוטון לקולון.
  reject: [חוזק השדה]
  lesson: '1.5'


- id: test-charge
  term: מטען בוחן
  en: test charge
  symbol: q₀
  definition: מטען קטן שמניחים בנקודה כדי למדוד את השדה בה. כיוון השדה מוגדר לפי הכוח על מטען בוחן חיובי; על מטען בוחן שלילי הכוח הפוך לשדה.
  reject: [מטען בדיקה, מטען ניסיון]
  lesson: '1.5'


- id: source-charge
  term: מטען מקור
  en: source charge
  definition: מטען שיוצר את השדה החשמלי שאנחנו חוקרים.
  lesson: '1.5'

