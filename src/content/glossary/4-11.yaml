# Lesson 4.11 terms. Format and rules: see glossary/1-5.yaml.

- id: tangent-galvanometer
  term: גלוונומטר טנגנטי
  en: tangent galvanometer
  definition: 'מערכת למדידת הרכיב האופקי של השדה המגנטי של כדור הארץ: תיל ישר, או כריכה, שזורם בהם זרם ידוע, מעל מצפן או סביבו, כך שהשדה שלהם במחט ניצב לשדה של כדור הארץ. בתיל, התיל אופקי ובכיוון צפון–דרום. המחט סוטה בזווית θ שבה tanθ = B_w/B_E, ומכאן השם: טנגנס הזווית גדל ביחס ישר לזרם.'
  lesson: '4.11'

- id: deflection-angle
  term: זווית הסטייה
  en: deflection angle (of a compass needle)
  symbol: θ
  definition: 'הזווית שבה המחט של מצפן סטתה מהכיוון שבו הצביעה לפני שהופעל השדה הנוסף, כאן מהצפון. קוראים אותה על השנתות של המצפן, בדרך כלל בדיוק של מעלה אחת.'
  lesson: '4.11'

- id: measurement-uncertainty
  term: אי-ודאות במדידה
  en: measurement uncertainty
  definition: 'כמה רחוק מהערך שקראנו יכול להיות הערך האמיתי, למשל ±1° בקריאת זווית על מצפן. אי-הוודאות בגודל שמחשבים מהמדידה תלויה גם בנוסחה: אותה שגיאה של מעלה אחת משנה את tanθ מעט ליד 45°, והרבה ליד 0° וליד 90°, יחסית לערך שלו.'
  reject: [אי ודאות]
  lesson: '4.11'

- id: systematic-error
  term: שגיאה שיטתית
  en: systematic error
  definition: 'שגיאה שמזיזה את כל המדידות לאותו כיוון, למשל מרחק שנמדד תמיד קצר מדי, או מצפן ששנתת האפס שלו לא כוונה לכיוון המחט. היא לא מתקזזת כשמעבירים קו בין הנקודות, בניגוד לשגיאה מקרית, שמפזרת את הנקודות משני צדי הקו.'
  lesson: '4.11'

- id: outlier
  term: מדידה חריגה
  en: outlier
  definition: 'נקודה שרחוקה מהקו המתאים ביותר הרבה יותר משאר הנקודות, בדרך כלל בגלל טעות בקריאה או בכיוון של המערכת. לא מעבירים את הקו דרכה: בודקים אותה, ואם אפשר, חוזרים על המדידה.'
  lesson: '4.11'

- id: random-error
  term: שגיאה מקרית
  en: random error
  definition: 'שגיאה שמזיזה כל מדידה מעט, פעם לכיוון אחד ופעם לכיוון השני, למשל קריאה של זווית בדיוק של מעלה. הנקודות מתפזרות משני צדי הקו, והקו המתאים ביותר מקזז את רוב השגיאה. ככל שמודדים יותר נקודות, ההשפעה שלה על השיפוע קטנה.'
  lesson: '4.11'

- id: relative-error
  term: שגיאה יחסית
  en: relative error
  definition: 'השגיאה בגודל מסוים חלקי הגודל עצמו, לרוב באחוזים. שגיאה של 0.035 בגודל שערכו 1 היא שגיאה יחסית של 3.5%, ואותה שגיאה בגודל שערכו 0.1 היא 35%.'
  lesson: '4.11'
