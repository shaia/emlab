# Lesson 5.2 terms. Added ahead of chapter 5, because lessons 6.13–6.14 use them. Format and rules: see glossary/1-5.yaml.

- id: faraday-law
  term: חוק פאראדיי
  en: Faraday's law of induction
  definition: 'כששטף מגנטי דרך לולאה משתנה, נוצר בלולאה כא"מ מושרה ששווה לקצב השינוי של השטף, ε = −ΔΦ/Δt (ובגבול, −dΦ/dt). בכריכה של N ליפופים הכא"מ גדל פי N. המינוס הוא חוק לנץ.'
  reject: [חוק פרדיי, חוק פראדיי]
  lesson: '5.2'

- id: induced-emf
  term: כא"מ מושרה
  en: induced emf
  symbol: '\varepsilon'
  unit: V
  definition: 'כוח אלקטרו-מניע שנוצר בלולאה בגלל שינוי בשטף המגנטי דרכה, בלי סוללה. אם הלולאה סגורה, הוא מניע בה זרם מושרה.'
  lesson: '5.2'

- id: induced-current
  term: זרם מושרה
  en: induced current
  symbol: I
  unit: A
  definition: 'הזרם שכא"מ מושרה מניע בלולאה סגורה, I = ε/R. הוא זורם רק כל עוד השטף דרך הלולאה משתנה, וכיוונו נקבע לפי חוק לנץ.'
  lesson: '5.2'

- id: electromagnetic-induction
  term: השראה אלקטרומגנטית
  en: electromagnetic induction
  definition: 'היווצרות של כא"מ (ובמעגל סגור, של זרם) בכריכה או בסליל בגלל שינוי בשטף המגנטי דרכם: מגנט שזז, זרם שנדלק או נכבה בסליל סמוך, כריכה שזזה או מסתובבת. פאראדיי גילה אותה ב-1831. שדה מגנטי קבוע, חזק ככל שיהיה, לא משרה דבר.'
  lesson: '5.2'

- id: loop-positive-sense
  term: הכיוון החיובי בכריכה
  en: positive sense of circulation
  definition: 'הכיוון סביב הכריכה שנקבע מהאנך שבחרנו לה, לפי כלל יד ימין: האגודל בכיוון האנך, והאצבעות המכופפות מראות את הכיוון החיובי. השטף Φ נמדד לאורך האנך, וכא"מ חיובי מניע זרם בכיוון החיובי. מי שבוחר אנך הפוך הופך גם את הכיוון החיובי, ולכן הסימנים של Φ ושל ε מתהפכים יחד, והזרם עצמו לא משתנה.'
  lesson: '5.2'
