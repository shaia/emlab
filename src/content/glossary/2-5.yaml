# Lesson 2.5 terms. Format and rules: see glossary/1-5.yaml.

- id: conducting-sphere
  term: כדור מוליך
  en: conducting sphere
  symbol: R
  definition: כדור (מלא או חלול) עשוי חומר מוליך. בשיווי משקל כל המטען העודף שלו על פני השטח, השדה בתוכו אפס, וכל הכדור באותו פוטנציאל, V = kQ/R. מחוץ לכדור השדה והפוטנציאל כמו של מטען נקודתי במרכזו.
  lesson: '2.5'

- id: common-potential
  term: פוטנציאל משותף
  en: common potential
  definition: הפוטנציאל שאליו מגיעים שני מוליכים אחרי שמחברים אותם בחוט מוליך. מטען עובר ביניהם עד שהפוטנציאלים שלהם שווים, והמטען הכולל נשמר.
  lesson: '2.5'

- id: lightning-rod
  term: כליא ברק
  en: lightning rod
  definition: מוט מתכת מחודד בראש בניין, מחובר בכבל אל האדמה. ליד החוד השדה חזק במיוחד, ולכן המטען בורח ממנו לאוויר בהדרגה, וברק שפוגע עובר דרך הכבל לאדמה במקום דרך הבניין.
  lesson: '2.5'
