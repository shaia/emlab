# Lesson 4.10 terms. Format and rules: see glossary/1-5.yaml.
# `torque`, `lever-arm`, `stable-equilibrium` and `unstable-equilibrium` are mechanics terms the
# course had not needed before; they are defined here because 4.10 is the first lesson to use them.

- id: torque
  term: מומנט כוח
  en: torque
  symbol: τ
  unit: N·m
  definition: 'המידה שבה כוח מסובב גוף סביב ציר. גודלו הוא הכוח כפול הזרוע שלו, τ = F·d, ונמדד בניוטון-מטר. כוח שעובר דרך הציר, או שמקביל לו, לא מסובב, והמומנט שלו אפס. מומנטים של כמה כוחות מחברים לפי כיוון הסיבוב שכל אחד מהם גורם: עם כיוון השעון או נגדו.'
  reject: [טורק]
  lesson: '4.10'

- id: lever-arm
  term: זרוע
  en: lever arm (moment arm)
  symbol: d
  unit: m
  definition: 'המרחק הניצב מהציר אל הקו שלאורכו פועל הכוח. אותו כוח מסובב יותר כשהזרוע שלו ארוכה יותר, ולא מסובב כלל כשהקו שלו עובר דרך הציר.'
  lesson: '4.10'

- id: coil-normal
  term: האנך לכריכה
  en: normal to a coil
  symbol: n̂
  definition: 'חץ שניצב למישור של כריכה, וכיוונו נקבע בכלל יד ימין: האצבעות המכופפות בכיוון הזרם בכריכה, והאגודל מראה את כיוון האנך. זה גם כיוון השדה שהכריכה עצמה יוצרת במרכזה. במומנט על כריכה, τ = NBIA·sinθ, הזווית θ היא בין האנך לבין השדה, ולא בין מישור הכריכה לשדה.'
  lesson: '4.10'

- id: stable-equilibrium
  term: שיווי משקל יציב
  en: stable equilibrium
  definition: 'מצב שבו על גוף לא פועל מומנט (או כוח) שקול, וכשמזיזים אותו מעט, מומנט מחזיר אותו אל המצב. כמו מטוטלת שתלויה למטה, או כריכה בשדה שהאנך שלה בכיוון השדה.'
  lesson: '4.10'

- id: unstable-equilibrium
  term: שיווי משקל רופף
  en: unstable equilibrium
  definition: 'מצב שבו על גוף לא פועל מומנט (או כוח) שקול, אבל כשמזיזים אותו מעט, המומנט מרחיק אותו עוד יותר מהמצב. כמו עיפרון שעומד על חודו, או כריכה בשדה שהאנך שלה בכיוון הפוך לשדה.'
  reject: [שיווי משקל לא יציב]
  lesson: '4.10'

- id: electric-motor
  term: מנוע חשמלי
  en: electric (DC) motor
  definition: 'מכשיר שהופך אנרגיה חשמלית לאנרגיה של סיבוב. במנוע זרם ישר, סליל על ציר נמצא בשדה של מגנט; הכוחות המגנטיים על הצלעות שלו יוצרים מומנט, וקומוטטור הופך את כיוון הזרם בכל חצי סיבוב, כדי שהמומנט יסובב תמיד לאותו כיוון.'
  lesson: '4.10'

- id: commutator
  term: קומוטטור
  en: commutator (split ring)
  definition: 'טבעת מפוצלת לשני חצאים, שמחוברת לציר של מנוע ומסתובבת עם הסליל. כל חצי מחובר לקצה אחד של הסליל, ושתי מברשות קבועות, מחוברות לסוללה, מחליקות עליה. בכל חצי סיבוב, כשמישור הסליל ניצב לשדה, המברשות עוברות לחצי השני, וכיוון הזרם בסליל מתהפך.'
  lesson: '4.10'

- id: brushes
  term: מברשות
  en: brushes
  definition: 'שני מגעים קבועים, בדרך כלל מפחם, שמחוברים להדקי הסוללה ונוגעים בקומוטטור שמסתובב, ומעבירים דרכו את הזרם אל הסליל.'
  lesson: '4.10'

- id: galvanometer
  term: גלוונומטר
  en: moving-coil galvanometer
  definition: 'מד זרם רגיש שבו סליל קל על ציר נמצא בין קוטבי מגנט. הזרם יוצר מומנט שמסובב את הסליל ואת המחוג שמחובר אליו, וקפיץ ספירלי מפעיל מומנט נגדי. המחוג נעצר כשהמומנטים שווים, וההסטה שלו פרופורציונית לזרם. מדי זרם ומדי מתח עם מחוג בנויים סביבו.'
  lesson: '4.10'

- id: radial-field
  term: שדה רדיאלי
  en: radial magnetic field
  definition: 'שדה שקווי השדה שלו מצביעים לאורך רדיוסים, אל מרכז או ממנו. בגלוונומטר, קטבים מעוגלים וליבת ברזל גלילית במרכז יוצרים שדה כזה במרווח שביניהם, ולכן מישור הסליל לאורך השדה בכל זווית, והמומנט עליו NBIA בכל זווית.'
  lesson: '4.10'

- id: torsion-constant
  term: קבוע הפיתול
  en: torsion constant
  symbol: κ
  unit: N·m/rad
  definition: 'המומנט שקפיץ ספירלי (או חוט פיתול) מפעיל לכל רדיאן שמסובבים אותו: המומנט שלו κ·δ, כש-δ זווית הסיבוב ברדיאנים, והוא מנסה להחזיר את הסיבוב לאפס.'
  lesson: '4.10'
