# Lesson 6.15 terms (relativity and magnetism, enrichment). Format and rules: see glossary/1-5.yaml.

- id: reference-frame
  term: מערכת ייחוס
  en: frame of reference
  definition: 'נקודת מבט שממנה מודדים מקומות, זמנים ומהירויות: מערכת צירים יחד עם שעונים, שקשורה לגוף מסוים, כמו המעבדה או רכבת שנוסעת במהירות קבועה. אותה תנועה נראית אחרת ממערכות ייחוס שונות: מטען שנע במעבדה נמצא במנוחה במערכת הייחוס שנעה יחד איתו.'
  lesson: '6.15'

- id: rest-frame
  term: מערכת המנוחה
  en: rest frame
  definition: 'מערכת הייחוס שבה גוף מסוים נמצא במנוחה. למשל, מערכת המנוחה של היונים בתיל היא המעבדה, ומערכת המנוחה של מטען שנע היא המערכת שנעה יחד איתו.'
  lesson: '6.15'

- id: special-relativity
  term: תורת היחסות הפרטית
  en: special relativity
  definition: 'התורה שאיינשטיין פרסם ב-1905, על מדידות של אורך וזמן במערכות ייחוס שנעות זו ביחס לזו במהירות קבועה. היא יוצאת משתי הנחות: חוקי הפיזיקה זהים בכל מערכות הייחוס האלה, ומהירות האור בריק זהה בכולן. מהן נובעות, למשל, התכווצות לורנץ ונוסחת גורם לורנץ.'
  lesson: '6.15'

- id: light-speed-invariance
  term: קביעות מהירות האור
  en: invariance of the speed of light
  symbol: 'c'
  unit: m/s
  definition: 'אור בריק נע במהירות c = 3·10⁸ m/s בכל מערכת ייחוס, גם כשמקור האור נע וגם כשהמודד נע. זו עובדה ניסויית, ואחת משתי ההנחות של תורת היחסות הפרטית. שום גוף לא מגיע למהירות הזו.'
  lesson: '6.15'

- id: lorentz-factor
  term: גורם לורנץ
  en: Lorentz factor
  symbol: '\gamma'
  definition: 'המספר γ = 1/√(1 − v²/c²), שתלוי רק במהירות v של גוף ביחס למודד. הוא 1 כשהגוף במנוחה, גדל ככל שהמהירות מתקרבת למהירות האור, ובמהירות 0.6c הוא 1.25. במהירויות קטנות בהרבה מ-c, γ ≈ 1 + v²/(2c²).'
  lesson: '6.15'

- id: lorentz-contraction
  term: התכווצות לורנץ
  en: Lorentz (length) contraction
  definition: 'גוף שנע במהירות v קצר יותר, לאורך כיוון התנועה, פי γ ממה שהוא במערכת המנוחה שלו: L = L₀/γ. שורה של מטענים שנעה לאורכה נראית לכן צפופה יותר: המרווחים קטנים פי γ, וצפיפות המטען הקווית גדולה פי γ. המטען של כל חלקיק לא משתנה.'
  reject: [התקצרות לורנץ, כיווץ לורנץ]
  lesson: '6.15'
