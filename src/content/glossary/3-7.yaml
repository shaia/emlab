# Lesson 3.7 terms. Format and rules: see glossary/1-5.yaml.

- id: rheostat
  term: נגד משתנה
  en: rheostat (variable resistor)
  definition: נגד שאפשר לשנות את ההתנגדות שלו, בדרך כלל במגע שמחליק לאורך תיל מלופף. מחברים אותו בטור לרכיב כדי לשלוט בזרם שעובר בו. בשרטוט חשמלי הוא מלבן ועליו חץ באלכסון.
  lesson: '3.7'

- id: ideal-meter
  term: מכשיר מדידה אידאלי
  en: ideal meter
  definition: מכשיר שלא משנה את המעגל שהוא מודד. מד זרם אידאלי הוא בעל התנגדות אפס (כמו תיל), ומד מתח אידאלי הוא בעל התנגדות אינסופית (כמו נתק). מכשירים אמיתיים קרובים לזה, אבל לא מגיעים.
  lesson: '3.7'

- id: potential-divider
  term: מחלק מתח
  en: potential divider (voltage divider)
  definition: 'נגד משתנה (או שני נגדים בטור) ששני הקצוות שלו מחוברים לסוללה. בין המגע המחליק לאחד הקצוות מקבלים חלק מהמתח של הסוללה, וכשמזיזים את המגע אפשר לכוון אותו מאפס ועד המתח המלא.'
  lesson: '3.7'
