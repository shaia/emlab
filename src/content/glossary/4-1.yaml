# Lesson 4.1 terms. Format and rules: see glossary/1-5.yaml.

- id: magnet
  term: מגנט
  en: magnet
  definition: גוף שמושך ברזל ומסתובב, כשהוא תלוי חופשי, כך שקצה אחד שלו פונה בערך צפונה. לכל מגנט שני קטבים, צפוני ודרומי.
  lesson: '4.1'

- id: north-pole
  term: קוטב צפוני
  en: north pole (of a magnet)
  symbol: N
  definition: הקצה של מגנט שפונה צפונה כשהמגנט תלוי חופשי. קווי השדה המגנטי יוצאים ממנו אל המרחב שמחוץ למגנט. קטבים שווים דוחים זה את זה, וקטבים שונים מושכים.
  lesson: '4.1'

- id: south-pole
  term: קוטב דרומי
  en: south pole (of a magnet)
  symbol: S
  definition: הקצה של מגנט שפונה דרומה כשהמגנט תלוי חופשי. קווי השדה המגנטי נכנסים אליו מהמרחב שמחוץ למגנט. אי אפשר להפריד אותו מהקוטב הצפוני, גם אם שוברים את המגנט.
  lesson: '4.1'

- id: magnetic-field
  term: שדה מגנטי
  en: magnetic field
  symbol: B
  unit: T
  definition: 'תכונה של המרחב סביב מגנט או סביב זרם חשמלי, שמסובבת מצפן ומפעילה כוח על מטען שנע ועל תיל שזורם בו זרם. זה וקטור: כיוונו בכל נקודה הוא הכיוון שהקוטב הצפוני של מצפן מצביע אליו שם. עוצמתו נמדדת בטסלה, וההגדרה הכמותית שלה, דרך הכוח על מטען נע, מגיעה בשיעור 4.5.'
  reject: [שדה מגנאטי]
  lesson: '4.1'

- id: tesla
  term: טסלה
  en: tesla
  symbol: T
  unit: T
  definition: 'יחידת העוצמה של השדה המגנטי. 1 T = 1 N/(A·m): בשדה של טסלה אחת, על תיל באורך מטר שזורם בו אמפר אחד, בניצב לשדה, פועל כוח של ניוטון אחד. השדה של כדור הארץ הוא בערך 5·10⁻⁵ T, ושל מגנט מקרר כמה אלפיות טסלה.'
  lesson: '4.1'

- id: magnetic-field-line
  term: קו שדה מגנטי
  en: magnetic field line
  definition: קו שבכל נקודה שלו השדה המגנטי משיק לו. מחוץ למגנט הקווים יוצאים מהקוטב הצפוני ונכנסים לקוטב הדרומי, וממשיכים בתוך המגנט מהדרומי לצפוני, כך שכל קו סגור. צפיפות הקווים מראה את עוצמת השדה, וקווים אינם נחתכים.
  lesson: '4.1'

- id: compass
  term: מצפן
  en: compass
  definition: מגנט קטן וקל, מחט, שיכול להסתובב בחופשיות. המחט מתיישרת לאורך השדה המגנטי במקומה, והקוטב הצפוני שלה מצביע בכיוון השדה.
  lesson: '4.1'

- id: earth-magnetic-field
  term: השדה המגנטי של כדור הארץ
  en: Earth's magnetic field
  definition: 'השדה המגנטי שכדור הארץ יוצר סביבו, ודומה לשדה של מגנט מוט ענק בתוכו. ליד הקוטב הצפוני הגאוגרפי נמצא הקוטב הדרומי של "המגנט" הזה, ולכן הקוטב הצפוני של מצפן פונה לשם. בישראל הרכיב האופקי שלו כ-3·10⁻⁵ T.'
  lesson: '4.1'

- id: magnetic-inclination
  term: זווית הנטייה
  en: magnetic inclination (dip)
  definition: 'הזווית שבין השדה המגנטי של כדור הארץ לבין המישור האופקי. מחט שיכולה להסתובב גם למעלה ולמטה נוטה בזווית הזאת אל תוך האדמה. בישראל היא כ-44°, ליד הקטבים המגנטיים כמעט 90° (השדה כמעט אנכי), ובקו המשווה המגנטי אפס.'
  lesson: '4.1'
