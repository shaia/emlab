# Lesson 6.13 terms (Maxwell's equations in differential form). Format and rules: see glossary/1-5.yaml.

- id: integral-form
  term: צורה אינטגרלית
  en: integral form
  definition: 'ניסוח של חוק פיזיקלי על אזור שלם: שטף דרך משטח סגור, או סירקולציה סביב מסלול סגור, שווים למה שנמצא בתוכם (מטען כלוא, זרם כלוא, קצב השינוי של שטף). החוק מתקיים לכל משטח ולכל מסלול, אבל אומר רק מה קורה בסך הכול.'
  lesson: '5.9'

- id: differential-form
  term: צורה דיפרנציאלית
  en: differential form
  definition: 'ניסוח של אותו חוק בכל נקודה בנפרד: הדיברגנץ או הרוטור של השדה בנקודה שווים למה שנמצא בנקודה עצמה (צפיפות מטען, צפיפות זרם, קצב השינוי של שדה). נקראת גם הצורה המקומית. עוברים אליה מהצורה האינטגרלית בעזרת משפט הדיברגנץ ומשפט סטוקס.'
  reject: [צורה דיפרנציאלית מקומית]
  lesson: '6.13'

- id: magnetic-charge
  term: מטען מגנטי
  en: magnetic charge (magnetic monopole)
  definition: 'מקור נקודתי של שדה מגנטי, שממנו קווי השדה היו יוצאים לכל הכיוונים, כמו מקווי שדה חשמלי ממטען חיובי. מעולם לא נמצא מטען כזה, ו-∇·B = 0 אומר שאין כזה: קווי שדה מגנטי לא מתחילים ולא נגמרים. קוטב של מגנט אינו מטען מגנטי: הקווים שיוצאים ממנו ממשיכים בתוך המגנט.'
  reject: [מונופול]
  lesson: '6.13'

- id: continuity-equation
  term: משוואת הרציפות
  en: continuity equation
  symbol: '\frac{\partial\rho}{\partial t} + \nabla\cdot\vec J = 0'
  definition: 'שימור המטען בצורה מקומית: אם מטען יוצא מסביבת נקודה (∇·J חיובי), צפיפות המטען בה יורדת באותו קצב. בצורה האינטגרלית: הזרם נטו שיוצא ממשטח סגור שווה לקצב שבו המטען שבתוכו קטן. היא נובעת ממשוואות מקסוול, ורק בזכות איבר ההעתקה.'
  lesson: '6.13'
