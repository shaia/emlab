# Lesson 4.2 terms. Format and rules: see glossary/1-5.yaml.

- id: oersted-experiment
  term: ניסוי אורסטד
  en: Oersted's experiment
  definition: 'הניסוי של הנס כריסטיאן אורסטד (1820): תיל שזורם בו זרם, מעל מצפן, מסובב את המחט. מכאן שזרם חשמלי יוצר שדה מגנטי. זה הקשר הראשון שהתגלה בין חשמל למגנטיות.'
  reject: [ניסוי ארסטד, ניסוי אורשטד]
  lesson: '4.2'

- id: right-hand-rule
  term: כלל יד ימין
  en: right-hand (grip) rule
  definition: 'קובע את כיוון השדה המגנטי סביב זרם. אוחזים את התיל ביד ימין, האגודל בכיוון הזרם, והאצבעות המכופפות מראות את כיוון השדה, במעגלים סביב התיל. במבט מהקצה: זרם החוצה מהדף (⊙) יוצר שדה נגד כיוון השעון, וזרם לתוך הדף (⊗) שדה עם כיוון השעון. בכריכה ובסליל: האצבעות המכופפות בכיוון הזרם, והאגודל מראה את כיוון השדה בתוכם.'
  lesson: '4.2'

- id: permeability
  term: פרמאביליות הריק
  en: vacuum permeability
  symbol: μ₀
  unit: T·m/A
  definition: 'קבוע טבע שמופיע בכל נוסחה לשדה מגנטי של זרם, μ₀ = 4π·10⁻⁷ T·m/A. הוא מקביל לפרמיטיביות הריק ε₀ של השדה החשמלי.'
  lesson: '4.2'
