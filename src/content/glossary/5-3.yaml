# Lesson 5.3 terms. Added ahead of chapter 5, because lessons 6.13–6.14 use them. Format and rules: see glossary/1-5.yaml.

- id: lenz-law
  term: חוק לנץ
  en: Lenz's law
  definition: 'הזרם המושרה זורם בכיוון שהשדה המגנטי שלו מתנגד לשינוי בשטף שיצר אותו. זה המינוס בחוק פאראדיי, והוא נובע משימור אנרגיה.'
  lesson: '5.3'

- id: eddy-current
  term: זרמי ערבולת
  en: eddy currents
  definition: 'זרמים מושרים שזורמים בתוך גוף מתכת שלם (לוח, צינור, תחתית של סיר), במסלולים סגורים בתוך המתכת עצמה, כשהשטף המגנטי דרך חלקים ממנו משתנה. לפי חוק לנץ הם מתנגדים לשינוי: הם בולמים תנועה של המתכת בשדה, והם מחממים אותה. חריצים במתכת קוטעים את המסלולים ומחלישים אותם.'
  lesson: '5.3'

- id: magnetic-braking
  term: בלימה מגנטית
  en: magnetic (eddy-current) braking
  definition: 'בלימה בעזרת זרמי ערבולת: מתכת שנעה בשדה מגנטי (או מגנט שנע ליד מתכת) מקבלת כוח שמתנגד לתנועה. הכוח גדל עם המהירות, ובמהירות אפס הוא נעלם, ולכן בלם כזה מאט אבל לא עוצר לגמרי. משתמשים בו ברכבות, ברכבות הרים ובאופני כושר.'
  lesson: '5.3'

- id: terminal-speed
  term: מהירות סופית
  en: terminal speed
  symbol: 'v_T'
  unit: m/s
  definition: 'המהירות הקבועה שגוף מגיע אליה כשכוח מתנגד שגדל עם המהירות משתווה לכוח שמניע אותו. למשל מגנט שנופל בצינור נחושת: כוח הבלימה גדל עם המהירות עד שהוא שווה למשקל, ומשם המגנט נופל במהירות קבועה.'
  lesson: '5.3'

- id: jumping-ring
  term: הטבעת הקופצת
  en: jumping ring (Thomson's ring)
  definition: 'הדגמה של חוק לנץ: טבעת אלומיניום מונחת על סליל עם ליבת ברזל. ברגע שסוגרים את המעגל של הסליל, השטף דרך הטבעת גדל בבת אחת, הזרם המושרה בטבעת יוצר בצד שפונה לסליל קוטב זהה לקוטב של הסליל, והטבעת נדחית ומזנקת למעלה. טבעת חתוכה לא קופצת: אין בה זרם.'
  lesson: '5.3'

- id: induction-cooktop
  term: כיריים אינדוקציה
  en: induction cooktop
  definition: 'כיריים שמתחת למשטח שלהן סליל, ובו זרם שמחליף כיוון עשרות אלפי פעמים בשנייה. השדה המגנטי המשתנה משרה זרמי ערבולת בתחתית הסיר, שעשויה מפלדה או מברזל, והם מחממים אותה. השדה לא מחמם את משטח הזכוכית עצמו (הוא מתחמם רק מהסיר החם), וסיר מזכוכית או מחרסינה לא מתחמם בכלל.'
  lesson: '5.3'
