# Lesson 6.9 terms (Poisson, Laplace, images). Format and rules: see glossary/1-5.yaml.

- id: laplacian
  term: לפלסיאן
  en: Laplacian
  symbol: '\nabla^2 V'
  definition: 'הדיברגנץ של הגרדיאנט של שדה סקלרי: ∇²V = ∇·(∇V) = ∂²V/∂x² + ∂²V/∂y² + ∂²V/∂z², סכום הנגזרות השניות (נגזרת של נגזרת) בשלושת הכיוונים. הוא מודד כמה הערך בנקודה שונה מהממוצע של סביבתה: ∇²V > 0 כשהנקודה נמוכה מהממוצע, ∇²V < 0 כשהיא גבוהה ממנו.'
  reject: [לפלאסיאן]
  lesson: '6.9'

- id: poisson-equation
  term: משוואת פואסון
  en: Poisson's equation
  symbol: '\nabla^2 V = -\rho/\varepsilon_0'
  definition: 'המשוואה שהפוטנציאל החשמלי מקיים בכל נקודה: ∇²V = −ρ/ε₀. היא נובעת מחוק גאוס בצורה המקומית, ∇·E = ρ/ε₀, ומ-E = −∇V. אם יודעים את המטען ואת הפוטנציאל על השפה, היא קובעת את V בכל מקום.'
  reject: [משוואת פויסון]
  lesson: '6.9'

- id: laplace-equation
  term: משוואת לפלס
  en: Laplace's equation
  symbol: '\nabla^2 V = 0'
  definition: 'משוואת פואסון במקום שאין בו מטען: ∇²V = 0. היא לא אומרת שהפוטנציאל או השדה אפס, אלא שהפוטנציאל בכל נקודה שווה לממוצע שלו על סביבה קטנה שלה.'
  reject: [משוואת לפלאס]
  lesson: '6.9'

- id: mean-value-property
  term: תכונת הממוצע
  en: mean-value property
  definition: 'פוטנציאל שמקיים את משוואת לפלס שווה בכל נקודה לממוצע שלו על כל כדור (או מעגל, בשני ממדים) שמרכזו בנקודה ושאין בו מטען. לכן אין לו מקסימום או מינימום בתוך אזור ריק: הערכים הקיצוניים נמצאים על השפה.'
  lesson: '6.9'

- id: earnshaw-theorem
  term: משפט ארנשו
  en: Earnshaw's theorem
  definition: 'אי אפשר להחזיק מטען בשיווי משקל יציב בעזרת כוחות אלקטרוסטטיים בלבד. במקום ריק V מקיים את משוואת לפלס ואין לו מינימום, ומטען חיובי זקוק למינימום של V כדי שכל תזוזה תחזיר אותו (ומטען שלילי, למקסימום).'
  lesson: '6.9'

- id: boundary-condition
  term: תנאי שפה
  en: boundary condition
  definition: 'מה שנתון על שפת האזור שבו פותרים משוואה: למשל הפוטנציאל של כל מוליך, ו-V → 0 רחוק מאוד מכל המטענים.'
  lesson: '6.9'

- id: uniqueness-theorem
  term: משפט היחידות
  en: uniqueness theorem
  definition: 'אם המטען בתוך אזור נתון והפוטנציאל על כל השפה שלו נתון, יש פתרון אחד בלבד למשוואת פואסון באזור. לכן פוטנציאל שניחשנו, שמקיים את המשוואה ואת תנאי השפה, הוא הפתרון.'
  lesson: '6.9'

- id: relaxation-method
  term: שיטת הרלקסציה
  en: relaxation method
  definition: 'פתרון מספרי של משוואת לפלס על רשת נקודות: הפוטנציאל של המוליכים קבוע, וכל נקודה אחרת מוחלפת שוב ושוב בממוצע של ארבע שכנותיה (שיטת יעקובי), עד שהערכים מפסיקים להשתנות. ברלקסציית-יתר דוחפים כל נקודה מעט מעבר לממוצע, והפתרון מתקבל בפחות סבבים.'
  lesson: '6.9'

- id: residual
  term: שארית
  en: residual
  symbol: '\left|\nabla^2 V + \rho/\varepsilon_0\right|'
  unit: V/m²
  definition: 'כמה רחוקה רשת מלפתור את המשוואה: הערך הגדול ביותר של |∇²V + ρ/ε₀| על פני הצמתים החופשיים. בפתרון מדויק השארית אפס.'
  lesson: '6.9'

- id: image-charge
  term: מטען דמות
  en: image charge
  definition: 'מטען דמיוני שמוסיפים מחוץ לאזור שבו מחפשים את הפוטנציאל, כך שיחד עם המטען האמיתי הוא נותן על המוליך בדיוק את הפוטנציאל הנכון. למטען q במרחק d ממישור מוליך מוארק, הדמות היא −q במרחק d מאחורי המישור. בתוך המוליך היא לא קיימת: היא תחליף למטען המושרה על פני השטח.'
  lesson: '6.9'
