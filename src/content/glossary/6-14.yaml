# Lesson 6.14 terms (electromagnetic waves and the energy in the field). Format and rules: see glossary/1-5.yaml.

- id: wave
  term: גל
  en: wave
  definition: 'תבנית של הפרעה שמתקדמת במרחב, בלי שמשהו מתקדם יחד איתה: בגל במים כל טיפה עולה ויורדת במקום, ורק צורת הגלים נעה. בגל אלקטרומגנטי שום דבר חומרי לא זז בכלל; מה שמתקדם הוא תבנית של שדה חשמלי ושדה מגנטי.'
  lesson: '6.14'

- id: amplitude
  term: משרעת
  en: amplitude
  symbol: 'E_0'
  definition: 'הערך הגדול ביותר שגודל שמתנודד מגיע אליו (נקרא גם אמפליטודה). בגל E = E₀·sin(kx − ωt) המשרעת היא E₀, כי sin נע בין −1 ל-1.'
  lesson: '6.14'

- id: wavelength
  term: אורך גל
  en: wavelength
  symbol: '\lambda'
  unit: m
  definition: 'המרחק בין שתי פסגות סמוכות של גל, ברגע אחד: אחרי מרחק כזה התבנית חוזרת על עצמה. הגל מתקדם אורך גל אחד בכל זמן מחזור, ולכן λ = v/f (באור, λ = c/f). בגל sin(kx − ωt) הוא λ = 2π/k.'
  lesson: '5.9'

- id: wave-number
  term: מספר הגל
  en: wave number
  symbol: 'k'
  unit: rad/m
  definition: 'כמה רדיאנים מתקדם המופע של גל על כל מטר לאורך כיוון ההתקדמות, k = 2π/λ. הוא תפקיד ה-ω של המקום: ω אומר כמה מהר המופע משתנה בזמן, ו-k כמה מהר הוא משתנה במרחב.'
  lesson: '6.14'

- id: frequency
  term: תדירות
  en: frequency
  symbol: 'f'
  unit: Hz
  definition: 'מספר המחזורים בשנייה של גודל שמתנודד. היחידה היא הרץ, Hz = 1/s. זמן המחזור הוא T = 1/f, והתדירות הזוויתית היא ω = 2πf.'
  lesson: '5.8'

- id: angular-frequency
  term: תדירות זוויתית
  en: angular frequency
  symbol: '\omega'
  unit: rad/s
  definition: 'כמה רדיאנים מתקדם המופע של תנודה בכל שנייה, ω = 2πf = 2π/T. בגנרטור זו המהירות הזוויתית של הסליל שמסתובב, ε = ε₀·sin(ωt); זה גם ω של התנועה המעגלית, ושל המתנד x = A·sin(ωt) בשיעור על הנגזרת.'
  lesson: '5.8'

- id: phase
  term: מופע
  en: phase
  definition: 'הזווית שבתוך ה-sin של גל או של תנודה, כאן kx − ωt. היא קובעת באיזה שלב של המחזור הגל נמצא בנקודה וברגע מסוימים. שני גדלים "באותו מופע" מגיעים לפסגה, לאפס ולשפל יחד; גודל "בפיגור של רבע מחזור" מגיע לכל שלב רבע מחזור אחרי השני.'
  lesson: '6.14'

- id: wave-speed
  term: מהירות הגל
  en: wave speed
  symbol: 'v = \omega/k = f\lambda'
  unit: m/s
  definition: 'המהירות שבה פסגה של גל, או כל מופע קבוע אחר, מתקדמת. לגל sin(kx − ωt) היא v = ω/k, ובמונחים של תדירות ואורך גל v = fλ: בכל מחזור הפסגה מתקדמת אורך גל אחד.'
  lesson: '6.14'

- id: plane-wave
  term: גל מישורי
  en: plane wave
  definition: 'גל שבו השדה זהה בכל נקודות המישור שניצב לכיוון ההתקדמות, ומשתנה רק לאורך כיוון ההתקדמות. הגל שבשיעור נע לאורך x, ולכן השדות בו תלויים רק ב-x וב-t. רחוק מאוד ממקור, כמו אור השמש על כדור הארץ, גל הוא כמעט מישורי.'
  lesson: '6.14'

- id: electromagnetic-wave
  term: גל אלקטרומגנטי
  en: electromagnetic wave
  definition: 'גל של שדה חשמלי ושדה מגנטי שיוצרים זה את זה: שדה מגנטי שמשתנה יוצר שדה חשמלי (חוק פאראדיי), ושדה חשמלי שמשתנה יוצר שדה מגנטי (זרם ההעתקה). בריק הוא מתקדם במהירות c = 1/√(μ₀ε₀) = 3·10⁸ m/s. אור, גלי רדיו, קרינת מיקרוגל וקרני רנטגן הם גלים אלקטרומגנטיים בתדירויות שונות.'
  lesson: '5.9'

- id: wave-equation
  term: משוואת הגלים
  en: wave equation
  symbol: '\frac{\partial^2 E}{\partial x^2} = \frac{1}{v^2}\,\frac{\partial^2 E}{\partial t^2}'
  definition: 'משוואה שקושרת את הנגזרת החלקית השנייה של גודל לפי המקום לנגזרת החלקית השנייה שלו לפי הזמן. כל צורה שנעה במהירות v בלי להשתנות, f(x − vt), מקיימת אותה. משוואות מקסוול בריק נותנות אותה עם 1/v² = μ₀ε₀.'
  lesson: '6.14'

- id: transverse-wave
  term: גל רוחבי
  en: transverse wave
  definition: 'גל שבו הגודל שמתנודד ניצב לכיוון ההתקדמות, כמו חבל שמנופפים בו למעלה ולמטה. גל אלקטרומגנטי בריק הוא רוחבי: גם E וגם B ניצבים לכיוון ההתקדמות.'
  lesson: '6.14'

- id: energy-density
  term: צפיפות אנרגיה
  en: energy density
  symbol: 'u = \frac{\varepsilon_0 E^2}{2} + \frac{B^2}{2\mu_0}'
  unit: J/m³
  definition: 'האנרגיה ליחידת נפח שאגורה בשדה עצמו. החלק החשמלי, ε₀E²/2, נובע מהאנרגיה של קבל; החלק המגנטי, B²/(2μ₀), מהעבודה שנדרשת כדי להגדיל את הזרם בסליל. בגל אלקטרומגנטי שני החלקים שווים בכל נקודה.'
  lesson: '6.14'

- id: poynting-vector
  term: וקטור פוינטינג
  en: Poynting vector
  symbol: '\vec S = \frac{\vec E\times\vec B}{\mu_0}'
  unit: W/m²
  definition: 'וקטור שמתאר זרימה של אנרגיה אלקטרומגנטית: גודלו הוא האנרגיה שעוברת בכל שנייה דרך מטר רבוע שניצב לו, וכיוונו הוא כיוון הזרימה. בגל הוא מצביע בכיוון ההתקדמות, ו-S = u·c.'
  reject: [וקטור פויינטינג]
  lesson: '6.14'

- id: time-average
  term: ממוצע בזמן
  en: time average
  symbol: '\langle S\rangle'
  definition: 'הערך הממוצע של גודל שמשתנה במחזוריות, על פני מחזור שלם. הממוצע של sin² ושל cos² על מחזור הוא ½, כי הם מתחלפים זה בזה וסכומם תמיד 1.'
  lesson: '5.8'

- id: wave-intensity
  term: עוצמת הגל
  en: intensity
  symbol: '\langle S\rangle = \tfrac12 c\varepsilon_0 E_0^2'
  unit: W/m²
  definition: 'הממוצע בזמן של גודל וקטור פוינטינג: ההספק הממוצע שגל מעביר דרך כל מטר רבוע שניצב לכיוון ההתקדמות. לגל מישורי בריק הוא cε₀E₀²/2. ליד כדור הארץ עוצמת אור השמש היא כ-1360 W/m².'
  lesson: '6.14'
