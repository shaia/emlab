# Lesson 3.1 terms. Format and rules: see glossary/1-5.yaml.

- id: electric-current
  term: זרם חשמלי
  en: electric current
  symbol: I
  unit: A
  definition: תנועה מסודרת של מטען חשמלי, למשל של האלקטרונים החופשיים בתיל. עוצמת הזרם היא המטען שעובר דרך חתך של התיל בכל שנייה, I = Δq/Δt, והיא נמדדת באמפר (שיעור 3.2).
  lesson: '3.1'

- id: battery
  term: סוללה
  en: battery
  definition: רכיב ששומר על הפרש פוטנציאלים בין שני ההדקים שלו. תגובות כימיות בתוך הסוללה עושות עבודה על המטען ו"מרימות" אותו מההדק השלילי אל החיובי. הסוללה לא מייצרת מטען ולא אוגרת אותו לצורך המעגל.
  lesson: '3.1'

- id: terminal
  term: הדק
  en: terminal
  definition: כל אחד משני הקצוות של סוללה או של רכיב, שאליהם מחברים תילים. ההדק החיובי (+) של סוללה נמצא בפוטנציאל הגבוה, וההדק השלילי (−) בנמוך.
  lesson: '3.1'

- id: connecting-wire
  term: תיל
  en: connecting wire
  definition: חוט מתכת, בדרך כלל נחושת, שמחבר רכיבים במעגל. בשאלות המעגלים מניחים שאפשר להזניח את ההתנגדות שלו, ולכן כל הנקודות של תיל אחד נמצאות באותו פוטנציאל.
  lesson: '3.1'

- id: light-bulb
  term: נורה
  en: light bulb
  definition: רכיב שבו חוט מתכת דק וארוך, חוט הלהט, מתחמם מאוד כשעובר בו זרם, ופולט אור. בשרטוט חשמלי היא עיגול ובתוכו איקס.
  lesson: '3.1'

- id: switch
  term: מפסק
  en: switch
  definition: רכיב שסוגר או פותח את המעגל. מפסק סגור הוא כמו תיל, ומפסק פתוח הוא נתק שאין דרכו זרם. (נקרא גם מתג.)
  lesson: '3.1'

- id: voltmeter
  term: מד מתח
  en: voltmeter
  symbol: V
  definition: מכשיר עם שני חודים שמראה את המתח, הפרש הפוטנציאלים, בין שתי הנקודות שהחודים נוגעים בהן. מד מתח אידאלי לא מעביר זרם, ולכן הוא לא משנה את המעגל שהוא מודד (שיעור 3.7).
  lesson: '3.1'

- id: electric-circuit
  term: מעגל חשמלי
  en: electric circuit
  definition: מסלול סגור של רכיבים ותילים, שמוביל מהדק אחד של הסוללה, דרך הרכיבים, אל ההדק השני. זרם זורם רק במעגל סגור.
  lesson: '3.1'

- id: open-circuit
  term: מעגל פתוח
  en: open circuit
  definition: מעגל שיש בו נתק, למשל מפסק פתוח, ולכן לא זורם בו זרם. בין שני הצדדים של הנתק יש מתח, ובמעגל עם סוללה אחת זה כל המתח של הסוללה.
  lesson: '3.1'

- id: short-circuit
  term: קצר
  en: short circuit
  definition: 'חיבור בתיל, בלי רכיב, בין שתי נקודות שאמורות להיות ביניהן מתח: למשל בין שני ההדקים של סוללה, או משני צדי נורה. בקצר של סוללה עובר זרם גדול מאוד, שמחמם את התילים ואת הסוללה.'
  lesson: '3.1'
