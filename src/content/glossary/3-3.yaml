# Lesson 3.3 terms. Format and rules: see glossary/1-5.yaml.

- id: resistance
  term: התנגדות
  en: resistance
  symbol: R
  unit: Ω
  definition: היחס בין המתח על רכיב לזרם שעובר בו, R = V/I. היא אומרת כמה מתח צריך כדי להעביר ברכיב זרם של אמפר אחד. במתכת היא נובעת מההתנגשויות של האלקטרונים החופשיים ביונים.
  lesson: '3.3'

- id: ohm
  term: אוהם
  en: ohm
  symbol: Ω
  definition: יחידת ההתנגדות. לרכיב יש התנגדות של אוהם אחד כשמתח של וולט אחד מעביר בו זרם של אמפר אחד, 1 Ω = 1 V/A.
  lesson: '3.3'

- id: resistor
  term: נגד
  en: resistor
  definition: רכיב שנועד לספק התנגדות קבועה במעגל. בשרטוט חשמלי הוא מלבן.
  lesson: '3.3'

- id: ohms-law
  term: חוק אוהם
  en: Ohm's law
  definition: בתיל מתכת בטמפרטורה קבועה, הזרם ביחס ישר למתח, I ∝ V, כלומר ההתנגדות R = V/I קבועה ואינה תלויה במתח. החוק מתקיים בהרבה רכיבים, אבל לא בכולם.
  lesson: '3.3'

- id: ohmic
  term: רכיב אוהמי
  en: ohmic component
  definition: 'רכיב שמקיים את חוק אוהם: ההתנגדות שלו קבועה, וגרף הזרם כפונקציה של המתח הוא קו ישר שעובר בראשית. נורת להט, שמתחממת כשהזרם גדל, אינה רכיב אוהמי.'
  lesson: '3.3'

- id: characteristic
  term: אופיין
  en: characteristic (I–V curve)
  definition: גרף של הזרם ברכיב כפונקציה של המתח עליו (או להפך). האופיין של רכיב אוהמי הוא קו ישר דרך הראשית. בכל נקודה על האופיין, ההתנגדות היא R = V/I.
  lesson: '3.3'

- id: resistivity
  term: התנגדות סגולית
  en: resistivity
  symbol: ρ
  unit: Ω·m
  definition: תכונה של החומר, שקובעת את ההתנגדות של תיל ממנו, R = ρL/A. לנחושת ρ = 1.7·10⁻⁸ Ω·m, ולניכרום, שממנו עושים גופי חימום, ρ = 1.1·10⁻⁶ Ω·m.
  lesson: '3.3'
