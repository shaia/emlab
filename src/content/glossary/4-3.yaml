# Lesson 4.3 terms. Format and rules: see glossary/1-5.yaml.

- id: coil-turn
  term: כריכה
  en: (circular) loop, turn
  definition: 'תיל שמכופף למעגל אחד סגור, או ליפוף אחד של סליל. השדה במרכז כריכה ברדיוס R שזורם בה זרם I הוא B = μ₀I/(2R), ניצב למישור הכריכה. N כריכות צמודות יוצרות שדה גדול פי N.'
  lesson: '4.3'

- id: solenoid
  term: סליל
  en: solenoid
  definition: 'תיל שמלופף כריכות רבות צמודות זו לזו לאורך גליל. בתוך סליל ארוך השדה כמעט אחיד ומקביל לציר, B = μ₀NI/L, ומחוצה לו השדה חלש, ודומה לשדה של מגנט מוט.'
  lesson: '4.3'

- id: flat-coil
  term: סליל שטוח
  en: flat coil
  definition: 'N כריכות צמודות זו לזו, כמעט באותו מישור, כמו טבעת עבה. השדה במרכזו B = μ₀NI/(2R), פי N מכריכה אחת. אל תבלבלו עם סליל ארוך, שהכריכות שלו פרושות לאורך L והשדה בתוכו B = μ₀NI/L.'
  lesson: '4.3'

- id: turn-density
  term: צפיפות הכריכות
  en: turns per unit length
  symbol: n
  unit: 1/m
  definition: 'מספר הכריכות של סליל בכל מטר מאורכו, n = N/L. השדה בתוך סליל ארוך תלוי ב-n ובזרם בלבד, B = μ₀nI.'
  lesson: '4.3'

- id: electromagnet
  term: אלקטרומגנט
  en: electromagnet
  definition: 'סליל, בדרך כלל עם ליבת ברזל בתוכו, שמתנהג כמגנט כל עוד זורם בו זרם, ומפסיק כשהזרם נפסק. ליבת הברזל מגדילה את השדה פעמים רבות. משתמשים בו במנופי גרוטאות, בפעמונים, במנעולים חשמליים ובמכשירי MRI.'
  lesson: '4.3'
