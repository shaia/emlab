# Lesson 6.16 terms (the closing review of chapter 6). Format and rules: see glossary/1-5.yaml.

- id: closed-form
  term: ביטוי סגור
  en: closed-form expression
  definition: 'תוצאה שנכתבת כנוסחה אחת עם מספר סופי של פעולות מוכרות (חזקות, שורשים, sin, ln), בלי אינטגרל שעוד צריך לחשב ובלי סכום של אינסוף איברים. למשל השדה על הציר של טבעת, ⁦kQz/(z²+R²)^{3/2}⁩.'
  lesson: '6.16'

- id: limit-check
  term: בדיקת גבולות
  en: limiting-case check
  definition: 'בדיקה של ביטוי סגור במקרים קיצוניים שהתשובה בהם כבר ידועה: גוף קטן מאוד או גדול מאוד, נקודה קרובה מאוד או רחוקה מאוד, אורך שואף לאינסוף. בכל קצה הביטוי חייב לשאוף לנוסחה המוכרת של אותו קצה. ביטוי שנכשל בקצה אחד שגוי; ביטוי שעובר את כולם עוד לא הוכח, אבל רוב הטעויות נתפסות כך.'
  lesson: '6.16'

- id: units-check
  term: בדיקת יחידות
  en: dimensional check
  definition: 'בדיקה שלשני צדי המשוואה אותן יחידות, ושבסכום כל האיברים באותן יחידות. נוסחה שנכשלת בה שגויה בוודאות; נוסחה שעוברת אותה יכולה עדיין להיות שגויה במספר (פי 2, פי π) או בצורה.'
  lesson: '6.16'

- id: power-law
  term: חוק חזקה
  en: power law
  definition: 'קשר מהצורה ⁦y = C·xⁿ⁩, עם C ו-n קבועים. בגרף לוגריתמי, ⁦log y⁩ מול ⁦log x⁩, הוא קו ישר שהשיפוע שלו הוא החזקה n: ⁦−2⁩ למטען נקודתי, ⁦−3⁩ לדיפול, 0 לשדה שלא תלוי במרחק.'
  lesson: '6.16'

- id: hertz-experiment
  term: ניסוי הרץ
  en: Hertz's experiment
  definition: 'הניסויים של היינריך הרץ בסוף שנות ה-80 של המאה ה-19: ניצוץ במעגל חשמלי שולח גל אלקטרומגנטי, ולולאה עם מרווח צר בצד השני של החדר קולטת אותו. הרץ מדד את אורך הגל בגל עומד, חישב את התדירות מתוך המעגל, ומצא מהירות קרובה למהירות האור, כפי שמשוואות מקסוול חזו.'
  lesson: '6.16'
