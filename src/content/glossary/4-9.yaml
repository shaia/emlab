# Lesson 4.9 terms. Format and rules: see glossary/1-5.yaml.

- id: force-per-length
  term: כוח ליחידת אורך
  en: force per unit length
  symbol: F/L
  unit: N/m
  definition: 'הכוח שפועל על כל מטר של תיל ארוך, בניוטון למטר. בין שני תילים ארוכים ומקבילים, F/L = μ₀I₁I₂/(2πd). על קטע באורך L פועל כוח F, שהוא F/L כפול L.'
  lesson: '4.9'

- id: newton-third-law
  term: החוק השלישי של ניוטון
  en: Newton's third law
  definition: 'כשגוף A מפעיל כוח על גוף B, גוף B מפעיל על A כוח שווה בגודלו והפוך בכיוונו. שני הכוחות פועלים על גופים שונים, ולכן אינם מבטלים זה את זה.'
  lesson: '4.9'

- id: ampere-definition
  term: הגדרת האמפר
  en: definition of the ampere
  definition: 'משנת 1948 עד 2019: אמפר אחד הוא הזרם שאם יזרום בשני תילים ישרים, ארוכים מאוד ודקים מאוד, במרחק מטר זה מזה בריק, הכוח ביניהם יהיה 2·10⁻⁷ ניוטון לכל מטר. מאז 20 במאי 2019 קובעים את המטען היסודי בדיוק, e = 1.602176634·10⁻¹⁹ C, ואמפר אחד הוא זרם שבו עוברים בכל שנייה 1/e מטענים יסודיים, כ-6.24·10¹⁸.'
  lesson: '4.9'
