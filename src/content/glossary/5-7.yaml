# Lesson 5.7 terms. Added ahead of chapter 5, because lessons 6.13–6.14 use them. Format and rules: see glossary/1-5.yaml.

- id: induced-electric-field
  term: שדה חשמלי מושרה
  en: induced electric field
  definition: 'שדה חשמלי שנוצר משדה מגנטי משתנה, ולא ממטענים. קווי השדה שלו סגורים, והעבודה שלו ליחידת מטען סביב לולאה שווה לכא"מ המושרה, ∮E·dl = −dΦ/dt. לכן הוא אינו שדה משמר, ואין לו פוטנציאל.'
  lesson: '5.7'

- id: solenoid-core
  term: ליבת הסליל
  en: solenoid core
  definition: 'האזור שבתוך סליל ארוך, שבו השדה המגנטי אחיד ומקביל לציר. בשיעור 5.7 הליבה ריקה (אוויר), בלי ברזל. מחוץ לליבה של סליל ארוך השדה המגנטי כמעט אפס.'
  lesson: '5.7'

- id: non-conservative-field
  term: שדה לא משמר
  en: non-conservative field
  definition: 'שדה שבו העבודה על מטען בין שתי נקודות תלויה במסלול, ולכן העבודה סביב מסלול סגור יכולה להיות שונה מאפס. לשדה כזה אין פוטנציאל: אי אפשר לשייך לכל נקודה מספר אחד שההפרש בינו לבין מספר של נקודה אחרת נותן את העבודה. השדה החשמלי המושרה הוא שדה לא משמר.'
  lesson: '5.7'

- id: betatron
  term: בטטרון
  en: betatron
  definition: 'מאיץ אלקטרונים שבו האלקטרונים נעים במעגל בתוך צינור ריק בצורת טבעת, סביב אזור שבו השדה המגנטי גדל. השדה החשמלי המושרה מאיץ אותם בכל סיבוב, והשדה המגנטי במסלול מחזיק אותם במעגל.'
  lesson: '5.7'
