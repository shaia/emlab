# Lesson 5.4 terms. Format and rules: see glossary/1-5.yaml.
# The Bagrut papers call the emf of a moving rod simply "הכא"מ המושרה" (in the rod); "כא"מ תנועתי" is the
# textbook name for this kind of induced emf, used here to tell it apart from the emf of a changing field (5.6).

- id: motional-emf
  term: כא"מ תנועתי
  en: motional emf
  symbol: 'ε'
  unit: V
  definition: 'הכא"מ המושרה במוליך שנע בשדה מגנטי. מקורו בכוח לורנץ על המטענים החופשיים שבמוליך, שנעים איתו. במוט באורך L שנע במהירות v, ניצב לעצמו ולשדה B, הכא"מ הוא ε = BLv. אם המוט סוגר מעגל, זה בדיוק קצב השינוי של השטף דרך המעגל, ΔΦ/Δt. בשאלוני הבגרות קוראים לו בדרך כלל פשוט "הכא"מ המושרה במוט".'
  lesson: '5.4'
