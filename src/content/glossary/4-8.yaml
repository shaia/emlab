# Lesson 4.8 terms. Format and rules: see glossary/1-5.yaml.

- id: wire-force
  term: הכוח המגנטי על תיל
  en: magnetic force on a current-carrying wire
  symbol: F
  unit: N
  definition: 'הכוח שהשדה המגנטי מפעיל על תיל שזורם בו זרם: סכום כוחות לורנץ על נושאי המטען שבחלק התיל שבתוך השדה. F = BIL·sinα, כש-L הוא אורך התיל שבתוך השדה ו-α הזווית בין התיל (בכיוון הזרם) לשדה. הכוח ניצב גם לתיל וגם לשדה, וכיוונו נקבע בכלל כף יד ימין, עם האגודל בכיוון הזרם. על תיל שמקביל לשדה אין כוח.'
  lesson: '4.8'

- id: current-balance
  term: מאזני זרם
  en: current balance
  definition: 'מכשיר שמודד שדה מגנטי בעזרת הכוח על תיל. מסגרת תיל תלויה בקצה אחד של מאזניים, וצלע אחת שלה, באורך L, נמצאת בתוך השדה, בניצב לו. כשזורם בה זרם I, מאזנים את הכוח המגנטי במשקולות: כשהמאזניים מאוזנים, mg = BIL, ולכן B = mg/(IL).'
  lesson: '4.8'

- id: loudspeaker
  term: רמקול
  en: loudspeaker
  definition: 'מכשיר שהופך זרם חשמלי משתנה לקול. סליל קטן, שמחובר לחרוט קל, נמצא בשדה של מגנט קבוע, כך שכל חלקי הכריכות ניצבים לשדה. הזרם בסליל מקבל כוח לאורך ציר הסליל; כשהזרם מחליף כיוון, גם הכוח מחליף כיוון, והחרוט רוטט ודוחף את האוויר.'
  lesson: '4.8'
