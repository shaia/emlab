# Glossary terms introduced in this lesson. Format and rules: see glossary/1-5.yaml.

- id: field-line
  term: קו שדה
  en: field line
  definition: קו שהמשיק לו בכל נקודה הוא בכיוון השדה החשמלי. צפיפות הקווים מראה את עוצמת השדה.
  reject: [קו כוח]
  lesson: '1.6'

- id: null-point
  term: נקודת אפס
  en: null point
  definition: נקודה שבה השדה החשמלי השקול הוא אפס. קווי שדה לא עוברים דרכה, כי אין שם כיוון של שדה. גם לשדה מגנטי יש נקודות אפס (שיעורים 4.1 ו-4.2), למשל ליד מגנט או ליד תיל שזורם בו זרם, בשדה של כדור הארץ.
  lesson: '1.6'
