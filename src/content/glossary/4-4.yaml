# Lesson 4.4 terms. Format and rules: see glossary/1-5.yaml.

- id: ampere-law
  term: חוק אמפר
  en: Ampère's law
  definition: 'מחלקים מסלול סגור כלשהו לקטעים קטנים Δℓ, ובכל קטע כופלים את רכיב השדה המגנטי לאורך הקטע, B∥, באורך הקטע. סכום המכפלות סביב כל המסלול שווה ל-μ₀ כפול הזרם הכלוא: ΣB∥·Δℓ = μ₀I. בכתיב של אינטגרל כותבים ∮B·dℓ = μ₀I. החוק נותן את השדה עצמו רק כשיש סימטריה, למשל סביב תיל ישר ובתוך סליל ארוך.'
  lesson: '4.4'

- id: enclosed-current
  term: זרם כלוא
  en: enclosed current
  symbol: I
  unit: A
  definition: 'סכום הזרמים שעוברים דרך מסלול סגור, עם סימנים. מכופפים את אצבעות יד ימין בכיוון שבו הולכים לאורך המסלול: זרם בכיוון האגודל נספר חיובי, וזרם הפוך נספר שלילי. זרמים שמחוץ למסלול אינם נכללים.'
  lesson: '4.4'

- id: amperian-path
  term: מסלול אמפר
  en: Amperian loop
  definition: 'מסלול סגור דמיוני שבוחרים כדי להשתמש בחוק אמפר, יחד עם כיוון הליכה לאורכו. כדי שהחוק ייתן את השדה, בוחרים מסלול שעליו השדה ידוע מראש בכיוונו ושווה בגודלו, למשל מעגל סביב תיל ישר.'
  lesson: '4.4'

- id: current-density
  term: צפיפות זרם
  en: current density
  symbol: J
  unit: A/m²
  definition: 'הזרם שעובר דרך כל מטר רבוע של שטח החתך של מוליך, J = I/A, כשהזרם מפוזר באחידות על החתך. בתיל עבה עם זרם אחיד, מעגל שמקיף חלק מהחתך מקיף את החלק המתאים של הזרם.'
  lesson: '4.4'

- id: coaxial-cable
  term: כבל קואקסיאלי
  en: coaxial cable
  definition: 'כבל שבו תיל מרכזי, ומסביבו, על אותו ציר, צינור מוליך דק. הזרם הולך בתיל המרכזי וחוזר בצינור, ולכן מחוץ לכבל הזרם הכלוא אפס, ואין שדה מגנטי. כך בנויים כבלי אנטנה וכבלי וידאו.'
  lesson: '4.4'

- id: toroid
  term: טורואיד
  en: toroid
  definition: 'סליל שמכופף לטבעת סגורה, כמו סופגנייה עטופה בכריכות. השדה כלוא בתוך הטבעת, B = μ₀NI/(2πr) במרחק r מהמרכז, ומחוץ לטבעת הוא אפס.'
  lesson: '4.4'
