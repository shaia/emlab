# Lesson 4.4 terms. Format and rules: see glossary/1-5.yaml.

- id: lorentz-force
  term: כוח לורנץ
  en: Lorentz (magnetic) force
  symbol: F
  unit: N
  definition: 'הכוח שהשדה המגנטי מפעיל על מטען נע, F = qvB·sinα, כש-α הזווית בין המהירות לשדה. הכוח ניצב גם למהירות וגם לשדה, ולכן אינו עושה עבודה: הוא משנה את כיוון התנועה ולא את גודל המהירות. על מטען במנוחה, או שנע לאורך השדה, הוא אפס.'
  lesson: '4.4'

- id: right-hand-palm-rule
  term: כלל כף יד ימין
  en: right-hand (palm) rule for the magnetic force
  definition: 'קובע את כיוון הכוח המגנטי. פורשים את כף יד ימין: האצבעות בכיוון השדה, האגודל בכיוון המהירות של מטען חיובי (או בכיוון הזרם), והכוח יוצא מכף היד, בניצב לה. על מטען שלילי הכוח בכיוון ההפוך.'
  lesson: '4.4'
