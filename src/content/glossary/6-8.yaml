# Lesson 6.8 terms (chapter 6 core). Format and rules: see glossary/1-5.yaml.

- id: circulation
  term: סירקולציה
  en: circulation
  symbol: '\oint \vec E\cdot d\vec l'
  definition: 'האינטגרל הקווי של שדה סביב מסלול סגור. בשדה חשמלי סטטי הסירקולציה סביב כל מסלול היא אפס (שדה משמר); בחוק אמפר הסירקולציה של B היא μ₀ כפול הזרם הכלוא.'
  reject: [צירקולציה]
  lesson: '6.8'

- id: curl
  term: רוטור
  en: curl
  symbol: '\nabla\times\vec E'
  definition: 'הסירקולציה סביב לולאה קטנה סביב נקודה, חלקי שטח הלולאה, בגבול שהלולאה קטנה לאפס. זה וקטור שניצב ללולאה שבה הסירקולציה הכי גדולה, בכיוון שקובע כלל יד ימין. ברכיב z: ∂Ey/∂x − ∂Ex/∂y. רוטור אינו "קווים מעגליים": בשדה עם קווים ישרים הרוטור יכול להיות שונה מאפס, ובשדה עם קווים מעגליים הוא יכול להיות אפס.'
  lesson: '6.8'

- id: stokes-theorem
  term: משפט סטוקס
  en: Stokes' theorem
  definition: 'הסירקולציה סביב מסלול סגור שווה לשטף של הרוטור דרך משטח שהמסלול הוא השפה שלו: ∮E·dl = ∫(∇×E)·dA. מחברים אינסוף לולאות קטנות, ולאורך הצלעות המשותפות הסירקולציה מתבטלת.'
  lesson: '6.8'
