# Lesson 2.1 question bank. Strings may hold $inline$ / $$display$$ TeX and **bold**; they are
# rendered at build time. YAML note: plain and single-quoted strings keep backslashes literally.
# Every number below was recomputed with src/physics/potential.ts.

chapter: 2
questions:
  # ------------------------------------------------ OBJ-2.1-1: work of a uniform field
  - id: Q-2.1-uniform-work
    type: numeric
    objectives: [OBJ-2.1-1]
    prompt: >-
      מטען $q = +3\,\text{nC}$ זז $20$ ס"מ בכיוון של שדה חשמלי אחיד שעוצמתו $5000\,\text{N/C}$.
      כמה עבודה עשה השדה על המטען? ענו בג'אול.
    answer: 3.0e-6
    unit: J
    tolerance: 0.03
    correctFeedback: 'נכון: $W = qEd = 3\cdot10^{-9}\cdot 5000\cdot 0.2 = 3\cdot10^{-6}\,\text{J}$. העבודה חיובית, כי המטען החיובי זז בכיוון הכוח.'
    wrongFeedback: 'בשדה אחיד $W = qEd$. הציבו את המטען בקולון ואת ההעתק במטרים.'
    commonWrong:
      - value: 3.0e-4
        feedback: 'הצבתם $d = 20$ במקום $0.2\,\text{m}$. בנוסחה המרחק במטרים.'
      - value: -3.0e-6
        feedback: 'המטען חיובי וזז בכיוון השדה, כלומר בכיוון הכוח. העבודה חיובית.'
        misconception: MC-work-raises-energy
    hints:
      - 'הכוח על המטען הוא $F = qE$, וההעתק בכיוון הכוח הוא $0.2\,\text{m}$.'

  - id: Q-2.1-electron-sign
    type: mc
    objectives: [OBJ-2.1-1]
    qualitative: true
    prompt: >-
      בשדה חשמלי אחיד שמצביע ימינה, מזיזים **אלקטרון** $10$ ס"מ ימינה. מה סימן העבודה שהשדה עשה עליו?
    choices:
      - text: שלילי.
        correct: true
        feedback: 'נכון. על אלקטרון הכוח הפוך לשדה, כלומר שמאלה. האלקטרון זז ימינה, נגד הכוח, ולכן העבודה שלילית: $W = qEd$ עם $q < 0$.'
      - text: חיובי, כי האלקטרון זז בכיוון השדה.
        feedback: 'הסימן של העבודה נקבע לפי כיוון **הכוח**, לא לפי כיוון השדה. על מטען שלילי הכוח הפוך לשדה.'
      - text: אפס, כי האלקטרון כמעט חסר מסה.
        feedback: 'המסה לא נכנסת לעבודה. הכוח $|q|E$ פועל על האלקטרון, וההעתק לאורכו, ולכן העבודה לא אפס.'
      - text: אי אפשר לדעת בלי לדעת את מהירות האלקטרון.
        feedback: 'העבודה תלויה רק בכוח ובהעתק, $W = qEd$. המהירות לא משנה אותה.'

  - id: Q-2.1-diagonal
    type: numeric
    objectives: [OBJ-2.1-1]
    level: mid
    prompt: >-
      בשדה אחיד של $2000\,\text{N/C}$ שמצביע ימינה, מטען $q = +2\,\mu\text{C}$ זז מנקודה A לנקודה B
      שנמצאת $30$ ס"מ ימינה ו-$40$ ס"מ למעלה ממנה (המרחק בקו ישר הוא $50$ ס"מ).
      כמה עבודה עשה השדה? ענו בג'אול.
    answer: 1.2e-3
    unit: J
    tolerance: 0.03
    correctFeedback: 'נכון: רק ההעתק בכיוון השדה נחשב. $W = qEd = 2\cdot10^{-6}\cdot 2000\cdot 0.3 = 1.2\cdot10^{-3}\,\text{J}$.'
    wrongFeedback: 'פרקו את ההעתק לרכיב בכיוון השדה ולרכיב בניצב לו. רק הרכיב בכיוון השדה תורם לעבודה.'
    commonWrong:
      - value: 2.0e-3
        feedback: 'השתמשתם במרחק הישר, $0.5\,\text{m}$. בתזוזה האנכית הכוח ניצב להעתק ואינו עושה עבודה.'
        misconception: MC-work-across-field
      - value: 1.6e-3
        feedback: 'השתמשתם ברכיב האנכי, $0.4\,\text{m}$. השדה אופקי, ולכן דווקא הרכיב האנכי לא תורם.'
        misconception: MC-work-across-field
    hints:
      - '$W = F\,\Delta x\cos\alpha$: מכפילים את הכוח ברכיב ההעתק שבכיוון הכוח.'

  - id: Q-2.1-across
    type: mc
    objectives: [OBJ-2.1-1, OBJ-2.1-2]
    qualitative: true
    prompt: >-
      בין שני לוחות טעונים יש שדה אחיד אופקי. מזיזים מטען חיובי $15$ ס"מ **למעלה**, בניצב לשדה.
      כמה עבודה עשה השדה?
    choices:
      - text: אפס, כי הכוח ניצב לתזוזה.
        correct: true
        feedback: 'נכון. $W = F\,\Delta x\cos 90^\circ = 0$. ההעתק לא משנה את המיקום של המטען בכיוון השדה.'
      - text: $qE \cdot 0.15\,\text{m}$, כי הכוח פעל על המטען לאורך כל הדרך.
        feedback: 'הכוח פעל, אבל הוא אופקי וההעתק אנכי. כוח שניצב לתזוזה לא עושה עבודה, כמו שכוח הכבידה לא עושה עבודה על עגלה שנוסעת על משטח אופקי.'
        misconception: MC-work-across-field
      - text: עבודה שלילית, כי צריך להתאמץ כדי להזיז את המטען.
        feedback: 'כדי להזיז אותו צריך כוח חיצוני, אבל השאלה על העבודה של **השדה**. הכוח החשמלי ניצב לתזוזה, ולכן העבודה שלו אפס.'
        misconception: MC-work-across-field
      - text: תלוי אם המטען זז מהר או לאט.
        feedback: 'העבודה תלויה רק בכוח ובהעתק. כאן הם ניצבים זה לזה, ולכן היא אפס בכל מהירות.'

  # ------------------------------------------------ OBJ-2.1-2: conservative field, W = −ΔU
  - id: Q-2.1-three-paths
    type: twotier
    objectives: [OBJ-2.1-2]
    qualitative: true
    prompt: >-
      מטען חיובי עובר בשדה חשמלי אחיד מנקודה A לנקודה B בשלושה מסלולים: 1 קו ישר, 2 מסלול באורך כפול,
      3 מסלול באורך פי 5 שעובר גם בנקודות שנמצאות "מאחורי" A. באיזה מסלול השדה עושה את העבודה הגדולה ביותר?
    choices:
      - text: בכל המסלולים העבודה שווה.
        correct: true
        feedback: נכון. העבודה של שדה משמר תלויה רק בנקודות A ו-B.
      - text: במסלול 3, כי הוא הארוך ביותר.
        feedback: 'אורך המסלול לא קובע. בקטעים שבהם המטען זז נגד הכוח העבודה שלילית, והיא מקזזת את הקטעים האחרים.'
        misconception: MC-work-depends-on-path
      - text: במסלול 1, כי הוא הקצר ביותר.
        feedback: 'במסלול 1 אין "בזבוז", אבל גם במסלולים האחרים העבודה הכוללת זהה. הקטעים החיוביים והשליליים מתקזזים.'
      - text: במסלול 3, כי הוא עובר גם מאחורי A.
        feedback: 'הקטעים שמאחורי A מוסיפים עבודה שלילית בדרך פנימה ועבודה חיובית בדרך חזרה, והן מתקזזות.'
        misconception: MC-work-depends-on-path
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: השדה החשמלי משמר, ולכן העבודה תלויה רק בנקודת ההתחלה ובנקודת הסיום.
        correct: true
        feedback: נכון. זו בדיוק ההגדרה של שדה משמר.
      - text: ככל שהדרך ארוכה יותר, הכוח פועל על המטען זמן רב יותר.
        feedback: 'עבודה היא כוח כפול העתק בכיוון הכוח, לא כוח כפול זמן. הזמן לא נכנס לעבודה.'
        misconception: MC-work-depends-on-path
      - text: במסלול ישר אין קטעים שבהם המטען זז נגד הכוח.
        feedback: 'זה נכון לגבי המסלול הישר, אבל לא מסביר למה העבודה במסלולים האחרים שווה לו.'

  - id: Q-2.1-loop
    type: mc
    objectives: [OBJ-2.1-2]
    qualitative: true
    prompt: >-
      מטען יוצא מנקודה A בשדה של מטען נקודתי, עובר מסלול ארוך ומסובך, וחוזר בסוף ל-A. כמה עבודה עשה השדה בכל המסלול?
    choices:
      - text: אפס.
        correct: true
        feedback: 'נכון. במסלול סגור העבודה של שדה משמר היא אפס: $W = U_A - U_A = 0$.'
      - text: עבודה חיובית, שגדלה עם אורך המסלול.
        feedback: 'אורך המסלול לא משנה. המטען חזר לנקודת ההתחלה, ולכן האנרגיה הפוטנציאלית שלו חזרה לערך ההתחלתי.'
        misconception: MC-work-depends-on-path
      - text: תלוי בכיוון שבו הקיף המטען את מטען המקור.
        feedback: 'בשדה משמר הכיוון לא משנה. בשני הכיוונים מתחילים ומסיימים באותה נקודה, והעבודה אפס.'
      - text: אי אפשר לדעת, כי השדה של מטען נקודתי לא אחיד.
        feedback: 'גם שדה שאינו אחיד יכול להיות משמר. השדה של מטען נקודתי משמר, ולכן העבודה במסלול סגור היא אפס.'

  - id: Q-2.1-delta-u-sign
    type: mc
    objectives: [OBJ-2.1-2]
    qualitative: true
    prompt: >-
      מטען משתחרר ממנוחה בשדה חשמלי, והשדה עושה עליו עבודה של $+5\,\mu\text{J}$. מה השינוי באנרגיה הפוטנציאלית של המערכת?
    choices:
      - text: $\Delta U = -5\,\mu\text{J}$.
        correct: true
        feedback: 'נכון. $\Delta U = -W$: האנרגיה הפוטנציאלית קטנה ב-$5\,\mu\text{J}$, והיא הפכה לאנרגיה קינטית של המטען.'
      - text: $\Delta U = +5\,\mu\text{J}$.
        feedback: 'השדה עושה עבודה **על חשבון** האנרגיה הפוטנציאלית, כמו כבידה על כדור שנופל. עבודה חיובית של השדה מקטינה את $U$.'
        misconception: MC-work-raises-energy
      - text: $\Delta U = 0$, כי האנרגיה נשמרת.
        feedback: 'האנרגיה הכוללת נשמרת, אבל היא עוברת מצורה לצורה: $U$ קטנה והאנרגיה הקינטית גדלה באותו שיעור.'
      - text: אי אפשר לדעת בלי לדעת את נקודת הייחוס.
        feedback: 'נקודת הייחוס קובעת את **הערך** של $U$, אבל לא את **השינוי** שלה. השינוי נקבע מהעבודה בלבד.'

  - id: Q-2.1-uniform-delta-u
    type: numeric
    objectives: [OBJ-2.1-2]
    level: mid
    prompt: >-
      בשדה אחיד של $4\cdot10^{4}\,\text{N/C}$ מזיזים מטען $q = -5\,\text{nC}$ מרחק $6$ ס"מ **בכיוון השדה**.
      מה השינוי באנרגיה הפוטנציאלית, $\Delta U$? ענו בג'אול, עם סימן.
    answer: 1.2e-5
    unit: J
    tolerance: 0.03
    correctFeedback: 'נכון. $W = qEd = (-5\cdot10^{-9})\cdot 4\cdot10^{4}\cdot 0.06 = -1.2\cdot10^{-5}\,\text{J}$, ולכן $\Delta U = -W = +1.2\cdot10^{-5}\,\text{J}$. המטען השלילי זז נגד הכוח, ו-$U$ גדלה.'
    wrongFeedback: 'חשבו קודם את עבודת השדה, $W = qEd$ עם הסימן של המטען, ואחר כך $\Delta U = -W$.'
    commonWrong:
      - value: -1.2e-5
        feedback: 'זו עבודת השדה, $W$. השינוי באנרגיה הפוטנציאלית הפוך לה בסימן: $\Delta U = -W$.'
        misconception: MC-work-raises-energy
      - value: 1.2e-3
        feedback: 'הצבתם $d = 6$ במקום $0.06\,\text{m}$.'
    hints:
      - 'על מטען שלילי הכוח הפוך לשדה. המטען זז בכיוון השדה, כלומר נגד הכוח.'

  # ------------------------------------------------ OBJ-2.1-3: U = kq₁q₂/r
  - id: Q-2.1-pair-energy
    type: numeric
    objectives: [OBJ-2.1-3]
    prompt: >-
      מטען $+2\,\mu\text{C}$ ומטען $-5\,\mu\text{C}$ נמצאים במרחק $30$ ס"מ זה מזה.
      מה האנרגיה הפוטנציאלית החשמלית של הזוג (עם $U = 0$ באינסוף)? ענו בג'אול, עם סימן.
    answer: -0.3
    unit: J
    tolerance: 0.03
    correctFeedback: 'נכון: $U = \dfrac{kq_1q_2}{r} = \dfrac{9\cdot10^{9}\cdot 2\cdot10^{-6}\cdot(-5\cdot10^{-6})}{0.3} = -0.3\,\text{J}$.'
    wrongFeedback: 'הציבו ב-$U = kq_1q_2/r$ את שני המטענים עם הסימנים שלהם, ואת המרחק במטרים (לא בריבוע).'
    commonWrong:
      - value: 0.3
        feedback: 'שכחתם את הסימן של המטען השלילי. למטענים בסימנים מנוגדים $U$ שלילית.'
        misconception: MC-negative-energy-impossible
      - value: -1.0
        feedback: 'חילקתם ב-$r^2$. באנרגיה הפוטנציאלית המרחק לא בריבוע: $U = kq_1q_2/r$.'
    hints:
      - 'שימו לב: בחוק קולון יש $r^2$, ובאנרגיה הפוטנציאלית רק $r$.'

  - id: Q-2.1-separate-unlike
    type: mc
    objectives: [OBJ-2.1-3]
    qualitative: true
    prompt: >-
      מטען חיובי ומטען שלילי נמצאים במרחק $r$ זה מזה. מרחיקים אותם עד מרחק $2r$. מה קורה לאנרגיה הפוטנציאלית של הזוג?
    choices:
      - text: היא גדלה (מתקרבת לאפס מלמטה).
        correct: true
        feedback: 'נכון. $U = kq_1q_2/r$ שלילית. במרחק כפול היא חצי ממה שהייתה, כלומר פחות שלילית, וזו עלייה. כדי להרחיק מטענים שמושכים זה את זה צריך להשקיע עבודה, והיא נאגרת כאנרגיה פוטנציאלית.'
      - text: היא קטנה, כי המטענים רחוקים יותר זה מזה.
        feedback: 'זה נכון למטענים באותו סימן. כאן הם מושכים זה את זה: השדה עושה עבודה שלילית כשמרחיקים אותם, ולכן $U$ גדלה.'
        misconception: MC-closer-means-more-energy
      - text: היא לא משתנה, כי סכום המטענים לא השתנה.
        feedback: '$U$ תלויה במרחק בין המטענים. היא משתנה כשהמרחק משתנה.'
      - text: היא קטנה פי 4, כי המרחק כפול.
        feedback: 'גם הכיוון שגוי וגם הגודל: באנרגיה הפוטנציאלית המרחק לא בריבוע, ו-$U$ השלילית רק נעשית קרובה יותר לאפס.'
        misconception: MC-closer-means-more-energy

  - id: Q-2.1-rank-pairs
    type: rank
    objectives: [OBJ-2.1-3]
    qualitative: true
    prompt: >-
      דרגו את האנרגיה הפוטנציאלית של ארבעה זוגות מטענים, מהגדולה לקטנה (שימו לב לסימן):
    items:
      - id: A
        label: '$+q$ ו-$+q$ במרחק $r$'
      - id: B
        label: '$+q$ ו-$-q$ במרחק $r$'
      - id: C
        label: '$+q$ ו-$+q$ במרחק $2r$'
      - id: D
        label: '$+q$ ו-$-q$ במרחק $2r$'
    order: [A, C, D, B]
    correctFeedback: >-
      נכון. ב-A: $U = kq^2/r$, וב-C חצי מזה. הזוגות המנוגדים שליליים: ב-D $-kq^2/(2r)$,
      וב-B $-kq^2/r$, השלילי ביותר. הקרובים המנוגדים "קשורים" הכי חזק.
    wrongFeedback: 'כתבו כל אנרגיה כמספר כפול $kq^2/r$, עם הסימן. מספר שלילי קטן מכל מספר חיובי, ו-$-1$ קטן מ-$-\tfrac12$.'
    hints:
      - 'ב-B ו-D האנרגיה שלילית. איזה מהם שלילי יותר?'

  - id: Q-2.1-pair-work
    type: numeric
    objectives: [OBJ-2.1-3, OBJ-2.1-2]
    level: bagrut
    prompt: >-
      מטען $Q = +4\,\mu\text{C}$ מקובע במקומו. מטען $q = +1\,\mu\text{C}$ מתרחק ממנו מ-$20$ ס"מ עד $50$ ס"מ.
      כמה עבודה עשה השדה של $Q$ על $q$? ענו בג'אול.
    answer: 0.108
    unit: J
    tolerance: 0.03
    correctFeedback: >-
      נכון. $U_i = \dfrac{9\cdot10^{9}\cdot 4\cdot10^{-6}\cdot 10^{-6}}{0.2} = 0.18\,\text{J}$ ו-$U_f = \dfrac{9\cdot10^{9}\cdot 4\cdot10^{-6}\cdot 10^{-6}}{0.5} = 0.072\,\text{J}$.
      $W = U_i - U_f = 0.108\,\text{J}$: חיובית, כי המטענים דוחים זה את זה ו-$q$ זז בכיוון הכוח.
    wrongFeedback: 'חשבו את $U$ בשני המרחקים, ואחר כך $W = U_i - U_f$.'
    commonWrong:
      - value: -0.108
        feedback: 'זה $\Delta U = U_f - U_i$. עבודת השדה הפוכה בסימן: $W = -\Delta U$.'
