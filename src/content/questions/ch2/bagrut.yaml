    parts:
      - label: א
        type: open
        points: 5
        level: mid
        objectives: [OBJ-2.6-3, OBJ-2.7-3]
        prompt: >-
          (1) הסבירו מדוע הקריאה של המשקל יורדת כשיש מתח בין הלוחות.

          (2) הראו שגודל כוח המשיכה בין הלוחות הוא $F = \dfrac{\varepsilon_0 A V^2}{2d^2}$.
        hints:
          - 'מה הסימנים של המטענים על שני הלוחות? לאיזה כיוון פועל הכוח על הלוח התחתון?'
          - 'כל לוח נמצא רק בשדה של הלוח השני, שהוא חצי מהשדה שבין הלוחות (שיעור 2.7).'
        solution:
          - { kind: formula, text: '$C = \dfrac{\varepsilon_0 A}{d}$, $Q = CV$ ו-$E = \dfrac{V}{d}$. הכוח על לוח אחד: $F = Q\cdot\dfrac{E}{2}$.' }
          - { kind: manipulation, text: '(1) הלוחות מחוברים להדקים מנוגדים של הספק, ולכן הם טעונים במטענים מנוגדים, $\pm Q$, ומושכים זה את זה. על הלוח התחתון פועל כוח $F$ כלפי מעלה, ולכן המעמד לוחץ על המשקל בכוח קטן יותר: הקריאה יורדת ב-$\Delta m = F/g$.' }
          - { kind: manipulation, text: '(2) השדה שבין הלוחות, $E$, הוא סכום השדות של שני הלוחות, כל אחד $E/2$. לוח לא מפעיל כוח על עצמו, ולכן על המטען $Q$ של הלוח התחתון פועל רק השדה של הלוח העליון: $F = Q\cdot\dfrac{E}{2}$.' }
          - { kind: manipulation, text: 'מציבים $Q = \dfrac{\varepsilon_0 A}{d}\,V$ ו-$E = \dfrac{V}{d}$: $F = \dfrac12\cdot\dfrac{\varepsilon_0 A V}{d}\cdot\dfrac{V}{d}$.' }
          - { kind: result, text: '$F = \dfrac{\varepsilon_0 A V^2}{2d^2}$. במרחק קבוע הכוח ביחס ישר לריבוע המתח.' }
        rubric:
          - text: הסברתי שהלוחות טעונים במטענים מנוגדים ומושכים זה את זה, ולכן הלוח התחתון נמשך כלפי מעלה והקריאה יורדת.
          - text: 'כתבתי שעל לוח אחד פועל רק השדה של הלוח השני, $E/2$, ולכן $F = \tfrac12 QE$ (ולא $QE$).'
          - text: 'הצבתי $Q = CV$ עם $C = \varepsilon_0 A/d$, ו-$E = V/d$.'
          - text: 'קיבלתי $F = \dfrac{\varepsilon_0 A V^2}{2d^2}$.'

      - label: ב
        type: open
        points: 8
        level: mid
        objectives: [OBJ-0.4-3, OBJ-0.4-2]
        prompt: >-
          התלמידים כיוונו את ספק המתח למתחים שונים, ורשמו בכל פעם את הירידה בקריאת המשקל:
          $$\begin{array}{c|c} V\,(\text{V}) & \Delta m\,(\text{g}) \\ \hline 200 & 0.13 \\ 400 & 0.55 \\ 600 & 1.16 \\ 800 & 2.15 \\ 1000 & 3.26 \\ 1200 & 4.80 \end{array}$$

          (1) לפי הביטוי מסעיף א, איזה גודל כדאי לשים על הציר האופקי כדי שהגרף של $\Delta m$ יהיה קו ישר? נמקו, והוסיפו
          לטבלה עמודה של הגודל הזה.

          (2) סרטטו דיאגרמת פיזור של $\Delta m$ כתלות בגודל שבחרתם, והוסיפו לה את הקו המתאים לה ביותר (קו מגמה).
        hints:
          - 'לפי סעיף א, הכוח ביחס ישר ל-$V^2$, לא ל-$V$. מה היה יוצא בגרף של $\Delta m$ כתלות ב-$V$ עצמו?'
          - 'נוח לכתוב את $V^2$ ביחידות של $10^{5}\,\text{V}^2$.'
        solution:
          - { kind: formula, text: 'לפי סעיף א, $\Delta m = \dfrac{F}{g} = \dfrac{\varepsilon_0 A}{2gd^2}\cdot V^2$. במרחק קבוע כל מה שלפני $V^2$ קבוע, ולכן $\Delta m$ ביחס ישר ל-$V^2$: שמים את $V^2$ על הציר האופקי. בגרף של $\Delta m$ כתלות ב-$V$ עצמו הנקודות היו על עקומה שמתעקלת כלפי מעלה.' }
          - { kind: manipulation, text: 'העמודה החדשה, ביחידות של $10^{5}\,\text{V}^2$: $0.4$, $1.6$, $3.6$, $6.4$, $10$, $14.4$.' }
          - { kind: manipulation, text: 'הציר האופקי מ-0 עד $15\cdot10^{5}\,\text{V}^2$, והאנכי מ-0 עד $5\,\text{g}$. מסמנים את שש הנקודות. הקו המתאים להן ביותר הוא $\Delta m = 3.32\cdot10^{-6}\,V^2 - 0.004$ (עם $V^2$ ב-$\text{V}^2$ ו-$\Delta m$ בגרמים). ביחידות של העמודה החדשה הוא עובר ליד $(1.6,\ 0.53)$ וליד $(14.4,\ 4.77)$, וכמעט דרך הראשית.' }
          - { kind: result, text: 'דיאגרמת פיזור של שש נקודות, וקו מגמה ישר שעובר כמעט דרך הראשית: הירידה בקריאה ביחס ישר לריבוע המתח, כפי שהביטוי מסעיף א צופה.' }
        rubric:
          - text: 'בחרתי $V^2$ לציר האופקי, ונימקתי לפי $F \propto V^2$ מסעיף א.'
          - text: 'חישבתי נכון את עמודת $V^2$.'
          - text: כתבתי ליד כל ציר את הגודל ואת היחידות, ובחרתי קנה מידה אחיד שמכיל את כל הנקודות.
          - text: סימנתי נכון את שש הנקודות, והעברתי קו ישר אחד (לא קו שבור בין הנקודות), עם נקודות משני צדדיו.

      - label: ג
        type: numeric
        points: 6
        level: bagrut
        standalone: false
        objectives: [OBJ-0.4-4, OBJ-0.4-1]
        prompt: חשבו את $\varepsilon_0$ לפי השיפוע של קו המגמה.
        answer: 8.84e-12
        unit: C²/(N·m²)
        tolerance: 0.1
        correctFeedback: >-
          נכון. לפי סעיף ב, השיפוע $s$ של הגרף הוא $\dfrac{\varepsilon_0 A}{2gd^2}$. משתי נקודות רחוקות על הקו:
          $s = \dfrac{4.77 - 0.53}{(14.4 - 1.6)\cdot10^{5}} = 3.31\cdot10^{-6}\,\text{g/V}^2$, כלומר $3.31\cdot10^{-9}\,\text{kg/V}^2$.
          מבודדים:
          $$\varepsilon_0 = \frac{2gd^2 s}{A} = \frac{2\cdot10\cdot(2.0\cdot10^{-3})^2\cdot3.31\cdot10^{-9}}{0.030} \approx 8.8\cdot10^{-12}\ \frac{\text{C}^2}{\text{N}\cdot\text{m}^2}$$
          בתוך פחות מאחוז מהערך שבדף הנוסחאות.
        wrongFeedback: >-
          השוו את $\Delta m = \dfrac{\varepsilon_0 A}{2gd^2}\cdot V^2$ למשוואה של קו ישר: מה עומד במקום השיפוע? חשבו אותו משתי
          נקודות רחוקות על הקו, העבירו גרמים לקילוגרמים ומילימטרים למטרים, ורק אז בודדו את $\varepsilon_0$.
        commonWrong:
          - value: 8.84e-9
            feedback: 'השארתם את השיפוע בגרם ל-$\text{V}^2$. מסה מציבים בקילוגרמים: $1\,\text{g} = 10^{-3}\,\text{kg}$, ולכן מחלקים עוד ב-$10^{3}$.'
          - value: 8.84e-13
            feedback: 'שכחתם להכפיל ב-$g$. המשקל מראה מסה, והכוח הוא $F = \Delta m\cdot g$.'
          - value: 4.42e-12
            feedback: 'שכחתם את ה-2. כל לוח נמצא רק בשדה של הלוח השני, $E/2$, ולכן $F = \tfrac12 QE$, והשיפוע הוא $\dfrac{\varepsilon_0 A}{2gd^2}$.'
          - value: 8.84e-6
            feedback: 'הצבתם את $d$ במילימטרים. $d = 2.0\cdot10^{-3}\,\text{m}$, ולכן $d^2 = 4\cdot10^{-6}\,\text{m}^2$.'
        hints:
          - 'לפי סעיף ב, איזה גודל הוא השיפוע של הגרף של $\Delta m$ כתלות ב-$V^2$?'
        explanation: >-
          בדיקת יחידות: $\dfrac{(\text{m/s}^2)\cdot\text{m}^2\cdot(\text{kg/V}^2)}{\text{m}^2} = \dfrac{\text{N}}{\text{V}^2}$. מכיוון
          ש-$1\,\text{V} = 1\,\text{N}\cdot\text{m/C}$, זה $\dfrac{\text{N}\cdot\text{C}^2}{\text{N}^2\cdot\text{m}^2} = \dfrac{\text{C}^2}{\text{N}\cdot\text{m}^2}$,
          היחידה של $\varepsilon_0$.

      - label: ד
        type: twotier
        points: 5
        level: bagrut
        qualitative: true
        objectives: [OBJ-2.7-2]
        prompt: >-
          התלמידים כיוונו את הספק ל-$1000\,\text{V}$, ואז ניתקו ממנו את הלוחות. הלוחות נשארו טעונים. עכשיו הם הרימו לאט את
          הלוח העליון, עד שהמרחק בין הלוחות גדל פי 2, ל-$4.0\,\text{mm}$. מה קורה לירידה $\Delta m$ בקריאת המשקל?
