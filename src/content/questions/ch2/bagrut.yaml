  # ------------------------------------------------------------ 4: weighing the pull between capacitor plates
  # Data: capacitors.ts plateForce(plateCapacitance(A, d)·V, A)/G, A = 0.030 m², d = 2.0 mm, as a mass in grams,
  # lab.ts measure(…, 0.03, seed 37), rounded to the scale's 0.01 g. fitLine(V², Δm) on the rounded table:
  # slope 3.3166e-6 g/V², intercept -0.0037 g, so ε₀ = 2gd²·slope/A = 8.84e-12. Part ה: plateState.
  - id: Q-2-bagrut-4
    type: bagrut
    title: שוקלים את המשיכה בין לוחות של קבל
    prompt: >-
      תלמידים מדדו את כוח המשיכה בין הלוחות של קבל לוחות באוויר. הלוחות מלבניים, $20\,\text{cm}$ על $15\,\text{cm}$,
      כלומר שטח כל לוח $A = 0.030\,\text{m}^2$. הלוח התחתון מונח על מעמד מבודד שעומד על משקל אלקטרוני. הלוח העליון
      מוחזק במתקן קבוע, מקביל ללוח התחתון ובמרחק $d = 2.0\,\text{mm}$ ממנו. הלוחות מחוברים לספק מתח שאפשר לכוון.
      כשהמתח אפס מאפסים את המשקל. כשיש מתח בין הלוחות, הקריאה של המשקל יורדת ב-$\Delta m$.
      בסעיפים א עד ה התעלמו מאפקט הקצוות. השתמשו ב-$g = 10\,\text{m/s}^2$.
    diagramAlt: משקל אלקטרוני, ועליו מעמד מבודד שנושא את הלוח התחתון, השלילי. מעליו, במרחק d, לוח עליון חיובי שמוחזק במתקן קבוע. שני הלוחות מחוברים לספק מתח.
