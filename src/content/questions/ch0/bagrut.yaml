# Chapter 0 Bagrut-style question: a scenario with lettered parts (א, ב, ג…), 33 points, as in paper
# 036371. Parts are auto-graded (mc, numeric) or `open`: the student writes a solution, reveals the model
# one in Bagrut format (formula → manipulation → substitution with units → result) and ticks the rubric.
#
# The learner has finished mechanics but not electricity, so the experiment is mechanics: a mass on a
# spring, timed over 10 oscillations, with the hanger's mass left out of the table. It practises what
# chapter 0 teaches: prefixes (grams, the time of 10 oscillations), linearisation (T² against m), a
# quantity from the slope (k) and the meaning of an intercept (the hanger's mass). The pendulum of
# example 0-4-6 and the datasets of src/physics/lab.ts are deliberately not reused.
#
# Data: k = 20 N/m, hanger m0 = 50 g. The period T = 2π√((m + m0)/k) is not in src/physics; it was
# computed in a scratch script. measure() from src/physics/lab.ts adds 1.2% scatter to t10 (seed 41),
# rounded to 0.01 s as a stopwatch reads. fitLine() on the rounded table (T = t10/10, m in kg): slope
# 1.980 s²/kg, intercept 0.1002 s², so k = 19.9 N/m and m0 = 50.6 g; residuals at most 1.2%.
# YAML note: never use "…" for TeX.

chapter: 0
questions:
  # ------------------------------------------------- 1: a mass on a spring and a stopwatch
  - id: Q-0-bagrut-1
    type: bagrut
    title: משקולות על קפיץ ושעון עצר
    prompt: >-
      תלמידים תלו קפיץ אנכי ממעמד, ותלו על הקצה התחתון שלו מחזיק משקולות. על המחזיק הניחו משקולות שמסתן
      הכוללת $m$, משכו אותו מעט כלפי מטה ושחררו, והמחזיק התנודד למעלה ולמטה. בעזרת שעון עצר מדדו את הזמן
      $t_{10}$ של 10 תנודות שלמות. את המחזיק עצמו התלמידים לא שקלו, ולכן המסה שלו, $m_0$, אינה ידועה.

      לפי המכניקה, זמן המחזור (הזמן של תנודה שלמה אחת) של גוף שמסתו $M$, התלוי על קפיץ שקבועו $k$, הוא
      $T = 2\pi\sqrt{\dfrac{M}{k}}$. כאן הגוף שמתנודד הוא המחזיק יחד עם המשקולות, כלומר $M = m + m_0$.
      המסה של הקפיץ זניחה. התלמידים רשמו את המדידות בטבלה:
      $$\begin{array}{c|c} m\,(\text{g}) & t_{10}\,(\text{s}) \\ \hline 50 & 4.48 \\ 100 & 5.44 \\ 150 & 6.30 \\ 200 & 7.03 \\ 250 & 7.76 \\ 300 & 8.31 \end{array}$$
    diagramAlt: קפיץ אנכי תלוי ממעמד. בקצה התחתון שלו מחזיק משקולות, שמסתו m₀, ועליו שלוש משקולות שמסתן הכוללת m. חץ כפול מראה שהמחזיק מתנודד למעלה ולמטה.
