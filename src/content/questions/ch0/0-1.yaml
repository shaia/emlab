# Chapter 0 question bank, lesson 0.1. Format and rules: see questions/ch1/1-5.yaml.

chapter: 0
questions:
  # ---------------------------------------------------------------- 0.1 how the course works
  - id: Q-0.1-flap
    type: mc
    objectives: [OBJ-0.1-1]
    qualitative: true
    prompt: >-
      בחלק "חזו" בוחרים תשובה ולוחצים על "זה החיזוי שלי". מה קורה אחר כך?
    choices:
      - text: הדש נפתח, והחיזוי נשמר. בסוף השיעור חוזרים אליו ומשווים אותו למה שגיליתם.
        correct: true
        feedback: נכון. החיזוי לא נמחק ולא משתנה, כדי שאפשר יהיה להשוות בכנות בין מה שחשבתם לבין מה שגיליתם.
      - text: אם החיזוי נכון מקבלים נקודות, ואם הוא שגוי יורדות נקודות.
        feedback: אין שום ציון על חיזוי. מתחייבים כדי לבדוק את האינטואיציה, וחיזוי שגוי הוא חלק רגיל מהלמידה.
        misconception: MC-wrong-prediction-wasted
      - text: אפשר לחזור ולשנות את החיזוי בכל רגע, עד סוף השיעור.
        feedback: אחרי ההתחייבות אי אפשר לשנות את החיזוי. חיזוי שמתקנים בדיעבד כבר לא מלמד אתכם מה חשבתם באמת.

  - id: Q-0.1-example-first
    type: mc
    objectives: [OBJ-0.1-1]
    prompt: >-
      בחלק "דוגמה פתורה" הפתרון מוסתר מתחת לכפתור. מה כדאי לעשות לפני שפותחים אותו?
    choices:
      - text: לנסות לפתור לבד, על דף, ורק אחר כך להשוות כל שלב לפתרון.
        correct: true
        feedback: נכון. ניסיון לפתור לבד, גם כשהוא נתקע, מכין אתכם להבין את הפתרון ולזכור אותו.
      - text: לפתוח מיד ולקרוא את הפתרון פעמיים, כדי לזכור אותו טוב.
        feedback: קריאה חוזרת מרגישה כמו למידה, אבל משאירה פחות בזיכרון מניסיון לפתור. נסו קודם, ואז קראו.
        misconception: MC-rereading-best
      - text: לדלג על הדוגמה, כי השאלות בסוף השיעור מספיקות.
        feedback: הדוגמה מראה את מבנה הפתרון שמצופה מכם בבגרות, צעד אחר צעד. כדאי לעבור עליה, אחרי שניסיתם לבד.

  - id: Q-0.1-parts
    type: multi
    objectives: [OBJ-0.1-1]
    qualitative: true
    prompt: >-
      אילו מהחלקים האלה יש בכל שיעור בקורס? סמנו את כל התשובות הנכונות.
    choices:
      - text: תופעה, ושאלה עליה
        correct: true
        feedback: נכון. כל שיעור פותח במשהו שקורה בעולם, לפני כל הגדרה.
      - text: חיזוי שמתחייבים אליו
        correct: true
        feedback: נכון. החיזוי בא לפני ההסבר, ובסוף השיעור חוזרים אליו.
      - text: משימות באיור חי
        correct: true
        feedback: נכון. בחלק "חקרו" האיור בודק בעצמו שביצעתם את המשימות.
      - text: מבחן עם ציון בסוף השיעור
        feedback: בסוף השיעור יש שאלות לבדיקה עצמית, עם משוב, אבל אין ציון. המטרה היא לגלות מה כבר הבנתם.
      - text: שאלות לבדיקה עצמית, עם משוב
        correct: true
        feedback: נכון. כל תשובה מקבלת הסבר, גם תשובה נכונה.

  - id: Q-0.1-step-mark
    type: mc
    objectives: [OBJ-0.1-2]
    qualitative: true
    prompt: >-
      ליד חלק מהפסקאות בשיעור מופיע הסימן ◂. מה הוא אומר?
    choices:
      - text: שהפסקה שולטת באיור. כשהיא מגיעה לאמצע המסך, או כשלוחצים עליה, האיור עובר למצב שהיא מתארת.
        correct: true
        feedback: נכון. כך הטקסט "מדבר" עם האיור שלידו, ואפשר לחזור לכל שלב בלחיצה.
      - text: שזו פסקה חשובה במיוחד, שכדאי ללמוד בעל-פה.
        feedback: הסימן לא מסמן חשיבות. הוא מסמן פסקה שמשנה את האיור החי שלידה.
      - text: שבפסקה יש קישור לשיעור אחר.
        feedback: קישורים נראים כמו קישורים רגילים. הסימן ◂ מסמן פסקה שמשנה את האיור.

  - id: Q-0.1-change-big
    type: mc
    objectives: [OBJ-0.1-2]
    prompt: >-
      באיור 0.1 רוצים לשנות את הגודל של הכדור הגדול. מה עושים?
    choices:
      - text: לוחצים עליו, ואז מזיזים את פס הגרירה שמופיע מתחת לאיור.
        correct: true
        feedback: נכון. בכל איור בקורס, לחיצה על עצם בוחרת אותו, והפקדים שמתחת לאיור משנים את מה שנבחר.
      - text: גוררים אותו אל מחוץ לאיור.
        feedback: גרירה מזיזה את הכדור ממקום למקום, אבל לא משנה את גודלו. לחצו עליו, וחפשו את פס הגרירה שמתחת לאיור.
      - text: אי אפשר לשנות אותו ביד. רק הפסקאות שבטקסט משנות אותו.
        feedback: פסקאות מסומנות באמת משנות את האיור, אבל אפשר לשנות אותו גם ביד. לחצו על הכדור, ואז השתמשו בפס הגרירה.

  - id: Q-0.1-task-tick
    type: mc
    objectives: [OBJ-0.1-2]
    prompt: >-
      ליד משימה ברשימה שמתחת לאיור הופיע הסימן ✓. מה זה אומר?
    choices:
      - text: האיור זיהה שביצעתם את המשימה, והסימון נשמר.
        correct: true
        feedback: נכון. האיור בודק בעצמו את מה שעשיתם בו, והסימון נשאר גם אם תחזרו לשיעור מחר.
      - text: שעניתם נכון על שאלה בסוף השיעור.
        feedback: התשובות לשאלות מסומנות בשאלות עצמן. ✓ ברשימת המשימות מסמן משימה שביצעתם באיור.
      - text: שהמשימה בוטלה ואין צורך לבצע אותה.
        feedback: ✓ פירושו שהמשימה בוצעה. משימה שעוד לא ביצעתם מופיעה בלי סימן.

  - id: Q-0.1-sim-proves
    type: twotier
    objectives: [OBJ-0.1-2]
    qualitative: true
    prompt: >-
      באיור 0.1 ראיתם שהחץ הירוק מתקצר כשמרחיקים את הכדור הקטן מהגדול.
      האם האיור **מוכיח** שהכוח בין הכדורים נחלש עם המרחק?
    choices:
      - text: לא.
        correct: true
        feedback: נכון. האיור מראה את מה שהחוק צופה, אבל הוא לא מוכיח את החוק.
      - text: כן.
        feedback: 'הכוח באמת נחלש עם המרחק, אבל לא האיור הוכיח את זה. האיור מחשב לפי החוק שהכנסנו לתוכו, ולכן הוא רק מראה מה החוק אומר. מה שמוכיח הוא ניסוי אמיתי.'
        misconception: MC-sim-proves
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: האיור מחשב לפי חוק שכבר הכניסו לתוכו, ולכן הוא מראה רק מה החוק צופה. הוכחה באה מניסוי אמיתי.
        correct: true
        feedback: בדיוק. בשיעור 1.3 נראה את הניסוי האמיתי שממנו בא החוק, ואיור כזה עוזר לראות מה החוק אומר.
      - text: מחשב לא טועה, ולכן מה שהוא מראה נכון בהכרח.
        feedback: המחשב לא טועה בחשבון, אבל הוא מחשב לפי הנוסחה שנתנו לו. אילו הכנסנו לתוכו חוק שגוי, הוא היה מצייר אותו בדיוק באותו ביטחון.
        misconception: MC-sim-proves
      - text: באיור יש רק שני כדורים, ולכן הוא לא מספיק.
        feedback: גם איור עם מאה כדורים לא היה מוכיח את החוק. הבעיה היא לא מספר הכדורים, אלא שהאיור מחשב לפי החוק עצמו.

  - id: Q-0.1-testing-effect
    type: mc
    objectives: [OBJ-0.1-3]
    prompt: >-
      בעוד שבוע יש לכם בוחן על שיעור מהקורס, ויש לכם שעה אחת ללמוד. מה כנראה ישאיר אצלכם יותר בזיכרון?
    choices:
      - text: לקרוא את השיעור פעם אחת, ואז לענות על השאלות שלו בלי להציץ, ולבדוק את התשובות.
        correct: true
        feedback: נכון. זה מה שנמצא בניסויים, למשל בניסוי שתיארנו בשיעור. ניסיון להיזכר מחזק את מה שנשלף מהזיכרון.
      - text: לקרוא את השיעור שלוש פעמים, ולסמן במרקר את המשפטים החשובים.
        feedback: זו השיטה הנפוצה ביותר, והיא מרגישה טוב, כי הטקסט נעשה מוכר. אבל בניסויים היא משאירה פחות בזיכרון אחרי שבוע.
        misconception: MC-rereading-best
      - text: לקרוא את הסיכום של השיעור עשר פעמים.
        feedback: גם זו קריאה חוזרת. הסיכום יראה לכם מוכר מאוד, אבל זיהוי של טקסט מוכר הוא לא היכולת לשלוף אותו בבוחן.
        misconception: MC-rereading-best

  - id: Q-0.1-wrong-prediction
    type: twotier
    objectives: [OBJ-0.1-3]
    qualitative: true
    prompt: >-
      נניח שבאחד השיעורים חזיתם שכוח מסוים יגדל פי 4, ובאיור ראיתם שהוא גדל רק פי 2. מה כדאי לעשות?
    choices:
      - text: לבדוק מה בחשיבה שלכם הוביל ל"פי 4", ולהשוות את זה להסבר בשיעור.
        correct: true
        feedback: נכון. החיזוי השגוי מצביע בדיוק על הרעיון שצריך לתקן.
      - text: לשכוח מהחיזוי. הוא היה שגוי, ולכן הוא לא שווה כלום.
        feedback: דווקא החיזוי השגוי שווה הרבה. הוא מראה איזה רעיון שלכם לא מתאים לניסוי.
        misconception: MC-wrong-prediction-wasted
      - text: לחזור לחלק "חזו" ולתקן את החיזוי לתשובה הנכונה.
        feedback: אי אפשר לשנות חיזוי אחרי ההתחייבות, ובכוונה. מה שמלמד הוא ההשוואה בין מה שחשבתם לבין מה שקרה.
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: חיזוי שגוי שנבדק מול ניסוי מראה איזה רעיון צריך לתקן, ולכן ממנו לומדים הכי הרבה.
        correct: true
        feedback: בדיוק. זו הסיבה שהקורס מבקש לחזות לפני כל הסבר.
      - text: חיזוי שגוי מוריד את הציון בשיעור, ולכן כדאי לתקן אותו.
        feedback: אין ציון על חיזויים. המטרה היחידה שלהם היא לגלות מה האינטואיציה שלכם אומרת.
        misconception: MC-wrong-prediction-wasted
      - text: כנראה שהאיור טעה, כי האינטואיציה שלנו לא טועה.
        feedback: האינטואיציה שווה בדיקה, אבל האיור מחשב לפי חוק שנבדק בניסויים רבים. כשהם לא מסכימים, כדאי לבדוק איפה האינטואיציה החליקה.

  - id: Q-0.1-feels-easy
    type: mc
    objectives: [OBJ-0.1-3]
    qualitative: true
    prompt: >-
      למה קריאה חוזרת **מרגישה** כמו למידה טובה, גם כשהיא לא?
    choices:
      - text: כי טקסט מוכר קל לזהות, ותחושת ההיכרות נראית כמו ידע.
        correct: true
        feedback: נכון. לזהות משהו כשהוא מולכם זה לא אותו דבר כמו לשלוף אותו מהזיכרון, וזה מה שבוחן דורש.
      - text: כי קריאה חוזרת היא באמת הדרך הטובה ביותר, והניסויים טעו.
        feedback: התוצאה חזרה בניסויים רבים, עם חומרים שונים ותלמידים בגילים שונים. הסטודנטים שקראו שוב ושוב היו בטוחים יותר, וזכרו פחות.
        misconception: MC-rereading-best
      - text: כי קריאה חוזרת לוקחת יותר זמן.
        feedback: בניסוי שתי הקבוצות למדו אותו זמן בדיוק. ההבדל היה רק במה שעשו בזמן הזה.

  - id: Q-0.1-sure-wrong
    type: mc
    objectives: [OBJ-0.1-4]
    qualitative: true
    prompt: >-
      עניתם על שאלה, לחצתם "בדיקה · בטוחים", והתשובה הייתה שגויה. מה זה מרמז?
    choices:
      - text: שכנראה יש לכם רעיון שגוי שנשמע נכון, תפיסה שגויה, ששווה לבדוק מול האיור או הניסוי.
        correct: true
        feedback: נכון. טעות בביטחון היא הסימן החזק ביותר לתפיסה שגויה, ובדיוק אותה כדאי לבדוק מול ניסוי.
      - text: שסתם לא הייתם מרוכזים, ואין מה לעשות עם זה.
        feedback: 'אולי, אבל ביטחון בתשובה שגויה הוא בדרך כלל סימן לרעיון שנראה לכם נכון. קראו את המשוב: הוא מסביר את הרעיון הזה.'
        misconception: MC-confidence-irrelevant
      - text: שעדיף מעכשיו לסמן תמיד "לא בטוחים", כדי שטעויות לא ייספרו.
        feedback: אין ציון שמשתנה לפי הסימון. סימון לא כנה רק מסתיר מכם, ומהקורס, איזה רעיון צריך לתקן.
        misconception: MC-confidence-irrelevant

  - id: Q-0.1-rank-review
    type: rank
    objectives: [OBJ-0.1-4]
    qualitative: true
    prompt: >-
      דרגו את ארבעת המצבים לפי כמה **דחוף** לחזור על הנושא. כאן "גדול" פירושו "דחוף": את הדחוף ביותר שימו למעלה.
    items:
      - id: right-unsure
        label: עניתם נכון, וסימנתם "לא בטוחים"
      - id: wrong-sure
        label: טעיתם, וסימנתם "בטוחים"
      - id: right-sure
        label: עניתם נכון, וסימנתם "בטוחים"
      - id: wrong-unsure
        label: טעיתם, וסימנתם "לא בטוחים"
    order: [wrong-sure, wrong-unsure, right-unsure, right-sure]
    correctFeedback: >-
      נכון. טעות בביטחון היא תפיסה שגויה: היא לא תיעלם מעצמה. טעות בלי ביטחון היא חור בידע, ואתם כבר יודעים עליו.
      תשובה נכונה בלי ביטחון אולי הייתה ניחוש, ורק תשובה נכונה בביטחון אומרת שהנושא כנראה בידיים שלכם.
    wrongFeedback: >-
      חשבו מה כל מצב אומר. טעות בביטחון היא רעיון שגוי שנשמע לכם נכון, ולכן הכי קשה לגלות אותה בלי עזרה.
      תשובה נכונה בלי ביטחון אולי הייתה ניחוש.

  - id: Q-0.1-honest
    type: twotier
    objectives: [OBJ-0.1-4]
    prompt: >-
      מישהו בכיתה אומר: "אני תמיד לוחץ 'בדיקה · בטוחים'. זה ממילא לא משנה כלום."
      האם הסימון משנה משהו?
    choices:
      - text: כן.
        correct: true
        feedback: נכון. הסימון הוא חלק ממה שהקורס רושם אצלכם, בדפדפן שלכם, על ההבנה שלכם.
      - text: לא.
        feedback: הסימון לא משנה ציון, כי אין ציון, אבל הוא משנה את מה שאפשר ללמוד מהטעות. בדקו את הנימוקים.
        misconception: MC-confidence-irrelevant
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: לפי הסימון הקורס מבחין בין תפיסה שגויה לבין חור בידע, ולכן סימון לא כנה מטעה אותו.
        correct: true
        feedback: בדיוק. אותה תשובה שגויה אומרת דבר אחר לגמרי כשהייתם בטוחים בה.
      - text: הסימון הוא רק נימוס. הקורס מתעלם ממנו.
        feedback: הקורס לא מתעלם ממנו. טעות בביטחון נרשמת כסימן לתפיסה שגויה, וטעות בלי ביטחון כחור בידע.
        misconception: MC-confidence-irrelevant
      - text: סימון "בטוחים" נותן נקודות נוספות.
        feedback: אין נקודות ואין ציון. הסימון שווה משהו רק אם הוא כנה.
