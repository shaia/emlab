# Lesson 4.6 question bank. Strings may hold $inline$ / $$display$$ TeX and **bold**; they are
# rendered at build time. YAML note: plain and single-quoted strings keep backslashes literally.
# Every number below was recomputed with src/physics/magnetism.ts (orbitRadius, orbitPeriod,
# speedFromVoltage, spectrometerRadius) and src/physics/orbits.ts (edgeCrossing, ionMass,
# landingDistance, isotopeSeparation). Data differ on purpose from the figures and the worked examples.
# Direction convention: x right, y up, ⊙ out of the page, ⊗ into it.

chapter: 4
questions:
  # ------------------------------------------------ OBJ-4.6-1: why a circle, r = mv/(qB)
  - id: Q-4.6-why-circle
    type: mc
    objectives: [OBJ-4.6-1]
    qualitative: true
    prompt: >-
      פרוטון נכנס בניצב לשדה מגנטי אחיד, ובשדה המסלול שלו הוא מעגל. מה הסיבה לכך?
    choices:
      - text: 'הכוח המגנטי ניצב תמיד למהירות, וגודלו קבוע, ולכן הוא משנה רק את כיוון התנועה, באותה מידה בכל רגע.'
        correct: true
        feedback: 'נכון. כוח ניצב לא עושה עבודה, ולכן גודל המהירות קבוע, וגם $F = qvB$ קבוע. כוח קבוע שמכוון תמיד בניצב למהירות הוא בדיוק הכוח של תנועה מעגלית קצובה.'
      - text: 'הכוח המגנטי מכוון לאורך קווי השדה, והפרוטון נע סביבם.'
        feedback: 'הכוח המגנטי ניצב לשדה, לא לאורכו (שיעור 4.5). הוא ניצב גם למהירות, ולכן מסובב את כיוון התנועה במישור שניצב לשדה.'
      - text: 'הכוח המגנטי מאט את הפרוטון בהדרגה, והמסלול מתעקל.'
        feedback: 'הכוח המגנטי ניצב למהירות ולא עושה עבודה, ולכן הוא לא מאט את הפרוטון. אילו הפרוטון היה מאט, הרדיוס $mv/(qB)$ היה קטן, והמסלול היה ספירלה ולא מעגל.'
        misconception: MC-magnetic-orbit-spirals
      - text: 'יש על הפרוטון כוח החוצה מהמרכז, והכוח המגנטי מאזן אותו.'
        feedback: 'בתנועה מעגלית אין כוח שמכוון החוצה. הכוח השקול מכוון אל המרכז, $mv^2/r$, וכאן הכוח המגנטי הוא הכוח השקול כולו.'
        misconception: MC-orbit-force-outward

  - id: Q-4.6-radius
    type: numeric
    objectives: [OBJ-4.6-1]
    prompt: >-
      פרוטון נע במהירות $5\cdot10^{5}\,\text{m/s}$ בניצב לשדה מגנטי אחיד של $0.25\,\text{T}$. מה רדיוס המסלול שלו? ענו בסנטימטרים.
    answer: 2.09
    unit: cm
    tolerance: 0.03
    correctFeedback: 'נכון. $r = \dfrac{mv}{qB} = \dfrac{1.67\cdot10^{-27}\cdot5\cdot10^{5}}{1.6\cdot10^{-19}\cdot0.25} = 0.0209\,\text{m}$.'
    wrongFeedback: 'מ-$qvB = mv^2/r$ מקבלים $r = mv/(qB)$. הציבו את מסת הפרוטון, $1.67\cdot10^{-27}\,\text{kg}$, והמירו מטרים לסנטימטרים.'
    commonWrong:
      - value: 0.13
        feedback: 'כפלתם ב-$B$ במקום לחלק בו: $mvB/q$. בשדה חזק יותר המעגל **קטן** יותר, ולכן $B$ במכנה.'
      - value: 4.18
        feedback: 'זה הקוטר, $2r$. השאלה שואלת על הרדיוס.'
      - value: 0.0209
        feedback: 'זה הרדיוס במטרים. השאלה מבקשת סנטימטרים: כפלו ב-100.'
      - value: 0.00114
        feedback: 'הצבתם את מסת האלקטרון. לפרוטון מסה של $1.67\cdot10^{-27}\,\text{kg}$, גדולה פי 1835.'

  - id: Q-4.6-force-direction
    type: vector
    objectives: [OBJ-4.6-1]
    qualitative: true
    allowOutIn: true
    prompt: >-
      פרוטון נע במעגל בשדה מגנטי אחיד, ⊗ לתוך הדף. ברגע מסוים הוא נמצא בנקודה הנמוכה ביותר של המעגל, ונע ימינה. מה כיוון הכוח המגנטי עליו ברגע הזה?
    answer: n
    correctFeedback: 'נכון. לפי כלל כף יד ימין: האצבעות לתוך הדף, האגודל ימינה, והכוח יוצא מכף היד כלפי מעלה, אל מרכז המעגל, שנמצא מעל הנקודה הנמוכה ביותר.'
    wrong:
      - dir: s
        feedback: 'כלפי מטה זה החוצה מהמרכז. בתנועה מעגלית הכוח השקול מכוון **אל** המרכז, והכוח המגנטי הוא הכוח השקול כאן.'
        misconception: MC-orbit-force-outward
      - dir: in
        feedback: 'זה כיוון השדה. הכוח המגנטי ניצב לשדה, ולכן הוא במישור הדף.'
      - dir: e
        feedback: 'זה כיוון המהירות. הכוח המגנטי ניצב למהירות, ולכן הוא לא משנה את גודלה.'
    wrongFeedback: 'השתמשו בכלל כף יד ימין: האצבעות בכיוון השדה, האגודל בכיוון המהירות של מטען חיובי.'

  - id: Q-4.6-speed-after
    type: twotier
    objectives: [OBJ-4.6-1]
    qualitative: true
    prompt: >-
      אלקטרון נכנס במהירות $v$ בניצב לשדה מגנטי אחיד בריק, ומשלים בו שלושה סיבובים. מה גודל המהירות שלו אחרי שלושת הסיבובים?
    choices:
      - text: 'בדיוק $v$.'
        correct: true
        feedback: נכון.
      - text: 'קטן מ-$v$: האלקטרון מאט, והמסלול שלו מסתחרר פנימה.'
        feedback: 'בריק אין מה שיאט את האלקטרון. הכוח המגנטי לא משנה את גודל המהירות.'
        misconception: MC-magnetic-orbit-spirals
      - text: 'גדול מ-$v$: השדה מאיץ אותו כל הזמן.'
        feedback: 'יש תאוצה, אבל היא ניצבת למהירות: היא משנה את הכיוון ולא את הגודל.'
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'הכוח המגנטי ניצב תמיד למהירות, ולכן הוא לא עושה עבודה, והאנרגיה הקינטית לא משתנה.'
        correct: true
        feedback: 'נכון. $W = 0$, ולכן $\tfrac12 mv^2$ קבוע.'
      - text: 'הכוח המגנטי מכוון נגד המהירות, כמו חיכוך.'
        feedback: 'הכוח המגנטי ניצב למהירות, לא מנוגד לה. כוח שמנוגד למהירות היה עושה עבודה שלילית ומאט.'
        misconception: MC-magnetic-orbit-spirals
      - text: 'השדה המגנטי נותן לאלקטרון אנרגיה בכל סיבוב.'
        feedback: 'כוח שניצב למהירות לא נותן אנרגיה. כדי להאיץ חלקיק בכל סיבוב צריך שדה חשמלי, כמו בציקלוטרון.'

  # ------------------------------------------------ OBJ-4.6-2: T = 2πm/(qB), what changes if
  - id: Q-4.6-period
    type: numeric
    objectives: [OBJ-4.6-2]
    prompt: >-
      אלקטרון נע במעגל בשדה מגנטי אחיד של $2\,\text{mT}$. מה זמן המחזור שלו? ענו בננו-שניות ($1\,\text{ns} = 10^{-9}\,\text{s}$).
    answer: 17.9
    unit: ns
    tolerance: 0.03
    correctFeedback: 'נכון. $T = \dfrac{2\pi m}{qB} = \dfrac{2\pi\cdot9.1\cdot10^{-31}}{1.6\cdot10^{-19}\cdot2\cdot10^{-3}} = 1.79\cdot10^{-8}\,\text{s}$. לא צריך לדעת את המהירות.'
    wrongFeedback: 'זמן המחזור הוא היקף המעגל חלקי המהירות, $2\pi r/v$, וכשמציבים $r = mv/(qB)$ מקבלים $T = 2\pi m/(qB)$.'
    commonWrong:
      - value: 2.84
        feedback: 'שכחתם את $2\pi$: חישבתם $m/(qB)$. סיבוב שלם הוא דרך של $2\pi r$.'
      - value: 8.93
        feedback: 'זה חצי זמן מחזור, $\pi m/(qB)$. סיבוב שלם הוא $2\pi r$, לא $\pi r$.'
      - value: 32800
        feedback: 'הצבתם את מסת הפרוטון. מסת האלקטרון $9.1\cdot10^{-31}\,\text{kg}$.'

  - id: Q-4.6-double-speed
    type: twotier
    objectives: [OBJ-4.6-2]
    qualitative: true
    prompt: >-
      שני פרוטונים זהים יוצאים יחד מאותה נקודה בשדה מגנטי אחיד, בניצב לשדה. מהירות הפרוטון השני כפולה ממהירות הראשון. מה נכון?
    choices:
      - text: 'שניהם חוזרים לנקודת היציאה באותו רגע.'
        correct: true
        feedback: נכון.
      - text: 'השני חוזר ראשון, אחרי חצי מהזמן של הראשון.'
        feedback: 'השני אכן מהיר פי 2, אבל הוא עובר מעגל גדול פי 2.'
        misconception: MC-orbit-period-depends-on-speed
      - text: 'הראשון חוזר ראשון, כי המעגל שלו קטן.'
        feedback: 'המעגל שלו קטן פי 2, אבל גם המהירות שלו קטנה פי 2.'
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'הרדיוס פרופורציוני למהירות, ולכן הדרך והמהירות גדלות באותו יחס, וזמן המחזור $2\pi m/(qB)$ לא תלוי במהירות.'
        correct: true
        feedback: 'נכון. $T = \dfrac{2\pi r}{v}$, ו-$r \propto v$, ולכן $v$ מצטמצם.'
      - text: 'הכוח על המהיר כפול, ולכן הוא מסתובב מהר פי 2.'
        feedback: 'הכוח אכן כפול, אבל הוא צריך לסובב גוף מהיר פי 2 במעגל גדול פי 2. התוצאה: אותו זמן מחזור.'
        misconception: MC-orbit-period-depends-on-speed
      - text: 'המהירות לא משפיעה על שום דבר בשדה מגנטי, גם לא על הרדיוס.'
        feedback: 'המהירות משפיעה על הרדיוס, $r = mv/(qB)$: המעגל של המהיר גדול פי 2. היא לא משפיעה רק על זמן המחזור.'

  - id: Q-4.6-rank-period
    type: rank
    objectives: [OBJ-4.6-2]
    qualitative: true
    prompt: >-
      ארבעה חלקיקים נעים במעגלים באותו שדה מגנטי אחיד, בניצב לשדה. דרגו אותם לפי זמן המחזור, מהארוך לקצר. חלקיק אלפא: מטען $2e$, מסה $4m_p$ בקירוב.
    items:
      - { id: alpha, label: 'חלקיק אלפא' }
      - { id: proton, label: 'פרוטון' }
      - { id: proton-fast, label: 'פרוטון במהירות כפולה' }
      - { id: electron, label: 'אלקטרון' }
    order: [alpha, [proton, proton-fast], electron]
    correctFeedback: 'נכון. $T = 2\pi m/(qB)$ תלוי רק ביחס $m/q$: לחלקיק האלפא $2m_p/e$, לשני הפרוטונים $m_p/e$, ולאלקטרון $m_e/e$, קטן פי 1835. המהירות לא משנה.'
    wrongFeedback: 'השוו את היחס $m/q$ של כל חלקיק: הוא לבדו קובע את זמן המחזור באותו שדה. ושני הפרוטונים? המהירות לא משנה את $T$.'

  - id: Q-4.6-what-changes
    type: mc
    objectives: [OBJ-4.6-2]
    level: mid
    prompt: >-
      חלקיק טעון נע במעגל ברדיוס $r$ ובזמן מחזור $T$ בשדה מגנטי אחיד. מכפילים את השדה, והמהירות לא משתנה. מה יהיו הרדיוס וזמן המחזור?
    choices:
      - text: 'רדיוס $r/2$, זמן מחזור $T/2$.'
        correct: true
        feedback: 'נכון. $B$ במכנה של $r = mv/(qB)$ ושל $T = 2\pi m/(qB)$.'
      - text: 'רדיוס $r/2$, זמן מחזור $T$.'
        feedback: 'הרדיוס נכון, אבל זמן המחזור תלוי בשדה: $T = 2\pi m/(qB)$. הוא לא תלוי רק במהירות.'
      - text: 'רדיוס $2r$, זמן מחזור $2T$.'
        feedback: 'שדה חזק יותר מפעיל כוח גדול יותר, ומכופף את המסלול יותר: המעגל קטן, לא גדל.'
      - text: 'רדיוס $r/4$, זמן מחזור $T/4$.'
        feedback: 'גם $r$ וגם $T$ הפוכים ל-$B$ בחזקה הראשונה, לא בריבוע.'

  # ------------------------------------------------ OBJ-4.6-3: sense of rotation, bounded region
  - id: Q-4.6-sense
    type: mc
    objectives: [OBJ-4.6-3]
    qualitative: true
    prompt: >-
      בשדה מגנטי אחיד, ⊙ החוצה מהדף, פרוטון מסתובב עם כיוון השעון. מכניסים לאותו שדה אלקטרון. לאיזה כיוון הוא מסתובב?
    choices:
      - text: 'נגד כיוון השעון.'
        correct: true
        feedback: 'נכון. על מטען שלילי הכוח הפוך לכוח על מטען חיובי שנע באותה מהירות, ולכן גם כיוון הסיבוב הפוך.'
      - text: 'עם כיוון השעון, כמו הפרוטון.'
        feedback: 'השדה לבדו לא קובע את הכיוון. גם סימן המטען משנה: לפי כלל כף יד ימין הכוח על אלקטרון הפוך.'
        misconception: MC-electron-proton-same-sense
      - text: 'תלוי במהירות שלו.'
        feedback: 'המהירות משנה את הרדיוס, לא את כיוון הסיבוב. את הכיוון קובעים סימן המטען וכיוון השדה.'
      - text: 'הוא לא מסתובב, כי הוא קל מדי.'
        feedback: 'גם אלקטרון מרגיש כוח מגנטי, $qvB$. המסה הקטנה רק מקטינה את הרדיוס, $mv/(qB)$.'

  - id: Q-4.6-edge-side
    type: vector
    objectives: [OBJ-4.6-3]
    qualitative: true
    allowOutIn: true
    prompt: >-
      שדה מגנטי אחיד, ⊗ לתוך הדף, נמצא רק מימין לגבול אנכי. אלקטרון נע ימינה ונכנס לשדה בניצב לגבול. מה כיוון הכוח המגנטי עליו ברגע הכניסה? (הכיוון הזה קובע לאיזה צד הוא יתכופף.)
    answer: s
    correctFeedback: 'נכון. לפרוטון: האצבעות לתוך הדף, האגודל ימינה, והכוח כלפי מעלה. על אלקטרון הכוח הפוך: כלפי מטה. הוא יעשה חצי מעגל ויצא מתחת לנקודת הכניסה.'
    wrong:
      - dir: n
        feedback: 'זה הכוח על מטען **חיובי**. על אלקטרון, שהמטען שלו שלילי, הכוח בכיוון ההפוך.'
        misconception: MC-electron-proton-same-sense
      - dir: in
        feedback: 'זה כיוון השדה. הכוח המגנטי ניצב גם לשדה וגם למהירות, ולכן הוא במישור הדף.'
      - dir: w
        feedback: 'כוח נגד המהירות היה מאט את האלקטרון. הכוח המגנטי ניצב למהירות.'
    wrongFeedback: 'השתמשו בכלל כף יד ימין לפרוטון, והפכו את הכיוון למטען שלילי.'

  - id: Q-4.6-edge-exit
    type: numeric
    objectives: [OBJ-4.6-3, OBJ-4.6-1]
    level: mid
    prompt: >-
      פרוטון נכנס במהירות $3\cdot10^{5}\,\text{m/s}$, בניצב לגבול, לאזור שבו יש שדה מגנטי אחיד של $0.12\,\text{T}$ (השדה ניצב לדף). באיזה מרחק מנקודת הכניסה הוא יוצא מהשדה? ענו בסנטימטרים.
    answer: 5.22
    unit: cm
    tolerance: 0.03
    correctFeedback: 'נכון. הפרוטון עושה חצי מעגל, ולכן יוצא קוטר אחד מנקודת הכניסה: $d = 2r = \dfrac{2mv}{qB} = \dfrac{2\cdot1.67\cdot10^{-27}\cdot3\cdot10^{5}}{1.6\cdot10^{-19}\cdot0.12} = 0.0522\,\text{m}$.'
    wrongFeedback: 'בכניסה בניצב לגבול המסלול בשדה הוא חצי מעגל. המרחק בין הכניסה ליציאה הוא הקוטר.'
    commonWrong:
      - value: 2.61
        feedback: 'זה הרדיוס. הפרוטון יוצא בצד השני של חצי המעגל, במרחק של קוטר, $2r$.'
      - value: 8.2
        feedback: 'זה חצי היקף המעגל, $\pi r$: הדרך שהפרוטון עובר בשדה. השאלה שואלת על המרחק בקו ישר בין שתי הנקודות.'

  - id: Q-4.6-identify-sign
    type: twotier
    objectives: [OBJ-4.6-3]
    qualitative: true
    prompt: >-
      שני חלקיקים נעים ימינה ונכנסים יחד לאזור שבו יש שדה מגנטי אחיד, ⊙ החוצה מהדף. חלקיק א מתכופף כלפי מעלה, וחלקיק ב כלפי מטה. מה אפשר לקבוע?
    choices:
      - text: 'חלקיק א שלילי וחלקיק ב חיובי.'
        correct: true
        feedback: נכון.
      - text: 'חלקיק א חיובי וחלקיק ב שלילי.'
        feedback: 'בדקו בכלל כף יד ימין: עם האצבעות החוצה מהדף והאגודל ימינה, הכוח על מטען חיובי מכוון כלפי מטה.'
      - text: 'אי אפשר לקבוע, כי הצד תלוי במסה.'
        feedback: 'המסה משנה את הרדיוס, לא את הצד. הצד נקבע לפי כיוון הכוח ברגע הכניסה, ולכן לפי סימן המטען.'
        misconception: MC-electron-proton-same-sense
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'לפי כלל כף יד ימין, על מטען חיובי שנע ימינה בשדה ⊙ הכוח כלפי מטה, ועל מטען שלילי הכוח הפוך.'
        correct: true
        feedback: 'נכון. כך מזהים בתאי בועות חלקיקים חיוביים ושליליים לפי כיוון העיקול.'
      - text: 'מטען חיובי נמשך אל הקוטב הצפוני של השדה, ומטען שלילי אל הדרומי.'
        feedback: 'שדה מגנטי לא מושך מטענים כמו שדה חשמלי. הכוח המגנטי פועל רק על מטען נע, וניצב גם לשדה וגם למהירות.'
      - text: 'החלקיק הכבד מתכופף כלפי מטה, כמו בכבידה.'
        feedback: 'הכבידה זניחה כאן לגמרי, והמסה לא קובעת את הצד. הצד נקבע לפי סימן המטען.'

  # ------------------------------------------------ OBJ-4.6-4: mass spectrometer
  - id: Q-4.6-heavier
    type: twotier
    objectives: [OBJ-4.6-4]
    qualitative: true
    prompt: >-
      בספקטרומטר מסות מאיצים ממנוחה, באותו מתח, יונים חד-מטעניים של שני איזוטופים של כלור, ³⁵Cl ו-³⁷Cl, ושולחים אותם דרך אותו סדק לאותו שדה מגנטי. איזה מהם נוחת רחוק יותר מהסדק?
    choices:
      - text: '³⁷Cl⁺, הכבד.'
        correct: true
        feedback: נכון.
      - text: '³⁵Cl⁺, הקל.'
        feedback: 'הקל אכן מהיר יותר, אבל קל יותר לסובב אותו, והמעגל שלו קטן יותר.'
        misconception: MC-spectrometer-heavier-closer
      - text: 'שניהם נוחתים באותה נקודה, כי יש להם אותו מטען.'
        feedback: 'אותו מטען אומר שהם מקבלים אותה אנרגיה, אבל הרדיוס תלוי גם במסה.'
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'לשניהם אותה אנרגיה קינטית $qU$, והרדיוס $r = \frac{1}{B}\sqrt{2mU/q}$ גדל עם המסה.'
        correct: true
        feedback: 'נכון. הכבד איטי פי $\sqrt{37/35}$, אבל $r = mv/(qB)$, והמסה גדלה יותר מכפי שהמהירות קטנה.'
      - text: 'היון הכבד מתכופף יותר, כמו שגוף כבד נופל מהר יותר.'
        feedback: 'שני התיאורים שגויים: גוף כבד לא נופל מהר יותר (בלי התנגדות אוויר), ויון כבד מתכופף **פחות**: באותה אנרגיה, מסה גדולה פירושה רדיוס גדול.'
        misconception: MC-spectrometer-heavier-closer
      - text: 'היון הכבד מהיר יותר, ולכן מגיע רחוק יותר.'
        feedback: 'באותה אנרגיה $\tfrac12 mv^2 = qU$, היון הכבד דווקא איטי יותר.'

  - id: Q-4.6-spec-radius
    type: numeric
    objectives: [OBJ-4.6-4]
    level: mid
    prompt: >-
      יוני אשלגן חד-מטעניים, ³⁹K⁺ (מסה $39m_p$ בקירוב), מואצים ממנוחה במתח של $1500\,\text{V}$, ונכנסים בניצב לשדה מגנטי אחיד של $0.3\,\text{T}$. מה רדיוס המסלול שלהם? ענו בסנטימטרים.
    answer: 11.6
    unit: cm
    tolerance: 0.03
    correctFeedback: 'נכון. $v = \sqrt{2qU/m} = 8.58\cdot10^{4}\,\text{m/s}$, ו-$r = \dfrac{mv}{qB} = \dfrac{1}{B}\sqrt{\dfrac{2mU}{q}} = 0.116\,\text{m}$.'
    wrongFeedback: 'שני שלבים: מהמתח, $\tfrac12 mv^2 = qU$; ואחר כך $r = mv/(qB)$. יחד: $r = \frac{1}{B}\sqrt{2mU/q}$, עם $m = 39\cdot1.67\cdot10^{-27}\,\text{kg}$.'
    commonWrong:
      - value: 23.3
        feedback: 'זה המרחק מהסדק לנקודת הנחיתה, $2r$. השאלה שואלת על הרדיוס.'
      - value: 8.24
        feedback: 'שכחתם את ה-2 באנרגיה: $\tfrac12 mv^2 = qU$ נותן $v = \sqrt{2qU/m}$, לא $\sqrt{qU/m}$.'
      - value: 0.41
        feedback: 'שכחתם להוציא שורש: $\frac{1}{B}\cdot\frac{2mU}{q}$. הרדיוס הוא $\frac{1}{B}\sqrt{2mU/q}$.'

  - id: Q-4.6-spec-voltage
    type: mc
    objectives: [OBJ-4.6-4]
    qualitative: true
    level: mid
    prompt: >-
      בספקטרומטר מסות, יון נוחת במרחק $x$ מהסדק. מגדילים את המתח המאיץ פי 4, והשדה לא משתנה. איפה ינחת אותו יון?
    choices:
      - text: 'במרחק $2x$.'
        correct: true
        feedback: 'נכון. $x = 2r = \dfrac{2}{B}\sqrt{\dfrac{2mU}{q}}$: מתח גדול פי 4 נותן מהירות גדולה פי 2, ולכן רדיוס גדול פי 2.'
      - text: 'במרחק $4x$.'
        feedback: 'המתח קובע את האנרגיה, $\tfrac12 mv^2 = qU$. אנרגיה גדולה פי 4 היא מהירות גדולה פי 2 בלבד, והרדיוס גדל כמו המהירות.'
      - text: 'במרחק $x/2$.'
        feedback: 'מתח גדול יותר נותן מהירות גדולה יותר, וחלקיק מהיר יותר נע במעגל **גדול** יותר.'
      - text: 'באותו מרחק $x$, כי המתח לא משפיע על השדה המגנטי.'
        feedback: 'נכון שהשדה לא משתנה, אבל היון נכנס אליו מהר יותר, והרדיוס $mv/(qB)$ גדל.'

  - id: Q-4.6-spec-separation
    type: numeric
    objectives: [OBJ-4.6-4]
    level: bagrut
    prompt: >-
      בספקטרומטר מסות מאיצים ממנוחה יוני ³⁵Cl⁺ ו-³⁷Cl⁺ במתח של $2000\,\text{V}$, והם נכנסים בניצב לשדה מגנטי אחיד של $0.2\,\text{T}$. הניחו שמסת יון היא $A\cdot m_p$. מה המרחק בין שתי נקודות הנחיתה על הגלאי? ענו בסנטימטרים.
    answer: 1.08
    unit: cm
    tolerance: 0.03
    correctFeedback: 'נכון. $x = \dfrac{2}{B}\sqrt{\dfrac{2mU}{q}}$ נותן $38.23\,\text{cm}$ ל-³⁵Cl⁺ ו-$39.30\,\text{cm}$ ל-³⁷Cl⁺. ההפרש $1.08\,\text{cm}$.'
    wrongFeedback: 'חשבו לכל יון את נקודת הנחיתה, $x = 2r$ עם $r = \frac{1}{B}\sqrt{2mU/q}$, והחסירו.'
    commonWrong:
      - value: 0.539
        feedback: 'זה ההפרש בין הרדיוסים. נקודת הנחיתה רחוקה מהסדק קוטר אחד, ולכן המרחק בין הנקודות הוא פי 2.'
