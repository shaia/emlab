# Lesson 4.7 question bank. Strings may hold $inline$ / $$display$$ TeX and **bold**; they are
# rendered at build time. YAML note: plain and single-quoted strings keep backslashes literally.
# Every number below was recomputed with src/physics (selectorSpeed, orbitRadius in magnetism.ts;
# bainbridgeRadius, electricForceY, magneticForceY in crossed-fields.ts); script q.ts in the session
# scratchpad. The data differ on purpose from figure 4.7א and the worked examples.

chapter: 4
questions:
  # ------------------------------------------------ OBJ-4.7-1: directions of the two forces
  - id: Q-4.7-plate-sign
    type: mc
    objectives: [OBJ-4.7-1]
    qualitative: true
    prompt: >-
      פרוטון נע ימינה בין שני לוחות אופקיים, ובכל האזור שבין הלוחות יש שדה מגנטי ⊗, לתוך הדף. איזה לוח צריך להיות חיובי כדי שהפרוטון יוכל לעבור ישר?
    choices:
      - text: 'הלוח העליון: השדה החשמלי מצביע למטה, והכוח החשמלי על הפרוטון למטה.'
        correct: true
        feedback: 'נכון. לפי כלל כף יד ימין (האצבעות לתוך הדף, האגודל ימינה), הכוח המגנטי על הפרוטון כלפי מעלה. כדי לאזן אותו, הכוח החשמלי צריך להיות כלפי מטה, ולכן השדה מצביע מהלוח העליון החיובי אל התחתון.'
      - text: 'הלוח התחתון: השדה החשמלי מצביע למעלה.'
        feedback: 'אז גם הכוח החשמלי על הפרוטון כלפי מעלה, באותו כיוון של הכוח המגנטי. שני הכוחות מתחברים, ושום מהירות לא עוברת ישר. בדקו את כיוון הכוח המגנטי בכלל כף יד ימין.'
      - text: 'לא משנה, כי השדה המגנטי והשדה החשמלי ניצבים זה לזה.'
        feedback: 'השדות ניצבים, אבל הכוחות שהם מפעילים על הפרוטון נמצאים על אותו קו, אנכי. כדי שיתקזזו, הם צריכים להיות מנוגדים, וזה קובע איזה לוח חיובי.'
      - text: 'שני הלוחות צריכים להיות חיוביים, כדי שהפרוטון יידחה מהם באותה מידה.'
        feedback: 'בין שני לוחות עם אותו מטען כמעט אין שדה, ולכן אין כוח חשמלי שיאזן את הכוח המגנטי. צריך לוחות עם מטענים מנוגדים.'

  - id: Q-4.7-force-dir
    type: vector
    objectives: [OBJ-4.7-1]
    allowOutIn: true
    prompt: >-
      בבורר מהירויות כיבו את השדה החשמלי, ונשאר רק שדה מגנטי ⊗, לתוך הדף. פרוטון נכנס לאזור כשהוא נע ימינה. מה הכיוון של הכוח המגנטי עליו ברגע הכניסה?
    answer: n
    correctFeedback: 'נכון. כלל כף יד ימין: האצבעות לתוך הדף (בכיוון השדה), האגודל ימינה (בכיוון המהירות), והכוח יוצא מכף היד, כלפי מעלה.'
    wrong:
      - dir: s
        feedback: 'זה הכיוון של הכוח על מטען **שלילי**. לפרוטון, מטען חיובי, הכוח יוצא מכף יד ימין: האצבעות לתוך הדף, האגודל ימינה, וכף היד פונה למעלה.'
      - dir: in
        feedback: 'הכוח המגנטי ניצב לשדה, לא לאורכו. הוא ניצב גם למהירות, ולכן נמצא במישור הדף, למעלה או למטה.'
      - dir: e
        feedback: 'הכוח המגנטי ניצב למהירות, ולכן הוא לא יכול להיות לאורכה. הוא משנה את כיוון התנועה, לא דוחף קדימה.'
    wrongFeedback: 'הפעילו את כלל כף יד ימין: האצבעות בכיוון השדה, האגודל בכיוון המהירות של מטען חיובי, והכוח יוצא מכף היד.'

  - id: Q-4.7-E-direction
    type: vector
    objectives: [OBJ-4.7-1]
    allowOutIn: true
    level: mid
    prompt: >-
      בבורר אחר השדה המגנטי ⊙, **החוצה** מהדף. יון חיובי נכנס כשהוא נע ימינה. לאיזה כיוון צריך להצביע השדה החשמלי כדי שהיון יעבור ישר (במהירות המתאימה)?
    answer: n
    correctFeedback: 'נכון. כלל כף יד ימין: האצבעות החוצה מהדף, האגודל ימינה, וכף היד פונה למטה. הכוח המגנטי כלפי מטה, ולכן הכוח החשמלי, ואיתו השדה החשמלי (היון חיובי), צריך להצביע כלפי מעלה.'
    wrong:
      - dir: s
        feedback: 'למטה מצביע הכוח **המגנטי**. אם גם השדה החשמלי יצביע למטה, שני הכוחות על היון החיובי יהיו באותו כיוון, ושום מהירות לא תעבור.'
      - dir: out
        feedback: 'שדה חשמלי לאורך השדה המגנטי נותן כוח החוצה מהדף, שלא יכול לאזן כוח שנמצא במישור הדף. השדה החשמלי בבורר ניצב גם לשדה המגנטי וגם למהירות.'
      - dir: w
        feedback: 'שדה חשמלי שמאלה היה מאט את היון, אבל לא מאזן את הכוח המגנטי, שהוא אנכי. מצאו קודם את כיוון הכוח המגנטי.'
    wrongFeedback: 'מצאו קודם את כיוון הכוח המגנטי בכלל כף יד ימין. השדה החשמלי צריך לתת ליון כוח בכיוון ההפוך.'

  - id: Q-4.7-electron-fields
    type: twotier
    objectives: [OBJ-4.7-1, OBJ-4.7-2]
    qualitative: true
    prompt: >-
      בורר מהירויות מכוון כך שפרוטונים במהירות $3\cdot10^{5}\,\text{m/s}$ עוברים בו ישר. עכשיו שולחים לתוכו אלקטרונים באותה מהירות, בלי לשנות דבר. מה יקרה?
    choices:
      - text: 'האלקטרונים יעברו ישר, כמו הפרוטונים.'
        correct: true
        feedback: נכון.
      - text: 'האלקטרונים יתכופפו, וכדי שיעברו צריך להפוך את כיוון השדה החשמלי.'
        feedback: 'אם תהפכו רק את השדה החשמלי, הכוח החשמלי על האלקטרון יהיה באותו כיוון של הכוח המגנטי, ושום מהירות לא תעבור.'
        misconception: MC-selector-sign-matters
      - text: 'האלקטרונים יתכופפו, כי המסה שלהם קטנה פי 1800 בערך.'
        feedback: 'המסה לא מופיעה בתנאי האיזון. כשהכוחות שווים ומנוגדים, הכוח השקול אפס, ואין תאוצה, בלי קשר למסה.'
        misconception: MC-selector-depends-on-mass
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'כשהמטען שלילי, גם הכוח החשמלי וגם הכוח המגנטי מתהפכים, ולכן הם נשארים שווים ומנוגדים.'
        correct: true
        feedback: 'נכון. שני הכוחות יחסיים ל-$q$: $qE$ ו-$qvB$. סימן המטען הופך את שניהם יחד, והתנאי $v = E/B$ לא משתנה.'
      - text: 'השדה המגנטי לא פועל על אלקטרונים, רק על פרוטונים.'
        feedback: 'השדה המגנטי מפעיל כוח על כל מטען שנע בניצב לו, גם על אלקטרון. הכוח עליו פשוט בכיוון ההפוך.'
      - text: 'לאלקטרון ולפרוטון מטען שונה בגודלו, ולכן הכוחות עליהם שונים.'
        feedback: 'הגודל של המטען שלהם זהה, $e$. רק הסימן שונה, והוא הופך את שני הכוחות יחד.'
        misconception: MC-selector-sign-matters

  # ------------------------------------------------ OBJ-4.7-2: v = E/B
  - id: Q-4.7-speed
    type: numeric
    objectives: [OBJ-4.7-2]
    prompt: >-
      בבורר מהירויות המתח בין הלוחות $450\,\text{V}$, המרחק ביניהם $1.5\,\text{cm}$, והשדה המגנטי $0.05\,\text{T}$. באיזו מהירות עוברים בו חלקיקים ישר? ענו במטר לשנייה.
    answer: 600000
    unit: m/s
    tolerance: 0.03
    correctFeedback: 'נכון. $E = \dfrac{V}{d} = \dfrac{450}{0.015} = 3\cdot10^{4}\,\text{V/m}$, ו-$v = \dfrac{E}{B} = \dfrac{3\cdot10^{4}}{0.05} = 6\cdot10^{5}\,\text{m/s}$.'
    wrongFeedback: 'מצאו קודם את השדה בין הלוחות, $E = V/d$ (במטרים), ואז $v = E/B$.'
    commonWrong:
      - value: 6000
        feedback: 'הצבתם את המרחק בסנטימטרים ($1.5$ במקום $0.015\,\text{m}$), ולכן השדה יצא קטן פי 100.'
      - value: 9000
        feedback: 'חילקתם את המתח ב-$B$. במשוואה מופיע השדה החשמלי, $E = V/d$, לא המתח.'
      - value: 1.67e-6
        feedback: 'הפכתם את היחס. מ-$qE = qvB$ מקבלים $v = E/B$, לא $B/E$.'

  - id: Q-4.7-alpha-same
    type: mc
    objectives: [OBJ-4.7-2]
    qualitative: true
    prompt: >-
      פרוטונים במהירות $v_0$ עוברים ישר בבורר מהירויות. לחלקיק אלפא מטען כפול ומסה גדולה פי 4 בערך. באיזו מהירות יעברו חלקיקי אלפא ישר באותו בורר?
    choices:
      - text: 'באותה מהירות, $v_0$.'
        correct: true
        feedback: 'נכון. בתנאי $qE = qvB$ המטען מצטמצם, והמסה לא מופיעה בכלל: $v = E/B$. המהירות נקבעת רק בשדות.'
      - text: 'בחצי מהמהירות, $v_0/2$, כי המטען שלו כפול.'
        feedback: 'המטען הכפול מכפיל את **שני** הכוחות, החשמלי והמגנטי. הם נשארים מאוזנים באותה מהירות.'
        misconception: MC-selector-depends-on-mass
      - text: 'במהירות $2v_0$, כי היחס בין המטען למסה שלו קטן פי 2.'
        feedback: 'היחס $q/m$ קובע כמה חזק מתכופף חלקיק שמהירותו **שונה** מ-$E/B$, לא איזו מהירות עוברת. כשהכוחות מאוזנים, אין תאוצה, בלי קשר למסה.'
        misconception: MC-selector-depends-on-mass
      - text: 'אף מהירות, כי חלקיק כבד מדי לא מושפע מהשדה המגנטי.'
        feedback: 'השדה המגנטי מפעיל על חלקיק האלפא כוח $qvB$, כפול מאשר על פרוטון באותה מהירות. גם הכוח החשמלי כפול, ולכן הם מתאזנים.'

  - id: Q-4.7-find-B
    type: numeric
    objectives: [OBJ-4.7-2]
    prompt: >-
      רוצים שבבורר מהירויות יעברו ישר רק חלקיקים במהירות $2\cdot10^{6}\,\text{m/s}$. השדה החשמלי בין הלוחות $8\cdot10^{4}\,\text{V/m}$. מה צריך להיות השדה המגנטי? ענו בטסלה.
    answer: 0.04
    unit: T
    tolerance: 0.03
    correctFeedback: 'נכון. מ-$v = E/B$ מבודדים את $B$: $B = \dfrac{E}{v} = \dfrac{8\cdot10^{4}}{2\cdot10^{6}} = 0.04\,\text{T}$.'
    wrongFeedback: 'כפלו את $v = E/B$ ב-$B$ וחלקו ב-$v$: $B = E/v$.'
    commonWrong:
      - value: 25
        feedback: 'חילקתם את המהירות בשדה החשמלי. הפכו: $B = E/v$.'
      - value: 1.6e11
        feedback: 'כפלתם את השדה החשמלי במהירות. מ-$qE = qvB$ מקבלים $B = E/v$.'

  - id: Q-4.7-voltage-needed
    type: numeric
    objectives: [OBJ-4.7-2]
    level: mid
    prompt: >-
      בבורר מהירויות השדה המגנטי $0.2\,\text{T}$ והמרחק בין הלוחות $2\,\text{cm}$. איזה מתח צריך לחבר ללוחות כדי שיעברו ישר חלקיקים במהירות $4\cdot10^{5}\,\text{m/s}$? ענו בוולט.
    answer: 1600
    unit: V
    tolerance: 0.03
    correctFeedback: 'נכון. השדה הדרוש $E = vB = 4\cdot10^{5}\cdot0.2 = 8\cdot10^{4}\,\text{V/m}$, והמתח $V = Ed = 8\cdot10^{4}\cdot0.02 = 1600\,\text{V}$.'
    wrongFeedback: 'מתנאי הבחירה מוצאים את השדה, $E = vB$, ואז את המתח בין הלוחות, $V = Ed$.'
    commonWrong:
      - value: 80000
        feedback: 'זה השדה החשמלי, $E = vB$, בוולט למטר. המתח הוא $V = Ed$: כפלו במרחק.'
      - value: 160000
        feedback: 'הצבתם את המרחק בסנטימטרים. $d = 2\,\text{cm} = 0.02\,\text{m}$.'
      - value: 40000
        feedback: 'חילקתם ב-$B$ במקום לכפול. מ-$v = E/B$ מקבלים $E = vB$.'

  # ------------------------------------------------ OBJ-4.7-3: too fast, too slow, what changes
  - id: Q-4.7-faster-side
    type: twotier
    objectives: [OBJ-4.7-3]
    qualitative: true
    prompt: >-
      בבורר מהירויות הלוח העליון חיובי, והשדה המגנטי ⊗. פרוטונים במהירות $v_0 = E/B$ עוברים ישר. פרוטון נכנס במהירות **גדולה** מ-$v_0$. לאן הוא מתכופף?
    choices:
      - text: 'כלפי מעלה, לצד של הכוח המגנטי.'
        correct: true
        feedback: נכון.
      - text: 'כלפי מטה, לצד של הכוח החשמלי.'
        feedback: 'הכוח החשמלי על הפרוטון כלפי מטה, אבל הוא לא גדל עם המהירות. בפרוטון מהיר, הכוח המגנטי כלפי מעלה גדול ממנו.'
        misconception: MC-selector-fast-to-electric
      - text: 'הוא עובר ישר, כי הוא מהיר מכדי להספיק להתכופף.'
        feedback: 'חלקיק מהיר אכן נמצא פחות זמן בין הלוחות, אבל הכוח השקול עליו אינו אפס, והוא מתכופף. רק $v_0$ עוברת ישר.'
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'הכוח המגנטי, $qvB$, גדל עם המהירות, והכוח החשמלי, $qE$, לא תלוי בה.'
        correct: true
        feedback: 'נכון. מעל $v_0$, $qvB > qE$, והכוח השקול בכיוון הכוח המגנטי.'
      - text: 'לחלקיק מהיר יש יותר אנרגיה, ולכן השדה החשמלי מושך אותו חזק יותר.'
        feedback: 'הכוח החשמלי, $qE$, תלוי רק במטען ובשדה, לא במהירות ולא באנרגיה של החלקיק.'
        misconception: MC-selector-fast-to-electric
      - text: 'הכוח המגנטי קטן כשהמהירות גדלה, כי החלקיק עובר מהר יותר.'
        feedback: 'להפך: הכוח המגנטי יחסי למהירות, $F = qvB$. מה שקטן במהירות גבוהה הוא רק הזמן בין הלוחות.'

  - id: Q-4.7-rank-height
    type: rank
    objectives: [OBJ-4.7-3]
    qualitative: true
    prompt: >-
      שלושה פרוטונים נכנסים לבורר מהירויות (הלוח העליון חיובי, השדה המגנטי ⊗) שבו $E/B = 5\cdot10^{5}\,\text{m/s}$. סדרו אותם לפי הגובה שלהם ביציאה מהלוחות, מהגבוה לנמוך.
    items:
      - { id: fast, label: 'פרוטון במהירות $6\cdot10^{5}\,\text{m/s}$' }
      - { id: exact, label: 'פרוטון במהירות $5\cdot10^{5}\,\text{m/s}$' }
      - { id: slow, label: 'פרוטון במהירות $4\cdot10^{5}\,\text{m/s}$' }
    order: [fast, exact, slow]
    correctFeedback: 'נכון. הכוח המגנטי על פרוטון כלפי מעלה, והכוח החשמלי כלפי מטה. המהיר מתכופף למעלה, כי $qvB > qE$; המדויק עובר ישר; האיטי מתכופף למטה.'
    wrongFeedback: 'מצאו קודם את כיווני הכוחות: החשמלי מהלוח החיובי אל השלילי, והמגנטי לפי כלל כף יד ימין. אחר כך: איזה כוח גדל עם המהירות?'

  - id: Q-4.7-double-V
    type: mc
    objectives: [OBJ-4.7-3, OBJ-4.7-2]
    qualitative: true
    level: mid
    prompt: >-
      בבורר מהירויות עוברים ישר יונים במהירות $v_0$. מכפילים את המתח בין הלוחות, ולא משנים שום דבר אחר. מה קורה ליונים שממשיכים להיכנס במהירות $v_0$?
    choices:
      - text: 'הם מתכופפים לצד של הכוח החשמלי. עכשיו עוברים ישר יונים במהירות $2v_0$.'
        correct: true
        feedback: 'נכון. המתח הכפול מכפיל את השדה, $E = V/d$, ואיתו את הכוח החשמלי. הכוח המגנטי על יון במהירות $v_0$ לא השתנה, ולכן הכוח החשמלי גובר. המהירות הנבחרת, $E/B$, הוכפלה.'
      - text: 'הם מתכופפים לצד של הכוח המגנטי. עכשיו עוברים ישר יונים במהירות $v_0/2$.'
        feedback: 'הגדלנו את הכוח **החשמלי**, לא את המגנטי, ולכן היונים נדחפים לצד החשמלי. והמהירות הנבחרת, $E/B$, גדלה עם $E$.'
        misconception: MC-selector-fast-to-electric
      - text: 'הם ממשיכים לעבור ישר, כי השדה המגנטי מתאים את עצמו.'
        feedback: 'השדה המגנטי נקבע במגנט (או בסליל), לא ביונים. הוא לא משתנה כשמשנים את המתח בין הלוחות.'
      - text: 'הם עוברים ישר ומהר יותר, כי השדה החשמלי החזק מאיץ אותם.'
        feedback: 'השדה החשמלי בבורר ניצב לתנועה, ולכן הוא לא מאיץ קדימה. בשדה כפול הכוחות כבר לא מאוזנים, והיונים מתכופפים.'
        misconception: MC-selector-changes-speed

  - id: Q-4.7-speed-after
    type: mc
    objectives: [OBJ-4.7-3]
    qualitative: true
    prompt: >-
      פרוטון נכנס לבורר מהירויות במהירות $E/B$ ויוצא בסדק. איך משתווה מהירות היציאה שלו למהירות הכניסה?
    choices:
      - text: 'היא שווה למהירות הכניסה.'
        correct: true
        feedback: 'נכון. הכוח השקול עליו אפס, ולכן מהירותו קבועה. וגם בנפרד: הכוח המגנטי לא עושה עבודה, והכוח החשמלי ניצב לתנועה הישרה.'
      - text: 'גדולה יותר, כי השדה החשמלי עושה עליו עבודה.'
        feedback: 'שדה חשמלי עושה עבודה רק כשהמטען זז לאורכו. הפרוטון הנבחר נע בניצב לשדה, ולכן העבודה אפס.'
        misconception: MC-selector-changes-speed
      - text: 'קטנה יותר, כי שני השדות בולמים אותו.'
        feedback: 'שני הכוחות אנכיים, ניצבים לתנועה, ומאוזנים. שום כוח לא פועל נגד התנועה, ולכן אין מה שיבלום.'
        misconception: MC-selector-changes-speed
      - text: 'תלוי במסה שלו: חלקיק קל יוצא מהיר יותר.'
        feedback: 'כשהכוח השקול אפס, אף חלקיק לא מאיץ, קל או כבד.'
        misconception: MC-selector-depends-on-mass

  # ------------------------------------------------ OBJ-4.7-4: Bainbridge spectrometer
  - id: Q-4.7-bainbridge-radius
    type: numeric
    objectives: [OBJ-4.7-4]
    level: mid
    prompt: >-
      בספקטרומטר של ביינברידג׳ השדה החשמלי בבורר $6\cdot10^{4}\,\text{V/m}$, השדה המגנטי בבורר $0.12\,\text{T}$, והשדה השני $B' = 0.25\,\text{T}$. פרוטון עובר בבורר ועושה חצי מעגל בשדה השני. באיזה מרחק מהסדק הוא פוגע בגלאי? ענו בסנטימטרים.
    answer: 4.175
    unit: cm
    tolerance: 0.03
    correctFeedback: 'נכון. $v = E/B = 5\cdot10^{5}\,\text{m/s}$, $r = \dfrac{mv}{qB''} = \dfrac{1.67\cdot10^{-27}\cdot5\cdot10^{5}}{1.6\cdot10^{-19}\cdot0.25} \approx 2.09\,\text{cm}$, והמרחק מהסדק הוא הקוטר, $2r \approx 4.18\,\text{cm}$.'
    wrongFeedback: 'מצאו את המהירות מהבורר, $v = E/B$, ואז את הרדיוס בשדה השני, $r = mv/(qB'')$. החלקיק עושה חצי מעגל, ולכן פוגע במרחק $2r$ מהסדק.'
    commonWrong:
      - value: 2.0875
        feedback: 'זה הרדיוס. אחרי חצי מעגל החלקיק נמצא בקצה השני של הקוטר, במרחק $2r$ מהסדק.'
      - value: 8.698
        feedback: 'הצבתם ברדיוס את השדה של הבורר, $0.12\,\text{T}$. בחצי המעגל פועל רק השדה השני, $B'' = 0.25\,\text{T}$.'

  - id: Q-4.7-d-alpha
    type: mc
    objectives: [OBJ-4.7-4]
    qualitative: true
    prompt: >-
      לספקטרומטר של ביינברידג׳ נכנסת תערובת של דאוטרונים (מטען $e$, מסה $2m_p$ בערך) ושל חלקיקי אלפא (מטען $2e$, מסה $4m_p$ בערך). מה רואים על הגלאי?
    choices:
      - text: 'כתם אחד: שני סוגי החלקיקים פוגעים באותו מקום.'
        correct: true
        feedback: 'נכון. לשניהם אותה מהירות (מהבורר), והרדיוס $r = mE/(qBB'')$ תלוי רק ביחס $m/q$, שזהה לשניהם: $2m_p/e$.'
      - text: 'שני כתמים: חלקיקי האלפא רחוקים פי 2 מהסדק.'
        feedback: 'המסה של אלפא כפולה, אבל גם המטען שלו כפול. הרדיוס יחסי ל-$m/q$, וזה אותו יחס.'
        misconception: MC-bainbridge-mass-only
      - text: 'שני כתמים: חלקיקי האלפא קרובים פי 2 לסדק.'
        feedback: 'המטען הכפול לבדו היה מקטין את הרדיוס פי 2, אבל המסה הכפולה מגדילה אותו בחזרה פי 2.'
        misconception: MC-bainbridge-mass-only
      - text: 'רק כתם של דאוטרונים: חלקיקי אלפא נעצרים בבורר.'
        feedback: 'המהירות הנבחרת, $E/B$, זהה לכל חלקיק. חלקיקי אלפא במהירות הזאת עוברים בבורר כמו הדאוטרונים.'
        misconception: MC-selector-depends-on-mass

  - id: Q-4.7-isotope-mass
    type: numeric
    objectives: [OBJ-4.7-4]
    level: bagrut
    prompt: >-
      בספקטרומטר של ביינברידג׳ $E = 5\cdot10^{4}\,\text{V/m}$ ו-$B = 0.1\,\text{T}$ בבורר, והשדה השני $B' = 0.4\,\text{T}$. יון שמטענו $+e$ פוגע בגלאי במרחק $26.1\,\text{cm}$ מהסדק. מה המסה של היון, ביחידות של מסת הפרוטון?
    answer: 10
    unit: m_p
    tolerance: 0.03
    correctFeedback: 'נכון. $v = E/B = 5\cdot10^{5}\,\text{m/s}$ ו-$r = 13.05\,\text{cm}$. מ-$r = mv/(qB'')$: $m = \dfrac{qB''r}{v} = \dfrac{1.6\cdot10^{-19}\cdot0.4\cdot0.1305}{5\cdot10^{5}} \approx 1.67\cdot10^{-26}\,\text{kg}$, פי 10 ממסת הפרוטון (יון של בור-10).'
    wrongFeedback: 'המרחק מהסדק הוא הקוטר, $2r$. מצאו $v = E/B$, ואז $m = qB''r/v$, וחלקו ב-$m_p$.'
    commonWrong:
      - value: 20
        feedback: 'הצבתם את המרחק מהסדק כרדיוס. המרחק הוא הקוטר: $r = 26.1/2 = 13.05\,\text{cm}$.'
      - value: 2.5
        feedback: 'הצבתם בנוסחת הרדיוס את השדה של הבורר, $0.1\,\text{T}$. בחצי המעגל פועל רק השדה השני, $B'' = 0.4\,\text{T}$.'

  - id: Q-4.7-rank-spots
    type: rank
    objectives: [OBJ-4.7-4]
    level: mid
    prompt: >-
      כמה סוגי יונים נכנסים לאותו ספקטרומטר של ביינברידג׳. סדרו אותם לפי המרחק מהסדק שבו הם פוגעים בגלאי, מהרחוק לקרוב. (מסות בקירוב, ביחידות של מסת הפרוטון.)
    items:
      - { id: p, label: 'פרוטון: מטען $e$, מסה $1$' }
      - { id: d, label: 'דויטרון: מטען $e$, מסה $2$' }
      - { id: alpha, label: 'חלקיק אלפא: מטען $2e$, מסה $4$' }
      - { id: he, label: 'יון הליום עם מטען $e$: מסה $4$' }
      - { id: li, label: 'יון ליתיום-7 עם מטען $e$: מסה $7$' }
    order: [li, he, [d, alpha], p]
    correctFeedback: 'נכון. לכולם אותה מהירות מהבורר, והמרחק $2r = 2mE/(qBB'')$ יחסי ל-$m/q$: 7, 4, 2, 2, 1. הדויטרון וחלקיק האלפא פוגעים באותו מקום.'
    wrongFeedback: 'אחרי הבורר לכל היונים אותה מהירות, ולכן הרדיוס יחסי ל-$m/q$. חשבו את היחס לכל יון. שימו לב למטען של חלקיק האלפא.'
