  - id: Q-4.10-meter-linear
    type: mc
    objectives: [OBJ-4.10-4]
    qualitative: true
    level: mid
    prompt: >-
      בגלוונומטר, הקטבים של המגנט מעוגלים ובתוך הסליל יש ליבת ברזל גלילית. למה?
    choices:
      - text: 'כדי שהשדה במרווח יהיה רדיאלי: מישור הסליל לאורך השדה בכל זווית, המומנט $NBIA$ בכל זווית, וההסטה פרופורציונית לזרם.'
        correct: true
        feedback: 'נכון. הקפיץ מאזן את המומנט, $NBIA = \kappa\delta$, ולכן $\delta \propto I$, והשנתות במרחקים שווים.'
      - text: 'כדי שהסליל יפנה אל הקוטב, כי שם המומנט הגדול ביותר.'
        feedback: 'כשמישור הסליל ניצב לשדה (פונה אל הקוטב) המומנט אפס. העיגול של הקטבים שומר את המישור **לאורך** השדה.'
        misconception: MC-coil-torque-plane-angle
      - text: 'כדי שהכוח השקול על הסליל יקרב אותו לקוטב, וכך יזיז את המחוג.'
        feedback: 'המחוג זז בגלל מומנט, לא בגלל כוח שקול. הכוחות על שתי הצלעות הפוכים, והסליל לא זז ממקומו, רק מסתובב.'
