        feedback: 'ליבת הברזל דווקא מחזקת את השדה במרווח. המטרה היא הכיוון שלו, רדיאלי, כך שהמומנט לא תלוי בזווית.'

  - id: Q-4.10-meter-deflection
    type: numeric
    objectives: [OBJ-4.10-4]
    level: bagrut
    prompt: >-
      בגלוונומטר יש סליל של $50$ כריכות ששטחו $4\,\text{cm}^2$, בשדה רדיאלי של $0.15\,\text{T}$. קבוע הפיתול של הקפיץ $2\cdot10^{-6}\,\text{N·m/rad}$. בכמה רדיאנים יסטה המחוג כשזורם בסליל $0.2\,\text{mA}$?
    answer: 0.3
    unit: rad
    tolerance: 0.03
    correctFeedback: 'נכון. $NBIA = \kappa\delta$, ולכן $\delta = \dfrac{NBIA}{\kappa} = \dfrac{50\cdot0.15\cdot2\cdot10^{-4}\cdot4\cdot10^{-4}}{2\cdot10^{-6}} = 0.3\,\text{rad}$, כ-$17^\circ$.'
    wrongFeedback: 'המחוג נעצר כשמומנט הקפיץ שווה למומנט המגנטי: $\kappa\delta = NBIA$. כל הגדלים ביחידות SI.'
    commonWrong:
      - value: 0.006
        feedback: 'זו ההסטה של כריכה אחת. בסליל $50$ כריכות, והמומנט גדול פי $50$.'
      - value: 300
        feedback: 'הצבתם את הזרם במיליאמפר. $0.2\,\text{mA} = 2\cdot10^{-4}\,\text{A}$.'
      - value: 3000
        feedback: 'הצבתם את השטח בסנטימטרים רבועים, $4$. צריך מטרים רבועים: $4\,\text{cm}^2 = 4\cdot10^{-4}\,\text{m}^2$.'
      - value: 30
        feedback: 'חילקתם את השטח ב-$100$. בכל מטר רבוע יש $10^4$ סנטימטרים רבועים: $4\,\text{cm}^2 = 4\cdot10^{-4}\,\text{m}^2$.'
      - value: 17.19
        feedback: 'זו ההסטה במעלות. השאלה ברדיאנים: $\delta = NBIA/\kappa$ נותן רדיאנים ישירות.'
