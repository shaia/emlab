# Lesson 4.10 question bank. Strings may hold $inline$ / $$display$$ TeX and **bold**; they are
# rendered at build time. YAML note: plain and single-quoted strings keep backslashes literally.
# Every number below was recomputed with src/physics/magnetism.ts (wireForce, loopTorque) and
# src/physics/coil.ts (meterDeflection); script rc49b.ts in the session scratchpad. The data differ
# from figure 4.10א and the worked examples on purpose.

chapter: 4
questions:
  # ------------------------------------------------ OBJ-4.10-1: forces on the sides, zero net force
  - id: Q-4.10-net-force
    type: twotier
    objectives: [OBJ-4.10-1]
    qualitative: true
    prompt: >-
      כריכה מלבנית שזורם בה זרם נמצאת בשדה מגנטי אחיד, ומישורה מקביל לקווי השדה. מה הכוח המגנטי השקול על הכריכה?
    choices:
      - text: 'אפס.'
        correct: true
        feedback: נכון.
      - text: 'כוח בכיוון השדה, שדוחף את הכריכה כולה.'
        feedback: 'הכוח המגנטי על תיל ניצב לשדה, לא בכיוונו. וחוץ מזה, הכוחות על הצלעות הנגדיות הפוכים זה לזה.'
        misconception: MC-coil-net-force-nonzero
      - text: 'כוח שמושך את הכריכה אל אחד הקטבים.'
        feedback: 'בשדה אחיד אין קוטב "חזק יותר". הכוחות על שתי הצלעות הארוכות שווים בגודלם והפוכים בכיוונם, ולכן הם לא מזיזים את הכריכה ממקומה.'
        misconception: MC-coil-net-force-nonzero
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'על כל שתי צלעות נגדיות הזרם הפוך, אורכן שווה והשדה זהה, ולכן הכוחות עליהן שווים והפוכים.'
        correct: true
        feedback: 'נכון. $F = BIL\sin\alpha$ זהה לשתיהן, והכיוון מתהפך עם הזרם. הכוח השקול אפס, אבל שני הכוחות על הצלעות שמקבילות לציר לא על אותו קו, ולכן יש מומנט.'
      - text: 'כשמישור הכריכה מקביל לשדה, הזרם בכל הצלעות מקביל לשדה, ואין כוחות בכלל.'
        feedback: 'רק בשתי צלעות הזרם מקביל לשדה. שתי הצלעות שמקבילות לציר ניצבות לשדה, ועליהן פועל כוח $NBIa$. דווקא במצב הזה הן מסובבות הכי חזק.'
        misconception: MC-coil-equilibrium-no-forces
      - text: 'הכוח השקול אפס, ולכן הכריכה גם לא מסתובבת.'
        feedback: 'כוח שקול אפס לא אומר מומנט אפס. שני כוחות הפוכים שפועלים על שני צדי הציר מסובבים, כמו שתי ידיים על הגה.'
        misconception: MC-coil-net-force-nonzero

  - id: Q-4.10-side-force
    type: numeric
    objectives: [OBJ-4.10-1]
    prompt: >-
      סליל מלבני של $30$ כריכות נמצא על ציר, בשדה מגנטי אחיד של $0.25\,\text{T}$ שניצב לציר. הצלעות שמקבילות לציר באורך $10\,\text{cm}$, והצלעות האחרות באורך $6\,\text{cm}$. בסליל זורם $0.8\,\text{A}$. מה הכוח המגנטי על **אחת** מהצלעות שמקבילות לציר? ענו בניוטון.
    answer: 0.6
    unit: N
    tolerance: 0.03
    correctFeedback: 'נכון. הצלע ניצבת לשדה, ובכל אחת מ-$30$ הכריכות עובר הזרם: $F = NBIa = 30\cdot0.25\cdot0.8\cdot0.1 = 0.6\,\text{N}$.'
    wrongFeedback: 'הצלע שמקבילה לציר ניצבת לשדה. בכל אחת מ-$N$ הכריכות עובר $I$, ולכן $F = NBIa$, עם $a$ אורך הצלע.'
    commonWrong:
      - value: 0.02
        feedback: 'זה הכוח על כריכה אחת. בסליל יש $30$ כריכות, וכל אחת מהן תורמת את אותו כוח: $F = NBIa$.'
      - value: 0.36
        feedback: 'הצבתם את אורך הצלע הקצרה, $6\,\text{cm}$. השאלה על הצלע שמקבילה לציר, באורך $10\,\text{cm}$.'
      - value: 1.2
        feedback: 'זה סכום הגדלים של הכוחות על שתי הצלעות. השאלה על צלע אחת, וחוץ מזה שני הכוחות הפוכים, והכוח השקול שלהם אפס.'
        misconception: MC-coil-net-force-nonzero

  - id: Q-4.10-side-direction
    type: vector
    objectives: [OBJ-4.10-1]
    qualitative: true
    allowOutIn: true
    prompt: >-
      כריכה מלבנית נמצאת במישור הדף, בשדה מגנטי אחיד שמצביע **שמאלה**, גם הוא במישור הדף. בצלע הימנית של הכריכה הזרם זורם למעלה. מה כיוון הכוח המגנטי על הצלע הימנית?
    answer: out
    correctFeedback: 'נכון. בכלל כף יד ימין: האצבעות שמאלה (השדה), האגודל למעלה (הזרם), וכף היד פונה החוצה מהדף, ⊙.'
    wrong:
      - dir: in
        feedback: 'זה הכיוון כשהשדה מצביע ימינה. כאן השדה שמאלה: האצבעות שמאלה, האגודל למעלה, וכף היד פונה אליכם, ⊙.'
      - dir: w
        feedback: 'הכוח המגנטי ניצב לשדה, לא בכיוונו. הוא ניצב גם לזרם, ולכן כאן הוא ניצב לדף.'
      - dir: n
        feedback: 'הכוח ניצב לזרם, לא בכיוונו. השתמשו בכלל כף יד ימין: האצבעות בכיוון השדה, האגודל בכיוון הזרם.'
      - dir: zero
        feedback: 'הצלע הימנית ניצבת לשדה, ולכן הכוח עליה הגדול ביותר, $BIL$. אפס הוא הכוח רק על צלע שמקבילה לשדה.'
    wrongFeedback: 'פרשו את כף יד ימין: האצבעות בכיוון השדה, האגודל בכיוון הזרם, והכוח יוצא מכף היד.'

  - id: Q-4.10-which-sides
    type: multi
    objectives: [OBJ-4.10-1]
    qualitative: true
    level: mid
    prompt: >-
      כריכה מלבנית יכולה להסתובב על ציר שניצב לשדה מגנטי אחיד. מישור הכריכה יוצר זווית של $45^\circ$ עם קווי השדה. על אילו צלעות פועל כוח מגנטי **שיוצר מומנט סביב הציר**? סמנו את כל התשובות הנכונות.
    choices:
      - text: 'על שתי הצלעות שמקבילות לציר.'
        correct: true
        feedback: 'נכון. הן ניצבות לשדה, הכוחות עליהן ניצבים לשדה, ולא עוברים דרך הציר: לכל אחד זרוע של $\frac{b}{2}\sin\theta$.'
      - text: 'על שתי הצלעות שניצבות לציר.'
        feedback: 'גם עליהן יש כוח, כי הן לא מקבילות לשדה, אבל הכוח הזה פועל לאורך הציר. כוח שמקביל לציר לא מסובב סביבו.'
        misconception: MC-coil-all-sides-torque
      - text: 'על כל ארבע הצלעות, ולכן מחברים ארבעה מומנטים.'
        feedback: 'רק שתי צלעות יוצרות מומנט סביב הציר. הכוחות על שתי האחרות לאורך הציר, ורק מותחים את הכריכה או לוחצים עליה. בדקו במבט מהצד באיור 4.10א.'
        misconception: MC-coil-all-sides-torque
      - text: 'על אף צלע, כי הכוח השקול אפס.'
        feedback: 'הכוח השקול אפס, אבל שני הכוחות על הצלעות שמקבילות לציר פועלים על קווים שונים, ולכן הם מסובבים.'
        misconception: MC-coil-net-force-nonzero

  # ------------------------------------------------ OBJ-4.10-2: τ = NBIA·sinθ and the two angles
  - id: Q-4.10-max-position
    type: mc
    objectives: [OBJ-4.10-2]
    qualitative: true
    prompt: >-
      סליל שטוח על ציר נמצא בין שני קוטבי מגנט, וזורם בו זרם קבוע. מסובבים את הסליל לאט סיבוב שלם. באיזה מצב המומנט המגנטי עליו הגדול ביותר?
    choices:
      - text: 'כשמישור הסליל מקביל לקווי השדה.'
        correct: true
        feedback: 'נכון. אז האנך ניצב לשדה, $\theta = 90^\circ$, $\sin\theta = 1$: הזרוע של כל כוח היא חצי הרוחב, הכי ארוכה שאפשר.'
      - text: 'כשמישור הסליל ניצב לקווי השדה, והסליל פונה אל הקוטב.'
        feedback: 'במצב הזה האנך מקביל לשדה, $\theta = 0$, והמומנט **אפס**: שני הכוחות פועלים על קו אחד שעובר דרך הציר. הזווית בנוסחה היא בין האנך לשדה, לא בין המישור לשדה.'
        misconception: MC-coil-torque-plane-angle
      - text: 'כשמישור הסליל יוצר זווית של $45^\circ$ עם קווי השדה.'
        feedback: 'שם המומנט $NBIA\sin45^\circ$, כ-$71\%$ מהגדול ביותר. $\sin\theta$ מגיע ל-$1$ רק ב-$\theta = 90^\circ$.'
      - text: 'המומנט זהה בכל המצבים, כי הכוח על כל צלע לא משתנה.'
        feedback: 'הכוח באמת לא משתנה, אבל הזרוע משתנה: $d = \frac{b}{2}\sin\theta$. לכן גם המומנט משתנה.'

  - id: Q-4.10-torque-max
    type: numeric
    objectives: [OBJ-4.10-2]
    prompt: >-
      סליל מלבני של $25$ כריכות, $8\,\text{cm}$ על $6\,\text{cm}$, נמצא על ציר בשדה מגנטי אחיד של $0.4\,\text{T}$, וזורם בו $1.2\,\text{A}$. מה המומנט הגדול ביותר שהשדה יכול להפעיל עליו? ענו בניוטון-מטר.
    answer: 0.0576
    unit: N·m
    tolerance: 0.03
    correctFeedback: 'נכון. $A = 0.08\cdot0.06 = 4.8\cdot10^{-3}\,\text{m}^2$, ו-$\tau_{\max} = NBIA = 25\cdot0.4\cdot1.2\cdot4.8\cdot10^{-3} \approx 0.058\,\text{N·m}$, כשמישור הסליל מקביל לשדה.'
    wrongFeedback: 'המומנט הגדול ביותר הוא $NBIA$, כש-$\sin\theta = 1$. השטח במטרים רבועים.'
    commonWrong:
      - value: 576
        feedback: 'הצבתם את השטח בסנטימטרים רבועים, $48$. צריך מטרים רבועים: $48\,\text{cm}^2 = 4.8\cdot10^{-3}\,\text{m}^2$.'
      - value: 0.002304
        feedback: 'זה המומנט על כריכה אחת. בסליל $25$ כריכות, והמומנט גדול פי $25$.'

  - id: Q-4.10-plane-angle
    type: numeric
    objectives: [OBJ-4.10-2]
    level: mid
    prompt: >-
      סליל של $40$ כריכות, ששטחו $30\,\text{cm}^2$, נמצא על ציר בשדה מגנטי אחיד של $0.5\,\text{T}$, וזורם בו $0.6\,\text{A}$. **מישור הסליל** יוצר זווית של $20^\circ$ עם קווי השדה. מה המומנט על הסליל? ענו בניוטון-מטר.
    answer: 0.03383
    unit: N·m
    tolerance: 0.03
    correctFeedback: 'נכון. האנך ניצב למישור, ולכן $\theta = 90^\circ - 20^\circ = 70^\circ$, ו-$\tau = 40\cdot0.5\cdot0.6\cdot3\cdot10^{-3}\cdot\sin70^\circ \approx 0.0338\,\text{N·m}$.'
    wrongFeedback: 'בנוסחה $\tau = NBIA\sin\theta$, הזווית $\theta$ היא בין האנך לשדה. מצאו אותה מהזווית בין המישור לשדה.'
    commonWrong:
      - value: 0.01231
        feedback: 'הצבתם $\theta = 20^\circ$, הזווית בין **המישור** לשדה. הזווית בנוסחה היא בין **האנך** לשדה: $90^\circ - 20^\circ = 70^\circ$. המישור כמעט מקביל לשדה, ולכן המומנט קרוב לגדול ביותר.'
        misconception: MC-coil-torque-plane-angle
      - value: 338.3
        feedback: 'הצבתם את השטח בסנטימטרים רבועים, $30$. צריך מטרים רבועים: $30\,\text{cm}^2 = 3\cdot10^{-3}\,\text{m}^2$ (בכל מטר רבוע יש $10^4$ סנטימטרים רבועים).'
      - value: 3.383
        feedback: 'חילקתם את השטח ב-$100$. בכל מטר רבוע יש $100\cdot100 = 10^4$ סנטימטרים רבועים: $30\,\text{cm}^2 = 3\cdot10^{-3}\,\text{m}^2$.'
      - value: 0.036
        feedback: 'זה המומנט הגדול ביותר, $NBIA$, כשהמישור מקביל לשדה. כאן המישור בזווית של $20^\circ$ לשדה, ולכן צריך לכפול ב-$\sin70^\circ$.'

  - id: Q-4.10-rank-angles
    type: rank
    objectives: [OBJ-4.10-2]
    qualitative: true
    level: mid
    prompt: >-
      אותו סליל, עם אותו זרם, באותו שדה, בארבעה מצבים. סדרו את המצבים לפי גודל המומנט, מהגדול לקטן.
    items:
      - { id: par, label: 'מישור הסליל מקביל לקווי השדה' }
      - { id: p30, label: 'מישור הסליל בזווית $30^\circ$ לקווי השדה' }
      - { id: p60, label: 'מישור הסליל בזווית $60^\circ$ לקווי השדה' }
      - { id: perp, label: 'מישור הסליל ניצב לקווי השדה' }
    order: [par, p30, p60, perp]
    correctFeedback: 'נכון. הזווית בין האנך לשדה היא $90^\circ$, $60^\circ$, $30^\circ$ ו-$0$, והמומנט פרופורציוני ל-$\sin\theta$: $1$, $0.87$, $0.5$ ו-$0$.'
    wrongFeedback: 'תרגמו כל זווית בין מישור לשדה לזווית בין האנך לשדה, $\theta = 90^\circ - \beta$, והשוו את $\sin\theta$.'

  # ------------------------------------------------ OBJ-4.10-3: where it turns, stable and unstable
  - id: Q-4.10-stable
    type: mc
    objectives: [OBJ-4.10-3]
    qualitative: true
    prompt: >-
      כריכה על ציר, בשדה מגנטי אחיד, משוחררת ממצב שבו מישורה מקביל לשדה. בציר יש מעט חיכוך. באיזה מצב היא תיעצר בסוף?
    choices:
      - text: 'כשמישור הכריכה ניצב לשדה, והאנך שלה בכיוון השדה.'
        correct: true
        feedback: 'נכון. המומנט מסובב את האנך אל כיוון השדה. שם המומנט אפס, וכל הזזה קטנה מחזירה את הכריכה: שיווי משקל יציב. היא מתנדנדת סביבו, והחיכוך עוצר אותה.'
      - text: 'כשמישור הכריכה ניצב לשדה, והאנך שלה בכיוון הפוך לשדה.'
        feedback: 'גם שם המומנט אפס, אבל זה שיווי משקל רופף: כל הזזה קטנה מסובבת את הכריכה חצי סיבוב, עד שהאנך בכיוון השדה.'
      - text: 'היא לא תזוז, כי במצב הזה הכוח השקול עליה אפס.'
        feedback: 'הכוח השקול אפס בכל מצב, אבל במצב הזה המומנט דווקא הגדול ביותר. הכריכה תתחיל להסתובב מיד.'
        misconception: MC-coil-net-force-nonzero
      - text: 'היא תמשיך להסתובב לאותו כיוון בלי סוף.'
        feedback: 'בלי קומוטטור המומנט מתהפך בכל פעם שהכריכה עוברת את המצב היציב. היא מתנדנדת ונעצרת.'
        misconception: MC-motor-without-commutator

  - id: Q-4.10-equilibrium-forces
    type: twotier
    objectives: [OBJ-4.10-3, OBJ-4.10-1]
    qualitative: true
    level: mid
    prompt: >-
      כריכה על ציר נעצרה בשדה מגנטי אחיד, ומישורה ניצב לשדה. הזרם עדיין זורם בה. האם פועלים כוחות מגנטיים על הצלעות שמקבילות לציר?
    choices:
      - text: 'כן, באותו גודל כמו בכל זווית אחרת.'
        correct: true
        feedback: נכון.
      - text: 'לא, הם נעלמו, ולכן הכריכה נעצרה.'
        feedback: 'הצלעות שמקבילות לציר ניצבות לשדה בכל זווית, ולכן הכוח עליהן $NBIa$ גם כאן. מה שנעלם הוא המומנט, לא הכוח.'
        misconception: MC-coil-equilibrium-no-forces
      - text: 'כן, אבל קטנים יותר, כי הכריכה פונה אל השדה.'
        feedback: 'גודל הכוח תלוי בזווית בין הצלע לשדה, $\sin\alpha$, והצלע הזאת ניצבת לשדה בכל מצב. הכוח לא משתנה.'
        misconception: MC-coil-torque-plane-angle
    reasonPrompt: ולמה הכריכה לא מסתובבת?
    reasons:
      - text: 'שני הכוחות פועלים לאורך קו אחד שעובר דרך הציר, ולכן הזרוע שלהם אפס.'
        correct: true
        feedback: 'נכון. $d = \frac{b}{2}\sin\theta$, ו-$\theta = 0$. הכוחות רק מותחים את הכריכה.'
      - text: 'כי הכוח השקול אפס.'
        feedback: 'הכוח השקול אפס בכל זווית, גם כשהכריכה מסתובבת. מה שקובע את הסיבוב הוא המומנט.'
        misconception: MC-coil-net-force-nonzero
      - text: 'כי הזרם בצלעות מקביל לשדה במצב הזה.'
        feedback: 'הזרם בצלעות שמקבילות לציר ניצב לשדה בכל מצב, כי הציר ניצב לשדה.'
        misconception: MC-coil-equilibrium-no-forces

  - id: Q-4.10-unstable
