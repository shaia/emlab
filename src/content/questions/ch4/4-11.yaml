# Lesson 4.11 question bank. Strings may hold $inline$ / $$display$$ TeX and **bold**; they are
# rendered at build time. YAML note: plain and single-quoted strings keep backslashes literally.
# Every number below was recomputed with src/physics/magnetism.ts (straightWireField, wireForce,
# lorentzMagnitude) and src/physics/compass.ts (needleDeflection, earthFieldFromSlope). The numbers
# differ on purpose from the figures and the worked examples.
# Map convention for the vector questions: the page is a map seen from above, north up, east right;
# "out of the page" (⊙) is up, toward the viewer.

chapter: 4
questions:
  # ------------------------------------------------ OBJ-4.11-1: the method, directions, tanθ
  - id: Q-4.11-why-ns
    type: mc
    objectives: [OBJ-4.11-1]
    qualitative: true
    prompt: >-
      בניסוי למדידת השדה של כדור הארץ מניחים תיל ישר מעל מצפן. למה התיל חייב לעבור בכיוון צפון–דרום?
    choices:
      - text: 'כך השדה של התיל במחט ניצב לרכיב האופקי של השדה של כדור הארץ, ומשולש השדות ישר-זווית: $\tan\theta = B_w/B_E$.'
        correct: true
        feedback: 'נכון. מתחת לתיל השדה שלו ניצב לתיל. בתיל צפון–דרום הוא פונה מזרחה או מערבה, ניצב ל-$B_E$, שפונה צפונה.'
      - text: 'זה לא באמת חשוב: כל תיל עם זרם מסובב את המחט באותה זווית, בכל כיוון שהוא מונח.'
        feedback: 'בתיל מזרח–מערב השדה של התיל במחט מקביל ל-$B_E$ או מנוגד לו. המחט לא זזה, או מתהפכת, ואין זווית למדוד. נסו באיור 4.11א.'
        misconception: MC-compass-wire-orientation
      - text: 'כי השדה של התיל פונה לאורך התיל, ולכן צריך שיהיה לאורך המחט.'
        feedback: 'השדה של תיל ישר מקיף אותו, ובכל נקודה הוא ניצב לתיל. לאורך התיל הוא לא פונה אף פעם.'
      - text: 'כי רק תיל בכיוון צפון–דרום מרגיש כוח מהשדה של כדור הארץ.'
        feedback: 'בניסוי מודדים את הזווית של המחט, לא כוח על התיל. ודווקא על תיל צפון–דרום הרכיב האופקי של השדה של כדור הארץ, שמקביל לתיל, לא מפעיל כוח.'

  - id: Q-4.11-field-at-needle
    type: vector
    objectives: [OBJ-4.11-1]
    qualitative: true
    allowOutIn: true
    prompt: >-
      הדף הוא מפה במבט מלמעלה: הצפון למעלה והמזרח מימין. תיל ישר ואופקי עובר בכיוון צפון–דרום מעל מצפן, וזורם בו זרם **דרומה**. לאן פונה השדה של התיל במקום של המחט, שמתחת לתיל?
    answer: e
    correctFeedback: 'נכון. לפי כלל יד ימין, האגודל דרומה, ומתחת לתיל האצבעות המכופפות פונות מזרחה. לכן הקוטב הצפוני של המחט סוטה מזרחה.'
    wrongFeedback: 'אחזו את התיל ביד ימין, האגודל בכיוון הזרם, דרומה. לאן פונות האצבעות **מתחת** לתיל?'
    wrong:
      - dir: w
        feedback: 'מערבה פונה השדה מתחת לתיל כשהזרם צפונה, או **מעל** התיל כשהזרם דרומה. כאן הזרם דרומה והמחט מתחת לתיל: האצבעות שם פונות מזרחה.'
      - dir: s
        feedback: 'השדה של תיל ישר לא פונה לאורך הזרם: הוא מקיף את התיל, ובכל נקודה הוא ניצב לו.'
      - dir: 'n'
        feedback: 'השדה של התיל ניצב לתיל, ולכן במקום של המחט הוא לא יכול לפנות צפונה או דרומה, לאורך התיל.'
      - dir: in
        feedback: 'בנקודה שישר מתחת לתיל, השדה המקיף את התיל אופקי, לא אנכי. הוא פונה כלפי מטה רק בנקודות שבצדי התיל.'
      - dir: out
        feedback: 'בנקודה שישר מתחת לתיל, השדה המקיף את התיל אופקי, לא אנכי.'

  - id: Q-4.11-angle-from-current
    type: numeric
    objectives: [OBJ-4.11-1]
    level: mid
    prompt: >-
      תיל ישר בכיוון צפון–דרום עובר $5\,\text{cm}$ מעל מחט של מצפן, וזורם בו זרם של $4\,\text{A}$. הרכיב האופקי של השדה של כדור הארץ במקום הוא $3.0\cdot10^{-5}\,\text{T}$. בכמה מעלות סוטה המחט מהצפון? ענו במעלות.
    answer: 28.1
    unit: °
    tolerance: 0.02
    correctFeedback: 'נכון. $B_w = \dfrac{4\pi\cdot10^{-7}\cdot4}{2\pi\cdot0.05} = 1.6\cdot10^{-5}\,\text{T}$, ו-$\tan\theta = \dfrac{1.6}{3.0} = 0.533$, ולכן $\theta \approx 28^\circ$.'
    wrongFeedback: 'חשבו את השדה של התיל, $B_w = \mu_0 I/(2\pi r)$, עם $r$ במטרים, ואחר כך $\tan\theta = B_w/B_E$.'
    commonWrong:
      - value: 32.2
        feedback: 'השתמשתם בסינוס, $\sin\theta = B_w/B_E$. השדות ניצבים, ו-$B_w$ הוא הניצב שמול הזווית ו-$B_E$ הניצב שלידה: היחס ביניהם הוא טנגנס.'
      - value: 61.9
        feedback: 'הפכתם את היחס: $\tan\theta = B_E/B_w$ נותן את הזווית מהמערב. הזווית מהצפון היא $\tan\theta = B_w/B_E$.'
      - value: 0.31
        feedback: 'הצבתם את המרחק בסנטימטרים, $r = 5$. בנוסחה $r$ במטרים: $0.05\,\text{m}$.'
      - value: 73.4
        feedback: 'שכחתם את $2\pi$ במכנה: $B_w = \mu_0 I/(2\pi r)$, ולא $\mu_0 I/r$.'
      - value: 0.49
        feedback: 'זו הזווית ברדיאנים. ענו במעלות: $0.49\,\text{rad} \approx 28^\circ$.'

  - id: Q-4.11-past-90
    type: twotier
    objectives: [OBJ-4.11-1]
    qualitative: true
    prompt: >-
      תיל בכיוון צפון–דרום עובר מעל מצפן. מגדילים את הזרם בתיל עוד ועוד. מה קורה לזווית הסטייה של המחט?
    choices:
      - text: 'היא גדלה ומתקרבת ל-$90^\circ$, אבל לא מגיעה אליה.'
        correct: true
        feedback: נכון.
      - text: 'היא גדלה עד $90^\circ$, וממשיכה הלאה עד שהמחט מצביעה דרומה.'
        feedback: 'המחט לא עוברת את $90^\circ$. היא מצביעה לאורך השדה השקול, ולו יש תמיד רכיב צפוני.'
        misconception: MC-compass-past-90
      - text: 'היא גדלה ביחס ישר לזרם, בלי גבול.'
        feedback: 'הזווית לא גדלה ביחס ישר לזרם: $\tan\theta$ הוא שגדל ביחס ישר. ובכל מקרה, המחט לא עוברת את $90^\circ$.'
        misconception: MC-compass-angle-proportional
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'השדה השקול הוא $B_E$ צפונה ועוד $B_w$ מערבה (או מזרחה). הרכיב הצפוני $B_E$ נשאר, גם כש-$B_w$ גדול מאוד.'
        correct: true
        feedback: 'נכון. ככל ש-$B_w$ גדל, $\tan\theta = B_w/B_E$ גדל בלי גבול, אבל הזווית רק מתקרבת ל-$90^\circ$.'
      - text: 'כשהשדה של התיל חזק מספיק, הוא "מנצח" את השדה של כדור הארץ, ומעבר לזה המחט מסתובבת בחופשיות.'
        feedback: 'אין "ניצחון": המחט תמיד מצביעה לאורך הסכום הווקטורי של שני השדות, ולסכום יש רכיב צפוני $B_E$ בכל זרם.'
        misconception: MC-compass-past-90
      - text: 'השדה של כדור הארץ זניח ליד התיל, ולכן המחט מצביעה מיד בכיוון השדה של התיל.'
        feedback: 'בזרמים של כמה אמפרים, במרחק של כמה סנטימטרים, השדה של התיל באותו סדר גודל של $B_E$. לכן המחט מצביעה ביניהם.'
        misconception: MC-earth-field-negligible

  - id: Q-4.11-earth-negligible
    type: mc
    objectives: [OBJ-4.11-1]
    qualitative: true
    prompt: >-
      תלמיד אומר: "השדה של כדור הארץ חלש מאוד. ברגע שיש זרם בתיל שמעל המצפן, המחט תסתובב ב-$90^\circ$ ותתיישר לאורך השדה של התיל." בתיל צפון–דרום, $3\,\text{cm}$ מעל המחט, עובר זרם של $2\,\text{A}$, ו-$B_E = 3.2\cdot10^{-5}\,\text{T}$. מה נכון?
    choices:
      - text: 'השדה של התיל במחט, $1.3\cdot10^{-5}\,\text{T}$, חלש מ-$B_E$, והמחט סוטה רק כ-$23^\circ$.'
        correct: true
        feedback: 'נכון. $B_w = \dfrac{4\pi\cdot10^{-7}\cdot2}{2\pi\cdot0.03} = 1.33\cdot10^{-5}\,\text{T}$, ו-$\tan\theta = 1.33/3.2 = 0.42$. השדה של כדור הארץ לא זניח בכלל.'
      - text: 'התלמיד צודק: ליד תיל עם זרם, השדה של כדור הארץ זניח.'
        feedback: 'חשבו: השדה של התיל הוא רק $1.3\cdot10^{-5}\,\text{T}$, פחות מ-$B_E$. השדה של כדור הארץ חלש, אבל גם השדה של תיל עם זרם של אמפרים בודדים חלש.'
        misconception: MC-earth-field-negligible
      - text: 'המחט תסתובב ב-$90^\circ$, אבל רק אם הזרם צפונה.'
        feedback: 'כיוון הזרם קובע לאיזה צד המחט תסטה, מזרחה או מערבה, לא את גודל הזווית. וב-$2\,\text{A}$ הזווית כ-$23^\circ$ בכל אחד מהכיוונים.'
        misconception: MC-earth-field-negligible
      - text: 'המחט לא תזוז, כי השדה של התיל חלש מ-$B_E$.'
        feedback: 'שדה חלש יותר עדיין מסובב את המחט: היא מצביעה לאורך הסכום של שני השדות הניצבים, בזווית שבה $\tan\theta = B_w/B_E$.'

  # ------------------------------------------------ OBJ-4.11-2: the graph and B_E from its slope
  - id: Q-4.11-double-current
    type: numeric
    objectives: [OBJ-4.11-1, OBJ-4.11-2]
    level: mid
    prompt: >-
      בגלוונומטר טנגנטי עם תיל בכיוון צפון–דרום, זרם של $2\,\text{A}$ מסובב את המחט ב-$25^\circ$. בכמה מעלות תסטה המחט בזרם של $4\,\text{A}$, באותו מקום? ענו במעלות.
    answer: 43
    unit: °
    tolerance: 0.02
    correctFeedback: 'נכון. $\tan\theta$ ביחס ישר לזרם: $\tan\theta = 2\tan25^\circ = 2\cdot0.466 = 0.933$, ולכן $\theta = 43^\circ$.'
    wrongFeedback: 'מה גדל ביחס ישר לזרם: $\theta$, או $\tan\theta$?'
    commonWrong:
      - value: 50
        feedback: 'הכפלתם את הזווית. הזרם גדל פי שניים, ולכן $B_w$ ו-$\tan\theta$ גדלים פי שניים, אבל לא $\theta$: $\tan\theta = 0.933$, כלומר $43^\circ$.'
        misconception: MC-compass-angle-proportional
      - value: 25
        feedback: 'הזווית משתנה עם הזרם: פי שניים זרם, פי שניים $\tan\theta$.'

  - id: Q-4.11-why-tan
    type: mc
    objectives: [OBJ-4.11-2]
    qualitative: true
    prompt: >-
      בניסוי מודדים את זווית הסטייה $\theta$ בכמה זרמים $I$. איזה גרף ייתן קו ישר דרך הראשית, ולמה?
    choices:
      - text: '$\tan\theta$ כתלות ב-$I$, כי $\tan\theta = B_w/B_E$ ו-$B_w$ ביחס ישר ל-$I$.'
        correct: true
        feedback: 'נכון. השיפוע הוא $\dfrac{\mu_0}{2\pi r B_E}$, וממנו מוצאים את $B_E$.'
      - text: '$\theta$ כתלות ב-$I$, כי השדה של התיל ביחס ישר לזרם.'
        feedback: 'השדה של התיל אכן ביחס ישר לזרם, אבל המחט מצביעה לאורך השדה השקול, ולכן הזווית גדלה פחות ופחות. בזרמים גדולים הגרף של $\theta$ מתעקם ומתקרב ל-$90^\circ$.'
        misconception: MC-compass-angle-proportional
      - text: '$\sin\theta$ כתלות ב-$I$, כי המחט היא היתר של משולש השדות.'
        feedback: 'הסינוס הוא הניצב שמול הזווית חלקי היתר, $B_w/B$. אבל גם היתר $B$ משתנה עם הזרם. הניצב שליד הזווית, $B_E$, קבוע, ולכן היחס הקבוע-מכנה הוא הטנגנס.'
      - text: '$\theta$ כתלות ב-$1/I$, כי השדה של התיל קטן כמו $1/r$.'
        feedback: 'השדה של התיל קטן כמו $1/r$ עם המרחק, אבל בניסוי המרחק קבוע ומשנים את הזרם. $\tan\theta$ גדל ביחס ישר לזרם.'

  - id: Q-4.11-be-from-slope
    type: numeric
    objectives: [OBJ-4.11-2]
    level: bagrut
    prompt: >-
      בניסוי, התיל בכיוון צפון–דרום, $2.5\,\text{cm}$ מעל המחט. השיפוע של הקו הישר בגרף של $\tan\theta$ כתלות ב-$I$ הוא $0.25\,\text{A}^{-1}$. מה הרכיב האופקי של השדה של כדור הארץ? ענו במיקרוטסלה ($\mu\text{T}$, מיליונית טסלה).
    answer: 32
    unit: μT
    tolerance: 0.03
    correctFeedback: 'נכון. $k = \dfrac{\mu_0}{2\pi r B_E}$, ולכן $B_E = \dfrac{\mu_0}{2\pi r k} = \dfrac{4\pi\cdot10^{-7}}{2\pi\cdot0.025\cdot0.25} = 3.2\cdot10^{-5}\,\text{T} = 32\,\mu\text{T}$.'
    wrongFeedback: 'כתבו את השיפוע לפי הנוסחה, $k = \mu_0/(2\pi r B_E)$, ובודדו את $B_E$.'
    commonWrong:
      - value: 201
        feedback: 'שכחתם את $2\pi$: $B_E = \mu_0/(2\pi r k)$, ולא $\mu_0/(rk)$.'
      - value: 2
        feedback: 'כפלתם בשיפוע במקום לחלק בו: $B_E = \mu_0/(2\pi r k)$. שיפוע גדול יותר אומר שדה של כדור הארץ חלש יותר, כי אז אותו זרם מסובב את המחט יותר.'
      - value: 0.32
        feedback: 'הצבתם את המרחק בסנטימטרים. בנוסחה $r = 0.025\,\text{m}$.'
      - value: 3.2e-5
        feedback: 'החישוב נכון, אבל זו התשובה בטסלה. ענו במיקרוטסלה: $3.2\cdot10^{-5}\,\text{T} = 32\,\mu\text{T}$.'

  - id: Q-4.11-double-r
    type: mc
    objectives: [OBJ-4.11-2]
    qualitative: true
    prompt: >-
      חוזרים על הניסוי באותו מקום, אבל התיל עכשיו בגובה כפול מעל המחט. מה קורה לשיפוע של הגרף $\tan\theta$ כתלות ב-$I$, ולערך של $B_E$ שמחשבים ממנו?
    choices:
      - text: 'השיפוע קטן פי שניים, ו-$B_E$ שמחשבים נשאר אותו דבר.'
        correct: true
        feedback: 'נכון. $k = \dfrac{\mu_0}{2\pi r B_E}$: כש-$r$ גדל פי שניים, $k$ קטן פי שניים. ב-$B_E = \dfrac{\mu_0}{2\pi r k}$ המכפלה $rk$ לא משתנה, ו-$B_E$ הוא תכונה של המקום.'
      - text: 'השיפוע קטן פי ארבעה, כי השדה של תיל קטן כמו $1/r^2$.'
        feedback: 'השדה של תיל ישר ארוך קטן כמו $1/r$, לא $1/r^2$ (שיעור 4.2). השיפוע קטן פי שניים.'
      - text: 'השיפוע לא משתנה, כי הזרמים אותם זרמים.'
        feedback: 'באותו זרם, השדה של התיל במחט חלש פי שניים, ולכן $\tan\theta$ קטן פי שניים. השיפוע קטן פי שניים.'
      - text: 'השיפוע קטן פי שניים, ולכן גם $B_E$ שמחשבים קטן פי שניים.'
        feedback: 'בנוסחה $B_E = \mu_0/(2\pi r k)$ גם $r$ השתנה: $r$ גדל פי שניים ו-$k$ קטן פי שניים, ו-$B_E$ נשאר. השדה של כדור הארץ לא תלוי בגובה של התיל.'

  # ------------------------------------------------ OBJ-4.11-3: uncertainty, outliers, systematic error
  - id: Q-4.11-best-angle
    type: mc
    objectives: [OBJ-4.11-3]
    qualitative: true
    prompt: >-
      קוראים את זווית הסטייה בדיוק של $\pm1^\circ$. באילו זוויות השגיאה היחסית ב-$\tan\theta$, ולכן גם ב-$B_E$, הקטנה ביותר?
    choices:
      - text: 'בזוויות של כ-$45^\circ$.'
        correct: true
        feedback: 'נכון. ב-$45^\circ$ מעלה אחת משנה את $\tan\theta$ בכ-$3.5\%$. ב-$5^\circ$ השינוי כ-$20\%$, וב-$80^\circ$ כ-$10\%$.'
      - text: 'בזוויות קטנות, כמה מעלות, כי שם המחט כמעט לא זזה.'
        feedback: 'בזווית של $5^\circ$, שגיאה של מעלה אחת היא חמישית מהזווית כולה, ו-$\tan\theta$ משתנה בכ-$20\%$.'
      - text: 'בזוויות קרובות ל-$90^\circ$, כי שם הזרם הכי גדול.'
        feedback: 'קרוב ל-$90^\circ$ הטנגנס משתנה מהר מאוד: ב-$80^\circ$ מעלה אחת משנה אותו בכ-$10\%$. ובכל מקרה, המחט לא מגיעה ל-$90^\circ$.'
        misconception: MC-compass-past-90
      - text: 'בכל הזוויות השגיאה זהה, כי בכולן קוראים בדיוק של מעלה.'
        feedback: 'השגיאה בזווית זהה, אבל ההשפעה שלה על $\tan\theta$, יחסית לערך שלו, תלויה בזווית.'

  - id: Q-4.11-outlier
    type: mc
    objectives: [OBJ-4.11-3]
    qualitative: true
    prompt: >-
      בגרף של $\tan\theta$ כתלות ב-$I$, חמש נקודות קרובות לקו ישר דרך הראשית, ונקודה אחת רחוקה ממנו הרבה יותר משאר הנקודות. מה נכון לעשות?
    choices:
      - text: 'לבדוק את המדידה הזו ולחזור עליה, ולהעביר את הקו לפי שאר הנקודות, לא דרכה.'
        correct: true
        feedback: 'נכון. זו מדידה חריגה, כנראה טעות בקריאה או בזרם. לא מעבירים את הקו דרכה, וגם לא מוחקים אותה בלי לבדוק.'
      - text: 'לחשב את השיפוע מהנקודה החריגה ומהנקודה הראשונה, כי הן הכי רחוקות זו מזו.'
        feedback: 'את השיפוע מחשבים משתי נקודות על הקו המתאים ביותר, לא משתי מדידות, ובוודאי לא ממדידה חריגה.'
        misconception: MC-slope-from-data-points
      - text: 'להעביר קו שעובר בדיוק דרך כל שש הנקודות.'
        feedback: 'אין קו ישר שעובר דרך כולן. קו "מתאים" לכל הנקודות, כולל החריגה, יוצא עם שיפוע לא נכון.'
      - text: 'לוותר על הניסוי, כי נקודה אחת לא על הקו מוכיחה שהקשר לא קווי.'
        feedback: 'חמש נקודות על קו ישר הן ראיה טובה לקשר קווי. נקודה אחת רחוקה היא כנראה טעות במדידה הזו, ולא בחוק.'

  - id: Q-4.11-r-systematic
    type: numeric
    objectives: [OBJ-4.11-3]
    level: bagrut
    prompt: >-
      תלמידה מדדה את הגובה של התיל מעל הזכוכית של המצפן, $2.0\,\text{cm}$, וחישבה מהשיפוע $B_E = 40\,\mu\text{T}$. אחר כך התברר שהמחט נמצאת $0.5\,\text{cm}$ מתחת לזכוכית. מה הערך המתוקן של $B_E$? ענו במיקרוטסלה.
    answer: 32
    unit: μT
    tolerance: 0.03
    correctFeedback: 'נכון. המרחק האמיתי עד המחט הוא $2.5\,\text{cm}$. ב-$B_E = \mu_0/(2\pi r k)$ השיפוע $k$ לא משתנה, ו-$B_E$ הפוך ל-$r$: $40\cdot\dfrac{2.0}{2.5} = 32\,\mu\text{T}$.'
    wrongFeedback: '$B_E = \mu_0/(2\pi r k)$, והשיפוע נמדד נכון. מה קורה ל-$B_E$ כש-$r$ גדל מ-$2.0$ ל-$2.5\,\text{cm}$?'
    commonWrong:
      - value: 50
        feedback: 'תיקנתם בכיוון ההפוך. $B_E$ הפוך ל-$r$: מרחק גדול יותר נותן $B_E$ קטן יותר, $40\cdot2.0/2.5$.'
      - value: 25.6
        feedback: 'תיקנתם ביחס של המרחקים בריבוע. השדה של תיל ישר קטן כמו $1/r$, ולכן $B_E$ הפוך ל-$r$, לא ל-$r^2$.'
      - value: 3.2e-5
        feedback: 'החישוב נכון, אבל זו התשובה בטסלה. ענו במיקרוטסלה: $32\,\mu\text{T}$.'
      - value: 40
        feedback: 'זו שגיאה שיטתית: כל המדידות חושבו עם $r$ קצר מדי, והקו לא מתקן אותה. צריך לחשב מחדש עם $r = 2.5\,\text{cm}$.'

  # ------------------------------------------------ OBJ-4.11-4: the chapter in one problem
  - id: Q-4.11-ns-wire-force
    type: mc
    objectives: [OBJ-4.11-4]
    qualitative: true
    prompt: >-
      תיל נחושת ישר ואופקי בכיוון צפון–דרום, שזורם בו זרם צפונה. איזה כוח מפעיל עליו **הרכיב האופקי** של השדה של כדור הארץ, שפונה צפונה?
    choices:
      - text: 'אף כוח: הרכיב הזה מקביל לתיל, $\alpha = 0$, ו-$F = BIL\sin\alpha = 0$.'
        correct: true
        feedback: 'נכון (שיעור 4.8). על התיל פועל כוח רק מהרכיב האנכי של השדה של כדור הארץ, שניצב לו.'
      - text: 'כוח מערבה, לפי כלל כף יד ימין.'
        feedback: 'כדי להפעיל את כלל כף יד ימין צריך שדה שאינו מקביל לזרם. כאן הרכיב האופקי לאורך התיל, $\sin0 = 0$, ואין כוח.'
      - text: 'כוח צפונה, בכיוון השדה.'
        feedback: 'הכוח המגנטי על תיל ניצב לשדה, אף פעם לא לאורכו. ובשדה שמקביל לתיל אין כוח בכלל.'
      - text: 'כוח שמושך את התיל כלפי מטה, כי כדור הארץ מגנט.'
        feedback: 'מגנט מושך ברזל, לא נחושת. על תיל נחושת השדה מפעיל כוח רק דרך הזרם, $F = BIL\sin\alpha$, וכאן $\alpha = 0$.'

  - id: Q-4.11-vertical-force
    type: numeric
    objectives: [OBJ-4.11-4]
    level: mid
    prompt: >-
      על אותו תיל, בכיוון צפון–דרום, עובר זרם של $5\,\text{A}$. לשדה של כדור הארץ במקום יש רכיב אופקי $3.2\cdot10^{-5}\,\text{T}$ ורכיב אנכי $3.0\cdot10^{-5}\,\text{T}$. מה גודל הכוח המגנטי על קטע של $2\,\text{m}$ מהתיל? ענו בניוטון.
    answer: 3.0e-4
    unit: N
    tolerance: 0.03
    correctFeedback: 'נכון. רק הרכיב האנכי ניצב לתיל: $F = BIL = 3.0\cdot10^{-5}\cdot5\cdot2 = 3.0\cdot10^{-4}\,\text{N}$. הרכיב האופקי מקביל לתיל ולא תורם.'
    wrongFeedback: 'איזה רכיב של השדה ניצב לתיל? רק הוא מפעיל כוח, $F = BIL\sin\alpha$.'
    commonWrong:
      - value: 3.2e-4
        feedback: 'השתמשתם ברכיב האופקי. הוא מקביל לתיל, $\alpha = 0$, ולא מפעיל כוח. הכוח בא מהרכיב האנכי.'
      - value: 4.39e-4
        feedback: 'השתמשתם בגודל של כל השדה. רק הרכיב הניצב לתיל, האנכי, מפעיל כוח.'
      - value: 1.5e-4
        feedback: 'זה הכוח על מטר אחד. הקטע באורך $2\,\text{m}$.'

  - id: Q-4.11-electron-above
    type: vector
    objectives: [OBJ-4.11-4]
    qualitative: true
    allowOutIn: true
    prompt: >-
      הדף הוא מפה במבט מלמעלה: הצפון למעלה, המזרח מימין, ו"החוצה מהדף" (⊙) הוא כלפי מעלה, אל הצופה. בתיל ישר ואופקי בכיוון צפון–דרום זורם זרם צפונה. אלקטרון נע צפונה, במקביל לתיל, ישר **מעליו**. לאן פועל עליו הכוח המגנטי מהשדה של התיל?
    answer: out
    correctFeedback: 'נכון. מעל התיל השדה שלו פונה מזרחה (כלל יד ימין). לחלקיק חיובי שנע צפונה, כלל כף יד ימין נותן כוח כלפי מטה, אל התיל. לאלקטרון הכוח הפוך: כלפי מעלה, הרחק מהתיל, כמו תיל עם זרם הפוך (שיעור 4.9).'
    wrongFeedback: 'קודם מצאו את כיוון השדה של התיל מעליו, אחר כך השתמשו בכלל כף יד ימין, ואל תשכחו שהמטען שלילי.'
    wrong:
      - dir: in
        feedback: 'זה הכוח על חלקיק **חיובי**. לאלקטרון, מטען שלילי, הכוח הפוך: כלפי מעלה.'
      - dir: e
        feedback: 'מזרחה פונה השדה של התיל מעליו. הכוח המגנטי ניצב לשדה, ולא לאורכו.'
      - dir: 'n'
        feedback: 'צפונה נע האלקטרון. הכוח המגנטי ניצב למהירות, ולכן לא משנה את גודלה.'
      - dir: w
        feedback: 'הכוח ניצב גם למהירות (צפונה) וגם לשדה (מזרחה), ולכן הוא אנכי: כלפי מעלה או כלפי מטה.'
