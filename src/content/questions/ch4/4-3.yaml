# Lesson 4.3 question bank. Strings may hold $inline$ / $$display$$ TeX and **bold**; they are
# rendered at build time. YAML note: plain and single-quoted strings keep backslashes literally.
# Every number below was recomputed with src/physics/magnetism.ts and src/physics/coils.ts
# (loopCenterField, solenoidField, straightWireField, MU0); the script is recompute-4-3.ts in the
# session scratchpad. The data differ on purpose from figure 4.3א and the worked examples.

chapter: 4
questions:
  # ------------------------------------------------ OBJ-4.3-1: directions and poles
  - id: Q-4.3-loop-centre-dir
    type: vector
    objectives: [OBJ-4.3-1]
    qualitative: true
    allowOutIn: true
    prompt: >-
      כריכה עגולה מונחת במישור הדף, וזורם בה זרם **בכיוון השעון**, כפי שאתם רואים אותה. מה כיוון השדה המגנטי במרכז הכריכה?
    answer: in
    correctFeedback: 'נכון. מכופפים את אצבעות יד ימין בכיוון הזרם, עם כיוון השעון, והאגודל מצביע לתוך הדף (⊗). כל קטע של הכריכה תורם במרכז באותו כיוון.'
    wrong:
      - dir: out
        feedback: 'זה הכיוון כשהזרם נגד כיוון השעון. כופפו את אצבעות יד **ימין** עם כיוון השעון: האגודל פונה לתוך הדף.'
      - dir: e
        feedback: 'השדה של כל קטע בכריכה מקיף אותו, ובמרכז כל הקטעים תורמים בניצב למישור הכריכה. אין לשדה במרכז רכיב במישור הדף.'
        misconception: MC-coil-field-along-current
      - dir: n
        feedback: 'השדה במרכז אינו לאורך הזרם ואינו במישור הכריכה. לפי כלל יד ימין הוא ניצב לה.'
        misconception: MC-coil-field-along-current
      - dir: zero
        feedback: 'הקטעים שבצדדים מנוגדים של הכריכה נושאים זרם בכיוונים מנוגדים, אבל השדות שלהם במרכז **באותו** כיוון, ולכן הם מתחברים ולא מתבטלים.'
        misconception: MC-solenoid-axis-zero
    wrongFeedback: 'השתמשו בכלל יד ימין לכריכה: האצבעות המכופפות בכיוון הזרם, והאגודל מראה את השדה במרכז.'

  - id: Q-4.3-solenoid-north
    type: mc
    objectives: [OBJ-4.3-1]
    qualitative: true
    prompt: >-
      סליל מונח לאורך השולחן, משמאל לימין. כשמסתכלים עליו מהקצה **הימני**, הזרם בכריכות זורם **נגד כיוון השעון**. איזה קצה של הסליל הוא הקוטב הצפוני?
    choices:
      - text: 'הקצה הימני.'
        correct: true
        feedback: 'נכון. כופפו את אצבעות יד ימין נגד כיוון השעון, כפי שאתם רואים מימין: האגודל מצביע אליכם, ימינה. השדה בתוך הסליל מצביע ימינה ויוצא מהקצה הימני, וזה הקוטב הצפוני.'
      - text: 'הקצה השמאלי.'
        feedback: 'בדקו את היד: אצבעות יד ימין נגד כיוון השעון, והאגודל מצביע אל מי שמסתכל, כלומר ימינה. קווי השדה יוצאים מהקצה הימני, ושם הקוטב הצפוני.'
      - text: 'לסליל אין קטבים: הוא לא מגנט.'
        feedback: 'מחוץ לסליל השדה דומה לשדה של מגנט מוט. הקצה שממנו יוצאים קווי השדה מתנהג כקוטב צפוני, וקצה שהקווים נכנסים אליו כקוטב דרומי.'
      - text: 'שני הקצוות צפוניים, והאמצע דרומי.'
        feedback: 'קווי השדה סגורים: הם יוצאים מקצה אחד וחוזרים אל הקצה השני. לכן לסליל, כמו למגנט מוט, קצה צפוני אחד וקצה דרומי אחד.'

  - id: Q-4.3-compass-inside
    type: twotier
    objectives: [OBJ-4.3-1]
    qualitative: true
    prompt: >-
      בסליל ארוך זורם זרם, והקצה הימני שלו הוא הקוטב הצפוני. מכניסים מצפן קטן אל אמצע הסליל, על הציר. לאן יצביע הקוטב הצפוני של מחט המצפן?
    choices:
      - text: 'ימינה, אל הקצה הצפוני של הסליל.'
        correct: true
        feedback: נכון.
      - text: 'שמאלה, אל הקצה הדרומי של הסליל.'
        feedback: 'כך היה מחוץ לסליל, ליד אמצעו. בתוך הסליל השדה הפוך לשדה שבחוץ.'
        misconception: MC-compass-inside-solenoid
      - text: 'למעלה, ניצב לציר.'
        feedback: 'בתוך סליל ארוך השדה מקביל לציר, ולכן המחט מסתדרת לאורך הציר.'
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'קווי השדה סגורים: מחוץ לסליל הם הולכים מהקצה הצפוני אל הדרומי, ובתוכו הם ממשיכים מהדרומי אל הצפוני.'
        correct: true
        feedback: 'נכון. המחט מצביעה בכיוון השדה במקומה, ובתוך הסליל השדה מצביע אל הקצה הצפוני.'
      - text: 'הקוטב הצפוני של המחט תמיד נמשך אל הקוטב הדרומי הקרוב.'
        feedback: 'זה נכון ליד מגנט, מבחוץ. אבל המחט פשוט מסתדרת לאורך השדה, ובתוך הסליל השדה מצביע מהקצה הדרומי אל הצפוני.'
        misconception: MC-compass-inside-solenoid
      - text: 'בתוך הסליל השדה של הצד העליון מבטל את השדה של הצד התחתון, והמחט מסתובבת אל הכריכות.'
        feedback: 'בתוך הסליל השדות של הצד העליון (⊙) ושל הצד התחתון (⊗) באותו כיוון, לאורך הציר, והם מתחברים.'
        misconception: MC-solenoid-axis-zero

  # ------------------------------------------------ OBJ-4.3-2: B = μ₀NI/(2R)
  - id: Q-4.3-loop-B
    type: numeric
    objectives: [OBJ-4.3-2]
    prompt: >-
      סליל שטוח עשוי מ-20 כריכות צמודות ברדיוס של $5\,\text{cm}$, וזורם בו זרם של $2\,\text{A}$. מה עוצמת השדה המגנטי במרכזו? ענו במיליטסלה (mT).
    answer: 0.503
    unit: mT
    tolerance: 0.03
    correctFeedback: 'נכון. $B = \dfrac{\mu_0 N I}{2R} = \dfrac{4\pi\cdot10^{-7}\cdot20\cdot2}{2\cdot0.05} \approx 5.03\cdot10^{-4}\,\text{T} = 0.503\,\text{mT}$.'
    wrongFeedback: 'השתמשו ב-$B = \mu_0 N I/(2R)$, עם $R$ במטרים: $0.05\,\text{m}$.'
    commonWrong:
      - value: 0.0251
        feedback: 'שכחתם את מספר הכריכות. כל אחת מ-20 הכריכות תורמת את אותו שדה, ולכן כופלים ב-$N$.'
      - value: 0.251
        feedback: 'הצבתם $10\,\text{cm}$, הקוטר, במקום הרדיוס.'
      - value: 0.16
        feedback: 'השתמשתם בנוסחה של תיל ישר, כפול מספר הכריכות: $\mu_0 N I/(2\pi R)$. במרכז כריכה כל קטעי התיל קרובים לנקודה ותורמים באותו כיוון, והנוסחה היא $\mu_0 N I/(2R)$, בלי $\pi$ במכנה.'
      - value: 0.008
        feedback: 'השתמשתם בנוסחה של תיל ישר, $\mu_0 I/(2\pi r)$, כאילו יש תיל אחד במרחק $R$. במרכז כריכה כל קטעי התיל תורמים באותו כיוון, וכל אחת מ-20 הכריכות תורמת: $B = \mu_0 N I/(2R)$.'
      - value: 1.005
        feedback: 'שכחתם את ה-2 במכנה: $B = \mu_0 N I/(2R)$.'

  - id: Q-4.3-loop-find-I
    type: numeric
    objectives: [OBJ-4.3-2]
    level: mid
    prompt: >-
      רוצים שדה של $1.0\,\text{mT}$ במרכז סליל שטוח של 25 כריכות ברדיוס $5\,\text{cm}$. איזה זרם צריך? ענו באמפר.
    answer: 3.18
    unit: A
    tolerance: 0.03
    correctFeedback: 'נכון. מבודדים את $I$: $I = \dfrac{2RB}{\mu_0 N} = \dfrac{2\cdot0.05\cdot1.0\cdot10^{-3}}{4\pi\cdot10^{-7}\cdot25} \approx 3.18\,\text{A}$.'
    wrongFeedback: 'מ-$B = \mu_0 N I/(2R)$: כופלים ב-$2R$ ומחלקים ב-$\mu_0 N$.'
    commonWrong:
      - value: 1.59
        feedback: 'שכחתם את ה-2: $I = 2RB/(\mu_0 N)$.'
      - value: 79.6
        feedback: 'שכחתם לחלק במספר הכריכות. 25 כריכות מקטינות את הזרם הדרוש פי 25.'
      - value: 10
        feedback: 'השתמשתם בנוסחה של תיל ישר, $2\pi R B/(\mu_0 N)$. במרכז כריכה הנוסחה היא $B = \mu_0 N I/(2R)$.'

  - id: Q-4.3-loop-scaling
    type: mc
    objectives: [OBJ-4.3-2]
    qualitative: true
    level: mid
    prompt: >-
      מתיל באורך קבוע מכופפים כריכה אחת ברדיוס $R$, ומעבירים בה זרם $I$. אחר כך מכופפים את **אותו** תיל לשתי כריכות צמודות, ומעבירים בהן אותו זרם. פי כמה משתנה השדה במרכז?
    choices:
      - text: 'גדל פי 4.'
        correct: true
        feedback: 'נכון. אותו אורך תיל בשתי כריכות פירושו רדיוס $R/2$. $B = \mu_0 N I/(2R)$: $N$ גדל פי 2 ו-$R$ קטן פי 2, ולכן $B$ גדל פי 4.'
      - text: 'גדל פי 2.'
        feedback: 'ספרתם רק את מספר הכריכות. אבל שתי כריכות מאותו תיל קטנות יותר: הרדיוס שלהן חצי, וגם זה מכפיל את השדה.'
      - text: 'לא משתנה, כי זה אותו תיל ואותו זרם.'
        feedback: 'השדה במרכז תלוי בצורה: בכמה כריכות יש, וכמה קרוב התיל למרכז. שתי כריכות קטנות נותנות שדה גדול פי 4.'
      - text: 'קטן פי 2, כי כל כריכה קצרה יותר.'
        feedback: 'כריכה קטנה יותר נותנת דווקא שדה **גדול** יותר במרכזה, כי התיל קרוב יותר: $B \propto 1/R$.'

  - id: Q-4.3-rank-coils
    type: rank
    objectives: [OBJ-4.3-2]
    level: mid
    prompt: >-
      דרגו את ארבעת הסלילים השטוחים לפי עוצמת השדה במרכזם, מהגדול לקטן. אם שניים שווים, שימו אותם יחד.
    items:
      - id: a
        label: '10 כריכות, $2\,\text{A}$, רדיוס $5\,\text{cm}$'
      - id: b
        label: '20 כריכות, $1\,\text{A}$, רדיוס $10\,\text{cm}$'
      - id: c
        label: '5 כריכות, $4\,\text{A}$, רדיוס $2.5\,\text{cm}$'
      - id: d
        label: '40 כריכות, $1\,\text{A}$, רדיוס $10\,\text{cm}$'
    order: [c, [a, d], b]
    correctFeedback: 'נכון. $B \propto NI/R$: במטרים, ג נותן $20/0.025 = 800$, א ו-ד $20/0.05 = 40/0.1 = 400$, ו-ב $20/0.1 = 200$.'
    wrongFeedback: 'חשבו לכל סליל את $NI/R$, כי $B = \mu_0 N I/(2R)$ ו-$\mu_0/2$ משותף לכולם.'

  # ------------------------------------------------ OBJ-4.3-3: B = μ₀NI/L = μ₀nI
  - id: Q-4.3-solenoid-B
    type: numeric
    objectives: [OBJ-4.3-3]
    prompt: >-
      סליל ארוך באורך $40\,\text{cm}$ עשוי מ-800 כריכות, וזורם בו זרם של $1.5\,\text{A}$. מה עוצמת השדה המגנטי בתוכו? ענו במיליטסלה (mT).
    answer: 3.77
    unit: mT
    tolerance: 0.03
    correctFeedback: 'נכון. $B = \dfrac{\mu_0 N I}{L} = \dfrac{4\pi\cdot10^{-7}\cdot800\cdot1.5}{0.4} \approx 3.77\cdot10^{-3}\,\text{T}$. צפיפות הכריכות $n = 2000$ למטר.'
    wrongFeedback: 'השתמשו ב-$B = \mu_0 N I/L$, עם $L$ במטרים.'
    commonWrong:
      - value: 0.0377
        feedback: 'הצבתם את האורך בסנטימטרים, $40$ במקום $0.4\,\text{m}$.'
      - value: 1.885
        feedback: 'השתמשתם ב-$\mu_0 N I/(2L)$, כאילו זה מרכז של כריכה. בתוך סליל ארוך $B = \mu_0 N I/L$, בלי ה-2.'
      - value: 0.00471
        feedback: 'שכחתם את מספר הכריכות. השדה בסליל תלוי בצפיפות הכריכות, $n = N/L$.'
        misconception: MC-solenoid-length-irrelevant

  - id: Q-4.3-turn-density-I
    type: numeric
    objectives: [OBJ-4.3-3]
    level: mid
    prompt: >-
      סליל באורך $50\,\text{cm}$ עשוי מ-750 כריכות. איזה זרם צריך להעביר בו כדי שהשדה בתוכו יהיה $3.0\,\text{mT}$? ענו באמפר.
    answer: 1.59
    unit: A
    tolerance: 0.03
    correctFeedback: 'נכון. $n = 750/0.5 = 1500$ למטר, ו-$I = \dfrac{B}{\mu_0 n} = \dfrac{3.0\cdot10^{-3}}{4\pi\cdot10^{-7}\cdot1500} \approx 1.59\,\text{A}$.'
    wrongFeedback: 'חשבו קודם את צפיפות הכריכות, $n = N/L$, ואז $I = B/(\mu_0 n)$.'
    commonWrong:
      - value: 3.18
        feedback: 'הצבתם $N = 750$ במקום $n = N/L = 1500$ למטר. השדה תלוי בכריכות **למטר**.'
        misconception: MC-solenoid-length-irrelevant
      - value: 6.37
        feedback: 'כפלתם את $N$ באורך במקום לחלק בו. צפיפות הכריכות היא $n = N/L$.'

  - id: Q-4.3-solenoid-stretch
    type: mc
    objectives: [OBJ-4.3-3]
    qualitative: true
    prompt: >-
      סליל ארוך עשוי מקפיץ מתכת דק, שהכריכות שלו מבודדות. זורם בו זרם קבוע. מותחים את הקפיץ לאורך כפול. כל הכריכות נשארות, והזרם לא משתנה. מה קורה לשדה בתוך הסליל?
    choices:
      - text: 'קטן לחצי.'
        correct: true
        feedback: 'נכון. אותן $N$ כריכות על אורך כפול: צפיפות הכריכות $n = N/L$ קטנה לחצי, ו-$B = \mu_0 n I$.'
      - text: 'לא משתנה, כי מספר הכריכות לא השתנה.'
        feedback: 'השדה תלוי בכמה כריכות יש **בכל מטר**, לא במספר הכולל. במתיחה הכריכות מתרחקות זו מזו.'
        misconception: MC-solenoid-length-irrelevant
      - text: 'גדל פי 2, כי הסליל ארוך יותר.'
        feedback: 'אורך לבדו לא מחזק את השדה. $B = \mu_0 N I/L$: עם אותו $N$, אורך כפול נותן שדה חצי.'
      - text: 'קטן לרבע.'
        feedback: 'השדה תלוי באורך בחזקה ראשונה, $B = \mu_0 N I/L$, ולכן אורך כפול נותן חצי.'

  - id: Q-4.3-solenoid-wider
    type: mc
    objectives: [OBJ-4.3-3]
    qualitative: true
    level: mid
    prompt: >-
      לשני סלילים ארוכים אותו אורך, אותו מספר כריכות ואותו זרם, אבל הרדיוס של סליל ב' גדול פי 2 מהרדיוס של סליל א'. השוו את השדה באמצע סליל ב' לשדה באמצע סליל א'.
    choices:
      - text: 'השדה זהה.'
        correct: true
        feedback: 'נכון. בתוך סליל ארוך $B = \mu_0 n I$, ואין בנוסחה רדיוס. מה שקובע הוא כמה כריכות יש בכל מטר וכמה זרם זורם בהן.'
      - text: 'בסליל ב'' השדה חלש פי 2, כי הכריכות רחוקות פי 2 מהציר.'
        feedback: 'זה נכון למרכז של כריכה **אחת**, $B = \mu_0 N I/(2R)$. בסליל ארוך כל נקודה בפנים מוקפת כריכות משני הצדדים, והשדה הוא $\mu_0 n I$, בלי רדיוס.'
        misconception: MC-solenoid-radius-weakens
      - text: 'בסליל ב'' השדה חלש פי 4, כי שטח החתך גדול פי 4.'
        feedback: 'שטח החתך לא מופיע בשדה של סליל ארוך: $B = \mu_0 n I$.'
        misconception: MC-solenoid-radius-weakens
      - text: 'בסליל ב'' השדה חזק פי 2, כי כל כריכה ארוכה יותר.'
        feedback: 'הכריכות אמנם ארוכות יותר, אבל גם רחוקות יותר מהציר, ושתי ההשפעות מתקזזות. בסליל ארוך $B = \mu_0 n I$.'

  - id: Q-4.3-solenoid-uniform
    type: twotier
    objectives: [OBJ-4.3-3]
    qualitative: true
    prompt: >-
      בסליל ארוך זורם זרם. משווים את עוצמת השדה בשתי נקודות באמצע אורכו: P על הציר, ו-Q בתוך הסליל, קרוב לכריכות. מה נכון?
    choices:
      - text: 'השדה ב-P וב-Q כמעט שווה.'
        correct: true
        feedback: נכון.
      - text: 'השדה ב-Q חזק יותר, כי היא קרובה לתיל.'
        feedback: 'כך היה ליד תיל ישר אחד. בסליל, כשמתקרבים לכריכות בצד אחד מתרחקים מהכריכות שבצד השני.'
        misconception: MC-solenoid-strongest-near-winding
      - text: 'השדה ב-P אפס, כי שני הצדדים של הסליל מבטלים זה את זה.'
        feedback: 'על הציר השדות של הצד העליון ושל הצד התחתון באותו כיוון, ולכן הם מתחברים.'
        misconception: MC-solenoid-axis-zero
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'השדה בתוך סליל ארוך הוא $\mu_0 n I$ בכל נקודה רחוקה מהקצוות: מתקרבים לצד אחד ומתרחקים מהשני, והתרומות מתאזנות.'
        correct: true
        feedback: 'נכון. זה מה שראיתם באיור 4.3א כשגררתם את הגשש בתוך הסליל, וחוק אמפר מראה את זה בלי חישוב: השדה בצלע הפנימית של המלבן לא תלוי במרחק שלה מהציר.'
      - text: 'השדה של תיל חלש כמו $1/r$, ולכן הוא חזק ביותר ליד התיל.'
        feedback: 'זה נכון לתיל אחד. בסליל יש תילים משני הצדדים של כל נקודה בפנים, והשדות שלהם מתחברים לשדה כמעט אחיד.'
        misconception: MC-solenoid-strongest-near-winding
      - text: 'השדה במרכז הסליל אפס, ועולה ככל שמתקרבים לקצוות.'
        feedback: 'השדה באמצע סליל ארוך הוא הגדול ביותר: הוא יורד לחצי רק בקצוות.'
        misconception: MC-solenoid-axis-zero

  # ------------------------------------------------ OBJ-4.3-4: Ampère's law
  - id: Q-4.3-ampere-zero
    type: twotier
    objectives: [OBJ-4.3-4]
    qualitative: true
    prompt: >-
      בין שני תילים ארוכים ומקבילים, ניצבים לדף, משרטטים מסלול סגור שלא מקיף אף אחד מהם. מה אפשר לומר על השדה המגנטי בנקודות שעל המסלול?
    choices:
      - text: 'יש שדה בנקודות המסלול, אבל הסכום של $B_\parallel\,\Delta\ell$ סביב המסלול הוא אפס.'
        correct: true
        feedback: נכון.
      - text: 'השדה בכל נקודה על המסלול הוא אפס.'
        feedback: 'שני התילים יוצרים שדה בכל המרחב, גם על המסלול. אפס הוא רק **הסכום** סביב המסלול.'
        misconception: MC-ampere-zero-enclosed-zero-field
      - text: 'אי אפשר לדעת שום דבר, כי חוק אמפר עוסק רק בזרמים שבתוך המסלול.'
        feedback: 'חוק אמפר כן אומר משהו: הסכום סביב מסלול שלא מקיף זרם הוא אפס. השדה עצמו קיים ונקבע על ידי כל הזרמים.'
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'בחלק מהמסלול השדה בכיוון ההליכה, ובחלק נגדו, והתרומות מתקזזות.'
        correct: true
        feedback: 'נכון. באיור 4.3ב רואים את החיצים לאורך המסלול: בצד אחד הם בכיוון ההליכה ובצד השני נגדה.'
      - text: 'חוק אמפר אומר שכשהזרם הכלוא אפס, השדה אפס.'
        feedback: 'החוק מדבר על הסכום, לא על השדה בכל נקודה. סכום אפס יכול להתקבל מתרומות חיוביות ושליליות.'
        misconception: MC-ampere-zero-enclosed-zero-field
      - text: 'זרמים שמחוץ למסלול לא יוצרים שדה על המסלול.'
        feedback: 'כל זרם יוצר שדה בכל מקום. זרם חיצוני רק לא משנה את **הסכום**.'
        misconception: MC-ampere-outside-currents-count

  - id: Q-4.3-ampere-sum
    type: numeric
    objectives: [OBJ-4.3-4]
    level: mid
    prompt: >-
      שלושה תילים ארוכים ניצבים לדף. מסלול סגור, שהולכים לאורכו נגד כיוון השעון, מקיף תיל של $5\,\text{A}$ שיוצא מהדף (⊙) ותיל של $3\,\text{A}$ שנכנס לדף (⊗). תיל שלישי, של $10\,\text{A}$ שיוצא מהדף, נמצא מחוץ למסלול. מה הסכום של $B_\parallel\,\Delta\ell$ סביב המסלול? ענו ב-$\mu\text{T}\cdot\text{m}$.
    answer: 2.51
    unit: μT·m
    tolerance: 0.03
    correctFeedback: 'נכון. הזרם הכלוא $5 - 3 = 2\,\text{A}$ (כשהולכים נגד כיוון השעון, זרם שיוצא מהדף חיובי), והסכום $\mu_0\cdot2 = 4\pi\cdot10^{-7}\cdot2 \approx 2.51\cdot10^{-6}\,\text{T}\cdot\text{m}$.'
    wrongFeedback: 'סכמו רק את הזרמים שבתוך המסלול, עם סימנים, וכפלו ב-$\mu_0$.'
    commonWrong:
      - value: 15.08
        feedback: 'הוספתם את התיל של $10\,\text{A}$, שנמצא מחוץ למסלול. הוא משנה את השדה על המסלול, אבל לא את הסכום.'
        misconception: MC-ampere-outside-currents-count
      - value: 10.05
        feedback: 'חיברתם $5 + 3$. הזרם שנכנס לדף הפוך לזה שיוצא ממנו, ולכן הוא נספר בסימן מינוס.'
      - value: 22.6
        feedback: 'חיברתם את כל הזרמים, בלי סימנים, גם את זה שבחוץ. רק הזרם הכלוא נספר, עם סימן.'
        misconception: MC-ampere-outside-currents-count

  - id: Q-4.3-ampere-radius
    type: mc
    objectives: [OBJ-4.3-4]
    qualitative: true
    prompt: >-
      סביב תיל ישר ארוך משרטטים מעגל שמרכזו על התיל, ומחשבים את הסכום של $B_\parallel\,\Delta\ell$ סביבו. מחליפים אותו במעגל ברדיוס כפול. מה יקרה לסכום?
    choices:
      - text: 'לא ישתנה.'
        correct: true
        feedback: 'נכון. השדה על המעגל הגדול חלש פי 2 ($B \propto 1/r$), אבל ההיקף גדול פי 2. המכפלה $B\cdot2\pi r = \mu_0 I$ לא תלויה ב-$r$.'
      - text: 'יקטן לחצי, כי השדה חלש פי 2.'
        feedback: 'השדה אכן חלש פי 2, אבל המסלול ארוך פי 2, והסכום נשאר $\mu_0 I$.'
      - text: 'יגדל פי 2, כי המסלול ארוך פי 2.'
        feedback: 'המסלול ארוך פי 2, אבל השדה עליו חלש פי 2. המכפלה לא משתנה.'
      - text: 'יקטן לרבע, כי השדה יורד כמו $1/r^2$.'
        feedback: 'השדה של תיל ישר יורד כמו $1/r$, לא $1/r^2$ (שיעור 4.2). והסכום בכל מקרה $\mu_0 I$.'

  - id: Q-4.3-ampere-solenoid
    type: mc
    objectives: [OBJ-4.3-4, OBJ-4.3-3]
    qualitative: true
    level: bagrut
    prompt: >-
      כדי למצוא את השדה בתוך סליל ארוך, משרטטים מלבן: צלע אחת שלו, באורך $\ell$, בתוך הסליל ומקבילה לציר, הצלע שמולה מחוץ לסליל, ושתי הצלעות האחרות ניצבות לציר וחוצות את הכריכות. מאיזו צלע מגיע כמעט כל הסכום של $B_\parallel\,\Delta\ell$?
    choices:
      - text: 'מהצלע שבתוך הסליל: שם השדה חזק ולאורך הצלע.'
        correct: true
        feedback: 'נכון. בחוץ השדה כמעט אפס, ובצלעות הניצבות השדה שבפנים ניצב לצלע ($B_\parallel = 0$). לכן $B\ell = \mu_0 n\ell I$, ו-$B = \mu_0 n I$.'
      - text: 'מהצלעות הניצבות, כי הן חוצות את הכריכות.'
        feedback: 'בתוך הסליל השדה מקביל לציר, כלומר ניצב לצלעות האלה: $B_\parallel = 0$ שם. מה שהן חוצות קובע את הזרם הכלוא, לא את הסכום שלהן.'
      - text: 'מהצלע שבחוץ, כי שם הקווים חוזרים.'
        feedback: 'בחוץ הקווים מתפזרים על שטח עצום, ולכן השדה שם חלש מאוד, כמעט אפס.'
      - text: 'משתי הצלעות המקבילות לציר בשווה.'
        feedback: 'השדה בחוץ חלש פי עשרות ויותר מהשדה בפנים. כמעט כל הסכום בא מהצלע הפנימית.'

  - id: Q-4.3-ampere-wire-B
    type: numeric
    objectives: [OBJ-4.3-4]
    level: mid
    prompt: >-
      בתיל ישר ארוך זורם זרם של $10\,\text{A}$. השתמשו בחוק אמפר עם מעגל שמרכזו על התיל כדי למצוא את השדה במרחק $4\,\text{cm}$ מהתיל. ענו במיקרוטסלה (μT).
    answer: 50
    unit: μT
    tolerance: 0.03
    correctFeedback: 'נכון. על המעגל השדה משיק ובגודל קבוע, ולכן הסכום הוא $B\cdot2\pi r = \mu_0 I$, ו-$B = \dfrac{\mu_0 I}{2\pi r} = \dfrac{4\pi\cdot10^{-7}\cdot10}{2\pi\cdot0.04} = 5\cdot10^{-5}\,\text{T}$.'
    wrongFeedback: 'הסכום סביב המעגל הוא השדה כפול ההיקף, $B\cdot2\pi r$. השוו אותו ל-$\mu_0 I$.'
    commonWrong:
      - value: 2500
        feedback: 'חילקתם בשטח העיגול, $\pi r^2$. בחוק אמפר כופלים את השדה באורך המסלול, ההיקף $2\pi r$.'
      - value: 314
        feedback: 'שכחתם את $2\pi$: אורך המסלול הוא $2\pi r$, לא $r$.'
