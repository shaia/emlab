# Lesson 4.8 question bank. Strings may hold $inline$ / $$display$$ TeX and **bold**; they are
# rendered at build time. YAML note: plain and single-quoted strings keep backslashes literally.
# Every number below was recomputed with src/physics/magnetism.ts (parallelWiresForce,
# straightWireField) and src/physics/wires.ts (netForcePerLength, pairForcePerLength); script
# q.ts in the session scratchpad. The data differ on purpose from figure 4.8א and the worked examples.

chapter: 4
questions:
  # ------------------------------------------------ OBJ-4.8-1: direction, attraction and repulsion
  - id: Q-4.8-same-direction
    type: twotier
    objectives: [OBJ-4.8-1]
    qualitative: true
    prompt: >-
      שני תילים ארוכים ומקבילים תלויים אנכית זה ליד זה, ובשניהם זורם זרם כלפי מעלה. מה יקרה לתילים?
    choices:
      - text: 'הם יתקרבו זה לזה.'
        correct: true
        feedback: 'נכון. זרמים באותו כיוון נמשכים.'
      - text: 'הם יתרחקו זה מזה.'
        feedback: 'זה מה שהיה קורה לשני מטענים מאותו סימן. בזרמים זה הפוך: זרמים באותו כיוון נמשכים.'
        misconception: MC-like-currents-repel
      - text: 'הם יישארו במקומם, כי הכוחות על שני התילים מבטלים זה את זה.'
        feedback: 'שני הכוחות אכן שווים והפוכים, אבל הם פועלים על **תילים שונים**, ולכן אינם מבטלים זה את זה. כל תיל זז לעבר השני.'
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'כל תיל נמצא בשדה המגנטי של התיל השני, והכוח על זרם בשדה הזה, לפי כלל כף יד ימין, מצביע לעבר התיל השני.'
        correct: true
        feedback: 'נכון. כלל יד ימין נותן את כיוון השדה של תיל 1 במקום תיל 2, וכלל כף יד ימין נותן כוח לעבר תיל 1.'
      - text: 'זרמים זהים הם כמו מטענים זהים, ולכן הם דוחים זה את זה.'
        feedback: 'זו אנלוגיה מטעה. הכוח בין זרמים הוא מגנטי, וכיוונו נקבע מכלל כף יד ימין: זרמים באותו כיוון נמשכים.'
        misconception: MC-like-currents-repel
      - text: 'הזרם משאיר על התילים מטען, והכוח החשמלי מושך אותם.'
        feedback: 'תיל עם זרם נשאר ניטרלי: בכל קטע יש בו כמה אלקטרונים שיש יונים חיוביים. הכוח מגנטי, ולכן הוא מתהפך כשהופכים זרם.'
        misconception: MC-wires-attract-charged

  - id: Q-4.8-force-direction
    type: vector
    objectives: [OBJ-4.8-1]
    qualitative: true
    allowOutIn: true
    prompt: >-
      שני תילים ארוכים ומקבילים ניצבים לדף. תיל K נמצא משמאל, והזרם בו יוצא מהדף (⊙). תיל M נמצא מימינו, והזרם בו נכנס לדף (⊗). מה כיוון הכוח על תיל M?
    answer: e
    correctFeedback: 'נכון. השדה של K במקום M מצביע למעלה (כלל יד ימין, נגד כיוון השעון סביב ⊙). כלל כף יד ימין על M: האצבעות למעלה, האגודל לתוך הדף, וכף היד פונה ימינה, הרחק מ-K. זרמים בכיוונים מנוגדים נדחים.'
    wrong:
      - dir: w
        feedback: 'זה כיוון של משיכה, לעבר K. זרמים בכיוונים מנוגדים **דוחים** זה את זה, הפוך ממטענים מנוגדים.'
        misconception: MC-like-currents-repel
      - dir: n
        feedback: 'זה כיוון **השדה** של K במקום M. הכוח המגנטי ניצב לשדה: הפעילו את כלל כף יד ימין.'
      - dir: in
        feedback: 'זה כיוון הזרם ב-M. הכוח על תיל ניצב לתיל, ולכן לעולם לא לאורכו.'
    wrongFeedback: 'קודם מצאו את כיוון השדה של K במקום M בכלל יד ימין, ואחר כך את הכוח על M בכלל כף יד ימין.'

  - id: Q-4.8-field-direction
    type: vector
    objectives: [OBJ-4.8-1]
    qualitative: true
    allowOutIn: true
    prompt: >-
      שני תילים ארוכים ומקבילים ניצבים לדף. בתיל A, משמאל, הזרם נכנס לדף (⊗). תיל B נמצא מימינו. מה כיוון השדה המגנטי של תיל A במקום שבו נמצא תיל B?
    answer: s
    correctFeedback: 'נכון. האגודל לתוך הדף, והאצבעות המכופפות מסתובבות עם כיוון השעון. מימין לתיל, תנועה עם כיוון השעון היא למטה. זה השדה שקובע את הכוח על B.'
    wrong:
      - dir: n
        feedback: 'זה הכיוון של זרם שיוצא מהדף. כשהזרם נכנס לדף (⊗), השדה מסתובב עם כיוון השעון.'
      - dir: e
        feedback: 'השדה של תיל ישר לא יוצא ממנו כמו קרניים. הוא מסתובב במעגלים סביבו, ולכן במקום B הוא ניצב לקו שמחבר את התילים.'
      - dir: in
        feedback: 'זה כיוון הזרם, לא השדה. השדה מסתובב סביב התיל, במישור הדף.'
    wrongFeedback: 'אחזו בדמיון את תיל A ביד ימין, האגודל בכיוון הזרם. לאן מצביעות האצבעות מימין לתיל?'

  - id: Q-4.8-why-not-electric
    type: mc
    objectives: [OBJ-4.8-1]
    qualitative: true
    prompt: >-
      תלמידה טוענת שתילים עם זרם מושכים זה את זה כי יש עליהם מטען חשמלי. איזו תצפית מראה שהיא טועה?
    choices:
      - text: 'כשהופכים את הזרם באחד התילים, המשיכה הופכת לדחייה.'
        correct: true
        feedback: 'נכון. כוח חשמלי בין גופים תלוי במטען שלהם, לא בכיוון שבו המטען זז בתוכם. כוח שמתהפך עם כיוון הזרם הוא מגנטי.'
      - text: 'התילים עשויים מתכת, ומתכת מוליכה חשמל.'
        feedback: 'זה נכון, אבל לא מכריע. גם מוטות מתכת יכולים להיות טעונים. התצפית צריכה להבחין בין כוח חשמלי למגנטי.'
        misconception: MC-wires-attract-charged
      - text: 'הכוח בין התילים גדל כשמקרבים אותם.'
        feedback: 'גם כוח חשמלי גדל כשמקרבים. התצפית הזאת לא מבחינה בין שני ההסברים.'
        misconception: MC-wires-attract-charged
      - text: 'התילים נמשכים רק כשהזרמים שווים.'
        feedback: 'זה לא נכון: גם זרמים שונים מושכים זה את זה, אם הם באותו כיוון.'
    explanation: 'תיל שזורם בו זרם ניטרלי: בכל קטע שלו יש בדיוק כמה אלקטרונים חופשיים שיש יונים חיוביים. הכוח בין תילים כאלה מגנטי.'

  # ------------------------------------------------ OBJ-4.8-2: F/L = μ₀I₁I₂/(2πd)
  - id: Q-4.8-force-per-length
    type: numeric
    objectives: [OBJ-4.8-2]
    prompt: >-
      בשני תילים ארוכים ומקבילים, במרחק $3\,\text{cm}$ זה מזה, זורמים $6\,\text{A}$ ו-$15\,\text{A}$. מה גודל הכוח על כל מטר של אחד התילים? ענו בניוטון למטר.
    answer: 6.0e-4
    unit: N/m
    tolerance: 0.03
    correctFeedback: 'נכון. $\dfrac{F}{L} = \dfrac{\mu_0 I_1 I_2}{2\pi d} = \dfrac{4\pi\cdot10^{-7}\cdot6\cdot15}{2\pi\cdot0.03} = 6\cdot10^{-4}\,\text{N/m}$.'
    wrongFeedback: 'הציבו ב-$\dfrac{F}{L} = \dfrac{\mu_0 I_1 I_2}{2\pi d}$, עם המרחק במטרים.'
    commonWrong:
      - value: 6.0e-6
        feedback: 'הצבתם את המרחק בסנטימטרים, $d = 3$. במטרים $d = 0.03$, והכוח גדול פי 100.'
      - value: 3.77e-3
        feedback: 'שכחתם את $2\pi$ במכנה: $\mu_0 I_1 I_2/d$. הנוסחה היא $\dfrac{\mu_0 I_1 I_2}{2\pi d}$.'
      - value: 0.02
        feedback: 'חילקתם בריבוע המרחק, כמו בחוק קולון. הכוח בין תילים יורד כמו $1/d$, כי השדה של תיל ארוך יורד כמו $1/r$.'
        misconception: MC-parallel-wires-inverse-square
      - value: 4.0e-5
        feedback: 'חישבתם רק את השדה של התיל הראשון במקום השני, $B_1$. את השדה צריך לכפול בזרם של התיל השני: $\dfrac{F}{L} = B_1I_2$.'

  - id: Q-4.8-segment-force
    type: numeric
    objectives: [OBJ-4.8-2]
    level: mid
    prompt: >-
      שני תילים ישרים ומקבילים, כל אחד באורך $2\,\text{m}$, נמצאים במרחק $1\,\text{cm}$ זה מזה. בשניהם זורם $25\,\text{A}$, בכיוונים מנוגדים. מה גודל הכוח על כל אחד מהתילים? ענו בניוטון.
    answer: 0.025
    unit: N
    tolerance: 0.03
    correctFeedback: 'נכון. $\dfrac{F}{L} = \dfrac{4\pi\cdot10^{-7}\cdot25\cdot25}{2\pi\cdot0.01} = 1.25\cdot10^{-2}\,\text{N/m}$, ועל $2\,\text{m}$: $F = 2.5\cdot10^{-2}\,\text{N}$. הזרמים מנוגדים, ולכן התילים נדחים.'
    wrongFeedback: 'חשבו קודם את הכוח על כל מטר, ואז כפלו באורך.'
    commonWrong:
      - value: 0.0125
        feedback: 'זה הכוח על **כל מטר**. התיל ארוך $2\,\text{m}$, ולכן הכוח עליו כפול.'
      - value: 2.5e-4
        feedback: 'הצבתם את המרחק בסנטימטרים. $d = 0.01\,\text{m}$.'
      - value: 0.001
        feedback: 'השתמשתם בזרם אחד בלבד. בנוסחה מופיעים שני הזרמים: $25\cdot25$.'

  - id: Q-4.8-double-distance
    type: mc
    objectives: [OBJ-4.8-2]
    qualitative: true
    prompt: >-
      בין שני תילים ארוכים ומקבילים, במרחק $4\,\text{cm}$, פועל כוח $F$ על כל מטר. מרחיקים את התילים ל-$8\,\text{cm}$, בלי לשנות את הזרמים. מה הכוח עכשיו על כל מטר?
    choices:
      - text: '$F/2$'
        correct: true
        feedback: 'נכון. $\dfrac{F}{L}$ פרופורציוני הפוך ל-$d$: מרחק כפול, כוח חצי.'
      - text: '$F/4$'
        feedback: 'זה היה נכון לשני מטענים נקודתיים (חוק קולון). השדה של תיל ארוך יורד כמו $1/r$, ולכן הכוח בין תילים יורד כמו $1/d$.'
        misconception: MC-parallel-wires-inverse-square
      - text: '$F$, כי הזרמים לא השתנו.'
        feedback: 'במרחק גדול יותר השדה של כל תיל במקום התיל האחר חלש יותר, ולכן גם הכוח.'
      - text: '$2F$'
        feedback: 'המרחק נמצא במכנה. ככל שהתילים רחוקים יותר, הכוח קטן יותר.'

  - id: Q-4.8-rank
    type: rank
    objectives: [OBJ-4.8-2]
    qualitative: true
    level: mid
    prompt: >-
      דרגו את הכוח על כל מטר של תיל בארבעה זוגות של תילים ארוכים ומקבילים, מהחזק לחלש:
    items:
      - id: A
        label: 'זוג A: זרמים $I$ ו-$I$, מרחק $d$'
      - id: B
        label: 'זוג B: זרמים $2I$ ו-$I$, מרחק $2d$'
      - id: C
        label: 'זוג C: זרמים $2I$ ו-$2I$, מרחק $d$'
      - id: D
        label: 'זוג D: זרמים $I$ ו-$3I$, מרחק $2d$'
    order: [C, D, [A, B]]
    correctFeedback: >-
      נכון. נסמן $F_0 = \dfrac{\mu_0 I^2}{2\pi d}$: A הוא $F_0$, B הוא $\dfrac{2}{2}F_0 = F_0$, C הוא $4F_0$, ו-D הוא $\dfrac{3}{2}F_0$.
    wrongFeedback: 'כתבו כל כוח כמכפלה של $F_0 = \dfrac{\mu_0 I^2}{2\pi d}$: מכפילים את שני הזרמים ומחלקים במרחק (לא בריבוע שלו).'

  - id: Q-4.8-find-current
    type: numeric
    objectives: [OBJ-4.8-2]
    level: bagrut
    prompt: >-
      בשני תילים ארוכים ומקבילים, במרחק $5\,\text{cm}$ זה מזה, זורמים זרמים באותו כיוון. בתיל 1 זורם $4\,\text{A}$, והתילים מושכים זה את זה בכוח של $1.2\cdot10^{-4}\,\text{N}$ על כל מטר. מה הזרם בתיל 2? ענו באמפר.
    answer: 7.5
    unit: A
    tolerance: 0.03
    correctFeedback: 'נכון. מבודדים את $I_2$: $I_2 = \dfrac{2\pi d}{\mu_0 I_1}\cdot\dfrac{F}{L} = \dfrac{2\pi\cdot0.05\cdot1.2\cdot10^{-4}}{4\pi\cdot10^{-7}\cdot4} = 7.5\,\text{A}$.'
    wrongFeedback: 'כפלו את שני האגפים של $\dfrac{F}{L} = \dfrac{\mu_0 I_1 I_2}{2\pi d}$ ב-$2\pi d$, וחלקו ב-$\mu_0 I_1$.'
    commonWrong:
      - value: 750
        feedback: 'הצבתם את המרחק בסנטימטרים. $d = 0.05\,\text{m}$.'
      - value: 0.375
        feedback: 'הצבתם $d^2$ במקום $d$. הכוח בין תילים פרופורציוני הפוך למרחק, לא לריבועו.'
        misconception: MC-parallel-wires-inverse-square
      - value: 0.133
        feedback: 'הפכתם את השבר: חילקתם את $\mu_0 I_1$ ב-$2\pi d\cdot\dfrac{F}{L}$. בדקו את בידוד $I_2$.'

  # ------------------------------------------------ OBJ-4.8-3: Newton's third law, superposition
  - id: Q-4.8-unequal
    type: twotier
    objectives: [OBJ-4.8-3]
    qualitative: true
    prompt: >-
      הזרם בתיל 1 גדול פי 3 מהזרם בתיל 2. התילים ארוכים ומקבילים. איזה מהמשפטים נכון?
    choices:
      - text: 'הכוח שתיל 1 מפעיל על תיל 2 שווה בגודלו לכוח שתיל 2 מפעיל על תיל 1.'
        correct: true
        feedback: 'נכון.'
      - text: 'הכוח שתיל 1 מפעיל על תיל 2 גדול פי 3.'
        feedback: 'תיל 1 אכן יוצר שדה חזק פי 3, אבל השדה הזה פועל על זרם קטן פי 3. הכוחות שווים.'
        misconception: MC-larger-current-larger-force
      - text: 'הכוח שתיל 1 מפעיל על תיל 2 גדול פי 9.'
        feedback: 'אין כאן ריבוע, ובעצם אין כאן הבדל בכלל: הכוחות על שני התילים שווים.'
        misconception: MC-larger-current-larger-force
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'בנוסחה $\dfrac{F}{L} = \dfrac{\mu_0 I_1 I_2}{2\pi d}$ שני הזרמים מופיעים כמכפלה, ולכן אותו ביטוי מתאים לשני התילים.'
        correct: true
        feedback: 'נכון. זה החוק השלישי של ניוטון: שדה חזק על זרם קטן שווה לשדה חלש על זרם גדול.'
      - text: 'זרם גדול יוצר שדה חזק, ולכן הוא דוחף חזק יותר.'
        feedback: 'השדה של תיל 1 לא פועל על תיל 1 עצמו. על כל תיל פועל השדה של התיל **השני**, כפול הזרם של התיל עצמו.'
        misconception: MC-larger-current-larger-force
      - text: 'על כל תיל פועל השדה הכולל במקומו, כולל השדה של עצמו.'
        feedback: 'תיל לא נדחף בשדה של עצמו: הכוחות שהשדה הזה מפעיל על חלקי התיל מבטלים זה את זה. על תיל 2 פועל רק השדה של תיל 1.'
        misconception: MC-wire-own-field-force

  - id: Q-4.8-unequal-numeric
    type: numeric
    objectives: [OBJ-4.8-3]
    level: mid
    prompt: >-
      בתיל 1 זורם $12\,\text{A}$, ובתיל 2, שמקביל לו, זורם $4\,\text{A}$. השדה של תיל 1 במקום שבו נמצא תיל 2 הוא $6\cdot10^{-5}\,\text{T}$. מה הכוח על כל מטר של **תיל 1**? ענו בניוטון למטר.
    answer: 2.4e-4
    unit: N/m
    tolerance: 0.03
    correctFeedback: 'נכון. על תיל 2 פועל $B_1I_2 = 6\cdot10^{-5}\cdot4 = 2.4\cdot10^{-4}\,\text{N/m}$, ולפי החוק השלישי של ניוטון זה גם הכוח על תיל 1. (בדיקה: המרחק הוא $4\,\text{cm}$, והשדה של תיל 2 במקום תיל 1 הוא $2\cdot10^{-5}\,\text{T}$; $2\cdot10^{-5}\cdot12$ נותן את אותו כוח.)'
    wrongFeedback: 'השדה הנתון פועל על תיל 2. חשבו את הכוח על תיל 2, ואז השתמשו בחוק השלישי של ניוטון.'
    commonWrong:
      - value: 7.2e-4
        feedback: 'כפלתם את השדה של תיל 1 בזרם של תיל 1. תיל לא נדחף בשדה של עצמו: השדה של תיל 1 פועל על הזרם של תיל 2.'
        misconception: MC-wire-own-field-force
      - value: 8.0e-5
        feedback: 'הקטנתם את הכוח על תיל 1 פי 3, כי הזרם שלו גדול פי 3. הכוחות על שני התילים שווים.'
        misconception: MC-larger-current-larger-force

  - id: Q-4.8-own-field
    type: mc
    objectives: [OBJ-4.8-3]
    qualitative: true
    prompt: >-
      שני תילים ארוכים ומקבילים. כדי לחשב את הכוח על תיל 2 בעזרת $F = BIL$, איזה שדה מציבים?
    choices:
      - text: 'את השדה של תיל 1 במקום שבו נמצא תיל 2.'
        correct: true
        feedback: 'נכון. תיל 2 הוא זרם בשדה של תיל 1.'
      - text: 'את השדה הכולל של שני התילים במקום שבו נמצא תיל 2.'
        feedback: 'השדה של תיל 2 עצמו לא מפעיל עליו כוח שקול. מציבים רק את השדה של התילים האחרים.'
        misconception: MC-wire-own-field-force
      - text: 'את השדה של תיל 2 במקום שבו נמצא תיל 1.'
        feedback: 'זה השדה שדוחף את **תיל 1**. על תיל 2 פועל השדה של תיל 1.'
        misconception: MC-wire-own-field-force
      - text: 'את השדה באמצע הדרך בין התילים.'
        feedback: 'הכוח פועל על הזרם בתיל 2, ולכן צריך את השדה במקום שבו תיל 2 נמצא.'

  - id: Q-4.8-three-line
    type: numeric
    objectives: [OBJ-4.8-3]
    level: bagrut
    prompt: >-
      שלושה תילים ארוכים ומקבילים נמצאים בשורה: תיל A, תיל B במרחק $5\,\text{cm}$ מימינו, ותיל C במרחק $10\,\text{cm}$ מימין ל-B. בשלושתם הזרם באותו כיוון: $10\,\text{A}$ ב-A, $5\,\text{A}$ ב-B ו-$30\,\text{A}$ ב-C. מה גודל הכוח השקול על כל מטר של תיל B? ענו בניוטון למטר.
    answer: 1.0e-4
    unit: N/m
    tolerance: 0.03
    correctFeedback: 'נכון. A מושך את B שמאלה: $2\cdot10^{-7}\cdot\dfrac{10\cdot5}{0.05} = 2\cdot10^{-4}\,\text{N/m}$. C מושך את B ימינה: $2\cdot10^{-7}\cdot\dfrac{30\cdot5}{0.10} = 3\cdot10^{-4}\,\text{N/m}$. השקול: $1\cdot10^{-4}\,\text{N/m}$ ימינה, לעבר C.'
    wrongFeedback: 'חשבו כל כוח לחוד, קבעו לאן הוא מושך, וחברו כווקטורים: כאן הם על אותו קו, בכיוונים מנוגדים.'
    commonWrong:
      - value: 5.0e-4
        feedback: 'חיברתם את הגדלים. שני הכוחות מושכים את B לכיוונים מנוגדים, לעבר A ולעבר C, ולכן מחסירים.'
      - value: 3.0e-4
        feedback: 'זה רק הכוח של C. גם A מושך את B, בכיוון ההפוך.'

  - id: Q-4.8-three-direction
    type: vector
    objectives: [OBJ-4.8-3]
    qualitative: true
    allowOutIn: true
    prompt: >-
      שלושה תילים ארוכים ומקבילים ניצבים לדף, בשורה אופקית ובמרווחים שווים: A משמאל, B באמצע, C מימין. בשלושתם אותו זרם בגודלו; ב-A וב-C הזרם יוצא מהדף (⊙), וב-B הוא נכנס לדף (⊗). מה כיוון הכוח השקול על תיל C?
    answer: e
    correctFeedback: 'נכון. B דוחה את C ימינה (זרמים מנוגדים), ו-A מושך את C שמאלה (אותו כיוון). B קרוב פי 2, ולכן הכוח שלו גדול פי 2, והשקול ימינה.'
    wrong:
      - dir: w
        feedback: 'בדקו את הכוח של B: הזרמים ב-B וב-C מנוגדים, ולכן B **דוחה** את C, ימינה. והוא קרוב יותר מ-A.'
        misconception: MC-like-currents-repel
      - dir: zero
        feedback: 'הכוחות על C לא שווים: B נמצא במרחק חצי מ-A, ולכן הכוח שלו כפול. (על B, באמצע, השקול אכן אפס.)'
      - dir: in
        feedback: 'הכוח בין תילים מקבילים פועל במישור הדף, לאורך הקו שמחבר אותם, לא לאורך התיל.'
    wrongFeedback: 'מצאו לחוד את הכוח של A על C ואת הכוח של B על C: כיוון (משיכה או דחייה) וגודל יחסי (לפי המרחק).'

  # ------------------------------------------------ OBJ-4.8-4: the ampere
  - id: Q-4.8-ampere-historic
    type: mc
    objectives: [OBJ-4.8-4]
    prompt: >-
      לפי ההגדרה ההיסטורית של האמפר, מה הכוח על כל מטר של תיל, כשבשני תילים ארוכים מאוד, במרחק מטר זה מזה בריק, זורם אמפר אחד?
    choices:
      - text: '$2\cdot10^{-7}\,\text{N}$'
        correct: true
        feedback: 'נכון. $\dfrac{\mu_0\cdot1\cdot1}{2\pi\cdot1} = 2\cdot10^{-7}\,\text{N/m}$, ולכן ההגדרה קבעה $\mu_0 = 4\pi\cdot10^{-7}$ בדיוק.'
      - text: '$4\pi\cdot10^{-7}\,\text{N}$'
        feedback: 'זה $\mu_0$. בנוסחה מחלקים אותו ב-$2\pi d$.'
      - text: '$1\,\text{N}$'
        feedback: 'הכוח בין תילים בזרמים רגילים זעיר. ניוטון אחד בין תילים במרחק מטר ידרוש זרם של יותר מאלפיים אמפר.'
      - text: '$1.6\cdot10^{-19}\,\text{N}$'
        feedback: 'זה גודל המטען היסודי בקולון, לא כוח. בהגדרה החדשה, מאז 2019, קובעים את $e$.'

  - id: Q-4.8-ampere-2019
    type: mc
    objectives: [OBJ-4.8-4]
    qualitative: true
    prompt: >-
      על מה מבוססת ההגדרה של האמפר שבתוקף מאז 2019?
    choices:
      - text: 'על ערך מדויק וקבוע של המטען היסודי $e$: אמפר הוא זרם שבו עוברים $1/e$ מטענים יסודיים בכל שנייה.'
        correct: true
        feedback: 'נכון. מאז 20 במאי 2019, $e = 1.602176634\cdot10^{-19}\,\text{C}$ בדיוק, ו-$\mu_0$ הפך לגודל שמודדים.'
      - text: 'על הכוח בין שני תילים במרחק מטר, כמו קודם.'
        feedback: 'זו ההגדרה ההיסטורית, שהייתה בתוקף מ-1948 עד 2019. ההגדרה החדשה קובעת את $e$.'
      - text: 'על ערך מדויק של $\mu_0$, שנקבע כ-$4\pi\cdot10^{-7}$.'
        feedback: 'זה היה נכון לפני 2019, כתוצאה מההגדרה ההיסטורית. היום $\mu_0$ נמדד, וערכו כמעט בדיוק $4\pi\cdot10^{-7}$.'
      - text: 'על הזרם שסוללה סטנדרטית מספקת בקצר.'
        feedback: 'זרם הקצר תלוי בהתנגדות הפנימית של הסוללה (שיעור 3.6), שמשתנה מסוללה לסוללה. אי אפשר לבסס עליו יחידה.'

  - id: Q-4.8-charges-per-second
    type: numeric
    objectives: [OBJ-4.8-4]
    prompt: >-
      בנורית קטנה זורם זרם של $0.8\,\text{mA}$. כמה מטענים יסודיים עוברים בה בכל שנייה? השתמשו ב-$e = 1.6\cdot10^{-19}\,\text{C}$.
    answer: 5.0e15
    unit: ''
    tolerance: 0.03
    correctFeedback: 'נכון. בשנייה עובר מטען $q = It = 8\cdot10^{-4}\,\text{C}$, ומספר המטענים היסודיים הוא $\dfrac{8\cdot10^{-4}}{1.6\cdot10^{-19}} = 5\cdot10^{15}$.'
    wrongFeedback: 'מצאו את המטען שעובר בשנייה, $q = It$, וחלקו במטען היסודי.'
    commonWrong:
      - value: 5.0e18
        feedback: 'הצבתם $0.8\,\text{A}$ במקום $0.8\,\text{mA}$. מיליאמפר הוא $10^{-3}\,\text{A}$.'
      - value: 1.28e-22
        feedback: 'כפלתם במטען היסודי במקום לחלק בו. מספר המטענים הוא $q/e$, מספר גדול מאוד.'
