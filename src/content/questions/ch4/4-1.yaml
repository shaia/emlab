# Lesson 4.1 question bank. Strings may hold $inline$ / $$display$$ TeX and **bold**; they are
# rendered at build time. YAML note: plain and single-quoted strings keep backslashes literally.
# Every number below was recomputed with src/physics/magnets.ts (deflectionFromNorth, sumOfTwo) and
# EARTH_B_HORIZONTAL from magnetism.ts. The data differ on purpose from figure 4.1ב and the worked
# examples, so a learner cannot answer from memory.

chapter: 4
questions:
  # ------------------------------------------------ OBJ-4.1-1: poles, pairs, materials
  - id: Q-4.1-break
    type: mc
    objectives: [OBJ-4.1-1]
    qualitative: true
    prompt: >-
      חותכים מגנט מוט לשלושה חלקים שווים. מה נכון לגבי החלק האמצעי?
    choices:
      - text: 'יש לו קוטב צפוני בקצה אחד וקוטב דרומי בקצה השני: הוא מגנט שלם.'
        correct: true
        feedback: 'נכון. כל חתיכה של מגנט היא מגנט שלם עם שני קטבים. במקומות החיתוך נוצרים קטבים חדשים, וקוטב בודד לא נוצר אף פעם.'
      - text: 'אין לו קטבים בכלל, כי הקטבים נשארו בחלקים הקיצוניים.'
        feedback: 'הקטבים אינם "חומר" שיושב בקצוות. כל חתיכה של המגנט ממוגנטת, ולכן גם לחלק האמצעי יש קוטב צפוני וקוטב דרומי. באיור 4.1א, אחרי השבירה, לכל חצי יש N ו-S.'
        misconception: MC-break-magnet-separates-poles
      - text: 'יש לו רק קוטב צפוני, אם הוא נחתך מהצד הצפוני של המרכז.'
        feedback: 'אי אפשר לקבל קוטב בודד. גם חתיכה שנחתכה ליד הקצה הצפוני היא מגנט שלם, עם N בקצה אחד ו-S בקצה השני.'
        misconception: MC-break-magnet-separates-poles
      - text: 'הוא כבר לא מגנט, כי החיתוך הורס את המגנטיות.'
        feedback: 'חיתוך לא מבטל את המגנטיות. כל חלק הוא מגנט קטן יותר, עם שני קטבים.'

  - id: Q-4.1-materials
    type: multi
    objectives: [OBJ-4.1-1]
    qualitative: true
    prompt: >-
      מקרבים מגנט חזק לכל אחד מהחפצים הבאים. אילו מהם יימשכו אליו? סמנו את כל התשובות הנכונות.
    choices:
      - text: 'מסמר מפלדה'
        correct: true
        feedback: 'נכון. פלדה היא סגסוגת של ברזל, וברזל נמשך למגנט.'
      - text: 'פחית שתייה מאלומיניום'
        feedback: 'אלומיניום הוא מתכת, אבל הוא לא נמשך למגנט. רק חומרים מעטים, בעיקר ברזל, ניקל וקובלט, נמשכים.'
        misconception: MC-magnet-attracts-all-metals
      - text: 'פיסת ניקל טהור'
        correct: true
        feedback: 'נכון. ניקל הוא אחד משלושת היסודות שמגנט מושך חזק: ברזל, ניקל וקובלט.'
      - text: 'תיל נחושת'
        feedback: 'נחושת היא מתכת מצוינת להולכת חשמל, אבל מגנט לא מושך אותה.'
        misconception: MC-magnet-attracts-all-metals
      - text: 'טבעת זהב'
        feedback: 'זהב אינו נמשך למגנט. "מתכת" לא אומרת "נמשכת למגנט".'
        misconception: MC-magnet-attracts-all-metals

  - id: Q-4.1-charged-rod
    type: twotier
    objectives: [OBJ-4.1-1]
    qualitative: true
    prompt: >-
      מקרבים מוט פלסטיק טעון אל הקוטב הצפוני של מחט מצפן, והמחט נמשכת אליו. אחר כך מקרבים את אותו מוט אל הקוטב הדרומי של המחט, וגם הוא נמשך. האם המוט הטעון מתנהג כמו קוטב של מגנט?
    choices:
      - text: 'לא.'
        correct: true
        feedback: נכון.
      - text: 'כן, הוא מתנהג כמו קוטב דרומי.'
        feedback: 'קוטב דרומי היה מושך את הקוטב הצפוני של המחט, אבל דוחה את הקוטב הדרומי שלה. המוט משך את שניהם.'
        misconception: MC-poles-are-charges
      - text: 'כן, הוא מתנהג כמו קוטב צפוני.'
        feedback: 'קוטב צפוני היה דוחה את הקוטב הצפוני של המחט. המוט משך את שני הקצוות.'
        misconception: MC-poles-are-charges
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'קוטב של מגנט מושך קצה אחד של המחט ודוחה את השני; המוט הטעון מושך את שניהם, כמו שגוף טעון מושך כל גוף ניטרלי (קיטוב).'
        correct: true
        feedback: 'נכון. המשיכה של המוט היא חשמלית, ולא מבחינה בין הקטבים. דחייה היא הסימן היחיד לקוטב של מגנט.'
      - text: 'מטען חיובי הוא קוטב צפוני ומטען שלילי הוא קוטב דרומי, ולכן מוט טעון הוא קוטב.'
        feedback: 'קטבים אינם מטענים. אילו המוט היה "קוטב", הוא היה דוחה את אחד הקצוות של המחט.'
        misconception: MC-poles-are-charges
      - text: 'המחט עשויה מברזל, וכל דבר מושך ברזל.'
        feedback: 'לא כל דבר מושך ברזל. מה שקובע כאן הוא שהמוט משך את שני הקצוות, כלומר הוא לא מבחין בין N ל-S.'

  - id: Q-4.1-repel-test
    type: mc
    objectives: [OBJ-4.1-1]
    qualitative: true
    prompt: >-
      יש לכם מגנט שהקטבים שלו מסומנים, ומוט מתכת שנראה בדיוק כמו מגנט. איזו תצפית **מוכיחה** שגם המוט הוא מגנט?
    choices:
      - text: 'אחד הקצוות של המוט דוחה את הקוטב הצפוני של המגנט.'
        correct: true
        feedback: 'נכון. דחייה מתרחשת רק בין שני קטבים שווים, ולכן רק מגנט יכול לדחות מגנט.'
      - text: 'הקוטב הצפוני של המגנט מושך את המוט.'
        feedback: 'מגנט מושך גם ברזל רגיל, שאינו מגנט. משיכה לא מבחינה בין מגנט לבין ברזל.'
      - text: 'שני הקטבים של המגנט מושכים את אותו קצה של המוט.'
        feedback: 'זה בדיוק מה שקורה עם ברזל שאינו מגנט: כל אחד מהקטבים מושך אותו. מגנט היה נדחה מאחד הקטבים.'
      - text: 'המוט עשוי ממתכת, ולכן הוא מגנט.'
        feedback: 'רוב המתכות אינן מגנטים, ורובן אפילו לא נמשכות למגנט.'
        misconception: MC-magnet-attracts-all-metals

  # ------------------------------------------------ OBJ-4.1-2: B by compass, reading field lines
  - id: Q-4.1-compass-beyond-s
    type: vector
    objectives: [OBJ-4.1-2]
    qualitative: true
    prompt: >-
      מגנט מוט מונח על השולחן, והקוטב הצפוני שלו בצד ימין. מניחים מצפן משמאל לקוטב הדרומי, על הקו שעובר לאורך המגנט. לאן מצביע הקוטב הצפוני של המחט?
    answer: e
    correctFeedback: 'נכון. הקוטב הצפוני של המחט נמשך לקוטב הדרומי של המגנט, שנמצא מימינו. קווי השדה נכנסים לקוטב הדרומי, ולכן השדה שם מצביע ימינה, אל המגנט.'
    wrong:
      - dir: w
        feedback: 'הקוטב הצפוני של המחט נמשך לקוטב הדרומי של המגנט, ולא נדחה ממנו. שמאלה היה נכון ליד הקוטב הצפוני, שנמצא בצד השני.'
      - dir: zero
        feedback: 'השדה קיים גם ליד הקוטב הדרומי: קווי השדה נכנסים אליו. המחט מתיישרת לאורך השדה שם.'
        misconception: MC-magnetic-lines-start-at-n
    wrongFeedback: 'קטבים שונים מושכים: לאן יימשך הקוטב הצפוני של המחט?'

  - id: Q-4.1-inside
    type: vector
    objectives: [OBJ-4.1-2]
    qualitative: true
    prompt: >-
      מגנט מוט מונח כך שהקוטב הצפוני שלו בצד ימין. מה כיוון השדה המגנטי **בתוך** המגנט, באמצע שלו?
    answer: e
    correctFeedback: 'נכון. מחוץ למגנט הקווים הולכים מהצפוני (ימין) אל הדרומי (שמאל), ובתוכו הם ממשיכים מהדרומי אל הצפוני: ימינה. כך כל קו נסגר על עצמו.'
    wrong:
      - dir: w
        feedback: 'זה הכיוון של השדה מחוץ למגנט, ליד הצד שלו. בתוך המגנט הקווים ממשיכים מהקוטב הדרומי אל הצפוני, כדי להיסגר.'
        misconception: MC-magnetic-lines-start-at-n
      - dir: zero
        feedback: 'קווי השדה לא נגמרים בקוטב הדרומי. הם ממשיכים בתוך המגנט, ושם השדה דווקא חזק.'
        misconception: MC-magnetic-lines-start-at-n
    wrongFeedback: 'עקבו אחרי קו שנכנס לקוטב הדרומי. כדי לחזור לקוטב הצפוני הוא חייב לעבור בתוך המגנט.'

  - id: Q-4.1-between-lines
    type: twotier
    objectives: [OBJ-4.1-2]
    qualitative: true
    prompt: >-
      בציור של קווי השדה של מגנט, הנקודה P נמצאת בדיוק באמצע בין שני קווים מצוירים. מניחים שם מצפן. מה תעשה המחט?
    choices:
      - text: 'תתיישר בכיוון שבין הכיוונים של שני הקווים הסמוכים.'
        correct: true
        feedback: נכון.
      - text: 'לא תתיישר בשום כיוון, כי ב-P אין קו שדה.'
        feedback: 'בין הקווים יש שדה בכל נקודה. הקווים הם רק מדגם שבחרו לצייר.'
        misconception: MC-magnetic-field-only-on-lines
      - text: 'תפנה אל הקו הקרוב ביותר.'
        feedback: 'המחט לא "מחפשת" קו. היא מתיישרת לאורך השדה שבמקום שלה.'
        misconception: MC-magnetic-field-only-on-lines
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'השדה קיים בכל נקודה סביב המגנט, וכיוונו משתנה בהדרגה בין קו לקו.'
        correct: true
        feedback: 'נכון. אפשר היה לצייר קו גם דרך P, והוא היה עובר בין שני הקווים הסמוכים, כמעט מקביל להם.'
      - text: 'השדה קיים רק על הקווים, ולכן ב-P הוא אפס.'
        feedback: 'אילו היה כך, מספר הקווים שבוחרים לצייר היה משנה את השדה. בחלק "מצפנים בכל מקום" של איור 4.1א רואים מחט בכל נקודה.'
        misconception: MC-magnetic-field-only-on-lines
      - text: 'המחט עצמה יוצרת שם קו שדה חדש.'
        feedback: 'למחט יש שדה משלה, אבל לא בגללו היא מתיישרת. היא מתיישרת לאורך השדה של המגנט שבנקודה.'

  - id: Q-4.1-rank-density
    type: rank
    objectives: [OBJ-4.1-2]
    qualitative: true
    prompt: >-
      בציור של קווי השדה של מגנט מוט: בנקודה A, ממש ליד הקוטב הצפוני, הקווים צפופים מאוד. בנקודה B, ליד האמצע של הצד הארוך של המגנט, הם צפופים פחות. בנקודה C, רחוק מהמגנט, יש רק קווים בודדים ורחוקים זה מזה. דרגו את עוצמת השדה, מהגדולה לקטנה:
    items:
      - id: C
        label: הנקודה C, רחוק מהמגנט
      - id: A
        label: הנקודה A, ליד הקוטב
      - id: B
        label: הנקודה B, ליד אמצע הצד
    order: [A, B, C]
    correctFeedback: 'נכון. צפיפות הקווים מראה את עוצמת השדה: הוא החזק ביותר ליד הקטבים ונחלש עם המרחק מהמגנט.'
    wrongFeedback: 'צפיפות הקווים היא עוצמת השדה: איפה הקווים הכי צפופים?'

  - id: Q-4.1-field-ratio
    type: numeric
    objectives: [OBJ-4.1-2]
    prompt: >-
      ליד מגנט של מקרר השדה הוא $5\,\text{mT}$, והשדה של כדור הארץ באותו מקום הוא $50\,\mu\text{T}$. פי כמה השדה של המגנט חזק יותר?
    answer: 100
    unit: ''
    tolerance: 0.03
    correctFeedback: 'נכון. $5\,\text{mT} = 5\cdot10^{-3}\,\text{T}$ ו-$50\,\mu\text{T} = 5\cdot10^{-5}\,\text{T}$, והיחס $\dfrac{5\cdot10^{-3}}{5\cdot10^{-5}} = 100$.'
    wrongFeedback: 'המירו את שני השדות לטסלה: מילי היא $10^{-3}$ ומיקרו היא $10^{-6}$. אחר כך חלקו.'
    commonWrong:
      - value: 0.1
        feedback: 'חילקתם $5/50$ בלי התחיליות. המילי והמיקרו שונים פי אלף.'
      - value: 1000
        feedback: 'זה רק היחס בין התחיליות, מילי למיקרו. צריך לחלק גם את המספרים, $5/50$.'
      - value: 0.01
        feedback: 'הפכתם את היחס: חילקתם את השדה של כדור הארץ בשדה של המגנט.'

  # ------------------------------------------------ OBJ-4.1-3: the Earth's field
  - id: Q-4.1-geo-north
    type: mc
    objectives: [OBJ-4.1-3]
    qualitative: true
    confidence: true
    prompt: >-
      הקוטב הצפוני של מחט המצפן פונה בערך אל הקוטב הצפוני הגאוגרפי. איזה קוטב מגנטי של כדור הארץ נמצא שם?
    choices:
      - text: 'קוטב דרומי מגנטי.'
        correct: true
        feedback: 'נכון. קטבים שונים מושכים: הקוטב הצפוני של המחט נמשך לקוטב דרומי. קווי השדה של כדור הארץ נכנסים לאדמה ליד הקוטב הצפוני הגאוגרפי.'
      - text: 'קוטב צפוני מגנטי, ולכן הוא נקרא "צפוני".'
        feedback: 'אילו שם היה קוטב צפוני מגנטי, הוא היה **דוחה** את הקוטב הצפוני של המחט. לקוטב של מגנט קוראים "צפוני" כי הוא פונה צפונה, כלומר הוא נמשך אל קוטב דרומי.'
        misconception: MC-compass-points-to-magnetic-north
      - text: 'אין שם קוטב מגנטי; המחט פשוט פונה צפונה מעצמה.'
        feedback: 'מחט מתיישרת לאורך שדה מגנטי. בלי השדה של כדור הארץ היא הייתה נשארת בכל כיוון שבו מניחים אותה.'

  - id: Q-4.1-dip-places
    type: mc
    objectives: [OBJ-4.1-3]
    qualitative: true
    prompt: >-
      מחט מגנטית יכולה להסתובב במישור אנכי, כך שהיא יכולה לנטות למטה אל האדמה. איפה היא תעמוד כמעט **אנכית**?
    choices:
      - text: 'ליד אחד הקטבים המגנטיים של כדור הארץ.'
        correct: true
        feedback: 'נכון. ליד הקטבים המגנטיים קווי השדה נכנסים לאדמה או יוצאים ממנה כמעט אנכית, וזווית הנטייה קרובה ל-90°.'
      - text: 'בקו המשווה המגנטי.'
        feedback: 'שם קווי השדה מקבילים לפני האדמה, והמחט עומדת אופקית: זווית הנטייה אפס.'
      - text: 'בישראל.'
        feedback: 'בישראל זווית הנטייה כ-44°: המחט נוטה למטה, אבל רחוק מאנכית.'
      - text: 'בכל מקום, כי השדה של כדור הארץ אנכי.'
        feedback: 'השדה אנכי רק ליד הקטבים המגנטיים. בשאר המקומות יש לו גם רכיב אופקי, ובזכותו מצפן רגיל עובד.'

  - id: Q-4.1-vertical-component
    type: vector
    objectives: [OBJ-4.1-3]
    qualitative: true
    allowOutIn: true
    prompt: >-
      מפת ישראל מונחת על השולחן, והצפון בראש הדף. מה הכיוון של הרכיב **האנכי** של השדה המגנטי של כדור הארץ, כפי שהוא נראה על המפה?
    answer: in
    correctFeedback: 'נכון. בחצי הצפוני של כדור הארץ קווי השדה יורדים אל תוך האדמה (בישראל בזווית של כ-44°), כלומר אל תוך השולחן: ⊗, לתוך הדף.'
    wrong:
      - dir: out
        feedback: '⊙ פירושו החוצה מהדף, כלומר למעלה, מהאדמה אל השמים. כך זה רק בחצי הדרומי של כדור הארץ. אצלנו הקווים נכנסים לאדמה, בדרכם אל הקוטב הדרומי המגנטי שליד הצפון הגאוגרפי.'
      - dir: n
        feedback: 'צפונה זה הרכיב **האופקי**, זה שמצפן רגיל מראה. הרכיב האנכי ניצב לשולחן.'
      - dir: zero
        feedback: 'הרכיב האנכי מתאפס רק בקו המשווה המגנטי. בישראל הוא בערך שווה לרכיב האופקי.'
    wrongFeedback: 'הרכיב האנכי ניצב לפני האדמה, כלומר ניצב לשולחן. האם הוא יורד אל האדמה או עולה ממנה?'

  - id: Q-4.1-horizontal
    type: numeric
    objectives: [OBJ-4.1-3]
    level: mid
    prompt: >-
      בעיר בצפון אירופה השדה המגנטי של כדור הארץ הוא $5\cdot10^{-5}\,\text{T}$, וזווית הנטייה $70^\circ$. מה הרכיב האופקי של השדה, זה שמסובב מצפן רגיל? ענו במיקרוטסלה ($\mu\text{T}$).
    answer: 17.1
    unit: μT
    tolerance: 0.03
    correctFeedback: 'נכון. זווית הנטייה נמדדת מהמישור האופקי, ולכן הרכיב האופקי $B_h$ הוא הרכיב שליד הזווית: $5\cdot10^{-5}\cdot\cos70^\circ \approx 1.71\cdot10^{-5}\,\text{T} = 17.1\,\mu\text{T}$.'
    wrongFeedback: 'זווית הנטייה היא הזווית בין השדה לבין המישור האופקי. הרכיב האופקי הוא ההיטל על המישור הזה.'
    commonWrong:
      - value: 47
        feedback: 'השתמשתם בסינוס: זה הרכיב **האנכי**. הזווית נמדדת מהאופק, ולכן הרכיב האופקי הוא עם קוסינוס.'
      - value: 50
        feedback: 'זה כל השדה. מצפן רגיל מסתובב רק במישור האופקי, ומרגיש רק את הרכיב האופקי.'

  # ------------------------------------------------ OBJ-4.1-4: adding two fields
  - id: Q-4.1-sum-direction
    type: vector
    objectives: [OBJ-4.1-4]
    qualitative: true
    prompt: >-
      במקום מסוים השדה של כדור הארץ מצביע צפונה (למעלה בדף), ומגנט קרוב יוצר שם שדה שגודלו שווה לשדה של כדור הארץ ומצביע מזרחה (ימינה). לאן יצביע הקוטב הצפוני של מצפן שמונח שם?
    answer: ne
    correctFeedback: 'נכון. המחט מתיישרת לאורך השדה השקול, הסכום הווקטורי. שני וקטורים שווים וניצבים מצטרפים לאלכסון: $45^\circ$ בין צפון למזרח.'
    wrong:
      - dir: n
        feedback: 'זה הכיוון של השדה של כדור הארץ לבדו. המחט מרגישה את סכום שני השדות.'
      - dir: e
        feedback: 'זה הכיוון של השדה של המגנט לבדו. השדה של כדור הארץ עדיין שם, ומוסיף רכיב צפונה.'
      - dir: zero
        feedback: 'שדות מתבטלים רק כשהם מנוגדים. כאן הם ניצבים, והשקול שלהם אינו אפס.'
    wrongFeedback: 'חברו את שני השדות כווקטורים (שיעור 0.2): מה הכיוון של הסכום?'

  - id: Q-4.1-deflection
    type: numeric
    objectives: [OBJ-4.1-4]
    level: mid
    prompt: >-
      מצפן מונח על שולחן. הרכיב האופקי של השדה של כדור הארץ הוא $B_E = 3.2\cdot10^{-5}\,\text{T}$ צפונה. מניחים לידו מגנט, שיוצר במקום המצפן שדה של $B_m = 2.4\cdot10^{-5}\,\text{T}$ מזרחה. בכמה מעלות סוטה המחט מהצפון?
    answer: 36.9
    unit: °
    tolerance: 0.03
    correctFeedback: 'נכון. השדות ניצבים, ולכן $\tan\theta = \dfrac{B_m}{B_E} = \dfrac{2.4}{3.2} = 0.75$, ו-$\theta \approx 36.9^\circ$ מזרחה מהצפון.'
    wrongFeedback: 'ציירו את שני השדות כצלעות של משולש ישר זווית. הזווית מהצפון נמצאת ליד הצלע של השדה של כדור הארץ.'
    commonWrong:
      - value: 53.1
        feedback: 'זו הזווית מהמזרח. הפכתם את השבר: מהצפון, $\tan\theta = B_m/B_E$.'
      - value: 48.6
        feedback: 'השתמשתם בסינוס: $\sin\theta = 2.4/3.2$. אבל $3.2$ אינו היתר של המשולש; היתר הוא השדה השקול. היחס בין הניצבים הוא טנגנס.'
      - value: 0.75
        feedback: 'זה $\tan\theta$, לא הזווית. מצאו את הזווית שהטנגנס שלה $0.75$.'

  - id: Q-4.1-find-Bm
    type: numeric
    objectives: [OBJ-4.1-4]
    level: bagrut
    prompt: >-
      מגנט מונח מזרחית למצפן, והציר שלו מכוון מזרח-מערב, כך שהשדה שלו במקום המצפן מצביע מערבה. המחט סוטה $30^\circ$ מהצפון לכיוון מערב. הרכיב האופקי של השדה של כדור הארץ הוא $B_E = 3.2\cdot10^{-5}\,\text{T}$. מה גודל השדה של המגנט, $B_m$, במקום המצפן? ענו במיקרוטסלה ($\mu\text{T}$).
    answer: 18.5
    unit: μT
    tolerance: 0.03
    correctFeedback: 'נכון. $\tan30^\circ = \dfrac{B_m}{B_E}$, ולכן $B_m = 3.2\cdot10^{-5}\cdot\tan30^\circ \approx 1.85\cdot10^{-5}\,\text{T} = 18.5\,\mu\text{T}$.'
    wrongFeedback: 'השדות ניצבים: $\tan\theta = B_m/B_E$. בודדו את $B_m$.'
    commonWrong:
      - value: 16
        feedback: 'השתמשתם ב-$\sin30^\circ$. השדה של כדור הארץ הוא ניצב במשולש, לא היתר; היחס בין הניצבים הוא טנגנס.'
      - value: 55.4
        feedback: 'חילקתם ב-$\tan30^\circ$ במקום להכפיל. בדקו: סטייה קטנה מ-$45^\circ$ אומרת שהשדה של המגנט **קטן** מזה של כדור הארץ.'
      - value: 27.7
        feedback: 'השתמשתם ב-$\cos30^\circ$. היחס בין שני הניצבים הוא טנגנס.'
