chapter: 6
questions:
  # ------------------------------------------------ OBJ-6.9-1: Poisson's equation, the Laplacian
  - id: Q-6.9-laplace-zero
    type: twotier
    objectives: [OBJ-6.9-1]
    qualitative: true
    prompt: >-
      בין לוחות קבל הפוטנציאל הוא $V = 100 - 2000x$ (בוולט, כש-$x$ במטרים), ולכן שם $\nabla^2 V = 0$. מה אפשר להסיק על האזור שבין הלוחות?
    choices:
      - text: 'אין בו מטען, אבל יש בו שדה של $2000\,\text{V/m}$.'
        correct: true
        feedback: נכון.
      - text: 'אין בו שדה, כי הלפלסיאן של הפוטנציאל אפס.'
        feedback: 'הלפלסיאן הוא סכום **נגזרות שניות**. השדה קשור לנגזרת **הראשונה**, $E_x = -\partial V/\partial x = 2000\,\text{V/m}$, וזו לא אפס.'
        misconception: MC-laplace-means-zero
      - text: 'הפוטנציאל בו אפס.'
        feedback: 'הפוטנציאל משתנה מ-$100\,\text{V}$ ומטה; הוא אפס רק בנקודה אחת. משוואת לפלס אומרת משהו על הצורה של $V$, לא על הערך שלו.'
        misconception: MC-laplace-means-zero
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'משוואת פואסון קושרת את הנגזרות השניות של $V$ למטען; הנגזרת הראשונה, השדה, יכולה להיות כל דבר.'
        correct: true
        feedback: 'נכון. הנגזרת הראשונה קבועה ($-2000\,\text{V/m}$), ולכן השנייה אפס: שדה אחיד, בלי מטען, כמו בשיעור 2.6.'
      - text: 'כש-$\nabla^2 V = 0$ גם $\nabla V = 0$.'
        feedback: 'לא. $V = 100 - 2000x$ הוא דוגמה נגדית: $\nabla V = (-2000, 0, 0)$, ובכל זאת $\nabla^2 V = 0$.'
        misconception: MC-laplace-means-zero
      - text: 'מקום בלי מטען הוא מקום בלי שדה.'
        feedback: 'בין לוחות קבל אין מטען ויש שדה חזק. השדה נוצר על ידי המטענים שעל הלוחות.'
        misconception: MC-laplace-means-zero

  - id: Q-6.9-rho-from-v
    type: numeric
    objectives: [OBJ-6.9-1]
    level: mid
    prompt: >-
      בתוך גליל טעון ארוך הפוטנציאל הוא $V = -\gamma\left(x^2 + y^2\right)$, עם $\gamma = 200\,\text{V/m}^2$ (הציר של הגליל הוא ציר $z$). מה צפיפות המטען בתוך הגליל? ענו ב-$\text{nC/m}^3$ (ננו-קולון למטר מעוקב), עם סימן.
    answer: 7.08
    unit: nC/m³
    tolerance: 0.03
    correctFeedback: 'נכון. $\partial^2 V/\partial x^2 = \partial^2 V/\partial y^2 = -2\gamma$, והנגזרת לפי $z$ אפס, ולכן $\nabla^2 V = -4\gamma$ ו-$\rho = -\varepsilon_0\nabla^2 V = 4\gamma\varepsilon_0 = 4\cdot200\cdot8.85\cdot10^{-12} \approx 7.08\cdot10^{-9}\,\text{C/m}^3$, חיובי: הפוטנציאל בשיא על הציר.'
    wrongFeedback: 'חשבו את שלוש הנגזרות השניות, חברו אותן, והציבו במשוואת פואסון $\rho = -\varepsilon_0\nabla^2 V$.'
    commonWrong:
      - value: 3.54
        feedback: 'גזרתם רק לפי $x$. הלפלסיאן הוא **סכום** הנגזרות השניות בכל הכיוונים, וכאן גם $y$ תורם $-2\gamma$.'
      - value: 10.62
        feedback: 'הוספתם נגזרת לפי $z$. הפוטנציאל לא תלוי ב-$z$, ולכן $\partial^2 V/\partial z^2 = 0$.'
      - value: -7.08
        feedback: 'שכחתם את המינוס במשוואת פואסון: $\nabla^2 V = -\rho/\varepsilon_0$. כאן $\nabla^2 V < 0$, ולכן $\rho > 0$.'

  - id: Q-6.9-derive
    type: mc
    objectives: [OBJ-6.9-1]
    qualitative: true
    prompt: >-
      איזה צירוף של שני חוקים נותן את משוואת פואסון, $\nabla^2 V = -\rho/\varepsilon_0$?
    choices:
      - text: 'חוק גאוס בצורה המקומית, $\nabla\cdot\vec E = \rho/\varepsilon_0$, יחד עם $\vec E = -\nabla V$.'
        correct: true
        feedback: 'נכון. מציבים את $\vec E = -\nabla V$ בדיברגנץ: $\nabla\cdot(-\nabla V) = \rho/\varepsilon_0$, ו-$\nabla\cdot\nabla V$ הוא הלפלסיאן.'
      - text: '$\nabla\times\vec E = 0$ יחד עם $\vec E = -\nabla V$.'
        feedback: 'הרוטור של גרדיאנט תמיד אפס, ולכן הצירוף הזה לא אומר שום דבר על המטען. את $\rho$ מביא רק חוק גאוס.'
      - text: 'חוק קולון בלבד: $V = kq/r$ הוא כבר משוואת פואסון.'
        feedback: '$V = kq/r$ הוא **פתרון** אחד (למטען נקודתי). משוואת פואסון היא חוק מקומי שמתאים לכל התפלגות מטען, והיא נגזרת מחוק גאוס.'
      - text: '$\vec E = -\nabla V$ בלבד, כי הגרדיאנט של הגרדיאנט הוא הלפלסיאן.'
        feedback: 'הלפלסיאן הוא **הדיברגנץ** של הגרדיאנט, ובלי חוק גאוס אין במשוואה את $\rho$.'

  # ------------------------------------------------ OBJ-6.9-2: the mean, no extremum, Earnshaw
  - id: Q-6.9-grid-mean
    type: numeric
    objectives: [OBJ-6.9-2]
    prompt: >-
      ברשת רלקסציה שהתכנסה, באזור בלי מטען, ארבע השכנות של צומת מראות $12$, $18$, $25$ ו-$33\,\text{V}$. מה הפוטנציאל בצומת? ענו בוולט.
    answer: 22
    unit: V
    tolerance: 0.02
    correctFeedback: 'נכון. במקום ריק משוואת לפלס על רשת אומרת שכל צומת שווה לממוצע שכנותיו: $(12 + 18 + 25 + 33)/4 = 22\,\text{V}$.'
    wrongFeedback: 'במקום ריק הצומת שווה לממוצע ארבע שכנותיו.'
    commonWrong:
      - value: 88
        feedback: 'זה הסכום. משוואת לפלס על רשת נותנת את **הממוצע**: מחלקים ב-4.'
      - value: 21.5
        feedback: 'זה החציון של ארבעת המספרים (הממוצע של שני האמצעיים), לא הממוצע שלהם.'
      - value: 33
        feedback: 'צומת באזור ריק לא יכול להיות שווה לערך הגבוה ביותר בסביבתו, אלא אם כל השכנות שוות. הוא הממוצע שלהן.'
        misconception: MC-interior-potential-extremum

  - id: Q-6.9-earnshaw
    type: mc
    objectives: [OBJ-6.9-2]
    qualitative: true
    level: mid
    prompt: >-
      בשמונה הקודקודים של קובייה מקבעים שמונה מטענים חיוביים שווים. במרכז הקובייה מניחים כדור קטן עם מטען חיובי. הכוחות עליו מתבטלים. האם הוא בשיווי משקל יציב?
    choices:
      - text: 'לא. בכיוון אחד לפחות תזוזה קטנה תרחיק אותו מהמרכז.'
        correct: true
        feedback: 'נכון. המרכז ריק ממטענים אחרים, ושם הפוטנציאל שלהם מקיים את משוואת לפלס: אין לו מינימום, ולכן יש כיוון שבו האנרגיה יורדת. זה משפט ארנשו. (בקובייה, מהסימטריה, כל שלוש הנגזרות השניות אפס; אז עדיין אין מינימום, כי לפי תכונת הממוצע $V$ במרכז שווה לממוצע שלו על כל כדור קטן סביבו. חישוב מראה שהכדור בורח לכיוון מרכזי הפאות.)'
      - text: 'כן. הוא מוקף מכל הצדדים במטענים שדוחים אותו בחזרה.'
        feedback: 'זה נשמע הגיוני, אבל זה בלתי אפשרי: כדי לחזור מכל תזוזה הכדור צריך מינימום של $V$, ובאזור ריק אין לפוטנציאל מינימום. תמיד יש כיוון שבו $V$ יורד.'
        misconception: MC-interior-potential-extremum
      - text: 'כן, אם המטען של הכדור קטן מספיק.'
        feedback: 'גודל המטען של הכדור משנה את הכוח בכל כיוון באותו יחס, ולא את הסימן שלו. הכיוון הבורח נשאר בורח.'
        misconception: MC-interior-potential-extremum
      - text: 'אי אפשר לדעת בלי לחשב את הכוח בכל כיוון.'
        feedback: 'אפשר לדעת בלי חישוב: משוואת לפלס אוסרת מינימום של הפוטנציאל באזור ריק, ולכן אין שיווי משקל יציב בשום סידור של מטענים קבועים.'

  - id: Q-6.9-max-where
    type: mc
    objectives: [OBJ-6.9-2]
    qualitative: true
    prompt: >-
      בתוך קופסה מוארקת יש שני מוליכים, אחד ב-$+50\,\text{V}$ ואחד ב-$+80\,\text{V}$, ואין שום מטען אחר. איפה, בין הנקודות הריקות שבתוך הקופסה, הפוטנציאל הגבוה ביותר?
    choices:
      - text: 'צמוד למוליך של $80\,\text{V}$; בנקודות הריקות הפוטנציאל תמיד מתחת ל-$80\,\text{V}$.'
        correct: true
        feedback: 'נכון. באזור ריק אין שיא, ולכן הערך הגבוה ביותר הוא על השפה, על המוליך של $80\,\text{V}$, והנקודות הריקות הגבוהות ביותר הן אלה שצמודות אליו.'
      - text: 'באמצע בין שני המוליכים, שם הפוטנציאלים שלהם מצטברים.'
        feedback: 'באזור ריק כל נקודה שווה לממוצע סביבתה, ולכן אינה יכולה להיות גבוהה מכל סביבתה. באמצע הפוטנציאל בין הערכים של השפה.'
        misconception: MC-interior-potential-extremum
      - text: 'יכול להיות בכל מקום, תלוי בצורת המוליכים.'
        feedback: 'הצורה משנה את המפה, אבל לא את הכלל: הערכים הקיצוניים תמיד על השפה. ראו באיור 6.9א, אחרי שתצבעו מוליכים בכל צורה.'
        misconception: MC-interior-potential-extremum
      - text: 'יש נקודה ריקה שבה הפוטנציאל $130\,\text{V}$, סכום שני המוליכים.'
        feedback: 'פוטנציאלים של מוליכים לא מצטברים כך. וממילא באזור ריק אין ערך גבוה מהגבוה שבשפה.'

  - id: Q-6.9-curvature
    type: numeric
    objectives: [OBJ-6.9-2]
    level: mid
    prompt: >-
      בנקודה באזור בלי מטען מדדו $\partial^2 V/\partial x^2 = 3\cdot10^{6}\,\text{V/m}^2$ ו-$\partial^2 V/\partial y^2 = -1\cdot10^{6}\,\text{V/m}^2$. מה $\partial^2 V/\partial z^2$ שם? ענו ביחידות של $10^{6}\,\text{V/m}^2$, עם סימן.
    answer: -2
    unit: 10⁶ V/m²
    tolerance: 0.02
    correctFeedback: 'נכון. במקום ריק $\nabla^2 V = 0$: $3 - 1 + \partial^2 V/\partial z^2 = 0$, ולכן $\partial^2 V/\partial z^2 = -2\cdot10^{6}\,\text{V/m}^2$. בכיוון $x$ הפוטנציאל בשקע ובשני הכיוונים האחרים בשיא: מטען חיובי שם יציב רק לאורך $x$.'
    wrongFeedback: 'במקום ריק סכום שלוש הנגזרות השניות הוא אפס.'
    commonWrong:
      - value: 2
        feedback: 'הסימן הפוך: הסכום צריך להיות אפס, ו-$3 - 1 = 2$, ולכן הנגזרת השלישית $-2$.'
      - value: 4
        feedback: 'חיברתם את הגדלים בלי סימנים. משוואת לפלס דורשת שהסכום **עם הסימנים** יהיה אפס.'
      - value: 0
        feedback: 'אפס הוא הסכום של שלוש הנגזרות, לא כל אחת מהן.'
        misconception: MC-laplace-means-zero

  # ------------------------------------------------ OBJ-6.9-3: uniqueness
  - id: Q-6.9-cavity
    type: twotier
    objectives: [OBJ-6.9-3]
    qualitative: true
    prompt: >-
      קליפת מתכת סגורה בצורה לא סדירה מחוברת ל-$70\,\text{V}$. בחלל שבתוכה אין מטען. מה הפוטנציאל בחלל?
    choices:
      - text: '$70\,\text{V}$ בכל נקודה, ואין שדה בחלל.'
        correct: true
        feedback: נכון.
      - text: '$70\,\text{V}$ ליד הדפנות, ופחות באמצע.'
        feedback: 'אם הפוטנציאל באמצע היה נמוך מבכל הסביבה, היה שם מינימום באזור ריק, וזה אסור. הפוטנציאל הקבוע מקיים את כל הדרישות.'
        misconception: MC-interior-potential-extremum
      - text: 'אי אפשר לדעת בלי לפתור את המשוואה בצורה של הקליפה.'
        feedback: 'אפשר: ניחוש $V = 70\,\text{V}$ מקיים את משוואת לפלס ואת תנאי השפה, ולפי משפט היחידות הוא הפתרון, בכל צורה.'
        misconception: MC-uniqueness-needs-solving
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'פוטנציאל קבוע מקיים $\nabla^2 V = 0$ ושווה ל-$70\,\text{V}$ על כל השפה; לפי משפט היחידות זה הפתרון היחיד.'
        correct: true
        feedback: 'נכון. ובלי שום חישוב על הצורה של הקליפה. זה הנימוק הכללי לכלוב פאראדיי של שיעור 1.9.'
      - text: 'הדפנות דוחות את השדה החוצה.'
        feedback: 'זה לא נימוק: השאלה היא למה אין שדה בכלל בחלל, וזה נובע מכך שפוטנציאל קבוע הוא הפתרון היחיד.'
      - text: 'ניחוש הוא רק פתרון אפשרי אחד; צריך עוד לבדוק שאין פתרון אחר.'
        feedback: 'משפט היחידות עושה את הבדיקה הזאת פעם אחת לתמיד: כשהניחוש מקיים את המשוואה ואת תנאי השפה, אין פתרון אחר.'
        misconception: MC-uniqueness-needs-solving

  - id: Q-6.9-unique-guess
    type: mc
    objectives: [OBJ-6.9-3]
    qualitative: true
    level: mid
    prompt: >-
      תלמידה ניחשה פוטנציאל לבעיה של מטענים ומוליכים. היא בדקה שהניחוש מקיים את משוואת פואסון בכל האזור, ונותן את הפוטנציאל הנכון על כל מוליך וגם $V \to 0$ רחוק מאוד. מה אפשר לומר על הניחוש?
    choices:
      - text: 'זה הפתרון המדויק, ואין אחר.'
        correct: true
        feedback: 'נכון. זה משפט היחידות: ההפרש בין שני פתרונות כאלה מקיים את משוואת לפלס ומתאפס על כל השפה, ולכן הוא אפס בכל מקום.'
      - text: 'זה קירוב טוב, אבל הפתרון המדויק יכול להיות שונה.'
        feedback: 'אין כאן קירוב: מי שמקיים את המשוואה ואת כל תנאי השפה הוא **הפתרון**, לפי משפט היחידות.'
        misconception: MC-uniqueness-needs-solving
      - text: 'זה פתרון אחד מתוך רבים; צריך עוד תנאי כדי לבחור ביניהם.'
        feedback: 'כשהמטען בפנים והפוטנציאל על כל השפה נתונים, יש פתרון אחד בלבד. אין בין מה לבחור.'
        misconception: MC-uniqueness-needs-solving
      - text: 'זה הפתרון רק אם הגיעו אליו ברלקסציה.'
        feedback: 'הדרך לא משנה. רשת, ניחוש או מטען דמות: אם התוצאה מקיימת את המשוואה ואת תנאי השפה, היא אותו פתרון.'

  - id: Q-6.9-boundary
    type: multi
    objectives: [OBJ-6.9-3]
    level: mid
    prompt: >-
      מה צריך להיות נתון כדי שהפוטנציאל באזור ייקבע באופן יחיד? סמנו את כל מה שצריך (לפי משפט היחידות שבשיעור).
    choices:
      - text: 'צפיפות המטען בכל נקודה בתוך האזור.'
        correct: true
        feedback: 'נכון. היא צד ימין של משוואת פואסון.'
      - text: 'הפוטנציאל על כל השפה של האזור (כולל רחוק מאוד, אם האזור פתוח).'
        correct: true
        feedback: 'נכון. אלה תנאי השפה. בלעדיהם, למשל, כל קבוע שמוסיפים ל-$V$ היה נותן פתרון נוסף.'
      - text: 'כיוון השדה בנקודה אחת בתוך האזור.'
        feedback: 'לא צריך: המטען ותנאי השפה כבר קובעים הכול, כולל השדה בכל נקודה.'
      - text: 'השיטה שבה פותרים: רלקסציה, ניחוש או חישוב.'
        feedback: 'הפתרון לא תלוי בשיטה. באיור 6.9א השיטה האיטית והמהירה מגיעות לאותה מפה.'
        misconception: MC-uniqueness-needs-solving

  # ------------------------------------------------ OBJ-6.9-4: images
  - id: Q-6.9-image-force
    type: numeric
    objectives: [OBJ-6.9-4]
    level: mid
    prompt: >-
      מטען $q = 3\,\text{nC}$ נמצא במרחק $d = 2\,\text{cm}$ ממשטח מתכת גדול ומוארק. מה הכוח שהמשטח מפעיל על המטען? ענו במיקרו-ניוטון (μN).
    answer: 50.6
    unit: μN
    tolerance: 0.03
    correctFeedback: 'נכון. הדמות $-q$ נמצאת במרחק $d$ מאחורי המשטח, כלומר $2d = 4\,\text{cm}$ מהמטען: $F = \dfrac{kq^2}{(2d)^2} = \dfrac{9\cdot10^{9}\cdot(3\cdot10^{-9})^2}{0.04^2} \approx 5.06\cdot10^{-5}\,\text{N}$, משיכה לעבר המשטח.'
    wrongFeedback: 'החליפו את המטען המושרה בדמות $-q$ מאחורי המשטח, וחשבו את כוח קולון ביניהם. מה המרחק בין המטען לדמות?'
    commonWrong:
      - value: 202.5
        feedback: 'השתמשתם במרחק $d$, כאילו הדמות יושבת על המשטח. היא נמצאת במרחק $d$ **מאחוריו**, $2d$ מהמטען.'
        misconception: MC-image-distance-d
      - value: 101.3
        feedback: 'חילקתם ב-$2d^2$. המרחק בין המטען לדמות הוא $2d$, וצריך לחלק בריבוע שלו: $(2d)^2 = 4d^2$.'
      - value: 25.3
        feedback: 'קיבלתם חצי מהתשובה, כאילו הדמות היא $-q/2$. הדמות היא $-q$ שלם: היא מחליפה את כל המטען המושרה, וזה בדיוק $-q$.'

  - id: Q-6.9-induced-total
    type: mc
    objectives: [OBJ-6.9-4]
    prompt: >-
      מטען $q$ חיובי נמצא מעל משטח מתכת גדול מאוד ומוארק. כמה מטען מושרה יש בסך הכול על פני המשטח?
    choices:
      - text: '$-q$, בלי קשר למרחק של המטען מהמשטח.'
        correct: true
        feedback: 'נכון. האינטגרל של $\sigma(s)$ על כל המישור נותן $-q$, בדיוק כמו מטען הדמות. המרחק משנה רק את הפיזור: מטען קרוב מרכז אותו יותר.'
      - text: 'אפס, כי המשטח מוארק.'
        feedback: 'הארקה קובעת את **הפוטנציאל** של המשטח, אפס, לא את המטען שלו. דרך ההארקה זורם מטען $-q$ מהאדמה.'
        misconception: MC-ground-neutralises
      - text: '$-q/2$, כי רק חצי מקווי השדה של $q$ פונים אל המשטח.'
        feedback: 'בנוכחות המשטח כל קווי השדה של $q$ נגמרים עליו, גם אלה שיוצאים כלפי מעלה ומתעקלים חזרה. האינטגרל נותן $-q$.'
      - text: 'תלוי במרחק: מטען קרוב יותר משרה יותר מטען.'
        feedback: 'המרחק משנה את הפיזור, לא את הסכום: $\int_0^\infty\sigma\,2\pi s\,ds = -q$ לכל $d$.'

  - id: Q-6.9-image-inside
    type: mc
    objectives: [OBJ-6.9-4]
    qualitative: true
    prompt: >-
      מטען $q$ נמצא מעל משטח מתכת עבה ומוארק. בשיטת הדמויות שמים $-q$ במרחק $d$ מתחת לפני המתכת. מה השדה החשמלי בתוך המתכת, בנקודה שבה "יושבת" הדמות?
    choices:
      - text: 'אפס: בתוך המתכת אין שדה, והדמות לא קיימת שם באמת.'
        correct: true
        feedback: 'נכון. פתרון הדמות נכון רק בצד של המטען. בתוך המוליך $V = 0$ ו-$\vec E = 0$; את השדה מעל המישור יוצר המטען המושרה שעל פני השטח, והדמות רק מחליפה אותו בחישוב.'
      - text: 'שדה אינסופי, כי שם יושב מטען נקודתי.'
        feedback: 'אין שם מטען אמיתי. הדמות היא תחליף שנכון רק מעל המישור; בתוך המתכת השדה אפס.'
        misconception: MC-image-charge-real
      - text: 'השדה של $q$ ושל הדמות יחד, כמו מעל המישור.'
        feedback: 'הנוסחה של $q$ ושל הדמות נכונה רק באזור שבו בדקנו את המשוואה ואת תנאי השפה: מעל המישור. בתוך המתכת $\vec E = 0$.'
        misconception: MC-image-charge-real
      - text: 'השדה של $q$ לבד, כי המתכת לא מסתירה אותו.'
        feedback: 'המטען המושרה על פני המתכת מבטל בדיוק את השדה של $q$ בתוך המתכת. זה מה שמגדיר מוליך בשיווי משקל (שיעור 1.9).'

  - id: Q-6.9-sigma-rank
    type: rank
    objectives: [OBJ-6.9-4]
    level: mid
    prompt: >-
      מטען $q$ נמצא במרחק $d$ מעל מישור מוליך מוארק. דרגו את גודל צפיפות המטען המושרה, $|\sigma|$, בארבע נקודות על המישור, מהגדול לקטן. $s$ הוא המרחק מהנקודה שמתחת למטען.
    items:
      - id: a
        label: '$s = 0$'
      - id: b
        label: '$s = d$'
      - id: c
        label: '$s = 2d$'
      - id: d
        label: '$s = 0.5d$'
    order: [a, d, b, c]
    correctFeedback: 'נכון. $|\sigma| \propto (s^2 + d^2)^{-3/2}$: ביחידות של $|\sigma(0)|$ מקבלים $1$, $0.72$ ב-$0.5d$, $0.35$ ב-$d$ ו-$0.089$ ב-$2d$. המטען המושרה מרוכז מתחת למטען ויורד מהר.'
    wrongFeedback: 'הצפיפות היא $\sigma = -qd/\left(2\pi(s^2+d^2)^{3/2}\right)$: הגדולה ביותר מתחת למטען, ויורדת עם $s$.'
