# Lesson 6.2 question bank. Strings may hold $inline$ / $$display$$ TeX and **bold**; they are rendered at
# build time. YAML note: plain and single-quoted strings keep backslashes literally.
# Every number below was recomputed with src/physics/calculus.ts (riemann), integrals.ts and potential.ts
# (pairEnergy); the script is recompute-6-2.ts in the session scratchpad. The data differ on purpose from
# the figures and the worked examples.

chapter: 6
questions:
  # ------------------------------------------------ OBJ-6.2-1: Riemann sums and the limit
  - id: Q-6.2-left-sum
    type: numeric
    objectives: [OBJ-6.2-1]
    prompt: >-
      חשבו את סכום רימן השמאלי של $f(x) = x^2 + 1$ בקטע $[0, 2]$, עם $N = 4$ חתיכות שוות.
    answer: 3.75
    unit: ''
    tolerance: 0.01
    correctFeedback: 'נכון. $\Delta x = 0.5$, והגבהים בקצוות השמאליים הם $f(0) = 1$, $f(0.5) = 1.25$, $f(1) = 2$, $f(1.5) = 3.25$. הסכום $0.5\cdot(1 + 1.25 + 2 + 3.25) = 3.75$. השטח המדויק, $14/3 \approx 4.67$, גדול יותר, כי הפונקציה עולה.'
    wrongFeedback: 'חשבו את $\Delta x = (2 - 0)/4$, מצאו את הגובה בקצה השמאלי של כל אחת מארבע החתיכות, וכפלו את סכום הגבהים ב-$\Delta x$.'
    commonWrong:
      - value: 5.75
        feedback: 'לקחתם את הגבהים בקצוות הימניים ($0.5, 1, 1.5, 2$). זה הסכום הימני. בכלל השמאלי החתיכה הראשונה מתחילה ב-$x = 0$.'
      - value: 7.5
        feedback: 'חיברתם את הגבהים ולא כפלתם ברוחב החתיכה, $\Delta x = 0.5$. כל איבר בסכום הוא שטח של מלבן: גובה כפול רוחב.'
      - value: 4.67
        feedback: 'זה השטח המדויק, $14/3$. השאלה מבקשת את הקירוב של ארבעה מלבנים בכלל השמאלי.'

  - id: Q-6.2-falling-left
    type: twotier
    objectives: [OBJ-6.2-1]
    qualitative: true
    prompt: >-
      זרם הפריקה של קבל יורד כל הזמן. מעריכים את המטען שעבר בנגד בשלוש השניות הראשונות בסכום רימן **שמאלי** עם 6 חתיכות. איך ההערכה בהשוואה למטען האמיתי?
    choices:
      - text: 'גדולה מהמטען האמיתי.'
        correct: true
        feedback: נכון.
      - text: 'קטנה מהמטען האמיתי.'
        feedback: 'בגרף עולה הכלל השמאלי אכן מעריך פחות, אבל כאן הגרף יורד: הגובה בתחילת כל חתיכה הוא הגבוה ביותר בה.'
        misconception: MC-riemann-always-under
      - text: 'שווה בדיוק, כי 6 חתיכות מכסות את כל שלוש השניות.'
        feedback: 'החתיכות מכסות את כל הזמן, אבל בכל אחת הגובה קבוע, והגרף לא. בכל חתיכה נשאר הפרש בין המלבן לגרף.'
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'בכל חתיכה המלבן מקבל את הזרם בתחילתה, הגדול ביותר בחתיכה, ולכן בולט מעל הגרף.'
        correct: true
        feedback: 'נכון. באיור 6.2ב, בגרף זרם הפריקה, רואים בכלל השמאלי את פינות המלבנים בולטות מעל העקומה.'
      - text: 'המלבנים של סכום רימן תמיד נמצאים מתחת לגרף.'
        feedback: 'זה נכון רק לכלל השמאלי בגרף עולה (או לימני בגרף יורד). כאן המלבנים השמאליים בולטים מעל הגרף.'
        misconception: MC-riemann-always-under
      - text: 'הטעויות בחתיכות השונות מתקזזות.'
        feedback: 'בגרף יורד, בכל חתיכה הכלל השמאלי טועה לאותו כיוון, למעלה. אין קיזוז.'

  - id: Q-6.2-double-mid
    type: mc
    objectives: [OBJ-6.2-1]
    qualitative: true
    level: mid
    prompt: >-
      מחשבים סכום רימן בכלל **נקודת האמצע** לגרף עקום, עם $N = 40$ חתיכות, והשגיאה יוצאת $0.008$. מה תהיה השגיאה בערך עם $N = 80$?
    choices:
      - text: '$0.002$: השגיאה קטנה פי 4.'
        correct: true
        feedback: 'נכון. בנקודת האמצע (ובטרפז) השגיאה יורדת כמו $1/N^2$: פי 2 חתיכות, פי 4 פחות שגיאה. בגרף השגיאה של איור 6.2א הקו של נקודת האמצע תלול פי 2 מהקו של הכלל השמאלי.'
      - text: '$0.004$: השגיאה קטנה פי 2.'
        feedback: 'כך מתנהג הכלל השמאלי (או הימני), שבו השגיאה יורדת כמו $1/N$. בנקודת האמצע החלק שבולט בצד אחד של כל חתיכה כמעט מקזז את החסר בצד השני, והשגיאה יורדת מהר יותר.'
      - text: '$0.008$: השגיאה לא משתנה, כי זה אותו כלל.'
        feedback: 'בכל כלל, חתיכות צרות יותר מתאימות לגרף טוב יותר. בכפתור "N כפול" שבאיור 6.2א רואים את השגיאה קטנה.'
      - text: 'אפס: עם 80 חתיכות הסכום מדויק.'
        feedback: 'בגרף עקום אף מספר סופי של חתיכות לא נותן שגיאה אפס. השגיאה רק מתקרבת לאפס כש-N גדל.'

  - id: Q-6.2-rank-rules
    type: rank
    objectives: [OBJ-6.2-1]
    level: mid
    prompt: >-
      לגרף של $f(x) = x^2$ בקטע $[0, 3]$ מחשבים סכומי רימן עם $N = 3$ חתיכות. השטח המדויק הוא $9$. סדרו מהגדול לקטן.
    items:
      - { id: right, label: 'הסכום הימני' }
      - { id: trap, label: 'סכום הטרפזים' }
      - { id: exact, label: 'השטח המדויק' }
      - { id: mid, label: 'סכום נקודות האמצע' }
      - { id: left, label: 'הסכום השמאלי' }
    order: [right, trap, exact, mid, left]
    correctFeedback: 'נכון. עם $\Delta x = 1$: הימני $1 + 4 + 9 = 14$, הטרפז הוא ממוצע השמאלי והימני, $9.5$, נקודת האמצע $0.25 + 2.25 + 6.25 = 8.75$, והשמאלי $0 + 1 + 4 = 5$. בגרף שעקום כלפי מעלה, הטרפז מעריך יותר ונקודת האמצע פחות.'
    wrongFeedback: 'חשבו כל סכום: $\Delta x = 1$, והגבהים בקצוות $0, 1, 2, 3$ ובאמצעים $0.5, 1.5, 2.5$. הטרפז הוא ממוצע השמאלי והימני.'

  # ------------------------------------------------ OBJ-6.2-2: signed area, meaning and units
  - id: Q-6.2-signed-velocity
    type: mc
    objectives: [OBJ-6.2-2]
    qualitative: true
    prompt: >-
      רוכב אופניים נוסע על כביש ישר. בגרף המהירות שלו, השטח מעל הציר מ-$t = 0$ עד $t = 3\,\text{s}$ הוא $12\,\text{m}$, והשטח מתחת לציר מ-$t = 3\,\text{s}$ עד $t = 5\,\text{s}$ הוא $4\,\text{m}$. מה ההעתק שלו ב-$5$ השניות?
    choices:
      - text: '$8\,\text{m}$ קדימה.'
        correct: true
        feedback: 'נכון. האינטגרל הוא שטח מסומן: $12 - 4 = 8\,\text{m}$. השטח שמתחת לציר הוא נסיעה אחורה, והוא מחסיר מההעתק.'
      - text: '$16\,\text{m}$ קדימה.'
        feedback: '$16\,\text{m}$ היא הדרך שעבר, השטח בלי סימנים. ההעתק הוא השטח המסומן: החלק שמתחת לציר נספר במינוס.'
        misconception: MC-integral-area-always-positive
      - text: '$4\,\text{m}$ אחורה.'
        feedback: 'זה רק החלק האחרון של הנסיעה. ההעתק כולל גם את $12\,\text{m}$ שנסע קדימה קודם.'
      - text: 'אי אפשר לדעת בלי לדעת את המהירות בכל רגע.'
        feedback: 'השטחים נתונים, וזה כל מה שצריך: ההעתק הוא השטח המסומן מתחת לגרף המהירות.'

  - id: Q-6.2-units
    type: mc
    objectives: [OBJ-6.2-2]
    qualitative: true
    prompt: >-
      בגרף, הזרם $i$ באמפר כפונקציה של הזמן $t$ בשניות. באילו יחידות נמדד האינטגרל $\int_0^T i\,dt$, ומה הוא מייצג?
    choices:
      - text: 'בקולון: המטען שעבר עד הרגע $T$.'
        correct: true
        feedback: 'נכון. כל רצועה היא גובה כפול רוחב, אמפר כפול שנייה, וזה קולון. השטח הוא המטען שעבר.'
      - text: 'באמפר: הזרם הכולל.'
        feedback: 'יחידות האינטגרל הן יחידות הגובה **כפול** יחידות הרוחב, לא יחידות הגובה לבדן: $\text{A}\cdot\text{s} = \text{C}$.'
        misconception: MC-integral-units-same-as-f
      - text: 'באמפר לשנייה: קצב השינוי של הזרם.'
        feedback: 'קצב שינוי הוא נגזרת (שיעור 6.1), והיחידות שלה הן חלוקה בזמן. באינטגרל **כופלים** בזמן.'
      - text: 'בג׳ול: האנרגיה שהזרם נשא.'
        feedback: 'אנרגיה היא השטח מתחת לגרף של **הספק** כתלות בזמן, או של מתח כתלות במטען. השטח מתחת לגרף זרם הוא מטען.'

  - id: Q-6.2-work-graph
    type: numeric
    objectives: [OBJ-6.2-2]
    level: mid
    prompt: >-
      כוח שפועל על גוף לאורך ציר x גדל באחידות מ-$0$ ל-$30\,\text{N}$ ב-$0.4\,\text{m}$ הראשונים, ואחר כך נשאר $30\,\text{N}$ עוד $0.2\,\text{m}$. מה העבודה של הכוח לאורך כל $0.6\,\text{m}$? ענו בג׳ול.
    answer: 12
    unit: J
    tolerance: 0.02
    correctFeedback: 'נכון. העבודה היא השטח מתחת לגרף הכוח: משולש, $\tfrac12\cdot0.4\cdot30 = 6\,\text{J}$, ועוד מלבן, $30\cdot0.2 = 6\,\text{J}$.'
    wrongFeedback: 'שרטטו את הכוח כתלות במקום, ומצאו את השטח שמתחת לגרף: משולש ואחריו מלבן.'
    commonWrong:
      - value: 18
        feedback: 'כפלתם את הכוח בסוף, $30\,\text{N}$, בכל הדרך. "כוח כפול דרך" נכון רק כשהכוח קבוע. ב-$0.4\,\text{m}$ הראשונים הוא היה קטן יותר.'
        misconception: MC-integral-end-value-times-width
      - value: 6
        feedback: 'חישבתם רק את המשולש. גם בקטע האחרון, שבו הכוח קבוע, הוא עושה עבודה: $30\cdot0.2 = 6\,\text{J}$.'
      - value: 9
        feedback: 'כפלתם את הממוצע של הכוח בהתחלה ובסוף, $15\,\text{N}$, בכל הדרך. זה עובד רק כשהגרף כולו קו ישר אחד; כאן הוא נשבר ב-$0.4\,\text{m}$.'

  - id: Q-6.2-charge-triangle
    type: numeric
    objectives: [OBJ-6.2-2]
    prompt: >-
      הזרם בתיל עולה באחידות מאפס ל-$3\,\text{mA}$ ב-$4$ שניות, ואז יורד באחידות לאפס ב-$2$ שניות נוספות. כמה מטען עבר בתיל? ענו במיליקולון (mC).
    answer: 9
    unit: mC
    tolerance: 0.02
    correctFeedback: 'נכון. המטען הוא השטח מתחת לגרף הזרם: משולש שבסיסו $6\,\text{s}$ וגובהו $3\,\text{mA}$, $\tfrac12\cdot6\cdot3 = 9\,\text{mC}$.'
    wrongFeedback: 'המטען שעבר הוא השטח מתחת לגרף של הזרם כתלות בזמן. איזו צורה יש לשטח הזה?'
    commonWrong:
      - value: 18
        feedback: 'כפלתם את הזרם המקסימלי בכל הזמן. זה המלבן שמקיף את המשולש, ושטחו כפול. הזרם היה $3\,\text{mA}$ רק לרגע אחד.'
        misconception: MC-integral-end-value-times-width
      - value: 0.009
        feedback: 'זה המטען בקולון. השאלה מבקשת מיליקולון: $\text{mA}\cdot\text{s} = \text{mC}$.'
      - value: 12
        feedback: 'חישבתם רק את $4$ השניות הראשונות כמלבן: $3\cdot4$. השטח הוא משולש, לאורך כל $6$ השניות.'

  # ------------------------------------------------ OBJ-6.2-3: antiderivatives and the fundamental theorem
  - id: Q-6.2-antiderivative
    type: mc
    objectives: [OBJ-6.2-3]
    prompt: >-
      מהי פונקציה קדומה של $f(x) = 6x^2 + \cos x$?
    choices:
      - text: '$2x^3 + \sin x + C$'
        correct: true
        feedback: 'נכון. בדיקה בגזירה: $(2x^3)'' = 6x^2$ ו-$(\sin x)'' = \cos x$.'
      - text: '$12x - \sin x$'
        feedback: 'זו הנגזרת של $f$. פונקציה קדומה היא הכיוון ההפוך: פונקציה **שהנגזרת שלה** היא $f$.'
        misconception: MC-antiderivative-is-derivative
      - text: '$6x^3 + \sin x + C$'
        feedback: 'בכלל החזקה מעלים את המעריך ב-1 **ומחלקים** במעריך החדש: $6\cdot x^3/3 = 2x^3$. גזרו את $6x^3$ וקבלו $18x^2$, לא $6x^2$.'
      - text: '$2x^3 - \sin x + C$'
        feedback: 'הנגזרת של $-\sin x$ היא $-\cos x$, לא $\cos x$. הפונקציה הקדומה של $\cos x$ היא $\sin x$.'

  - id: Q-6.2-ftc-numeric
    type: numeric
    objectives: [OBJ-6.2-3]
    prompt: >-
      חשבו את $\displaystyle\int_1^2 4x^3\,dx$.
    answer: 15
    unit: ''
    tolerance: 0.01
    correctFeedback: 'נכון. פונקציה קדומה של $4x^3$ היא $x^4$, ולפי המשפט היסודי $2^4 - 1^4 = 16 - 1 = 15$.'
    wrongFeedback: 'מצאו פונקציה קדומה $F$ (פונקציה ש-$F'' = 4x^3$), והציבו: $F(2) - F(1)$.'
    commonWrong:
      - value: 28
        feedback: 'הצבתם את הגבולות ב-$f$ עצמה: $4\cdot2^3 - 4\cdot1^3 = 28$. המשפט היסודי מציב אותם בפונקציה **הקדומה**, $F(x) = x^4$.'
        misconception: MC-ftc-uses-f
      - value: 16
        feedback: 'הצבתם רק את הגבול העליון. האינטגרל הוא $F(2) - F(1)$, ו-$F(1) = 1$.'
      - value: 36
        feedback: 'הצבתם את הגבולות בנגזרת של $f$, $12x^2$: $48 - 12$. צריך פונקציה קדומה, שהנגזרת **שלה** היא $4x^3$, לא את הנגזרת של $4x^3$.'
        misconception: MC-antiderivative-is-derivative

  - id: Q-6.2-constant-cancels
    type: twotier
    objectives: [OBJ-6.2-3]
    qualitative: true
    prompt: >-
      שתי תלמידות מחשבות את $\int_0^3 x^2\,dx$. הראשונה בוחרת את הפונקציה הקדומה $x^3/3$, והשנייה את $x^3/3 + 7$. מה יקרה?
    choices:
      - text: 'שתיהן יקבלו $9$.'
        correct: true
        feedback: נכון.
      - text: 'השנייה תקבל $16$.'
        feedback: 'היא מציבה את $F$ פעמיים, בגבול העליון ובתחתון, ומחסירה: $(9 + 7) - (0 + 7) = 9$.'
      - text: 'השנייה טעתה: לכל פונקציה יש רק פונקציה קדומה אחת.'
        feedback: 'גם $x^3/3 + 7$ היא פונקציה קדומה של $x^2$: הנגזרת של קבוע היא אפס. לכל פונקציה יש אינסוף פונקציות קדומות.'
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'הקבוע מופיע גם ב-$F(b)$ וגם ב-$F(a)$, ומצטמצם בהפרש.'
        correct: true
        feedback: 'נכון. לכן באינטגרל מסוים אפשר להשמיט את קבוע האינטגרציה.'
      - text: 'פונקציה קדומה גדולה יותר נותנת שטח גדול יותר.'
        feedback: 'השטח הוא **הפרש** של שני ערכים של $F$, לא הערך עצמו. הזזה של כל $F$ למעלה לא משנה את ההפרש.'
      - text: 'הנגזרת של $x^3/3 + 7$ היא $x^2 + 7$.'
        feedback: 'הנגזרת של קבוע היא אפס, ולכן הנגזרת של $x^3/3 + 7$ היא $x^2$ בדיוק.'

  - id: Q-6.2-coulomb-work
    type: numeric
    objectives: [OBJ-6.2-3, OBJ-6.2-2]
    level: bagrut
    prompt: >-
      מטען של $2\,\mu\text{C}$ מקובע במקומו. מטען של $5\,\mu\text{C}$ מתרחק ממנו מ-$0.1\,\text{m}$ עד $0.3\,\text{m}$. חשבו בעזרת אינטגרל את העבודה של הכוח החשמלי. ענו בג׳ול.
    answer: 0.6
    unit: J
    tolerance: 0.02
    correctFeedback: 'נכון. $W = \int_{0.1}^{0.3} \dfrac{kq_1q_2}{r^2}\,dr = kq_1q_2\left(\dfrac{1}{0.1} - \dfrac{1}{0.3}\right) = 0.09\cdot6.67 = 0.6\,\text{J}$, עם $kq_1q_2 = 9\cdot10^9\cdot2\cdot10^{-6}\cdot5\cdot10^{-6} = 0.09\,\text{N}\cdot\text{m}^2$.'
    wrongFeedback: 'הכוח $kq_1q_2/r^2$ משתנה. מצאו פונקציה קדומה של $r^{-2}$ והציבו את שני המרחקים.'
