# Lesson 6.7 question bank. Strings may hold $inline$ / $$display$$ TeX and **bold**; they are rendered at
# build time. YAML note: plain and single-quoted strings keep backslashes literally.
# Every number was recomputed with src/physics/constants.ts (EPS0_DISPLAY) and src/physics/divcurl.ts; the
