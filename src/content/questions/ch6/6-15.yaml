        correct: true
        feedback: 'נכון. במעבדה השעון של $q$ מתקדם לאט יותר פי $\gamma$, ולכן אותה דחיפה מתפרסת שם על זמן ארוך יותר, והכוח קטן פי $\gamma$. ב-$v \ll c$ ההבדל זניח.'
      - text: 'האיור מראה שגיאת עיגול: באמת שני הכוחות שווים בדיוק בכל מהירות.'
        feedback: 'היחס $1.25$ הוא בדיוק $\gamma(0.6c)$, לא שגיאת עיגול. הכוחות שווים רק עד סדר $v^2/c^2$.'
      - text: 'הכוח המגנטי והכוח החשמלי הם שני כוחות שונים, ולכן אין סיבה שיהיו שווים.'
        feedback: 'אילו היו כוחות שונים ובלתי תלויים, היחס לא היה שואף ל-1 בדיוק במהירויות נמוכות, ולא היה שווה בדיוק ל-$\gamma$. זו אותה דחיפה, בשני תיאורים.'
