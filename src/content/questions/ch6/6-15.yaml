  - id: Q-6.15-real-ratio
    type: numeric
    objectives: [OBJ-6.15-4]
    level: mid
    prompt: >-
      בתיל נחושת $\lambda_0 = 1.36\cdot10^{4}\,\text{C/m}$ (המטען של האלקטרונים החופשיים בכל מטר), וזורם בו $5\,\text{A}$. מטען $q$ נע לאורך התיל יחד עם האלקטרונים, באותה מהירות. מהו היחס $\lambda^\prime/\lambda_0$ בין צפיפות המטען הנטו במערכת של $q$ לבין $\lambda_0$?
    answer: 1.50e-24
    unit: ''
    tolerance: 0.03
    correctFeedback: 'נכון. מהירות הסחיפה $u = I/\lambda_0 = 3.68\cdot10^{-4}\,\text{m/s}$, ו-$\lambda^\prime/\lambda_0 \approx u^2/c^2 = 1.5\cdot10^{-24}$.'
    wrongFeedback: 'מצאו קודם את מהירות הסחיפה מ-$I = \lambda_0 u$, ואז את $\lambda^\prime/\lambda_0 \approx v^2/c^2$ עם $v = u$.'
    commonWrong:
      - value: 1.23e-12
        feedback: 'זה $u/c$. היחס הוא $u^2/c^2$: חסר הריבוע.'
      - value: 7.5e-25
        feedback: 'חישבתם $u^2/(2c^2)$, רק את ההתכווצות של היונים, $\gamma - 1$. גם האלקטרונים משתנים, $1 - 1/\gamma \approx u^2/(2c^2)$, וביחד $u^2/c^2$.'
        misconception: MC-lab-density-is-rest-density

