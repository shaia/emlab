chapter: 6
questions:
  # ------------------------------------------------ OBJ-6.15-1: why the force must be electric; what depends on the frame
  - id: Q-6.15-why-electric
    type: twotier
    objectives: [OBJ-6.15-1]
    qualitative: true
    prompt: >-
      במעבדה, מטען חיובי $q$ נע במקביל לתיל ישר וארוך שזורם בו זרם, והתיל מושך אותו. חוקרת נעה יחד עם המטען, כך שבמערכת הייחוס שלה המטען במנוחה. מה היא רואה?
    choices:
      - text: 'גם היא רואה את המטען נמשך אל התיל, אבל אצלה הכוח חשמלי.'
        correct: true
        feedback: 'נכון. שהמטען נמשך זו עובדה שכל המודדים מסכימים עליה. על מטען במנוחה כוח מגנטי לא פועל, ולכן אצלה הכוח חייב להיות חשמלי: במערכת שלה התיל טעון.'
      - text: 'היא רואה שהמטען לא זז ביחס לתיל, כי במערכת שלה אין עליו כוח.'
        feedback: 'אם במעבדה המטען מתקרב לתיל, הוא מתקרב אליו בכל מערכת ייחוס: "המטען פגע בתיל" הוא אירוע שכולם רואים. רק שם הכוח משתנה בין המערכות.'
        misconception: MC-force-type-absolute
      - text: 'גם היא רואה כוח מגנטי, כי השדה המגנטי של התיל קיים גם אצלה.'
        feedback: 'שדה מגנטי אכן יש גם אצלה, כי גם אצלה יש זרם. אבל הכוח המגנטי הוא $qvB$, והמטען במערכת שלה במנוחה, $v = 0$. כוח מגנטי על מטען במנוחה הוא אפס.'
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'על מטען במנוחה פועל רק כוח חשמלי, ולכן במערכת שלה התיל חייב להיות טעון.'
        correct: true
        feedback: 'נכון. וזה מה שתורת היחסות נותנת: היונים והאלקטרונים נעים אצלה במהירויות שונות, ולכן הצפיפויות שלהם שונות.'
      - text: 'התיל ניטרלי במעבדה, ולכן הוא ניטרלי בכל מערכת, ואין כוח חשמלי.'
        feedback: 'המטען של כל חלקיק זהה בכל מערכת, אבל הצפיפות הקווית תלויה במרווחים, והמרווחים מתכווצים לפי המהירות של כל שורה. אצלה התיל טעון.'
        misconception: MC-neutral-in-every-frame
      - text: 'אם הכוח מגנטי במעבדה, הוא מגנטי בכל מערכת ייחוס.'
        feedback: 'זה בדיוק מה שהשיעור מראה שאינו נכון. אותה דחיפה נקראת מגנטית במערכת אחת וחשמלית באחרת.'
        misconception: MC-force-type-absolute

  - id: Q-6.15-frame-invariant
    type: multi
    objectives: [OBJ-6.15-1]
    qualitative: true
    prompt: >-
      מטען $q$ נע במקביל לתיל שזורם בו זרם. משווים בין מערכת המעבדה למערכת המנוחה של $q$. אילו מהדברים הבאים **זהים** בשתי המערכות? סמנו את כל הנכונים.
    choices:
      - text: 'האם $q$ נמשך אל התיל או נדחה ממנו.'
        correct: true
        feedback: 'נכון. כיוון הדחיפה הוא תוצאה של ניסוי, ושתי המערכות מסכימות עליו.'
      - text: 'המטען של כל יון ושל כל אלקטרון.'
        correct: true
        feedback: 'נכון. המטען של חלקיק לא תלוי במהירות שלו. לכן אטומים, שבהם האלקטרונים נעים מהר, נשארים ניטרליים.'
      - text: 'מהירות האור בריק.'
        correct: true
        feedback: 'נכון. זו אחת משתי ההנחות של תורת היחסות הפרטית: $c$ זהה בכל מערכת ייחוס.'
      - text: 'צפיפות המטען הקווית נטו של התיל.'
        feedback: 'לא. במעבדה התיל ניטרלי, ובמערכת של $q$ הוא טעון, כי שתי שורות המטען מתכווצות בשיעורים שונים.'
        misconception: MC-neutral-in-every-frame
      - text: 'האם הכוח על $q$ חשמלי או מגנטי.'
        feedback: 'לא. במעבדה הכוח מגנטי, $qvB$, ובמערכת של $q$, שבה הוא במנוחה, הכוח חשמלי, $qE^\prime$.'
        misconception: MC-force-type-absolute
      - text: 'המהירות של $q$.'
        feedback: 'לא. במעבדה $q$ נע במהירות $v$, ובמערכת המנוחה שלו מהירותו אפס. מהירות תמיד נמדדת ביחס למערכת ייחוס.'

  - id: Q-6.15-rest-charge
    type: mc
    objectives: [OBJ-6.15-1]
    qualitative: true
    level: mid
    prompt: >-
      מטען $q$ נמצא במנוחה במעבדה, ליד תיל ניטרלי שזורם בו זרם. במעבדה לא פועל עליו כוח. רץ נע במהירות קבועה לאורך התיל. במערכת של הרץ $q$ נע, ויש שדה מגנטי. מה הרץ רואה?
    choices:
      - text: 'גם הוא רואה את $q$ נשאר באותו מרחק מהתיל: אצלו פועלים על $q$ כוח מגנטי וכוח חשמלי שמבטלים זה את זה.'
        correct: true
        feedback: 'נכון. במערכת של הרץ התיל טעון, כי היונים והאלקטרונים נעים אצלו במהירויות שונות. הכוח החשמלי מבטל בדיוק את הכוח המגנטי, כי מה שקורה ל-$q$, נשאר במרחק קבוע מהתיל, זהה בכל מערכת.'
      - text: 'הוא רואה כוח מגנטי שדוחף את $q$ אל התיל או ממנו, כי אצלו $q$ נע בשדה מגנטי, והתיל ניטרלי.'
        feedback: 'החלק המגנטי נכון, אבל התיל אצל הרץ **לא** ניטרלי. בלי הכוח החשמלי, הרץ היה רואה את $q$ זז לעבר התיל, בעוד שבמעבדה הוא לא זז. שני מודדים לא יכולים לחלוק על מה שקרה.'
        misconception: MC-neutral-in-every-frame
      - text: 'הוא לא רואה אף כוח, כי כוח מגנטי פועל רק במערכת שבה המטען נע במעבדה.'
        feedback: 'אצל הרץ $q$ נע בשדה מגנטי, ולכן פועל עליו כוח מגנטי $qvB$. התוצאה הנכונה, שאין תנועה לעבר התיל, נובעת מכך שגם כוח חשמלי פועל, והשניים מבטלים זה את זה.'
        misconception: MC-force-type-absolute

  # ------------------------------------------------ OBJ-6.15-2: Lorentz factor, contraction, line densities
  - id: Q-6.15-gamma-value
    type: numeric
    objectives: [OBJ-6.15-2]
    prompt: >-
      שורה של פרוטונים נעה במהירות $v = 0.6c$. מהו גורם לורנץ $\gamma$ שלה? (מספר בלי יחידות)
    answer: 1.25
    unit: ''
    tolerance: 0.01
    correctFeedback: 'נכון. $\gamma = \dfrac{1}{\sqrt{1 - 0.6^2}} = \dfrac{1}{\sqrt{0.64}} = \dfrac{1}{0.8} = 1.25$.'
    wrongFeedback: 'הציבו $v/c = 0.6$ ב-$\gamma = \dfrac{1}{\sqrt{1 - v^2/c^2}}$.'
    commonWrong:
      - value: 0.8
        feedback: 'חישבתם $\sqrt{1 - v^2/c^2}$ ועצרתם. $\gamma$ הוא ההופכי שלו, ותמיד גדול מ-1 או שווה לו.'
      - value: 1.5625
        feedback: 'שכחתם את השורש: $1/(1 - 0.36) = 1.5625$. צריך $1/\sqrt{0.64}$.'
      - value: 1.18
        feedback: 'השתמשתם בקירוב $\gamma \approx 1 + v^2/(2c^2)$. הקירוב טוב רק כש-$v$ קטנה בהרבה מ-$c$; ב-$0.6c$ הוא שוגה בכ-6%.'

  - id: Q-6.15-net-density
    type: numeric
    objectives: [OBJ-6.15-2]
    level: mid
    prompt: >-
      בתיל של ניסוי מחשבתי, במעבדה: היונים במנוחה עם צפיפות $\lambda_0 = 3\,\mu\text{C/m}$, והאלקטרונים נעים במהירות $0.8c$ עם צפיפות $-\lambda_0$. מטען $q$ נע במעבדה יחד עם האלקטרונים, באותה מהירות. מהי צפיפות המטען הקווית נטו של התיל במערכת המנוחה של $q$? ענו במיקרו-קולון למטר.
    answer: 3.2
    unit: μC/m
    tolerance: 0.02
    correctFeedback: 'נכון. $\gamma = 5/3$. היונים נעים אצל $q$, וצפיפותם $\gamma\lambda_0 = 5\,\mu\text{C/m}$. האלקטרונים במנוחה אצל $q$, וצפיפותם $-\lambda_0/\gamma = -1.8\,\mu\text{C/m}$. נטו: $3.2\,\mu\text{C/m}$, כלומר $\gamma\beta^2\lambda_0$.'
    wrongFeedback: 'מצאו את צפיפות היונים, שנעים במערכת של $q$, ואת צפיפות האלקטרונים, שבה הם במנוחה. זכרו שבמעבדה האלקטרונים נעים.'
    commonWrong:
      - value: 2.0
        feedback: 'חישבתם $\lambda_0(\gamma - 1)$: השארתם לאלקטרונים את הצפיפות $-\lambda_0$ גם במערכת שבה הם במנוחה. במעבדה הם נעים, ולכן שם הם כבר מכווצים; במנוחה הצפיפות שלהם קטנה פי $\gamma$, $-\lambda_0/\gamma$.'
        misconception: MC-lab-density-is-rest-density
      - value: 0
        feedback: 'מטען נשמר, אבל צפיפות לא: שתי השורות נעות אצל $q$ במהירויות שונות, ומתכווצות בשיעורים שונים.'
        misconception: MC-neutral-in-every-frame
      - value: 1.92
        feedback: 'זו התוצאה של הקירוב $\lambda^\prime \approx \lambda_0 v^2/c^2$. ב-$0.8c$ הקירוב לא תקף; התוצאה המדויקת היא $\gamma\beta^2\lambda_0$.'

  - id: Q-6.15-which-denser
    type: mc
    objectives: [OBJ-6.15-2]
    qualitative: true
    prompt: >-
      במעבדה התיל ניטרלי, והאלקטרונים נעים בו כלפי מטה. מטען $q$ נע במקביל לתיל כלפי מעלה, כלומר נגד האלקטרונים. איזו שורה צפופה יותר במערכת המנוחה של $q$?
    choices:
      - text: 'שורת האלקטרונים, ולכן התיל טעון במטען שלילי.'
        correct: true
        feedback: 'נכון. במהירויות קטנות $\lambda^\prime \approx \lambda_0uv/c^2$, והסימן הוא הסימן של $uv$: $q$ נע נגד האלקטרונים, ולכן $uv < 0$ והתיל שלילי. במילים: במערכת של $q$ האלקטרונים נעים מהר יותר מבמעבדה ומתקרבים זה לזה, והיונים, שמתחילים לנוע, מתקרבים זה לזה פחות.'
      - text: 'שורת היונים, ולכן התיל טעון במטען חיובי.'
        feedback: 'זה המצב כש-$q$ נע **עם** האלקטרונים, $uv > 0$: אז האלקטרונים אצלו מאטים ומתרווחים. כאן $q$ נע נגדם, $uv < 0$, והתיל שלילי.'
      - text: 'שתיהן צפופות באותה מידה, כי התיל ניטרלי במעבדה.'
        feedback: 'במעבדה שתי השורות צפופות באותה מידה. אצל $q$ הן נעות במהירויות שונות, ולכן מתכווצות בשיעורים שונים.'
        misconception: MC-neutral-in-every-frame
      - text: 'אף אחת: שתי השורות מתארכות, כי הן נעות ביחס ל-$q$.'
        feedback: 'גוף נע מתכווץ לאורך כיוון התנועה, הוא לא מתארך. ושורה צפופה יותר היא זו שמתכווצת יותר.'

  - id: Q-6.15-rank-net
    type: rank
    objectives: [OBJ-6.15-2]
    qualitative: true
    prompt: >-
      תיל ניטרלי במעבדה, והאלקטרונים בו נעים במהירות $u$. מטען $q$ נע לאורכו במהירות $v$ (כיוון חיובי: כיוון תנועת האלקטרונים). דרגו את **גודל** צפיפות המטען הנטו של התיל במערכת המנוחה של $q$, מהגדול לקטן. שוויון מותר.
    items:
      - id: A
        label: '$u = 0.6c$, $v = 0.6c$'
      - id: B
        label: '$u = 0.6c$, $v = 0$'
      - id: C
        label: '$u = 0$, $v = 0.6c$'
      - id: D
        label: '$u = 0.6c$, $v = -0.6c$'
    order: [[A, D], [B, C]]
    correctFeedback: 'נכון. גודל הצפיפות הנטו הוא $\gamma\lambda_0|uv|/c^2$, ולכן A ו-D שווים, $0.45\lambda_0$ (ב-D הסימן הפוך). ב-B המערכת של $q$ היא המעבדה, וב-C אין זרם, ושתי השורות נעות יחד: בשניהם התיל ניטרלי.'
    wrongFeedback: 'הצפיפות הנטו $\gamma\lambda_0 uv/c^2$ מתאפסת כשאחת המהירויות אפס. מה קורה לגודלה כשהופכים את הכיוון של $v$?'

  # ------------------------------------------------ OBJ-6.15-3: the two forces agree
  - id: Q-6.15-mu0-identity
    type: mc
    objectives: [OBJ-6.15-3]
    prompt: >-
      בהשוואה בין הכוח המגנטי במעבדה, $q\,v\,\dfrac{\mu_0 I}{2\pi r}$, לכוח החשמלי במערכת של $q$, $q\,\dfrac{2k\lambda^\prime}{r}$, צריך להחליף את $\dfrac{\mu_0}{2\pi}$ בביטוי עם $k$. במה?
    choices:
      - text: '$\dfrac{2k}{c^2}$'
        correct: true
        feedback: 'נכון. $\mu_0\varepsilon_0 = 1/c^2$ ו-$k = 1/(4\pi\varepsilon_0)$, ולכן $\mu_0/(2\pi) = 2k/c^2$. במספרים: $2\cdot9\cdot10^9/(9\cdot10^{16}) = 2\cdot10^{-7}$, המספר מהגדרת האמפר בשיעור 4.9.'
      - text: '$2k$'
        feedback: 'היחידות לא מתאימות: $2k$ גדול פי $c^2$, כ-$10^{17}$, מ-$\mu_0/(2\pi)$. חסר החילוק ב-$c^2$, שבא מ-$\mu_0\varepsilon_0 = 1/c^2$.'
      - text: '$\dfrac{k}{c}$'
        feedback: 'בדקו במספרים: $k/c = 30$, רחוק מאוד מ-$2\cdot10^{-7}$. הקשר הוא $\mu_0\varepsilon_0 = 1/c^2$, עם $c$ בריבוע.'
      - text: 'אין קשר: $\mu_0$ ו-$k$ הם קבועים של שני כוחות שונים.'
        feedback: 'כך חשבו לפני מקסוול ואיינשטיין. אבל $\mu_0\varepsilon_0 = 1/c^2$: שני הקבועים קשורים דרך מהירות האור, כי חשמל ומגנטיות הם שני פנים של אותה תופעה.'
        misconception: MC-force-type-absolute

  - id: Q-6.15-electric-force
    type: numeric
    objectives: [OBJ-6.15-3, OBJ-6.15-2]
    level: bagrut
    prompt: >-
      בתיל של ניסוי מחשבתי $\lambda_0 = 1\,\mu\text{C/m}$, והאלקטרונים נעים במעבדה במהירות $0.6c$. מטען $q = 2\,\text{nC}$ נע יחד איתם, במרחק $3\,\text{cm}$ מהתיל. מה גודל הכוח החשמלי על $q$ במערכת המנוחה שלו? ענו בניוטון.
    answer: 5.4e-4
    unit: N
    tolerance: 0.03
    correctFeedback: 'נכון. $\lambda^\prime = \gamma\beta^2\lambda_0 = 1.25\cdot0.36\cdot10^{-6} = 4.5\cdot10^{-7}\,\text{C/m}$, ו-$F^\prime = q\cdot\dfrac{2k\lambda^\prime}{r} = 2\cdot10^{-9}\cdot\dfrac{2\cdot9\cdot10^9\cdot4.5\cdot10^{-7}}{0.03} = 5.4\cdot10^{-4}\,\text{N}$, דחייה.'
    wrongFeedback: 'מצאו את $\lambda^\prime$ במערכת של $q$, ואז את השדה של תיל טעון, $E = 2k\lambda^\prime/r$, ואת $F^\prime = qE^\prime$.'
    commonWrong:
      - value: 4.32e-4
        feedback: 'זה הכוח המגנטי במעבדה, $qvB$. במערכת המנוחה של $q$ הכוח גדול ממנו פי $\gamma = 1.25$; במהירויות קטנות השניים כמעט שווים.'
      - value: 3.0e-4
        feedback: 'השתמשתם ב-$\lambda^\prime = \lambda_0(\gamma - 1)$, כאילו לאלקטרונים אותה צפיפות במעבדה ובמנוחה. במנוחה הצפיפות שלהם $\lambda_0/\gamma$.'
        misconception: MC-lab-density-is-rest-density
      - value: 2.7e-4
        feedback: 'שכחתם את ה-2: השדה של תיל טעון ארוך הוא $E = 2k\lambda/r$, ולכן הכוח כפול.'

  - id: Q-6.15-direction
    type: vector
    objectives: [OBJ-6.15-3]
    qualitative: true
    prompt: >-
      תיל אנכי, והזרם בו זורם כלפי מעלה. מטען חיובי $q$ נמצא מימין לתיל ונע כלפי מעלה, במקביל לזרם. מה כיוון הכוח על $q$ **במערכת המנוחה של $q$**?
    answer: w
    correctFeedback: 'נכון. במעבדה $q$ החיובי שנע כלפי מעלה הוא כמו זרם קטן כלפי מעלה, וזרמים מקבילים נמשכים (שיעור 4.9). במערכת של $q$: $q$ נע נגד האלקטרונים (הם נעים כלפי מטה), ולכן $\lambda^\prime \approx \lambda_0uv/c^2 < 0$. התיל שלילי, ומושך את $q$ שמאלה, אליו.'
    wrong:
      - dir: e
        feedback: 'זה כיוון של דחייה. בדקו במעבדה: זרם כלפי מעלה ומטען חיובי שנע כלפי מעלה הם כמו שני זרמים מקבילים, והם נמשכים.'
      - dir: zero
        feedback: 'על מטען במנוחה לא פועל כוח מגנטי, אבל במערכת שלו התיל טעון, ולכן פועל עליו כוח חשמלי. אם במעבדה $q$ נמשך, הוא נמשך בכל מערכת.'
        misconception: MC-force-type-absolute
      - dir: n
        feedback: 'הכוח של תיל ארוך על $q$ ניצב לתיל, בשתי המערכות: השדה החשמלי של תיל טעון יוצא ממנו בניצב, והכוח המגנטי ניצב למהירות.'
    wrongFeedback: 'קבעו קודם את הכיוון במעבדה בכלל כף יד ימין, או בכלל "זרמים מקבילים נמשכים". כיוון הדחיפה זהה בכל מערכת.'

  - id: Q-6.15-gamma-ratio
