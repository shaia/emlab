          $n \approx -2.4$. הוא מסיק שהסליל איננו דיפול מגנטי. מה נכון?
        choices:
          - text: 'הביטוי של חלק א מנבא את זה: השיפוע בגרף לוגריתמי משתנה עם המרחק, $n = -\dfrac{3z^2}{R^2 + z^2}$, והוא מתקרב ל-$n = -3$ רק כש-$z \gg R$.'
            correct: true
            feedback: 'נכון. $\ln B = C - \tfrac32\ln\left(R^2 + z^2\right)$, ולכן $n = \dfrac{d\ln B}{d\ln z} = -\dfrac{3z^2}{R^2 + z^2}$. ב-$z = 2R = 12\,\text{cm}$ זה $n = -2.4$, וב-$z = 11\,\text{cm}$ בערך $n = -2.3$, כמו במדידה. כדי שהשיפוע יגיע ל-$n = -2.9$ צריך $z \approx 5.4R$, כ-$32\,\text{cm}$. הדיפול הוא הקצה הרחוק, לא השדה בכל מרחק.'
          - text: 'השדה יורד כמו $1/z^{2.4}$, ולכן הסליל איננו דיפול מגנטי גם רחוק ממנו.'
            feedback: 'השיפוע לא קבוע. מהמדידות ב-2 וב-4 סנטימטרים יוצא $n \approx -0.56$, ומ-10 ו-12 סנטימטרים $n \approx -2.4$. הוא ממשיך לגדול בערכו המוחלט עם $z$ ושואף ל-$n = -3$: אין כאן חוק חזקה אחד, אלא מעבר בין שני קצוות.'
          - text: 'המדידות שגויות: השדה של כריכה יורד כמו $1/z^3$ בכל מרחק, ולכן השיפוע חייב להיות בדיוק $n = -3$.'
            feedback: 'נוסחת הדיפול היא הגבול של הביטוי המדויק כש-$z \gg R$, לא השדה בכל מרחק. ב-$z = 12\,\text{cm} = 2R$ היא נותנת כ-$98\,\mu\text{T}$, והמדידה $70\,\mu\text{T}$, כמו שהביטוי המדויק נותן.'
            misconception: MC-bagrut-formula-exact
          - text: 'השיפוע שואף ל-$n = -2$, כמו של מטען נקודתי, ו-$n \approx -2.4$ הוא בדרך לשם.'
            feedback: 'אין מטען מגנטי. רחוק מהכריכה כל תרומה קטנה כמו $1/z^2$, אבל כמעט כולה לרוחב הציר ומתבטלת, ורק החלק $R/z$ שלה נשאר: $1/z^3$. השיפוע כבר עבר את $n = -2$, והוא בדרך ל-$n = -3$.'
