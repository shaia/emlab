  - id: Q-6-bagrut-1
    type: bagrut
    title: חיישן שדה מגנטי על הציר של סליל שטוח
    prompt: >-
      סליל שטוח עגול של $N = 50$ כריכות סגור בתוך מעטפת פלסטיק, ולכן אי אפשר למדוד ישירות את הרדיוס $R$ של
      הכריכות. בסליל זורם זרם קבוע $I$ מספק שהמד שלו מקולקל, ולכן גם הזרם לא ידוע. כדי למצוא את שניהם, תלמידים
      מזיזים חיישן שדה מגנטי לאורך ציר הסליל ומודדים את השדה במרחק $z$ ממרכז הסליל. לפני המדידות הם מאפסים את
      החיישן כשהזרם כבוי, כך שהוא מראה רק את השדה של הסליל. החיישן מודד את רכיב השדה לאורך הציר, ומציג אותו
      במיקרוטסלה שלמים. המדידות:
      $$\begin{array}{c|c} z\,(\text{cm}) & B\,(\mu\text{T}) \\ \hline 2.0 & 668 \\ 4.0 & 454 \\ 6.0 & 278 \\ 8.0 & 168 \\ 10.0 & 108 \\ 12.0 & 70 \end{array}$$
      הזניחו את העובי של הסליל: כל הכריכות באותו מישור ובאותו רדיוס.
    diagramAlt: >-
      מבט מהצד. משמאל הסליל השטוח, בצבע הזהב, נראה כאליפסה צרה וגבוהה. בקצה העליון שלה הזרם יוצא מהדף (⊙), ובקצה
      התחתון הוא נכנס לדף (⊗). דרך מרכז הסליל עובר ימינה ציר אופקי מקווקו, z. משמאל לסליל מסומן הרדיוס R, מהמרכז
      עד הקצה העליון. על הציר, מימין לסליל, החיישן: מלבן קטן, ומימינו חץ כחול ימינה, השדה B לאורך הציר. מתחת לציר
      מסומן המרחק z בין מרכז הסליל לחיישן.
