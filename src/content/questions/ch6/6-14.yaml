    answer: 1940
    unit: V/m
    tolerance: 0.03
    correctFeedback: 'נכון. $\langle S\rangle = 5\cdot10^{-3}/10^{-6} = 5000\,\text{W/m}^2$, ו-$E_0 = \sqrt{2\langle S\rangle/(c\varepsilon_0)} \approx 1.94\cdot10^3\,\text{V/m}$.'
    wrongFeedback: 'העוצמה היא ההספק חלקי השטח, ו-$\langle S\rangle = \tfrac12c\varepsilon_0E_0^2$. שימו לב: $1\,\text{mm}^2 = 10^{-6}\,\text{m}^2$.'
    commonWrong:
      - value: 1372
        feedback: 'שכחתם את החצי שבממוצע: $\langle S\rangle = \tfrac12c\varepsilon_0E_0^2$, ולכן $E_0 = \sqrt{2\langle S\rangle/(c\varepsilon_0)}$.'
      - value: 3.77e6
        feedback: 'שכחתם להוציא שורש: זה $E_0^2$.'
      - value: 61.4
        feedback: 'השתמשתם ב-$1\,\text{mm}^2 = 10^{-3}\,\text{m}^2$. מילימטר רבוע הוא $10^{-6}\,\text{m}^2$.'

