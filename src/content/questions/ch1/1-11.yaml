# Chapter-1 review question bank (lesson 1.11). Strings may hold $inline$ / $$display$$ TeX.
# YAML note: plain and single-quoted strings keep backslashes literally; quote values that contain ": ".
# Every number was recomputed with src/physics (constants.ts, charge-in-field.ts, lab-data.ts).

chapter: 1
questions:
  # ------------------------------------------------ OBJ-1.11-1: experiment <-> claim
  - id: Q-1.11-match-experiment
    type: mc
    objectives: [OBJ-1.11-1]
    qualitative: true
    prompt: >-
      איזה ניסוי הראה שהכוח בין שני מטענים נקודתיים ביחס הפוך לריבוע המרחק ביניהם?
    choices:
      - text: מאזן הפיתול של קולון, שמדד את הכוח במרחקים שונים.
        correct: true
        feedback: נכון. מדידות הכוח כפונקציה של המרחק הראו את התלות $F \propto 1/r^2$.
      - text: ניסוי טיפות השמן של מיליקן.
        feedback: 'מיליקן מדד מטען של טיפות. הניסוי הראה שהמטען מכומת, לא איך הכוח תלוי במרחק.'
      - text: שפופרת קרן קתודית עם לוחות מסיטים.
        feedback: 'בשפופרת השדה אחיד ולא תלוי במרחק. היא נותנת מידע על היחס בין מטען למסה של החלקיק.'
      - text: האלקטרוסקופ, שהעלים שלו נפתחים.
        feedback: 'האלקטרוסקופ מראה שיש מטען ושהעלים דוחים זה את זה, אבל הוא לא מודד כוח כפונקציה של מרחק.'

  - id: Q-1.11-electroscope-sign
    type: mc
    objectives: [OBJ-1.11-1]
    qualitative: true
    prompt: >-
      אלקטרוסקופ **לא טעון**. מקרבים אל הכדור שלו מוט, בלי לגעת, והעלים נפתחים.
      מה אפשר להסיק על המוט?
    choices:
      - text: המוט טעון, אבל אי אפשר לדעת באיזה סימן.
        correct: true
        feedback: נכון. מוט טעון בכל סימן מפריד מטענים באלקטרוסקופ ופותח את העלים. הפתיחה מראה שיש מטען, לא את הסימן שלו.
      - text: המוט טעון חיובית.
        feedback: 'מוט שלילי היה פותח את העלים באותה מידה. השראה מפרידה מטענים בשני המקרים.'
        misconception: MC-leaves-show-sign
      - text: המוט טעון שלילית.
        feedback: 'מוט חיובי היה פותח את העלים באותה מידה. השראה מפרידה מטענים בשני המקרים.'
        misconception: MC-leaves-show-sign
      - text: המוט טעון באותו סימן של העלים, ולכן הם נדחים.
        feedback: 'האלקטרוסקופ לא טעון, ולכן אין לעלים סימן. העלים נפתחים כי השראה מפרידה בהם מטענים, לא כי יש להם סימן קודם.'

  - id: Q-1.11-cage-grounding
    type: mc
    objectives: [OBJ-1.11-1]
    qualitative: true
    prompt: >-
      יוצרים שדה חשמלי חזק ליד כלוב מתכת סגור, שאינו מחובר לאדמה. מה השדה בתוך חלל הכלוב?
    choices:
      - text: אפס, גם בלי הארקה.
        correct: true
        feedback: נכון. המטענים על המתכת מסתדרים כך שהשדה בתוכה מתאפס. לכן אפשר להיות בטוחים בתוך כלוב, וזה ניסוי כלוב פאראדיי.
      - text: אפס, אבל רק אם הכלוב מחובר לאדמה.
        feedback: 'ההארקה אינה הכרחית. התאפסות השדה בתוך החלל נובעת מכך שהמוליך בשיווי משקל.'
        misconception: MC-cage-needs-grounding
      - text: חלש יותר מבחוץ, אבל לא אפס.
        feedback: 'במוליך אידיאלי בשיווי משקל השדה בחלל הפנימי מתאפס לגמרי.'
      - text: אותו שדה כמו מבחוץ, כי השדה חודר דרך המתכת.
        feedback: 'שדה חשמלי סטטי אינו חודר למוליך. המטענים החופשיים זזים עד שהם מבטלים אותו בפנים.'

  # ------------------------------------------------ OBJ-1.11-2: linearisation of Coulomb data
  - id: Q-1.11-which-graph
    type: mc
    objectives: [OBJ-1.11-2]
    qualitative: true
    prompt: >-
      חוקרים תלות אחרת: כוח $F$ שעשוי להיות ביחס הפוך למרחק עצמו, $F = C/r$, בלי ריבוע.
      איזה גרף ייתן קו ישר אם זה החוק?
    choices:
      - text: $F$ כפונקציה של $1/r$
        correct: true
        feedback: נכון. אם $F = C/r$, אז $F$ ביחס ישר ל-$1/r$, והגרף הוא קו ישר שעובר דרך הראשית.
      - text: $F$ כפונקציה של $1/r^2$
        feedback: 'זה הגרף שמתיישר כשהכוח ביחס הפוך לריבוע המרחק. כאן החוק שונה, ולכן הנקודות היו מתעקמות.'
      - text: $F$ כפונקציה של $r$
        feedback: 'זה גרף יורד ועקום. עקומה יורדת מתאימה להרבה חוקים, ולכן אי אפשר לדעת ממנה איזה חוק פועל.'
        misconception: MC-curve-shape-not-proof
      - text: $F$ כפונקציה של $r^2$
        feedback: 'אם $F = C/r$, אז $F\cdot r$ קבוע. הגרף של $F$ מול $r^2$ הוא עקומה יורדת, לא קו ישר.'

  - id: Q-1.11-slope-meaning
    type: mc
    objectives: [OBJ-1.11-2]
    qualitative: true
    prompt: >-
      בגרף של $F$ כפונקציה של $1/r^2$ הנקודות על קו ישר. מה מבטא השיפוע של הקו?
    choices:
      - text: $k\,q_1 q_2$
        correct: true
        feedback: נכון. $F = k q_1 q_2 \cdot \dfrac{1}{r^2}$, ולכן השיפוע הוא מכפלת הקבוע במטענים.
      - text: $k$
        feedback: 'השיפוע כולל גם את המטענים. $k$ בלבד היה השיפוע רק אם $q_1 q_2 = 1$.'
        misconception: MC-slope-is-k
      - text: $q_1 q_2$
        feedback: 'חסר הקבוע $k$. השיפוע הוא $F\cdot r^2$, כלומר $k q_1 q_2$.'
      - text: $1/k$
        feedback: 'נוסחת קולון היא $F = k q_1 q_2/r^2$, ולכן $k$ מוכפל במטענים ולא מופיע במכנה.'

  - id: Q-1.11-slope-charge
    type: numeric
    objectives: [OBJ-1.11-2]
    level: bagrut
    prompt: >-
      בניסוי מדדו את הכוח בין שני כדורים קטנים במרחקים שונים, וציירו גרף של $F$ כפונקציה של $1/r^2$.
      השיפוע של קו המגמה הוא $7.2\cdot10^{-4}\,\text{N}\cdot\text{m}^2$. מטען הכדור הראשון הוא $4\cdot10^{-7}\,\text{C}$.
      מה מטען הכדור השני? ($k = 9\cdot10^{9}\,\text{N}\cdot\text{m}^2/\text{C}^2$)
    answer: 2.0e-7
    unit: C
    tolerance: 0.03
    correctFeedback: 'נכון. השיפוע הוא $k q_1 q_2$, ולכן $q_2 = \dfrac{7.2\cdot10^{-4}}{9\cdot10^{9}\cdot 4\cdot10^{-7}} = 2.0\cdot10^{-7}\,\text{C}$.'
    wrongFeedback: 'השיפוע הוא $k q_1 q_2$. פתרו את $q_2$ והציבו את הנתונים ביחידות SI.'
    commonWrong:
      - value: 1800
        feedback: 'חילקתם רק ב-$q_1$ ושכחתם לחלק ב-$k$. השיפוע כולל את $k$.'
        misconception: MC-slope-is-k
      - value: 8.0e-14
        feedback: 'חילקתם רק ב-$k$ ושכחתם לחלק ב-$q_1$. השיפוע הוא $k q_1 q_2$, ולא $k q_2$.'
    hints:
      - 'כתבו את נוסחת קולון בצורה $F = s\cdot\dfrac{1}{r^2}$ עם $s$ השיפוע.'

  - id: Q-1.11-force-at-distance
    type: numeric
    objectives: [OBJ-1.11-2]
    level: mid
    prompt: >-
      בגרף של $F$ כפונקציה של $1/r^2$ השיפוע של קו המגמה הוא $7.2\cdot10^{-4}\,\text{N}\cdot\text{m}^2$.
      מה הכוח בין הכדורים במרחק $r = 0.10\,\text{m}$?
    answer: 0.072
    unit: N
    tolerance: 0.03
    correctFeedback: 'נכון. $F = \dfrac{s}{r^2} = \dfrac{7.2\cdot10^{-4}}{0.10^2} = 0.072\,\text{N}$.'
    wrongFeedback: 'הכוח הוא השיפוע $s$ כפול $1/r^2$.'
    commonWrong:
      - value: 7.2e-3
        feedback: 'חילקתם ב-$r$ במקום ב-$r^2$. המרחק נכנס בריבוע: $r^2 = 0.01\,\text{m}^2$.'
        misconception: MC-field-linear-in-r
      - value: 7.2e-6
        feedback: 'הכפלתם את השיפוע ב-$r^2$ במקום לחלק בו.'
    hints:
      - '$F = k q_1 q_2 / r^2$, והשיפוע כבר כולל את $k q_1 q_2$.'

  - id: Q-1.11-unit-fits
    type: mc
    objectives: [OBJ-1.11-3]
    qualitative: true
    prompt: >-
      בניסוי מדדו המון טיפות, וכל המטענים שהתקבלו הם כפולות שלמות גם של $1.6\cdot10^{-19}\,\text{C}$ וגם של $0.8\cdot10^{-19}\,\text{C}$.
      למה מקבלים את $1.6\cdot10^{-19}\,\text{C}$ כמטען היסודי?
    choices:
      - text: זו היחידה הגדולה ביותר שמתאימה לכל הנתונים. עם $0.8\cdot10^{-19}\,\text{C}$ חצי מהכפולות היו ריקות, ואף טיפה לא נמדדה בהן.
        correct: true
        feedback: נכון. חצי, שליש ורבע של יחידה שמתאימה תמיד מתאימים גם הם, ולכן הם לא אומרים כלום. בוחרים את הגדולה ביותר.
      - text: כל יחידה שמחלקת את הנתונים היא מטען יסודי, ו-$1.6\cdot10^{-19}\,\text{C}$ נבחרה בגלל שהיא עגולה יותר.
        feedback: 'אם כל יחידה כזו הייתה מטען יסודי, גם $0.4\cdot10^{-19}\,\text{C}$ ו-$0.2\cdot10^{-19}\,\text{C}$ היו מתאימות. מחפשים את היחידה הגדולה ביותר.'
        misconception: MC-unit-any-divisor
      - text: כי במדידה אמיתית יש שגיאה של כמה אחוזים, והנקודות לא יושבות בדיוק על הכפולות. לכן מחפשים יחידה שהנקודות קרובות אליה, והגדולה מבין אלה היא הנכונה.
        feedback: 'השגיאה של כמה אחוזים היא סיבה לבדוק קרבה ולא התאמה מדויקת, אבל היא לא מכריעה בין $1.6$ ל-$0.8$: שתיהן קרובות לנקודות. מה שמכריע הוא הקווים הריקים.'
      - text: כי $0.8\cdot10^{-19}\,\text{C}$ קטנה משגיאת המדידה, ולכן אי אפשר להבחין בין הכפולות שלה.
        feedback: 'שגיאה של כמה אחוזים היא קטנה בהרבה מ-$0.8\cdot10^{-19}\,\text{C}$. אפשר להבחין היטב בין הכפולות שלה.'

  - id: Q-1.11-millikan-n
    type: numeric
    objectives: [OBJ-1.11-3]
    prompt: >-
      טיפה מרחפת בניסוי מיליקן ומטענה $6.4\cdot10^{-19}\,\text{C}$. כמה מטענים יסודיים ($e = 1.6\cdot10^{-19}\,\text{C}$) עליה?
    answer: 4
    unit: מטענים יסודיים
    tolerance: 0.03
    correctFeedback: 'נכון. $n = \dfrac{q}{e} = \dfrac{6.4\cdot10^{-19}}{1.6\cdot10^{-19}} = 4$.'
    wrongFeedback: 'חלקו את המטען במטען היסודי.'
    hints:
      - '$q = n e$. פתרו את $n$.'

  - id: Q-1.11-e-estimate
    type: numeric
    objectives: [OBJ-1.11-3]
    level: bagrut
    prompt: >-
      בארבע מדידות התקבלו המטענים הבאים, ביחידות של $10^{-19}\,\text{C}$: $4.9$, $3.1$, $8.2$, $6.5$.
      ידוע שהם מכילים 3, 2, 5 ו-4 מטענים יסודיים בהתאמה. מה ההערכה של המטען היסודי, כממוצע של $q/n$ מארבע המדידות?
      ענו ביחידות של $10^{-19}\,\text{C}$.
    answer: 1.61
    unit: 10⁻¹⁹ C
    tolerance: 0.03
    correctFeedback: 'נכון. $\dfrac{1}{4}\left(\dfrac{4.9}{3}+\dfrac{3.1}{2}+\dfrac{8.2}{5}+\dfrac{6.5}{4}\right) = 1.61$, בקירוב לערך $1.6$.'
    wrongFeedback: 'חלקו כל מטען במספר המטענים היסודיים שלו, ורק אז חשבו ממוצע.'
    commonWrong:
      - value: 5.675
        feedback: 'חישבתם ממוצע של המטענים עצמם. הם כפולות שונות של $e$, ולכן צריך קודם לחלק בכל $n$.'
        misconception: MC-charge-continuous
    hints:
      - 'לכל מדידה חשבו $q/n$. מה מקבלים?'

  # ------------------------------------------------ OBJ-1.11-4: combining the laws of the chapter
  - id: Q-1.11-integrated-field
    type: numeric
    objectives: [OBJ-1.11-4]
    level: bagrut
    prompt: >-
      מטען נקודתי של $+3\,\mu\text{C}$ נמצא בראשית. אלקטרון מונח במרחק $0.30\,\text{m}$ ממנו ומשוחרר ממנוחה.
      מה גודל התאוצה ההתחלתית שלו? ($k = 9\cdot10^{9}\,\text{N}\cdot\text{m}^2/\text{C}^2$, $m = 9.1\cdot10^{-31}\,\text{kg}$, $e = 1.6\cdot10^{-19}\,\text{C}$)
    answer: 5.27e16
    unit: m/s²
    tolerance: 0.03
    correctFeedback: >-
      נכון. שני שלבים: השדה של מטען נקודתי, $E = \dfrac{kQ}{r^2} = \dfrac{9\cdot10^9\cdot 3\cdot10^{-6}}{0.30^2} = 3.0\cdot10^{5}\,\text{N/C}$,
      ואחר כך התאוצה $a = \dfrac{eE}{m} = 5.3\cdot10^{16}\,\text{m/s}^2$.
    wrongFeedback: 'חשבו קודם את השדה בנקודה (חוק קולון), ואחר כך את התאוצה של האלקטרון בשדה הזה.'
    commonWrong:
      - value: 2.87e13
        feedback: 'הצבתם את מסת הפרוטון. החלקיק כאן הוא אלקטרון.'
    hints:
      - '$E = kQ/r^2$ ואז $a = eE/m$.'

  - id: Q-1.11-law-for-task
    type: mc
    objectives: [OBJ-1.11-4]
    qualitative: true
    prompt: >-
      רוצים לדעת איפה אלקטרון שנכנס בין שני לוחות טעונים פוגע במסך. באיזה סדר משתמשים בכלים שלמדנו?
    choices:
      - text: שדה אחיד בין הלוחות ← $F = qE$ ו-$a = F/m$ ← תנועה כמו קליע (מהירות קבועה בכיוון הכניסה, תאוצה קבועה בניצב) ← קו ישר עד המסך.
        correct: true
        feedback: 'נכון. זו שרשרת מכמה שיעורים: שדה אחיד בין לוחות, כוח על מטען, החוק השני של ניוטון וקינמטיקה.'
      - text: חוק קולון בין האלקטרון לכל לוח ← סכום כוחות ← קו ישר עד המסך.
        feedback: 'אפשר לחשב כך בעיקרון, אבל הלוחות אינם מטענים נקודתיים. השדה האחיד שביניהם הוא הכלי המתאים.'
      - text: חוק גאוס על האלקטרון ← שדה ← מסלול מעגלי.
        feedback: 'גאוס עוזר למצוא שדה של פיזור מטענים סימטרי. האלקטרון הוא מטען הבוחן, והמסלול פרבולי ולא מעגלי.'
      - text: מטען האלקטרון אינו משנה, כי האלקטרון תמיד נע בכיוון השדה.
        feedback: 'סימן המטען קובע את כיוון הכוח: אלקטרון מוסט נגד השדה.'
        misconception: MC-beam-follows-field

  - id: Q-1.11-cage-charge-inside
    type: mc
    objectives: [OBJ-1.11-4]
    qualitative: true
    prompt: >-
      קליפה מוליכה כדורית וחלולה, לא טעונה ולא מוארקת. מניחים בתוך החלל מטען $+Q$, בלי לגעת בקליפה.
      מה נכון?
    choices:
      - text: על הדופן הפנימית של הקליפה מטען $-Q$, על הדופן החיצונית $+Q$, ומחוץ לקליפה יש שדה.
        correct: true
        feedback: נכון. לפי גאוס, בתוך המוליך השדה אפס, ולכן על הדופן הפנימית מצטבר $-Q$. הקליפה ניטרלית, ולכן על הדופן החיצונית מופיע $+Q$, והוא יוצר שדה מחוץ לקליפה.
      - text: אין שום מטען על הקליפה, ואין שדה מחוץ לה.
        feedback: 'הכלוב מגן על החלל שבתוכו מהשדות שמבחוץ, אבל מטען שבתוך החלל גורר מטען על הדפנות של הקליפה, ושדה מחוץ לה.'
        misconception: MC-cage-shields-both-ways
      - text: על הדופן הפנימית $-Q$ ועל הדופן החיצונית $-Q$.
        feedback: 'הקליפה ניטרלית. סך המטענים עליה אפס, ולכן הדופן החיצונית מקבלת $+Q$ כדי לאזן את $-Q$ שעל הדופן הפנימית.'
      - text: על הדופן הפנימית $+Q$, כי מטענים שווים נמשכים.
        feedback: 'מטענים מנוגדים נמשכים. המטען $+Q$ מושך אליו שלילי, ולכן על הדופן הפנימית $-Q$.'

  - id: Q-1.11-shell-accel
    type: numeric
    objectives: [OBJ-1.11-4]
    level: bagrut
    prompt: >-
