      ($e = 1.6\cdot10^{-19}\,\text{C}$, $m_e = 9.1\cdot10^{-31}\,\text{kg}$, $g = 10\,\text{m/s}^2$)
    diagramAlt: אלקטרון נכנס בכיוון אופקי בין שני לוחות אופקיים באורך L; בין הלוחות שדה חשמלי E כלפי מטה, והלוח העליון חיובי.
