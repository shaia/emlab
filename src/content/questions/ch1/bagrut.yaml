  - id: Q-1-bagrut-6
    type: bagrut
    title: חוק קולון על מאזניים אלקטרוניים
    prompt: >-
      תלמידים בדקו את חוק קולון בעזרת שני כדורי מתכת קטנים וזהים, שהרדיוס של כל אחד מהם $R = 1.0\,\text{cm}$.
      כדור A מונח על מוט מבודד שעומד על מאזניים אלקטרוניים. כדור B מוחזק בדיוק מעל A, על מוט מבודד שמחובר למעמד,
      ואינו נוגע במאזניים.

      התלמידים טענו את כדור A במטען חיובי, נגעו בו בכדור B והרחיקו את B. כך התחלק המטען בין שני הכדורים הזהים
      שווה בשווה, ועל כל כדור יש מטען $q$. אחר כך איפסו את המאזניים כשעליהם רק A, והחזירו את B מעל A במרחקים שונים.
      $r$ הוא המרחק בין מרכזי הכדורים.
      ($k = 9\cdot10^{9}\,\text{N}\cdot\text{m}^2/\text{C}^2$, $g = 10\,\text{m/s}^2$, $1\,\text{mg} = 10^{-6}\,\text{kg}$)
