      - label: ב
        type: numeric
        points: 6
        level: mid
        objectives: [OBJ-1.5-1]
        prompt: מה גודל התאוצה של האלקטרון בין הלוחות? התעלמו מהכבידה.
        answer: 7.03e14
        unit: m/s²
        correctFeedback: 'נכון: $F = eE$ ו-$a = F/m = \dfrac{1.6\cdot10^{-19}\cdot4.0\cdot10^{3}}{9.1\cdot10^{-31}} = 7.0\cdot10^{14}\,\text{m/s}^2$.'
        wrongFeedback: 'הכוח הוא $F = eE$, והתאוצה לפי החוק השני של ניוטון היא $a = F/m$. מסת האלקטרון קטנה מאוד, ולכן התאוצה עצומה.'
        hints:
          - 'מצאו קודם את הכוח מההגדרה של השדה, $F = |q|E$.'

      - label: ג
        type: numeric
        points: 5
        level: mid
        objectives: [OBJ-1.10-2]
        prompt: כמה זמן האלקטרון נמצא בין הלוחות?
        answer: 2.5e-9
        unit: s
        correctFeedback: 'נכון. אופקית אין כוח, ולכן המהירות קבועה: $t = \dfrac{L}{v_0} = \dfrac{0.050}{2.0\cdot10^{7}} = 2.5\cdot10^{-9}\,\text{s}$.'
        wrongFeedback: 'בכיוון האופקי אין כוח, ולכן $v_0$ קבועה והזמן הוא $t = L/v_0$. המירו את $L$ למטרים.'
        hints:
          - 'איזה כוח פועל בכיוון האופקי?'

      - label: ד
        type: numeric
        points: 8
        level: bagrut
        standalone: false
        objectives: [OBJ-1.5-1, OBJ-1.10-2]
        prompt: בכמה מילימטרים האלקטרון סוטה אנכית, מרגע הכניסה לשדה ועד היציאה ממנו?
        answer: 2.198
        unit: mm
        correctFeedback: 'נכון. אנכית התאוצה קבועה והמהירות ההתחלתית אפס: $y = \tfrac12 a t^2 = \tfrac12\cdot7.03\cdot10^{14}\cdot(2.5\cdot10^{-9})^2 = 2.2\cdot10^{-3}\,\text{m}$.'
        wrongFeedback: 'אנכית: $y = \tfrac12 a t^2$, עם התאוצה מסעיף ב והזמן מסעיף ג. התוצאה במטרים, ואחר כך ממירים למילימטרים.'
        commonWrong:
          - value: 4.396
            feedback: 'שכחתם את החצי בנוסחה $y = \tfrac12 a t^2$.'
        hints:
          - 'אנכית האלקטרון מתחיל ממנוחה ומאיץ בתאוצה קבועה.'

      - label: ה
        type: open
        points: 10
        level: bagrut
        objectives: [OBJ-1.5-1, OBJ-1.10-1]
        prompt: >-
          הראו בחישוב שאפשר להזניח את כוח הכובד על האלקטרון לעומת הכוח החשמלי. כתבו את הפתרון בפורמט בגרות.
        hints:
          - 'חשבו את שני הכוחות והשוו ביניהם במנה.'
        solution:
          - { kind: formula, text: '$F_E = eE$ ו-$F_g = mg$' }
          - { kind: substitution, text: '$F_E = 1.6\cdot10^{-19}\,\text{C}\cdot4.0\cdot10^{3}\,\text{N/C} = 6.4\cdot10^{-16}\,\text{N}$' }
          - { kind: substitution, text: '$F_g = 9.1\cdot10^{-31}\,\text{kg}\cdot10\,\text{m/s}^2 = 9.1\cdot10^{-30}\,\text{N}$' }
          - { kind: manipulation, text: '$\dfrac{F_E}{F_g} = \dfrac{6.4\cdot10^{-16}}{9.1\cdot10^{-30}}$' }
          - { kind: result, text: '$\dfrac{F_E}{F_g} \approx 7\cdot10^{13}$: הכוח החשמלי גדול פי $7\cdot10^{13}$, ולכן אפשר להזניח את הכבידה.' }
        rubric:
          - text: כתבתי את שתי הנוסחאות, $F_E = eE$ ו-$F_g = mg$.
          - text: הצבתי נכון עם יחידות וקיבלתי $6.4\cdot10^{-16}\,\text{N}$ ו-$9.1\cdot10^{-30}\,\text{N}$.
          - text: השוויתי את הכוחות במנה, בערך $7\cdot10^{13}$.
          - text: כתבתי מסקנה במילים, שהכוח החשמלי גדול בהרבה ולכן מזניחים את הכבידה.

