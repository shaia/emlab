          - text: 'הלוח התחתון שלילי, ולכן הוא דוחף את הטיפה כלפי מעלה, ולכן הטיפה שלילית.'
            feedback: 'זה נימוק מעגלי: הוא מניח את סימן הטיפה כדי להסיק אותו. נימוק תקף מתחיל בהשוואה בין כיוון הכוח לכיוון השדה.'
        hints:
          - 'השוו את כיוון הכוח לכיוון השדה.'

      - label: ג
        type: numeric
        points: 8
        level: bagrut
        objectives: [OBJ-1.5-1]
        prompt: מה גודל המטען של הטיפה?
        answer: 3.2e-19
        unit: C
        correctFeedback: 'נכון. שיווי משקל: $|q|E = mg$, ולכן $|q| = \dfrac{mg}{E} = \dfrac{4.8\cdot10^{-15}\cdot10}{1.5\cdot10^{5}} = 3.2\cdot10^{-19}\,\text{C}$.'
        wrongFeedback: 'הטיפה במנוחה, ולכן הכוח החשמלי $|q|E$ שווה לכוח הכובד $mg$. בודדו את $|q|$.'
        commonWrong:
          - value: 3.2e-20
            feedback: 'שכחתם להכפיל ב-$g$. הכוח שמאזן את הטיפה הוא כוח הכובד $mg$, לא המסה.'
        hints:
          - 'כתבו שני כוחות שמאזנים זה את זה, והציבו בהם את הנוסחאות.'

      - label: ד
        type: numeric
        points: 6
        level: mid
        standalone: false
        objectives: [OBJ-1.1-2, OBJ-1.10-4]
        prompt: כמה אלקטרונים עודפים יש על הטיפה?
        answer: 2
        unit: אלקטרונים
        correctFeedback: 'נכון. $n = \dfrac{|q|}{e} = \dfrac{3.2\cdot10^{-19}}{1.6\cdot10^{-19}} = 2$. המטען הוא כפולה שלמה של מטען האלקטרון, בדיוק מה שמיליקן גילה.'
        wrongFeedback: 'מטען הטיפה הוא כפולה שלמה של מטען האלקטרון: $n = |q|/e$.'
        hints:
          - 'חלקו את מטען הטיפה במטען של אלקטרון אחד.'

      - label: ה
        type: open
        points: 10
        level: bagrut
        objectives: [OBJ-1.5-1, OBJ-1.5-2, OBJ-1.10-1]
        prompt: >-
          מכפילים את עוצמת השדה, והמטען והמסה לא משתנים. מה גודל התאוצה של הטיפה ברגע שאחרי הכפלת השדה, ובאיזה כיוון?
          כתבו את הפתרון בפורמט בגרות.
        hints:
          - 'מה הכוח השקול על הטיפה אחרי הכפלת השדה? הכוח החשמלי הכפיל את עצמו.'
        solution:
          - { kind: formula, text: '$\sum F = ma$ עם $F_E = |q|E'' = 2|q|E = 2mg$' }
          - { kind: manipulation, text: 'ציר כלפי מעלה: $F_E - mg = ma$, ולכן $a = \dfrac{2mg - mg}{m} = g$.' }
          - { kind: substitution, text: '$a = g = 10\,\text{m/s}^2$' }
          - { kind: result, text: 'התאוצה $10\,\text{m/s}^2$ כלפי מעלה: הכוח החשמלי כפול מהכבידה, והטיפה מתחילה לעלות.' }
        rubric:
          - text: הבנתי שהכוח החשמלי הוא עכשיו $2mg$, כלומר כפול מהכבידה.
          - text: כתבתי את החוק השני של ניוטון עם סימנים נכונים לפי ציר שבחרתי.
          - text: קיבלתי $a = g = 10\,\text{m/s}^2$ עם יחידות.
          - text: ציינתי שהכיוון כלפי מעלה.

  # ------------------------------- 5: an oil drop in an AI simulation (Bagrut 036371, summer 2026, question 1)
  # The exam's own question, all five parts (ה, on page 3 of the paper, worth 5⅓ points, taken here as 5;
  # its text from https://www.divici.co.il/q/QB9Q73M/, read 2026-11-05). The line fit is fitLine() from
  # src/physics/lab.ts: slope 7.9·10⁻⁵ C/kg, intercept −13.05 m/s², residuals at most 0.7 m/s².
  - id: Q-1-bagrut-5
    type: bagrut
    title: טיפת שמן בהדמיה של בינה מלאכותית (בגרות קיץ תשפ״ו)
    prompt: >-
      תלמידים חקרו תנועה של טיפת שמן בשדה חשמלי. המחקר נערך בעזרת הדמיית מחשב שנכתבה על ידי בינה מלאכותית,
      ומדמה ניסוי שמבוצע על פני כדור הארץ. בהדמיה זו השפעת כוח הכבידה של כדור הארץ על טיפת שמן **לא ניתנת להזנחה**,
      ואילו השפעת התנגדות האוויר על הטיפה ניתנת להזנחה.

      בהדמיה, טיפת שמן שמסתה $m$, הטעונה במטען חיובי $q$, נעה באזור שבו קיים שדה חשמלי אחיד $E$ בין שני לוחות
      מישוריים טעונים ומקבילים לקרקע. כיוון השדה החשמלי הוא כלפי מעלה, במאונך ללוחות. הטיפה שוחררה ממנוחה בנקודה
      כלשהי בין הלוחות, כמתואר בתרשים. הכיוון החיובי של ציר המקום מוגדר כלפי מעלה.
      ($1\,\text{V/m} = 1\,\text{N/C}$)
    diagramAlt: שני לוחות אופקיים מקבילים; ביניהם שדה חשמלי אחיד E כלפי מעלה, וטיפת שמן חיובית במנוחה בין הלוחות. ציר y כלפי מעלה.
    diagram: |
      <svg viewBox="0 0 420 170" width="420" height="170" font-size="15" aria-hidden="true">
