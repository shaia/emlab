    parts:
      - label: א
        type: twotier
        points: 5
        level: mid
        qualitative: true
        objectives: [OBJ-1.3-1, OBJ-1.3-2]
        prompt: מה קורה להוראת המאזניים כשמחזירים את B מעל A?
        choices:
          - text: ההוראה גדלה.
            correct: true
            feedback: 'נכון. שני הכדורים חיוביים ודוחים זה את זה, ולכן B דוחף את A כלפי מטה, אל המאזניים.'
          - text: ההוראה קטנה.
            feedback: 'ההוראה הייתה קטנה אילו B היה מושך את A כלפי מעלה. אבל לשני הכדורים מטען מאותו סימן, והם דוחים זה את זה.'
            misconception: MC-coulomb-signs-reversed
          - text: ההוראה לא משתנה.
            feedback: 'מאזניים לא מודדים מסה ישירות. הם מודדים את הכוח שהם מפעילים על מה שמונח עליהם, ומחלקים אותו ב-$g$. הכוח החשמלי על A משנה את הכוח הזה.'
        reasonPrompt: ומה הנימוק?
        reasons:
          - text: 'B דוחה את A כלפי מטה בכוח $F$. כדי ש-A יישאר במנוחה, המאזניים דוחפים אותו כלפי מעלה בכוח גדול יותר ב-$F$, ומראים את הכוח שלהם מחולק ב-$g$.'
            correct: true
            feedback: 'זה הנימוק. ההוראה עולה ב-$\Delta m = F/g$, ולכן הכוח החשמלי בין הכדורים הוא $F = \Delta m\cdot g$.'
          - text: 'המטען על A מוסיף לו מסה, ולכן המאזניים מראים יותר.'
            feedback: 'המאזניים אופסו כש-A כבר היה טעון, ומסת האלקטרונים שעברו זניחה בכל מקרה. ההוראה משתנה רק כשמחזירים את B, ולכן הסיבה היא הכוח ש-B מפעיל.'
          - text: 'B נדחה כלפי מעלה, ולפי החוק השלישי של ניוטון המעמד שמחזיק אותו לוחץ על המאזניים.'
            feedback: 'המעמד לא עומד על המאזניים. לפי החוק השלישי, הכוח ש-A מפעיל על B (כלפי מעלה) והכוח ש-B מפעיל על A (כלפי מטה) שווים בגודלם. המאזניים מרגישים רק את הכוח על A.'
        hints:
          - 'האם שני הכדורים מושכים זה את זה או דוחים זה את זה? ולאיזה כיוון פועל הכוח על A?'

      - label: ב
        type: open
        points: 9
        level: mid
        objectives: [OBJ-1.11-2, OBJ-0.4-3]
        prompt: >-
          התלמידים מדדו את העלייה $\Delta m$ בהוראת המאזניים בכל מרחק:
          $$\begin{array}{c|c} r\,(\text{cm}) & \Delta m\,(\text{mg}) \\ \hline 3 & 493 \\ 5 & 203 \\ 6 & 143 \\ 7 & 103 \\ 8 & 80 \\ 10 & 51 \end{array}$$

          (1) חשבו לכל שורה את גודל הכוח החשמלי $F$ בין הכדורים, בניוטונים, ואת $1/r^2$, עם $r$ במטרים.

          (2) סרטטו דיאגרמת פיזור של $F$ כתלות ב-$1/r^2$.

          (3) הוסיפו את הקו הישר שמתאים ביותר לנקודות (קו מגמה). אם נקודה אחת רחוקה בבירור מהקו שהנקודות האחרות
          יוצרות, אל תעבירו את הקו דרכה, וסמנו אותה.
        hints:
          - 'לפי סעיף א, $F = \Delta m\cdot g$. המירו קודם מיליגרמים לקילוגרמים.'
          - 'אם חוק קולון נכון, $F = kq^2\cdot\dfrac{1}{r^2}$. איזה גרף יוצא אז, ודרך איזו נקודה הוא צריך לעבור?'
        solution:
          - { kind: formula, text: '$F = \Delta m\cdot g$ (סעיף א), וחוק קולון: $F = kq^2\cdot\dfrac{1}{r^2}$. בגרף של $F$ כתלות ב-$x = 1/r^2$ צריך לצאת קו ישר דרך הראשית, ששיפועו $kq^2$.' }
          - { kind: substitution, text: 'למשל בשורה הראשונה: $F = 493\cdot10^{-6}\,\text{kg}\cdot10\,\text{m/s}^2 = 4.93\cdot10^{-3}\,\text{N}$ ו-$\dfrac{1}{r^2} = \dfrac{1}{0.03^2} = 1111\,\text{m}^{-2}$.' }
          - { kind: manipulation, text: 'כל השורות: $$\begin{array}{c|c|c} r\,(\text{cm}) & 1/r^2\,(\text{m}^{-2}) & F\,(10^{-3}\,\text{N}) \\ \hline 3 & 1111 & 4.93 \\ 5 & 400 & 2.03 \\ 6 & 278 & 1.43 \\ 7 & 204 & 1.03 \\ 8 & 156 & 0.80 \\ 10 & 100 & 0.51 \end{array}$$' }
          - { kind: manipulation, text: 'הציר האופקי $1/r^2$ מ-0 עד כ-$1200\,\text{m}^{-2}$, והציר האנכי $F$ מ-0 עד כ-$6\cdot10^{-3}\,\text{N}$. חמש הנקודות של $r = 5$ עד $10\,\text{cm}$ יושבות על קו ישר שעובר כמעט דרך הראשית: $F = 5.1\cdot10^{-6}\,x$, עם $F$ בניוטונים ו-$x$ ב-$\text{m}^{-2}$. הקו עובר ליד $(100,\ 0.51\cdot10^{-3})$ וליד $(400,\ 2.04\cdot10^{-3})$, וכל חמש הנקודות במרחק של עד $1\%$ ממנו.' }
          - { kind: result, text: 'דיאגרמת פיזור של שש נקודות, וקו מגמה ישר דרך הראשית בקירוב, בשיפוע של כ-$5.1\cdot10^{-6}\,\text{N}\cdot\text{m}^2$. הנקודה של $r = 3\,\text{cm}$ רחוקה ממנו: הקו צופה שם $5.65\cdot10^{-3}\,\text{N}$, ונמדדו רק $4.93\cdot10^{-3}\,\text{N}$, כ-$13\%$ פחות.' }
        rubric:
          - text: 'המרתי מיליגרמים לקילוגרמים וחישבתי $F = \Delta m\cdot g$ נכון בכל השורות.'
          - text: 'חישבתי $1/r^2$ עם $r$ במטרים.'
          - text: 'שמתי $1/r^2$ על הציר האופקי ו-$F$ על הציר האנכי, עם שם הגודל והיחידות ליד כל ציר, בקנה מידה אחיד, וסימנתי את שש הנקודות.'
          - text: 'העברתי קו ישר אחד קרוב לחמש הנקודות, לא דרך הנקודה של $r = 3\,\text{cm}$, וסימנתי אותה כחריגה.'

      - label: ג
        type: numeric
        points: 8
        level: bagrut
        standalone: false
        objectives: [OBJ-1.11-2, OBJ-0.4-4]
        prompt: חשבו לפי קו המגמה את המטען $q$ של כל אחד מהכדורים.
        answer: 2.4e-8
        unit: C
        tolerance: 0.1
        correctFeedback: >-
          נכון. השיפוע של הקו הוא $s = kq^2$. משתי נקודות רחוקות על הקו (לא מהטבלה):
          $s = \dfrac{(2.04 - 0.51)\cdot10^{-3}}{400 - 100} = 5.1\cdot10^{-6}\,\text{N}\cdot\text{m}^2$.
          מחלקים ב-$k$ ומוציאים שורש:
          $$q = \sqrt{\frac{s}{k}} = \sqrt{\frac{5.1\cdot10^{-6}}{9\cdot10^{9}}} = 2.4\cdot10^{-8}\ \text{C}$$
        wrongFeedback: >-
          השוו את $F = kq^2\cdot\dfrac{1}{r^2}$ למשוואת קו ישר: השיפוע הוא $kq^2$. חשבו אותו משתי נקודות רחוקות
          על הקו, בדקו ש-$F$ בניוטונים ו-$1/r^2$ ב-$\text{m}^{-2}$, ובסוף זכרו להוציא שורש.
        commonWrong:
          - value: 5.7e-16
            feedback: 'זה $q^2$, לא $q$. השיפוע הוא $kq^2$, ולכן $s/k = q^2$, וצריך עוד להוציא שורש.'
          - value: 2.4e-6
            feedback: 'חישבתם את $1/r^2$ עם $r$ בסנטימטרים. אז ערכי הציר האופקי קטנים פי $10^{4}$, השיפוע גדל פי $10^{4}$ והמטען פי 100. המירו את $r$ למטרים.'
          - value: 7.5e-7
            feedback: 'התייחסתם למיליגרמים כאל גרמים, ולכן כל כוח גדול פי 1000. $1\,\text{mg} = 10^{-6}\,\text{kg}$.'
          - value: 7.5e-9
            feedback: 'שכחתם להכפיל ב-$g$: הכוח הוא $F = \Delta m\cdot g$, לא $\Delta m$ בקילוגרמים.'
          - value: 2.3e-3
            feedback: 'הוצאתם שורש מהשיפוע בלי לחלק קודם ב-$k$. השיפוע הוא $kq^2$, ולכן $q = \sqrt{s/k}$.'
            misconception: MC-slope-is-k
        hints:
          - 'מה השיפוע של הגרף של $F$ כתלות ב-$1/r^2$, לפי חוק קולון?'
          - 'קראו שתי נקודות רחוקות על הקו עצמו, למשל ב-$1/r^2 = 100$ ו-$400\,\text{m}^{-2}$.'
        explanation: >-
          בדיקת יחידות: $\dfrac{s}{k}$ נמדד ב-$\dfrac{\text{N}\cdot\text{m}^2}{\text{N}\cdot\text{m}^2/\text{C}^2} = \text{C}^2$,
          ולכן השורש נמדד ב-C. הנקודה של $r = 3\,\text{cm}$ לא נכנסת לחישוב: קו דרך כל שש הנקודות היה מתון מדי.

      - label: ד
        type: mc
        points: 5
        level: bagrut
        qualitative: true
        standalone: false
        objectives: [OBJ-1.11-2, OBJ-1.9-2]
        prompt: >-
          בגרף של סעיף ב, הכוח שנמדד ב-$r = 3\,\text{cm}$ קטן בבירור מהכוח שקו המגמה צופה, בעוד ששאר הנקודות קרובות לקו.
          מה ההסבר הסביר ביותר?
        choices:
          - text: 'הכדורים עשויים ממתכת. המטען החיובי בכל כדור נדחה מהכדור השני אל הצד הרחוק שלו, ולכן המרחק בין המטענים גדול מ-$r$.'
            correct: true
            feedback: >-
              נכון. חוק קולון בצורה $F = kq^2/r^2$ נכון למטענים נקודתיים, או לכדורים רחוקים זה מזה. ב-$r = 3\,\text{cm}$
              המרחק בין פני הכדורים רק $1\,\text{cm}$, כמו הרדיוס שלהם, ולכן אי אפשר להתייחס אליהם כאל נקודות: במתכת
              המטען זז, ועל כל כדור הוא מתרכז בצד שרחוק מהכדור השני. במרחקים גדולים ההשפעה הזו זניחה, ולכן שאר הנקודות על הקו.
          - text: 'חוק קולון לא נכון במרחקים קטנים.'
            feedback: 'חוק קולון נבדק עד מרחקים קטנים בהרבה, בגודל של אטומים. מה שלא מתקיים כאן הוא ההנחה שהכדורים הם מטענים נקודתיים.'
          - text: 'כוח הכבידה בין הכדורים מושך את A כלפי מעלה ומקטין את ההוראה.'
            feedback: 'כוח הכבידה בין שני כדורים של גרמים ספורים במרחק $3\,\text{cm}$ הוא בגודל של $10^{-12}\,\text{N}$, קטן פי מיליארדים מהכוח החשמלי שנמדד, $4.9\cdot10^{-3}\,\text{N}$.'
            misconception: MC-gravity-stronger-than-electric
          - text: 'שגיאת מדידה אקראית.'
            feedback: 'חמש הנקודות האחרות קרובות לקו בתוך כ-$1\%$, ולכן זה גודל השגיאה האקראית. כאן הפער כ-$13\%$, והוא מופיע דווקא במרחק הקטן ביותר: זו סטייה שיטתית, ויש לה סיבה פיזיקלית.'
        hints:
          - 'מה צריך להתקיים כדי שמותר יהיה להתייחס לכדורים כאל מטענים נקודתיים? השוו את הרדיוס $R = 1.0\,\text{cm}$ למרחק בין פני הכדורים.'

      - label: ה
        type: open
        points: 6
        level: bagrut
        qualitative: true
        objectives: [OBJ-1.3-1, OBJ-1.9-2]
        prompt: >-
          חוזרים על הניסוי, אבל הפעם המטען על כדור B הוא $q_B = -q$: שווה בגודלו למטען של A ומנוגד לו בסימן.

          (1) האם הוראת המאזניים גדלה או קטנה כשמחזירים את B מעל A? נמקו.

          (2) האם גודל הכוח במרחק $r = 3\,\text{cm}$ יהיה גדול מהערך $kq^2/r^2$ של מטענים נקודתיים, או קטן ממנו? נמקו בעזרת
          המטען על הכדורים.
        hints:
          - 'מטענים מסימנים שונים מושכים זה את זה. לאן פועל עכשיו הכוח על A?'
          - 'במתכת המטען זז. לאיזה צד של כל כדור יימשך המטען, כשהכדור השני טעון בסימן ההפוך?'
        solution:
          - { kind: formula, text: 'מטענים מסימנים שונים מושכים זה את זה, ובין מטענים נקודתיים $F = \dfrac{k|q_1||q_2|}{r^2} = \dfrac{kq^2}{r^2}$.' }
          - { kind: manipulation, text: '(1) B מושך את A כלפי מעלה בכוח $F$. כדי ש-A יישאר במנוחה המאזניים דוחפים אותו כלפי מעלה בכוח קטן יותר ב-$F$, ולכן ההוראה קטנה ב-$F/g$.' }
          - { kind: manipulation, text: '(2) המטען החיובי של A נמשך אל הצד העליון שלו, הקרוב ל-B, והמטען השלילי של B נמשך אל הצד התחתון שלו, הקרוב ל-A. המרחק בין המטענים קטן מ-$r$, ולכן הכוח גדול מ-$kq^2/r^2$. זה ההפך מסעיף ד, שבו מטענים שווים נדחו אל הצדדים הרחוקים.' }
          - { kind: substitution, text: 'לשם השוואה, עם $q = 2.4\cdot10^{-8}\,\text{C}$ מסעיף ג: $\dfrac{kq^2}{r^2} = \dfrac{9\cdot10^{9}\cdot(2.4\cdot10^{-8})^2}{0.03^2} = 5.8\cdot10^{-3}\,\text{N}$. חישוב מדויק לשני כדורי מתכת ברדיוס $1\,\text{cm}$ נותן כאן כ-$7.0\cdot10^{-3}\,\text{N}$ במטענים מנוגדים, וכ-$4.9\cdot10^{-3}\,\text{N}$ במטענים שווים, כמו שנמדד.' }
          - { kind: result, text: '(1) ההוראה קטנה, כי הכוח על A כלפי מעלה. (2) הכוח גדול מ-$kq^2/r^2$: בגרף של גודל הכוח הנקודה של $r = 3\,\text{cm}$ תהיה מעל הקו. במרחקים גדולים שני הניסויים נותנים את אותו קו.' }
        rubric:
          - text: 'קבעתי שההוראה קטנה, ונימקתי בכך שהכוח על A עכשיו משיכה כלפי מעלה.'
          - text: 'הסברתי שבמתכת המטענים המנוגדים נמשכים אל הצדדים הקרובים של הכדורים.'
          - text: 'הסקתי שהמרחק בין המטענים קטן מ-$r$, ולכן הכוח גדול מ-$kq^2/r^2$.'
