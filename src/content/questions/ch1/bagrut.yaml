    parts:
      - label: א
        type: open
        points: 7
        level: mid
        objectives: [OBJ-1.5-2, OBJ-1.10-1]
        prompt: >-
          (1) סרטטו את תרשים הכוחות הפועלים על הטיפה.

          (2) הראו כי הביטוי לתאוצה $a$ של הטיפה הוא $a = \dfrac{q}{m}E - g$.
        hints:
          - 'אילו כוחות פועלים על הטיפה? את התנגדות האוויר מזניחים.'
          - 'המטען חיובי. מה הכיוון של הכוח החשמלי ביחס לשדה?'
        solution:
          - { kind: formula, text: '$F_E = qE$, $F_g = mg$ ו-$\sum F_y = ma$' }
          - { kind: manipulation, text: 'תרשים הכוחות: על הטיפה פועלים שני כוחות בלבד. כוח הכובד $mg$ כלפי מטה, והכוח החשמלי $qE$ כלפי מעלה: המטען חיובי, ולכן הכוח בכיוון השדה.' }
          - { kind: manipulation, text: 'החוק השני של ניוטון, בציר שהכיוון החיובי שלו כלפי מעלה: $qE - mg = ma$.' }
          - { kind: result, text: 'מחלקים ב-$m$: $a = \dfrac{q}{m}E - g$. כאשר $qE > mg$ התאוצה חיובית (כלפי מעלה), וכאשר $qE < mg$ היא שלילית (כלפי מטה).' }
        rubric:
          - text: סרטטתי שני כוחות בלבד, $mg$ כלפי מטה ו-$qE$ כלפי מעלה, בלי כוח של התנגדות האוויר.
          - text: נימקתי שהכוח החשמלי כלפי מעלה כי המטען חיובי והשדה כלפי מעלה.
          - text: כתבתי את החוק השני של ניוטון עם סימנים לפי ציר שהכיוון החיובי שלו כלפי מעלה.
          - text: בודדתי את $a$ וקיבלתי $a = \dfrac{q}{m}E - g$.

      - label: ב
        type: open
        points: 9
        level: mid
        objectives: [OBJ-0.4-1, OBJ-0.4-2]
        prompt: >-
          התלמידים שינו בהדמיה את גודל השדה החשמלי וקיבלו את ערכי התאוצה שבטבלה:
          $$\begin{array}{c|c} E\,(10^{4}\,\text{V/m}) & a\,(\text{m/s}^2) \\ \hline 5 & -9.5 \\ 10 & -5 \\ 15 & -0.5 \\ 20 & 2.5 \\ 25 & 6.5 \end{array}$$

          (1) סרטטו דיאגרמת פיזור של התאוצה $a$ כתלות בגודל השדה החשמלי $E$.

          (2) הוסיפו לדיאגרמת הפיזור את הישר המתאים לה ביותר (קו מגמה).
        hints:
          - 'שימו את $E$ על הציר האופקי ואת $a$ על הציר האנכי. בחרו קנה מידה שמכיל גם את הערכים השליליים של $a$.'
          - 'קו המגמה לא חייב לעבור דרך כל הנקודות, וגם לא דרך הראשית. העבירו אותו כך שהנקודות יתפזרו משני צדדיו.'
        solution:
          - { kind: formula, text: 'לפי סעיף א, $a = \dfrac{q}{m}E - g$: הקשר בין $a$ ל-$E$ קווי. לכן $E$ על הציר האופקי, $a$ על הציר האנכי, ומעבירים קו ישר.' }
          - { kind: manipulation, text: 'הציר האופקי מ-0 עד $25\cdot10^{4}\,\text{V/m}$. הציר האנכי צריך לרדת עד $a = -15\,\text{m/s}^2$ לפחות, כדי שהחיתוך של הקו איתו ייכנס לגרף. מסמנים את חמש הנקודות מהטבלה.' }
          - { kind: manipulation, text: 'הנקודות כמעט על קו ישר, אבל לא בדיוק. הקו המתאים להן ביותר הוא $a = 7.9\cdot10^{-5}\,E - 13$ (עם $E$ ב-$\text{V/m}$ ו-$a$ ב-$\text{m/s}^2$). הוא עובר ליד $(5,\ -9.1)$ וליד $(25,\ 6.7)$ ביחידות של הטבלה, והנקודות מתפזרות משני צדדיו, הרחוקה ביותר במרחק $0.7\,\text{m/s}^2$ ממנו.' }
          - { kind: result, text: 'דיאגרמת פיזור של חמש נקודות, וקו מגמה ישר עם שיפוע חיובי שחותך את ציר התאוצה בערך ב-$a = -13\,\text{m/s}^2$.' }
        rubric:
          - text: שמתי $E$ על הציר האופקי ו-$a$ על הציר האנכי, וכתבתי ליד כל ציר את הגודל ואת היחידות.
          - text: בחרתי קנה מידה אחיד שמכיל את כל הנקודות, גם את הערכים השליליים.
          - text: סימנתי נכון את חמש הנקודות.
          - text: העברתי קו ישר אחד (לא קו שבור בין הנקודות), עם נקודות משני צדדיו.

      - label: ג
        type: numeric
        points: 6
        level: bagrut
        objectives: [OBJ-0.4-4, OBJ-1.10-1]
        prompt: חשבו את היחס $\dfrac{q}{m}$ של טיפת השמן, לפי קו המגמה.
        answer: 7.9e-5
        unit: C/kg
        tolerance: 0.15
        correctFeedback: 'נכון. לפי סעיף א, השיפוע של הגרף $a(E)$ הוא $\dfrac{q}{m}$. משתי נקודות רחוקות על הקו: $\dfrac{q}{m} = \dfrac{\Delta a}{\Delta E} = \dfrac{6.7 - (-9.1)}{(25 - 5)\cdot10^{4}} \approx 7.9\cdot10^{-5}\,\text{C/kg}$.'
        wrongFeedback: 'השוו את $a = \dfrac{q}{m}E - g$ למשוואה של קו ישר: מה עומד במקום השיפוע? חשבו אותו משתי נקודות רחוקות על הקו, וזכרו שבטבלה $E$ נתון ביחידות של $10^{4}\,\text{V/m}$.'
        commonWrong:
          - value: 0.79
            feedback: 'זה השיפוע כשקוראים את $E$ ישר מהטבלה. הערכים שם ביחידות של $10^{4}\,\text{V/m}$, ולכן מחלקים עוד ב-$10^{4}$.'
          - value: 7900
            feedback: 'הכפלתם ב-$10^{4}$ במקום לחלק. השדה בטבלה הוא $5\cdot10^{4}$, $10\cdot10^{4}$ וכן הלאה, ולכן $\Delta E$ גדול פי $10^{4}$ מהמספרים שבטבלה.'
          - value: 1.0e-5
            feedback: 'חישבתם מנקודה אחת, $\dfrac{-9.5 + 10}{5\cdot10^{4}}$. כל נקודה בטבלה נותנת כך ערך אחר, מ-$1\cdot10^{-5}$ עד $6.6\cdot10^{-5}$, כי הנתונים לא מתאימים ל-$g = 10\,\text{m/s}^2$ (על זה שואל סעיף ד). את היחס מוצאים מהשיפוע של קו המגמה.'
          - value: 1.27e4
            feedback: 'הפכתם את השיפוע: חישבתם $\Delta E/\Delta a$. בגרף $a$ כתלות ב-$E$ השיפוע הוא $\Delta a/\Delta E$.'
        hints:
          - 'לפי סעיף א, איזה גודל הוא השיפוע של הגרף של $a$ כתלות ב-$E$?'
        explanation: >-
          בדיקת יחידות: השיפוע נמדד ב-$\dfrac{\text{m/s}^2}{\text{N/C}} = \dfrac{\text{m}\cdot\text{C}}{\text{s}^2\cdot\text{kg}\cdot\text{m/s}^2} = \text{C/kg}$,
          היחידה של $q/m$.

      - label: ד
        type: open
        points: 6
        level: bagrut
        qualitative: true
        objectives: [OBJ-0.4-1, OBJ-1.10-1]
        prompt: >-
          ידוע כי בינה מלאכותית עלולה לתת תוצאות שאינן תואמות את הידע הפיזיקלי המקובל. קבעו אם לדעתכם קרה הדבר
          בהדמיה זו. נמקו את קביעתכם.
        hints:
          - 'לפי סעיף א, מה צריכה להיות התאוצה של הטיפה כאשר $E = 0$? איפה רואים את זה בגרף?'
          - 'המשיכו את קו המגמה עד הציר האנכי, והשוו.'
        solution:
          - { kind: formula, text: 'לפי סעיף א, $a = \dfrac{q}{m}E - g$. החיתוך של הישר עם ציר התאוצה, כלומר התאוצה כאשר $E = 0$, הוא $a = -g$.' }
          - { kind: manipulation, text: 'זה מה שמצפים גם בלי חשבון: בלי שדה פועל על הטיפה רק כוח הכובד, והיא נופלת חופשית, בתאוצה $g = 10\,\text{m/s}^2$ כלפי מטה.' }
          - { kind: substitution, text: 'המשכת קו המגמה מסעיף ב עד $E = 0$ נותנת $a \approx -13\,\text{m/s}^2$, בעוד שהפיזיקה דורשת $a = -g = -10\,\text{m/s}^2$. הפער, כ-$3\,\text{m/s}^2$, גדול בהרבה מהמרחק של הנקודות מהקו.' }
          - { kind: manipulation, text: 'סימן נוסף: לפי סעיף א הקשר קווי בדיוק, ולכן בהדמיה שמחשבת לפי חוקי ניוטון כל הנקודות היו על ישר אחד. כאן השיפוע בין שתי הנקודות הראשונות הוא $9\cdot10^{-5}\,\text{C/kg}$, ובין הנקודה השלישית לרביעית רק $6\cdot10^{-5}\,\text{C/kg}$.' }
          - { kind: result, text: 'כן, זה קרה. לפי ההדמיה, בלי שדה הטיפה הייתה נופלת בתאוצה של כ-$13\,\text{m/s}^2$, יותר מתאוצת הנפילה החופשית $g$. זה לא תואם את הפיזיקה, ולכן הבינה המלאכותית נתנה כאן תוצאות שגויות.' }
        rubric:
          - text: כתבתי שלפי הביטוי מסעיף א, כאשר אין שדה התאוצה היא $a = -g$, כלומר נפילה חופשית.
          - text: קראתי מהגרף (או חישבתי מהקו) שהחיתוך עם ציר התאוצה הוא בערך $a = -13\,\text{m/s}^2$.
          - text: קבעתי שההדמיה נתנה תוצאה שגויה, ונימקתי בהשוואה בין שני הערכים.

      - label: ה
        type: open
        points: 5
        level: mid
        qualitative: true
        objectives: [OBJ-1.2-4, OBJ-1.3-1]
        prompt: >-
          לאחר מכן חקרו התלמידים באמצעות מערכת ההדמיה מערכת הטוענת וממיינת טיפות שמן. טיפות שמן נעות בתוך צינור
          מתכת וניתזות ממנו לכיוונו של כדור הטעון במטען חשמלי חיובי. בתהליך זה חלק מן הטיפות נטענו במטען חיובי,
          ויתר הטיפות נשארו ניטרליות. בהדמיה רואים שהטיפות הטעונות נדחו מן הכדור, ואילו הטיפות הניטרליות נמשכו אליו.

          הסבירו מדוע הטיפות הטעונות נדחו מן הכדור הטעון, ומדוע הטיפות הניטרליות נמשכו אליו.
        hints:
          - 'טיפה ניטרלית אינה טעונה, אבל יש בה מטענים חיוביים ושליליים. מה הכדור החיובי עושה לאלקטרונים שבה?'
          - 'השוו בין המרחק של הצד הקרוב של הטיפה מהכדור לבין המרחק של הצד הרחוק. איך הכוח החשמלי תלוי במרחק?'
        solution:
          - { kind: formula, text: 'חוק קולון: $F = k\dfrac{|q_1 q_2|}{r^2}$. מטענים שווי סימן דוחים זה את זה, ומטענים מנוגדים מושכים, והכוח נחלש ככל שהמרחק גדל.' }
          - { kind: manipulation, text: 'הטיפות הטעונות: גם הטיפה וגם הכדור טעונים במטען חיובי. מטענים שווי סימן דוחים זה את זה, ולכן הכדור דוחה את הטיפה.' }
          - { kind: manipulation, text: 'הטיפות הניטרליות: שמן הוא מבודד, אבל הכדור החיובי מושך את האלקטרונים של כל מולקולה בטיפה, והם זזים מעט לכיוונו. זה קיטוב: על השפה הקרובה לכדור נשאר מטען שלילי, ועל השפה הרחוקה מטען חיובי שווה לו בגודלו.' }
          - { kind: manipulation, text: 'הכדור מושך את המטען השלילי שבצד הקרוב ודוחה את המטען החיובי שבצד הרחוק. הצד השלילי קרוב יותר, ולפי חוק קולון הכוח עליו גדול יותר, ולכן המשיכה גוברת על הדחייה.' }
          - { kind: result, text: 'הטיפות הטעונות נדחות כי מטענן שווה בסימנו למטען הכדור. הטיפות הניטרליות מתקטבות, ומכיוון שהמטען השלילי שלהן קרוב יותר לכדור, הכוח השקול עליהן הוא משיכה אל הכדור.' }
        rubric:
          - text: הסברתי את הדחייה של הטיפות הטעונות בכך שגם הטיפה וגם הכדור טעונים במטען חיובי.
          - text: הסברתי שהטיפה הניטרלית מתקטבת, כלומר שבצד הקרוב לכדור נוצר מטען שלילי ובצד הרחוק מטען חיובי.
          - text: נימקתי שהמשיכה גוברת כי המטען השלילי קרוב יותר לכדור, והכוח החשמלי נחלש עם המרחק.

