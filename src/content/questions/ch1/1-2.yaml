# Lesson 1.2 question bank. Strings may hold $inline$ TeX and **bold**; they are rendered at
# build time. YAML note: plain and single-quoted strings keep backslashes literally.

chapter: 1
questions:
  # ------------------------------------------------ OBJ-1.2-1 friction and contact
  - id: Q-1.2-contact-sign
    type: mc
    objectives: [OBJ-1.2-1]
    qualitative: true
    prompt: >-
      מוט טעון **שלילית** נוגע בכדור של אלקטרוסקופ ניטרלי, ואחר כך מרחיקים אותו.
      מה סימן המטען של האלקטרוסקופ עכשיו?
    choices:
      - text: שלילי.
        correct: true
        feedback: נכון. אלקטרונים עברו מהמוט אל האלקטרוסקופ, ולכן שניהם נשארים שליליים.
      - text: חיובי.
        feedback: 'חיובי היה אם האלקטרוסקופ איבד אלקטרונים. אבל במגע אלקטרונים עוברים מהמוט, וכך האלקטרוסקופ מקבל אותם.'
        misconception: MC-contact-opposite-sign
      - text: הוא נשאר ניטרלי.
        feedback: במגע יש מעבר של מטען, ולכן האלקטרוסקופ נשאר טעון גם אחרי שמרחיקים את המוט.

  - id: Q-1.2-contact-direction
    type: mc
    objectives: [OBJ-1.2-1]
    qualitative: true
    prompt: >-
      מוט טעון **חיובית** נוגע בכדור של אלקטרוסקופ ניטרלי. מה עובר בין הגופים?
    choices:
      - text: אלקטרונים עוברים מהאלקטרוסקופ אל המוט.
        correct: true
        feedback: נכון. המוט החיובי מושך אלקטרונים. האלקטרוסקופ מאבד אלקטרונים ונעשה חיובי.
      - text: אלקטרונים עוברים מהמוט אל האלקטרוסקופ.
        feedback: המוט חסר אלקטרונים, ואין לו אלקטרונים עודפים להעביר. הוא מושך אלקטרונים אליו.
        misconception: MC-contact-opposite-sign
      - text: פרוטונים עוברים מהמוט אל האלקטרוסקופ.
        feedback: פרוטונים כלואים בגרעינים ולא עוברים. גם כאן מי שנע הם האלקטרונים.
        misconception: MC-charge-protons-move

  - id: Q-1.2-share-spheres
    type: numeric
    objectives: [OBJ-1.2-1]
    prompt: >-
      כדור מתכת A, טעון $-8\,\text{nC}$, נוגע בכדור מתכת B זהה וניטרלי, ואחר כך מפרידים ביניהם.
      כמה אלקטרונים עברו מ-A אל B? ($e = 1.6\cdot10^{-19}\,\text{C}$)
    answer: 2.5e10
    unit: אלקטרונים
    tolerance: 0.02
    correctFeedback: >-
      נכון. הכדורים זהים, ולכן המטען מתחלק שווה בשווה: כל אחד נשאר עם $-4\,\text{nC}$.
      לכן $n = \dfrac{4\cdot10^{-9}}{1.6\cdot10^{-19}} = 2.5\cdot10^{10}$.
    wrongFeedback: 'בכדורים זהים המטען מתחלק שווה בשווה. מה המטען של B בסוף, וכמה אלקטרונים זה?'
    commonWrong:
      - value: 5.0e10
        feedback: 'חישבתם את כל האלקטרונים העודפים של A. אבל רק מחציתם עברו: A נשאר עם $-4\,\text{nC}$.'
        misconception: MC-contact-all-charge-moves
    hints:
      - 'מה המטען של כל כדור אחרי שמפרידים אותם?'

  - id: Q-1.2-friction-sign
    type: mc
    objectives: [OBJ-1.2-1]
    qualitative: true
    prompt: >-
      שפשפו מוט PVC בצמר, והמוט נעשה שלילי. מה המטען של הצמר, ומה עבר בין הגופים?
    choices:
      - text: הצמר חיובי, ואלקטרונים עברו מהצמר אל המוט.
        correct: true
        feedback: נכון. הצמר איבד אלקטרונים ונעשה חיובי, והמוט קיבל אותם. הסך הכול נשאר אפס.
      - text: הצמר שלילי, כי גם הוא התחכך.
        feedback: אם שניהם שליליים, המטען הכולל שלילי. הוא התחיל מאפס, ומטען נשמר.
      - text: הצמר ניטרלי, כי רק המוט נטען.
        feedback: אם הצמר נשאר ניטרלי, מאין הגיעו האלקטרונים של המוט? מטען לא נוצר.
        misconception: MC-charge-created

  # ------------------------------------------------ OBJ-1.2-2 induction
  - id: Q-1.2-induction-sign
    type: mc
    objectives: [OBJ-1.2-2]
    qualitative: true
    prompt: >-
      מקרבים מוט **שלילי** אל כדור של אלקטרוסקופ, בלי לגעת. מארקים את האלקטרוסקופ, מנתקים את ההארקה,
      ורק אז מרחיקים את המוט. מה סימן האלקטרוסקופ?
    choices:
      - text: חיובי.
        correct: true
        feedback: נכון. כשהמוט השלילי היה קרוב, האלקטרונים נדחו ממנו והלכו לאדמה. אחרי הניתוק האלקטרוסקופ חסר אלקטרונים.
      - text: שלילי, כמו המוט.
        feedback: שלילי מתקבל בטעינה במגע. בהשראה אין מגע, והאלקטרונים דווקא עוזבים את האלקטרוסקופ.
        misconception: MC-induction-same-sign
      - text: ניטרלי, כי ההארקה מנטרלת הכול.
        feedback: ההארקה נעשתה כשהמוט היה קרוב, והמוט החזיק בצד אחד מטען מושרה. כשמנתקים את ההארקה האלקטרוסקופ כבר חסר אלקטרונים.
        misconception: MC-ground-neutralises

  - id: Q-1.2-induction-order
    type: mc
    objectives: [OBJ-1.2-2]
    qualitative: true
    prompt: >-
      איזה סדר פעולות טוען אלקטרוסקופ בהשראה?
    choices:
      - text: מקרבים את המוט, מארקים, מנתקים את ההארקה, מרחיקים את המוט.
        correct: true
        feedback: נכון. את ההארקה מנתקים בזמן שהמוט עדיין קרוב, כדי שהמטען שנשאר יתקבע.
      - text: מקרבים את המוט, מארקים, מרחיקים את המוט, מנתקים את ההארקה.
        feedback: 'כשמרחיקים את המוט לפני הניתוק, האלקטרונים חוזרים מהאדמה, והאלקטרוסקופ חוזר להיות ניטרלי.'
        misconception: MC-ground-neutralises
      - text: נוגעים במוט בכדור, מארקים, מרחיקים את המוט.
        feedback: זו כבר טעינה במגע. בהשראה המוט לא נוגע באלקטרוסקופ.

  - id: Q-1.2-ground-flow
    type: mc
    objectives: [OBJ-1.2-2]
    qualitative: true
    prompt: >-
      מוט **שלילי** קרוב לכדור של אלקטרוסקופ, והאלקטרוסקופ מוארק. מה עוברים דרך חוט ההארקה?
    choices:
      - text: אלקטרונים עוברים מהאלקטרוסקופ אל האדמה.
        correct: true
        feedback: נכון. המוט השלילי דוחה אלקטרונים מהאלקטרוסקופ, והחוט נותן להם מקום לברוח.
      - text: אלקטרונים עוברים מהאדמה אל האלקטרוסקופ.
        feedback: זה היה קורה עם מוט חיובי, שמושך אלקטרונים. מוט שלילי דוחה אותם.
      - text: לא עובר כלום, כי המוט לא נוגע באלקטרוסקופ.
        feedback: המוט פועל מרחוק. הוא דוחה אלקטרונים מהאלקטרוסקופ, ואם יש חוט הם עוברים בו.

  - id: Q-1.2-rod-charge
    type: mc
    objectives: [OBJ-1.2-2]
    qualitative: true
    prompt: >-
      בטעינה של אלקטרוסקופ בהשראה, מה קורה למטען של המוט הטעון?
    choices:
      - text: הוא לא משתנה, כי המוט לא נוגע באלקטרוסקופ.
        correct: true
        feedback: 'נכון. זה היתרון של השראה: אפשר לטעון הרבה גופים באותו מוט, והוא נשאר טעון כשהיה.'
      - text: הוא קטן, כי הוא נתן מטען לאלקטרוסקופ.
        feedback: מטען לא עבר מהמוט. האלקטרונים שברחו הלכו לאדמה, לא למוט.
        misconception: MC-induction-rod-loses-charge
      - text: הוא מתהפך לסימן ההפוך.
        feedback: אין שום תהליך שמחליף את הסימן של מוט שלא נגעו בו.

  - id: Q-1.2-induction-charge
    type: numeric
    objectives: [OBJ-1.2-2]
    prompt: >-
      טוענים אלקטרוסקופ בהשראה בעזרת מוט שלילי. בזמן ההארקה עברו מהאלקטרוסקופ לאדמה
      $3.0\cdot10^{10}$ אלקטרונים. מה גודל המטען של האלקטרוסקופ אחרי שמרחיקים את המוט?
      ($e = 1.6\cdot10^{-19}\,\text{C}$)
    answer: 4.8e-9
    unit: C
    tolerance: 0.02
    correctFeedback: >-
      נכון. האלקטרוסקופ איבד $n = 3.0\cdot10^{10}$ אלקטרונים, ולכן הוא חיובי:
      $q = n\,e = 3.0\cdot10^{10}\cdot1.6\cdot10^{-19} = 4.8\cdot10^{-9}\,\text{C} = +4.8\,\text{nC}$.
    wrongFeedback: 'המטען הוא מספר האלקטרונים שחסרים כפול $e$: $|q| = n\,e$.'
    commonWrong:
      - value: 5.33e-30
        feedback: 'חילקתם את $e$ במספר האלקטרונים. כדי לעבור למטען כופלים ב-$e$.'
    hints:
      - '$|q| = n\,e$. ומה הסימן? האלקטרוסקופ איבד אלקטרונים.'

  # ------------------------------------------------ OBJ-1.2-3 electroscope
  - id: Q-1.2-neutral-diverge
    type: mc
    objectives: [OBJ-1.2-3]
    qualitative: true
    prompt: >-
      אלקטרוסקופ **ניטרלי**, והעלים סגורים. מקרבים אליו מוט שלילי בלי לגעת בו.
      מה קורה לעלים?
    choices:
      - text: הם נפתחים. אלקטרונים נדחים אל העלים, ושני העלים נטענים שלילית.
        correct: true
        feedback: נכון. המטען הכולל של האלקטרוסקופ עדיין אפס, אבל בעלים יש עכשיו מטען עודף והם דוחים זה את זה.
      - text: הם נשארים סגורים, כי האלקטרוסקופ ניטרלי.
        feedback: האלקטרוסקופ ניטרלי בסך הכול, אבל המטענים שבו זזו. מה שקובע את פתיחת העלים הוא המטען שעליהם.
        misconception: MC-electroscope-needs-net-charge
      - text: הם נפתחים, כי המוט נתן לאלקטרוסקופ מטען.
        feedback: אין מגע, ולכן מטען לא עבר. כשמרחיקים את המוט העלים נסגרים.

  - id: Q-1.2-same-sign-probe
    type: twotier
    objectives: [OBJ-1.2-3]
    qualitative: true
    prompt: >-
      אלקטרוסקופ טעון שלילית, והעלים פתוחים. מקרבים אליו מוט **שלילי**, בלי לגעת. מה קורה לעלים?
    choices:
      - text: הם נפתחים עוד יותר.
        correct: true
        feedback: נכון. המוט דוחה עוד אלקטרונים אל העלים.
      - text: הם נסגרים קצת.
        feedback: נסגרים היו העלים אילו המוט היה חיובי. מוט שלילי דוחה אלקטרונים אל העלים.
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: המוט דוחה אלקטרונים מהכדור אל העלים, ועל העלים יש יותר מטען.
        correct: true
        feedback: נכון. ככל שיש יותר מטען על העלים, הדחייה ביניהם חזקה והם נפתחים יותר.
      - text: המוט נותן לעלים מטען במגע.
        feedback: אין מגע. גם בלי מגע המטענים בתוך האלקטרוסקופ זזים.

  - id: Q-1.2-sign-by-opening
    type: mc
    objectives: [OBJ-1.2-3]
    qualitative: true
    prompt: >-
      העלים של אלקטרוסקופ פתוחים. האם אפשר לדעת רק מזה אם הוא טעון חיובית או שלילית?
    choices:
      - text: לא. עלים פתוחים אומרים שיש מטען על העלים, אבל לא את הסימן שלו.
        correct: true
        feedback: נכון. הדחייה בין העלים זהה לשני הסימנים. כדי לקבוע את הסימן מקרבים מוט שהסימן שלו ידוע ורואים אם העלים נפתחים עוד או נסגרים.
      - text: כן. כשהעלים פתוחים מאוד, המטען חיובי.
        feedback: פתיחה רחבה אומרת שהמטען גדול, לא שהוא חיובי.
        misconception: MC-electroscope-sign-by-opening
      - text: כן. כשהעלים פתוחים, המטען שלילי, כי אלקטרונים נעים לעלים.
        feedback: גם אלקטרוסקופ חיובי מראה עלים פתוחים. הסימן לא נקבע מהפתיחה.
        misconception: MC-electroscope-sign-by-opening

  - id: Q-1.2-opposite-probe
    type: mc
    objectives: [OBJ-1.2-3]
    qualitative: true
    prompt: >-
      אלקטרוסקופ טעון שלילית ועלים פתוחים. מקרבים אליו מוט **חיובי** חלש, בלי לגעת.
      מה קורה לעלים?
    choices:
      - text: הם נסגרים קצת.
        correct: true
        feedback: נכון. המוט החיובי מושך אלקטרונים מהעלים אל הכדור, ועל העלים נשאר פחות מטען.
      - text: הם נפתחים עוד יותר.
        feedback: נפתחים עוד היו העלים עם מוט שלילי. מוט חיובי מושך את האלקטרונים מהעלים.
      - text: אין שינוי, כי אין מגע.
        feedback: מגע לא נדרש. המטענים בתוך המוליך זזים בגלל המוט גם בלי מגע.
        misconception: MC-electroscope-needs-net-charge

  # ------------------------------------------------ OBJ-1.2-4 polarisation
  - id: Q-1.2-balloon-wall
    type: twotier
    objectives: [OBJ-1.2-4]
    qualitative: true
    prompt: >-
      בלון טעון שלילית נדבק לקיר ניטרלי. מה הכוח שפועל בין הבלון לקיר?
    choices:
      - text: משיכה.
        correct: true
        feedback: נכון. זו הסיבה שהבלון נדבק.
      - text: דחייה.
        feedback: אם הבלון היה נדחה, הוא לא היה נדבק. בפועל הוא נדבק.
    reasonPrompt: ולמה אם הקיר ניטרלי?
    reasons:
      - text: 'המולקולות בקיר מתקטבות: הצד הקרוב לבלון מקבל מטען חיובי והרחוק שלילי. המטען החיובי קרוב יותר, ולכן המשיכה חזקה מהדחייה.'
        correct: true
        feedback: זה הקיטוב. אף אלקטרון לא עזב את הקיר, אבל המטענים בו זזו מעט.
      - text: 'הבלון מעביר אלקטרונים לקיר, והקיר נטען חיובית.'
        feedback: אלקטרונים מהבלון לא עוברים לקיר מבודד, ואם היו עוברים הקיר היה שלילי ודוחה את הבלון.
        misconception: MC-polarisation-needs-transfer
      - text: 'הקיר טעון חיובית מלכתחילה.'
        feedback: הקיר ניטרלי. גם גוף ניטרלי נמשך לגוף טעון בגלל הקיטוב.
        misconception: MC-polarisation-needs-transfer

  - id: Q-1.2-neutral-paper
    type: mc
    objectives: [OBJ-1.2-4]
    qualitative: true
    prompt: >-
      מקרבים סרגל פלסטיק טעון אל פיסת נייר ניטרלית. מה קורה?
    choices:
      - text: הנייר נמשך אל הסרגל.
        correct: true
        feedback: נכון. הנייר מתקטב, והצד הקרוב לסרגל נטען בסימן הפוך לו. המשיכה חזקה מהדחייה.
      - text: אין שום כוח, כי הנייר ניטרלי.
        feedback: 'ניטרלי פירושו שהסך הכול אפס. אבל המטענים בנייר זזים מעט ויוצרים כוח נטו.'
        misconception: MC-neutral-no-force
      - text: הנייר נדחה, כי הסרגל טעון והנייר לא.
        feedback: גוף ניטרלי לא נדחה מגוף טעון. הוא נמשך אליו.
        misconception: MC-neutral-no-force

  - id: Q-1.2-both-signs
    type: mc
    objectives: [OBJ-1.2-4]
    qualitative: true
    prompt: >-
      פיסת נייר ניטרלית. האם היא תימשך גם למוט חיובי וגם למוט שלילי?
    choices:
      - text: כן, לשניהם. בכל מקרה הצד הקרוב נטען בסימן הפוך.
        correct: true
        feedback: נכון. הכוח הוא משיכה בשני המקרים. רק הסימן של המטען המושרה בנייר מתהפך.
      - text: רק למוט שהסימן שלו הפוך לסימן של הנייר.
        feedback: לנייר ניטרלי אין סימן. הוא נמשך לשני הסימנים, כי הוא מתקטב בכל מקרה.
        misconception: MC-polarisation-sign-matters
      - text: רק למוט חיובי.
