# Lesson 1.10 question bank. Strings may hold $inline$ / $$display$$ TeX and **bold**; they are
# rendered at build time. YAML note: plain and single-quoted strings keep backslashes literally.
# Every number below was recomputed with src/physics (charge-in-field.ts, motion.ts).

chapter: 1
questions:
  # ------------------------------------------------ OBJ-1.10-1: acceleration of a charge in a field
  - id: Q-1.10-force-direction
    type: vector
    objectives: [OBJ-1.10-1]
    qualitative: true
    prompt: >-
      בין שני לוחות יש שדה חשמלי אחיד שמצביע **ימינה**. אלקטרון נמצא בשדה הזה.
      מה כיוון התאוצה של האלקטרון?
    answer: w
    correctFeedback: נכון. האלקטרון שלילי, ולכן הכוח עליו, $\vec F = q\vec E$, הפוך לשדה. התאוצה היא בכיוון הכוח.
    wrong:
      - dir: e
        feedback: ימינה הוא כיוון השדה. על מטען שלילי הכוח הפוך לשדה, ולכן התאוצה של אלקטרון היא שמאלה.
        misconception: MC-beam-follows-field
      - dir: 'n'
        feedback: 'השדה אופקי, ולכן הכוח $q\vec E$ מקביל לשדה או הפוך לו. אין לו רכיב אנכי.'
      - dir: 's'
        feedback: 'השדה אופקי, ולכן הכוח $q\vec E$ מקביל לשדה או הפוך לו. אין לו רכיב אנכי.'
      - dir: zero
        feedback: 'יש בשדה אלקטרון, ולכן פועל עליו כוח שגודלו $|q|E$, שאינו אפס.'
    wrongFeedback: כיוון השדה הוא כיוון הכוח על מטען חיובי. מה קורה לכוח כשהמטען שלילי?

  - id: Q-1.10-proton-accel
    type: numeric
    objectives: [OBJ-1.10-1]
    prompt: >-
      פרוטון נמצא בשדה חשמלי אחיד של $2\cdot10^{4}\,\text{N/C}$. מה גודל התאוצה שלו?
      ($e = 1.6\cdot10^{-19}\,\text{C}$, $m_p = 1.67\cdot10^{-27}\,\text{kg}$)
    answer: 1.92e12
    unit: m/s²
    tolerance: 0.03
    correctFeedback: 'נכון: $a = \dfrac{eE}{m_p} = \dfrac{1.6\cdot10^{-19}\cdot 2\cdot10^{4}}{1.67\cdot10^{-27}} = 1.9\cdot10^{12}\,\text{m/s}^2$.'
    wrongFeedback: 'הכוח הוא $F = eE$, והתאוצה היא $a = F/m$ עם מסת **הפרוטון**.'
    commonWrong:
      - value: 3.52e15
        feedback: 'הצבתם את מסת האלקטרון, $9.1\cdot10^{-31}\,\text{kg}$. כאן החלקיק הוא פרוטון, והוא כבד פי 1800 בערך.'
    hints:
      - 'כוח: $F = qE$. תאוצה: $a = F/m$.'

  - id: Q-1.10-accel-compare
    type: mc
    objectives: [OBJ-1.10-1]
    qualitative: true
    prompt: >-
      אלקטרון ופרוטון נמצאים, בזה אחר זה, באותו שדה חשמלי אחיד. מה נכון לגבי התאוצות שלהם?
    choices:
      - text: גודל התאוצה של האלקטרון גדול בערך פי 1800, וכיוונה הפוך לכיוון התאוצה של הפרוטון.
        correct: true
        feedback: 'נכון. הכוחות שווים בגודלם, $eE$, והמסות שונות: $a = eE/m$. הסימנים הפוכים, ולכן גם הכיוונים.'
      - text: התאוצות שוות, כי הכוח על שניהם שווה בגודלו.
        feedback: 'הכוח אכן שווה, אבל $a = F/m$. מסה קטנה פי 1800 בערך נותנת תאוצה גדולה פי 1800 בערך.'
      - text: התאוצה של הפרוטון גדולה יותר, כי הוא כבד יותר.
        feedback: 'מסה גדולה מקשה על השינוי בתנועה: $a = F/m$. החלקיק הכבד מואץ פחות.'
        misconception: MC-heavier-deflects-more
      - text: התאוצות שוות בגודלן וגם בכיוונן, כי השדה אחד.
        feedback: 'השדה אחד, אבל הכוח $qE$ תלוי בסימן המטען. האלקטרון והפרוטון מואצים לכיוונים מנוגדים.'
        misconception: MC-beam-follows-field

  - id: Q-1.10-gravity
    type: mc
    objectives: [OBJ-1.10-1]
    qualitative: true
    prompt: >-
      בחישובי ההסטה של אלקטרון בשפופרת מתעלמים ממשקל האלקטרון. למה מותר?
    choices:
      - text: 'המשקל קטן בהרבה מכוח השדה: היחס $mg/(eE)$ הוא בסדר גודל של $10^{-14}$ בשדה של $5\cdot10^{3}\,\text{N/C}$.'
        correct: true
        feedback: נכון. $mg = 9.1\cdot10^{-30}\,\text{N}$, ואילו $eE = 8\cdot10^{-16}\,\text{N}$. ההבדל קטן מכדי שיופיע בתוצאה.
      - text: כבידה לא פועלת על חלקיקים טעונים.
        feedback: כבידה פועלת על כל גוף שיש לו מסה, גם על אלקטרון. פשוט הכוח שלה זניח כאן.
      - text: כי האלקטרון נע מהר מדי, ולכן הכבידה לא מספיקה לפעול.
        feedback: 'המהירות לא מבטלת כוח. הכבידה פועלת תמיד, אבל כאן היא קטנה פי $10^{14}$ מהכוח החשמלי.'
      - text: כי בשדה חשמלי אין כבידה.
        feedback: שדה חשמלי לא מבטל כבידה. שני הכוחות פועלים יחד, והחשמלי גדול בהרבה.

  # ------------------------------------------------ OBJ-1.10-2: the path and the deflection formula
  - id: Q-1.10-path-shape
    type: mc
    objectives: [OBJ-1.10-2]
    qualitative: true
    prompt: >-
      אלקטרון נכנס אופקית בין שני לוחות שבהם שדה אחיד אנכי, ואחר כך יוצא מהם. איך נראה המסלול שלו?
    choices:
      - text: פרבולה בין הלוחות, וקו ישר אחרי שיצא מהם.
        correct: true
        feedback: נכון. בין הלוחות יש תאוצה קבועה בניצב למהירות, כמו בקליע. אחרי הלוחות אין כוח, ולכן קו ישר.
      - text: פרבולה בין הלוחות, שממשיכה להתעקם גם אחריהם.
        feedback: 'אחרי הלוחות אין שדה, ולכן אין כוח ואין תאוצה. הקרן ממשיכה בקו ישר במהירות שהייתה לה ביציאה.'
        misconception: MC-beam-keeps-bending
      - text: קשת של מעגל, כמו בשדה מגנטי.
        feedback: 'מעגל מתקבל כשהכוח תמיד ניצב למהירות ושומר על גודלה, כמו בשדה מגנטי. כאן הכוח בכיוון קבוע, ולכן המסלול פרבולה.'
      - text: קו ישר, כי האלקטרון מהיר מאוד.
        feedback: 'גם חלקיק מהיר מקבל תאוצה כל זמן שהוא בשדה. הוא רק מוסט פחות.'

  - id: Q-1.10-exit-deflection
    type: numeric
    objectives: [OBJ-1.10-2]
    prompt: >-
      אלקטרון נכנס במהירות $2\cdot10^{7}\,\text{m/s}$ בין לוחות באורך $4\,\text{cm}$,
      ובין הלוחות שדה אחיד של $6\cdot10^{3}\,\text{N/C}$ בניצב למהירות.
      מה ההסטה שלו בסוף הלוחות? ענו בסנטימטרים.
    answer: 0.211
    unit: cm
    tolerance: 0.03
    level: mid
    correctFeedback: 'נכון: $y_L = \dfrac{eEL^2}{2mv^2} = \dfrac{1.6\cdot10^{-19}\cdot 6\cdot10^{3}\cdot 0.04^2}{2\cdot 9.1\cdot10^{-31}\cdot (2\cdot10^{7})^2} = 2.11\cdot10^{-3}\,\text{m} = 0.21\,\text{cm}$.'
    wrongFeedback: 'השתמשו ב-$y = \dfrac{eEx^2}{2mv^2}$ עם $x = L = 0.04\,\text{m}$, ושימו לב להמיר מטרים לסנטימטרים.'
    commonWrong:
      - value: 0.422
        feedback: 'שכחתם את הגורם $\tfrac{1}{2}$. התאוצה קבועה, ולכן $y = \tfrac12 at^2$ ולא $at^2$.'
      - value: 5.27
        feedback: 'כתבתם $L$ במקום $L^2$. הזמן בלוחות הוא $L/v$, והוא נכנס בריבוע.'
    hints:
      - 'תאוצה: $a = eE/m$. זמן בלוחות: $t = L/v$.'
      - 'ההסטה היא $y = \tfrac12 at^2$.'

  - id: Q-1.10-screen-spot
    type: numeric
    objectives: [OBJ-1.10-2]
    level: bagrut
    prompt: >-
      באותה שפופרת (אלקטרון במהירות $2\cdot10^{7}\,\text{m/s}$, לוחות באורך $4\,\text{cm}$, שדה של $6\cdot10^{3}\,\text{N/C}$)
      נמצא מסך במרחק $15\,\text{cm}$ מסוף הלוחות. באיזה מרחק מהמרכז פוגע האלקטרון במסך? ענו בסנטימטרים.
    answer: 1.79
    unit: cm
    tolerance: 0.03
    correctFeedback: >-
      נכון. בסוף הלוחות $y_L = 0.211\,\text{cm}$ ו-$\tan\theta = \dfrac{eEL}{mv^2} = 0.1055$.
      אחרי הלוחות הקרן ישרה, ולכן $Y = y_L + D\tan\theta = 0.211\,\text{cm} + 15\,\text{cm}\cdot 0.1055 = 1.79\,\text{cm}$.
    wrongFeedback: 'בסוף הלוחות הקרן כבר מוסטת וגם נעה בשיפוע. חשבו את ההסטה בסוף הלוחות ואת השיפוע, והוסיפו את הקטע הישר עד המסך.'
    commonWrong:
      - value: 0.211
        feedback: 'זו ההסטה בסוף הלוחות בלבד. אחריה הקרן עוד נעה בקו ישר 15 ס"מ בשיפוע קבוע, ולכן הכתם רחוק יותר מהציר.'
        misconception: MC-ignore-drift-after-plates
    hints:
      - 'שיפוע הקרן ביציאה: $\tan\theta = v_y/v = at/v$.'
      - 'הקטע הישר מוסיף $D\tan\theta$ להסטה.'

  - id: Q-1.10-vx-constant
    type: mc
    objectives: [OBJ-1.10-2]
    qualitative: true
    prompt: >-
      אלקטרון נכנס בין לוחות עם מהירות אופקית $v$, והשדה אנכי. מה קורה לרכיב האופקי של המהירות בזמן שהוא בין הלוחות?
    choices:
      - text: הוא נשאר $v$, כי אין כוח בכיוון האופקי.
        correct: true
        feedback: נכון. הכוח אנכי בלבד, ולכן התנועה האופקית שוות מהירות והאנכית שוות תאוצה, בדיוק כמו בקליע.
      - text: הוא גדל, כי האלקטרון מואץ בשדה.
        feedback: 'התאוצה היא בכיוון הכוח, כלומר אנכית. בכיוון האופקי אין כוח, ולכן אין שינוי.'
      - text: הוא קטן, כי השדה מאט את הקרן.
        feedback: 'הכוח ניצב למהירות ההתחלתית, ולכן אינו מאט אותה. הרכיב האנכי של המהירות גדל, והאופקי לא משתנה.'

  # ------------------------------------------------ OBJ-1.10-3: how the deflection depends on E, v, m, q
  - id: Q-1.10-double-speed
    type: twotier
    objectives: [OBJ-1.10-3]
    qualitative: true
    prompt: >-
      במהירות כניסה $v$ ההסטה על המסך היא $Y$. מכפילים את מהירות הכניסה ל-$2v$ (שאר הנתונים זהים).
      מה תהיה ההסטה?
    choices:
      - text: $4Y$
        feedback: זו הטעות הנפוצה. חלקיק מהיר לא "נדחף חזק יותר", כי הכוח לא השתנה. הוא רק נמצא בשדה זמן קצר יותר.
        misconception: MC-faster-deflects-more
      - text: $Y/4$
        correct: true
        feedback: נכון. $Y \propto 1/v^2$.
      - text: $Y/2$
        feedback: 'ההסטה היא ביחס הפוך לריבוע המהירות, לא למהירות עצמה.'
      - text: $Y$
        feedback: 'ההסטה תלויה במהירות דרך זמן השהייה בשדה, $t = L/v$.'
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: 'הזמן בלוחות קטן פי 2, והסטה היא $\tfrac12 at^2$, ולכן היא קטנה פי 4.'
        correct: true
        feedback: נכון. התאוצה זהה, אבל הזמן בריבוע.
      - text: חלקיק מהיר יותר מקבל יותר אנרגיה, ולכן נדחף חזק יותר.
        feedback: האנרגיה הגדולה יותר היא אנרגיה של תנועה, והשדה לא דוחף חזק יותר. הכוח $qE$ אותו כוח.
        misconception: MC-faster-deflects-more
      - text: 'מהירות כפולה נותנת זמן חצי, ולכן ההסטה חצי.'
        feedback: 'הזמן אכן חצי, אבל ההסטה תלויה בריבוע הזמן, לא בו עצמו.'
    hints:
      - 'כתבו את ההסטה בעזרת הזמן בלוחות: $y = \tfrac12 a t^2$ עם $t = L/v$.'
    explanation: >-
      $y = \dfrac{qEL^2}{2mv^2}$, ולכן $y \propto 1/v^2$. מכפילים את $v$: ההסטה בסוף הלוחות קטנה פי $2^2 = 4$.
      גם $\tan\theta = \dfrac{qEL}{mv^2}$ קטן פי 4, ולכן גם הכתם על המסך, $Y = \tan\theta\,(L/2 + D)$, קטן פי 4.

  - id: Q-1.10-rank-deflection
    type: rank
    objectives: [OBJ-1.10-3]
    qualitative: true
    prompt: >-
      ארבעה חלקיקים עוברים באותם לוחות. דרגו את גודל ההסטה שלהם בסוף הלוחות, מהגדולה לקטנה:
    items:
      - id: A
        label: 'אלקטרון, שדה $E$, מהירות $v$'
      - id: B
        label: 'אלקטרון, שדה $2E$, מהירות $v$'
      - id: C
        label: 'אלקטרון, שדה $E$, מהירות $2v$'
      - id: D
        label: 'פרוטון, שדה $E$, מהירות $v$'
    order: [B, A, C, D]
    correctFeedback: >-
      נכון. ביחס ל-A: ב-B ההסטה כפולה, ב-C היא רבע, וב-D היא $m_e/m_p \approx 1/1800$ ממנה.
    wrongFeedback: 'כתבו $y \propto qE/(mv^2)$ ובדקו כל מקרה ביחס ל-A: שדה כפול, מהירות כפולה, מסה גדולה פי 1800 בערך.'
    hints:
      - '$y = \dfrac{qEL^2}{2mv^2}$: ביחס ישר ל-$E$ ול-$q$, וביחס הפוך ל-$m$ ול-$v^2$.'

  - id: Q-1.10-proton-vs-electron
    type: mc
    objectives: [OBJ-1.10-3]
    qualitative: true
    prompt: >-
      אלקטרון ופרוטון נכנסים, בזה אחר זה, באותה מהירות לאותו שדה אחיד בין אותם לוחות. מה נכון?
    choices:
      - text: האלקטרון מוסט הרבה יותר, והם מוסטים לכיוונים מנוגדים.
        correct: true
        feedback: נכון. הכוח שווה בגודלו והמסה של האלקטרון קטנה פי 1800 בערך, ולכן ההסטה שלו גדולה פי 1800 בערך. הסימנים הפוכים, ולכן גם הכיוונים.
      - text: הפרוטון מוסט יותר, כי הוא כבד.
        feedback: 'מסה גדולה פירושה תאוצה קטנה: $y \propto 1/m$. החלקיק הכבד מוסט פחות.'
        misconception: MC-heavier-deflects-more
      - text: ההסטה שווה, כי גודל המטען שווה.
        feedback: 'גודל הכוח שווה, אבל ההסטה תלויה גם במסה: $y \propto q/m$.'
      - text: האלקטרון מוסט יותר, ושניהם מוסטים לאותו כיוון.
        feedback: 'המטענים בעלי סימנים הפוכים, ולכן הכוחות לכיוונים מנוגדים: אחד לכיוון השדה והשני נגדו.'
        misconception: MC-beam-follows-field

  - id: Q-1.10-keep-deflection
    type: numeric
    objectives: [OBJ-1.10-3]
    level: mid
    prompt: >-
      מגדילים את מהירות הכניסה של אלקטרון פי 3. פי כמה צריך להגדיל את עוצמת השדה כדי שההסטה תישאר זהה?
    answer: 9
    unit: פעמים
    tolerance: 0.03
    correctFeedback: 'נכון. $y \propto E/v^2$. כדי ש-$y$ לא ישתנה כש-$v$ גדל פי 3, צריך להגדיל את $E$ פי $3^2 = 9$.'
    wrongFeedback: 'ההסטה היא $y \propto E/v^2$. השוו את היחס $E/v^2$ לפני ואחרי.'
    commonWrong:
      - value: 3
        feedback: 'חשבתם שההסטה ביחס הפוך ל-$v$. אבל $v$ נכנס בריבוע, ולכן צריך פי $3^2$.'
        misconception: MC-faster-deflects-more
    hints:
      - '$y = \dfrac{qEL^2}{2mv^2}$. מה צריך להישאר קבוע?'

  # ------------------------------------------------ OBJ-1.10-4: Millikan and the quantisation of charge
  - id: Q-1.10-balance-charge
    type: numeric
    objectives: [OBJ-1.10-4]
    prompt: >-
      טיפת שמן שמסתה $1.6\cdot10^{-15}\,\text{kg}$ מרחפת בין שני לוחות אופקיים, בשדה אנכי של $5\cdot10^{4}\,\text{N/C}$.
      מה גודל המטען של הטיפה? ($g = 10\,\text{m/s}^2$)
    answer: 3.2e-19
    unit: C
    tolerance: 0.03
    correctFeedback: 'נכון. בריחוף $qE = mg$, ולכן $q = \dfrac{mg}{E} = \dfrac{1.6\cdot10^{-15}\cdot 10}{5\cdot10^{4}} = 3.2\cdot10^{-19}\,\text{C}$, כלומר $2e$.'
    wrongFeedback: 'בריחוף הכוח של השדה שווה למשקל: $qE = mg$. פתרו את $q$.'
    commonWrong:
      - value: 3.2e-20
        feedback: 'השתמשתם ב-$m/E$ וקיבלתם פי 10 פחות. המשקל הוא $mg$, לא $m$.'
    hints:
      - 'כתבו את שוויון הכוחות על טיפה מרחפת.'

  - id: Q-1.10-balance-field-dir
    type: vector
    objectives: [OBJ-1.10-4]
    qualitative: true
    prompt: >-
      טיפת שמן טעונה **שלילית** צריכה להישאר מרחפת בין שני לוחות אופקיים. לאן צריך להצביע השדה החשמלי בין הלוחות?
    answer: s
    correctFeedback: נכון. הכוח על הטיפה צריך להיות כלפי מעלה, כדי לאזן את המשקל. מטען שלילי מקבל כוח הפוך לשדה, ולכן השדה כלפי מטה, והלוח העליון חיובי.
    wrong:
      - dir: 'n'
        feedback: זה כיוון הכוח שצריך לפעול על הטיפה. אבל הטיפה שלילית, והכוח עליה הפוך לשדה. לכן השדה כלפי מטה.
        misconception: MC-beam-follows-field
      - dir: e
        feedback: 'הכוח שצריך לאזן את המשקל הוא אנכי, ולכן גם השדה אנכי. שדה אופקי לא יחזיק את הטיפה.'
      - dir: w
        feedback: 'הכוח שצריך לאזן את המשקל הוא אנכי, ולכן גם השדה אנכי. שדה אופקי לא יחזיק את הטיפה.'
      - dir: zero
        feedback: 'בלי שדה אין כוח חשמלי, והטיפה הייתה נופלת.'
    wrongFeedback: קבעו קודם לאן צריך להיות הכוח החשמלי, ואחר כך מה כיוון השדה למטען שלילי.

  - id: Q-1.10-hover-forces
    type: mc
    objectives: [OBJ-1.10-4]
    qualitative: true
    prompt: >-
      טיפת שמן טעונה מרחפת במקום בין שני לוחות. מה נכון?
    choices:
      - text: 'פועלים עליה שני כוחות שווים והפוכים: משקל כלפי מטה וכוח חשמלי כלפי מעלה.'
        correct: true
        feedback: נכון. הסכום שלהם אפס, ולכן הטיפה לא מאיצה. מהשוויון $qE = mg$ מחשבים את $q$.
      - text: לא פועל עליה שום כוח.
        feedback: 'הטיפה מרחפת כי הכוחות מבטלים זה את זה, לא כי אין כוחות. הכבידה פועלת עליה תמיד.'
        misconception: MC-hover-no-forces
      - text: פועל עליה רק כוח חשמלי כלפי מעלה, ולכן היא לא נופלת.
        feedback: 'הכבידה פועלת על הטיפה תמיד. אם היה פועל רק כוח כלפי מעלה, הטיפה הייתה עולה. היא מרחפת כי הכוח החשמלי מאזן את המשקל.'
      - text: הכוח החשמלי גדול מהמשקל, אבל התנגדות האוויר מחזיקה אותה במקום.
        feedback: 'התנגדות האוויר פועלת רק על גוף נע, והטיפה עומדת במקום. אם הכוח החשמלי היה גדול מהמשקל, הטיפה הייתה עולה. בריחוף שני הכוחות שווים.'

  - id: Q-1.10-quantization
    type: mc
    objectives: [OBJ-1.10-4]
    qualitative: true
    prompt: >-
      במדידות של טיפות שונות התקבלו המטענים הבאים, ביחידות של $10^{-19}\,\text{C}$: 3.2, 4.8, 6.4, 8.0.
      מה אפשר להסיק?
    choices:
      - text: כל המטענים הם כפולות שלמות של $1.6\cdot10^{-19}\,\text{C}$, ולכן המטען מופיע ביחידות שלמות.
        correct: true
        feedback: 'נכון. היחסים הם 2, 3, 4, 5. מטען שאינו כפולה שלמה כזו לא נמדד, וזו הוכחה לקוונטיזציה של המטען.'
      - text: המטען יכול לקבל כל ערך, וההפרשים הם שגיאות מדידה.
        feedback: 'ההפרשים בין הערכים הם בדיוק $1.6\cdot10^{-19}\,\text{C}$ ולא סתם מספרים אקראיים. שגיאת מדידה לא הייתה נותנת סדר כזה.'
        misconception: MC-charge-continuous
      - text: המטען היסודי הוא $3.2\cdot10^{-19}\,\text{C}$, כי זה הערך הקטן ביותר שנמדד.
        feedback: 'אם היחידה הייתה 3.2, הערך 4.8 לא היה אפשרי: הוא פי 1.5. היחידה שמתאימה לכולם היא $1.6\cdot10^{-19}\,\text{C}$.'
      - text: ככל שהטיפה כבדה יותר, מטענה גדול יותר.
        feedback: 'בניסוי המסה והמטען אינם קשורים בצורה כזו. המסקנה נובעת מהיחסים בין המטענים עצמם.'

  - id: Q-1.10-gcd-unit
    type: numeric
    objectives: [OBJ-1.10-4]
    level: mid
    prompt: >-
      במדידות של שלוש טיפות התקבלו המטענים $4.8\cdot10^{-19}\,\text{C}$, $8.0\cdot10^{-19}\,\text{C}$ ו-$3.2\cdot10^{-19}\,\text{C}$.
      מהו המטען הגדול ביותר ששלוש המדידות כולן הן כפולות שלמות שלו?
    answer: 1.6e-19
    unit: C
    tolerance: 0.03
    correctFeedback: 'נכון. $4.8 = 3\cdot1.6$, $8.0 = 5\cdot1.6$ ו-$3.2 = 2\cdot1.6$ (ביחידות של $10^{-19}\,\text{C}$). זה המטען היסודי $e$.'
    wrongFeedback: 'חפשו מספר שמחלק את שלושת המטענים בלי שארית.'
    commonWrong:
      - value: 5.33e-19
        feedback: 'חישבתם ממוצע. אבל מיליקן חיפש יחידה שכל המטענים מתחלקים בה, לא ערך ממוצע.'
        misconception: MC-charge-continuous
      - value: 0.8e-19
        feedback: 'כל אחד משלושת המטענים הוא כפולה שלמה של $0.8\cdot10^{-19}\,\text{C}$ (למשל $4.8 = 6\cdot0.8$), אבל זו לא הכפולה הגדולה ביותר: גם $1.6\cdot10^{-19}\,\text{C}$ מתאים לשלושתם, והוא גדול יותר.'
    hints:
      - 'חלקו כל מטען ב-$1.6\cdot10^{-19}\,\text{C}$. מה יוצא?'

  - id: Q-1.10-five-charges
    type: numeric
    objectives: [OBJ-1.10-4]
    level: bagrut
    prompt: >-
      לטיפה שמסתה $1.6\cdot10^{-15}\,\text{kg}$ יש חמישה מטענים יסודיים עודפים (מטען שלילי $5e$).
      איזו עוצמת שדה אנכי תחזיק אותה מרחפת? ($e = 1.6\cdot10^{-19}\,\text{C}$, $g = 10\,\text{m/s}^2$)
    answer: 2.0e4
    unit: N/C
    tolerance: 0.03
    correctFeedback: 'נכון. $E = \dfrac{mg}{5e} = \dfrac{1.6\cdot10^{-15}\cdot 10}{5\cdot1.6\cdot10^{-19}} = 2.0\cdot10^{4}\,\text{N/C}$.'
    wrongFeedback: 'בריחוף $qE = mg$, עם $q = 5e$.'
    commonWrong:
      - value: 1.0e5
        feedback: 'חישבתם עבור מטען יסודי אחד. כאן המטען גדול פי 5, ולכן מספיק שדה חלש פי 5.'
    hints:
      - 'המטען הוא $q = 5\cdot1.6\cdot10^{-19}\,\text{C}$.'
