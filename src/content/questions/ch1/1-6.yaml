# Lesson 1.6 question bank. Format and rules: see questions/ch1/1-5.yaml.

chapter: 1
questions:
  # ---------------------------------------------------------------- 1.6 field lines
  - id: Q-1.6-start-end
    type: mc
    objectives: [OBJ-1.6-1]
    qualitative: true
    prompt: >-
      מטען חיובי ומטען שלילי שווים בגודלם נמצאים זה ליד זה. איפה מתחילים ואיפה מסתיימים קווי השדה?
    choices:
      - text: הם מתחילים במטען החיובי ומסתיימים במטען השלילי.
        correct: true
        feedback: נכון. קווי שדה יוצאים ממטען חיובי ונכנסים למטען שלילי, בכיוון הכוח על מטען בוחן חיובי.
      - text: הם מתחילים בשני המטענים, ויוצאים החוצה.
        feedback: מטען שלילי מושך מטען בוחן חיובי אליו, ולכן הקווים נכנסים אליו ולא יוצאים ממנו.
        misconception: MC-lines-negative-source
      - text: הם מתחילים במטען השלילי ומסתיימים במטען החיובי.
        feedback: זה הכיוון ההפוך. כיוון הקו הוא כיוון הכוח על מטען בוחן **חיובי**, והוא נדחה מהמטען החיובי.
        misconception: MC-lines-negative-source

  - id: Q-1.6-no-cross
    type: twotier
    objectives: [OBJ-1.6-1]
    qualitative: true
    prompt: >-
      תלמיד צייר שני קווי שדה שנחתכים בנקודה P, שבה אין מטען והשדה בה אינו אפס. האם הציור יכול להיות נכון?
    choices:
      - text: לא.
        correct: true
        feedback: נכון. קווי שדה לא נחתכים (מחוץ למטענים).
      - text: כן, כל קו מתאר שדה של מטען אחר.
        feedback: השדה השקול הוא אחד. בנקודה P יש לו כיוון אחד בלבד, והקו משיק לכיוון הזה.
        misconception: MC-lines-cross
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: בכל נקודה לשדה יש כיוון אחד, והקו משיק אליו. בנקודת חיתוך היו שני כיוונים.
        correct: true
        feedback: בדיוק. חיתוך פירושו ששני כיווני שדה שונים נמצאים באותה נקודה.
      - text: קווי שדה לא נחתכים כי הם מייצגים כוחות, והכוחות לא מתנגשים.
        feedback: הנימוק לא נכון. כוחות כן מתחברים. הסיבה היא שהשדה השקול בנקודה הוא וקטור אחד.
        misconception: MC-lines-cross
      - text: בנקודת חיתוך תמיד השדה אפס, ובאפס אין קו.
        feedback: בנקודה שבה השדה אפס אין קו בכלל, ולכן שם לא נחתכים קווים. אבל בנקודה P יש שדה, ובמקום שבו יש שדה יש לו כיוון אחד בלבד. לכן הנימוק הזה לא פוסל את הציור.
    hints:
      - מה הכיוון של השדה בנקודה P, אם יש לו שני קווים?
    explanation: >-
      הקו משיק לשדה בכל נקודה. שני קווים שונים בנקודה אחת פירושם שני כיווני שדה, וזה בלתי אפשרי.

  - id: Q-1.6-like-middle
    type: mc
    objectives: [OBJ-1.6-1]
    qualitative: true
    prompt: >-
      שני מטענים חיוביים שווים נמצאים במרחק קבוע זה מזה. מה רואים בציור קווי השדה באמצע, בין המטענים?
    choices:
      - text: אין שם קווים, כי השדה השקול באמצע הוא אפס. הקווים של כל מטען מתעקלים החוצה.
        correct: true
        feedback: נכון. השדות של שני המטענים שווים ומנוגדים באמצע, והשדה השקול אפס.
      - text: קו ישר שמחבר בין שני המטענים.
        feedback: שני המטענים חיוביים, והקווים יוצאים מהם ולא נכנסים. באמצע השדות מבטלים זה את זה.
        misconception: MC-lines-connect-like
      - text: שני קווים שנחתכים באמצע.
        feedback: קווי שדה לא נחתכים. באמצע השדה אפס, ושם פשוט אין קו.
        misconception: MC-lines-cross

  - id: Q-1.6-direction-vector
    type: vector
    objectives: [OBJ-1.6-2]
    qualitative: true
    prompt: >-
      קו שדה עובר בנקודה P, והחץ שעליו מצביע **למעלה**. מה כיוון הכוח על מטען בוחן **שלילי** שמונח ב-P?
    answer: s
    correctFeedback: נכון. הכיוון של הקו הוא כיוון השדה. על מטען שלילי הכוח הפוך לשדה, כלומר למטה.
    wrong:
      - dir: n
        feedback: זה כיוון השדה, וגם כיוון הכוח על מטען בוחן חיובי. על מטען שלילי הכוח הפוך.
    wrongFeedback: הכיוון על הקו הוא כיוון הכוח על מטען בוחן חיובי. מה קורה למטען שלילי?

  - id: Q-1.6-rank-density
    type: rank
    objectives: [OBJ-1.6-2]
    qualitative: true
    prompt: >-
      בציור של קווי שדה, המרחק בין שני קווים שכנים הוא 1 ס"מ ליד נקודה A, 3 ס"מ ליד נקודה B ו-2 ס"מ ליד נקודה C.
      דרגו את עוצמת השדה בשלוש הנקודות, מהחזקה לחלשה:
    items:
      - id: B
        label: 'נקודה B: המרחק בין הקווים 3 ס"מ'
      - id: A
        label: 'נקודה A: המרחק בין הקווים 1 ס"מ'
      - id: C
        label: 'נקודה C: המרחק בין הקווים 2 ס"מ'
    order: [A, C, B]
    correctFeedback: נכון. הקווים צפופים יותר היכן שהשדה חזק יותר, ולכן A חזקה מ-C, ו-C חזקה מ-B.
    wrongFeedback: ככל שהקווים צפופים יותר (מרחק קטן ביניהם) השדה חזק יותר.
    hints:
      - איפה הקווים הכי קרובים זה לזה?

  - id: Q-1.6-between-lines
    type: mc
    objectives: [OBJ-1.6-2]
    qualitative: true
    prompt: >-
      נקודה P נמצאת בדיוק באמצע בין שני קווי שדה שכנים, ולא מצויר דרכה שום קו. מה אפשר לומר על השדה ב-P?
    choices:
      - text: יש שם שדה, וכיוונו משיק לקו שהיה עובר דרך P.
        correct: true
        feedback: נכון. קווי השדה הם ציור. השדה קיים בכל נקודה, גם בנקודה שלא עובר בה קו מצויר.
      - text: אין שם שדה, כי לא עובר שם קו.
        feedback: מציירים רק מספר קווים, כדי שהציור יישאר קריא. בין הקווים השדה לא נעלם.
        misconception: MC-lines-between-empty
      - text: יהיה שם שדה רק אם נצייר עוד קו.
        feedback: הציור לא יוצר את השדה, הוא רק מתאר אותו. השדה היה שם גם בלי הקו.
        misconception: MC-lines-between-empty

  - id: Q-1.6-trajectory
    type: mc
    objectives: [OBJ-1.6-2]
    qualitative: true
    prompt: >-
      בציור של דיפול, קו שדה מתעקל מהמטען החיובי אל השלילי. משחררים ממנוחה מטען בוחן חיובי קטן על הקו. איך יזוז?
    choices:
      - text: יתחיל לנוע בכיוון המשיק לקו, אבל בהמשך בדרך כלל יצא מהקו כשהקו מתעקל.
        correct: true
        feedback: נכון. כדי לנוע על מסלול מעוקל צריך כוח שמצביע אל מרכז העיקול, כמו בתנועה מעגלית. אבל הכוח כאן משיק לקו ולא מצביע למרכז. לכן המטען שצבר מהירות ממשיך ישר, והקו מתעקל ממנו.
      - text: ינוע בדיוק לאורך הקו עד המטען השלילי.
        feedback: כדי להישאר על קו מעוקל צריך כוח שמצביע אל מרכז העיקול, כמו בתנועה מעגלית. הכוח על המטען משיק לקו, ולכן אין לו רכיב כזה. מהירות מצטברת מוציאה את המטען מהקו.
        misconception: MC-lines-trajectory
      - text: ינוע בכיוון הניצב לקו.
        feedback: הכוח משיק לקו, לא ניצב לו. לכן ההאצה בהתחלה היא לאורך הקו.

  - id: Q-1.6-ratio-lines
    type: numeric
    objectives: [OBJ-1.6-3]
    prompt: >-
      בציור מסוים ממטען חיובי $A$ של $3\,\mu\text{C}$ יוצאים 12 קווים, ואל מטען שלילי $B$ נכנסים 6 קווים.
      שני המטענים מצוירים לפי אותו כלל. מה גודל המטען $B$?
    answer: 1.5
    unit: μC
    correctFeedback: 'נכון. מספר הקווים ביחס ישר למטען: 12 קווים הם $3\,\mu\text{C}$, כלומר 4 קווים לכל $\mu\text{C}$. ו-6 קווים הם $6/4 = 1.5\,\mu\text{C}$.'
    wrongFeedback: מספר הקווים ביחס ישר לגודל המטען. מצאו קודם כמה קווים מצוירים לכל מיקרו-קולון.
    commonWrong:
      - value: -1.5
        feedback: 'שאלו על גודל המטען, ולכן מספר חיובי. הסימן שלילי כי הקווים נכנסים, אבל גודל הוא תמיד חיובי.'
      - value: 6
        feedback: זה מספר הקווים, לא המטען. צריך להמיר אותו למיקרו-קולון.
      - value: 0.5
        feedback: חילקתם את המטען של $A$ במספר הקווים של $B$. צריך לחלק את מספר הקווים של $B$ במספר הקווים לכל מיקרו-קולון.
    hints:
      - כמה קווים מצוירים לכל $1\,\mu\text{C}$?

  - id: Q-1.6-signs-count
    type: mc
    objectives: [OBJ-1.6-3]
    qualitative: true
    prompt: >-
      בציור, אל מטען $P$ נכנסים 8 קווים, וממטען $R$ יוצאים 4 קווים. מה אפשר לקבוע?
    choices:
      - text: $P$ שלילי, $R$ חיובי, והמטען של $P$ גדול פי 2 בגודלו.
        correct: true
        feedback: נכון. קווים נכנסים למטען שלילי ויוצאים ממטען חיובי, ומספר הקווים ביחס ישר לגודל המטען.
      - text: $P$ חיובי, $R$ שלילי, והמטען של $P$ גדול פי 2 בגודלו.
        feedback: הסימנים הפוכים. קווים נכנסים למטען שלילי ויוצאים ממטען חיובי.
        misconception: MC-lines-negative-source
      - text: $P$ שלילי, $R$ חיובי, והמטענים שווים בגודלם.
        feedback: הסימנים נכונים, אבל מספר הקווים שונה, ולכן גם גודל המטענים שונה.
      - text: אי אפשר לדעת, כי לא ברור כמה קווים צריך לצייר.
        feedback: בכל ציור מספר הקווים לכל יחידת מטען קבוע, ולכן אפשר להשוות בין המטענים.

  - id: Q-1.6-count-triple
    type: mc
    objectives: [OBJ-1.6-3]
    qualitative: true
    prompt: >-
      מטען נקודתי מצויר עם 5 קווים. מגדילים אותו פי 3 ומציירים אותו לפי אותו כלל. כמה קווים יוצאים ממנו?
    choices:
      - text: '15'
        correct: true
        feedback: נכון. מספר הקווים ביחס ישר למטען.
      - text: '45'
        feedback: מטען פי 3 נותן פי 3 קווים, לא פי $3^2$. הריבוע שייך לשדה כתלות במרחק.
      - text: 5, והקווים נעשים ארוכים יותר
        feedback: אורך הקו לא מראה את גודל המטען. מספר הקווים והצפיפות שלהם מראים אותו.
