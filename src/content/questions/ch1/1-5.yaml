# Chapter 1 question bank. Strings may hold $inline$ / $$display$$ TeX and **bold**; they are
# rendered at build time, so a broken formula fails the build with the question id.
# YAML note: plain and single-quoted strings keep backslashes literally; never use "…" for TeX.

chapter: 1
questions:
  # ---------------------------------------------------------------- 1.5 the electric field
  - id: Q-1.5-test-charge-double
    type: twotier
    objectives: [OBJ-1.5-1]
    qualitative: true
    prompt: >-
      בנקודה P ליד מטען מקור Q מניחים מטען בוחן $q_0$ ומודדים את הכוח עליו, $F$.
      מחליפים את מטען הבוחן במטען $2q_0$. מה קורה לעוצמת השדה החשמלי בנקודה P?
    choices:
      - text: היא גדלה פי 2.
        feedback: הכוח באמת גדל פי 2. אבל השדה הוא הכוח **ליחידת מטען**, $F/q_0$. גם המטען גדל פי 2, ולכן המנה לא משתנה.
        misconception: MC-field-depends-on-test-charge
      - text: היא לא משתנה.
        correct: true
        feedback: נכון. השדה הוא תכונה של הנקודה, שנקבעת על ידי מטען המקור והמרחק ממנו.
      - text: היא קטנה פי 2.
        feedback: 'מה שמתחלק ב-$q_0$ הוא הכוח, וגם הכוח גדל. המנה $F/q_0$ נשארת כפי שהייתה.'
        misconception: MC-field-depends-on-test-charge
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: 'גם $F$ וגם $q_0$ גדלים פי 2, ולכן המנה $E = F/q_0$ לא משתנה.'
        correct: true
        feedback: זה בדיוק הרעיון שמאחורי ההגדרה. מחלקים במטען הבוחן כדי לקבל גודל שלא תלוי בו.
      - text: השדה שווה לכוח, והכוח גדל פי 2.
        feedback: השדה איננו הכוח. השדה הוא הכוח שמקבל כל קולון של מטען בוחן, והיחידות שלו הן N/C, לא N.
        misconception: MC-field-depends-on-test-charge
      - text: מטען בוחן גדול יותר "תופס" יותר מהשדה ומחליש אותו.
        feedback: 'מטען הבוחן לא מחליש את השדה של מטען המקור. הוא רק מקבל ממנו כוח, ובכוח הזה משתמשים כדי למדוד את השדה.'
        misconception: MC-field-depends-on-test-charge
    hints:
      - 'כתבו את ההגדרה $E = F/q_0$. מה קורה למונה, ומה קורה למכנה?'
    explanation: >-
      לפי חוק קולון $F = kQq_0/r^2$, כלומר הכוח ביחס ישר ל-$q_0$. לכן
      $E = F/q_0 = kQ/r^2$, ו-$q_0$ מצטמצם. השדה תלוי רק ב-$Q$ ובמרחק $r$.

  - id: Q-1.5-ratio
    type: numeric
    objectives: [OBJ-1.5-1]
    prompt: >-
      מטען בוחן של $q_0 = 2\,\text{nC}$ שמונח בנקודה P מקבל כוח של $6\cdot10^{-5}\,\text{N}$.
      מה עוצמת השדה החשמלי בנקודה P?
    answer: 3.0e4
    unit: N/C
    correctFeedback: 'נכון: $E = F/q_0 = 6\cdot10^{-5} / 2\cdot10^{-9} = 3\cdot10^{4}\,\text{N/C}$.'
    wrongFeedback: 'השתמשו בהגדרה $E = F/q_0$, וזכרו ש-$1\,\text{nC} = 10^{-9}\,\text{C}$.'
    commonWrong:
      - value: 1.2e-13
        feedback: 'כפלתם את הכוח במטען. השדה הוא **מנה**: כוח לכל קולון.'
    hints:
      - 'המירו קודם את $q_0$ לקולון.'

  - id: Q-1.5-empty-point
    type: mc
    objectives: [OBJ-1.5-1]
    qualitative: true
    prompt: >-
      בנקודה P אין שום מטען ואין שום חומר. במרחק 20 ס"מ ממנה נמצא מטען Q.
      האם יש שדה חשמלי בנקודה P?
    choices:
      - text: כן. השדה של Q קיים בכל נקודה במרחב סביבו.
        correct: true
        feedback: נכון. מטען משנה את כל המרחב סביבו. מטען בוחן שנניח ב-P רק יחשוף את השדה שכבר שם.
      - text: לא. כדי שיהיה שדה צריך להניח ב-P מטען בוחן.
        feedback: מטען הבוחן מודד את השדה, הוא לא יוצר אותו. השדה היה שם גם לפני שהנחנו אותו.
        misconception: MC-field-needs-charge-present
      - text: רק אם יש אוויר בין Q לבין P.
        feedback: שדה חשמלי קיים גם בריק. למשל, שדות חשמליים מאיצים אלקטרונים בשפופרות ריק.

  - id: Q-1.5-negative-test-field
    type: vector
    objectives: [OBJ-1.5-2]
    qualitative: true
    prompt: >-
      מטען מקור **חיובי** Q נמצא משמאל לנקודה P, על אותו קו אופקי.
      מניחים ב-P מטען בוחן **שלילי**. מה כיוון השדה החשמלי בנקודה P?
    answer: e
    correctFeedback: נכון. השדה של מטען חיובי מצביע הרחק ממנו, וסימן מטען הבוחן לא משנה את השדה.
    wrong:
      - dir: w
        feedback: זה כיוון **הכוח** על מטען הבוחן השלילי. השדה מוגדר לפי הכוח על מטען חיובי, ולכן הוא ימינה.
        misconception: MC-negative-test-charge-flips-field
      - dir: zero
        feedback: השדה ב-P קיים בכל מקרה. הוא נקבע על ידי Q, לא על ידי מה שמונח ב-P.
        misconception: MC-field-needs-charge-present
    wrongFeedback: 'השדה של מטען חיובי מצביע הרחק ממנו, לאורך הקו שמחבר אותו לנקודה.'

  - id: Q-1.5-negative-test-force
    type: vector
    objectives: [OBJ-1.5-2]
    qualitative: true
    prompt: >-
      באותו מצב (מטען מקור **חיובי** Q משמאל לנקודה P, ומטען בוחן **שלילי** ב-P):
      מה כיוון **הכוח** על מטען הבוחן?
    answer: w
    correctFeedback: נכון. מטען שלילי נמשך אל מטען חיובי, ולכן הכוח עליו הפוך לכיוון השדה.
    wrong:
      - dir: e
        feedback: ימינה הוא כיוון השדה. על מטען שלילי הכוח הפוך לשדה, $\vec F = q_0\vec E$ עם $q_0 < 0$.
    wrongFeedback: מטענים מנוגדים נמשכים זה לזה.

  - id: Q-1.5-negative-source
    type: vector
    objectives: [OBJ-1.5-2]
    qualitative: true
    prompt: >-
      מטען מקור **שלילי** $-Q$ נמצא בדיוק מתחת לנקודה P. מה כיוון השדה החשמלי ב-P?
    answer: s
    correctFeedback: נכון. מטען בוחן חיובי ב-P היה נמשך אל המטען השלילי, כלומר למטה.
    wrong:
      - dir: n
        feedback: השדה של מטען שלילי מצביע **אליו**. חשבו על הכוח שהיה פועל על מטען בוחן חיובי ב-P.
        misconception: MC-field-away-from-negative
    wrongFeedback: כיוון השדה הוא כיוון הכוח על מטען בוחן חיובי.

  - id: Q-1.5-point-field
    type: numeric
    objectives: [OBJ-1.5-3]
    prompt: >-
      מה עוצמת השדה החשמלי במרחק 50 ס"מ ממטען נקודתי של $2\,\mu\text{C}$?
      ($k = 9\cdot10^{9}\,\text{N}\cdot\text{m}^2/\text{C}^2$)
    answer: 7.2e4
    unit: N/C
    tolerance: 0.03
    correctFeedback: 'נכון: $E = \dfrac{kQ}{r^2} = \dfrac{9\cdot10^9 \cdot 2\cdot10^{-6}}{0.5^2} = 7.2\cdot10^4\,\text{N/C}$.'
    wrongFeedback: 'השתמשו ב-$E = kQ/r^2$, עם $Q$ בקולון ו-$r$ במטרים.'
    commonWrong:
      - value: 3.6e4
        feedback: 'חילקתם ב-$r$ במקום ב-$r^2$. השדה של מטען נקודתי יורד כמו $1/r^2$.'
        misconception: MC-field-linear-in-r
    hints:
      - '$2\,\mu\text{C} = 2\cdot10^{-6}\,\text{C}$ ו-$50\,\text{cm} = 0.5\,\text{m}$.'
      - 'הציבו ב-$E = kQ/r^2$. כמה זה $0.5^2$?'

  - id: Q-1.5-triple-distance
    type: mc
    objectives: [OBJ-1.5-3]
    qualitative: true
    prompt: >-
      במרחק $r$ ממטען נקודתי עוצמת השדה היא $E$. מה עוצמת השדה במרחק $3r$ מאותו מטען?
    choices:
      - text: '$E/9$'
        correct: true
        feedback: 'נכון. $E \propto 1/r^2$, ולכן מרחק פי 3 נותן שדה חלש פי $3^2 = 9$.'
      - text: '$E/3$'
        feedback: 'זה היה נכון אם השדה היה יורד כמו $1/r$. אבל בחוק קולון המרחק בריבוע.'
        misconception: MC-field-linear-in-r
      - text: '$E/6$'
        feedback: 'בריבוע מעלים בחזקה, לא מכפילים ב-2: $3^2 = 9$, לא $6$.'
      - text: '$E$'
        feedback: השדה תלוי במרחק ממטען המקור. ככל שמתרחקים הוא נחלש.

  - id: Q-1.5-rank-points
    type: rank
    objectives: [OBJ-1.5-3]
    qualitative: true
    prompt: >-
      דרגו את עוצמת השדה החשמלי בשלוש הנקודות, מהחזקה לחלשה:
    items:
      - id: C
        label: 'נקודה C: במרחק $r$ ממטען $Q/2$'
      - id: A
        label: 'נקודה A: במרחק $r$ ממטען $Q$'
      - id: B
        label: 'נקודה B: במרחק $2r$ ממטען $2Q$'
    order: [A, [B, C]]
    correctFeedback: >-
      נכון. $E_A = kQ/r^2$. ב-B: $k(2Q)/(2r)^2 = kQ/(2r^2)$, ובנקודה C: $k(Q/2)/r^2 = kQ/(2r^2)$.
      B ו-C שוות, וחלשות פי 2 מ-A.
    wrongFeedback: 'כתבו כל שדה בעזרת $E = kQ/r^2$, כמספר כפול $kQ/r^2$ (למשל $E_A = 1\cdot kQ/r^2$). שימו לב שהמרחק בריבוע.'
    hints:
      - 'ב-B המטען כפול, אבל המרחק כפול נכנס בריבוע.'

  - id: Q-1.5-midpoint-like
    type: mc
    objectives: [OBJ-1.5-4]
    qualitative: true
    prompt: >-
      שני מטענים חיוביים שווים, $+Q$ ו-$+Q$, נמצאים במרחק $2d$ זה מזה.
      מה עוצמת השדה השקול בנקודת האמצע ביניהם?
    choices:
      - text: אפס
        correct: true
        feedback: נכון. בנקודת האמצע שני השדות שווים בגודלם ומנוגדים בכיוונם, ולכן הם מבטלים זה את זה.
      - text: '$2kQ/d^2$'
        feedback: חיברתם את העוצמות. אבל השדות האלה מצביעים לכיוונים מנוגדים, וחיבור וקטורי שלהם נותן אפס.
        misconception: MC-superposition-add-magnitudes
      - text: '$kQ/d^2$'
        feedback: זה השדה של כל מטען לבדו. כשמחברים את שני הווקטורים, מה מקבלים?

  - id: Q-1.5-dipole-midpoint
    type: vector
    objectives: [OBJ-1.5-4]
    qualitative: true
    prompt: >-
      מטען $+Q$ נמצא משמאל ומטען $-Q$ נמצא מימין. מה כיוון השדה השקול בנקודת האמצע ביניהם?
    answer: e
    correctFeedback: >-
      נכון. השדה של $+Q$ מצביע הרחק ממנו (ימינה), והשדה של $-Q$ מצביע אליו (גם ימינה).
      שני השדות באותו כיוון, ולכן הם מתחברים.
    wrong:
      - dir: zero
        feedback: >-
          לכאורה "המטענים מנוגדים ולכן מתבטלים". אבל בדקו כל שדה בנפרד: $+Q$ דוחף מטען בוחן ימינה,
          ו-$-Q$ מושך אותו ימינה. שני השדות מתחברים.
        misconception: MC-opposite-signs-cancel
      - dir: w
        feedback: מטען בוחן חיובי באמצע נדחה מ-$+Q$ ונמשך ל-$-Q$. לאיזה צד זה?
        misconception: MC-field-away-from-negative
    wrongFeedback: קבעו את כיוון השדה של כל מטען לבדו, ואז חברו.

  - id: Q-1.5-superposition-line
    type: numeric
    objectives: [OBJ-1.5-4]
    level: bagrut
    prompt: >-
      מטען $q_1 = +3\,\mu\text{C}$ נמצא בראשית הצירים, ומטען $q_2 = -1\,\mu\text{C}$ נמצא
      בנקודה $x = 0.3\,\text{m}$. מה עוצמת השדה השקול בנקודה $x = 0.6\,\text{m}$?
    answer: 2.5e4
    unit: N/C
    correctFeedback: >-
      נכון. $E_1 = \dfrac{9\cdot10^9\cdot3\cdot10^{-6}}{0.6^2} = 7.5\cdot10^4\,\text{N/C}$ בכיוון $+x$,
      ו-$E_2 = \dfrac{9\cdot10^9\cdot10^{-6}}{0.3^2} = 10^5\,\text{N/C}$ בכיוון $-x$ (אל $q_2$).
      השקול: $2.5\cdot10^4\,\text{N/C}$ בכיוון $-x$.
    wrongFeedback: חשבו כל שדה לחוד, קבעו את כיוונו, ורק אז חברו כווקטורים על הציר.
    commonWrong:
      - value: 1.75e5
        feedback: חיברתם את שתי העוצמות. אבל השדות מצביעים לכיוונים מנוגדים, ולכן צריך להחסיר.
        misconception: MC-superposition-add-magnitudes
    hints:
      - 'המרחק מ-$q_1$ הוא $0.6\,\text{m}$, והמרחק מ-$q_2$ הוא $0.3\,\text{m}$.'
      - 'השדה של $q_1$ מצביע הרחק ממנו ($+x$). השדה של $q_2$ השלילי מצביע אליו ($-x$).'
