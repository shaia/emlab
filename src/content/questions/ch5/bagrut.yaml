          - { kind: manipulation, text: 'הקו המתאים ביותר הוא $\varepsilon = 1.26\,\dfrac{\Delta I}{\Delta t} - 0.06$ (עם $\varepsilon$ ב-$\text{mV}$ ו-$\Delta I/\Delta t$ ב-$\text{A/s}$). הוא עובר ליד $(2,\ 2.46)$ וליד $(10,\ 12.54)$, והנקודות מתפזרות משני צדדיו, הרחוקה ביותר במרחק $0.12\,\text{mV}$ ממנו.' }
          - { kind: result, text: 'דיאגרמת פיזור של חמש נקודות, וקו מגמה ישר עם שיפוע חיובי שעובר כמעט דרך הראשית, כפי שמצפים מיחס ישר.' }
        rubric:
