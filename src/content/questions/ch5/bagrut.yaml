          - { kind: manipulation, text: 'הגדלים $n$ ו-$A$ קבועים, ולכן השטף משתנה רק בגלל הזרם: $\Delta\Phi = \mu_0 nA\,\Delta I$.' }
          - { kind: result, text: 'מציבים בחוק פאראדיי: $\varepsilon = N\dfrac{\Delta\Phi}{\Delta t} = \mu_0 nNA\,\dfrac{\Delta I}{\Delta t}$. הכא"מ ביחס ישר לקצב השינוי של הזרם, ולא לזרם עצמו.' }
