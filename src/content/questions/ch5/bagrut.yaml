      - label: ג
        type: numeric
        points: 6
        level: bagrut
        standalone: false
        objectives: [OBJ-0.4-4, OBJ-5.2-2]
        prompt: 'חשבו, לפי קו המגמה והביטוי מסעיף א, את צפיפות הכריכות $n$ של הסליל הארוך.'
        answer: 2.0e3
        unit: 1/m
        tolerance: 0.1
        correctFeedback: >-
          נכון. לפי סעיף א, השיפוע של הגרף הוא $k = \mu_0 nNA$. משתי נקודות רחוקות על הקו:
          $k = \dfrac{12.54 - 2.46}{10 - 2} \approx 1.26\,\text{mV}\cdot\text{s/A} = 1.26\cdot10^{-3}\,\text{V}\cdot\text{s/A}$.
          לכן $n = \dfrac{k}{\mu_0 NA} = \dfrac{1.26\cdot10^{-3}}{4\pi\cdot10^{-7}\cdot500\cdot10^{-3}} \approx 2.0\cdot10^{3}\,\text{m}^{-1}$,
          כלומר כ-2000 כריכות בכל מטר של הסליל הארוך.
        wrongFeedback: >-
          השוו את $\varepsilon = \mu_0 nNA\,\dfrac{\Delta I}{\Delta t}$ למשוואה של ישר: מה עומד במקום השיפוע? חשבו את
          השיפוע משתי נקודות רחוקות על הקו, והמירו לפני ההצבה: מילי-וולט לוולט, ו-$10\,\text{cm}^2 = 10^{-3}\,\text{m}^2$.
        commonWrong:
          - value: 1.0e6
            feedback: 'שכחתם את $N$: חילקתם רק ב-$\mu_0 A$. בכל אחת מ-500 הכריכות נוצר כא"מ, והכריכות מחוברות בטור, ולכן השיפוע הוא $\mu_0 nNA$.'
            misconception: MC-faraday-ignore-turns
          - value: 2.0e6
            feedback: 'הצבתם את השיפוע במילי-וולט כאילו היה בוולט. השיפוע הוא $1.26\,\text{mV}\cdot\text{s/A} = 1.26\cdot10^{-3}\,\text{V}\cdot\text{s/A}$.'
          - value: 0.20
            feedback: 'הצבתם $A = 10$, כאילו השטח במטרים רבועים. $1\,\text{cm}^2 = 10^{-4}\,\text{m}^2$, ולכן $A = 10^{-3}\,\text{m}^2$.'
          - value: 1.26e4
            feedback: 'הצבתם $2\cdot10^{-7}$ במקום $\mu_0$. זה הערך של $\dfrac{\mu_0}{2\pi}$, מהנוסחה של תיל ישר. כאן $\mu_0 = 4\pi\cdot10^{-7}\,\text{T}\cdot\text{m/A}$.'
        hints:
          - 'לפי סעיף א, איזה גודל הוא השיפוע של הגרף של $\varepsilon$ כתלות ב-$\dfrac{\Delta I}{\Delta t}$?'
        explanation: >-
          בדיקת יחידות: $\text{V}\cdot\text{s} = \text{Wb} = \text{T}\cdot\text{m}^2$, ולכן
          $\dfrac{\text{T}\cdot\text{m}^2/\text{A}}{(\text{T}\cdot\text{m/A})\cdot\text{m}^2} = \text{m}^{-1}$, כריכות למטר.

      - label: ד
        type: mc
        points: 4
        level: basic
        qualitative: true
        objectives: [OBJ-5.2-1, OBJ-0.4-2]
        prompt: >-
          לפני ההרצות התלמידים העבירו בסליל הארוך זרם קבוע של $5.0\,\text{A}$ במשך דקה. מה הראה מד המתח בזמן הזה?
