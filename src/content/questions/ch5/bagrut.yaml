# Chapter 5 Bagrut-style questions: a scenario with lettered parts (א, ב, ג…), 33 points each, as in
# paper 036371. Format and rules: see questions/ch1/bagrut.yaml.
#
# Directions are worked as on the Bagrut: magnitudes from Faraday's law, |ε| = N·|ΔΦ|/Δt, and the
# direction from Lenz's law. Every direction claim agrees with the signed law of the chapter (the normal
# and the positive sense tied by the right-hand rule, Φ measured along the normal).
#
# Every number was computed with src/physics, not by hand:
# - question 1: railrod.ts (fallRod, railAcceleration, railPowers, kinetic) and induction.ts
#   (railTerminalSpeed, railTimeConstant, railCurrent, railSpeed, railDistance: the speed after 2.0 m);
# - question 2: fluxgraphs.ts (passTimes, passFlux, passEmf, passCurrent, passPushForce, passPushPower,
#   passHeatPower, passCharge, passWork);
# - question 3: generator.ts (angularSpeed, periodOf, cycleMean, instantPower, drivePower) and induction.ts
#   (generatorPeak, rms, acMeanPower, fluxUniform).
# The commonWrong values are the same functions' formulas with the named mistake made (a square dropped,
# f in place of ω, N left out…), evaluated with tsx.

chapter: 5
questions:
  # ------------------------------------------------------------ 1: a rod falling between vertical rails
  - id: Q-5-bagrut-1
    type: bagrut
    title: מוט נופל בין מסילות אנכיות
    prompt: >-
      שתי מסילות מתכת אנכיות, ארוכות וחלקות, נמצאות במישור הדף, במרחק $L = 0.40\,\text{m}$ זו מזו. בקצה העליון הן
      מחוברות דרך נגד $R = 0.80\,\Omega$. מוט מתכת אופקי שמסתו $m = 20\,\text{g}$ מונח על המסילות, נוגע בהן כל הזמן
      ויכול להחליק לאורכן בלי חיכוך. בכל האזור יש שדה מגנטי אחיד $B = 0.50\,\text{T}$ לתוך הדף (⊗), ניצב למישור
      המסילות. משחררים את המוט ממנוחה. הזניחו את ההתנגדות של המוט ושל המסילות ואת התנגדות האוויר, והשתמשו
      ב-$g = 10\,\text{m/s}^2$.
    diagramAlt: >-
      שתי מסילות אנכיות, משמאל ומימין, ובראשן נגד R שמחבר ביניהן. מוט אופקי מונח על המסילות באמצע הגובה, וחץ g מצביע
      כלפי מטה. בכל השטח שבין המסילות ומסביבן סימני ⊗, שדה לתוך הדף. המרחק בין המסילות מסומן L.
    diagram: |
      <svg viewBox="0 0 420 260" width="420" height="260" font-size="15" aria-hidden="true">
        <g stroke="currentColor" stroke-width="2" fill="none">
          <line x1="120" y1="30" x2="120" y2="250"/>
          <line x1="300" y1="30" x2="300" y2="250"/>
          <polyline points="120,30 180,30"/>
          <polyline points="240,30 300,30"/>
          <rect x="180" y="22" width="60" height="16"/>
          <line x1="120" y1="232" x2="300" y2="232" stroke-width="1" stroke-dasharray="4 3"/>
        </g>
        <rect x="104" y="140" width="212" height="9" rx="2" fill="var(--equip)" stroke="currentColor" stroke-width="1.5"/>
        <g fill="var(--bfield)" font-size="17">
          <text x="150" y="85">⊗</text><text x="200" y="85">⊗</text><text x="250" y="85">⊗</text>
          <text x="150" y="200">⊗</text><text x="200" y="200">⊗</text><text x="250" y="200">⊗</text>
          <text x="40" y="120">⊗</text><text x="350" y="120">⊗</text>
        </g>
        <line x1="370" y1="160" x2="370" y2="215" stroke="currentColor" stroke-width="2"/>
        <polygon points="364,212 370,224 376,212" fill="currentColor"/>
        <text x="380" y="195" fill="currentColor">g</text>
        <text x="210" y="16" text-anchor="middle" fill="currentColor">R</text>
        <text x="210" y="131" text-anchor="middle" fill="currentColor">m</text>
        <text x="210" y="250" text-anchor="middle" fill="currentColor">L</text>
        <text x="350" y="60" fill="var(--bfield)">B</text>
      </svg>
    parts:
      - label: א
        type: vector
        points: 5
        level: basic
        qualitative: true
        objectives: [OBJ-5.4-2, OBJ-5.3-1]
        allowOutIn: true
        prompt: המוט נופל. מה כיוון הזרם המושרה במוט?
        answer: e
        correctFeedback: >-
          נכון. בכוח לורנץ: המטענים החיוביים שבמוט נעים איתו כלפי מטה, בשדה לתוך הדף, ובכלל כף יד ימין (האצבעות לתוך
          הדף, האגודל למטה) הכוח עליהם ימינה. ובחוק לנץ: המעגל שמעל המוט גדל, השטף ⊗ דרכו גדל, השדה המושרה ⊙
          מתנגד לגידול, וזרם ⊙ בתוך המעגל זורם נגד כיוון השעון, כלומר ימינה בצלע התחתונה, במוט.
        wrong:
          - dir: w
            feedback: >-
              זה הזרם שהיה יוצר שדה ⊗, באותו כיוון כמו השטף שגדל, כלומר זרם שמגדיל את השינוי. הזרם המושרה מתנגד
              לשינוי: השטף ⊗ גדל, ולכן השדה המושרה ⊙, והזרם במוט ימינה.
            misconception: MC-faraday-sign-follows-flux
          - dir: zero
            feedback: >-
              השדה אחיד וקבוע, אבל המעגל שמעל המוט גדל, ולכן השטף דרכו משתנה. וגם בלי השטף: המטענים במוט נעים בשדה,
              וכוח לורנץ דוחף אותם לאורך המוט.
            misconception: MC-rail-uniform-field-no-emf
          - dir: in
            feedback: 'הזרם זורם לאורך המוט, במישור הדף. כוח לורנץ על המטענים ניצב לשדה, ולכן הוא לא יכול להיות לתוך הדף.'
            misconception: MC-magnetic-force-along-field
        wrongFeedback: 'השתמשו בכלל כף יד ימין על המטענים החיוביים שבמוט, או בחוק לנץ על המעגל שמעל המוט, ובדקו שהשניים מסכימים.'

      - label: ב
        type: mc
        points: 6
        level: mid
        qualitative: true
        objectives: [OBJ-5.5-3, OBJ-5.4-3]
        prompt: 'איזה מהתיאורים הבאים מתאר את הגרף של מהירות המוט כתלות בזמן, $v(t)$, מרגע השחרור? קבעו ונמקו.'
        choices:
          - text: 'הגרף מתחיל באפס בשיפוע $g$, השיפוע שלו קטן בהדרגה, והוא מתקרב לקו אופקי, המהירות הסופית.'
            correct: true
            feedback: >-
              נכון. ברגע השחרור $v = 0$, אין כא"מ ואין זרם, ולכן $a = g$. ככל שהמהירות גדלה, הכוח הבולם
              $B^2L^2v/R$ גדל והתאוצה קטנה, עד שהבלימה משתווה למשקל והמהירות מתייצבת. כמו צנחן.
          - text: 'קו ישר מהראשית בשיפוע $g$, כמו בנפילה חופשית.'
            feedback: >-
              זה נכון רק לרגע הראשון. ברגע שהמוט נע, נוצר זרם, ועל המוט פועל כוח מגנטי כלפי מעלה שגדל עם המהירות.
              התאוצה קטנה, והגרף מתעקם לקו אופקי.
            misconception: MC-rail-falls-like-free-fall
          - text: 'הגרף עולה לשיא, ואחר כך יורד חזרה לאפס: הבלם עוצר את המוט.'
            feedback: >-
              הכוח הבולם קיים רק כשהמוט נע, והוא גדל עם המהירות. כשהוא משתווה למשקל הכוח השקול אפס, והמהירות
              מפסיקה לגדול, אבל לא קטנה. הבלם מגביל את המהירות, ולא עוצר.
            misconception: MC-eddy-brake-stops-completely
          - text: 'קו ישר בשיפוע קטן מ-$g$ כבר מהרגע הראשון, כי השדה בולם את המוט מההתחלה.'
            feedback: >-
              שדה בלי שינוי בשטף לא משרה כלום. ברגע השחרור המוט עומד, השטף לא משתנה, אין זרם ואין כוח מגנטי, ולכן
              התאוצה ההתחלתית היא $g$. והבלימה גדלה עם המהירות, ולכן הגרף לא ישר.
            misconception: MC-faraday-field-not-change

      - label: ג
        type: numeric
        points: 6
        level: mid
        objectives: [OBJ-5.5-3]
        prompt: מה המהירות הסופית של המוט?
        answer: 4.0
        unit: m/s
        correctFeedback: >-
          נכון. במהירות הסופית הכוח הבולם שווה למשקל: $\dfrac{B^2L^2v_T}{R} = mg$, ולכן
          $v_T = \dfrac{mgR}{B^2L^2} = \dfrac{0.020\cdot10\cdot0.80}{0.50^2\cdot0.40^2} = 4.0\,\text{m/s}$.
        wrongFeedback: >-
          כתבו את הכוח הבולם, $F_B = BIL$ עם $I = BLv/R$, והשוו אותו למשקל. זכרו להמיר גרמים לקילוגרמים.
        commonWrong:
          - value: 2.0
            feedback: 'לא העליתם את $B$ בריבוע. $B$ נכנס פעמיים: פעם בכא"מ $BLv$, ופעם בכוח $BIL$.'
          - value: 1.6
            feedback: 'לא העליתם את $L$ בריבוע. גם $L$ נכנס פעמיים: בכא"מ ובכוח על המוט.'
          - value: 5.0
            feedback: >-
              שכחתם את $R$: $mg/(B^2L^2) = 5.0$. הזרם הוא $I = BLv/R$, ולכן $R$ מופיע במונה של המהירות הסופית:
              התנגדות גדולה יותר, זרם קטן יותר, ובלימה חלשה יותר.
          - value: 0.8
            feedback: 'השתמשתם ב-$BL$ במקום ב-$B^2L^2$: השוויתם את המשקל לכא"מ ולא לכוח הבולם. הכוח הוא $BIL = B^2L^2v/R$.'

      - label: ד
        type: mc
        points: 6
        level: bagrut
        qualitative: true
        objectives: [OBJ-5.5-3, OBJ-5.5-1]
        prompt: 'מחליפים את המוט במוט שמסתו $40\,\text{g}$, באותו אורך ובאותה התנגדות. מה תהיה המהירות הסופית? קבעו ונמקו.'
        choices:
          - text: '$8.0\,\text{m/s}$: המשקל גדל פי 2, והכוח הבולם באותה מהירות לא השתנה, ולכן צריך מהירות כפולה כדי לאזן אותו.'
            correct: true
            feedback: >-
              נכון. $v_T = mgR/(B^2L^2)$, ביחס ישר למסה. הבלימה, $B^2L^2v/R$, לא תלויה במסה, אבל הכוח המניע, המשקל,
              כן. כאן, כשהכובד מניע את המוט, המסה משנה את המהירות הסופית.
          - text: '$4.0\,\text{m/s}$: כמו בנפילה חופשית, מהירות הנפילה לא תלויה במסה.'
            feedback: >-
              בנפילה חופשית התאוצה לא תלויה במסה, כי הכוח היחיד, המשקל, גדל יחד עם המסה. כאן יש גם כוח בולם, שלא תלוי
              במסה. במהירות הסופית המשקל, $mg$, מאוזן על ידי $B^2L^2v_T/R$, ולכן $v_T$ גדלה עם $m$.
            misconception: MC-rail-mass-never-matters
          - text: 'למוט הכבד אין מהירות סופית: הבלם לא מספיק כדי לעצור את התאוצה שלו, והוא ממשיך להאיץ.'
            feedback: >-
              הכוח הבולם גדל עם המהירות בלי גבול, ולכן לכל משקל יש מהירות שבה הבלימה משתווה לו. המוט הכבד מגיע
              למהירות סופית גדולה יותר, $8.0\,\text{m/s}$, ומתקרב אליה בלי לעבור אותה.
            misconception: MC-rail-rod-speeds-up-forever

      - label: ה
        type: open
        points: 10
        level: bagrut
        objectives: [OBJ-5.5-4, OBJ-5.4-4, OBJ-5.4-2]
        prompt: >-
          חוזרים למוט שמסתו $20\,\text{g}$.

          (1) חשבו את הזרם במעגל כשהמוט נע במהירות הסופית, והראו שההספק של כוח הכובד שווה אז להספק שמתפתח בנגד.

          (2) מודדים שאחרי נפילה של $h = 2.0\,\text{m}$ מרגע השחרור מהירות המוט היא $3.5\,\text{m/s}$. כמה חום התפתח
          בנגד עד אז? מי עשה את העבודה שהפכה לחום?
        hints:
          - 'במהירות הסופית הכוח השקול אפס: $BIL = mg$. בחלק (2) השתמשו בשימור אנרגיה: האנרגיה הפוטנציאלית שאבדה הולכת לאנרגיה קינטית ולחום.'
        solution:
          - { kind: formula, text: '$I = \dfrac{\varepsilon}{R} = \dfrac{BLv_T}{R}$; ההספק של הכובד $P_g = mg\,v_T$, וההספק בנגד $P_R = I^2R$.' }
          - { kind: substitution, text: '$I = \dfrac{0.50\cdot0.40\cdot4.0}{0.80} = 1.0\,\text{A}$. בדיקה: $BIL = 0.50\cdot1.0\cdot0.40 = 0.20\,\text{N} = mg$.' }
          - { kind: substitution, text: '$P_g = 0.020\cdot10\cdot4.0 = 0.80\,\text{W}$, ו-$P_R = 1.0^2\cdot0.80 = 0.80\,\text{W}$: שווים.' }
          - { kind: formula, text: 'שימור אנרגיה בדרך למהירות הסופית: $mgh = \tfrac12 mv^2 + Q$.' }
          - { kind: manipulation, text: '$Q = mgh - \tfrac12 mv^2$.' }
          - { kind: substitution, text: '$Q = 0.020\cdot10\cdot2.0 - \tfrac12\cdot0.020\cdot3.5^2 = 0.40 - 0.12 \approx 0.28\,\text{J}$.' }
          - { kind: result, text: '(1) $I = 1.0\,\text{A}$, ו-$P_g = P_R = 0.80\,\text{W}$: במהירות הסופית כל העבודה של הכובד הופכת לחום. (2) כ-$0.28\,\text{J}$. את העבודה עשה כוח הכובד; הכוח המגנטי רק העביר אותה, דרך הזרם, אל הנגד, והשדה המגנטי לא נתן אנרגיה משלו.' }
        rubric:
          - text: 'חישבתי את הזרם במהירות הסופית, $1.0\,\text{A}$ (מ-$BLv_T/R$, או מ-$BIL = mg$).'
          - text: 'חישבתי שני הספקים, $mgv_T$ ו-$I^2R$, וקיבלתי $0.80\,\text{W}$ בשניהם.'
          - text: 'כתבתי שימור אנרגיה עם שלושה איברים: האנרגיה הפוטנציאלית שאבדה שווה לאנרגיה הקינטית ועוד החום.'
          - text: 'קיבלתי חום של כ-$0.28\,\text{J}$, עם מסה בקילוגרמים.'
          - text: 'קבעתי שאת העבודה עושה הכובד, ולא השדה המגנטי או המגנט.'

  # ------------------------------------------------------------ 2: a coil pushed through a strip of field
  - id: Q-5-bagrut-2
    type: bagrut
    title: מסגרת שעוברת דרך רצועת שדה
    prompt: >-
      מסגרת מלבנית של $N = 20$ כריכות מונחת במישור הדף. הצלע שלה שניצבת לכיוון התנועה היא $h = 0.10\,\text{m}$,
      והצלע שלאורך התנועה היא $w = 0.20\,\text{m}$. ההתנגדות הכוללת של המסגרת $R = 2.0\,\Omega$. דוחפים את המסגרת
      ימינה במהירות קבועה $v = 0.50\,\text{m/s}$ דרך רצועה ברוחב $0.50\,\text{m}$, שבה שדה מגנטי אחיד
      $B = 0.40\,\text{T}$ לתוך הדף (⊗). מחוץ לרצועה אין שדה. ברגע $t = 0$ הצלע הימנית של המסגרת מגיעה לגבול
      השמאלי של הרצועה. הזניחו חיכוך.
    diagramAlt: >-
      משמאל, מסגרת מלבנית שוכבת ברוחב w ובגובה h, והצלע הימנית שלה נוגעת בקו הגבול השמאלי של רצועה. חץ v ימינה.
      הרצועה, ברוחב 0.50 מטר, מלאה בסימני ⊗, שדה לתוך הדף. מחוץ לה אין שדה.
    diagram: |
      <svg viewBox="0 0 520 205" width="520" height="205" font-size="15" aria-hidden="true">
        <rect x="230" y="20" width="250" height="150" fill="var(--bfield-glow)" stroke="var(--bfield)" stroke-width="1.5" stroke-dasharray="5 3"/>
        <g fill="var(--bfield)" font-size="17">
          <text x="255" y="55">⊗</text><text x="315" y="55">⊗</text><text x="375" y="55">⊗</text><text x="435" y="55">⊗</text>
          <text x="255" y="105">⊗</text><text x="315" y="105">⊗</text><text x="375" y="105">⊗</text><text x="435" y="105">⊗</text>
          <text x="255" y="155">⊗</text><text x="315" y="155">⊗</text><text x="375" y="155">⊗</text><text x="435" y="155">⊗</text>
        </g>
        <rect x="130" y="70" width="100" height="50" fill="none" stroke="currentColor" stroke-width="3"/>
        <line x1="140" y1="95" x2="200" y2="95" stroke="currentColor" stroke-width="2"/>
        <polygon points="198,89 210,95 198,101" fill="currentColor"/>
        <text x="160" y="88" fill="currentColor">v</text>
        <text x="180" y="140" text-anchor="middle" fill="currentColor">w</text>
        <text x="118" y="100" text-anchor="end" fill="currentColor">h</text>
        <text x="500" y="40" text-anchor="middle" fill="var(--bfield)">B</text>
        <line x1="230" y1="182" x2="480" y2="182" stroke="currentColor" stroke-width="1"/>
        <line x1="230" y1="176" x2="230" y2="188" stroke="currentColor"/><line x1="480" y1="176" x2="480" y2="188" stroke="currentColor"/>
        <text x="355" y="200" text-anchor="middle" fill="currentColor">0.50 m</text>
      </svg>
    parts:
      - label: א
        type: numeric
        points: 6
        level: basic
        objectives: [OBJ-5.6-2, OBJ-5.2-2]
        prompt: מה גודל הכא"מ המושרה במסגרת בזמן שהיא נכנסת לשדה?
        answer: 0.40
        unit: V
        correctFeedback: >-
          נכון. בכל שנייה נכנס לשדה שטח $hv$, ולכן $|\varepsilon| = N\dfrac{\Delta\Phi}{\Delta t} = NBhv =
          20\cdot0.40\cdot0.10\cdot0.50 = 0.40\,\text{V}$.
        wrongFeedback: 'חשבו כמה שטח נכנס לשדה בכל שנייה, ומזה את קצב השינוי של השטף דרך כריכה אחת. אל תשכחו את $N$.'
        commonWrong:
          - value: 0.020
