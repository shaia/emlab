    title: סליל קטן בתוך סליל שהזרם בו עולה
    prompt: >-
      תלמידים רצו למצוא את צפיפות הכריכות $n$ של סליל ארוך. במרכז הסליל הארוך, בתוכו, הם הניחו סליל קטן של
      $N = 500$ כריכות, ששטח כל כריכה שלו $A = 10\,\text{cm}^2$. הציר של הסליל הקטן מונח על הציר של הסליל הארוך,
      וקצות הסליל הקטן מחוברים למד מתח ממוחשב, שמודד את הכא"מ המושרה בו. הסליל הארוך ארוך בהרבה מרוחבו, ולכן
      השדה בתוכו אחיד, $B = \mu_0 nI$, וכיוון הזרם בכריכות שלו הוא כזה שהשדה בתוכו מצביע ימינה, כמתואר בתרשים.

      בכל הרצה מעלים את הזרם בסליל הארוך מאפס בקצב קבוע, $\dfrac{\Delta I}{\Delta t}$, ובזמן העלייה מד המתח מראה
      כא"מ קבוע $\varepsilon$. התלמידים קיבלו את התוצאות שבטבלה:
