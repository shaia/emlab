      - label: ה
        type: open
        points: 10
        level: bagrut
        objectives: [OBJ-5.6-4, OBJ-5.6-3]
        prompt: >-
          (1) חשבו את המטען שעובר במסגרת בזמן הכניסה, בשתי דרכים: מהשטח מתחת לגרף הזרם, ומהשינוי בשטף. מה המטען נטו
          שעובר במסגרת במעבר השלם?

          (2) מה ישתנה אם ידחפו את המסגרת דרך הרצועה במהירות כפולה, $1.0\,\text{m/s}$? קבעו ונמקו: מה יהיה המטען
          שעובר בזמן הכניסה, ומה תהיה העבודה של הדחיפה בזמן הכניסה, לעומת המהירות $0.50\,\text{m/s}$?
        hints:
          - 'בזמן הכניסה הזרם קבוע, ולכן השטח מתחת לגרף הוא מלבן. העבודה של הדחיפה היא הכוח כפול הדרך שבה הוא פועל, $w$.'
        solution:
          - { kind: formula, text: 'המטען הוא השטח מתחת לגרף הזרם, $Q = I\,\Delta t$, וגם $Q = \dfrac{N\,|\Delta\Phi|}{R}$.' }
          - { kind: substitution, text: 'מהגרף: $Q = 0.20\cdot0.4 = 0.080\,\text{C}$. מהשטף: $\Delta\Phi = Bhw = 0.40\cdot0.10\cdot0.20 = 8.0\cdot10^{-3}\,\text{Wb}$, ו-$Q = \dfrac{20\cdot8.0\cdot10^{-3}}{2.0} = 0.080\,\text{C}$.' }
          - { kind: manipulation, text: 'במעבר השלם השטף חוזר לאפס, $\Delta\Phi = 0$: בכניסה עוברים $0.080\,\text{C}$ נגד כיוון השעון, וביציאה $0.080\,\text{C}$ בכיוון השעון.' }
          - { kind: formula, text: 'הדחיפה $F = \dfrac{N^2B^2h^2v}{R}$ פועלת לאורך הדרך $w$, ולכן $W = Fw$.' }
          - { kind: substitution, text: 'ב-$0.50\,\text{m/s}$: $W = 0.16\cdot0.20 = 0.032\,\text{J}$. ב-$1.0\,\text{m/s}$ הכוח כפול, $0.32\,\text{N}$, באותה דרך: $W = 0.32\cdot0.20 = 0.064\,\text{J}$.' }
          - { kind: result, text: '(1) $0.080\,\text{C}$ בכניסה, בשתי הדרכים; נטו במעבר השלם אפס. (2) המטען לא משתנה, $0.080\,\text{C}$, כי הוא תלוי רק בשינוי השטף: הזרם כפול, $0.40\,\text{A}$, בחצי זמן, $0.2\,\text{s}$. העבודה של הדחיפה גדלה פי 2, ל-$0.064\,\text{J}$: הכוח כפול לאורך אותה דרך, וכל העבודה הופכת לחום במסגרת.' }
        rubric:
          - text: 'חישבתי את המטען מהשטח, $0.20\,\text{A}\cdot0.4\,\text{s} = 0.080\,\text{C}$.'
          - text: 'חישבתי את השינוי בשטף דרך כריכה, $8.0\cdot10^{-3}\,\text{Wb}$, וקיבלתי מ-$N|\Delta\Phi|/R$ את אותו מטען.'
          - text: 'קבעתי שהמטען נטו במעבר השלם אפס, כי השטף חוזר לערכו ההתחלתי.'
          - text: 'נימקתי שבמהירות כפולה המטען לא משתנה: זרם כפול בחצי זמן.'
          - text: 'קבעתי שהעבודה של הדחיפה בכניסה גדלה פי 2, ל-$0.064\,\text{J}$, כי הכוח פרופורציוני למהירות והדרך אותה דרך.'

