        points: 6
        level: mid
        objectives: [OBJ-5.8-2]
        prompt: מה ערך השיא של הכא"מ בסליל?
        answer: 157
        unit: V
        correctFeedback: >-
          נכון. $A = 0.10\cdot0.20 = 0.020\,\text{m}^2$, $\omega = 2\pi f = 2\pi\cdot50 \approx 314\,\text{rad/s}$, ו-
          $\varepsilon_0 = NBA\omega = 100\cdot0.25\cdot0.020\cdot314 \approx 157\,\text{V}$.
        wrongFeedback: 'ערך השיא הוא $\varepsilon_0 = NBA\omega$. המירו את המידות למטרים, ואת מספר הסיבובים בשנייה למהירות זוויתית.'
        commonWrong:
          - value: 25
            feedback: 'הצבתם את התדירות, $f = 50\,\text{Hz}$, במקום המהירות הזוויתית. $\omega = 2\pi f \approx 314\,\text{rad/s}$.'
          - value: 1.57
            feedback: 'שכחתם את $N$. בכל אחת מ-100 הכריכות נוצר אותו כא"מ, והן מחוברות בטור.'
            misconception: MC-faraday-ignore-turns
          - value: 0.5
            feedback: 'זה $NBA = 0.50\,\text{Wb}$, השטף המרבי כפול מספר הכריכות, ולא כא"מ. הכא"מ תלוי גם בקצב: כפלו ב-$\omega$.'
            misconception: MC-generator-faster-same-peak

