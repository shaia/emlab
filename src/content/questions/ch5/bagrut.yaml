        answer: 0.16
        unit: N
        correctFeedback: >-
          נכון. $I = \dfrac{0.40}{2.0} = 0.20\,\text{A}$. על הצלע הימנית, באורך $h$, בכל אחת מ-$N$ הכריכות, פועל כוח
          שמאלה, נגד התנועה: $F = NBIh = 20\cdot0.40\cdot0.20\cdot0.10 = 0.16\,\text{N}$. הדחיפה צריכה להיות שווה לו,
          ימינה.
        wrongFeedback: 'מצאו את הזרם, $I = \varepsilon/R$, ואחר כך את הכוח המגנטי על הצלע שבתוך השדה, בכל $N$ הכריכות.'
