      - label: ו
        type: open
        points: 5
        level: bagrut
        qualitative: true
        standalone: false
        objectives: [OBJ-5.1-1, OBJ-5.1-2, OBJ-4.3-3]
        prompt: >-
          מה יהיה השיפוע של קו המגמה בכל אחד מהשינויים הבאים, לעומת השיפוע שמצאתם בסעיף ב? קבעו ונמקו.

          (1) מסובבים את הסליל הקטן, בלי להוציא אותו מהסליל הארוך, כך שהציר שלו יוצר זווית של $60^\circ$ עם הציר של
          הסליל הארוך.

          (2) במקום הסליל הקטן כורכים סליל של 500 כריכות מבחוץ על הסליל הארוך, באמצע אורכו. שטח כל כריכה שלו
          $50\,\text{cm}^2$, ושטח החתך של הסליל הארוך $20\,\text{cm}^2$.
        hints:
          - 'השיפוע הוא $N$ כפול השינוי בשטף דרך כריכה אחת, לכל אמפר של שינוי בזרם. מה קורה לשטף כשמטים כריכה?'
          - 'בחלק (2): איפה נמצא השדה של סליל ארוך? אילו קווי שדה עוברים דרך כריכה שמקיפה אותו מבחוץ?'
        solution:
          - { kind: formula, text: '$|\varepsilon| = N\dfrac{|\Delta\Phi|}{\Delta t}$, ו-$\Phi = BA\cos\theta$, כש-$\theta$ היא הזווית בין השדה לאנך לכריכה.' }
          - { kind: manipulation, text: '(1) האנך לכריכות של הסליל הקטן נמצא על הציר שלו, ולכן $\theta = 60^\circ$ ו-$\Phi = \mu_0 nIA\cos60^\circ$: רק חצי מהקווים שעברו קודם עוברים עכשיו דרך כל כריכה.' }
          - { kind: substitution, text: '$k_1 = 1.26\cdot\cos60^\circ \approx 0.63\,\text{mV}\cdot\text{s/A}$.' }
          - { kind: manipulation, text: '(2) השדה של סליל ארוך נמצא כמעט כולו בתוכו, ומחוצה לו הוא כמעט אפס (שיעור 4.3). לכן דרך כריכה ששטחה $50\,\text{cm}^2$ עוברים רק הקווים שבתוך החתך של הסליל הארוך: $\Phi = \mu_0 nI\cdot20\,\text{cm}^2$, ולא $\mu_0 nI\cdot50\,\text{cm}^2$.' }
          - { kind: substitution, text: 'אותו $N$, ושטח אפקטיבי גדול פי 2: $k_2 = 1.26\cdot\dfrac{20}{10} \approx 2.5\,\text{mV}\cdot\text{s/A}$, ולא $1.26\cdot5 = 6.3\,\text{mV}\cdot\text{s/A}$.' }
          - { kind: result, text: '(1) השיפוע קטן פי 2, לכ-$0.63\,\text{mV}\cdot\text{s/A}$. (2) השיפוע גדל פי 2, לכ-$2.5\,\text{mV}\cdot\text{s/A}$: את השטף קובע שטח החתך של הסליל הארוך, $20\,\text{cm}^2$, ולא השטח של הכריכה החיצונית.' }
        rubric:
          - text: 'נימקתי שבסיבוב השטף קטן פי $\cos\theta$, עם $\theta$ הזווית בין השדה לאנך לכריכה, וקיבלתי חצי מהשיפוע.'
          - text: 'נימקתי שמחוץ לסליל ארוך השדה כמעט אפס, ולכן השטח שקובע בחלק (2) הוא שטח החתך של הסליל הארוך.'
          - text: 'קבעתי שבחלק (2) השיפוע גדל פי 2, לכ-$2.5\,\text{mV}\cdot\text{s/A}$, ולא פי 5.'
