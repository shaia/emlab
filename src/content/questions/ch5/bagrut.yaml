            feedback: 'זה הממוצע של הכא"מ עצמו על מחזור. הערך האפקטיבי הוא שורש של ממוצע הריבוע, והוא לא אפס: גוף החימום מתחמם בשני כיווני הזרם.'
            misconception: MC-ac-mean-zero-no-energy

      - label: ד
        type: mc
        points: 7
        level: bagrut
        qualitative: true
        objectives: [OBJ-5.7-1, OBJ-5.7-4, OBJ-5.9-2]
        prompt: >-
          בגנרטור של תחנת כוח הסלילים קבועים במקום, ובתוכם מסתובב אלקטרומגנט, כך שהשדה המגנטי דרך הסלילים משתנה. המטענים
          בסלילים לא זזים עם שום חלק מסתובב. מה דוחף אותם לאורך התיל, ואיזה מארבעת החוקים של מקסוול מתאר את זה? קבעו
          ונמקו.
        choices:
          - text: 'שדה חשמלי מושרה, שנוצר מהשינוי של השדה המגנטי וקוויו סגורים. את זה מתאר חוק פאראדיי, $\oint \vec E\cdot d\vec l = -d\Phi_B/dt$.'
            correct: true
            feedback: >-
              נכון. על מטען במנוחה אין כוח מגנטי, כי $v = 0$. מה שדוחף אותו הוא שדה חשמלי מושרה, שקיים בכל מקום שבו
              השדה המגנטי משתנה, גם בלי מטענים. אלה שני המנגנונים של אותו חוק: בסליל מסתובב כוח לורנץ על התיל שנע, וכאן
              שדה מושרה בתיל שעומד. בשניהם $\varepsilon = -N\,\Delta\Phi/\Delta t$.
          - text: 'הכוח המגנטי $qvB$ על המטענים שבסליל. את זה מתאר חוק אמפר.'
            feedback: >-
              הכוח המגנטי פועל רק על מטען שנע, וכאן המטענים בסליל עומדים: $v = 0$, ולכן $qvB = 0$. משהו אחר דוחף אותם:
              שדה חשמלי מושרה. וחוק אמפר מדבר על השדה המגנטי שזרם יוצר, לא על הכוח על מטענים.
            misconception: MC-induced-lorentz-at-rest
          - text: 'שדה חשמלי של מטענים שמצטברים על האלקטרומגנט כשהוא מסתובב. את זה מתאר חוק גאוס.'
            feedback: >-
              השדה המושרה לא נוצר ממטענים, ולכן הקווים שלו לא מתחילים ולא נגמרים: הם סגורים, ומקיפים את השטף שמשתנה.
              שדה של מטענים הוא שדה משמר, והעבודה שלו סביב לולאה סגורה אפס, ולכן הוא לא היה יכול להניע זרם סביב הסליל.
            misconception: MC-induced-field-from-charges

      - label: ה
        type: open
        points: 10
        level: bagrut
        objectives: [OBJ-5.8-1, OBJ-5.8-4, OBJ-5.8-3, OBJ-5.8-2]
        prompt: >-
          חוזרים לגנרטור עם הסליל המסתובב.

          (1) כתבו את הכא"מ כפונקציה של הזמן, ושרטטו את הגרף שלו במשך מחזור אחד, מ-$t = 0$. סמנו על הצירים את זמן
          המחזור ואת ערך השיא.

          (2) חשבו את ההספק הממוצע בגוף החימום. כמה עבודה צריך מי שמסובב את הסליל להשקיע בדקה אחת? (הזניחו חיכוך.)
          למה צריך להשקיע עבודה, אם הסליל מסתובב במהירות קבועה?

          (3) מה ישתנה אם הסליל יסתובב $100$ פעמים בשנייה? קבעו את ערך השיא, את זמן המחזור ואת ההספק הממוצע.
        hints:
          - 'ב-$t = 0$ השטף בשיא, ולכן הכא"מ מתחיל באפס: $\varepsilon = \varepsilon_0\sin\omega t$. ההספק הממוצע של זרם חילופין בנגד הוא חצי מההספק בשיא.'
        solution:
          - { kind: formula, text: '$\Phi = BA\cos\omega t$, ולכן $\varepsilon = NBA\omega\sin\omega t = \varepsilon_0\sin\omega t$, עם $T = \dfrac{1}{f}$.' }
          - { kind: substitution, text: '$\varepsilon = 157\sin(314t)\,\text{V}$, ו-$T = \dfrac{1}{50} = 0.020\,\text{s}$. הגרף: אפס ב-$t = 0$, שיא $+157\,\text{V}$ ב-$T/4 = 0.005\,\text{s}$, אפס ב-$0.010\,\text{s}$, שפל $-157\,\text{V}$ ב-$0.015\,\text{s}$, ואפס ב-$0.020\,\text{s}$.' }
          - { kind: formula, text: '$\bar P = \dfrac{\varepsilon_0^2}{2R}$, והעבודה בזמן $t$ היא $W = \bar P\,t$.' }
          - { kind: substitution, text: '$\bar P = \dfrac{157^2}{2\cdot50} \approx 247\,\text{W}$, ובדקה: $W = 247\cdot60 \approx 1.48\cdot10^{4}\,\text{J}$.' }
          - { kind: manipulation, text: 'למה צריך עבודה: בסליל זורם זרם מושרה, והשדה מפעיל עליו מומנט, $NBIA\sin\theta$, כמו על המנוע של שיעור 4.10. לפי חוק לנץ המומנט הזה נגד הסיבוב, ולכן מי שמסובב צריך להפעיל מומנט שווה ולהשקיע הספק $\tau\omega = \varepsilon I$, בדיוק ההספק החשמלי.' }
          - { kind: manipulation, text: 'ב-100 סיבובים בשנייה $\omega$ כפולה: $\varepsilon_0 = NBA\omega$ כפול, $T = 1/f$ חצי, ו-$\bar P \propto \varepsilon_0^2$ גדל פי 4.' }
          - { kind: result, text: '(1) $\varepsilon = 157\sin(314t)\,\text{V}$, $T = 0.020\,\text{s}$, גרף של סינוס שמתחיל באפס. (2) $\bar P \approx 247\,\text{W}$, ועבודה של כ-$1.5\cdot10^{4}\,\text{J}$ בדקה, כי הזרם המושרה יוצר מומנט נגד הסיבוב. (3) $\varepsilon_0 \approx 314\,\text{V}$, $T = 0.010\,\text{s}$, ו-$\bar P \approx 987\,\text{W}$: מסובבים קשה יותר.' }
        rubric:
          - text: 'כתבתי $\varepsilon = \varepsilon_0\sin\omega t$ (לא $\cos$), כי ב-$t = 0$ השטף בשיא והכא"מ אפס.'
          - text: 'שרטטתי סינוס עם שיא $157\,\text{V}$ וזמן מחזור $0.020\,\text{s}$, ואפסים ב-$0$, $T/2$ ו-$T$.'
          - text: 'חישבתי הספק ממוצע של כ-$247\,\text{W}$, עם $\varepsilon_0^2/(2R)$ ולא $\varepsilon_0^2/R$.'
          - text: 'חישבתי עבודה של כ-$1.5\cdot10^{4}\,\text{J}$ בדקה, ונימקתי בחוק לנץ: המומנט על הזרם המושרה מתנגד לסיבוב.'
          - text: 'קבעתי שבסיבוב מהיר פי 2 השיא כפול, זמן המחזור חצי וההספק הממוצע פי 4.'

