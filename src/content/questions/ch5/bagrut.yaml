      - label: א
        type: mc
        points: 5
        level: basic
        qualitative: true
        objectives: [OBJ-5.8-1]
        prompt: 'ברגע $t = 0$, כשמישור הסליל ניצב לשדה, מה נכון לגבי השטף דרך כריכה ולגבי הכא"מ בסליל?'
        choices:
          - text: 'השטף הכי גדול, והכא"מ אפס.'
            correct: true
            feedback: >-
              נכון. כשהמישור ניצב לשדה, האנך לכריכה מקביל לשדה, ו-$\Phi = BA$, הערך הגדול ביותר. אבל ברגע הזה גרף השטף
              שטוח: השיפוע אפס, ולכן $\varepsilon = 0$. הצלעות הארוכות נעות אז לאורך השדה, וכוח לורנץ לא דוחף מטענים לאורכן.
          - text: 'השטף הכי גדול, ולכן גם הכא"מ הכי גדול.'
            feedback: >-
              הכא"מ נקבע לפי **השיפוע** של גרף השטף, לא לפי הגובה שלו. בשיא השטף לרגע לא משתנה, והכא"מ אפס. הכא"מ הכי
              גדול רבע מחזור אחר כך, כשהשטף עובר באפס.
            misconception: MC-generator-emf-follows-flux
          - text: 'השטף אפס, כי השדה מקביל לאנך, והכא"מ הכי גדול.'
            feedback: >-
              הזווית ב-$\Phi = BA\cos\theta$ היא בין השדה **לאנך** לכריכה. כשהמישור ניצב לשדה, $\theta = 0$, והשטף הכי
              גדול. זה המצב שבו הכא"מ אפס; המצב שתיארתם, שטף אפס וכא"מ מרבי, הוא כשהמישור לאורך השדה.
            misconception: MC-magflux-angle-from-plane

      - label: ב
