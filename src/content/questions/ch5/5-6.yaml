      - text: 'אף כוח: הכא"מ במוט נוצר בלי שום כוח על המטענים.'
        feedback: 'כא"מ הוא עבודה ליחידת מטען, ובלי כוח אין עבודה. במוט את העבודה עושה כוח לורנץ.'

  - id: Q-5.6-combined
    type: numeric
    objectives: [OBJ-5.6-4]
    level: bagrut
    prompt: >-
      מוט מוליך באורך $10\,\text{cm}$ סוגר מלבן עם שתי מסילות שמחוברות בקצה אחד. ברגע מסוים המוט במרחק $20\,\text{cm}$ מהקצה המחובר, ונע הלאה ממנו במהירות $3\,\text{m/s}$. השדה המגנטי אחיד, ניצב למלבן, ובאותו רגע הוא $0.4\,\text{T}$ וגדל בקצב $0.5\,\text{T/s}$. מה הכא"מ במלבן באותו רגע? ענו במיליוולט (mV).
    answer: 130
    unit: mV
    tolerance: 0.03
    correctFeedback: 'נכון. השטף משתנה משתי סיבות: $A\,\dfrac{\Delta B}{\Delta t} = 0.02\cdot0.5 = 0.01\,\text{V}$ מהשדה שגדל (שדה מושרה), ו-$BLv = 0.4\cdot0.1\cdot3 = 0.12\,\text{V}$ מהמוט שנע (כוח לורנץ). שתיהן מגדילות את השטף, והכא"מ $0.13\,\text{V}$.'
