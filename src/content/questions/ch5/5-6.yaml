    choices:
      - text: 'כוח לורנץ: המטענים נעים יחד עם המוט בשדה המגנטי, ועליהם פועל $qvB$ לאורך המוט.'
        correct: true
        feedback: 'נכון. השדה המגנטי לא משתנה, ולכן אין כאן שדה חשמלי מושרה. הכא"מ $BLv$ הוא העבודה של כוח לורנץ ליחידת מטען לאורך המוט.'
      - text: 'שדה חשמלי מושרה, כמו בכל כא"מ מושרה.'
