  - id: Q-5.6-which-mech
    type: twotier
    objectives: [OBJ-5.6-4]
    qualitative: true
    prompt: >-
      מקרבים מגנט אל טבעת נחושת שמונחת על השולחן ולא זזה. בטבעת נוצר זרם מושרה. מה מניע את המטענים בטבעת?
    choices:
      - text: 'שדה חשמלי מושרה: השדה המגנטי במקום שבו נמצאת הטבעת משתנה.'
        correct: true
        feedback: נכון.
      - text: 'כוח לורנץ, כי המגנט נע.'
        feedback: 'כוח לורנץ, $qvB$, תלוי במהירות של **המטען**, לא של המגנט. המטענים בטבעת במנוחה, ולכן הכוח המגנטי עליהם אפס.'
        misconception: MC-induced-lorentz-at-rest
      - text: 'אין זרם, כי הטבעת לא זזה.'
        feedback: 'הטבעת לא זזה, אבל השטף דרכה משתנה, ולפי חוק פאראדיי יש בה כא"מ.'
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'על מטען במנוחה פועל רק כוח חשמלי, והשדה המגנטי סביב הטבעת משתנה.'
        correct: true
        feedback: 'נכון. המגנט נע, אבל המטענים בטבעת עומדים, ולכן מה שמניע אותם הוא השדה החשמלי שנוצר מהשינוי של השדה המגנטי. הכא"מ נקבע בחוק פאראדיי, $\varepsilon = -\Delta\Phi/\Delta t$.'
      - text: 'המגנט מפעיל כוח מגנטי על כל מטען שבקרבתו.'
        feedback: 'מגנט מפעיל כוח מגנטי רק על מטען שנע. על המטענים בטבעת, במנוחה, הוא פועל רק דרך השדה החשמלי שהשינוי יוצר.'
        misconception: MC-induced-lorentz-at-rest
      - text: 'זרם מושרה נוצר רק במוליך שנע בשדה.'
        feedback: 'יש שתי דרכים לשנות את השטף: להזיז את המוליך, או לשנות את השדה. בשתיהן נוצר כא"מ.'

  - id: Q-5.6-rod-mech
