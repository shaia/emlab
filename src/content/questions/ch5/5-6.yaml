    commonWrong:
      - value: 120
        feedback: 'זה רק הכא"מ של המוט, $BLv$. גם השדה גדל, והשדה המושרה מוסיף $A\,\Delta B/\Delta t = 0.01\,\text{V}$.'
      - value: 10
        feedback: 'זו רק התרומה של השדה שגדל. גם המוט נע, וכוח לורנץ על המטענים בו מוסיף $BLv = 0.12\,\text{V}$.'
      - value: 110
        feedback: 'חיסרתם את התרומות. שתיהן מגדילות את השטף באותו כיוון, ולכן הן מתחברות.'
