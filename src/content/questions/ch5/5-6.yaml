# Lesson 5.6 question bank. Strings may hold $inline$ / $$display$$ TeX and **bold**; they are
# rendered at build time. YAML note: plain and single-quoted strings keep backslashes literally.
# Every number below was recomputed with src/physics/induction.ts (inducedFieldStrength,
# inducedCircleEmf, motionalEmf) and src/physics/inducedfield.ts; the script is recompute-5-6 in the
# session scratchpad. The data differ on purpose from figure 5.6א and the worked examples.

chapter: 5
questions:
  # ------------------------------------------------ OBJ-5.6-1: what pushes the charges, closed lines, direction
  - id: Q-5.6-what-pushes
    type: twotier
    objectives: [OBJ-5.6-1]
    qualitative: true
    prompt: >-
      לולאת תיל עומדת במקום בתוך ליבה של סליל ארוך, והשדה המגנטי בליבה גדל. בלולאה זורם זרם מושרה. איזה כוח מתחיל להניע את המטענים החופשיים בתיל, שהיו במנוחה?
    choices:
      - text: 'כוח חשמלי: השדה המגנטי המשתנה יוצר שדה חשמלי, והוא דוחף את המטענים לאורך התיל.'
        correct: true
        feedback: נכון.
      - text: 'הכוח המגנטי, כוח לורנץ, כי המטענים נמצאים בשדה מגנטי.'
        feedback: 'הכוח המגנטי על מטען הוא $qvB$. המטענים היו במנוחה, $v = 0$, ולכן הכוח המגנטי עליהם אפס.'
        misconception: MC-induced-lorentz-at-rest
      - text: 'כוח חשמלי של מטענים שהצטברו בקצה אחד של הלולאה.'
        feedback: 'ללולאה סגורה אין קצה, ומטענים במנוחה יוצרים שדה משמר, שהעבודה שלו סביב לולאה אפס: הוא לא יכול להניע זרם סביבה. השדה שמניע את הזרם נוצר מהשינוי של השדה המגנטי.'
        misconception: MC-induced-field-from-charges
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'על מטען במנוחה יכול לפעול רק כוח חשמלי, $qE$; אם הוא מתחיל לנוע, יש במקומו שדה חשמלי.'
        correct: true
        feedback: 'נכון. זה בדיוק הטיעון של השיעור: כוח מגנטי דורש מהירות, ולכן מה שהזיז את המטענים הוא שדה חשמלי מושרה.'
      - text: 'שדה מגנטי שמשתנה מפעיל כוח מגנטי גם על מטענים במנוחה.'
        feedback: 'הכוח המגנטי תמיד $qvB$, גם כשהשדה משתנה. שדה מגנטי משתנה פועל על מטענים במנוחה רק דרך השדה החשמלי שהוא יוצר.'
        misconception: MC-induced-lorentz-at-rest
      - text: 'המטענים בתיל תמיד נעים, ולכן תמיד פועל עליהם כוח מגנטי.'
        feedback: 'בלי זרם, התנועה של האלקטרונים בתיל אקראית, והכוחות המגנטיים עליהם מתקזזים. מה שמתחיל את הזרם הוא כוח שדוחף את כולם בכיוון אחד לאורך התיל: הכוח החשמלי.'
        misconception: MC-induced-lorentz-at-rest

  - id: Q-5.6-direction
    type: vector
    objectives: [OBJ-5.6-1]
    level: mid
    prompt: >-
      בליבה של סליל ארוך השדה המגנטי יוצא מהדף (⊙) וגדל. הנקודה P נמצאת מחוץ לליבה, ישר **מעל** הציר. מה כיוון השדה החשמלי המושרה ב-P?
    answer: e
    correctFeedback: 'נכון. שדה ⊙ שגדל: לפי חוק לנץ הזרם המושרה סביב הציר יוצר שדה ⊗, ולכן הוא זורם עם כיוון השעון, והשדה החשמלי מקיף את הציר עם כיוון השעון. מעל הציר, עם כיוון השעון זה ימינה.'
    wrong:
      - dir: w
        feedback: 'זה הכיוון של שדה שמקיף את הציר נגד כיוון השעון. הזרם המושרה מתנגד לגידול של השטף ⊙, ולכן השדה המגנטי שלו ⊗: זרם, ושדה חשמלי, עם כיוון השעון.'
      - dir: n
        feedback: 'השדה המושרה לא מצביע מהציר החוצה, כמו שדה של מטען. אין כאן מטען: הקווים שלו מעגלים סגורים סביב הציר, והשדה משיק להם.'
        misconception: MC-induced-field-from-charges
      - dir: zero
        feedback: 'מחוץ לליבה אין שדה מגנטי, אבל יש שדה חשמלי מושרה: הוא יורד כמו $1/r$, לא אפס.'
        misconception: MC-induced-field-zero-outside
    wrongFeedback: 'השדה המושרה מקיף את הציר. מצאו את כיוון ההקפה מחוק לנץ, ואז את הכיוון בנקודה שמעל הציר.'

  - id: Q-5.6-shrink-in
    type: mc
    objectives: [OBJ-5.6-1]
    qualitative: true
    prompt: >-
      בליבה של סליל ארוך השדה המגנטי נכנס לדף (⊗) ו**קטן**. איך מקיף השדה החשמלי המושרה את הציר?
    choices:
      - text: 'עם כיוון השעון.'
        correct: true
        feedback: 'נכון. השטף ⊗ קטן, והזרם המושרה מתנגד לירידה: הוא יוצר בתוך המעגל שדה ⊗, ולכן הוא עם כיוון השעון. זה אותו כיוון כמו של שדה ⊙ שגדל.'
      - text: 'נגד כיוון השעון, כי שדה ⊗ תמיד יוצר שדה מושרה נגד כיוון השעון.'
        feedback: 'הכיוון לא נקבע לפי כיוון השדה המגנטי, אלא לפי השינוי שלו. שדה ⊗ שגדל יוצר שדה מושרה נגד כיוון השעון, אבל כאן הוא קטן, והכיוון מתהפך.'
        misconception: MC-induced-direction-follows-b
      - text: 'אין שדה מושרה, כי השדה המגנטי קטן ולא גדל.'
        feedback: 'גם ירידה היא שינוי. כל שינוי בשדה המגנטי יוצר שדה חשמלי מושרה; ירידה רק הופכת את הכיוון ביחס לגידול.'
      - text: 'השדה מצביע אל הציר מכל הכיוונים.'
        feedback: 'השדה המושרה לא מצביע אל הציר או ממנו. קוויו מעגלים סגורים סביב הציר.'
        misconception: MC-induced-field-from-charges

  - id: Q-5.6-lines
    type: mc
    objectives: [OBJ-5.6-1]
    qualitative: true
    level: mid
    prompt: >-
      איזו מהטענות על השדה החשמלי המושרה סביב ליבה של סליל, שהשדה המגנטי בה גדל, נכונה?
    choices:
      - text: 'קוויו מעגלים סגורים סביב הציר, והוא קיים גם במקום שאין בו שום תיל.'
        correct: true
        feedback: 'נכון. השדה נוצר מהשינוי של השדה המגנטי, וקיים בכל המרחב סביבו. תיל רק מאפשר לו להניע זרם.'
      - text: 'קוויו יוצאים ממטענים חיוביים שמצטברים על הסליל ונכנסים לשליליים.'
        feedback: 'זה התיאור של שדה אלקטרוסטטי. את השדה המושרה לא יצרו מטענים, וקוויו סגורים, בלי התחלה ובלי סוף.'
        misconception: MC-induced-field-from-charges
      - text: 'הוא קיים רק בתוך תיל של לולאה שמקיפה את הסליל.'
        feedback: 'השדה קיים גם בלי לולאה, גם בריק: חרוז טעון בצינור מבודד, בלי שום תיל, מואץ על ידו.'
        misconception: MC-induced-field-needs-loop
      - text: 'הוא קיים רק בתוך הליבה, כי רק שם השדה המגנטי משתנה.'
        feedback: 'מחוץ לליבה השדה המושרה יורד כמו $1/r$, אבל אינו אפס. לכן טבעת שמקיפה את הסליל מבחוץ מקבלת כא"מ.'
        misconception: MC-induced-field-zero-outside

  # ------------------------------------------------ OBJ-5.6-2: emf as work per unit charge, E inside and outside
  - id: Q-5.6-emf-ring
    type: numeric
    objectives: [OBJ-5.6-2]
    prompt: >-
      בליבה של סליל ארוך, ברדיוס $3\,\text{cm}$, השדה המגנטי גדל בקצב $0.5\,\text{T/s}$. טבעת ברדיוס $6\,\text{cm}$ מקיפה את הסליל, ומרכזה על הציר. מה הכא"מ בטבעת? ענו במיליוולט (mV).
    answer: 1.414
    unit: mV
    tolerance: 0.03
    correctFeedback: 'נכון. השטף עובר רק דרך הליבה: $|\varepsilon| = \pi a^2\,\dfrac{\Delta B}{\Delta t} = \pi\cdot0.03^2\cdot0.5 \approx 1.41\cdot10^{-3}\,\text{V}$.'
    wrongFeedback: 'הכא"מ הוא קצב השינוי של השטף דרך הטבעת. איפה יש שדה מגנטי?'
    commonWrong:
      - value: 5.655
        feedback: 'השתמשתם בשטח של הטבעת, $\pi\cdot0.06^2$. השדה המגנטי קיים רק בליבה, ולכן השטף עובר רק דרך השטח $\pi\cdot0.03^2$.'
        misconception: MC-induced-emf-grows-with-loop
      - value: 0
        feedback: 'על הטבעת אין שדה מגנטי, אבל השטף דרכה משתנה, ולכן יש בה כא"מ. השדה החשמלי המושרה מגיע גם אל מחוץ לליבה.'
        misconception: MC-induced-field-zero-outside
      - value: 1414
        feedback: 'זה הכא"מ במיקרו-וולט, לא במיליוולט: $1.41\cdot10^{-3}\,\text{V} = 1.41\,\text{mV}$.'

  - id: Q-5.6-E-inside
    type: numeric
    objectives: [OBJ-5.6-2]
    level: mid
    prompt: >-
      בליבה של סליל ארוך, ברדיוס $5\,\text{cm}$, השדה המגנטי גדל בקצב $0.8\,\text{T/s}$. מה עוצמת השדה החשמלי המושרה במרחק $2\,\text{cm}$ מהציר? ענו במיליוולט למטר (mV/m).
    answer: 8
    unit: mV/m
    tolerance: 0.03
    correctFeedback: 'נכון. המעגל ברדיוס $2\,\text{cm}$ כולו בתוך הליבה: $E\cdot2\pi r = \pi r^2\,\dfrac{\Delta B}{\Delta t}$, ולכן $E = \dfrac{r}{2}\cdot\dfrac{\Delta B}{\Delta t} = \dfrac{0.02}{2}\cdot0.8 = 8\cdot10^{-3}\,\text{V/m}$.'
    wrongFeedback: 'בחרו מעגל שמרכזו על הציר ועובר בנקודה, והשוו $E\cdot2\pi r$ לקצב השינוי של השטף דרכו.'
    commonWrong:
      - value: 16
        feedback: 'שכחתם לחלק ב-2. השטח הוא $\pi r^2$ וההיקף $2\pi r$, ולכן $E = r\,\Delta B/\Delta t$ חלקי 2.'
      - value: 20
        feedback: 'הצבתם את רדיוס הליבה, $5\,\text{cm}$, במקום המרחק מהציר. בתוך הליבה השדה תלוי במרחק של הנקודה: $E = \tfrac{r}{2}\cdot\tfrac{\Delta B}{\Delta t}$.'
      - value: 50
        feedback: 'השתמשתם בנוסחה של מחוץ לליבה, $\tfrac{a^2}{2r}\cdot\tfrac{\Delta B}{\Delta t}$. הנקודה בתוך הליבה, והמעגל דרכה מקיף רק את השטח $\pi r^2$.'

  - id: Q-5.6-E-outside
    type: numeric
    objectives: [OBJ-5.6-2]
    level: mid
    prompt: >-
      בליבה של סליל ארוך, ברדיוס $5\,\text{cm}$, השדה המגנטי גדל בקצב $0.8\,\text{T/s}$. מחוץ לליבה אין שדה מגנטי. מה עוצמת השדה החשמלי המושרה במרחק $20\,\text{cm}$ מהציר? ענו במיליוולט למטר (mV/m).
    answer: 5
    unit: mV/m
    tolerance: 0.03
    correctFeedback: 'נכון. המעגל ברדיוס $20\,\text{cm}$ מקיף את כל הליבה: $E\cdot2\pi r = \pi a^2\,\dfrac{\Delta B}{\Delta t}$, ולכן $E = \dfrac{a^2}{2r}\cdot\dfrac{\Delta B}{\Delta t} = \dfrac{0.05^2}{2\cdot0.2}\cdot0.8 = 5\cdot10^{-3}\,\text{V/m}$.'
    wrongFeedback: 'בחרו מעגל שמרכזו על הציר ועובר בנקודה. דרך איזה חלק שלו עובר השטף?'
    commonWrong:
      - value: 0
        feedback: 'במקום הזה אין שדה מגנטי, אבל המעגל דרכו מקיף שטף שמשתנה, ולכן יש עליו שדה חשמלי מושרה.'
        misconception: MC-induced-field-zero-outside
      - value: 80
        feedback: 'השתמשתם בנוסחה של תוך הליבה, $\tfrac{r}{2}\cdot\tfrac{\Delta B}{\Delta t}$. מחוץ לליבה השטף עובר רק דרך השטח $\pi a^2$, והשדה יורד כמו $1/r$.'
        misconception: MC-induced-emf-grows-with-loop
      - value: 100
        feedback: 'שכחתם להעלות את $a$ בריבוע: השטח של הליבה הוא $\pi a^2$.'
      - value: 10
        feedback: 'שכחתם לחלק ב-2: ההיקף הוא $2\pi r$.'

  - id: Q-5.6-rank
    type: rank
    objectives: [OBJ-5.6-2]
    qualitative: true
    level: bagrut
    prompt: >-
      בליבה של סליל ארוך, ברדיוס $4\,\text{cm}$, השדה המגנטי גדל בקצב קבוע. דרגו את הכא"מ סביב חמש הלולאות, מהגדול לקטן (לולאות עם אותו כא"מ באותה דרגה).
    items:
      - { id: A, label: 'מעגל ברדיוס $2\,\text{cm}$, שמרכזו על הציר' }
      - { id: B, label: 'מעגל ברדיוס $4\,\text{cm}$, שמרכזו על הציר' }
      - { id: C, label: 'מעגל ברדיוס $10\,\text{cm}$, שמרכזו על הציר' }
      - { id: D, label: 'ריבוע שצלעו $30\,\text{cm}$, שמקיף את כל הליבה' }
      - { id: E, label: 'מעגל ברדיוס $3\,\text{cm}$ לצד הליבה, שלא נוגע בה' }
    order: [[B, C, D], A, E]
    correctFeedback: 'נכון. B, C ו-D מקיפים את כל הליבה, ולכן את כל השטף: $\pi a^2\,\Delta B/\Delta t$, בלי קשר לגודל או לצורה. A מקיף רבע מהשטח של הליבה, ולכן רבע מהכא"מ. E לא מקיף שטף, והכא"מ סביבו אפס, אף שיש עליו שדה.'
    wrongFeedback: 'הכא"מ תלוי רק בקצב השינוי של השטף דרך הלולאה, והשטף עובר רק דרך הליבה. כמה מהליבה מקיפה כל לולאה?'

  # ------------------------------------------------ OBJ-5.6-3: not conservative, no potential
  - id: Q-5.6-closed-work
    type: twotier
    objectives: [OBJ-5.6-3]
    qualitative: true
    prompt: >-
      מטען חיובי $q$ נע בצינור מבודד וסגור שמקיף ליבה של סליל, שהשדה המגנטי בה גדל. הכא"מ סביב הצינור $\varepsilon$. המטען משלים סיבוב אחד, בכיוון שבו השדה המושרה דוחף אותו, וחוזר לנקודת ההתחלה. כמה עבודה עשה עליו השדה החשמלי המושרה?
    choices:
      - text: '$q\varepsilon$, ובסיבוב הבא שוב $q\varepsilon$.'
        correct: true
        feedback: נכון.
      - text: 'אפס, כי המטען חזר לנקודה שבה התחיל.'
        feedback: 'זה נכון לשדה משמר, כמו השדה של מטענים במנוחה (שיעור 2.1). השדה המושרה אינו משמר: סביב שטף שמשתנה העבודה ליחידת מטען היא הכא"מ.'
        misconception: MC-induced-field-conservative
      - text: '$q\varepsilon$ בסיבוב הראשון, ואפס בסיבובים הבאים.'
        feedback: 'כל עוד השטף ממשיך להשתנות באותו קצב, הכא"מ לא משתנה, והשדה מוסיף $q\varepsilon$ בכל סיבוב.'
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'הכא"מ הוא בדיוק העבודה ליחידת מטען סביב הלולאה: $\Sigma E_\parallel\,\Delta\ell = \varepsilon$.'
        correct: true
        feedback: 'נכון. לכן השדה המושרה הוא שדה לא משמר, ואין לו פוטנציאל.'
      - text: 'לכל שדה חשמלי יש פוטנציאל, ולכן במסלול סגור העבודה אפס.'
        feedback: 'רק לשדה משמר יש פוטנציאל. לשדה המושרה אין: אילו היה, העבודה סביב כל לולאה הייתה אפס, ולא היה כא"מ מושרה.'
        misconception: MC-induced-field-conservative
      - text: 'האנרגיה של המטען לא יכולה לגדול, כי אין סוללה.'
        feedback: 'את האנרגיה מספק המקור שמגדיל את הזרם בסליל, והיא מגיעה אל המטען דרך השדה המושרה. סוללה היא רק דרך אחת לעשות עבודה על מטענים.'

  - id: Q-5.6-potential
    type: mc
    objectives: [OBJ-5.6-3]
    qualitative: true
    level: mid
    prompt: >-
      האם אפשר לשייך לכל נקודה סביב ליבה של סליל, שהשדה המגנטי בה גדל, **פוטנציאל** של השדה החשמלי המושרה, כך שהעבודה ליחידת מטען מנקודה לנקודה תהיה הפרש הפוטנציאלים?
    choices:
      - text: 'לא: סביב לולאה שמקיפה את הליבה העבודה ליחידת מטען אינה אפס, ולכן העבודה בין שתי נקודות תלויה בדרך.'
        correct: true
        feedback: 'נכון. אילו היה פוטנציאל, מטען שחוזר לאותה נקודה היה חוזר לאותו פוטנציאל, והעבודה סביב כל לולאה הייתה אפס.'
      - text: 'כן, כמו לכל שדה חשמלי.'
        feedback: 'לשדה של מטענים במנוחה יש פוטנציאל, כי הוא משמר. השדה המושרה אינו משמר: סביב שטף שמשתנה העבודה ליחידת מטען היא הכא"מ.'
        misconception: MC-induced-field-conservative
      - text: 'כן, אבל רק מחוץ לליבה, כי שם אין שדה מגנטי.'
        feedback: 'גם מחוץ לליבה, לולאה שמקיפה את הליבה נותנת עבודה שאינה אפס. נכון שלולאה קטנה לצד הליבה נותנת אפס, אבל פוטנציאל צריך להתאים לכל הדרכים, גם לאלה שמקיפות את הליבה.'
        misconception: MC-induced-field-conservative
      - text: 'לא, כי השדה המושרה חלש מכדי שיהיה לו פוטנציאל.'
        feedback: 'גודל השדה לא קובע אם יש לו פוטנציאל. מה שקובע הוא אם העבודה סביב כל מסלול סגור אפס.'

  - id: Q-5.6-bead-energy
