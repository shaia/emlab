    answer: 0.4
    unit: μJ
    tolerance: 0.03
    correctFeedback: 'נכון. בכל סיבוב השדה עושה עליו עבודה $q\varepsilon = 5\cdot10^{-6}\cdot0.02 = 10^{-7}\,\text{J}$, ובארבעה סיבובים $4\cdot10^{-7}\,\text{J} = 0.4\,\mu\text{J}$.'
