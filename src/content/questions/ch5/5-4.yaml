# Lesson 5.4 question bank. Strings may hold $inline$ / $$display$$ TeX and **bold**; they are
# rendered at build time. YAML note: plain and single-quoted strings keep backslashes literally.
# Every number below was recomputed with src/physics/induction.ts (motionalEmf, railCurrent,
# railBrakingForce, railTerminalSpeed, railTimeConstant) and src/physics/railrod.ts (kinetic,
# railPowers); script nums54.ts in the session scratchpad.
# Directions: x right, y up the page, z out of the page; F = qv×B on the rod's charges, F = I L×B on the rod.

chapter: 5
questions:
  # ------------------------------------------------ OBJ-5.4-1: the motional emf
  - id: Q-5.4-emf-origin
    type: mc
    objectives: [OBJ-5.4-1]
    qualitative: true
    prompt: >-
      מוט מתכת נע במהירות קבועה בתוך שדה מגנטי אחיד וקבוע. המהירות ניצבת לשדה וניצבת לאורך המוט. בין קצות המוט נוצר כא"מ. מה הסיבה לו?
    choices:
      - text: 'המטענים החופשיים במוט נעים איתו בשדה, וכוח לורנץ דוחף אותם לאורך המוט.'
        correct: true
        feedback: 'נכון. על כל מטען פועל $qvB$ לאורך המוט, והעבודה על כל קולון לאורך $L$ היא $\varepsilon = BLv$.'
      - text: 'אין כא"מ: השדה אחיד וקבוע, ולכן שום דבר לא משתנה.'
        feedback: 'השדה קבוע, אבל המוט נע, ואיתו המטענים שבו. על מטען נע בשדה מגנטי פועל כוח לורנץ, והוא מפריד את המטענים.'
        misconception: MC-rail-uniform-field-no-emf
      - text: 'השדה המגנטי מושך את האלקטרונים לאחד הקטבים של המגנט.'
        feedback: 'שדה מגנטי לא מושך מטענים אל הקטבים. על מטען במנוחה הוא לא פועל כלל, ועל מטען נע הכוח ניצב למהירות ולשדה, כלומר כאן לאורך המוט.'
      - text: 'המוט מתחכך באוויר ונטען בחשמל סטטי.'
        feedback: 'חיכוך לא יוצר הפרש פוטנציאלים קבוע בין קצות מוט מתכת, וכשמסירים את השדה הכא"מ נעלם. הסיבה היא התנועה בשדה.'

  - id: Q-5.4-open-rod
    type: twotier
    objectives: [OBJ-5.4-1]
    qualitative: true
    level: mid
    prompt: >-
      מוט מתכת שאינו מחובר לשום דבר נע במהירות קבועה בשדה מגנטי, בניצב לשדה. האם יש מתח בין שני הקצוות שלו?
    choices:
      - text: 'כן, יש מתח.'
        correct: true
        feedback: נכון.
      - text: 'לא, כי המעגל לא סגור.'
        feedback: 'במעגל פתוח לא זורם זרם, אבל כא"מ ומתח יכולים להיות, כמו בין ההדקים של סוללה שלא מחוברת.'
        misconception: MC-rail-emf-needs-closed-circuit
      - text: 'רק ברגע שהמוט מתחיל לנוע, ואחר כך המתח נעלם.'
        feedback: 'המתח נשאר כל עוד המוט נע: כל רגע כוח לורנץ דוחף את המטענים, והשדה החשמלי של המטענים שהצטברו מאזן אותו.'
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'כוח לורנץ מצבר מטען חיובי בקצה אחד ושלילי בשני, עד שהשדה החשמלי שלהם מאזן את הכוח המגנטי: $qE = qvB$, ולכן $V = EL = BLv$.'
        correct: true
        feedback: 'נכון. המוט הוא סוללה שהכא"מ שלה $BLv$. אם סוגרים מעגל, הוא מניע זרם.'
      - text: 'כא"מ מושרה נוצר רק כשהשטף דרך מעגל סגור משתנה.'
        feedback: 'חוק פאראדיי מדבר על מעגל, אבל כוח לורנץ פועל על המטענים במוט גם בלי מעגל. המטענים מצטברים בקצוות, ונוצר מתח.'
        misconception: MC-rail-emf-needs-closed-circuit
      - text: 'המוט נטען כולו במטען חיובי.'
        feedback: 'המוט נשאר ניטרלי בסך הכול: המטענים רק עוברים מקצה לקצה. בקצה אחד עודף חיובי, ובשני עודף שלילי באותו גודל.'

  - id: Q-5.4-emf-value
    type: numeric
    objectives: [OBJ-5.4-1]
    prompt: >-
      מוט באורך $40\,\text{cm}$ נע במהירות $3\,\text{m/s}$ בשדה מגנטי של $0.5\,\text{T}$. המוט, המהירות והשדה ניצבים זה לזה. מה הכא"מ בין קצות המוט, בוולט?
    answer: 0.6
    unit: V
    tolerance: 0.03
    correctFeedback: 'נכון. $\varepsilon = BLv = 0.5\cdot0.4\cdot3 = 0.6\,\text{V}$.'
    wrongFeedback: 'השתמשו ב-$\varepsilon = BLv$, עם $L$ במטרים.'
    commonWrong:
      - value: 60
        feedback: 'הצבתם $L = 40$, בסנטימטרים. $40\,\text{cm} = 0.4\,\text{m}$.'
      - value: 1.5
        feedback: 'זו המכפלה $Bv$, בלי אורך המוט. הכא"מ הוא $BLv$.'

  - id: Q-5.4-flux-rate
    type: numeric
    objectives: [OBJ-5.4-1]
    level: mid
    prompt: >-
      מוט נע במהירות $2\,\text{m/s}$ על מסילות שהמרחק ביניהן $25\,\text{cm}$, בשדה של $0.6\,\text{T}$ שניצב למישור המסילות. המסילות מחוברות בנגד, והמוט מתרחק ממנו. בכמה ובר גדל השטף דרך המעגל בכל שנייה? (זה גם הכא"מ בוולט.)
    answer: 0.3
    unit: Wb
    tolerance: 0.03
    correctFeedback: 'נכון. בכל שנייה השטח גדל ב-$Lv = 0.25\cdot2 = 0.5\,\text{m}^2$, והשטף ב-$B\cdot Lv = 0.6\cdot0.5 = 0.3\,\text{Wb}$. לכן $\varepsilon = \Delta\Phi/\Delta t = 0.3\,\text{V} = BLv$.'
    wrongFeedback: 'בכל שנייה המוט מתקדם $v$ מטרים. בכמה גדל השטח של המעגל, ובכמה השטף?'
    commonWrong:
      - value: 0.15
        feedback: 'זו המכפלה $BL$, בלי המהירות. בשנייה המוט מתקדם $2\,\text{m}$, לא מטר אחד.'
      - value: 1.2
        feedback: 'זו המכפלה $Bv$, בלי המרחק בין המסילות. תוספת השטח היא רצועה ברוחב $L$.'

  # ------------------------------------------------ OBJ-5.4-2: current, force, directions
  - id: Q-5.4-current-dir
    type: mc
    objectives: [OBJ-5.4-2]
    qualitative: true
    prompt: >-
      שתי מסילות אופקיות בדף, ומשמאל הן מחוברות בנגד. מוט מונח לרוחבן, בצד ימין, ונע ימינה, הרחק מהנגד. השדה המגנטי אחיד, לתוך הדף (⊗). מה כיוון הזרם במוט?
    choices:
      - text: 'כלפי מעלה בדף, כך שבמעגל כולו הזרם נגד כיוון השעון.'
        correct: true
        feedback: 'נכון. כוח לורנץ על מטען חיובי: האצבעות לתוך הדף, האגודל ימינה, כף היד פונה למעלה. ובחוק לנץ: השטף לתוך הדף גדל, והזרם יוצר בתוך הלולאה שדה החוצה מהדף.'
      - text: 'כלפי מטה בדף, כך שבמעגל כולו הזרם עם כיוון השעון.'
        feedback: 'זה הזרם שהיה זורם אילו המוט היה מתקרב לנגד, או אילו השדה היה החוצה מהדף. בדקו שוב: האצבעות לתוך הדף, האגודל ימינה.'
      - text: 'אין זרם: השדה אחיד וקבוע.'
        feedback: 'השדה קבוע, אבל השטח של המעגל גדל, ולכן השטף דרכו גדל. וגם בלי שטף: על המטענים הנעים במוט פועל כוח לורנץ.'
        misconception: MC-rail-uniform-field-no-emf
      - text: 'אין זרם: אין במעגל סוללה.'
        feedback: 'המוט הנע הוא הסוללה: הכא"מ שלו $BLv$ מניע את הזרם.'

  - id: Q-5.4-force-dir
    type: vector
    objectives: [OBJ-5.4-2]
    allowOutIn: true
    level: mid
    prompt: >-
      מוט על שתי מסילות אופקיות שמחוברות בנגד נע **שמאלה**. השדה המגנטי החוצה מהדף (⊙). מה כיוון הכוח המגנטי על המוט, שנובע מהזרם המושרה בו?
    answer: e
    correctFeedback: 'נכון. כוח לורנץ על מטען חיובי (האצבעות אליכם, האגודל שמאלה) פונה למעלה, ולכן הזרם במוט כלפי מעלה. עכשיו כלל כף יד ימין עם הזרם: האצבעות אליכם, האגודל למעלה, וכף היד פונה ימינה. הכוח נגד התנועה, כפי שחוק לנץ דורש.'
    wrong:
      - dir: w
        feedback: 'זה כיוון התנועה. הכוח על הזרם המושרה תמיד נגד התנועה: אילו דחף קדימה, המוט היה מאיץ ומחמם את הנגד בלי שמישהו עושה עבודה.'
        misconception: MC-rail-magnetic-force-helps
      - dir: n
        feedback: 'זה כיוון הזרם במוט. הכוח על תיל ניצב לתיל.'
        misconception: MC-wire-force-along-i
      - dir: out
        feedback: 'זה כיוון השדה. הכוח המגנטי ניצב לשדה.'
        misconception: MC-wire-force-along-b
      - dir: zero
        feedback: 'השטף דרך המעגל משתנה, ולכן זורם זרם מושרה, ועל תיל שזורם בו זרם בשדה פועל כוח.'
        misconception: MC-rail-uniform-field-no-emf
    wrongFeedback: 'קודם מצאו את כיוון הזרם במוט (כוח לורנץ על מטען חיובי), ואז את הכוח על המוט בכלל כף יד ימין עם הזרם.'

  - id: Q-5.4-brake-force
    type: numeric
    objectives: [OBJ-5.4-2]
    level: mid
    prompt: >-
      מוט באורך $0.5\,\text{m}$ נע במהירות $2\,\text{m/s}$ על מסילות שמחוברות בנגד של $4\,\Omega$, בשדה של $0.8\,\text{T}$ שניצב למישור המסילות. מה גודל הכוח המגנטי על המוט, בניוטון?
    answer: 0.08
    unit: N
    tolerance: 0.03
    correctFeedback: 'נכון. $\varepsilon = BLv = 0.8\,\text{V}$, $I = \varepsilon/R = 0.2\,\text{A}$, ו-$F_B = BIL = 0.8\cdot0.2\cdot0.5 = 0.08\,\text{N}$. או בבת אחת: $B^2L^2v/R = 0.64\cdot0.25\cdot2/4 = 0.08\,\text{N}$.'
    wrongFeedback: 'שלושה צעדים: הכא"מ $BLv$, הזרם $\varepsilon/R$, והכוח $BIL$.'
    commonWrong:
      - value: 0.2
        feedback: 'זה הזרם, באמפר. הכוח על המוט הוא $BIL$.'
      - value: 0.8
        feedback: 'זה הכא"מ, בוולט. חלקו ב-$R$ לקבלת הזרם, ואז $F = BIL$.'
      - value: 0.16
        feedback: 'הכפלתם ב-$L$ רק פעם אחת. $L$ מופיע פעמיים: בכא"מ $BLv$ ובכוח $BIL$.'

  - id: Q-5.4-flip-field
    type: twotier
    objectives: [OBJ-5.4-2]
    qualitative: true
    prompt: >-
      מוט נע ימינה על מסילות שמחוברות בנגד, בשדה לתוך הדף. הכוח המגנטי עליו שמאלה. הופכים את השדה, כך שיהיה החוצה מהדף, והמוט ממשיך לנוע ימינה באותה מהירות. מה כיוון הכוח המגנטי על המוט עכשיו?
    choices:
      - text: 'עדיין שמאלה.'
        correct: true
        feedback: נכון.
      - text: 'ימינה.'
        feedback: 'הזרם אכן מתהפך, אבל גם השדה התהפך. הכוח $BIL$ תלוי בשניהם.'
        misconception: MC-rail-magnetic-force-helps
      - text: 'אין כוח, כי השדה וההפוך שלו מבטלים זה את זה.'
        feedback: 'לא מבטלים: אין שני שדות. יש שדה אחד, בכיוון ההפוך, ובאותה עוצמה, ולכן כוח באותה עוצמה.'
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'הזרם במוט מתהפך וגם השדה מתהפך, ושני ההיפוכים מבטלים זה את זה בכוח $BIL$. כך הכוח תמיד נגד התנועה.'
        correct: true
        feedback: 'נכון. זה חוק לנץ: הכוח מתנגד לתנועה, בכל כיוון של השדה.'
      - text: 'כיוון הזרם לא תלוי בכיוון השדה.'
        feedback: 'תלוי: כוח לורנץ על המטענים מתהפך כשהשדה מתהפך, ולכן גם הזרם. הכוח נשאר שמאלה כי שניהם התהפכו.'
      - text: 'הכוח המגנטי תמיד בכיוון השדה.'
        feedback: 'הכוח על תיל ניצב לשדה. כאן השדה ניצב לדף, והכוח בדף.'
        misconception: MC-wire-force-along-b

  # ------------------------------------------------ OBJ-5.4-3: Newton's second law and the terminal speed
  - id: Q-5.4-vt-graph
    type: mc
    objectives: [OBJ-5.4-3]
    qualitative: true
    prompt: >-
      מוט מתחיל ממנוחה ונמשך בכוח קבוע על מסילות חלקות שמחוברות בנגד, בשדה מגנטי. איך נראה גרף המהירות שלו לפי הזמן?
    choices:
      - text: 'עקומה שיוצאת מהראשית בשיפוע $F/m$, והשיפוע שלה קטן כל הזמן, עד שהיא מתקרבת לקו אופקי.'
        correct: true
        feedback: 'נכון. השיפוע הוא התאוצה, $(F - B^2L^2v/R)/m$, והוא קטן ככל שהמהירות גדלה, עד ש-$v$ מתקרבת ל-$v_T$.'
      - text: 'קו ישר שעולה, בשיפוע $F/m$.'
        feedback: 'זה היה נכון בלי שדה. כאן הכוח הבולם גדל עם המהירות, והתאוצה קטנה.'
        misconception: MC-rail-rod-speeds-up-forever
      - text: 'עקומה שעולה עד מקסימום, ואחר כך יורדת לאפס.'
        feedback: 'כדי שהמוט יאט, הכוח הבולם צריך לעלות על $F$. אבל הכוח הבולם גדל עם המהירות, והוא משתווה ל-$F$ בדיוק ב-$v_T$, לא עובר אותו.'
      - text: 'קו אופקי: המהירות קבועה מההתחלה.'
        feedback: 'במנוחה אין זרם ואין בלימה, ולכן ברגע הראשון התאוצה $F/m$. המהירות קבועה רק בסוף.'

  - id: Q-5.4-vt-value
    type: numeric
    objectives: [OBJ-5.4-3]
    prompt: >-
      מושכים מוט בכוח קבוע של $0.3\,\text{N}$ על מסילות חלקות שהמרחק ביניהן $60\,\text{cm}$, בשדה של $0.5\,\text{T}$ שניצב למישור המסילות. ההתנגדות הכוללת של המעגל $1.5\,\Omega$. מה המהירות הסופית של המוט, במטר לשנייה?
    answer: 5
    unit: m/s
    tolerance: 0.03
    correctFeedback: 'נכון. $v_T = \dfrac{FR}{B^2L^2} = \dfrac{0.3\cdot1.5}{0.25\cdot0.36} = \dfrac{0.45}{0.09} = 5\,\text{m/s}$.'
    wrongFeedback: 'במהירות הסופית הכוח הבולם $B^2L^2v/R$ שווה ל-$F$. בודדו את $v$.'
    commonWrong:
      - value: 1.5
        feedback: 'חילקתם ב-$BL$ בלי ריבועים. $B$ ו-$L$ מופיעים פעמיים: בכא"מ ובכוח, ולכן בריבוע.'
      - value: 3
        feedback: 'העליתם בריבוע רק את $B$. גם $L$ מופיע בריבוע.'
      - value: 2.5
        feedback: 'העליתם בריבוע רק את $L$. גם $B$ מופיע בריבוע.'
      - value: 0.0005
        feedback: 'הצבתם $L = 60$, בסנטימטרים. $60\,\text{cm} = 0.6\,\text{m}$, ו-$L^2 = 0.36\,\text{m}^2$.'

  - id: Q-5.4-double-R
    type: mc
    objectives: [OBJ-5.4-3]
    qualitative: true
    prompt: >-
      מוט שנמשך בכוח קבוע הגיע למהירות סופית. מחליפים את הנגד בנגד שההתנגדות שלו גדולה פי 2, ומחכים. מה קורה למהירות הסופית?
    choices:
      - text: 'גדלה פי 2.'
        correct: true
        feedback: 'נכון. באותה מהירות הזרם קטן פי 2, וגם הכוח הבולם. כדי שהבלימה תשתווה ל-$F$ המוט צריך לנוע מהר פי 2: $v_T = FR/(B^2L^2)$.'
      - text: 'קטנה פי 2, כי ההתנגדות מאטה את המוט.'
        feedback: 'ההתנגדות לא פועלת על המוט כמו חיכוך. מה שבולם הוא הכוח המגנטי, $BIL$, והוא **קטן** כשהזרם קטן.'
        misconception: MC-rail-more-resistance-slower
      - text: 'לא משתנה, כי היא נקבעת רק מהכוח ומהשדה.'
        feedback: 'גם ההתנגדות קובעת כמה זרם, ולכן כמה בלימה, יש בכל מהירות.'
      - text: 'גדלה פי 4.'
        feedback: '$R$ מופיע ב-$v_T$ בחזקה ראשונה, לא בריבוע.'

  - id: Q-5.4-rank-vt
    type: rank
    objectives: [OBJ-5.4-3]
    qualitative: true
    level: mid
    prompt: >-
      אותו מוט נמשך באותו כוח קבוע על מסילות חלקות בארבעה מצבים. במצב הבסיס, המהירות הסופית $v_T$. סדרו את המצבים לפי המהירות הסופית, מהגדולה לקטנה.
    items:
      - { id: base, label: 'מצב הבסיס' }
      - { id: R2, label: 'ההתנגדות גדולה פי 2' }
      - { id: B2, label: 'השדה חזק פי 2' }
      - { id: Lhalf, label: 'המסילות קרובות פי 2 זו לזו (מוט קצר פי 2 בין המסילות)' }
    order: [Lhalf, R2, base, B2]
    correctFeedback: 'נכון. $v_T = FR/(B^2L^2)$: חצי $L$ נותן $4v_T$, כפול $R$ נותן $2v_T$, וכפול $B$ נותן $v_T/4$.'
    wrongFeedback: 'השתמשו ב-$v_T = FR/(B^2L^2)$: $R$ בחזקה ראשונה במונה, $B$ ו-$L$ בריבוע במכנה.'

  - id: Q-5.4-pull-off
    type: mc
    objectives: [OBJ-5.4-3]
    qualitative: true
    prompt: >-
      מוט נע במהירות הסופית שלו על מסילות חלקות שמחוברות בנגד, בשדה מגנטי. מפסיקים למשוך אותו. מה יקרה?
    choices:
      - text: 'המוט יאט, בהתחלה מהר ואחר כך לאט יותר ויותר, ומהירותו תתקרב לאפס.'
        correct: true
        feedback: 'נכון. הכוח הבולם נשאר כל עוד המוט נע, והוא קטן ככל שהמוט מאט. האנרגיה הקינטית הופכת לחום בנגד.'
      - text: 'המוט ימשיך במהירות קבועה, כי המסילות חלקות.'
        feedback: 'אין חיכוך, אבל יש כוח מגנטי נגד התנועה כל עוד זורם זרם, והזרם זורם כל עוד המוט נע.'
        misconception: MC-rail-coasts-forever
      - text: 'המוט ייעצר מיד, כי בלי הכוח המושך אין זרם.'
        feedback: 'הזרם נוצר מהתנועה, לא מהכוח המושך. ברגע שמסירים את הכוח, המוט עדיין נע מהר, והכא"מ עדיין $BLv$.'
      - text: 'המוט יאט, ייעצר, ויתחיל לנוע אחורה.'
        feedback: 'הכוח הבולם פרופורציוני למהירות: כשהמהירות מתאפסת, גם הוא מתאפס. אין כוח שיחזיר את המוט לאחור.'

  # ------------------------------------------------ OBJ-5.4-4: energy
  - id: Q-5.4-power-current
    type: numeric
    objectives: [OBJ-5.4-4]
    level: mid
    prompt: >-
      מוט שנמשך בכוח קבוע של $0.5\,\text{N}$ נע במהירות הסופית שלו, $6\,\text{m/s}$. ההתנגדות הכוללת של המעגל $0.75\,\Omega$. מה הזרם במעגל, באמפר? (לא נתונים השדה ולא אורך המוט.)
    answer: 2
    unit: A
    tolerance: 0.03
    correctFeedback: 'נכון. במהירות הסופית $F\cdot v_T = I^2R$: $0.5\cdot6 = 3\,\text{W}$, ולכן $I = \sqrt{3/0.75} = 2\,\text{A}$.'
    wrongFeedback: 'במהירות הסופית כל ההספק של הכוח המושך הופך לחום: $F\cdot v_T = I^2R$.'
    commonWrong:
      - value: 4
        feedback: 'זה $I^2$. הוציאו שורש: $I = \sqrt{P/R}$.'
      - value: 3
        feedback: 'זה ההספק, בוואט. הזרם מתקבל מ-$P = I^2R$.'

  - id: Q-5.4-energy-terminal
    type: twotier
    objectives: [OBJ-5.4-4]
    qualitative: true
    prompt: >-
      מוט נמשך בכוח קבוע ונע במהירות הסופית שלו. הכוח המושך ממשיך לעשות עבודה. לאן הולכת העבודה?
    choices:
      - text: 'כולה לחום בנגד.'
        correct: true
        feedback: נכון.
      - text: 'כולה לאנרגיה קינטית של המוט.'
        feedback: 'המהירות קבועה, ולכן האנרגיה הקינטית לא משתנה.'
        misconception: MC-rail-work-all-kinetic
      - text: 'לשום מקום: במהירות קבועה הכוח המושך לא עושה עבודה.'
        feedback: 'הכוח פועל לאורך התנועה, והמוט מתקדם, ולכן הוא עושה עבודה $F\cdot\Delta x$. זה שהכוח השקול אפס לא אומר שכל כוח לבדו לא עושה עבודה.'
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'האנרגיה הקינטית קבועה, וזורם זרם $BLv_T/R$: הספק הכוח, $F\cdot v_T$, שווה ל-$I^2R$.'
        correct: true
        feedback: 'נכון. $I^2R = B^2L^2v_T^2/R = F_B\cdot v_T$, ובמהירות הסופית $F_B = F$.'
      - text: 'במהירות הסופית לא זורם זרם, כי שום דבר כבר לא משתנה.'
        feedback: 'השטח של המעגל ממשיך לגדול באותו קצב, $Lv_T$, ולכן השטף ממשיך להשתנות. הזרם במהירות הסופית הוא הגדול ביותר בכל הדרך.'
        misconception: MC-rail-terminal-no-current
      - text: 'הכוח המגנטי עושה עבודה חיובית על המוט.'
        feedback: 'הכוח המגנטי על המוט כולו, $BIL$, נגד התנועה, ולכן העבודה שלו על המוט שלילית, ושווה בגודלה לחום שמתפתח בנגד. (על המטענים, כמו שראינו בשיעור, הכוח המגנטי בסך הכול לא עושה עבודה: הוא רק מעביר לזרם את העבודה של הכוח המושך.)'
        misconception: MC-rail-magnetic-force-helps

  - id: Q-5.4-energy-way
    type: mc
    objectives: [OBJ-5.4-4]
    qualitative: true
    prompt: >-
      מוט נמשך ממנוחה בכוח קבוע, ועדיין לא הגיע למהירות הסופית. נסמן ב-$W$ את העבודה של הכוח המושך עד עכשיו, וב-$K$ את האנרגיה הקינטית של המוט עכשיו. מה נכון?
    choices:
      - text: '$W > K$: ההפרש הוא החום שהתפתח בנגד.'
        correct: true
        feedback: 'נכון. $W = K + Q$, וחום מתפתח בכל רגע שזורם זרם, כלומר מהרגע שהמוט התחיל לנוע.'
      - text: '$W = K$: חום מתחיל להתפתח רק במהירות הסופית.'
        feedback: 'זרם זורם, וחום מתפתח, מהרגע שהמוט נע. במהירות הסופית **כל** העבודה הופכת לחום; לפני כן רק חלק ממנה.'
        misconception: MC-rail-work-all-kinetic
      - text: '$W < K$: הכוח המגנטי מוסיף למוט אנרגיה.'
        feedback: 'הכוח המגנטי נגד התנועה, והוא לוקח אנרגיה מהמוט, לא מוסיף.'
        misconception: MC-rail-magnetic-force-helps
      - text: 'אי אפשר לדעת בלי לדעת את השדה.'
        feedback: 'בלי לדעת את השדה אי אפשר לחשב כמה חום, אבל אפשר לדעת שיש חום, ולכן ש-$W > K$.'

  - id: Q-5.4-coast-heat
    type: numeric
    objectives: [OBJ-5.4-4, OBJ-5.4-3]
    prompt: >-
      מוט שמסתו $0.2\,\text{kg}$ נע ב-$5\,\text{m/s}$ על מסילות חלקות שמחוברות בנגד, בשדה מגנטי, ומפסיקים למשוך אותו. כמה חום, בג'אול, יתפתח בנגד עד שהמוט ייעצר?
    answer: 2.5
    unit: J
    tolerance: 0.03
    correctFeedback: 'נכון. אין חיכוך ואין כוח מושך, ולכן כל האנרגיה הקינטית הופכת לחום: $Q = \tfrac{1}{2}mv^2 = \tfrac{1}{2}\cdot0.2\cdot25 = 2.5\,\text{J}$. לא צריך לדעת את $B$, $L$ או $R$.'
    wrongFeedback: 'לאן הולכת האנרגיה הקינטית של המוט?'
    commonWrong:
      - value: 5
        feedback: 'שכחתם את החצי: $K = \tfrac{1}{2}mv^2$.'
      - value: 0.5
        feedback: 'שכחתם להעלות את המהירות בריבוע: $K = \tfrac{1}{2}mv^2$.'
