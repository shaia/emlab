# Lesson 5.3 question bank (Lenz's law, eddy currents, forces on a loop). Strings may hold $inline$ TeX and **bold**;
# they are rendered at build time. YAML note: single-quoted and >- strings keep backslashes literally.
# Every number was recomputed with npx tsx against src/physics (lenz.ts, induction.ts, constants.ts G = 10).
# Directions: the signed law of induction.ts (n̂ and the positive circulation tied by the right-hand rule).

chapter: 5
questions:
  # ------------------------------------------------ OBJ-5.3-1: the direction of the induced current
  - id: Q-5.3-recipe-approach
    type: mc
    objectives: [OBJ-5.3-1, OBJ-5.3-3]
    qualitative: true
    prompt: >-
      מגנט מוט מתקרב אל טבעת נחושת מימין, לאורך הציר שלה, כשהקוטב **הדרומי** שלו פונה אל הטבעת. מה כיוון הזרם בטבעת כשמסתכלים עליה מצד המגנט (מימין), ואיזה קוטב נוצר בצד שלה שפונה אל המגנט?
    choices:
      - text: 'עם כיוון השעון; הצד שפונה אל המגנט הוא קוטב דרומי.'
        correct: true
        feedback: 'נכון. השדה של המגנט בטבעת מצביע ימינה, אל הקוטב הדרומי, והשטף ימינה גדל. השדה המושרה שמאלה, ובמבט מימין האגודל מצביע הרחק מכם, והאצבעות עם כיוון השעון. דרומי מול דרומי: הטבעת נדחית.'
      - text: 'נגד כיוון השעון; הצד שפונה אל המגנט הוא קוטב צפוני.'
        feedback: 'אז הטבעת הייתה נמשכת אל המגנט המתקרב, כמו ברזל. הזרם מתנגד להתקרבות: הצד שפונה אל המגנט הוא קוטב זהה לקוטב שלו, דרומי.'
        misconception: MC-lenz-ring-attracted-like-iron
      - text: 'עם כיוון השעון; הצד שפונה אל המגנט הוא קוטב צפוני.'
        feedback: 'כיוון הזרם נכון, אבל הקוטב לא. לפי שיעור 4.3, הצד שממנו הזרם נראה עם כיוון השעון הוא קוטב **דרומי**.'
      - text: 'אין זרם עד שהמגנט נכנס לתוך הטבעת.'
        feedback: 'קווי השדה של המגנט עוברים דרך הטבעת עוד לפני שהוא נכנס אליה, והשטף שלהם גדל כשהוא מתקרב. שינוי בשטף מספיק כדי להשרות זרם.'

  - id: Q-5.3-loop-in-page
    type: mc
    objectives: [OBJ-5.3-1]
    qualitative: true
    prompt: >-
      מסגרת מוליכה מונחת במישור הדף, בתוך שדה מגנטי אחיד שמצביע החוצה מהדף (⊙). השדה **נחלש**. מה כיוון הזרם המושרה במסגרת, כפי שאתם רואים את הדף?
    choices:
      - text: 'נגד כיוון השעון.'
        correct: true
        feedback: 'נכון. השטף החוצה מהדף קטן, ולכן השדה המושרה מנסה להשלים אותו: החוצה מהדף, ⊙. האגודל אליכם, והאצבעות נגד כיוון השעון.'
      - text: 'עם כיוון השעון.'
        feedback: 'זה הזרם שיוצר שדה לתוך הדף, הפוך לשדה החיצוני. אבל השדה **נחלש**: השדה המושרה מתנגד לשינוי, ולכן הוא באותו כיוון כמו השדה החיצוני.'
        misconception: MC-lenz-opposes-field
      - text: 'אין זרם, כי השדה ניצב למישור המסגרת.'
        feedback: 'דווקא כשהשדה ניצב למסגרת השטף הוא הגדול ביותר, $\Phi = BA$, וכל שינוי בשדה משנה אותו.'
      - text: 'הזרם זורם רק בצלעות שהשדה ניצב להן.'
        feedback: 'הכא״מ מניע זרם מסביב לכל המסגרת: הזרם זהה בכל הצלעות של מעגל טורי, והשדה ניצב לכולן.'

  - id: Q-5.3-recede-field
    type: vector
    objectives: [OBJ-5.3-1]
    qualitative: true
    allowOutIn: true
    level: mid
    prompt: >-
      מגנט מוט נמצא משמאל לטבעת, על הציר שלה, והקוטב הצפוני שלו פונה ימינה, אל הטבעת. מרחיקים את המגנט שמאלה. מה כיוון השדה המגנטי **של הזרם המושרה** במרכז הטבעת?
    answer: e
    correctFeedback: 'נכון. השדה של המגנט בטבעת מצביע ימינה, והוא נחלש. השדה המושרה מתנגד להיחלשות, ולכן גם הוא ימינה.'
    wrong:
      - dir: w
        feedback: 'זה היה נכון אילו המגנט **התקרב**. כשהוא מתרחק השטף קטן, והשדה המושרה באותו כיוון כמו השדה של המגנט.'
        misconception: MC-lenz-opposes-field
      - dir: zero
        feedback: 'השטף משתנה, ולכן יש זרם מושרה, ויש לו שדה. רק מגנט במנוחה לא משרה זרם.'
      - dir: n
        feedback: 'במרכז כריכה השדה של הזרם שבה ניצב למישור שלה, לאורך הציר: ימינה או שמאלה.'
      - dir: s
        feedback: 'במרכז כריכה השדה של הזרם שבה ניצב למישור שלה, לאורך הציר: ימינה או שמאלה.'
    wrongFeedback: 'עברו על המתכון: מה כיוון השדה של המגנט בטבעת? האם השטף גדל או קטן? איזה שדה מתנגד לשינוי?'

  - id: Q-5.3-avg-current
    type: numeric
    objectives: [OBJ-5.3-1]
    level: mid
    prompt: >-
      השטף המגנטי דרך טבעת שהתנגדותה $0.05\,\Omega$ יורד בקצב אחיד מ-$3\cdot10^{-4}\,\text{Wb}$ לאפס במשך $0.02\,\text{s}$. מה גודל הזרם המושרה בטבעת? ענו באמפר.
    answer: 0.3
    unit: A
    tolerance: 0.03
    correctFeedback: 'נכון. $|\varepsilon| = \dfrac{|\Delta\Phi|}{\Delta t} = \dfrac{3\cdot10^{-4}}{0.02} = 0.015\,\text{V}$, ו-$I = \dfrac{0.015}{0.05} = 0.3\,\text{A}$. את הכיוון קובעים בחוק לנץ: השדה המושרה באותו כיוון כמו השדה שנחלש.'
    wrongFeedback: 'חשבו קודם את הכא״מ, $|\varepsilon| = |\Delta\Phi|/\Delta t$, ואז את הזרם, $I = |\varepsilon|/R$.'
    commonWrong:
      - value: 0.015
        feedback: 'זה הכא״מ בוולט. הזרם הוא הכא״מ מחולק בהתנגדות.'
      - value: 0.006
        feedback: 'חילקתם את השטף בהתנגדות ושכחתם את הזמן. הכא״מ תלוי בקצב השינוי, $\Delta\Phi/\Delta t$.'
      - value: 7.5e-4
        feedback: 'הכפלתם את הכא״מ בהתנגדות. לפי חוק אום $I = \varepsilon/R$: מחלקים.'

  # ------------------------------------------------ OBJ-5.3-2: Lenz as energy conservation
  - id: Q-5.3-energy-wrong-sign
    type: twotier
    objectives: [OBJ-5.3-2]
    qualitative: true
    prompt: >-
      תלמיד טוען: "הכיוון בחוק לנץ הוא סתם הסכם. אילו הזרם המושרה היה זורם בכיוון ההפוך, שום חוק פיזיקלי לא היה נשבר." האם הוא צודק?
    choices:
      - text: 'לא.'
        correct: true
        feedback: נכון.
      - text: 'כן, זה עניין של בחירת סימן.'
        feedback: 'הבחירה איזה כיוון נקרא "חיובי" היא אכן הסכם, אבל הכיוון שבו הזרם זורם באמת הוא לא. בדקו מה היה קורה למגנט שמתקרב.'
        misconception: MC-lenz-direction-arbitrary
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'זרם הפוך היה מושך מגנט שמתקרב ומאיץ אותו, ובכל זאת מחמם את הטבעת: אנרגיה הייתה נוצרת מכלום.'
        correct: true
        feedback: 'נכון. חוק לנץ הוא שימור אנרגיה: בטבע מי שמזיז את המגנט משקיע עבודה, $F\cdot v = I^2R$, והיא הופכת לחום. נסו את "מה אם הזרם הפוך?" באיור 5.3א.'
      - text: 'זרם הפוך היה שובר את חוק אום.'
        feedback: 'חוק אום, $I = \varepsilon/R$, נותן את גודל הזרם, ולא אכפת לו לאיזה כיוון הוא זורם. הבעיה היא באנרגיה.'
      - text: 'זרם הפוך לא היה יוצר שדה מגנטי.'
        feedback: 'כל זרם יוצר שדה מגנטי, בכל כיוון. השאלה היא אם השדה הזה עוזר לשינוי או מתנגד לו, ומה זה עושה לאנרגיה.'

  - id: Q-5.3-cut-ring-work
    type: mc
    objectives: [OBJ-5.3-2]
    qualitative: true
    prompt: >-
      דוחפים מגנט באותה מהירות קבועה פעם אל טבעת נחושת שלמה, ופעם אל טבעת זהה שיש בה חריץ צר. מתי צריך להשקיע יותר עבודה (מעבר להתגברות על חיכוך)?
    choices:
      - text: 'בטבעת השלמה: העבודה הנוספת הופכת לחום בטבעת.'
        correct: true
        feedback: 'נכון. בטבעת השלמה זורם זרם, הטבעת דוחה את המגנט, וצריך לדחוף נגדה. בטבעת החתוכה אין זרם, אין כוח ואין חום.'
      - text: 'אותה עבודה: השדה של המגנט עושה את העבודה, לא אתם.'
        feedback: 'השדה של המגנט לא משתנה בשני המקרים. ההבדל הוא שבטבעת השלמה יש זרם, והוא דוחה את המגנט.'
      - text: 'בטבעת החתוכה: בחריץ מצטבר מטען, והוא דוחה את המגנט.'
        feedback: 'בקצות החריץ אכן נוצר מתח, אבל אין זרם מסביב לטבעת, ולכן אין לה קוטב מגנטי ואין כוח מגנטי על המגנט.'
      - text: 'אין עבודה נוספת באף אחת מהן: נחושת לא מגנטית.'
        feedback: 'נחושת לא נמשכת למגנט במנוחה, אבל מגנט שנע משרה בטבעת שלמה זרם, והזרם דוחה אותו.'
        misconception: MC-lenz-ring-attracted-like-iron

  - id: Q-5.3-work-heat
    type: numeric
    objectives: [OBJ-5.3-2]
    level: mid
    prompt: >-
      דוחפים מגנט במהירות קבועה ליד טבעת שהתנגדותה $0.02\,\Omega$. במשך $0.8\,\text{s}$ זורם בטבעת זרם מושרה, ונניח שגודלו קבוע, $0.3\,\text{A}$. כמה עבודה השקעתם בזמן הזה נגד הכוח שהטבעת מפעילה על המגנט? ענו בג׳אול.
    answer: 1.44e-3
    unit: J
    tolerance: 0.03
    correctFeedback: 'נכון. המהירות קבועה, ולכן כל העבודה הופכת לחום: $W = I^2R\,\Delta t = 0.3^2\cdot0.02\cdot0.8 = 1.44\cdot10^{-3}\,\text{J}$.'
    wrongFeedback: 'במהירות קבועה אנרגיית התנועה לא משתנה, ולכן העבודה שלכם שווה לחום שמתפתח בטבעת, $I^2R\,\Delta t$.'
    commonWrong:
      - value: 1.8e-3
        feedback: 'זה ההספק, $I^2R$, בוואט. העבודה היא ההספק כפול הזמן.'
      - value: 4.8e-3
        feedback: 'חישבתם $I\cdot R\cdot\Delta t$. הספק החום בנגד הוא $I^2R$: הזרם בריבוע.'

  # ------------------------------------------------ OBJ-5.3-3: induced poles, the force on the ring
  - id: Q-5.3-ring-force-recede
    type: vector
    objectives: [OBJ-5.3-3]
    qualitative: true
    prompt: >-
      טבעת אלומיניום תלויה על חוט. משמאל לה, על הציר שלה, נמצא מגנט שהקוטב הצפוני שלו פונה אל הטבעת. מרחיקים את המגנט שמאלה, מהר. מה כיוון הכוח המגנטי על הטבעת?
    answer: w
    correctFeedback: 'נכון. השטף קטן, הצד של הטבעת שפונה אל המגנט הופך לקוטב דרומי, והוא נמשך אל הקוטב הצפוני: הטבעת נגררת אחרי המגנט.'
    wrong:
      - dir: e
        feedback: 'זה הכוח כשהמגנט **מתקרב**. כשהוא מתרחק, הטבעת מתנגדת להתרחקות: היא נמשכת אחריו.'
        misconception: MC-lenz-always-repels
      - dir: zero
        feedback: 'השטף דרך הטבעת משתנה, ולכן זורם בה זרם, והשדה של המגנט מפעיל עליו כוח.'
      - dir: n
        feedback: 'מהסימטריה סביב הציר, הכוח על הטבעת פועל לאורך הציר: ימינה או שמאלה.'
      - dir: s
        feedback: 'מהסימטריה סביב הציר, הכוח על הטבעת פועל לאורך הציר: ימינה או שמאלה.'
    wrongFeedback: 'מה קורה לשטף כשהמגנט מתרחק? איזה קוטב צריך להופיע מול המגנט כדי להתנגד להתרחקות?'

  - id: Q-5.3-rest-magnet
    type: mc
    objectives: [OBJ-5.3-3]
    qualitative: true
    prompt: >-
      מכניסים מגנט חזק לתוך טבעת נחושת תלויה, ומחזיקים אותו שם במנוחה, כך שהקוטב הצפוני שלו בדיוק במרכז הטבעת. מה הכוח שהמגנט מפעיל על הטבעת אחרי שהוא נעצר?
    choices:
      - text: 'אין כוח.'
        correct: true
        feedback: 'נכון. אף שהשטף דרך הטבעת גדול, הוא לא משתנה, ולכן אין זרם מושרה, ואין על מה שהשדה יפעיל כוח.'
      - text: 'כוח דחייה, כי השטף דרך הטבעת גדול מאוד.'
        feedback: 'זרם מושרה תלוי בשינוי של השטף, לא בגודלו. מגנט במנוחה לא משרה זרם, גם כשהשטף גדול.'
        misconception: MC-lenz-force-without-motion
      - text: 'כוח משיכה, כי המגנט מושך מתכות.'
        feedback: 'נחושת לא נמשכת למגנט במנוחה. מגנט מושך ברזל, ניקל וקובלט.'
        misconception: MC-lenz-ring-attracted-like-iron
      - text: 'הטבעת מסתובבת סביב הציר שלה.'
        feedback: 'אין זרם בטבעת, ולכן אין גם מומנט עליה.'

  - id: Q-5.3-pole-vs-motion
    type: twotier
    objectives: [OBJ-5.3-3]
    qualitative: true
    level: mid
    prompt: >-
      תלמידה טוענת: "אם הקוטב הצפוני של מגנט פונה אל טבעת נחושת, הטבעת תמיד נדחית, ואם הקוטב הדרומי פונה אליה, היא תמיד נמשכת." האם היא צודקת?
    choices:
      - text: 'לא.'
        correct: true
        feedback: נכון.
      - text: 'כן.'
        feedback: 'בדקו באיור 5.3א: הפכו את המגנט וקרבו אותו. הטבעת עדיין נדחית.'
        misconception: MC-lenz-pole-decides-force
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'הכוח תלוי בתנועה: מגנט מתקרב דוחה את הטבעת, ומגנט מתרחק מושך אותה, בלי קשר לקוטב שפונה אליה.'
        correct: true
        feedback: 'נכון. הפיכת המגנט הופכת את הזרם ואת הקוטב שנוצר בטבעת, וכך הכוח לא מתהפך: קוטב זהה מול מגנט מתקרב, קוטב נגדי מול מגנט מתרחק.'
      - text: 'קוטב צפוני דוחה כל מתכת, וקוטב דרומי מושך כל מתכת.'
        feedback: 'אין כזה דבר: לשני הקטבים של מגנט אותה השפעה על מתכת. ברזל נמשך לשניהם, ונחושת במנוחה לא מגיבה לאף אחד.'
        misconception: MC-lenz-pole-decides-force
      - text: 'אין כוח בכלל על טבעת נחושת.'
        feedback: 'יש כוח, כל עוד המגנט נע ויש בטבעת זרם מושרה.'
        misconception: MC-lenz-ring-attracted-like-iron

  - id: Q-5.3-jumping-ring
    type: multi
    objectives: [OBJ-5.3-3]
    qualitative: true
    level: mid
    prompt: >-
      טבעת מושחלת על הליבה של אלקטרומגנט אנכי, ומונחת עליו. סוגרים את המפסק של הסליל. אילו מהטבעות הבאות יקפצו למעלה? סמנו את כל התשובות הנכונות.
    choices:
      - text: 'טבעת אלומיניום שלמה.'
        correct: true
        feedback: 'נכון. השטף דרכה גדל, הזרם המושרה יוצר מול הסליל קוטב זהה לקוטב שלו, והיא נדחית.'
      - text: 'טבעת אלומיניום שלמה, כשהסוללה מחוברת הפוך.'
        correct: true
        feedback: 'נכון. השטף עדיין גדל מאפס. הזרם בטבעת מתהפך יחד עם השדה, והכוח עדיין דוחה.'
      - text: 'טבעת נחושת שלמה שקוררה בחנקן נוזלי.'
        correct: true
        feedback: 'נכון, ואפילו גבוה יותר: ההתנגדות שלה קטנה, ולכן הזרם המושרה גדול יותר.'
      - text: 'טבעת אלומיניום עם חריץ צר.'
        feedback: 'בטבעת חתוכה אין מסלול סגור לזרם. בלי זרם אין קוטב ואין כוח: היא לא זזה.'
        misconception: MC-lenz-split-ring-jumps
      - text: 'טבעת פלסטיק באותו גודל.'
        feedback: 'פלסטיק הוא מבודד: אין בו מטענים חופשיים שיכולים לזרום, ולכן אין זרם מושרה. בלי זרם אין כוח.'

  - id: Q-5.3-receding-pole
    type: mc
    objectives: [OBJ-5.3-3]
    prompt: >-
      הקוטב הדרומי של מגנט פונה אל טבעת נחושת, והמגנט מתרחק ממנה לאורך הציר. איזה קוטב נוצר בצד של הטבעת שפונה אל המגנט, ומה הכוח על הטבעת?
    choices:
      - text: 'קוטב צפוני; הטבעת נמשכת אחרי המגנט.'
        correct: true
        feedback: 'נכון. המגנט מתרחק, והטבעת מתנגדת להתרחקות: מול הקוטב הדרומי נוצר קוטב צפוני, והם נמשכים זה לזה.'
      - text: 'קוטב דרומי; הטבעת נדחית מהמגנט.'
        feedback: 'כך קורה כשהמגנט **מתקרב**. כשהוא מתרחק השטף קטן, והטבעת מתנגדת להתרחקות.'
        misconception: MC-lenz-always-repels
      - text: 'קוטב צפוני; הטבעת נדחית מהמגנט.'
        feedback: 'קוטב צפוני מול קוטב דרומי מושך, לא דוחה.'
      - text: 'לא נוצר קוטב, כי המגנט מתרחק.'
        feedback: 'גם התרחקות משנה את השטף, ולכן משרה זרם, והזרם הופך את הטבעת למגנט שטוח.'

  # ------------------------------------------------ OBJ-5.3-4: eddy currents, braking, terminal speed
  - id: Q-5.3-tube-why
    type: twotier
    objectives: [OBJ-5.3-4]
    qualitative: true
    prompt: >-
      מגנט חזק נופל בצינור נחושת אנכי לאט בהרבה מאשר בצינור פלסטיק באותו גודל. מה הסיבה?
    choices:
      - text: 'זרמים מושרים בדופן הצינור מפעילים על המגנט כוח שמתנגד לתנועה שלו.'
        correct: true
        feedback: נכון.
      - text: 'הנחושת נמשכת אל המגנט, והמגנט מתחכך בדפנות.'
        feedback: 'נחושת לא נמשכת למגנט במנוחה, והמגנט לא נצמד לדופן. מגנט שמחזיקים במנוחה בתוך הצינור לא מרגיש שום כוח מהנחושת.'
        misconception: MC-eddy-copper-magnetic
      - text: 'האוויר בצינור הנחושת דחוס יותר.'
        feedback: 'בשני הצינורות אותו אוויר באותו לחץ, ושניהם פתוחים בשני הקצוות.'
    reasonPrompt: איך הזרמים בדופן בולמים את המגנט?
    reasons:
      - text: 'מתחת למגנט השטף גדל והזרם דוחה אותו; מעליו השטף קטן והזרם מושך אותו. שני הכוחות פועלים למעלה.'
        correct: true
        feedback: 'נכון. כל טבעת של הצינור מתנהגת כמו הטבעת של איור 5.3א, וראו את שני הזרמים ההפוכים באיור 5.3ב, מקרוב.'
      - text: 'הזרמים מחממים את הצינור, והחום דוחף את המגנט למעלה.'
        feedback: 'החום הוא התוצאה, לא הסיבה: לאנרגיה שהמגנט מאבד יש לאן ללכת. הכוח בא מהשדה של הזרמים.'
      - text: 'הזרמים ממגנטים את הנחושת, והיא נדבקת למגנט.'
        feedback: 'הזרמים אכן יוצרים שדה, אבל הוא דוחה את המגנט מלמטה ומושך אותו מלמעלה, ונעלם כשהמגנט נעצר. שום דבר לא נדבק.'
        misconception: MC-eddy-copper-magnetic

  - id: Q-5.3-terminal-power
    type: numeric
    objectives: [OBJ-5.3-4]
    level: mid
    prompt: >-
      מגנט שמסתו $12\,\text{g}$ נופל בצינור אלומיניום אנכי במהירות קבועה של $3\,\text{cm/s}$. כמה חום מתפתח בצינור בכל שנייה? ענו בוואט.
    answer: 3.6e-3
    unit: W
    tolerance: 0.03
    correctFeedback: 'נכון. במהירות קבועה אנרגיית התנועה לא משתנה, וכל האנרגיה הפוטנציאלית שהמגנט מאבד הופכת לחום: $P = mgv = 0.012\cdot10\cdot0.03 = 3.6\cdot10^{-3}\,\text{W}$.'
    wrongFeedback: 'בכל שנייה המגנט יורד $v$ מטרים ומאבד $mgv$ ג׳אול של אנרגיה פוטנציאלית. לאן הם הולכים?'
    commonWrong:
      - value: 0.12
        feedback: 'זה המשקל, $mg$, בניוטון, וגם כוח הבלימה. ההספק הוא הכוח כפול המהירות.'
      - value: 3.6
        feedback: 'הצבתם את המסה בגרמים. $12\,\text{g} = 0.012\,\text{kg}$.'
      - value: 0.36
        feedback: 'הצבתם את המהירות בסנטימטרים לשנייה. $3\,\text{cm/s} = 0.03\,\text{m/s}$.'

  - id: Q-5.3-brake-half-speed
    type: numeric
    objectives: [OBJ-5.3-4]
    level: bagrut
    prompt: >-
      מגנט נופל בצינור נחושת אנכי, והמהירות הסופית שלו $5\,\text{cm/s}$. כוח הבלימה ביחס ישר למהירות, ואין חיכוך. מה גודל התאוצה של המגנט ברגע שמהירותו $2\,\text{cm/s}$? ענו ב-$\text{m/s}^2$.
    answer: 6
    unit: m/s²
    tolerance: 0.03
    correctFeedback: 'נכון. במהירות הסופית $kv_T = mg$, ולכן ב-$2\,\text{cm/s}$ כוח הבלימה הוא $\tfrac{2}{5}mg$. $ma = mg - \tfrac{2}{5}mg$, כלומר $a = \tfrac{3}{5}g = 6\,\text{m/s}^2$, למטה.'
    wrongFeedback: 'כתבו את החוק השני של ניוטון, $ma = mg - kv$, והשתמשו בכך ש-$kv_T = mg$ כדי לבטא את כוח הבלימה כחלק מהמשקל.'
    commonWrong:
      - value: 10
        feedback: 'זו נפילה חופשית. גם ב-$2\,\text{cm/s}$ יש כוח בלימה, $\tfrac25$ מהמשקל.'
      - value: 4
        feedback: 'זה כוח הבלימה מחולק במסה, $\tfrac25 g$. התאוצה נקבעת לפי הכוח **השקול**, המשקל פחות כוח הבלימה.'
      - value: 0
        feedback: 'תאוצה אפס יש רק במהירות הסופית, כשכוח הבלימה שווה למשקל. ב-$2\,\text{cm/s}$ הוא קטן יותר.'

  - id: Q-5.3-slotted-plate
    type: mc
    objectives: [OBJ-5.3-4]
    qualitative: true
    prompt: >-
      שני לוחות נחושת זהים בגודלם תלויים כמטוטלות, ומתנדנדים דרך הרווח שבין הקטבים של מגנט חזק. בלוח השני חתוכים חריצים ארוכים, כמו בשיניים של מסרק. מה תראו?
    choices:
      - text: 'הלוח השלם נעצר אחרי תנודות ספורות, והלוח המחורץ מתנדנד הרבה יותר זמן.'
        correct: true
        feedback: 'נכון. זרמי הערבולת זורמים בלוח במסלולים סגורים. החריצים קוטעים את המסלולים הגדולים, הזרמים נחלשים, והבלימה נחלשת.'
      - text: 'שני הלוחות נבלמים באותה מידה, כי זו אותה נחושת.'
        feedback: 'אותה נחושת, אבל לא אותם מסלולים לזרם. כמו בטבעת חתוכה, חריץ קוטע את הזרם.'
        misconception: MC-eddy-slots-no-effect
      - text: 'הלוח המחורץ נבלם מהר יותר, כי יש לו יותר שוליים.'
        feedback: 'השוליים לא בולמים. הבלימה באה מהזרמים, והחריצים מקצרים את המסלולים שלהם.'
      - text: 'אף לוח לא נבלם: נחושת לא מגנטית.'
        feedback: 'לוח נחושת שנע בשדה מגנטי נבלם בזרמי ערבולת, גם כשהוא לא נמשך למגנט במנוחה.'
        misconception: MC-eddy-copper-magnetic

  - id: Q-5.3-rank-tubes
    type: rank
    objectives: [OBJ-5.3-4]
    qualitative: true
    level: mid
    prompt: >-
      ארבעה צינורות אנכיים זהים בגודלם. בשלושה מהם נופל אותו מגנט חזק, ובצינור הרביעי, מנחושת, נופל גליל ברזל לא ממוגנט באותה מסה ובאותה צורה. האלומיניום מוליך חשמל פחות טוב מנחושת. סדרו לפי זמן הנפילה דרך הצינור, מהארוך ביותר לקצר ביותר.
    items:
      - { id: cu, label: 'מגנט בצינור נחושת' }
      - { id: al, label: 'מגנט בצינור אלומיניום' }
      - { id: pl, label: 'מגנט בצינור פלסטיק' }
      - { id: fe, label: 'גליל ברזל לא ממוגנט בצינור נחושת' }
    order: [cu, al, [pl, fe]]
    correctFeedback: 'נכון. בנחושת הזרמים המושרים חזקים יותר מאשר באלומיניום, והבלימה חזקה יותר. בפלסטיק אין זרמים, ולגליל ברזל לא ממוגנט אין שדה שישרה זרמים: שניהם נופלים נפילה חופשית.'
    wrongFeedback: 'מה מייצר את הבלימה? צריך גם שדה של מגנט שנע וגם דופן שמוליכה זרם. ככל שהדופן מוליכה טוב יותר, הזרמים חזקים יותר.'

  - id: Q-5.3-brake-stops
    type: mc
    objectives: [OBJ-5.3-4]
    qualitative: true
    prompt: >-
      ברכבת מהירה יש בלם מגנטי: לוחות מתכת שנעים בין מגנטים חזקים. האם הבלם הזה לבדו יכול לעצור את הרכבת עד לעצירה מלאה?
    choices:
      - text: 'לא: כוח הבלימה קטן ככל שהרכבת מאטה, ובמהירות אפס הוא נעלם. לעצירה מלאה צריך גם בלם חיכוך.'
        correct: true
        feedback: 'נכון. הזרמים המושרים ביחס ישר למהירות, וכך גם הכוח. הבלם מאט מצוין במהירות גבוהה, ונחלש לאט לאט.'
      - text: 'כן: המגנטים מפעילים כוח קבוע, עד שהרכבת נעצרת.'
        feedback: 'הכוח לא קבוע. הוא בא מזרמים מושרים, והם גדלים עם המהירות. במהירות קטנה הזרמים קטנים, והכוח קטן.'
        misconception: MC-eddy-brake-stops-completely
      - text: 'כן: המגנטים נצמדים ללוחות ומחזיקים את הרכבת במקום.'
        feedback: 'בלוחות שאינם מברזל אין משיכה למגנט במנוחה, והכוח נעלם כשהתנועה נעצרת.'
        misconception: MC-eddy-copper-magnetic
      - text: 'לא: בלם מגנטי רק מחמם את הלוחות ולא מאט.'
        feedback: 'החום הוא בדיוק האנרגיה שהרכבת מאבדת: הבלם הופך אנרגיית תנועה לחום, ולכן הוא מאט.'
