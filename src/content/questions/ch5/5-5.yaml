# Lesson 5.5 question bank. Strings may hold $inline$ / $$display$$ TeX and **bold**; they are
# rendered at build time. YAML note: plain and single-quoted strings keep backslashes literally.
# Every number below was recomputed with src/physics/fluxgraphs.ts (pieceEmfs, passEmf, passPushForce,
# passCharge) and src/physics/induction.ts (averageEmf, chargeThrough, fluxUniform).
# Sign convention, as in the lesson: the normal along the field, so the flux is positive and the positive
# sense of the emf and the current is clockwise when the field points into the page.

chapter: 5
questions:
  # ------------------------------------------------ OBJ-5.5-1: from Φ(t) to ε(t) and I(t)
  - id: Q-5.5-current-graph
    type: mc
    objectives: [OBJ-5.5-1]
    level: bagrut
    shuffle: true
    prompt: >-
      השטף דרך לולאה של כריכה אחת, שההתנגדות שלה $2\,\Omega$, משתנה כך: בין $t = 0$ ל-$t = 2\,\text{s}$ הוא עולה בקו ישר מאפס ל-$0.04\,\text{Wb}$; בין $2$ ל-$3\,\text{s}$ הוא קבוע; ובין $3$ ל-$4\,\text{s}$ הוא יורד בקו ישר חזרה לאפס. הזרם נספר חיובי בכיוון החיובי של הלולאה, כמו בשיעור. איזה מהתיאורים הבאים הוא גרף הזרם $I(t)$?
    choices:
      - text: '$I(t) = \begin{cases} -10\ \text{mA}, & 0<t<2\ \text{s} \\ 0, & 2<t<3\ \text{s} \\ +20\ \text{mA}, & 3<t<4\ \text{s} \end{cases}$'
        correct: true
        feedback: 'נכון. בעלייה $\varepsilon = -\dfrac{0.04}{2} = -0.02\,\text{V}$ ו-$I = -10\,\text{mA}$; בקטע הקבוע אפס; בירידה הגרף תלול פי 2, $\varepsilon = +0.04\,\text{V}$ ו-$I = +20\,\text{mA}$. בדיקה: השטחים $0.01\cdot2$ ו-$0.02\cdot1$ שווים, כי השטף חזר לאפס.'
      - text: '$I(t)$ עולה בקו ישר מאפס ל-$20\ \text{mA}$ בין $0$ ל-$2\ \text{s}$, נשאר $20\ \text{mA}$ עד $3\ \text{s}$, ויורד בקו ישר לאפס עד $4\ \text{s}$.'
        feedback: 'זה גרף השטף, מחולק ב-$R$. הזרם לא הולך אחרי השטף אלא אחרי **השיפוע** שלו: בקטע שבו השטף קבוע וגדול, אין זרם בכלל.'
        misconception: MC-graph-emf-peak-at-flux-peak
      - text: '$I(t) = \begin{cases} -10\ \text{mA}, & 0<t<2\ \text{s} \\ 0, & 2<t<3\ \text{s} \\ -20\ \text{mA}, & 3<t<4\ \text{s} \end{cases}$'
        feedback: 'הגדלים נכונים, אבל בירידה השיפוע שלילי, ולכן הכא"מ והזרם מחליפים סימן. אילו הזרם היה באותו כיוון בשני הקטעים, השטף לא היה יכול לחזור לאפס: $\Delta\Phi$ נטו היה שונה מאפס.'
      - text: '$I(t) = \begin{cases} -10\ \text{mA}, & 0<t<2\ \text{s} \\ 0, & 2<t<3\ \text{s} \\ +10\ \text{mA}, & 3<t<4\ \text{s} \end{cases}$'
        feedback: 'הסימנים נכונים, אבל אותו שינוי בשטף, $0.04\,\text{Wb}$, קורה בירידה בשנייה אחת ולא בשתיים. הגרף שם תלול פי 2, ולכן הזרם גדול פי 2.'

  - id: Q-5.5-peak-zero
    type: mc
    objectives: [OBJ-5.5-1]
    qualitative: true
    prompt: >-
      מגנט עובר במהירות קבועה דרך סליל, וגרף השטף דרך הסליל הוא "פעמון": הוא עולה, מגיע לשיא כשהמגנט באמצע הסליל, ויורד. מה הכא"מ בסליל ברגע שבו השטף בשיא?
    choices:
      - text: 'אפס.'
        correct: true
        feedback: 'נכון. בשיא המשיק לגרף השטף אופקי, השיפוע אפס, ולכן $\varepsilon = -N\,\Delta\Phi/\Delta t = 0$. ברגע הזה הכא"מ מחליף סימן.'
      - text: 'הכא"מ הגדול ביותר במעבר כולו.'
        feedback: 'הכא"מ תלוי בקצב השינוי של השטף, לא בגודל שלו. בשיא השטף לרגע לא משתנה. הכא"מ הגדול ביותר הוא במקומות שבהם הגרף הכי תלול, משני צדי השיא.'
        misconception: MC-graph-emf-peak-at-flux-peak
      - text: 'חצי מהכא"מ הגדול ביותר.'
        feedback: 'אין סיבה לחצי. גררו את הסמן באיור 5.5ב לשיא: המשיק שם אופקי, והכא"מ אפס.'
      - text: 'אי אפשר לדעת בלי לדעת את מספר הכריכות.'
        feedback: 'מספר הכריכות משנה את גודל הכא"מ בכל רגע, אבל אפס כפול $N$ הוא עדיין אפס. בשיא השיפוע אפס, לכל $N$.'

  - id: Q-5.5-zero-flux
    type: twotier
    objectives: [OBJ-5.5-1]
    qualitative: true
    prompt: >-
      השטף דרך לולאה יורד בקו ישר מ-$+5\,\text{mWb}$ ל-$-5\,\text{mWb}$ במשך $2\,\text{s}$ (השדה דרך הלולאה מתהפך). מה הכא"מ ברגע $t = 1\,\text{s}$, כשהשטף אפס?
    choices:
      - text: 'אותו כא"מ כמו בכל שאר הקטע, לא אפס.'
        correct: true
        feedback: נכון.
      - text: 'אפס, כי ברגע הזה אין שטף.'
        feedback: 'ברגע הזה אין שטף, אבל השטף עדיין משתנה, באותו קצב כמו לפני רגע ואחרי רגע. הכא"מ תלוי בקצב, לא בערך.'
        misconception: MC-graph-no-emf-at-zero-flux
      - text: 'הכא"מ הגדול ביותר בקטע, כי השטף עובר מחיובי לשלילי.'
        feedback: 'הגרף ישר, והשיפוע שלו זהה בכל נקודה. אין רגע מיוחד: הכא"מ קבוע לאורך כל הקטע.'
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'הכא"מ הוא מינוס השיפוע של $\Phi(t)$, והשיפוע של קו ישר זהה בכל נקודה: $-5\,\text{mWb/s}$.'
        correct: true
        feedback: 'נכון: $\varepsilon = -\dfrac{\Delta\Phi}{\Delta t} = -\dfrac{-10\cdot10^{-3}}{2} = +5\,\text{mV}$, בכל רגע של הקטע.'
      - text: 'הכא"מ פרופורציוני לשטף, והשטף ברגע הזה אפס.'
        feedback: 'חוק פאראדיי מדבר על השינוי בשטף, $\Delta\Phi/\Delta t$, לא על השטף עצמו.'
        misconception: MC-graph-no-emf-at-zero-flux
      - text: 'כשהשדה מתהפך, הזרם צריך להתהפך, ולכן הוא עובר דרך אפס.'
        feedback: 'הכיוון של הזרם נקבע לפי הסימן של קצב השינוי, והקצב לא משנה סימן בקטע הזה. הזרם זורם בכיוון אחד כל הזמן.'
        misconception: MC-graph-current-follows-field-sign

  - id: Q-5.5-slope-numeric
    type: numeric
    objectives: [OBJ-5.5-1]
    level: mid
    prompt: >-
      סליל של $50$ כריכות מחובר לנגד, וההתנגדות הכוללת של המעגל $10\,\Omega$. השטף דרך כל כריכה יורד בקו ישר מ-$6\,\text{mWb}$ ל-$2\,\text{mWb}$ במשך $0.4\,\text{s}$. מה גודל הזרם המושרה? ענו באמפר.
    answer: 0.05
    unit: A
    tolerance: 0.03
    correctFeedback: 'נכון. $|\varepsilon| = N\dfrac{|\Delta\Phi|}{\Delta t} = 50\cdot\dfrac{4\cdot10^{-3}}{0.4} = 0.5\,\text{V}$, ו-$I = \dfrac{0.5}{10} = 0.05\,\text{A}$.'
    wrongFeedback: 'מצאו קודם את השינוי בשטף, $\Delta\Phi$, ואת השיפוע $\Delta\Phi/\Delta t$. הכפילו ב-$N$ כדי לקבל את הכא"מ, וחלקו ב-$R$.'
    commonWrong:
      - value: 0.001
        feedback: 'שכחתם את מספר הכריכות. כל כריכה תורמת כא"מ משלה, והם מצטרפים: $\varepsilon = N\,\Delta\Phi/\Delta t$.'
      - value: 0.075
        feedback: 'הצבתם את השטף ההתחלתי, $6\,\text{mWb}$, במקום השינוי בשטף. הכא"מ תלוי בשינוי, $6 - 2 = 4\,\text{mWb}$.'
        misconception: MC-graph-emf-peak-at-flux-peak
      - value: 0.5
        feedback: 'זה הכא"מ, בוולט. הזרם הוא הכא"מ חלקי ההתנגדות, $I = \varepsilon/R$.'

  - id: Q-5.5-field-reverses
    type: mc
    objectives: [OBJ-5.5-1]
    qualitative: true
    prompt: >-
      לולאה קבועה נמצאת בשדה מגנטי אחיד שניצב למישור שלה. השדה יורד בקו ישר מ-$+0.3\,\text{T}$ ל-$-0.3\,\text{T}$ במשך $6\,\text{s}$: ברגע $t = 3\,\text{s}$ הוא מתאפס, ואחר כך הוא בכיוון ההפוך. מה קורה לזרם המושרה ברגע $t = 3\,\text{s}$?
    choices:
      - text: 'שום דבר: הוא ממשיך לזרום באותו גודל ובאותו כיוון.'
        correct: true
        feedback: 'נכון. $\Phi = BA$ משתנה בקו ישר לאורך כל ששת השניות, ולכן השיפוע, הכא"מ והזרם קבועים, גם כשהשדה עובר דרך אפס.'
      - text: 'הזרם מחליף כיוון, כי השדה מחליף כיוון.'
        feedback: 'כיוון הזרם נקבע לפי הסימן של **השינוי** בשטף, לא לפי הכיוון של השדה. בדקו עם חוק לנץ: לפני $t = 3\,\text{s}$ השדה בכיוון הראשון נחלש, והזרם יוצר שדה בכיוון הראשון כדי "לעזור" לו. אחרי $t = 3\,\text{s}$ השדה בכיוון השני מתחזק, והזרם יוצר שדה נגדו, כלומר שוב בכיוון הראשון. אותו כיוון של שדה מושרה, ולכן אותו כיוון של זרם.'
        misconception: MC-graph-current-follows-field-sign
      - text: 'הזרם מתאפס לרגע, כי אין שדה.'
        feedback: 'אין שדה ברגע הזה, אבל השדה משתנה באותו קצב כמו תמיד. הכא"מ תלוי בקצב.'
        misconception: MC-graph-no-emf-at-zero-flux
      - text: 'הזרם הכי גדול, כי השדה משתנה הכי מהר כשהוא עובר דרך אפס.'
        feedback: 'הגרף של השדה ישר, ולכן הוא משתנה באותו קצב בכל רגע. אין רגע שבו הוא משתנה מהר יותר.'

  - id: Q-5.5-field-numeric
    type: numeric
    objectives: [OBJ-5.5-1]
    level: mid
    prompt: >-
      סליל קבוע של $100$ כריכות, ששטח כל כריכה $4\,\text{cm}^2$, ניצב לשדה מגנטי אחיד. השדה עולה בקו ישר מאפס ל-$0.5\,\text{T}$ במשך $0.2\,\text{s}$. ההתנגדות הכוללת של המעגל $5\,\Omega$. מה גודל הזרם המושרה? ענו באמפר.
    answer: 0.02
    unit: A
    tolerance: 0.03
    correctFeedback: 'נכון. $|\varepsilon| = NA\dfrac{\Delta B}{\Delta t} = 100\cdot4\cdot10^{-4}\cdot\dfrac{0.5}{0.2} = 0.1\,\text{V}$, ו-$I = \dfrac{0.1}{5} = 0.02\,\text{A}$.'
    wrongFeedback: 'בלולאה קבועה $\Phi = BA$, ולכן $\varepsilon = -NA\,\Delta B/\Delta t$. המירו את השטח למטרים רבועים, וחלקו ב-$R$.'
    commonWrong:
      - value: 200
        feedback: 'שכחתם להמיר את השטח: $4\,\text{cm}^2 = 4\cdot10^{-4}\,\text{m}^2$.'
      - value: 0.0002
        feedback: 'שכחתם את מספר הכריכות, $N = 100$.'
      - value: 0.1
        feedback: 'זה הכא"מ, בוולט. הזרם הוא $I = \varepsilon/R$.'

  # ------------------------------------------------ OBJ-5.5-2: a loop through a strip of field
  - id: Q-5.5-strip-inside
    type: mc
    objectives: [OBJ-5.5-2]
    qualitative: true
    prompt: >-
      לולאה סגורה נדחפת במהירות קבועה דרך רצועה רחבה של שדה מגנטי אחיד. ברגע מסוים הלולאה כולה בתוך השדה, והיא ממשיכה לנוע. מה הזרם בלולאה ברגע הזה?
    choices:
      - text: 'אין זרם.'
        correct: true
        feedback: 'נכון. כשהלולאה כולה בשדה אחיד, השטח שבתוך השדה לא משתנה, והשטף קבוע. בלי שינוי בשטף אין כא"מ. בשתי הצלעות הניצבות לתנועה נוצרים כא"מים שווים שמבטלים זה את זה.'
      - text: 'זורם זרם קבוע, כי הלולאה נעה בתוך השדה.'
        feedback: 'תנועה בתוך שדה לא מספיקה: צריך שינוי בשטף. עצרו את הזמן באיור 5.5א כשהלולאה בפנים, וקראו את הזרם.'
        misconception: MC-strip-current-inside-field
      - text: 'הזרם הגדול ביותר במעבר כולו, כי כל הלולאה בתוך השדה.'
        feedback: 'כשכל הלולאה בשדה השטף אכן הכי גדול, אבל הוא לא משתנה. הזרם תלוי בקצב השינוי של השטף.'
        misconception: MC-strip-current-inside-field
      - text: 'זה תלוי במהירות: במהירות גדולה מספיק יזרום זרם.'
        feedback: 'בכל מהירות השטף קבוע כל עוד הלולאה כולה בשדה. מהירות גדולה יותר מקצרת את הזמן שבו הלולאה בפנים, אבל לא יוצרת שם זרם.'

  - id: Q-5.5-strip-direction
    type: twotier
    objectives: [OBJ-5.5-2]
    qualitative: true
    prompt: >-
      לולאה נעה ימינה במהירות קבועה ועוברת דרך רצועה של שדה מגנטי אחיד **לתוך הדף** (⊗). מה כיוון הזרם המושרה בלולאה, כשמסתכלים על הדף, בזמן הכניסה לשדה ובזמן היציאה ממנו?
    choices:
      - text: 'בכניסה נגד כיוון השעון, וביציאה בכיוון השעון.'
        correct: true
        feedback: נכון.
      - text: 'בשני המקרים נגד כיוון השעון.'
        feedback: 'הכניסה נכונה, אבל ביציאה השטף **קטן**, והזרם מתנגד לשינוי ההפוך. הזרם מתהפך.'
        misconception: MC-strip-same-direction-out
      - text: 'בכניסה בכיוון השעון, וביציאה נגד כיוון השעון.'
        feedback: 'הזרם צריך להתנגד לשינוי. בכניסה השטף לתוך הדף גדל, ולכן הזרם יוצר שדה **החוצה** מהדף בתוך הלולאה: לפי כלל יד ימין, נגד כיוון השעון.'
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'בכניסה השטף לתוך הדף גדל, וביציאה הוא קטן. השיפוע של $\Phi(t)$ מחליף סימן, ולכן הזרם מתהפך; ובכל שלב הוא מתנגד לשינוי, לפי חוק לנץ.'
        correct: true
        feedback: 'נכון. גרף השטף עולה, נשאר ויורד, וגרף הזרם הוא מדרגה בכיוון אחד, אפס ומדרגה בכיוון השני.'
      - text: 'הלולאה נעה כל הזמן ימינה ובאותו שדה, ולכן הזרם תמיד באותו כיוון.'
        feedback: 'מה שקובע הוא לא כיוון התנועה אלא האם השטף גדל או קטן. בכניסה הוא גדל, וביציאה הוא קטן.'
        misconception: MC-strip-same-direction-out
      - text: 'בכניסה הצלע הימנית בשדה, וביציאה השמאלית, ולכן הזרם מתהפך בגלל כלל כף יד ימין על הכוח.'
        feedback: 'אכן הצלע שבשדה מתחלפת, אבל כלל כף יד ימין על הכוח נותן את הכוח על זרם קיים, לא את כיוון הזרם המושרה. את כיוון הזרם נותן חוק לנץ, לפי השינוי בשטף.'

  - id: Q-5.5-strip-emf
    type: numeric
    objectives: [OBJ-5.5-2]
    level: basic
    prompt: >-
      לולאה מלבנית של כריכה אחת נכנסת במהירות $4\,\text{m/s}$ לשדה מגנטי אחיד של $0.6\,\text{T}$, ניצב למישור שלה. הצלע של הלולאה **לאורך** התנועה $30\,\text{cm}$, והצלע **הניצבת** לתנועה $10\,\text{cm}$. מה הכא"מ בזמן הכניסה? ענו בוולט.
    answer: 0.24
    unit: V
    tolerance: 0.03
    correctFeedback: 'נכון. $|\varepsilon| = Bhv = 0.6\cdot0.1\cdot4 = 0.24\,\text{V}$. הצלע שחוצה את גבול השדה היא $h = 10\,\text{cm}$; הצלע של $30\,\text{cm}$ קובעת רק כמה זמן נמשכת הכניסה, $0.3/4 = 0.075\,\text{s}$.'
    wrongFeedback: 'בכל שנייה נכנס לשדה שטח של $h\cdot v$, ולכן $|\varepsilon| = Bhv$, עם $h$ הצלע הניצבת לתנועה.'
    commonWrong:
      - value: 0.72
        feedback: 'הצבתם את הצלע שלאורך התנועה. בכל שנייה נכנס לשדה שטח של $h\cdot v$, כש-$h$ היא הצלע **הניצבת** לתנועה, $10\,\text{cm}$.'
      - value: 24
        feedback: 'שכחתם להמיר סנטימטרים למטרים: $h = 0.1\,\text{m}$.'
      - value: 0.018
        feedback: 'זה השטף המרבי, $BA = 0.6\cdot0.1\cdot0.3\,\text{Wb}$, לא הכא"מ. הכא"מ הוא קצב השינוי של השטף.'
        misconception: MC-graph-emf-peak-at-flux-peak

  - id: Q-5.5-strip-rank
    type: rank
    objectives: [OBJ-5.5-2]
    qualitative: true
    level: mid
    prompt: >-
      שלוש לולאות מלבניות של כריכה אחת, שלכל אחת מהן אותו שטח, $400\,\text{cm}^2$, נכנסות באותה מהירות לאותו שדה מגנטי אחיד. דרגו אותן לפי גודל הכא"מ בזמן הכניסה, מהגדול לקטן.
    items:
      - id: tall
        label: 'לולאה א: $10\,\text{cm}$ לאורך התנועה, $40\,\text{cm}$ בניצב לה'
      - id: square
        label: 'לולאה ב: $20\,\text{cm}$ על $20\,\text{cm}$'
      - id: long
        label: 'לולאה ג: $40\,\text{cm}$ לאורך התנועה, $10\,\text{cm}$ בניצב לה'
    order: [tall, square, long]
    correctFeedback: 'נכון. $|\varepsilon| = Bhv$ תלוי רק בצלע הניצבת לתנועה, $h$: $40$, $20$ ו-$10\,\text{cm}$. השטח השווה אומר רק שהשטף המרבי שווה: הלולאה הארוכה מגיעה אליו בזמן רב יותר, ולכן בכא"מ קטן יותר.'
    wrongFeedback: 'השטח של שלושתן שווה, ולכן כולן מגיעות לאותו שטף מרבי. מה קובע כמה **מהר** הן מגיעות אליו? בכל שנייה נכנס לשדה שטח של $h\cdot v$.'

  # ------------------------------------------------ OBJ-5.5-3: the push and its power
  - id: Q-5.5-push-when
    type: mc
    objectives: [OBJ-5.5-3]
    qualitative: true
    prompt: >-
      לולאה מונחת על שולחן חלק לגמרי (בלי חיכוך) ונדחפת דרך רצועה של שדה מגנטי אחיד, שרחבה ממנה. באילו שלבים צריך לדחוף אותה כדי שהמהירות שלה תישאר קבועה?
    choices:
      - text: 'רק בזמן הכניסה לשדה ובזמן היציאה ממנו.'
        correct: true
        feedback: 'נכון. רק בשלבים האלה זורם זרם, ועל הצלע שבתוך השדה פועל כוח מגנטי שבולם את הלולאה. כשהלולאה כולה בפנים, או מחוץ לשדה, אין זרם ואין כוח.'
      - text: 'אף פעם: אין חיכוך, ולכן גוף שנע ממשיך לנוע במהירות קבועה.'
        feedback: 'בלי חיכוך אכן לא צריך לדחוף מחוץ לשדה. אבל בכניסה וביציאה זורם בלולאה זרם, והשדה מפעיל על הצלע שבתוכו כוח נגד התנועה. בלי דחיפה הלולאה תאט.'
        misconception: MC-strip-no-push-needed
      - text: 'כל הזמן שהלולאה בתוך השדה, גם כשהיא כולה בפנים.'
        feedback: 'כשהלולאה כולה בפנים השטף קבוע, ואין זרם. על לולאה בלי זרם השדה לא מפעיל כוח.'
        misconception: MC-strip-current-inside-field
      - text: 'רק בזמן הכניסה. ביציאה השדה מושך את הלולאה החוצה, ולא צריך לדחוף.'
        feedback: 'ביציאה הזרם מתהפך, וגם הצלע שבשדה מתחלפת, ולכן הכוח המגנטי שוב נגד התנועה. בכל שלב הכוח מתנגד לשינוי, כמו שחוק לנץ אומר.'

  - id: Q-5.5-push-force
    type: numeric
    objectives: [OBJ-5.5-3]
    level: mid
    prompt: >-
      לולאה מלבנית של כריכה אחת, שההתנגדות שלה $0.6\,\Omega$, נדחפת במהירות קבועה של $3\,\text{m/s}$ לתוך שדה מגנטי אחיד של $0.5\,\text{T}$. הצלע הניצבת לתנועה $20\,\text{cm}$, והצלע לאורך התנועה $30\,\text{cm}$. אין חיכוך. איזה כוח צריך להפעיל על הלולאה בזמן הכניסה? ענו בניוטון.
    answer: 0.05
    unit: N
    tolerance: 0.03
    correctFeedback: 'נכון. $\varepsilon = Bhv = 0.3\,\text{V}$, $I = \dfrac{0.3}{0.6} = 0.5\,\text{A}$, ו-$F = BIh = 0.5\cdot0.5\cdot0.2 = 0.05\,\text{N}$. בדיקה: $Fv = 0.15\,\text{W} = I^2R$.'
    wrongFeedback: 'מצאו את הכא"מ, $Bhv$, ואת הזרם, $\varepsilon/R$. הכוח הבולם פועל על הצלע שבתוך השדה, באורך $h$: $F = BIh$.'
    commonWrong:
      - value: 0.075
        feedback: 'הצבתם בכוח את הצלע של $30\,\text{cm}$. הכוח שלא מתבטל פועל על הצלע שבתוך השדה וניצבת לתנועה, באורך $h = 20\,\text{cm}$.'
      - value: 0.1125
        feedback: 'הצבתם את הצלע של $30\,\text{cm}$ גם בכא"מ וגם בכוח. בשניהם הצלע הנכונה היא זו שחוצה את גבול השדה, הניצבת לתנועה: $h = 20\,\text{cm}$.'
      - value: 0.5
        feedback: 'זה הזרם, באמפר. הכוח הוא $F = BIh$.'
      - value: 0.15
        feedback: 'זה ההספק של הדחיפה, $Fv$, בוואט. חלקו במהירות כדי לקבל את הכוח.'

  - id: Q-5.5-power-double
    type: mc
    objectives: [OBJ-5.5-3, OBJ-5.5-4]
    level: bagrut
    prompt: >-
      לולאה נדחפת במהירות קבועה לתוך שדה מגנטי, פעם במהירות $v$ ופעם במהירות $2v$. מה היחס בין הפעם המהירה לפעם האיטית, בהספק של הדחיפה בזמן הכניסה, בחום שנוצר בכל הכניסה ובמטען שעובר?
    choices:
      - text: 'ההספק פי 4, החום פי 2, המטען שווה.'
        correct: true
        feedback: 'נכון. $F = B^2h^2v/R$ פי 2, ו-$P = Fv$ פי 4. הכניסה נמשכת חצי זמן, ולכן החום $Pt$ פי 2. המטען $Q = |\Delta\Phi|/R$ לא תלוי במהירות.'
      - text: 'ההספק פי 2, החום פי 2, המטען פי 2.'
        feedback: 'גם הכוח וגם המהירות גדלים פי 2, ולכן ההספק $Fv$ גדל פי 4. והמטען תלוי רק בשינוי השטף.'
        misconception: MC-charge-depends-on-speed
      - text: 'ההספק פי 4, החום פי 4, המטען פי 2.'
        feedback: 'ההספק אכן פי 4, אבל הוא פועל חצי זמן, ולכן החום רק פי 2. והמטען לא תלוי במהירות: הזרם כפול, אבל לחצי זמן.'
        misconception: MC-charge-depends-on-speed
      - text: 'ההספק פי 2, החום שווה, המטען שווה.'
        feedback: 'המטען אכן שווה, אבל החום לא: לדחוף מהר יותר דורש יותר עבודה, $W = Fw$ עם כוח כפול. וההספק $Fv$ גדל פי 4.'

  # ------------------------------------------------ OBJ-5.5-4: the charge
  - id: Q-5.5-charge-speed
    type: twotier
    objectives: [OBJ-5.5-4]
    qualitative: true
    prompt: >-
      סליל קטן, שמחובר למד מטען, נמצא בין קטבים של מגנט. מוציאים אותו פעם אחת בתנועה חדה, ופעם שנייה לאט, במשך כמה שניות. באיזו פעם מד המטען יראה מטען גדול יותר?
    choices:
      - text: 'אותו מטען בשתי הפעמים.'
        correct: true
        feedback: נכון.
      - text: 'בתנועה החדה.'
        feedback: 'בתנועה החדה הזרם אכן גדול יותר, אבל הוא זורם זמן קצר יותר. המטען הוא השטח מתחת לגרף הזרם, ולא הגובה שלו.'
        misconception: MC-charge-depends-on-speed
      - text: 'בתנועה האיטית.'
        feedback: 'בתנועה האיטית הזרם אכן זורם זמן רב יותר, אבל הוא קטן יותר באותו יחס. השטח מתחת לגרף הזרם לא משתנה.'
        misconception: MC-charge-depends-on-speed
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'בכל פרק זמן קצר עובר מטען $I\,\Delta t = -N\,\Delta\Phi/R$: הזמן מצטמצם, ולכן המטען הכולל תלוי רק בשינוי הכולל בשטף.'
        correct: true
        feedback: 'נכון: $Q = N|\Delta\Phi|/R$, ובשתי הפעמים השטף משתנה מ-$BA$ לאפס. זו הסיבה שאפשר למדוד שדה בעזרת מד מטען.'
      - text: 'המטען הוא הזרם כפול הזמן, והזרם תלוי במהירות.'
        feedback: 'הזרם תלוי במהירות, וגם הזמן תלוי בה, בכיוון ההפוך. במהירות כפולה הזרם כפול והזמן חצי, והמכפלה לא משתנה.'
        misconception: MC-charge-depends-on-speed
      - text: 'המטען נשמר, ולכן מד המטען תמיד מראה את אותו מספר.'
        feedback: 'שימור המטען אומר שמטען לא נוצר ולא נעלם. כאן השאלה היא כמה מטען **עבר** דרך המכשיר, וזה תלוי בשינוי השטף: בלי שינוי, לא עובר כלום.'

  - id: Q-5.5-net-zero
    type: mc
    objectives: [OBJ-5.5-4, OBJ-5.5-2]
    qualitative: true
    prompt: >-
      לולאה של $N$ כריכות, בשטח $A$ ובהתנגדות $R$, עוברת מעבר שלם דרך רצועה של שדה מגנטי אחיד $B$ שרחבה ממנה: מלפני הרצועה ועד אחריה. כמה מטען עבר בלולאה בסך הכול?
    choices:
      - text: 'אפס.'
        correct: true
        feedback: 'נכון. בסוף השטף חזר לאפס, ולכן $\Delta\Phi = 0$ ו-$Q = 0$. בכניסה עבר מטען $NBA/R$ בכיוון אחד, וביציאה אותו מטען בכיוון ההפוך.'
      - text: '$2NBA/R$'
        feedback: 'זה היה נכון אילו הזרם ביציאה היה באותו כיוון כמו בכניסה. אבל הוא מתהפך: השטח של המדרגה השנייה בגרף הזרם הוא מעל הציר, והשטח של הראשונה מתחתיו.'
        misconception: MC-strip-same-direction-out
      - text: '$NBA/R$'
        feedback: 'זה המטען בכניסה בלבד. ביציאה עובר אותו מטען בכיוון ההפוך, ולכן המטען נטו אפס.'
      - text: 'זה תלוי במהירות שבה הלולאה עוברת.'
        feedback: 'המטען תלוי רק בשינוי השטף בין ההתחלה לסוף, לא במהירות. כאן השינוי אפס.'
        misconception: MC-charge-depends-on-speed

  - id: Q-5.5-flip-charge
    type: numeric
    objectives: [OBJ-5.5-4]
    level: bagrut
    prompt: >-
      סליל של $500$ כריכות, ששטח כל כריכה $3\,\text{cm}^2$, נמצא בשדה מגנטי אחיד של $0.2\,\text{T}$ ומישורו ניצב לשדה. הסליל מחובר למד מטען, וההתנגדות הכוללת של המעגל $25\,\Omega$. מסובבים את הסליל חצי סיבוב, כך שהשדה עובר דרכו בכיוון ההפוך. כמה מטען עובר במעגל? ענו בקולון (למשל 3e-3).
    answer: 2.4e-3
    unit: C
    tolerance: 0.03
    correctFeedback: 'נכון. השטף דרך כל כריכה משתנה מ-$+BA$ ל-$-BA$, ולכן $|\Delta\Phi| = 2BA = 1.2\cdot10^{-4}\,\text{Wb}$, ו-$Q = \dfrac{N|\Delta\Phi|}{R} = \dfrac{500\cdot1.2\cdot10^{-4}}{25} = 2.4\cdot10^{-3}\,\text{C}$.'
    wrongFeedback: 'השתמשו ב-$Q = N|\Delta\Phi|/R$. מה השטף לפני הסיבוב ומה אחריו?'
    commonWrong:
      - value: 1.2e-3
        feedback: 'חשבתם כאילו השטף ירד לאפס. בחצי סיבוב השטף מתהפך, מ-$+BA$ ל-$-BA$: השינוי הוא $2BA$.'
      - value: 4.8e-6
        feedback: 'שכחתם את מספר הכריכות, $N = 500$.'
      - value: 24
        feedback: 'שכחתם להמיר את השטח: $3\,\text{cm}^2 = 3\cdot10^{-4}\,\text{m}^2$.'

  - id: Q-5.5-area-numeric
    type: numeric
    objectives: [OBJ-5.5-4, OBJ-5.5-1]
    level: bagrut
    prompt: >-
      גרף הזרם המושרה בסליל של $100$ כריכות הוא טרפז: הזרם עולה בקו ישר מאפס ל-$30\,\text{mA}$ במשך $0.1\,\text{s}$, נשאר $30\,\text{mA}$ במשך $0.2\,\text{s}$, ויורד בקו ישר חזרה לאפס במשך עוד $0.1\,\text{s}$. ההתנגדות הכוללת של המעגל $20\,\Omega$. בכמה השתנה השטף דרך כל כריכה? ענו בוובר (למשל 3e-3).
    answer: 1.8e-3
    unit: Wb
    tolerance: 0.03
    correctFeedback: 'נכון. המטען הוא שטח הטרפז: מלבן של $0.03\cdot0.2 = 6\cdot10^{-3}\,\text{C}$ ועוד שני משולשים של $\tfrac{1}{2}\cdot0.1\cdot0.03 = 1.5\cdot10^{-3}\,\text{C}$, יחד $Q = 9\cdot10^{-3}\,\text{C}$. מ-$Q = N|\Delta\Phi|/R$: $|\Delta\Phi| = \dfrac{QR}{N} = \dfrac{9\cdot10^{-3}\cdot20}{100} = 1.8\cdot10^{-3}\,\text{Wb}$.'
    wrongFeedback: 'מצאו קודם את המטען, כשטח מתחת לגרף הזרם (מלבן ושני משולשים). אחר כך בודדו את $\Delta\Phi$ מ-$Q = N|\Delta\Phi|/R$.'
    commonWrong:
      - value: 2.4e-3
        feedback: 'חישבתם את השטח כמלבן של $0.4\,\text{s}$ על $30\,\text{mA}$. בעלייה ובירידה הזרם קטן מ-$30\,\text{mA}$: שם השטח הוא משולש, חצי בסיס כפול גובה.'
      - value: 1.2e-3
        feedback: 'ספרתם רק את הקטע שבו הזרם קבוע. גם בזמן העלייה ובזמן הירידה עובר מטען: הוסיפו את שני המשולשים.'
      - value: 0.18
        feedback: 'זה השינוי בשטף של כל הסליל יחד, $N\,\Delta\Phi$. השאלה על כריכה אחת: חלקו ב-$N$.'
      - value: 0.045
        feedback: 'הכפלתם ב-$N$ וחילקתם ב-$R$ במקום להפך. מ-$Q = N\,\Delta\Phi/R$ מקבלים $\Delta\Phi = QR/N$.'
