# Lesson 3.2 question bank. Strings may hold $inline$ / $$display$$ TeX and **bold**; they are
# rendered at build time. YAML note: plain and single-quoted strings keep backslashes literally.
# Every number below was recomputed with src/physics/circuits.ts (currentOf, driftSpeed, COPPER_N)
# and E_CHARGE from src/physics/constants.ts.

chapter: 3
questions:
  # ------------------------------------------------ OBJ-3.2-1: I = Δq/Δt
  - id: Q-3.2-current-calc
    type: numeric
    objectives: [OBJ-3.2-1]
    prompt: >-
      דרך חתך של תיל עובר מטען של $90\,\text{C}$ בדקה אחת. מה עוצמת הזרם בתיל? ענו באמפר.
    answer: 1.5
    unit: A
    tolerance: 0.03
    correctFeedback: 'נכון. $I = \dfrac{\Delta q}{\Delta t} = \dfrac{90\,\text{C}}{60\,\text{s}} = 1.5\,\text{A}$.'
    wrongFeedback: 'זרם הוא מטען לשנייה: חלקו את המטען בזמן, אחרי שהמרתם את הזמן לשניות.'
    commonWrong:
      - value: 90
        feedback: 'חילקתם ב-1, כלומר בדקות. אמפר הוא קולון ל**שנייה**: דקה אחת היא $60\,\text{s}$.'
      - value: 5400
        feedback: 'כפלתם את המטען בזמן. הזרם הוא המטען **מחולק** בזמן.'

  - id: Q-3.2-charge-calc
    type: numeric
    objectives: [OBJ-3.2-1]
    prompt: >-
      בנורה זורם זרם של $0.5\,\text{A}$ במשך $2$ דקות. כמה מטען עבר בנורה? ענו בקולון.
    answer: 60
    unit: C
    tolerance: 0.03
    correctFeedback: 'נכון. $\Delta q = I\,\Delta t = 0.5\cdot120 = 60\,\text{C}$.'
    wrongFeedback: 'מ-$I = \Delta q/\Delta t$ נובע $\Delta q = I\,\Delta t$, עם הזמן בשניות.'
    commonWrong:
      - value: 1
        feedback: 'כפלתם בזמן בדקות. $2$ דקות הן $120\,\text{s}$.'
      - value: 240
        feedback: 'חילקתם את הזמן בזרם. המטען הוא זרם **כפול** זמן.'

  - id: Q-3.2-electron-count
    type: numeric
    objectives: [OBJ-3.2-1]
    level: mid
    prompt: >-
      בתיל זורם זרם של $2\,\text{A}$. כמה אלקטרונים עוברים דרך חתך של התיל בשנייה אחת? המטען היסודי הוא $e = 1.6\cdot10^{-19}\,\text{C}$.
    answer: 1.25e19
    unit: ''
    tolerance: 0.03
    correctFeedback: 'נכון. בשנייה עוברים $2\,\text{C}$, ומספר האלקטרונים הוא $N = \dfrac{q}{e} = \dfrac{2}{1.6\cdot10^{-19}} = 1.25\cdot10^{19}$.'
    wrongFeedback: 'מצאו קודם כמה קולון עוברים בשנייה, ואז כמה אלקטרונים יש בכמות המטען הזאת: $N = q/e$.'
    commonWrong:
      - value: 3.2e-19
        feedback: 'כפלתם את המטען ב-$e$. כדי לדעת **כמה** אלקטרונים יש ב-$2\,\text{C}$, מחלקים במטען של אלקטרון אחד.'

  - id: Q-3.2-ampere-meaning
    type: mc
    objectives: [OBJ-3.2-1]
    qualitative: true
    prompt: >-
      מה פירוש המשפט "בתיל זורם זרם של $1\,\text{A}$"?
    choices:
      - text: 'בכל שנייה עובר דרך כל חתך של התיל מטען של $1\,\text{C}$.'
        correct: true
        feedback: 'נכון. $1\,\text{A} = 1\,\text{C/s}$: זרם הוא קצב המעבר של מטען.'
      - text: 'בכל שנייה עובר דרך החתך אלקטרון אחד.'
        feedback: 'אלקטרון אחד נושא רק $1.6\cdot10^{-19}\,\text{C}$. באמפר אחד עוברים בכל שנייה יותר מ-$6\cdot10^{18}$ אלקטרונים.'
      - text: 'בתיל אגור מטען של $1\,\text{C}$.'
        feedback: 'זרם הוא לא כמות של מטען אגור, אלא קצב: כמה מטען עובר בכל שנייה. התיל עצמו נשאר ניטרלי.'
        misconception: MC-battery-stores-charge
      - text: 'האלקטרונים בתיל נעים במהירות של מטר לשנייה.'
        feedback: 'זרם הוא לא מהירות. באמפר אחד, בתיל נחושת רגיל, האלקטרונים נסחפים פחות מעשירית מילימטר בשנייה.'
        misconception: MC-electrons-fast

  # ------------------------------------------------ OBJ-3.2-2: conventional current
  - id: Q-3.2-conventional-direction
    type: mc
    objectives: [OBJ-3.2-2]
    qualitative: true
    prompt: >-
      במעגל של סוללה ונורה, מה הכיוון של הזרם המוסכם ושל תנועת האלקטרונים בתיל שמחוץ לסוללה?
    choices:
      - text: 'הזרם מההדק החיובי אל השלילי, והאלקטרונים בכיוון ההפוך, מהשלילי אל החיובי.'
        correct: true
        feedback: 'נכון. הזרם המוסכם מתואר בכיוון שבו היה נע מטען חיובי. האלקטרונים שליליים, ולכן נעים בכיוון ההפוך.'
      - text: 'גם הזרם וגם האלקטרונים מההדק השלילי אל החיובי.'
        feedback: 'זה כיוון התנועה של האלקטרונים, אבל הזרם המוסכם מוגדר בכיוון שבו היה נע מטען **חיובי**, ההפוך.'
        misconception: MC-electron-direction
      - text: 'גם הזרם וגם האלקטרונים מההדק החיובי אל השלילי.'
        feedback: 'האלקטרונים שליליים: השדה בתיל מכוון מהחיובי אל השלילי, והכוח על אלקטרון הפוך לשדה.'
      - text: 'הזרם זורם משני ההדקים אל הנורה, ונפגש בה.'
        feedback: 'הזרם זורם בלולאה אחת, באותו כיוון לאורך כל המעגל: נכנס לנורה מצד אחד ויוצא מהצד השני.'
        misconception: MC-current-used-up

  - id: Q-3.2-inside-battery
    type: twotier
    objectives: [OBJ-3.2-2]
    qualitative: true
    level: mid
    prompt: >-
      במעגל סגור של סוללה ונורה, מה כיוון הזרם המוסכם **בתוך** הסוללה?
    choices:
      - text: מההדק השלילי אל החיובי.
        correct: true
        feedback: נכון.
      - text: מההדק החיובי אל השלילי, כמו בתילים.
        feedback: 'בתילים, מחוץ לסוללה, הזרם זורם מהחיובי אל השלילי. אם גם בתוכה הוא היה זורם כך, שני הזרמים היו נפגשים בהדק השלילי.'
        misconception: MC-current-plus-to-minus-inside
      - text: בתוך הסוללה אין זרם.
        feedback: 'הזרם זורם בלולאה סגורה, והסוללה היא חלק מהלולאה. אותו זרם שעובר בנורה עובר גם בה.'
    reasonPrompt: למה?
    reasons:
      - text: 'הזרם זורם בלולאה, באותו כיוון לכל אורכה. בתוך הסוללה המטען "מורם" מהפוטנציאל הנמוך אל הגבוה.'
        correct: true
        feedback: 'נכון. זה מה שהסוללה עושה: התגובות הכימיות עושות עבודה ומעבירות מטען חיובי מההדק השלילי אל החיובי, נגד השדה.'
      - text: 'זרם תמיד זורם מפוטנציאל גבוה לנמוך.'
        feedback: 'זה נכון ברכיבים כמו נורה, שם השדה דוחף את המטען. בתוך הסוללה משהו אחר, התגובות הכימיות, דוחף אותו נגד השדה.'
        misconception: MC-current-plus-to-minus-inside
      - text: 'הסוללה אוגרת את המטען שחוזר אליה.'
        feedback: 'הסוללה לא אוגרת מטען: כמה שנכנס אליה בהדק אחד יוצא ממנה בהדק השני.'
        misconception: MC-battery-stores-charge

  - id: Q-3.2-electron-beam
    type: vector
    objectives: [OBJ-3.2-2]
    qualitative: true
    prompt: >-
      בשפופרת ריק, קרן אלקטרונים נעה מימין לשמאל (מערב). מה כיוון הזרם המוסכם של הקרן?
    answer: e
    correctFeedback: 'נכון. האלקטרונים שליליים, ולכן הזרם המוסכם הפוך לתנועתם: משמאל לימין.'
    wrongFeedback: 'הזרם המוסכם הוא הכיוון שבו היה נע מטען חיובי. מטען שלילי שנע לכיוון אחד שקול למטען חיובי שנע לכיוון ההפוך.'
    wrong:
      - dir: w
        feedback: 'זה כיוון התנועה של האלקטרונים. הזרם המוסכם הפוך לו, כי האלקטרונים שליליים.'
        misconception: MC-electron-direction

  # ------------------------------------------------ OBJ-3.2-3: drift, I = nqvA
  - id: Q-3.2-drift-calc
    type: numeric
    objectives: [OBJ-3.2-3]
    level: mid
    prompt: >-
      בתיל נחושת ששטח החתך שלו $2\,\text{mm}^2$ זורם זרם של $3\,\text{A}$. בנחושת $n = 8.5\cdot10^{28}\,\text{m}^{-3}$. מה מהירות הסחיפה של האלקטרונים? ענו במילימטר לשנייה.
    answer: 0.110
    unit: mm/s
    tolerance: 0.03
    correctFeedback: 'נכון. $v = \dfrac{I}{nqA} = \dfrac{3}{8.5\cdot10^{28}\cdot1.6\cdot10^{-19}\cdot2\cdot10^{-6}} = 1.10\cdot10^{-4}\,\text{m/s}$, כלומר $0.110\,\text{mm/s}$: עשירית מילימטר בשנייה.'
    wrongFeedback: 'מ-$I = nqvA$ נובע $v = I/(nqA)$. המירו את שטח החתך למטר רבוע, $1\,\text{mm}^2 = 10^{-6}\,\text{m}^2$, ואת התוצאה למילימטר לשנייה.'
    commonWrong:
      - value: 1.10e-4
        feedback: 'זו המהירות במטר לשנייה. השאלה מבקשת אותה במילימטר לשנייה: כפלו ב-1000.'
      - value: 1.10e-7
        feedback: 'הצבתם את שטח החתך ב-$\text{mm}^2$ במקום ב-$\text{m}^2$ (ואז המרתם למילימטר לשנייה). צריך $A = 2\cdot10^{-6}\,\text{m}^2$.'
    hints:
      - 'סדרו את $I = nqvA$ כך שהמהירות תהיה לבד באגף אחד.'

  - id: Q-3.2-why-instant
    type: twotier
    objectives: [OBJ-3.2-3]
    qualitative: true
    prompt: >-
      האלקטרונים בתיל של מנורה נסחפים פחות ממילימטר בשנייה. ובכל זאת, כשלוחצים על מפסק שנמצא שלושה מטרים מהמנורה, היא נדלקת מיד. איך זה ייתכן?
    choices:
      - text: 'האלקטרונים בכל המעגל, גם אלה שכבר נמצאים בחוט הלהט, מתחילים לנוע כמעט באותו רגע.'
        correct: true
        feedback: נכון.
      - text: 'האלקטרונים עוברים את שלושת המטרים במהירות עצומה, קרוב למהירות האור.'
        feedback: 'אילו כך, הזרם היה עצום. מהירות הסחיפה היא בערך עשירית מילימטר בשנייה: אלקטרון יעבור שלושה מטרים ביותר משמונה שעות.'
        misconception: MC-electrons-fast
      - text: 'היא לא נדלקת מיד: לוקח לה כמה שעות, אבל העין לא מבחינה בזה.'
        feedback: 'המנורה נדלקת באמת בתוך שבריר שנייה. מה שלוקח שעות הוא מסע של אלקטרון **אחד** לאורך התיל, והנורה לא צריכה לחכות לו.'
    reasonPrompt: מה הנימוק?
    reasons:
      - text: 'התילים מלאים באלקטרונים חופשיים מההתחלה, והשדה שמניע אותם נוצר בכל המעגל כמעט במהירות האור.'
        correct: true
        feedback: 'נכון. כמו צינור מלא מים: פותחים את הברז, והמים יוצאים בקצה השני מיד, אף שכל טיפה זזה לאט.'
      - text: 'הסוללה יורה אלקטרונים במהירות גבוהה אל התיל.'
        feedback: 'הסוללה לא יורה אלקטרונים. היא שומרת על הפרש פוטנציאלים, והאלקטרונים שכבר בתיל מתחילים לנוע.'
        misconception: MC-battery-stores-charge
      - text: 'האלקטרונים נעים מהר, אבל מתנגשים, ולכן הממוצע נמוך.'
        feedback: 'נכון שהאלקטרונים נעים באקראי מהר מאוד ומתנגשים, וזה מסביר למה הסחיפה איטית. אבל זה לא מסביר למה הנורה נדלקת מיד.'

  - id: Q-3.2-thick-wire
    type: mc
    objectives: [OBJ-3.2-3]
    qualitative: true
    level: mid
    prompt: >-
      שני תילי נחושת נושאים אותו זרם. הקוטר של התיל השני גדול פי 2 מהקוטר של הראשון. מה היחס בין מהירויות הסחיפה?
    choices:
      - text: 'בתיל העבה הסחיפה איטית פי 4.'
        correct: true
        feedback: 'נכון. קוטר כפול הוא שטח חתך גדול פי 4, ולפי $v = I/(nqA)$, באותו זרם המהירות קטנה פי 4. בתיל העבה יש פי 4 אלקטרונים בכל קטע, וכל אחד מהם צריך לזוז לאט יותר.'
      - text: 'בתיל העבה הסחיפה איטית פי 2.'
        feedback: 'המהירות תלויה בשטח החתך, לא בקוטר. קוטר כפול נותן שטח גדול פי $2^2 = 4$.'
      - text: 'המהירויות שוות, כי הזרם שווה.'
        feedback: 'זרם שווה אומר שעובר אותו מטען בשנייה. בתיל העבה יש יותר אלקטרונים שחולקים את המשימה, ולכן כל אחד זז לאט יותר.'
      - text: 'בתיל העבה הסחיפה מהירה פי 4, כי יש בו יותר מקום.'
        feedback: 'הפוך: באותו זרם, יותר אלקטרונים בכל קטע של התיל אומר שכל אחד מהם צריך לזוז פחות.'

  - id: Q-3.2-light-in-turn
    type: mc
    objectives: [OBJ-3.2-3]
    qualitative: true
    prompt: >-
      במעגל ארוך יש שתי נורות זהות בזו אחר זו: $L_1$ קרובה להדק החיובי של הסוללה, ו-$L_2$ רחוקה ממנו, בקצה השני של המעגל. סוגרים את המפסק. איזו נורה נדלקת קודם?
    choices:
      - text: 'שתיהן נדלקות כמעט באותו רגע.'
        correct: true
        feedback: 'נכון. השדה נוצר בכל המעגל כמעט במהירות האור, וכל האלקטרונים החופשיים, בשתי הנורות, מתחילים לנוע יחד.'
      - text: '$L_1$, כי הזרם מגיע אליה קודם.'
        feedback: 'הזרם לא "מגיע" לנורות אחת אחרי השנייה. האלקטרונים כבר נמצאים בכל חלקי המעגל, וכולם מתחילים לנוע יחד.'
        misconception: MC-bulbs-light-in-turn
      - text: '$L_2$, כי האלקטרונים יוצאים מההדק השלילי.'
        feedback: 'האלקטרונים לא יוצאים מהסוללה ונוסעים אל הנורות. הם כבר נמצאים בכל המעגל, ומתחילים לנוע יחד.'
        misconception: MC-bulbs-light-in-turn
      - text: 'אחרי כמה שעות, כשהאלקטרונים מגיעים אליהן.'
        feedback: 'הנורות לא מחכות לאלקטרונים מהסוללה. האלקטרונים שכבר בחוטי הלהט מתחילים לנוע מיד.'
        misconception: MC-electrons-fast

  # ------------------------------------------------ OBJ-3.2-4: current is not used up
  - id: Q-3.2-ammeters
    type: numeric
    objectives: [OBJ-3.2-4]
    prompt: >-
      במעגל של סוללה ונורה יש שני מדי זרם: $A_1$ על התיל שמוביל אל הנורה, ו-$A_2$ על התיל שיוצא ממנה. $A_1$ מראה $0.8\,\text{A}$. מה מראה $A_2$? ענו באמפר.
    answer: 0.8
    unit: A
    tolerance: 0.03
    correctFeedback: 'נכון. כמה מטען שנכנס לנורה בכל שנייה, אותו מטען יוצא ממנה. הזרם לא נצרך.'
    wrongFeedback: 'המטען נשמר. אם יצא מהנורה פחות מטען ממה שנכנס אליה, היא הייתה נטענת עוד ועוד.'
    commonWrong:
      - value: 0
        feedback: 'הנורה לא צורכת את כל הזרם. מה שהיא צורכת הוא אנרגיה. המטען ממשיך הלאה וחוזר אל הסוללה.'
        misconception: MC-current-used-up
      - value: 0.4
        feedback: 'הנורה לא צורכת חצי מהזרם. כל המטען שנכנס אליה יוצא ממנה, והזרם אחריה שווה לזרם לפניה.'
        misconception: MC-current-used-up

  - id: Q-3.2-what-bulb-uses
    type: twotier
    objectives: [OBJ-3.2-4]
    qualitative: true
    prompt: >-
      מה הנורה "צורכת" כשהיא דולקת?
    choices:
      - text: 'אנרגיה. הזרם שיוצא ממנה שווה לזרם שנכנס אליה.'
        correct: true
        feedback: נכון.
      - text: 'זרם. אחריה הזרם קטן יותר.'
        feedback: 'מדי זרם משני צדי הנורה מראים אותו דבר. הזרם לא נצרך.'
