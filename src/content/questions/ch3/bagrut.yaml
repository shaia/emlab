        commonWrong:
          - value: 4.86e-4
            feedback: 'המרתם את שטח החתך כמו אורך: $0.126\,\text{mm}^2 = 0.126\cdot10^{-3}\,\text{m}^2$. בשטח יש שני אורכים, ולכן $1\,\text{mm}^2 = (10^{-3}\,\text{m})^2 = 10^{-6}\,\text{m}^2$.'
