            feedback: 'השארתם את $L$ בסנטימטרים. השיפוע $0.039\,\Omega/\text{cm}$ קטן פי 100 מהשיפוע ביחידות $\Omega/\text{m}$: המירו את האורכים למטרים.'
          - value: 1.94e-6
            feedback: 'הצבתם את הקוטר במקום הרדיוס, $A = \pi d^2$. הרדיוס הוא חצי מהקוטר, ולכן $A = \pi\,(d/2)^2 = \pi d^2/4$, קטן פי 4.'
          - value: 5.62e-7
            feedback: 'חישבתם מנקודה אחת, המדידה של $100\,\text{cm}$: $\dfrac{RA}{L} = \dfrac{4.48\cdot1.26\cdot10^{-7}}{1.00}$. הקו לא עובר בראשית, ולכן המנה $R/L$ של נקודה אחת אינה השיפוע. את $\rho/A$ נותן השיפוע של קו המגמה.'
