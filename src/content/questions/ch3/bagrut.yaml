        correctFeedback: 'נכון. לפי $R = \rho\dfrac{L}{A}$, השיפוע של הגרף של $R$ כתלות ב-$L$ הוא $\dfrac{\rho}{A}$. משתי נקודות רחוקות על הקו: $\dfrac{\Delta R}{\Delta L} = \dfrac{4.46 - 1.36}{1.00 - 0.20} \approx 3.9\,\Omega/\text{m}$. שטח החתך הוא $A = \dfrac{\pi d^2}{4} = \dfrac{\pi\,(0.40\cdot10^{-3})^2}{4} \approx 1.26\cdot10^{-7}\,\text{m}^2$, ולכן $\rho = 3.9\cdot1.26\cdot10^{-7} \approx 4.9\cdot10^{-7}\,\Omega\cdot\text{m}$.'
