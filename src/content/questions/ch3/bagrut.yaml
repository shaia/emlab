      - label: א
        type: open
        points: 9
        level: mid
        objectives: [OBJ-3.3-1, OBJ-0.4-2]
        prompt: >-
          (1) חשבו את ההתנגדות $R$ של קטע התיל שבין התפסים בכל אחת מהמדידות.

          (2) סרטטו דיאגרמת פיזור של ההתנגדות $R$ כתלות במרחק $L$ בין התפסים, והוסיפו לה את הישר המתאים לה ביותר
          (קו מגמה).
        hints:
          - 'ההתנגדות היא היחס בין המתח על הקטע לזרם שעובר בו, $R = V/I$.'
          - 'שימו את $L$ על הציר האופקי ואת $R$ על הציר האנכי, והתחילו את שני הצירים מאפס, כדי שתראו איפה הקו חותך את הציר האנכי.'
        solution:
          - { kind: formula, text: '$R = \dfrac{V}{I}$. לפי $R = \rho\dfrac{L}{A}$, ההתנגדות של קטע תיל אחיד גדלה באופן קווי עם האורך שלו, ולכן מעבירים קו ישר.' }
          - { kind: substitution, text: 'במדידה הראשונה $R = \dfrac{0.56\,\text{V}}{0.406\,\text{A}} \approx 1.38\,\Omega$. כך מתקבלות, מ-$20\,\text{cm}$ עד $100\,\text{cm}$, ההתנגדויות $1.38$, $2.13$, $2.90$, $3.67$ ו-$4.48\,\Omega$.' }
          - { kind: manipulation, text: 'הציר האופקי מ-0 עד $100\,\text{cm}$, והציר האנכי מ-0 עד $5\,\Omega$. מסמנים את חמש הנקודות: הן כמעט על קו ישר. הקו המתאים להן ביותר הוא $R = 3.87\,L + 0.59$ (עם $L$ במטרים ו-$R$ באוהם). הוא עובר ליד $(20\,\text{cm},\ 1.36\,\Omega)$ וליד $(100\,\text{cm},\ 4.46\,\Omega)$, והנקודות קרובות אליו משני צדדיו.' }
          - { kind: result, text: 'דיאגרמת פיזור של חמש נקודות, וקו מגמה ישר עם שיפוע חיובי שאינו עובר בראשית: הוא חותך את ציר ההתנגדות בערך ב-$0.59\,\Omega$.' }
        rubric:
          - text: חישבתי $R = V/I$ בכל מדידה, וקיבלתי ערכים מ-$1.38\,\Omega$ עד $4.48\,\Omega$.
          - text: שמתי $L$ על הציר האופקי ו-$R$ על הציר האנכי, וכתבתי ליד כל ציר את הגודל ואת היחידות.
          - text: בחרתי קנה מידה אחיד, ששני הצירים בו מתחילים מאפס, וסימנתי נכון את חמש הנקודות.
          - text: העברתי קו ישר אחד (לא קו שבור בין הנקודות), עם נקודות משני צדדיו, והמשכתי אותו עד הציר האנכי.

