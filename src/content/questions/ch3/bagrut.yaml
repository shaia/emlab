          $\rho = \dfrac{RA}{L}$.

          (1) חשבו את הערך שהוא יקבל, והשוו אותו לתוצאה של סעיף ב.

          (2) הסבירו למה הערך שלו גדול מדי, ולמה השיפוע של קו המגמה נותן את ההתנגדות הסגולית של התיל עצמו.
        hints:
          - 'לפי סעיף ג, ההתנגדות שנמדדה היא סכום של שני חלקים, ורק אחד מהם תלוי ב-$L$. מה קורה למנה $R/L$ בגלל החלק השני?'
        solution:
          - { kind: formula, text: 'ההתנגדות שנמדדת היא $R = \rho\dfrac{L}{A} + R_c$, כאשר $R_c$ ההתנגדות של המגעים מסעיף ג. לכן $\dfrac{RA}{L} = \rho + \dfrac{R_cA}{L}$.' }
          - { kind: substitution, text: '$\dfrac{RA}{L} = \dfrac{1.38\,\Omega\cdot1.26\cdot10^{-7}\,\text{m}^2}{0.20\,\text{m}} \approx 8.7\cdot10^{-7}\,\Omega\cdot\text{m}$, פי 1.8 בערך מ-$4.9\cdot10^{-7}\,\Omega\cdot\text{m}$, הערך שמצאנו מהשיפוע.' }
          - { kind: manipulation, text: 'התוספת היא $\dfrac{R_cA}{L} = \dfrac{0.59\cdot1.26\cdot10^{-7}}{0.20} \approx 3.7\cdot10^{-7}\,\Omega\cdot\text{m}$, וזה ההפרש בין שני הערכים. בקטע קצר ההתנגדות של המגעים היא חלק גדול מההתנגדות שנמדדת. גם במדידה של $100\,\text{cm}$ היא מגדילה את התוצאה בכ-15%.' }
          - { kind: manipulation, text: 'בגרף, המגעים מוסיפים אותה התנגדות לכל הנקודות: הם מזיזים את הקו כולו למעלה, ואינם משנים את השיפוע. השיפוע, $\Delta R/\Delta L$, תלוי רק בהפרשים בין המדידות, ובהפרש $R_c$ מצטמצם.' }
          - { kind: result, text: 'הוא יקבל כ-$8.7\cdot10^{-7}\,\Omega\cdot\text{m}$, פי 1.8 בערך מהערך של סעיף ב. המנה $R/L$ של מדידה אחת כוללת גם את ההתנגדות של המגעים, ובקטע קצר היא חלק גדול מההתנגדות. השיפוע לא מושפע מהתנגדות קבועה שמתווספת לכל המדידות, ולכן הוא נותן את $\rho/A$ של התיל עצמו.' }
        rubric:
          - text: חישבתי את $RA/L$ במדידה של $20\,\text{cm}$, וקיבלתי כ-$8.7\cdot10^{-7}\,\Omega\cdot\text{m}$, גדול בהרבה מהתוצאה של סעיף ב.
          - text: הסברתי שההתנגדות שנמדדה כוללת גם את ההתנגדות של המגעים, ולכן $R/L$ גדול מ-$\rho/A$, ובמיוחד בקטע קצר.
          - text: הסברתי שהתוספת קבועה ומזיזה את הקו למעלה בלי לשנות את השיפוע, ולכן השיפוע נותן את $\rho/A$ של התיל.
