# Lesson 3.1 question bank. Strings may hold $inline$ / $$display$$ TeX and **bold**; they are
# rendered at build time. YAML note: plain and single-quoted strings keep backslashes literally.
# Every potential below was recomputed with src/physics/circuits.ts (solveCircuit) on the circuit
# the question describes, and every energy as W = qV.

chapter: 3
questions:
  # ------------------------------------------------ OBJ-3.1-1: why charges move
  - id: Q-3.1-filament-field
    type: mc
    objectives: [OBJ-3.1-1]
    qualitative: true
    prompt: >-
      נורה אחת מונחת על השולחן, ונורה זהה מחוברת לסוללה במעגל סגור. מה נכון לגבי חוט הלהט שלהן?
    choices:
      - text: 'בנורה שעל השולחן כל חוט הלהט באותו פוטנציאל ואין בו שדה. בנורה שבמעגל יש הפרש פוטנציאלים בין קצות החוט, ולכן יש בו שדה שמניע את האלקטרונים.'
        correct: true
        feedback: 'נכון. חוט הלהט שעל השולחן הוא מוליך בשיווי משקל (שיעור 1.9). הסוללה מחזיקה את שני הקצוות של החוט שבמעגל בפוטנציאלים שונים, וזה מה שמוציא אותו משיווי משקל.'
      - text: 'בנורה שעל השולחן אין אלקטרונים חופשיים, ובנורה שבמעגל הסוללה מכניסה אותם לחוט.'
        feedback: 'בכל מתכת יש אלקטרונים חופשיים, גם בנורה שעל השולחן. הם נעים שם באקראי, בלי תנועה מסודרת. הסוללה לא מכניסה אלקטרונים: היא יוצרת הפרש פוטנציאלים.'
        misconception: MC-battery-stores-charge
      - text: 'בשני החוטים יש שדה חשמלי, כי שניהם עשויים ממתכת שמוליכה.'
        feedback: 'במוליך בשיווי משקל השדה בפנים הוא אפס (שיעור 1.9). שדה בתוך מוליך יש רק כשמשהו מחזיק את קצותיו בפוטנציאלים שונים.'
      - text: 'בשני החוטים אין שדה. בנורה שבמעגל המתח זורם לתוך החוט ומחמם אותו.'
        feedback: 'מתח לא זורם. מתח הוא הפרש פוטנציאלים בין שתי נקודות, וכשיש מתח בין קצות החוט יש בו שדה. מה שזורם הוא מטען.'
        misconception: MC-voltage-flows

  - id: Q-3.1-why-move
    type: twotier
    objectives: [OBJ-3.1-1]
    qualitative: true
    prompt: >-
      סוגרים מפסק במעגל של סוללה ונורה. מה גורם לאלקטרונים החופשיים בחוט הלהט לנוע?
    choices:
      - text: שדה חשמלי בתוך חוט הלהט.
        correct: true
        feedback: נכון. השדה מפעיל כוח על כל אלקטרון חופשי בחוט.
      - text: אלקטרונים חדשים שיוצאים מהסוללה ודוחפים אותם.
        feedback: 'הסוללה לא שולחת אלקטרונים משלה. האלקטרונים שנעים בחוט הלהט היו שם מההתחלה, וכולם מתחילים לנוע כמעט באותו רגע.'
        misconception: MC-battery-stores-charge
      - text: המתח שזורם מהסוללה לתוך החוט.
        feedback: 'מתח לא זורם. הוא הפרש פוטנציאלים בין שתי נקודות, והשדה שהוא יוצר הוא שמניע את המטען.'
        misconception: MC-voltage-flows
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: 'הסוללה יוצרת הפרש פוטנציאלים בין שני הקצוות של חוט הלהט, ולכן יש בו שדה חשמלי.'
        correct: true
        feedback: 'נכון. כשבין שתי נקודות יש הפרש פוטנציאלים, יש ביניהן שדה (שיעור 2.3), והוא מכוון מהפוטנציאל הגבוה לנמוך.'
      - text: הסוללה מלאה במטען, והוא נשפך החוצה דרך התילים.
        feedback: 'הסוללה אינה מיכל של מטען. כמה מטען שיוצא מהדק אחד, אותו מטען בדיוק נכנס בהדק השני.'
        misconception: MC-battery-stores-charge
      - text: 'האלקטרונים נמשכים אל האור של הנורה.'
        feedback: 'האור הוא תוצאה של התנועה, לא הסיבה שלה: החוט מתחמם ופולט אור כי האלקטרונים מתנגשים בו בזמן שהם נעים.'

  - id: Q-3.1-after-open
    type: mc
    objectives: [OBJ-3.1-1]
    qualitative: true
    level: mid
    prompt: >-
      במעגל של סוללה ונורה, המפסק נמצא על התיל שבין ההדק החיובי לנורה. פותחים את המפסק. מה קורה בחוט הלהט, שבריר שנייה אחר כך?
    choices:
      - text: 'המטען בחוט מסתדר עד שכל החוט באותו פוטנציאל, השדה בתוכו נעלם, והתנועה המסודרת נפסקת.'
        correct: true
        feedback: 'נכון. החוט נשאר מחובר רק לצד אחד של המעגל, וחוזר להיות מוליך בשיווי משקל. זה קורה תוך זמן קצר מאוד.'
      - text: 'האלקטרונים ממשיכים לנוע מכוח ההתמד עוד כמה שניות, והנורה דועכת לאט.'
        feedback: 'אלקטרון בחוט מתנגש ביונים של המתכת פעמים רבות מאוד בכל שנייה. בלי שדה שדוחף אותו שוב ושוב, התנועה המסודרת נעצרת כמעט מיד.'
      - text: 'בין קצות החוט נשאר מתח של הסוללה, אבל המטען לא יכול לעבור דרך המפסק.'
        feedback: 'כשהמפסק פתוח, חוט הלהט מחובר רק לצד השלילי של הסוללה, ולכן שני הקצוות שלו באותו פוטנציאל. המתח של הסוללה עובר כולו אל פני המפסק.'
      - text: 'הסוללה מאבדת את המתח שלה עד שסוגרים שוב.'
        feedback: 'הסוללה שומרת על המתח בין ההדקים גם כשהמעגל פתוח: סוללה במגירה עדיין מראה את המתח שכתוב עליה.'

  # ------------------------------------------------ OBJ-3.1-2: potentials and voltages
  - id: Q-3.1-open-switch-voltage
    type: numeric
    objectives: [OBJ-3.1-2]
    prompt: >-
      סוללה של $9\,\text{V}$, נורה ומפסק מחוברים במעגל אחד, בזה אחר זה. המפסק **פתוח**, והנורה כבויה. מחברים מד מתח בין שני הצדדים של המפסק: החוד האדום בצד שמחובר להדק החיובי, והשחור בצד השני. מה יראה מד המתח? ענו בוולט.
    answer: 9
    unit: V
    tolerance: 0.03
    correctFeedback: 'נכון. צד אחד של המפסק מחובר להדק החיובי, והצד השני (דרך הנורה) להדק השלילי. כל המתח של הסוללה, $9\,\text{V}$, נמצא על פני הנתק.'
    wrongFeedback: 'מצאו את הפוטנציאל של כל צד של המפסק: לאיזה הדק של הסוללה מחובר כל צד?'
    commonWrong:
      - value: 0
        feedback: 'אין זרם, אבל יש מתח. שני הצדדים של המפסק מחוברים להדקים שונים של הסוללה, ולכן הם בפוטנציאלים שונים.'
        misconception: MC-no-current-no-voltage
      - value: 4.5
        feedback: 'המתח לא מתחלק בין המפסק לנורה. כשאין זרם, שני הקצוות של הנורה באותו פוטנציאל, ולכן על הנורה אין מתח, וכל ה-$9\,\text{V}$ על המפסק.'

  - id: Q-3.1-wire-point
    type: numeric
    objectives: [OBJ-3.1-2]
    prompt: >-
      במעגל סגור יש סוללה של $12\,\text{V}$ ונורה. בוחרים את ההדק השלילי כנקודת הייחוס, $0\,\text{V}$. מה הפוטנציאל של נקודה על התיל שמחבר את ההדק החיובי אל הנורה, באמצע הדרך? ענו בוולט.
    answer: 12
    unit: V
    tolerance: 0.03
    correctFeedback: 'נכון. כל התיל מחובר להדק החיובי בלי שום רכיב בדרך, ולכן כל הנקודות שלו באותו פוטנציאל, $12\,\text{V}$. הפוטנציאל יורד רק בנורה.'
    wrongFeedback: 'לאורך תיל נחושת מחבר הפוטנציאל כמעט לא משתנה. האם יש בין ההדק החיובי לנקודה הזאת רכיב שהפוטנציאל יורד בו?'
    commonWrong:
      - value: 6
        feedback: 'הפוטנציאל לא יורד בהדרגה לאורך התיל. בתיל נחושת מחבר השינוי לאורכו זניח, ולכן כולו בפוטנציאל של ההדק החיובי. הירידה כולה בנורה.'
        misconception: MC-wire-potential-drops
      - value: 0
        feedback: 'זה הפוטנציאל של התיל בצד השני של הנורה, זה שמוביל להדק השלילי. הנקודה כאן בצד של ההדק החיובי.'

  - id: Q-3.1-wire-voltage
    type: mc
    objectives: [OBJ-3.1-2]
    qualitative: true
    prompt: >-
      במעגל סגור של סוללה ($12\,\text{V}$) ונורה, מחברים מד מתח בין שתי נקודות על אותו תיל מחבר, במרחק $20$ סנטימטרים זו מזו. מה יראה מד המתח?
    choices:
      - text: 'כמעט אפס.'
        correct: true
        feedback: 'נכון. בתיל נחושת עבה צריך שדה קטן מאוד כדי להניע את המטען, ולכן כל הנקודות שלו כמעט באותו פוטנציאל. הפוטנציאל משתנה ברכיבים, לא בתילים.'
      - text: '$12\,\text{V}$, כי התיל מחובר לסוללה.'
        feedback: 'מד המתח מראה את הפרש הפוטנציאלים בין שתי הנקודות שהוא נוגע בהן, לא את המתח של הסוללה. שתי הנקודות כאן באותו פוטנציאל.'
        misconception: MC-voltage-flows
      - text: 'כמה וולטים, חלק ניכר מ-$12\,\text{V}$, ויותר ככל שמרחיקים את החודים זה מזה.'
        feedback: 'בתיל מחבר הפוטנציאל כמעט לא יורד לאורכו: ההפרש זעיר, הרבה פחות מוולט. כמעט כל הירידה של $12\,\text{V}$ היא בנורה.'
        misconception: MC-wire-potential-drops
      - text: '$6\,\text{V}$, חצי מהמתח של הסוללה.'
        feedback: 'אין שום רכיב בין שתי הנקודות. המתח עליהן אינו חלק מהמתח של הסוללה אלא כמעט אפס.'

  - id: Q-3.1-rank-potentials
    type: rank
    objectives: [OBJ-3.1-2]
    qualitative: true
    level: mid
    prompt: >-
      שתי נורות זהות, $L_1$ ו-$L_2$, מחוברות בזו אחר זו לסוללה של $12\,\text{V}$, במעגל סגור. סדרו את הנקודות לפי הפוטנציאל שלהן, מהגבוה לנמוך. נקודות בעלות אותו פוטנציאל שימו יחד.
    items:
      - { id: plus, label: ההדק החיובי של הסוללה }
      - { id: before, label: 'נקודה על התיל בין ההדק החיובי ל-$L_1$' }
      - { id: middle, label: 'נקודה על התיל בין $L_1$ ל-$L_2$' }
      - { id: minus, label: ההדק השלילי של הסוללה }
    order: [[plus, before], middle, minus]
    correctFeedback: 'נכון. ההדק החיובי והתיל שיוצא ממנו ב-$12\,\text{V}$. בכל נורה הפוטנציאל יורד ב-$6\,\text{V}$, ולכן בין הנורות $6\,\text{V}$, ואחרי $L_2$ חוזרים ל-$0\,\text{V}$.'
    wrongFeedback: 'עקבו אחרי הפוטנציאל לאורך המעגל: הוא לא משתנה לאורך תיל, ויורד בכל נורה. שתי נורות זהות מחלקות ביניהן את $12\,\text{V}$ שווה בשווה.'

  - id: Q-3.1-bulb-open
    type: twotier
    objectives: [OBJ-3.1-2]
    qualitative: true
    level: mid
    prompt: >-
      במעגל יש סוללה של $12\,\text{V}$, נורה ומפסק, במעגל אחד, בזה אחר זה. המפסק **פתוח**. מה המתח בין שני הקצוות של הנורה?
    choices:
      - text: $0$
        correct: true
        feedback: נכון. ועכשיו בדקו את הנימוק.
      - text: $12\,\text{V}$
        feedback: '$12\,\text{V}$ נמצאים על פני המפסק הפתוח. שני הקצוות של הנורה מחוברים זה לזה דרך חוט הלהט, ולצד אחד בלבד של הסוללה.'
      - text: $6\,\text{V}$
        feedback: 'המתח לא מתחלק בין המפסק לנורה. מצאו לאיזה הדק מחובר כל קצה של הנורה.'
    reasonPrompt: למה?
    reasons:
      - text: 'שני הקצוות של הנורה מחוברים, דרך חוט הלהט, רק לצד אחד של הסוללה. כל הנורה היא מוליך בשיווי משקל, באותו פוטנציאל.'
        correct: true
        feedback: 'נכון. התשובה אפס נובעת מהפוטנציאלים, לא מכך שהנורה כבויה.'
      - text: 'הנורה כבויה, ולכן אין עליה מתח.'
        feedback: 'התשובה נכונה, אבל הנימוק לא. על פני המפסק הפתוח אין זרם, ויש בדיוק $12\,\text{V}$. "אין זרם" לא אומר "אין מתח".'
        misconception: MC-no-current-no-voltage
      - text: 'המתח עדיין לא הגיע אל הנורה, כי המפסק עוצר אותו.'
        feedback: 'מתח לא זורם ולא נעצר. הוא הפרש פוטנציאלים בין שתי נקודות, והנימוק צריך לומר מה הפוטנציאל של כל קצה.'
        misconception: MC-voltage-flows

  # ------------------------------------------------ OBJ-3.1-3: energy, W = qV
  - id: Q-3.1-energy-per-charge
    type: numeric
    objectives: [OBJ-3.1-3]
    prompt: >-
      על נורה יש מתח של $12\,\text{V}$. בדקה אחת עובר בה מטען של $30\,\text{C}$. כמה אנרגיה מוסר המטען הזה לנורה? ענו בג'אול.
    answer: 360
    unit: J
    tolerance: 0.03
    correctFeedback: 'נכון. $W = qV = 30\cdot12 = 360\,\text{J}$. כל קולון שיורד $12\,\text{V}$ מוסר $12\,\text{J}$.'
    wrongFeedback: 'מתח הוא אנרגיה לכל קולון: $1\,\text{V} = 1\,\text{J/C}$. כפלו את המטען במתח.'
    commonWrong:
      - value: 2.5
        feedback: 'חילקתם את המטען במתח. האנרגיה היא **מכפלה**: $W = qV$.'
      - value: 6
        feedback: 'חילקתם גם בזמן, $360/60$. השאלה שואלת על האנרגיה הכוללת בדקה, $W = qV$, בלי לחלק בזמן.'

  - id: Q-3.1-two-bulbs-energy
    type: numeric
    objectives: [OBJ-3.1-3]
    level: mid
    prompt: >-
      שתי נורות זהות מחוברות בזו אחר זו לסוללה של $12\,\text{V}$. כמה אנרגיה מוסר לנורה **הראשונה** כל קולון שעובר בה? ענו בג'אול.
    answer: 6
    unit: J
    tolerance: 0.03
    correctFeedback: 'נכון. הפוטנציאל יורד $12\,\text{V}$ בסך הכול, בשתי מדרגות שוות של $6\,\text{V}$. בכל נורה קולון אחד מוסר $W = qV = 1\cdot6 = 6\,\text{J}$.'
    wrongFeedback: 'מצאו קודם את הירידה בפוטנציאל על פני נורה אחת, ואז $W = qV$ לקולון אחד.'
    commonWrong:
      - value: 12
        feedback: 'זו האנרגיה שקולון מוסר לשתי הנורות **יחד**. בכל נורה הוא יורד רק חצי מהדרך, $6\,\text{V}$.'
      - value: 24
        feedback: 'נתתם לכל נורה את כל $12\,\text{V}$ וחיברתם את שתיהן. אבל כל קולון מקבל בסוללה רק $12\,\text{J}$, ואינו יכול למסור יותר. הוא מוסר חצי מהם לכל נורה.'

  - id: Q-3.1-height-picture
    type: mc
    objectives: [OBJ-3.1-3]
    qualitative: true
    prompt: >-
      מתארים את הפוטנציאל לאורך מעגל של סוללה ונורה כ"גובה". מטען יוצא מההדק השלילי ועובר סיבוב שלם, עם כיוון הזרם. מה נכון?
    choices:
      - text: 'בסוללה הוא עולה, לאורך התילים הוא בגובה קבוע, בנורה הוא יורד, ובסוף הסיבוב הוא חוזר בדיוק לגובה שבו התחיל.'
        correct: true
        feedback: 'נכון. לכל נקודה יש פוטנציאל אחד (השדה משמר, שיעור 2.1), ולכן סיבוב שלם מחזיר לאותו גובה. האנרגיה שהמטען קיבל בסוללה נמסרה כולה בנורה.'
      - text: 'הוא יורד בסוללה ועולה בנורה, כי הנורה נותנת לו אנרגיה.'
        feedback: 'הפוך: הסוללה נותנת למטען אנרגיה (הוא "עולה" בה), והנורה מקבלת ממנו אנרגיה והופכת אותה לאור ולחום (הוא "יורד" בה).'
      - text: 'הוא עולה בסוללה ויורד בהדרגה לאורך כל המעגל, גם בתילים.'
        feedback: 'בתילים המחברים כמעט אין ירידה בפוטנציאל. כמעט כל הירידה היא בנורה.'
        misconception: MC-wire-potential-drops
      - text: 'בכל סיבוב הוא חוזר קצת יותר גבוה, כי הסוללה ממשיכה להרים אותו.'
        feedback: 'אם כך, לנקודה אחת היו כמה פוטנציאלים שונים. הסוללה מרימה אותו בדיוק כמה שהנורה מורידה, בכל סיבוב.'

  # ------------------------------------------------ OBJ-3.1-4: a closed path
  - id: Q-3.1-single-wire
    type: mc
    objectives: [OBJ-3.1-4]
    qualitative: true
    prompt: >-
      מחברים תיל אחד מההדק החיובי של סוללה אל אחד המגעים של נורה. המגע השני של הנורה לא מחובר לשום דבר. האם הנורה תדלק?
    choices:
      - text: 'לא. אין מסלול סגור, ושני הקצוות של חוט הלהט באותו פוטנציאל.'
        correct: true
        feedback: 'נכון. כל הנורה מחוברת להדק החיובי בלבד, ולכן כולה בפוטנציאל שלו. בלי מתח על חוט הלהט אין בו שדה, ואין זרם.'
      - text: 'כן, אבל חלש, כי רק תיל אחד מביא אליה חשמל.'
        feedback: 'אין "חצי זרם" בתיל אחד. כדי שיזרום זרם, המטען צריך מסלול סגור שחוזר אל ההדק השני של הסוללה.'
        misconception: MC-single-wire
      - text: 'כן, כי ההדק החיובי דוחף את הזרם אל הנורה.'
        feedback: 'זרם זורם רק כשיש מתח על חוט הלהט. כאן שני הקצוות שלו מחוברים לאותו הדק, ולכן הם באותו פוטנציאל.'
        misconception: MC-single-wire
      - text: 'רק אם הסוללה חזקה מספיק.'
        feedback: 'גם סוללה של אלף וולט לא תדליק נורה בתיל אחד: שני הקצוות של חוט הלהט עדיין יהיו באותו פוטנציאל.'

  - id: Q-3.1-which-light
    type: multi
    objectives: [OBJ-3.1-4]
    qualitative: true
    level: mid
    prompt: >-
      לנורה של פנס יש שני מגעים: הבסיס המתכתי המתוברג שבצד, והנקודה שבתחתית. חוט הלהט מחבר, בתוך הנורה, את שני המגעים. אילו מהחיבורים האלה ידליקו אותה? סמנו את כל התשובות הנכונות.
    choices:
      - text: 'הנקודה שבתחתית נוגעת בהדק החיובי, ותיל מחבר את הבסיס המתוברג אל ההדק השלילי.'
        correct: true
        feedback: 'נכון. המטען עובר מהדק להדק דרך חוט הלהט: מסלול סגור.'
      - text: 'תיל מחבר את הבסיס המתוברג אל ההדק החיובי, ותיל שני מחבר את הנקודה שבתחתית אל ההדק השלילי.'
        correct: true
        feedback: 'נכון. גם כאן כל מגע מחובר להדק אחר, ויש מסלול סגור דרך חוט הלהט.'
      - text: 'שני תילים, אחד מכל מגע, מחוברים שניהם אל ההדק החיובי.'
        feedback: 'שני המגעים באותו פוטנציאל, של ההדק החיובי. בלי מתח על חוט הלהט אין זרם, גם אם יש שני תילים.'
      - text: 'תיל אחד מחבר את הנקודה שבתחתית אל ההדק החיובי, והבסיס המתוברג לא נוגע בכלום.'
        feedback: 'זה תיל אחד בלבד. אין מסלול שחוזר אל ההדק השלילי.'
        misconception: MC-single-wire

  - id: Q-3.1-switch-side
    type: mc
    objectives: [OBJ-3.1-4]
    qualitative: true
    prompt: >-
      במעגל של סוללה ונורה, המפסק נמצא על התיל שמחבר את הנורה אל ההדק **השלילי**, כלומר "אחרי" הנורה. פותחים את המפסק. מה קורה?
    choices:
      - text: 'הנורה נכבית, בדיוק כמו אילו המפסק היה בצד החיובי.'
        correct: true
        feedback: 'נכון. נתק בכל מקום במעגל עוצר את הזרם בכל המעגל, לפני הנתק ואחריו.'
      - text: 'הנורה ממשיכה לדלוק, כי הזרם מגיע אליה מההדק החיובי לפני המפסק.'
        feedback: 'זרם זורם רק במסלול סגור. כשהמפסק פתוח, הנורה מחוברת רק להדק החיובי, ושני הקצוות שלה באותו פוטנציאל.'
        misconception: MC-switch-position
      - text: 'הנורה נחלשת לאט, עד שהמטען שכבר בתוכה נגמר.'
        feedback: 'שום מטען לא "נגמר" בנורה. בלי מסלול סגור אין בחוט הלהט שדה, והתנועה נעצרת כמעט מיד.'
        misconception: MC-battery-stores-charge
      - text: 'הנורה נכבית, אבל רק אחרי שהזרם שכבר יצא מהסוללה מגיע למפסק.'
        feedback: 'התנועה נעצרת בכל המעגל כמעט באותו רגע, כי השדה נעלם בכל המעגל בבת אחת. נראה בשיעור הבא כמה לאט האלקטרונים עצמם נעים.'
